# Batch 04: Nizar Qabbani lines supplied by Mahmoud, split into 2-6 word sentences, diacritized and
# parsed by Claude for review. Short credited quotations; still under copyright, so NOT covered by the
# CC BY-NC content license. Pausal rhyme endings are written in their connected (وصل) form.
- text: الصَّمْتُ فِي حَرَمِ الْجَمَالِ جَمَالُ
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة، وحُذف التنوين للقافية
  alts:
    - الصَّمْتُ فِي حَرَمِ الْجَمَالِ جَمَالٌ
  author: نزار قباني
  source: poetry
  level: 2
  notes: في البيت «جمالُ» بلا تنوين للقافية؛ أضفت «جمالٌ» بديلًا مقبولًا.
- text: حُرُوفُنَا فِي الْحُبِّ تَقْتُلُ حُبَّنَا
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  alts: []
  author: نزار قباني
  source: poetry
  level: 2
- text: إِنَّ الْحُرُوفَ تَمُوتُ حِينَ تُقَالُ
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «إنّ»
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل جر مضاف إليه
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
- text: مَا أَصْبَحَ الْإِنْسَانُ إِنْسَاناً
  irab:
    - نافية مبنية على السكون لا عمل لها
    - فعل ماضٍ ناقص مبني على الفتح
    - اسم «أصبح» مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر «أصبح» منصوب وعلامة نصبه تنوين الفتح
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
  notes: عجز البيت، وهو جواب «لولا» في الصدر (لولا المحبةُ في جوانحه)؛ الصدر وحده لا يستقل جملة.
- text: اعْتِيَادِي عَلَى غِيَابِكِ صَعْبٌ
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - حرف جر مبني على السكون المقدر على الألف
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الكسر في محل جر مضاف إليه
    - خبر مرفوع وعلامة رفعه تنوين الضم
  alts: []
  author: نزار قباني
  source: poetry
  level: 2
  notes: «اعتياد» همزته همزة وصل (لا «أعتياد»).
- text: وَاعْتِيَادِي عَلَى حُضُورِكِ أَصْعَبُ
  irab:
    - الواو عاطفة، و«اعتيادي» مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء مضاف إليه
    - حرف جر مبني على السكون المقدر على الألف
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على وزن «أفعل»
  alts: []
  author: نزار قباني
  source: poetry
  level: 2
  notes: في القصيدة «أصعبْ» بالسكون للوقف؛ التشكيل هنا بالوصل.
- text: إِنِّي عَشِقْتُكِ وَاتَّخَذْتُ قَرَارِي
  irab:
    - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسمها
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير في محل رفع فاعل، والكاف ضمير في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
    - الواو عاطفة، و«اتخذتُ» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
- text: أَنَا أَلْفُ أُحِبُّكِ
  irab:
    - ضمير منفصل مبني على السكون في محل رفع مبتدأ
    - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - جملة «أحبكِ» محكيّة في محل جر مضاف إليه
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
  notes: «أحبكِ» هنا كلمة محكية كأنها اسم (ألفُ «أحبكِ»)، فيبقى تشكيلها كما هو.
- text: فَابْتَعِدِي عَنِّي
  irab:
    - الفاء استئنافية، و«ابتعدي» فعل أمر مبني على حذف النون، والياء ضمير متصل في محل رفع فاعل
    - «عن» حرف جر، والياء ضمير متصل مبني على السكون في محل جر، والجار والمجرور متعلقان بـ«ابتعدي»
  alts: []
  author: نزار قباني
  source: poetry
  level: 2
- text: لَا أَمْلِكُ فِي الدُّنْيَا إِلَّا عَيْنَيْكِ
  irab:
    - نافية مبنية على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
    - أداة حصر لا عمل لها
    - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى، وحذفت النون للإضافة، والكاف ضمير متصل في محل جر مضاف إليه
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
  notes: من «فأنا لا أملكُ في الدنيا إلا عينيكِ وأحزاني» (٨ كلمات)، اختصرتها إلى ست.
- text: أَشْعَارُنَا أَكْبَرُ مِنْ أَشْعَارِنَا
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
    - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على وزن «أفعل»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  alts: []
  author: نزار قباني
  source: poetry
  level: 2
- text: فَمَا نَقُولُهُ لَيْسَ هُوَ الْحَصِيلَةَ
  irab:
    - الفاء استئنافية، و«ما» اسم موصول مبني على السكون في محل رفع مبتدأ
    - فعل مضارع مرفوع، والهاء ضمير متصل في محل نصب مفعول به، والفاعل ضمير مستتر تقديره نحن، والجملة صلة الموصول
    - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
    - ضمير فصل مبني على الفتح لا محل له من الإعراب
    - خبر «ليس» منصوب وعلامة نصبه الفتحة الظاهرة
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
  notes: في القصيدة «الحصيلهْ» بالسكون للوقف؛ التشكيل هنا بالوصل. «هو» ضمير فصل.
- text: إِنَّ الَّذِي يُقَالُ فِي الْخَفَاءِ أَدْمَى
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - اسم موصول مبني على السكون في محل نصب اسم «إنّ»
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - خبر «إنّ» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو ممنوع من الصرف على وزن «أفعل»
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
- text: وَالَّذِي يُقَالُ فِي الْعَلَنِ دَخِيلَةٌ
  irab:
    - الواو عاطفة، و«الذي» اسم موصول مبني على السكون في محل رفع مبتدأ
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - خبر مرفوع وعلامة رفعه تنوين الضم
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
  notes: في القصيدة «دخيلهْ» بالسكون للوقف؛ التشكيل هنا بالوصل. يجوز عطف «الذي» على اسم «إنّ» في الجملة السابقة، لكنها هنا جملة مستقلة.
- text: هَلْ تَسْمَحِينَ بِأَنْ أُحِبَّكِ؟
  irab:
    - حرف استفهام مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والياء ضمير متصل في محل رفع فاعل
    - الباء حرف جر، و«أن» حرف مصدري ونصب مبني على السكون
    - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا، والكاف ضمير متصل في محل نصب مفعول به، والمصدر المؤول في محل جر بالباء
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
- text: فَلَيْسَ فِي وُسْعِي أَنْ أَخْتَارَ غَيْرَكِ
  irab:
    - الفاء استئنافية، و«ليس» فعل ماضٍ ناقص مبني على الفتح
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه، وشبه الجملة في محل نصب خبر «ليس» مقدّم
    - حرف مصدري ونصب مبني على السكون
    - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، والمصدر المؤول في محل رفع اسم «ليس» مؤخر
  alts: []
  author: نزار قباني
  source: poetry
  level: 3
  notes: من «فليس في وسعي أن أختار غيركِ من نساء العالمين» (٩ كلمات)، اختصرتها إلى ست.
