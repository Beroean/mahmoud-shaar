# Batch 07 (Quran): 25 candidates of mixed length (8 short, 8 medium, 9 long), drafted by Claude for review.
#
# Source: verbatim Tanzil "simple" text (CC BY 3.0, tanzil.net), full ayahs or contiguous excerpts of
# one ayah, each checked with tools/shakkil/quran-excerpt.ts. Ayahs already used in puzzles were left
# out, and so were excerpts whose recitation spellings the checker rejects (نون بلا سكون قبل الإدغام)
# or that carry an idgham shadda across words (خَيْرٌ لَّكَ، غَفُورٌ رَّحِيمٌ), which a player can't guess.
#
# The i'rab is Claude's; please check it, especially the items marked in notes.

# ── Short (2–4 words) ───────────────────────────────────────────────────────────────────────────
- text: وَبِالْوَالِدَيْنِ إِحْسَانًا
  source: quran
  ref: سورة الإسراء، الآية ٢٣
  level: 1
  notes: يجوز إعراب «إحسانًا» مفعولًا به لفعل محذوف (أي وأوصى بالوالدين إحسانًا).
  irab:
    - الواو حرف عطف، والباء حرف جر، و«الوالدين» اسم مجرور وعلامة جره الياء لأنه مثنى
    - مفعول مطلق منصوب لفعل محذوف تقديره «وأحسنوا»، وعلامة نصبه تنوين الفتح
- text: فَاللَّهُ خَيْرٌ حَافِظًا
  source: quran
  ref: سورة يوسف، الآية ٦٤
  level: 1
  notes: يجوز إعراب «حافظًا» حالًا. وفي قراءة أخرى «حِفْظًا» (تمييز)، والنص هنا رواية حفص كما في تنزيل.
  irab:
    - الفاء استئنافية، ولفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
    - خبر مرفوع وعلامة رفعه تنوين الضم
    - تمييز منصوب وعلامة نصبه تنوين الفتح
- text: وَهُوَ أَرْحَمُ الرَّاحِمِينَ
  source: quran
  ref: سورة يوسف، الآية ٩٢
  level: 1
  irab:
    - الواو استئنافية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
    - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
- text: وَرَفَعْنَا لَكَ ذِكْرَكَ
  source: quran
  ref: سورة الشرح، الآية ٤
  level: 1
  irab:
    - الواو حرف عطف، و«رفع» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
    - اللام حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«رفعنا»
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
- text: رَبِّ اشْرَحْ لِي صَدْرِي
  source: quran
  ref: سورة طه، الآية ٢٥
  level: 1
  irab:
    - منادى بأداة نداء محذوفة (يا ربِّ) منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، وهو مضاف، والياء المحذوفة ضمير في محل جر مضاف إليه
    - فعل دعاء بصيغة الأمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - اللام حرف جر، والياء ضمير متصل مبني على السكون في محل جر
    - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
- text: وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ
  source: quran
  ref: سورة الأعراف، الآية ١٥٦
  level: 1
  irab:
    - الواو حرف عطف، و«رحمة» مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
    - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر المبتدأ
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
- text: إِنَّهُ كَانَ تَوَّابًا
  source: quran
  ref: سورة النصر، الآية ٣
  level: 1
  irab:
    - «إنّ» حرف توكيد ونصب، والهاء ضمير متصل مبني على الضم في محل نصب اسم «إنّ»
    - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو
    - خبر «كان» منصوب وعلامة نصبه تنوين الفتح (صيغة مبالغة)، والجملة في محل رفع خبر «إنّ»
- text: اقْرَأْ وَرَبُّكَ الْأَكْرَمُ
  source: quran
  ref: سورة العلق، الآية ٣
  level: 1
  notes: الواو حالية، ويجوز أن تكون استئنافية.
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - الواو حالية، و«ربّ» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)، والجملة في محل نصب حال

# ── Medium (5–7 words) ──────────────────────────────────────────────────────────────────────────
- text: فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ
  source: quran
  ref: سورة البقرة، الآية ١٥٢
  level: 2
  irab:
    - الفاء بحسب ما قبلها، و«اذكروا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
    - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا، و«كم» ضمير متصل في محل نصب مفعول به
    - الواو حرف عطف، و«اشكروا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
    - اللام حرف جر، والياء ضمير متصل مبني على السكون في محل جر
    - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
    - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل، والنون للوقاية، وياء المتكلم المحذوفة ضمير في محل نصب مفعول به
- text: وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ
  source: quran
  ref: سورة ق، الآية ١٦
  level: 2
  irab:
    - الواو حالية، و«نحن» ضمير منفصل مبني على الضم في محل رفع مبتدأ
    - خبر مرفوع وعلامة رفعه الضمة بلا تنوين لأنه ممنوع من الصرف (اسم تفضيل على وزن «أفعل»)، والجملة في محل نصب حال
    - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«أقرب»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ
  source: quran
  ref: سورة يوسف، الآية ٨٦
  level: 2
  irab:
    - «إنّ» حرف توكيد ونصب، و«ما» كافة، و«إنما» أداة حصر لا عمل لها
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل، والفاعل ضمير مستتر وجوبًا تقديره أنا
    - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«حزن» معطوف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
    - حرف جر مبني على السكون
    - لفظ الجلالة اسم مجرور وعلامة جره الكسرة
- text: قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا
  source: quran
  ref: سورة الطلاق، الآية ٣
  level: 2
  irab:
    - حرف تحقيق مبني على السكون
    - فعل ماضٍ مبني على الفتح
    - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
    - اللام حرف جر، و«كلّ» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«جعل»
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - مفعول به منصوب وعلامة نصبه تنوين الفتح
- text: يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ
  source: quran
  ref: سورة لقمان، الآية ١٣
  level: 2
  notes: «بُنَيَّ» تصغير «ابن» مضاف إلى ياء المتكلم (أصلها «بُنَيِّي»)، فأُدغمت ياء التصغير في لام الكلمة وحُذفت ياء المتكلم وبقيت الفتحة؛ في تفصيل إعرابها خلاف، فراجعه.
  irab:
    - حرف نداء مبني على السكون
    - منادى مضاف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، وياء المتكلم ضمير في محل جر مضاف إليه
    - «لا» ناهية جازمة مبنية على السكون
    - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - الباء حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة
- text: فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ
  source: quran
  ref: سورة آل عمران، الآية ١٥٩
  level: 2
  irab:
    - الفاء بحسب ما قبلها، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل جر مضاف إليه، وهي جملة الشرط
    - الفاء رابطة لجواب الشرط، و«توكّل» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة جواب شرط غير جازم لا محل لها
    - حرف جر مبني على السكون
    - لفظ الجلالة اسم مجرور وعلامة جره الكسرة
- text: وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ
  source: quran
  ref: سورة غافر، الآية ٦٠
  level: 2
  irab:
    - الواو بحسب ما قبلها، و«قال» فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وحُرّك بالضم لالتقاء الساكنين
    - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
    - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا
    - اللام حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر
- text: إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا
  source: quran
  ref: سورة الزمر، الآية ٥٣
  level: 2
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - حال منصوبة وعلامة نصبها تنوين الفتح

# ── Long (8–12 words) ───────────────────────────────────────────────────────────────────────────
- text: فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ
  source: quran
  ref: سورة يس، الآية ٨٣
  level: 3
  irab:
    - الفاء استئنافية، و«سبحان» مفعول مطلق منصوب لفعل محذوف تقديره «نسبّح»، وعلامة نصبه الفتحة، وهو مضاف
    - اسم موصول مبني على السكون في محل جر مضاف إليه
    - الباء حرف جر، و«يد» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة في محل رفع خبر مقدم
    - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة صلة الموصول لا محل لها
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - الواو حرف عطف، و«إلى» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«ترجعون»
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع نائب فاعل
- text: فَلِلَّهِ الْحَمْدُ رَبِّ السَّمَاوَاتِ وَرَبِّ الْأَرْضِ رَبِّ الْعَالَمِينَ
  source: quran
  ref: سورة الجاثية، الآية ٣٦
  level: 3
  notes: «ربِّ» الأولى والثالثة بدل من لفظ الجلالة، ويجوز إعرابهما نعتًا.
  irab:
    - الفاء بحسب ما قبلها، واللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة في محل رفع خبر مقدم
    - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة
    - بدل من لفظ الجلالة مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة لأنه جمع مؤنث سالم
    - الواو حرف عطف، و«ربّ» معطوف مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - بدل ثانٍ مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
- text: وَلَقَدْ أَرْسَلْنَا مُوسَىٰ بِآيَاتِنَا إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ فَقَالَ إِنِّي رَسُولُ رَبِّ الْعَالَمِينَ
  source: quran
  ref: سورة الزخرف، الآية ٤٦
  level: 3
  irab:
    - الواو استئنافية، واللام واقعة في جواب قسم محذوف، و«قد» حرف تحقيق مبني على السكون
    - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو ممنوع من الصرف (علم أعجمي)
    - الباء حرف جر، و«آيات» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (علم أعجمي)
    - الواو حرف عطف، و«ملأ» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - الفاء حرف عطف، و«قال» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
    - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
    - خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
- text: فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ الْغُرُوبِ
  source: quran
  ref: سورة ق، الآية ٣٩
  level: 3
  notes: «ما» موصولة، ويجوز أن تكون مصدرية (على قولهم).
  irab:
    - الفاء بحسب ما قبلها، و«اصبر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - حرف جر مبني على السكون
    - اسم موصول مبني على السكون في محل جر
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - الواو حرف عطف، و«سبّح» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - الباء حرف جر، و«حمد» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل نصب حال (أي متلبسًا بحمد ربك)
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«قبل» ظرف زمان معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا سَدِيدًا
  source: quran
  ref: سورة الأحزاب، الآية ٧٠
  level: 3
  irab:
    - حرف نداء مبني على السكون
    - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
    - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
    - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
    - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
    - الواو حرف عطف، و«قولوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
    - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
    - نعت منصوب وعلامة نصبه تنوين الفتح
- text: رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ
