- text: قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ
  source: quran
  ref: سورة الزمر، الآية ٩
  level: 3
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - حرف استفهام بمعنى النفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
    - اسم موصول مبني على الفتح في محل رفع فاعل
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - الواو حرف عطف، و«الذين» اسم موصول مبني على الفتح في محل رفع معطوف
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
- text: قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا
  source: quran
  ref: سورة مريم، الآية ٣٠
  level: 3
  notes: جملة «آتاني الكتاب» خبر ثانٍ لـ«إنّ»، ويجوز أن تكون استئنافية أو حالًا.
  irab:
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
    - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
    - خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف
    - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، والياء ضمير متصل مبني على الفتح في محل نصب مفعول به أول، والجملة في محل رفع خبر ثانٍ لـ«إنّ»
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
    - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به أول
    - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
- text: يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ
  source: quran
  ref: سورة آل عمران، الآية ٢٠٠
  level: 3
  irab:
    - حرف نداء مبني على السكون
    - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
    - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
    - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
    - الواو حرف عطف، و«صابروا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
