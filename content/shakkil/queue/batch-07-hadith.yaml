# Batch 07 (hadith): 25 short, medium and long sayings of the Prophet ﷺ, drafted by Claude for review.
#
# Source: matn from hadith-api (github.com/fawazahmed0/hadith-api, Unlicense / public domain), editions
# ara-bukhari and ara-muslim, fetched by hadith number. `ref` uses the standard numbering (the
# edition's `arabicnumber`; for Sahih Muslim that is Fuad Abd al-Baqi's, e.g. «الدين النصيحة» = ٥٥).
# Punctuation-only tokens dropped; where a saying is part of a longer matn, the part is contiguous and
# stands alone. A vowel was added only where the source leaves a letter bare and only one reading is
# possible (noted per item). The source writes the fatha of «لا» on the alif («لاَ»), which leaves the
# lam bare; it is moved to the lam («لَا») and noted.
#
# The i'rab is Claude's; please check it, especially the items marked in notes.

# ── Short (2–4 words) ───────────────────────────────────────────────────────────────────────────
- text: لَا تَغْضَبْ
  source: hadith
  ref: صحيح البخاري، الحديث ٦١١٦
  level: 1
  notes: الخطاب لرجل قال «أوصني». في المصدر «لاَ» بالفتحة على الألف، فنُقلت إلى اللام.
  irab:
    - حرف نهي جازم مبني على السكون
    - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
- text: الدِّينُ النَّصِيحَةُ
  source: hadith
  ref: صحيح مسلم، الحديث ٥٥
  level: 1
  notes: صدر الحديث، والمتن كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة الظاهرة
- text: كُلُّ مَعْرُوفٍ صَدَقَةٌ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٠٢١
  level: 1
  notes: المتن كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - خبر مرفوع وعلامة رفعه تنوين الضم
- text: الظُّلْمُ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ
  source: hadith
  ref: صحيح البخاري، الحديث ٢٤٤٧
  level: 1
  notes: المتن كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه تنوين الضم
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بالخبر
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: مَنْ لَا يَرْحَمُ لَا يُرْحَمُ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٠١٣
  level: 1
  notes: المتن بالرفع كما في المصدر، فـ«مَن» موصولة؛ ويُروى بالجزم («لا يرحمْ لا يُرحمْ») على أنها اسم شرط جازم. في المصدر «لاَ» بالفتحة على الألف، فنُقلت إلى اللام.
  irab:
    - اسم موصول مبني على السكون في محل رفع مبتدأ
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
    - حرف نفي مبني على السكون
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
- text: الْبِرُّ حُسْنُ الْخُلُقِ
  source: hadith
  ref: صحيح مسلم، الحديث ٢٥٥٣
  level: 1
  notes: صدر الحديث، والمتن كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: الطُّهُورُ شَطْرُ الْإِيمَانِ
  source: hadith
  ref: صحيح مسلم، الحديث ٢٢٣
  level: 1
  notes: صدر الحديث. أُضيف سكون لام «الْإِيمَانِ»، وهي بلا تشكيل في المصدر («الإِيمَانِ»).
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: إِنَّ الدِّينَ يُسْرٌ
  source: hadith
  ref: صحيح البخاري، الحديث ٣٩
  level: 1
  notes: صدر الحديث، والمتن كما في المصدر.
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم

# ── Medium (5–7 words) ──────────────────────────────────────────────────────────────────────────
- text: اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ
  source: hadith
  ref: صحيح البخاري، الحديث ١٤١٧
  level: 2
  notes: المتن كما في المصدر. في الواو وجه آخر (عاطفة على محذوف تقديره «اتقوها بكل حال»).
  irab:
    - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - الواو حالية، و«لو» حرف شرط غير جازم (وصلية) مبني على السكون
    - الباء حرف جر، و«شق» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بفعل محذوف تقديره «ولو اتقيتموها»
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
- text: خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ
  source: hadith
  ref: صحيح البخاري، الحديث ٥٠٢٧
  level: 2
  notes: المتن كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - اسم موصول مبني على السكون في محل رفع خبر
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - الواو حرف عطف، و«علّم» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به
- text: الْحَيَاءُ لَا يَأْتِي إِلاَّ بِخَيْرٍ
  source: hadith
  ref: صحيح البخاري، الحديث ٦١١٧
  level: 2
  notes: في المصدر «لاَ» بالفتحة على الألف، فنُقلت إلى اللام، والباقي كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
    - أداة حصر (استثناء مفرّغ) مبنية على السكون
    - الباء حرف جر، و«خير» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يأتي»
- text: يَسِّرُوا وَلَا تُعَسِّرُوا، وَبَشِّرُوا وَلَا تُنَفِّرُوا
  source: hadith
  ref: صحيح البخاري، الحديث ٦٩
  level: 2
  notes: في المصدر «وَلاَ» بالفتحة على الألف، فنُقلت إلى اللام في الموضعين، والباقي كما في المصدر.
  irab:
    - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
    - الواو حرف عطف، و«لا» حرف نهي جازم مبني على السكون
    - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
    - الواو حرف عطف، و«بشّروا» فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
    - الواو حرف عطف، و«لا» حرف نهي جازم مبني على السكون
    - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
- text: الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا
  source: hadith
  ref: صحيح البخاري، الحديث ٢٤٤٦
  level: 2
  notes: المتن كما في المصدر. في جملة «يشد» وجه آخر (استئنافية تبيّن وجه الشبه).
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - اللام حرف جر، و«المؤمن» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بالخبر المحذوف
    - الكاف حرف جر وتشبيه، و«البنيان» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بخبر محذوف
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل نصب حال
    - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - مفعول به منصوب وعلامة نصبه تنوين الفتح
- text: إِنَّ مِنْ خِيَارِكُمْ أَحْسَنَكُمْ أَخْلَاقًا
  source: hadith
  ref: صحيح البخاري، الحديث ٣٥٥٩
  level: 2
  notes: في المصدر «أَخْلاَقًا» بالفتحة على الألف، فنُقلت إلى اللام، والباقي كما في المصدر.
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة في محل رفع خبر «إنّ» مقدّم
    - اسم «إنّ» مؤخر منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - تمييز منصوب وعلامة نصبه تنوين الفتح
- text: مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ
  source: hadith
  ref: صحيح مسلم، الحديث ١٨٩٣
  level: 2
  notes: المتن كما في المصدر. في «مَن» وجه آخر (موصولة، ودخلت الفاء في خبرها لشبهها بالشرط).
  irab:
    - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
    - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره تنوين الكسر
    - الفاء رابطة لجواب الشرط، واللام حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة في محل رفع خبر مقدّم
    - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل جزم جواب الشرط
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
- text: الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ
  source: hadith
  ref: صحيح مسلم، الحديث ٢٩٥٦
  level: 2
  notes: المتن كما في المصدر.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
    - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«جنة» معطوف مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة

# ── Long (8–12 words) ───────────────────────────────────────────────────────────────────────────
- text: مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٠١٥
  level: 3
  fixed: [ظننت]
  notes: المتن كما في المصدر. التاء مضمومة لأن الظانّ هو الموصى في «يوصيني» (المتكلم، النبي ﷺ).
  irab:
    - حرف نفي مبني على السكون
    - فعل ماضٍ ناقص مبني على الفتح
    - اسم «ما زال» مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف للعلمية والعجمة
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة في محل نصب خبر «ما زال»
    - الباء حرف جر، و«الجار» اسم مجرور وعلامة جره الكسرة الظاهرة
    - حرف ابتداء وغاية مبني على السكون
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
    - «أنّ» حرف توكيد ونصب، والهاء ضمير متصل في محل نصب اسم «أنّ»
    - السين حرف استقبال، و«يورّث» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «أنّ»، والمصدر المؤول سدّ مسدّ مفعولي «ظنّ»
- text: لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ، وَلَكِنَّ الْغِنَى غِنَى النَّفْسِ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٤٤٦
  level: 3
  notes: المتن كما في المصدر. «العَرَض» بفتح الراء، أي متاع الدنيا.
  irab:
    - فعل ماضٍ ناقص جامد مبني على الفتح
    - اسم «ليس» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل نصب خبر «ليس»
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«لكنّ» حرف استدراك ونصب مبني على الفتح
    - اسم «لكنّ» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
    - خبر «لكنّ» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ فِي الْأَمْرِ كُلِّهِ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٩٢٧
  level: 3
  notes: من قوله ﷺ لعائشة بعد «يا عائشة». أُضيف سكون لام «الْأَمْرِ»، وهي بلا تشكيل في المصدر («الأَمْرِ»). في جملة «يحب» وجه آخر (نعت لـ«رفيق»).
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
    - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر ثانٍ لـ«إنّ»
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«الرفق»
    - توكيد مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
- text: إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٠٩٤
  level: 3
  notes: الجملتان الأوليان من الحديث، والمتن كما في المصدر.
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«إنّ» حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
- text: رَحِمَ اللَّهُ رَجُلاً سَمْحًا إِذَا بَاعَ، وَإِذَا اشْتَرَى، وَإِذَا اقْتَضَى
  source: hadith
  ref: صحيح البخاري، الحديث ٢٠٧٦
  level: 3
  notes: المتن كما في المصدر. الجملة دعائية. في «إذا» وجه آخر (شرطية حُذف جوابها لدلالة «سمحًا» عليه).
  irab:
    - فعل ماضٍ مبني على الفتح
    - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
    - مفعول به منصوب وعلامة نصبه تنوين الفتح
    - نعت منصوب وعلامة نصبه تنوين الفتح
    - ظرف زمان مبني على السكون في محل نصب، متعلق بـ«سمحًا»
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
    - الواو حرف عطف، و«إذا» ظرف زمان مبني على السكون في محل نصب
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
    - الواو حرف عطف، و«إذا» ظرف زمان مبني على السكون في محل نصب
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
- text: لَا تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ
  source: hadith
  ref: صحيح مسلم، الحديث ٢٦٢٦
  level: 3
  fixed: [أخاك]
  notes: الخطاب لأبي ذر، و«تحقرَنّ» بفتح الراء صيغة المذكر، فالكاف مفتوحة. في المصدر «لاَ» بالفتحة على الألف، فنُقلت إلى اللام.
  irab:
    - حرف نهي جازم مبني على السكون
    - فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة في محل جزم بـ«لا» الناهية، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
    - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بحال من «شيئًا»
    - مفعول به منصوب وعلامة نصبه تنوين الفتح
    - الواو حالية، و«لو» حرف شرط غير جازم (وصلية) مبني على السكون
    - حرف مصدري ونصب مبني على السكون
    - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره أنت، والمصدر المؤول فاعل لفعل محذوف تقديره «ولو كان»
    - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - الباء حرف جر، و«وجه» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«تلقى»
    - نعت مجرور وعلامة جره تنوين الكسر
- text: الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ وَفِي كُلٍّ خَيْرٌ
  source: hadith
  ref: صحيح مسلم، الحديث ٢٦٦٤
  level: 3
  notes: صدر الحديث، والمتن كما في المصدر. تنوين «كلٍّ» عوض عن المضاف إليه (أي في كلٍّ منهما).
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - نعت مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه تنوين الضم
    - الواو حرف عطف، و«أحبّ» معطوف مرفوع وعلامة رفعه الضمة، وهو اسم تفضيل ممنوع من الصرف على وزن «أفعل»
    - حرف جر مبني على السكون
    - لفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أحبّ»
    - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
    - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«خير» و«أحبّ»
    - نعت مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«في» حرف جر مبني على السكون
    - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة في محل رفع خبر مقدّم
    - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
- text: إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ
  source: hadith
  ref: صحيح مسلم، الحديث ٢٥٦٤
  level: 3
  notes: في المصدر «لاَ» بالفتحة على الألف، فنُقلت إلى اللام، والباقي كما في المصدر.
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«أموال» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«لكنْ» حرف استدراك مخفف مهمل مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«أعمال» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
- text: السَّاعِي عَلَى الْأَرْمَلَةِ وَالْمِسْكِينِ كَالْمُجَاهِدِ فِي سَبِيلِ اللَّهِ
  source: hadith
  ref: صحيح البخاري، الحديث ٥٣٥٣
  level: 3
  notes: صدر الحديث، وبعده «أو القائم الليل الصائم النهار». أُضيف سكون لام «الْأَرْمَلَةِ»، وهي بلا تشكيل في المصدر («الأَرْمَلَةِ»).
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«الساعي»
    - الواو حرف عطف، و«المسكين» معطوف مجرور وعلامة جره الكسرة الظاهرة
    - الكاف حرف جر وتشبيه، و«المجاهد» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بخبر محذوف
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«المجاهد»
    - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
