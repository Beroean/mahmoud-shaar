    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: لَمْ يَنْتَهِ الْعُمَّالُ مِنَ الْبِنَاءِ
  fixed: [ينته]
  source: llm-reviewed
  level: 2
  notes: المضارع المعتل الآخر يُجزم بحذف حرف العلة، و«مِنْ» تُفتح لالتقاء الساكنين.
  irab:
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الياء)، والكسرة قبلها دليل عليها
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
    - اسم مجرور وعلامة جره الكسرة الظاهرة
- text: لَا تَتْرُكِ الْمَوْقِدَ مُشْتَعِلًا بَعْدَ الطَّبْخِ
