# ── Medium ──────────────────────────────────────────────────────────────────────────────────────
- text: تَجَوَّلْنَا فِي شَوَارِعَ ضَيِّقَةٍ وَقَدِيمَةٍ
  source: llm-reviewed
  level: 2
  notes: «شوارع» على صيغة منتهى الجموع، فهو ممنوع من الصرف ويُجرّ بالفتحة.
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
    - نعت مجرور وعلامة جره تنوين الكسر
    - الواو حرف عطف، و«قديمة» معطوف مجرور وعلامة جره تنوين الكسر
- text: يَعْمَلُ أَبُو سَمِيرٍ فِي مَطْعَمٍ كَبِيرٍ
