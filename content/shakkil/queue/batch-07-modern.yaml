# Batch 07 (modern): 45 original sentences built around a rule (llm-reviewed), drafted by Claude.
# 15 short (2–4 words), 15 medium (5–7 words), 15 long (8–12 words).
#
# The i'rab is Claude's; please check it, especially the items marked in notes.

# ── Short ───────────────────────────────────────────────────────────────────────────────────────
- text: طَبَخَتِ الْجَدَّةُ الْأَرُزَّ
  source: llm-reviewed
  level: 1
  notes: تاء التأنيث الساكنة تُكسر لالتقاء الساكنين، ومفعول به منصوب.
  irab:
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
- text: يَسْبَحُ الْأَطْفَالُ فِي الْبُحَيْرَةِ
  source: llm-reviewed
  level: 1
  notes: فعل مضارع مرفوع يسبق فاعله، وجار ومجرور.
  irab:
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
- text: إِنَّ الْمَطْبَخَ نَظِيفٌ
