  irab:
    - حرف شرط جازم مبني على السكون
    - فعل مضارع مجزوم بـ«إن» لأنه فعل الشرط وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - فعل مضارع ناقص مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
