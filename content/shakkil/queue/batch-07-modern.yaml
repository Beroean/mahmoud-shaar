    - مفعول به منصوب وعلامة نصبه تنوين الفتح
    - نعت منصوب وعلامة نصبه تنوين الفتح
- text: انْطَلَقَتْ قَافِلَةُ الْمُسْتَكْشِفِينَ فِي صَحْرَاءَ وَاسِعَةٍ بَحْثًا عَنْ آثَارٍ قَدِيمَةٍ
  source: llm-reviewed
  level: 3
  notes: «صحراء» مختومة بألف التأنيث الممدودة فهي ممنوعة من الصرف، و«بحثًا» مفعول لأجله.
  irab:
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
    - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (مختوم بألف التأنيث الممدودة)
    - نعت مجرور وعلامة جره تنوين الكسر
    - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره تنوين الكسر
    - نعت مجرور وعلامة جره تنوين الكسر
- text: لَوْ حَافَظَ النَّاسُ عَلَى نَظَافَةِ الشَّوَاطِئِ لَبَقِيَتْ جَمِيلَةً طَوَالَ الْعَامِ
  source: llm-reviewed
  level: 3
  notes: «لو» شرطية غير جازمة وجوابها مقترن باللام، و«بقي» من أخوات «كان».
  irab:
    - حرف شرط غير جازم (حرف امتناع لامتناع) مبني على السكون
    - فعل ماضٍ مبني على الفتح، وهو فعل الشرط
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - اللام واقعة في جواب الشرط، و«بقيت» فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث، واسمه ضمير مستتر تقديره هي، والجملة جواب الشرط لا محل لها
    - خبر «بقي» منصوب وعلامة نصبه تنوين الفتح
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
