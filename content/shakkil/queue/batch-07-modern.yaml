    - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
- text: كَانَ الْمَلْعَبُ مُزْدَحِمًا
  source: llm-reviewed
  level: 1
  notes: «كان» ترفع الاسم وتنصب الخبر.
