  level: 1
  notes: ظرف مكان منصوب، وما بعده مضاف إليه مجرور.
  irab:
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: الْمُمَرِّضَاتُ مُتْعَبَاتٌ
  source: llm-reviewed
  level: 1
  notes: جمع مؤنث سالم مرفوع بالضمة مبتدأً وخبرًا.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو جمع مؤنث سالم
    - خبر مرفوع وعلامة رفعه تنوين الضم، وهو جمع مؤنث سالم
- text: شَكَرْنَا الطَّبَّاخِينَ
