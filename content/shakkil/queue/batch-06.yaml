    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
- text: رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ
  source: quran
  ref: سورة إبراهيم، الآية ٤١
  level: 3
  irab:
    - منادى بحرف نداء محذوف منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
    - فعل دعاء مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - اللام حرف جر، والياء ضمير متصل مبني على السكون في محل جر
    - الواو حرف عطف، واللام حرف جر، و«والديّ» اسم مجرور وعلامة جره الياء لأنه مثنى، وحُذفت نونه للإضافة، وياء المتكلم ضمير مبني على الفتح في محل جر مضاف إليه
    - الواو حرف عطف، واللام حرف جر، و«المؤمنين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر مضاف إليه
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة

# ── Hadith (Sahih al-Bukhari, via hadith-api) ───────────────────────────────────────────────────
- text: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى
  source: hadith
  ref: صحيح البخاري، الحديث ١
  level: 3
  notes: المتن كما في المصدر، ولم يُضف أي تشكيل.
  irab:
    - «إنّ» حرف توكيد، و«ما» كافة ومكفوفة، أداة حصر لا عمل لها
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - الباء حرف جر، و«النيات» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بخبر محذوف
    - الواو حرف عطف، و«إنما» كافة ومكفوفة، أداة حصر لا عمل لها
    - اللام حرف جر، و«كل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل رفع خبر مقدّم
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - اسم موصول مبني على السكون في محل رفع مبتدأ مؤخر
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
- text: الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ
  source: hadith
  ref: صحيح البخاري، الحديث ١٠
  level: 2
  notes: المتن كما في المصدر، وحُذفت الفاصلة في آخر المقطع.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - اسم موصول مبني على السكون في محل رفع خبر
    - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
    - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«يد» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
- text: لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ
  source: hadith
  ref: صحيح البخاري، الحديث ١٣
  level: 3
  notes: أُضيفت فتحة «لَا» وكسرة لام «لِأَخِيهِ»، وكلاهما بلا تشكيل في المصدر ولا يحتمل غيرهما.
  irab:
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
    - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
    - حرف غاية وجر مبني على السكون
    - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو
    - اللام حرف جر، و«أخي» اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - اسم موصول مبني على السكون في محل نصب مفعول به
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
    - اللام حرف جر، و«نفس» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
- text: مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٠١٨
  level: 3
  notes: آخر جمل الحديث. أُضيف سكون لام «الْآخِرِ»، وهي بلا تشكيل في المصدر («الآخِرِ»).
  irab:
    - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
    - فعل ماضٍ ناقص مبني على الفتح في محل جزم فعل الشرط، واسمه ضمير مستتر تقديره هو
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «كان»
    - الباء حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة
    - الواو حرف عطف، و«اليوم» معطوف مجرور وعلامة جره الكسرة الظاهرة
    - نعت مجرور وعلامة جره الكسرة الظاهرة
    - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يقل» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والجملة في محل جزم جواب الشرط
    - مفعول به منصوب وعلامة نصبه تنوين الفتح
    - حرف عطف مبني على السكون
    - اللام لام الأمر، و«يصمت» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون
- text: لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ
  source: hadith
  ref: صحيح البخاري، الحديث ٦١١٤
  level: 3
  notes: المتن كما في المصدر.
  irab:
    - فعل ماضٍ ناقص جامد مبني على الفتح
    - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
    - الباء حرف جر زائد، و«الصرعة» اسم مجرور لفظًا منصوب محلًّا خبر «ليس»
    - كافة ومكفوفة، أداة حصر لا عمل لها
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - اسم موصول مبني على السكون في محل رفع خبر
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ، الصِّحَّةُ وَالْفَرَاغُ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٤١٢
  level: 3
  notes: المتن كما في المصدر. في إعراب «نعمتان» وجه آخر (خبر لمبتدأ محذوف)؛ يُرجى التحقق.
  irab:
    - مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى
    - خبر مقدّم مرفوع وعلامة رفعه تنوين الضم
    - «في» حرف جر، و«هما» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«مغبون»
    - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل رفع خبر «نعمتان»
    - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
    - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة في محل رفع نعت لـ«كثير»
    - خبر لمبتدأ محذوف تقديره «هما» مرفوع وعلامة رفعه الضمة الظاهرة
    - الواو حرف عطف، و«الفراغ» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
- text: كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ، أَوْ عَابِرُ سَبِيلٍ
  source: hadith
  ref: صحيح البخاري، الحديث ٦٤١٦
  level: 2
  fixed: [كأنك]
  notes: المتن كما في المصدر. الكاف مفتوحة لأن «كُنْ» أمر للمذكر (الخطاب لابن عمر).
  irab:
    - فعل أمر ناقص مبني على السكون، واسمه ضمير مستتر وجوبًا تقديره أنت
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وشبه الجملة في محل نصب خبر «كن»
    - «كأنّ» حرف تشبيه ونصب، والكاف ضمير متصل في محل نصب اسم «كأنّ»، والجملة في محل نصب حال
    - خبر «كأنّ» مرفوع وعلامة رفعه تنوين الضم
    - حرف عطف مبني على السكون
    - معطوف مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر

# ── Poetry ──────────────────────────────────────────────────────────────────────────────────────
- text: وَإِذَا كَانَتِ النُّفُوسُ كِبَارًا تَعِبَتْ فِي مُرَادِهَا الْأَجْسَامُ
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - الواو بحسب ما قبلها، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم
    - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة في محل جر بإضافة «إذا» إليها
    - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والجملة جواب الشرط لا محل لها
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: وَمَهْمَا تَكُنْ عِنْدَ امْرِئٍ مِنْ خَلِيقَةٍ وَإِنْ خَالَهَا تَخْفَى عَلَى النَّاسِ تُعْلَمِ
  source: poetry
  author: زهير بن أبي سلمى
  ref: المعلقة
  level: 3
  notes: «تُعْلَمِ» مجزوم، وكُسر آخره للروي (القافية مكسورة)، فالكسرة هي الجواب في البيت.
  irab:
    - الواو بحسب ما قبلها، و«مهما» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
    - فعل مضارع تام مجزوم بـ«مهما» وعلامة جزمه السكون، وهو فعل الشرط
    - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - حرف جر زائد مبني على السكون
    - فاعل «تكن» مجرور لفظًا مرفوع محلًّا
    - الواو حالية، و«إن» حرف شرط مبني على السكون
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل في محل نصب مفعول به أول
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب مفعول به ثانٍ لـ«خال»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - فعل مضارع مبني للمجهول مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر للروي، ونائب الفاعل ضمير مستتر تقديره هي
- text: أَلَا لَيْتَ الشَّبَابَ يَعُودُ يَوْمًا فَأُخْبِرَهُ بِمَا فَعَلَ الْمَشِيبُ
  source: poetry
  author: أبو العتاهية
  level: 3
  irab:
    - حرف استفتاح وتنبيه مبني على السكون
    - حرف تمنٍّ ونصب مبني على الفتح
    - اسم «ليت» منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «ليت»
    - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
    - الفاء سببية، و«أخبر» فعل مضارع منصوب بـ«أن» المضمرة بعد فاء السببية وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا، والهاء ضمير متصل في محل نصب مفعول به
    - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
    - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: سَتُبْدِي لَكَ الْأَيَّامُ مَا كُنْتَ جَاهِلًا وَيَأْتِيكَ بِالْأَخْبَارِ مَنْ لَمْ تُزَوِّدِ
  source: poetry
  author: طرفة بن العبد
  ref: المعلقة
  context: الخطاب لمذكّر
  level: 3
  notes: «تُزَوِّدِ» مجزوم بـ«لم»، وكُسر آخره للروي.
  irab:
    - السين للاستقبال، و«تبدي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
    - اللام حرف جر، والكاف ضمير متصل في محل جر
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - اسم موصول مبني على السكون في محل نصب مفعول به
    - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «كان»، والجملة صلة الموصول لا محل لها
    - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
    - الواو حرف عطف، و«يأتي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والكاف ضمير متصل في محل نصب مفعول به
    - الباء حرف جر، و«الأخبار» اسم مجرور وعلامة جره الكسرة الظاهرة
    - اسم موصول مبني على السكون في محل رفع فاعل
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر للروي، والفاعل ضمير مستتر تقديره أنت، والجملة صلة الموصول
- text: وَمَنْ يَكُ ذَا فَمٍ مُرٍّ مَرِيضٍ يَجِدْ مُرًّا بِهِ الْمَاءَ الزُّلَالَا
  source: poetry
  author: المتنبي
  level: 3
