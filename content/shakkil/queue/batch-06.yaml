    - حرف عطف مبني على الفتح
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو
- text: قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ
  source: quran
  ref: سورة الأنبياء، الآية ٦٩
  level: 3
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
    - حرف نداء مبني على السكون
    - منادى نكرة مقصودة مبني على الضم في محل نصب
    - فعل أمر ناقص مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع اسم «كان»
    - خبر «كوني» منصوب وعلامة نصبه تنوين الفتح
    - الواو حرف عطف، و«سلامًا» معطوف منصوب وعلامة نصبه تنوين الفتح
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (علم أعجمي)
- text: وَسَلَامٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّا
  source: quran
  ref: سورة مريم، الآية ١٥
  level: 3
  irab:
    - الواو بحسب ما قبلها، و«سلام» مبتدأ مرفوع وعلامة رفعه تنوين الضم (نكرة سوّغ الابتداء بها الدعاء)
    - «على» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة في محل رفع خبر
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
    - فعل ماضٍ مبني للمجهول مبني على الفتح، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
    - الواو حرف عطف، و«يوم» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
    - الواو حرف عطف، و«يوم» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
    - حال منصوبة وعلامة نصبها تنوين الفتح
- text: يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ
