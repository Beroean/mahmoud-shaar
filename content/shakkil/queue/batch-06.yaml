- text: قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ
  source: quran
  ref: سورة الأنعام، الآية ١٦٢
  level: 3
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«نسك» معطوف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
    - الواو حرف عطف، و«محيا» معطوف منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، والياء ضمير مبني على الفتح في محل جر مضاف إليه
    - الواو حرف عطف، و«ممات» معطوف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
    - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة في محل رفع خبر «إنّ»
    - بدل مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
- text: خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ
  source: quran
  ref: سورة الأعراف، الآية ١٩٩
  level: 2
  irab:
    - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره أنت
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - الواو حرف عطف، و«أْمُرْ» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - الباء حرف جر، و«العرف» اسم مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«أعرض» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
    - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
- text: وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ
  source: quran
  ref: سورة هود، الآية ١١٥
  level: 2
  irab:
    - الواو بحسب ما قبلها، و«اصبر» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - الفاء تعليلية، و«إنّ» حرف توكيد ونصب مبني على الفتح
    - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
- text: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ
  source: quran
  ref: سورة التوبة، الآية ١١٩
  level: 3
  irab:
    - حرف نداء مبني على السكون
    - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
    - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
    - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
    - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
    - الواو حرف عطف، و«كونوا» فعل أمر ناقص مبني على حذف النون، والواو ضمير متصل في محل رفع اسم «كان»
    - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل نصب خبر «كان»
    - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
- text: أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  source: quran
  ref: سورة يونس، الآية ٦٢
  level: 3
  notes: «لا» الأولى مهملة لتكرارها ودخولها على نكرة مرفوعة، ويجوز أن تكون عاملة عمل «ليس».
  irab:
    - حرف استفتاح وتنبيه مبني على السكون
    - حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
    - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
    - حرف نفي مهمل مبني على السكون
    - مبتدأ مرفوع وعلامة رفعه تنوين الضم
    - «على» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة في محل رفع خبر، والجملة في محل رفع خبر «إنّ»
    - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
    - ضمير منفصل مبني على السكون في محل رفع مبتدأ
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر المبتدأ
- text: يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا
  source: quran
  ref: سورة الأحزاب، الآية ٤١
  level: 2
  irab:
    - حرف نداء مبني على السكون
    - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
    - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
    - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
    - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
    - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
    - نعت منصوب وعلامة نصبه تنوين الفتح
- text: إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ
  source: quran
  ref: سورة الحجر، الآية ٩
  level: 2
  irab:
    - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
    - ضمير منفصل مبني على الضم، توكيد لضمير النصب
    - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - الواو حرف عطف، و«إنّ» حرف توكيد ونصب، و«نا» ضمير متصل في محل نصب اسم «إنّ»
    - اللام حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«حافظون»
    - اللام المزحلقة للتوكيد، و«حافظون» خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
- text: قَالَ رَبُّنَا الَّذِي أَعْطَىٰ كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَىٰ
  source: quran
  ref: سورة طه، الآية ٥٠
  level: 3
  irab:
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
