- text: لَا يَسْلَمُ الشَّرَفُ الرَّفِيعُ مِنَ الْأَذَى حَتَّى يُرَاقَ عَلَى جَوَانِبِهِ الدَّمُ
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - نعت مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
