    - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة

# ── Modern ──────────────────────────────────────────────────────────────────────────────────────
- text: لَمْ يَكُنِ الطُّلَّابُ يَعْلَمُونَ أَنَّ الِامْتِحَانَ سَيُؤَجَّلُ إِلَى الْأُسْبُوعِ الْقَادِمِ
  source: llm-reviewed
  level: 3
  irab:
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
    - اسم «يكن» مرفوع وعلامة رفعه الضمة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «يكن»
    - حرف توكيد ونصب مبني على الفتح
    - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - السين للاستقبال، و«يؤجَّل» فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - نعت مجرور وعلامة جره الكسرة الظاهرة
- text: اشْتَرَى أَبِي لِأُخْتِي الصَّغِيرَةِ ثَلَاثَ عَشْرَةَ قِصَّةً مُصَوَّرَةً
  source: llm-reviewed
  level: 3
  notes: «ثلاثَ» تخالف المعدود المؤنث «قصة»، و«عشْرةَ» توافقه (عدد مركب).
  irab:
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
    - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
    - اللام حرف جر، و«أخت» اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
    - نعت مجرور وعلامة جره الكسرة الظاهرة
    - «ثلاث عشرة» عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
    - الجزء الثاني من العدد المركب، مبني على الفتح
    - تمييز منصوب وعلامة نصبه تنوين الفتح
    - نعت منصوب وعلامة نصبه تنوين الفتح
- text: مَا أَجْمَلَ أَنْ يَعُودَ الْمُسَافِرُ إِلَى وَطَنِهِ سَالِمًا!
  source: llm-reviewed
  level: 3
  irab:
    - «ما» التعجبية نكرة تامة بمعنى «شيء» مبنية على السكون في محل رفع مبتدأ
    - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
    - حرف مصدري ونصب مبني على السكون
    - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به لـ«أجمل»
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - حال منصوبة وعلامة نصبها تنوين الفتح
- text: إِنَّ الْمُهَنْدِسِينَ الَّذِينَ صَمَّمُوا هَذَا الْجِسْرَ مَشْهُورُونَ فِي الْعَالَمِ
  source: llm-reviewed
  level: 3
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - اسم «إنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
    - اسم موصول مبني على الفتح في محل نصب نعت
    - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - اسم إشارة مبني على السكون في محل نصب مفعول به
    - بدل منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
- text: كَانَتِ الْمُعَلِّمَاتُ يُكَافِئْنَ الطَّالِبَاتِ الْمُتَفَوِّقَاتِ فِي نِهَايَةِ كُلِّ عَامٍ
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
    - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
    - فعل مضارع مبني على السكون لاتصاله بنون النسوة، والنون ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
    - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
    - نعت منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
