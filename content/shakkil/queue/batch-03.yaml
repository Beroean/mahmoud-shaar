# ── Quran ────────────────────────────────────────────────────────────────────────────────────────
- text: إِنَّ مَعَ الْعُسْرِ يُسْرًا
  source: quran
  ref: سورة الشرح، الآية ٦
  level: 2
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل رفع خبر «إنّ» مقدّم
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
  notes: الخبر شبه جملة مقدّم، والاسم مؤخر منصوب.
- text: قُلْ هُوَ اللَّهُ أَحَدٌ
  source: quran
  ref: سورة الإخلاص، الآية ١
  level: 2
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - ضمير الشأن، ضمير منفصل مبني على الفتح في محل رفع مبتدأ
    - لفظ الجلالة مبتدأ ثانٍ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر المبتدأ الثاني مرفوع وعلامة رفعه تنوين الضم، والجملة في محل رفع خبر المبتدأ الأول
- text: لَمْ يَلِدْ وَلَمْ يُولَدْ
  source: quran
  ref: سورة الإخلاص، الآية ٣
  level: 2
  irab:
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
    - الواو عاطفة، و«لم» حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه السكون، ونائب الفاعل ضمير مستتر تقديره هو
- text: إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ
  source: quran
  ref: سورة الكوثر، الآية ١
  level: 2
  irab:
    - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
    - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير في محل رفع فاعل، والكاف ضمير في محل نصب مفعول به أول، والجملة في محل رفع خبر «إنّ»
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
- text: وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ
  source: quran
  ref: سورة الضحى، الآية ٥
  level: 3
  irab:
    - الواو عاطفة، واللام لام الابتداء للتوكيد، و«سوف» حرف تسويف واستقبال مبني على الفتح
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والكاف ضمير متصل في محل نصب مفعول به
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - الفاء عاطفة، و«ترضى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره أنت
- text: اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ
  source: quran
  ref: سورة العلق، الآية ١
  level: 2
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - الباء حرف جر، و«اسم» اسم مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - اسم موصول مبني على السكون في محل جر نعت لـ«ربك»
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
- text: إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ
  source: quran
  ref: سورة الحجرات، الآية ١٠
  level: 3
  irab:
    - كافّة ومكفوفة لا عمل لها
    - مبتدأ مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
    - خبر مرفوع وعلامة رفعه تنوين الضم
  notes: «إنما» كافة ومكفوفة، فما بعدها مبتدأ وخبر مرفوعان.
- text: لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا
  source: quran
  ref: سورة البقرة، الآية ٢٨٦
  level: 3
  irab:
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
    - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - مفعول به أول منصوب وعلامة نصبه تنوين الفتح
    - أداة حصر لا عمل لها
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  notes: استثناء مفرّغ.
- text: هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ
  source: quran
  ref: سورة الرحمن، الآية ٦٠
  level: 3
  irab:
    - حرف استفهام بمعنى النفي مبني على السكون
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - أداة حصر لا عمل لها
    - خبر مرفوع وعلامة رفعه الضمة الظاهرة
- text: أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ
  source: quran
  ref: سورة الرعد، الآية ٢٨
  level: 3
  irab:
    - حرف استفتاح وتنبيه مبني على السكون
    - الباء حرف جر، و«ذكر» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والجار والمجرور متعلقان بـ«تطمئن»
    - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
  source: quran
  ref: سورة الفاتحة، الآية ٢
  level: 1
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - اللام حرف جر، ولفظ الجلالة اسم مجرور، وشبه الجملة في محل رفع خبر
    - نعت مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
- text: اللَّهُ لَا إِلَـٰهَ إِلَّا هُوَ
  source: quran
  ref: سورة البقرة، الآية ٢٥٥
  level: 3
  irab:
    - لفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - نافية للجنس تعمل عمل «إنّ»
    - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف تقديره «موجود»، والجملة في محل رفع خبر المبتدأ
    - أداة استثناء ملغاة
    - ضمير منفصل مبني على الفتح في محل رفع بدل من محل «لا» واسمها
- text: جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ
  source: quran
  ref: سورة الإسراء، الآية ٨١
  level: 1
  irab:
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - الواو عاطفة، و«زهق» فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا
  source: quran
  ref: سورة التوبة، الآية ٤٠
  level: 2
  irab:
    - ناهية جازمة مبنية على السكون
    - فعل مضارع مجزوم بـ«لا» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
    - حرف توكيد ونصب مبني على الفتح
    - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
    - «مع» ظرف مكان منصوب وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة في محل رفع خبر «إنّ»
- text: إِنَّ اللَّهَ مَعَ الصَّابِرِينَ
  source: quran
  ref: سورة البقرة، الآية ١٥٣
  level: 2
  irab:
    - حرف توكيد ونصب مبني على الفتح
    - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
    - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل رفع خبر «إنّ»
    - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
- text: وَلَا تَهِنُوا وَلَا تَحْزَنُوا
  source: quran
  ref: سورة آل عمران، الآية ١٣٩
  level: 2
  irab:
    - الواو بحسب ما قبلها، و«لا» ناهية جازمة
    - فعل مضارع مجزوم بـ«لا» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
    - الواو عاطفة، و«لا» ناهية جازمة
    - فعل مضارع مجزوم بـ«لا» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
- text: الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا
  source: quran
  ref: سورة الكهف، الآية ٤٦
  level: 2
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - الواو عاطفة، و«البنون» معطوف مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم
    - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
- text: حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ
  source: quran
  ref: سورة آل عمران، الآية ١٧٣
  level: 3
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
    - لفظ الجلالة خبر مرفوع وعلامة رفعه الضمة
    - الواو عاطفة، و«نعم» فعل ماضٍ جامد لإنشاء المدح مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة، والمخصوص بالمدح محذوف تقديره «هو»
- text: مَا هَـٰذَا بَشَرًا
  source: quran
  ref: سورة يوسف، الآية ٣١
  level: 3
  irab:
    - نافية حجازية تعمل عمل «ليس» مبنية على السكون
    - اسم إشارة مبني على السكون في محل رفع اسم «ما»
    - خبر «ما» منصوب وعلامة نصبه تنوين الفتح
  notes: «ما» الحجازية تنصب الخبر، لذلك «بشرًا» منصوبة.

# ── Classical poetry (public domain) ─────────────────────────────────────────────────────────────
- text: الْخَيْلُ وَاللَّيْلُ وَالْبَيْدَاءُ تَعْرِفُنِي
  source: poetry
  author: المتنبي
  level: 2
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - الواو عاطفة، و«الليل» معطوف مرفوع وعلامة رفعه الضمة
    - الواو عاطفة، و«البيداء» معطوف مرفوع وعلامة رفعه الضمة
    - فعل مضارع مرفوع، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
- text: عَلَى قَدْرِ أَهْلِ الْعَزْمِ تَأْتِي الْعَزَائِمُ
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - حرف جر مبني على السكون المقدر على الألف
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والجار والمجرور متعلقان بـ«تأتي»
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: مَا كُلُّ مَا يَتَمَنَّى الْمَرْءُ يُدْرِكُهُ
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - نافية مبنية على السكون لا عمل لها
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - اسم موصول مبني على السكون في محل جر مضاف إليه
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والجملة صلة الموصول
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - فعل مضارع مرفوع، والهاء ضمير متصل في محل نصب مفعول به، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  notes: يجوز إعمال «ما» عمل «ليس» عند الحجازيين، فيكون «كلُّ» اسمها والجملة خبرها، ولا يتغير التشكيل.
- text: أَنَا الَّذِي نَظَرَ الْأَعْمَى إِلَى أَدَبِي
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - ضمير منفصل مبني على السكون في محل رفع مبتدأ
    - اسم موصول مبني على السكون في محل رفع خبر
    - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
    - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
    - حرف جر مبني على السكون المقدر على الألف
    - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
- text: إِذَا غَامَرْتَ فِي شَرَفٍ مَرُومِ
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة في محل جر بالإضافة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره تنوين الكسر
    - نعت مجرور وعلامة جره الكسرة، وحذف التنوين لضرورة القافية
  notes: آخر البيت مكسور بلا تنوين للقافية (فلا تقنع بما دون النجومِ).
- text: قِفَا نَبْكِ مِنْ ذِكْرَى حَبِيبٍ وَمَنْزِلِ
  source: poetry
  author: امرؤ القيس
  level: 3
  irab:
    - فعل أمر مبني على حذف النون، والألف ضمير متصل في محل رفع فاعل
    - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر تقديره نحن
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - الواو عاطفة، و«منزل» معطوف مجرور وعلامة جره الكسرة
- text: السَّيْفُ أَصْدَقُ أَنْبَاءً مِنَ الْكُتُبِ
  source: poetry
  author: أبو تمام
  level: 2
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على وزن «أفعل»
    - تمييز منصوب وعلامة نصبه تنوين الفتح
    - حرف جر مبني على السكون، وحُرِّك بالفتح لالتقاء الساكنين
    - اسم مجرور وعلامة جره الكسرة الظاهرة
- text: هَلْ غَادَرَ الشُّعَرَاءُ مِنْ مُتَرَدَّمِ
  source: poetry
  author: عنترة بن شداد
  level: 3
  irab:
    - حرف استفهام مبني على السكون
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر زائد مبني على السكون
    - اسم مجرور لفظًا منصوب محلًا على أنه مفعول به
  notes: «مِن» زائدة، فـ«متردَّم» مفعول به في المعنى.
- text: وَمَنْ لَا يَتَّقِ الشَّتْمَ يُشْتَمِ
  source: poetry
  author: زهير بن أبي سلمى
  level: 3
  irab:
    - الواو استئنافية، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
    - نافية مبنية على السكون
    - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر تقديره هو
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل مضارع مبني للمجهول مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرِّك بالكسر للقافية
- text: غَيْرُ مُجْدٍ فِي مِلَّتِي وَاعْتِقَادِي
  source: poetry
  author: أبو العلاء المعري
  level: 3
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة (اسم منقوص)
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - الواو عاطفة، و«اعتقاد» معطوف مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم
  notes: صدر البيت، والخبر في العجز (نوحُ باكٍ ولا ترنّمُ شادِ).
- text: أَرَاكَ عَصِيَّ الدَّمْعِ شِيمَتُكَ الصَّبْرُ
  source: poetry
  author: أبو فراس الحمداني
  level: 3
  irab:
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والكاف ضمير متصل في محل نصب مفعول به أول، والفاعل ضمير مستتر تقديره أنا
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - خبر مرفوع وعلامة رفعه الضمة، والجملة الاسمية في محل نصب حال
- text: وَعَيْنُ الرِّضَا عَنْ كُلِّ عَيْبٍ كَلِيلَةٌ
  source: poetry
  author: الإمام الشافعي
  level: 3
  irab:
    - الواو بحسب ما قبلها، و«عين» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - خبر مرفوع وعلامة رفعه تنوين الضم
- text: دَعِ الْأَيَّامَ تَفْعَلُ مَا تَشَاءُ
  source: poetry
  author: الإمام الشافعي
  level: 2
  irab:
    - فعل أمر مبني على السكون، وحُرِّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره أنت
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل مضارع مرفوع، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب حال
    - اسم موصول مبني على السكون في محل نصب مفعول به
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة صلة الموصول
- text: وَإِنَّمَا الْأُمَمُ الْأَخْلَاقُ مَا بَقِيَتْ
  source: poetry
  author: أحمد شوقي
  level: 3
  irab:
    - الواو بحسب ما قبلها، و«إنما» كافّة ومكفوفة لا عمل لها
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة الظاهرة
    - مصدرية ظرفية مبنية على السكون
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي
- text: قُمْ لِلْمُعَلِّمِ وَفِّهِ التَّبْجِيلَا
  source: poetry
  author: أحمد شوقي
  level: 3
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - اللام حرف جر، و«المعلم» اسم مجرور وعلامة جره الكسرة
    - الواو عاطفة، و«وفِّ» فعل أمر مبني على حذف حرف العلة، والهاء ضمير متصل في محل نصب مفعول به أول
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، والألف للإطلاق
  notes: ألف الإطلاق في «التبجيلا» تجعل فتحة اللام اختيارية في التصحيح، كما في الحركة التي قبل حرف المد.

# ── Modern writers (credited quotations, still under copyright) ─────────────────────────────────
- text: عَلَى هَذِهِ الْأَرْضِ مَا يَسْتَحِقُّ الْحَيَاةَ
  source: poetry
  author: محمود درويش
  level: 2
  irab:
    - حرف جر مبني على السكون المقدر على الألف
    - اسم إشارة مبني على الكسر في محل جر، وشبه الجملة في محل رفع خبر مقدّم
    - بدل مجرور وعلامة جره الكسرة الظاهرة
    - اسم موصول مبني على السكون في محل رفع مبتدأ مؤخر
    - فعل مضارع مرفوع، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
- text: سَجِّلْ أَنَا عَرَبِيٌّ
  source: poetry
  author: محمود درويش
  level: 1
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - ضمير منفصل مبني على السكون في محل رفع مبتدأ
    - خبر مرفوع وعلامة رفعه تنوين الضم
  notes: في القصيدة تُقرأ «عربيْ» بالسكون للوقف؛ التشكيل هنا بالوصل.
- text: لِمَاذَا لَمْ تَدُقُّوا جُدْرَانَ الْخَزَّانِ؟
  source: literature
  author: غسان كنفاني
  ref: رجال في الشمس
  level: 3
  irab:
    - اللام حرف جر، و«ماذا» اسم استفهام مبني على السكون في محل جر
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: الْإِنْسَانُ فِي نِهَايَةِ الْأَمْرِ قَضِيَّةٌ
  source: literature
  author: غسان كنفاني
  ref: عائد إلى حيفا
  level: 2
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة معترضة
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - خبر مرفوع وعلامة رفعه تنوين الضم
  notes: تحقق من نص العبارة في الرواية (الإنسانُ، في نهاية الأمر، قضية).

# ── Harder MSA (original) ────────────────────────────────────────────────────────────────────────
- text: الْكِتَابَ قَرَأْتُهُ
  source: llm-reviewed
  level: 3
  alts:
    - الْكِتَابُ قَرَأْتُهُ
  irab:
    - مفعول به منصوب لفعل محذوف يفسره المذكور، تقديره «قرأتُ»، وعلامة نصبه الفتحة (اشتغال)
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير في محل رفع فاعل، والهاء ضمير في محل نصب مفعول به، والجملة تفسيرية لا محل لها
  notes: باب الاشتغال؛ يجوز الرفع على الابتداء، فأضفته بديلًا.
- text: الصِّدْقَ الصِّدْقَ
  source: llm-reviewed
  level: 3
  irab:
    - مفعول به منصوب لفعل محذوف تقديره «الزم» (إغراء) وعلامة نصبه الفتحة
    - توكيد لفظي منصوب وعلامة نصبه الفتحة
- text: إِيَّاكَ وَالْكَذِبَ
  source: llm-reviewed
  level: 3
  irab:
    - ضمير منفصل مبني على الفتح في محل نصب مفعول به لفعل محذوف تقديره «أحذّر» (تحذير)
    - الواو عاطفة، و«الكذب» مفعول به منصوب لفعل محذوف تقديره «احذر» وعلامة نصبه الفتحة
- text: أُحِبُّ الْفَاكِهَةَ وَلَا سِيَّمَا الْعِنَبِ
  source: llm-reviewed
  level: 3
  alts:
    - أُحِبُّ الْفَاكِهَةَ وَلَا سِيَّمَا الْعِنَبُ
    - أُحِبُّ الْفَاكِهَةَ وَلَا سِيَّمَا الْعِنَبَ
  irab:
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - الواو اعتراضية، و«لا» نافية للجنس مبنية على السكون
    - «سيّ» اسم «لا» مبني على الفتح في محل نصب، و«ما» زائدة، وخبر «لا» محذوف
    - مضاف إليه مجرور وعلامة جره الكسرة (ويجوز رفعه خبرًا لمبتدأ محذوف، ونصبه مفعولًا لفعل محذوف)
  notes: «لا سيما» يجوز فيما بعدها الجر والرفع والنصب، فكلها مقبولة.
- text: كَمْ كِتَابٍ قَرَأْتُ!
  source: llm-reviewed
  level: 3
  irab:
    - خبرية مبنية على السكون في محل نصب مفعول به مقدّم
    - تمييز مجرور وعلامة جره تنوين الكسر
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  notes: «كم» الخبرية تمييزها مجرور، بخلاف الاستفهامية (كم كتابًا قرأت؟).
- text: قَرَأْتُ أَحَدَ عَشَرَ كِتَاباً
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - الجزء الأول من عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
    - الجزء الثاني من العدد المركب مبني على الفتح
    - تمييز منصوب وعلامة نصبه تنوين الفتح
- text: اشْتَرَيْتُ ثَلَاثَةَ كُتُبٍ
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
    - تمييز مجرور بالإضافة وعلامة جره تنوين الكسر
  notes: العدد من ٣ إلى ١٠ يخالف المعدود في التذكير والتأنيث.
- text: جَاءَ مُعَلِّمَا الْمَدْرَسَةِ
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الألف لأنه مثنى، وحذفت النون للإضافة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: زَارَنَا مُعَلِّمُو الْمَدْرَسَةِ
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على الفتح، و«نا» ضمير متصل مبني على السكون في محل نصب مفعول به
    - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم، وحذفت النون للإضافة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: صَلَّيْتُ فِي الْمَسَاجِدِ الْكَبِيرَةِ
  source: llm-reviewed
  level: 2
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة؛ يُجرّ الممنوع من الصرف بالكسرة إذا عُرِّف بـ«ال»
    - نعت مجرور وعلامة جره الكسرة الظاهرة
  notes: فخّ مقابل «في مساجدَ كثيرة» في الدفعة الأولى.
- text: أَعْلَمْتُ الطُّلَّابَ الِامْتِحَانَ سَهْلاً
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به أول منصوب وعلامة نصبه الفتحة
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة
    - مفعول به ثالث منصوب وعلامة نصبه تنوين الفتح
  notes: «أعلم» من الأفعال التي تنصب ثلاثة مفاعيل.
- text: رَأَيْتُ رَجُلاً كَرِيماً أَبُوهُ
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه تنوين الفتح
    - نعت سببي منصوب وعلامة نصبه تنوين الفتح
    - فاعل لاسم الفاعل «كريمًا» مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  notes: النعت السببي يتبع ما قبله في الإعراب، وما بعده مرفوع به.
- text: سِرْتُ وَالنَّهْرَ
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - الواو واو المعية، و«النهر» مفعول معه منصوب وعلامة نصبه الفتحة
- text: جَاءَ الطِّفْلُ يَبْكِي
  source: llm-reviewed
  level: 2
  irab:
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال
- text: أَكْرِمْ بِالْعِلْمِ!
  source: llm-reviewed
  level: 3
  irab:
    - فعل ماضٍ جاء على صورة الأمر لإنشاء التعجب مبني على السكون
    - الباء حرف جر زائد، و«العلم» فاعل مجرور لفظًا مرفوع محلًا
  notes: صيغة «أَفْعِلْ به» في التعجب.
- text: عَلِمْتُ أَنَّ الصِّدْقَ مَنْجَاةٌ
  source: llm-reviewed
  level: 2
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - حرف توكيد ونصب مبني على الفتح
    - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر «أنّ» مرفوع وعلامة رفعه تنوين الضم، والمصدر المؤول من «أنّ» ومعموليها سدّ مسدّ مفعولي «علم»
