# Batch 05: medium and hard sentences for three-sentence days, drafted by Claude for review.
# Quran excerpts are verbatim Tanzil text (checked with tools/shakkil/quran-excerpt.ts); poetry is
# public-domain classical verse; the rest are original sentences built around a specific rule.

# ── Medium ──────────────────────────────────────────────────────────────────────────────────────
- text: أُعْطِيَ الْفَائِزُ جَائِزَةً
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني للمجهول مبني على الفتح
    - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  notes: الفعل «أعطى» مبني للمجهول، ونائب الفاعل هو المفعول الأول في الأصل.
- text: مَا زِلْتُ أَتَذَكَّرُ ذٰلِكَ الْيَوْمَ
  level: 2
  source: llm-reviewed
  irab:
    - حرف نفي مبني على السكون
    - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «ما زال»
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا، والجملة في محل نصب خبر «ما زال»
    - اسم إشارة مبني على الفتح في محل نصب مفعول به، واللام للبعد والكاف للخطاب
    - بدل منصوب وعلامة نصبه الفتحة الظاهرة
- text: الطُّلَّابُ الْمُجْتَهِدُونَ نَاجِحُونَ
  level: 2
  source: llm-reviewed
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - نعت مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
    - خبر مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
- text: حَضَرَ الْمُدِيرُ نَفْسُهُ
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - توكيد معنوي مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
- text: سَافَرَ أَخُو مُحَمَّدٍ أَمْسِ
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - ظرف زمان مبني على الكسر في محل نصب
  notes: «أمسِ» مبنية على الكسر إذا أُريد بها اليوم الذي قبل يومك.
- text: قَابَلْتُ ذَا الْخُلُقِ الْكَرِيمِ
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - نعت مجرور وعلامة جره الكسرة الظاهرة
- text: كِلَا الطَّالِبَيْنِ مُجْتَهِدٌ
  level: 2
  source: llm-reviewed
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر لأنه أُضيف إلى اسم ظاهر، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى
    - خبر مرفوع وعلامة رفعه تنوين الضم
  notes: «كلا» تُعرب إعراب المقصور إذا أُضيفت إلى اسم ظاهر، وإعراب المثنى إذا أُضيفت إلى ضمير.
- text: يَا مُحَمَّدُ أَقْبِلْ
  level: 2
  source: llm-reviewed
  irab:
    - حرف نداء مبني على السكون
    - منادى علم مفرد مبني على الضم في محل نصب
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  notes: المنادى العلم المفرد يُبنى على الضم بلا تنوين.
- text: لَمْ يَسْعَ الْكَسُولُ إِلَى النَّجَاحِ
  level: 2
  source: llm-reviewed
  irab:
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
- text: لَنْ يَنْسَى الْأَوْفِيَاءُ أَصْدِقَاءَهُمْ
  level: 2
  source: llm-reviewed
  irab:
    - حرف نفي ونصب واستقبال مبني على السكون
    - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة المقدرة على الألف للتعذر
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
- text: عَادَ الْجُنُودُ ظَافِرِينَ
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - حال منصوبة وعلامة نصبها الياء لأنها جمع مذكر سالم
- text: هَؤُلَاءِ طُلَّابٌ مُجْتَهِدُونَ
  level: 2
  source: llm-reviewed
  irab:
    - اسم إشارة مبني على الكسر في محل رفع مبتدأ
    - خبر مرفوع وعلامة رفعه تنوين الضم
    - نعت مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
- text: أَحْسَنَ إِلَيْهِ إِحْسَاناً
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
    - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر
    - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
- text: اسْتَيْقَظْتُ مُبَكِّراً لِأُصَلِّيَ
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - حال منصوبة وعلامة نصبها تنوين الفتح
    - اللام لام التعليل، و«أصلي» فعل مضارع منصوب بـ«أن» المضمرة وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا
- text: كَأَنَّ الطُّلَّابَ بُنْيَانٌ مَرْصُوصٌ
  level: 2
  source: llm-reviewed
  irab:
    - حرف تشبيه ونصب مبني على الفتح
    - اسم «كأنّ» منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر «كأنّ» مرفوع وعلامة رفعه تنوين الضم
    - نعت مرفوع وعلامة رفعه تنوين الضم
- text: حَسِبْتُ الْأَمْرَ سَهْلاً
  level: 2
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
    - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
- text: وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ
  level: 2
  source: quran
  ref: سورة هود، الآية ٨٨
  irab:
    - الواو بحسب ما قبلها، و«ما» نافية مبنية على السكون
    - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - أداة حصر لا عمل لها
    - الباء حرف جر، ولفظ الجلالة اسم مجرور، وشبه الجملة في محل رفع خبر
- text: إِيَّاكَ نَعْبُدُ
  level: 2
  source: quran
  ref: سورة الفاتحة، الآية ٥
  irab:
    - ضمير منفصل مبني على الفتح في محل نصب مفعول به مقدّم
    - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره نحن
  notes: تقديم المفعول به يفيد الاختصاص.

# ── Hard ────────────────────────────────────────────────────────────────────────────────────────
- text: اشْتَرَيْتُ خَمْسَ عَشْرَةَ وَرْدَةً
  level: 3
  source: llm-reviewed
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - الجزء الأول من عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
    - الجزء الثاني من العدد المركب مبني على الفتح
    - تمييز منصوب وعلامة نصبه تنوين الفتح
  notes: الجزء الأول يخالف المعدود والثاني يوافقه، وتسكن شين «عشرة» مع المؤنث.
- text: مَا أَحْسَنَ أَنْ يَصْدُقَ الْمَرْءُ!
  level: 3
  source: llm-reviewed
  irab:
    - نكرة تامة بمعنى «شيء» مبنية على السكون في محل رفع مبتدأ
    - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
    - حرف مصدري ونصب مبني على السكون
    - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: حَبَّذَا الصِّدْقُ
  level: 3
  source: llm-reviewed
  irab:
    - «حبّ» فعل ماضٍ لإنشاء المدح مبني على الفتح، و«ذا» اسم إشارة مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر مقدّم
    - المخصوص بالمدح مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
- text: بِئْسَ الْخُلُقُ الْكَذِبُ
  level: 3
  source: llm-reviewed
  irab:
    - فعل ماضٍ جامد لإنشاء الذم مبني على الفتح
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل رفع خبر مقدّم
    - المخصوص بالذم مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
- text: لَا تَأْكُلِ السَّمَكَ وَتَشْرَبَ اللَّبَنَ
  level: 3
  source: llm-reviewed
  irab:
    - ناهية جازمة مبنية على السكون
    - فعل مضارع مجزوم بـ«لا» وعلامة جزمه السكون، وحُرِّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره أنت
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - واو المعية، و«تشرب» فعل مضارع منصوب بـ«أن» المضمرة بعد واو المعية وعلامة نصبه الفتحة
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  notes: نصب «تشربَ» يعني النهي عن الجمع بينهما؛ الجزم يعني النهي عن كليهما، والرفع يعني إباحة الشرب.
- text: ادْرُسْ تَنْجَحْ
  level: 3
  source: llm-reviewed
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
- text: لَوْ دَرَسْتَ لَنَجَحْتَ
  level: 3
  source: llm-reviewed
  irab:
    - حرف شرط غير جازم مبني على السكون
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة فعل الشرط
    - اللام واقعة في جواب «لو»، و«نجحت» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
  alts:
    - لَوْ دَرَسْتِ لَنَجَحْتِ
- text: أَمَّا الْعِلْمُ فَنُورٌ
  level: 3
  source: llm-reviewed
  irab:
    - حرف شرط وتفصيل وتوكيد مبني على السكون
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - الفاء واقعة في جواب «أمّا»، و«نور» خبر مرفوع وعلامة رفعه تنوين الضم
- text: مَا نَجَحَ إِلَّا خَالِدٌ
  level: 3
  source: llm-reviewed
  irab:
    - حرف نفي مبني على السكون
    - فعل ماضٍ مبني على الفتح
    - أداة حصر لا عمل لها
    - فاعل مرفوع وعلامة رفعه تنوين الضم
  notes: استثناء مفرّغ، فيُعرب ما بعد «إلا» بحسب موقعه (فاعل)؛ قارنه بـ«نجح الطلاب إلا خالدًا».
- text: كُنْ صَادِقاً تَسْلَمْ
  level: 3
  source: llm-reviewed
  irab:
    - فعل أمر ناقص مبني على السكون، واسمه ضمير مستتر تقديره أنت
    - خبر «كن» منصوب وعلامة نصبه تنوين الفتح
    - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
- text: إِنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ الْعُلَمَاءُ
  level: 3
  source: quran
  ref: سورة فاطر، الآية ٢٨
  irab:
    - كافّة ومكفوفة لا عمل لها
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
    - لفظ الجلالة مفعول به مقدّم منصوب وعلامة نصبه الفتحة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  notes: تقديم المفعول (اللهَ) وتأخير الفاعل (العلماءُ) فخّ مشهور.
- text: فَصَبْرٌ جَمِيلٌ
  level: 3
  source: quran
  ref: سورة يوسف، الآية ١٨
  irab:
    - الفاء بحسب ما قبلها، و«صبر» خبر لمبتدأ محذوف تقديره «أمري» مرفوع وعلامة رفعه تنوين الضم
    - نعت مرفوع وعلامة رفعه تنوين الضم
  notes: ويجوز إعراب «صبرٌ» مبتدأ خبره محذوف تقديره «أجمل».
- text: وَكَفَىٰ بِاللَّهِ شَهِيدًا
  level: 3
  source: quran
  ref: سورة النساء، الآية ٧٩
  irab:
    - الواو بحسب ما قبلها، و«كفى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
    - الباء حرف جر زائد، ولفظ الجلالة فاعل مجرور لفظًا مرفوع محلًا
    - تمييز منصوب وعلامة نصبه تنوين الفتح
- text: وَخَيْرُ جَلِيسٍ فِي الزَّمَانِ كِتَابُ
  level: 3
  source: poetry
  author: المتنبي
  alts:
    - وَخَيْرُ جَلِيسٍ فِي الزَّمَانِ كِتَابٌ
  irab:
    - الواو بحسب ما قبلها، و«خير» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة، وحُذف التنوين للقافية
  notes: في البيت «كتابُ» بلا تنوين للقافية؛ «كتابٌ» بديل مقبول.
- text: إِذَا أَنْتَ أَكْرَمْتَ الْكَرِيمَ مَلَكْتَهُ
  level: 3
  source: poetry
  author: المتنبي
  irab:
    - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
    - ضمير منفصل مبني على الفتح في محل رفع فاعل لفعل محذوف يفسره المذكور
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة تفسيرية لا محل لها
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة جواب الشرط لا محل لها
  notes: «إذا» لا يليها إلا فعل، فـ«أنت» فاعل لفعل محذوف (على رأي البصريين).
- text: مَا حَكَّ جِلْدَكَ مِثْلُ ظُفْرِكَ
  level: 3
  source: poetry
  author: الإمام الشافعي
  irab:
    - حرف نفي مبني على السكون
    - فعل ماضٍ مبني على الفتح
    - مفعول به مقدّم منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
    - فاعل مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  notes: المفعول «جلدَك» مقدّم على الفاعل «مثلُ».
- text: لِكُلِّ دَاءٍ دَوَاءٌ يُسْتَطَبُّ بِهِ
  level: 3
  source: poetry
  author: المتنبي
  irab:
    - اللام حرف جر، و«كل» اسم مجرور وهو مضاف، وشبه الجملة في محل رفع خبر مقدّم
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، والجملة في محل رفع نعت لـ«دواء»
    - الباء حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة في محل رفع نائب فاعل
- text: تَعَلَّمْ فَلَيْسَ الْمَرْءُ يُولَدُ عَالِماً
  level: 3
  source: poetry
  author: الإمام الشافعي
  irab:
    - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
    - الفاء تعليلية، و«ليس» فعل ماضٍ ناقص مبني على الفتح
    - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «ليس»
    - حال منصوبة وعلامة نصبها تنوين الفتح
- text: أَعَزُّ مَكَانٍ فِي الدُّنَى سَرْجُ سَابِحٍ
  level: 3
  source: poetry
  author: المتنبي
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، وهو ممنوع من الصرف على وزن «أفعل»
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
    - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
  notes: «الدُّنى» جمع «دنيا».
