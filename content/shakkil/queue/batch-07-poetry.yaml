# Batch 07 (poetry): 30 famous lines from classical, public-domain poets, drafted by Claude for review.
#
# Mix: 10 short (2–4 words), 10 medium (5–7), 10 long (8–12, usually a full bayt). Tashkeel and i'rab
# are Claude's; please check them, especially the items marked in notes. Lines already used in
# content/shakkil/puzzles (and their other hemistichs) are avoided, and so are poems known as songs.

# ── Short ───────────────────────────────────────────────────────────────────────────────────────
- text: هٰذَا جَنَاهُ أَبِي عَلَيَّ
  source: poetry
  author: أبو العلاء المعري
  level: 1
  notes: «أبي» من الأسماء الخمسة، لكنه أُضيف إلى ياء المتكلم فأُعرب بحركة مقدّرة لا بالواو.
  irab:
    - «ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل رفع مبتدأ
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والهاء ضمير متصل في محل نصب مفعول به مقدّم، والجملة في محل رفع خبر
    - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - «على» حرف جر، والياء ضمير متصل مبني على الفتح في محل جر
- text: اخْتِلَافُ النَّهَارِ وَاللَّيْلِ يُنْسِي
  source: poetry
  author: أحمد شوقي
  ref: السينية الأندلسية
  level: 1
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«الليل» معطوف مجرور وعلامة جره الكسرة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
- text: رَأَيْتُ الْمَنَايَا خَبْطَ عَشْوَاءَ
  source: poetry
  author: زهير بن أبي سلمى
  ref: المعلقة
  context: الشاعر يتحدث عن نفسه
  level: 1
  notes: «رأى» هنا قلبية تنصب مفعولين، وقيل بصرية و«خبط» حال.
  irab:
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به أول منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
    - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (ألف التأنيث الممدودة)
- text: وَحَنِينُهُ أَبَدًا لِأَوَّلِ مَنْزِلِ
  source: poetry
  author: أبو تمام
  level: 1
  notes: «منزلِ» في القافية فلم يُنوَّن.
  irab:
    - الواو حالية، و«حنين» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
    - اللام حرف جر، و«أول» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل رفع خبر
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: أَعَيْنَيَّ جُودَا وَلَا تَجْمُدَا
  source: poetry
  author: الخنساء
  ref: رثاء صخر
  level: 1
  irab:
    - الهمزة حرف نداء، و«عينيّ» منادى مضاف منصوب وعلامة نصبه الياء لأنه مثنى، وحُذفت النون للإضافة، وياء المتكلم ضمير متصل مبني على الفتح في محل جر مضاف إليه
    - فعل أمر مبني على حذف النون، وألف الاثنين ضمير متصل في محل رفع فاعل
    - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
    - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وألف الاثنين ضمير متصل في محل رفع فاعل
- text: تُعَيِّرُنَا أَنَّا قَلِيلٌ عَدِيدُنَا
  source: poetry
  author: السموأل
  ref: اللامية
  level: 1
  notes: وقيل «عديدنا» مبتدأ مؤخر و«قليل» خبر مقدّم، والجملة خبر «أنّ».
  irab:
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، و«نا» ضمير متصل في محل نصب مفعول به
    - «أنّ» حرف توكيد ونصب، و«نا» ضمير متصل في محل نصب اسم «أنّ»، والمصدر المؤول منصوب بنزع الخافض (بأنّا)
    - خبر «أنّ» مرفوع وعلامة رفعه تنوين الضم
    - فاعل لـ«قليل» (صفة مشبهة) مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
- text: عَفَتِ الدِّيَارُ مَحَلُّهَا فَمُقَامُهَا
  source: poetry
  author: لبيد بن ربيعة
  ref: المعلقة
  level: 1
  irab:
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - بدل بعض من كل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
    - الفاء حرف عطف، و«مقام» معطوف مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
- text: الرَّأْيُ قَبْلَ شَجَاعَةِ الشُّجْعَانِ
  source: poetry
  author: المتنبي
  level: 1
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل رفع خبر
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
- text: إِنِّي ذَكَرْتُكِ بِالزَّهْرَاءِ مُشْتَاقًا
  source: poetry
  author: ابن زيدون
  context: الشاعر يخاطب امرأة (ولّادة)
  level: 1
  notes: «الزهراء» مدينة الزهراء قرب قرطبة.
  irab:
    - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والكاف ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
    - الباء حرف جر، و«الزهراء» اسم مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لأنه معرّف بـ«ال»
    - حال منصوب وعلامة نصبه تنوين الفتح
- text: الْأُمُّ مَدْرَسَةٌ إِذَا أَعْدَدْتَهَا
  source: poetry
  author: حافظ إبراهيم
  context: الخطاب لمذكّر
  level: 1
  notes: جواب «إذا» في الشطر الثاني «أعددتَ شعبًا طيّب الأعراق».
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - خبر مرفوع وعلامة رفعه تنوين الضم
    - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر بإضافة «إذا» إليها

# ── Medium ──────────────────────────────────────────────────────────────────────────────────────
- text: لِكُلِّ امْرِئٍ مِنْ دَهْرِهِ مَا تَعَوَّدَا
  source: poetry
  author: المتنبي
  level: 2
  irab:
    - اللام حرف جر، و«كلّ» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل رفع خبر مقدّم
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - اسم موصول مبني على السكون في محل رفع مبتدأ مؤخر
    - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والألف للإطلاق، والجملة صلة الموصول لا محل لها
- text: عِيدٌ بِأَيَّةِ حَالٍ عُدْتَ يَا عِيدُ
  source: poetry
  author: المتنبي
  fixed: [عدت]
  level: 2
  notes: الخطاب للعيد في «يا عيدُ»، فالتاء مفتوحة. وقيل «عيدٌ» مبتدأ نكرة خبره محذوف.
  irab:
    - خبر لمبتدأ محذوف تقديره «هذا» مرفوع وعلامة رفعه تنوين الضم
    - الباء حرف جر، و«أيّة» اسم استفهام مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«عُدْتَ»
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - حرف نداء مبني على السكون
    - منادى نكرة مقصودة مبني على الضم في محل نصب
- text: أَلَا كُلُّ شَيْءٍ مَا خَلَا اللَّهَ بَاطِلُ
  source: poetry
  author: لبيد بن ربيعة
  level: 2
  notes: «باطلُ» في القافية فلم يُنوَّن.
  irab:
    - حرف استفتاح وتنبيه مبني على السكون
    - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - حرف مصدري مبني على السكون
    - فعل ماضٍ جامد للاستثناء مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر وجوبًا، والمصدر المؤول في محل نصب حال
    - لفظ الجلالة مفعول به (مستثنى بـ«ما خلا») منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة الظاهرة
- text: يَا دَارَ عَبْلَةَ بِالْجِوَاءِ تَكَلَّمِي
  source: poetry
  author: عنترة بن شداد
  ref: المعلقة
  level: 2
  irab:
    - حرف نداء مبني على السكون
    - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (علم مؤنث)
    - الباء حرف جر، و«الجواء» اسم مجرور وعلامة جره الكسرة الظاهرة
    - فعل أمر مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع فاعل
- text: بَانَتْ سُعَادُ فَقَلْبِي الْيَوْمَ مَتْبُولُ
  source: poetry
  author: كعب بن زهير
  ref: قصيدة البردة («بانت سعاد»)
  level: 2
  notes: «متبولُ» في القافية فلم يُنوَّن.
  irab:
    - فعل ماضٍ مبني على الفتح، والتاء للتأنيث
    - فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (علم مؤنث)
    - الفاء حرف عطف، و«قلب» مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة
    - خبر مرفوع وعلامة رفعه الضمة الظاهرة
- text: مَنْ يَفْعَلِ الْخَيْرَ لَا يَعْدَمْ جَوَازِيَهُ
  source: poetry
  author: الحطيئة
  level: 2
  irab:
    - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
    - فعل مضارع مجزوم بـ«من» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو، وهو فعل الشرط
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - حرف نفي مبني على السكون
    - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة على الياء، وهو ممنوع من الصرف (صيغة منتهى الجموع)، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
- text: أَضْحَى التَّنَائِي بَدِيلًا مِنْ تَدَانِينَا
  source: poetry
  author: ابن زيدون
  ref: النونية
  level: 2
  irab:
    - فعل ماضٍ ناقص مبني على الفتح المقدر على الألف للتعذر
    - اسم «أضحى» مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
    - خبر «أضحى» منصوب وعلامة نصبه تنوين الفتح
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
- text: وَلِلنَّاسِ فِيمَا يَعْشَقُونَ مَذَاهِبُ
  source: poetry
  author: أبو فراس الحمداني
  level: 2
  irab:
    - الواو حرف عطف، واللام حرف جر، و«الناس» اسم مجرور وعلامة جره الكسرة، وشبه الجملة في محل رفع خبر مقدّم
    - «في» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
    - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
    - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
- text: وَلَا حُزْنٌ يَدُومُ وَلَا سُرُورٌ
  source: poetry
  author: الإمام الشافعي
  level: 2
  notes: «لا» مهملة لتكرارها، ويجوز أن تكون عاملة عمل «ليس» و«حزن» اسمها وجملة «يدوم» خبرها.
  irab:
    - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
    - مبتدأ مرفوع وعلامة رفعه تنوين الضم
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
    - الواو حرف عطف، و«لا» حرف نفي مبني على السكون لتوكيد النفي
    - معطوف على «حزن» مرفوع وعلامة رفعه تنوين الضم
- text: وَلَيْلٍ كَمَوْجِ الْبَحْرِ أَرْخَى سُدُولَهُ
  source: poetry
  author: امرؤ القيس
  ref: المعلقة
  level: 2
  irab:
    - الواو واو «رُبّ»، و«ليل» مبتدأ مجرور لفظًا بـ«رُبّ» المحذوفة مرفوع محلًّا، وعلامة جره تنوين الكسر
    - الكاف حرف جر، و«موج» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل جر نعت لـ«ليل»
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
    - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه

# ── Long ────────────────────────────────────────────────────────────────────────────────────────
- text: وَالظُّلْمُ مِنْ شِيَمِ النُّفُوسِ فَإِنْ تَجِدْ ذَا عِفَّةٍ فَلِعِلَّةٍ لَا يَظْلِمُ
  source: poetry
  author: المتنبي
  level: 3
  irab:
    - الواو بحسب ما قبلها، و«الظلم» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة في محل رفع خبر
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - الفاء استئنافية، و«إن» حرف شرط جازم مبني على السكون
    - فعل مضارع مجزوم بـ«إن» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت، وهو فعل الشرط
    - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - الفاء رابطة لجواب الشرط، واللام حرف جر، و«علّة» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يظلم»
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة خبر لمبتدأ محذوف تقديره «فهو»، والجملة الاسمية في محل جزم جواب الشرط
- text: لِسَانُ الْفَتَى نِصْفٌ وَنِصْفٌ فُؤَادُهُ فَلَمْ يَبْقَ إِلَّا صُورَةُ اللَّحْمِ وَالدَّمِ
  source: poetry
  author: زهير بن أبي سلمى
  ref: المعلقة
  level: 3
  irab:
    - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
    - خبر مرفوع وعلامة رفعه تنوين الضم
    - الواو حرف عطف، و«نصف» خبر مقدّم مرفوع وعلامة رفعه تنوين الضم
    - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
    - الفاء حرف عطف، و«لم» حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، والفتحة قبلها دليل عليها
    - أداة حصر (استثناء مفرّغ) مبنية على السكون لا عمل لها
    - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - الواو حرف عطف، و«الدم» معطوف مجرور وعلامة جره الكسرة الظاهرة
- text: هَلَّا سَأَلْتِ الْخَيْلَ يَا ابْنَةَ مَالِكٍ إِنْ كُنْتِ جَاهِلَةً بِمَا لَمْ تَعْلَمِي
  source: poetry
  author: عنترة بن شداد
  ref: المعلقة
  fixed: [سألت, كنت]
  level: 3
  notes: الخطاب لـ«ابنة مالك» (عبلة)، ويحسمه «جاهلةً» و«تعلمي»، فالتاء مكسورة.
  irab:
    - حرف تحضيض مبني على السكون
    - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - حرف نداء مبني على السكون
    - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره تنوين الكسر
    - حرف شرط جازم مبني على السكون
    - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل في محل رفع اسم «كان»، وجواب الشرط محذوف دلّ عليه ما قبله
    - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
    - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
    - حرف نفي وجزم وقلب مبني على السكون
    - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
- text: أَلَا أَيُّهَا اللَّيْلُ الطَّوِيلُ أَلَا انْجَلِي بِصُبْحٍ وَمَا الْإِصْبَاحُ مِنْكَ بِأَمْثَلِ
  source: poetry
  author: امرؤ القيس
  ref: المعلقة
  fixed: [منك]
  level: 3
  notes: الخطاب لليل (مذكّر). «انجلي» أمر أصله «انجلِ» والياء للإشباع. «أمثل» ممنوع من الصرف فحقه الجر بالفتحة، وكُسر للروي.
  irab:
    - حرف استفتاح وتنبيه مبني على السكون
    - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب بحرف نداء محذوف، و«ها» حرف تنبيه
    - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
    - نعت مرفوع وعلامة رفعه الضمة الظاهرة
    - حرف استفتاح وتنبيه مبني على السكون
    - فعل أمر مبني على حذف حرف العلة، والياء للإشباع، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - الباء حرف جر، و«صبح» اسم مجرور وعلامة جره تنوين الكسر
    - الواو حالية، و«ما» حجازية تعمل عمل «ليس» مبنية على السكون
    - اسم «ما» مرفوع وعلامة رفعه الضمة الظاهرة
    - «من» حرف جر، والكاف ضمير متصل في محل جر
    - الباء حرف جر زائد، و«أمثل» خبر «ما» مجرور لفظًا منصوب محلًّا، وهو ممنوع من الصرف (وزن الفعل والوصفية)، وكُسر للروي
- text: أَتَاكَ الرَّبِيعُ الطَّلْقُ يَخْتَالُ ضَاحِكًا مِنَ الْحُسْنِ حَتَّى كَادَ أَنْ يَتَكَلَّمَا
  source: poetry
  author: البحتري
  context: الخطاب للممدوح (مذكّر)
  level: 3
  irab:
    - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والكاف ضمير متصل في محل نصب مفعول به
    - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
    - نعت مرفوع وعلامة رفعه الضمة الظاهرة
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال
    - حال من فاعل «يختال» منصوب وعلامة نصبه تنوين الفتح
    - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
    - اسم مجرور وعلامة جره الكسرة الظاهرة
    - حرف ابتداء وغاية مبني على السكون
    - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح، واسمه ضمير مستتر تقديره هو
    - حرف مصدري ونصب مبني على السكون
    - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والألف للإطلاق، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب خبر «كاد»
- text: خَفِّفِ الْوَطْءَ مَا أَظُنُّ أَدِيمَ الْأَرْضِ إِلَّا مِنْ هٰذِهِ الْأَجْسَادِ
  source: poetry
  author: أبو العلاء المعري
  ref: «غيرُ مجدٍ في ملّتي واعتقادي»
  context: الخطاب لمذكّر
  level: 3
  irab:
    - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
    - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
    - حرف نفي مبني على السكون
    - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا
    - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف
    - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
    - أداة حصر مبنية على السكون لا عمل لها
    - حرف جر مبني على السكون
    - اسم إشارة مبني على الكسر في محل جر، وشبه الجملة في محل نصب مفعول به ثانٍ لـ«أظنّ»
    - بدل من «هذه» مجرور وعلامة جره الكسرة الظاهرة
- text: سَيَذْكُرُنِي قَوْمِي إِذَا جَدَّ جِدُّهُمْ وَفِي اللَّيْلَةِ الظَّلْمَاءِ يُفْتَقَدُ الْبَدْرُ
  source: poetry
  author: أبو فراس الحمداني
  level: 3
  irab:
    - السين للاستقبال، و«يذكر» فعل مضارع مرفوع وعلامة رفعه الضمة، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
    - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
    - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم
    - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
    - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
    - الواو حرف عطف، و«في» حرف جر مبني على السكون
    - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«يُفتقد»
    - نعت مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لأنه معرّف بـ«ال»
    - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
    - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
- text: وَطَنِي لَوْ شُغِلْتُ بِالْخُلْدِ عَنْهُ نَازَعَتْنِي إِلَيْهِ فِي الْخُلْدِ نَفْسِي
