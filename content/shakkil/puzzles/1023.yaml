text: زَارَ الْوَفْدُ ثَلَاثَ مُدُنٍ عَرِيقَةٍ، دِمَشْقَ وَحَلَبَ وَحَمَاةَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف (العدد يخالف المعدود)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - نعت مجرور وعلامة جره تنوين الكسر
  - بدل من «ثلاث» منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (للعلمية والتأنيث)
  - الواو حرف عطف، و«حلب» معطوف منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (للعلمية والتأنيث)
  - الواو حرف عطف، و«حماة» معطوف منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (للعلمية والتأنيث)
alts:
  - زَارَ الْوَفْدُ ثَلَاثَ مُدُنٍ عَرِيقَةٍ، دِمَشْقُ وَحَلَبُ وَحَمَاةُ
