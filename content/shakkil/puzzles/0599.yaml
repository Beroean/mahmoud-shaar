text: وَفِي الْأَرْضِ مَنْأًى لِلْكَرِيمِ عَنِ الْأَذَى
irab:
  - الواو استئنافية، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو اسم مقصور منوّن
  - اللام حرف جر، و«الكريم» اسم مجرور وعلامة جره الكسرة
  - حرف جر مبني على السكون، وحُرِّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
alts: []
author: الشنفرى
source: poetry
ref: لامية العرب
