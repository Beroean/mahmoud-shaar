text: إِنَّ الَّذِينَ كَفَرُوا وَظَلَمُوا لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ طَرِيقًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«ظلموا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - لفظ الجلالة اسم «يكن» مرفوع وعلامة رفعه الضمة
  - اللام لام الجحود حرف جر، و«يغفر» فعل مضارع منصوب بأن مضمرة وجوبًا بعد لام الجحود وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر، وشبه الجملة متعلق بمحذوف خبر «يكن»، وجملة «لم يكن…» في محل رفع خبر «إنّ»
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يغفر»
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - اللام لام الجحود حرف جر، و«يهدي» فعل مضارع منصوب بأن مضمرة وجوبًا بعد لام الجحود وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 3
ref: سورة النساء، الآية ١٦٨
