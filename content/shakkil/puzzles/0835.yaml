text: إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والجملة جواب شرط غير جازم لا محل لها من الإعراب
  - «عن» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«انقطع»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - أداة استثناء مبنية على السكون، والمستثنى محذوف تقديره «عملًا»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وهو من ألفاظ العدد، وشبه الجملة متعلق بنعت للمستثنى المحذوف
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ١٦٣١
