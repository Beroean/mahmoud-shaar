text: تَفُتُّ فُؤَادَكَ الْأَيَّامُ فَتًّا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الشاعر يخاطب رجلًا يعظه
author: أبو إسحاق الإلبيري
source: poetry
ref: «تفت فؤادك الأيام فتا»
