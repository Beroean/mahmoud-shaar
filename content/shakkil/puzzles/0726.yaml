text: نِعْمَتِ الْهِوَايَةُ الْقِرَاءَةُ فِي أَوْقَاتِ الْفَرَاغِ
irab:
  - فعل ماضٍ جامد لإنشاء المدح مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - المخصوص بالمدح مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
