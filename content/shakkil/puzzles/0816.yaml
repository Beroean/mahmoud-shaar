text: قُلْ مَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ وَمَا أَنَا مِنَ الْمُتَكَلِّفِينَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - نافية مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا، و«كم» ضمير متصل في محل نصب مفعول به أول، والجملة في محل نصب مقول القول
  - «على» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«أسألكم»
  - حرف جر زائد مبني على السكون
  - اسم مجرور لفظًا وعلامة جره تنوين الكسر، منصوب محلًا مفعول به ثانٍ
  - الواو حرف عطف، و«ما» نافية مبنية على السكون
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة في محل رفع خبر
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 3
ref: سورة ص، الآية ٨٦
