text: لَا يَتَمَنَّيَنَّ أَحَدُكُمُ الْمَوْتَ مِنْ ضُرٍّ أَصَابَهُ
irab:
  - حرف نهي جازم مبني على السكون
  - فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة في محل جزم بـ«لا» الناهية، والنون حرف توكيد مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وضُمّت الميم لالتقاء الساكنين
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يتمنّينّ»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل جر نعت لـ«ضرّ»
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٦٧١
