text: يَا غُلَامُ سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ وَكُلْ مِمَّا يَلِيكَ
irab:
  - حرف نداء مبني على السكون
  - منادى نكرة مقصودة مبني على الضم في محل نصب
  - فعل أمر مبني على حذف حرف العلة (الياء)، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«كل» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«يمين» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«كل»
  - الواو حرف عطف، و«كل» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - «من» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«كل»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والكاف ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها من الإعراب
alts: []
fixed:
  - بيمينك
  - يليك
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٥٣٧٦
