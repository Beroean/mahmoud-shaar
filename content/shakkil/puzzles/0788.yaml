text: وَمَا خَلَقْنَا السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا لَاعِبِينَ
irab:
  - الواو استئنافية، و«ما» نافية مبنية على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
  - الواو حرف عطف، و«الأرض» اسم معطوف منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل نصب معطوف
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هما» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بصلة الموصول المحذوفة
  - حال من «نا» منصوبة وعلامة نصبها الياء لأنها جمع مذكر سالم
