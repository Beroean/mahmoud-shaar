text: هُوَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ
irab:
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الكسرة عوضًا عن الفتحة لأنه جمع مؤنث سالم
  - الواو حرف عطف، و«الأرض» معطوف على «السماوات» منصوب وعلامة نصبه الفتحة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف (العدد)، وشبه الجملة متعلق بـ«خلق»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر (تمييز العدد)
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«استوى»
