text: دَعْوَاهُمْ فِيهَا سُبْحَانَكَ اللَّهُمَّ وَتَحِيَّتُهُمْ فِيهَا سَلَامٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«دعواهم»
  - مفعول مطلق منصوب لفعل محذوف تقديره «نُسبّح»، وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه، والجملة في محل رفع خبر المبتدأ
  - منادى بأداة نداء محذوفة عُوّض عنها بالميم المشددة، مبني على الضم في محل نصب
  - الواو حرف عطف، و«تحية» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«تحيتهم»
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
context: الحديث عن أهل الجنة
source: quran
level: 3
ref: سورة يونس، الآية ١٠
