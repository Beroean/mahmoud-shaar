text: لِمَاذَا لَمْ تَدُقُّوا جُدْرَانَ الْخَزَّانِ؟
irab:
  - اللام حرف جر، و«ماذا» اسم استفهام مبني على السكون في محل جر
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: غسان كنفاني
source: literature
level: 3
ref: رجال في الشمس
