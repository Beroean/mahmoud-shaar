text: أَلَمْ تَفْهَمِي السُّؤَالَ؟
irab:
  - الهمزة حرف استفهام مبني على الفتح، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
