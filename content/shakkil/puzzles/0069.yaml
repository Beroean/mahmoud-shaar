text: الَّذِي يَقْرَأُ يَتَعَلَّمُ
irab:
  - اسم موصول مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
