text: مَنْ بَنَى مَسْجِدًا لِلَّهِ بَنَى اللَّهُ لَهُ فِي الْجَنَّةِ مِثْلَهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«بنى»
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم جواب الشرط
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«بنى»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«بنى»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٥٣٣
