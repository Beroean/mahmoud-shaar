text: شَارَكَتْ ثَلَاثُونَ مُتَطَوِّعَةً فِي تَنْظِيفِ الْحَدِيقَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم (من ألفاظ العقود)
  - تمييز العدد منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
