text: الْعَيْنُ حَقٌّ وَلَوْ كَانَ شَيْءٌ سَابَقَ الْقَدَرَ سَبَقَتْهُ الْعَيْنُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو استئنافية، و«لو» حرف شرط غير جازم (امتناع لامتناع) مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه تنوين الضم
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «كان»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والهاء ضمير متصل في محل نصب مفعول به مقدم، والجملة جواب «لو» لا محل لها
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢١٨٨
