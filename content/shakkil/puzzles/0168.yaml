text: إِنَّ الَّذِي يُقَالُ فِي الْخَفَاءِ أَدْمَى
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على السكون في محل نصب اسم «إنّ»
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو ممنوع من الصرف على وزن «أفعل»
alts: []
author: نزار قباني
source: poetry
