text: ثُمَّ كَانَ مِنَ الَّذِينَ آمَنُوا وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ
irab:
  - حرف عطف مبني على الفتح
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم موصول مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر «كان»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«تواصوا» فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - الباء حرف جر، و«الصبر» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تواصوا»
  - الواو حرف عطف، و«تواصوا» فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - الباء حرف جر، و«المرحمة» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تواصوا»
