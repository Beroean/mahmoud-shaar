text: كَانَ جَدِّي يَسْتَيْقِظُ قَبْلَ الْفَجْرِ لِيَسْقِيَ أَشْجَارَ الزَّيْتُونِ فِي الْحَقْلِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «كان»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اللام حرف جر للتعليل، و«يسقي» فعل مضارع منصوب بـ«أن» المضمرة بعد لام التعليل وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
