text: سَمِعْنَا صَدًى بَعِيدًا فِي الْوَادِي
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر (اسم مقصور منوّن)
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل (اسم منقوص)
