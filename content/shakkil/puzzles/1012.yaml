text: تَمْتَازُ الْقِطَطُ بِحَاسَّةِ شَمٍّ قَوِيَّةٍ تُمَكِّنُهَا مِنْ تَمْيِيزِ رَوَائِحَ كَثِيرَةٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«حاسة» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت لـ«حاسة» مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر نعت ثانٍ
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره تنوين الكسر
