text: لَا تُؤَجِّلُوا فَحْصَ سَيَّارَاتِكُمْ قَبْلَ السَّفَرِ، فَالْإِهْمَالُ قَدْ يُسَبِّبُ حَوَادِثَ خَطِيرَةً
irab:
  - «لا» الناهية حرف جزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء تعليلية، و«الإهمال» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف تقليل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة بلا تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت منصوب وعلامة نصبه تنوين الفتح
