text: فُتِحَتِ النَّوَافِذُ لِلتَّهْوِيَةِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«التهوية» اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - فُتِحَتِ النَّوَافِذُ
    - فَتَحْتُ النَّوَافِذَ
    - فَتَحْتَ النَّوَافِذَ
    - فَتَحْتِ النَّوَافِذَ
    - فَتَحَتِ النَّوَافِذَ
source: llm-reviewed
level: 2
