text: اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ ذَا الْجَلَالِ وَالْإِكْرَامِ
irab:
  - لفظ الجلالة منادى مبني على الضم في محل نصب، والميم المشددة عوض عن حرف النداء المحذوف
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«من» حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل
  - منادى بحرف نداء محذوف منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الإكرام» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - أنت
  - ومنك
  - تباركت
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٥٩١
