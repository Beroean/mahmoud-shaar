text: مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ ناقص مبني على الفتح في محل جزم فعل الشرط، واسمه ضمير مستتر تقديره هو
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «كان»
  - الباء حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«اليوم» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يقل» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والجملة في محل جزم جواب الشرط
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف عطف مبني على السكون
  - اللام لام الأمر، و«يصمت» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون. ضبطه النووي بضم الميم، وقال الطوفي «سمعناه بكسرها وهو القياس» (فتح الباري لابن حجر)
alts: []
vary:
  - [لِيَصْمُتْ, لِيَصْمِتْ]
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٠١٨
