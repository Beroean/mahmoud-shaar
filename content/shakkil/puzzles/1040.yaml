text: وَهُوَ الَّذِي مَدَّ الْأَرْضَ وَجَعَلَ فِيهَا رَوَاسِيَ وَأَنْهَارًا
irab:
  - الواو استئنافية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«جعل»
  - مفعول به منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف على صيغة منتهى الجموع
  - الواو حرف عطف، و«أنهارًا» معطوف على «رواسي» منصوب وعلامة نصبه تنوين الفتح
