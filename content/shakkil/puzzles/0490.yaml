text: تَحْتَفِلُ الْمَدِينَةُ بِعِيدِ تَأْسِيسِهَا كُلَّ عَامٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«عيد» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة لإضافته إلى الزمان، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
