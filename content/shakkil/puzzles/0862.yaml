text: أَلَا لَيْتَ شِعْرِي هَلْ أَبِيتَنَّ لَيْلَةً بِجَنْبِ الْغَضَى أُزْجِي الْقِلَاصَ النَّوَاجِيَا
irab:
  - حرف استفتاح وتنبيه مبني على السكون
  - حرف تمنٍّ ونصب مبني على الفتح
  - اسم «ليت» منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه، وخبر «ليت» محذوف وجوبًا
  - حرف استفهام مبني على السكون
  - فعل مضارع ناقص مبني على الفتح لاتصاله بنون التوكيد الثقيلة، واسمه ضمير مستتر تقديره أنا، والجملة في محل نصب مفعول به للمصدر «شعري»
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«جنب» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«أبيتنّ»
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا، والجملة في محل نصب خبر «بات»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة، والألف للإطلاق
alts: []
author: مالك بن الريب
source: poetry
level: 3
ref: «ألا ليت شعري هل أبيتنّ ليلةً» (يرثي نفسه)
