text: لَنْ نَخْرُجَ مَا دَامَتِ الْعَاصِفَةُ مُسْتَمِرَّةً
irab:
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - حرف مصدري ظرفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «ما دام» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «ما دام» منصوب وعلامة نصبه تنوين الفتح
