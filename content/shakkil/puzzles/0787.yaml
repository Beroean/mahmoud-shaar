text: وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا
irab:
  - الواو حرف عطف، و«رأى» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب حال من «الناس»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«يدخلون»
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - حال من الواو في «يدخلون» منصوبة وعلامة نصبها تنوين الفتح
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة النصر، الآية ٢
