text: لَا عَدْوَى وَلَا طِيَرَةَ وَلَا هَامَةَ وَلَا صَفَرَ
irab:
  - حرف نفي للجنس مبني على السكون
  - اسم «لا» النافية للجنس مبني على الفتح المقدر على الألف للتعذر في محل نصب، وخبرها محذوف
  - الواو حرف عطف، و«لا» نافية للجنس مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف
  - الواو حرف عطف، و«لا» نافية للجنس مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف
  - الواو حرف عطف، و«لا» نافية للجنس مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف
alts:
  - لَا عَدْوَى وَلَا طِيْرَةَ وَلَا هَامَةَ وَلَا صَفَرَ
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٧٥٧
