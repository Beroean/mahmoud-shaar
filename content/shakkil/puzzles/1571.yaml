text: أَلَا أُنَبِّئُكُمْ بِأَكْبَرِ الْكَبَائِرِ
irab:
  - حرف عرض وتنبيه مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا، و«كم» ضمير متصل مبني على السكون في محل نصب مفعول به
  - الباء حرف جر، و«أكبر» اسم مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (أفعل تفضيل) لكنه جُرّ بالكسرة لإضافته، وشبه الجملة متعلق بـ«أنبئكم»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٢٦٥٤
