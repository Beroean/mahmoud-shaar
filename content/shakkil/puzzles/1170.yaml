text: صَافَحْتُ أَخَا الْعَرِيسِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - صَافَحْتُ
    - صَافَحْتَ
    - صَافَحْتِ
source: llm-reviewed
