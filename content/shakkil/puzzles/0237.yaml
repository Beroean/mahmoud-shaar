text: اشْتَرَى أَبِي لِأُخْتِي الصَّغِيرَةِ ثَلَاثَ عَشْرَةَ قِصَّةً مُصَوَّرَةً
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - اللام حرف جر، و«أخت» اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - «ثلاث عشرة» عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
  - الجزء الثاني من العدد المركب، مبني على الفتح
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
