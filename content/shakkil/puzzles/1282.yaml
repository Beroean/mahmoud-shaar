text: فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا
irab:
  - الفاء الفصيحة، و«مهّل» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«هم» ضمير متصل في محل نصب مفعول به، والجملة توكيد لما قبلها
  - صفة لمفعول مطلق محذوف منصوبة وعلامة نصبها تنوين الفتح
alts: []
context: الله تعالى يخاطب النبي ﷺ
source: quran
level: 2
ref: سورة الطارق، الآية ١٧
