text: أَرَى الدَّلِيلُ الْمُتَسَلِّقِينَ الْمَمَرَّ آمِنًا
irab:
  - فعل ماضٍ ينصب ثلاثة مفاعيل مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثالث منصوب وعلامة نصبه تنوين الفتح
