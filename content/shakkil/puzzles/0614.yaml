text: وَإِنَّ صَخْرًا لَتَأْتَمُّ الْهُدَاةُ بِهِ كَأَنَّهُ عَلَمٌ فِي رَأْسِهِ نَارُ
irab:
  - الواو عاطفة، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه تنوين الفتح
  - اللام المزحلقة، و«تأتمّ» فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر «إنّ»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«تأتمّ»
  - «كأنّ» حرف تشبيه ونصب، والهاء ضمير متصل في محل نصب اسم «كأنّ»
  - خبر «كأنّ» مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، والجملة في محل رفع نعت لـ«علم»
