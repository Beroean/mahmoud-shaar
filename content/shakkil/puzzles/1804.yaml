text: وَلَقَدْ أَرْسَلْنَا نُوحًا وَإِبْرَاهِيمَ وَجَعَلْنَا فِي ذُرِّيَّتِهِمَا النُّبُوَّةَ وَالْكِتَابَ
irab:
  - الواو استئنافية، واللام واقعة في جواب قسم محذوف، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والجملة جواب القسم لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«إبراهيم» اسم معطوف منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف للعلمية والعجمة
  - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هما» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«جعلنا»
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«الكتاب» اسم معطوف منصوب وعلامة نصبه الفتحة
