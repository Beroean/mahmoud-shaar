text: الْحَيَاءُ لَا يَأْتِي إِلاَّ بِخَيْرٍ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - أداة حصر (استثناء مفرّغ) مبنية على السكون
  - الباء حرف جر، و«خير» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يأتي»
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٦١١٧
