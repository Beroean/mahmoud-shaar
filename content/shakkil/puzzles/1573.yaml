text: صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل مبني على السكون في محل رفع فاعل
  - الكاف حرف جر، و«ما» حرف مصدري، والمصدر المؤول مجرور بالكاف، وشبه الجملة متعلق بمحذوف مفعول مطلق
  - فعل ماضٍ مبني على السكون لاتصاله بضمير الرفع، و«تم» ضمير متصل في محل رفع فاعل، والواو للإشباع، والنون للوقاية، والياء ضمير متصل مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل نصب حال
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٦٣١
