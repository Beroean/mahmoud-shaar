text: يُنْصَحُ الْمُسَافِرُونَ إِلَى الْمُرْتَفَعَاتِ بِأَنْ يَصْعَدُوا تَدْرِيجِيًّا تَجَنُّبًا لِلْإِرْهَاقِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الباء حرف جر، و«أن» حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل جر بالباء
  - صفة لمصدر محذوف (نائب عن المفعول المطلق) منصوب وعلامة نصبه تنوين الفتح
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«الإرهاق» اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - يَنْصَحُ الْمُسَافِرُونَ إِلَى الْمُرْتَفَعَاتِ بِأَنْ يَصْعَدُوا تَدْرِيجِيًّا تَجَنُّبًا لِلْإِرْهَاقِ
source: llm-reviewed
level: 3
