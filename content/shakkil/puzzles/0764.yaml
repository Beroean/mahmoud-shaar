text: عِنْدَمَا يَحِلُّ الرَّبِيعُ تَمْتَلِئُ الْحُقُولُ بِأَزْهَارٍ حَمْرَاءَ وَصَفْرَاءَ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة، و«ما» مصدرية
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والمصدر المؤول في محل جر مضاف إليه
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«أزهار» اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (على وزن فعلاء)
  - الواو حرف عطف، و«صفراء» معطوف مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف
alts:
  - عِنْدَمَا يَحُلُّ الرَّبِيعُ تَمْتَلِئُ الْحُقُولُ بِأَزْهَارٍ حَمْرَاءَ وَصَفْرَاءَ
