text: سُرِقَتْ دَرَّاجَةُ سَمِيرٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
vary:
  - - سُرِقَتْ دَرَّاجَةُ
    - سَرَقْتُ دَرَّاجَةَ
    - سَرَقْتَ دَرَّاجَةَ
    - سَرَقْتِ دَرَّاجَةَ
    - سَرَقَتْ دَرَّاجَةَ
