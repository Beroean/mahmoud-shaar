text: أَعْلَنَتِ الْأَرْصَادُ أَنَّ الْعَاصِفَةَ قَادِمَةٌ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف توكيد ونصب مبني على الفتح
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «أنّ» مرفوع وعلامة رفعه تنوين الضم، والمصدر المؤول من «أنّ» ومعموليها في محل نصب مفعول به
