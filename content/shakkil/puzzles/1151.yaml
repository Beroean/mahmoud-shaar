text: أُنْقِذَ الْبَحَّارَانِ مِنَ الْغَرَقِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - أَنْقَذَ الْبَحَّارَانِ مِنَ الْغَرَقِ
source: llm-reviewed
