text: كُلُّ عَيْشٍ وَإِنْ تَطَاوَلَ دَهْرًا صَائِرٌ مَرَّةً إِلَى أَنْ يَزُولَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حالية، و«إنْ» حرف شرط وصلي مبني على السكون، وجواب الشرط محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح، متعلق بـ«تطاول»
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح، متعلق بـ«صائر»
  - حرف جر مبني على السكون
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والألف للإطلاق، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر بـ«إلى»، وشبه الجملة متعلق بـ«صائر»
alts: []
author: أمية بن أبي الصلت
source: poetry
level: 3
