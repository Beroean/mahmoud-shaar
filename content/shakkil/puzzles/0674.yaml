text: قُرِئَتِ الرِّسَالَةُ بِصَوْتٍ عَالٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«صوت» اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة لأنه اسم منقوص
