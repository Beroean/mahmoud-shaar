text: نَارُكُمْ جُزْءٌ مِنْ سَبْعِينَ جُزْءًا مِنْ نَارِ جَهَنَّمَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وهو من ألفاظ العقود في العدد، وشبه الجملة متعلق بمحذوف نعت لـ«جزء»
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف نعت لـ«سبعين»
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والتأنيث
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٣٢٦٥
