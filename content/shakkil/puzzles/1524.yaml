text: طَلَبَتِ الْمُعَلِّمَةُ مِنَ التَّلَامِيذِ أَنْ يَزْرَعُوا بُذُورًا فِي أَصِيصٍ وَيُرَاقِبُوهَا كُلَّ يَوْمٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«يراقبوا» فعل مضارع معطوف منصوب وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
