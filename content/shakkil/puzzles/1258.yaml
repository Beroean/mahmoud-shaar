text: إِنْ نَسِيتَ كَلِمَةَ الْمُرُورِ فَاضْغَطْ عَلَى الرَّابِطِ لِتَسْتَعِيدَهَا
irab:
  - حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل مبني في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، و«اضغط» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة في محل جزم جواب الشرط
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - اللام لام التعليل حرف جر، و«تستعيد» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«ها» ضمير متصل في محل نصب مفعول به
alts: []
fixed:
  - نسيت
