text: كَمْ جِسْرٍ عَبَرَهُ هٰذَا الْقِطَارُ!
irab:
  - «كم» الخبرية اسم مبني على السكون في محل رفع مبتدأ
  - تمييز «كم» الخبرية مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على الفتح، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر
  - اسم إشارة مبني على السكون في محل رفع فاعل
  - بدل من اسم الإشارة مرفوع وعلامة رفعه الضمة الظاهرة
