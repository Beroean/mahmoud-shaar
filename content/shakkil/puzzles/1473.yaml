text: يَا بَائِعَ الْعَسَلِ، كَمْ ثَمَنُ الْكِيسِ؟
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة الظاهرة
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - «كم» الاستفهامية اسم مبني على السكون في محل رفع خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
