text: فَمَا نَقُولُهُ لَيْسَ هُوَ الْحَصِيلَةَ
irab:
  - الفاء استئنافية، و«ما» اسم موصول مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مرفوع، والهاء ضمير متصل في محل نصب مفعول به، والفاعل ضمير مستتر تقديره نحن، والجملة صلة الموصول
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
  - ضمير فصل مبني على الفتح لا محل له من الإعراب
  - خبر «ليس» منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
author: نزار قباني
