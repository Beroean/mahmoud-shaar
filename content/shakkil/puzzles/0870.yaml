text: الْمُرَاجَعَةَ الْمُرَاجَعَةَ قَبْلَ الِامْتِحَانِ
irab:
  - مفعول به منصوب لفعل محذوف تقديره الزم (إغراء)، وعلامة نصبه الفتحة الظاهرة
  - توكيد لفظي منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - الْمُرَاجَعَةُ الْمُرَاجَعَةُ قَبْلَ الِامْتِحَانِ
source: llm-reviewed
