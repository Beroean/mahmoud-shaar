text: فَإِنَّكَ لَا تُسْمِعُ الْمَوْتَىٰ وَلَا تُسْمِعُ الصُّمَّ الدُّعَاءَ إِذَا وَلَّوْا مُدْبِرِينَ
irab:
  - الفاء استئنافية، و«إنّ» حرف توكيد ونصب مبني على الفتح، والكاف ضمير متصل مبني على الفتح في محل نصب اسم «إنّ»
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - الواو حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به أول منصوب وعلامة نصبه الفتحة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة
  - ظرف لما يُستقبل من الزمان مبني على السكون في محل نصب متعلق بـ«تُسمع»
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل جر بالإضافة
  - حال منصوبة وعلامة نصبها الياء لأنه جمع مذكر سالم
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 3
