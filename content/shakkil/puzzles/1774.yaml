text: إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
  - اللام المزحلقة للتوكيد، و«شديد» خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
alts: []
context: الخطاب للنبي ﷺ
source: quran
ref: سورة البروج، الآية ١٢
