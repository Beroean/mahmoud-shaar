text: وَلَسْتُ أَرَى السَّعَادَةَ جَمْعَ مَالٍ وَلَكِنَّ التَّقِيَّ هُوَ السَّعِيدُ
irab:
  - الواو استئنافية، و«ليس» فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «ليس»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره أنا، والجملة في محل نصب خبر «ليس»
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«لكنّ» حرف استدراك ونصب مبني على الفتح
  - اسم «لكنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - ضمير فصل مبني على الفتح لا محل له من الإعراب
  - خبر «لكنّ» مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
fixed:
  - ولست
author: الحطيئة
