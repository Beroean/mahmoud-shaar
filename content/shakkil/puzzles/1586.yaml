text: مَنْ نَسِيَ صَلَاةً فَلْيُصَلِّ إِذَا ذَكَرَهَا، لَا كَفَّارَةَ لَهَا إِلَّا ذَلِكَ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يصلّ» فعل مضارع مجزوم بلام الأمر وعلامة جزمه حذف حرف العلة (الياء)، والفاعل ضمير مستتر تقديره هو، والجملة في محل جزم جواب الشرط
  - ظرف لما يستقبل من الزمان مبني على السكون في محل نصب، متعلق بـ«فليصلّ»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر بإضافة «إذا» إليها
  - حرف نفي للجنس مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - اللام حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»
  - أداة حصر (استثناء ملغًى) مبنية على السكون
  - اسم إشارة مبني على السكون في محل رفع بدل من محل «لا» واسمها، واللام للبعد، والكاف حرف خطاب
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٥٩٧
