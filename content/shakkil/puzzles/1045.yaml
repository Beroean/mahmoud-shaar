text: وَلِسُلَيْمَانَ الرِّيحَ غُدُوُّهَا شَهْرٌ وَرَوَاحُهَا شَهْرٌ
irab:
  - الواو حرف عطف، واللام حرف جر، و«سليمان» اسم مجرور وعلامة جره الفتحة عوضًا عن الكسرة لأنه ممنوع من الصرف (علم زيدت فيه الألف والنون)، وشبه الجملة متعلق بالفعل المحذوف
  - مفعول به منصوب لفعل محذوف تقديره «وسخّرنا»، وعلامة نصبه الفتحة
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب حال من «الريح»
  - الواو حرف عطف، و«رواح» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم
