text: هَلْ مِنْ مَقْعَدٍ شَاغِرٍ فِي الْقِطَارِ؟
irab:
  - حرف استفهام مبني على السكون
  - حرف جر زائد مبني على السكون
  - مبتدأ مجرور لفظًا مرفوع محلًا، وعلامة جره تنوين الكسر
  - نعت مجرور على اللفظ وعلامة جره تنوين الكسر، ويجوز رفعه على المحل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر
alts:
  - هَلْ مِنْ مَقْعَدٍ شَاغِرٌ فِي الْقِطَارِ؟
source: llm-reviewed
