text: لَا تَرْمُوا النُّفَايَاتِ فِي الشَّارِعِ، بَلْ ضَعُوهَا فِي السِّلَالِ الْمُخَصَّصَةِ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف إضراب وابتداء مبني على السكون (لا يعطف لأن بعده جملة)
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا تَرْمُوا النِّفَايَاتِ فِي الشَّارِعِ، بَلْ ضَعُوهَا فِي السِّلَالِ الْمُخَصَّصَةِ
source: llm-reviewed
level: 3
