text: لَوْ لَمْ يُرْسِ الصَّيَّادُ قَارِبَهُ جَيِّدًا لَجَرَفَتْهُ الْأَمْوَاجُ بَعِيدًا
irab:
  - حرف شرط غير جازم مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة، والكسرة قبلها دليل عليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح
  - اللام واقعة في جواب «لو»، و«جرف» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث، والهاء ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
