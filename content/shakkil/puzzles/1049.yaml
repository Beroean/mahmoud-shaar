text: فَمَنَّ اللَّهُ عَلَيْنَا وَوَقَانَا عَذَابَ السَّمُومِ
irab:
  - الفاء حرف عطف، و«منّ» فعل ماضٍ مبني على الفتح
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - «على» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«منّ»
  - الواو حرف عطف، و«وقى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، و«نا» ضمير متصل مبني على السكون في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: أهل الجنة يتحدثون
