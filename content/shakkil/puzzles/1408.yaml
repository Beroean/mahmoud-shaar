text: الْغَوَّاصُونَ يَلْتَقِطُونَ الْمَحَارَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
