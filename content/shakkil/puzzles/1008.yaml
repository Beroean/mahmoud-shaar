text: اشْتَرَتِ الْبَلَدِيَّةُ ثَلَاثَ حَافِلَاتٍ كَهْرَبَائِيَّةٍ لِنَقْلِ طُلَّابِ الْمَدَارِسِ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف (العدد يخالف المعدود)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - نعت مجرور وعلامة جره تنوين الكسر
  - اللام حرف جر، و«نقل» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
