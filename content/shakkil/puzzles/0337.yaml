text: سَيَذْكُرُنِي قَوْمِي إِذَا جَدَّ جِدُّهُمْ وَفِي اللَّيْلَةِ الظَّلْمَاءِ يُفْتَقَدُ الْبَدْرُ
irab:
  - السين للاستقبال، و«يذكر» فعل مضارع مرفوع وعلامة رفعه الضمة، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«يُفتقد»
  - نعت مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لأنه معرّف بـ«ال»
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
