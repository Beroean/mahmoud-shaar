text: إِذَا هَطَلَ الْمَطَرُ ابْتَلَّتِ الشَّوَارِعُ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، وهو فعل الشرط، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة جواب الشرط لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
