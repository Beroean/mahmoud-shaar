text: نَحْنُ قَدَّرْنَا بَيْنَكُمُ الْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ
irab:
  - ضمير منفصل مبني على الضم في محل رفع مبتدأ
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وحُرّكت الميم بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«قدّرنا»
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«ما» نافية حجازية تعمل عمل «ليس» مبنية على السكون
  - ضمير منفصل مبني على الضم في محل رفع اسم «ما»
  - الباء حرف جر زائد، و«مسبوقين» اسم مجرور لفظًا وعلامة جره الياء لأنه جمع مذكر سالم، منصوب محلًا خبر «ما»
alts: []
source: quran
level: 3
ref: سورة الواقعة، الآية ٦٠
