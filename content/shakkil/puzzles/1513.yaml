text: صَارَ بِإِمْكَانِ الطَّالِبِ أَنْ يَتَعَلَّمَ لُغَةً جَدِيدَةً عَبْرَ تَطْبِيقَاتِ الْهَاتِفِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - الباء حرف جر، و«إمكان» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «صار» مقدم
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل رفع اسم «صار» مؤخر
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
