text: يَا مُوسَىٰ إِنَّهُ أَنَا اللَّهُ الْعَزِيزُ الْحَكِيمُ
irab:
  - حرف نداء مبني على السكون
  - منادى مفرد علم مبني على الضم المقدر على الألف للتعذر في محل نصب
  - «إنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير الشأن مبني على الضم في محل نصب اسم «إنّ»
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - لفظ الجلالة خبر مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر «إنّ»
  - نعت أول للفظ الجلالة مرفوع وعلامة رفعه الضمة
  - نعت ثانٍ مرفوع وعلامة رفعه الضمة
alts: []
context: نداء الله لموسى عليه السلام
source: quran
ref: سورة النمل، الآية ٩
