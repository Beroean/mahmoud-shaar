text: يَعْمَلُ الْمُمَرِّضُونَ فِي الْمُسْتَشْفَى لَيْلَ نَهَارَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - «ليل نهار» ظرف زمان مركب مبني على فتح الجزأين في محل نصب
  - الجزء الثاني من الظرف المركب مبني على الفتح لا محل له من الإعراب
alts:
  - يَعْمَلُ الْمُمَرِّضُونَ فِي الْمُسْتَشْفَى لَيْلَ نَهَارٍ
source: llm-reviewed
level: 2
