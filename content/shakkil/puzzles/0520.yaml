text: يَا أَيُّهَا الشَّبَابُ، اجْعَلُوا الْقِرَاءَةَ عَادَةً يَوْمِيَّةً فِي حَيَاتِكُمْ
irab:
  - حرف نداء مبني على السكون
  - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، وهو بمعنى «صيّر» ينصب مفعولين
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
