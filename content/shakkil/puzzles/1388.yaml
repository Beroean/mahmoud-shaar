text: أَشَابَ الصَّغِيرَ وَأَفْنَى الْكَبِيرَ كَرُّ الْغَدَاةِ وَمَرُّ الْعَشِيِّ
irab:
  - فعل ماضٍ مبني على الفتح، وفاعله ضمير مستتر يعود على «كرّ» من باب التنازع
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«أفنى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر لـ«أفنى» مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«مرّ» معطوف على «كرّ» مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
