text: إِنَّ الَّذِينَ أَجْرَمُوا كَانُوا مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «كان»، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم موصول مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«يضحكون»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
