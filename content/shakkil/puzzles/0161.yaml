text: وَاعْتِيَادِي عَلَى حُضُورِكِ أَصْعَبُ
irab:
  - الواو عاطفة، و«اعتيادي» مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء مضاف إليه
  - حرف جر مبني على السكون المقدر على الألف
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على وزن «أفعل»
