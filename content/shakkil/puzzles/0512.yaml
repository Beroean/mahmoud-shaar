text: تَقَعُ مَدِينَةُ حَلَبَ فِي شَمَالِ سُورِيَّةَ، وَهِيَ مِنْ أَقْدَمِ مُدُنِ الْعَالَمِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)
  - الواو استئنافية، و«هي» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة لأنه مضاف، وشبه الجملة في محل رفع خبر
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - تَقَعُ مَدِينَةُ حَلَبَ فِي شِمَالِ سُورِيَّةَ، وَهِيَ مِنْ أَقْدَمِ مُدُنِ الْعَالَمِ
source: llm-reviewed
level: 3
