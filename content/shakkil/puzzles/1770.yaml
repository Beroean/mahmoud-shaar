text: وَلَا يُؤْذَنُ لَهُمْ فَيَعْتَذِرُونَ
irab:
  - الواو حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة في محل رفع نائب فاعل
  - الفاء حرف عطف، و«يعتذرون» فعل مضارع مرفوع وعلامة رفعه ثبوت النون معطوف على «يؤذن»، والواو ضمير متصل مبني على السكون في محل رفع فاعل
alts: []
context: الحديث عن المكذّبين يوم القيامة
source: quran
level: 2
ref: سورة المرسلات، الآية ٣٦
