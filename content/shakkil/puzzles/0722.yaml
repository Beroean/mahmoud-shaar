text: يُدْعَى هٰذَا الطَّائِرُ أَبَا الْحِنَّاءِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - اسم إشارة مبني على السكون في محل رفع نائب فاعل
  - بدل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
