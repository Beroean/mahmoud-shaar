text: وَمَنْ يَكُ ذَا فَمٍ مُرٍّ مَرِيضٍ يَجِدْ مُرًّا بِهِ الْمَاءَ الزُّلَالَا
irab:
  - الواو بحسب ما قبلها، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع ناقص مجزوم بـ«من» وعلامة جزمه السكون على النون المحذوفة للتخفيف، واسمه ضمير مستتر تقديره هو
  - خبر «يكن» منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - نعت ثانٍ مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - مفعول به ثانٍ مقدّم منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«مُرًّا»
  - مفعول به أول مؤخر منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة، والألف للإطلاق
