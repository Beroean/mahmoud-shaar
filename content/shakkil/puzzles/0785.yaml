text: وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ
irab:
  - الواو حرف عطف، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والجملة في محل جر بإضافة «إذا» إليها
  - الفاء رابطة لجواب الشرط، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، وياء المتكلم المحذوفة ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر، وجملة «فهو يشفين» جواب شرط غير جازم لا محل لها
alts: []
context: من قول إبراهيم عليه السلام
source: quran
level: 2
ref: سورة الشعراء، الآية ٨٠
