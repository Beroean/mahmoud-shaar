text: أَجِدُ الْمَلَامَةَ فِي هَوَاكِ لَذِيذَةً حُبًّا لِذِكْرِكِ فَلْيَلُمْنِي اللُّوَّمُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، وهو من أفعال القلوب ينصب مفعولين، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، والكاف ضمير متصل مبني على الكسر في محل جر مضاف إليه، وشبه الجملة متعلق بـ«الملامة»
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«ذكر» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الكسر في محل جر مضاف إليه، وشبه الجملة متعلق بـ«حبًّا»
  - الفاء استئنافية، واللام لام الأمر، و«يلم» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، وحُذفت عينه لالتقاء الساكنين، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو جمع «لائم»
