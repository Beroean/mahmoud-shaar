text: لَا تَنْسَ دَوَاءَ الْمَسَاءِ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف حرف العلة، والفتحة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
