text: يَا وَيْلَتَىٰ لَيْتَنِي لَمْ أَتَّخِذْ فُلَانًا خَلِيلًا
irab:
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المنقلبة ألفًا، وهو مضاف، والياء المنقلبة ألفًا ضمير متصل في محل جر مضاف إليه
  - «ليت» حرف تمنٍّ ونصب مبني على الفتح، والنون للوقاية، والياء ضمير متصل مبني على السكون في محل نصب اسم «ليت»
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر «ليت»
  - مفعول به أول منصوب وعلامة نصبه تنوين الفتح
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
