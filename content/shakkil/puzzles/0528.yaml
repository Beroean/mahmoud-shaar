text: وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ
irab:
  - الواو حالية، و«الآخرة» مبتدأ مرفوع وعلامة رفعه الضمة
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب حال
  - الواو حرف عطف، و«أبقى» معطوف على «خير» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر (اسم تفضيل)
alts: []
source: quran
ref: سورة الأعلى، الآية ١٧
