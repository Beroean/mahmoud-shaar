text: وَتَفَقَّدَ الطَّيْرَ فَقَالَ مَا لِيَ لَا أَرَى الْهُدْهُدَ أَمْ كَانَ مِنَ الْغَائِبِينَ
irab:
  - الواو استئنافية، و«تفقّد» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الفاء حرف عطف، و«قال» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - اسم استفهام مبني على السكون في محل رفع مبتدأ
  - اللام حرف جر، والياء ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل نصب حال
  - مفعول به منصوب وعلامة نصبه الفتحة
  - حرف عطف منقطعة بمعنى «بل» مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بمحذوف خبر «كان»
alts: []
context: سليمان عليه السلام
source: quran
level: 3
ref: سورة النمل، الآية ٢٠
