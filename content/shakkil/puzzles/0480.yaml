text: شَاهَدَ الْأَطْفَالُ الدَّلَافِينَ تَقْفِزُ فِي الْمَاءِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب حال
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
