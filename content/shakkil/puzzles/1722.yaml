text: اسْتَعَارَتْ هِنْدٌ رِوَايَتَيْنِ مِنْ مَكْتَبَةِ الْجَامِعَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه تنوين الضم، ويجوز منعه من الصرف لأنه علم مؤنث ثلاثي ساكن الوسط
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - اسْتَعَارَتْ هِنْدُ رِوَايَتَيْنِ مِنْ مَكْتَبَةِ الْجَامِعَةِ
source: llm-reviewed
level: 2
