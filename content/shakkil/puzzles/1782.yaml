text: وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ
irab:
  - الواو حرف عطف، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والجملة في محل جر بالإضافة
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وحُرّكت الميم بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«قُرئ»
  - نائب فاعل مرفوع وعلامة رفعه الضمة
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
alts: []
context: الحديث عن الكافرين
source: quran
level: 3
ref: سورة الانشقاق، الآية ٢١
