text: فَإِذَا خِفْتِ عَلَيْهِ فَأَلْقِيهِ فِي الْيَمِّ وَلَا تَخَافِي وَلَا تَحْزَنِي
irab:
  - الفاء حرف عطف، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الكسر في محل رفع فاعل، والجملة في محل جر بإضافة «إذا» إليها
  - «على» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«خفت»
  - الفاء رابطة لجواب الشرط، و«ألقي» فعل أمر مبني على حذف النون، والياء ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة جواب شرط غير جازم لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«ألقيه»
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والياء ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والياء ضمير متصل في محل رفع فاعل
