text: جِئْتُ لِأُهَنِّئَ الْعَرُوسَيْنِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - اللام لام التعليل حرف جر، و«أهنئ» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
alts: []
fixed:
  - جئت
