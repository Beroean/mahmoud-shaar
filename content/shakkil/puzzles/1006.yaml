text: إِنَّ فِي التَّطَوُّعِ لَمُتْعَةً لَا يَعْرِفُهَا إِلَّا مَنْ جَرَّبَهَا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - اللام المزحلقة حرف توكيد مبني على الفتح، و«متعة» اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل نصب نعت لـ«متعة»
  - أداة حصر مبنية على السكون
  - اسم موصول مبني على السكون في محل رفع فاعل
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
