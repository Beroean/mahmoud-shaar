text: وَهِيَ الْأَيَّامُ لَا يَأْمَنُهَا حَازِمٌ يَأْخُذُ مِنْ يَوْمٍ لِغَدْ
irab:
  - الواو استئنافية، و«هي» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي مبني على السكون لا عمل له
  - فعل مضارع مرفوع وعلامة رفعه الضمة، و«ها» ضمير متصل في محل نصب مفعول به مقدم
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم، وجملة «لا يأمنها حازم» في محل رفع خبر ثانٍ
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع نعت لـ«حازم»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يأخذ»
  - اللام حرف جر، و«غد» اسم مجرور وعلامة جره الكسرة المقدرة منع من ظهورها السكون للوقف (القافية مقيّدة)، وشبه الجملة متعلق بـ«يأخذ»
alts: []
vary:
  - - لِغَدْ
    - لِغَدٍ
author: ابن هانئ الأندلسي
source: poetry
level: 2
ref: «وهب الدهر نفيسا فاسترد»
