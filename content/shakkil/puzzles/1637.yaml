text: وَمَنْ يَغْرِسِ الْمَعْرُوفَ يَجْنِ ثِمَارَهُ
irab:
  - الواو استئنافية، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف حرف العلة (الياء)، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
author: البهاء زهير
source: poetry
level: 3
ref: «أتتك ولم تبعد على عاشق مصر»
