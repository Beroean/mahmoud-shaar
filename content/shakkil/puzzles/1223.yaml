text: ظَلَّ الرَّسَّامُ يَتَأَمَّلُ الْغُرُوبَ سَاعَةً
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ظلّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «ظلّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
