text: يَقْضِي الْمُوَظَّفُونَ ثَمَانِيَ سَاعَاتٍ فِي الْعَمَلِ ثُمَّ يَعُودُونَ إِلَى بُيُوتِهِمْ مُتْعَبِينَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة على الياء، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
