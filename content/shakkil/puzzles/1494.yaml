text: الْمُتَطَوِّعُونَ الَّذِينَ يُنَظِّفُونَ الشَّوَاطِئَ يَسْتَحِقُّونَ الشُّكْرَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - اسم موصول مبني على الفتح في محل رفع نعت
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
