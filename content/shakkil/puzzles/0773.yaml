text: لَمْ يَعُدِ النَّاسُ يَكْتُبُونَ الرَّسَائِلَ بِأَيْدِيهِمْ كَمَا كَانُوا يَفْعَلُونَ قَدِيمًا
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الواو لالتقاء الساكنين، وحُرّك بالكسر لالتقاء الساكنين
  - اسم «يعد» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «يعد»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«أيدي» اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - الكاف حرف جر، و«ما» مصدرية
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «كان»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
