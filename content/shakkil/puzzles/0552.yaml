text: وَاذْكُرِ اسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا
irab:
  - الواو حرف عطف، و«اذكر» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«تبتّل» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«تبتّل»
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة المزمل، الآية ٨
