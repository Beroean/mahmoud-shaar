text: ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيمٌ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«التي» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«ادفع»
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)، والجملة صلة الموصول لا محل لها
  - الفاء حرف عطف، و«إذا» الفجائية حرف مبني على السكون
  - اسم موصول مبني على السكون في محل رفع مبتدأ
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر مقدم
  - الواو حرف عطف، و«بين» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم، والجملة صلة الموصول لا محل لها
  - «كأنّ» حرف تشبيه ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «كأنّ»
  - خبر «كأنّ» مرفوع وعلامة رفعه تنوين الضم، والجملة في محل رفع خبر المبتدأ «الذي»
  - نعت مرفوع وعلامة رفعه تنوين الضم
