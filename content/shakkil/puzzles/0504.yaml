text: مَا زَالَ الْعُلَمَاءُ يَبْحَثُونَ عَنْ عِلَاجٍ فَعَّالٍ لِهٰذَا الْمَرَضِ النَّادِرِ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ما زال» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «ما زال»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - اللام حرف جر، و«ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل جر
  - بدل من «هذا» مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
