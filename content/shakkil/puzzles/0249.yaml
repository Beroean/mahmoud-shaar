text: اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حالية، و«لو» حرف شرط غير جازم (وصلية) مبني على السكون
  - الباء حرف جر، و«شق» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بفعل محذوف تقديره «ولو اتقيتموها»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ١٤١٧
