text: الْمُتَشَبِّعُ بِمَا لَمْ يُعْطَ كَلَابِسِ ثَوْبَيْ زُورٍ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«المتشبع»
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - الكاف حرف جر، و«لابس» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٥٢١٩
