text: وَمَا الْمَالُ وَالْأَهْلُونَ إِلَّا وَدِيعَةٌ وَلَا بُدَّ يَوْمًا أَنْ تُرَدَّ الْوَدَائِعُ
irab:
  - الواو استئنافية، و«ما» حرف نفي مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«الأهلون» معطوف مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم
  - أداة حصر مبنية على السكون
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو استئنافية، و«لا» نافية للجنس مبنية على السكون
  - اسم «لا» النافية للجنس مبني على الفتح في محل نصب
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح، متعلق بـ«تُردّ»
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع مبني للمجهول منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول مجرور بحرف جر محذوف (من) متعلق بمحذوف خبر «لا»
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: لبيد بن ربيعة
source: poetry
level: 3
ref: «بلينا وما تبلى النجوم الطوالع»
