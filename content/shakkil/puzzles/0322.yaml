text: عِيدٌ بِأَيَّةِ حَالٍ عُدْتَ يَا عِيدُ
irab:
  - خبر لمبتدأ محذوف تقديره «هذا» مرفوع وعلامة رفعه تنوين الضم
  - الباء حرف جر، و«أيّة» اسم استفهام مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«عُدْتَ»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - حرف نداء مبني على السكون
  - منادى نكرة مقصودة مبني على الضم في محل نصب
alts: []
fixed:
  - عدت
author: المتنبي
source: poetry
level: 2
