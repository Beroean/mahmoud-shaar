text: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«عملوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الكسرة عوضًا عن الفتحة لأنه جمع مؤنث سالم
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل رفع خبر «إنّ»
  - نعت مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
