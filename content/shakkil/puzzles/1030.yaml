text: فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا
irab:
  - الفاء حرف عطف، و«ألهم» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل مبني على السكون في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«تقوى» معطوف على «فجور» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
alts: []
context: الفاعل هو الله تعالى، والضمير «ها» للنفس
source: quran
level: 2
ref: سورة الشمس، الآية ٨
