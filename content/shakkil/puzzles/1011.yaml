text: وَصَلَتْ جَمِيعُ الطَّلَبَاتِ فِي مَوْعِدِهَا إِلَّا طَلَبًا وَاحِدًا تَأَخَّرَ يَوْمَيْنِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف استثناء مبني على السكون
  - مستثنى منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب نعت ثانٍ لـ«طلبًا»
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الياء لأنه مثنى
