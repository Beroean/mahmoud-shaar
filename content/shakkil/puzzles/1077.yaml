text: خَيْرُ الصَّدَقَةِ مَا كَانَ عَنْ ظَهْرِ غِنًى
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «كان»
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة للتعذر، وهو اسم مقصور منوّن
