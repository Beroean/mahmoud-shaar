text: إِنَّ الْمَكْتَبَاتِ الْعَامَّةَ لَمْ تَعُدْ مَكَانًا لِلْقِرَاءَةِ فَحَسْبُ، بَلْ صَارَتْ مَرَاكِزَ ثَقَافِيَّةً
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون، واسمه ضمير مستتر تقديره هي، والجملة في محل رفع خبر «إنّ»
  - خبر «تعود» منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«القراءة» اسم مجرور وعلامة جره الكسرة الظاهرة
  - الفاء زائدة، و«حسب» اسم مبني على الضم لقطعه عن الإضافة في محل نصب حال
  - حرف إضراب وابتداء مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث، واسمه ضمير مستتر تقديره هي
  - خبر «صار» منصوب وعلامة نصبه الفتحة الظاهرة بلا تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت منصوب وعلامة نصبه تنوين الفتح
