text: وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ
irab:
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «إنّ»
  - اللام حرف جر للتعليل، و«حبّ» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«شديد»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - اللام المزحلقة للتوكيد، و«شديد» خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
alts: []
context: الضمير في «إنه» للإنسان
source: quran
level: 2
ref: سورة العاديات، الآية ٨
