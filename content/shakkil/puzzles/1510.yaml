text: أَيُّهَا الزُّوَّارُ، يُرْجَى إِغْلَاقُ الْهَوَاتِفِ قَبْلَ دُخُولِ قَاعَةِ الْعَرْضِ
irab:
  - منادى بحرف نداء محذوف، و«أيّ» نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
