text: قُلْ آمَنْتُ بِاللَّهِ فَاسْتَقِمْ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة في محل نصب مقول القول
  - الباء حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«آمنت»
  - الفاء حرف عطف، و«استقم» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
alts: []
fixed:
  - آمنت
source: hadith
ref: صحيح مسلم، الحديث ٣٨
