text: يَا عِبَادِيَ الَّذِينَ آمَنُوا إِنَّ أَرْضِي وَاسِعَةٌ فَإِيَّايَ فَاعْبُدُونِ
irab:
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل مبني على الفتح في محل جر مضاف إليه
  - اسم موصول مبني على الفتح في محل نصب نعت لـ«عبادي»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - الفاء رابطة لجواب شرط مقدر، و«إيّا» ضمير منفصل مبني على السكون في محل نصب مفعول به لفعل محذوف يفسره ما بعده، والياء حرف دالّ على المتكلم
  - الفاء زائدة للتوكيد، و«اعبدوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والنون للوقاية، وياء المتكلم المحذوفة ضمير متصل في محل نصب مفعول به
alts: []
context: الله تعالى يخاطب عباده المؤمنين
source: quran
level: 3
ref: سورة العنكبوت، الآية ٥٦
