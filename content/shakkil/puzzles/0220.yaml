text: رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ
irab:
  - منادى بحرف نداء محذوف منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - فعل دعاء مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - اللام حرف جر، والياء ضمير متصل مبني على السكون في محل جر
  - الواو حرف عطف، واللام حرف جر، و«والديّ» اسم مجرور وعلامة جره الياء لأنه مثنى، وحُذفت نونه للإضافة، وياء المتكلم ضمير مبني على الفتح في محل جر مضاف إليه
  - الواو حرف عطف، واللام حرف جر، و«المؤمنين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر مضاف إليه
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
