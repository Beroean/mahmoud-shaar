text: ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ
irab:
  - حرف عطف مبني على الفتح
  - اللام واقعة في جواب قسم مقدّر، و«تُسألُنّ» فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون المحذوفة لتوالي الأمثال، والواو المحذوفة لالتقاء الساكنين ضمير متصل في محل رفع نائب فاعل، والنون للتوكيد
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«إذ» ظرف مبني على السكون في محل جر مضاف إليه، وحُرّك بالكسر لالتقاء الساكنين، والتنوين عوض عن جملة محذوفة
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تُسألُنّ»
