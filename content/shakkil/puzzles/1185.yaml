text: امْتَلَأَ الدُّرْجُ بِأَشْيَاءَ قَدِيمَةٍ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«أشياء» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (ألف التأنيث الممدودة)
  - نعت مجرور وعلامة جره تنوين الكسر
