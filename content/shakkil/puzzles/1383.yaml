text: فَطَوَّعَتْ لَهُ نَفْسُهُ قَتْلَ أَخِيهِ فَقَتَلَهُ فَأَصْبَحَ مِنَ الْخَاسِرِينَ
irab:
  - الفاء حرف عطف، و«طوّع» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - اللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«طوّعت»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل مبني على الضم في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل مبني على الكسر في محل جر مضاف إليه
  - الفاء حرف عطف، و«قتل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به
  - الفاء حرف عطف، و«أصبح» فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بمحذوف خبر «أصبح»
