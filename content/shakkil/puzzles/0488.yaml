text: بُنِيَ هٰذَا الْجِسْرُ قَبْلَ مِئَةِ عَامٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - «ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل رفع نائب فاعل
  - بدل من «هذا» مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، وهو من ألفاظ العدد
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
