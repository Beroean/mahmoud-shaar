text: أَسْرَعَ الرَّجُلُ كَيْ يَلْحَقَ بِالْقِطَارِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«كي» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«القطار» اسم مجرور وعلامة جره الكسرة الظاهرة
