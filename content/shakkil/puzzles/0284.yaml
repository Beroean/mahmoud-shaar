text: لَمْ يَنْتَهِ الْعُمَّالُ مِنَ الْبِنَاءِ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الياء)، والكسرة قبلها دليل عليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - ينته
source: llm-reviewed
level: 3
