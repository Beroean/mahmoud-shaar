text: وَلَقَدْ فَتَنَّا سُلَيْمَانَ وَأَلْقَيْنَا عَلَىٰ كُرْسِيِّهِ جَسَدًا ثُمَّ أَنَابَ
irab:
  - الواو استئنافية، واللام واقعة في جواب قسم محذوف، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والجملة جواب القسم لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف للعلمية وزيادة الألف والنون
  - الواو حرف عطف، و«ألقى» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل مبني على الكسر في محل جر مضاف إليه، وشبه الجملة متعلق بـ«ألقينا»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
