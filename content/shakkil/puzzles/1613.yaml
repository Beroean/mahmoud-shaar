text: لَا يُقِيمُ الْعَزِيزُ بِالْبَلَدِ السَّهْلِ وَلَا يَنْفَعُ الذَّلِيلَ النَّجَاءُ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«البلد» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«يقيم»
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
