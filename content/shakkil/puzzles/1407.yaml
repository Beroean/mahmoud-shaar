text: أَبْكَرَ الْمُزَارِعُ لِيَجْمَعَ الْبَيْضَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام لام التعليل حرف جر، و«يجمع» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
