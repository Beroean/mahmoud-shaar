text: الْمُؤْمِنُ يَأْكُلُ فِي مِعًى وَاحِدٍ، وَالْكَافِرُ يَأْكُلُ فِي سَبْعَةِ أَمْعَاءٍ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - حرف جر مبني على السكون
  - اسم مقصور مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة لالتقاء الساكنين، وشبه الجملة متعلق بـ«يأكل»
  - نعت مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«الكافر» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وأُنّث العدد لأن مفرد المعدود «مِعًى» مذكر
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٥٣٩٣
