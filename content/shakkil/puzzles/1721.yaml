text: تُعَالَجُ الْكُسُورُ بِتَثْبِيتِ الْعَظْمِ أَسَابِيعَ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«تثبيت» اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
alts:
  - تُعَالِجُ الْكُسُورَ بِتَثْبِيتِ الْعَظْمِ أَسَابِيعَ
source: llm-reviewed
