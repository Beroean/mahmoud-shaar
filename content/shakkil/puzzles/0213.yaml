text: أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
irab:
  - حرف استفتاح وتنبيه مبني على السكون
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - حرف نفي مهمل مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه تنوين الضم
  - «على» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة في محل رفع خبر، والجملة في محل رفع خبر «إنّ»
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر المبتدأ
