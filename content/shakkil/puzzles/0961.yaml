text: كَمْ رِحْلَةٍ قَامَ بِهَا جَدِّي فِي شَبَابِهِ!
irab:
  - «كم» الخبرية اسم مبني على السكون في محل رفع مبتدأ
  - تمييز «كم» الخبرية مجرور بالإضافة وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على الفتح، والجملة في محل رفع خبر
  - الباء حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«قام»
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
