text: الْوَلَدُ لِلْفِرَاشِ وَلِلْعَاهِرِ الْحَجَرُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«الفراش» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر
  - الواو حرف عطف، واللام حرف جر، و«العاهر» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٦٧٤٩
