text: لَعَلَّ الْعُلَمَاءَ يَجِدُونَ طَرِيقَةً لِتَحْلِيَةِ مِيَاهِ الْبَحْرِ بِتَكَالِيفَ أَقَلَّ
irab:
  - حرف ترجٍّ ونصب مبني على الفتح
  - اسم «لعلّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «لعلّ»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«تحلية» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الباء حرف جر، و«تكاليف» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (اسم تفضيل على وزن أفعل)
