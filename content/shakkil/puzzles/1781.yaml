text: أَلْقِيَا فِي جَهَنَّمَ كُلَّ كَفَّارٍ عَنِيدٍ
irab:
  - فعل أمر مبني على حذف النون، والألف ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والتأنيث، وشبه الجملة متعلق بـ«ألقيا»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
context: ما يُقال يوم القيامة
source: quran
level: 2
ref: سورة ق، الآية ٢٤
