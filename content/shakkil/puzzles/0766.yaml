text: سَأَلَ الطِّفْلُ أُمَّهُ لِمَاذَا يَتَغَيَّرُ لَوْنُ السَّمَاءِ عِنْدَ الْغُرُوبِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - اللام حرف جر، و«ماذا» اسم استفهام مبني على السكون في محل جر، والجملة الاستفهامية في محل نصب مفعول به ثانٍ
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
