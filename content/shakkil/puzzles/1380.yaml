text: يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا جَاءَكُمُ الْمُؤْمِنَاتُ مُهَاجِرَاتٍ فَامْتَحِنُوهُنَّ
irab:
  - حرف نداء مبني على السكون
  - منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني على الفتح، و«كم» ضمير متصل مبني على السكون في محل نصب مفعول به مقدّم، وحُرّكت الميم بالضم لالتقاء الساكنين، والجملة في محل جر بالإضافة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة
  - حال منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
  - الفاء رابطة لجواب الشرط، و«امتحنوا» فعل أمر مبني على حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، و«هنّ» ضمير متصل مبني على الفتح في محل نصب مفعول به، والجملة جواب شرط غير جازم لا محل لها
alts: []
source: quran
level: 3
ref: سورة الممتحنة، الآية ١٠
