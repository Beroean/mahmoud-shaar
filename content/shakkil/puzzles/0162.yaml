text: إِنِّي عَشِقْتُكِ وَاتَّخَذْتُ قَرَارِي
irab:
  - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسمها
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير في محل رفع فاعل، والكاف ضمير في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
  - الواو عاطفة، و«اتخذتُ» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
