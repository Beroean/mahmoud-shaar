text: أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو يعود على «ربك»، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الفاء حرف عطف، و«آوى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والمفعول محذوف
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة الضحى، الآية ٦
