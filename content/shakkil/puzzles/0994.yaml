text: سَنَلْتَقِي حَيْثُ افْتَرَقْنَا أَوَّلَ مَرَّةٍ
irab:
  - السين حرف استقبال، و«نلتقي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - ظرف مكان مبني على الضم في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع فاعل، والجملة في محل جر بالإضافة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
