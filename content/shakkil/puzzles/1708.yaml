text: حِينَ يَشْتَدُّ الْحَرُّ يَلْجَأُ النَّاسُ إِلَى الظِّلِّ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، متعلق بـ«يلجأ»، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر مضاف إليه
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
