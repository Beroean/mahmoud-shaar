text: وَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَاهْجُرْهُمْ هَجْرًا جَمِيلًا
irab:
  - الواو حرف عطف، و«اصبر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«اصبر»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«اهجر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الخطاب للنبي ﷺ، والحديث عن المكذّبين
source: quran
level: 2
ref: سورة المزمل، الآية ١٠
