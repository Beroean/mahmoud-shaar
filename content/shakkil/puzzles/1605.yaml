text: فَإِمَّا أَنْ تَكُونَ أَخِي بِحَقٍّ فَأَعْرِفَ مِنْكَ غَثِّي مِنْ سَمِينِي
irab:
  - الفاء استئنافية، و«إمّا» حرف تفصيل مبني على السكون
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل رفع خبر لمبتدأ محذوف تقديره «الأمر»
  - فعل مضارع ناقص منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، واسمه ضمير مستتر وجوبًا تقديره أنت
  - خبر «تكون» منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«حق» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف حال
  - الفاء حرف عطف، و«أعرف» فعل مضارع معطوف على «تكون» منصوب وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - «من» حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«أعرف»
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أعرف»
