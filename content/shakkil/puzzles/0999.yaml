text: مَا كَانَ الْفَرِيقُ لِيَفُوزَ لَوْلَا تَعَاوُنُ لَاعِبِيهِ وَإِصْرَارُ مُدَرِّبِهِ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام لام الجحود حرف جر، و«يفوز» فعل مضارع منصوب بأن مضمرة وجوبًا بعد لام الجحود وعلامة نصبه الفتحة، والمصدر المؤول في محل جر، وشبه الجملة متعلق بمحذوف خبر «كان»
  - حرف امتناع لوجود مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، وخبره محذوف وجوبًا
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وحُذفت النون للإضافة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«إصرار» معطوف مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
