text: سُئِلَ الْمُتَسَابِقُ سُؤَالًا صَعْبًا
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح (ويجوز إعرابه مفعولًا مطلقًا مبيّنًا للنوع)
  - نعت منصوب وعلامة نصبه تنوين الفتح
