text: إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ
irab:
  - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - «إلى» حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«تبت»
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بمحذوف خبر «إنّ»
alts: []
context: الإنسان البارّ يدعو ربه إذا بلغ أربعين سنة
source: quran
level: 2
ref: سورة الأحقاف، الآية ١٥
