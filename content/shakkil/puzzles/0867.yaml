text: كَمْ لُغَةً يَتَحَدَّثُ بِهَا سُكَّانُ هٰذِهِ الْبِلَادِ؟
irab:
  - «كم» الاستفهامية اسم مبني على السكون في محل رفع مبتدأ
  - تمييز «كم» الاستفهامية منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل رفع خبر
  - الباء حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم إشارة مبني على الكسر في محل جر مضاف إليه
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة الظاهرة
