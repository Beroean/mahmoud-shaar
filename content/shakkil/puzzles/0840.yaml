text: يَهْرَمُ ابْنُ آدَمَ وَتَشِبُّ مِنْهُ اثْنَتَانِ، الْحِرْصُ عَلَى الْمَالِ، وَالْحِرْصُ عَلَى الْعُمُرِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والعجمة
  - الواو حرف عطف، و«تشبّ» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - «من» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«تشب»
  - فاعل مرفوع وعلامة رفعه الألف لأنه ملحق بالمثنى، وهو من ألفاظ العدد
  - بدل من «اثنتان» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«الحرص»
  - الواو حرف عطف، و«الحرص» اسم معطوف مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«الحرص»
