text: اشْتَرَكَ فِي الْمَارَاثُونِ الرِّجَالُ وَالنِّسَاءُ وَالْأَطْفَالُ
irab:
  - فعل ماضٍ مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«النساء» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«الأطفال» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
