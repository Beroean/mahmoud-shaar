text: لَمْ تَهْبِطِ الطَّائِرَةُ فِي مَوْعِدِهَا بِسَبَبِ الضَّبَابِ الْكَثِيفِ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«سبب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَمْ تَهْبُطِ الطَّائِرَةُ فِي مَوْعِدِهَا بِسَبَبِ الضَّبَابِ الْكَثِيفِ
source: llm-reviewed
level: 2
