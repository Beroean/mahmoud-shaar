text: مَا مِنْ طَالِبٍ اجْتَهَدَ طِيلَةَ الْعَامِ إِلَّا نَالَ مَا يَسْتَحِقُّهُ
irab:
  - حرف نفي مبني على السكون
  - حرف جر زائد مبني على السكون
  - اسم مجرور لفظًا مرفوع محلًا على أنه مبتدأ
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر نعت لـ«طالب»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - أداة حصر مبنية على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والهاء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
