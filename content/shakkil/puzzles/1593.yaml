text: وَبَعْضُ الْحِلْمِ عِنْدَ الْجَهْلِ لِلذِّلَّةِ إِذْعَانُ
irab:
  - الواو استئنافية، و«بعض» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، متعلق بمحذوف حال من «الحلم»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اللام حرف جر، و«الذلة» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«إذعان»
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، ولم يُنوَّن لأنه في القافية
alts: []
author: الفند الزماني
source: poetry
level: 2
