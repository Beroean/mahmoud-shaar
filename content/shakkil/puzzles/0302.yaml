text: نِعْمَ الرِّيَاضَةُ السِّبَاحَةُ، فَهِيَ تُقَوِّي الْعَضَلَاتِ وَتُرِيحُ الْأَعْصَابَ الْمُتْعَبَةَ
irab:
  - فعل ماضٍ جامد لإنشاء المدح مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - المخصوص بالمدح مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، والجملة قبله في محل رفع خبر مقدم
  - الفاء تعليلية، و«هي» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - الواو حرف عطف، و«تريح» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
