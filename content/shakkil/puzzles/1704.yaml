text: أَيَّ كِتَابٍ تَقْرَأْ تَتَعَلَّمْ مِنْهُ
irab:
  - اسم شرط جازم منصوب وعلامة نصبه الفتحة الظاهرة، مفعول به مقدم لـ«تقرأ»، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - «من» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر
