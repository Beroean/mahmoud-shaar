text: تَسْتَطِيعُ الْخَفَافِيشُ أَنْ تَطِيرَ فِي الظَّلَامِ دُونَ أَنْ تَصْطَدِمَ بِشَيْءٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول في محل جر مضاف إليه
  - الباء حرف جر، و«شيء» اسم مجرور وعلامة جره تنوين الكسر
