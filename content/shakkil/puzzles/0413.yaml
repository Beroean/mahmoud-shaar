text: أَصْغَى الْوَلَدُ إِلَى أَبِيهِ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
