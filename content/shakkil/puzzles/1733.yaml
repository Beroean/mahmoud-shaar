text: هٰذَانِ الْكِتَابَانِ مِنْ تَأْلِيفِ مُؤَرِّخٍ مَشْهُورٍ
irab:
  - اسم إشارة للمثنى مبني على الألف في محل رفع مبتدأ
  - بدل مرفوع وعلامة رفعه الألف لأنه مثنى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
