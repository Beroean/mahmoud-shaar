text: يَا قَوْمِ أُذْنِي لِبَعْضِ الْحَيِّ عَاشِقَةٌ وَالْأُذْنُ تَعْشَقُ قَبْلَ الْعَيْنِ أَحْيَانَا
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، والياء المحذوفة ضمير متصل في محل جر مضاف إليه
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - اللام حرف جر، و«بعض» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«عاشقة»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر المبتدأ مرفوع وعلامة رفعه تنوين الضم
  - الواو استئنافية، و«الأذن» مبتدأ مرفوع وعلامة رفعه الضمة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر المبتدأ
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، والألف للإطلاق
