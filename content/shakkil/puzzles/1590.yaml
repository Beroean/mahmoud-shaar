text: الرَّحِمُ مُعَلَّقَةٌ بِالْعَرْشِ تَقُولُ مَنْ وَصَلَنِي وَصَلَهُ اللَّهُ وَمَنْ قَطَعَنِي قَطَعَهُ اللَّهُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الباء حرف جر، و«العرش» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«معلقة»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب حال
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ، والجملة الشرطية في محل نصب مقول القول
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - لفظ الجلالة فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - لفظ الجلالة فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
