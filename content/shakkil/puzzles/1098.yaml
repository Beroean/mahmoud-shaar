text: مَا هٰذِهِ الدُّنْيَا بِدَارِ قَرَارِ
irab:
  - حرف نفي حجازي يعمل عمل «ليس» مبني على السكون
  - «ها» حرف تنبيه، و«ذه» اسم إشارة مبني على الكسر في محل رفع اسم «ما»
  - بدل من اسم الإشارة مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - الباء حرف جر زائد، و«دار» اسم مجرور لفظًا منصوب محلًّا خبر «ما»، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: أبو الحسن التهامي
source: poetry
level: 2
ref: «حكم المنية في البرية جاري»
