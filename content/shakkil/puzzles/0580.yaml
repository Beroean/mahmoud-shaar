text: الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو اسم تفضيل
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«خير»
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
alts: []
source: hadith
ref: صحيح البخاري، الحديث ١٤٢٩
