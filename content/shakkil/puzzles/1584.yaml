text: إِنَّ الشَّمْسَ وَالْقَمَرَ لَا يَنْكَسِفَانِ لِمَوْتِ أَحَدٍ وَلَا لِحَيَاتِهِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«القمر» معطوف منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، وألف الاثنين ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر، و«موت» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«ينكسفان»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - اللام حرف جر، و«حياة» اسم معطوف مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - لموت
source: hadith
level: 3
ref: صحيح البخاري، الحديث ١٠٤٣
