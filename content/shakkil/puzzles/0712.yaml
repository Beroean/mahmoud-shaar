text: ظَلَّتِ الْأَسْوَاقُ مُزْدَحِمَةً حَتَّى مُنْتَصَفِ اللَّيْلِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «ظلّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «ظلّ» منصوب وعلامة نصبه تنوين الفتح
  - حرف غاية وجر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
