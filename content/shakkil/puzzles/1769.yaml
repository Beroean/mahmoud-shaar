text: وَظَنَّ أَنَّهُ الْفِرَاقُ
irab:
  - الواو حرف عطف، و«ظنّ» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - «أنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «أنّ»
  - خبر «أنّ» مرفوع وعلامة رفعه الضمة، والمصدر المؤول من «أنّ» واسمها وخبرها سدّ مسدّ مفعولي «ظنّ»
alts: []
context: الحديث عن المحتضر
source: quran
ref: سورة القيامة، الآية ٢٨
