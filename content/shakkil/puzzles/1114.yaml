text: هَنِيئًا مَرِيئًا غَيْرَ دَاءٍ مُخَامِرٍ لِعَزَّةَ مِنْ أَعْرَاضِنَا مَا اسْتَحَلَّتِ
irab:
  - حال منصوب وعلامة نصبه تنوين الفتح، وعامله فعل محذوف (أي ثبت لها هنيئًا)
  - حال ثانية منصوبة وعلامة نصبها تنوين الفتح
  - حال ثالثة منصوبة وعلامة نصبها الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - اللام حرف جر، و«عزة» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)، وشبه الجملة متعلق بالفعل المحذوف
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف حال من «ما»
  - اسم موصول مبني على السكون في محل رفع فاعل للفعل المحذوف
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرِّكت بالكسر للقافية، والفاعل ضمير مستتر تقديره هي، والجملة صلة الموصول لا محل لها
alts: []
vary:
  - - اسْتَحَلَّتِ
    - اسْتَحَلَّتْ
author: كثير عزة
source: poetry
level: 3
ref: «خليليّ هذا ربع عزة فاعقلا»
