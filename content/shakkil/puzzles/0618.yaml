text: بَيْنَمَا كَانَتِ الْأُسْرَةُ تَتَنَاوَلُ الْعَشَاءَ انْقَطَعَ التَّيَّارُ الْكَهْرَبَائِيُّ فَجْأَةً
irab:
  - ظرف زمان مبني على الفتح في محل نصب، و«ما» زائدة
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «كان»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح (أي مفاجئًا)
