text: أَتَاكَ الرَّبِيعُ الطَّلْقُ يَخْتَالُ ضَاحِكًا مِنَ الْحُسْنِ حَتَّى كَادَ أَنْ يَتَكَلَّمَا
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والكاف ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال
  - حال من فاعل «يختال» منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والألف للإطلاق، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب خبر «كاد»
