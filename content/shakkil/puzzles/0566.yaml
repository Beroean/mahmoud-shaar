text: إِنَّنِي أَنَا اللَّهُ لَا إِلَـٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي
irab:
  - «إنّ» حرف توكيد ونصب، والنون للوقاية، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - ضمير فصل مبني على السكون لا محل له من الإعراب
  - لفظ الجلالة خبر «إنّ» مرفوع وعلامة رفعه الضمة
  - نافية للجنس مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف
  - أداة حصر لا عمل لها
  - ضمير منفصل مبني على السكون في محل رفع بدل من الضمير المستتر في خبر «لا» المحذوف
  - الفاء الفصيحة، و«اعبد» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - الواو حرف عطف، و«أقم» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة
  - اللام حرف جر للتعليل، و«ذكر» اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أقم»
alts: []
context: الخطاب لموسى عليه السلام
source: quran
level: 3
ref: سورة طه، الآية ١٤
