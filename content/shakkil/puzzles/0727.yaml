text: بِئْسَ الطَّالِبُ مَنْ يَغُشُّ فِي الِامْتِحَانِ
irab:
  - فعل ماضٍ جامد لإنشاء الذم مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل رفع مبتدأ مؤخر، وهو المخصوص بالذم
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
