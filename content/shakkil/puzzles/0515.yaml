text: يَحْتَاجُ النَّبَاتُ إِلَى الْمَاءِ وَالضَّوْءِ وَالْهَوَاءِ كَيْ يَنْمُوَ نُمُوًّا سَلِيمًا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الضوء» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الهواء» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«كي» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
