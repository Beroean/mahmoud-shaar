text: وَمَا لِيَ عِنْدَ الْبِيضِ يَا قَلْبِ حَاجَةٌ وَعِنْدَ الْقَنَا وَالْخَيْلِ وَاللَّيْلِ مَطْلَبُ
irab:
  - الواو استئنافية، و«ما» حرف نفي مبني على السكون لا عمل له لتقدّم الخبر
  - اللام حرف جر، والياء ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال من «حاجة»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء المحذوفة ضمير في محل جر مضاف إليه، ويجوز «يا قلبُ» منادى نكرة مقصودة مبنيًّا على الضم في محل نصب
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«عند» ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - الواو حرف عطف، و«الخيل» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الليل» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
vary:
  - - لِيَ
    - لِي
  - - قَلْبِ
    - قَلْبُ
author: الشريف الرضي
source: poetry
level: 3
ref: «لغام المطايا من رضابك أعذب»
