text: إِنَّمَا تُقَاسُ الْبُيُوتُ بِأَهْلِهَا
irab:
  - «إنّ» حرف توكيد مبني على الفتح، و«ما» كافة، و«إنما» أداة حصر
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«أهل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
