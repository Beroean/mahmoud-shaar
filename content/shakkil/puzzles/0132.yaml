text: دَعِ الْأَيَّامَ تَفْعَلُ مَا تَشَاءُ
irab:
  - فعل أمر مبني على السكون، وحُرِّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب حال
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة صلة الموصول
alts: []
author: الإمام الشافعي
source: poetry
level: 2
