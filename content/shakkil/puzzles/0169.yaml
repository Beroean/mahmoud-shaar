text: وَالَّذِي يُقَالُ فِي الْعَلَنِ دَخِيلَةٌ
irab:
  - الواو عاطفة، و«الذي» اسم موصول مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
author: نزار قباني
