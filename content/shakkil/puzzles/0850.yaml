text: وَمَا الْحُبُّ إِلَّا طَارِفٌ وَتَلِيدُ
irab:
  - الواو استئنافية، و«ما» حرف نفي مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - أداة حصر مبنية على السكون
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«تليد» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: جميل بثينة
source: poetry
level: 2
ref: «ألا ليت ريعان الشباب جديد»
