text: كُلُّ أُمَّتِي مُعَافًى إِلَّا الْمُجَاهِرِينَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بالحركة المناسبة، والياء ضمير متصل مبني على السكون في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على الألف المحذوفة للتعذر، وهو اسم مقصور منوَّن
  - أداة استثناء مبنية على السكون
  - مستثنى بـ«إلا» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٦٠٦٩
