text: فَازَتْ أُخْتِي بِالْجَائِزَةِ الْكُبْرَى
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«الجائزة» اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر (اسم تفضيل مؤنث مقصور)
