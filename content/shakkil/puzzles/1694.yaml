text: بِكَمْ تَبِيعُ الْبِطِّيخَ؟
irab:
  - الباء حرف جر، و«كم» اسم استفهام مبني على السكون في محل جر، وتمييزه محذوف، وشبه الجملة متعلق بـ«تبيع»
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
