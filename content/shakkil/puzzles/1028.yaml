text: سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى
irab:
  - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - نعت لـ«ربّ» مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
alts: []
context: الخطاب للنبي ﷺ
source: quran
ref: سورة الأعلى، الآية ١
