text: لَيْسَ مِنَ السَّهْلِ أَنْ يَتَعَلَّمَ الْمَرْءُ الْعَزْفَ عَلَى الْعُودِ فِي سَنَةٍ وَاحِدَةٍ
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول من «أن» والفعل في محل رفع اسم «ليس» مؤخر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
