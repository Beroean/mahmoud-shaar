text: إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث الساكنة، وحُرّكت بالكسر لالتقاء الساكنين، والجملة في محل جر بالإضافة
  - نائب فاعل مرفوع وعلامة رفعه الضمة
  - مفعول مطلق منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
alts: []
source: quran
level: 2
ref: سورة الزلزلة، الآية ١
