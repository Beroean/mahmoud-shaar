text: أَصْبَحَ مِنَ الضَّرُورِيِّ تَحْدِيثُ بَرَامِجِ الْحَاسُوبِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «أصبح» مقدم
  - اسم «أصبح» مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة لأنه مضاف، وهو ممنوع من الصرف (صيغة منتهى الجموع)
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
