text: مَنْ يُطِلِ الْجُلُوسَ أَمَامَ الْحَاسُوبِ يُتْعِبْ عَيْنَيْهِ وَظَهْرَهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُذفت ياؤه لالتقاء الساكنين، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى، وحُذفت النون للإضافة، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«ظهر» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
