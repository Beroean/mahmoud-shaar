text: إِذَا حَكَمَ الْحَاكِمُ فَاجْتَهَدَ ثُمَّ أَصَابَ فَلَهُ أَجْرَانِ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء حرف عطف، و«اجتهد» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - الفاء رابطة لجواب الشرط، واللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الألف لأنه مثنى، والجملة جواب الشرط لا محل لها
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٧٣٥٢
