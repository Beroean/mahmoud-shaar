text: لَا تَتْرُكُوا الْأَجْهِزَةَ الْكَهْرَبَائِيَّةَ مَوْصُولَةً بِالشَّاحِنِ بَعْدَ اكْتِمَالِ شَحْنِهَا
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - الباء حرف جر، و«الشاحن» اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
