text: ظَنَّ الْمُسَافِرُونَ الرِّحْلَةَ قَصِيرَةً، لَكِنَّهَا اسْتَغْرَقَتْ أَرْبَعَ عَشْرَةَ سَاعَةً
irab:
  - فعل ماضٍ مبني على الفتح، ينصب مفعولين
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - «لكنّ» حرف استدراك ونصب مبني على الفتح، و«ها» ضمير متصل في محل نصب اسم «لكنّ»
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «لكنّ»
  - «أربع عشرة» عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
  - الجزء الثاني من العدد المركب، مبني على الفتح
  - تمييز منصوب وعلامة نصبه تنوين الفتح
