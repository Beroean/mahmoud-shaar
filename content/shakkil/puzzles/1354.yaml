text: فَلَيْسَ يَسُودُ الْمَرْءُ إِلَّا بِنَفْسِهِ
irab:
  - الفاء استئنافية، و«ليس» فعل ماضٍ ناقص جامد مبني على الفتح، واسمه ضمير الشأن محذوف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، والجملة الفعلية في محل نصب خبر «ليس»
  - أداة حصر لا عمل لها
  - الباء حرف جر، و«نفس» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يسود»
alts: []
author: ابن الرومي
source: poetry
level: 2
ref: «وما الحسب الموروث لا در دره»
