text: إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال من فاعل «كفروا»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«المشركين» اسم معطوف على «أهل» مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - مضاف إليه مجرور وعلامة جره الفتحة عوضًا عن الكسرة لأنه ممنوع من الصرف للعلمية والتأنيث
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«خالدين»
