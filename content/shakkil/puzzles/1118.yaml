text: مَتَى تُسَافِرْ أُرَافِقْكَ
irab:
  - اسم شرط جازم مبني على السكون في محل نصب ظرف زمان
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا، والكاف ضمير متصل في محل نصب مفعول به
alts: []
fixed:
  - أرافقك
