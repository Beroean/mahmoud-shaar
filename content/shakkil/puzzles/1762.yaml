text: اشْتَرَتِ الْعَائِلَةُ أَلْوَاحًا شَمْسِيَّةً كَيْ تُخَفِّفَ فَاتُورَةَ الْكَهْرَبَاءِ الشَّهْرِيَّةَ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«كي» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت لـ«فاتورة» منصوب وعلامة نصبه الفتحة الظاهرة
