text: كَانَ فِي السُّوقِ الْقَدِيمِ دُكَّانٌ لِبَيْعِ الْعُطُورِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «كان» مقدم
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - اسم «كان» مؤخر مرفوع وعلامة رفعه تنوين الضم
  - اللام حرف جر، و«بيع» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
