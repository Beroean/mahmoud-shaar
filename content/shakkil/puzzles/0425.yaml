text: أَعْجَبَتْنِي الْحَدِيقَةُ أَزْهَارُهَا
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - بدل اشتمال مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
