text: مَعَ شِدَّةِ الْبَرْدِ ظَلَّ الصَّيَّادُونَ يَخْرُجُونَ إِلَى الْبَحْرِ كُلَّ فَجْرٍ
irab:
  - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ظلّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «ظلّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
