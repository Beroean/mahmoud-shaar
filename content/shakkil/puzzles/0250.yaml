text: خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«علّم» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٠٢٧
