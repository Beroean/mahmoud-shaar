text: إِذَا أَنْتَ أَكْرَمْتَ الْكَرِيمَ مَلَكْتَهُ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - ضمير منفصل مبني على الفتح في محل رفع فاعل لفعل محذوف يفسره المذكور
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة تفسيرية لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة جواب الشرط لا محل لها
