text: مَهْمَا ارْتَفَعَتْ أَسْعَارُ الْوَقُودِ فَلَنْ يَسْتَغْنِيَ النَّاسُ عَنِ التَّدْفِئَةِ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، و«لن» حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة الظاهرة، والجملة في محل جزم جواب الشرط
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
