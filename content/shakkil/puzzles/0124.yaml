text: إِذَا غَامَرْتَ فِي شَرَفٍ مَرُومِ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة في محل جر بالإضافة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الكسرة، وحذف التنوين لضرورة القافية
