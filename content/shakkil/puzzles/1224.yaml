text: يُعَدُّ الْبُرْتُقَالُ مَصْدَرًا غَنِيًّا بِالْفِيتَامِينَاتِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة (وهو المفعول الأول)
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«الفيتامينات» اسم مجرور وعلامة جره الكسرة الظاهرة
