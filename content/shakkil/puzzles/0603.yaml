text: أَنَا الْبَحْرُ فِي أَحْشَائِهِ الدُّرُّ كَامِنٌ فَهَلْ سَأَلُوا الْغَوَّاصَ عَنْ صَدَفَاتِي؟
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - خبر المبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«كامن»
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر المبتدأ «الدر» مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب حال من «البحر»
  - الفاء استئنافية، و«هل» حرف استفهام مبني على السكون
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
alts: []
author: حافظ إبراهيم
source: poetry
level: 3
ref: اللغة العربية تنعى حظها
