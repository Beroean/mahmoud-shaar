text: وَفَجَّرْنَا الْأَرْضَ عُيُونًا فَالْتَقَى الْمَاءُ عَلَىٰ أَمْرٍ قَدْ قُدِرَ
irab:
  - الواو حرف عطف، و«فجّر» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - الفاء حرف عطف، و«التقى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف حال من «الماء»
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني للمجهول مبني على الفتح، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل جر نعت لـ«أمر»
alts: []
context: الله تعالى يتحدث عن طوفان نوح
source: quran
level: 3
ref: سورة القمر، الآية ١٢
