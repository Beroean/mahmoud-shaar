text: إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَـٰئِكَ كَانَ عَنْهُ مَسْئُولًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«البصر» معطوف منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«الفؤاد» معطوف منصوب وعلامة نصبه الفتحة
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم إشارة مبني على الكسر في محل جر مضاف إليه، والكاف حرف خطاب
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - «عن» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة في محل رفع نائب فاعل لـ«مسئولًا»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح، وجملة «كان» في محل رفع خبر «كلّ»، وجملة «كلّ أولئك…» في محل رفع خبر «إنّ»
