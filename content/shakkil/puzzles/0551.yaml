text: الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا
irab:
  - اسم موصول مبني على السكون في محل رفع بدل من «الذي» في الآية السابقة
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«الحياة» معطوف منصوب وعلامة نصبه الفتحة
  - اللام لام التعليل، و«يبلو» فعل مضارع منصوب بـ«أن» المضمرة بعد لام التعليل وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
  - اسم استفهام مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)، والجملة في محل نصب سدّت مسدّ مفعول «يبلو» المعلّق بالاستفهام
  - تمييز منصوب وعلامة نصبه تنوين الفتح
