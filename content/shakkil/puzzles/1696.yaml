text: اسْتَيْقَظْنَا صَبَاحَ الْعِيدِ مُبَكِّرِينَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
