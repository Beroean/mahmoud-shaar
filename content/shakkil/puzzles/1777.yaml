text: إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدّم
  - اسم «إنّ» مؤخّر منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
alts: []
context: بعد ذكر الإنسان الذي يطغى إذا استغنى
source: quran
ref: سورة العلق، الآية ٨
