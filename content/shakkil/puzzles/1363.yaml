text: أَبَا بَكْرٍ دَعَوْتُكَ لَوْ أَجَبْتَا إِلَى مَا فِيهِ حَظُّكَ إِنْ عَقَلْتَا
irab:
  - منادى بحرف نداء محذوف منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به
  - حرف تمنٍّ مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والألف للإطلاق
  - حرف جر مبني على السكون
  - اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أجبتا»
  - «في» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه، والجملة صلة الموصول لا محل لها
  - حرف شرط جازم مبني على السكون، وجواب الشرط محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والألف للإطلاق
