text: وَاعْلَمُوا أَنَّ اللَّهَ يَحُولُ بَيْنَ الْمَرْءِ وَقَلْبِهِ وَأَنَّهُ إِلَيْهِ تُحْشَرُونَ
irab:
  - الواو حرف عطف، و«اعلموا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «أنّ» منصوب وعلامة نصبه الفتحة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بـ«يحول»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«قلب» اسم معطوف على «المرء» مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«أنّ» حرف توكيد ونصب، والهاء ضمير متصل مبني على الضم في محل نصب اسم «أنّ»
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«تحشرون»
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع نائب فاعل، والجملة في محل رفع خبر «أنّ»
