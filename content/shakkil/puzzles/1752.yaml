text: حَضَرَ الْمُؤْتَمَرَ عُلَمَاءُ مِنْ بُلْدَانٍ شَتَّى لِمُنَاقَشَةِ مُسْتَقْبَلِ الطَّاقَةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (مختوم بألف التأنيث الممدودة)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو ممنوع من الصرف (مختوم بألف التأنيث المقصورة)
  - اللام حرف جر، و«مناقشة» اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
