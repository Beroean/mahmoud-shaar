text: إِنْ تُرِيدُوا النَّجَاحَ فَلَا تُؤَجِّلُوا أَعْمَالَكُمْ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء رابطة لجواب الشرط، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل جزم جواب الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
