text: وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ
irab:
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به أول منصوب وعلامة نصبه الفتحة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تعثوا»
  - حال مؤكدة منصوبة وعلامة نصبها الياء لأنها جمع مذكر سالم
alts: []
context: من قول شعيب عليه السلام لقومه
source: quran
level: 3
ref: سورة الشعراء، الآية ١٨٣
