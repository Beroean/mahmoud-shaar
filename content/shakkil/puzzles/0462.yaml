text: لَنْ يُغْلَقَ الْمَتْحَفُ يَوْمَ السَّبْتِ
irab:
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع مبني للمجهول منصوب بـ«لن» وعلامة نصبه الفتحة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَنْ يُغْلِقَ الْمَتْحَفَ يَوْمَ السَّبْتِ
source: llm-reviewed
