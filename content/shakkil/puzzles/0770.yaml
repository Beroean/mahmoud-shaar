text: أُصِيبَ اللَّاعِبُ فِي كَاحِلِهِ فَغَادَرَ الْمَلْعَبَ مَحْمُولًا عَلَى نَقَّالَةٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الفاء حرف عطف، و«غادر» فعل ماضٍ مبني على الفتح
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح، وهي اسم مفعول
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
