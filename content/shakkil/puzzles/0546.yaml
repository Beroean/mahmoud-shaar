text: وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ
irab:
  - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«جعلنا»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
source: quran
level: 2
ref: سورة الأنبياء، الآية ٣٠
