text: بِئْسَ عَادَةً إِضَاعَةُ الْوَقْتِ أَمَامَ الشَّاشَاتِ
irab:
  - فعل ماضٍ جامد لإنشاء الذم مبني على الفتح، والفاعل ضمير مستتر تقديره هو يفسّره التمييز
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - المخصوص بالذم مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، وجملة «بئس عادةً» في محل رفع خبر مقدم
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
