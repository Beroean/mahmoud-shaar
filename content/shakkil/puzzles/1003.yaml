text: كَمْ مِنْ مُخْتَرِعٍ فَشِلَ مِرَارًا قَبْلَ أَنْ يَصِلَ إِلَى اخْتِرَاعِهِ الْعَظِيمِ!
irab:
  - «كم» الخبرية اسم مبني على السكون في محل رفع مبتدأ
  - حرف جر زائد مبني على السكون
  - تمييز «كم» الخبرية مجرور لفظًا منصوب محلًا، وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح
  - ظرف زمان منصوب وعلامة نصبه الفتحة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
