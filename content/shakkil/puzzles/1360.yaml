text: أَيُّهَا الشَّامِتُ الْمُعَيِّرُ بِالدَّهْرِ أَأَنْتَ الْمُبَرَّأُ الْمَوْفُورُ
irab:
  - منادى بحرف نداء محذوف، و«أيّ» نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - نعت لـ«أيّ» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
  - نعت ثانٍ مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«الدهر» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«المعيّر»
  - الهمزة للاستفهام الإنكاري، و«أنت» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
fixed:
  - أأنت
author: عدي بن زيد
source: poetry
level: 3
