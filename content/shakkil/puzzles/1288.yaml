text: إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ
irab:
  - بدل من «إيلاف» في الآية الأولى مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - مفعول به للمصدر «إيلاف» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الصيف» اسم معطوف على «الشتاء» مجرور وعلامة جره الكسرة
alts: []
context: تتمة «لإيلاف قريش»
source: quran
ref: سورة قريش، الآية ٢
