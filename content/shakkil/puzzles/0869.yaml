text: جَعَلَ الصِّغَارُ يُغَنُّونَ فِي الْحَافِلَةِ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «جعل» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «جعل»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
