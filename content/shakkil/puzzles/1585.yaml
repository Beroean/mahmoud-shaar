text: لَا تَسُبُّوا الْأَمْوَاتَ فَإِنَّهُمْ قَدْ أَفْضَوْا إِلَى مَا قَدَّمُوا
irab:
  - حرف نهي جازم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب، و«هم» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، وواو الجماعة ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون
  - اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أفضوا»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ١٣٩٣
