text: أَقُولُ لَهَا وَقَدْ طَارَتْ شَعَاعًا مِنَ الْأَبْطَالِ وَيْحَكِ لَنْ تُرَاعِي
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
  - اللام حرف جر، و«ها» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«أقول»
  - الواو حالية، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب حال
  - حال منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرِّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«طارت»
  - مفعول مطلق لفعل محذوف منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع مبني للمجهول منصوب بـ«لن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع نائب فاعل
alts: []
context: الشاعر يخاطب نفسه وقد فزعت في القتال
author: قطري بن الفجاءة
source: poetry
level: 3
ref: «أقول لها وقد طارت شعاعا»
