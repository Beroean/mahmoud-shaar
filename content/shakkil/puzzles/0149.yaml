text: صَلَّيْتُ فِي الْمَسَاجِدِ الْكَبِيرَةِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة؛ يُجرّ الممنوع من الصرف بالكسرة إذا عُرِّف بـ«ال»
  - نعت مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: غسان كنفاني
