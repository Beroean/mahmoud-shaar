text: إِنَّمَا الْعَاجِزُ مَنْ لَا يَسْتَبِدُّ
irab:
  - «إنّ» حرف توكيد مبني على الفتح، و«ما» كافة، و«إنما» أداة حصر
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل رفع خبر
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة (وتُسكَّن في القافية المقيّدة)، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
alts: []
author: عمر بن أبي ربيعة
source: poetry
level: 2
ref: «ليت هندًا أنجزتنا ما تعد»
