text: إِذَا زُرْتَ الْقَلْعَةَ الْأَثَرِيَّةَ فَاحْرِصْ عَلَى صُعُودِ بُرْجِهَا الْعَالِي
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني في محل رفع فاعل، والجملة في محل جر بالإضافة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء رابطة لجواب الشرط، و«احرص» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة المقدرة على الياء للثقل
alts: []
fixed:
  - زرت
