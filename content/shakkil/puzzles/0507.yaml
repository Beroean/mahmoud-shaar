text: لَنْ يَنْجَحَ الْمَشْرُوعُ مَا لَمْ يَتَعَاوَنْ جَمِيعُ أَعْضَاءِ اللَّجْنَةِ
irab:
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ظرفي مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والمصدر المؤول من «ما» والفعل في محل نصب ظرف زمان
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
