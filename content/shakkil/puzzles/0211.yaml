text: وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ
irab:
  - الواو بحسب ما قبلها، و«اصبر» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
alts: []
source: quran
level: 3
ref: سورة هود، الآية ١١٥
