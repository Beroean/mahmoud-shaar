text: حَيْثُمَا تَجْلِسْ أَجْلِسْ
irab:
  - اسم شرط جازم مبني على الضم في محل نصب ظرف مكان، و«ما» زائدة
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا
