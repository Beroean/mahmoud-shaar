text: مَا زِلْتُ أَتَذَكَّرُ ذٰلِكَ الْيَوْمَ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «ما زال»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا، والجملة في محل نصب خبر «ما زال»
  - اسم إشارة مبني على الفتح في محل نصب مفعول به، واللام للبعد والكاف للخطاب
  - بدل منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
fixed:
  - زلت
