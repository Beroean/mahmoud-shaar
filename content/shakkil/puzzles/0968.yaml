text: وَجَدَ الْبَاحِثُونَ الْمَخْطُوطَةَ أَقْدَمَ مِمَّا تَوَقَّعُوا
irab:
  - فعل ماضٍ مبني على الفتح، من أخوات «ظنّ» يفيد اليقين
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (للوصفية ووزن الفعل)
  - «من» حرف جر، و«ما» حرف مصدري مبني على السكون
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول من «ما» والفعل في محل جر بـ«من»
