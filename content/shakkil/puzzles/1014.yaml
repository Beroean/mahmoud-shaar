text: اعْتَادَ أَبِي أَنْ يَقْرَأَ الصَّحِيفَةَ وَهُوَ يَشْرَبُ قَهْوَتَهُ فِي الشُّرْفَةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حالية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر، والجملة الاسمية في محل نصب حال
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
