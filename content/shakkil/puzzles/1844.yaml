text: لَا تَثْقُلُ الدِّرْعُ إِلَّا عِنْدَ مُنْهَزِمِ
irab:
  - حرف نفي مبني على السكون لا عمل له
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، و«الدرع» مؤنثة لذلك أُنّث الفعل
  - أداة حصر لا عمل لها، والاستثناء مفرّغ
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة متعلق بـ«تثقل»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: ابن سهل الأندلسي
source: poetry
level: 2
ref: «لولا قضاؤك بين الحكم والحكم»
