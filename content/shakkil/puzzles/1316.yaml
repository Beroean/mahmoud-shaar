text: وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ
irab:
  - الواو حرف عطف، و«أمّا» حرف شرط وتفصيل مبني على السكون
  - اسم موصول مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«نهى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وشبه الجملة متعلق بـ«نهى»
alts: []
context: جواب «أمّا» في الآية التالية «فإن الجنة هي المأوى»
source: quran
level: 3
ref: سورة النازعات، الآية ٤٠
