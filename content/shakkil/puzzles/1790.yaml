text: نُمَتِّعُهُمْ قَلِيلًا ثُمَّ نَضْطَرُّهُمْ إِلَىٰ عَذَابٍ غَلِيظٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به
  - صفة لمصدر محذوف (تمتيعًا قليلًا) نائبة عن المفعول المطلق، منصوبة وعلامة نصبها تنوين الفتح
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«نضطرّ»
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
context: الحديث عن الكافرين
source: quran
level: 2
ref: سورة لقمان، الآية ٢٤
