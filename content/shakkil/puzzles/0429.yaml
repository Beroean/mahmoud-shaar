text: يَمْلِكُ جَدِّي خَمْسَ بَقَرَاتٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
