text: فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا
irab:
  - الفاء حرف عطف، و«قال» فعل ماضٍ مبني على الفتح
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«قال»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - مفعول به منصوب على التحذير لفعل محذوف تقديره «احذروا»، وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«سقيا» اسم معطوف على «ناقة» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
alts: []
context: صالح عليه السلام يحذّر قومه ثمود
source: quran
level: 3
ref: سورة الشمس، الآية ١٣
