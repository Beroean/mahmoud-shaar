text: حَضَرَ الْجَلْسَةَ قَاضٍ مُتَقَاعِدٌ
irab:
  - فعل ماضٍ مبني على الفتح
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لالتقاء الساكنين، منع من ظهورها الثقل (اسم منقوص منوّن)
  - نعت مرفوع وعلامة رفعه تنوين الضم
