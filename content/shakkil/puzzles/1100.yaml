text: لَا تَقُلْ أَصْلِي وَفَصْلِي أَبَدًا إِنَّمَا أَصْلُ الْفَتَى مَا قَدْ حَصَلْ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، وحُذفت الواو لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه، والخبر محذوف، والجملة في محل نصب مقول القول
  - الواو حرف عطف، و«فصلي» معطوف مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح، متعلق بـ«تقل»
  - «إنّ» حرف توكيد مبني على الفتح، و«ما» كافة، و«إنما» أداة حصر
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - اسم موصول مبني على السكون في محل رفع خبر
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح، وسُكِّن للوقف (القافية مقيّدة)، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
alts: []
vary:
  - - حَصَلْ
    - حَصَلَ
author: ابن الوردي
