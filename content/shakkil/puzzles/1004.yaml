text: سَيُبْنَى مُسْتَشْفًى جَدِيدٌ فِي الْحَيِّ الشَّرْقِيِّ خِلَالَ عَامَيْنِ
irab:
  - السين حرف استقبال، و«يُبنى» فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - نائب فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر
  - نعت مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى
