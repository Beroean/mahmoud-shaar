text: أَسْرَعْنَا كَيْ نَلْحَقَ بِالْحَافِلَةِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«كي» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - الباء حرف جر، و«الحافلة» اسم مجرور وعلامة جره الكسرة الظاهرة
