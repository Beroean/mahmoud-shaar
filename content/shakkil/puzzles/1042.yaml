text: وَهُوَ الَّذِي أَحْيَاكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ
irab:
  - الواو استئنافية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
alts: []
source: quran
level: 2
ref: سورة الحج، الآية ٦٦
