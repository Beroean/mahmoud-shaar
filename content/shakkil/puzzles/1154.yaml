text: الْحَذَرَ الْحَذَرَ مِنَ الْجَلِيدِ
irab:
  - مفعول به منصوب لفعل محذوف تقديره الزم (إغراء)، وعلامة نصبه الفتحة الظاهرة
  - توكيد لفظي منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - الْحَذَرُ الْحَذَرُ مِنَ الْجَلِيدِ
source: llm-reviewed
