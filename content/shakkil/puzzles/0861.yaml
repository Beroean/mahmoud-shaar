text: إِنَّ الشَّبَابَ وَالْفَرَاغَ وَالْجِدَةْ مَفْسَدَةٌ لِلْمَرْءِ أَيُّ مَفْسَدَةْ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«الفراغ» معطوف منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«الجدة» معطوف منصوب وعلامة نصبه الفتحة المقدرة منع من ظهورها السكون للوقف
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - اللام حرف جر، و«المرء» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«مفسدة»
  - نعت لـ«مفسدة» مرفوع وعلامة رفعه الضمة («أيّ» الدالة على الكمال)، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة منع من ظهورها السكون للوقف
alts:
  - إِنَّ الشَّبَابَ وَالْفَرَاغَ وَالْجِدَةْ مَفْسَدَةٌ لِلْمَرْءِ أَيُّ مَفْسَدَةٍ
vary:
  - - وَالْجِدَةْ
    - وَالْجِدَةَ
author: أبو العتاهية
source: poetry
level: 2
