text: إِنَّا، مَعْشَرَ الْخَبَّازِينَ، نَصْحُو قَبْلَ الْفَجْرِ
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - مفعول به منصوب على الاختصاص لفعل محذوف تقديره أخصّ، وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل رفع خبر «إنّ»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
