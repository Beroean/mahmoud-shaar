text: قُلْ إِنِّي لَا أَمْلِكُ لَكُمْ ضَرًّا وَلَا رَشَدًا
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - «إنّ» حرف توكيد ونصب مبني على الفتح، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»، والجملة في محل نصب مقول القول
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر، والكاف ضمير متصل مبني على الضم في محل جر، والميم علامة الجمع، وشبه الجملة متعلق بـ«أملك»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - اسم معطوف منصوب وعلامة نصبه تنوين الفتح
