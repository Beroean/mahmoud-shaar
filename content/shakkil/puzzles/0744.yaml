text: لَا يَعْرِفُ قِيمَةَ الْمَاءِ إِلَّا الْعَطْشَانُ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - أداة حصر مبنية على السكون
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
