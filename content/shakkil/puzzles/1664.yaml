text: إِنْ تَتَأَخَّرْ يَفُتْكَ الْقِطَارُ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُذفت عينه (الواو) لالتقاء الساكنين، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
fixed:
  - يفتك
source: llm-reviewed
level: 3
