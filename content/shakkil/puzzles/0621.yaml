text: كُلُّ مَنْ زَارَ الْمَدِينَةَ الْقَدِيمَةَ أُعْجِبَ بِأَسْوَاقِهَا الْمَسْقُوفَةِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني للمجهول مبني على الفتح، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - الباء حرف جر، و«أسواق» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
