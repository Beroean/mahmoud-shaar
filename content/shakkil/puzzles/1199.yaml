text: اقْتَرِبْ لِأُرِيَكَ الصُّورَةَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام لام التعليل حرف جر، و«أري» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والكاف ضمير متصل في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
fixed:
  - لأريك
