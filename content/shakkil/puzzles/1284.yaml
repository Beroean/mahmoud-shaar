text: قُلْ يَا أَيُّهَا الْكَافِرُونَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف نداء مبني على السكون
  - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
context: الله تعالى يأمر النبي ﷺ
source: quran
ref: سورة الكافرون، الآية ١
