text: أَوَلَيْسَ اللَّهُ بِأَعْلَمَ بِمَا فِي صُدُورِ الْعَالَمِينَ
irab:
  - الهمزة للاستفهام التقريري، والواو حرف عطف، و«ليس» فعل ماضٍ ناقص جامد مبني على الفتح
  - لفظ الجلالة اسم «ليس» مرفوع وعلامة رفعه الضمة
  - الباء حرف جر زائد، و«أعلم» اسم مجرور لفظًا وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف على وزن أفعل، منصوب محلًا خبر «ليس»
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أعلم»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف صلة الموصول
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
alts: []
source: quran
level: 3
ref: سورة العنكبوت، الآية ١٠
