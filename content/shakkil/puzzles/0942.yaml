text: تَعَافَى الْمَرْضَى خَلَا وَاحِدٍ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون يفيد الاستثناء (ولو كانت فعلًا لنُصب ما بعدها)
  - مستثنى مجرور بـ«خلا» وعلامة جره تنوين الكسر
