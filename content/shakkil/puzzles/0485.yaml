text: أَيُّهَا الرُّكَّابُ، ارْبِطُوا أَحْزِمَةَ الْأَمَانِ
irab:
  - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب بحرف نداء محذوف، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
