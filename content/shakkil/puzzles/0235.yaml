text: لَا يَسْلَمُ الشَّرَفُ الرَّفِيعُ مِنَ الْأَذَى حَتَّى يُرَاقَ عَلَى جَوَانِبِهِ الدَّمُ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - حرف غاية وجر مبني على السكون
  - فعل مضارع مبني للمجهول منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه الفتحة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (صيغة منتهى الجموع) لكنه جُرّ بالكسرة لأنه مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
