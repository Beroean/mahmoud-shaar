text: وَالدَّهْرُ لَيْسَ بِمَأْمُونٍ عَلَى بَشَرٍ
irab:
  - الواو استئنافية، و«الدهر» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ ناقص جامد مبني على الفتح، واسمه ضمير مستتر تقديره هو يعود على الدهر، وجملة «ليس بمأمون» في محل رفع خبر المبتدأ
  - الباء حرف جر زائد، و«مأمون» اسم مجرور لفظًا منصوب محلًّا خبر «ليس»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«مأمون»
alts: []
author: الشاب الظريف
source: poetry
level: 2
ref: «قف بالركائب أو سقها بترتيب»
