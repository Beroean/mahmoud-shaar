text: أَقِيمُوا بَنِي أُمِّي صُدُورَ مَطِيِّكُمْ فَإِنِّي إِلَى قَوْمٍ سِوَاكُمْ لَأَمْيَلُ
irab:
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - منادى بحرف نداء محذوف منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، و«كم» ضمير متصل في محل جر مضاف إليه
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب، والياء ضمير متصل في محل نصب اسم «إنّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«أميل»
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - اللام المزحلقة، و«أميل» خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو اسم تفضيل ممنوع من الصرف (الوصفية ووزن الفعل)
