text: الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو عاطفة، و«البنون» معطوف مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
alts: []
source: quran
level: 2
ref: سورة الكهف، الآية ٤٦
