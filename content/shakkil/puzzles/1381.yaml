text: فَلَا تَدْعُ مَعَ اللَّهِ إِلَـٰهًا آخَرَ فَتَكُونَ مِنَ الْمُعَذَّبِينَ
irab:
  - الفاء استئنافية، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - ظرف مكان منصوب وعلامة نصبه الفتحة متعلق بـ«تدع»، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة، وهو ممنوع من الصرف للوصفية ووزن أفعل
  - الفاء فاء السببية، و«تكون» فعل مضارع ناقص منصوب بأن مضمرة بعد فاء السببية وعلامة نصبه الفتحة، واسمه ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بمحذوف خبر «تكون»
