text: قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«نسك» معطوف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
  - الواو حرف عطف، و«محيا» معطوف منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، والياء ضمير مبني على الفتح في محل جر مضاف إليه
  - الواو حرف عطف، و«ممات» معطوف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء مضاف إليه
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة في محل رفع خبر «إنّ»
  - بدل مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
