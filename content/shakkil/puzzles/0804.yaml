text: وَالَّذِينَ مَعَهُ أَشِدَّاءُ عَلَى الْكُفَّارِ رُحَمَاءُ بَيْنَهُمْ
irab:
  - الواو حرف عطف، و«الذين» اسم موصول مبني على الفتح في محل رفع مبتدأ
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بصلة الموصول المحذوفة
  - خبر مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أشداء»
  - خبر ثانٍ مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«رحماء»
alts: []
context: الضمير في «معه» لمحمد ﷺ
source: quran
level: 3
ref: سورة الفتح، الآية ٢٩
