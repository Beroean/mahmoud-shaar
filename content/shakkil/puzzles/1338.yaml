text: لَا تَبَاغَضُوا، وَلَا تَحَاسَدُوا، وَلَا تَدَابَرُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا
irab:
  - حرف نهي جازم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وأصله تتباغضوا فحُذفت إحدى التاءين، وواو الجماعة ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«لا» حرف نهي جازم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«لا» حرف نهي جازم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«كونوا» فعل أمر ناقص مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع اسم «كونوا»
  - منادى بحرف نداء محذوف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر «كونوا» منصوب وعلامة نصبه تنوين الفتح
