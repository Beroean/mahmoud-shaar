text: لَا تَشْرَبِ الْقَهْوَةَ وَأَنْتَ جَائِعٌ
irab:
  - «لا» الناهية حرف جزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو واو الحال، و«أنت» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة الاسمية في محل نصب حال
alts:
  - لَا تَشْرَبُ الْقَهْوَةَ وَأَنْتَ جَائِعٌ
fixed:
  - وأنت
source: llm-reviewed
