text: مَنْ يَفْعَلِ الْخَيْرَ لَا يَعْدَمْ جَوَازِيَهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم بـ«من» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو، وهو فعل الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة على الياء، وهو ممنوع من الصرف (صيغة منتهى الجموع)، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
