text: لِنَجْعَلَهَا لَكُمْ تَذْكِرَةً وَتَعِيَهَا أُذُنٌ وَاعِيَةٌ
irab:
  - اللام لام التعليل حرف جر، و«نجعل» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره نحن، و«ها» ضمير متصل مبني على السكون في محل نصب مفعول به أول
  - اللام حرف جر، والكاف ضمير متصل مبني على الضم في محل جر، والميم علامة الجمع، وشبه الجملة متعلق بمحذوف نعت لـ«تذكرة» تقدّم عليها فصار حالًا
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«تعي» فعل مضارع منصوب معطوف على «نجعل» وعلامة نصبه الفتحة، و«ها» ضمير متصل مبني على السكون في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه تنوين الضم
alts: []
context: بعد ذكر حمل المؤمنين في السفينة يوم الطوفان
source: quran
level: 3
ref: سورة الحاقة، الآية ١٢
