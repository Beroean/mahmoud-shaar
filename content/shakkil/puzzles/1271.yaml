text: قَبْلَ أَنْ تَشْتَرِيَ سَيَّارَةً مُسْتَعْمَلَةً اطْلُبْ مِنْ مِيكَانِيكِيٍّ أَنْ يَفْحَصَهَا
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل جر مضاف إليه
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل نصب مفعول به
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل في محل نصب مفعول به
