text: إِيَّاكَ وَالنَّوْمَ تَحْتَ الْمُكَيِّفِ
irab:
  - «إيّا» ضمير منفصل مبني على السكون في محل نصب مفعول به لفعل محذوف تقديره أحذّر، والكاف حرف خطاب (تحذير)
  - الواو عاطفة، و«النوم» مفعول به منصوب لفعل محذوف تقديره احذر، وعلامة نصبه الفتحة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - إِيَّاكَ
    - إِيَّاكِ
