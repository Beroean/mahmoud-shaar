text: لَا صَدِيقَ أَوْفَى مِنَ الْكِتَابِ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - خبر «لا» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو ممنوع من الصرف (على وزن أفعل)
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا صَدِيقٌ أَوْفَى مِنَ الْكِتَابِ
source: llm-reviewed
level: 2
