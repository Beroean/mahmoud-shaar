text: اشْتَرَيْنَا حَلْوَى لِلْأَطْفَالِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو ممنوع من الصرف (مختوم بألف التأنيث المقصورة)
  - اللام حرف جر، و«الأطفال» اسم مجرور وعلامة جره الكسرة الظاهرة
