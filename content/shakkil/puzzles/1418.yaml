text: نَجَحَتِ التَّجَارِبُ حَاشَا تَجْرِبَةٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر يفيد الاستثناء مبني على السكون (ويجوز أن يكون فعلًا ماضيًا جامدًا فينصب ما بعده)
  - مستثنى بـ«حاشا» اسم مجرور وعلامة جره تنوين الكسر (ويجوز نصبه)
alts:
  - نَجَحَتِ التَّجَارِبُ حَاشَا تَجْرِبَةً
source: llm-reviewed
