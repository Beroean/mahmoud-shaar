text: سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ
irab:
  - خبر مقدّم مرفوع وعلامة رفعه تنوين الضم
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ مؤخر
  - حرف غاية وجر مبني على السكون
  - اسم مجرور بـ«حتى» وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«سلام»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: الحديث عن ليلة القدر
source: quran
ref: سورة القدر، الآية ٥
