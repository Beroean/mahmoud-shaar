text: الطُّهُورُ شَطْرُ الْإِيمَانِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو بضم الطاء على المختار وقول الأكثرين، ويجوز فتحها (النووي في شرح مسلم)
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - الطَّهُورُ شَطْرُ الْإِيمَانِ
source: hadith
ref: صحيح مسلم، الحديث ٢٢٣
