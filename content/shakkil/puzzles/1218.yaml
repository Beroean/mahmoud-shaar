text: إِذَا انْقَطَعَتِ الْكَهْرَبَاءُ فَأَشْعِلِ الشُّمُوعَ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء رابطة لجواب الشرط، و«أشعل» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
