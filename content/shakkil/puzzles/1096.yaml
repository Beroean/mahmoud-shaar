text: لَيْسَ الْجَمَالُ بِمِئْزَرٍ فَاعْلَمْ وَإِنْ رُدِّيتَ بُرْدَا
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر زائد، و«مئزر» اسم مجرور لفظًا منصوب محلًّا خبر «ليس»
  - الفاء اعتراضية، و«اعلم» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة اعتراضية لا محل لها
  - الواو حالية، و«إن» حرف شرط جازم (وصلية) مبني على السكون، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني للمجهول مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل في محل رفع نائب فاعل
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - بُرْدَا
    - بُرْدًا
fixed:
  - رديت
author: عمرو بن معديكرب
source: poetry
level: 3
