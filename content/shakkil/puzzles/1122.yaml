text: لَوْ أَخَذَ الْمَرِيضُ دَوَاءَهُ لَتَحَسَّنَتْ حَالُهُ
irab:
  - حرف شرط غير جازم (امتناع لامتناع) مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - اللام واقعة في جواب «لو»، و«تحسّن» فعل ماضٍ مبني على الفتح، والتاء للتأنيث
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
