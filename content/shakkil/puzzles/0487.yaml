text: تُعَدُّ دِمَشْقُ مِنْ أَجْمَلِ الْعَوَاصِمِ الْعَرَبِيَّةِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (العلمية والتأنيث)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة لأنه مضاف، وشبه الجملة في محل نصب مفعول به ثانٍ
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
alts:
  - تَعُدُّ دِمَشْقَ مِنْ أَجْمَلِ الْعَوَاصِمِ الْعَرَبِيَّةِ
source: llm-reviewed
level: 2
