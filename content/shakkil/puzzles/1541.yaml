text: ثُمَّ لْيَقْضُوا تَفَثَهُمْ وَلْيُوفُوا نُذُورَهُمْ وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ
irab:
  - حرف عطف مبني على الفتح
  - اللام لام الأمر حرف جزم مبني على السكون، و«يقضوا» فعل مضارع مجزوم بلام الأمر وعلامة جزمه حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حرف عطف، واللام لام الأمر، و«يوفوا» فعل مضارع مجزوم بلام الأمر وعلامة جزمه حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حرف عطف، واللام لام الأمر، و«يطّوّفوا» فعل مضارع مجزوم بلام الأمر وعلامة جزمه حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - الباء حرف جر، و«البيت» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يطّوّفوا»
  - نعت مجرور وعلامة جره الكسرة
