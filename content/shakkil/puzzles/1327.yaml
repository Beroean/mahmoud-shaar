text: أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - الواو حرف عطف، و«كافل» معطوف على «أنا» مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر
  - «ها» حرف تنبيه، والكاف حرف تشبيه وجر، و«ذا» اسم إشارة مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٥٣٠٤
