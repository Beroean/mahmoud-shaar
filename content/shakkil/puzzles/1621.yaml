text: ظَلَّتِ النَّحَّاتَةُ تَعْمَلُ عَلَى تِمْثَالِهَا الرُّخَامِيِّ شُهُورًا حَتَّى أَتَمَّتْهُ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «ظلّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «ظلّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به
