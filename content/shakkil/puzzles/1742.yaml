text: سَافَرْنَا بِالْقِطَارِ اللَّيْلِيِّ فَاسْتَيْقَظْنَا عَلَى مَنَاظِرِ الْجِبَالِ الْمُغَطَّاةِ بِالثَّلْجِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«القطار» اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - الفاء حرف عطف، و«استيقظنا» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - الباء حرف جر، و«الثلج» اسم مجرور وعلامة جره الكسرة الظاهرة
