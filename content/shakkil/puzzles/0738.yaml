text: إِنَّ فِي الْمَكْتَبَةِ كُتُبًا نَادِرَةً
irab:
  - حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
