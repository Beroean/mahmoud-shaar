text: أُولَـٰئِكَ أَصْحَابُ الْجَنَّةِ خَالِدِينَ فِيهَا جَزَاءً بِمَا كَانُوا يَعْمَلُونَ
irab:
  - اسم إشارة مبني على الكسر في محل رفع مبتدأ، والكاف حرف خطاب
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - حال منصوبة وعلامة نصبها الياء لأنها جمع مذكر سالم
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«خالدين»
  - مفعول مطلق لفعل محذوف تقديره «يُجزَون» منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«ما» مصدرية مبنية على السكون
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «كان»، والمصدر المؤول من «ما» وما بعدها في محل جر بالباء، وشبه الجملة متعلق بـ«جزاء»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
alts: []
context: الحديث عن الذين قالوا ربنا الله ثم استقاموا
source: quran
level: 3
ref: سورة الأحقاف، الآية ١٤
