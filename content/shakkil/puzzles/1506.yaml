text: تُعَدُّ صِنَاعَةُ الْحَرِيرِ مِنْ أَقْدَمِ الْحِرَفِ الَّتِي عَرَفَهَا الْإِنْسَانُ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو اسم تفضيل ممنوع من الصرف جُرّ بالكسرة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اسم موصول مبني على السكون في محل جر نعت
  - فعل ماضٍ مبني على الفتح، و«ها» ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts:
  - تَعُدُّ صِنَاعَةَ الْحَرِيرِ مِنْ أَقْدَمِ الْحِرَفِ الَّتِي عَرَفَهَا الْإِنْسَانُ
source: llm-reviewed
level: 2
