text: إِذَا اشْتَدَّ الْبَرْدُ هَاجَرَتْ طُيُورٌ كَثِيرَةٌ إِلَى بِلَادٍ دَافِئَةٍ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والجملة جواب شرط غير جازم لا محل لها
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
