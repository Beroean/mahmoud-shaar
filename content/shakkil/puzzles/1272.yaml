text: اسْتَيْقَظَ أَهْلُ الْجَبَلِ عَلَى صَوْتِ الرَّعْدِ، فَأَسْرَعُوا يُدْخِلُونَ مَوَاشِيَهُمْ إِلَى الْحَظَائِرِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء حرف عطف، و«أسرعوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب حال
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة على الياء (اسم منقوص)، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
