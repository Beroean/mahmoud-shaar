text: مَنْ لَا يَرْحَمُ لَا يُرْحَمُ
irab:
  - اسم موصول مبني على السكون في محل رفع مبتدأ، ويجوز أن تكون اسم شرط فيُجزم الفعلان «مَنْ لَا يَرْحَمْ لَا يُرْحَمْ» (ذكر الكرماني الرفع والجزم، وقال أبو البقاء «الجيد أن تكون موصولة، وإن جُعلت شرطًا جاز»)
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - حرف نفي مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
alts: []
vary:
  - [يَرْحَمُ لَا يُرْحَمُ, يَرْحَمْ لَا يُرْحَمْ]
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٦٠١٣
