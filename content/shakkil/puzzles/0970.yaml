text: أَحْسِنْ بِجَارٍ يَسْأَلُ عَنْ جِيرَانِهِ!
irab:
  - فعل ماضٍ جاء على صيغة الأمر لإنشاء التعجب مبني على السكون
  - الباء حرف جر زائد، و«جار» فاعل مجرور لفظًا مرفوع محلًا، وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر نعت لـ«جار»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
