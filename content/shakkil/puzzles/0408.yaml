text: يَحْمِلُ الْعَامِلُ صُنْدُوقَيْنِ ثَقِيلَيْنِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
  - نعت منصوب وعلامة نصبه الياء لأنه مثنى
alts:
  - يَحْمِلُ الْعَامِلُ صَنْدُوقَيْنِ ثَقِيلَيْنِ
source: llm-reviewed
