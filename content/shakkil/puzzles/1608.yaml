text: تَذَكَّرْتُ مَنْ يَبْكِي عَلَيَّ فَلَمْ أَجِدْ سِوَى السَّيْفِ وَالرُّمْحِ الرُّدَيْنِيِّ بَاكِيَا
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - «على» حرف جر، والياء ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«يبكي»
  - الفاء حرف عطف، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مستثنى مقدم منصوب على الاستثناء وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الرمح» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، والألف للإطلاق، ويجوز تنوينه «باكيًا»
alts: []
vary:
  - - بَاكِيَا
    - بَاكِيًا
fixed:
  - تذكرت
author: مالك بن الريب
source: poetry
level: 3
ref: «ألا ليت شعري هل أبيتن ليلة»
