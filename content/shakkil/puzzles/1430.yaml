text: الْمِعْطَفَ الْمِعْطَفَ، فَالرِّيحُ بَارِدَةٌ
irab:
  - مفعول به منصوب لفعل محذوف تقديره البس (إغراء)، وعلامة نصبه الفتحة الظاهرة
  - توكيد لفظي منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء تعليلية حرف مبني على الفتح، و«الريح» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts:
  - الْمِعْطَفُ الْمِعْطَفُ، فَالرِّيحُ بَارِدَةٌ
source: llm-reviewed
