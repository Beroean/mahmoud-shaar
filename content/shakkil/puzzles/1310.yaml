text: وَإِذَا حُشِرَ النَّاسُ كَانُوا لَهُمْ أَعْدَاءً وَكَانُوا بِعِبَادَتِهِمْ كَافِرِينَ
irab:
  - الواو حرف عطف، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - نائب فاعل مرفوع وعلامة رفعه الضمة
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «كان»، والجملة جواب شرط غير جازم لا محل لها
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أعداء»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«كانوا» فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «كان»
  - الباء حرف جر، و«عبادة» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«كافرين»
  - خبر «كان» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts: []
context: المعبودون من دون الله يوم القيامة، وضمير «لهم» لمن عبدوهم
source: quran
level: 3
ref: سورة الأحقاف، الآية ٦
