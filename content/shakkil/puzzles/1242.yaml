text: زَيَّنَ الْأَطْفَالُ الشَّجَرَةَ بِمَصَابِيحَ مُلَوَّنَةٍ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«مصابيح» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره تنوين الكسر
