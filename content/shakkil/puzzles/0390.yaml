text: صُنْتُ نَفْسِي عَمَّا يُدَنِّسُ نَفْسِي
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - «عن» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وأُدغمت النون في الميم
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - صنت
author: البحتري
source: poetry
ref: السينية (وصف إيوان كسرى)
