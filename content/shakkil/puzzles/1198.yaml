text: اتْرُكِ الْعَجِينَ حَتَّى يَخْتَمِرَ
irab:
  - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بأن مضمرة بعد «حتى» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
alts: []
fixed:
  - اترك
