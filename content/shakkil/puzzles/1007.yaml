text: لَا تَتَحَدَّثُوا بِصَوْتٍ مُرْتَفِعٍ فِي الْمَكْتَبَةِ، فَهُنَاكَ مَنْ يَقْرَأُ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«صوت» اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الفاء تعليلية حرف مبني على الفتح، و«هناك» اسم إشارة للمكان مبني على السكون في محل نصب ظرف مكان متعلق بمحذوف خبر مقدم، والكاف حرف خطاب
  - اسم موصول مبني على السكون في محل رفع مبتدأ مؤخر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
alts: []
fixed:
  - فهناك
source: llm-reviewed
level: 3
