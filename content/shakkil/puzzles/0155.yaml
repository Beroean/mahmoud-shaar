text: عَلِمْتُ أَنَّ الصِّدْقَ مَنْجَاةٌ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - حرف توكيد ونصب مبني على الفتح
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «أنّ» مرفوع وعلامة رفعه تنوين الضم، والمصدر المؤول من «أنّ» ومعموليها سدّ مسدّ مفعولي «علم»
alts: []
author: غسان كنفاني
