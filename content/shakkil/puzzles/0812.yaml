text: وَلَقَدْ خَلَقْنَا فَوْقَكُمْ سَبْعَ طَرَائِقَ وَمَا كُنَّا عَنِ الْخَلْقِ غَافِلِينَ
irab:
  - الواو استئنافية، واللام واقعة في جواب قسم محذوف، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«خلقنا»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف (من العدد المفرد ٣–١٠)
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - الواو حالية، و«ما» نافية مبنية على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع اسم «كان»
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«غافلين»
  - خبر «كان» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts: []
source: quran
level: 3
ref: سورة المؤمنون، الآية ١٧
