text: قُلْ إِنِّي أَخَافُ إِنْ عَصَيْتُ رَبِّي عَذَابَ يَوْمٍ عَظِيمٍ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - «إنّ» حرف توكيد ونصب مبني على الفتح، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»، والجملة في محل نصب مقول القول
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر «إنّ»
  - حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، وجواب الشرط محذوف دلّ عليه ما قبله
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بالحركة المناسبة، وهو مضاف، والياء ضمير متصل مبني على السكون في محل جر مضاف إليه
  - مفعول به لـ«أخاف» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
context: أمر للنبي ﷺ
source: quran
level: 3
ref: سورة الزمر، الآية ١٣
