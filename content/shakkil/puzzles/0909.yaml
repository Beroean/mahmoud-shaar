text: قَطَعَتِ السُّلَحْفَاةُ عِشْرِينَ مِتْرًا
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم (العدد من ألفاظ العقود)
  - تمييز منصوب وعلامة نصبه تنوين الفتح
