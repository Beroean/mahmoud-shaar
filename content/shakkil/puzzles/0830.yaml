text: أَفْضَلُ الصِّيَامِ بَعْدَ رَمَضَانَ شَهْرُ اللَّهِ الْمُحَرَّمُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية وزيادة الألف والنون
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - نعت لـ«شهر» مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ١١٦٣
