text: كَمْ مَرَّةٍ نَصَحَهُ أَبُوهُ!
irab:
  - «كم» الخبرية اسم مبني على السكون في محل نصب نائب عن المفعول المطلق
  - تمييز «كم» الخبرية مجرور بالإضافة وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على الفتح، والهاء ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
