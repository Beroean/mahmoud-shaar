text: يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - اسم موصول مبني على الفتح في محل نصب مفعول به
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الباء حرف جر، و«القول» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يثبّت»
  - نعت مجرور وعلامة جره الكسرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يثبّت»
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - الواو حرف عطف، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة معطوف على «في الحياة الدنيا»
