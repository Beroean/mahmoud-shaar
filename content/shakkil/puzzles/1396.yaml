text: بَدَأَ النَّحَّاتُ يَصْقُلُ التِّمْثَالَ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «بدأ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «بدأ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
