text: كَادَ الدَّرَّاجُ يَسْقُطُ قُرْبَ خَطِّ النِّهَايَةِ
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح
  - اسم «كاد» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «كاد»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
