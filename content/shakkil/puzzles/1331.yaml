text: إِذَا أُقِيمَتِ الصَّلَاةُ فَلَا صَلَاةَ إِلَّا الْمَكْتُوبَةُ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وكُسرت لالتقاء الساكنين، والجملة في محل جر بإضافة «إذا» إليها
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء رابطة لجواب الشرط، و«لا» نافية للجنس مبنية على السكون
  - اسم «لا» النافية للجنس مبني على الفتح في محل نصب، وخبرها محذوف تقديره مشروعةٌ
  - حرف استثناء مبني على السكون
  - مستثنى مرفوع على البدلية من محل «لا» واسمها وعلامة رفعه الضمة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٧١٠
