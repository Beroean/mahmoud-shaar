text: وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُوا
irab:
  - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - «من» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال من «أئمة» (نعت تقدّم عليها)
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل نصب نعت لـ«أئمة»
  - الباء حرف جر، و«أمر» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يهدون»
  - ظرف بمعنى «حين» مبني على السكون في محل نصب متعلق بـ«جعلنا»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل جر بالإضافة
alts: []
context: الحديث عن بني إسرائيل
