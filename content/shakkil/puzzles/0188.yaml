text: وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ
irab:
  - الواو بحسب ما قبلها، و«ما» نافية مبنية على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - أداة حصر لا عمل لها
  - الباء حرف جر، ولفظ الجلالة اسم مجرور، وشبه الجملة في محل رفع خبر
alts: []
source: quran
ref: سورة هود، الآية ٨٨
