text: يُرِيدُونَ لِيُطْفِئُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ وَاللَّهُ مُتِمُّ نُورِهِ وَلَوْ كَرِهَ الْكَافِرُونَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - اللام زائدة، و«يطفئوا» فعل مضارع منصوب بأن مضمرة بعد اللام وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب مفعول به لـ«يريدون»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - الباء حرف جر، و«أفواه» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يطفئوا»
  - الواو حالية، ولفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل نصب حال
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حالية، و«لو» حرف شرط غير جازم مبني على السكون، وجوابه محذوف
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
