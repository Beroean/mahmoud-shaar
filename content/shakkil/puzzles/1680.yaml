text: تُفْحَصُ الْحَقَائِبُ عِنْدَ الْمَدْخَلِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - تَفْحَصُ الْحَقَائِبَ عِنْدَ الْمَدْخَلِ
source: llm-reviewed
