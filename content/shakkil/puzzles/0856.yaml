text: إِذَا غَضِبَتْ عَلَيْكَ بَنُو تَمِيمٍ حَسِبْتَ النَّاسَ كُلَّهُمُ غِضَابَا
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والجملة في محل جر بإضافة «إذا» إليها
  - «على» حرف جر، والكاف ضمير متصل في محل جر، وشبه الجملة متعلق بـ«غضبت»
  - فاعل مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - توكيد معنوي منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وضُمّت الميم للوزن
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - غِضَابَا
    - غِضَابًا
context: الشاعر يخاطب رجلًا
author: جرير
