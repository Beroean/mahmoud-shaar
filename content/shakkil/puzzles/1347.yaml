text: أَنَا وَاللَّهِ أَصْلُحُ لِلْمَعَالِي
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - الواو حرف قسم وجر، ولفظ الجلالة مقسم به مجرور وعلامة جره الكسرة، والجملة القسمية اعتراضية لا محل لها
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر «أنا»
  - اللام حرف جر، و«المعالي» اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وشبه الجملة متعلق بـ«أصلح»
alts: []
vary:
  - - أَصْلُحُ
    - أَصْلَحُ
author: ولادة بنت المستكفي
source: poetry
ref: «أنا والله أصلح للمعالي»
