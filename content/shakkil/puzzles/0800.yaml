text: قُلْ إِنَّ الْمَوْتَ الَّذِي تَفِرُّونَ مِنْهُ فَإِنَّهُ مُلَاقِيكُمْ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - اسم موصول مبني على السكون في محل نصب نعت لـ«الموت»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - «من» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«تفرّون»
  - الفاء زائدة لتضمّن اسم «إنّ» معنى الشرط لوصفه بالموصول، و«إنّ» حرف توكيد ونصب، والهاء ضمير متصل في محل نصب اسمها
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وجملة «فإنه ملاقيكم» في محل رفع خبر «إنّ» الأولى
