text: يَعْلَمُ سِرَّكُمْ وَجَهْرَكُمْ وَيَعْلَمُ مَا تَكْسِبُونَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر ثانٍ للمبتدأ «هو» في أول الآية
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حرف عطف، و«جهر» اسم معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حرف عطف، و«يعلم» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها، والعائد محذوف
alts: []
context: الحديث عن الله تعالى، والخطاب للناس
source: quran
level: 2
ref: سورة الأنعام، الآية ٣
