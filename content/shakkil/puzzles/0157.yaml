text: حُرُوفُنَا فِي الْحُبِّ تَقْتُلُ حُبَّنَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
alts: []
author: نزار قباني
source: poetry
