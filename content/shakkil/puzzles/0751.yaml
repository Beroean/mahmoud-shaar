text: عَلَيْنَا، مَعْشَرَ الشَّبَابِ، أَنْ نَتَعَاوَنَ
irab:
  - «على» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مفعول به منصوب على الاختصاص لفعل محذوف تقديره أخصّ، وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والمصدر المؤول في محل رفع مبتدأ مؤخر
