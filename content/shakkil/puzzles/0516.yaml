text: اسْتَغْرَقَ بِنَاءُ الْمُسْتَشْفَى الْجَدِيدِ أَرْبَعَ سَنَوَاتٍ، وَشَارَكَ فِيهِ مِئَاتُ الْعُمَّالِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - الواو حرف عطف، و«شارك» فعل ماضٍ مبني على الفتح
  - «في» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
