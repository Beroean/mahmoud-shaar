text: مَنْ قُتِلَ دُونَ مَالِهِ فَهُوَ شَهِيدٌ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني للمجهول مبني على الفتح في محل جزم فعل الشرط، ونائب الفاعل ضمير مستتر تقديره هو
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بـ«قُتل»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب الشرط، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل جزم جواب الشرط
