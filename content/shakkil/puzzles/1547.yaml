text: لَقَدْ حَقَّ الْقَوْلُ عَلَىٰ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ
irab:
  - اللام واقعة في جواب قسم مقدّر، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«حقّ»
  - الفاء حرف عطف، و«هم» ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر المبتدأ
alts: []
context: الحديث عن الغافلين الذين أُنذروا
source: quran
level: 2
ref: سورة يس، الآية ٧
