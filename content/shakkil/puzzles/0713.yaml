text: إِنْ تَزُرْنَا فِي الصَّيْفِ نَأْخُذْكَ إِلَى الْبَحْرِ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«نا» ضمير متصل في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره نحن، والكاف ضمير متصل في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - نأخذك
