text: سَافَرَ يُوسُفُ إِلَى أَسْوَانَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (العلمية والعجمة)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية وزيادة الألف والنون)
alts: []
vary:
  - - أَسْوَانَ
    - أُسْوَانَ
source: llm-reviewed
