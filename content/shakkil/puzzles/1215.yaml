text: الْبَيْتُ صَغِيرٌ لَكِنَّ حَدِيقَتَهُ وَاسِعَةٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - حرف استدراك ونصب مبني على الفتح
  - اسم «لكنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر «لكنّ» مرفوع وعلامة رفعه تنوين الضم
alts:
  - الْبَيْتُ صَغِيرٌ لَكِنْ حَدِيقَتُهُ وَاسِعَةٌ
source: llm-reviewed
