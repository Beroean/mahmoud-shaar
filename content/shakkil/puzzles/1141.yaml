text: كَادَتِ الشَّمْعَةُ تَنْطَفِئُ
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كاد» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «كاد»
