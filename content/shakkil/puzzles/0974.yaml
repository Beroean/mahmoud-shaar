text: لَوْ تَرَيَّثَ السَّائِقُ قَلِيلًا لَتَجَنَّبَ الْحَادِثَ
irab:
  - حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح، وهو فعل الشرط
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح
  - اللام واقعة في جواب «لو»، و«تجنّب» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة جواب شرط غير جازم لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
