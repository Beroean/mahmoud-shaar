text: أُغْمِيَ عَلَى الْعَدَّاءِ مِنْ شِدَّةِ الْحَرِّ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة في محل رفع نائب فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
