text: مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ما زال» مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف للعلمية والعجمة
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة في محل نصب خبر «ما زال»
  - الباء حرف جر، و«الجار» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - «أنّ» حرف توكيد ونصب، والهاء ضمير متصل في محل نصب اسم «أنّ»
  - السين حرف استقبال، و«يورّث» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «أنّ»، والمصدر المؤول سدّ مسدّ مفعولي «ظنّ»
alts: []
fixed:
  - ظننت
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٠١٥
