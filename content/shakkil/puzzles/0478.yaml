text: تُهَاجِرُ الطُّيُورُ شِتَاءً بَحْثًا عَنِ الدِّفْءِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
