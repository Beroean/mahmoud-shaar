text: وَصَلَتِ الطَّائِرَةُ مُتَأَخِّرَةً سَاعَتَيْنِ بِسَبَبِ الْعَاصِفَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
  - ظرف زمان منصوب وعلامة نصبه الياء لأنه مثنى
  - الباء حرف جر، و«سبب» اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
