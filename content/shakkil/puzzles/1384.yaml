text: يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال من فاعل «جمع»
  - حرف توكيد ونصب مبني على الفتح
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل مبني على الضم في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو يعود على المال، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «أنّ»، والمصدر المؤول من «أنّ» وما بعدها سدّ مسدّ مفعولي «يحسب»
alts: []
context: الحديث عن الهمزة اللمزة الذي جمع مالًا
source: quran
level: 2
ref: سورة الهمزة، الآية ٣
