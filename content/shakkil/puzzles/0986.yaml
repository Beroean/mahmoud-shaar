text: لَمْ يَبْقَ فِي الْعُلْبَةِ غَيْرُ قِطْعَةٍ وَاحِدَةٍ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة من آخره، والفتحة قبلها دليل عليها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف (استثناء مفرّغ)
  - مضاف إليه مجرور (وهو المستثنى) وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts:
  - لَمْ يُبْقِ فِي الْعُلْبَةِ غَيْرَ قِطْعَةٍ وَاحِدَةٍ
  - لَمْ يُبْقَ فِي الْعُلْبَةِ غَيْرُ قِطْعَةٍ وَاحِدَةٍ
