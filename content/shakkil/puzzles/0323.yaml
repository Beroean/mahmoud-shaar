text: أَلَا كُلُّ شَيْءٍ مَا خَلَا اللَّهَ بَاطِلُ
irab:
  - حرف استفتاح وتنبيه مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف مصدري مبني على السكون
  - فعل ماضٍ جامد للاستثناء مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر وجوبًا، والمصدر المؤول في محل نصب حال
  - لفظ الجلالة مفعول به (مستثنى بـ«ما خلا») منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: لبيد بن ربيعة
