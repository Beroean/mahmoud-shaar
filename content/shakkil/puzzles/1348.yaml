text: لِسَانِي صَارِمٌ لَا عَيْبَ فِيهِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - حرف نفي للجنس مبني على السكون يعمل عمل «إنّ»
  - اسم «لا» مبني على الفتح في محل نصب
  - «في» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»، وجملة «لا عيب فيه» في محل رفع نعت لـ«صارم»
alts: []
author: حسان بن ثابت
source: poetry
ref: «عفت ذات الأصابع فالجواء»
