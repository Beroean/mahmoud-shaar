text: قَالَ الطَّبِيبُ إِنَّ الْجُرْحَ سَطْحِيٌّ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف توكيد ونصب مبني على الفتح، وكُسرت همزته لوقوعه بعد القول
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب مقول القول
