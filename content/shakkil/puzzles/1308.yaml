text: وَاذْكُرْ عَبْدَنَا أَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الشَّيْطَانُ بِنُصْبٍ وَعَذَابٍ
irab:
  - الواو استئنافية، و«اذكر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - بدل من «عبدنا» منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف للعلمية والعجمة
  - ظرف لما مضى من الزمان مبني على السكون في محل نصب بدل اشتمال من «أيوب»
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذ» إليها
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - «أنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «أنّ»
  - «مسّ» فعل ماضٍ مبني على الفتح، والنون للوقاية، والياء ضمير متصل مبني على الفتح في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر «أنّ»
  - الباء حرف جر، و«نصب» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«مسّ»
  - الواو حرف عطف، و«عذاب» اسم معطوف على «نصب» مجرور وعلامة جره تنوين الكسر
