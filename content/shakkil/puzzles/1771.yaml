text: وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا
irab:
  - الواو اعتراضية، و«كلّ» مفعول به منصوب على الاشتغال لفعل محذوف يفسّره ما بعده تقديره «أحصينا»، وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به، والجملة تفسيرية لا محل لها
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح، لأن «أحصيناه» في معنى «كتبناه»
alts: []
source: quran
level: 2
ref: سورة النبأ، الآية ٢٩
