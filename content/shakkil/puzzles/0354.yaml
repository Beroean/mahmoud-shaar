text: فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ
irab:
  - الفاء بحسب ما قبلها، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل جر مضاف إليه، وهي جملة الشرط
  - الفاء رابطة لجواب الشرط، و«توكّل» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة جواب شرط غير جازم لا محل لها
  - حرف جر مبني على السكون
  - لفظ الجلالة اسم مجرور وعلامة جره الكسرة
