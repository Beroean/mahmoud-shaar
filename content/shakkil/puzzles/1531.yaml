text: وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ
irab:
  - الواو حرف عطف، و«أمّا» حرف شرط وتفصيل مبني على السكون
  - اسم موصول مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على صيغة منتهى الجموع، وهو مضاف، والهاء ضمير متصل مبني على الضم في محل جر مضاف إليه، والجملة صلة الموصول لا محل لها
alts: []
source: quran
level: 2
ref: سورة القارعة، الآية ٨
