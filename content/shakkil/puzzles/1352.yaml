text: عُمَيْرَةَ وَدِّعْ إِنْ تَجَهَّزْتَ غَادِيَا كَفَى الشَّيْبُ وَالْإِسْلَامُ لِلْمَرْءِ نَاهِيَا
irab:
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة بلا تنوين لأنه ممنوع من الصرف (العلمية والتأنيث)
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، وجواب الشرط محذوف دلّ عليه ما قبله
  - حال منصوب وعلامة نصبه الفتحة الظاهرة، والألف للإطلاق
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«الإسلام» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«المرء» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«ناهيًا»
  - حال منصوب وعلامة نصبه الفتحة الظاهرة، والألف للإطلاق
alts: []
vary:
  - - غَادِيَا
    - غَادِيًا
  - - نَاهِيَا
    - نَاهِيًا
context: الشاعر يخاطب نفسه
author: سحيم عبد بني الحسحاس
source: poetry
level: 3
ref: «عميرة ودع إن تجهزت غاديا»
