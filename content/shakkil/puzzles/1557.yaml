text: إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ
irab:
  - أداة استثناء مبنية على السكون
  - اسم موصول مبني على الفتح في محل نصب مستثنى
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«عملوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
  - الفاء استئنافية، واللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
context: استثناء من الإنسان المردود أسفل سافلين
source: quran
level: 3
ref: سورة التين، الآية ٦
