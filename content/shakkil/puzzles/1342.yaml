text: أَحْسِنْ إِلَى النَّاسِ تَسْتَعْبِدْ قُلُوبَهُمُ فَطَالَمَا اسْتَعْبَدَ الْإِنْسَانَ إِحْسَانُ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«أحسن»
  - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وضُمّت الميم للوزن
  - الفاء تعليلية، و«طال» فعل ماضٍ مبني على الفتح، و«ما» حرف زائد كفّ «طال» عن طلب الفاعل
  - فعل ماضٍ مبني على الفتح
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
vary:
  - - قُلُوبَهُمُ
    - قُلُوبَهُمْ
author: أبو الفتح البستي
source: poetry
level: 3
ref: عنوان الحكم
