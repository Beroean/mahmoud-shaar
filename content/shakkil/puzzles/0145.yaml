text: قَرَأْتُ أَحَدَ عَشَرَ كِتَاباً
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - الجزء الأول من عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
  - الجزء الثاني من العدد المركب مبني على الفتح
  - تمييز منصوب وعلامة نصبه تنوين الفتح
