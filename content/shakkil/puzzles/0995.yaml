text: لَمْ يَكَدِ الْحَكَمُ يُطْلِقُ صَافِرَةَ النِّهَايَةِ حَتَّى اقْتَحَمَ الْمُشَجِّعُونَ الْمَلْعَبَ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص من أفعال المقاربة مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم «يكاد» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «يكاد»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
