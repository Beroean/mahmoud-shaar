text: لَمْ يَشْعُرْ بِالْبُرُودَةِ ذُو الْمِعْطَفِ الصُّوفِيِّ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون
  - الباء حرف جر، و«البرودة» اسم مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
