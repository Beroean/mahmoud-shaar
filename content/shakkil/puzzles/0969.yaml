text: لَا بَائِعَ خُضَارٍ فِي هٰذَا الْحَيِّ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» منصوب وعلامة نصبه الفتحة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم إشارة مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا بَائِعُ خُضَارٍ فِي هٰذَا الْحَيِّ
source: llm-reviewed
