text: فَبِأَيِّ حَدِيثٍ بَعْدَ اللَّهِ وَآيَاتِهِ يُؤْمِنُونَ
irab:
  - الفاء استئنافية، والباء حرف جر، و«أيّ» اسم استفهام مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«يؤمنون»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بمحذوف نعت لـ«حديث»
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«آيات» اسم معطوف على لفظ الجلالة مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
alts: []
context: الحديث عن المشركين
source: quran
level: 2
ref: سورة الجاثية، الآية ٦
