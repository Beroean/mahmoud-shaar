text: حَضَرَ اللَّاعِبُونَ كُلُّهُمْ إِلَى التَّدْرِيبِ إِلَّا حَارِسَ الْمَرْمَى
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - توكيد معنوي مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف استثناء مبني على السكون
  - مستثنى منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
