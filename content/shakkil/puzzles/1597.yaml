text: فَمَنْ يَلْقَ خَيْرًا يَحْمَدِ النَّاسُ أَمْرَهُ
irab:
  - الفاء استئنافية، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف حرف العلة (الألف)، والفاعل ضمير مستتر جوازًا تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والهاء ضمير متصل مبني على الضم في محل جر مضاف إليه، وجملتا الشرط والجواب في محل رفع خبر
alts: []
author: المرقش الأصغر
