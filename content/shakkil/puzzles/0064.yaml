text: جَلَسْتُ أَمَامَ الْمُعَلِّمِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - [جَلَسْتُ, جَلَسْتَ, جَلَسْتِ]
source: llm-reviewed
level: 2
