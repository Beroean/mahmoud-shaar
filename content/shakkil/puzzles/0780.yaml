text: أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ
irab:
  - الهمزة للاستفهام التقريري، و«ليس» فعل ماضٍ ناقص جامد مبني على الفتح
  - لفظ الجلالة اسم «ليس» مرفوع وعلامة رفعه الضمة
  - الباء حرف جر زائد، و«أحكم» اسم مجرور لفظًا وعلامة جره الكسرة (وهو ممنوع من الصرف، وجُرّ بالكسرة لأنه مضاف)، منصوب محلًا خبر «ليس»
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
alts: []
source: quran
level: 2
ref: سورة التين، الآية ٨
