text: ذَٰلِكَ بِأَنَّهُمْ آمَنُوا ثُمَّ كَفَرُوا فَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ
irab:
  - اسم إشارة مبني على السكون في محل رفع مبتدأ، واللام للبعد، والكاف حرف خطاب
  - الباء حرف جر، و«أنّ» حرف توكيد ونصب، و«هم» ضمير متصل في محل نصب اسم «أنّ»، والمصدر المؤول في محل جر بالباء، وشبه الجملة في محل رفع خبر
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «أنّ»
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - الفاء حرف عطف، و«طُبع» فعل ماضٍ مبني للمجهول مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة في محل رفع نائب فاعل
  - الفاء حرف عطف، و«هم» ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
alts: []
context: الحديث عن المنافقين
source: quran
level: 3
ref: سورة المنافقون، الآية ٣
