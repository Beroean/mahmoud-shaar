text: انْتَظِرْ حَتَّى يَصِلَ أَخُوكَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه الفتحة الظاهرة
  - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
