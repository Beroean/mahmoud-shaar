text: مَا أَشَدَّ فَرَحَ الْأَطْفَالِ حِينَ يَرَوْنَ الثَّلْجَ يَتَسَاقَطُ لِأَوَّلِ مَرَّةٍ!
irab:
  - «ما» التعجبية نكرة تامة مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل جر بالإضافة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال
  - اللام حرف جر، و«أول» اسم مجرور وعلامة جره الكسرة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
