text: اسْتَغْرَقَ الْإِصْلَاحُ أَرْبَعَ سَاعَاتٍ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والعدد «أربع» يخالف معدوده في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
