text: وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ
irab:
  - الواو استئنافية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يقبل»
  - الواو حرف عطف، و«يعفو» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يعفو»
  - الواو حرف عطف، و«يعلم» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
