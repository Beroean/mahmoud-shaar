text: رَسَتْ ثَلَاثُ سُفُنٍ فِي الْمِينَاءِ صَبَاحًا
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر (تمييز العدد)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
