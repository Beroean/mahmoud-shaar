text: وَقَدْ أَغْتَدِي وَالطَّيْرُ فِي وُكُنَاتِهَا بِمُنْجَرِدٍ قَيْدِ الْأَوَابِدِ هَيْكَلِ
irab:
  - الواو استئنافية، و«قد» حرف تكثير مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا
  - الواو حالية، و«الطير» مبتدأ مرفوع وعلامة رفعه الضمة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر، والجملة في محل نصب حال
  - الباء حرف جر، و«منجرد» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«أغتدي»
  - نعت مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت ثانٍ مجرور وعلامة جره الكسرة، وحذف التنوين لضرورة القافية
