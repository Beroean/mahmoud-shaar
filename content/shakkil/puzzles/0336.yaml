text: خَفِّفِ الْوَطْءَ مَا أَظُنُّ أَدِيمَ الْأَرْضِ إِلَّا مِنْ هٰذِهِ الْأَجْسَادِ
irab:
  - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - أداة حصر مبنية على السكون لا عمل لها
  - حرف جر مبني على السكون
  - اسم إشارة مبني على الكسر في محل جر، وشبه الجملة في محل نصب مفعول به ثانٍ لـ«أظنّ»
  - بدل من «هذه» مجرور وعلامة جره الكسرة الظاهرة
