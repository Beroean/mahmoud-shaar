text: يَا طُلَّابَ الصَّفِّ الْأَوَّلِ، أَحْضِرُوا كُتُبَكُمْ وَدَفَاتِرَكُمْ غَدًا
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«دفاتر» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
