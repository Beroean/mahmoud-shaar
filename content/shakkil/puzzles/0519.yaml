text: قَرَأَ أَخِي الْأَكْبَرُ جَمِيعَ رِوَايَاتِ الْكَاتِبِ إِلَّا رِوَايَتَهُ الْأَخِيرَةَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف استثناء مبني على السكون
  - مستثنى منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
