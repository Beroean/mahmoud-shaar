text: يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - الباء حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر، وحُرّك بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«يريد»
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«لا» نافية مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«كم» ضمير متصل في محل جر، وحُرّك بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«يريد»
  - مفعول به منصوب وعلامة نصبه الفتحة
