text: يُحْكَى أَنَّ صَيَّادًا عَجُوزًا ظَلَّ يَنْتَظِرُ السَّمَكَ ثَلَاثَةَ أَيَّامٍ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» ومعموليها في محل رفع نائب فاعل
  - اسم «أنّ» منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «ظلّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف (العدد يخالف المعدود)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
