text: تَعَلَّمَتْ مَرْيَمُ الْخِيَاطَةَ مِنْ زَيْنَبَ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة بلا تنوين لأنه ممنوع من الصرف (علم مؤنث أعجمي)
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (علم مؤنث)
