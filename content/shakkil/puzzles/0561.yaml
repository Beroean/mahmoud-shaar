text: هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا
irab:
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - اللام حرف جر، و«كم» ضمير متصل في محل جر، وحُرّك بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«جعل»
  - مفعول به أول منصوب وعلامة نصبه الفتحة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الفاء الفصيحة، و«امشوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«امشوا»
