text: إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«أموال» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«لكنْ» حرف استدراك مخفف مهمل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«أعمال» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
