text: إِنَّ الدُّنْيَا حُلْوَةٌ خَضِرَةٌ وَإِنَّ اللَّهَ مُسْتَخْلِفُكُمْ فِيهَا فَيَنْظُرُ كَيْفَ تَعْمَلُونَ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - خبر «إنّ» أول مرفوع وعلامة رفعه تنوين الضم
  - خبر ثانٍ مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - «في» حرف جر، و«ها» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«مستخلف»
  - الفاء حرف عطف، و«ينظر» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - اسم استفهام مبني على الفتح في محل نصب حال
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب مفعول به لـ«ينظر» المعلَّق
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢٧٤٢
