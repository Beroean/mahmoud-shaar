text: إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ
irab:
  - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب، و«نا» ضمير متصل في محل نصب اسم «إنّ»
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«راجعون»
  - خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
source: quran
level: 2
ref: سورة البقرة، الآية ١٥٦
