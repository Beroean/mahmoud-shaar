text: يَا مُتَسَلِّقَ الْجَبَلِ، تَزَوَّدْ بِالْمَاءِ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«الماء» اسم مجرور وعلامة جره الكسرة الظاهرة
