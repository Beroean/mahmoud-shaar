text: يَا سَائِقَ الْقِطَارِ، تَوَقَّفْ عِنْدَ الْمَحَطَّةِ الْقَادِمَةِ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
