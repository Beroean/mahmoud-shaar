text: الشَّهْرُ تِسْعٌ وَعِشْرُونَ لَيْلَةً
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو من ألفاظ العدد
  - الواو حرف عطف، و«عشرون» معطوف مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم
  - تمييز منصوب وعلامة نصبه تنوين الفتح
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ١٩٠٧
