text: افْتُتِحَتِ الْمَكْتَبَةُ الْعَامَّةُ فِي وَسَطِ الْمَدِينَةِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - افْتُتِحَتِ الْمَكْتَبَةُ الْعَامَّةُ
    - افْتَتَحْتُ الْمَكْتَبَةَ الْعَامَّةَ
    - افْتَتَحْتَ الْمَكْتَبَةَ الْعَامَّةَ
    - افْتَتَحْتِ الْمَكْتَبَةَ الْعَامَّةَ
    - افْتَتَحَتِ الْمَكْتَبَةَ الْعَامَّةَ
