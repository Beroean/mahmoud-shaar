text: اشْتَدَّ الْحَرُّ فِي الظَّهِيرَةِ، فَجَلَسَ الْعُمَّالُ تَحْتَ الْأَشْجَارِ يَحْتَمُونَ بِظِلِّهَا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الفاء حرف عطف، و«جلس» فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب حال
  - الباء حرف جر، و«ظل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
