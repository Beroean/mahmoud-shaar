text: أَعَدَّتِ الطَّاهِيَاتُ وَجَبَاتٍ شَهِيَّةً، ثُمَّ قَدَّمْنَهَا لِلضُّيُوفِ فِي الْحَدِيقَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على السكون لاتصاله بنون النسوة، والنون ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به
  - اللام حرف جر، و«الضيوف» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
