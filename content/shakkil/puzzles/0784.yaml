text: إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ
irab:
  - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - مفعول به منصوب على الاشتغال لفعل محذوف يفسّره ما بعده تقديره «خلقنا»، وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة مفسّرة لا محل لها، وجملة الفعل المحذوف في محل رفع خبر «إنّ»
  - الباء حرف جر، و«قدر» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بحال محذوفة من الهاء
