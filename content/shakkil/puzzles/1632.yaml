text: فَذَاقَتْ وَبَالَ أَمْرِهَا وَكَانَ عَاقِبَةُ أَمْرِهَا خُسْرًا
irab:
  - الفاء حرف عطف، و«ذاق» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والفاعل ضمير مستتر تقديره هي
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حرف عطف، و«كان» فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الحديث عن قرية عتت عن أمر ربها
source: quran
level: 2
ref: سورة الطلاق، الآية ٩
