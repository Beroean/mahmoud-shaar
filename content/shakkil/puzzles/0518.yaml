text: يَحْلُمُ كُلُّ لَاعِبٍ نَاشِئٍ بِأَنْ يُشَارِكَ يَوْمًا فِي كَأْسِ الْعَالَمِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - الباء حرف جر، و«أن» حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل جر بالباء
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - يشارك
