text: نَظَّفَتِ الْأُخْتَانِ غُرْفَتَيْهِمَا قَبْلَ وُصُولِ الضُّيُوفِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الألف لأنه مثنى
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى، وحُذفت النون للإضافة، و«هما» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
