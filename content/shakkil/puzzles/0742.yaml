text: تَلْبَسُ الطَّبِيبَةُ قُفَّازَيْنِ حِمَايَةً لِيَدَيْهَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«يدي» اسم مجرور وعلامة جره الياء لأنه مثنى، وحُذفت النون للإضافة، و«ها» ضمير متصل في محل جر مضاف إليه
