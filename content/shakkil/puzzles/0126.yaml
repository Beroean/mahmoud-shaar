text: السَّيْفُ أَصْدَقُ أَنْبَاءً مِنَ الْكُتُبِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على وزن «أفعل»
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرِّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: أبو تمام
source: poetry
level: 2
