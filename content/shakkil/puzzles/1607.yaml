text: وَإِذَا افْتَقَرْتَ إِلَى الذَّخَائِرِ لَمْ تَجِدْ ذُخْرًا يَكُونُ كَصَالِحِ الْأَعْمَالِ
irab:
  - الواو استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل جر بإضافة «إذا» إليها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«افتقرت»
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة جواب الشرط لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع ناقص مرفوع وعلامة رفعه الضمة الظاهرة، واسمه ضمير مستتر تقديره هو، والجملة في محل نصب نعت لـ«ذخرا»
  - الكاف حرف جر، و«صالح» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «يكون»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - افتقرت
author: الأخطل
source: poetry
