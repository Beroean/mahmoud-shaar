text: وَمَا لِلْمَرْءِ خَيْرٌ فِي حَيَاةٍ إِذَا مَا عُدَّ مِنْ سَقَطِ الْمَتَاعِ
irab:
  - الواو استئنافية، و«ما» حرف نفي مبني على السكون
  - اللام حرف جر، و«المرء» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«خير»
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - حرف زائد مبني على السكون
  - فعل ماضٍ مبني للمجهول مبني على الفتح، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها، وجواب الشرط محذوف دلّ عليه ما قبله
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: قطري بن الفجاءة
source: poetry
level: 3
ref: «أقول لها وقد طارت شعاعا»
