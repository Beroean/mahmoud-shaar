text: مَنْ يَسْأَلِ النَّاسَ يَحْرِمُوهُ وَسَائِلُ اللَّهِ لَا يَخِيبُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرِّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به
  - الواو استئنافية، و«سائل» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
