text: يَعُدُّ الْأَطِبَّاءُ الْمَشْيَ دَوَاءً مُفِيدًا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، وهو بمعنى «يظنّ» ينصب مفعولين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
