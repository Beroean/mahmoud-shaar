text: اعْتَنَتِ الْمُمَرِّضَةُ بِالْمُصَابِينَ عِنَايَةً فَائِقَةً
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«المصابين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - مفعول مطلق (اسم مصدر نائب عن المصدر) منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
