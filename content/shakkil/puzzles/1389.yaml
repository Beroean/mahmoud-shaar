text: قَوْمِي هُمُ قَتَلُوا أُمَيْمَ أَخِي فَإِذَا رَمَيْتُ يُصِيبُنِي سَهْمِي
irab:
  - مبتدأ أول مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بالحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ ثانٍ، وضُمّت ميمه للوزن
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «هم»، وجملة «هم قتلوا» في محل رفع خبر «قومي»
  - منادى مرخم بحرف نداء محذوف، مبني على الضم على التاء المحذوفة في محل نصب، وفتحة الميم حركة الحرف قبل التاء على لغة من ينتظر، ويجوز «أميمُ» على لغة من لا ينتظر
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والجملة في محل جر بإضافة «إذا» إليها
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به مقدم، والجملة جواب الشرط لا محل لها
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
