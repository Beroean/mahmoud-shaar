text: وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا ثُمَّ يَقُولُ لِلْمَلَائِكَةِ أَهَـٰؤُلَاءِ إِيَّاكُمْ كَانُوا يَعْبُدُونَ
irab:
  - الواو استئنافية، و«يوم» مفعول به لفعل محذوف تقديره «اذكر» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به، والجملة في محل جر مضاف إليه
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - اللام حرف جر، و«الملائكة» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يقول»
  - الهمزة للاستفهام، و«ها» حرف تنبيه، و«أولاء» اسم إشارة مبني على الكسر في محل رفع مبتدأ
  - ضمير منفصل مبني على السكون في محل نصب مفعول به مقدّم لـ«يعبدون»، والكاف حرف خطاب، والميم علامة الجمع
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع اسم «كان»، والجملة في محل رفع خبر المبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل نصب خبر «كان»، والجملة الاسمية «أهؤلاء…» في محل نصب مقول القول
