text: أَيَّتُهَا النَّفْسُ أَجْمِلِي جَزَعَا إِنَّ الَّذِي تَحْذَرِينَ قَدْ وَقَعَا
irab:
  - منادى بحرف نداء محذوف، مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - نعت لـ«أيّة» مرفوع تبعًا للفظها وعلامة رفعه الضمة الظاهرة
  - فعل أمر مبني على حذف النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل
  - تمييز منصوب وعلامة نصبه الفتحة، والألف للإطلاق
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على السكون في محل نصب اسم «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل، والعائد محذوف (تحذرينه)، والجملة صلة الموصول لا محل لها
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والألف للإطلاق، والجملة في محل رفع خبر «إنّ»
alts: []
vary:
  - - جَزَعَا
    - جَزَعًا
author: أوس بن حجر
source: poetry
level: 3
ref: «أيتها النفس أجملي جزعا»
