text: وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا
irab:
  - الواو حرف عطف، و«اعتصموا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«حبل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«اعتصموا»
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - حال منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
alts: []
source: quran
level: 3
ref: سورة آل عمران، الآية ١٠٣
