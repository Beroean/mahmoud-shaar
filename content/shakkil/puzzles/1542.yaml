text: مَا تَسْبِقُ مِنْ أُمَّةٍ أَجَلَهَا وَمَا يَسْتَأْخِرُونَ
irab:
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - حرف جر زائد مبني على السكون
  - اسم مجرور لفظًا مرفوع محلًا فاعل «تسبق»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حرف عطف، و«ما» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
alts: []
source: quran
level: 2
ref: سورة المؤمنون، الآية ٤٣
