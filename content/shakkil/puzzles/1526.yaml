text: وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ
irab:
  - الواو حرف عطف، و«إلى» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة معطوف على «إلى الإبل» متعلق بـ«ينظرون»
  - اسم استفهام مبني على الفتح في محل نصب حال
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث الساكنة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل جر بدل اشتمال من «السماء»
alts: []
context: معطوفة على «أفلا ينظرون إلى الإبل كيف خُلقت»
source: quran
level: 2
ref: سورة الغاشية، الآية ١٨
