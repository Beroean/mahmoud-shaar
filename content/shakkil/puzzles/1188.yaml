text: أَغْلَقْنَا الْأَبْوَابَ اتِّقَاءً لِلْغُبَارِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«الغبار» اسم مجرور وعلامة جره الكسرة الظاهرة
