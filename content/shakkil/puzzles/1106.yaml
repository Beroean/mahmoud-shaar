text: إِنَّ الَّذِي سَمَكَ السَّمَاءَ بَنَى لَنَا بَيْتًا دَعَائِمُهُ أَعَزُّ وَأَطْوَلُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر، و«نا» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«بنى»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر المبتدأ «دعائمه» مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف (الوصفية ووزن الفعل)، والجملة في محل نصب نعت لـ«بيتًا»
  - الواو حرف عطف، و«أطول» معطوف مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف (الوصفية ووزن الفعل)
alts: []
fixed:
  - سمك
author: الفرزدق
source: poetry
level: 3
ref: «إن الذي سمك السماء بنى لنا»
