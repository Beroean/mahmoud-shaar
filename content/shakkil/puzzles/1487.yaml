text: تَحْمِلُ الْعَبَّارَةُ سَيَّارَتَيْنِ وَعَشَرَاتِ الرُّكَّابِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
  - الواو حرف عطف، و«عشرات» اسم معطوف منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
