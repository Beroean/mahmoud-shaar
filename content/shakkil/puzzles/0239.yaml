text: إِنَّ الْمُهَنْدِسِينَ الَّذِينَ صَمَّمُوا هَذَا الْجِسْرَ مَشْهُورُونَ فِي الْعَالَمِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - اسم موصول مبني على الفتح في محل نصب نعت
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - اسم إشارة مبني على السكون في محل نصب مفعول به
  - بدل منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
