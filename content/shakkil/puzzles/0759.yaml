text: قِيلَ إِنَّ أَجْدَادَنَا كَانُوا يَحْفَظُونَ اللُّحُومَ وَالْفَوَاكِهَ بِالتَّجْفِيفِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - حرف توكيد ونصب مبني على الفتح (كُسرت همزته بعد القول)، والجملة في محل رفع نائب فاعل
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «كان»، والجملة في محل رفع خبر «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«الفواكه» معطوف منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«التجفيف» اسم مجرور وعلامة جره الكسرة الظاهرة
