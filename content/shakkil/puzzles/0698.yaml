text: لَوْلَا الْمِعْطَفُ لَأَصَابَنِي الزُّكَامُ
irab:
  - حرف امتناع لوجود (شرط غير جازم) مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، والخبر محذوف وجوبًا تقديره موجود
  - اللام واقعة في جواب «لولا»، و«أصاب» فعل ماضٍ مبني على الفتح، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة جواب الشرط لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
