text: إِذَا انْخَفَضَتِ الْحَرَارَةُ تَحْتَ الصِّفْرِ تَجَمَّدَ الْمَاءُ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الفتح، والجملة جواب شرط غير جازم لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
