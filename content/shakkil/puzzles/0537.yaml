text: وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ
irab:
  - الواو حرف عطف، و«يبقى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - نعت لـ«وجه» مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الإكرام» معطوف مجرور وعلامة جره الكسرة
alts: []
source: quran
level: 2
ref: سورة الرحمن، الآية ٢٧
