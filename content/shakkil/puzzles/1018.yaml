text: شِيدَتِ الْقَلْعَةُ فَوْقَ تَلٍّ مُرْتَفِعٍ لِتَحْمِيَ الْمَدِينَةَ مِنَ الْغُزَاةِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - اللام لام التعليل حرف جر، و«تحمي» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - شُيِّدَتِ الْقَلْعَةُ فَوْقَ تَلٍّ مُرْتَفِعٍ لِتَحْمِيَ الْمَدِينَةَ مِنَ الْغُزَاةِ
source: llm-reviewed
level: 3
