text: أَكَّدَ الْمُرْشِدُ أَنَّ الْكَهْفَ آمِنٌ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف توكيد ونصب مبني على الفتح، من أخوات «إنّ»
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «أنّ» مرفوع وعلامة رفعه تنوين الضم، والمصدر المؤول من «أنّ» ومعموليها في محل نصب مفعول به
