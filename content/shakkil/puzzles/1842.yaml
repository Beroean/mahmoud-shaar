text: الْجِسْمُ فِي بَلَدٍ وَالرُّوحُ فِي بَلَدِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر
  - الواو حرف عطف، و«الروح» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «الروح»
alts:
  - الْجِسْمُ فِي بَلَدٍ وَالرُّوحُ فِي بَلَدٍ
author: ابن عبد ربه
source: poetry
ref: «الجسم في بلد والروح في بلد»
