text: لَوْ أَنَّ الْمُدُنَ زَرَعَتْ أَشْجَارًا أَكْثَرَ لَانْخَفَضَتْ حَرَارَةُ الصَّيْفِ فِيهَا
irab:
  - حرف شرط غير جازم مبني على السكون
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» ومعموليها في محل رفع فاعل لفعل محذوف تقديره «ثبت»
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «أنّ»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (اسم تفضيل على وزن «أفعل»)
  - اللام واقعة في جواب «لو»، و«انخفضت» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والجملة جواب شرط غير جازم لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر
