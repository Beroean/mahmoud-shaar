text: كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا أَسْلَفْتُمْ فِي الْأَيَّامِ الْخَالِيَةِ
irab:
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«اشربوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - صفة لمصدر محذوف تقديره «أكلًا وشربًا هنيئًا» منصوبة وعلامة نصبها تنوين الفتح
  - الباء حرف جر للسببية، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«كلوا واشربوا»
  - فعل ماضٍ مبني على السكون لاتصاله بضمير الرفع، و«تم» ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أسلفتم»
  - نعت مجرور وعلامة جره الكسرة
