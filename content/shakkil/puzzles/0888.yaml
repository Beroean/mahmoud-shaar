text: لَعَمْرُكَ مَا أَدْرِي وَإِنِّي لَأَوْجَلُ عَلَى أَيِّنَا تَعْدُو الْمَنِيَّةُ أَوَّلُ
irab:
  - اللام لام الابتداء، و«عمر» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، والخبر محذوف وجوبًا تقديره «قسمي»
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا، والجملة جواب القسم لا محل لها
  - الواو حالية، و«إنّ» حرف توكيد ونصب مبني على الفتح، والياء ضمير متصل في محل نصب اسم «إنّ»
  - اللام المزحلقة حرف توكيد، و«أوجل» خبر «إنّ» مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف (الوصفية ووزن الفعل)، والجملة في محل نصب حال
  - حرف جر مبني على السكون
  - اسم استفهام مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«تعدو»، والجملة الاستفهامية سدّت مسدّ مفعولي «أدري»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان مبني على الضم لقطعه عن الإضافة في محل نصب، متعلق بـ«تعدو»
