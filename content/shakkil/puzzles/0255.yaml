text: مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - الفاء رابطة لجواب الشرط، واللام حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل جزم جواب الشرط
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ١٨٩٣
