text: إِذَا الشَّمْسُ كُوِّرَتْ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب، وهو مضاف
  - نائب فاعل لفعل محذوف يفسره المذكور (إذا كُوِّرت الشمسُ)، مرفوع وعلامة رفعه الضمة، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث الساكنة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة تفسيرية لا محل لها
alts: []
source: quran
level: 3
ref: سورة التكوير، الآية ١
