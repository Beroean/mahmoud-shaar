text: سَيُقَامُ السُّوقُ الشَّعْبِيُّ فِي السَّاحَةِ الْكُبْرَى
irab:
  - السين حرف استقبال، و«يقام» فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
