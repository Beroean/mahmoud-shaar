text: مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ
irab:
  - نافية مبنية على السكون
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - «عن» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«أغنى»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل رفع معطوف على «ماله»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها، والعائد محذوف
alts: []
context: الحديث عن أبي لهب
source: quran
ref: سورة المسد، الآية ٢
