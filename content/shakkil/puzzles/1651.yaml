text: أَوْشَكَتِ الْقَهْوَةُ أَنْ تَبْرُدَ
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «أوشك» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول في محل نصب خبر «أوشك»
