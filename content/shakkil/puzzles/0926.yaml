text: لِأَبِي سَلِيمٍ مَزْرَعَةٌ وَاسِعَةٌ
irab:
  - اللام حرف جر، و«أبي» اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه تنوين الضم
alts: []
vary:
  - - سَلِيمٍ
    - سُلَيْمٍ
