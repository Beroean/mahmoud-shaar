text: لَيْسَ الْكَذَّابُ الَّذِي يُصْلِحُ بَيْنَ النَّاسِ، فَيَنْمِي خَيْرًا، أَوْ يَقُولُ خَيْرًا
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل نصب خبر «ليس»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، وشبه الجملة متعلق بـ«يصلح»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء حرف عطف، و«ينمي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف عطف مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
