text: إِنْ لَمْ تُسْقَ النَّبَاتَاتُ بِانْتِظَامٍ تَذْبُلْ أَوْرَاقُهَا خِلَالَ أَيَّامٍ
irab:
  - حرف شرط جازم مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، وهو فعل الشرط
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«انتظام» اسم مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts:
  - إِنْ لَمْ تَسْقِ النَّبَاتَاتِ بِانْتِظَامٍ تَذْبُلْ أَوْرَاقُهَا خِلَالَ أَيَّامٍ
source: llm-reviewed
level: 3
