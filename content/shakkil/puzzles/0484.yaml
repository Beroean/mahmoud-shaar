text: لَمْ يَحْضُرِ الِاجْتِمَاعَ أَحَدٌ غَيْرُ الْمُدِيرِ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - مفعول به مقدّم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
  - اسم بمعنى «إلا» بدل من «أحد» مرفوع وعلامة رفعه الضمة، ويجوز نصبه على أنه مستثنى، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَمْ يَحْضُرِ الِاجْتِمَاعَ أَحَدٌ غَيْرَ الْمُدِيرِ
source: llm-reviewed
level: 2
