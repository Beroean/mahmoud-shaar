text: الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ
irab:
  - اسم موصول مبني على السكون في محل جر بدل من «كل همزة»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«عدّد» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به
alts: []
context: وصف «كل همزة لمزة» في الآية السابقة
source: quran
ref: سورة الهمزة، الآية ٢
