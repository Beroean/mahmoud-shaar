text: الْتَقَى الْفَرِيقُ الْوَطَنِيُّ مُدَرِّبَهُ الْجَدِيدَ، الْخَبِيرَ الْإِسْبَانِيَّ، فِي أَوَّلِ تَدْرِيبٍ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - بدل منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
