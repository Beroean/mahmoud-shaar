text: خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ
irab:
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الكسرة عوضًا عن الفتحة لأنه جمع مؤنث سالم
  - الواو حرف عطف، و«الأرض» معطوف على «السماوات» منصوب وعلامة نصبه الفتحة
  - الباء حرف جر، و«الحق» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف حال من الفاعل
  - الواو حرف عطف، و«صوّر» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
  - الفاء حرف عطف، و«أحسن» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
alts: []
context: الحديث عن الله تعالى
source: quran
level: 3
ref: سورة التغابن، الآية ٣
