text: مَا كَانَ الْحَارِسُ لِيَنَامَ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام لام الجحود حرف جر، و«ينام» فعل مضارع منصوب بـ«أن» المضمرة بعد لام الجحود وعلامة نصبه الفتحة، والمصدر المؤول في محل جر، وشبه الجملة متعلق بمحذوف خبر «كان»
