text: سُرَّ الْجَدُّ بِزِيَارَةِ أَحْفَادِهِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«زيارة» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
