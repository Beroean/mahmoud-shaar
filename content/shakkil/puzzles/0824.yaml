text: تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً
irab:
  - فعل أمر مبني على حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
alts:
  - تَسَحَّرُوا فَإِنَّ فِي السُّحُورِ بَرَكَةً
source: hadith
ref: صحيح البخاري، الحديث ١٩٢٣
