text: كَمْ سَاعَةً تَسْتَغْرِقُ الرِّحْلَةُ؟
irab:
  - «كم» الاستفهامية اسم مبني على السكون في محل نصب مفعول به مقدم
  - تمييز «كم» الاستفهامية منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
