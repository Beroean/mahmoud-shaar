text: ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ
irab:
  - حرف عطف مبني على الفتح
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يموت»
  - الواو حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هو
alts: []
context: الحديث عن الأشقى الذي يصلى النار الكبرى
source: quran
ref: سورة الأعلى، الآية ١٣
