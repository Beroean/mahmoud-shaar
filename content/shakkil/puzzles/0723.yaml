text: أَنْتِ يَا سُعَادُ أَمْهَرُ رَسَّامَةٍ فِي الْمَدْرَسَةِ
irab:
  - ضمير منفصل مبني على الكسر في محل رفع مبتدأ
  - حرف نداء مبني على السكون
  - منادى علم مفرد مبني على الضم في محل نصب، والجملة اعتراضية لا محل لها
  - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف (على وزن أفعل)، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - أنت
source: llm-reviewed
level: 3
