text: لَا تَأْكُلِ السَّمَكَ وَتَشْرَبَ اللَّبَنَ
irab:
  - ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» وعلامة جزمه السكون، وحُرِّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - واو المعية، و«تشرب» فعل مضارع منصوب بـ«أن» المضمرة بعد واو المعية وعلامة نصبه الفتحة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts:
  - لَا تَأْكُلِ السَّمَكَ وَتَشْرَبِ اللَّبَنَ
  - لَا تَأْكُلِ السَّمَكَ وَتَشْرَبُ اللَّبَنَ
source: llm-reviewed
level: 2
