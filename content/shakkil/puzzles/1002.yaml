text: لَعَلَّ الْبَاحِثِينَ يَتَوَصَّلُونَ قَرِيبًا إِلَى لِقَاحٍ يَحْمِي الْأَطْفَالَ مِنَ الْأَمْرَاضِ الْمُعْدِيَةِ
irab:
  - حرف ترجٍّ ونصب مبني على الفتح
  - اسم «لعلّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «لعلّ»
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر نعت لـ«لقاح»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
