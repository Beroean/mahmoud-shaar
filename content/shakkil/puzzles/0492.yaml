text: أَحْضَرَتِ الْجَدَّةُ سَبْعَ بَيْضَاتٍ مِنَ الْقُنِّ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
