text: إِنْ تَزْرَعُوا الْأَشْجَارَ فِي أَحْيَائِكُمْ يَصِرِ الْهَوَاءُ أَنْقَى وَأَبْرَدَ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم بـ«إن» لأنه فعل الشرط وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - فعل مضارع ناقص مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم «يصير» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «يصير» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو ممنوع من الصرف (على وزن «أفعل»)
  - الواو حرف عطف، و«أبرد» معطوف منصوب وعلامة نصبه الفتحة الظاهرة، ولم يُنوَّن لأنه ممنوع من الصرف (على وزن «أفعل»)
