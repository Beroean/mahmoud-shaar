text: وَالنَّاسُ هَمُّهُمُ الْحَيَاةُ وَمَا أَرَى طُولَ الْحَيَاةِ يَزِيدُ غَيْرَ خَبَالِ
irab:
  - الواو استئنافية، و«الناس» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - مبتدأ ثانٍ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وحُرّك بالضم لالتقاء الساكنين
  - خبر المبتدأ الثاني مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل رفع خبر «الناس»
  - الواو حرف عطف، و«ما» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب مفعول به ثانٍ لـ«أرى»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - أَرَى
    - أُرَى
author: الأخطل
source: poetry
level: 3
ref: «لمن الديار بحايل فوعال»
