text: لَا يَنْبَغِي أَنْ يُتْرَكَ الدَّوَاءُ فِي مُتَنَاوَلِ الْأَطْفَالِ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع مبني للمجهول منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل رفع فاعل «ينبغي»
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا يَنْبَغِي أَنْ يَتْرُكَ الدَّوَاءَ فِي مُتَنَاوَلِ الْأَطْفَالِ
fixed:
  - يترك
source: llm-reviewed
