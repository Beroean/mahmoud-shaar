text: قِ نَفْسَكَ حَرَّ الشَّمْسِ
irab:
  - فعل أمر مبني على حذف حرف العلة من آخره، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - نفسك
