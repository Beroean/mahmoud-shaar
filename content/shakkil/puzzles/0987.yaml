text: لَا أُحِبُّ الشَّايَ بَلِ الْقَهْوَةَ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف عطف مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - معطوف على «الشاي» منصوب وعلامة نصبه الفتحة الظاهرة
