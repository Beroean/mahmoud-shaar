text: إِيَّاكِ وَالْمَاءَ السَّاخِنَ يَا صَغِيرَتِي
irab:
  - «إيّا» ضمير منفصل مبني على السكون في محل نصب مفعول به لفعل محذوف تقديره أحذّر، والكاف حرف خطاب (تحذير)
  - الواو عاطفة، و«الماء» مفعول به منصوب لفعل محذوف تقديره احذري، وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، والياء ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - إياك
source: llm-reviewed
level: 3
