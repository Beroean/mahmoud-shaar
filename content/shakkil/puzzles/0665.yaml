text: كَانَ أَبُو يُوسُفَ نَجَّارًا
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والعجمة
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
