text: عَلِمَ الْجَمِيعُ أَنَّ الرِّحْلَةَ أُلْغِيَتْ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» ومعموليها سدّ مسدّ مفعولي «علم»
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «أنّ»
