text: بِيعَتْ تَذَاكِرُ الْحَفْلِ فِي سَاعَةٍ وَاحِدَةٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
