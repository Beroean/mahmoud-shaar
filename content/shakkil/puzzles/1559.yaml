text: إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَىٰ ظُلْمًا إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَارًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - «إنّما» كافة ومكفوفة لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر «إنّ» في أول الآية
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يأكلون»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 3
ref: سورة النساء، الآية ١٠
