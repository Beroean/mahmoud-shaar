text: أَلَمْ تَرَوْا كَيْفَ خَلَقَ اللَّهُ سَبْعَ سَمَاوَاتٍ طِبَاقًا
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - اسم استفهام مبني على الفتح في محل نصب حال
  - فعل ماضٍ مبني على الفتح
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف (العدد)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر (تمييز العدد)
  - نعت لـ«سبع» منصوب وعلامة نصبه تنوين الفتح
alts: []
context: نوح عليه السلام يخاطب قومه
source: quran
level: 3
ref: سورة نوح، الآية ١٥
