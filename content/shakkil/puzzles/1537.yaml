text: أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ
irab:
  - الهمزة للاستفهام الإنكاري، والفاء حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - ظرف لما يُستقبل من الزمان مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والجملة في محل جر بالإضافة
  - اسم موصول مبني على السكون في محل رفع نائب فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
alts: []
context: الحديث عن الإنسان الجاحد لنعمة ربه
source: quran
level: 2
ref: سورة العاديات، الآية ٩
