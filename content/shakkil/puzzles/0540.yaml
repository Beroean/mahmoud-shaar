text: رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا
irab:
  - منادى بأداة نداء محذوفة منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - «لا» ناهية جازمة (للدعاء) مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - ظرف لما مضى من الزمان مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، و«نا» ضمير متصل في محل نصب مفعول به، والجملة في محل جر مضاف إليه
