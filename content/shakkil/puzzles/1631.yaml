text: لَا يَذُوقُونَ فِيهَا الْمَوْتَ إِلَّا الْمَوْتَةَ الْأُولَىٰ
irab:
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يذوقون»
  - مفعول به منصوب وعلامة نصبه الفتحة
  - أداة استثناء مبنية على السكون
  - مستثنى منصوب وعلامة نصبه الفتحة (استثناء منقطع)
  - نعت منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
alts: []
context: الحديث عن المتقين في الجنة
source: quran
level: 2
ref: سورة الدخان، الآية ٥٦
