text: أَعَزُّ مَكَانٍ فِي الدُّنَى سَرْجُ سَابِحٍ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، وهو ممنوع من الصرف على وزن «أفعل»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
