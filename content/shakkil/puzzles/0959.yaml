text: مَهْلًا مَهْلًا، فَالْأَرْضُ زَلِقَةٌ
irab:
  - مفعول مطلق منصوب لفعل محذوف تقديره تمهّل، وعلامة نصبه تنوين الفتح
  - توكيد لفظي منصوب وعلامة نصبه تنوين الفتح
  - الفاء تعليلية حرف مبني على الفتح، و«الأرض» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
