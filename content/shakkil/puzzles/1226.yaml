text: إِنْ تَمْشِ كُلَّ يَوْمٍ يَقْوَ قَلْبُكَ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف حرف العلة، والكسرة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف حرف العلة، والفتحة قبلها دليل عليها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - قلبك
source: llm-reviewed
level: 3
