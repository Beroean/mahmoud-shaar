text: الْعِلْمُ يَرْفَعُ صَاحِبَهُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والهاء ضمير متصل مبني على الضم في محل جر مضاف إليه
