text: إِنَّ اللَّهَ تَجَاوَزَ عَنْ أُمَّتِي مَا حَدَّثَتْ بِهِ أَنْفُسَهَا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«تجاوز»
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي يعود على الأمة، والجملة صلة الموصول لا محل لها
  - الباء حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«حدّثت»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه؛ ويُروى بالرفع فاعلًا لـ«حدّثت»
alts:
  - إِنَّ اللَّهَ تَجَاوَزَ عَنْ أُمَّتِي مَا حَدَّثَتْ بِهِ أَنْفُسُهَا
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٢٦٩
