text: أَضَاعُونِي وَأَيَّ فَتًى أَضَاعُوا
irab:
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - الواو اعتراضية، و«أيّ» اسم استفهام يفيد التعجب والتعظيم مفعول به مقدم لـ«أضاعوا» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر المقدر على الألف للتعذر
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والألف فارقة، والجملة اعتراضية لا محل لها
alts: []
author: العرجي
source: poetry
