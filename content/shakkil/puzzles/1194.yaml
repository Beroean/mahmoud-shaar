text: مَرَرْنَا بِوَادٍ عَمِيقٍ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«واد» اسم مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة لالتقاء الساكنين، منع من ظهورها الثقل
  - نعت مجرور وعلامة جره تنوين الكسر
