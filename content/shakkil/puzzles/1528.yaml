text: وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ
irab:
  - الواو استئنافية، و«ما» اسم استفهام مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به أول، والجملة في محل رفع خبر المبتدأ
  - اسم استفهام مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة سدّت مسدّ المفعول الثاني لـ«أدرى»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: الخطاب للنبي ﷺ
source: quran
ref: سورة القدر، الآية ٢
