text: يَتَّسِعُ الْقَارِبُ لِسِتَّةِ رُكَّابٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«ستة» اسم مجرور وعلامة جره الكسرة، وهو مضاف (العدد يخالف المعدود)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
