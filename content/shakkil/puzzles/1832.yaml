text: لَوْ أَنَّ لِابْنِ آدَمَ وَادِيًا مِنْ ذَهَبٍ أَحَبَّ أَنْ يَكُونَ لَهُ وَادِيَانِ
irab:
  - حرف شرط غير جازم مبني على السكون
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول منه ومن معموليه في محل رفع فاعل لفعل محذوف تقديره «ثبت»
  - اللام حرف جر، و«ابن» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «أنّ» مقدم
  - مضاف إليه مجرور وعلامة جره الفتحة بدل الكسرة لأنه ممنوع من الصرف (علم أعجمي)
  - اسم «أنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف نعت لـ«واديًا»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة جواب «لو» لا محل لها من الإعراب
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع ناقص منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به
  - اللام حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «يكون» مقدم
  - اسم «يكون» مؤخر مرفوع وعلامة رفعه الألف لأنه مثنى
