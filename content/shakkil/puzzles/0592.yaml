text: كُلُّ ابْنِ أُنْثَى وَإِنْ طَالَتْ سَلَامَتُهُ يَوْمًا عَلَى آلَةٍ حَدْبَاءَ مَحْمُولُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - الواو حالية، و«إنْ» وصلية (حرف شرط استُغني عن جوابه) مبني على السكون
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والتاء للتأنيث
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح، متعلق بـ«محمول»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (ألف التأنيث الممدودة)
  - خبر المبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: كعب بن زهير
source: poetry
level: 3
ref: قصيدة البردة («بانت سعاد»)
