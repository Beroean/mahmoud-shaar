text: مَنْ يَغْسِلْ يَدَيْهِ جَيِّدًا يَقِ نَفْسَهُ الْعَدْوَى
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى، وحُذفت النون للإضافة، والهاء ضمير متصل في محل جر مضاف إليه
  - صفة لمصدر محذوف (نائب عن المفعول المطلق) منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف حرف العلة (الياء)، والفاعل ضمير مستتر تقديره هو
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
