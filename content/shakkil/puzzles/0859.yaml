text: وَالنَّفْسُ رَاغِبَةٌ إِذَا رَغَّبْتَهَا وَإِذَا تُرَدُّ إِلَى قَلِيلٍ تَقْنَعُ
irab:
  - الواو استئنافية، و«النفس» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر بإضافة «إذا» إليها
  - الواو حرف عطف، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل جر بإضافة «إذا» إليها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة جواب الشرط لا محل لها
