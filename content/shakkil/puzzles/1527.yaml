text: ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ
irab:
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به
  - حال من الهاء منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
alts: []
context: الحديث عن الإنسان
source: quran
ref: سورة التين، الآية ٥
