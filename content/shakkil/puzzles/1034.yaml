text: فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ
irab:
  - الفاء رابطة لجواب شرط مقدر، و«ذا» اسم إشارة مبني على السكون في محل رفع مبتدأ، واللام للبعد، والكاف حرف خطاب
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة
alts: []
context: الإشارة إلى «الذي يكذّب بالدين» في الآية قبلها
source: quran
level: 2
ref: سورة الماعون، الآية ٢
