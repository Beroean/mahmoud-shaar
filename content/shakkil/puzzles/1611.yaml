text: وَمَا كُنْتُ أَدْرِي قَبْلَ عَزَّةَ مَا الْبُكَا وَلَا مُوجِعَاتِ الْقَلْبِ حَتَّى تَوَلَّتِ
irab:
  - الواو بحسب ما قبلها، و«ما» حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع اسم «كان»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل نصب خبر «كان»
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، متعلق بـ«أدري»
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)
  - اسم استفهام مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وجملة «ما البكا» في محل نصب سدّت مسدّ مفعولي «أدري»
  - الواو حرف عطف، و«لا» زائدة لتوكيد النفي
  - معطوف على محل جملة «ما البكا» منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف غاية وابتداء مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حُرّكت بالكسر للإطلاق، والفاعل ضمير مستتر تقديره هي يعود على «عزة»
