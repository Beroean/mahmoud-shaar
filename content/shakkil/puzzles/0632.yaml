text: وَإِنَّ الظَّنَّ لَا يُغْنِي مِنَ الْحَقِّ شَيْئًا
irab:
  - الواو حالية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يغني»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 2
ref: سورة النجم، الآية ٢٨
