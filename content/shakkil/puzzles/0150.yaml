text: أَعْلَمْتُ الطُّلَّابَ الِامْتِحَانَ سَهْلاً
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به أول منصوب وعلامة نصبه الفتحة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة
  - مفعول به ثالث منصوب وعلامة نصبه تنوين الفتح
alts: []
author: غسان كنفاني
