text: مَا زَالَ جَدِّي يَحْكِي لَنَا حِكَايَاتِ الْقَرْيَةِ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ما زال» مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والجملة في محل نصب خبر «ما زال»
  - اللام حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
