text: كَمْ مِتْرًا ارْتِفَاعُ الْمَنَارَةِ؟
irab:
  - «كم» اسم استفهام مبني على السكون في محل رفع خبر مقدم
  - تمييز «كم» الاستفهامية منصوب وعلامة نصبه تنوين الفتح
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
