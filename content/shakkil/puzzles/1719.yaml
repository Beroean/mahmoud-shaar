text: ثَمَّةَ حَلٌّ آخَرُ لِهٰذِهِ الْمُشْكِلَةِ
irab:
  - اسم إشارة للمكان البعيد مبني على الفتح في محل نصب على الظرفية، متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (الوصفية ووزن «أفعل»)
  - اللام حرف جر، و«هذه» اسم إشارة مبني على الكسر في محل جر
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة الظاهرة
