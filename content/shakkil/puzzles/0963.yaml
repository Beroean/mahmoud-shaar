text: حَيْثُمَا يَكْثُرِ الشَّجَرُ يَعْتَدِلِ الْجَوُّ
irab:
  - اسم شرط جازم مبني على السكون في محل نصب ظرف مكان
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
