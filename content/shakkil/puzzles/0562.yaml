text: أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اسم استفهام مبني على الفتح في محل نصب حال
  - فعل ماضٍ مبني على الفتح
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - بدل من «مثلًا» منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - الكاف حرف جر، و«شجرة» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف نعت لـ«كلمة»
  - نعت مجرور وعلامة جره تنوين الكسر
