text: ظَنَّتِ الْأُمُّ ابْنَهَا نَائِمًا فِي غُرْفَتِهِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، ينصب مفعولين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
