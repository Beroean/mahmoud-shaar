text: وَإِنَّ مَنْ أَدَّبْتَهُ فِي الصِّبَا كَالْعُودِ يُسْقَى الْمَاءَ فِي غَرْسِهِ
irab:
  - الواو استئنافية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وشبه الجملة متعلق بـ«أدّبته»
  - الكاف حرف جر، و«العود» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال من «العود»
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
vary:
  - - أَدَّبْتَهُ
    - أَدَّبْتُهُ
author: صالح بن عبد القدوس
source: poetry
level: 3
