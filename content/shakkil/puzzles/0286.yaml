text: يُحِبُّ جَدِّي أَنْ يَمْشِيَ عَلَى الشَّاطِئِ مَسَاءً
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
