text: الْأُمُّ تُحِبُّ أَبْنَاءَهَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
