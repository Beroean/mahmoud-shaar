text: لَا يَشْرَبَنَّ أَحَدٌ مِنْكُمْ قَائِمًا
irab:
  - حرف نهي جازم مبني على السكون
  - فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الثقيلة في محل جزم بـ«لا» الناهية، والنون حرف توكيد مبني على الفتح
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - «من» حرف جر، و«كم» ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف نعت لـ«أحد»
  - حال منصوب وعلامة نصبه تنوين الفتح
alts: []
source: hadith
level: 2
ref: صحيح مسلم، الحديث ٢٠٢٦
