text: اعْمَلْ مَا دُمْتَ قَادِرًا
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف مصدري ظرفي مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «دام»
  - خبر «دام» منصوب وعلامة نصبه تنوين الفتح
alts: []
fixed:
  - دمت
source: llm-reviewed
