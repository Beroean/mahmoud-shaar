text: رَسَمَ الطِّفْلُ سَمَكَةً بِقَلَمٍ أَزْرَقَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«قلم» اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صفة على وزن أفعل)
