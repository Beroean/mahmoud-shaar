text: أَوْشَكَ الْمَاءُ أَنْ يَغْلِيَ
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح
  - اسم «أوشك» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة على الياء، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب خبر «أوشك»
alts: []
fixed:
  - أوشك
source: llm-reviewed
