text: إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
  - فعل مضارع مبني على السكون لاتصاله بنون النسوة، والنون ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
alts: []
source: quran
level: 2
ref: سورة هود، الآية ١١٤
