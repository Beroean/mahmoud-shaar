text: وَمَا يَسْتَوِي الْبَحْرَانِ هَـٰذَا عَذْبٌ فُرَاتٌ سَائِغٌ شَرَابُهُ وَهَـٰذَا مِلْحٌ أُجَاجٌ
irab:
  - الواو استئنافية، و«ما» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الألف لأنه مثنى
  - «ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - خبر ثانٍ مرفوع وعلامة رفعه تنوين الضم
  - خبر ثالث مرفوع وعلامة رفعه تنوين الضم
  - فاعل لاسم الفاعل «سائغ» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل مبني على الضم في محل جر مضاف إليه
  - الواو حرف عطف، و«ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - خبر ثانٍ مرفوع وعلامة رفعه تنوين الضم
