text: إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَرْكَعْ رَكْعَتَيْنِ قَبْلَ أَنْ يَجْلِسَ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وحُرّكت الميم بالضم لالتقاء الساكنين
  - مفعول به منصوب على التوسع وعلامة نصبه الفتحة الظاهرة
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يركع» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - مفعول مطلق مبين للعدد منصوب وعلامة نصبه الياء لأنه مثنى
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر مضاف إليه
