text: وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ
irab:
  - الواو حرف عطف، و«أمّا» حرف شرط وتفصيل مبني على السكون
  - الباء حرف جر، و«نعمة» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«حدّث»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب «أمّا»، و«حدّث» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
alts: []
source: quran
level: 2
ref: سورة الضحى، الآية ١١
