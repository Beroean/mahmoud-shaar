text: حِينَ يَنْتَهِي الْمَوْسِمُ السِّيَاحِيُّ تَعُودُ الْقَرْيَةُ السَّاحِلِيَّةُ هَادِئَةً كَمَا كَانَتْ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة (معرب لإضافته إلى جملة صدرها مضارع)، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع ناقص بمعنى «تصير» مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم «تعود» مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «تعود» منصوب وعلامة نصبه تنوين الفتح
  - الكاف حرف جر، و«ما» حرف مصدري مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث، واسمه ضمير مستتر تقديره هي، وخبره محذوف، والمصدر المؤول في محل جر بالكاف
