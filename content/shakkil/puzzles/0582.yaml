text: لَا يُلْدَغُ الْمُؤْمِنُ مِنْ جُحْرٍ وَاحِدٍ مَرَّتَيْنِ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يُلدغ»
  - نعت مجرور وعلامة جره تنوين الكسر
  - مفعول مطلق نائب عن المصدر يبيّن عدد المرات، منصوب وعلامة نصبه الياء لأنه مثنى
alts:
  - لَا يُلْدَغِ الْمُؤْمِنُ مِنْ جُحْرٍ وَاحِدٍ مَرَّتَيْنِ
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٦١٣٣
