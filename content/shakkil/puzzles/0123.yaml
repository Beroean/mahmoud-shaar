text: أَنَا الَّذِي نَظَرَ الْأَعْمَى إِلَى أَدَبِي
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون المقدر على الألف
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
