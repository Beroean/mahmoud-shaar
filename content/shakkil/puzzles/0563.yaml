text: إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الأرض» معطوف مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«اختلاف» معطوف على «خلق» مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«النهار» معطوف مجرور وعلامة جره الكسرة
  - اللام المزحلقة للتوكيد، و«آيات» اسم «إنّ» مؤخر منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
alts: []
source: quran
level: 3
ref: سورة آل عمران، الآية ١٩٠
