text: أَلَا لَيْتَ الشَّبَابَ يَعُودُ يَوْمًا فَأُخْبِرَهُ بِمَا فَعَلَ الْمَشِيبُ
irab:
  - حرف استفتاح وتنبيه مبني على السكون
  - حرف تمنٍّ ونصب مبني على الفتح
  - اسم «ليت» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «ليت»
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - الفاء سببية، و«أخبر» فعل مضارع منصوب بـ«أن» المضمرة بعد فاء السببية وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا، والهاء ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
  - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
