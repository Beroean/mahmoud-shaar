text: لَا تَحْتَمِ بِالْأَشْجَارِ الْعَالِيَةِ أَثْنَاءَ الْعَاصِفَةِ، بَلِ ادْخُلْ أَقْرَبَ مَبْنًى
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف حرف العلة، والكسرة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«الأشجار» اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف إضراب وابتداء مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر
