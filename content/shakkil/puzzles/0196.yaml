text: لَوْ دَرَسْتَ لَنَجَحْتَ
irab:
  - حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة فعل الشرط
  - اللام واقعة في جواب «لو»، و«نجحت» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
alts:
  - لَوْ دَرَسْتِ لَنَجَحْتِ
source: llm-reviewed
level: 3
