text: أَعْطَى الْعَمُّ ابْنَ أَخِيهِ هَدِيَّةً
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
