text: اسْأَلْ أَخَاكَ الْأَكْبَرَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
fixed:
  - أخاك
