text: لَوْ حَجَزْنَا مُبَكِّرًا لَوَجَدْنَا مَقَاعِدَ
irab:
  - حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - نائب عن المفعول المطلق (صفة لمصدر محذوف تقديره حجزًا مبكرًا) منصوب وعلامة نصبه تنوين الفتح
  - اللام واقعة في جواب «لو»، و«وجد» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة بلا تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
