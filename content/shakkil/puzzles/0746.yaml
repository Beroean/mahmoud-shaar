text: مَا إِنْ وَصَلَ الْإِطْفَائِيُّونَ حَتَّى أَخْمَدُوا النَّارَ
irab:
  - حرف نفي مبني على السكون
  - حرف زائد مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف ابتداء مبني على السكون
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
