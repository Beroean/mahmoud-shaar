text: يَتَمَيَّزُ الطَّاوُوسُ بِذَيْلٍ ذِي أَلْوَانٍ زَاهِيَةٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«ذيل» اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
