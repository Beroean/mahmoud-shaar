text: إِنَّ اللَّهَ لَيُمْلِي لِلظَّالِمِ حَتَّى إِذَا أَخَذَهُ لَمْ يُفْلِتْهُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - اللام المزحلقة للتوكيد، و«يملي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر، و«الظالم» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يملي»
  - حرف ابتداء مبني على السكون
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل جر بإضافة «إذا» إليها
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة جواب الشرط لا محل لها
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٤٦٨٦
