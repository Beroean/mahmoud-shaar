text: هٰذَا الطَّالِبُ أَكْثَرُ زُمَلَائِهِ اجْتِهَادًا
irab:
  - اسم إشارة مبني على السكون في محل رفع مبتدأ
  - بدل مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة، وهو اسم تفضيل مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - تمييز منصوب وعلامة نصبه تنوين الفتح
