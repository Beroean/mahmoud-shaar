text: سَارَ الرَّاعِي بِأَغْنَامِهِ إِلَى وَادٍ بَعِيدٍ لِيَجِدَ عُشْبًا أَخْضَرَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل لأنه اسم منقوص
  - الباء حرف جر، و«أغنام» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة لأنه اسم منقوص
  - نعت مجرور وعلامة جره تنوين الكسر
  - اللام حرف جر للتعليل، و«يجد» فعل مضارع منصوب بـ«أن» المضمرة بعد لام التعليل وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف (صفة على وزن «أفعل»)
