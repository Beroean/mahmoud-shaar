text: وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ
irab:
  - الواو حالية، و«هم» ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - حرف جر مبني على السكون
  - اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«شهود»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الباء حرف جر، و«المؤمنين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بـ«يفعلون»
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب حال
