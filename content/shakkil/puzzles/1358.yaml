text: أَرَى النَّاسَ مَنْ دَانَاهُمُ هَانَ عِنْدَهُمْ وَمَنْ أَكْرَمَتْهُ عِزَّةُ النَّفْسِ أُكْرِمَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو، و«هم» ضمير متصل في محل نصب مفعول به، وحُرّك بالضم للوزن
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو، وجملتا الشرط والجواب في محل رفع خبر «مَن»، والجملة الكبرى في محل نصب مفعول به ثانٍ لـ«أرى»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«هان»
  - الواو حرف عطف، و«مَن» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والتاء للتأنيث، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني للمجهول مبني على الفتح في محل جزم جواب الشرط، والألف للإطلاق، ونائب الفاعل ضمير مستتر تقديره هو، وجملتا الشرط والجواب في محل رفع خبر «مَن»
alts: []
vary:
  - - أَرَى
    - أُرَى
  - - دَانَاهُمُ
    - دَانَاهُمْ
author: القاضي الجرجاني
source: poetry
level: 3
ref: «يقولون لي فيك انقباض»
