text: إِذَا بَلَغَ الْفِطَامَ لَنَا صَبِيٌّ تَخِرُّ لَهُ الْجَبَابِرُ سَاجِدِينَا
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - اللام حرف جر، و«نا» ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف حال من «صبي»
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة جواب الشرط لا محل لها
  - اللام حرف جر، والهاء ضمير متصل في محل جر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم، والألف للإطلاق
