text: مَنْ رَغِبَ عَنْ سُنَّتِي فَلَيْسَ مِنِّي
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«رغب»
  - الفاء رابطة لجواب الشرط، و«ليس» فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل جزم جواب الشرط
  - «من» حرف جر، والنون الثانية للوقاية، والياء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس»
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٠٦٣
