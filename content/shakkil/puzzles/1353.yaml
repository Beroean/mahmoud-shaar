text: وَمَا الْحَسَبُ الْمَوْرُوثُ لَا دَرَّ دَرُّهُ بِمُحْتَسَبٍ إِلَّا بِآخَرَ مُكْتَسَبْ
irab:
  - الواو استئنافية، و«ما» نافية حجازية تعمل عمل «ليس» مبنية على السكون
  - اسم «ما» مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي يفيد الدعاء مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، والجملة دعائية اعتراضية لا محل لها
  - الباء حرف جر زائد، و«محتسب» اسم مجرور لفظًا منصوب محلًّا خبر «ما»
  - أداة حصر لا عمل لها
  - الباء حرف جر، و«آخر» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (الوصفية ووزن «أفعل»)، وهو نعت لموصوف محذوف أي «بحسبٍ آخر»، وشبه الجملة متعلق بـ«محتسب»
  - نعت مجرور وعلامة جره الكسرة المقدرة منع من ظهورها السكون للوقف (القافية مقيّدة)
alts: []
vary:
  - - مُكْتَسَبْ
    - مُكْتَسَبٍ
author: ابن الرومي
source: poetry
level: 3
ref: «وما الحسب الموروث لا در دره»
