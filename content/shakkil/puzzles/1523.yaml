text: مَنْ يُحَافِظْ عَلَى مَوَاعِيدِ نَوْمِهِ يَسْتَيْقِظْ نَشِيطًا كُلَّ صَبَاحٍ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة لأنه مضاف، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - حال منصوب وعلامة نصبه تنوين الفتح
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
