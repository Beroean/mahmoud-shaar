text: يَا زَائِرَ الْمَتْحَفِ، لَا تَلْمُسِ اللَّوْحَاتِ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
alts:
  - يَا زَائِرَ الْمَتْحَفِ، لَا تَلْمِسِ اللَّوْحَاتِ
source: llm-reviewed
level: 2
