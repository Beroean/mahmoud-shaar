text: انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - حرف عطف مبني على السكون
  - اسم معطوف على «ظالمًا» منصوب وعلامة نصبه تنوين الفتح
alts: []
fixed:
  - أخاك
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٢٤٤٣
