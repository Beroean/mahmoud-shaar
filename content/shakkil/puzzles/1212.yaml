text: نَامَ أَهْلُ الْقَرْيَةِ مَا عَدَا الْفَرَّانَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري مبني على السكون
  - فعل ماضٍ جامد مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر وجوبًا، والمصدر المؤول في محل نصب حال
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة (وهو المستثنى)
