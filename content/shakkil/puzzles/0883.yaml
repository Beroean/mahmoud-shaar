text: يَا قَوْمِ إِنَّمَا هَـٰذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ الْقَرَارِ
irab:
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، والكسرة دليل عليها، وهو مضاف، والياء المحذوفة ضمير في محل جر مضاف إليه
  - «إنّ» حرف توكيد ونصب مكفوف، و«ما» كافة لا محل لها، و«إنما» أداة حصر
  - «ها» حرف تنبيه، و«ذه» اسم إشارة مبني على الكسر في محل رفع مبتدأ
  - بدل من اسم الإشارة مرفوع وعلامة رفعه الضمة
  - نعت لـ«الحياة» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر «هي» مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل رفع خبر «إنّ»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: مؤمن آل فرعون يخاطب قومه
source: quran
level: 3
ref: سورة غافر، الآية ٣٩
