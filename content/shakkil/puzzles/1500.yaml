text: ضَلَّ الرَّحَّالَةُ فِي صَحْرَاءَ مُوحِشَةٍ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (مختوم بألف التأنيث الممدودة)
  - نعت مجرور وعلامة جره تنوين الكسر
