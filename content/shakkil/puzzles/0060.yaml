text: عِنْدِي عِشْرُونَ كِتَاباً
irab:
  - ظرف مكان منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة في محل رفع خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم
  - تمييز منصوب وعلامة نصبه تنوين الفتح
