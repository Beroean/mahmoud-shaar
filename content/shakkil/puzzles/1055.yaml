text: وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا
irab:
  - الواو حرف عطف، و«يطعمون» فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به ثانٍ مقدَّم منصوب وعلامة نصبه الفتحة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف حال من الفاعل
  - مفعول به أول مؤخَّر منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«يتيمًا» معطوف على «مسكينًا» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«أسيرًا» معطوف على «مسكينًا» منصوب وعلامة نصبه تنوين الفتح
