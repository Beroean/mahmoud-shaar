text: ادَّخَرَ الشَّابُّ مَالَهُ لِيَشْتَرِيَ سَيَّارَةً
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - اللام لام التعليل حرف جر، و«يشتري» فعل مضارع منصوب بـ«أن» المضمرة وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
