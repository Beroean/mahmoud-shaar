text: مَعَ أَنَّهَا كَانَتْ مُتْعَبَةً لَمْ تَتَوَقَّفِ الْمُتَسَابِقَةُ عَنِ الْجَرْيِ
irab:
  - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف توكيد ونصب مبني على الفتح، و«ها» ضمير متصل في محل نصب اسم «أنّ»، والمصدر المؤول في محل جر مضاف إليه
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث، واسمه ضمير مستتر تقديره هي، والجملة في محل رفع خبر «أنّ»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
