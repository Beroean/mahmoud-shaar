text: فَازَتِ الْمُصَوِّرَةُ بِإِحْدَى عَشْرَةَ جَائِزَةً
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«إحدى» الجزء الأول من العدد المركب مبني على الفتح المقدر على الألف للتعذر
  - الجزء الثاني من العدد المركب مبني على الفتح، والعدد المركب في محل جر بالباء
  - تمييز العدد منصوب وعلامة نصبه تنوين الفتح
