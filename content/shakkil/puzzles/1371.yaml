text: يَبْدَأُ مَوْسِمُ جَنْيِ الْعِنَبِ فِي أَوَاخِرِ الصَّيْفِ، فَيَخْرُجُ الْأَهَالِي إِلَى الْكُرُومِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة لأنه مضاف، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء حرف عطف، و«يخرج» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل (اسم منقوص)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
