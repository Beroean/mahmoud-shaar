text: بَلَىٰ إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا
irab:
  - حرف جواب لإبطال النفي مبني على السكون
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - الباء حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«بصيرًا»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
alts: []
context: ردٌّ على من ظنّ أنه لن يرجع إلى ربه
source: quran
ref: سورة الانشقاق، الآية ١٥
