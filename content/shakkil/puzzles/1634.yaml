text: عُذِّبَتِ امْرَأَةٌ فِي هِرَّةٍ سَجَنَتْهَا حَتَّى مَاتَتْ، فَدَخَلَتْ فِيهَا النَّارَ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه تنوين الضم
  - حرف جر للسببية مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«عذبت»
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر نعت لـ«هرة»
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي
  - الفاء حرف عطف، و«دخل» فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي
  - «في» حرف جر للسببية، و«ها» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«دخلت»
  - مفعول به منصوب على التوسع وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٣٤٨٢
