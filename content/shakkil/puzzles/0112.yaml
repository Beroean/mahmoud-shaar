text: اللَّهُ لَا إِلَـٰهَ إِلَّا هُوَ
irab:
  - لفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - نافية للجنس تعمل عمل «إنّ»
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف تقديره «موجود»، والجملة في محل رفع خبر المبتدأ
  - أداة استثناء ملغاة
  - ضمير منفصل مبني على الفتح في محل رفع بدل من محل «لا» واسمها
alts: []
source: quran
level: 3
ref: سورة البقرة، الآية ٢٥٥
