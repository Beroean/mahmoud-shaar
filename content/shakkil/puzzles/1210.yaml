text: لَمْ يَكُنِ الْبَحَّارُ لِيَتْرُكَ سَفِينَتَهُ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم «يكن» مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام لام الجحود حرف جر، و«يترك» فعل مضارع منصوب بأن مضمرة بعد لام الجحود وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر، وشبه الجملة متعلق بمحذوف خبر «يكن»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - ليترك
