text: إِذَا اشْتَدَّتِ الْحَرَارَةُ فَاشْرَبُوا الْمَاءَ وَابْتَعِدُوا عَنِ الشَّمْسِ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة فعل الشرط في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء رابطة لجواب الشرط، و«اشربوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«ابتعدوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
