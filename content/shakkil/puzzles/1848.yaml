text: إِنَّ السَّفِيهَ إِذَا لَمْ يُنْهَ مَأْمُورُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب، وجوابه محذوف دلّ عليه ما قبله
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: الأحوص
source: poetry
level: 3
ref: «بني هلال ألا فانهوا سفيهكم»
