text: وَيَبْقَى مِنَ الْمَالِ الْأَحَادِيثُ وَالذِّكْرُ
irab:
  - الواو حرف عطف، و«يبقى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون، وحُرِّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يبقى»
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«الذكر» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: حاتم الطائي
source: poetry
ref: «أماويّ قد طال التجنب والهجر»
