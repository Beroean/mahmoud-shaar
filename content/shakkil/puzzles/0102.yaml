text: قُلْ هُوَ اللَّهُ أَحَدٌ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - ضمير الشأن، ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - لفظ الجلالة مبتدأ ثانٍ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر المبتدأ الثاني مرفوع وعلامة رفعه تنوين الضم، والجملة في محل رفع خبر المبتدأ الأول
alts: []
source: quran
level: 2
ref: سورة الإخلاص، الآية ١
