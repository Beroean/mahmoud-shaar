text: إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - اللام المزحلقة للتوكيد، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر «إنّ»
alts: []
source: quran
ref: سورة الانفطار، الآية ١٣
