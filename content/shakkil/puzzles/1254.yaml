text: لَوْلَا الْمَنَارَةُ لَضَلَّتِ السُّفُنُ طَرِيقَهَا فِي اللَّيَالِي الْمُظْلِمَةِ
irab:
  - حرف امتناع لوجود (شرط غير جازم) مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، والخبر محذوف وجوبًا
  - اللام واقعة في جواب «لولا»، و«ضلّ» فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل
  - نعت مجرور وعلامة جره الكسرة الظاهرة
