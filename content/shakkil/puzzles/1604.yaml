text: فَمَا كَانَ قَيْسٌ هُلْكُهُ هُلْكَ وَاحِدٍ وَلَكِنَّهُ بُنْيَانُ قَوْمٍ تَهَدَّمَا
irab:
  - الفاء استئنافية، و«ما» حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه تنوين الضم
  - بدل اشتمال من «قيس» مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر «كان» منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، ويجوز «هلكُ» فيكون «هلكه» مبتدأ و«هلك» خبره والجملة خبر «كان»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«لكنّ» حرف استدراك ونصب، والهاء ضمير متصل مبني على الضم في محل نصب اسم «لكنّ»
  - خبر «لكنّ» مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على الفتح، والألف للإطلاق، والفاعل ضمير مستتر تقديره هو يعود على «بنيان»، والجملة في محل رفع نعت لـ«بنيان»
alts: []
vary:
  - - هُلْكَ
    - هُلْكُ
author: عبدة بن الطبيب
source: poetry
level: 3
