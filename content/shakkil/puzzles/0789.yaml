text: وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا
irab:
  - الواو حرف عطف، و«أنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة
  - اللام حرف جر، ولفظ الجلالة اسم مجرور، وشبه الجملة في محل رفع خبر «أنّ»
  - الفاء استئنافية، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة متعلق بـ«تدعوا»
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
