text: إِنْ لَمْ تَشْحَنِ الْهَاتِفَ اللَّيْلَةَ فَلَنْ تَسْتَطِيعَ الِاتِّصَالَ صَبَاحًا
irab:
  - حرف شرط جازم مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة فعل الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء رابطة لجواب الشرط، و«لن» حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة في محل جزم جواب الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
