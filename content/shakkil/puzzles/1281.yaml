text: فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا
irab:
  - الفاء واقعة في جواب «أمّا»، و«سوف» حرف استقبال مبني على الفتح
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
context: من أوتي كتابه بيمينه
source: quran
level: 2
ref: سورة الانشقاق، الآية ٨
