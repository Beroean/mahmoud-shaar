text: يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ
irab:
  - حرف نداء مبني على السكون
  - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع وعلامة رفعه الضمة
  - اللام حرف جر، و«م» اسم استفهام مبني على السكون في محل جر، وشبه الجملة متعلق بـ«تحرّم»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - اللام حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«أحلّ»
