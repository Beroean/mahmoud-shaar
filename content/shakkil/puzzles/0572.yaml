text: الْمَرْءُ مَعَ مَنْ أَحَبَّ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والعائد محذوف (أي أحبَّه)، والجملة صلة الموصول لا محل لها من الإعراب
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٦١٦٨
