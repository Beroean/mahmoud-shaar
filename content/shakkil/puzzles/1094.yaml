text: وَلَيْسَ رَئِيسُ الْقَوْمِ مَنْ يَحْمِلُ الْحِقْدَا
irab:
  - الواو حرف عطف، و«ليس» فعل ماضٍ ناقص جامد مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة، وهو مضاف (ويجوز نصبه خبرًا مقدمًا لـ«ليس» و«مَن» اسمها مؤخرًا)
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اسم موصول مبني على السكون في محل نصب خبر «ليس»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - رَئِيسُ
    - رَئِيسَ
author: المقنع الكندي
source: poetry
level: 2
ref: «يعاتبني في الدين قومي وإنما»
