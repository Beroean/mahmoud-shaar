text: هٰذَا نَهْرٌ سَرِيعٌ جَرَيَانُهُ
irab:
  - اسم إشارة مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - نعت سببي مرفوع وعلامة رفعه تنوين الضم
  - فاعل للصفة المشبهة «سريع» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts:
  - هٰذَا نَهَرٌ سَرِيعٌ جَرَيَانُهُ
source: llm-reviewed
