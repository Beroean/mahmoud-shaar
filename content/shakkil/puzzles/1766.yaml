text: تَحْسَبُهُمْ جَمِيعًا وَقُلُوبُهُمْ شَتَّىٰ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الواو حالية، و«قلوب» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والجملة الاسمية في محل نصب حال
alts: []
context: الحديث عن المنافقين ومن حالفهم من أهل الكتاب
source: quran
level: 2
ref: سورة الحشر، الآية ١٤
