text: دَعْ عَنْكَ لَوْمِي فَإِنَّ اللَّوْمَ إِغْرَاءُ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - حرف جر مبني على السكون، والكاف ضمير متصل في محل جر
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
context: الشاعر يخاطب رجلًا يلومه
author: أبو نواس
source: poetry
level: 2
ref: «دع عنك لومي فإن اللوم إغراء»
