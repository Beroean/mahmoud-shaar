text: تَحَرَّوْا لَيْلَةَ الْقَدْرِ فِي الْوِتْرِ مِنَ الْعَشْرِ الْأَوَاخِرِ مِنْ رَمَضَانَ
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«تحرّوا»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف حال من «الوتر»
  - نعت مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (صيغة منتهى الجموع) لكنه جُرّ بالكسرة لدخول «أل» عليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة بدل الكسرة لأنه ممنوع من الصرف (علم مختوم بألف ونون زائدتين)، وشبه الجملة متعلق بمحذوف نعت لـ«العشر»
