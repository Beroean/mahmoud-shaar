text: مَا أَحْسَنَ أَنْ يَصْدُقَ الْمَرْءُ!
irab:
  - نكرة تامة بمعنى «شيء» مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
