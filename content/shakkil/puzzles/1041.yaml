text: فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
irab:
  - الفاء استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل جر بإضافة «إذا» إليها
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الفاء رابطة لجواب الشرط، و«استعذ» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة جواب شرط غير جازم لا محل لها
  - الباء حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«استعذ»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«استعذ»
  - نعت مجرور وعلامة جره الكسرة
