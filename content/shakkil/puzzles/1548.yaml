text: فَادْعُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ
irab:
  - الفاء استئنافية، و«ادعوا» فعل أمر مبني على حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - اللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«مخلصين»
  - مفعول به لاسم الفاعل «مخلصين» منصوب وعلامة نصبه الفتحة
  - الواو حالية، و«لو» حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم، وجواب «لو» محذوف دلّ عليه ما قبله
alts: []
context: الخطاب للمؤمنين
source: quran
level: 3
ref: سورة غافر، الآية ١٤
