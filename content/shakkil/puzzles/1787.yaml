text: فَقَالُوا أَنُؤْمِنُ لِبَشَرَيْنِ مِثْلِنَا وَقَوْمُهُمَا لَنَا عَابِدُونَ
irab:
  - الفاء حرف عطف، و«قالوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - الهمزة للاستفهام الإنكاري، و«نؤمن» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل نصب مقول القول
  - اللام حرف جر، و«بشرين» اسم مجرور وعلامة جره الياء لأنه مثنى، وشبه الجملة متعلق بـ«نؤمن»
  - نعت مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - الواو حالية، و«قوم» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هما» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - اللام حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«عابدون»
  - خبر مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم، والجملة الاسمية في محل نصب حال
alts: []
context: قول فرعون وملئه عن موسى وهارون
source: quran
level: 3
ref: سورة المؤمنون، الآية ٤٧
