text: لَا إِلَـٰهَ إِلَّا هُوَ يُحْيِي وَيُمِيتُ
irab:
  - نافية للجنس تعمل عمل «إنّ» مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف تقديره «موجود»
  - أداة حصر مبنية على السكون
  - ضمير منفصل مبني على الفتح في محل رفع بدل من الضمير المستتر في الخبر المحذوف
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة استئنافية لا محل لها
  - الواو حرف عطف، و«يميت» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
alts: []
source: quran
level: 3
ref: سورة الدخان، الآية ٨
