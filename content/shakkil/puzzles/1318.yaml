text: وَاللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُ وَاللَّهُ يَشْهَدُ إِنَّ الْمُنَافِقِينَ لَكَاذِبُونَ
irab:
  - الواو اعتراضية، ولفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
  - «إنّ» حرف توكيد ونصب، والكاف ضمير متصل مبني على الفتح في محل نصب اسم «إنّ»
  - اللام المزحلقة للتوكيد، و«رسول» خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، ولفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - اللام المزحلقة للتوكيد، و«كاذبون» خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
context: الله تعالى يخاطب النبي ﷺ عن المنافقين
source: quran
level: 3
ref: سورة المنافقون، الآية ١
