text: إِنَّ الْحُرُوفَ تَمُوتُ حِينَ تُقَالُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «إنّ»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل جر مضاف إليه
alts: []
author: نزار قباني
source: poetry
level: 3
