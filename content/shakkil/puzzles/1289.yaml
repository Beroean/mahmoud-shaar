text: لِيُحِقَّ الْحَقَّ وَيُبْطِلَ الْبَاطِلَ وَلَوْ كَرِهَ الْمُجْرِمُونَ
irab:
  - اللام حرف جر للتعليل، و«يحقّ» فعل مضارع منصوب بأن مضمرة بعد اللام وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«يبطل» فعل مضارع معطوف على «يحقّ» منصوب وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حالية، و«لو» حرف شرط غير جازم مبني على السكون، وجوابه محذوف
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
context: الحديث عن الله تعالى في غزوة بدر
source: quran
level: 3
ref: سورة الأنفال، الآية ٨
