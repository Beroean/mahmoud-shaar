text: تَسْكُنُ زَيْنَبُ قُرْبَ الْبَحْرِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (العلمية والتأنيث)
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
