text: وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ
irab:
  - الواو حرف عطف، واللام حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدّم
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال من «جمال»
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - ظرف زمان منصوب وعلامة نصبه الفتحة متعلق بـ«جمال»، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل جر مضاف إليه
  - الواو حرف عطف، و«حين» ظرف زمان منصوب وعلامة نصبه الفتحة معطوف على «حين» الأول، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل جر مضاف إليه
alts: []
context: الحديث عن الأنعام، والخطاب للناس
source: quran
level: 2
ref: سورة النحل، الآية ٦
