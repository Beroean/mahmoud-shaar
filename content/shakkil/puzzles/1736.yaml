text: أَخَذَ الطِّفْلُ يَتَهَجَّى الْكَلِمَاتِ بِصَوْتٍ عَالٍ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «أخذ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «أخذ»
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - الباء حرف جر، و«صوت» اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة لالتقاء الساكنين، منع من ظهورها الثقل (اسم منقوص منوّن)
