text: اسْتَمْتَعْنَا بِرِحْلَةٍ إِلَى جَزَائِرَ صَغِيرَةٍ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«رحلة» اسم مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره تنوين الكسر
