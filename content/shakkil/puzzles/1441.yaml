text: قَابَلْنَا الْحَكَمَيْنِ كِلَيْهِمَا
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
  - توكيد معنوي منصوب وعلامة نصبه الياء لأنه ملحق بالمثنى، وهو مضاف، و«هما» ضمير متصل في محل جر مضاف إليه
