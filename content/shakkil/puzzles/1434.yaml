text: مَنْ يَتَعَلَّمِ السِّبَاحَةَ يَنْجُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف حرف العلة، والضمة قبلها دليل عليها، والفاعل ضمير مستتر تقديره هو
