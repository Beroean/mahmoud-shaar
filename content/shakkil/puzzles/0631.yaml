text: أَلَمْ نَجْعَلِ الْأَرْضَ مِهَادًا
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - مفعول به أول منصوب وعلامة نصبه الفتحة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 2
ref: سورة النبأ، الآية ٦
