text: وَكُلُّ ذِي غَيْبَةٍ يَؤُوبُ وَغَائِبُ الْمَوْتِ لَا يَؤُوبُ
irab:
  - الواو استئنافية، و«كل» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - الواو حرف عطف، و«غائب» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
