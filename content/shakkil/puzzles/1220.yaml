text: يَجِبُ أَلَّا يُهْمِلَ الْمَرِيضُ مَوَاعِيدَ دَوَائِهِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - «أن» حرف مصدري ونصب مبني على السكون، و«لا» نافية لا عمل لها، والمصدر المؤول في محل رفع فاعل «يجب»
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
