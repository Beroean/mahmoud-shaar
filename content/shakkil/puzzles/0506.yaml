text: اشْتَرَكَتْ خَمْسُ مَدَارِسَ فِي مُسَابَقَةِ الْعُلُومِ الَّتِي أُقِيمَتْ فِي الْعَاصِمَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)، وهو تمييز العدد
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اسم موصول مبني على السكون في محل جر نعت لـ«مسابقة»
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، ونائب الفاعل ضمير مستتر تقديره هي، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
