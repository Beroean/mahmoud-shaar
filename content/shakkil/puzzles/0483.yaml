text: مَا قَرَأَ الطَّالِبُ مِنَ الْكِتَابِ إِلَّا صَفْحَتَيْنِ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - أداة حصر مبنية على السكون
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
