text: ارْمُوا بَنِي إِسْمَاعِيلَ فَإِنَّ أَبَاكُمْ كَانَ رَامِيًا
irab:
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - منادى بحرف نداء محذوف منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والعجمة
  - الفاء للتعليل، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٢٨٩٩
