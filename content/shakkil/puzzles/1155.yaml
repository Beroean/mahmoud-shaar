text: الْهُدُوءَ، فَالْمَرْضَى نِيَامٌ
irab:
  - مفعول به منصوب لفعل محذوف تقديره الزموا (إغراء)، وعلامة نصبه الفتحة الظاهرة
  - الفاء تعليلية حرف مبني على الفتح، و«المرضى» مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه تنوين الضم
