text: وَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا
irab:
  - الواو حرف عطف، و«كلوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - «من» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«كلوا»
  - فعل ماضٍ مبني على الفتح، و«كم» ضمير متصل مبني على السكون في محل نصب مفعول به، وحُرّك بالضم لالتقاء الساكنين، والجملة صلة الموصول لا محل لها
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 2
ref: سورة المائدة، الآية ٨٨
