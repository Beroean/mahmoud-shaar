text: فِي الْحَقْلِ بَقَرَةٌ سَوْدَاءُ
irab:
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (على وزن فعلاء)
