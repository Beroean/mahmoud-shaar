text: لَا يَحْسُنُ الْقَوْلُ حَتَّى يَحْسُنَ الْعَمَلُ
irab:
  - حرف نفي مبني على السكون لا عمل له
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بأن مضمرة بعد «حتى» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل جر بـ«حتى»، وشبه الجملة متعلق بـ«يحسن» الأول
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: الشاب الظريف
source: poetry
level: 2
ref: «أرح يمينك مما أنت معتقل»
