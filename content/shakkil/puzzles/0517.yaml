text: كَانَتِ الْقَرْيَةُ هَادِئَةً جِدًّا قَبْلَ أَنْ يُبْنَى فِيهَا الْمَصْنَعُ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - مفعول مطلق لفعل محذوف منصوب وعلامة نصبه تنوين الفتح
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل جر مضاف إليه
  - فعل مضارع مبني للمجهول منصوب بـ«أن» وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
