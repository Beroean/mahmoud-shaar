text: لَا تَعْذِلِيهِ فَإِنَّ الْعَذْلَ يُولِعُهُ قَدْ قُلْتِ حَقًّا وَلَكِنْ لَيْسَ يَسْمَعُهُ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الكسر في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«لكنْ» حرف استدراك مخفف مهمل مبني على السكون
  - فعل ماضٍ ناقص جامد مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل نصب خبر «ليس»
alts: []
vary:
  - - تَعْذِلِيهِ
    - تَعْذُلِيهِ
context: الشاعر يخاطب امرأة تلومه، ويتحدث عن نفسه بضمير الغائب
author: ابن زريق البغدادي
source: poetry
level: 3
ref: «لا تعذليه فإن العذل يولعه»
