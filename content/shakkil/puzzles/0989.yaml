text: كَانَ جَارُنَا الْعَجُوزُ طَيِّبَ الْقَلْبِ، كَرِيمَ النَّفْسِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «كان» منصوب وعلامة نصبه الفتحة، وهو مضاف (صفة مشبهة)
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر ثانٍ لـ«كان» منصوب وعلامة نصبه الفتحة، وهو مضاف (صفة مشبهة)
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
