text: إِذَا انْتَعَلَ أَحَدُكُمْ فَلْيَبْدَأْ بِالْيَمِينِ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يبدأ» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«اليمين» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«يبدأ»
