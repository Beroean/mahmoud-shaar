text: إِنْ تَغْسِلُوا أَيْدِيَكُمْ تَحْمُوا أَنْفُسَكُمْ مِنَ الْأَمْرَاضِ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
