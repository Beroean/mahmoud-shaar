text: فَلِلَّهِ الْحَمْدُ رَبِّ السَّمَاوَاتِ وَرَبِّ الْأَرْضِ رَبِّ الْعَالَمِينَ
irab:
  - الفاء بحسب ما قبلها، واللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة في محل رفع خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة
  - بدل من لفظ الجلالة مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة لأنه جمع مؤنث سالم
  - الواو حرف عطف، و«ربّ» معطوف مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - بدل ثانٍ مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
