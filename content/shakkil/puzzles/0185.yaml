text: اسْتَيْقَظْتُ مُبَكِّراً لِأُصَلِّيَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - اللام لام التعليل، و«أصلي» فعل مضارع منصوب بـ«أن» المضمرة وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا
alts: []
fixed:
  - استيقظت
source: llm-reviewed
level: 2
