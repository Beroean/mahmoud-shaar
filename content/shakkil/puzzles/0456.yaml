text: الْجَوُّ بَارِدٌ، لٰكِنَّ الشَّمْسَ مُشْرِقَةٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - حرف استدراك ونصب مبني على الفتح
  - اسم «لكنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «لكنّ» مرفوع وعلامة رفعه تنوين الضم
alts:
  - الْجَوُّ بَارِدٌ، لٰكِنِ الشَّمْسُ مُشْرِقَةٌ
source: llm-reviewed
