text: وَمَنْ لَا يُحِبَّ صُعُودَ الْجِبَالِ يَعِشْ أَبَدَ الدَّهْرِ بَيْنَ الْحُفَرْ
irab:
  - الواو استئنافية، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - حرف نفي مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرِّك بالفتح لالتقاء الساكنين لأنه مضعّف، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة منع من ظهورها السكون للوقف (القافية مقيّدة)
alts:
  - وَمَنْ لَا يُحِبِّ صُعُودَ الْجِبَالِ يَعِشْ أَبَدَ الدَّهْرِ بَيْنَ الْحُفَرْ
  - وَمَنْ لَا يُحِبَّ صُعُودَ الْجِبَالِ يَعِشْ أَبَدَ الدَّهْرِ بَيْنَ الْحُفَرِ
  - وَمَنْ لَا يُحِبِّ صُعُودَ الْجِبَالِ يَعِشْ أَبَدَ الدَّهْرِ بَيْنَ الْحُفَرِ
author: أبو القاسم الشابي
source: poetry
level: 3
ref: إرادة الحياة
