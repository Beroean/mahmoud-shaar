text: جَعَلَ الْمُهَنْدِسُونَ الصَّحْرَاءَ الْقَاحِلَةَ حُقُولًا خَضْرَاءَ تُنْتِجُ الْقَمْحَ
irab:
  - فعل ماضٍ مبني على الفتح، من أفعال التحويل ينصب مفعولين
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (ألف التأنيث الممدودة)
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب نعت ثانٍ لـ«حقولًا»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
