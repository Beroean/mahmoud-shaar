text: حَتَّى الْأَطْفَالُ شَارَكُوا فِي زِرَاعَةِ الْأَشْجَارِ
irab:
  - حرف ابتداء مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
