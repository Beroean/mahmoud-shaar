text: إِذَا جَاءَ رَمَضَانُ فُتِّحَتْ أَبْوَابُ الْجَنَّةِ وَغُلِّقَتْ أَبْوَابُ النَّارِ وَصُفِّدَتِ الشَّيَاطِينُ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف للعلمية وزيادة الألف والنون
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، والجملة جواب الشرط لا محل لها
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«غُلّقت» فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«صُفّدت» فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، وكُسرت لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
