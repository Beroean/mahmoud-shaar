text: أَصَالَةُ الرَّأْيِ صَانَتْنِي عَنِ الْخَطَلِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - حرف جر مبني على السكون، وحُرِّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: الطغرائي
source: poetry
ref: لامية العجم
