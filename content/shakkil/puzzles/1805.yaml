text: مَثَلُ الَّذِينَ حُمِّلُوا التَّوْرَاةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ الْحِمَارِ يَحْمِلُ أَسْفَارًا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم موصول مبني على الفتح في محل جر مضاف إليه
  - فعل ماضٍ مبني للمجهول مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع نائب فاعل، والجملة صلة الموصول لا محل لها
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة
  - حرف عطف مبني على الفتح
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم وعلامة جزمه حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، و«ها» ضمير متصل مبني على السكون في محل نصب مفعول به
  - الكاف حرف جر، و«مثل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر المبتدأ
  - مضاف إليه مجرور وعلامة جره الكسرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال من «الحمار»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
