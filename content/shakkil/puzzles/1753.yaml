text: تَقْطَعُ اللَّقَالِقُ كُلَّ خَرِيفٍ مَسَافَاتٍ طَوِيلَةً لِتَصِلَ إِلَى الْمَنَاطِقِ الدَّافِئَةِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - اللام لام التعليل حرف جر، و«تصل» فعل مضارع منصوب بـ«أن» المضمرة وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
