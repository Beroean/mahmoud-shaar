text: آذَنَتْنَا بِبَيْنِهَا أَسْمَاءُ رُبَّ ثَاوٍ يُمَلُّ مِنْهُ الثَّوَاءُ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، و«نا» ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«بين» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، ولم يُنوَّن لأنه ممنوع من الصرف (العلمية والتأنيث)
  - حرف جر شبيه بالزائد مبني على الفتح
  - مبتدأ مرفوع محلًّا مجرور لفظًا بـ«ربّ» وعلامة جره الكسرة المقدرة على الياء المحذوفة لأنه اسم منقوص
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر المبتدأ «ثاوٍ» (وقيل في محل جر نعت له، والخبر محذوف)
  - «من» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يُملّ»
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
