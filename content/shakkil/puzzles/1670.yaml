text: الْمُتَدَرِّبُونَ لَمْ يُكْمِلُوا التَّمْرِينَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts:
  - الْمُتَدَرِّبُونَ لَمْ يُكَمِّلُوا التَّمْرِينَ
source: llm-reviewed
