text: أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو يعود على «ربك»
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف في محل نصب مفعول به ثانٍ
alts: []
context: الحديث عن أصحاب الفيل
source: quran
level: 3
ref: سورة الفيل، الآية ٢
