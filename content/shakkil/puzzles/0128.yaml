text: وَمَنْ لَا يَتَّقِ الشَّتْمَ يُشْتَمِ
irab:
  - الواو استئنافية، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - نافية مبنية على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مبني للمجهول مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرِّك بالكسر للقافية
alts: []
author: زهير بن أبي سلمى
source: poetry
level: 3
