text: رَأَيْتُ رَجُلاً كَرِيماً أَبُوهُ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت سببي منصوب وعلامة نصبه تنوين الفتح
  - فاعل لاسم الفاعل «كريمًا» مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
author: غسان كنفاني
