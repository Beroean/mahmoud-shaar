text: مَنْ يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - اللام حرف جر، والياء ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يضمن»
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بمحذوف صلة الموصول
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى، وحُذفت النون للإضافة، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل نصب معطوف على «ما» الأولى
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بمحذوف صلة الموصول
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى، وحُذفت النون للإضافة، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - اللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«أضمن»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts:
  - مَنْ يَضْمَنْ لِي مَا بَيْنَ لِحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٤٧٤
