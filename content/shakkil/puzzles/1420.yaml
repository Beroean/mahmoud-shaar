text: اسْتَيْقَظْنَا وَطُلُوعَ الشَّمْسِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - الواو واو المعية حرف مبني على الفتح، و«طلوع» مفعول معه منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
