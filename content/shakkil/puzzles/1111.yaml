text: طُبِعَتْ عَلَى كَدَرٍ وَأَنْتَ تُرِيدُهَا صَفْوًا مِنَ الْأَقْذَاءِ وَالْأَكْدَارِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، ونائب الفاعل ضمير مستتر تقديره هي (الدنيا)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«طُبعت»
  - الواو حالية، و«أنت» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنت، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر، وجملة «وأنت تريدها» في محل نصب حال
  - حال منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرِّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«صفوًا»
  - الواو حرف عطف، و«الأكدار» معطوف مجرور وعلامة جره الكسرة الظاهرة
alts: []
context: الشاعر يتحدث عن الدنيا، والخطاب عامّ لكل سامع
author: أبو الحسن التهامي
source: poetry
level: 3
ref: «حكم المنية في البرية جاري»
