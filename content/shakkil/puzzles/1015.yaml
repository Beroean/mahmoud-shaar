text: لَمْ تَكُنِ الرِّحْلَةُ مُتْعِبَةً، بَلْ كَانَتْ مُمْتِعَةً مِنْ بِدَايَتِهَا إِلَى نِهَايَتِهَا
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم «تكن» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «تكن» منصوب وعلامة نصبه تنوين الفتح
  - حرف إضراب وابتداء مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث حرف مبني على السكون، واسمه ضمير مستتر تقديره هي
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
