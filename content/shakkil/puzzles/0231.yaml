text: سَتُبْدِي لَكَ الْأَيَّامُ مَا كُنْتَ جَاهِلًا وَيَأْتِيكَ بِالْأَخْبَارِ مَنْ لَمْ تُزَوِّدِ
irab:
  - السين للاستقبال، و«تبدي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - اللام حرف جر، والكاف ضمير متصل في محل جر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «كان»، والجملة صلة الموصول لا محل لها
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«يأتي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والكاف ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«الأخبار» اسم مجرور وعلامة جره الكسرة الظاهرة
  - اسم موصول مبني على السكون في محل رفع فاعل
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُرّك بالكسر للروي، والفاعل ضمير مستتر تقديره أنت، والجملة صلة الموصول
