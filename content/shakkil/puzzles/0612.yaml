text: فِيمَا مَضَى كُنْتَ بِالْأَعْيَادِ مَسْرُورًا فَسَاءَكَ الْعِيدُ فِي أَغْمَاتَ مَأْسُورَا
irab:
  - «في» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «كان»
  - الباء حرف جر، و«الأعياد» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«مسرورًا»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - الفاء عاطفة، و«ساء» فعل ماضٍ مبني على الفتح، والكاف ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)
  - حال منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - مَأْسُورَا
    - مَأْسُورًا
context: الشاعر يخاطب نفسه في منفاه
author: المعتمد بن عباد
source: poetry
level: 3
ref: «فيما مضى كنتَ بالأعياد مسرورا»
