text: وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ
irab:
  - الواو حرف عطف، و«ما» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - «عن» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«يغني»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
alts: []
context: الحديث عن البخيل المكذّب
