text: فَمَنِ اتَّقَىٰ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
irab:
  - الفاء حرف عطف، و«مَن» اسم شرط جازم مبني على السكون في محل رفع مبتدأ، وحُرّك بالكسر لالتقاء الساكنين
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - الواو حرف عطف، و«أصلح» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - الفاء رابطة لجواب الشرط، و«لا» نافية تعمل عمل «ليس» مبنية على السكون
  - اسم «لا» مرفوع وعلامة رفعه تنوين الضم
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»، والجملة في محل جزم جواب الشرط
  - الواو حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر المبتدأ
alts: []
context: خطاب لبني آدم إن أتتهم رسل منهم
source: quran
level: 3
ref: سورة الأعراف، الآية ٣٥
