text: مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُصِبْ مِنْهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يرد»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو يعود على الله
  - «من» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يصب»
alts:
  - مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُصَبْ مِنْهُ
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٦٤٥
