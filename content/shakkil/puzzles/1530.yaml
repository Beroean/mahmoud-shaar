text: يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة متعلق بـ«تحدّث»، وهو مضاف، و«إذ» ظرف مبني على السكون في محل جر مضاف إليه، وحُرّك بالكسر لالتقاء الساكنين، والتنوين عوض عن جملة محذوفة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة جواب «إذا» في الآية الأولى لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
alts: []
context: الحديث عن الأرض يوم القيامة
source: quran
ref: سورة الزلزلة، الآية ٤
