text: قَالُوا سُبْحَانَ رَبِّنَا إِنَّا كُنَّا ظَالِمِينَ
irab:
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - مفعول مطلق لفعل محذوف تقديره «نسبّح» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - «كان» فعل ماضٍ ناقص مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع اسم «كان»، والجملة في محل رفع خبر «إنّ»
  - خبر «كان» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts: []
context: أصحاب البستان حين رأوه قد احترق
source: quran
level: 2
ref: سورة القلم، الآية ٢٩
