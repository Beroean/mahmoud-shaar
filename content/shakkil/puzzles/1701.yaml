text: لَمْ يَنْجُ مِنَ الصَّقِيعِ نَبَاتٌ إِلَّا الصَّنَوْبَرُ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الواو)
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - حرف استثناء مبني على السكون
  - بدل من «نبات» مرفوع وعلامة رفعه الضمة الظاهرة، ويجوز نصبه على أنه مستثنى بـ«إلا»
alts:
  - لَمْ يَنْجُ مِنَ الصَّقِيعِ نَبَاتٌ إِلَّا الصَّنَوْبَرَ
source: llm-reviewed
level: 3
