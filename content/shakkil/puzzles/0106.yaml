text: اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - الباء حرف جر، و«اسم» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - اسم موصول مبني على السكون في محل جر نعت لـ«ربك»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
alts: []
source: quran
level: 2
ref: سورة العلق، الآية ١
