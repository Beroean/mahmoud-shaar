text: يُصْنَعُ الزُّبْدُ مِنَ الْحَلِيبِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - يَصْنَعُ الزُّبْدَ مِنَ الْحَلِيبِ
source: llm-reviewed
