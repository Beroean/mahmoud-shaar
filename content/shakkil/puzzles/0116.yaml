text: وَلَا تَهِنُوا وَلَا تَحْزَنُوا
irab:
  - الواو بحسب ما قبلها، و«لا» ناهية جازمة
  - فعل مضارع مجزوم بـ«لا» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الواو عاطفة، و«لا» ناهية جازمة
  - فعل مضارع مجزوم بـ«لا» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
alts: []
source: quran
level: 2
ref: سورة آل عمران، الآية ١٣٩
