text: كَلَّا بَلْ تُحِبُّونَ الْعَاجِلَةَ
irab:
  - حرف ردع وزجر مبني على السكون
  - حرف إضراب مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
alts: []
context: الخطاب للمكذبين بيوم القيامة
source: quran
ref: سورة القيامة، الآية ٢٠
