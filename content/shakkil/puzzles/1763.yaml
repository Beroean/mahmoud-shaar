text: يَتَمَيَّزُ الْخَطُّ الْكُوفِيُّ مِنْ غَيْرِهِ بِزَوَايَاهُ الْحَادَّةِ وَأَشْكَالِهِ الْهَنْدَسِيَّةِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«زوايا» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«أشكال» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
