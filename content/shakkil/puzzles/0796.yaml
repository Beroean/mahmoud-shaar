text: إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - ضمير فصل مبني على الفتح لا محل له من الإعراب
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة
  - خبر ثانٍ مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - نعت لـ«ذو» مرفوع وعلامة رفعه الضمة
alts: []
source: quran
level: 3
ref: سورة الذاريات، الآية ٥٨
