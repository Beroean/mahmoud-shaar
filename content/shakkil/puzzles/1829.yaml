text: إِنَّ اللَّهَ كَرِهَ لَكُمْ ثَلَاثًا قِيلَ وَقَالَ، وَإِضَاعَةَ الْمَالِ، وَكَثْرَةَ السُّؤَالِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر، و«كم» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«كره»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح، وهو من ألفاظ العدد
  - فعل ماضٍ مبني للمجهول مبني على الفتح على الحكاية، والجملة المحكية في محل نصب بدل من «ثلاثًا»
  - الواو حرف عطف، و«قال» فعل ماضٍ مبني على الفتح على الحكاية، والجملة المحكية معطوفة على «قيل»
  - الواو حرف عطف، و«إضاعة» معطوف على «قيل وقال» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«كثرة» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
