text: سَافَرَ أَبِي صَبَاحاً
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل مبني على السكون في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
