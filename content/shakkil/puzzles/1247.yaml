text: يَوْمَ يَفْتَحُ الْمَسْرَحُ الْوَطَنِيُّ أَبْوَابَهُ يَتَوَافَدُ الْجُمْهُورُ مِنْ كُلِّ مَكَانٍ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة (معرب لإضافته إلى جملة صدرها مضارع)، وهو مضاف، وهو متعلق بـ«يتوافد»
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
