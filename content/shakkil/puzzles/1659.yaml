text: نَامَ الطِّفْلُ وَالْمِصْبَاحُ مُضَاءٌ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو واو الحال حرف مبني على الفتح، و«المصباح» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة الاسمية في محل نصب حال
