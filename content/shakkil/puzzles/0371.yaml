text: أُغْلِقَتِ الْمَحَلَّاتُ كُلُّهَا إِلَّا الصَّيْدَلِيَّةَ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - توكيد معنوي مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف استثناء مبني على السكون
  - مستثنى منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
vary:
  - - أُغْلِقَتِ الْمَحَلَّاتُ كُلُّهَا
    - أَغْلَقْتُ الْمَحَلَّاتِ كُلَّهَا
    - أَغْلَقْتَ الْمَحَلَّاتِ كُلَّهَا
    - أَغْلَقْتِ الْمَحَلَّاتِ كُلَّهَا
    - أَغْلَقَتِ الْمَحَلَّاتِ كُلَّهَا
