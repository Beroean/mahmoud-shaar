text: تَبَارَكَ اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
  - نعت لـ«ربّ» مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الإكرام» اسم معطوف مجرور وعلامة جره الكسرة
alts: []
context: خاتمة سورة الرحمن، والخطاب لكل سامع
source: quran
level: 2
ref: سورة الرحمن، الآية ٧٨
