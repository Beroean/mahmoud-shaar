text: إِنْ أَرَدْتُمْ رُؤْيَةَ الشُّرُوقِ فَاصْعَدُوا إِلَى سَطْحِ الْفُنْدُقِ قَبْلَ الْفَجْرِ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بضمير الرفع المتحرك في محل جزم فعل الشرط، و«تم» ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، و«اصعدوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل جزم جواب الشرط
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
