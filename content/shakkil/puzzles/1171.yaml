text: الْمُحَامِي يُدَافِعُ عَنِ الْمُتَّهَمِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
