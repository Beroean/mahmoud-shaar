text: فَالنَّارُ تَأْكُلُ بَعْضَهَا إِنْ لَمْ تَجِدْ مَا تَأْكُلُهْ
irab:
  - الفاء تعليلية، و«النار» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف شرط جازم مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هي، والجملة فعل الشرط، وجوابه محذوف دلّ عليه ما قبله
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والهاء ضمير متصل في محل نصب مفعول به سُكِّنت للوقف، والجملة صلة الموصول لا محل لها
alts: []
vary:
  - - تَأْكُلُهْ
    - تَأْكُلُهُ
author: ابن المعتز
source: poetry
level: 3
ref: «اصبر على حسد الحسود»
