text: نَغْفُلُ وَالْأَيَّامُ لَا تَغْفُلُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - الواو حالية، و«الأيام» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي مبني على السكون لا عمل له
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر، وجملة «الأيام لا تغفل» في محل نصب حال
alts: []
author: ديك الجن
source: poetry
ref: «نغفل والأيام لا تغفل»
