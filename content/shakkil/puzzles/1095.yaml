text: إِذَا لَمْ تَسْتَطِعْ شَيْئًا فَدَعْهُ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت، والجملة في محل جر بإضافة «إذا» إليها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الفاء رابطة لجواب الشرط، و«دع» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والهاء ضمير متصل في محل نصب مفعول به، والجملة جواب الشرط لا محل لها
alts: []
author: عمرو بن معديكرب
source: poetry
level: 3
ref: «أمن ريحانة الداعي السميع»
