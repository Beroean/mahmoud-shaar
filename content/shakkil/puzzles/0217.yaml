text: قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - حرف نداء مبني على السكون
  - منادى نكرة مقصودة مبني على الضم في محل نصب
  - فعل أمر ناقص مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع اسم «كان»
  - خبر «كوني» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«سلامًا» معطوف منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (علم أعجمي)
alts: []
source: quran
level: 3
ref: سورة الأنبياء، الآية ٦٩
