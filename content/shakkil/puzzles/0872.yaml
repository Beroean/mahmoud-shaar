text: يَا سَلْمَى، أَغْلِقِي النَّوَافِذَ قَبْلَ الْمَطَرِ
irab:
  - حرف نداء مبني على السكون
  - منادى علم مفرد مبني على الضم المقدر على الألف للتعذر في محل نصب
  - فعل أمر مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
