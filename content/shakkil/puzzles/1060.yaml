text: وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ قَالَ يَا قَوْمِ اتَّبِعُوا الْمُرْسَلِينَ
irab:
  - الواو حرف عطف، و«جاء» فعل ماضٍ مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، وشبه الجملة متعلق بـ«جاء»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع نعت لـ«رجل»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة استئنافية لا محل لها
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، وهو مضاف، والياء المحذوفة ضمير في محل جر مضاف إليه
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب مقول القول
  - مفعول به منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
