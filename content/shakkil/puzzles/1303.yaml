text: أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ
irab:
  - حرف عطف مبني على السكون
  - اسم معطوف على «فكّ» مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«إطعام»
  - نعت لـ«يوم» مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
context: في بيان «العقبة» (فكّ رقبة أو إطعام)
source: quran
level: 2
ref: سورة البلد، الآية ١٤
