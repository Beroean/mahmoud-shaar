text: إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الفتح» اسم معطوف مرفوع وعلامة رفعه الضمة
alts: []
source: quran
level: 2
ref: سورة النصر، الآية ١
