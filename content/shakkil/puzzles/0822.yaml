text: مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مبني للمجهول مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، ونائب الفاعل ضمير مستتر تقديره هو
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مبني للمجهول مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، ونائب الفاعل ضمير مستتر تقديره هو
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢٥٩٢
