text: اخْتِيرَتْ هُدَى قَائِدَةً لِلْفَرِيقِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - نائب فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - اللام حرف جر، و«الفريق» اسم مجرور وعلامة جره الكسرة الظاهرة
