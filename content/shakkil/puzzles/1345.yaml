text: وَتَلَفَّتَتْ عَيْنِي فَمُذْ خَفِيَتْ عَنْهَا الطُّلُولُ تَلَفَّتَ الْقَلْبُ
irab:
  - الواو حرف عطف، و«تلفّت» فعل ماضٍ مبني على الفتح، والتاء للتأنيث
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء حرف عطف، و«مذ» ظرف زمان مبني على السكون في محل نصب متعلق بـ«تلفّت» الثاني
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والجملة في محل جر بإضافة «مذ» إليها
  - «عن» حرف جر، و«ها» ضمير متصل في محل جر يعود على العين، وشبه الجملة متعلق بـ«خفيت»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
