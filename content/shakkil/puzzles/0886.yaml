text: أَنَا النَّبِيُّ لَا كَذِبْ أَنَا ابْنُ عَبْدِ الْمُطَّلِبْ
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي للجنس مبني على السكون
  - اسم «لا» النافية للجنس مبني على الفتح في محل نصب، وسُكّن للوقف، وخبرها محذوف
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة، منع من ظهورها سكون الوقف
alts:
  - أَنَا النَّبِيُّ لَا كَذِبَ أَنَا ابْنُ عَبْدِ الْمُطَّلِبْ
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٢٨٦٤
