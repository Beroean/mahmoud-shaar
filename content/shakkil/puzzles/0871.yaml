text: مَا تَأَخَّرَ عَنِ الْمَوْعِدِ أَحَدٌ إِلَّا سَمِيرٌ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
  - حرف استثناء مبني على السكون
  - بدل من «أحد» مرفوع وعلامة رفعه تنوين الضم (ويجوز نصبه مستثنى)
