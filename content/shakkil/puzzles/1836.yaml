text: لَا خَيْرَ فِيمَا لَيْسَ فِيهِ حَسُودُ
irab:
  - نافية للجنس تعمل عمل «إنّ» مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - «في» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»
  - فعل ماضٍ ناقص جامد مبني على الفتح، والجملة صلة الموصول لا محل لها
  - «في» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - اسم «ليس» مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: مهيار الديلمي
source: poetry
level: 2
ref: «تهوى وأنت محلأ مصدود»
