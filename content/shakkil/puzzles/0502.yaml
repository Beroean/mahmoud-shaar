text: أُعْلِنَتْ أَسْمَاءُ الْفَائِزَاتِ بِجَوَائِزِ الْمُسَابَقَةِ فِي حَفْلٍ كَبِيرٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو جمع مؤنث سالم
  - الباء حرف جر، و«جوائز» اسم مجرور وعلامة جره الكسرة لأنه مضاف، وهو في الأصل ممنوع من الصرف (صيغة منتهى الجموع)
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
vary:
  - - أُعْلِنَتْ أَسْمَاءُ
    - أَعْلَنْتُ أَسْمَاءَ
    - أَعْلَنْتَ أَسْمَاءَ
    - أَعْلَنْتِ أَسْمَاءَ
    - أَعْلَنَتْ أَسْمَاءَ
source: llm-reviewed
level: 3
