text: لَنْ يَنْسَى الْأَوْفِيَاءُ أَصْدِقَاءَهُمْ
irab:
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
