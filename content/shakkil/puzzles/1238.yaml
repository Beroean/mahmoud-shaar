text: حَضَرَ الْمُزَارِعُونَ أَنْفُسُهُمْ مَعْرِضَ الْآلَاتِ الزِّرَاعِيَّةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - توكيد معنوي مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
