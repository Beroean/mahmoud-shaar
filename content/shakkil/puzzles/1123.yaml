text: اشْتَرَتِ الْأُمُّ لِابْنَتِهَا ثَوْبًا أَبْيَضَ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«ابنة» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (الوصفية ووزن الفعل)
