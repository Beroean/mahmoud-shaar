text: مَنْ صَلَّى عَلَيَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - «على» حرف جر، وياء المتكلم ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«صلّى»
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح، والتقدير صلاةً واحدةً
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم جواب الشرط
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - «على» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«صلّى»
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح، وهو من ألفاظ العدد، والتقدير عشرَ صلواتٍ
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٤٠٨
