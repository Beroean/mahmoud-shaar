text: مَتَى تَعْصِفِ الرِّيَاحُ نُؤَجِّلِ الرِّحْلَةَ
irab:
  - اسم شرط جازم مبني على السكون في محل نصب ظرف زمان
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
