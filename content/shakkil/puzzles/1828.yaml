text: اللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ
irab:
  - لفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ظرفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، والمصدر المؤول في محل نصب ظرف زمان
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «كان»
  - مضاف إليه مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 2
ref: صحيح مسلم، الحديث ٢٦٩٩
