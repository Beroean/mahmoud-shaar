text: أُعَلِّلُ النَّفْسَ بِالْآمَالِ أَرْقُبُهَا مَا أَضْيَقَ الْعَيْشَ لَوْلَا فُسْحَةُ الْأَمَلِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره أنا
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«الآمال» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أعلّل»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل نصب حال
  - «ما» التعجبية نكرة تامة مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو يعود على «ما»، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف امتناع لوجود (شرط غير جازم) مبني على السكون، وجوابه محذوف دلّ عليه ما قبله
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والخبر محذوف وجوبًا
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: الطغرائي
source: poetry
level: 3
ref: لامية العجم
