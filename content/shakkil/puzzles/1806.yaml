text: وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَـٰئِكَ أَصْحَابُ النَّارِ خَالِدِينَ فِيهَا
irab:
  - الواو حرف عطف، و«الذين» اسم موصول مبني على الفتح في محل رفع مبتدأ
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«كذّبوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - الباء حرف جر، و«آيات» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«كذّبوا»
  - اسم إشارة مبني على الكسر في محل رفع مبتدأ ثانٍ
  - خبر المبتدأ الثاني مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل رفع خبر المبتدأ الأول «الذين»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - حال منصوبة وعلامة نصبها الياء لأنه جمع مذكر سالم
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«خالدين»
