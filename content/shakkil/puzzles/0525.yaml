text: فَصَلِّ لِرَبِّكَ وَانْحَرْ
irab:
  - الفاء الفصيحة، و«صلّ» فعل أمر مبني على حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«ربّ» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«انحر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
alts: []
source: quran
level: 2
ref: سورة الكوثر، الآية ٢
