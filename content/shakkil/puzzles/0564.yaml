text: وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا
irab:
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - اللام حرف جر، و«الناس» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تصعّر»
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تمش»
  - حال منصوب وعلامة نصبه تنوين الفتح
