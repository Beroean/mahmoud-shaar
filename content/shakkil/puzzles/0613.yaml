text: وَلَوْ أَنِّي حُبِيتُ الْخُلْدَ فَرْدًا لَمَا أَحْبَبْتُ بِالْخُلْدِ انْفِرَادَا
irab:
  - الواو استئنافية، و«لو» حرف شرط غير جازم مبني على السكون
  - «أنّ» حرف توكيد ونصب، والياء ضمير متصل في محل نصب اسم «أنّ»، والمصدر المؤول فاعل لفعل محذوف تقديره «ثبت»
  - فعل ماضٍ مبني للمجهول مبني على السكون لاتصاله بالتاء، والتاء ضمير متصل في محل رفع نائب فاعل، والجملة في محل رفع خبر «أنّ»
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
  - اللام واقعة في جواب «لو»، و«ما» حرف نفي مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
  - الباء حرف جر، و«الخلد» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«انفرادا»
  - مفعول به منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - انْفِرَادَا
    - انْفِرَادًا
fixed:
  - حبيت
  - أحببت
author: أبو العلاء المعري
