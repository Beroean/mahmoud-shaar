text: فَلَمْ يَسْتَبِينُوا الرُّشْدَ إِلَّا ضُحَى الْغَدِ
irab:
  - الفاء حرف عطف، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - أداة حصر مبنية على السكون لا عمل لها
  - ظرف زمان منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف، متعلق بـ«يستبينوا»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: دريد بن الصمة
