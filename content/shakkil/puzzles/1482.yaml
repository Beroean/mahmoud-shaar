text: قَطَفَ الْفَلَّاحُونَ الزَّيْتُونَ وَالْفَجْرُ لَمْ يَطْلُعْ بَعْدُ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حالية، و«الفجر» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر، والجملة الاسمية في محل نصب حال
  - ظرف زمان مبني على الضم لقطعه عن الإضافة في محل نصب
