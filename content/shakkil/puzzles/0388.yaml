text: مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة لا محل لها من الإعراب
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«نقصت»
alts: []
source: hadith
ref: صحيح مسلم، الحديث ٢٥٨٨
