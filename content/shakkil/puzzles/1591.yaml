text: وَالْعَيْشُ شُحٌّ وَإِشْفَاقٌ وَتَأْمِيلُ
irab:
  - الواو بحسب ما قبلها، و«العيش» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«إشفاق» معطوف على «شحّ» مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«تأميل» معطوف مرفوع وعلامة رفعه الضمة الظاهرة، ولم يُنوَّن لأنه في القافية
alts: []
author: عبدة بن الطبيب
source: poetry
