text: أَرَى بَصَرِي قَدْ رَابَنِي بَعْدَ صِحَّةٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به أول منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو يعود على «بصري»، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة في محل نصب مفعول به ثانٍ لـ«أرى»
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، متعلق بـ«رابني»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
