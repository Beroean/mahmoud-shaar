text: وَلَقَدْ آتَيْنَا لُقْمَانَ الْحِكْمَةَ أَنِ اشْكُرْ لِلَّهِ
irab:
  - الواو استئنافية، واللام واقعة في جواب قسم مقدّر، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو ممنوع من الصرف للعلمية وزيادة الألف والنون
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة
  - حرف تفسير مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة تفسيرية لا محل لها
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«اشكر»
alts: []
source: quran
level: 3
ref: سورة لقمان، الآية ١٢
