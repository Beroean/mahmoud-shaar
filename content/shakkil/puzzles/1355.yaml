text: أَضَاءَتْ لَهُمْ أَحْسَابُهُمْ وَوُجُوهُهُمْ دُجَى اللَّيْلِ حَتَّى نَظَّمَ الْجَزْعَ ثَاقِبُهْ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث
  - اللام حرف جر، و«هم» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«أضاءت»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«وجوه» معطوف مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وسُكّنت للقافية
alts: []
vary:
  - - ثَاقِبُهْ
    - ثَاقِبُهُ
author: أبو الطمحان القيني
source: poetry
level: 3
