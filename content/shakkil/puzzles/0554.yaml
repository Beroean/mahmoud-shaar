text: إِلَيْهِ يَصْعَدُ الْكَلِمُ الطَّيِّبُ وَالْعَمَلُ الصَّالِحُ يَرْفَعُهُ
irab:
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«يصعد»
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - فاعل مرفوع وعلامة رفعه الضمة
  - نعت مرفوع وعلامة رفعه الضمة
  - الواو استئنافية، و«العمل» مبتدأ مرفوع وعلامة رفعه الضمة
  - نعت مرفوع وعلامة رفعه الضمة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر المبتدأ
alts: []
source: quran
level: 3
ref: سورة فاطر، الآية ١٠
