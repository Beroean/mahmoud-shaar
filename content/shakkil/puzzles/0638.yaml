text: أُقَسِّمُ جِسْمِي فِي جُسُومٍ كَثِيرَةٍ وَأَحْسُو قَرَاحَ الْمَاءِ وَالْمَاءُ بَارِدُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«أحسو» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل، والفاعل ضمير مستتر تقديره أنا
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حالية، و«الماء» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل نصب حال
alts: []
author: عروة بن الورد
source: poetry
level: 2
ref: «إني امرؤ عافي إنائي شركة»
