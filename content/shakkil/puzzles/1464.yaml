text: لَنْ يُصْلِحَ هٰذِهِ السَّاعَاتِ إِلَّا خَبِيرٌ
irab:
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة الظاهرة
  - اسم إشارة مبني على الكسر في محل نصب مفعول به مقدم
  - بدل من اسم الإشارة منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - أداة حصر مبنية على السكون (استثناء مفرّغ)
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
