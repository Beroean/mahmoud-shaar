text: لَا صَاحِبَ مِهْنَةٍ يَسْتَغْنِي عَنْ أَدَوَاتِهِ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» منصوب وعلامة نصبه الفتحة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «لا»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts:
  - لَا صَاحِبُ مِهْنَةٍ يَسْتَغْنِي عَنْ أَدَوَاتِهِ
source: llm-reviewed
level: 2
