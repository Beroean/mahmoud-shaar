text: الَّذِي خَلَقَكَ فَسَوَّاكَ فَعَدَلَكَ
irab:
  - اسم موصول مبني على السكون في محل جر نعت لـ«ربك» في الآية السابقة
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - الفاء حرف عطف، و«سوّى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والكاف ضمير متصل في محل نصب مفعول به
  - الفاء حرف عطف، و«عدل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والكاف ضمير متصل في محل نصب مفعول به
alts: []
context: الله تعالى يخاطب الإنسان
source: quran
level: 2
ref: سورة الانفطار، الآية ٧
