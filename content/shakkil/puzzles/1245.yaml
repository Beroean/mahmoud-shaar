text: أَمَّا الْبَطَاطِسُ فَتُزْرَعُ فِي الرَّبِيعِ
irab:
  - حرف شرط وتفصيل مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء رابطة لجواب «أمّا»، و«تزرع» فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
