text: إِنَّمَا الصَّبْرُ عِنْدَ الصَّدْمَةِ الْأُولَى
irab:
  - كافة ومكفوفة، أداة حصر مبنية على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ١٢٨٣
