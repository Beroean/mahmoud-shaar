text: الْجَارَتَانِ تَتَبَادَلَانِ الْهَدَايَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، وألف الاثنين ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
