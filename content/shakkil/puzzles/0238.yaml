text: مَا أَجْمَلَ أَنْ يَعُودَ الْمُسَافِرُ إِلَى وَطَنِهِ سَالِمًا!
irab:
  - «ما» التعجبية نكرة تامة بمعنى «شيء» مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به لـ«أجمل»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حال منصوبة وعلامة نصبها تنوين الفتح
