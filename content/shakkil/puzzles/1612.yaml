text: هِيَ النَّفْسُ مَا حَمَّلْتَهَا تَتَحَمَّلُ وَلِلدَّهْرِ أَيَّامٌ تَجُورُ وَتَعْدِلُ
irab:
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل نصب مفعول به مقدم لـ«تتحمّل»، ويجوز أن يكون اسم شرط في محل نصب مفعول به ثانٍ لـ«حمّل»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به أول، والجملة صلة الموصول لا محل لها
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي يعود على «النفس»، والجملة في محل رفع خبر ثانٍ
  - الواو حرف عطف، واللام حرف جر، و«الدهر» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع نعت لـ«أيام»
  - الواو حرف عطف، و«تعدل» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي
alts: []
vary:
  - - حَمَّلْتَهَا
    - حَمَّلْتُهَا
    - حَمَّلْتِهَا
author: علي بن الجهم
source: poetry
level: 3
ref: «هي النفس ما حملتها تتحمل»
