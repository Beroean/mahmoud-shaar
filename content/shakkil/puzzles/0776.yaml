text: فَلْيَعْبُدُوا رَبَّ هَـٰذَا الْبَيْتِ
irab:
  - الفاء رابطة لما في الكلام من معنى الشرط، واللام لام الأمر، و«يعبدوا» فعل مضارع مجزوم بلام الأمر وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - «ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل جر مضاف إليه
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة
alts: []
context: الحديث عن قريش
source: quran
level: 3
ref: سورة قريش، الآية ٣
