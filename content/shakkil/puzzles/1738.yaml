text: لَمَّا وَصَلَ الْمُتَسَلِّقُونَ إِلَى أَعْلَى الْجَبَلِ رَفَعُوا عَلَمَ النَّادِي
irab:
  - ظرف زمان بمعنى «حين» مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة جواب «لمّا» لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الياء للثقل (اسم منقوص)
