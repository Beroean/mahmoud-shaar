text: تَفَوَّقَتْ نَادِيَةُ عَلَى زَمِيلَاتِهَا خَطًّا وَرَسْمًا
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف للعلمية والتأنيث
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«رسمًا» معطوف منصوب وعلامة نصبه تنوين الفتح
