text: أَلَّا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ
irab:
  - «أنْ» مخففة من الثقيلة، واسمها ضمير الشأن محذوف، و«لا» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر «أنْ»
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة المقدرة على الألف للتعذر، لأنه ممنوع من الصرف لألف التأنيث المقصورة
alts: []
context: مما في صحف موسى وإبراهيم
source: quran
level: 2
ref: سورة النجم، الآية ٣٨
