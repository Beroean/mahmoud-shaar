text: لِلْقِطَارَاتِ السَّرِيعَةِ فَوَائِدُ كَثِيرَةٌ، فَهِيَ تُوَفِّرُ الْوَقْتَ وَتُقَلِّلُ ازْدِحَامَ الطُّرُقِ
irab:
  - اللام حرف جر، و«القطارات» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مرفوع وعلامة رفعه تنوين الضم
  - الفاء تعليلية حرف مبني على الفتح، و«هي» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«تقلّل» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
