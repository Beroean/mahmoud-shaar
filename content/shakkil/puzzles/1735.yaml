text: بَيْنَمَا كُنَّا نَتَنَزَّهُ انْهَمَرَ الْمَطَرُ فَجْأَةً
irab:
  - «بين» ظرف زمان مبني على الفتح في محل نصب متعلق بـ«انهمر»، و«ما» زائدة
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع اسم «كان»
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل نصب خبر «كان»
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوب بمعنى «مفاجئًا» وعلامة نصبه تنوين الفتح
