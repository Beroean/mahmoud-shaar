text: سَأَعِيشُ رَغْمَ الدَّاءِ وَالْأَعْدَاءِ كَالنَّسْرِ فَوْقَ الْقِمَّةِ الشَّمَّاءِ
irab:
  - السين حرف استقبال، و«أعيش» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
  - منصوب على نزع الخافض (على رغم) وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الأعداء» اسم معطوف مجرور وعلامة جره الكسرة
  - الكاف حرف جر، و«النسر» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف حال من فاعل «أعيش»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لأنه معرّف بـ«ال»
alts: []
vary:
  - - رَغْمَ
    - رُغْمَ
    - رِغْمَ
author: أبو القاسم الشابي
source: poetry
level: 3
ref: نشيد الجبّار
