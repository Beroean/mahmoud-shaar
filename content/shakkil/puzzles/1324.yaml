text: الصِّيَامُ جُنَّةٌ، فَلَا يَرْفُثْ وَلَا يَجْهَلْ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الفاء استئنافية، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو يعود على الصائم
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
alts:
  - الصِّيَامُ جُنَّةٌ، فَلَا يَرْفِثْ وَلَا يَجْهَلْ
  - الصِّيَامُ جُنَّةٌ، فَلَا يَرْفَثْ وَلَا يَجْهَلْ
source: hadith
ref: صحيح البخاري، الحديث ١٨٩٤
