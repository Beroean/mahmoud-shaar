text: أَكَلْتُ التُّفَّاحَةَ كُلَّهَا
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - توكيد معنوي منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
