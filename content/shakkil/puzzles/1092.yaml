text: وَدِّعْ هُرَيْرَةَ إِنَّ الرَّكْبَ مُرْتَحِلُ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف (العلمية والتأنيث)
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة الظاهرة، والجملة تعليلية لا محل لها
alts: []
