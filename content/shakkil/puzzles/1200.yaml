text: لِيَسْتَرِحِ الْمُتَسَابِقُونَ قَلِيلًا
irab:
  - اللام لام الأمر حرف جزم مبني على الكسر، و«يسترح» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح
