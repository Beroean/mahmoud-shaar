text: مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٧٤
