text: وَهَلْ أَنَا إِلَّا مِنْ غَزِيَّةَ إِنْ غَوَتْ غَوَيْتُ وَإِنْ تَرْشُدْ غَزِيَّةُ أَرْشُدِ
irab:
  - الواو استئنافية، و«هل» حرف استفهام بمعنى النفي مبني على السكون
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - أداة حصر مبنية على السكون
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)، وشبه الجملة متعلق بمحذوف خبر
  - حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين في محل جزم فعل الشرط، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل في محل جزم جواب الشرط، والتاء ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«إن» حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون
  - فاعل مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف (العلمية والتأنيث)
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرِّك بالكسر للقافية، والفاعل ضمير مستتر تقديره أنا
