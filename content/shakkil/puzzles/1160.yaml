text: أَيُّهَا الْمُتَسَوِّقُونَ، انْتَبِهُوا
irab:
  - منادى بحرف نداء محذوف، نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
