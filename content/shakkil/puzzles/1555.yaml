text: إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به أول، والجملة في محل رفع خبر «إنّ»
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة
  - حرف تفصيل مبني على السكون
  - حال من الهاء منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«إمّا» حرف تفصيل مبني على السكون
  - اسم معطوف منصوب وعلامة نصبه تنوين الفتح
