text: لَا تَدْخُلُونَ الْجَنَّةَ حَتَّى تُؤْمِنُوا، وَلَا تُؤْمِنُوا حَتَّى تَحَابُّوا
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
  - فعل مضارع مرفوع، وحُذفت نونه تخفيفًا على لغة (والأصل ثبوت النون)، والواو ضمير متصل في محل رفع فاعل
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل
