text: لَيْسَ مِنَّا مَنْ لَطَمَ الْخُدُودَ وَشَقَّ الْجُيُوبَ وَدَعَا بِدَعْوَى الْجَاهِلِيَّةِ
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - «من» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - اسم موصول مبني على السكون في محل رفع اسم «ليس» مؤخر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«شقّ» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«دعا» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«دعوى» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، وشبه الجملة متعلق بـ«دعا»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ١٢٩٤
