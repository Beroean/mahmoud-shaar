text: عَلَى قَدْرِ أَهْلِ الْعَزْمِ تَأْتِي الْعَزَائِمُ
irab:
  - حرف جر مبني على السكون المقدر على الألف
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والجار والمجرور متعلقان بـ«تأتي»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
