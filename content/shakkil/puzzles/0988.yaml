text: بَاتَ الْعُثُورُ عَلَى شَقَّةٍ رَخِيصَةٍ أَمْرًا صَعْبًا
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «بات» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - خبر «بات» منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
vary:
  - - شَقَّةٍ
    - شُقَّةٍ
source: llm-reviewed
level: 2
