text: عُيُونُ الْمَهَا بَيْنَ الرُّصَافَةِ وَالْجِسْرِ جَلَبْنَ الْهَوَى مِنْ حَيْثُ أَدْرِي وَلَا أَدْرِي
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال من «عيون»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الجسر» معطوف مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على السكون لاتصاله بنون النسوة، والنون ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون
  - ظرف مكان مبني على الضم في محل جر بـ«من»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا، والجملة في محل جر بإضافة «حيث» إليها
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا، والجملة معطوفة على ما قبلها
alts: []
author: علي بن الجهم
source: poetry
level: 3
ref: «عيون المها بين الرصافة والجسر»
