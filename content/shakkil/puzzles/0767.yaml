text: مَنْ أَرَادَ أَنْ يُتْقِنَ الْعَزْفَ فَعَلَيْهِ أَنْ يَتَمَرَّنَ كُلَّ يَوْمٍ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء رابطة لجواب الشرط، و«على» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل رفع مبتدأ مؤخر، والجملة في محل جزم جواب الشرط
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
