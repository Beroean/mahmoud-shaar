text: ذَٰلِكَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْعَزِيزُ الرَّحِيمُ
irab:
  - اسم إشارة مبني على السكون في محل رفع مبتدأ، واللام للبعد، والكاف حرف خطاب
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الشهادة» معطوف على «الغيب» مجرور وعلامة جره الكسرة
  - خبر ثانٍ مرفوع وعلامة رفعه الضمة
  - خبر ثالث مرفوع وعلامة رفعه الضمة
alts: []
context: الإشارة إلى الله تعالى
source: quran
level: 2
ref: سورة السجدة، الآية ٦
