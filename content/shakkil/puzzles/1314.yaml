text: إِنَّا بَلَوْنَاهُمْ كَمَا بَلَوْنَا أَصْحَابَ الْجَنَّةِ إِذْ أَقْسَمُوا لَيَصْرِمُنَّهَا مُصْبِحِينَ
irab:
  - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - «بلا» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، و«هم» ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
  - الكاف حرف جر، و«ما» حرف مصدري مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - ظرف لما مضى من الزمان مبني على السكون في محل نصب متعلق بـ«بلونا»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل جر بإضافة «إذ» إليها
  - اللام واقعة في جواب القسم، و«يصرمنّ» فعل مضارع مرفوع وعلامة رفعه النون المحذوفة لتوالي الأمثال، وواو الجماعة المحذوفة لالتقاء الساكنين ضمير متصل في محل رفع فاعل، والنون للتوكيد، و«ها» ضمير متصل في محل نصب مفعول به، والجملة جواب القسم لا محل لها
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
