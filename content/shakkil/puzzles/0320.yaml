text: الْأُمُّ مَدْرَسَةٌ إِذَا أَعْدَدْتَهَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر بإضافة «إذا» إليها
alts: []
context: الخطاب لمذكّر
author: حافظ إبراهيم
source: poetry
