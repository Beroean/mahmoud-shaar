text: وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ
irab:
  - الواو عاطفة، واللام لام الابتداء للتوكيد، و«سوف» حرف تسويف واستقبال مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والكاف ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الفاء عاطفة، و«ترضى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره أنت
alts: []
source: quran
level: 3
ref: سورة الضحى، الآية ٥
