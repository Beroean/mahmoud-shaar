text: ظَنَنْتُ الْجَوَّ مُمْطِراً
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
alts: []
vary:
  - [ظَنَنْتُ, ظَنَنْتَ, ظَنَنْتِ]
source: llm-reviewed
level: 2
