text: مَا إِنْ دَقَّ الْجَرَسُ حَتَّى خَرَجَ التَّلَامِيذُ إِلَى الْفِنَاءِ مُسْرِعِينَ
irab:
  - حرف نفي مبني على السكون
  - حرف زائد مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts:
  - مَا إِنْ دُقَّ الْجَرَسُ حَتَّى خَرَجَ التَّلَامِيذُ إِلَى الْفِنَاءِ مُسْرِعِينَ
source: llm-reviewed
level: 2
