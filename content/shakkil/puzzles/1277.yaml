text: إِنَّ الْمُتَّقِينَ فِي ظِلَالٍ وَعُيُونٍ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - الواو حرف عطف، و«عيون» اسم معطوف على «ظلال» مجرور وعلامة جره تنوين الكسر
alts: []
source: quran
ref: سورة المرسلات، الآية ٤١
