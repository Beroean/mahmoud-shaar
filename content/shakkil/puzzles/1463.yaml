text: يَا صَاعِدًا الْجَبَلَ، احْذَرِ الصُّخُورَ الْمُتَسَاقِطَةَ
irab:
  - حرف نداء مبني على السكون
  - منادى شبيه بالمضاف منصوب وعلامة نصبه تنوين الفتح
  - مفعول به لاسم الفاعل «صاعدًا» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
