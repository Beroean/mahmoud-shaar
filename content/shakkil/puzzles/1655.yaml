text: احْتَفَظَتِ الْجَدَّةُ بِرَسَائِلَ قَدِيمَةٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«رسائل» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره تنوين الكسر
