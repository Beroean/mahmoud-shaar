text: عَدَّ الْمُدَرِّبُ الْهَزِيمَةَ الْأُولَى دَرْسًا مُفِيدًا لِلَّاعِبِينَ الشُّبَّانِ فِي الْفَرِيقِ
irab:
  - فعل ماضٍ مبني على الفتح، بمعنى «اعتبر» من أخوات «ظنّ» ينصب مفعولين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«اللاعبين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
