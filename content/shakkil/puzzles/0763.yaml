text: إِنَّ الَّذِينَ يَسْهَرُونَ طَوِيلًا يَسْتَيْقِظُونَ مُتْعَبِينَ فِي الصَّبَاحِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح (أي وقتًا طويلًا)
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - حال منصوبة وعلامة نصبها الياء لأنها جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
