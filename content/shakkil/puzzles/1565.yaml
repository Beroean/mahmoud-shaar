text: ذَٰلِكَ بِأَنَّ اللَّهَ مَوْلَى الَّذِينَ آمَنُوا وَأَنَّ الْكَافِرِينَ لَا مَوْلَىٰ لَهُمْ
irab:
  - اسم إشارة مبني على السكون في محل رفع مبتدأ، واللام للبعد، والكاف حرف خطاب
  - الباء حرف جر، و«أنّ» حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» وما بعدها في محل جر بالباء، وشبه الجملة متعلق بمحذوف خبر المبتدأ
  - لفظ الجلالة اسم «أنّ» منصوب وعلامة نصبه الفتحة
  - خبر «أنّ» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو مضاف
  - اسم موصول مبني على الفتح في محل جر مضاف إليه
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«أنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «أنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - نافية للجنس تعمل عمل «إنّ» مبنية على السكون
  - اسم «لا» مبني على الفتح المقدر على الألف للتعذر في محل نصب
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»، والجملة في محل رفع خبر «أنّ»
