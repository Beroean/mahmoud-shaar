text: أَتُسَافِرُ إِلَى الْعَاصِمَةِ بِالْقِطَارِ أَمْ بِالْحَافِلَةِ؟
irab:
  - الهمزة حرف استفهام مبني على الفتح، و«تسافر» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الباء حرف جر، و«القطار» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف عطف معادل للهمزة مبني على السكون (أم المتصلة)
  - الباء حرف جر، و«الحافلة» اسم مجرور وعلامة جره الكسرة الظاهرة
