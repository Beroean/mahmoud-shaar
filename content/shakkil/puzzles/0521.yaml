text: يَضُمُّ الْمَعْرِضُ أَكْثَرَ مِنْ ثَلَاثِمِئَةِ لَوْحَةٍ لِفَنَّانِينَ مِنْ عِشْرِينَ دَوْلَةً
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (اسم تفضيل على وزن «أفعل»)
  - حرف جر مبني على السكون
  - «ثلاث» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«مئة» مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - اللام حرف جر، و«فنانين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وهو من ألفاظ العدد
  - تمييز منصوب وعلامة نصبه تنوين الفتح
