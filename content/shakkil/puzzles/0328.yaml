text: وَلِلنَّاسِ فِيمَا يَعْشَقُونَ مَذَاهِبُ
irab:
  - الواو حرف عطف، واللام حرف جر، و«الناس» اسم مجرور وعلامة جره الكسرة، وشبه الجملة في محل رفع خبر مقدّم
  - «في» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
alts: []
author: أبو فراس الحمداني
