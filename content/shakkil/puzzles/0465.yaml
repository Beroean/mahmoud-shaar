text: أَصْبَحَ الشَّارِعُ أَكْثَرَ نَظَافَةً مِنْ قَبْلُ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «أصبح» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «أصبح» منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (اسم تفضيل على وزن «أفعل»)
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - ظرف زمان مبني على الضم في محل جر بـ«من» لقطعه عن الإضافة
