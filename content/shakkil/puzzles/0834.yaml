text: أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، وخبره محذوف وجوبًا تسدّ الحال مسدّه
  - حرف مصدري مبني على السكون، والمصدر المؤول من «ما» والفعل في محل جر مضاف إليه
  - فعل مضارع تام مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أقرب»
  - الواو حالية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة الاسمية في محل نصب حال سدّت مسدّ الخبر
