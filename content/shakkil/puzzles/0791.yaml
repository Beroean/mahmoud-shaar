text: وَمَا هَـٰذِهِ الْحَيَاةُ الدُّنْيَا إِلَّا لَهْوٌ وَلَعِبٌ
irab:
  - الواو استئنافية، و«ما» نافية مبنية على السكون لا عمل لها لانتقاض نفيها بـ«إلا»
  - «ها» حرف تنبيه، و«ذه» اسم إشارة مبني على الكسر في محل رفع مبتدأ
  - بدل من اسم الإشارة مرفوع وعلامة رفعه الضمة
  - نعت مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - أداة حصر لا عمل لها
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«لعب» اسم معطوف مرفوع وعلامة رفعه تنوين الضم
alts: []
source: quran
level: 3
ref: سورة العنكبوت، الآية ٦٤
