text: لَا يَحِلُّ لِرَجُلٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلَاثِ لَيَالٍ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«رجل» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يحل»
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل رفع فاعل «يحل»
  - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بـ«يهجر»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، وهو من ألفاظ العدد
  - مضاف إليه (تمييز العدد) مجرور وعلامة جره الفتحة المقدرة على الياء المحذوفة نيابة عن الكسرة لأنه ممنوع من الصرف على صيغة منتهى الجموع، والتنوين تنوين عوض
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٠٧٧
