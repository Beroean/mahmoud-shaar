text: انْخَفَضَتْ دَرَجَةُ الْحَرَارَةِ انْخِفَاضًا كَبِيرًا
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
