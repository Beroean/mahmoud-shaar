text: قَطَعَتِ الْعَبَّارَةُ الْمَسَافَةَ بَيْنَ الْجَزِيرَتَيْنِ فِي سَاعَتَيْنِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه مثنى
