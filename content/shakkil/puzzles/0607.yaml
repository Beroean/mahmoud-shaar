text: لَا يَحْمِلُ الْحِقْدَ مَنْ تَعْلُو بِهِ الرُّتَبُ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - اسم موصول مبني على السكون في محل رفع فاعل
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل
  - الباء حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«تعلو»
  - فاعل مرفوع وعلامة رفعه الضمة، والجملة صلة الموصول لا محل لها
alts: []
author: عنترة بن شداد
source: poetry
ref: «لا يحمل الحقد من تعلو به الرتب»
