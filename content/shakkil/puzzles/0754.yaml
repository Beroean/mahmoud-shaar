text: لَا تَسْتَعْمِلُوا الْهَوَاتِفَ أَثْنَاءَ الْقِيَادَةِ، فَإِنَّ ذٰلِكَ يُعَرِّضُكُمْ لِلْخَطَرِ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء حرف تعليل، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم إشارة مبني على السكون في محل نصب اسم «إنّ»، واللام للبعد والكاف للخطاب
  - فعل مضارع مرفوع وعلامة رفعه الضمة، و«كم» ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر، و«الخطر» اسم مجرور وعلامة جره الكسرة الظاهرة
