text: تُعَدُّ الدَّرَّاجَةُ وَسِيلَةَ نَقْلٍ صَدِيقَةً لِلْبِيئَةِ لِأَنَّهَا لَا تُلَوِّثُ الْهَوَاءَ
irab:
  - فعل مضارع مبني للمجهول من أفعال القلوب مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو المفعول الأول في الأصل
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«البيئة» اسم مجرور وعلامة جره الكسرة الظاهرة
  - اللام حرف جر للتعليل، و«أنّ» حرف توكيد ونصب، و«ها» ضمير متصل مبني على السكون في محل نصب اسم «أنّ»
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «أنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts:
  - تَعُدُّ الدَّرَّاجَةَ وَسِيلَةَ نَقْلٍ صَدِيقَةً لِلْبِيئَةِ لِأَنَّهَا لَا تُلَوِّثُ الْهَوَاءَ
source: llm-reviewed
level: 3
