text: يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة، متعلق بفعل محذوف تقديره «تقرع»، وهو مضاف
  - فعل مضارع ناقص مرفوع وعلامة رفعه الضمة، والجملة في محل جر بإضافة «يوم» إليها
  - اسم «يكون» مرفوع وعلامة رفعه الضمة
  - الكاف حرف جر للتشبيه، و«الفراش» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «يكون»
  - نعت مجرور وعلامة جره الكسرة
alts: []
source: quran
level: 2
ref: سورة القارعة، الآية ٤
