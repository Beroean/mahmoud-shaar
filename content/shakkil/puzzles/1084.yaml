text: عَلَيْكُمْ بِمَا تُطِيقُونَ فَوَاللَّهِ لَا يَمَلُّ اللَّهُ حَتَّى تَمَلُّوا
irab:
  - اسم فعل أمر بمعنى «الزموا» مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنتم
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«عليكم»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الفاء للتعليل، والواو حرف قسم وجر، ولفظ الجلالة مقسم به مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بفعل محذوف تقديره أُقسم
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة جواب القسم لا محل لها
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٤٣
