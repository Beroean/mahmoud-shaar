text: تَعِسَ عَبْدُ الدِّينَارِ وَالدِّرْهَمِ وَالْقَطِيفَةِ وَالْخَمِيصَةِ
irab:
  - فعل ماضٍ مبني على الفتح، أريد به الدعاء
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الدرهم» اسم معطوف على «الدينار» مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«القطيفة» اسم معطوف مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«الخميصة» اسم معطوف مجرور وعلامة جره الكسرة
alts:
  - تَعَسَ عَبْدُ الدِّينَارِ وَالدِّرْهَمِ وَالْقَطِيفَةِ وَالْخَمِيصَةِ
source: hadith
ref: صحيح البخاري، الحديث ٢٨٨٦
