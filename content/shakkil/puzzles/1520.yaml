text: يُعَدُّ الْقِطَارُ أَكْثَرَ وَسَائِلِ النَّقْلِ أَمَانًا فِي الْمَسَافَاتِ الطَّوِيلَةِ
irab:
  - فعل مضارع مبني للمجهول من أفعال القلوب مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو المفعول الأول في الأصل
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
alts:
  - يَعُدُّ الْقِطَارَ أَكْثَرَ وَسَائِلِ النَّقْلِ أَمَانًا فِي الْمَسَافَاتِ الطَّوِيلَةِ
source: llm-reviewed
level: 2
