text: لَا تَتَأَخَّرْ عَنِ الْمَوْعِدِ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
  - حرف جر مبني على السكون، وحُرِّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: Mahmoud Shaar
