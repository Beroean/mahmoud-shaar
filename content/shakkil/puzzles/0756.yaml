text: ظَنَّ الْفَلَّاحُونَ أَنَّ الْمَوْسِمَ سَيَكُونُ جَافًّا، لٰكِنَّ الْأَمْطَارَ هَطَلَتْ بِغَزَارَةٍ
irab:
  - فعل ماضٍ من أفعال الظن مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول سدّ مسدّ مفعولي «ظنّ»
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - السين حرف استقبال، و«يكون» فعل مضارع ناقص مرفوع وعلامة رفعه الضمة، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»
  - خبر «يكون» منصوب وعلامة نصبه تنوين الفتح
  - حرف استدراك ونصب مبني على الفتح
  - اسم «لكنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «لكنّ»
  - الباء حرف جر، و«غزارة» اسم مجرور وعلامة جره تنوين الكسر
