text: رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا
irab:
  - منادى بأداة نداء محذوفة منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - فعل دعاء بصيغة الأمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«هب»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«هب»
  - الواو حرف عطف، و«ذريات» معطوف مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«اجعل» فعل دعاء بصيغة الأمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«نا» ضمير متصل في محل نصب مفعول به أول
  - اللام حرف جر، و«المتقين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بـ«إمامًا»
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
