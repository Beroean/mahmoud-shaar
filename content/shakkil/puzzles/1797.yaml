text: فَعَصَىٰ فِرْعَوْنُ الرَّسُولَ فَأَخَذْنَاهُ أَخْذًا وَبِيلًا
irab:
  - الفاء حرف عطف، و«عصى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف للعلمية والعجمة
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الفاء حرف عطف، و«أخذ» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 3
ref: سورة المزمل، الآية ١٦
