text: عَاشَ الرَّحَّالَةُ سَنَوَاتٍ طَوِيلَةً يَتَنَقَّلُ بَيْنَ مُدُنٍ وَقُرًى بَعِيدَةٍ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«قرى» معطوف مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر، لأنه اسم مقصور منوّن
  - نعت مجرور وعلامة جره تنوين الكسر
