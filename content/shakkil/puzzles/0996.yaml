text: كَانَتْ جَدَّتِي تَخْبِزُ الْخُبْزَ فِي التَّنُّورِ كُلَّ صَبَاحٍ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - اسم «كان» مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «كان»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
