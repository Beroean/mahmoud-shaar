text: لَا تُبْقِي وَلَا تَذَرُ
irab:
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هي يعود على «سقر»، والجملة في محل نصب حال
  - الواو حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي
alts: []
context: وصف سقر
source: quran
ref: سورة المدثر، الآية ٢٨
