text: زُورُوا الْقُبُورَ فَإِنَّهَا تُذَكِّرُ الْمَوْتَ
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب، و«ها» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
level: 2
ref: صحيح مسلم، الحديث ٩٧٦
