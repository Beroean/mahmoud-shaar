text: انْتَظِرِي حَتَّى يَخْرُجَ الطَّبِيبُ
irab:
  - فعل أمر مبني على حذف النون، وياء المخاطبة ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل جر بـ«حتى»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
