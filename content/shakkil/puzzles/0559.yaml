text: اعْلَمُوا أَنَّمَا الْحَيَاةُ الدُّنْيَا لَعِبٌ وَلَهْوٌ وَزِينَةٌ وَتَفَاخُرٌ بَيْنَكُمْ
irab:
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - «أنّ» حرف توكيد مكفوف، و«ما» كافة، والجملة بعدها سدّت مسدّ مفعولي «اعلموا»
  - مبتدأ مرفوع وعلامة رفعه الضمة
  - نعت مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«لهو» معطوف مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«زينة» معطوف مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«تفاخر» معطوف مرفوع وعلامة رفعه تنوين الضم
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«تفاخر»
