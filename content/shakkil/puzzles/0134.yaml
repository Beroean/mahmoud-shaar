text: قُمْ لِلْمُعَلِّمِ وَفِّهِ التَّبْجِيلَا
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - اللام حرف جر، و«المعلم» اسم مجرور وعلامة جره الكسرة
  - الواو عاطفة، و«وفِّ» فعل أمر مبني على حذف حرف العلة، والهاء ضمير متصل في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
author: أحمد شوقي
source: poetry
level: 3
