text: كَانَتِ الْبَوَاخِرُ تَنْقُلُ الْبَرِيدَ بَيْنَ الْقَارَّاتِ قَبْلَ اخْتِرَاعِ الطَّائِرَاتِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «كان»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
