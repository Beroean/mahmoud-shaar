text: أَيُّهَا الْجِيرَانُ، شُكْرًا لَكُمْ
irab:
  - منادى بحرف نداء محذوف، نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
  - مفعول مطلق منصوب لفعل محذوف تقديره أشكر، وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر
