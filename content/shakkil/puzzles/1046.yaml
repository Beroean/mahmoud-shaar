text: الْأَخِلَّاءُ يَوْمَئِذٍ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ إِلَّا الْمُتَّقِينَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة
  - «يوم» ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«إذ» ظرف مبني على السكون في محل جر مضاف إليه، وحُرّك بالكسر لالتقاء الساكنين، والتنوين عوض عن جملة محذوفة، وشبه الجملة متعلق بـ«عدو»
  - مبتدأ ثانٍ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - اللام حرف جر، و«بعض» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«عدو»
  - خبر المبتدأ الثاني مرفوع وعلامة رفعه تنوين الضم، والجملة في محل رفع خبر «الأخلاء»
  - أداة استثناء مبنية على السكون
  - مستثنى منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts: []
source: quran
level: 3
ref: سورة الزخرف، الآية ٦٧
