text: وَإِنِّي وَإِنْ كُنْتُ الْأَخِيرَ زَمَانُهُ لَآتٍ بِمَا لَمْ تَسْتَطِعْهُ الْأَوَائِلُ
irab:
  - الواو بحسب ما قبلها، و«إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - الواو اعتراضية، و«إن» حرف شرط مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «كان»
  - خبر «كان» منصوب وعلامة نصبه الفتحة الظاهرة
  - فاعل لـ«الأخير» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - اللام المزحلقة، و«آتٍ» خبر «إنّ» مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لأنه اسم منقوص
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والهاء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
fixed:
  - كنت
author: أبو العلاء المعري
source: poetry
level: 3
