text: فَأَيَّدْنَا الَّذِينَ آمَنُوا عَلَىٰ عَدُوِّهِمْ فَأَصْبَحُوا ظَاهِرِينَ
irab:
  - الفاء حرف عطف، و«أيّد» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - اسم موصول مبني على الفتح في محل نصب مفعول به
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أيّدنا»
  - الفاء حرف عطف، و«أصبح» فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع اسم «أصبح»
  - خبر «أصبح» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
alts: []
context: المؤمنون بعيسى عليه السلام
source: quran
level: 2
