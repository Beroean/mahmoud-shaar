text: أَيُّهَا الْمُسَافِرُونَ، تَأَكَّدُوا مِنْ جَوَازَاتِ سَفَرِكُمْ قَبْلَ التَّوَجُّهِ إِلَى الْمَطَارِ
irab:
  - منادى بحرف نداء محذوف، نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
