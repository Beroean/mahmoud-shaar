text: وَطَنِي لَوْ شُغِلْتُ بِالْخُلْدِ عَنْهُ نَازَعَتْنِي إِلَيْهِ فِي الْخُلْدِ نَفْسِي
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني للمجهول مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع نائب فاعل
  - الباء حرف جر، و«الخلد» اسم مجرور وعلامة جره الكسرة الظاهرة
  - «عن» حرف جر، والهاء ضمير متصل في محل جر
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة جواب «لو» لا محل لها، وجملة الشرط وجوابه في محل رفع خبر
  - «إلى» حرف جر، والهاء ضمير متصل في محل جر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - شغلت
author: أحمد شوقي
