text: إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «إنّ»
  - اللام المزحلقة للتوكيد، و«قول» خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
context: الحديث عن القرآن
source: quran
ref: سورة التكوير، الآية ١٩
