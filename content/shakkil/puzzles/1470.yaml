text: كَانَ الْخَرِيفُ أَدْفَأَ مِنَ الْمُعْتَادِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «كان» منصوب وعلامة نصبه الفتحة الظاهرة بلا تنوين لأنه ممنوع من الصرف (اسم تفضيل على وزن أفعل)
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
