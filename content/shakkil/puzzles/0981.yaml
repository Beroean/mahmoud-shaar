text: حَلَّ الْعَدَّاءُ فِي الْمَرْكَزِ الثَّالِثَ عَشَرَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - عدد ترتيبي مركب مبني على فتح الجزأين في محل جر نعت لـ«المركز»
  - الجزء الثاني من العدد المركب مبني على الفتح لا محل له من الإعراب
