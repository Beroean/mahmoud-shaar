text: وَظُلْمُ ذَوِي الْقُرْبَى أَشَدُّ مَضَاضَةً عَلَى الْمَرْءِ مِنْ وَقْعِ الْحُسَامِ الْمُهَنَّدِ
irab:
  - الواو بحسب ما قبلها، و«ظلم» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (وزن الفعل والوصفية)
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
