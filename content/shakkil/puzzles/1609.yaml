text: أَسْتَوْدِعُ اللَّهَ فِي بَغْدَادَ لِي قَمَرًا بِالْكَرْخِ مِنْ فَلَكِ الْأَزْرَارِ مَطْلَعُهُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - لفظ الجلالة مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والعجمة)، وشبه الجملة متعلق بـ«أستودع»
  - اللام حرف جر، والياء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف حال من «قمرا» تقدّم عليه
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«الكرخ» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال من «مطلعه»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وجملة «بالكرخ مطلعه» في محل نصب نعت لـ«قمرا»، خبرها «بالكرخ» المقدم
alts: []
vary:
  - - لِي
    - لِيَ
fixed:
  - فلك
author: ابن زريق البغدادي
source: poetry
level: 3
ref: «لا تعذليه فإن العذل يولعه»
