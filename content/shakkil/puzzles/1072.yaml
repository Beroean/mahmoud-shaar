text: صُومُوا لِرُؤْيَتِهِ وَأَفْطِرُوا لِرُؤْيَتِهِ
irab:
  - فعل أمر مبني على حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - اللام حرف جر للتعليل، و«رؤية» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«أفطروا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - اللام حرف جر للتعليل، و«رؤية» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ١٩٠٩
