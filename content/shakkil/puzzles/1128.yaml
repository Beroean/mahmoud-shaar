text: اسْقِ النَّبَاتَاتِ صَبَاحًا
irab:
  - فعل أمر مبني على حذف حرف العلة من آخره، والكسرة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
