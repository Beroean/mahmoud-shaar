text: لَا يُسْأَلُ عَمَّا يَفْعَلُ وَهُمْ يُسْأَلُونَ
irab:
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو
  - «عن» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يُسأل»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها، والعائد محذوف (يفعله)
  - الواو استئنافية، و«هم» ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع نائب فاعل، والجملة في محل رفع خبر المبتدأ
alts: []
context: الحديث عن الله تعالى وخلقه
source: quran
