text: أَمُسَافِرٌ أَخُوكَ غَدًا؟
irab:
  - الهمزة حرف استفهام مبني على الفتح، و«مسافر» مبتدأ مرفوع وعلامة رفعه تنوين الضم (اسم فاعل)
  - فاعل لاسم الفاعل سدّ مسدّ الخبر، مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
alts: []
vary:
  - - أَخُوكَ
    - أَخُوكِ
