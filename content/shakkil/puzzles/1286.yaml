text: وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ
irab:
  - الواو حرف عطف، و«امرأة» اسم معطوف على الضمير المستتر في «سيصلى» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مفعول به لفعل محذوف تقديره «أذمّ»، منصوب للذم وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: الحديث عن أبي لهب
source: quran
level: 3
ref: سورة المسد، الآية ٤
