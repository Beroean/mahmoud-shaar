text: يَا أَبْنَاءَ الْحَيِّ، حَافِظُوا عَلَى نَظَافَتِهِ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
