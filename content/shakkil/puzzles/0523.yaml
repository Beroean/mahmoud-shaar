text: الْمُسَافِرُونَ مُنْتَظِرُونَ إِقْلَاعَ الرِّحْلَةِ مُنْذُ سَاعَتَيْنِ بِسَبَبِ سُوءِ الْأَحْوَالِ الْجَوِّيَّةِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - خبر مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم، وهو اسم فاعل يعمل عمل فعله، وفاعله ضمير مستتر
  - مفعول به لاسم الفاعل «منتظرون» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على الضم
  - اسم مجرور وعلامة جره الياء لأنه مثنى
  - الباء حرف جر، و«سبب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
