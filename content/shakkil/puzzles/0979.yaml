text: أُعِيدَ افْتِتَاحُ الْمَسْرَحِ بَعْدَ تَرْمِيمِهِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
