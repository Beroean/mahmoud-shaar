text: اصْبِرْ عَلَى حَسَدِ الْحَسُودِ فَإِنَّ صَبْرَكَ قَاتِلُهْ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وسُكِّنت للوقف (القافية مقيّدة)
alts: []
vary:
  - - قَاتِلُهْ
    - قَاتِلُهُ
fixed:
  - صبرك
author: ابن المعتز
source: poetry
level: 2
ref: «اصبر على حسد الحسود»
