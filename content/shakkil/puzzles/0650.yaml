text: لِلْعَنْكَبُوتِ ثَمَانِي أَرْجُلٍ
irab:
  - اللام حرف جر، و«العنكبوت» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، وهو مضاف (العدد يخالف المعدود)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
