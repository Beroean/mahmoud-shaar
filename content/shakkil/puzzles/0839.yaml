text: مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف للعلمية وزيادة الألف والنون
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«احتسابًا» اسم معطوف منصوب وعلامة نصبه تنوين الفتح
  - فعل ماضٍ مبني للمجهول مبني على الفتح في محل جزم جواب الشرط
  - اللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر، وشبه الجملة متعلق بـ«غُفر»
  - اسم موصول مبني على السكون في محل رفع نائب فاعل
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف حال
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٣٨
