text: صَفَحْنَا عَنْ بَنِي ذُهْلٍ وَقُلْنَا الْقَوْمُ إِخْوَانُ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وحُذفت نونه للإضافة، وهو مضاف، وشبه الجملة متعلق بـ«صفحنا»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«قال» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع فاعل
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، ولم يُنوَّن لأنه في القافية، وجملة «القوم إخوان» في محل نصب مقول القول
alts: []
author: الفند الزماني
source: poetry
