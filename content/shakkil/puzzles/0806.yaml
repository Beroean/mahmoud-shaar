text: كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا
irab:
  - «كأنّ» حرف تشبيه ونصب، و«هم» ضمير متصل مبني على السكون في محل نصب اسم «كأنّ»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، متعلق بـ«يلبثوا»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل جر مضاف إليه
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «كأنّ»
  - أداة حصر لا عمل لها
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح، متعلق بـ«يلبثوا»
  - حرف عطف مبني على السكون
  - اسم معطوف على «عشية» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
alts: []
context: الضمير في «يرونها» للساعة
source: quran
level: 3
ref: سورة النازعات، الآية ٤٦
