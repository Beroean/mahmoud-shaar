text: مَنْ أَحَبَّ لِقَاءَ اللَّهِ أَحَبَّ اللَّهُ لِقَاءَهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٥٠٧
