text: اشْتَرَى أَبِي سَاعَةً يَدَوِيَّةً لَا تَحْتَاجُ إِلَى بَطَّارِيَّةٍ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب نعت ثانٍ لـ«ساعة»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
