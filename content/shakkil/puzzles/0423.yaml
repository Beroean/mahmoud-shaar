text: اشْتَرَى سَامِي حَقِيبَةً زَرْقَاءَ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (ألف التأنيث الممدودة)
