text: يَا صَاحِبَ الدُّكَّانِ، هَلْ عِنْدَكَ خُيُوطٌ؟
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف استفهام مبني على السكون
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
alts: []
fixed:
  - عندك
