text: حَقُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ خَمْسٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«حق»
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو من ألفاظ العدد
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ١٢٤٠
