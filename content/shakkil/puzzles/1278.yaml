text: وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا
irab:
  - الواو حرف عطف، و«بنى» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، متعلق بـ«بنينا»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح، وهو من ألفاظ العدد
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الله تعالى يخاطب الناس
source: quran
level: 2
ref: سورة النبأ، الآية ١٢
