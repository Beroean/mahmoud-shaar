text: عَسَى أَنْ تَنْتَهِيَ الْأَشْغَالُ قَبْلَ الصَّيْفِ
irab:
  - فعل ماضٍ جامد من أفعال الرجاء مبني على الفتح المقدر على الألف للتعذر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول من «أن» والفعل في محل رفع فاعل «عسى» (وهي هنا تامة)
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
