text: قَفَزَ السَّبَّاحُونَ إِلَى الْبَحْرِ مُبْتَهِجِينَ، مَعَ أَنَّ الْمَاءَ كَانَ بَارِدًا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» ومعموليها في محل جر مضاف إليه
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
