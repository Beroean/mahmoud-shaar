text: صَلَاةُ الْجَمَاعَةِ تَفْضُلُ صَلَاةَ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الباء حرف جر، و«سبع» اسم مجرور وعلامة جره تنوين الكسر، وهو من ألفاظ العدد، وشبه الجملة متعلق بـ«تفضل»
  - الواو حرف عطف، و«عشرين» اسم معطوف مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
  - تمييز منصوب وعلامة نصبه تنوين الفتح
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٤٥
