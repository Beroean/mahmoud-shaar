text: سَلِي الرِّمَاحَ الْعَوَالِي عَنْ مَعَالِينَا
irab:
  - فعل أمر مبني على حذف النون، والياء ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة المقدرة على الياء، سُكّنت للضرورة الشعرية، ويجوز «العواليَ» على الأصل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«سلي»
alts: []
vary:
  - - الْعَوَالِي
    - الْعَوَالِيَ
context: الشاعر يخاطب امرأة
author: صفي الدين الحلي
source: poetry
ref: «سلي الرماح العوالي عن معالينا»
