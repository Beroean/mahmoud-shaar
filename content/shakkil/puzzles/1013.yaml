text: أَيُّهَا الطُّلَّابُ، لَا تَدَعُوا الْخَوْفَ مِنَ الْفَشَلِ يَمْنَعُكُمْ مِنَ الْمُشَارَكَةِ
irab:
  - منادى بحرف نداء محذوف، نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به، والجملة في محل نصب حال
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
