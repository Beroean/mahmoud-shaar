text: حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - لفظ الجلالة خبر مرفوع وعلامة رفعه الضمة
  - الواو عاطفة، و«نعم» فعل ماضٍ جامد لإنشاء المدح مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، والمخصوص بالمدح محذوف تقديره «هو»
alts: []
source: quran
level: 3
ref: سورة آل عمران، الآية ١٧٣
