text: قُلْ أَتُعَلِّمُونَ اللَّهَ بِدِينِكُمْ وَاللَّهُ يَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الهمزة للاستفهام الإنكاري، و«تعلّمون» فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل نصب مقول القول
  - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
  - الباء حرف جر، و«دين» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الضم في محل جر مضاف إليه، والميم علامة الجمع، وشبه الجملة متعلق بـ«تعلّمون»
  - الواو حالية، ولفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ، والجملة الاسمية في محل نصب حال
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل نصب معطوف على «ما» الأولى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
