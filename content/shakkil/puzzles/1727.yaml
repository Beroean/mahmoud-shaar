text: النَّارَ النَّارَ، لَا تَتْرُكُوهَا مُشْتَعِلَةً
irab:
  - مفعول به منصوب لفعل محذوف تقديره احذروا (تحذير)، وعلامة نصبه الفتحة الظاهرة
  - توكيد لفظي منصوب وعلامة نصبه الفتحة الظاهرة
  - «لا» الناهية حرف جزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به
  - حال منصوب وعلامة نصبه تنوين الفتح
alts:
  - النَّارُ النَّارُ، لَا تَتْرُكُوهَا مُشْتَعِلَةً
source: llm-reviewed
level: 2
