text: اسْتَوْصُوا بِالنِّسَاءِ خَيْرًا
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل مبني على السكون في محل رفع فاعل
  - الباء حرف جر، و«النساء» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«استوصوا»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٥١٨٦
