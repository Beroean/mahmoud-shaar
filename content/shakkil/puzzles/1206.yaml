text: لَا يَسْكُنُ الْكُوخَ إِلَّا رَاعٍ عَجُوزٌ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة الظاهرة
  - أداة حصر مبنية على السكون (استثناء مفرّغ)
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لالتقاء الساكنين، منع من ظهورها الثقل
  - نعت مرفوع وعلامة رفعه تنوين الضم
