text: صَمَّمَتِ الْمُهَنْدِسَةُ تَطْبِيقًا يُسَاعِدُ الْمَكْفُوفِينَ عَلَى قِرَاءَةِ اللَّافِتَاتِ فِي الْمَحَطَّاتِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب نعت
  - مفعول به منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
