text: إِيَّاكَ وَالِاقْتِرَابَ مِنْ أَسْلَاكِ الْكَهْرَبَاءِ
irab:
  - «إيّا» ضمير منفصل مبني على السكون في محل نصب مفعول به لفعل محذوف تقديره أحذّر، والكاف حرف خطاب (تحذير)
  - الواو عاطفة، و«الاقتراب» مفعول به منصوب لفعل محذوف تقديره احذر، وعلامة نصبه الفتحة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - إِيَّاكَ
    - إِيَّاكِ
fixed:
  - أسلاك
source: llm-reviewed
level: 3
