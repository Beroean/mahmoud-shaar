text: فِي الْأُسْبُوعِ سَبْعَةُ أَيَّامٍ
irab:
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
