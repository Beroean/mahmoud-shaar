text: وَقَفَ الْكَشَّافُ حَامِلًا عَلَمَ الْفِرْقَةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح، وهو اسم فاعل
  - مفعول به لاسم الفاعل «حاملًا» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
