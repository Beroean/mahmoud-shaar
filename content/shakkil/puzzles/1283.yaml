text: وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ
irab:
  - الواو حرف عطف، و«أرسل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أرسل»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف على صيغة منتهى الجموع
alts: []
context: الحديث عن الله تعالى وأصحاب الفيل
source: quran
level: 2
ref: سورة الفيل، الآية ٣
