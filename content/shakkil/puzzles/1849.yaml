text: قَدْ يَمْلِكُ الْحُرُّ الْكَرِيمُ فَيُسْجِحُ
irab:
  - حرف تقليل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء حرف عطف، و«يسجح» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
alts: []
author: الأحوص
source: poetry
ref: «أسلام إنك قد ملكت فأسجحي»
