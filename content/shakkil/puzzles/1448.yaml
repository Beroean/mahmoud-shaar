text: حَرَى الْجَوُّ أَنْ يَعْتَدِلَ
irab:
  - فعل ماضٍ ناقص من أفعال الرجاء مبني على الفتح المقدر على الألف للتعذر
  - اسم «حرى» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب خبر «حرى»
