text: رَحِمَ اللَّهُ رَجُلاً سَمْحًا إِذَا بَاعَ، وَإِذَا اشْتَرَى، وَإِذَا اقْتَضَى
irab:
  - فعل ماضٍ مبني على الفتح
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - ظرف زمان مبني على السكون في محل نصب، متعلق بـ«سمحًا»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
  - الواو حرف عطف، و«إذا» ظرف زمان مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
  - الواو حرف عطف، و«إذا» ظرف زمان مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر مضاف إليه
