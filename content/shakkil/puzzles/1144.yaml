text: ظَلَّتِ الْغَلَّايَةُ تُطْلِقُ الْبُخَارَ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «ظلّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «ظلّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
