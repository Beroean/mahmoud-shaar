text: إِنَّ السَّاعَةَ آتِيَةٌ أَكَادُ أُخْفِيهَا لِتُجْزَىٰ كُلُّ نَفْسٍ بِمَا تَسْعَىٰ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع ناقص من أفعال المقاربة مرفوع وعلامة رفعه الضمة، واسمه ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر ثانٍ لـ«إنّ»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره أنا، و«ها» ضمير متصل مبني على السكون في محل نصب مفعول به، والجملة في محل نصب خبر «أكاد»
  - اللام لام التعليل حرف جر، و«تُجزى» فعل مضارع مبني للمجهول منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه الفتحة المقدرة على الألف للتعذر، والمصدر المؤول في محل جر باللام متعلق بـ«آتية»
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«تُجزى»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هي، والجملة صلة الموصول لا محل لها، والعائد محذوف (تسعاه)
