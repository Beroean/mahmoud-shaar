text: إِنَّ أَخَاكَ بَارِعٌ فِي إِصْلَاحِ الْحَوَاسِيبِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - أَخَاكَ
    - أَخَاكِ
source: llm-reviewed
level: 2
