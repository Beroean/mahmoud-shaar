text: غَيْرُ مُجْدٍ فِي مِلَّتِي وَاعْتِقَادِي
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة (اسم منقوص)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الواو عاطفة، و«اعتقاد» معطوف مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم
alts: []
author: أبو العلاء المعري
source: poetry
