text: فَاللَّهُ هُوَ الْوَلِيُّ وَهُوَ يُحْيِي الْمَوْتَىٰ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
irab:
  - الفاء الفصيحة، ولفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
  - ضمير فصل مبني على الفتح لا محل له من الإعراب
  - خبر مرفوع وعلامة رفعه الضمة
  - الواو حرف عطف، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - الواو حرف عطف، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«قدير»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
source: quran
level: 3
ref: سورة الشورى، الآية ٩
