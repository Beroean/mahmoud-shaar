text: سَأَلَ السَّائِحُ أَحَدَ الْمَارَّةِ عَنْ أَقْرَبِ صَرَّافٍ آلِيٍّ فِي الْحَيِّ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو اسم تفضيل ممنوع من الصرف جُرّ بالكسرة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
