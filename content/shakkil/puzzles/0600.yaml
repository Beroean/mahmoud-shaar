text: إِنَّ الْعُيُونَ الَّتِي فِي طَرْفِهَا حَوَرٌ قَتَلْنَنَا ثُمَّ لَمْ يُحْيِينَ قَتْلَانَا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - اسم موصول مبني على السكون في محل نصب نعت لـ«العيون»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم، والجملة صلة الموصول لا محل لها
  - فعل ماضٍ مبني على السكون لاتصاله بنون النسوة، والنون ضمير متصل في محل رفع فاعل، و«نا» ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
  - حرف عطف مبني على الفتح
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني على السكون لاتصاله بنون النسوة في محل جزم بـ«لم»، والنون ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
alts: []
author: جرير
source: poetry
level: 2
ref: «بان الخليط ولو طُوِّعتُ ما بانا»
