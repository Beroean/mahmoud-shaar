text: كَذَّبَتْ ثَمُودُ بِطَغْوَاهَا
irab:
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف للعلمية والتأنيث
  - الباء حرف جر، و«طغوى» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«كذّبت»
alts: []
source: quran
ref: سورة الشمس، الآية ١١
