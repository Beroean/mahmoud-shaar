text: تُبَاعُ الْكُتُبُ الْمُسْتَعْمَلَةُ فِي سُوقٍ أُسْبُوعِيٍّ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة (اسم مفعول)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
