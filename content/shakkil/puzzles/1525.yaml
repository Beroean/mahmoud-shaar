text: فَبَايِعْهُنَّ وَاسْتَغْفِرْ لَهُنَّ اللَّهَ
irab:
  - الفاء رابطة لجواب الشرط، و«بايع» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«هنّ» ضمير متصل مبني على الفتح في محل نصب مفعول به، والجملة جواب شرط غير جازم لا محل لها
  - الواو حرف عطف، و«استغفر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«هنّ» ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«استغفر»
  - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
alts: []
context: الله يخاطب النبي ﷺ في شأن المؤمنات اللاتي جئن يبايعنه
source: quran
level: 2
ref: سورة الممتحنة، الآية ١٢
