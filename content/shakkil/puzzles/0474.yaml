text: ذَهَبَتْ نَوَالُ وَأُخْتُهَا إِلَى السُّوقِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (العلمية والتأنيث)
  - الواو حرف عطف، و«أخت» معطوف مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - وأختها
source: llm-reviewed
level: 2
