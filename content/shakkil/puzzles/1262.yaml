text: مَهْمَا يَكُنِ الطَّقْسُ فَإِنَّ سَاعِيَ الْبَرِيدِ يُوَزِّعُ الرَّسَائِلَ كُلَّ صَبَاحٍ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع تام مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء رابطة لجواب الشرط، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
