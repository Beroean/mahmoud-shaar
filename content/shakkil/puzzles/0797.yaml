text: أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ
irab:
  - حرف عطف (أم المنقطعة بمعنى «بل» والهمزة) مبني على السكون
  - فعل ماضٍ مبني للمجهول مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع نائب فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«خُلقوا»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف عطف (أم المنقطعة) مبني على السكون
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ، وحُرّك بالضم لالتقاء الساكنين
  - خبر مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
source: quran
level: 3
ref: سورة الطور، الآية ٣٥
