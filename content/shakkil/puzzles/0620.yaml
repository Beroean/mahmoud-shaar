text: لَيْتَ الْمَدَارِسَ تُعَلِّمُ الْأَطْفَالَ الطَّبْخَ وَالزِّرَاعَةَ إِلَى جَانِبِ الرِّيَاضِيَّاتِ
irab:
  - حرف تمنٍّ ونصب مبني على الفتح
  - اسم «ليت» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر «ليت»
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«الزراعة» معطوف منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
