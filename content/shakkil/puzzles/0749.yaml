text: يَسْكُنُ عُمَرُ وَعُثْمَانُ فِي الْحَيِّ نَفْسِهِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف للعلمية والعدل
  - الواو حرف عطف، و«عثمان» معطوف مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف للعلمية وزيادة الألف والنون
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - توكيد معنوي مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
