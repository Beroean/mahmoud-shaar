text: سَيَبْدَأُ الْعَامُ الدِّرَاسِيُّ الْجَدِيدُ بَعْدَ أُسْبُوعَيْنِ، فَاسْتَعِدُّوا لَهُ جَيِّدًا
irab:
  - السين حرف استقبال، و«يبدأ» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت ثانٍ مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى
  - الفاء حرف عطف، و«استعدّوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - اللام حرف جر، والهاء ضمير متصل مبني على الضم في محل جر
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح (صفة لمصدر محذوف)
alts:
  - سَيَبْدَأُ الْعَامُ الدِّرَاسِيُّ الْجَدِيدُ بَعْدَ أُسْبُوعَيْنِ، فَاسْتَعَدُّوا لَهُ جَيِّدًا
source: llm-reviewed
level: 2
