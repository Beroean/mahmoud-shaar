text: وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ
irab:
  - الواو حرف عطف، و«قل» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب مقول القول
  - الفاء استئنافية، والسين حرف استقبال، و«يرى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«رسول» معطوف على لفظ الجلالة مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«المؤمنون» معطوف مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
