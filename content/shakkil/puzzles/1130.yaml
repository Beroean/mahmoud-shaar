text: وَاسْتَكْبَرَ هُوَ وَجُنُودُهُ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَظَنُّوا أَنَّهُمْ إِلَيْنَا لَا يُرْجَعُونَ
irab:
  - الواو حرف عطف، و«استكبر» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - ضمير منفصل مبني على الفتح في محل رفع توكيد للضمير المستتر في «استكبر»
  - الواو حرف عطف، و«جنود» اسم معطوف على الضمير المستتر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«استكبر»
  - الباء حرف جر، و«غير» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال من فاعل «استكبر»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«ظنّوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - «أنّ» حرف توكيد ونصب، و«هم» ضمير متصل مبني على السكون في محل نصب اسم «أنّ»
  - «إلى» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يرجعون»
  - حرف نفي مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع نائب فاعل، والجملة في محل رفع خبر «أنّ»، والمصدر المؤول سدّ مسدّ مفعولي «ظنّ»
