text: ذَرِينِي لِلْغِنَى أَسْعَى فَإِنِّي رَأَيْتُ النَّاسَ شَرُّهُمُ الْفَقِيرُ
irab:
  - فعل أمر مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - اللام حرف جر، و«الغنى» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وشبه الجملة متعلق بـ«أسعى»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل نصب حال
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وضُمّت ميمه للوزن
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «شرهم الفقير» في محل نصب مفعول به ثانٍ لـ«رأى»
