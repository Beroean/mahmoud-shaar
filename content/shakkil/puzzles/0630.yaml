text: لَكُمْ دِينُكُمْ وَلِيَ دِينِ
irab:
  - اللام حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، واللام حرف جر، والياء ضمير متصل مبني على الفتح في محل جر، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم المحذوفة، والياء المحذوفة ضمير متصل في محل جر مضاف إليه
alts: []
source: quran
ref: سورة الكافرون، الآية ٦
