text: اسْتَخْدَمَ الْمُزَارِعُونَ الطَّائِرَاتِ الْمُسَيَّرَةَ لِرَشِّ الْمُبِيدَاتِ عَلَى الْحُقُولِ الْوَاسِعَةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - اللام حرف جر، و«رشّ» اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
