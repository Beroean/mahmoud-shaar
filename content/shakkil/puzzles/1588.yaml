text: الْجَنَّةُ أَقْرَبُ إِلَى أَحَدِكُمْ مِنْ شِرَاكِ نَعْلِهِ، وَالنَّارُ مِثْلُ ذَلِكَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة بلا تنوين لأنه ممنوع من الصرف (أفعل تفضيل)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أقرب»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«أقرب»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«النار» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم إشارة مبني على السكون في محل جر مضاف إليه، واللام للبعد، والكاف حرف خطاب
alts: []
fixed:
  - شراك
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٤٨٨
