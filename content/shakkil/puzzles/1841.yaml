text: وَيَضْحَكُ سِنُّ الْمَرْءِ وَالْقَلْبُ مُوجَعٌ وَيَرْضَى الْفَتَى عَنْ دَهْرِهِ وَهْوَ عَاتِبُ
irab:
  - الواو استئنافية، و«يضحك» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حالية، و«القلب» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، وجملة «القلب موجع» في محل نصب حال
  - الواو حرف عطف، و«يرضى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يرضى»
  - الواو حالية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ، وسُكّنت الهاء للوزن
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «هو عاتب» في محل نصب حال
alts: []
vary:
  - - وَهْوَ
    - وَهُوَ
author: ديك الجن
source: poetry
level: 3
ref: «على هذه كانت تدور النوائب»
