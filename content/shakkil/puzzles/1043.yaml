text: وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَأَطِيعُوا الرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ
irab:
  - الواو حرف عطف، و«أقيموا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«آتوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«أطيعوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - «لعلّ» حرف ترجٍّ ونصب مبني على الفتح، و«كم» ضمير متصل في محل نصب اسم «لعلّ»
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع نائب فاعل، والجملة في محل رفع خبر «لعلّ»
