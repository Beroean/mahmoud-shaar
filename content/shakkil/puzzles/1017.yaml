text: يَنْبَغِي لِلْأَخَوَيْنِ أَنْ يَتَقَاسَمَا الْأَعْمَالَ الْمَنْزِلِيَّةَ دُونَ شِجَارٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - اللام حرف جر، و«الأخوين» اسم مجرور وعلامة جره الياء لأنه مثنى
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، وألف الاثنين ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل رفع فاعل «ينبغي»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
