text: بِئْسَتِ الْعَادَةُ التَّدْخِينُ
irab:
  - فعل ماضٍ جامد لإنشاء الذم مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - المخصوص بالذم مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «بئست العادة» في محل رفع خبر مقدم
alts: []
fixed:
  - بئست
source: llm-reviewed
