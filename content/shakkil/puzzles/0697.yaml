text: يُقَالُ إِنَّ الْبَحْرَ هَائِجٌ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف توكيد ونصب مبني على الفتح (كُسرت همزته بعد القول)، والجملة في محل رفع نائب فاعل
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
