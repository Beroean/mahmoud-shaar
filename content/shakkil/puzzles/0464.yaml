text: إِنَّ الْمُمَرِّضَاتِ يَعْمَلْنَ لَيْلًا وَنَهَارًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - فعل مضارع مبني على السكون لاتصاله بنون النسوة، والنون ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«نهارًا» معطوف منصوب وعلامة نصبه تنوين الفتح
