text: أَصْبَحَ الْهَاتِفُ الذَّكِيُّ جُزْءًا لَا يَتَجَزَّأُ مِنْ حَيَاتِنَا الْيَوْمِيَّةِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «أصبح» مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «أصبح» منصوب وعلامة نصبه تنوين الفتح
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب نعت لـ«جزءًا»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
