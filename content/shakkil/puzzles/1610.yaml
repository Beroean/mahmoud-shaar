text: لَا تَعْجَبِي يَا سَلْمَ مِنْ رَجُلٍ ضَحِكَ الْمَشِيبُ بِرَأْسِهِ فَبَكَى
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، وياء المخاطبة ضمير متصل في محل رفع فاعل
  - حرف نداء مبني على السكون
  - منادى مرخم (سلمى) مبني على الضم على الألف المحذوفة في محل نصب، وفتحة الميم حركتها قبل الترخيم على لغة من ينتظر، ويجوز «سلمُ» على لغة من لا ينتظر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«تعجبي»
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«رأس» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«ضحك»، وجملة «ضحك المشيب برأسه» في محل جر نعت لـ«رجل»
  - الفاء حرف عطف، و«بكى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو يعود على «رجل»
alts: []
vary:
  - - سَلْمَ
    - سَلْمُ
context: الشاعر يخاطب امرأة اسمها سلمى
author: دعبل الخزاعي
source: poetry
level: 3
ref: «أين الشباب؟ وأية سلكا»
