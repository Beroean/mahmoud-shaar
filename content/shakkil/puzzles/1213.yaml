text: لَمْ يَنْمُ الزَّرْعُ هٰذَا الْعَامَ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة، والضمة قبلها دليل عليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - «ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل نصب نائب عن ظرف الزمان
  - بدل من اسم الإشارة منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
vary:
  - - يَنْمُ
    - يَنْمِ
