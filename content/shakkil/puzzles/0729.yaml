text: إِنْ لَمْ تُسْرِعُوا فَلَنْ تَجِدُوا أَمَاكِنَ فَارِغَةً
irab:
  - حرف شرط جازم مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة فعل الشرط
  - الفاء رابطة لجواب الشرط، و«لن» حرف نفي ونصب واستقبال
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل جزم جواب الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت منصوب وعلامة نصبه تنوين الفتح
