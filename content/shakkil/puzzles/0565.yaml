text: وَلَوْلَا إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ
irab:
  - الواو حرف عطف، و«لولا» حرف تحضيض مبني على السكون
  - ظرف لما مضى من الزمان مبني على السكون في محل نصب متعلق بـ«قلت»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل
  - اسم موصول مبني على السكون في محل رفع خبر لمبتدأ محذوف
  - فعل ماضٍ مبني على الفتح، والجملة صلة الموصول لا محل لها
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - نافية للجنس مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - أداة حصر لا عمل لها
  - الباء حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «لا»
