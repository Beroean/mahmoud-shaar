text: حُفَّتِ الْجَنَّةُ بِالْمَكَارِهِ، وَحُفَّتِ النَّارُ بِالشَّهَوَاتِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث الساكنة، وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«المكاره» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«حُفّت»
  - الواو حرف عطف، و«حُفّت» فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث، وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«الشهوات» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«حُفّت»
