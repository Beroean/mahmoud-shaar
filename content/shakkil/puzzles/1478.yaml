text: حَبَّذَا الْمَشْيُ عَلَى شَاطِئِ الْبَحْرِ
irab:
  - «حبّ» فعل ماضٍ لإنشاء المدح مبني على الفتح، و«ذا» اسم إشارة مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر مقدم
  - المخصوص بالمدح مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
