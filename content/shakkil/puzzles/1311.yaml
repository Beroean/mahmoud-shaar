text: وَلَوْ قَاتَلَكُمُ الَّذِينَ كَفَرُوا لَوَلَّوُا الْأَدْبَارَ ثُمَّ لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا
irab:
  - الواو استئنافية، و«لو» حرف شرط غير جازم مبني على السكون
  - «قاتل» فعل ماضٍ مبني على الفتح، و«كم» ضمير متصل مبني على السكون في محل نصب مفعول به، وحُرّك بالضم لالتقاء الساكنين
  - اسم موصول مبني على الفتح في محل رفع فاعل
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - اللام واقعة في جواب «لو»، و«ولّوا» فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة، والواو ضمير متصل في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة
  - حرف عطف مبني على الفتح
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - اسم معطوف على «وليًّا» منصوب وعلامة نصبه تنوين الفتح
