text: لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، والميم علامة الجمع
  - حرف غاية وجر مبني على السكون
  - فعل مضارع ناقص منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه الفتحة، واسمه ضمير مستتر وجوبًا تقديره أنا
  - خبر «أكون» منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف للوصفية ووزن «أفعل»
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«أحب»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أحب»
  - الواو حرف عطف، و«ولد» اسم معطوف مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«الناس» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة
  - توكيد معنوي مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم
