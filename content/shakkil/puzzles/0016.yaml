text: سَلَّمْتُ عَلَى أَخِيكَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
alts:
  - سَلَّمْتُ عَلَى أَخِيكِ
source: llm-reviewed
