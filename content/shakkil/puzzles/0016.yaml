text: سَلَّمْتُ عَلَى أَخِيكَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
alts: []
vary:
  - [سَلَّمْتُ, سَلَّمْتَ, سَلَّمْتِ]
  - [أَخِيكَ, أَخِيكِ]
source: llm-reviewed
level: 2
