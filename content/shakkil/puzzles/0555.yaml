text: قَالَ يَا أَبَتِ افْعَلْ مَا تُؤْمَرُ
irab:
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، والتاء عوض عن الياء
  - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة في محل نصب مقول القول
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة صلة الموصول لا محل لها
