text: يَوْمَئِذٍ يُوَفِّيهِمُ اللَّهُ دِينَهُمُ الْحَقَّ وَيَعْلَمُونَ أَنَّ اللَّهَ هُوَ الْحَقُّ الْمُبِينُ
irab:
  - «يوم» ظرف زمان منصوب وعلامة نصبه الفتحة متعلق بـ«يوفّيهم»، وهو مضاف، و«إذ» ظرف مبني على السكون في محل جر مضاف إليه، والتنوين عوض عن جملة محذوفة
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به أول، وحُرّكت الميم بالضم لالتقاء الساكنين
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - نعت منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«يعلمون» فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «أنّ» منصوب وعلامة نصبه الفتحة
  - ضمير فصل مبني على الفتح لا محل له من الإعراب
  - خبر «أنّ» مرفوع وعلامة رفعه الضمة، والمصدر المؤول من «أنّ» وما بعدها سدّ مسدّ مفعولي «يعلمون»
  - نعت مرفوع وعلامة رفعه الضمة
