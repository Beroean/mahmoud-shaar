text: إِنَّ أَحَقَّ مَا أَخَذْتُمْ عَلَيْهِ أَجْرًا كِتَابُ اللَّهِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو اسم تفضيل مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على السكون لاتصاله بضمير الرفع المتحرك، و«تم» ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - «على» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«أخذتم»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٧٣٧
