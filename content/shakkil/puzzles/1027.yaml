text: إِنَّهُ لَقَوْلٌ فَصْلٌ
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «إنّ»
  - اللام المزحلقة للتوكيد، و«قول» خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه تنوين الضم
alts: []
context: الضمير في «إنه» للقرآن الكريم
source: quran
ref: سورة الطارق، الآية ١٣
