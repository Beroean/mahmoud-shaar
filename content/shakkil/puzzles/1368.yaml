text: رَجَعَتْ مَرَاكِبُ الصَّيْدِ مُحَمَّلَةً بِالْأَسْمَاكِ بَعْدَ أُسْبُوعٍ فِي عُرْضِ الْبَحْرِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«الأسماك» اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
