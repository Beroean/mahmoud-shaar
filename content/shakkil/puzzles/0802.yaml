text: وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ
irab:
  - الواو استئنافية، و«ما» نافية مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - مفعول به مقدّم منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - أداة حصر لا عمل لها
  - ضمير منفصل مبني على الفتح في محل رفع فاعل مؤخر
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة المدثر، الآية ٣١
