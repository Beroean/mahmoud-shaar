text: الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ وَفِي كُلٍّ خَيْرٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«أحبّ» معطوف مرفوع وعلامة رفعه الضمة، وهو اسم تفضيل ممنوع من الصرف على وزن «أفعل»
  - حرف جر مبني على السكون
  - لفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أحبّ»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«خير» و«أحبّ»
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢٦٦٤
