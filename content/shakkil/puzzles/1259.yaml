text: سَاوَمَ الْمُشْتَرِي الْبَائِعَ طَوِيلًا، ثُمَّ اشْتَرَى السَّجَّادَةَ بِنِصْفِ ثَمَنِهَا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - صفة لمصدر محذوف (نائب عن المفعول المطلق) منصوب وعلامة نصبه تنوين الفتح
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«نصف» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
