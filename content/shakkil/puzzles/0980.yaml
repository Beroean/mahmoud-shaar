text: سَارَتِ الْقَافِلَةُ تِسْعَ لَيَالٍ مُتَتَالِيَةٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف (العدد يخالف المعدود)
  - مضاف إليه مجرور وعلامة جره الفتحة المقدرة على الياء المحذوفة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)، والتنوين تنوين عوض
  - نعت مجرور وعلامة جره تنوين الكسر
