text: مَا أَرْوَعَ أَلْوَانَ السَّمَاءِ حِينَ تَغْرُبُ الشَّمْسُ خَلْفَ الْجِبَالِ الْبَعِيدَةِ!
irab:
  - «ما» التعجبية نكرة تامة بمعنى «شيء» مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر مضاف إليه
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
