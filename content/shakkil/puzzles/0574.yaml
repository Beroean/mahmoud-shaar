text: إِنَّ مِنَ الْبَيَانِ لَسِحْرًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - اللام المزحلقة للتوكيد، و«سحرًا» اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٥١٤٦
