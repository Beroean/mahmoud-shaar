text: رَأَى الْخُبَرَاءُ الطَّاقَةَ الشَّمْسِيَّةَ حَلًّا مُنَاسِبًا
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، من أفعال القلوب ينصب مفعولين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
