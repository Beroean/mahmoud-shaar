text: وَحَدَّثْتَنِي يَا سَعْدُ عَنْهَا فَزِدْتَنِي جُنُونًا فَزِدْنِي مِنْ حَدِيثِكَ يَا سَعْدُ
irab:
  - الواو بحسب ما قبلها، و«حدّث» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - حرف نداء مبني على السكون
  - منادى مبني على الضم في محل نصب لأنه علم مفرد
  - «عن» حرف جر، و«ها» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«حدّثتني»
  - الفاء حرف عطف، و«زاد» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الفاء استئنافية، و«زد» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به أول، والمفعول الثاني محذوف
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه، وشبه الجملة متعلق بـ«زدني»
  - حرف نداء مبني على السكون
  - منادى مبني على الضم في محل نصب لأنه علم مفرد
