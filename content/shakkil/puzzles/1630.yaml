text: وَإِنَّ لِلَّذِينَ ظَلَمُوا عَذَابًا دُونَ ذَٰلِكَ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
irab:
  - الواو استئنافية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اللام حرف جر، و«الذين» اسم موصول مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدّم
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - اسم «إنّ» مؤخّر منصوب وعلامة نصبه تنوين الفتح
  - ظرف مكان منصوب وعلامة نصبه الفتحة متعلق بمحذوف نعت لـ«عذابًا»، وهو مضاف
  - اسم إشارة مبني على السكون في محل جر مضاف إليه، واللام للبعد، والكاف حرف خطاب
  - الواو حرف عطف، و«لكنّ» حرف استدراك ونصب مبني على الفتح
  - اسم «لكنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر «لكنّ»
