text: لَا أَحَدَ يَعْرِفُ مَوْعِدَ وُصُولِ السَّفِينَةِ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «لا»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا أَحَدٌ يَعْرِفُ مَوْعِدَ وُصُولِ السَّفِينَةِ
source: llm-reviewed
level: 2
