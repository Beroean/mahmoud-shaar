text: كَانَ الْمُسَافِرُونَ يَنْتَظِرُونَ فِي الْمَطَارِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
