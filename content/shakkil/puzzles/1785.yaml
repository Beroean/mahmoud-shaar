text: فَضَرَبْنَا عَلَىٰ آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا
irab:
  - الفاء حرف عطف، و«ضرب» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بـ«ضربنا»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«ضربنا»
  - ظرف زمان منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم، متعلق بـ«ضربنا»
  - نعت لـ«سنين» منصوب وعلامة نصبه تنوين الفتح، أي ذوات عدد
alts: []
context: الحديث عن أصحاب الكهف
source: quran
level: 2
ref: سورة الكهف، الآية ١١
