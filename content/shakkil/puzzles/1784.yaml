text: فَاتَّقُوا اللَّهَ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تُفْلِحُونَ
irab:
  - الفاء استئنافية، و«اتقوا» فعل أمر مبني على حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - حرف ترجٍّ ونصب مبني على الفتح يعمل عمل «إنّ»، والكاف ضمير متصل مبني على الضم في محل نصب اسم «لعلّ»، والميم علامة الجمع
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر «لعلّ»
