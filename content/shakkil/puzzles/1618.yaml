text: الْتَقَيْنَا فِي مَقْهًى صَغِيرٍ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر (اسم مقصور منوّن)
  - نعت مجرور وعلامة جره تنوين الكسر
