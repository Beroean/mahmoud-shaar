text: تَعْرُجُ الْمَلَائِكَةُ وَالرُّوحُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ خَمْسِينَ أَلْفَ سَنَةٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - فاعل مرفوع وعلامة رفعه الضمة
  - الواو حرف عطف، و«الروح» معطوف على «الملائكة» مرفوع وعلامة رفعه الضمة
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«تعرج»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«تعرج»
  - فعل ماضٍ ناقص مبني على الفتح، والجملة في محل جر نعت لـ«يوم»
  - اسم «كان» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر «كان» منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم (من ألفاظ العقود في العدد)
  - تمييز منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
context: الضمير في «إليه» لله تعالى
source: quran
level: 3
ref: سورة المعارج، الآية ٤
