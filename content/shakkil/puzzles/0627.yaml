text: لَمْ يَسْتَطِعِ الْمُتَسَلِّقَانِ أَنْ يَبْلُغَا الْقِمَّةَ بِسَبَبِ الرِّيَاحِ الشَّدِيدَةِ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الياء لالتقاء الساكنين، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الألف لأنه مثنى
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والألف ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«سبب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
