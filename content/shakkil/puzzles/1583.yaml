text: اتَّقِ دَعْوَةَ الْمَظْلُومِ، فَإِنَّهَا لَيْسَ بَيْنَهَا وَبَيْنَ اللَّهِ حِجَابٌ
irab:
  - فعل أمر مبني على حذف حرف العلة (الياء)، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب، و«ها» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ ناقص جامد مبني على الفتح، والجملة في محل رفع خبر «إنّ»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - الواو حرف عطف، و«بين» ظرف مكان معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اسم «ليس» مؤخر مرفوع وعلامة رفعه تنوين الضم
