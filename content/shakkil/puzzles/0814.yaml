text: يَعْلَمُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَيَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بصلة الموصول المحذوفة
  - الواو حرف عطف، و«الأرض» اسم معطوف مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«يعلم» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل نصب معطوف
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
alts: []
context: الضمير في «يعلم» لله تعالى
source: quran
level: 3
ref: سورة التغابن، الآية ٤
