text: سَافَرَتِ الْمُهَنْدِسَتَانِ إِلَى الْقَاهِرَةِ لِحُضُورِ مُؤْتَمَرٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الألف لأنه مثنى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - اللام حرف جر، و«حضور» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
