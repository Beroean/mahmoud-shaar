text: وَقَالَ إِنِّي ذَاهِبٌ إِلَىٰ رَبِّي سَيَهْدِينِ
irab:
  - الواو حرف عطف، و«قال» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - «إنّ» حرف توكيد ونصب مبني على الفتح، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب مقول القول
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«ذاهب»
  - السين حرف استقبال، و«يهدي» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، وياء المتكلم المحذوفة ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر ثانٍ لـ«إنّ»
