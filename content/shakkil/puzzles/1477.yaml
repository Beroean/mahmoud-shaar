text: مَا أَرْوَعَ أَنْ تَتَلَأْلَأَ النُّجُومُ لَيْلًا!
irab:
  - «ما» تعجبية نكرة تامة مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
