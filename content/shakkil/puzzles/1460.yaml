text: قَرَأَتِ الطَّالِبَةُ ثَلَاثَ عَشْرَةَ صَفْحَةً
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - «ثلاث عشرة» عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
  - الجزء الثاني من العدد المركب مبني على الفتح لا محل له من الإعراب
  - تمييز منصوب وعلامة نصبه تنوين الفتح
