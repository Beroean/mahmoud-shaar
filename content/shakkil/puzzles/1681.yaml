text: الطَّاهِي مُتْقِنٌ عَمَلَهُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل (اسم منقوص)
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو اسم فاعل يعمل عمل فعله
  - مفعول به لاسم الفاعل «متقن» منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts:
  - الطَّاهِي مُتْقِنُ عَمَلِهِ
source: llm-reviewed
