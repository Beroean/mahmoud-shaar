text: لَوْ نَشَاءُ لَجَعَلْنَاهُ حُطَامًا فَظَلْتُمْ تَفَكَّهُونَ
irab:
  - حرف شرط غير جازم مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - اللام واقعة في جواب «لو»، و«جعل» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به أول، والجملة جواب شرط غير جازم لا محل لها
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الفاء حرف عطف، و«ظلّ» فعل ماضٍ ناقص مبني على السكون لاتصاله بضمير الرفع، و«تم» ضمير متصل مبني على السكون في محل رفع اسم «ظلّ»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل نصب خبر «ظلّ»
alts: []
context: الحديث عن الزرع، والخطاب للناس
source: quran
level: 3
ref: سورة الواقعة، الآية ٦٥
