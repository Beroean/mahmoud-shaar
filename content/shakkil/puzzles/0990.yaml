text: لَنْ تَتَمَكَّنُوا مِنَ الدُّخُولِ دُونَ تَذَاكِرَ
irab:
  - حرف نفي ونصب واستقبال مبني على السكون
  - فعل مضارع منصوب بـ«لن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
