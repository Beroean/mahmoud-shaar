text: وَإِنَّمَا الْأُمَمُ الْأَخْلَاقُ مَا بَقِيَتْ
irab:
  - الواو بحسب ما قبلها، و«إنما» كافّة ومكفوفة لا عمل لها
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - مصدرية ظرفية مبنية على السكون
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي
alts: []
author: أحمد شوقي
