text: نُودِيَ الرُّكَّابُ لِلصُّعُودِ إِلَى الطَّائِرَةِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«الصعود» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
