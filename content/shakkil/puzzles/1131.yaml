text: كَلَّا إِنَّ كِتَابَ الْفُجَّارِ لَفِي سِجِّينٍ
irab:
  - حرف ردع وزجر مبني على السكون
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - اللام المزحلقة للتوكيد، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر «إنّ»
