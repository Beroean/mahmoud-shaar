text: تَبَرَّعَ الشَّابُّ بِدَمِهِ إِنْقَاذًا لِلْمَرْضَى
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«دم» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«المرضى» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
