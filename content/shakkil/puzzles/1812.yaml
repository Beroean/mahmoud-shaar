text: دَعُونِي مَا تَرَكْتُكُمْ
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - حرف مصدري ظرفي مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، و«كم» ضمير متصل في محل نصب مفعول به، والمصدر المؤول في محل نصب ظرف زمان
alts: []
fixed:
  - تركتكم
source: hadith
ref: صحيح البخاري، الحديث ٧٢٨٨
