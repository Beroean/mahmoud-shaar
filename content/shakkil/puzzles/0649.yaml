text: فِي الصَّفِّ ثَلَاثُونَ طَالِبًا
irab:
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم (من ألفاظ العقود في العدد)
  - تمييز منصوب وعلامة نصبه تنوين الفتح
