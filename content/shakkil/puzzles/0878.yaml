text: إِنْ تَجْتَهِدُوا تَتَفَوَّقُوا
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
