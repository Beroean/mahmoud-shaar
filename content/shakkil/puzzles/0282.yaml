text: يَعْمَلُ أَبُو سَمِيرٍ فِي مَطْعَمٍ كَبِيرٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
