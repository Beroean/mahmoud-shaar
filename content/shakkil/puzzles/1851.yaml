text: وَمَا الْمَرْءُ إِلَّا قَوْمُهُ وَبِلَادُهُ
irab:
  - الواو استئنافية، و«ما» نافية مهملة لانتقاض نفيها بـ«إلا»، مبنية على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - أداة حصر لا عمل لها
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«بلاد» معطوف على «قوم» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
author: أحمد محرم
source: poetry
level: 2
ref: «ذراني أقم للشعر في مصر مأتما»
