text: كَادَ الْمُعَلِّمُ أَنْ يَكُونَ رَسُولَا
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح
  - اسم «كاد» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع ناقص منصوب بـ«أن» وعلامة نصبه الفتحة، واسمه ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب خبر «كاد»
  - خبر «يكون» منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - رَسُولَا
    - رَسُولًا
author: أحمد شوقي
source: poetry
ref: «قم للمعلم وفّه التبجيلا»
