text: يَا حَارِسَ الْمَرْمَى، ابْقَ مَكَانَكَ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - فعل أمر مبني على حذف حرف العلة من آخره، والفتحة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
alts: []
fixed:
  - مكانك
