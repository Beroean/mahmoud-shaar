text: إِنَّ الْعَيْنَ تَدْمَعُ، وَالْقَلْبَ يَحْزَنُ، وَلَا نَقُولُ إِلَّا مَا يَرْضَى رَبُّنَا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «إنّ»
  - الواو حرف عطف، و«القلب» معطوف على اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة معطوفة على خبر «إنّ» في محل رفع
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - أداة حصر مبنية على السكون (استثناء مفرّغ)
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والعائد محذوف تقديره يرضاه، والجملة صلة الموصول لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
