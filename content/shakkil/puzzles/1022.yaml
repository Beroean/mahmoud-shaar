text: لَا شَكَّ فِي أَنَّ النَّوْمَ الْكَافِيَ يُحَسِّنُ قُدْرَةَ الطُّلَّابِ عَلَى التَّرْكِيزِ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - حرف جر مبني على السكون
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» ومعموليها في محل جر بـ«في»، وشبه الجملة متعلق بمحذوف خبر «لا»
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة على الياء لأنه اسم منقوص
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا شَكٌّ فِي أَنَّ النَّوْمَ الْكَافِيَ يُحَسِّنُ قُدْرَةَ الطُّلَّابِ عَلَى التَّرْكِيزِ
source: llm-reviewed
level: 3
