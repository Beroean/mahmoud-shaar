text: مَنْ أَدْرَكَ رَكْعَةً مِنَ الصَّلَاةِ فَقَدْ أَدْرَكَ الصَّلَاةَ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف نعت لـ«ركعة»
  - الفاء رابطة لجواب الشرط، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جزم جواب الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٥٨٠
