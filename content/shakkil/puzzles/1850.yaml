text: وَقَدْ يُنَسِّيكَ بَعْضَ الْحَاجَةِ الْعَجَلُ
irab:
  - الواو حالية، و«قد» حرف تقليل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
context: حكمة عامة، والخطاب فيها لمذكر
author: الراعي النميري
source: poetry
level: 2
ref: «قالت سليمى أتثوي اليوم أم تغل»
