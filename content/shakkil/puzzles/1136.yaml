text: الْخَيْلُ فِي نَوَاصِيهَا الْخَيْرُ إِلَى يَوْمِ الْقِيَامَةِ
irab:
  - مبتدأ أول مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو ممنوع من الصرف (صيغة منتهى الجموع) لكنه جُرّ بالكسرة لإضافته، و«ها» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ ثانٍ مؤخر مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر المبتدأ الأول
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بالخبر المحذوف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٢٨٤٩
