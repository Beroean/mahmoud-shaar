text: اخْلَوْلَقَتِ السَّمَاءُ أَنْ تُمْطِرَ
irab:
  - فعل ماضٍ ناقص من أفعال الرجاء مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «اخلولق» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول في محل نصب خبر «اخلولق»
alts:
  - اخْلَوْلَقَتِ السَّمَاءُ أَنْ تَمْطُرَ
source: llm-reviewed
