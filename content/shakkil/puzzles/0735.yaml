text: لَمْ يَكُنِ الْبَحْرُ هَادِئًا ذٰلِكَ الْيَوْمَ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه السكون المقدر، وحُذفت الواو لالتقاء الساكنين، وحُرّك بالكسر لالتقاء الساكنين
  - اسم «يكن» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «يكن» منصوب وعلامة نصبه تنوين الفتح
  - اسم إشارة مبني على الفتح في محل نصب نائب عن ظرف الزمان، واللام للبعد والكاف للخطاب
  - بدل منصوب وعلامة نصبه الفتحة الظاهرة
