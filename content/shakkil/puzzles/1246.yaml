text: يَقْضِي الدُّبُّ أَشْهُرَ الشِّتَاءِ نَائِمًا فِي كَهْفِهِ، لَا يَأْكُلُ وَلَا يَشْرَبُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب حال ثانية
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة معطوفة على «لا يأكل»
