text: قَدْ يُدْرِكُ الْمُتَأَنِّي بَعْضَ حَاجَتِهِ
irab:
  - حرف تقليل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، والهاء ضمير متصل مبني على الكسر في محل جر مضاف إليه
alts: []
author: القطامي
