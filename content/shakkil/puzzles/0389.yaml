text: أَمُرُّ عَلَى الدِّيَارِ دِيَارِ لَيْلَى أُقَبِّلُ ذَا الْجِدَارَ وَذَا الْجِدَارَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - بدل من «الديار» مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة المقدرة على الألف نيابة عن الكسرة لأنه ممنوع من الصرف (ألف التأنيث المقصورة)
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا، والجملة في محل نصب حال
  - اسم إشارة مبني على السكون في محل نصب مفعول به
  - بدل من اسم الإشارة منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«ذا» اسم إشارة مبني على السكون في محل نصب معطوف
  - بدل منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
author: قيس بن الملوح
source: poetry
level: 3
ref: «أمرّ على الديار ديار ليلى»
