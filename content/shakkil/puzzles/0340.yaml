text: إِذَا الْمَرْءُ لَمْ يُدْنَسْ مِنَ اللُّؤْمِ عِرْضُهُ فَكُلُّ رِدَاءٍ يَرْتَدِيهِ جَمِيلُ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه السكون
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، والجملة في محل رفع خبر المبتدأ
  - الفاء رابطة لجواب الشرط، و«كلّ» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل جر نعت لـ«رداء»
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: السموأل
source: poetry
level: 3
ref: اللامية
