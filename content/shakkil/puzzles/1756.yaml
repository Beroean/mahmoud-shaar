text: أَيُّهَا الْمُتَسَابِقُونَ، لَا تَنْطَلِقُوا قَبْلَ أَنْ تَسْمَعُوا صَوْتَ الصَّافِرَةِ
irab:
  - منادى بحرف نداء محذوف، و«أيّ» نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الواو لأنه جمع مذكر سالم
  - «لا» الناهية حرف جزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
