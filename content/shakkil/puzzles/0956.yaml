text: يَحْسَبُ الْعَطْشَانُ السَّرَابَ مَاءً
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، من أخوات «ظنّ»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
alts:
  - يَحْسِبُ الْعَطْشَانُ السَّرَابَ مَاءً
source: llm-reviewed
