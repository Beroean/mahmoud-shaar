text: تَضُمُّ الْمَكْتَبَةُ خَمْسَةَ عَشَرَ رَفًّا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - «خمسة عشر» عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
  - الجزء الثاني من العدد المركب مبني على الفتح لا محل له من الإعراب
  - تمييز منصوب وعلامة نصبه تنوين الفتح
