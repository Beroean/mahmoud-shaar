text: وَخَيْرُ جَلِيسٍ فِي الزَّمَانِ كِتَابُ
irab:
  - الواو بحسب ما قبلها، و«خير» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة، وحُذف التنوين للقافية
alts:
  - وَخَيْرُ جَلِيسٍ فِي الزَّمَانِ كِتَابٌ
author: المتنبي
source: poetry
