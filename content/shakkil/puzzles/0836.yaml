text: الْإِيمَانُ بِضْعٌ وَسِتُّونَ شُعْبَةً، وَالْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَانِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو من ألفاظ العدد
  - الواو حرف عطف، و«ستون» اسم معطوف مرفوع وعلامة رفعه الواو لأنه ملحق بجمع المذكر السالم
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«الحياء» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف نعت لـ«شعبة»
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٩
