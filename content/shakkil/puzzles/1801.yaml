text: إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَـٰهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، و«هم» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع اسم «كان»، والجملة في محل رفع خبر «إنّ»
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والجملة في محل جر بالإضافة
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«قيل»
  - نافية للجنس تعمل عمل «إنّ» مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف تقديره «موجود»
  - أداة حصر لا عمل لها
  - لفظ الجلالة بدل من الضمير المستتر في الخبر المحذوف مرفوع وعلامة رفعه الضمة، وجملة «لا إله إلا الله» في محل رفع نائب فاعل
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها، وجملة الشرط وجوابه في محل نصب خبر «كان»
