text: ادْعُ زُمَلَاءَكَ إِلَى الِاجْتِمَاعِ
irab:
  - فعل أمر مبني على حذف حرف العلة من آخره، والضمة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - زملاءك
