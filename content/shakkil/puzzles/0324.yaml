text: يَا دَارَ عَبْلَةَ بِالْجِوَاءِ تَكَلَّمِي
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (علم مؤنث)
  - الباء حرف جر، و«الجواء» اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع فاعل
alts: []
author: عنترة بن شداد
source: poetry
level: 2
ref: المعلقة
