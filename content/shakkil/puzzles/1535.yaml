text: الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ
irab:
  - اسم موصول مبني على السكون في محل جر نعت لـ«الوسواس»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«يوسوس»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: وصف «الوسواس الخنّاس» في الآية السابقة
source: quran
ref: سورة الناس، الآية ٥
