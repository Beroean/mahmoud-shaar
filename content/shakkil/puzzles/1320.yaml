text: بَلِّغُوا عَنِّي وَلَوْ آيَةً
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل في محل رفع فاعل
  - «عن» حرف جر، والياء ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«بلّغوا»
  - الواو حالية، و«لو» حرف شرط غير جازم (وصلية) مبني على السكون
  - خبر لـ«كان» المحذوفة مع اسمها منصوب وعلامة نصبه تنوين الفتح، والتقدير ولو كان المبلَّغ آيةً
alts: []
source: hadith
level: 2
