text: وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ
irab:
  - الواو حرف عطف، و«اخفض» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«هما» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«اخفض»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«اخفض»
alts: []
source: quran
level: 2
ref: سورة الإسراء، الآية ٢٤
