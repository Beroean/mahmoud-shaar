text: شَاكٍ إِلَى الْبَحْرِ اضْطِرَابَ خَوَاطِرِي فَيُجِيبُنِي بِرِيَاحِهِ الْهَوْجَاءِ
irab:
  - خبر لمبتدأ محذوف تقديره «أنا» مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لأنه اسم منقوص
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«شاكٍ»
  - مفعول به لاسم الفاعل «شاكٍ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء حرف عطف، و«يجيب» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو يعود على البحر، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«رياح» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يجيب»
  - نعت مجرور وعلامة جره الكسرة الظاهرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لدخول «ال» عليه
alts: []
author: خليل مطران
source: poetry
