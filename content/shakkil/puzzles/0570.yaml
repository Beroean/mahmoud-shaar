text: لَا تَسُبُّوا أَصْحَابِي
irab:
  - حرف نهي جازم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بالحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٣٦٧٣
