text: يَا أَهْلَ أَنْدَلُسٍ لِلَّهِ دَرُّكُمُ مَاءٌ وَظِلٌّ وَأَنْهَارٌ وَأَشْجَارُ
irab:
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو ممنوع من الصرف (العلمية والعجمة) وصُرف للضرورة الشعرية
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم، والجملة تفيد التعجب
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه، وضُمّت الميم للوزن
  - مبتدأ مرفوع وعلامة رفعه تنوين الضم، والخبر محذوف تقديره «لكم»
  - الواو حرف عطف، و«ظل» معطوف مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«أنهار» معطوف مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«أشجار» معطوف مرفوع وعلامة رفعه الضمة الظاهرة
