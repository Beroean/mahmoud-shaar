text: إِنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ الْعُلَمَاءُ
irab:
  - كافّة ومكفوفة لا عمل لها
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - لفظ الجلالة مفعول به مقدّم منصوب وعلامة نصبه الفتحة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: quran
level: 2
ref: سورة فاطر، الآية ٢٨
