text: ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ
irab:
  - فعل أمر مبني على حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«ادعُ»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«الحكمة» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«ادعُ»
  - الواو حرف عطف، و«الموعظة» معطوف مجرور وعلامة جره الكسرة
  - نعت مجرور وعلامة جره الكسرة
