text: إِذَا كُنْتَ فِي كُلِّ الْأُمُورِ مُعَاتِبًا صَدِيقَكَ لَمْ تَلْقَ الَّذِي لَا تُعَاتِبُهْ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «كان»، والجملة في محل جر بإضافة «إذا» إليها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«معاتبًا»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - مفعول به لاسم الفاعل «معاتبًا» منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف) والفتحة قبلها دليل عليها، والفاعل ضمير مستتر تقديره أنت، والجملة جواب الشرط لا محل لها
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنت، والهاء ضمير متصل في محل نصب مفعول به سُكِّنت للوقف، والجملة صلة الموصول لا محل لها
alts: []
vary:
  - - تُعَاتِبُهْ
    - تُعَاتِبُهُ
