text: نَالَ الْفَتَى رِضَا مُعَلِّمِهِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر (اسم مقصور)
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts:
  - نَالَ الْفَتَى رُضَا مُعَلِّمِهِ
source: llm-reviewed
