text: لِلْبَحْرِ فِي الشِّتَاءِ هَيْبَةٌ لَا يَعْرِفُهَا الْمُصْطَافُونَ فِي الصَّيْفِ
irab:
  - اللام حرف جر، و«البحر» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، و«ها» ضمير متصل في محل نصب مفعول به، والجملة في محل رفع نعت لـ«هيبة»
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
