text: إِنَّ الْمَنَايَا لِمِيقَاتٍ لَهُ عَدَدُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - اللام حرف جر، و«ميقات» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - اللام حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «له عدد» في محل جر نعت لـ«ميقات»
alts: []
author: الراعي النميري
source: poetry
ref: «بان الأحبة بالعهد الذي عهدوا»
