text: فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا
irab:
  - الفاء حرف عطف، و«قال» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب مقول القول
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - «إنّ» حرف توكيد ونصب، والهاء ضمير متصل مبني على الضم في محل نصب اسم «إنّ»
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
alts: []
context: من قول نوح عليه السلام لقومه
source: quran
level: 2
ref: سورة نوح، الآية ١٠
