text: صَارَ الْحَيُّ أَجْمَلَ بَعْدَ زِرَاعَةِ الْأَشْجَارِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «صار» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «صار» منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (على وزن أفعل)
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
