text: زُرْنَا الْقَاهِرَةَ عَاصِمَةَ مِصْرَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - بدل من «القاهرة» منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)، ويجوز صرفه لأنه ثلاثي ساكن الوسط
alts:
  - زُرْنَا الْقَاهِرَةَ عَاصِمَةَ مِصْرٍ
source: llm-reviewed
