text: يَا مَنْ تَقِفُ عِنْدَ الْبَابِ، تَفَضَّلْ بِالدُّخُولِ فَالْقَاعَةُ دَافِئَةٌ
irab:
  - حرف نداء مبني على السكون
  - اسم موصول مبني على السكون في محل نصب منادى
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة صلة الموصول لا محل لها
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«الدخول» اسم مجرور وعلامة جره الكسرة الظاهرة
  - الفاء تعليلية حرف مبني على الفتح، و«القاعة» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
