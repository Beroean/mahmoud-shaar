text: كُلَّمَا ارْتَفَعَتِ الْحَرَارَةُ زَادَ اسْتِهْلَاكُ الْمَاءِ
irab:
  - «كلّ» ظرف زمان منصوب متضمن معنى الشرط وعلامة نصبه الفتحة، و«ما» مصدرية ظرفية
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة فعل الشرط
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والجملة جواب الشرط لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
