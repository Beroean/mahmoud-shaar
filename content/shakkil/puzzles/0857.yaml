text: وَإِنَّ أَشْعَرَ بَيْتٍ أَنْتَ قَائِلُهُ بَيْتٌ يُقَالُ إِذَا أَنْشَدْتَهُ صَدَقَا
irab:
  - الواو استئنافية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، والجملة في محل جر نعت لـ«بيت»
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل جملة «صدقا» المحكية، والجملة في محل رفع نعت لـ«بيت»
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والألف للإطلاق، والجملة في محل رفع نائب فاعل
