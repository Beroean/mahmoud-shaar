text: فَإِنَّكَ كَاللَّيْلِ الَّذِي هُوَ مُدْرِكِي وَإِنْ خِلْتُ أَنَّ الْمُنْتَأَى عَنْكَ وَاسِعُ
irab:
  - الفاء استئنافية، و«إنّ» حرف توكيد ونصب، والكاف ضمير متصل في محل نصب اسم «إنّ»
  - الكاف حرف جر، و«الليل» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - اسم موصول مبني على السكون في محل جر نعت لـ«الليل»
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر المبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، والجملة صلة الموصول لا محل لها
  - الواو حالية، و«إنْ» وصلية (حرف شرط استُغني عن جوابه) مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل في محل جزم فعل الشرط، والتاء ضمير متصل في محل رفع فاعل
  - حرف توكيد ونصب، و«أنّ» ومعمولاها سدّت مسدّ مفعولَي «خال»
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون، والكاف ضمير متصل في محل جر، وشبه الجملة متعلق بـ«المنتأى»
  - خبر «أنّ» مرفوع وعلامة رفعه الضمة الظاهرة
