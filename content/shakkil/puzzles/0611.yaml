text: أُولَئِكَ آبَائِي فَجِئْنِي بِمِثْلِهِمْ إِذَا جَمَعَتْنَا يَا جَرِيرُ الْمَجَامِعُ
irab:
  - اسم إشارة مبني على الكسر في محل رفع مبتدأ، والكاف حرف خطاب
  - خبر المبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء استئنافية، و«جئ» فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«مثل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، و«نا» ضمير متصل في محل نصب مفعول به مقدم، والجملة في محل جر بإضافة «إذا» إليها
  - حرف نداء مبني على السكون
  - منادى علم مفرد مبني على الضم في محل نصب، والجملة اعتراضية لا محل لها
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
author: الفرزدق
source: poetry
level: 3
ref: «منّا الذي اختير الرجالَ سماحةً»
