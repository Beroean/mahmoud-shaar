text: سَارَ الْقِطَارُ اللَّيْلَ كُلَّهُ حَتَّى بَلَغَ الْحُدُودَ فَجْرًا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة
  - توكيد معنوي منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
