text: إِنَّ الْأَطِبَّاءَ يَنْصَحُونَ بِشُرْبِ ثَمَانِيَةِ أَكْوَابٍ مِنَ الْمَاءِ فِي الْيَوْمِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - الباء حرف جر، و«شرب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والعدد يخالف المعدود في التذكير والتأنيث
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - إِنَّ الْأَطِبَّاءَ يَنْصَحُونَ بِشَرْبِ ثَمَانِيَةِ أَكْوَابٍ مِنَ الْمَاءِ فِي الْيَوْمِ
source: llm-reviewed
level: 3
