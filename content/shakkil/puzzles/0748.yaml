text: يَا بُنَيَّ، إِنَّ الْكَلِمَةَ الطَّيِّبَةَ تَفْتَحُ الْقُلُوبَ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المدغمة، والياء ضمير متصل في محل جر مضاف إليه
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
