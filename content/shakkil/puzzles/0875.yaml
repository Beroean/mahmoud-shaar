text: يَا لَهُ مِنْ يَوْمٍ جَمِيلٍ!
irab:
  - حرف نداء للتعجب مبني على السكون، والمنادى محذوف
  - اللام حرف جر للتعجب، والهاء ضمير متصل مبني على الضم في محل جر
  - حرف جر زائد مبني على السكون
  - تمييز مجرور لفظًا منصوب محلًا، وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
