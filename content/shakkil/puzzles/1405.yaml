text: لِيَحْمِلْ كُلُّ رَاكِبٍ تَذْكِرَتَهُ
irab:
  - اللام لام الأمر حرف جزم مبني على الكسر، و«يحمل» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
