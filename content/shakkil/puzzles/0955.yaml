text: لَيْسَ الطَّقْسُ بِمُنَاسِبٍ لِلنُّزْهَةِ
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر زائد، و«مناسب» خبر «ليس» مجرور لفظًا منصوب محلًا، وعلامة جره تنوين الكسر
  - اللام حرف جر، و«النزهة» اسم مجرور وعلامة جره الكسرة الظاهرة
