text: وَقَفَ الْهَوَى بِي حَيْثُ أَنْتِ فَلَيْسَ لِي مُتَأَخَّرٌ عَنْهُ وَلَا مُتَقَدَّمُ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - الباء حرف جر، والياء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«وقف»
  - ظرف مكان مبني على الضم في محل نصب متعلق بـ«وقف»
  - ضمير منفصل مبني على الكسر في محل رفع مبتدأ، وخبره محذوف تقديره «كائنة»، والجملة في محل جر بإضافة «حيث» إليها
  - الفاء حرف عطف، و«ليس» فعل ماضٍ ناقص جامد مبني على الفتح
  - اللام حرف جر، والياء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - اسم «ليس» مؤخر مرفوع وعلامة رفعه تنوين الضم، وهو مصدر ميمي بمعنى التأخّر
  - «عن» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«متأخَّر»
  - الواو حرف عطف، و«لا» زائدة لتوكيد النفي مبنية على السكون
  - معطوف على «متأخَّر» مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
context: الشاعر يخاطب محبوبته
author: أبو الشيص الخزاعي
source: poetry
level: 3
ref: «وقف الهوى بي حيث أنت فليس لي»
