text: طَرِيقُ الْعُلَا وَعْرٌ مَطِيَّتُهُ الْجِدُّ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «مطيته الجد» في محل رفع خبر ثانٍ لـ«طريق»
alts: []
author: علي الجارم
source: poetry
ref: «طريق العلا وعر مطيته الجد»
