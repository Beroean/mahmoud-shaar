text: وَقَالُوا مَا هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا يُهْلِكُنَا إِلَّا الدَّهْرُ
irab:
  - الواو استئنافية، و«قالوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - حرف نفي مبني على السكون
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - أداة حصر مبنية على السكون
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، والجملة في محل نصب مقول القول
  - نعت مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة تفسيرية لا محل لها
  - الواو حرف عطف، و«نحيا» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - الواو حرف عطف، و«ما» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، و«نا» ضمير متصل مبني على السكون في محل نصب مفعول به مقدم
  - أداة حصر مبنية على السكون
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة
