text: سَمَّى الْعَجُوزُ قَارِبَهُ «النَّوْرَسَ»
irab:
  - فعل ماضٍ ينصب مفعولين مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة الظاهرة
