text: يَقْضِي عُمَّالُ الْمَنَاجِمِ سَاعَاتٍ طَوِيلَةً تَحْتَ الْأَرْضِ دُونَ أَنْ يَرَوُا الشَّمْسَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - ظرف مكان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، وحُرّكت بالضم لالتقاء الساكنين، والمصدر المؤول في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
