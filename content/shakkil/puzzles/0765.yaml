text: طَلَبَ الْمُدَرِّبُ مِنْ أَعْضَاءِ الْفَرِيقِ أَنْ يَنَامُوا مُبَكِّرًا لَيْلَةَ الْمُبَارَاةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب مفعول به
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
