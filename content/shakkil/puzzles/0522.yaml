text: اسْتَقْبَلَ أَهْلُ الْبَلْدَةِ الضُّيُوفَ اسْتِقْبَالًا كَرِيمًا، وَقَدَّمُوا لَهُمُ الْقَهْوَةَ وَالتَّمْرَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«قدّموا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وحُرّك بالضم لالتقاء الساكنين
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«التمر» معطوف منصوب وعلامة نصبه الفتحة الظاهرة
