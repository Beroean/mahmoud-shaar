text: لَوْ تَزَيَّلُوا لَعَذَّبْنَا الَّذِينَ كَفَرُوا مِنْهُمْ عَذَابًا أَلِيمًا
irab:
  - حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة فعل الشرط لا محل لها
  - اللام واقعة في جواب «لو»، و«عذّب» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
  - اسم موصول مبني على الفتح في محل نصب مفعول به
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - «من» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال من فاعل «كفروا»
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
context: لو تميّز المؤمنون المستضعفون بمكة من الكفار
source: quran
level: 3
ref: سورة الفتح، الآية ٢٥
