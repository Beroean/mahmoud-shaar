text: احْفَظِ الْخُبْزَ فِي كِيسٍ مُغْلَقٍ كَيْ يَبْقَى طَرِيًّا أَيَّامًا
irab:
  - فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع ناقص منصوب بـ«كي» وعلامة نصبه الفتحة المقدرة على الألف للتعذر، واسمه ضمير مستتر تقديره هو
  - خبر «يبقى» منصوب وعلامة نصبه تنوين الفتح
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
