text: إِذَا شَعَرْتَ بِالتَّعَبِ فَخُذْ قِسْطًا مِنَ الرَّاحَةِ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة في محل جر بالإضافة
  - الباء حرف جر، و«التعب» اسم مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، و«خذ» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة جواب شرط غير جازم لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - شعرت
