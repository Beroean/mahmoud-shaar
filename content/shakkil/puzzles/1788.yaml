text: وَسَوْفَ يَعْلَمُونَ حِينَ يَرَوْنَ الْعَذَابَ مَنْ أَضَلُّ سَبِيلًا
irab:
  - الواو استئنافية، و«سوف» حرف تسويف واستقبال مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - ظرف زمان منصوب وعلامة نصبه الفتحة متعلق بـ«يعلمون»، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة
  - اسم استفهام مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)، والجملة سدّت مسدّ مفعولي «يعلمون»
  - تمييز منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الحديث عن المشركين المستهزئين بالنبي ﷺ
source: quran
level: 3
ref: سورة الفرقان، الآية ٤٢
