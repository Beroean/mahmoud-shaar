text: إِخْوَانُكُمْ خَوَلُكُمْ، جَعَلَهُمُ اللَّهُ تَحْتَ أَيْدِيكُمْ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، و«هم» ضمير متصل مبني على السكون، وحُرّك بالضم لالتقاء الساكنين، في محل نصب مفعول به أول مقدم
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل نصب مفعول به ثانٍ
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٣٠
