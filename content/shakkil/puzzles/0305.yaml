text: مُنِحَتِ الْبَاحِثَةُ جَائِزَةً كُبْرَى تَقْدِيرًا لِاكْتِشَافِهَا الْعِلْمِيِّ الْمُهِمِّ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر لأنه اسم مقصور
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«اكتشاف» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - نعت ثانٍ مجرور وعلامة جره الكسرة الظاهرة
