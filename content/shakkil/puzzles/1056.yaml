text: أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اسم استفهام مبني على الفتح في محل نصب حال
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«عاد» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«فعل»
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 3
ref: سورة الفجر، الآية ٦
