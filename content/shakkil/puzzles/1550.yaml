text: وَلَقَدْ نَجَّيْنَا بَنِي إِسْرَائِيلَ مِنَ الْعَذَابِ الْمُهِينِ
irab:
  - الواو استئنافية، واللام واقعة في جواب قسم مقدّر، و«قد» حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والعجمة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«نجّينا»
  - نعت مجرور وعلامة جره الكسرة
alts: []
source: quran
level: 3
ref: سورة الدخان، الآية ٣٠
