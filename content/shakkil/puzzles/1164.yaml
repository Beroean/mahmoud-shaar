text: كَمْ عَاصِفَةٍ مَرَّتْ بِالْقَرْيَةِ!
irab:
  - «كم» الخبرية اسم مبني على السكون في محل رفع مبتدأ
  - تمييز «كم» الخبرية مجرور بالإضافة وعلامة جره تنوين الكسر
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - الباء حرف جر، و«القرية» اسم مجرور وعلامة جره الكسرة الظاهرة
