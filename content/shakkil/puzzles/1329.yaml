text: إِنَّ أَبْغَضَ الرِّجَالِ إِلَى اللَّهِ الْأَلَدُّ الْخَصِمُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، وهو اسم تفضيل
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - لفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أبغض»
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٢٤٥٧
