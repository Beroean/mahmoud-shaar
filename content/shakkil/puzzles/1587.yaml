text: لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنِ الْوَاصِلُ الَّذِي إِذَا قَطَعَتْ رَحِمُهُ وَصَلَهَا
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر زائد، و«المكافئ» اسم مجرور لفظًا منصوب محلًّا خبر «ليس»
  - الواو حرف عطف، و«لكنْ» حرف استدراك مخفف مهمل مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل رفع خبر
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل في محل نصب مفعول به، والجملة جواب «إذا» لا محل لها، والجملة كلها صلة الموصول
alts:
  - لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنِ الْوَاصِلُ الَّذِي إِذَا قُطِعَتْ رَحِمُهُ وَصَلَهَا
  - لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنَّ الْوَاصِلَ الَّذِي إِذَا قَطَعَتْ رَحِمُهُ وَصَلَهَا
  - لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنَّ الْوَاصِلَ الَّذِي إِذَا قُطِعَتْ رَحِمُهُ وَصَلَهَا
source: hadith
ref: صحيح البخاري، الحديث ٥٩٩١
