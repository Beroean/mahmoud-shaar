text: مَا حَكَّ جِلْدَكَ مِثْلُ ظُفْرِكَ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - مفعول به مقدّم منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
