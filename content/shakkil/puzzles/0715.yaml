text: لَوْ أَسْرَعْنَا قَلِيلًا لَلَحِقْنَا بِالْقِطَارِ
irab:
  - حرف شرط غير جازم (امتناع لامتناع) مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع فاعل، والجملة فعل الشرط لا محل لها
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح (صفة لمصدر محذوف)
  - اللام واقعة في جواب «لو»، و«لحق» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
  - الباء حرف جر، و«القطار» اسم مجرور وعلامة جره الكسرة الظاهرة
