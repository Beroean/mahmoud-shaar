text: اجْتَمَعَ الْأَعْضَاءُ فِي نَادٍ رِيَاضِيٍّ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة لالتقاء الساكنين، منع من ظهورها الثقل
  - نعت مجرور وعلامة جره تنوين الكسر
