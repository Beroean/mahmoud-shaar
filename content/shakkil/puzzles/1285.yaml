text: تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة
  - فاعل مرفوع وعلامة رفعه الألف لأنه مثنى، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«تبّ» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
alts: []
source: quran
level: 2
ref: سورة المسد، الآية ١
