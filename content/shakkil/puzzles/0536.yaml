text: وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا
irab:
  - الواو حرف عطف، و«جاء» فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«الملك» معطوف مرفوع وعلامة رفعه الضمة
  - حال منصوب وعلامة نصبه تنوين الفتح
  - لفظ مكرر للترتيب (صفًّا بعد صفّ) منصوب وعلامة نصبه تنوين الفتح
