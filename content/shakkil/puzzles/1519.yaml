text: يَا رُوَّادَ الْمَكْتَبَةِ، أَعِيدُوا الْكُتُبَ إِلَى رُفُوفِهَا بَعْدَ الْقِرَاءَةِ
irab:
  - حرف نداء مبني على السكون
  - منادى مضاف منصوب وعلامة نصبه الفتحة الظاهرة
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
