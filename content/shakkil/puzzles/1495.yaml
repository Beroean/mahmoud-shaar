text: تُبْنَى الْأَعْشَاشُ فِي أَعَالِي الْأَشْجَارِ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
