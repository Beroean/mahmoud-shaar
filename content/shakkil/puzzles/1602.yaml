text: وَإِنِّي لَتَعْرُونِي لِذِكْرَاكِ هِزَّةٌ كَمَا انْتَفَضَ الْعُصْفُورُ بَلَّلَهُ الْقَطْرُ
irab:
  - الواو بحسب ما قبلها، و«إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - اللام المزحلقة، و«تعرو» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر «إنّ»
  - اللام حرف جر للتعليل، و«ذكرى» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف، والكاف ضمير متصل مبني على الكسر في محل جر مضاف إليه
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
  - الكاف حرف جر، و«ما» حرف مصدري مبني على السكون، والمصدر المؤول في محل جر بالكاف، وشبه الجملة متعلق بمحذوف نعت لـ«هزة»
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به مقدم، والجملة في محل نصب حال من «العصفور»
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
