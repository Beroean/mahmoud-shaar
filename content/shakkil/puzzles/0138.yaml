text: مَتَى يُعْلِنُونَ وَفَاةَ الْعَرَبِ؟
irab:
  - اسم استفهام مبني على السكون في محل نصب ظرف زمان
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
author: نزار قباني
source: poetry
level: 2
ref: متى يعلنون وفاة العرب؟
