text: وَالنَّاسُ أَلْفٌ مِنْهُمُ كَوَاحِدٍ وَوَاحِدٌ كَالْأَلْفِ إِنْ أَمْرٌ عَنَا
irab:
  - الواو استئنافية، و«الناس» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - مبتدأ ثانٍ مرفوع وعلامة رفعه تنوين الضم، وسوّغ الابتداء به وصفه بشبه الجملة بعده
  - «من» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وحُرّك بالضم للوزن، وشبه الجملة متعلق بمحذوف نعت لـ«ألف»
  - الكاف حرف جر، و«واحد» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر المبتدأ الثاني، والجملة في محل رفع خبر «الناس»
  - الواو حرف عطف، و«واحد» مبتدأ مرفوع وعلامة رفعه تنوين الضم
  - الكاف حرف جر، و«الألف» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «واحد»
  - حرف شرط جازم مبني على السكون، وجواب الشرط محذوف دلّ عليه ما قبله
  - فاعل لفعل محذوف يفسره المذكور مرفوع وعلامة رفعه تنوين الضم، والتقدير «إن عنا أمرٌ»
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة تفسيرية لا محل لها
alts: []
vary:
  - - مِنْهُمُ
    - مِنْهُمْ
author: ابن دريد
source: poetry
level: 3
ref: المقصورة
