text: نَحْنُ الْمُهَنْدِسِينَ نُحِبُّ الدِّقَّةَ
irab:
  - ضمير منفصل مبني على الضم في محل رفع مبتدأ
  - مفعول به منصوب على الاختصاص لفعل محذوف تقديره أخصّ، وعلامة نصبه الياء لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
