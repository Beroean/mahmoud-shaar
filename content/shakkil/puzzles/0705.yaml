text: مَرَرْنَا بِحَدَائِقَ غَنَّاءَ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«حدائق» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (ألف التأنيث الممدودة)
