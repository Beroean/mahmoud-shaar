text: يَتَكَوَّنُ الْمِلْحُ فِي أَحْوَاضٍ وَاسِعَةٍ حِينَ تُبَخِّرُ الشَّمْسُ مِيَاهَ الْبَحْرِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - ظرف زمان منصوب وعلامة نصبه الفتحة (معرب لإضافته إلى جملة صدرها مضارع)، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
