text: لِكُلِّ دَاءٍ دَوَاءٌ يُسْتَطَبُّ بِهِ
irab:
  - اللام حرف جر، و«كل» اسم مجرور وهو مضاف، وشبه الجملة في محل رفع خبر مقدّم
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، والجملة في محل رفع نعت لـ«دواء»
  - الباء حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة في محل رفع نائب فاعل
alts: []
author: المتنبي
source: poetry
