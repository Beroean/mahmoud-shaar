text: شَرَعَتِ الْخَيَّاطَةُ تَقُصُّ الْقُمَاشَ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «شرع» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «شرع»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
