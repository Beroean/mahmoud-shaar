text: وَنَشْرَبُ إِنْ وَرَدْنَا الْمَاءَ صَفْوًا وَيَشْرَبُ غَيْرُنَا كَدِرًا وَطِينَا
irab:
  - الواو حرف عطف، و«نشرب» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره نحن
  - حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين في محل جزم فعل الشرط، و«نا» ضمير متصل في محل رفع فاعل، وجواب الشرط محذوف دلّ عليه ما قبله
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به لـ«نشرب» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«يشرب» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«طينا» معطوف منصوب وعلامة نصبه الفتحة، والألف للإطلاق
alts: []
vary:
  - - وَطِينَا
    - وَطِينًا
author: عمرو بن كلثوم
source: poetry
level: 3
ref: المعلقة
