text: نَصَحَ الطَّبِيبُ الْمَرِيضَ بِأَنْ يُقَلِّلَ مِنَ الْمِلْحِ وَيَمْشِيَ نِصْفَ سَاعَةٍ يَوْمِيًّا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«أن» حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر بالباء
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«يمشي» فعل مضارع معطوف منصوب وعلامة نصبه الفتحة الظاهرة على الياء
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حال منصوب وعلامة نصبه تنوين الفتح
