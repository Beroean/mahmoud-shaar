text: إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ أَشَدُّ وَطْئًا وَأَقْوَمُ قِيلًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر «هي» مرفوع وعلامة رفعه الضمة، ولم يُنوَّن لأنه ممنوع من الصرف على وزن «أفعل»، والجملة في محل رفع خبر «إنّ»
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«أقوم» معطوف على «أشد» مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف
  - تمييز منصوب وعلامة نصبه تنوين الفتح
