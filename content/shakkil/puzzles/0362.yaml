text: رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ
irab:
  - منادى بأداة نداء محذوفة منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - فعل دعاء بصيغة الأمر مبني على حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«نا» ضمير متصل في محل نصب مفعول به أول
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«في» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - معطوف على «حسنة» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«قِ» فعل دعاء بصيغة الأمر مبني على حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت، و«نا» ضمير متصل في محل نصب مفعول به أول
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
