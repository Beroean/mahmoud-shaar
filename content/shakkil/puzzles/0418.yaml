text: ضَحِكَ الْجُمْهُورُ ضَحِكًا طَوِيلًا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts:
  - ضَحِكَ الْجُمْهُورُ ضِحْكًا طَوِيلًا
  - ضَحِكَ الْجُمْهُورُ ضَحْكًا طَوِيلًا
source: llm-reviewed
