text: كَانَتِ الْقَوَافِلُ قَدِيمًا تَقْطَعُ الصَّحْرَاءَ فِي أَسَابِيعَ طَوِيلَةٍ
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «كان»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مجرور وعلامة جره تنوين الكسر
