text: أَيَّتُهَا الْمُمَرِّضَةُ، رِفْقًا بِالْمَرِيضِ
irab:
  - منادى بحرف نداء محذوف، نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّة» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
  - مفعول مطلق منصوب لفعل محذوف تقديره ارفُقي، وعلامة نصبه تنوين الفتح
  - الباء حرف جر، و«المريض» اسم مجرور وعلامة جره الكسرة الظاهرة
