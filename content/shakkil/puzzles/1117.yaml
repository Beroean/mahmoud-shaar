text: يَقُولُ خُبَرَاءُ التَّغْذِيَةِ إِنَّ الْمُكَسَّرَاتِ مُفِيدَةٌ لِلْقَلْبِ إِذَا أُكِلَتْ بِاعْتِدَالٍ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف توكيد ونصب مبني على الفتح، كُسرت همزته لوقوعه بعد القول، والجملة في محل نصب مقول القول
  - اسم «إنّ» منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - اللام حرف جر، و«القلب» اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل جر بالإضافة
  - الباء حرف جر، و«اعتدال» اسم مجرور وعلامة جره تنوين الكسر
