text: سَئِمْتُ تَكَالِيفَ الْحَيَاةِ وَمَنْ يَعِشْ ثَمَانِينَ حَوْلًا لَا أَبَا لَكَ يَسْأَمِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو استئنافية، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - ظرف زمان منصوب (اسم العدد نائب عن الظرف) وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - نافية للجنس مبنية على السكون
  - اسم «لا» النافية للجنس منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة (على تقدير الإضافة، واللام مقحمة)
  - اللام حرف جر، والكاف ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»، والجملة اعتراضية لا محل لها
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، وحُرِّك بالكسر للقافية، والفاعل ضمير مستتر تقديره هو
