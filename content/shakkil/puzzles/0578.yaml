text: إِيَّاكُمْ وَالظَّنَّ، فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ
irab:
  - ضمير منفصل مبني على السكون في محل نصب مفعول به لفعل محذوف تقديره «احذروا» على التحذير
  - الواو حرف عطف، و«الظنّ» معطوف منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء حرف تعليل، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة الظاهرة، وهو اسم تفضيل مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٠٦٦
