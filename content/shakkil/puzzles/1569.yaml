text: اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ
irab:
  - فعل أمر مبني على حذف النون، وواو الجماعة ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو اسم عدد معرَّف بـ«أل»
  - نعت منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٢٧٦٦
