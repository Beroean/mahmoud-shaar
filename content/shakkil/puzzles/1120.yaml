text: لَعَلَّ الْإِسْكَافِيَّ يُصْلِحُ الْحِذَاءَ
irab:
  - حرف ترجٍّ ونصب مبني على الفتح
  - اسم «لعلّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «لعلّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
