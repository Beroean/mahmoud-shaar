text: فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمْ آثِمًا أَوْ كَفُورًا
irab:
  - الفاء الفصيحة، و«اصبر» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«حكم» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«اصبر»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - «من» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بحال من «آثمًا» قُدّمت عليه
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف عطف مبني على السكون
  - اسم معطوف منصوب وعلامة نصبه تنوين الفتح
