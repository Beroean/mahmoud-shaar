text: يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ
irab:
  - حرف نداء مبني على السكون
  - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - «على» حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر، وحُرّك بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«كُتب»
  - نائب فاعل مرفوع وعلامة رفعه الضمة
alts: []
source: quran
level: 3
ref: سورة البقرة، الآية ١٨٣
