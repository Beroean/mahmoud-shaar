text: نَالَتِ الْعَدَّاءَةُ الْمِيدَالِيَّةَ الذَّهَبِيَّةَ بَعْدَ أَنْ تَغَلَّبَتْ عَلَى ثَلَاثِينَ مُنَافِسَةً
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري مبني على السكون، والمصدر المؤول في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون، والفاعل ضمير مستتر تقديره هي
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وهو من ألفاظ العدد
  - تمييز منصوب وعلامة نصبه تنوين الفتح
