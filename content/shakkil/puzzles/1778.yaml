text: ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ
irab:
  - حرف عطف مبني على الفتح
  - اللام واقعة في جواب قسم محذوف، و«ترونّ» فعل مضارع مرفوع وعلامة رفعه ثبوت النون المحذوفة لتوالي الأمثال، والواو ضمير متصل في محل رفع فاعل، والنون للتوكيد حرف مبني على الفتح، و«ها» ضمير متصل مبني على السكون في محل نصب مفعول به
  - مفعول مطلق منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: الخطاب للذين ألهاهم التكاثر، والضمير للجحيم
source: quran
level: 2
ref: سورة التكاثر، الآية ٧
