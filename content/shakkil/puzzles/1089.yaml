text: إِنَّ اللَّهَ لَيَرْضَى عَنِ الْعَبْدِ أَنْ يَأْكُلَ الْأَكْلَةَ فَيَحْمَدَهُ عَلَيْهَا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - اللام المزحلقة للتوكيد، و«يرضى» فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«يرضى»
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول مجرور بحرف جر مقدّر، أي لِأَنْ يأكل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الفاء حرف عطف، و«يحمد» فعل مضارع معطوف على «يأكل» منصوب وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به
  - «على» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يحمد»
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢٧٣٤
