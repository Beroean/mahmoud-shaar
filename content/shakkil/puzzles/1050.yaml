text: لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا تَأْثِيمًا
irab:
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل
  - «في» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«يسمعون»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - معطوف على «لغوًا» منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الحديث عن السابقين في الجنة
source: quran
ref: سورة الواقعة، الآية ٢٥
