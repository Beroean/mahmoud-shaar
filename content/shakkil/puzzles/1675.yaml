text: وَصَلَ الْمَدْعُوُّونَ غَيْرَ اثْنَيْنِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - «غير» اسم منصوب على الاستثناء وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بالمثنى، وهو المستثنى في المعنى
