text: اسْتَيْقَظَتْ لَيْلَى نَشِيطَةً فَسَقَتْ أَزْهَارَ الشُّرْفَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - الفاء حرف عطف، و«سقت» فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة، والتاء للتأنيث
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
