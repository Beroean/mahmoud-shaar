text: أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ تَعَالَى أَدْوَمُهَا وَإِنْ قَلَّ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو اسم تفضيل مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - لفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أحبّ»
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة اعتراضية لا محل لها
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - الواو حالية، و«إنْ» حرف شرط جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو، وجواب الشرط محذوف دل عليه ما قبله
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٧٨٣
