text: إِيَّاكُمْ وَالسِّبَاحَةَ بَعْدَ الْأَكْلِ
irab:
  - «إيّا» ضمير منفصل مبني على السكون في محل نصب مفعول به لفعل محذوف تقديره أحذّر، و«كم» حرف خطاب (تحذير)
  - الواو عاطفة، و«السباحة» مفعول به منصوب لفعل محذوف تقديره احذروا، وعلامة نصبه الفتحة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
