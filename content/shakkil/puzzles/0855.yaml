text: هِيَ الْأُمُورُ كَمَا شَاهَدْتَهَا دُوَلٌ مَنْ سَرَّهُ زَمَنٌ سَاءَتْهُ أَزْمَانُ
irab:
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - الكاف حرف جر، و«ما» حرف مصدري، والمصدر المؤول مجرور بالكاف، وشبه الجملة متعلق بمحذوف حال
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به
  - خبر ثانٍ مرفوع وعلامة رفعه تنوين الضم
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - فاعل مؤخر مرفوع وعلامة رفعه تنوين الضم
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والتاء للتأنيث، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
vary:
  - - شَاهَدْتَهَا
    - شَاهَدْتُهَا
author: أبو البقاء الرندي
source: poetry
level: 3
ref: رثاء الأندلس (النونية)
