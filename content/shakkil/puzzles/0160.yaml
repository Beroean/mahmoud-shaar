text: اعْتِيَادِي عَلَى غِيَابِكِ صَعْبٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون المقدر على الألف
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والكاف ضمير متصل مبني على الكسر في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
author: نزار قباني
