text: عَسَى الْكَرْبُ الَّذِي أَمْسَيْتُ فِيهِ يَكُونُ وَرَاءَهُ فَرَجٌ قَرِيبُ
irab:
  - فعل ماضٍ ناقص جامد من أفعال الرجاء مبني على الفتح المقدر على الألف للتعذر
  - اسم «عسى» مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم موصول مبني على السكون في محل رفع نعت لـ«الكرب»
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «أمسى»
  - «في» حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «أمسى»، والجملة صلة الموصول لا محل لها
  - فعل مضارع ناقص مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف خبر «يكون» مقدم
  - اسم «يكون» مؤخر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «يكون وراءه فرج» في محل نصب خبر «عسى»، وتجرّد الخبر من «أن» وهو قليل
alts: []
vary:
  - - أَمْسَيْتُ
    - أَمْسَيْتَ
author: هدبة بن الخشرم
source: poetry
level: 2
ref: «طربت وأنت أحيانا طروب»
