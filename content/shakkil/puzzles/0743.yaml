text: أَتَمَّ الْعُمَّالُ الْبِنَاءَ مَا عَدَا السَّقْفَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف مصدري مبني على السكون
  - فعل ماضٍ جامد للاستثناء مبني على الفتح المقدر، والفاعل ضمير مستتر وجوبًا
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو المستثنى في المعنى
