text: يَا لَيْتَنِي تَعَلَّمْتُ الْعَزْفَ صَغِيرًا
irab:
  - حرف تنبيه مبني على السكون
  - حرف تمنٍّ ونصب مبني على الفتح، والنون للوقاية، والياء ضمير متصل مبني على السكون في محل نصب اسم «ليت»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والجملة في محل رفع خبر «ليت»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
alts: []
fixed:
  - ليتني
  - تعلمت
source: llm-reviewed
