text: إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا
irab:
  - «إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - نافية مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
