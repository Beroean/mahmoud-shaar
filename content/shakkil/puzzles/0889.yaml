text: وَإِنَّ الَّذِي بَيْنِي وَبَيْنَ بَنِي أَبِي وَبَيْنَ بَنِي عَمِّي لَمُخْتَلِفٌ جِدَّا
irab:
  - الواو استئنافية، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على السكون في محل نصب اسم «إنّ»
  - ظرف مكان منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف صلة الموصول
  - الواو حرف عطف، و«بين» ظرف معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«بين» ظرف معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وحُذفت النون للإضافة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - اللام المزحلقة حرف توكيد، و«مختلف» خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - مفعول مطلق منصوب وعلامة نصبه الفتحة، والألف للإطلاق
