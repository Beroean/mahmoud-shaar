text: هٰذِهِ دَرَّاجَةٌ أَخَفُّ مِنْ تِلْكَ
irab:
  - اسم إشارة مبني على الكسر في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (اسم تفضيل على وزن «أفعل»)
  - حرف جر مبني على السكون
  - اسم إشارة مبني على الفتح في محل جر
