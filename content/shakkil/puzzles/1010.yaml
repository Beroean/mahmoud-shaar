text: لَيْتَ الْمُدُنَ الْكَبِيرَةَ تَحْتَفِظُ بِحَدَائِقِهَا كَمَا تَحْتَفِظُ بِمَبَانِيهَا الشَّاهِقَةِ
irab:
  - حرف تمنٍّ ونصب مبني على الفتح
  - اسم «ليت» منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «ليت»
  - الباء حرف جر، و«حدائق» اسم مجرور وعلامة جره الكسرة الظاهرة (جُرّ بالكسرة لأنه مضاف)، و«ها» ضمير متصل في محل جر مضاف إليه
  - الكاف حرف جر، و«ما» حرف مصدري مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول من «ما» والفعل في محل جر بالكاف
  - الباء حرف جر، و«مباني» اسم مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - نعت مجرور وعلامة جره الكسرة الظاهرة
