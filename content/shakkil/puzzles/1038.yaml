text: كُلُّ نَفْسٍ بِمَا كَسَبَتْ رَهِينَةٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«رهينة»
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والفاعل ضمير مستتر تقديره هي، والجملة صلة الموصول لا محل لها
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
source: quran
ref: سورة المدثر، الآية ٣٨
