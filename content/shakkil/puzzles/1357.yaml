text: يَقُولُونَ لِي فِيكَ انْقِبَاضٌ وَإِنَّمَا رَأَوْا رَجُلًا عَنْ مَوْقِفِ الذُّلِّ أَحْجَمَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - اللام حرف جر، والياء ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يقولون»
  - «في» حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب مقول القول
  - الواو حالية، و«إنّما» أداة حصر لا عمل لها
  - فعل ماضٍ مبني على الضم المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«أحجم»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الفتح، والألف للإطلاق، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب نعت لـ«رجلًا»
