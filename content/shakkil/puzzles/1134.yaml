text: قَدْ فَرَضَ اللَّهُ لَكُمْ تَحِلَّةَ أَيْمَانِكُمْ
irab:
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - اللام حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«فرض»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
alts: []
context: الله تعالى يخاطب المؤمنين
source: quran
level: 2
ref: سورة التحريم، الآية ٢
