text: لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا
irab:
  - ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - «مع» ظرف مكان منصوب وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة في محل رفع خبر «إنّ»
alts: []
source: quran
level: 2
ref: سورة التوبة، الآية ٤٠
