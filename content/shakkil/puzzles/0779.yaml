text: إِنَّ إِلَيْنَا إِيَابَهُمْ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - «إلى» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة في محل رفع خبر «إنّ» مقدّم
  - اسم «إنّ» مؤخر منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
alts: []
source: quran
ref: سورة الغاشية، الآية ٢٥
