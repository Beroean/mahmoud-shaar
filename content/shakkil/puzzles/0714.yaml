text: إِذَا حَلَّ الْخَرِيفُ تَسَاقَطَ وَرَقُ الشَّجَرِ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة فعل الشرط في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والجملة جواب الشرط لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
