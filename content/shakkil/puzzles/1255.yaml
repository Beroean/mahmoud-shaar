text: كُلَّمَا ازْدَادَ الطَّلَبُ عَلَى الْقَمْحِ ارْتَفَعَ سِعْرُ الْخُبْزِ فِي الْأَسْوَاقِ
irab:
  - «كلّ» ظرف زمان متضمن معنى الشرط منصوب وعلامة نصبه الفتحة، و«ما» مصدرية ظرفية
  - فعل ماضٍ مبني على الفتح، وهو فعل الشرط
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الفتح، وهو جواب الشرط
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
