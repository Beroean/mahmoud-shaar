text: فِي السَّنَةِ اثْنَا عَشَرَ شَهْرًا
irab:
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الألف لأنه ملحق بالمثنى، وهو الجزء الأول من العدد المركب
  - الجزء الثاني من العدد المركب مبني على الفتح لا محل له من الإعراب
  - تمييز منصوب وعلامة نصبه تنوين الفتح
