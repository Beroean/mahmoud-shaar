text: وَلِلْحُرِّيَّةِ الْحَمْرَاءِ بَابٌ بِكُلِّ يَدٍ مُضَرَّجَةٍ يُدَقُّ
irab:
  - الواو استئنافية، واللام حرف جر، و«الحرية» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - نعت مجرور وعلامة جره الكسرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لأنه معرّف بـ«ال»
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - الباء حرف جر، و«كل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«يُدَقّ»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل رفع نعت لـ«باب»
alts: []
author: أحمد شوقي
source: poetry
level: 3
ref: دمشق («سلامٌ من صَبا بَرَدى أرقّ»)
