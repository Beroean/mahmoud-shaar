text: إِنَّ لِلَّهِ تِسْعَةً وَتِسْعِينَ اسْمًا مِائَةً إِلَّا وَاحِدًا، مَنْ أَحْصَاهَا دَخَلَ الْجَنَّةَ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح، وهو من ألفاظ العدد
  - الواو حرف عطف، و«تسعين» معطوف منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - بدل من «تسعة وتسعين» منصوب وعلامة نصبه تنوين الفتح
  - أداة استثناء مبنية على السكون
  - مستثنى بـ«إلا» منصوب وعلامة نصبه تنوين الفتح
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو، و«ها» ضمير متصل في محل نصب مفعول به
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب على التوسع وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٧٣٩٢
