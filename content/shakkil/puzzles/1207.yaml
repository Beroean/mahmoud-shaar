text: تَجُولُ الْخُيُولُ فِي مَرْعًى أَخْضَرَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (الوصفية ووزن الفعل)
