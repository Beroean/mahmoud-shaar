text: كَانَ الْمَطَرُ هٰذَا الْعَامَ أَغْزَرَ مِنْهُ فِي الْأَعْوَامِ الْعَشَرَةِ الْمَاضِيَةِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم إشارة مبني على السكون في محل نصب ظرف زمان
  - بدل من اسم الإشارة منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «كان» منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (للوصفية ووزن الفعل)
  - «من» حرف جر، والهاء ضمير متصل مبني على الضم في محل جر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة (العدد نعتًا)
  - نعت مجرور وعلامة جره الكسرة الظاهرة
