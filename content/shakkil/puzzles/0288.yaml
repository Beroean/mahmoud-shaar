text: تَدَرَّبَ السَّبَّاحُ كُلَّ يَوْمٍ كَيْ يَفُوزَ بِالسِّبَاقِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«كي» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«السباق» اسم مجرور وعلامة جره الكسرة الظاهرة
