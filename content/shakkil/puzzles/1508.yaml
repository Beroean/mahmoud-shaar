text: ظَنَّ السُّيَّاحُ الرِّحْلَةَ قَصِيرَةً، فَإِذَا هِيَ تَسْتَغْرِقُ يَوْمًا كَامِلًا
irab:
  - فعل ماضٍ من أفعال القلوب ينصب مفعولين مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الفاء حرف عطف، و«إذا» الفجائية حرف مبني على السكون
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
