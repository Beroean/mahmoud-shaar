text: لَيْسَ النَّجَاحُ ضَرْبَةَ حَظٍّ، بَلْ هُوَ ثَمَرَةُ عَمَلٍ طَوِيلٍ
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «ليس» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف إضراب وابتداء مبني على السكون (لا يعطف لأن بعده جملة)
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
