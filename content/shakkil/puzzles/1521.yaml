text: أَوْشَكَ الْبَاحِثُونَ أَنْ يَكْتَشِفُوا عِلَاجًا لِهٰذَا الْمَرَضِ النَّادِرِ
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح
  - اسم «أوشك» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب خبر «أوشك»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«هذا» اسم إشارة مبني على السكون في محل جر
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
