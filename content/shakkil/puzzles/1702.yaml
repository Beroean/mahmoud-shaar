text: تَوَقَّفَتِ السَّاعَاتُ مَا خَلَا سَاعَةَ الْحَائِطِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري مبني على السكون
  - فعل ماضٍ جامد يفيد الاستثناء مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر وجوبًا
  - مستثنى بـ«ما خلا» مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
