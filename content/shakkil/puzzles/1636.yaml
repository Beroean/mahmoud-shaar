text: فِي كُلِّ ذَاتِ كَبِدٍ رَطْبَةٍ أَجْرٌ
irab:
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٦٠٠٩
