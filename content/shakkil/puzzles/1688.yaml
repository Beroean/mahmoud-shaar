text: لَوْ هَدَأَتِ الرِّيحُ لَأَبْحَرْنَا
irab:
  - حرف شرط غير جازم مبني على السكون
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين، والجملة فعل الشرط لا محل لها
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام واقعة في جواب «لو»، و«أبحرنا» فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
