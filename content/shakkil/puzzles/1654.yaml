text: اشْتَرَى الصَّيْدَلِيُّ مَوَازِينَ دَقِيقَةً
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة دون تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت منصوب وعلامة نصبه تنوين الفتح
