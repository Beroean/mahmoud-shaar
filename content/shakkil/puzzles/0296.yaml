text: قَطَعَ الدَّرَّاجُونَ أَرْبَعَةَ عَشَرَ كِيلُومِتْرًا قَبْلَ أَنْ يَسْتَرِيحُوا قَلِيلًا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - «أربعة عشر» عدد مركب مبني على فتح الجزأين في محل نصب مفعول به
  - الجزء الثاني من العدد المركب، مبني على الفتح
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل جر مضاف إليه
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح (أي زمنًا قليلًا)
