text: إِنْ تَسْعَ تَصِلْ
irab:
  - حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف حرف العلة (الألف)، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
