text: مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - «على» حرف جر، والياء ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«كذب»
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يتبوّأ» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو، والجملة في محل جزم جواب الشرط
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«يتبوّأ»
