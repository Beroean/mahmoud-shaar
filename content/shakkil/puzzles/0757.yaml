text: تَعَلَّمَتْ جَدَّتِي الْقِرَاءَةَ وَهِيَ فِي السِّتِّينَ، فَمَا أَعْظَمَ إِرَادَتَهَا!
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث حرف مبني على السكون
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو واو الحال، و«هي» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه ملحق بجمع المذكر السالم، وشبه الجملة متعلق بمحذوف خبر، والجملة الاسمية في محل نصب حال
  - الفاء استئنافية، و«ما» التعجبية نكرة تامة مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
