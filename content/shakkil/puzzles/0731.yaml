text: اسْتَشَارَتِ الْعَرُوسُ حَمَاهَا فِي تَأْثِيثِ الْبَيْتِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
