text: قُلْ يَجْمَعُ بَيْنَنَا رَبُّنَا ثُمَّ يَفْتَحُ بَيْنَنَا بِالْحَقِّ وَهُوَ الْفَتَّاحُ الْعَلِيمُ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل نصب مقول القول
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يجمع»
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يفتح»
  - الباء حرف جر، و«الحق» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يفتح»
  - الواو حالية، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة
  - خبر ثانٍ مرفوع وعلامة رفعه الضمة
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 3
ref: سورة سبأ، الآية ٢٦
