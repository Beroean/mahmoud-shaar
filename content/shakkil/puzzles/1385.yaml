text: الْمُسْتَبَّانِ مَا قَالَا فَعَلَى الْبَادِئِ مَا لَمْ يَعْتَدِ الْمَظْلُومُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى
  - اسم موصول مبني على السكون في محل رفع مبتدأ ثانٍ (أي إثمُ ما قالاه)
  - فعل ماضٍ مبني على الفتح، وألف الاثنين ضمير متصل مبني على السكون في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الفاء واقعة في خبر الموصول لما فيه من معنى الشرط، و«على» حرف جر، وشبه الجملة متعلق بمحذوف خبر المبتدأ الثاني، والجملة خبر «المستبان»
  - اسم مجرور بـ«على» وعلامة جره الكسرة الظاهرة
  - حرف مصدري ظرفي مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الياء)، والكسرة قبلها دليل عليها، والمصدر المؤول في محل نصب ظرف زمان
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢٥٨٧
