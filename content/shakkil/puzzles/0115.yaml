text: إِنَّ اللَّهَ مَعَ الصَّابِرِينَ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «إنّ» منصوب وعلامة نصبه الفتحة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل رفع خبر «إنّ»
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
alts: []
source: quran
level: 2
ref: سورة البقرة، الآية ١٥٣
