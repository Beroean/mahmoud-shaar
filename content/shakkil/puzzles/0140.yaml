text: الْإِنْسَانُ فِي نِهَايَةِ الْأَمْرِ قَضِيَّةٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة معترضة
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
author: غسان كنفاني
source: literature
level: 2
ref: عائد إلى حيفا
