text: بِيضٌ صَنَائِعُنَا سُودٌ وَقَائِعُنَا خُضْرٌ مَرَابِعُنَا حُمْرٌ مَوَاضِينَا
irab:
  - خبر مقدم مرفوع وعلامة رفعه تنوين الضم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - خبر مقدم مرفوع وعلامة رفعه تنوين الضم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - خبر مقدم مرفوع وعلامة رفعه تنوين الضم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - خبر مقدم مرفوع وعلامة رفعه تنوين الضم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
