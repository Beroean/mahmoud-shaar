text: لَيْسَ مِنَ الْحِكْمَةِ أَنْ تَقُودَ السَّيَّارَةَ وَأَنْتَ مُتْعَبٌ
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل رفع اسم «ليس» مؤخر
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حالية، و«أنت» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب حال
alts: []
fixed:
  - وأنت
