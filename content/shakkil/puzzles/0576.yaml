text: لَا حَسَدَ إِلَّا فِي اثْنَتَيْنِ
irab:
  - حرف نفي للجنس مبني على السكون، يعمل عمل «إنّ»
  - اسم «لا» النافية للجنس مبني على الفتح في محل نصب
  - حرف استثناء ملغًى (أداة حصر) مبني على السكون
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه ملحق بالمثنى، وشبه الجملة متعلق بمحذوف خبر «لا»
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٧٣
