text: يَمْتَدُّ الْوَادِي بَيْنَ جَبَلَيْنِ شَاهِقَيْنِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل (اسم منقوص)
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه مثنى
  - نعت مجرور وعلامة جره الياء لأنه مثنى
