text: أَحَبُّ الْبِلَادِ إِلَى اللَّهِ مَسَاجِدُهَا، وَأَبْغَضُ الْبِلَادِ إِلَى اللَّهِ أَسْوَاقُهَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - لفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أحب»
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«أبغض» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - لفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«أبغض»
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
