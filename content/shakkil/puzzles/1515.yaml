text: مَا أَصْعَبَ أَنْ يَعْمَلَ الْبَنَّاؤُونَ تَحْتَ الشَّمْسِ فِي قَيْظِ الصَّيْفِ!
irab:
  - «ما» تعجبية نكرة تامة مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
