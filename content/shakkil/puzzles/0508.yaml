text: تَسْبَحُ عَمَّتِي نِصْفَ سَاعَةٍ كُلَّ صَبَاحٍ كَيْ تُحَافِظَ عَلَى لِيَاقَتِهَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة لإضافته إلى الزمان، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - ظرف زمان منصوب وعلامة نصبه الفتحة لإضافته إلى الزمان، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«كي» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
