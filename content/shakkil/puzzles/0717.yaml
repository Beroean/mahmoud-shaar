text: أَمَّا أَخِي فَيُفَضِّلُ الْقَهْوَةَ الْمُرَّةَ
irab:
  - حرف شرط وتفصيل وتوكيد مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء واقعة في جواب «أمّا»، و«يفضّل» فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
