text: إِنَّمَا يَتَعَلَّمُ الْخَطَّاطُ بِالْمِرَانِ وَالصَّبْرِ
irab:
  - «إنما» أداة حصر، «إنّ» حرف توكيد مكفوف و«ما» كافة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«المران» اسم مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الصبر» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة
