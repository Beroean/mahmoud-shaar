text: أَزْهَرَتِ الْأَشْجَارُ عَدَا شَجَرَةٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر للاستثناء مبني على السكون (ويجوز أن يكون فعلًا ماضيًا جامدًا)
  - مستثنى مجرور بـ«عدا» وعلامة جره تنوين الكسر (أو مفعول به منصوب إن كانت «عدا» فعلًا)
alts:
  - أَزْهَرَتِ الْأَشْجَارُ عَدَا شَجَرَةً
source: llm-reviewed
