text: وَإِذَا الْمَنِيَّةُ أَنْشَبَتْ أَظْفَارَهَا أَلْفَيْتَ كُلَّ تَمِيمَةٍ لَا تَنْفَعُ
irab:
  - الواو استئنافية، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - فاعل لفعل محذوف يفسّره ما بعده مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والفاعل ضمير مستتر تقديره هي، والجملة مفسِّرة لا محل لها
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة جواب الشرط لا محل لها
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب مفعول به ثانٍ
