text: خَاطَتِ الْجَدَّةُ دُمًى صَغِيرَةً
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر
  - نعت منصوب وعلامة نصبه تنوين الفتح
