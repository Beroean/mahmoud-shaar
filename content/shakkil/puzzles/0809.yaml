text: اللَّهُ الَّذِي خَلَقَكُمْ ثُمَّ رَزَقَكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ
irab:
  - لفظ الجلالة مبتدأ مرفوع وعلامة رفعه الضمة
  - اسم موصول مبني على السكون في محل رفع خبر
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - حرف عطف مبني على الفتح
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
  - حرف عطف مبني على الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، و«كم» ضمير متصل في محل نصب مفعول به
alts: []
source: quran
level: 3
ref: سورة الروم، الآية ٤٠
