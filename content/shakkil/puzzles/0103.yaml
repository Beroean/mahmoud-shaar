text: لَمْ يَلِدْ وَلَمْ يُولَدْ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - الواو عاطفة، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه السكون، ونائب الفاعل ضمير مستتر تقديره هو
alts: []
source: quran
level: 2
ref: سورة الإخلاص، الآية ٣
