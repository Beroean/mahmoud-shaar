text: اسْتَعَانَ الْمُحَامِي بِمُحَامٍ آخَرَ لِكَسْبِ الْقَضِيَّةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - الباء حرف جر، و«محامٍ» اسم مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة لالتقاء الساكنين، منع من ظهورها الثقل
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (للوصفية ووزن الفعل)
  - اللام حرف جر، و«كسب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
