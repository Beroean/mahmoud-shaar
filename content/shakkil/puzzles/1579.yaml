text: لَا صَلَاةَ لِمَنْ لَمْ يَقْرَأْ بِفَاتِحَةِ الْكِتَابِ
irab:
  - حرف نفي للجنس مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - اللام حرف جر، و«مَن» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «لا»
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - الباء حرف جر، و«فاتحة» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«يقرأ»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٧٥٦
