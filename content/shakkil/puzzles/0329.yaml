text: وَلَا حُزْنٌ يَدُومُ وَلَا سُرُورٌ
irab:
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه تنوين الضم
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - الواو حرف عطف، و«لا» حرف نفي مبني على السكون لتوكيد النفي
  - معطوف على «حزن» مرفوع وعلامة رفعه تنوين الضم
alts: []
author: الإمام الشافعي
source: poetry
