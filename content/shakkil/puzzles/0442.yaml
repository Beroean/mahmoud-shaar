text: الزَّرَافَةُ أَطْوَلُ الْحَيَوَانَاتِ عُنُقًا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - تمييز منصوب وعلامة نصبه تنوين الفتح
alts:
  - الزَّرَافَةُ أَطْوَلُ الْحَيَوَانَاتِ عُنْقًا
source: llm-reviewed
