text: إِنَّ لِكُلِّ أُمَّةٍ أَمِينًا وَإِنَّ أَمِينَنَا أَيَّتُهَا الْأُمَّةُ أَبُو عُبَيْدَةَ بْنُ الْجَرَّاحِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اللام حرف جر، و«كل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - «أيّة» اسم مبني على الضم في محل نصب على الاختصاص بفعل محذوف تقديره أخصّ، و«ها» حرف تنبيه
  - نعت لـ«أيّة» مرفوع على اللفظ وعلامة رفعه الضمة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والتأنيث
  - نعت لـ«أبو» مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
