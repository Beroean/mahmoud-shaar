text: وَإِنَّا لَنَحْنُ نُحْيِي وَنُمِيتُ وَنَحْنُ الْوَارِثُونَ
irab:
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - اللام المزحلقة للتوكيد، و«نحن» ضمير منفصل مبني على الضم في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل رفع خبر «نحن»، وجملة «نحن نحيي» في محل رفع خبر «إنّ»
  - الواو حرف عطف، و«نميت» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - الواو حرف عطف، و«نحن» ضمير منفصل مبني على الضم في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
context: الله تعالى يتحدث عن نفسه
source: quran
