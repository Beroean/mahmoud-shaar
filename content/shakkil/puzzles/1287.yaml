text: كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ
irab:
  - حرف ردع وزجر مبني على السكون
  - حرف شرط غير جازم مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، وجواب «لو» محذوف
  - مفعول مطلق منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: الخطاب لمن ألهاهم التكاثر
source: quran
level: 2
ref: سورة التكاثر، الآية ٥
