text: إِنَّ سَعْيَكُمْ لَشَتَّىٰ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - اللام المزحلقة للتوكيد، و«شتّى» خبر «إنّ» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
alts: []
source: quran
ref: سورة الليل، الآية ٤
