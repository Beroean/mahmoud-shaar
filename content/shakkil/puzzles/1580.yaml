text: عَجَبًا لِأَمْرِ الْمُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ
irab:
  - مفعول مطلق لفعل محذوف تقديره «أعجبُ» منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«أمر» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«عجبًا»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - توكيد معنوي منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٢٩٩٩
