text: مَا الطَّرِيقُ الْجَبَلِيُّ بِآمِنٍ
irab:
  - «ما» الحجازية حرف نفي يعمل عمل «ليس» مبني على السكون
  - اسم «ما» مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر زائد، و«آمن» خبر «ما» مجرور لفظًا منصوب محلًا، وعلامة جره تنوين الكسر
