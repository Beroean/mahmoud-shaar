text: عَسَى الْمَطَرُ أَنْ يَهْطِلَ
irab:
  - فعل ماضٍ ناقص جامد من أفعال الرجاء مبني على الفتح المقدر على الألف للتعذر
  - اسم «عسى» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول من «أن» والفعل في محل نصب خبر «عسى»
