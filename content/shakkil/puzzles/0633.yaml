text: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَـٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم موصول مبني على الفتح في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«عملوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الكسرة لأنه جمع مؤنث سالم
  - اسم إشارة مبني على الكسر في محل رفع مبتدأ، والكاف حرف خطاب
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ ثانٍ
  - خبر المبتدأ الثاني مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل رفع خبر «أولئك»، وجملة «أولئك هم خير البرية» في محل رفع خبر «إنّ»
  - مضاف إليه مجرور وعلامة جره الكسرة
