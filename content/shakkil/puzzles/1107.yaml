text: هِيَ الْأَخْلَاقُ تَنْبُتُ كَالنَّبَاتِ إِذَا سُقِيَتْ بِمَاءِ الْمَكْرُمَاتِ
irab:
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب حال
  - الكاف حرف جر، و«النبات» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تنبت»
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث، ونائب الفاعل ضمير مستتر تقديره هي، والجملة في محل جر بإضافة «إذا» إليها
  - الباء حرف جر، و«ماء» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - الْمَكْرُمَاتِ
    - الْمَكْرَمَاتِ
