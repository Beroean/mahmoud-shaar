text: بَدَأَ الْإِسْلَامُ غَرِيبًا، وَسَيَعُودُ كَمَا بَدَأَ غَرِيبًا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - الواو حرف عطف، والسين حرف استقبال، و«يعود» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - الكاف حرف جر، و«ما» حرف مصدري مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول من «ما» والفعل في محل جر بالكاف، وشبه الجملة متعلق بمحذوف مفعول مطلق (أي يعود عودًا كبدئه)
  - حال منصوبة وعلامة نصبها تنوين الفتح
