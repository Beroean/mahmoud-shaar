text: طَعَامُ الِاثْنَيْنِ كَافِي الثَّلَاثَةِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه ملحق بالمثنى
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
source: hadith
ref: صحيح البخاري، الحديث ٥٣٩٢
