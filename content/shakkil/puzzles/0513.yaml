text: اسْتَمْتَعَ الزُّوَّارُ بِمُشَاهَدَةِ الْغُرُوبِ جَالِسِينَ عَلَى الرِّمَالِ الدَّافِئَةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«مشاهدة» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
