text: هَـٰذَا عَطَاؤُنَا فَامْنُنْ أَوْ أَمْسِكْ بِغَيْرِ حِسَابٍ
irab:
  - «ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - الفاء الفصيحة، و«امنن» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف عطف للتخيير مبني على السكون
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«غير» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
context: الله تعالى يخاطب سليمان عليه السلام
source: quran
level: 2
ref: سورة ص، الآية ٣٩
