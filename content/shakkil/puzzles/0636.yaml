text: بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وهو من ألفاظ العدد، وتمييزه محذوف (خمس دعائم)، وشبه الجملة متعلق بـ«بُني»
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٨
