text: فُحِصَتِ الْعَيِّنَاتُ عَدَا عَيِّنَةٍ وَاحِدَةٍ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر يفيد الاستثناء مبني على السكون (ويجوز أن يكون فعلًا ماضيًا جامدًا فينصب ما بعده)
  - مستثنى بـ«عدا» اسم مجرور وعلامة جره تنوين الكسر (ويجوز نصبه)
  - نعت مجرور وعلامة جره تنوين الكسر
alts:
  - فُحِصَتِ الْعَيِّنَاتُ عَدَا عَيِّنَةً وَاحِدَةً
  - فَحَصَتِ الْعَيِّنَاتِ عَدَا عَيِّنَةٍ وَاحِدَةٍ
  - فَحَصَتِ الْعَيِّنَاتِ عَدَا عَيِّنَةً وَاحِدَةً
source: llm-reviewed
