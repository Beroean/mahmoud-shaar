text: أَمْضَتِ الْمُمَرِّضَةُ اللَّيْلَ سَاهِرَةً بِجَانِبِ الْمَرِيضِ حَتَّى طَلَعَ الْفَجْرُ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - الباء حرف جر، و«جانب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف ابتداء وغاية مبني على السكون (لدخوله على الماضي)
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
