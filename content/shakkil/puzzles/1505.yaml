text: أَخَذَ الْخَزَّافُ يُشَكِّلُ الطِّينَ بِيَدَيْهِ حَتَّى صَارَ جَرَّةً جَمِيلَةً
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «أخذ» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «أخذ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الباء حرف جر، و«يدي» اسم مجرور وعلامة جره الياء لأنه مثنى، وحُذفت النون للإضافة، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو يعود على الطين
  - خبر «صار» منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
