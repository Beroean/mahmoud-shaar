text: وَلَا يَغُرَّنْكَ صَفْوٌ أَنْتَ شَارِبُهُ فَرُبَّمَا كَانَ بِالتَّكْدِيرِ مُمْتَزِجَا
irab:
  - الواو استئنافية، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الخفيفة في محل جزم بـ«لا»، والنون حرف لا محل له، والكاف ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وجملة «أنت شاربه» في محل رفع نعت لـ«صفو»
  - الفاء تعليلية، و«ربّ» حرف تقليل مبني على الفتح، و«ما» زائدة كفّتها عن العمل
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو يعود على الصفو
  - الباء حرف جر، و«التكدير» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«ممتزجًا»
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح، والألف للإطلاق
alts: []
vary:
  - - مُمْتَزِجَا
    - مُمْتَزِجًا
fixed:
  - يغرنك
  - أنت
author: محمد بن بشير الخارجي
source: poetry
level: 3
ref: «ماذا يكلفك الروحات والدلجا»
