text: تَأَخَّرَ الْعُمَّالُ لِأَنَّهُمْ لَمْ يَسْمَعُوا الْمُنَبِّهَ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر للتعليل، و«أنّ» حرف توكيد ونصب، و«هم» ضمير متصل مبني على السكون في محل نصب اسم «أنّ»، والمصدر المؤول في محل جر باللام
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «أنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
