text: كَمْ رِوَايَةً اسْتَعَرْتَ مِنْ مَكْتَبَةِ الْحَيِّ؟
irab:
  - «كم» الاستفهامية اسم مبني على السكون في محل نصب مفعول به مقدم
  - تمييز «كم» الاستفهامية منصوب وعلامة نصبه تنوين الفتح
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - - اسْتَعَرْتَ
    - اسْتَعَرْتِ
    - اسْتَعَرْتُ
source: llm-reviewed
level: 2
