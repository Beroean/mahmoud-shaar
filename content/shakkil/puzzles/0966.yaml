text: شَرَعَ الْبَنَّاؤُونَ يَرْفَعُونَ جُدْرَانَ الْبَيْتِ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «شرع» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «شرع»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
