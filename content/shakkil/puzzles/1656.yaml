text: زَارَنَا أَقْرِبَاءُ أَعِزَّاءُ
irab:
  - فعل ماضٍ مبني على الفتح، و«نا» ضمير متصل مبني على السكون في محل نصب مفعول به مقدم
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (مختوم بألف التأنيث الممدودة)
  - نعت مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (مختوم بألف التأنيث الممدودة)
