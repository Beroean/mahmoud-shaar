text: أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ قَبْلِي
irab:
  - فعل ماضٍ مبني للمجهول مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع نائب فاعل
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح، وهو من ألفاظ العدد وتمييزه محذوف (أي خمس خصال)
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، و«هنّ» ضمير متصل في محل نصب مفعول به ثانٍ، والجملة في محل نصب نعت لـ«خمسًا»
  - نائب فاعل مرفوع وعلامة رفعه تنوين الضم
  - ظرف زمان منصوب وعلامة نصبه الفتحة المقدرة لاشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يُعطهنّ»
alts: []
fixed:
  - أعطيت
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٣٣٥
