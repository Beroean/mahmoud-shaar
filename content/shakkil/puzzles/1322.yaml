text: نُصِرْتُ بِالصَّبَا، وَأُهْلِكَتْ عَادٌ بِالدَّبُورِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع نائب فاعل
  - الباء حرف جر، و«الصبا» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وشبه الجملة متعلق بـ«نُصرت»
  - الواو حرف عطف، و«أُهلكت» فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث
  - نائب فاعل مرفوع وعلامة رفعه تنوين الضم، وهو مصروف لأنه علم ثلاثي ساكن الوسط
  - الباء حرف جر، و«الدبور» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«أُهلكت»
alts: []
fixed:
  - نصرت
source: hadith
level: 2
ref: صحيح البخاري، الحديث ١٠٣٥
