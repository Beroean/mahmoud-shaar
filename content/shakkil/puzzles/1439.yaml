text: كَمْ سَمَكَةً اصْطَدْتَ؟
irab:
  - «كم» الاستفهامية اسم مبني على السكون في محل نصب مفعول به مقدم
  - تمييز «كم» الاستفهامية منصوب وعلامة نصبه تنوين الفتح
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني في محل رفع فاعل
alts: []
vary:
  - - اصْطَدْتَ
    - اصْطَدْتِ
source: llm-reviewed
