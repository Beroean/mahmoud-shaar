text: شَاهَدْنَا الْقَمَرَ مُكْتَمِلًا فِي سَمَاءٍ صَافِيَةٍ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
