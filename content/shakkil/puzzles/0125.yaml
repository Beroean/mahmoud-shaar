text: قِفَا نَبْكِ مِنْ ذِكْرَى حَبِيبٍ وَمَنْزِلِ
irab:
  - فعل أمر مبني على حذف النون، والألف ضمير متصل في محل رفع فاعل
  - فعل مضارع مجزوم لأنه جواب الطلب وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر تقديره نحن
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو عاطفة، و«منزل» معطوف مجرور وعلامة جره الكسرة
alts: []
author: امرؤ القيس
source: poetry
