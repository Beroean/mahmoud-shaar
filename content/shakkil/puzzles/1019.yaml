text: عِنْدَمَا تُطْفَأُ الْأَنْوَارُ فِي الْقَاعَةِ يَسُودُ الصَّمْتُ بَيْنَ الْحُضُورِ
irab:
  - «عند» ظرف زمان منصوب وعلامة نصبه الفتحة، و«ما» حرف مصدري، والمصدر المؤول في محل جر مضاف إليه
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - عِنْدَمَا تَطْفَأُ الْأَنْوَارُ فِي الْقَاعَةِ يَسُودُ الصَّمْتُ بَيْنَ الْحُضُورِ
source: llm-reviewed
level: 2
