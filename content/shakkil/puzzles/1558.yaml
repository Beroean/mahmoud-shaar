text: صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ
irab:
  - بدل من «الصراط» في الآية السابقة منصوب وعلامة نصبه الفتحة، وهو مضاف
  - اسم موصول مبني على الفتح في محل جر مضاف إليه
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أنعمت»
  - بدل من «الذين» مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة في محل رفع نائب فاعل لاسم المفعول «المغضوب»
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي المفهوم من «غير»
  - اسم معطوف على «المغضوب» مجرور وعلامة جره الياء لأنه جمع مذكر سالم
alts: []
context: دعاء العبد ربه، بعد «اهدنا الصراط المستقيم»
source: quran
level: 3
ref: سورة الفاتحة، الآية ٧
