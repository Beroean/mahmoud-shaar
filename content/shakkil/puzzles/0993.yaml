text: رَجَعَتِ الْمُمَرِّضَاتُ إِلَى بُيُوتِهِنَّ مُرْهَقَاتٍ بَعْدَ الْمُنَاوَبَةِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هنّ» ضمير متصل في محل جر مضاف إليه
  - حال منصوبة وعلامة نصبها الكسرة نيابة عن الفتحة لأنها جمع مؤنث سالم
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
