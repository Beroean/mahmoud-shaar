text: يَا خَادِمَ الْجِسْمِ كَمْ تَشْقَى بِخِدْمَتِهِ
irab:
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الفتحة لأنه مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - «كم» الخبرية بمعنى «كثيرًا» مبنية على السكون في محل نصب مفعول مطلق
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، و«خدمة» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«تشقى»
