text: إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع تام بمعنى «يوجد» مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «إنّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«يكون»
  - أداة حصر مبنية على السكون (استثناء مفرغ)
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل نصب حال
alts: []
source: hadith
level: 2
ref: صحيح مسلم، الحديث ٢٥٩٤
