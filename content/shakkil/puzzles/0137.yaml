text: إِذَا خَسِرْنَا الْحَرْبَ لَا غَرَابَةَ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والجملة في محل جر بالإضافة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نافية للجنس تعمل عمل «إنّ» مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف، والجملة جواب الشرط لا محل لها
alts: []
author: نزار قباني
source: poetry
level: 3
ref: هوامش على دفتر النكسة
