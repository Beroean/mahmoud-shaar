text: مَرَرْنَا بِغَابَةٍ كَثِيفٍ شَجَرُهَا
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«غابة» اسم مجرور وعلامة جره تنوين الكسر
  - نعت سببي مجرور وعلامة جره تنوين الكسر، وهو صفة مشبهة
  - فاعل للصفة المشبهة «كثيف» مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
