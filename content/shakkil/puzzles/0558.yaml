text: وَعِبَادُ الرَّحْمَـٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا
irab:
  - الواو استئنافية، و«عباد» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - اسم موصول مبني على الفتح في محل رفع خبر المبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يمشون»
  - حال منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، و«هم» ضمير متصل مبني على السكون في محل نصب مفعول به، وحُرّك بالضم لالتقاء الساكنين، والجملة في محل جر مضاف إليه، وهي جملة الشرط
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
