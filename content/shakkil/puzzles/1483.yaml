text: إِذَا ارْتَفَعَتْ حَرَارَةُ الطِّفْلِ فَاسْتَشِرِ الطَّبِيبَ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، و«استشر» فعل أمر مبني على السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
