text: وَمَكَرُوا مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ
irab:
  - الواو حرف عطف، و«مكروا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«مكر» فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - الواو حالية، و«هم» ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر المبتدأ، والجملة الاسمية في محل نصب حال
alts: []
context: الحديث عن الرهط المفسدين من قوم صالح
source: quran
level: 2
ref: سورة النمل، الآية ٥٠
