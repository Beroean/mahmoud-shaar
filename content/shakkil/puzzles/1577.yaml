text: لَا يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الْفِطْرَ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع ناقص مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم «لا يزال» مرفوع وعلامة رفعه الضمة الظاهرة
  - الباء حرف جر، و«خير» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر «لا يزال»
  - حرف مصدري ظرفي مبني على السكون
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب ظرف زمان
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
source: hadith
ref: صحيح البخاري، الحديث ١٩٥٧
