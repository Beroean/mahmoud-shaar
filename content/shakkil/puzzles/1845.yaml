text: إِنَّ الْكَرِيمَ إِذَا بَنَى لَمْ يَنْوِ هَدْمَ بِنَائِهِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الياء)، والفاعل ضمير مستتر تقديره هو، والجملة جواب شرط غير جازم لا محل لها، وجملة الشرط وجوابه في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
vary:
  - - بِنَائِهِ
    - بِنَائِهْ
author: السري الرفاء
source: poetry
level: 3
ref: «قل للأمير الماجد الس»
