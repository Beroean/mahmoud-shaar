text: يَقُولُ ابْنُ آدَمَ مَالِي مَالِي
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة بدل الكسرة لأنه ممنوع من الصرف (علم أعجمي)
  - خبر لمبتدأ محذوف تقديره «هذا» مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه، والجملة في محل نصب مقول القول
  - توكيد لفظي مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 2
ref: صحيح مسلم، الحديث ٢٩٥٨
