text: سَقَطَ الْبَرَدُ لَيْلًا فَأَتْلَفَ مَحَاصِيلَ الْقَرْيَةِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - الفاء حرف عطف، و«أتلف» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
