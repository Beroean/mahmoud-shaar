text: إِذَا لَمْ تَسْتَطِعْ أَنْ تَقُولَ خَيْرًا فَالصَّمْتُ أَفْضَلُ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة فعل الشرط
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الفاء رابطة لجواب الشرط، و«الصمت» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (على وزن أفعل)، والجملة جواب الشرط لا محل لها
