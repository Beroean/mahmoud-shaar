text: وَلَسْتُ بِمِفْرَاحٍ إِذَا الدَّهْرُ سَرَّنِي وَلَا جَازِعٍ مِنْ صَرْفِهِ الْمُتَقَلِّبِ
irab:
  - الواو بحسب ما قبلها، و«ليس» فعل ماضٍ ناقص جامد مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع اسم «ليس»
  - الباء حرف جر زائد، و«مفراح» اسم مجرور لفظًا منصوب محلًّا خبر «ليس»
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، وجوابه محذوف دلّ عليه ما قبله
  - فاعل لفعل محذوف يفسّره المذكور مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة مفسِّرة لا محل لها
  - الواو حرف عطف، و«لا» زائدة لتوكيد النفي
  - معطوف على لفظ «مفراح» مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«جازع»
  - نعت مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - ولست
author: هدبة بن الخشرم
source: poetry
level: 3
