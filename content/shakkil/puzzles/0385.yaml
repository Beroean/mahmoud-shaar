text: وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ
irab:
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب، والكاف ضمير متصل مبني على الفتح في محل نصب اسم «إنّ»
  - اللام المزحلقة للتوكيد، و«على» حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف خبر «إنّ»
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة القلم، الآية ٤
