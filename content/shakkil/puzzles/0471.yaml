text: يَجِبُ أَنْ يَرْتَدِيَ الْعُمَّالُ خُوذَاتٍ وَاقِيَةً
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل رفع فاعل
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه تنوين الكسر نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه تنوين الفتح
