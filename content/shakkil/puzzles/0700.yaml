text: يَسُرُّنِي أَنْ تَزُورَنَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، و«نا» ضمير متصل في محل نصب مفعول به، والمصدر المؤول في محل رفع فاعل
