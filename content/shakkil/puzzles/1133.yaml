text: وَإِذَا الْمَوْءُودَةُ سُئِلَتْ
irab:
  - الواو حرف عطف، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - نائب فاعل لفعل محذوف يفسره المذكور، مرفوع وعلامة رفعه الضمة، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث الساكنة، ونائب الفاعل ضمير مستتر تقديره هي، والجملة تفسيرية لا محل لها
alts: []
context: من مشاهد يوم القيامة
source: quran
level: 3
ref: سورة التكوير، الآية ٨
