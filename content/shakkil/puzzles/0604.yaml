text: وَسِعْتُ كِتَابَ اللَّهِ لَفْظًا وَغَايَةً وَمَا ضِقْتُ عَنْ آيٍ بِهِ وَعِظَاتِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«غاية» اسم معطوف منصوب وعلامة نصبه تنوين الفتح
  - الواو عاطفة، و«ما» حرف نفي مبني على السكون
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - الباء حرف جر، والهاء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف نعت لـ«آي»
  - الواو حرف عطف، و«عظات» اسم معطوف مجرور وعلامة جره الكسرة، وحذف التنوين لضرورة القافية
