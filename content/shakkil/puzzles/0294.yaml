text: لَا ضَجِيجَ فِي الْقَرْيَةِ بَعْدَ مُنْتَصَفِ اللَّيْلِ
irab:
  - حرف نفي للجنس يعمل عمل «إنّ» مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة في محل رفع خبر «لا»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - لَا ضَجِيجٌ فِي الْقَرْيَةِ بَعْدَ مُنْتَصَفِ اللَّيْلِ
source: llm-reviewed
level: 2
