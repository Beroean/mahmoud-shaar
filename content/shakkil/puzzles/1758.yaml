text: لَا يُمْكِنُ لِلنَّبَاتَاتِ أَنْ تَنْمُوَ دُونَ ضَوْءٍ وَمَاءٍ وَتُرْبَةٍ صَالِحَةٍ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«النباتات» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة على الواو، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول في محل رفع فاعل «يمكن»
  - ظرف منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«ماء» اسم معطوف مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«تربة» اسم معطوف مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
