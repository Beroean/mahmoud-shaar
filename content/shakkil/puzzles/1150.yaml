text: لَمْ يُشْفَ الْجُرْحُ بَعْدُ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة، والفتحة قبلها دليل عليها
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان مبني على الضم في محل نصب لقطعه عن الإضافة
alts:
  - لَمْ يَشْفِ الْجُرْحَ بَعْدُ
source: llm-reviewed
