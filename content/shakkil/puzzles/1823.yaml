text: مَنْ يَسْتَعْفِفْ يُعِفَّهُ اللَّهُ، وَمَنْ يَسْتَغْنِ يُغْنِهِ اللَّهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون المقدر، وحُرّك بالفتح للتخلص من التقاء الساكنين لأنه مضعّف (ويجوز ضمه إتباعًا لضمة الهاء)، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - لفظ الجلالة فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«من» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه حذف حرف العلة (الياء)، والفاعل ضمير مستتر تقديره هو
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه حذف حرف العلة (الياء)، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - لفظ الجلالة فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
alts:
  - مَنْ يَسْتَعْفِفْ يُعِفُّهُ اللَّهُ، وَمَنْ يَسْتَغْنِ يُغْنِهِ اللَّهُ
source: hadith
level: 3
ref: صحيح البخاري، الحديث ١٤٦٩
