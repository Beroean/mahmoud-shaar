text: تَعِبَ الْحَمَّالُونَ غَيْرَ رَئِيسِهِمْ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - اسم منصوب على الاستثناء وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور (وهو المستثنى) وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
