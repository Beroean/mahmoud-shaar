text: عَادَتِ الْقَوَارِبُ إِلَى الْمِينَاءِ وَالْبَحْرُ هَائِجٌ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الواو حالية، و«البحر» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة الاسمية في محل نصب حال
