text: اتَّخَذَ الرَّاعِي الْكَهْفَ مَأْوًى
irab:
  - فعل ماضٍ من أفعال التحويل ينصب مفعولين مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر، لأنه اسم مقصور منوّن
