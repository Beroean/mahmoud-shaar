text: يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة، بدل من «إذا» في الآية قبلها، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل جر بإضافة «يوم» إليها
  - فاعل مرفوع وعلامة رفعه الضمة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«يفرّ»
alts: []
source: quran
level: 2
ref: سورة عبس، الآية ٣٤
