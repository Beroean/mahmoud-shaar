text: الْأَرْوَاحُ جُنُودٌ مُجَنَّدَةٌ، فَمَا تَعَارَفَ مِنْهَا ائْتَلَفَ، وَمَا تَنَاكَرَ مِنْهَا اخْتَلَفَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه تنوين الضم
  - الفاء استئنافية، و«ما» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - «من» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو
  - الواو حرف عطف، و«ما» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - «من» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو
