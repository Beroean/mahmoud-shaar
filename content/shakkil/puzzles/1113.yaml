text: وَمَنْ تَكُنِ الْعَلْيَاءُ هِمَّةَ نَفْسِهِ فَكُلُّ الَّذِي يَلْقَاهُ فِيهَا مُحَبَّبُ
irab:
  - الواو استئنافية، و«مَن» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع ناقص مجزوم لأنه فعل الشرط وعلامة جزمه السكون، وحُذفت الواو لالتقاء الساكنين، وحُرِّك بالكسر لالتقاء الساكنين
  - اسم «تكن» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «تكن» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب الشرط، و«كل» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - «في» حرف جر، و«ها» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يلقاه»
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جزم جواب الشرط
alts: []
author: محمود سامي البارودي
