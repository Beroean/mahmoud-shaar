text: رَبِّ السِّجْنُ أَحَبُّ إِلَيَّ مِمَّا يَدْعُونَنِي إِلَيْهِ
irab:
  - منادى بأداة نداء محذوفة منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم المحذوفة، وهو مضاف، والياء المحذوفة ضمير في محل جر مضاف إليه
  - مبتدأ مرفوع وعلامة رفعه الضمة
  - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)
  - «إلى» حرف جر، والياء ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«أحبّ»
  - «من» حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أحبّ»
  - فعل مضارع مبني على السكون لاتصاله بنون النسوة، والواو لام الفعل، والنون ضمير متصل مبني على الفتح في محل رفع فاعل، والنون الثانية للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - «إلى» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«يدعونني»
