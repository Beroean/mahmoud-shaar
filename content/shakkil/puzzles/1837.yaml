text: الصَّمْتُ أَزْيَنُ بِالْفَتَى مِنْ مَنْطِقٍ فِي غَيْرِ حِينِهِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة بلا تنوين لأنه ممنوع من الصرف (الوصفية ووزن «أفعل»)
  - الباء حرف جر، و«الفتى» اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وشبه الجملة متعلق بـ«أزين»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«أزين»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف نعت لـ«منطق»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
vary:
  - - حِينِهِ
    - حِينِهْ
author: عبد الله بن المبارك
source: poetry
level: 2
ref: «الصمت أزين بالفتى»
