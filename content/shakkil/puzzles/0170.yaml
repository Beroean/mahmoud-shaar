text: هَلْ تَسْمَحِينَ بِأَنْ أُحِبَّكِ؟
irab:
  - حرف استفهام مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والياء ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«أن» حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره أنا، والكاف ضمير متصل في محل نصب مفعول به، والمصدر المؤول في محل جر بالباء
alts: []
author: نزار قباني
source: poetry
level: 3
