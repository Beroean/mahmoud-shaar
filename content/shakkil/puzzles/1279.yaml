text: أُولَـٰئِكَ هُمُ الْكَفَرَةُ الْفَجَرَةُ
irab:
  - اسم إشارة مبني على الكسر في محل رفع مبتدأ، والكاف حرف خطاب
  - ضمير فصل مبني على السكون لا محل له من الإعراب، وحُرّك بالضم لالتقاء الساكنين
  - خبر مرفوع وعلامة رفعه الضمة
  - خبر ثانٍ مرفوع وعلامة رفعه الضمة
alts: []
context: أصحاب الوجوه التي عليها غبرة يوم القيامة
source: quran
ref: سورة عبس، الآية ٤٢
