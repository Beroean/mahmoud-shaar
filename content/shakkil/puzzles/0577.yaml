text: سِبَابُ الْمُسْلِمِ فُسُوقٌ، وَقِتَالُهُ كُفْرٌ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«قتال» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٤٨
