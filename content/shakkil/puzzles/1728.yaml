text: عَلَى السَّائِقِينَ أَنْ يَرْبُطُوا أَحْزِمَةَ الْأَمَانِ
irab:
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بمحذوف خبر مقدم
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل رفع مبتدأ مؤخر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - عَلَى السَّائِقِينَ أَنْ يَرْبِطُوا أَحْزِمَةَ الْأَمَانِ
source: llm-reviewed
