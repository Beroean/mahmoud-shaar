text: زَارَنَا حَمُو أُخْتِي
irab:
  - فعل ماضٍ مبني على الفتح، و«نا» ضمير متصل في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
