text: حِينَ وَصَلْنَا إِلَى الْمَحَطَّةِ كَانَ الْقِطَارُ قَدْ غَادَرَ قَبْلَ دَقَائِقَ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة (ويجوز بناؤه على الفتح لإضافته إلى جملة فعلها ماضٍ)، وهو مضاف
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل، والجملة في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف تحقيق مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «كان»
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (صيغة منتهى الجموع)
