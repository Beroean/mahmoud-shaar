text: وَمَا أَدْرِي إِذَا يَمَّمْتُ أَرْضًا أُرِيدُ الْخَيْرَ أَيُّهُمَا يَلِينِي
irab:
  - الواو حرف عطف، و«ما» حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل، والجملة في محل جر بإضافة «إذا» إليها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل نصب حال
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - اسم استفهام مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، و«هما» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والجملة في محل رفع خبر، وجملة «أيهما يليني» في محل نصب سدّت مسدّ مفعولي «أدري» المعلَّق بالاستفهام
alts: []
fixed:
  - يممت
author: المثقب العبدي
source: poetry
