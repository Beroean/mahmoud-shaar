text: لَا تُصَدِّقُوا كُلَّ مَا تَقْرَؤُونَهُ عَلَى مَوَاقِعِ التَّوَاصُلِ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
