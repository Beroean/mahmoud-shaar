text: لَا يَنْظُرُ اللَّهُ إِلَى مَنْ جَرَّ ثَوْبَهُ خُيَلَاءَ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«ينظر»
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - مفعول لأجله منصوب وعلامة نصبه الفتحة بلا تنوين لأنه ممنوع من الصرف (مختوم بألف التأنيث الممدودة)
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٥٧٨٣
