text: أَشْعَارُنَا أَكْبَرُ مِنْ أَشْعَارِنَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على وزن «أفعل»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
alts: []
author: نزار قباني
source: poetry
level: 2
