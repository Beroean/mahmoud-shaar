text: سَيَجْعَلُ اللَّهُ بَعْدَ عُسْرٍ يُسْرًا
irab:
  - السين حرف استقبال مبني على الفتح، و«يجعل» فعل مضارع مرفوع وعلامة رفعه الضمة
  - لفظ الجلالة فاعل مرفوع وعلامة رفعه الضمة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بـ«يجعل»
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
ref: سورة الطلاق، الآية ٧
