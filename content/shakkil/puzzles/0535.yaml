text: إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - ضمير فصل مبني على الفتح لا محل له من الإعراب
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة الكوثر، الآية ٣
