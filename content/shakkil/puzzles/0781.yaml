text: قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل نصب مقول القول
  - الباء حرف جر، و«ربّ» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«أعوذ»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
source: quran
ref: سورة الفلق، الآية ١
