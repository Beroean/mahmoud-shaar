text: ظَلَّ الْمُسَافِرُونَ يَتَسَامَرُونَ فِي عَرَبَةِ الطَّعَامِ لِيَقْطَعُوا الْوَقْتَ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «ظلّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «ظلّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اللام لام التعليل حرف جر، و«يقطعوا» فعل مضارع منصوب بأن مضمرة بعد لام التعليل وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
