text: وَإِذَا قِيلَ لَهُمُ ارْكَعُوا لَا يَرْكَعُونَ
irab:
  - الواو استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - اللام حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وحُرّك بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«قيل»
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع نائب فاعل
  - نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
