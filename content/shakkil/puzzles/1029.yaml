text: لَا أُقْسِمُ بِهَـٰذَا الْبَلَدِ
irab:
  - حرف زائد لتأكيد القسم مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - الباء حرف جر، و«ها» حرف تنبيه، و«ذا» اسم إشارة مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أقسم»
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة
alts: []
source: quran
ref: سورة البلد، الآية ١
