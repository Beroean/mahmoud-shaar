text: مَا الْمَالُ وَحْدَهُ سَبِيلًا إِلَى السَّعَادَةِ
irab:
  - «ما» الحجازية حرف نفي يعمل عمل «ليس» مبني على السكون
  - اسم «ما» مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - خبر «ما» منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
