text: لِلْمُثَلَّثِ ثَلَاثَةُ أَضْلَاعٍ
irab:
  - اللام حرف جر، و«المثلث» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف (العدد يخالف المعدود في التذكير والتأنيث)
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
