text: وَحَبَّبَ أَوْطَانَ الرِّجَالِ إِلَيْهِمُ مَآرِبُ قَضَّاهَا الشَّبَابُ هُنَالِكَا
irab:
  - الواو استئنافية، و«حبّب» فعل ماضٍ مبني على الفتح
  - مفعول به مقدم منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - «إلى» حرف جر، و«هم» ضمير متصل في محل جر، وضُمّت الميم للوزن، وشبه الجملة متعلق بـ«حبّب»
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة، ولم يُنوَّن لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، و«ها» ضمير متصل في محل نصب مفعول به مقدم، والجملة في محل رفع نعت لـ«مآرب»
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - «هنا» اسم إشارة للمكان مبني على السكون في محل نصب ظرف مكان، واللام للبعد، والكاف حرف خطاب، والألف للإطلاق
alts: []
author: ابن الرومي
source: poetry
level: 3
ref: «أعوذ بحقويك العزيزين أن أرى»
