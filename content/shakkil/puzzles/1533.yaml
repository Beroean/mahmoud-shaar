text: أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ
irab:
  - الهمزة للاستفهام، و«رأى» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - الباء حرف جر، و«الدين» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يكذّب»
alts: []
context: الخطاب للنبي ﷺ
source: quran
ref: سورة الماعون، الآية ١
