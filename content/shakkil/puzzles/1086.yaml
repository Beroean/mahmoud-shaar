text: اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ
irab:
  - لفظ الجلالة منادى مبني على الضم في محل نصب، والميم المشددة عوض عن حرف النداء المحذوف
  - «إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر «إنّ»
  - الباء حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«أعوذ»
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الحزن» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«العجز» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الكسل» اسم معطوف مجرور وعلامة جره الكسرة الظاهرة
alts: []
fixed:
  - بك
