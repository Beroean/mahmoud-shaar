text: مَا زَالَ الثَّلْجُ يَتَسَاقَطُ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، و«ما زال» تفيد الاستمرار
  - اسم «ما زال» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «ما زال»
