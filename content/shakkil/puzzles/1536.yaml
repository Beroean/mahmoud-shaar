text: أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - اللام حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«نشرح»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل مبني على الفتح في محل جر مضاف إليه
alts: []
context: الخطاب للنبي ﷺ
source: quran
level: 2
ref: سورة الشرح، الآية ١
