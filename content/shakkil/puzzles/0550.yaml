text: هُوَ اللَّهُ الَّذِي لَا إِلَـٰهَ إِلَّا هُوَ
irab:
  - ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - لفظ الجلالة خبر مرفوع وعلامة رفعه الضمة
  - اسم موصول مبني على السكون في محل رفع نعت للفظ الجلالة
  - نافية للجنس مبنية على السكون
  - اسم «لا» مبني على الفتح في محل نصب، وخبرها محذوف، والجملة صلة الموصول لا محل لها
  - أداة حصر لا عمل لها
  - ضمير منفصل مبني على الفتح في محل رفع بدل من الضمير المستتر في خبر «لا» المحذوف
alts: []
source: quran
level: 3
ref: سورة الحشر، الآية ٢٣
