text: مَنْ يَشْعُرْ بِأَلَمٍ فِي صَدْرِهِ فَلْيَتَّصِلْ بِالْإِسْعَافِ فَوْرًا
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«ألم» اسم مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يتصل» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو، والجملة في محل جزم جواب الشرط
  - الباء حرف جر، و«الإسعاف» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
