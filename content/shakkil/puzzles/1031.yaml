text: وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا
irab:
  - الواو حرف عطف، و«أخرج» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
alts: []
source: quran
ref: سورة الزلزلة، الآية ٢
