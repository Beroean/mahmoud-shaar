text: هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ
irab:
  - حرف استفهام بمعنى النفي مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - أداة حصر لا عمل لها
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة
alts: []
source: quran
level: 3
ref: سورة الرحمن، الآية ٦٠
