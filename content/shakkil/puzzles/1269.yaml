text: لَا يَكَادُ بَيْتٌ فِي الْقَرْيَةِ يَخْلُو مِنْ شَجَرَةِ زَيْتُونٍ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع ناقص من أفعال المقاربة مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم «يكاد» مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف نعت لـ«بيت»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل، والفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «يكاد»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
