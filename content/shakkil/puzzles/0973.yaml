text: عَلَيْكُمْ بِالْمَشْيِ فِي الْهَوَاءِ الطَّلْقِ
irab:
  - اسم فعل أمر بمعنى «الزموا» منقول عن الجار والمجرور مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنتم
  - الباء حرف جر زائد، و«المشي» مفعول به مجرور لفظًا منصوب محلًا
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
