text: يُغْلِقُ التَّاجِرُ مَتْجَرَهُ ظُهْرًا طَلَبًا لِلرَّاحَةِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«الراحة» اسم مجرور وعلامة جره الكسرة الظاهرة
