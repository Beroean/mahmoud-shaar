text: مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لَا يَذْكُرُ مَثَلُ الْحَيِّ وَالْمَيِّتِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«الذي» اسم موصول مبني على السكون في محل جر معطوف على «الذي»
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والمفعول به محذوف (أي ربَّه)، والجملة صلة الموصول لا محل لها من الإعراب
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الواو حرف عطف، و«الميت» معطوف مجرور وعلامة جره الكسرة الظاهرة
