text: لِكُلِّ دَاءٍ دَوَاءٌ فَإِذَا أُصِيبَ دَوَاءُ الدَّاءِ بَرَأَ بِإِذْنِ اللَّهِ عَزَّ وَجَلَّ
irab:
  - اللام حرف جر، و«كل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - الفاء استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو يعود على المريض المفهوم من السياق، والجملة جواب الشرط لا محل لها
  - الباء حرف جر، و«إذن» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«برأ»
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة اعتراضية للتعظيم لا محل لها
  - الواو حرف عطف، و«جلّ» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
