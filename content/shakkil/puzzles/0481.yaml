text: اشْتَرَى التَّاجِرُ عِشْرِينَ كِيسًا مِنَ الْأُرْزِ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الياء لأنه ملحق بجمع المذكر السالم، وهو من ألفاظ العدد
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
alts:
  - اشْتَرَى التَّاجِرُ عِشْرِينَ كِيسًا مِنَ الْأَرُزِّ
  - اشْتَرَى التَّاجِرُ عِشْرِينَ كِيسًا مِنَ الْأُرُزِّ
source: llm-reviewed
