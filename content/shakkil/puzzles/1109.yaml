text: وَقَفْتُ عَلَى رَبْعٍ لِمَيَّةَ نَاقَتِي فَمَا زِلْتُ أَبْكِي عِنْدَهُ وَأُخَاطِبُهْ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«وقف»
  - اللام حرف جر، و«مية» اسم مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والتأنيث)، وشبه الجملة متعلق بمحذوف نعت لـ«ربع»
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - الفاء حرف عطف، و«ما» حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع اسم «ما زال»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا، والجملة في محل نصب خبر «ما زال»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أبكي»
  - الواو حرف عطف، و«أخاطب» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا، والهاء ضمير متصل في محل نصب مفعول به، وسُكّنت للقافية
alts: []
vary:
  - - وَأُخَاطِبُهْ
    - وَأُخَاطِبُهُ
fixed:
  - وقفت
  - زلت
author: ذو الرمة
source: poetry
level: 3
ref: «وقفت على ربع لمية ناقتي»
