text: وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ
irab:
  - الواو استئنافية، و«إذا» ظرف لما يستقبل من الزمان متضمن معنى الشرط مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والكاف ضمير متصل مبني على الفتح في محل نصب مفعول به، والجملة في محل جر مضاف إليه، وهي جملة الشرط
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - «عن» حرف جر، والياء ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«سأل»
  - الفاء رابطة لجواب الشرط، و«إنّ» حرف توكيد ونصب، والياء ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم، والجملة جواب شرط غير جازم لا محل لها
