text: الرِّيَاضَةَ الرِّيَاضَةَ أَيُّهَا الشَّبَابُ، فَإِنَّهَا تُقَوِّي الْجِسْمَ وَتُنْعِشُ الذِّهْنَ
irab:
  - مفعول به منصوب لفعل محذوف تقديره الزموا (إغراء)، وعلامة نصبه الفتحة الظاهرة
  - توكيد لفظي منصوب وعلامة نصبه الفتحة الظاهرة
  - منادى بحرف نداء محذوف، و«أيّ» نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الضمة الظاهرة
  - الفاء تعليلية، و«إنّ» حرف توكيد ونصب، و«ها» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر «إنّ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو حرف عطف، و«تنعش» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts:
  - الرِّيَاضَةُ الرِّيَاضَةُ أَيُّهَا الشَّبَابُ، فَإِنَّهَا تُقَوِّي الْجِسْمَ وَتُنْعِشُ الذِّهْنَ
source: llm-reviewed
level: 3
