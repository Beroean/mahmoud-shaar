text: إِنَّ الْمُهِمَّاتِ فِيهَا يُعْرَفُ الرَّجُلُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - «في» حرف جر، و«ها» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يعرف»
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وجملة «فيها يعرف الرجل» في محل رفع خبر «إنّ»
alts: []
author: البهاء زهير
source: poetry
level: 3
ref: «دعوا الوشاة وما قالوا وما نقلوا»
