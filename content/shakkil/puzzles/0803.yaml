text: لَا تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِ
irab:
  - ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - الباء حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«تحرّك»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - اللام لام التعليل حرف جر، و«تعجل» فعل مضارع منصوب بـ«أن» المضمرة بعد لام التعليل وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره أنت، والمصدر المؤول في محل جر باللام، وشبه الجملة متعلق بـ«تحرّك»
  - الباء حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«تعجل»
alts: []
context: الخطاب للنبي ﷺ، والضمير للقرآن
source: quran
level: 3
ref: سورة القيامة، الآية ١٦
