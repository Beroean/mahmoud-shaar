text: أَحَاصِدٌ الْفَلَّاحُ قَمْحَهُ؟
irab:
  - الهمزة حرف استفهام مبني على الفتح، و«حاصد» مبتدأ مرفوع وعلامة رفعه تنوين الضم
  - فاعل لاسم الفاعل سدّ مسدّ الخبر مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به لاسم الفاعل منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
