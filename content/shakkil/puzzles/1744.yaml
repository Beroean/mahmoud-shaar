text: لَيْسَتِ السَّعَادَةُ فِي امْتِلَاكِ الْأَشْيَاءِ، بَلْ فِي الِاسْتِمْتَاعِ بِهَا
irab:
  - فعل ماضٍ ناقص جامد مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «ليس»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف عطف يفيد الاستدراك مبني على السكون
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة معطوف على شبه الجملة الأولى
  - الباء حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر
alts: []
fixed:
  - ليست
  - امتلاك
