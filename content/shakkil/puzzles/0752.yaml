text: إِنَّ الرِّيَاضِيِّينَ الَّذِينَ يَتَدَرَّبُونَ بِانْتِظَامٍ أَقَلُّ عُرْضَةً لِلْإِصَابَاتِ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - اسم موصول مبني على الفتح في محل نصب نعت
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الباء حرف جر، و«انتظام» اسم مجرور وعلامة جره تنوين الكسر
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (على وزن أفعل)
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«الإصابات» اسم مجرور وعلامة جره الكسرة الظاهرة
