text: وَالشَّيْخُ لَا يَتْرُكُ أَخْلَاقَهُ حَتَّى يُوَارَى فِي ثَرَى رَمْسِهِ
irab:
  - الواو استئنافية، و«الشيخ» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف غاية وجر مبني على السكون
  - فعل مضارع مبني للمجهول منصوب بأن مضمرة وجوبًا بعد «حتى» وعلامة نصبه الفتحة المقدرة على الألف للتعذر، ونائب الفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
author: صالح بن عبد القدوس
source: poetry
