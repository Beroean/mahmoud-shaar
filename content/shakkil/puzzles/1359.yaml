text: أَرَى كُلَّ شَيْءٍ عُرْضَةً لِلتَّغَيُّرِ فَمَا بَالُنَا بَعْدَ الْحَقِيقَةِ نَمْتَرِي
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو من أفعال القلوب ينصب مفعولين، والفاعل ضمير مستتر وجوبًا تقديره أنا
  - مفعول به أول منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«التغيّر» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«عرضة»
  - الفاء استئنافية، و«ما» اسم استفهام مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بـ«نمتري»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل نصب حال
alts: []
vary:
  - - أَرَى
    - أُرَى
author: محمود سامي البارودي
source: poetry
level: 3
ref: «أرى كل شيء عرضة للتغير»
