text: يُفَضِّلُ كَثِيرٌ مِنَ الْمُوَظَّفِينَ الْعَمَلَ مِنْ بُيُوتِهِمْ يَوْمَيْنِ فِي الْأُسْبُوعِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - ظرف زمان منصوب وعلامة نصبه الياء لأنه مثنى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
