text: تُبَاعُ فِي السُّوقِ فَوَانِيسُ مُلَوَّنَةٌ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - نائب فاعل مؤخر مرفوع وعلامة رفعه الضمة الظاهرة بلا تنوين لأنه ممنوع من الصرف (صيغة منتهى الجموع)
  - نعت مرفوع وعلامة رفعه تنوين الضم
