text: الْمَاءَ الْمَاءَ أَيُّهَا الْعَدَّاؤُونَ
irab:
  - مفعول به منصوب لفعل محذوف تقديره الزموا (إغراء)، وعلامة نصبه الفتحة الظاهرة
  - توكيد لفظي منصوب وعلامة نصبه الفتحة الظاهرة
  - منادى بحرف نداء محذوف، نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - بدل من «أيّ» مرفوع تبعًا للفظه وعلامة رفعه الواو لأنه جمع مذكر سالم
alts:
  - الْمَاءُ الْمَاءُ أَيُّهَا الْعَدَّاؤُونَ
source: llm-reviewed
