text: الْمِسْكُ مِسْكٌ فَإِنْ تُبَالِغْ فِي وَصْفِهِ لَمْ تَزِدْهُ طِيبَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الفاء استئنافية، و«إن» حرف شرط جازم مبني على السكون
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«تبالغ»
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت ألفه لالتقاء الساكنين، والفاعل ضمير مستتر تقديره أنت، والهاء ضمير متصل في محل نصب مفعول به أول، وجملة «لم تزده» في محل جزم جواب الشرط
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح، والألف للإطلاق
alts: []
vary:
  - - طِيبَا
    - طِيبًا
author: علي الجارم
source: poetry
level: 3
ref: «قالوا عليّ غدا نقيبا»
