text: وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ
irab:
  - الواو استئنافية، و«ما» نافية مبنية على السكون لا عمل لها
  - مبتدأ مرفوع وعلامة رفعه الضمة
  - نعت مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - أداة حصر لا عمل لها
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الواو حرف عطف، و«لهو» معطوف مرفوع وعلامة رفعه تنوين الضم
alts: []
source: quran
level: 2
ref: سورة الأنعام، الآية ٣٢
