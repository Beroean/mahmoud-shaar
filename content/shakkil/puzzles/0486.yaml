text: سَيُعْلَنُ اسْمُ الْفَائِزِ مَسَاءَ الْغَدِ
irab:
  - السين حرف استقبال، و«يُعلن» فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - سَيُعْلِنُ اسْمَ الْفَائِزِ مَسَاءَ الْغَدِ
source: llm-reviewed
