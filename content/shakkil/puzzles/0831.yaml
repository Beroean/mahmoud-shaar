text: لَا تُشَدُّ الرِّحَالُ إِلَّا إِلَى ثَلَاثَةِ مَسَاجِدَ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - أداة حصر مبنية على السكون لا عمل لها (استثناء مفرّغ)
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وهو من ألفاظ العدد
  - مضاف إليه (تمييز العدد) مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف على صيغة منتهى الجموع
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ١١٨٩
