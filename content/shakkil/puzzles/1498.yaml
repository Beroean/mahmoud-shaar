text: يُنْصَحُ كِبَارُ السِّنِّ بِتَمَارِينِ التَّنَفُّسِ كُلَّ صَبَاحٍ
irab:
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - الباء حرف جر، و«تمارين» اسم مجرور وعلامة جره الكسرة لأنه مضاف، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts:
  - يَنْصَحُ كِبَارَ السِّنِّ بِتَمَارِينِ التَّنَفُّسِ كُلَّ صَبَاحٍ
source: llm-reviewed
