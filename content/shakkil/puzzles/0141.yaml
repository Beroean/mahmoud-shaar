text: الْكِتَابَ قَرَأْتُهُ
irab:
  - مفعول به منصوب لفعل محذوف يفسره المذكور، تقديره «قرأتُ»، وعلامة نصبه الفتحة (اشتغال)
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير في محل رفع فاعل، والهاء ضمير في محل نصب مفعول به، والجملة تفسيرية لا محل لها
alts:
  - الْكِتَابُ قَرَأْتُهُ
author: غسان كنفاني
source: llm-reviewed
level: 3
