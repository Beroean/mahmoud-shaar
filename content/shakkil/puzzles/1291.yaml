text: إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف (اسم تفضيل)
  - اسم موصول مبني على السكون في محل جر مضاف إليه، وحُرّك بالكسر لالتقاء الساكنين
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الفتح في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة
  - خبر ثانٍ مرفوع وعلامة رفعه الضمة
alts: []
context: إحدى ابنتي الشيخ تخاطب أباها عن موسى عليه السلام
source: quran
level: 2
ref: سورة القصص، الآية ٢٦
