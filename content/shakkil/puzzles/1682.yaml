text: الطَّرِيقُ مَرْصُوفٌ جَانِبَاهُ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو اسم مفعول يعمل عمل فعله المبني للمجهول
  - نائب فاعل لاسم المفعول «مرصوف» مرفوع وعلامة رفعه الألف لأنه مثنى، وحُذفت النون للإضافة، والهاء ضمير متصل في محل جر مضاف إليه
