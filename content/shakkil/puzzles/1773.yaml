text: وَمَا هُمْ عَنْهَا بِغَائِبِينَ
irab:
  - الواو حرف عطف، و«ما» نافية حجازية تعمل عمل «ليس» مبنية على السكون
  - ضمير منفصل مبني على السكون في محل رفع اسم «ما»
  - «عن» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«غائبين»
  - الباء حرف جر زائد، و«غائبين» اسم مجرور لفظًا وعلامة جره الياء لأنه جمع مذكر سالم، منصوب محلًا خبر «ما»
alts: []
context: الحديث عن الفجّار والجحيم
source: quran
level: 2
ref: سورة الانفطار، الآية ١٦
