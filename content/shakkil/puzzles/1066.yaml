text: فَأَقْبَلَتِ امْرَأَتُهُ فِي صَرَّةٍ فَصَكَّتْ وَجْهَهَا وَقَالَتْ عَجُوزٌ عَقِيمٌ
irab:
  - الفاء حرف عطف، و«أقبل» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بمحذوف حال من «امرأته»
  - الفاء حرف عطف، و«صكّ» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والفاعل ضمير مستتر تقديره هي
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«قال» فعل ماضٍ مبني على الفتح، والتاء تاء التأنيث الساكنة، والفاعل ضمير مستتر تقديره هي
  - خبر لمبتدأ محذوف تقديره «أنا» مرفوع وعلامة رفعه تنوين الضم
  - نعت مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب مقول القول
alts: []
context: امرأة إبراهيم عليه السلام حين بُشِّر بغلام
source: quran
level: 3
