text: قَرَأْتُ كِتَابَ التَّارِيخِ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts: []
vary:
  - [قَرَأْتُ, قَرَأْتَ, قَرَأْتِ, قَرَأَتْ]
source: llm-reviewed
