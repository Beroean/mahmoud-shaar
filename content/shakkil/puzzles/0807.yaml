text: الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة، متعلق بـ«أكملت»
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع فاعل
  - اللام حرف جر، و«كم» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«أكملت»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«أتمم» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - «على» حرف جر، و«كم» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«أتممت»
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«رضي» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل
  - اللام حرف جر، و«كم» ضمير متصل في محل جر، وحُرّكت الميم بالضم لالتقاء الساكنين، وشبه الجملة متعلق بـ«رضيت»
  - مفعول به منصوب وعلامة نصبه الفتحة
  - حال منصوبة وعلامة نصبها تنوين الفتح
alts: []
context: المتكلم هو الله تعالى، والخطاب للمؤمنين
source: quran
level: 3
ref: سورة المائدة، الآية ٣
