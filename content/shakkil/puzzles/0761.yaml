text: لَا شَيْءَ أَجْمَلُ مِنْ أَنْ تَجْتَمِعَ الْعَائِلَةُ حَوْلَ مَائِدَةٍ وَاحِدَةٍ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - خبر «لا» مرفوع وعلامة رفعه الضمة دون تنوين لأنه ممنوع من الصرف (على وزن أفعل)
  - حرف جر مبني على السكون
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والمصدر المؤول في محل جر بـ«من»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - نعت مجرور وعلامة جره تنوين الكسر
alts:
  - لَا شَيْءٌ أَجْمَلَ مِنْ أَنْ تَجْتَمِعَ الْعَائِلَةُ حَوْلَ مَائِدَةٍ وَاحِدَةٍ
source: llm-reviewed
level: 3
