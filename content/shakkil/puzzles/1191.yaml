text: إِنَّ فِي الْبَحْرِ لَكُنُوزًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «إنّ» مقدم
  - اللام المزحلقة حرف توكيد مبني على الفتح، و«كنوزًا» اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
