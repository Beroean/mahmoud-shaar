text: كِلِينِي لِهَمٍّ يَا أُمَيْمَةَ نَاصِبِ وَلَيْلٍ أُقَاسِيهِ بَطِيءِ الْكَوَاكِبِ
irab:
  - فعل أمر مبني على حذف النون، وياء المخاطبة ضمير متصل في محل رفع فاعل، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به
  - اللام حرف جر، و«همّ» اسم مجرور وعلامة جره تنوين الكسر
  - حرف نداء مبني على السكون
  - منادى علم مفرد مبني على الضم المقدر في محل نصب، وفُتح هنا على نية الترخيم (أُمَيْمَ) ثم أُقحمت التاء، ويجوز الضم على القياس
  - نعت لـ«همّ» مجرور وعلامة جره الكسرة، فصل بينهما النداء
  - الواو حرف عطف، و«ليل» اسم معطوف على «همّ» مجرور وعلامة جره تنوين الكسر
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره أنا، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل جر نعت لـ«ليل»
  - نعت ثانٍ لـ«ليل» مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
alts:
  - كِلِينِي لِهَمٍّ يَا أُمَيْمَةُ نَاصِبِ وَلَيْلٍ أُقَاسِيهِ بَطِيءِ الْكَوَاكِبِ
author: النابغة الذبياني
source: poetry
level: 2
ref: «كليني لهمٍّ يا أميمة ناصب»
