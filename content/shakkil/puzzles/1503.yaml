text: كَانَ الْبَحَّارَةُ قَدِيمًا يَهْتَدُونَ بِالنُّجُومِ حِينَ تَغِيبُ الْيَابِسَةُ عَنْ أَعْيُنِهِمْ
irab:
  - فعل ماضٍ ناقص مبني على الفتح
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «كان»
  - الباء حرف جر، و«النجوم» اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل جر بالإضافة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه
