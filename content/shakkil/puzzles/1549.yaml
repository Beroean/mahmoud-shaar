text: وَإِنَّهُ فِي أُمِّ الْكِتَابِ لَدَيْنَا لَعَلِيٌّ حَكِيمٌ
irab:
  - الواو حرف عطف، و«إنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «إنّ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«عليّ»
  - مضاف إليه مجرور وعلامة جره الكسرة
  - ظرف مكان مبني على السكون في محل نصب متعلق بـ«عليّ»، وهو مضاف، و«نا» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - اللام المزحلقة للتوكيد، و«عليّ» خبر «إنّ» مرفوع وعلامة رفعه تنوين الضم
  - خبر ثانٍ مرفوع وعلامة رفعه تنوين الضم
alts: []
context: الحديث عن القرآن
source: quran
level: 2
