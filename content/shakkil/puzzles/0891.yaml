text: طَفِقَ الْبَحَّارَةُ يُصْلِحُونَ الشِّرَاعَ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «طفق» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «طفق»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
