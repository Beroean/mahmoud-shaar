text: وَقَدْ تَلْتَقِي الْأَشْتَاتُ بَعْدَ تَفَرُّقٍ وَقَدْ تُدْرَكُ الْحَاجَاتُ وَهْيَ بَعِيدُ
irab:
  - الواو استئنافية، و«قد» حرف تقليل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«قد» حرف تقليل مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حالية، و«هي» ضمير منفصل مبني على الفتح في محل رفع مبتدأ، وسُكِّنت الهاء بعد الواو للوزن (والأصل «وَهِيَ»)
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة (و«فعيل» يُخبر به عن الجمع)، والجملة في محل نصب حال
alts: []
vary:
  - - وَهْيَ
    - وَهِيَ
author: جميل بثينة
source: poetry
level: 3
ref: «ألا ليت ريعان الشباب جديد»
