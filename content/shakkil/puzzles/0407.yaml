text: أَنْتُمَا تَتَعَلَّمَانِ بِسُرْعَةٍ
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، وألف الاثنين ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - الباء حرف جر، و«سرعة» اسم مجرور وعلامة جره تنوين الكسر
