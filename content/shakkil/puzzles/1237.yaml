text: يَا ذَا الصَّوْتِ الْجَمِيلِ، غَنِّ لَنَا
irab:
  - حرف نداء مبني على السكون
  - منادى منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - فعل أمر مبني على حذف حرف العلة من آخره، والكسرة قبلها دليل عليها، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر
