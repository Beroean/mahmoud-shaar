text: وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَـٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ
irab:
  - الواو حالية، واللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة
  - الواو حرف عطف، واللام حرف جر، و«رسول» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة معطوف على «لله»
  - الواو حرف عطف، واللام حرف جر، و«المؤمنين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة معطوف على «لله»
  - الواو حرف عطف، و«لكنّ» حرف استدراك ونصب مبني على الفتح
  - اسم «لكنّ» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «لكنّ»
alts: []
context: ردّ على قول المنافقين «ليخرجنّ الأعزّ منها الأذلّ»
source: quran
level: 3
ref: سورة المنافقون، الآية ٨
