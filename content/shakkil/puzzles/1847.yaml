text: كُلُّ ابْنِ آدَمَ مَقْهُورٌ بِعَادَاتِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (العلمية والعجمة)
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - الباء حرف جر، و«عادات» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«مقهور»
alts: []
author: معروف الرصافي
source: poetry
level: 2
ref: «كل ابن آدم مقهور بعادات»
