text: احْذَرْ أَنْ يَغْلِيَ الْحَلِيبُ طَوِيلًا
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل نصب مفعول به
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نائب عن ظرف الزمان منصوب وعلامة نصبه تنوين الفتح
