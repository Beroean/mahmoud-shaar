text: إِذَا أَرَدْتَ أَنْ تَتَعَلَّمَ لُغَةً جَدِيدَةً فَاسْتَمِعْ إِلَيْهَا كُلَّ يَوْمٍ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، والجملة فعل الشرط في محل جر بإضافة «إذا» إليها
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل نصب مفعول به
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - الفاء واقعة في جواب الشرط، و«استمع» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت، والجملة جواب الشرط لا محل لها
  - «إلى» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر
  - ظرف زمان منصوب وعلامة نصبه الفتحة لإضافته إلى الزمان، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
alts: []
fixed:
  - أردت
