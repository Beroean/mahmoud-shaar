text: إِنَّا أَرْسَلْنَا عَلَيْهِمْ صَيْحَةً وَاحِدَةً فَكَانُوا كَهَشِيمِ الْمُحْتَظِرِ
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر «إنّ»
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أرسلنا»
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - الفاء حرف عطف، و«كانوا» فعل ماضٍ ناقص مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع اسم «كان»
  - الكاف حرف جر، و«هشيم» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر «كان»
  - مضاف إليه مجرور وعلامة جره الكسرة
