text: يَسْتَعْمِلُ الْإِسْكَافِيُّ إِبْرَةً غَلِيظَةً وَخَيْطًا مَتِينًا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«خيطًا» اسم معطوف منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
