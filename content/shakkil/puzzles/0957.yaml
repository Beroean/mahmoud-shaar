text: لَوْلَا الْإِشَارَاتُ لَازْدَحَمَتِ الطُّرُقُ
irab:
  - حرف امتناع لوجود مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وخبره محذوف وجوبًا تقديره موجودة
  - اللام واقعة في جواب «لولا»، و«ازدحم» فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
