text: لَا أَمْلِكُ فِي الدُّنْيَا إِلَّا عَيْنَيْكِ
irab:
  - نافية مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
  - أداة حصر لا عمل لها
  - مفعول به منصوب وعلامة نصبه الياء لأنه مثنى، وحذفت النون للإضافة، والكاف ضمير متصل في محل جر مضاف إليه
alts: []
author: نزار قباني
source: poetry
