text: بَدَأَ الْمُزَارِعُونَ يَحْصُدُونَ الْقَمْحَ حِينَ أَوْشَكَ الرَّبِيعُ أَنْ يَنْتَهِيَ
irab:
  - فعل ماضٍ ناقص من أفعال الشروع مبني على الفتح
  - اسم «بدأ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب خبر «بدأ»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح، والجملة في محل جر مضاف إليه
  - اسم «أوشك» مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل نصب خبر «أوشك»
alts: []
vary:
  - [يَحْصُدُونَ, يَحْصِدُونَ]
fixed:
  - أوشك
source: llm-reviewed
level: 3
