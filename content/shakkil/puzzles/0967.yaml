text: مَا زِلْنَا نَنْتَظِرُ نَتِيجَةَ الْفَحْصِ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل في محل رفع اسم «ما زال»
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل نصب خبر «ما زال»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
