text: لَا يُسْمَحُ لِأَحَدٍ بِدُخُولِ الْمُخْتَبَرِ إِلَّا الْعَامِلِينَ فِيهِ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«أحد» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة في محل رفع نائب فاعل
  - الباء حرف جر، و«دخول» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف استثناء مبني على السكون
  - بدل من «أحد» مجرور وعلامة جره الياء لأنه جمع مذكر سالم، ويجوز نصبه مستثنى بـ«إلا» واللفظ واحد
  - «في» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر
alts:
  - لَا يَسْمَحُ لِأَحَدٍ بِدُخُولِ الْمُخْتَبَرِ إِلَّا الْعَامِلِينَ فِيهِ
  - لَا يُسْمَحُ لِأَحَدٍ بِدُخُولِ الْمُخْتَبَرِ إِلَّا الْعَامِلَيْنِ فِيهِ
  - لَا يَسْمَحُ لِأَحَدٍ بِدُخُولِ الْمُخْتَبَرِ إِلَّا الْعَامِلَيْنِ فِيهِ
