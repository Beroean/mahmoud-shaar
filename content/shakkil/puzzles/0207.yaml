text: تَعَلَّمْ فَلَيْسَ الْمَرْءُ يُولَدُ عَالِماً
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر تقديره أنت
  - الفاء تعليلية، و«ليس» فعل ماضٍ ناقص مبني على الفتح
  - اسم «ليس» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل نصب خبر «ليس»
  - حال منصوبة وعلامة نصبها تنوين الفتح
alts: []
author: الإمام الشافعي
