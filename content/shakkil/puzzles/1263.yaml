text: قَلَّمَا يَسْتَعْمِلُ النَّاسُ الْآلَاتِ الْكَاتِبَةَ بَعْدَ انْتِشَارِ الْحَوَاسِيبِ
irab:
  - «قلّ» فعل ماضٍ مبني على الفتح، و«ما» حرف كافّ عن طلب الفاعل، والمركب يفيد النفي
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
