text: مَنْ غَشَّنَا فَلَيْسَ مِنَّا
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو، و«نا» ضمير متصل في محل نصب مفعول به
  - الفاء رابطة لجواب الشرط، و«ليس» فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - «مِن» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس»، والجملة في محل جزم جواب الشرط
alts: []
source: hadith
level: 2
ref: صحيح مسلم، الحديث ١٠١
