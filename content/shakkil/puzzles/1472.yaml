text: أَعْطَى الْمُدَرِّبُ الْمُتَدَرِّبَاتِ تَعْلِيمَاتٍ وَاضِحَةً
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به أول منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - مفعول به ثانٍ منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم
  - نعت منصوب وعلامة نصبه تنوين الفتح
