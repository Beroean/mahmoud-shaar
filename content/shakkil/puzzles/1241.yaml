text: أُطْفِئَتْ أَنْوَارُ الْمَلْعَبِ بَعْدَ الْمُبَارَاةِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
