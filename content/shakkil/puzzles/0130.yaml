text: أَرَاكَ عَصِيَّ الدَّمْعِ شِيمَتُكَ الصَّبْرُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والكاف ضمير متصل في محل نصب مفعول به أول، والفاعل ضمير مستتر تقديره أنا
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه الضمة، والجملة الاسمية في محل نصب حال
