text: ارْتَدَى الْعَامِلُ خُوذَةً حِرْصًا عَلَى سَلَامَتِهِ
irab:
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
