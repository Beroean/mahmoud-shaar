text: وَأَنَّهُ تَعَالَىٰ جَدُّ رَبِّنَا مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا
irab:
  - الواو حرف عطف، و«أنّ» حرف توكيد ونصب مبني على الفتح، والهاء ضمير الشأن مبني على الضم في محل نصب اسم «أنّ»
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والجملة في محل رفع خبر «أنّ»
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - نافية لا عمل لها مبنية على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة استئنافية لا محل لها
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«لا» زائدة لتأكيد النفي مبنية على السكون
  - معطوف على «صاحبة» منصوب وعلامة نصبه تنوين الفتح
