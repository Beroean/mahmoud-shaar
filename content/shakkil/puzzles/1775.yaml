text: وَتُحِبُّونَ الْمَالَ حُبًّا جَمًّا
irab:
  - الواو حرف عطف، و«تحبون» فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
context: الخطاب للذين لا يُكرمون اليتيم
source: quran
ref: سورة الفجر، الآية ٢٠
