text: يَعْلَمُ خَائِنَةَ الْأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل نصب معطوف على «خائنة»
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والجملة صلة الموصول لا محل لها، والعائد محذوف (تخفيه)
  - فاعل مرفوع وعلامة رفعه الضمة
alts: []
context: الحديث عن الله تعالى
source: quran
ref: سورة غافر، الآية ١٩
