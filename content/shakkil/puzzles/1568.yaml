text: حَتَّىٰ إِذَا رَأَوْا مَا يُوعَدُونَ فَسَيَعْلَمُونَ مَنْ أَضْعَفُ نَاصِرًا وَأَقَلُّ عَدَدًا
irab:
  - حرف ابتداء وغاية مبني على السكون
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل جر بالإضافة
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع نائب فاعل، والجملة صلة الموصول لا محل لها
  - الفاء رابطة لجواب الشرط، والسين حرف استقبال، و«يعلمون» فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة جواب شرط غير جازم لا محل لها
  - اسم استفهام مبني على السكون في محل رفع مبتدأ، والجملة سدّت مسدّ مفعولي «يعلمون»
  - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)
  - تمييز منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«أقلّ» اسم معطوف مرفوع وعلامة رفعه الضمة
  - تمييز منصوب وعلامة نصبه تنوين الفتح
