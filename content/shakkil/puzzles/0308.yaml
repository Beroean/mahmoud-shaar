text: رَبِحَ الْفَرِيقُ سَبْعَ مُبَارَيَاتٍ مُتَتَالِيَةٍ، وَلَمْ يَخْسَرْ إِلَّا مُبَارَاةً وَاحِدَةً
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والعدد يخالف المعدود
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو تمييز العدد
  - نعت مجرور وعلامة جره تنوين الكسر
  - الواو حرف عطف، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - أداة حصر مبنية على السكون
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
