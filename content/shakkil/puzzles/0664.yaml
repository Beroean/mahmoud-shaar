text: زَارَنَا أَخُو سَلْمَى
irab:
  - فعل ماضٍ مبني على الفتح، و«نا» ضمير متصل في محل نصب مفعول به مقدم
  - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة المقدرة على الألف للتعذر نيابة عن الكسرة لأنه ممنوع من الصرف (ألف التأنيث المقصورة)
