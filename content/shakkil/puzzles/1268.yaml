text: اعْتَادَتِ الْجَدَّةُ أَنْ تَصْنَعَ الْمُرَبَّى مِنْ ثِمَارِ السَّفَرْجَلِ فِي الْخَرِيفِ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون، والمصدر المؤول في محل نصب مفعول به
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
