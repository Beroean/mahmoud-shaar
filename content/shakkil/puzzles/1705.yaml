text: يَجِبُ أَنْ يُطْفِئَ آخِرُ الْخَارِجِينَ الْأَضْوَاءَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والمصدر المؤول في محل رفع فاعل «يجب»
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
