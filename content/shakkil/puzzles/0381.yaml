text: كُلُّ مَنْ عَلَيْهَا فَانٍ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف
  - اسم موصول مبني على السكون في محل جر مضاف إليه
  - «على» حرف جر، و«ها» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف صلة الموصول
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لأنه اسم منقوص، والتنوين تنوين عوض
alts: []
source: quran
ref: سورة الرحمن، الآية ٢٦
