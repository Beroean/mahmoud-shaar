text: كَانَتِ الْقِطَارَاتُ الْبُخَارِيَّةُ بَطِيئَةً وَصَاخِبَةً
irab:
  - فعل ماضٍ ناقص مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كان» مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«صاخبة» معطوف على «بطيئة» منصوب وعلامة نصبه تنوين الفتح
