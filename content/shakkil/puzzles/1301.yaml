text: وَحُمِلَتِ الْأَرْضُ وَالْجِبَالُ فَدُكَّتَا دَكَّةً وَاحِدَةً
irab:
  - الواو حرف عطف، و«حُمل» فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث الساكنة، وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة
  - الواو حرف عطف، و«الجبال» اسم معطوف على «الأرض» مرفوع وعلامة رفعه الضمة
  - الفاء حرف عطف، و«دُكّ» فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء تاء التأنيث، والألف ضمير متصل في محل رفع نائب فاعل
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 3
ref: سورة الحاقة، الآية ١٤
