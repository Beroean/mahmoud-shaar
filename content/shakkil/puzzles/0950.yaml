text: يَبْدُو أَنَّ الْمَطَرَ قَادِمٌ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل
  - حرف توكيد ونصب مبني على الفتح، والمصدر المؤول من «أنّ» ومعموليها في محل رفع فاعل
  - اسم «أنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «أنّ» مرفوع وعلامة رفعه تنوين الضم
