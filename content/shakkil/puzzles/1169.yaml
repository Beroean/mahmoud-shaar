text: أَنْتِ تُتْقِنِينَ الْحِيَاكَةَ
irab:
  - ضمير منفصل مبني على الكسر في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
fixed:
  - أنت
