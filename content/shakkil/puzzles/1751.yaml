text: لَا تَضَعُوا الْأَطْعِمَةَ السَّاخِنَةَ فِي الثَّلَّاجَةِ قَبْلَ أَنْ تَبْرُدَ
irab:
  - «لا» الناهية حرف جزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - نعت منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هي، والمصدر المؤول في محل جر مضاف إليه
