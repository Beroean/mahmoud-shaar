text: لَا تَنْسَوْا أَنْ تُطْفِئُوا الْأَنْوَارَ قَبْلَ أَنْ تُغَادِرُوا الْمَكْتَبَ
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
