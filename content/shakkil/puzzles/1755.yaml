text: مَا زَالَتْ بَعْضُ الْقُرَى الْجَبَلِيَّةِ تَعْتَمِدُ عَلَى مِيَاهِ الْيَنَابِيعِ
irab:
  - حرف نفي مبني على السكون
  - فعل ماضٍ ناقص مبني على الفتح، والتاء تاء التأنيث الساكنة
  - اسم «ما زال» مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر (اسم مقصور)
  - نعت مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «ما زال»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
