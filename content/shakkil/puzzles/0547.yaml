text: أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ
irab:
  - الهمزة للاستفهام التقريري، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اسم استفهام مبني على الفتح في محل نصب حال
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«أصحاب» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«فعل»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
source: quran
level: 3
ref: سورة الفيل، الآية ١
