text: عِنْدَمَا يَنْخَفِضُ الضَّغْطُ الْجَوِّيُّ تَتَكَوَّنُ الْغُيُومُ وَيَزْدَادُ احْتِمَالُ هُطُولِ الْأَمْطَارِ
irab:
  - «عند» ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«ما» حرف مصدري مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والمصدر المؤول في محل جر مضاف إليه
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - نعت مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حرف عطف، و«يزداد» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
