text: لَا تَتْرُكِي الْبَابَ مَفْتُوحًا
irab:
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وياء المخاطبة ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
