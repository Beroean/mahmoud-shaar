text: إِذْ نَادَاهُ رَبُّهُ بِالْوَادِ الْمُقَدَّسِ طُوًى
irab:
  - ظرف لما مضى من الزمان مبني على السكون في محل نصب
  - «نادى» فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والهاء ضمير متصل في محل نصب مفعول به مقدم
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، والجملة في محل جر بإضافة «إذ» إليها
  - الباء حرف جر، و«الواد» اسم مجرور وعلامة جره الكسرة المقدرة على الياء المحذوفة، وشبه الجملة متعلق بـ«ناداه»
  - نعت مجرور وعلامة جره الكسرة
  - بدل من «الواد» مجرور وعلامة جره الكسرة المقدرة على الألف المحذوفة للتعذر
alts: []
context: الله تعالى ينادي موسى عليه السلام
source: quran
level: 2
ref: سورة النازعات، الآية ١٦
