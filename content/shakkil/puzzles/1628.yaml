text: نُظِّفَتِ الْغُرَفُ كُلُّهَا
irab:
  - فعل ماضٍ مبني للمجهول مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - توكيد معنوي مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف، و«ها» ضمير متصل في محل جر مضاف إليه
alts:
  - نَظَّفَتِ الْغُرَفَ كُلَّهَا
  - نَظُفَتِ الْغُرَفُ كُلُّهَا
source: llm-reviewed
