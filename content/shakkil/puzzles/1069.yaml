text: إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ
irab:
  - أداة استثناء مبنية على السكون
  - اسم موصول مبني على الفتح في محل نصب مستثنى
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - الواو حرف عطف، و«عملوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الكسرة عوضًا عن الفتحة لأنه جمع مؤنث سالم
  - الواو حرف عطف، و«تواصوا» فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«الحق» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تواصوا»
  - الواو حرف عطف، و«تواصوا» فعل ماضٍ مبني على الفتح المقدر على الألف المحذوفة لالتقاء الساكنين، والواو ضمير متصل في محل رفع فاعل
  - الباء حرف جر، و«الصبر» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«تواصوا»
alts: []
context: استثناء من قوله قبلها «إن الإنسان لفي خسر»
source: quran
level: 3
ref: سورة العصر، الآية ٣
