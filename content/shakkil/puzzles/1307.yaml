text: إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ إِلَّا مَنِ اتَّبَعَكَ مِنَ الْغَاوِينَ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ ناقص جامد مبني على الفتح
  - اللام حرف جر، والكاف ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس» مقدم
  - «على» حرف جر، و«هم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«سلطان»
  - اسم «ليس» مؤخر مرفوع وعلامة رفعه تنوين الضم، وجملة «ليس» ومعموليها في محل رفع خبر «إنّ»
  - أداة استثناء مبنية على السكون
  - اسم موصول مبني على السكون في محل نصب مستثنى، وحُرّك بالكسر لالتقاء الساكنين
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والكاف ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم، وشبه الجملة متعلق بمحذوف حال من فاعل «اتبعك»
