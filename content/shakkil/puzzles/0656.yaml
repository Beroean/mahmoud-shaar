text: لِيَنَمِ الْأَطْفَالُ مُبَكِّرًا
irab:
  - اللام لام الأمر حرف جزم مبني على الكسر، و«ينم» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، وحُذفت الألف لالتقاء الساكنين، وحُرّك بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حال منصوبة وعلامة نصبها تنوين الفتح
