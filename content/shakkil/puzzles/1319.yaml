text: نُورُهُمْ يَسْعَىٰ بَيْنَ أَيْدِيهِمْ وَبِأَيْمَانِهِمْ يَقُولُونَ رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، متعلق بـ«يسعى»
  - مضاف إليه مجرور وعلامة جره الكسرة المقدرة على الياء للثقل، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، والباء حرف جر، و«أيمان» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه، وشبه الجملة معطوف على الظرف «بين»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل نصب حال
  - منادى بأداة نداء محذوفة منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - فعل دعاء بصيغة الأمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أتمم»
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«اغفر» فعل دعاء بصيغة الأمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - اللام حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«اغفر»
