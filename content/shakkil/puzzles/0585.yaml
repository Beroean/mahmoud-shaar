text: مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ فِيهِ فَهُوَ رَدٌّ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - اسم إشارة مبني على السكون في محل جر بدل من «أمر»
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها من الإعراب
  - «في» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليس»
  - الفاء رابطة لجواب الشرط، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه تنوين الضم، والجملة في محل جزم جواب الشرط
