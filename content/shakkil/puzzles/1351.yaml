text: ثَاوٍ عَلَى صَخْرٍ أَصَمَّ وَلَيْتَ لِي قَلْبًا كَهٰذِي الصَّخْرَةِ الصَّمَّاءِ
irab:
  - خبر لمبتدأ محذوف تقديره «أنا» مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لأنه اسم منقوص
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«ثاوٍ»
  - نعت مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف (الوصفية ووزن «أفعل»)
  - الواو استئنافية، و«ليت» حرف تمنٍّ ونصب مبني على الفتح
  - اللام حرف جر، والياء ضمير متصل في محل جر، وشبه الجملة متعلق بمحذوف خبر «ليت» مقدم
  - اسم «ليت» مؤخر منصوب وعلامة نصبه تنوين الفتح
  - الكاف حرف جر، و«هذي» اسم إشارة مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف نعت لـ«قلبًا»
  - بدل من اسم الإشارة مجرور وعلامة جره الكسرة الظاهرة
  - نعت مجرور وعلامة جره الكسرة الظاهرة، وهو ممنوع من الصرف (ألف التأنيث الممدودة) لكنه جُرّ بالكسرة لدخول «ال» عليه
alts: []
author: خليل مطران
source: poetry
level: 3
ref: المساء
