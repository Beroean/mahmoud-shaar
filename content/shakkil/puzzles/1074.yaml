text: الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى
  - الباء حرف جر، و«الخيار» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر
  - مصدرية ظرفية مبنية على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون، وألف الاثنين ضمير متصل في محل رفع فاعل
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٢٠٧٩
