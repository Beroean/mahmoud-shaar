text: أُحِبُّ الْفَاكِهَةَ وَلَا سِيَّمَا الْعِنَبِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره أنا
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - الواو اعتراضية، و«لا» نافية للجنس مبنية على السكون
  - «سيّ» اسم «لا» مبني على الفتح في محل نصب، و«ما» زائدة، وخبر «لا» محذوف
  - مضاف إليه مجرور وعلامة جره الكسرة (ويجوز رفعه خبرًا لمبتدأ محذوف، ونصبه مفعولًا لفعل محذوف)
alts:
  - أُحِبُّ الْفَاكِهَةَ وَلَا سِيَّمَا الْعِنَبُ
  - أُحِبُّ الْفَاكِهَةَ وَلَا سِيَّمَا الْعِنَبَ
author: غسان كنفاني
source: llm-reviewed
level: 3
