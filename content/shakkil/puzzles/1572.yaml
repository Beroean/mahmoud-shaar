text: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ
irab:
  - فعل ماضٍ مبني للمجهول مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني على الضم في محل رفع نائب فاعل
  - ضمير منفصل مبني على السكون في محل رفع توكيد للتاء
  - الواو واو المعية، و«الساعة» مفعول معه منصوب وعلامة نصبه الفتحة الظاهرة
  - الكاف حرف جر وتشبيه، و«هاتين» اسم إشارة للمثنى المؤنث مجرور وعلامة جره الياء لأنه ملحق بالمثنى، وشبه الجملة متعلق بمحذوف حال
alts:
  - بُعِثْتُ أَنَا وَالسَّاعَةُ كَهَاتَيْنِ
fixed:
  - بعثت
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٦٥٠٤
