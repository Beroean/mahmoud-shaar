text: آيَةُ الْمُنَافِقِ ثَلَاثٌ، إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم، وهو من ألفاظ العدد
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة جواب شرط غير جازم لا محل لها من الإعراب
  - الواو حرف عطف، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة جواب شرط غير جازم لا محل لها من الإعراب
  - الواو حرف عطف، و«إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب
  - فعل ماضٍ مبني للمجهول مبني على الفتح، ونائب الفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة جواب شرط غير جازم لا محل لها من الإعراب
