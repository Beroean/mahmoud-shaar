text: وَالْقَمَرَ قَدَّرْنَاهُ مَنَازِلَ حَتَّىٰ عَادَ كَالْعُرْجُونِ الْقَدِيمِ
irab:
  - الواو حرف عطف، و«القمر» مفعول به منصوب على الاشتغال لفعل محذوف يفسّره ما بعده تقديره «قدّرنا»، وعلامة نصبه الفتحة
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا»، و«نا» ضمير متصل مبني على السكون في محل رفع فاعل، والهاء ضمير متصل مبني على الضم في محل نصب مفعول به، والجملة تفسيرية لا محل لها
  - ظرف مكان منصوب وعلامة نصبه الفتحة، ولم يُنوَّن لأنه ممنوع من الصرف على صيغة منتهى الجموع، متعلق بـ«قدّرناه»
  - حرف ابتداء وغاية مبني على السكون
  - فعل ماضٍ ناقص بمعنى «صار» مبني على الفتح، واسمه ضمير مستتر تقديره هو
  - الكاف حرف جر، و«العرجون» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف خبر «عاد»
  - نعت مجرور وعلامة جره الكسرة
