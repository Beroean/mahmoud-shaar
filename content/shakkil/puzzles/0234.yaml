text: نَعِيبُ زَمَانَنَا وَالْعَيْبُ فِينَا وَمَا لِزَمَانِنَا عَيْبٌ سِوَانَا
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
  - الواو حالية، و«العيب» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - «في» حرف جر، و«نا» ضمير متصل في محل جر، وشبه الجملة في محل رفع خبر، والجملة في محل نصب حال
  - الواو حرف عطف، و«ما» حرف نفي مبني على السكون
  - اللام حرف جر، و«زمان» اسم مجرور، وهو مضاف، و«نا» مضاف إليه، وشبه الجملة في محل رفع خبر مقدّم
  - مبتدأ مؤخر مرفوع وعلامة رفعه تنوين الضم
  - نعت لـ«عيب» مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
