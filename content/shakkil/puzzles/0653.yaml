text: رَجَعَ الْوَلَدُ وَهُوَ يَضْحَكُ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو واو الحال، و«هو» ضمير منفصل مبني على الفتح في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والجملة في محل رفع خبر، والجملة الاسمية في محل نصب حال
