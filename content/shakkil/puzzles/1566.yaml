text: يَوْمَ يُسْحَبُونَ فِي النَّارِ عَلَىٰ وُجُوهِهِمْ ذُوقُوا مَسَّ سَقَرَ
irab:
  - ظرف زمان منصوب وعلامة نصبه الفتحة متعلق بقول مقدّر (يُقال لهم)، وهو مضاف
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل مبني على السكون في محل رفع نائب فاعل، والجملة في محل جر مضاف إليه
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يُسحبون»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«هم» ضمير متصل مبني على السكون في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف حال
  - فعل أمر مبني على حذف النون، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل نصب مقول القول المقدّر
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والتأنيث
alts: []
context: الحديث عن المجرمين
source: quran
level: 3
ref: سورة القمر، الآية ٤٨
