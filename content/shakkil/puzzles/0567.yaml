text: يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ
irab:
  - حرف نداء مبني على السكون
  - «أيّ» منادى نكرة مقصودة مبني على الضم في محل نصب، و«ها» حرف تنبيه
  - اسم موصول مبني على الفتح في محل رفع بدل من «أيّ»
  - فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل في محل رفع فاعل، والجملة صلة الموصول لا محل لها
  - فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«اسجدوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«اعبدوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«افعلوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة
  - «لعلّ» حرف ترجٍّ ونصب مبني على الفتح، و«كم» ضمير متصل في محل نصب اسم «لعلّ»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر «لعلّ»
