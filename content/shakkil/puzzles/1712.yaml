text: يَبْدُو الْجَبَلُ مِنْ بَعِيدٍ كَأَنَّهُ غَيْمَةٌ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الواو للثقل
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره تنوين الكسر
  - حرف تشبيه ونصب مبني على الفتح، والهاء ضمير متصل مبني على الضم في محل نصب اسم «كأنّ»
  - خبر «كأنّ» مرفوع وعلامة رفعه تنوين الضم، والجملة في محل نصب حال
