text: حَضَرَ الضُّيُوفُ سِوَى عَمِّي
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اسم استثناء منصوب على الاستثناء وعلامة نصبه الفتحة المقدرة على الألف للتعذر، وهو مضاف
  - مضاف إليه مجرور (وهو المستثنى) وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم منع من ظهورها اشتغال المحل بحركة المناسبة، والياء ضمير متصل في محل جر مضاف إليه
