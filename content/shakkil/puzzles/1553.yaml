text: وَجَعَلَ الْقَمَرَ فِيهِنَّ نُورًا وَجَعَلَ الشَّمْسَ سِرَاجًا
irab:
  - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به أول منصوب وعلامة نصبه الفتحة
  - «في» حرف جر، و«هنّ» ضمير متصل مبني على الفتح في محل جر، وشبه الجملة متعلق بـ«جعل»
  - مفعول به ثانٍ منصوب وعلامة نصبه تنوين الفتح
  - الواو حرف عطف، و«جعل» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - مفعول به أول منصوب وعلامة نصبه الفتحة
