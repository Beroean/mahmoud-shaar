text: إِنَّنَا، أَبْنَاءَ الْقَرْيَةِ، نَعْتَزُّ بِتُرَاثِنَا
irab:
  - «إنّ» حرف توكيد ونصب مبني على الفتح، و«نا» ضمير متصل مبني على السكون في محل نصب اسم «إنّ»
  - مفعول به منصوب على الاختصاص لفعل محذوف تقديره أخصّ، وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر وجوبًا تقديره نحن، والجملة في محل رفع خبر «إنّ»
  - الباء حرف جر، و«تراث» اسم مجرور وعلامة جره الكسرة، وهو مضاف، و«نا» ضمير متصل في محل جر مضاف إليه
