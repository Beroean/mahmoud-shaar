text: مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - «من» حرف جر، و«كم» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بمحذوف حال
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - الفاء واقعة في جواب الشرط، واللام لام الأمر، و«يغيّر» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، والهاء ضمير متصل في محل نصب مفعول به، والجملة في محل جزم جواب الشرط
  - الباء حرف جر، و«يد» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
source: hadith
level: 3
ref: صحيح مسلم، الحديث ٤٩
