text: عَلَى هَذِهِ الْأَرْضِ مَا يَسْتَحِقُّ الْحَيَاةَ
irab:
  - حرف جر مبني على السكون المقدر على الألف
  - اسم إشارة مبني على الكسر في محل جر، وشبه الجملة في محل رفع خبر مقدّم
  - بدل مجرور وعلامة جره الكسرة الظاهرة
  - اسم موصول مبني على السكون في محل رفع مبتدأ مؤخر
  - فعل مضارع مرفوع، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
alts: []
author: محمود درويش
