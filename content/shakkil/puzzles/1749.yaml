text: لَمْ يَمْنَعْ غَلَاءُ الْأَسْعَارِ النَّاسَ مِنَ التَّسَوُّقِ قُبَيْلَ الْعِيدِ
irab:
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف، وهو تصغير «قبل»
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
