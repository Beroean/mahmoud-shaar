text: لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ
irab:
  - حرف نفي مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - حرف غاية وجر مبني على السكون
  - فعل مضارع منصوب بـ«أن» المضمرة بعد «حتى» وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره هو
  - اللام حرف جر، و«أخي» اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - اللام حرف جر، و«نفس» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
