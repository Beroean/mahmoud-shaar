text: عَادَ أَبُو مَازِنٍ مِنَ السُّوقِ مُتْعَبًا
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حال منصوب وعلامة نصبه تنوين الفتح
