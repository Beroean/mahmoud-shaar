text: وَمَنْ لَمْ يَمُتْ بِالسَّيْفِ مَاتَ بِغَيْرِهِ تَعَدَّدَتِ الْأَسْبَابُ وَالْمَوْتُ وَاحِدُ
irab:
  - الواو استئنافية، و«مَن» اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الواو لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو، والجملة فعل الشرط
  - الباء حرف جر، و«السيف» اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يمت»
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو، وجملتا الشرط والجواب في محل رفع خبر
  - الباء حرف جر، و«غير» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، وحُرِّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو حالية، و«الموت» مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل نصب حال
