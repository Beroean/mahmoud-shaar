text: هُمْ يَلْعَبُونَ الْكُرَةَ
irab:
  - ضمير منفصل مبني على السكون في محل رفع مبتدأ
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون لأنه من الأفعال الخمسة، وواو الجماعة ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
