text: انْطَفَأَتِ الْمَصَابِيحُ غَيْرَ مِصْبَاحٍ وَاحِدٍ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - «غير» اسم بمعنى «إلا» منصوب على الاستثناء وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره تنوين الكسر، وهو المستثنى في المعنى
  - نعت مجرور وعلامة جره تنوين الكسر
