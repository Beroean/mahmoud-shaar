text: إِذَا أَرَدْتَ أَنْ تَحْمِيَ أَسْنَانَكَ فَقَلِّلْ مِنَ الْحَلْوَى
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل مبني في محل رفع فاعل، والجملة في محل جر بالإضافة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره أنت، والمصدر المؤول في محل نصب مفعول به
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب الشرط، و«قلّل» فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة المقدرة على الألف للتعذر
alts: []
fixed:
  - أردت
  - أسنانك
