text: وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ
irab:
  - الواو حرف عطف، و«أطيعوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل
  - لفظ الجلالة مفعول به منصوب وعلامة نصبه الفتحة
  - الواو حرف عطف، و«رسول» معطوف منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الواو حرف عطف، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الفاء سببية، و«تفشلوا» فعل مضارع منصوب بـ«أن» المضمرة بعد فاء السببية في جواب النهي، وعلامة نصبه حذف النون، والواو ضمير متصل في محل رفع فاعل
  - الواو حرف عطف، و«تذهب» فعل مضارع معطوف على «تفشلوا» منصوب وعلامة نصبه الفتحة
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
