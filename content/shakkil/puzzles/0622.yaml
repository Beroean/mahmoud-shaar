text: يَجِبُ عَلَى الطُّهَاةِ أَنْ يَغْسِلُوا أَيْدِيَهُمْ جَيِّدًا قَبْلَ لَمْسِ الطَّعَامِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل، والمصدر المؤول في محل رفع فاعل «يجب»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة على الياء لأنه اسم منقوص، وهو مضاف، و«هم» ضمير متصل في محل جر مضاف إليه
  - نائب عن المفعول المطلق منصوب وعلامة نصبه تنوين الفتح (صفة لمصدر محذوف)
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
