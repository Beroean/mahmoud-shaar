text: إِنَّ السَّقِيمَ زَمَانُهُ لَا جِسْمُهُ
irab:
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة الظاهرة
  - خبر «إنّ» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - حرف عطف ونفي مبني على السكون
  - معطوف على «زمانه» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts: []
author: ابن هانئ الأندلسي
source: poetry
ref: «قل للمليك ابن الملوك الصيد»
