text: يَعْمَلُ الْمُتَطَوِّعُونَ مَجَّانًا خِدْمَةً لِلْحَيِّ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - حال منصوب وعلامة نصبه تنوين الفتح
  - مفعول لأجله منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«الحيّ» اسم مجرور وعلامة جره الكسرة الظاهرة
