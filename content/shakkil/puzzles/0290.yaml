text: صَفَّقَ الْجُمْهُورُ لِلْعَازِفِينَ تَصْفِيقًا حَارًّا فِي الْمَسْرَحِ
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - اللام حرف جر، و«العازفين» اسم مجرور وعلامة جره الياء لأنه جمع مذكر سالم
  - مفعول مطلق منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
