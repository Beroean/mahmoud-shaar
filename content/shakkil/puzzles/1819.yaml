text: إِذَا عَطَسَ أَحَدُكُمْ فَلْيَقُلِ الْحَمْدُ لِلَّهِ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب
  - فعل ماضٍ مبني على الفتح، والجملة في محل جر بإضافة «إذا» إليها
  - فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«كم» ضمير متصل في محل جر مضاف إليه
  - الفاء رابطة لجواب الشرط، واللام لام الأمر، و«يقل» فعل مضارع مجزوم بلام الأمر وعلامة جزمه السكون، وحُرّك بالكسر لالتقاء الساكنين، والفاعل ضمير مستتر تقديره هو
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، والجملة في محل نصب مقول القول
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر
alts: []
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٦٢٢٤
