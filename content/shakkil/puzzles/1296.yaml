text: أَمْ لَمْ يُنَبَّأْ بِمَا فِي صُحُفِ مُوسَىٰ
irab:
  - حرف عطف (أم المنقطعة) مبني على السكون
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه السكون، ونائب الفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«ينبأ»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف صلة الموصول
  - مضاف إليه مجرور وعلامة جره الفتحة المقدرة على الألف للتعذر، لأنه ممنوع من الصرف للعلمية والعجمة
alts: []
context: الحديث عن الذي تولّى وأعطى قليلًا وأكدى
source: quran
level: 3
ref: سورة النجم، الآية ٣٦
