text: أَمْسَى الْجَبَلُ مُغَطًّى بِالثَّلْجِ
irab:
  - فعل ماضٍ ناقص مبني على الفتح المقدر على الألف للتعذر
  - اسم «أمسى» مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر «أمسى» منصوب وعلامة نصبه الفتحة المقدرة على الألف المحذوفة لالتقاء الساكنين، منع من ظهورها التعذر، لأنه اسم مقصور منوّن
  - الباء حرف جر، و«الثلج» اسم مجرور وعلامة جره الكسرة الظاهرة
