text: الْخَيْلُ وَاللَّيْلُ وَالْبَيْدَاءُ تَعْرِفُنِي
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - الواو عاطفة، و«الليل» معطوف مرفوع وعلامة رفعه الضمة
  - الواو عاطفة، و«البيداء» معطوف مرفوع وعلامة رفعه الضمة
  - فعل مضارع مرفوع، والنون للوقاية، والياء ضمير متصل في محل نصب مفعول به، والفاعل ضمير مستتر تقديره هي، والجملة في محل رفع خبر
alts: []
author: المتنبي
source: poetry
level: 2
