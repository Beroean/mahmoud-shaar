text: تَفَتَّحَتِ الْأَزْهَارُ إِلَّا الْيَاسَمِينَ
irab:
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - فاعل مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف استثناء مبني على السكون
  - مستثنى منصوب وعلامة نصبه الفتحة الظاهرة
alts:
  - تَفَتَّحَتِ الْأَزْهَارُ إِلَّا الْيَاسِمِينَ
source: llm-reviewed
