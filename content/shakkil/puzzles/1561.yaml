text: قُلْ هَلْ يَسْتَوِي الْأَعْمَىٰ وَالْبَصِيرُ أَمْ هَلْ تَسْتَوِي الظُّلُمَاتُ وَالنُّورُ
irab:
  - فعل أمر مبني على السكون، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف استفهام مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - الواو حرف عطف، و«البصير» اسم معطوف مرفوع وعلامة رفعه الضمة
  - حرف عطف بمعنى «بل» (منقطعة) مبني على السكون
  - حرف استفهام مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - فاعل مرفوع وعلامة رفعه الضمة
  - الواو حرف عطف، و«النور» اسم معطوف مرفوع وعلامة رفعه الضمة
alts: []
context: الخطاب للنبي ﷺ يحاجّ المشركين
source: quran
level: 2
ref: سورة الرعد، الآية ١٦
