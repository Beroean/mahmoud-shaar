text: الْحُمَّى مِنْ فَيْحِ جَهَنَّمَ فَابْرُدُوهَا بِالْمَاءِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر
  - مضاف إليه مجرور وعلامة جره الفتحة نيابة عن الكسرة لأنه ممنوع من الصرف للعلمية والتأنيث
  - الفاء حرف عطف، و«ابردوا» فعل أمر مبني على حذف النون، والواو ضمير متصل في محل رفع فاعل، و«ها» ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«الماء» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«ابردوا»
alts:
  - الْحُمَّى مِنْ فَيْحِ جَهَنَّمَ فَابْرِدُوهَا بِالْمَاءِ
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٥٧٢٥
