text: يُسَبِّحُ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ الْمَلِكِ الْقُدُّوسِ الْعَزِيزِ الْحَكِيمِ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«يسبح»
  - اسم موصول مبني على السكون في محل رفع فاعل
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل رفع معطوف على «ما»
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
  - نعت للفظ الجلالة مجرور وعلامة جره الكسرة
  - نعت ثانٍ مجرور وعلامة جره الكسرة
  - نعت ثالث مجرور وعلامة جره الكسرة
  - نعت رابع مجرور وعلامة جره الكسرة
alts: []
source: quran
level: 2
ref: سورة الجمعة، الآية ١
