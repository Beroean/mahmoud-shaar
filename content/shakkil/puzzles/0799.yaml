text: أَلَا إِنَّ حِزْبَ اللَّهِ هُمُ الْمُفْلِحُونَ
irab:
  - حرف استفتاح وتنبيه مبني على السكون
  - حرف توكيد ونصب مبني على الفتح
  - اسم «إنّ» منصوب وعلامة نصبه الفتحة، وهو مضاف
  - لفظ الجلالة مضاف إليه مجرور وعلامة جره الكسرة
  - ضمير فصل مبني على السكون لا محل له من الإعراب، وحُرّك بالضم لالتقاء الساكنين
  - خبر «إنّ» مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
alts: []
source: quran
level: 2
ref: سورة المجادلة، الآية ٢٢
