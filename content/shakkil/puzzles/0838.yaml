text: خَيْرُ النَّاسِ قَرْنِي، ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ الَّذِينَ يَلُونَهُمْ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه
  - حرف عطف مبني على الفتح
  - اسم موصول مبني على الفتح في محل رفع معطوف على «قرني»
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو فاعل، و«هم» ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها من الإعراب
  - حرف عطف مبني على الفتح
  - اسم موصول مبني على الفتح في محل رفع معطوف
  - فعل مضارع مرفوع وعلامة رفعه ثبوت النون، والواو فاعل، و«هم» ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها من الإعراب
