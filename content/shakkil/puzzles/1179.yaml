text: سَكَنَّا مَنْزِلًا وَاسِعَةً نَوَافِذُهُ
irab:
  - فعل ماضٍ مبني على السكون لاتصاله بـ«نا» الفاعلين، و«نا» ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
  - نعت سببي منصوب وعلامة نصبه تنوين الفتح
  - فاعل لاسم الفاعل «واسعة» مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
