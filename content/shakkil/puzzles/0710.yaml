text: كَمْ يَوْمًا بَقِيَ عَلَى الْعُطْلَةِ؟
irab:
  - اسم استفهام مبني على السكون في محل رفع مبتدأ
  - تمييز «كم» الاستفهامية منصوب وعلامة نصبه تنوين الفتح
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو يعود على «كم»، والجملة في محل رفع خبر
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
