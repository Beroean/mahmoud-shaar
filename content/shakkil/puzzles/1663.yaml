text: لِيَمْشِ الْمَرْضَى قَلِيلًا
irab:
  - اللام لام الأمر حرف جزم مبني على الكسر، و«يمشِ» فعل مضارع مجزوم بلام الأمر وعلامة جزمه حذف حرف العلة (الياء)
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر (اسم مقصور)
  - صفة لمصدر محذوف (نائب عن المفعول المطلق) منصوب وعلامة نصبه تنوين الفتح
