text: إِنَّ مَعَ الْعُسْرِ يُسْرًا
irab:
  - حرف توكيد ونصب مبني على الفتح
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، وشبه الجملة في محل رفع خبر «إنّ» مقدّم
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - اسم «إنّ» مؤخر منصوب وعلامة نصبه تنوين الفتح
alts: []
source: quran
level: 2
ref: سورة الشرح، الآية ٦
