text: وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِشِمَالِهِ فَيَقُولُ يَا لَيْتَنِي لَمْ أُوتَ كِتَابِيَهْ
irab:
  - الواو حرف عطف، و«أمّا» حرف شرط وتفصيل مبني على السكون
  - اسم موصول مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني للمجهول مبني على الفتح، ونائب الفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
  - الباء حرف جر، و«شمال» اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أوتي»
  - الفاء واقعة في جواب «أمّا»، و«يقول» فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر المبتدأ
  - حرف تنبيه مبني على السكون
  - حرف تمنٍّ ونصب مبني على الفتح، والنون للوقاية، والياء ضمير متصل مبني على السكون في محل نصب اسم «ليت»
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، ونائب الفاعل ضمير مستتر وجوبًا تقديره أنا، والجملة في محل رفع خبر «ليت»
  - مفعول به ثانٍ منصوب وعلامة نصبه الفتحة المقدرة على ما قبل ياء المتكلم، والياء ضمير متصل مبني على الفتح في محل جر مضاف إليه، والهاء للسكت
