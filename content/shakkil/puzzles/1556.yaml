text: إِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا قَالَ أَسَاطِيرُ الْأَوَّلِينَ
irab:
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط، مبني على السكون في محل نصب متعلق بجوابه
  - فعل مضارع مبني للمجهول مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر، والجملة في محل جر بالإضافة
  - «على» حرف جر، والهاء ضمير متصل مبني على الكسر في محل جر، وشبه الجملة متعلق بـ«تُتلى»
  - نائب فاعل مرفوع وعلامة رفعه الضمة، وهو مضاف، و«نا» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة جواب شرط غير جازم لا محل لها
  - خبر لمبتدأ محذوف تقديره «هي» مرفوع وعلامة رفعه الضمة، وهو ممنوع من الصرف على صيغة منتهى الجموع، وهو مضاف، والجملة في محل نصب مقول القول
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم
