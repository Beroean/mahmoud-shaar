text: أَيْنَمَا تَذْهَبْ تَجِدْ مَطْعَمًا
irab:
  - «أين» اسم شرط جازم مبني على الفتح في محل نصب ظرف مكان، و«ما» زائدة
  - فعل مضارع مجزوم لأنه فعل الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
  - فعل مضارع مجزوم لأنه جواب الشرط وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره أنت
  - مفعول به منصوب وعلامة نصبه تنوين الفتح
