text: كُلُّكُمْ رَاعٍ، وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، والميم علامة الجمع
  - خبر مرفوع وعلامة رفعه الضمة المقدرة على الياء المحذوفة لأنه اسم منقوص، والتنوين تنوين عوض
  - الواو حرف عطف، و«كل» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، والكاف ضمير متصل في محل جر مضاف إليه، والميم علامة الجمع
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«مسئول»
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ٨٩٣
