text: الْكَمْأَةُ مِنَ الْمَنِّ، وَمَاؤُهَا شِفَاءٌ لِلْعَيْنِ
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر
  - الواو حرف عطف، و«ماء» مبتدأ مرفوع وعلامة رفعه الضمة، وهو مضاف، و«ها» ضمير متصل مبني على السكون في محل جر مضاف إليه
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - اللام حرف جر، و«العين» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«شفاء»
