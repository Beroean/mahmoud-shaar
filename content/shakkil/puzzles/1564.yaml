text: فَأَمَّا عَادٌ فَاسْتَكْبَرُوا فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَقَالُوا مَنْ أَشَدُّ مِنَّا قُوَّةً
irab:
  - الفاء استئنافية، و«أمّا» حرف شرط وتفصيل مبني على السكون
  - مبتدأ مرفوع وعلامة رفعه تنوين الضم
  - الفاء رابطة لجواب «أمّا»، و«استكبروا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل، والجملة في محل رفع خبر المبتدأ
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بـ«استكبروا»
  - الباء حرف جر، و«غير» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف حال
  - مضاف إليه مجرور وعلامة جره الكسرة
  - الواو حرف عطف، و«قالوا» فعل ماضٍ مبني على الضم لاتصاله بواو الجماعة، والواو ضمير متصل مبني على السكون في محل رفع فاعل
  - اسم استفهام مبني على السكون في محل رفع مبتدأ
  - خبر مرفوع وعلامة رفعه الضمة (اسم تفضيل)، والجملة في محل نصب مقول القول
  - «من» حرف جر، و«نا» ضمير متصل مبني على السكون في محل جر، وشبه الجملة متعلق بـ«أشدّ»
  - تمييز منصوب وعلامة نصبه تنوين الفتح
