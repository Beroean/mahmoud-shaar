text: وَإِنَّمَا الْمَرْءُ حَدِيثٌ بَعْدَهُ فَكُنْ حَدِيثًا حَسَنًا لِمَنْ وَعَى
irab:
  - الواو استئنافية، و«إنّما» أداة حصر لا عمل لها
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - ظرف زمان منصوب وعلامة نصبه الفتحة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف نعت لـ«حديث»
  - الفاء استئنافية، و«كن» فعل أمر ناقص مبني على السكون، واسمه ضمير مستتر وجوبًا تقديره أنت
  - خبر «كن» منصوب وعلامة نصبه تنوين الفتح
  - نعت منصوب وعلامة نصبه تنوين الفتح
  - اللام حرف جر، و«مَن» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«حسنًا»
  - فعل ماضٍ مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر تقديره هو، والجملة صلة الموصول لا محل لها
