text: التِّلْمِيذَانِ لَمْ يَتَأَخَّرَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، وألف الاثنين ضمير متصل في محل رفع فاعل، والجملة في محل رفع خبر
