text: لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ
irab:
  - حرف امتناع لوجود مبني على السكون، وهو حرف شرط غير جازم
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة، والفاعل ضمير مستتر وجوبًا تقديره أنا، والمصدر المؤول في محل رفع مبتدأ خبره محذوف وجوبًا
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة المقدرة على ما قبل ياء المتكلم، وهو مضاف، والياء ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بـ«أشقّ»
  - اللام واقعة في جواب «لولا»، و«أمر» فعل ماضٍ مبني على السكون لاتصاله بتاء الفاعل، والتاء ضمير متصل في محل رفع فاعل، و«هم» ضمير متصل في محل نصب مفعول به
  - الباء حرف جر، و«السواك» اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«أمر»
alts: []
fixed:
  - لأمرتهم
source: hadith
level: 3
ref: صحيح البخاري، الحديث ٧٢٤٠
