text: لِكُلِّ شَيْءٍ إِذَا مَا تَمَّ نُقْصَانُ فَلَا يُغَرَّ بِطِيبِ الْعَيْشِ إِنْسَانُ
irab:
  - اللام حرف جر، و«كل» اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بمحذوف خبر مقدم
  - مضاف إليه مجرور وعلامة جره تنوين الكسر
  - ظرف لما يُستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون
  - حرف زائد مبني على السكون
  - فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها، وجواب الشرط محذوف دلّ عليه ما قبله
  - مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة
  - الفاء استئنافية، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مبني للمجهول مجزوم بـ«لا» الناهية وعلامة جزمه السكون، وحُرِّك بالفتح لالتقاء الساكنين لأنه مضعّف
  - الباء حرف جر، و«طيب» اسم مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
  - نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة
alts:
  - لِكُلِّ شَيْءٍ إِذَا مَا تَمَّ نُقْصَانُ فَلَا يُغَرِّ بِطِيبِ الْعَيْشِ إِنْسَانُ
  - لِكُلِّ شَيْءٍ إِذَا مَا تَمَّ نُقْصَانُ فَلَا يُغَرُّ بِطِيبِ الْعَيْشِ إِنْسَانُ
author: أبو البقاء الرندي
source: poetry
level: 3
ref: رثاء الأندلس (النونية)
