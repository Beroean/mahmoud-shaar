text: وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ
irab:
  - الواو حرف عطف، و«لا» نافية لا عمل لها مبنية على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، وشبه الجملة متعلق بـ«يحضّ»
  - مضاف إليه مجرور وعلامة جره الكسرة
alts: []
context: وصف الذي يكذّب بالدين
source: quran
ref: سورة الماعون، الآية ٣
