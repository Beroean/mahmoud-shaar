text: سَارَعَ الْمُسْعِفُونَ لِيُنْقِذُوا الْجَرْحَى
irab:
  - فعل ماضٍ مبني على الفتح
  - فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم
  - اللام حرف جر للتعليل، و«ينقذوا» فعل مضارع منصوب بـ«أن» المضمرة بعد لام التعليل وعلامة نصبه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع فاعل
  - مفعول به منصوب وعلامة نصبه الفتحة المقدرة على الألف للتعذر
