text: مَا أَصْفَى الْبُحَيْرَةَ صَبَاحًا!
irab:
  - «ما» تعجبية نكرة تامة مبنية على السكون في محل رفع مبتدأ
  - فعل ماضٍ جامد لإنشاء التعجب مبني على الفتح المقدر على الألف للتعذر، والفاعل ضمير مستتر وجوبًا تقديره هو، والجملة في محل رفع خبر
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه تنوين الفتح
