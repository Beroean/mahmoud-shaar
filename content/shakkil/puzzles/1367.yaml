text: يَنْبَغِي لِلْمُسَافِرِ أَنْ يَحْمِلَ مَا يَكْفِيهِ مِنَ الْمَاءِ حِينَ يَعْبُرُ الصَّحْرَاءَ
irab:
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - اللام حرف جر، و«المسافر» اسم مجرور وعلامة جره الكسرة الظاهرة
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل رفع فاعل «ينبغي»
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - فعل مضارع مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل، والفاعل ضمير مستتر تقديره هو، والهاء ضمير متصل في محل نصب مفعول به، والجملة صلة الموصول لا محل لها
  - حرف جر مبني على السكون، وحُرّك بالفتح لالتقاء الساكنين
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - ظرف زمان منصوب وعلامة نصبه الفتحة الظاهرة، وهو مضاف
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل جر بالإضافة
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
