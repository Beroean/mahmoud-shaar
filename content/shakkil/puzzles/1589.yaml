text: مَنْ حَجَّ لِلَّهِ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ
irab:
  - اسم شرط جازم مبني على السكون في محل رفع مبتدأ
  - فعل ماضٍ مبني على الفتح في محل جزم فعل الشرط، والفاعل ضمير مستتر تقديره هو
  - اللام حرف جر، ولفظ الجلالة اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بـ«حجّ»
  - الفاء حرف عطف، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - الواو حرف عطف، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، والفاعل ضمير مستتر تقديره هو
  - فعل ماضٍ مبني على الفتح في محل جزم جواب الشرط، والفاعل ضمير مستتر تقديره هو
  - الكاف حرف جر وتشبيه، و«يوم» اسم مجرور وعلامة جره الكسرة، ويجوز بناؤه على الفتح في محل جر لإضافته إلى فعل مبني، وهو مضاف، وشبه الجملة متعلق بمحذوف حال
  - فعل ماضٍ مبني على الفتح، والتاء للتأنيث، والهاء ضمير متصل في محل نصب مفعول به مقدم، والجملة في محل جر مضاف إليه
  - فاعل مؤخر مرفوع وعلامة رفعه الضمة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts:
  - مَنْ حَجَّ لِلَّهِ فَلَمْ يَرْفِثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ
  - مَنْ حَجَّ لِلَّهِ فَلَمْ يَرْفَثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ
