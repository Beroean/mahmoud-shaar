text: فَرَاغَ إِلَىٰ أَهْلِهِ فَجَاءَ بِعِجْلٍ سَمِينٍ
irab:
  - الفاء حرف عطف، و«راغ» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل مبني على الكسر في محل جر مضاف إليه، وشبه الجملة متعلق بـ«راغ»
  - الفاء حرف عطف، و«جاء» فعل ماضٍ مبني على الفتح، والفاعل ضمير مستتر تقديره هو
  - الباء حرف جر، و«عجل» اسم مجرور وعلامة جره تنوين الكسر، وشبه الجملة متعلق بـ«جاء»
  - نعت مجرور وعلامة جره تنوين الكسر
alts: []
context: إبراهيم عليه السلام حين نزل به ضيوفه
source: quran
ref: سورة الذاريات، الآية ٢٦
