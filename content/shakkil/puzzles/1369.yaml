text: لَا مُسَافِرَ يَعْبُرُ الْحُدُودَ دُونَ أَنْ يُبْرِزَ جَوَازَ سَفَرِهِ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «لا»
  - مفعول به منصوب وعلامة نصبه الفتحة الظاهرة
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - حرف مصدري ونصب مبني على السكون
  - فعل مضارع منصوب بـ«أن» وعلامة نصبه الفتحة الظاهرة، والفاعل ضمير مستتر تقديره هو، والمصدر المؤول في محل جر مضاف إليه
  - مفعول به منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف، والهاء ضمير متصل في محل جر مضاف إليه
alts:
  - لَا مُسَافِرٌ يَعْبُرُ الْحُدُودَ دُونَ أَنْ يُبْرِزَ جَوَازَ سَفَرِهِ
source: llm-reviewed
level: 2
