text: إِذَا لَمْ تَكُونُوا مُتَأَكِّدِينَ مِنَ الْخَبَرِ فَلَا تَنْشُرُوهُ بَيْنَ النَّاسِ
irab:
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب
  - حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع ناقص مجزوم بـ«لم» وعلامة جزمه حذف النون لأنه من الأفعال الخمسة، والواو ضمير متصل في محل رفع اسم «كان»، والجملة في محل جر بالإضافة
  - خبر «كان» منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة
  - الفاء رابطة لجواب الشرط، و«لا» ناهية جازمة مبنية على السكون
  - فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه حذف النون، والواو ضمير متصل في محل رفع فاعل، والهاء ضمير متصل في محل نصب مفعول به
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة الظاهرة
