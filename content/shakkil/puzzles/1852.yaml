text: وَقَدْ يَعْثُرُ السَّاعِي إِذَا كَانَ مُسْرِعَا
irab:
  - الواو استئنافية، و«قد» حرف تقليل مبني على السكون
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة
  - فاعل مرفوع وعلامة رفعه الضمة المقدرة على الياء للثقل
  - ظرف لما يستقبل من الزمان متضمن معنى الشرط غير جازم مبني على السكون في محل نصب، وجوابه محذوف دلّ عليه ما قبله
  - فعل ماضٍ ناقص مبني على الفتح، واسمه ضمير مستتر تقديره هو، والجملة في محل جر بإضافة «إذا» إليها
  - خبر «كان» منصوب وعلامة نصبه تنوين الفتح، والألف للإطلاق
alts: []
vary:
  - - يَعْثُرُ
    - يَعْثِرُ
  - - مُسْرِعَا
    - مُسْرِعًا
author: أبو الأسود الدؤلي
source: poetry
level: 2
ref: «لعمري لقد أفشيت يوما فخانني»
