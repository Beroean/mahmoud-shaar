text: أَلَمْ تَرَ أَنَّ اللَّهَ يَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ
irab:
  - الهمزة حرف استفهام تقريري مبني على الفتح، و«لم» حرف نفي وجزم وقلب مبني على السكون
  - فعل مضارع مجزوم بـ«لم» وعلامة جزمه حذف حرف العلة (الألف)، والفاعل ضمير مستتر وجوبًا تقديره أنت
  - حرف توكيد ونصب مبني على الفتح
  - لفظ الجلالة اسم «أنّ» منصوب وعلامة نصبه الفتحة
  - فعل مضارع مرفوع وعلامة رفعه الضمة، والفاعل ضمير مستتر تقديره هو، والجملة في محل رفع خبر «أنّ»، والمصدر المؤول سدّ مسدّ مفعولي «ترَ»
  - اسم موصول مبني على السكون في محل نصب مفعول به
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
  - الواو حرف عطف، و«ما» اسم موصول مبني على السكون في محل نصب معطوف على «ما» الأولى
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف صلة الموصول
