text: لَا طَعَامَ فِي الثَّلَّاجَةِ إِلَّا الْجُبْنُ
irab:
  - «لا» النافية للجنس حرف مبني على السكون
  - اسم «لا» مبني على الفتح في محل نصب
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة الظاهرة، وشبه الجملة متعلق بمحذوف خبر «لا»
  - حرف استثناء مبني على السكون
  - بدل من محل «لا» واسمها مرفوع وعلامة رفعه الضمة الظاهرة (ويجوز نصبه مستثنى)
alts:
  - لَا طَعَامَ فِي الثَّلَّاجَةِ إِلَّا الْجُبْنَ
  - لَا طَعَامٌ فِي الثَّلَّاجَةِ إِلَّا الْجُبْنُ
  - لَا طَعَامٌ فِي الثَّلَّاجَةِ إِلَّا الْجُبْنَ
source: llm-reviewed
level: 2
