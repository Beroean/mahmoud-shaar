text: كَرَبَتِ الْكَعْكَةُ تَنْضَجُ
irab:
  - فعل ماضٍ ناقص من أفعال المقاربة مبني على الفتح، والتاء للتأنيث وحُرّكت بالكسر لالتقاء الساكنين
  - اسم «كرب» مرفوع وعلامة رفعه الضمة الظاهرة
  - فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة، والفاعل ضمير مستتر تقديره هي، والجملة في محل نصب خبر «كرب»
alts:
  - كَرِبَتِ الْكَعْكَةُ تَنْضَجُ
source: llm-reviewed
