text: الْعُمْرَةُ إِلَى الْعُمْرَةِ كَفَّارَةٌ لِمَا بَيْنَهُمَا
irab:
  - مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة
  - حرف جر مبني على السكون
  - اسم مجرور وعلامة جره الكسرة، وشبه الجملة متعلق بمحذوف حال من «العمرة» (أي مضمومةً إلى العمرة)
  - خبر مرفوع وعلامة رفعه تنوين الضم
  - اللام حرف جر، و«ما» اسم موصول مبني على السكون في محل جر، وشبه الجملة متعلق بـ«كفارة»
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف، و«هما» ضمير متصل في محل جر مضاف إليه، وشبه الجملة متعلق بمحذوف صلة الموصول
alts: []
source: hadith
level: 2
ref: صحيح البخاري، الحديث ١٧٧٣
