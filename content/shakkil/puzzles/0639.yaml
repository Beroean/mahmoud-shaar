text: أَلَا لَا يَجْهَلَنْ أَحَدٌ عَلَيْنَا فَنَجْهَلَ فَوْقَ جَهْلِ الْجَاهِلِينَا
irab:
  - حرف استفتاح وتنبيه مبني على السكون
  - حرف نهي وجزم مبني على السكون
  - فعل مضارع مبني على الفتح لاتصاله بنون التوكيد الخفيفة في محل جزم بـ«لا» الناهية، والنون حرف توكيد مبني على السكون
  - فاعل مرفوع وعلامة رفعه تنوين الضم
  - «على» حرف جر، و«نا» ضمير متصل في محل جر، وشبه الجملة متعلق بـ«يجهلن»
  - الفاء سببية، و«نجهل» فعل مضارع منصوب بأن مضمرة وجوبًا بعد فاء السببية وعلامة نصبه الفتحة، والفاعل ضمير مستتر تقديره نحن
  - ظرف مكان منصوب وعلامة نصبه الفتحة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الكسرة، وهو مضاف
  - مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم، والألف للإطلاق
