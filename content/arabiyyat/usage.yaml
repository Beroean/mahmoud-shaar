# Round 2 · متى يُقال؟ (usage: the situation it's said in) / ما معناه؟ (meaning of an idiom).
#
# Day N plays item N of each list; items past the shortest list are spares. answer/others: the
# book's answer and three wrong ones the book rules out. note: shown after answering, in our own
# words (never copied from the book). source: id in sources.yaml · page: printed page · volume:
# for multi-volume books · line/halab: the Aleppo book's text line and the حلبيّات spare it reuses ·
# flag: something a reviewer should check · status: draft until a person reviews it.

- id: u0001
  kind: usage
  prompt: وصي آدم على ذريته
  answer: لمن يجعل نفسه رقيبا على كل الناس
  others: [لمن يكثر الوصايا لأولاده قبل سفره, لمن يحفظ أنساب الناس ويفخر بها, لمن يرعى أيتام أقاربه ويحسن إليهم]
  note: كأنه وكيل عن آدم على أبنائه جميعا؛ يقال لمن يتدخل في شؤون الناس.
  source: adimi
  page: 459
  status: draft

- id: u0002
  kind: usage
  prompt: اعطيها بيدك وأمشي لها برجليك
  answer: لمن يعطي ما يملك ثم يتعب في استرجاعه
  others: [لمن يقضي حوائجه بنفسه ولا يتّكل على أحد, لمن يكثر الهدايا لأقاربه, لمن يطلب حقّه بالقوة]
  note: أعطاها بيده بسهولة، ثم صار يمشي إليها برجليه ليستردّها.
  source: zanin
  page: 26
  status: draft

- id: u0003
  kind: meaning
  prompt: ماشي على قشر بيض
  answer: يمشي متباطئًا حذرًا
  others: [يمشي متبخترًا, يمشي هاربًا, يمشي حافيًا]
  note: كأنه يخشى أن يكسر قشر البيض بوطئه.
  source: taymur_kinayat
  page: 73
  status: draft

- id: u0004
  kind: usage
  prompt: حاسبني غاويني إدّي حقي
  answer: لمن يهمه أن يأخذ حقه ولا يبالي بطريقة الحساب
  others: [لمن يكثر الحساب في كل صغيرة وكبيرة, لمن يغش في الحساب ثم يطلب السماح ممن غشه بعد أن يُكشف, لمن يعطي حقوق الناس قبل أن يطلبوها]
  note: غاويني من المغالاة في الحساب؛ أي حاسبني وغالطني كما تشاء، المهم أن ترجع لي ما عندك.
  source: akwa
  page: 397
  volume: ج١
  status: draft

- id: u0005
  kind: usage
  prompt: طارت عصافير عقله
  answer: لمن أصابه فزع شديد
  others: [لمن غلب عليه الطرب والسرور, لمن نسي ما كان يحفظه, لمن انشغل بالتفكير عن الناس]
  note: وهو قريب من مثل عربي قديم ذكر عصافير الرأس؛ كأن الخوف أطار ما في رأسه.
  source: abboudi_amthal
  page: 764
  volume: ج٢
  status: draft

- id: u0006
  kind: usage
  prompt: الدنيا على الحلوة والمرّة
  answer: يقال في تقبّل حلو الحياة ومرّها معًا
  others: [يقال في مدح المائدة المتنوعة الأطباق, يقال في وصف الزوجة الحلوة الطباع, يقال في أن الإنسان لا يذوق إلا المرارة]
  note: الحياة متقلبة بين السعادة والألم، والعاقل يتعامل مع الحالين بصبر.
  source: shaalan
  page: 451
  volume: ج٤
  status: draft

- id: u0007
  kind: usage
  prompt: كل خضرايه فيها نوايه وكل زبيبه فيها عود
  answer: في أن لا أحد محروم من موهبة أو قدرة ما
  others: [في أن لكل نعمة عيبًا ينغّصها, في أن الفاكهة لا تؤكل إلا في موسمها, في أن الزبيب المجفف أنفع للجسم من العنب الطازج]
  note: مهما صغر الشيء ففيه ما يميزه.
  source: mughniyya
  page: 438
  status: draft

- id: u0008
  kind: meaning
  prompt: فضها سيرة
  answer: لا تذكر هذا الأمر بعد الآن
  others: [احكِ لي الحكاية كلها, انشر الخبر بين الناس في كل مكان, اكتب السيرة من أولها]
  note: طلب بإنهاء الحديث عن أمر ما وعدم الاستمرار فيه.
  source: amin
  page: 297
  status: draft

- id: u0009
  kind: meaning
  prompt: بلا قافيه
  answer: تنبيه إلى أن الكلام ليس للمزاح
  others: [طلب من المتحدث أن يختصر كلامه ولا يطيل, اعتراض على كلام بلا معنى, اعتذار عن خطأ في الحساب]
  note: القافية عندهم النكتة؛ يقولها المتكلم إذا خشي أن يُظن في كلامه تنكيت.
  source: taymur_kinayat
  page: 22
  status: draft

- id: u0010
  kind: meaning
  prompt: فلان ما بيترك لا شاردة ولا واردة
  answer: ينتبه لكل صغيرة وكبيرة
  others: [يطرد كل ضيف يأتي إلى بيته, يأكل كل ما يجده, يسلّم على كل الناس]
  note: أصله المال الذي شرد عن القطيع والمال الذي يرد إليه.
  source: asadi
  line: 95301
  halab: w1078
  status: draft

- id: u0011
  kind: usage
  prompt: وين تنفذ يا قنفذ
  answer: لمن وقع في الشرك بعد أن أفلت منه مرات
  others: [لمن يختبئ عن الناس خوفا من الدين, لمن يؤذي كل من يقترب منه, لمن يخرج من بيته ليلا ويعود إليه مع طلوع الفجر]
  note: تنفذ أي تخرج وتنجو بنفسك. القنفذ يحتمي بفروته الشائكة، لكن ماذا يفعل إذا أُحكم عليه القبض؟
  source: juhayman
  page: 69
  volume: ج٩
  status: draft

- id: u0012
  kind: usage
  prompt: 'قالوا للكاتب: استريح. قام وقف'
  answer: في أن الراحة تختلف باختلاف الناس
  others: [في أن العامل يتعب في عمله ولا يشكو, في أن المطيع يطيع الأمر قبل أن يفهمه, في أن المجتهد يعمل أكثر مما يُطلب منه]
  note: الكاتب يقضي يومه جالسا، فراحته في الوقوف؛ وما يريح شخصا قد يتعب غيره.
  source: taymur
  page: 281
  status: draft

- id: u0013
  kind: meaning
  prompt: بومتين و صقيرة
  answer: شيء قليل لا قيمة له
  others: [طيور كثيرة في مكان واحد, أشخاص يتعاونون رغم اختلافهم, غنيمة كبيرة]
  note: يقال للشيء القليل الذي لا يُعتدّ به.
  source: zanin
  page: 89
  status: draft

- id: u0014
  kind: usage
  prompt: كل ما دق الكوز بالجرة
  answer: للأمر أو الكلام الذي يتكرر في كل مناسبة
  others: [للخصام الذي يقع بين الجيران, لمن يكسر أواني البيت, لمن يشرب الماء كثيرا من الجرة في أيام الصيف]
  note: كلما ملأ الكوز من الجرة تكرر الصوت ذاته.
  source: sahli
  page: 268
  status: draft

- id: u0015
  kind: usage
  prompt: الحصمه ترزح الدوح
  answer: في ألّا يُستهان بالشيء الصغير فقد يكون نفعه كبيرًا
  others: [في أن الكثرة تغلب الشجاعة مهما بلغت قوة الفارس الواحد, في أن الضعيف لا يقدر على حمل الثقيل, في أن البيت لا يقوم على أساس واهٍ]
  note: الدَّوح هو الزير الكبير من الفخار، وقد تكفي حصاة صغيرة لتسنده.
  source: iryani
  page: 183
  status: draft

- id: u0016
  kind: meaning
  prompt: قله في وشه ولا تغشه
  answer: صارحه ولا تخدعه
  others: [لا تكلمه أبدًا, امدحه في غيابه, اغضب منه وقاطعه]
  note: دعوة إلى الصراحة في الوجه بدل المداراة المخادعة.
  source: amin
  page: 313
  status: draft

- id: u0017
  kind: usage
  prompt: ياكل اللي يصيح
  answer: لقليل الورع الذي لا يدع شيئا إلا أكله
  others: [للطفل الذي يبكي بصوت عال حتى يُطعم قبل إخوته, لمن يرفع صوته ليأخذ حقه, لمن يأكل بصوت مرتفع]
  note: أصله في تخويف الطفل من البكاء خشية أن يأكله الغول ونحوه.
  source: abboudi_amthal
  page: 1651
  volume: ج٥
  status: draft

- id: u0018
  kind: usage
  prompt: يحك له على مناخيره
  answer: يقال عمن يستفز غيره ويثيره حتى يتهور
  others: [يقال عمن يتملق غيره ليرضى عنه, يقال عمن يتدخل في صغائر أمور غيره بلا سبب, يقال عمن يواسي غيره ويخفف عنه]
  note: المناخير هي الأنف، والغضب عند العامة يسكن الأنف؛ فمن يحك على أنف المتهور يدفعه إلى الجنون.
  source: shaalan
  page: 216
  volume: ج٣
  status: draft

- id: u0019
  kind: usage
  prompt: الرِّيحْ اللِّي جَا يْدِّيهْ
  answer: لمن لا يستقر على رأي ويميل مع كل هوى
  others: [لمن يسافر كثيرًا ولا يعود إلى بيته, لمن يسرع في مشيه فلا يُلحق به مهما جرى خلفه, لمن يكثر الكلام ولا يفعل شيئًا]
  note: يقال فيمن لا يستقر على رأي ويتبع أهواءه، فهو كالريشة تحملها الريح أينما هبّت.
  source: dadoun
  page: 111
  status: draft

- id: u0020
  kind: meaning
  prompt: قول يا باسط
  answer: دعوة إلى ترك الحزن والكدر
  others: [دعوة إلى الكرم, دعوة إلى الصبر على البلاء, دعوة إلى الحمد عند الشبع]
  note: أي ادعُ الله باسمه الباسط يذهب عنك ما أنت فيه.
  source: taymur_kinayat
  page: 65
  status: draft

- id: u0021
  kind: usage
  prompt: إرحب يا واصل على الحاصل
  answer: ترحيب المضيف بضيفه بما تيسّر في بيته
  others: [ترحيب الأهل بالمسافر العائد بعد غياب طويل, دعوة الجار إلى وليمة معدّة سلفا, اعتذار الضيف عن قدومه دون موعد]
  note: يقولها المضيف تواضعا ولطفا، ولو كان ما يقدّمه وفيرا.
  source: adimi
  page: 86
  status: draft

- id: u0022
  kind: usage
  prompt: يا جاحب البلسن يا عذابك، قد كانت البلسن في جرابك
  answer: لمن يضيّع ثروته من يده ثم يعود يبحث عنها
  others: [لمن يجمع العدس من حقول غيره دون إذن, لمن يخبئ طعامه ثم يشكو الجوع, لمن يحمل ما لا يحتاج إليه في سفره]
  note: من الأمثال الزراعية؛ الجاحب الجامع، والبلسن العدس بلغة أهل اليمن.
  source: akwa
  page: 1351
  volume: ج٢
  status: draft

- id: u0023
  kind: usage
  prompt: الطير البرني كيف احصل ما يصككش
  answer: للسيد الشجاع الذي لا تثنيه الصعاب ولا تغيّر طباعه
  others: [للصياد الماهر الذي لا يخطئ هدفه مهما بعدت الطريدة واشتدت الريح, للمسافر الذي لا يتعب من طول الطريق, للغني الذي لا تنقص أمواله مهما أنفق]
  note: «الطير البرني» الصقر؛ إذا وقع في مأزق لا يرتبك ولا يضعف.
  source: mughniyya
  page: 355
  status: draft

- id: u0024
  kind: meaning
  prompt: حط راسه في الجراب
  answer: خادعه حتى انقاد له وأطاعه
  others: [أخفاه عن الناس, أذله أمام أهله, أخذ ماله كله]
  note: كما يحتال الحاوي على الأفعى حتى يدخلها جرابه فتصير طوع يده.
  source: taymur_kinayat
  page: 29
  status: draft

- id: u0025
  kind: meaning
  prompt: اللي يبات فيه يصبح فيه
  answer: مستمر على حالة واحدة
  others: [يتغير حاله كل يوم, ينام مبكرًا ويصحو مبكرًا, لا يجد مكانًا يبيت فيه]
  note: يقال عن الحال التي لا تتبدّل ليلًا ولا نهارًا.
  source: amin
  page: 330
  status: draft

- id: u0026
  kind: meaning
  prompt: رمى فيه ذبانة
  answer: جعل الناس يزهدون فيه
  others: [أفسد عليه طعامه, أثار غضبه بكلمة, اتهمه بالسرقة]
  note: الذبابة إذا وقعت في الطعام عافه الناس.
  source: zanin
  page: 155
  status: draft

- id: u0027
  kind: usage
  prompt: تلم في جربه ولا سبعة اقسام
  answer: في أن القليل من الجيد خير من الكثير الأقل جودة
  others: [في أن الأرض الواحدة لا تكفي سبعة إخوة, في الحث على العمل الجماعي في الحقل وتقسيم المحصول بين الشركاء, في أن التأخر في البذر يضيّع المحصول]
  note: الجربة هي الحقل، والمعنى أن خطًّا واحدًا في أرض طيبة أنفع من أنصبة كثيرة رديئة.
  source: iryani
  page: 98
  status: draft

- id: u0028
  kind: usage
  prompt: الزمان ده كل واحد بيقول يا للا نفسى
  answer: يقال في الشكوى من أنانية الناس
  others: [يقال في التحسر على قصر العمر وسرعة الأيام, يقال في مدح التواضع ونكران الذات, يقال لمن يخاف من الحسد فيخفي نعمه]
  note: يعبر المثل عن الضيق بالأنانية التي شاعت مع الجري وراء المال، وعن الحنين إلى ماضٍ يُظن أنه كان أفضل.
  source: shaalan
  page: 246
  volume: ج٣
  status: draft

- id: u0029
  kind: usage
  prompt: غط ذهبك ومذهبك
  answer: للنصح بكتمان المال والرأي حتى لا يجلبا المتاعب
  others: [لمن يتزين بالذهب في كل مناسبة, لمن يغيّر رأيه كلما تغير جلساؤه, لمن ينفق ماله كله في غير موضعه ثم يندم على ما أنفق]
  note: غط أي استر؛ فالمال إذا أظهرته وجدت طامعين، والرأي في الدين والسياسة إذا أبديته وجدت معارضين.
  source: juhayman
  page: 30
  volume: ج٥
  status: draft

- id: u0030
  kind: meaning
  prompt: إن شا الله يقول ريان يا فجل
  answer: لن أصدقه مهما قال
  others: [لن أشتري منه شيئًا, سأنتظره حتى ينادي, أتمنى له رزقًا وفيرًا]
  note: «ريان يا فجل» نداء باعة الفجل؛ أي لو قال حتى ما يقال دائمًا ما صدقته.
  source: taymur_kinayat
  page: 38
  status: draft

- id: u0031
  kind: usage
  prompt: أكلة بتوكل أصابعك وراها
  answer: للطعام الشهي المتقن الطهي
  others: [للطعام الحار الذي يحرق اليد, للطعام القليل الذي لا يشبع, للطعام الذي يؤكل بلا ملعقة]
  note: الطعام لذيذ إلى حد أنك تكاد تأكل أصابعك بعده.
  source: sahli
  page: 34
  status: draft

- id: u0032
  kind: meaning
  prompt: وريني عرض كتافك
  answer: اذهب في حال سبيلك
  others: [أرني قوتك, احمل عني هذا الحمل, قف معي في الشدة]
  note: طلب بالانصراف، أي أدِر لي ظهرك وامضِ.
  source: amin
  page: 391
  status: draft

- id: u0033
  kind: usage
  prompt: فنجال وحجاج
  answer: في الضيافة تجتمع فيها القهوة وبشاشة الوجه
  others: [في الضيف الذي يشرب ثم يعبس, في البخيل الذي يقدّم القليل بوجه عابس, في الجدال الطويل الذي يدور بين الضيوف على فنجان القهوة]
  note: '«الحجاج» العظم الذي ينبت عليه الحاجب؛ والمعنى: فنجان قهوة مع جبين منبسط الأسارير.'
  source: abboudi_amthal
  page: 915
  volume: ج٣
  status: draft

- id: u0034
  kind: usage
  prompt: آشْ مَنْ ضَرْ نَاكْلُه السَّحْتَرْ؟
  answer: لمن كثرت عليه المصائب فلم يدرِ بأيها يبدأ
  others: [لمن يتداوى بالأعشاب ويهمل الطبيب, لمن يشكو من طعام لا يعجبه فيتركه ويبيت جائعًا, لمن يأكل كثيرًا ثم يشكو التخمة]
  note: 'السحتر هو الزعتر الذي يُتداوى به. أي: أيّ وجع أعالج بالزعتر وأوجاعي كثيرة؟'
  source: dadoun
  page: 159
  status: draft

- id: u0035
  kind: usage
  prompt: اضحك غرّموه ناقة
  answer: لمن يفعل شيئًا صغيرًا فيكون وبالًا عليه
  others: [لمن يبالغ في الكرم مع ضيوفه حتى يفتقر ويبيع ماله, لمن يربح من تجارة صغيرة ربحًا كبيرًا, لمن يدفع ثمن الشيء أضعافًا عن رضا]
  note: ضحكة واحدة كلّفته غرامة ناقة.
  source: zanin
  page: 24
  status: draft

- id: u0036
  kind: usage
  prompt: كيف شاهد الزور
  answer: للتافه الذي ينال شيئًا من الاحترام ثم يُطرح جانبًا
  others: [للصادق الذي لا يصدقه أحد, للكاذب الذي يفضحه لسانه, للجبان الذي يهرب عند الخصومة ويترك أصحابه وحدهم في مواجهة الخصم]
  note: يُكرَّم شاهد الزور حين يُطلب للإدلاء بشهادته، فإذا فرغ منها قوبل بالاحتقار.
  source: mughniyya
  page: 456
  status: draft

- id: u0037
  kind: meaning
  prompt: رمى طوبته
  answer: يئس منه وقطع الرجاء فيه
  others: [بنى بيتًا جديدًا, بدأ عملًا من الصفر, هدده بالضرب]
  note: الطوبة واحدة الطوب أي الآجر.
  source: taymur_kinayat
  page: 38
  status: draft

- id: u0038
  kind: usage
  prompt: ما من هارب علم
  answer: في ألا تنتظر الأخبار ممن هو مشغول بنجاة نفسه
  others: [في أن الهارب من العدالة لا يفلت منها, في أن الجاهل يهرب من العلم والتعلم ويستثقل مجالس العلماء, في أن من هرب مرة لا يُوثق به أبداً]
  note: العلم هنا النبأ؛ فالهارب لا يهتم بما يسمع لأنه مشغول بالنجاة.
  source: akwa
  page: 1071
  volume: ج٢
  status: draft

- id: u0039
  kind: usage
  prompt: حطوا تقليتكم وأنا لقمة بجملتكم
  answer: في أن الواحد لا تثقل نفقته على الجماعة
  others: [في أن من يأكل أكثر من نصيبه يُلام, في أن الطباخ لا يأكل مما يطبخه للناس أبدا, في أن القليل من كل صنف يكفي الضيف]
  note: أنا لقمة بين لقمكم، لا أزيد طعامكم ولا أنقصه.
  source: taymur
  page: 146
  status: draft

- id: u0040
  kind: usage
  prompt: إذا جاءك الدبور أرقد له
  hint: الدبور سوء الحظ وإدبار الأيام
  answer: لمن يُنصح بالاستسلام للقدر وانتظاره
  others: [لمن يُنصح بالهرب من الخطر قبل وقوعه, لمن يُنصح بالنوم مبكرا ليستعد للعمل, لمن يُنصح بمواجهة عدوه بشجاعة]
  note: إذا أدبرت الأيام فلا تقاومها، بل انتظر حتى يمضي سوء الحظ.
  source: adimi
  page: 106
  status: draft

- id: u0041
  kind: usage
  prompt: حجّة من غير أختها عوجة
  answer: يقال في أن الحجة الواحدة تحتاج إلى أخرى تقويها
  others: [يقال في أن السفر وحيدًا محفوف بالخطر دائمًا, يقال في أن الكذب لا يحتاج إلى دليل يسنده, يقال في أن كثرة الكلام تضعف حجة صاحبه]
  note: يدعو المثل إلى النظر في الرأي والرأي المقابل؛ فالأمور لا تتضح إلا إذا عُرضت من كل جوانبها.
  source: shaalan
  page: 246
  volume: ج٢
  status: draft

- id: u0042
  kind: meaning
  prompt: أخليك تمشي ع العجين ما تلخبطوش
  answer: سأؤدّبك حتى تستقيم
  others: [سأعلّمك صنعة الخَبز, سأجعلك تمشي حافيًا, سأتركك تفعل ما تشاء]
  note: 'تهديد بالتأديب: سيصير خطوك من شدة الاستقامة خفيفًا لا يُفسد العجين إذا مشيت عليه.'
  source: amin
  page: 38
  status: draft

- id: u0043
  kind: usage
  prompt: الثور ينطح حتى في المرناع
  answer: في أن القوي يقدر على المقاومة ولو كان في ضيق
  others: [في أن العامل لا يترك عمله ولو تعب, في أن الطبع الشرس لا يتغير مع الزمن, في أن الطريق الضيق لا يتسع لاثنين فلا بد أن يتنحى أحدهما]
  note: المرناع أو المرنع ممرّ ضيق يسير فيه الثور صاعدًا هابطًا لرفع الماء من البئر.
  source: iryani
  page: 365
  status: draft

- id: u0044
  kind: meaning
  prompt: بالقلع والمقداف
  answer: بذل غاية الجهد في العمل أو في معاونة الغير
  others: [السفر عبر البحر في قارب صغير بلا شراع ولا مجداف, التراجع عن الأمر بعد البدء فيه, الاعتماد على الحظ وحده]
  note: كالسفينة التي تسير بشراعها ومجدافها معًا.
  source: taymur_kinayat
  page: 22
  status: draft

- id: u0045
  kind: usage
  prompt: اللى على الشط عوام
  answer: لمن يستسهل الأمر وهو بعيد عنه
  others: [لمن يتعلم السباحة من غير معلم, لمن يدّعي الشجاعة بعد زوال الخطر, لمن يجيد عمله ولا يعترف له أحد]
  note: الكلام سهل على من يقف على الشاطئ، ولا يعرف صعوبة الأمر إلا صاحبه.
  source: zanin
  page: 42
  status: draft

- id: u0046
  kind: usage
  prompt: لا تبطر من الشي يقل لك الدهر هاته
  answer: في ألا تستغني عن شيء ولو كان حقيراً فقد تحتاج إليه يوماً
  others: [في ألا تطلب من الناس شيئاً ولو احتجت إليه فيذلك الطلب أمامهم, في ألا تبطر بالنعمة فتزول عنك سريعاً, في ألا تؤخر عمل اليوم إلى الغد]
  note: تبطر هنا بمعنى تسأم؛ أي لا تزهد في شيء فقد يطلبه منك الزمان.
  source: akwa
  page: 901
  volume: ج٢
  status: draft

- id: u0047
  kind: usage
  prompt: اسْكُتْ أَهَذْ بُوفْسِّيوْ
  answer: لمن يجادل من هم أكبر منه سنًا وخبرة
  others: [لمن يغني بصوت مرتفع في الليل, لمن يكثر الشكوى من صغر حجمه أمام أقرانه, لمن يقلد أصوات الطيور ليضحك الناس]
  note: بوفسيو في الدارجة أصغر الطيور. يقال للحطّ من شأن من يتطاول في الكلام على من يفوقونه علمًا وتجربة.
  source: dadoun
  page: 143
  status: draft

- id: u0048
  kind: usage
  prompt: تكاثره الزمان، وقطّ نصفه
  answer: للمال القليل تصيبه جائحة
  others: [للرجل يكثر أولاده فيقل ماله, للعمر يطول ثم ينقضي فجأة, للزرع الكثير يحصد نصفه]
  note: «قطّ» أي قطع؛ كأن الزمان استكثر عليه ماله مع قلته فأخذ نصفه.
  source: abboudi_amthal
  page: 319
  volume: ج١
  status: draft

- id: u0049
  kind: usage
  prompt: الشطارة عند تنشيب الكم
  answer: للأمر الذي لا تدل أوائله على المهارة وإنما تظهر في خواتيمه
  others: [لمن يلبس ثوبًا أكبر من مقاسه, لمن يخفي في كمّه ما لا يريد أن يراه الناس, لمن يتعلم الصنعة بسرعة ثم ينساها]
  note: الشطارة المهارة، وتنشيب الكم خرزه ووصله في آخر الخياطة؛ وعند العقدة يظهر الصانع الماهر.
  source: juhayman
  page: 56
  volume: ج٤
  status: draft

- id: u0050
  kind: meaning
  prompt: موت يا حمار على ما يجيلك العليق
  answer: انتظر طويلًا لأمر لن يأتي
  others: [اعمل بجدّ تنل ما تريد, أطعم دابتك قبل أن تجوع وتمرض, الصبر يأتي بالخير]
  note: 'يقال لمن ينتظر شيئًا بعيد الحصول، ومثله: حتى يجيء الترياق من العراق.'
  source: amin
  page: 364
  status: draft

- id: u0051
  kind: meaning
  prompt: يا مولاي كما خلقتني
  answer: تجرّد من ثيابه وفقد كل شيء
  others: [عاد إلى براءته الأولى, لم يتغير منذ صغره, رضي بقضاء ربه وصبر على ما أصابه]
  note: يقولون «الحرامي خلاه يا مولاي كما خلقتني».
  source: taymur_kinayat
  page: 83
  status: draft

- id: u0052
  kind: usage
  prompt: بين البايع والشاري يفتح الله
  answer: يقولها البائع حين يرفض البيع بالثمن المعروض
  others: [يقولها المشتري حين يجد البضاعة رخيصة, يقولها التاجر حين يفتح دكانه في الصباح, يقولها الوسيط حين يتم البيع بنجاح]
  note: لكل من البائع والمشتري الحرية في ماله، فلهذا أن يمتنع عن البيع ولذاك أن يمتنع عن الشراء.
  source: mughniyya
  page: 194
  status: draft

- id: u0053
  kind: usage
  prompt: لو كانت الناس تبطّل كلام كانت الدنيا تعيش فى سلام
  answer: عبارة تكتب على السيارات تذم القيل والقال
  others: [عبارة تقال لمن يكثر الشكوى من الحروب, عبارة تقال لطلب الصمت في مجلس العلم, عبارة تقال لمن يرفض الصلح بين المتخاصمين]
  note: «تبطّل كلام» أي تكف عن الخوض في سيرة غيرها؛ فالرغي في نظر صاحب العبارة أصل التوتر بين الناس.
  source: shaalan
  page: 80
  volume: ج٥
  status: draft

- id: u0054
  kind: usage
  prompt: يا عايش بالأمل، يا ميت جوع
  answer: للحث على العمل وترك الاتكال على الأماني
  others: [لمن يصوم أياما طويلة, لمن يتفاءل في كل شدة, لمن ينتظر عودة غائب طال سفره وانقطعت أخباره]
  note: من عاش على الأمل وحده مات جوعا.
  source: sahli
  page: 361
  status: draft

- id: u0055
  kind: meaning
  prompt: فلان عم بيكتب عالمي
  answer: يتعب في ما لا يبقى له أثر
  others: [خطّه جميل واضح, يحفظ السرّ, يسجّل ديونه في دفتر بدقّة كبيرة]
  source: asadi
  line: 140536
  halab: w1086
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0056
  kind: meaning
  prompt: اللى يحبك ياكل رفستك
  answer: الصديق يغفر لك هفواتك
  others: [الصديق يشاركك طعامك, المحب يكثر زيارتك, المحب يدافع عنك في غيابك]
  note: «الرفسة» البازين يؤكل باليد، واللقمة منها؛ من يحبك يأكل لقمتك ولو لم تُتقنها.
  source: zanin
  page: 55
  status: draft

- id: u0057
  kind: usage
  prompt: صلح أضوط ولا شريعه سانيه
  answer: في تفضيل حلّ النزاع بالصلح على طول التقاضي
  others: [في أن الحق يظهر مهما طال الزمن, في أن الطريق المستقيم أقصر الطرق وأسلمها للمسافر, في أن الحاكم العادل خير من الصلح]
  note: الأضوط المعوجّ، والساني المستقيم؛ فالصلح المعوجّ خير من حكم مستقيم يطول عند الحكام.
  source: iryani
  page: 577
  status: draft

- id: u0058
  kind: usage
  prompt: صلّح الغصن وعاده يصلح
  answer: للحث على تقويم الصغير قبل أن يكبر
  others: [للحث على إصلاح الخلاف قبل أن يكبر, للحث على تقليم الأشجار في موسمها, للحث على مسامحة المخطئ أول مرة]
  note: الغصن الطري يستقيم بالتعديل، أما إذا يبس فلا حيلة فيه؛ وكذلك الطفل.
  source: adimi
  page: 258
  status: draft

- id: u0059
  kind: usage
  prompt: حمارة التويم، فيها تسع وتسعين تا
  answer: لكثير العيوب
  others: [لكثير الكلام, لكثير الأسفار, لكثير الأسماء]
  note: 'التاء هنا تاء أفعال مكروهة: تعضّ وترفس وتجمح وتتعثر... إلى تسع وتسعين؛ مبالغة في كثرة العيوب.'
  source: abboudi_amthal
  page: 427
  volume: ج١
  status: draft

- id: u0060
  kind: meaning
  prompt: يشيل فلان بالكبه ويحطه بالطاعون
  answer: يبغضه بغضًا شديدًا فلا يكفّ عن الدعاء عليه
  others: [يحمله ويرعاه في مرضه, يرفعه مرة ويخفضه مرة, يخاف عليه من العدوى فيبعده عن المرضى ويحميه منهم]
  note: الكبة دمل الطاعون؛ أي يدعو عليه كلما ذُكر.
  source: taymur_kinayat
  page: 45
  status: draft

- id: u0061
  kind: meaning
  prompt: يا ليلة بيضة يا نهار سلطاني
  answer: يا له من يوم سعيد!
  others: [يا له من يوم حار!, يا لها من ليلة طويلة!, يا له من يوم رسمي!]
  note: يقال عند الفرح، و«السلطاني» عندهم هو النهار المشرق الجميل.
  source: amin
  page: 396
  status: draft

- id: u0062
  kind: usage
  prompt: إلي عقله في راسه يعرف خلاصه
  answer: في أن العاقل يدبر أموره ويحل مشكلاته بنفسه
  others: [في أن العاقل يستشير غيره في كل صغيرة, في أن العاقل يبتعد عن الناس ليسلم منهم, في أن العاقل يسكت ولا يجادل الجاهل مهما بالغ في الإساءة]
  note: الإنسان السوي يعرف بنفسه أفضل طريق للخلاص مما وقع فيه.
  source: mughniyya
  page: 116
  status: draft

- id: u0063
  kind: usage
  prompt: يا ألف نهار أبيض
  answer: تحية فرح عند اللقاء بعد غياب طويل
  others: [عبارة تقال عند الاعتذار عن خطأ, عبارة تقال تعجبًا من شدة الحر في الظهيرة, عبارة تقال عند وداع المسافر]
  note: النهار الأبيض رمز السعادة والإشراق؛ والتحية تعكس رقة المشاعر عند لقاء الأحبة.
  source: shaalan
  page: 376
  volume: ج٣
  status: draft

- id: u0064
  kind: meaning
  prompt: طور الله في برسيمه
  answer: الغبي الذي لا يفقه شيئًا مما حوله
  others: [الراضي بنصيبه من الدنيا الذي لا يطمع في المزيد, المزارع المجتهد, الغني الذي ورث أرضًا]
  note: الطور هو الثور، يرعى البرسيم ولا يعي غيره.
  source: taymur_kinayat
  page: 52
  status: draft

- id: u0065
  kind: usage
  prompt: هي الحدايه بترمي كتاكيت؟
  answer: للحريص الذي لا يُرجى منه عطاء
  others: [لمن يأخذ ما ليس له من مال غيره, للأم الحريصة على أولادها, لمن يسقط منه الشيء الثمين]
  note: هل عُهد من الحدأة أن تُفلت ما خطفته من الفراخ؟
  source: taymur
  page: 376
  status: draft

- id: u0066
  kind: usage
  prompt: حليب لاوعا مكسور
  answer: لرزق يحصل عليه صاحبه ثم يبدده فيما لا فائدة فيه
  others: [لطعام طيب يقدَّم لمن لا يعرف قدره فيرميه ولا يأكل منه شيئاً, لعمل يبدؤه صاحبه ثم يتركه قبل أن يتمه, لمال يُقرض لمن لا يرده أبداً]
  note: الوعاء المكسور لا يحفظ الحليب، فكذلك الرزق الذي يُصرف في غير وجهه.
  source: akwa
  page: 437
  volume: ج١
  status: draft

- id: u0067
  kind: usage
  prompt: قاطور القربه يملا القدح
  answer: في ألا تستهين بالأشياء الصغيرة إذا استمرت
  others: [في أن القربة المثقوبة لا تصلح لحمل الماء في السفر, في أن الماء القليل يكفي العطشان, في أن الإناء الصغير يمتلئ بسرعة]
  note: القاطور هو القطرات المتتالية من مسام القربة، والقدح هو الإناء؛ والقطرات الصغيرة إذا تتابعت ملأت الإناء.
  source: juhayman
  page: 250
  volume: ج١٠
  status: draft

- id: u0068
  kind: usage
  prompt: بيكحلها عماها
  answer: للأمور العكسية التي تقع نتيجة عدم الدراية
  others: [لمن يبالغ في الزينة, لمن يعالج غيره بلا أجر, لمن يكثر النصح لغيره وهو أحوج الناس إلى النصيحة]
  note: أراد أن يكحّل عينها فأعماها.
  source: zanin
  page: 90
  status: draft

- id: u0069
  kind: usage
  prompt: الْعَشْرَه فَتَّاشَه
  answer: في الحذر واللباقة مع من تعاشره طويلًا
  others: [في الحث على البحث عن عيوب الناس, في ذم من يكثر من الأسئلة عن أحوال جيرانه, في الحث على اختيار الجار قبل الدار]
  note: العشرة تفتّش وتكشف الطباع. لذا ينبغي لمن يعاشر غيره أن يلاطفه ويصبر عليه كي لا يقع بينهما خصام أو فراق.
  source: dadoun
  page: 247
  status: draft

- id: u0070
  kind: meaning
  prompt: يخلق من الفسيخ شربات
  answer: يصنع من الرديء شيئًا حلوًا
  others: [يُفسد الطعام الجيد, يأكل كل شيء, يكثر من الملح والبهارات في الطعام]
  note: يقال للبارع الذي يحوّل أسوأ الأشياء إلى أحسنها.
  source: amin
  page: 398
  status: draft

- id: u0071
  kind: usage
  prompt: خلوفة البر تبن
  answer: للعظيم يترك خلفًا سيئًا
  others: [للزرع الذي يفسده المطر, للغني الذي يبخل على أولاده, لمن يزرع ولا يحصد]
  note: البُرّ القمح، وما يخلّفه بعد الحصاد ليس إلا التبن.
  source: iryani
  page: 245
  status: draft

- id: u0072
  kind: usage
  prompt: صفي النية، ونام في البرية
  answer: للحث على إخلاص النية، فهي أسلم طريق
  others: [لمن يحب النوم في الهواء الطلق, لمن يسافر وحده في الصحراء, لمن يترك بيته بلا حراسة]
  note: من صفت نيته أمن ولو نام في العراء.
  source: sahli
  page: 195
  status: draft

- id: u0073
  kind: meaning
  prompt: مسح له جوخ
  answer: تملّقه
  others: [أهانه, ألبسه ثوبًا جديدًا, خدمه بإخلاص]
  note: كأنه نظّف له ثيابه ونفض عنها الغبار وقام مقام الخادم.
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0074
  kind: usage
  prompt: فوت علينا بكرة
  answer: يقال عن تسويف الموظفين وتعطيل مصالح الناس
  others: [يقال لدعوة الأقارب إلى الزيارة في أيام العيد, يقال لمن يستعجل في البيع والشراء, يقال للضيف الذي يطيل الجلوس]
  note: عبارة شاعت على ألسنة الموظفين للتأجيل أمام أصحاب المصالح، وصارت رمزًا للبيروقراطية.
  source: shaalan
  page: 51
  volume: ج٥
  status: draft

- id: u0075
  kind: usage
  prompt: ماله ساس ولا راس
  answer: للخبر الذي لا أصل له
  others: [للرجل الذي لا أهل له ولا عشيرة, للبيت الذي لا سقف له, للمال الذي لا يُعرف مصدره]
  note: أي ليس له أساس ولا فرع؛ وأصله في الجدار ونحوه.
  source: abboudi_amthal
  page: 1246
  volume: ج٣
  status: draft

- id: u0076
  kind: meaning
  prompt: سلم عليه كسلام الماوردي على بياع الفسيخ
  answer: سلّم عليه بازدراء واحتقار
  others: [سلّم عليه بحرارة وشوق, سلّم عليه من بعيد خوفًا, سلّم عليه ثم اشترى منه بعض الفسيخ]
  note: بائع ماء الورد يتأفّف من رائحة الفسيخ، فيأتي سلامه متعاليًا.
  source: amin
  page: 296
  status: draft

- id: u0077
  kind: meaning
  prompt: بيع حصانك
  answer: يقال لمن يأتي بعد أن أكل الناس
  others: [يقال لمن يتباهى بما لا يملك, يقال لمن يخسر في تجارته, يقال لمن يتأخر عن الحرب]
  note: أي حصانك لم يُسعفك فلم تصل في الوقت المناسب.
  source: zanin
  page: 90
  status: draft

- id: u0078
  kind: usage
  prompt: بصل السوق حالي
  hint: حالي أي حلو
  answer: لمن يستحسن ما عند غيره ويزهد فيما عنده
  others: [لمن يشتري من السوق ما يزرعه في بيته بنفسه, لمن يمدح بضاعته ليبيعها, لمن يكتفي بالقليل الرخيص]
  note: بصل السوق يبدو أحلى لأنه بعيد المنال، أما ما في البيت فيستهين به صاحبه.
  source: adimi
  page: 153
  status: draft

- id: u0079
  kind: meaning
  prompt: رماه من عينه
  answer: أعرض عنه بعد أن كان مقبلًا عليه
  others: [نظر إليه نظرة غضب, تعجب منه ومن غرابة ما فعله أمام الناس, نسيه بعد غيابه]
  note: لشيء رآه منه حطّ قدره عنده فأسقطه من عينه.
  source: taymur_kinayat
  page: 38
  status: draft

- id: u0080
  kind: usage
  prompt: لا تعجب يا عجيب لين تشبح ما تجيب
  answer: في الدعوة إلى التروي وانتظار النتائج قبل الحكم
  others: [في الدعوة إلى التواضع وترك الإعجاب بالنفس, في الدعوة إلى الإسراع في قضاء الحاجات, في الدعوة إلى الاكتفاء بالقليل وترك التطلع إلى ما في أيدي الناس]
  note: «لين تشبح» حتى ترى.
  source: mughniyya
  page: 462
  status: draft

- id: u0081
  kind: usage
  prompt: ثلاثه ما يجزع بهم مركب
  answer: في الثقلاء الذين لا تُطاق صحبتهم
  others: [في الكسالى الذين لا يعملون في السفر, في الأصدقاء الذين لا يفترقون أبداً, في المسافرين الذين يكثرون الأمتعة]
  note: يجزع أي يمشي؛ فلو ركب هؤلاء الثلاثة سفينة لعجزت عن السير بهم.
  source: akwa
  page: 347
  volume: ج١
  status: draft

- id: u0082
  kind: usage
  prompt: الكسبه عند الفقرا حلاوه
  answer: في أن التافه عند قوم عظيم عند آخرين
  others: [في أن الفقير يرضى بالحلوى ولو قليلة, في أن الحلوى طعام الأغنياء وحدهم, في أن الكسب الحلال حلو المذاق دائما]
  note: الكسبة ما يبقى من السمسم بعد عصره، وهي عند الفقراء كالحلوى.
  source: taymur
  page: 298
  status: draft

- id: u0083
  kind: usage
  prompt: يَا قَاطَعْ الدَّمْ، يَا شَارَبْ الْهَمْ
  answer: لمن يقطع صلة رحمه مع أهله وأقاربه
  others: [لمن يجرح غيره في مشاجرة, لمن يكثر الحزن على ما فاته, لمن يمتنع عن أكل اللحم خوفًا على صحته]
  note: الدم عند العامة القرابة. فمن قطع رحمه شرب الهم في الدنيا وتعرض للعقاب في الآخرة.
  source: dadoun
  page: 383
  status: draft

- id: u0084
  kind: usage
  prompt: اقتلب سقله
  answer: في خيبة الأمل حين يتحول ما تنتظره من جيد إلى رديء
  others: [في الفرح بنجاة الزرع من الآفة, في من يبدّل رأيه كل يوم فلا يثق به أحد من أصحابه ولا أهله, في من يبيع الجيد بثمن الرديء]
  note: السَّقْلة ضرب رديء من الشعير، ويُضرب المثل أيضًا في الغش.
  source: iryani
  page: 440
  status: draft

- id: u0085
  kind: usage
  prompt: طعمة وعين أهلها فيها
  answer: لمن يعطي عطية ثم تبقى نفسه متعلقة بها
  others: [لمن يأكل من طعام غيره دون استئذان, لمن يطبخ طعامًا كثيرًا ولا يدعو أحدًا, لمن يشتهي ما في أيدي الناس]
  note: الطعمة هدية اللحم من الجار، وكانت نادرة، فيبقى صاحبها يتطلع إليها أو يذكّر بها.
  source: juhayman
  page: 242
  volume: ج٤
  status: draft

- id: u0086
  kind: meaning
  prompt: حبله على ضهره
  answer: يفعل ما يشاء بلا رقيب
  others: [يحمل همومًا ثقيلة, مستعد للسفر في أي وقت, مقيد بالتزامات كثيرة]
  note: كالدابة التي أُلقي حبلها على ظهرها فتسير حيث شاءت.
  source: taymur_kinayat
  page: 29
  status: draft

- id: u0087
  kind: usage
  prompt: أخوك ما هو أخوك وأبوك ما هو أبوك
  answer: يقال في الحث على الاعتماد على النفس
  others: [يقال في الشكوى من عقوق الأبناء لآبائهم, يقال في التعجب من شدة الشبه بين الأخوين, يقال في ذم من ينكر نسبه وأهله]
  note: من صار رجلًا عليه أن يعتمد على نفسه، فلا يتكل على أخيه أو أبيه في قضاء مصالحه.
  source: shaalan
  page: 89
  volume: ج١
  status: draft

- id: u0088
  kind: meaning
  prompt: لا وراه ولا قدامه
  answer: ليس له شيء
  others: [لا يعرف طريقه, لا يخاف أحدًا, لا يلتفت إلى أحد]
  note: أي لا يملك شيئًا لا خلفه ولا أمامه.
  source: amin
  page: 326
  status: draft

- id: u0089
  kind: usage
  prompt: شوط بقره
  answer: لمن ينشط في أول العمل ثم ينقطع
  others: [لمن يعمل ببطء لكنه يتم عمله, لمن يعدو بلا هدف معلوم, لمن يتأخر عن أصحابه في السفر فيلحقهم ليلا]
  note: يقولون إن للبقرة شوطا واحدا تبدو فيه سريعة سابقة، ثم تلهث ولا تكاد تسير.
  source: abboudi_amthal
  page: 696
  volume: ج٢
  status: draft

- id: u0090
  kind: meaning
  prompt: أعوى لهم عويت ذيب
  answer: اجمع أهلك وأقاربك حولك
  others: [اهرب من الخطر قبل وقوعه, خوّف أعداءك بصوت عالٍ, اطلب الصلح من خصومك]
  note: الذئب إذا عجز عن فريسته وحده عوى عواءً يعرفه الذئاب فتجتمع حوله.
  source: zanin
  page: 27
  status: draft

- id: u0091
  kind: usage
  prompt: خلص عنبك وتينك، كل الناس عدوينك
  answer: لمن ينفض الناس عنه حين تزول منفعتهم عنده
  others: [للفلاح في آخر موسم القطاف, لمن يبيع ثماره قبل نضجها فيخسر نصف ثمنها في السوق, لمن يوزع خيره على الجيران]
  note: ما دام عندك عنب وتين فلك أصدقاء، فإذا نفد صاروا أعداء.
  source: sahli
  page: 141
  status: draft

- id: u0092
  kind: meaning
  prompt: روحه حمره
  answer: ثقيل الظل
  others: [سريع الغضب, شجاع لا يخاف, خجول يحمرّ وجهه]
  note: تعني «حمراء»، وهي من كناياتهم عن الثقل كقولهم «تقيل الدم».
  source: taymur_kinayat
  page: 38
  status: draft

- id: u0093
  kind: usage
  prompt: الظبي في البستان بالخمس نصطاده
  hint: الخمس أي الأصابع الخمس
  answer: تنبيه لطيف لمن علق بوجهه شيء من الطعام
  others: [تنبيه لمن يترك ماله دون حراسة, تشجيع لمن يتردد في اغتنام فرصة سهلة بين يديه, سخرية ممن يتباهى بصيد صغير]
  note: كأن على وجهه ظبيا في بستان يمكن صيده باليد؛ يقال بلطف لمن بقي على لحيته أو وجهه أثر من الطعام.
  source: adimi
  page: 124
  status: draft

- id: u0094
  kind: usage
  prompt: شبح العيب عيب
  answer: لمن لا يرى في الناس إلا عيوبهم
  others: [لمن يستر عيوب أصحابه ويدافع عنهم, لمن يخجل من الاعتراف بخطئه, لمن يعيب الطعام ثم يأكله]
  note: «شبح» رؤية؛ تتبع العيوب والتغاضي عن الحسنات عيب في حد ذاته.
  source: mughniyya
  page: 319
  status: draft

- id: u0095
  kind: usage
  prompt: عدو المرء من عملك عمله
  answer: في ضيق المرء بمن ينافسه في حرفته
  others: [في أن المرء يُعرف بعمله لا بكلامه, في أن العمل الكثير يتعب صاحبه ويضره, في أن العدو لا يُؤمن ولو عمل معك]
  note: أي إن أشد الناس عداوة لك من يعمل في مثل عملك وينافسك فيه.
  source: akwa
  page: 701
  volume: ج٢
  status: draft

- id: u0096
  kind: meaning
  prompt: بيتكلم باللاوندي
  answer: يتكلم كلامًا لا يُفهم
  others: [يتكلم بصوت خافت, يتكلم بأدب ولطف, يتكلم كثيرًا بلا توقف]
  note: يقال لمن يأتي بكلام غامض مبهم كأنه بلغة أجنبية.
  source: amin
  page: 115
  status: draft

- id: u0097
  kind: meaning
  prompt: فلان وجّو ما بيضحك لرغيف السخن
  answer: عبوس دائماً
  others: [شبعان لا يشتهي أكلاً, مريض لا يقدر أن يأكل, فقير لا يجد خبزاً]
  source: asadi
  line: 174606
  halab: w1081
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0098
  kind: usage
  prompt: كيل هزّ وملاية
  answer: يقال عن الكيل الوافر الزائد على المعتاد
  others: [يقال عن البائع الذي يغش في الميزان, يقال عن الحمل الثقيل الذي يهز ظهر صاحبه, يقال عن الكلام الكثير الذي لا فائدة منه]
  note: يُهز المكيال ليستوعب أكثر ثم يُملأ حتى يفيض؛ وهو الكيل الذي يعرفه الفلاحون في الريف.
  source: shaalan
  page: 351
  volume: ج٣
  status: draft

- id: u0099
  kind: meaning
  prompt: رعد ابريل
  answer: شخص يتكلم ولا يفعل
  others: [شخص سريع الغضب سريع الرضا, خبر مفاجئ يخيف الناس, شخص يأتي في غير وقته]
  note: رعد شهر أبريل لا يتبعه مطر في الغالب.
  source: zanin
  page: 154
  status: draft

- id: u0100
  kind: usage
  prompt: اضرب مشطف
  answer: لمن يهدّدك بالرحيل، أي اذهب بعيدًا فلستُ أبالي
  others: [لمن يضرب غيره ثم يهرب, لمن يضيّع طريقه في الجبال, لمن يرمي الشيء من يده في ساعة غضب ثم يندم عليه]
  note: مشطف كلمة تدل على مكان بعيد غير معروف، فهي كقولهم «اضرب تنكه».
  source: iryani
  page: 492
  status: draft

- id: u0101
  kind: meaning
  prompt: كعبه أقشر
  answer: المشؤوم
  others: [سريع المشي, فقير حافي القدمين, كثير السفر]
  note: الكعب العقب، وأقشر أي أحمر كأن جلده قُشر.
  source: taymur_kinayat
  page: 67
  status: draft

- id: u0102
  kind: usage
  prompt: اللِّي زَارْ بْلاَدْ فْلِيُو مَا عَنْدُه لاَشْ يَشْكِي بْمَرْضْ الزّْوَاحْ
  answer: لمن يكون في مكان فيه كل ما يحتاج إليه فلا يحق له الشكوى
  others: [لمن يسافر بعيدًا بحثًا عن الدواء, لمن يمرض كلما تغير الطقس فيلزم بيته ولا يخرج منه إلى العمل, لمن يزور الأطباء ولا يتبع نصائحهم]
  note: الفليو عشبة يُتداوى بها من الزكام، والزواح هو الزكام. فمن نزل بلدًا يكثر فيه الفليو فلا عذر له في الشكوى.
  source: dadoun
  page: 279
  status: draft

- id: u0103
  kind: usage
  prompt: قاطع القوم حلالك
  answer: للشيء يُستدرك منه ما يمكن استدراكه
  others: [لمن يقطع رحمه بسبب المال, لمن يقسم ماله بين أعدائه وأصدقائه بالتساوي دون تمييز, لمن يرفض مشاركة غيره في رزقه]
  note: 'يروون أن بدويا أُغير على غنمه فذبح الغزاة منها شاة، فأكل معهم وقال: أشارك العدو في مالي.'
  source: abboudi_amthal
  page: 927
  volume: ج٣
  status: draft

- id: u0104
  kind: meaning
  prompt: سكتناله دخل بحماره
  answer: سكتنا عن شرّه فتمادى فيه
  others: [سكتنا عنه فاحترمنا الناس جميعًا, رحّبنا به فأكرمنا, تركناه فرحل عنا]
  note: يقال لمن يستغل التسامح معه فيزيد في إساءته.
  source: amin
  page: 235
  status: draft

- id: u0105
  kind: usage
  prompt: أكل تراب
  answer: يقال شماتة بمن طمع فيما ليس له فخاب
  others: [يقال لمن اشتد به الفقر حتى لم يجد طعاما, يقال لمن سقط عن دابته أمام الناس, يقال لمن أكل طعاما رديئا وسكت]
  note: ليس المراد أكل التراب حقيقة، بل هو كناية عن الفشل الذريع بعد دعوى باطلة أو طريق خاطئ.
  source: juhayman
  page: 40
  volume: ج١٠
  status: draft

- id: u0106
  kind: meaning
  prompt: جت له زبده على فطيره
  answer: نال مراده وزيادة بلا تعب
  others: [خسر ما كان يملك, وقع في مشكلة, أكل حتى شبع ثم نام من التعب]
  note: الفطيرة وحدها نعمة، فإذا جاءت معها الزبدة كانت الزيادة.
  source: taymur_kinayat
  page: 39
  status: draft

- id: u0107
  kind: usage
  prompt: تقول جايب الترياق من العراق
  answer: لمن يأتي بشيء تافه ويتباهى به كأنه عظيم
  others: [لمن يسافر بعيدا ويعود خالي اليدين, لمن يصف الدواء للمرضى وهو لا يعرف شيئا عن الطب, لمن يجلب البضائع من بلاد بعيدة]
  note: الترياق دواء ثمين، ويقال تهكما بمن يتفاخر بما لا قيمة له.
  source: sahli
  page: 110
  status: draft

- id: u0108
  kind: usage
  prompt: بركة المصران في النار
  answer: للشيء الذي تقل قيمته كلما استُعمل
  others: [للشيء الذي يزداد ثمنه مع مرور الوقت, للشيء الذي لا يصلح إلا لصاحبه, للشيء الذي يكثر عند الفقراء]
  note: المصران يطول أمتارًا، فإذا وُضع على النار انكمش وتقلص فتضاءل نفعه.
  source: mughniyya
  page: 176
  status: draft

- id: u0109
  kind: usage
  prompt: من زق بابنا أكل لبابنا
  answer: في أن الصديق القريب أولى بالمعروف
  others: [لمن يدخل البيوت بلا استئذان, لمن يطعم ضيفه ثم يمنّ عليه, في أن البيت المغلق لا يدخله الرزق]
  note: 'من طرق بابنا أكل من خيرنا. ويروى: اللي يفتح بابنا ياكل لبابنا.'
  source: taymur
  page: 356
  status: draft

- id: u0110
  kind: usage
  prompt: أقلع من اللحية وحطّ فى الشارب
  answer: لمن لا يعالج الأمور علاجًا جذريًا
  others: [لمن يغيّر رأيه كل يوم فلا يثبت على قرار, لمن يبالغ في الاهتمام بمظهره, لمن يكثر الحلف بلا داعٍ]
  note: ينقل الشعر من اللحية إلى الشارب، فلا يتغيّر شيء.
  source: zanin
  page: 28
  status: draft

- id: u0111
  kind: usage
  prompt: شيبة قمر
  answer: يقوله الشاب الطائش تهكماً بالشيخوخة
  others: [يقوله المحب مدحاً لجمال حبيبه, يقوله الشيخ فخراً بوقاره وحكمته, يقوله الناس في الرجل الذي شاب مبكراً]
  note: يسخر الشاب من الشيب فيشبهه بالقمر في بياضه.
  source: akwa
  page: 627
  volume: ج١
  status: draft

- id: u0112
  kind: usage
  prompt: وقف على أشابيره
  answer: يقال عمن وقف متحفزًا على أطراف أصابعه
  others: [يقال عمن جلس مطمئنًا لا يهتم بشيء حوله, يقال عمن أشار بإصبعه إلى غيره يتهمه, يقال عمن عدّ ماله على أصابعه أمام الناس]
  note: الأشابير هي أطراف الأصابع؛ ويقال أيضًا لمن يطيل قامته ليرى شيئًا بعيدًا.
  source: shaalan
  page: 186
  volume: ج٢
  status: draft

- id: u0113
  kind: usage
  prompt: شرّك لنا وخيرك لغيرنا
  answer: لمن يخص الغرباء بخيره وأهله بأذاه
  others: [لمن يعطي أهله وأقاربه أكثر مما يستحقون, لمن يبخل على نفسه ليعطي الناس, لمن يعادي جيرانه ويصادق البعيد]
  note: يعاتب به الأهل من لا يرون منه إلا الشر بينما ينعم الغرباء بخيره.
  source: adimi
  page: 249
  status: draft

- id: u0114
  kind: meaning
  prompt: عضمه خشنه
  answer: من لا تُستطاع مناوأته لقوته ومكانته
  others: [البخيل الذي لا يعطي, الفقير الذي يعيش على الخشن, العنيد الذي لا يسمع النصح]
  note: كالعظم الخشن الذي لا يُطمع في كسره.
  source: taymur_kinayat
  page: 56
  status: draft

- id: u0115
  kind: usage
  prompt: هارب ولا حانب
  answer: أن تُتَّهم بالفرار خير من أن تتورط في المشكلة
  others: [أن الجبان لا يستحق أن يُعان على أمره, أن من هرب من المعركة لا يُقبل منه عذر, أن الفرار من الدَّين لا يُسقطه بل يزيده ثقلًا على صاحبه]
  note: حَنَب فلان في لهجات اليمن أي علق وتورّط فلا يستطيع خروجًا ولا نزولًا.
  source: iryani
  page: 202
  status: draft

- id: u0116
  kind: meaning
  prompt: ما كنش عشمي
  answer: خاب أملي
  others: [لم أكن جائعًا, لم أكن أعرفه, لم أكن موجودًا]
  note: العشم هو الرجاء والأمل في الشخص، فهذا تعبير عن خيبته.
  source: amin
  page: 334
  status: draft

- id: u0117
  kind: meaning
  prompt: بين الظفر واللحم
  answer: التدخل بين الناس في أمر لا يعنيه
  others: [صداقة قوية لا تنفصل, موضع ضيق مؤلم لا يصل إليه الدواء بسهولة, أمر صغير لا يُرى]
  note: أي لا تدخل بين الظفر واللحم، فهما لا يفترقان.
  source: zanin
  page: 91
  status: draft

- id: u0118
  kind: usage
  prompt: كُنْ صَافِي، وَالْعَنْ الْبَيْطَارْ
  answer: لمن يتقن عمله فلا يبالي بمن يراقبه
  others: [لمن يشتم الطبيب إذا أخطأ في علاجه, لمن يبيع دابة معيبة ويخفي عيبها, لمن يتعلم صنعة على يد معلم قاس فيتقنها]
  note: البيطار من كان يفحص الدواب في الأسواق. فإن كانت الدابة سليمة لم تخشَ فحصه، وكذلك المتقن لا يخشى النقد.
  source: dadoun
  page: 231
  status: draft

- id: u0119
  kind: meaning
  prompt: عجوه برملها
  answer: الشخص على فطرته لم يتعلم ولم يتهذب
  others: [الطعام الحلو الذي يقدم للضيوف مع القهوة, الكريم الذي يعطي كل ما يملك, الشيء الرخيص]
  note: العجوة إذا لم تُنقَّ بقي فيها رملها.
  source: taymur_kinayat
  page: 55
  status: draft

- id: u0120
  kind: usage
  prompt: يدخل عصّه، بشيٍ ما يخصّه
  answer: لمن يتدخل في أمور هو في غنى عن الدخول فيها
  others: [لمن يأكل من طعام غيره بلا دعوة, لمن يطيل الكلام في غير موضعه, لمن يعتدي على أرض جاره ويضمها إلى أرضه ظلما]
  note: «العصّ» أصل الذنَب، وجاؤوا بهذا اللفظ ليطابق السجعة.
  source: abboudi_amthal
  page: 1704
  volume: ج٥
  status: draft

- id: u0121
  kind: usage
  prompt: ساسي ومتشرط
  answer: لمن يضع الشروط وهو في حاجة إلى غيره
  others: [لمن يعطي الصدقة ثم يمنّ بها, لمن يكثر الشروط في بيعه وشرائه, لمن يتسول وهو غني عن الناس ويخفي ماله عنهم]
  note: «ساسي» متسول؛ ليس للمحتاج أن يملي شروطه على من يحسن إليه.
  source: mughniyya
  page: 307
  status: draft

- id: u0122
  kind: meaning
  prompt: قعد يودي ويجيب
  answer: أخذ يقلّب الأمر في رأسه متحيّرًا
  others: [ظل يحمل الأمتعة جيئة وذهابًا طوال اليوم, عمل ساعيًا للبريد, ظل يزور أقاربه]
  note: 'كما تقول العرب: يضرب أخماسًا في أسداس.'
  source: amin
  page: 312
  status: draft

- id: u0123
  kind: usage
  prompt: ما يروحش من رزقك حاجة
  answer: يقال مواساةً لمن ضاع منه شيء، فرزقه مقسوم له
  others: [يقال لمن يبذّر ماله حتى لا يبقى منه شيء أبدًا, يقال لمن يطمع في رزق غيره وينافسه عليه, يقال لمن يترك العمل انتظارًا لرزق يأتيه وحده]
  note: يطيّب الناس خاطر من فاته رزق بأن الأرزاق مقسومة بيد الله، فما كتب له لن يذهب إلى غيره.
  source: shaalan
  page: 470
  volume: ج١
  status: draft

- id: u0124
  kind: usage
  prompt: خريط بدبه
  answer: للشيء الكبير المظهر الذي لا نفع فيه
  others: [لمن يحفظ أسراره فلا يبوح بها لأحد, لمن يجمع المال في مكان لا يعلمه أحد, لمن يتكلم قليلًا ويعمل كثيرًا]
  note: الخريط الكلام الذي لا نتيجة له، والدبة إناء مجوّف كبير البطن صغير الرأس؛ يسمع منه صوت ولا تفهم منه شيئًا.
  source: juhayman
  page: 30
  volume: ج٣
  status: draft

- id: u0125
  kind: usage
  prompt: يالله بحمله يقوم
  answer: لمن يُطلب منه عمل فوق ما يقدر عليه
  others: [لمن يحمل أثقال غيره دون أن يُطلب منه, لمن يقوم مبكراً للعمل قبل الناس, لمن يدعو الله أن يخفف عنه الحمل]
  note: أي يكفيه أن ينهض بحمله هو، فكيف يُطلب منه أكثر.
  source: akwa
  page: 1361
  volume: ج٢
  status: draft

- id: u0126
  kind: meaning
  prompt: هو انت جيت في جمل
  answer: لم تطلب شيئًا عظيمًا يصعب تحقيقه
  others: [لم تأت في وقت مناسب, لم تحضر معك هدية تليق بأهل البيت, لم تأت من مكان بعيد]
  note: «جا في جمل» كناية عن طلب الشيء العظيم؛ فيقولها من يقبل طلبًا يسيرًا.
  source: taymur_kinayat
  page: 27
  status: draft

- id: u0127
  kind: usage
  prompt: لا تلقصيني ولا اشتي منش عسل
  answer: لمن ترجو منه خيرًا فيوشك أن يصيبك بأذاه فتصدّه
  others: [لمن يطلب الربح من غير أن يتعب في تحصيله, لمن يعطيك القليل من ماله ثم يمنّ به عليك أمام الناس, لمن يمدح الشيء أمامك ثم يذمه في غيابك]
  note: الكلام موجّه إلى النحلة، أي لا تلسعيني ولا أريد منك عسلًا.
  source: iryani
  page: 812
  status: draft

- id: u0128
  kind: usage
  prompt: اقتلنى يا سمن البقر
  answer: لمن لا يعرف قيمة الشيء النافع
  others: [لمن يأكل الطعام الدسم حتى يُتخم ويمرض, لمن يبالغ في مدح الطعام, لمن يفضّل الغالي على الرخيص]
  note: يشكو من سمن البقر كأنه يؤذيه، وهو من أنفع الطعام.
  source: zanin
  page: 27
  status: draft

- id: u0129
  kind: usage
  prompt: تحت التراب، ولا عند الكلاب
  answer: لتفضيل الموت على العيش في الذل
  others: [لمن يدفن ماله خوفا من اللصوص, لمن يخاف الكلاب في الليل, لمن يزرع أرضه بنفسه]
  note: الكريم يرى القبر أهون من أن يعيش ذليلا بين اللئام.
  source: sahli
  page: 108
  status: draft

- id: u0130
  kind: usage
  prompt: يردّه عن مجرى طريقه عود
  answer: للمتردد الضعيف العزم
  others: [للمسافر الذي يضل طريقه, للعنيد الذي لا يرجع عن رأيه, للحذر الذي يتجنب العقبات]
  note: أي يكفي عود صغير ليصرفه عن وجهته.
  source: abboudi_amthal
  page: 1719
  volume: ج٥
  status: draft

- id: u0131
  kind: usage
  prompt: لا تحشر برمتك بين الدسوت
  hint: البرمة قدر من الفخار، والدست قدر من المعدن
  answer: لمن يقحم نفسه بين من هم أكبر منه
  others: [لمن يتدخل في خلاف بين أخوين, لمن يطبخ أكثر من حاجة بيته, لمن يستعير أدوات جيرانه ولا يردها]
  note: لا تُدخل قدرك الصغيرة بين القدور الكبيرة؛ أي اعرف قدرك ولا تزاحم من يفوقك.
  source: adimi
  page: 340
  status: draft

- id: u0132
  kind: meaning
  prompt: جبال الكحل تفنيها المراود
  answer: الكثير يفنى مع الأخذ منه ولو قليلًا
  others: [الزينة لا تدوم, القليل يكفي الكثير إذا أحسن صاحبه تدبيره, الجبال لا تتغير]
  note: فالمرود يأخذ من الكحل شيئًا يسيرًا، لكن الأخذ الدائم يُفني الجبال منه.
  source: amin
  page: 345
  status: draft

- id: u0133
  kind: usage
  prompt: راح يخطبها له اجوزها
  answer: لمن يُستعان به في أمر فيأخذه لنفسه
  others: [لمن يتأخر حتى يفوته ما يريد, لمن يتوسط بين المتخاصمين فيصلح بينهم, لمن يتزوج من غير أهله]
  note: ذهب ليخطب امرأة لصاحبه فخطبها لنفسه وتزوجها.
  source: taymur
  page: 171
  status: draft

- id: u0134
  kind: usage
  prompt: إضحك وانشرح واوعى صبعك لينجرح
  answer: يقال نصحًا بالفرح مع الحذر من الأذى
  others: [يقال لمن يضحك في موقف حزين, يقال لمن يعمل بيديه في صنعة خطرة, يقال لمن يكتم فرحه عن الناس خوفًا من الحسد]
  note: «اوعى» أي احذر، و«صبعك» إصبعك؛ فللإنسان أن يفرح ويلهو بشرط ألا يتمادى حتى يصيبه الأذى.
  source: shaalan
  page: 104
  volume: ج١
  status: draft

- id: u0135
  kind: meaning
  prompt: حلق له على الناشف
  answer: عامله بالشدة والقسوة
  others: [خدعه وأخذ ماله, أكرمه بلا مقابل, أهمله ولم يلتفت إليه]
  note: الحلاقة بلا صابون مؤلمة شاقة، وكذلك المعاملة الخشنة.
  source: taymur_kinayat
  page: 30
  status: draft

- id: u0136
  kind: usage
  prompt: حَكْ لِيَ نْحَكْ لِيكْ
  answer: في الحث على تبادل العون بين الناس
  others: [في ذم من يتقرب إلى الناس بالنفاق, في التحذير من مخالطة المصابين بالجرب, في ذم من يكثر الشكوى من الناس]
  note: 'أعنّي أُعنك. يدعو إلى أن يساعد كل منا الآخر عند الحاجة، كما يقال: اليوم عليّ وغدًا عليك.'
  source: dadoun
  page: 79
  status: draft

- id: u0137
  kind: meaning
  prompt: صار كل واحد براس رابية
  answer: تفرّقوا واختلفوا
  others: [اغتنوا وبنوا القصور, تسابقوا إلى الجبل, حرسوا البلد من كل جهة]
  source: asadi
  line: 174082
  halab: w1092
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0138
  kind: usage
  prompt: إلي يضحك لك اضحك له
  answer: في معاملة الناس بمثل ما يعاملونك به
  others: [في الحث على الابتسام في وجوه الغرباء, في التحذير ممن يضحك لك ويضمر الشر, في ذم كثرة الضحك والمزاح]
  note: من بادرك بالود فبادله الود؛ المعاملة بالمثل.
  source: mughniyya
  page: 146
  status: draft

- id: u0139
  kind: meaning
  prompt: صبح منيل
  answer: أصبح ضيّق الصدر سيئ الحال
  others: [أصبح نشيطًا مبكرًا, أصبح غنيًّا فجأة بعد فقر طويل, أصبح مسافرًا]
  note: 'يقال لمن أصبح غير منشرح النفس، ومثله: صبح مدخّن.'
  source: amin
  page: 256
  status: draft

- id: u0140
  kind: usage
  prompt: ارمد وداووه بالثوم
  answer: لمن يزيد المشكلة سوءًا بدل أن يحلّها
  others: [لمن يعالج نفسه بما ينصحه به الناس, لمن يصبر على الألم حتى يُشفى, لمن يخفي مرضه عن أهله حتى لا يشغلهم بأمره]
  note: الأرمد مصاب بالتهاب العين، والثوم يزيدها حرقة.
  source: zanin
  page: 19
  status: draft

- id: u0141
  kind: meaning
  prompt: عيني عينك
  answer: الجهر بالشيء أمام الناس
  others: [الحسد وإصابة العين, التفاهم بالنظرات, المحبة الشديدة]
  note: يقولون «كلمته عيني عينك» أي لم أُخفِ عنه شيئًا.
  source: taymur_kinayat
  page: 58
  status: draft

- id: u0142
  kind: usage
  prompt: ما مليح إلا وحمّا
  answer: في أن الحسن لا يكتمل، فكل جميل فيه ما يُتحسّر على نقصه
  others: [في أن الجمال يزول مع الأيام فلا ينبغي أن يغترّ به صاحبه, في أن الحسود لا يرى في الحسن إلا العيب, في أن الكلام الطيب لا يغني عن الفعل]
  note: يقال في كل حسن، يا أسفاه لو لم يكن فيه كذا، أو لو زاد فيه كيت.
  source: iryani
  page: 200
  status: draft

- id: u0143
  kind: usage
  prompt: ما يبلّش الريق
  answer: يقال عن البخيل الذي لا يقدم أقل العون
  others: [يقال عن الطعام الحار الذي يلسع اللسان, يقال عن الكلام الذي يجرح المشاعر, يقال عن الصائم الذي لا يفطر طول اليوم]
  note: بل الريق هو مجرد ترطيب الفم؛ فمن لا يقدم حتى هذا القدر فهو عديم المروءة.
  source: shaalan
  page: 246
  volume: ج٣
  status: draft

- id: u0144
  kind: usage
  prompt: التعب منسي
  answer: لتسلية المتعب بأن تعبه سيزول وحثه على إتمام عمله
  others: [لذم من ينسى فضل من تعب من أجله ويجحد ما قدمه له من خير, للتحذير من كثرة العمل لأنها تُنسي صاحبها أهله, لمن يتعب في عمل ثم ينسى أن يأخذ أجرته]
  note: يقال للمرهق من كثرة العمل، ويقال أيضاً تحفيزاً على الإسراع في إنجازه.
  source: akwa
  page: 337
  volume: ج١
  status: draft

- id: u0145
  kind: usage
  prompt: طير مبرقع
  answer: لصاحب القدرة والرأي الممنوع من أن يتصرف ويعمل
  others: [لمن يخفي وجهه حياءً من الناس, لمن يطير فرحًا بأول نجاح, لمن يتنقل من بلد إلى بلد بلا هدف ولا عمل يرجع إليه]
  note: الطير هنا الصقر، يوضع على رأسه برقع فلا يرى ولا يطير حتى يُنزع عنه.
  source: juhayman
  page: 274
  volume: ج٤
  status: draft

- id: u0146
  kind: usage
  prompt: الحلال وبره يحتّ وينبت
  answer: تعزية لمن افتقر بعد غنى
  others: [تهنئة لمن رُزق مالا بعد فقر, نصيحة لمن يبذّر ماله في غير وجهه, لوم لمن يبخل بماله على أهله]
  note: «الحلال» المال، و«يحتّ» يتساقط؛ فالمال كوبر البعير، يتساقط حتى لا يبقى منه شيء ثم ينبت من جديد.
  source: abboudi_amthal
  page: 419
  volume: ج١
  status: draft

- id: u0147
  kind: usage
  prompt: بسأل عن البيضة واللي باضها، والجاجة واللي جابها
  answer: للفضولي الذي يسأل عن كل صغيرة وكبيرة
  others: [للتاجر الذي يتحرى عن بضاعته, لمن يربي الدجاج في بيته, لمن يشتري البيض من السوق]
  note: لا يكتفي بالسؤال عن البيضة حتى يسأل عن الدجاجة وأمها.
  source: sahli
  page: 88
  status: draft

- id: u0148
  kind: meaning
  prompt: إيده ناشفه
  answer: البخل
  others: [الفقر وضيق الحال, التعب من كثرة العمل, قسوة القلب]
  note: اليد الجافة لا يقطر منها شيء، ويقابلها قولهم «إيده مفتوحه» للكريم.
  source: taymur_kinayat
  page: 20
  status: draft

- id: u0149
  kind: meaning
  prompt: بختك يا أبو بخيت
  answer: سأفعل الأمر لك، فإن صلح فلك وإن فسد فعليك
  others: [حظك أحسن من حظي، فلا تقلق مما سيأتي, لا تعتمد على الحظ، واعمل بيدك وحدك, سأفعل الأمر لنفسي، ولا شأن لك بنتيجته]
  note: يقولها من يقوم بعمل لغيره ويُلقي على حظّ صاحبه تبعة النتيجة.
  source: amin
  page: 90
  status: draft

- id: u0150
  kind: meaning
  prompt: أذل من الحبارة
  answer: يقال للجبان
  others: [يقال للفقير المحتاج, يقال للضيف الثقيل, يقال لكثير الشكوى]
  note: الحبارى طائر صحراوي يُضرب به المثل في الضعف والفرار.
  source: zanin
  page: 18
  status: draft

- id: u0151
  kind: usage
  prompt: عين وراس زي الناس
  answer: في أن الناس متساوون فلا مبرر للتكبر
  others: [في أن الإنسان يُعرف من عينيه, في أن تقليد الناس في كل شيء عيب, في أن الرأس الكبير لا يعني العقل الكبير]
  note: الغني كالفقير له رأس واحد وعينان، فعلامَ التكبر والتجبر؟
  source: mughniyya
  page: 385
  status: draft

- id: u0152
  kind: usage
  prompt: ساعة من المغني واغنى
  answer: عند نزول المطر شكرا لله على كرمه
  others: [عند سماع الغناء والطبول في الأعراس والأفراح, عند اغتناء الفقير فجأة, عند انتهاء موسم الحصاد]
  note: ساعة من مطر الله تغني الناس وتكفيهم؛ يقولونها حين يهطل المطر.
  source: adimi
  page: 242
  status: draft

- id: u0153
  kind: usage
  prompt: زَيَّرْ اللّْوَالَبْ، لاَ تَبْقَى رَاخِي لَحْبَلْ
  answer: لمن يرعى أطفالًا أو أناسًا فيحسن ضبطهم
  others: [لمن يربط دابته ربطًا محكمًا, لمن يشدّ على نفسه في الإنفاق, لمن يصلح الآلات القديمة بيده ليوفر أجرة الصانع]
  note: شُدّ اللوالب ولا ترخِ الحبل. نصيحة لمن تحت رعايته أبناء أو غيرهم ألا يترك لهم الحبل على الغارب.
  source: dadoun
  page: 127
  status: draft

- id: u0154
  kind: usage
  prompt: كلّ مطرود ملحوق
  answer: لانقضاء الزمن، ولنفاد المال الكثير بالإنفاق
  others: [لمن يهرب من دائنيه فلا يدركونه, لمن يُطرد من قومه ثم يعود إليهم بعد زمن طويل نادما, لمن يسبق غيره في كل سباق]
  note: كل ما يُطارَد لا بد أن يُدرَك؛ وكذلك الأيام تنقضي والمال ينفد قليلا قليلا.
  source: abboudi_amthal
  page: 1060
  volume: ج٣
  status: draft

- id: u0155
  kind: usage
  prompt: أبرد من يخ
  answer: للثقيل البارد الروح
  others: [لمن يشعر بالبرد كثيرا, للماء الصافي النقي, لمن يهدأ وقت الغضب]
  note: 'اليخ: الثلج، يضربون به المثل في البرود المعنوي.'
  source: taymur
  page: 3
  status: draft

- id: u0156
  kind: meaning
  prompt: زي الشوربه
  answer: جمع مختلط بلا نظام
  others: [شيء سهل الهضم, كلام لا طعم له, أمر مريح للنفس]
  note: الشوربة يختلط فيها الأرز باللحم والخضر.
  source: taymur_kinayat
  page: 39
  status: draft

- id: u0157
  kind: usage
  prompt: حمّا تعبك يا سالم
  answer: لمن ضاع جهده سدى، وخاصة إذا كان هو من ضيّعه
  others: [لمن يتعب في عمل طويل ثم ينسب الناس الفضل لغيره, لمن يعمل بلا أجر ولا شكر, لمن يُكثر الشكوى من تعب قليل]
  note: حُمّا كلمة تُقال للتحسّر بمعنى يا للأسف.
  source: iryani
  page: 200
  status: draft

- id: u0158
  kind: usage
  prompt: الناس هتقول علينا إيه
  answer: يقال خوفًا من كلام الناس والفضيحة وسوء السمعة
  others: [يقال عند انتظار رأي الضيوف في الطعام الذي قُدِّم لهم, يقال عند السؤال عن أخبار الأقارب الغائبين, يقال عند الاستعداد لإلقاء خطبة أمام الناس]
  note: يعبر عن الخوف من القيل والقال، وعن الحرص الشديد على صورة الأسرة أمام المجتمع.
  source: shaalan
  page: 76
  volume: ج٤
  status: draft

- id: u0159
  kind: usage
  prompt: كل من ذنبه على جنبه
  answer: في أن كل إنسان يتحمل تبعة أخطائه
  others: [في أن كل إنسان يخفي عيوبه عن الناس, في أن المذنب لا ينام مرتاحاً على جنبه, في أن الناس يحمّلون غيرهم ذنوبهم]
  note: أي إن خطأ كل امرئ محسوب عليه وحده.
  source: akwa
  page: 861
  volume: ج٢
  status: draft

- id: u0160
  kind: usage
  prompt: عاود امنين اربحت
  answer: في دعوة المرء إلى الإفادة من تجاربه السابقة
  others: [في دعوة التاجر إلى مغادرة السوق إذا خسر, في دعوة المسافر إلى العودة إلى بلده, في دعوة الغني إلى مساعدة الفقير من الأرباح التي جناها]
  note: ارجع إلى الموضع الذي ربحت منه من قبل.
  source: mughniyya
  page: 361
  status: draft

- id: u0161
  kind: meaning
  prompt: سرجوا له شمعه
  answer: أفلس
  others: [احتفلوا بقدومه, سهروا عنده ليلًا, رفعوا من شأنه]
  note: كانوا في المحكمة يوقدون ثلاث شمعات عند بيع متاع المفلس، ويطفئون واحدة مع كل عرض حتى يتم البيع.
  source: taymur_kinayat
  page: 41
  status: draft

- id: u0162
  kind: meaning
  prompt: انجزت ولحقت غنمها
  answer: أمر انتهى ولا فائدة من التدخل فيه
  others: [أمر أُنجز بإتقان ونال صاحبه الثناء, امرأة نشيطة تقضي عملها بسرعة, أمر سهل لا يحتاج إلى تعب]
  note: قضت حاجتها ولحقت بغنمها، فلا شيء بقي.
  source: zanin
  page: 68
  status: draft

- id: u0163
  kind: usage
  prompt: من جا بلا دعوه قعد بلا فراش
  answer: لمن يعرض نفسه للإهانة بالمجيء إلى حيث لم يُدع
  others: [لمن يزور أقاربه دون موعد سابق فيستقبلونه بالترحاب, للضيف الذي يرضى بالقليل من الطعام, لمن يسافر دون أن يحمل زاده]
  note: من يُدعى تُعد له أسباب الراحة والكرامة، أما الطفيلي فيجلس حيث اتفق.
  source: juhayman
  page: 137
  volume: ج٨
  status: draft

- id: u0164
  kind: meaning
  prompt: نفض له الفروة
  answer: اضربه علقة
  others: [أكرمه وأجلسه, أعطه ثوبًا جديدًا, نظّف له مجلسه]
  note: لغة رمزية كان الآباء يقولونها لشيخ الكتّاب إذا أساء الولد.
  source: amin
  page: 295
  status: draft

- id: u0165
  kind: usage
  prompt: درهم بخت، ولا خزاين مال
  answer: لتفضيل الحظ السعيد على الغنى
  others: [لمن ينفق ماله في غير موضعه, للبخيل الذي يجمع المال ولا ينفقه, للقناعة بالقليل من الرزق]
  note: قليل من الحظ ينفع صاحبه أكثر من خزائن المال.
  source: sahli
  page: 147
  status: draft

- id: u0166
  kind: usage
  prompt: إذا قعدت بين السيل لا تهم البلل
  answer: لمن وقع في ورطة كبيرة فلا يهمه صغيرها
  others: [لمن يبالغ في الحذر من خطر بعيد لا يخصه, لمن يتعجل الخروج من مكان مزدحم, لمن يخاطر بنفسه لينقذ غيره]
  note: من صار وسط السيل لا يشغله أن تبتل ثيابه؛ فلا تنشغل بالآثار الصغيرة لمحنة كبيرة.
  source: adimi
  page: 84
  status: draft

- id: u0167
  kind: usage
  prompt: حاطط عينيه فى وسط راسه
  answer: يقال عمن ينتبه بكل حواسه في مكان غير مأمون
  others: [يقال عمن يتكبر على الناس ولا ينظر إليهم, يقال عمن ينام كثيرًا ولا يبالي بشيء, يقال عمن يتجسس على جيرانه من الشباك ليلًا]
  note: يعبر عن شدة الانتباه، خاصة حين يكون المرء بين خصوم يريدون النيل منه.
  source: shaalan
  page: 191
  volume: ج٣
  status: draft

- id: u0168
  kind: meaning
  prompt: خبر أبيض
  answer: الخبر السيئ
  others: [الخبر السار, الخبر الكاذب, الخبر القديم المعروف]
  note: من الأضداد عندهم؛ يقولون «أبيض» ويريدون الأسود تحاشيًا للفأل السيئ.
  source: taymur_kinayat
  page: 33
  status: draft

- id: u0169
  kind: meaning
  prompt: فال الله ولا فالك
  answer: ما عند الله خير مما تتوقعه
  others: [كلامك صحيح فلا تخف, اسكت فإنك تجلب الشر, توقعاتك دائمًا تصدق فاحذر منها]
  note: يقال ردًّا على من يتنبأ بسوء، رجاءً في الخير.
  source: amin
  page: 292
  status: draft

- id: u0170
  kind: usage
  prompt: الْكَرْكُورْ، وَالْعَيْشْ الْمُرْ
  answer: لمن يكدّس المال ولا يتمتع به في حياته
  others: [لمن يبني بيته بالحجارة وحده دون أن يستعين بأحد, لمن يأكل الطعام المرّ ليتداوى, لمن يشكو دائمًا من غلاء المعيشة]
  note: الكركور كومة الأشياء المكدسة. يقال فيمن يجمع المال ويعيش في ضيق، ثم يتركه لمن لا يترحم عليه.
  source: dadoun
  page: 303
  status: draft

- id: u0171
  kind: usage
  prompt: يقوله عمي قمعان
  answer: في الشبعان الغني لا يحس بحاجة غيره
  others: [في الكذاب الذي ينسب كلامه إلى غيره, في الصغير الذي يردد كلام الكبار, في البخيل الذي يدّعي الفقر]
  note: «القمع» ما على رأس التمرة؛ يروون أن رجلا أنكر أن عنده تمرا وقمع تمرة عالق بلحيته، فسمّاه صاحبه «عمي قمعان».
  source: abboudi_amthal
  page: 1769
  volume: ج٥
  status: draft

- id: u0172
  kind: usage
  prompt: حيرك على العصيد واللبن
  answer: للعاجز وقت الجد السريع إلى الطعام عند حضوره
  others: [للكريم الذي يقدّم أفضل ما عنده لضيفه, لمن يأكل القليل من الطعام ويعمل الكثير طوال النهار, لمن يختار الطعام البسيط ويترك الفاخر]
  note: الحَيْر في لهجاتهم القوة والقدرة، فكأنه يقول، قوتك لا تظهر إلا على العصيدة واللبن.
  source: iryani
  page: 218
  status: draft

- id: u0173
  kind: meaning
  prompt: اللى فيها الحليب تصيّح
  answer: صاحب الحاجة هو الذي يطلبها ويُلحّ فيها
  others: [صاحب النعمة يتباهى بها أمام الناس, الكثير الكلام قليل الفعل, الغني لا يشعر بحاجة الفقير]
  note: كالناقة أو البقرة الممتلئة حليبًا تصيح لتُحلب.
  source: zanin
  page: 45
  status: draft

- id: u0174
  kind: usage
  prompt: بيدي باليمنى ويأخذه باليسرى
  answer: لمن يحتال لاسترجاع ما أعطى لؤماً وبخلاً
  others: [لمن يأخذ أكثر مما يعطي في البيع والشراء, لمن يعطي بيد ويتصدق بالأخرى سراً, لمن ينقل الشيء من مكان إلى آخر بلا فائدة]
  note: يدّي أي يعطي؛ يعطي بيمينه ثم يسترد بيساره.
  source: akwa
  page: 307
  volume: ج١
  status: draft

- id: u0175
  kind: usage
  prompt: واكل الراس متوسد البطانه
  answer: كناية عمن يحيا في راحة وهناء لا يكدرهما شيء
  others: [كناية عمن يأكل كثيرًا ثم ينام دون عمل, كناية عمن يعيش ضيفًا على غيره ولا يقدم لمضيفه أي عون, كناية عمن يملك كثيرًا ولا يشكر]
  note: «واكل» آكل؛ أكل لحم الرأس واتكأ على أريكة يهنأ بنعمة الشبع.
  source: mughniyya
  page: 540
  status: draft

- id: u0176
  kind: meaning
  prompt: إحنا حنقرد؟!
  answer: هل نحن نهزل؟ لنتكلم بجد
  others: [هل نحن في سيرك؟ لنضحك, هل سنسافر؟ لنستعد, هل نحن أطفال؟ لنلعب]
  note: يقال ردًّا على من يهزل وقت الجد، أو على تكليف سخيف، أخذًا من ألعاب القرداتي.
  source: amin
  page: 308
  status: draft

- id: u0177
  kind: usage
  prompt: اللي له كف ياخده اتنين
  answer: في إيفاء كل ذي حق حقه وزيادة
  others: [في الرد على الضربة بضربتين, في أن اليد الواحدة لا تصفق وحدها, في أن الكريم يأخذ أكثر مما يعطي]
  note: الكف هنا نوع من الخبز يُصنع على هيئة الكف ويوزع صدقة في المواسم؛ من له عندنا كف أعطيناه اثنين.
  source: taymur
  page: 45
  status: draft

- id: u0178
  kind: meaning
  prompt: باطه والنجمه
  answer: الفقير الذي لا يملك شيئًا
  others: [الساهر الذي يراقب النجوم, المسافر الذي لا يعرف طريقه, المتكبر الذي يرفع رأسه]
  note: الباط هو الإبط؛ إذا رفع ذراعه لم يرَ إلا إبطه ونجم السماء.
  source: taymur_kinayat
  page: 21
  status: draft

- id: u0179
  kind: usage
  prompt: ربّى ولاد النمر لما يشبّوا ياكلوك
  answer: يقال تحذيرًا من تربية أبناء الأشرار لأنهم يؤذون من رباهم
  others: [يقال لمن يدلل أبناءه حتى يفسدوا ولا يسمعوا كلامه, يقال لمن يربي أولاده على الشجاعة والقوة والإقدام منذ الصغر, يقال لمن يأكل حق الأيتام الذين يتولى رعايتهم]
  note: تُروى معه حكاية فلاح ربّى ذئبًا صغيرًا، فلما كبر أكل دجاجه ثم خروفه؛ فالطبع يغلب التربية.
  source: shaalan
  page: 66
  volume: ج٢
  status: draft

- id: u0180
  kind: usage
  prompt: طق ظلال
  answer: لمن ينتقم من خصومه بأشياء لا تؤثر فيهم
  others: [لمن يجلس في الظل طوال يومه ويترك العمل لغيره, لمن يخاف من خياله إذا رآه, لمن يضرب أولاده على أتفه الأسباب]
  note: الطق الضرب والظلال ظل الإنسان أو خياله؛ فمن يضرب الظل لا يصيب صاحبه بشيء.
  source: juhayman
  page: 247
  volume: ج٤
  status: draft

- id: u0181
  kind: meaning
  prompt: أشكره خبر
  answer: عمل الشيء جهرًا أمام الناس
  others: [نقل الخبر قبل التثبت منه, شكر الناس على معروفهم, إخفاء الأمر عن أهله]
  note: أصلها كلمة تركية «آشكار» بمعنى الظاهر المكشوف، يقال لمن فعل فعلته علانية.
  source: taymur_kinayat
  page: 18
  status: draft

- id: u0182
  kind: meaning
  prompt: فلان بينشل الكحل من العين
  answer: لصّ بارع خفيف اليد
  others: [طبيب عيون ماهر, يحبّ الزينة, يغار من الناس]
  note: وردت في «ثمرات الأوراق» وتمثّل بها القاضي الفاضل.
  source: asadi
  line: 140803
  halab: w1095
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0183
  kind: usage
  prompt: ما هو بطير ليل
  answer: لمن يمنعه جبنه من السفر ليلا في الصحراء
  others: [لمن ينام مبكرا ولا يسهر, لمن لا يرى جيدا في الظلام, لمن يخفي عمله عن أعين الناس ولا يعمل إلا في الظلام]
  note: أي ليس بالطائر الذي يستطيع الطيران بالليل.
  source: abboudi_amthal
  page: 1267
  volume: ج٣
  status: draft

- id: u0184
  kind: usage
  prompt: أخْيه وعينه فيه
  answer: لمن يُظهر النفور من شيء وهو يرغب فيه
  others: [لمن يحرس شيئًا لا يملكه ويمنع صاحبه من الانتفاع به, لمن يحسد غيره على ما عنده, لمن يعيب شيئًا بعد أن يفقده]
  note: «أخْيه» كلمة تعبّر عن الضيق والاشمئزاز، لكن عينه معلّقة بالشيء نفسه.
  source: zanin
  page: 16
  status: draft

- id: u0185
  kind: usage
  prompt: مجفّي على البيض
  answer: لمن يلازم بيته ولا يخرج منه
  others: [لمن يحرص على ماله حرصًا شديدًا, لمن ينتظر نتيجة عمل لم يتم, لمن يتعجّل الأمر قبل أوانه]
  note: المجفّية الدجاجة الحاضنة لبيضها، فهي لا تفارق مكانها.
  source: iryani
  page: 147
  status: draft

- id: u0186
  kind: usage
  prompt: أجت الدقة براسه
  answer: للبريء الذي تلصق به التهمة فيدفع ثمن غيره
  others: [لمن يصيبه صداع شديد, لمن يأتيه الرزق فجأة, لمن يتعلم الحرفة بسرعة فيسبق من تعلمها قبله]
  note: وقعت الضربة على رأسه هو، فصار كبش الفداء.
  source: sahli
  page: 19
  status: draft

- id: u0187
  kind: meaning
  prompt: خش لي قافية
  answer: سابقني بكلمة لأردّ عليها
  others: [اكتب لي قصيدة, ادخل في الموضوع مباشرة دون مقدمات, اسكت ولا تقاطعني]
  note: دعوة إلى المساجلة بالنكت والكلام المقفّى، يقول أحدهما شيئًا ويرد الآخر بما يناسبه.
  source: amin
  page: 196
  status: draft

- id: u0188
  kind: usage
  prompt: الْكَرْوِيَّه غِيرْ عَنْدْ بَنْ عْطِيَّه؟
  answer: لبائع يتعزّز ببضاعته وهي موجودة عند غيره
  others: [لمن يتداوى بالأعشاب ويرفض الطبيب, لمن يشتري من بائع واحد لا يغيّره, لمن يبحث عن دواء نادر في كل الأسواق فلا يجده]
  note: 'الكروية نبتة يتداوى بها الناس، وابن عطية عشاب مشهور ببيعها في فاس. فكأنك تقول للبائع: هي موجودة عند كل عشاب.'
  source: dadoun
  page: 287
  status: draft

- id: u0189
  kind: usage
  prompt: سمع بالحامض دار ما يقطع المصران
  answer: لمن يميل إلى المبالغة والتطرف في أفعاله وأقواله
  others: [لمن يخاف من كل طعام لا يعرفه, لمن يصدق كل ما يسمع من أخبار, لمن يأكل بسرعة وبكثرة فيمرض ويلزم فراشه أيامًا طويلة]
  note: «دار» صنع، والمراد هنا شرب؛ سمع بالحامض فشرب منه حتى قطّع أمعاءه.
  source: mughniyya
  page: 313
  status: draft

- id: u0190
  kind: usage
  prompt: قلب اسمه صلاح
  answer: لمن يتنكر لإخوانه وأصحابه ولمن يجحد الجميل
  others: [لمن يغيّر اسمه ليخفي أصله عن الناس, لمن يصلح بين المتخاصمين بنية طيبة فيسمّيه الناس صلاحاً, لمن يتظاهر بالصلاح وقلبه مليء بالشر]
  note: أي قلب الاسم على عقبه فصار يتطاول على من أحسن إليه.
  source: akwa
  page: 821
  volume: ج٢
  status: draft

- id: u0191
  kind: meaning
  prompt: يلعب بالبيضه والحجر
  answer: حاذق نبيه يلعب بعقول الناس
  others: [يعرض نفسه للخطر بلا سبب, يضيع وقته في اللهو, يجمع بين المتناقضات]
  note: أصلها لعبة يرمون فيها حجرًا كالبيضة بأحجار رقيقة عريضة.
  source: taymur_kinayat
  page: 70
  status: draft

- id: u0192
  kind: usage
  prompt: الطريق السهل ولو بعدت
  answer: نصيحة بسلوك السبيل الآمن ولو كان أطول
  others: [نصيحة بالإسراع إلى الهدف بأقصر طريق, نصيحة بالسفر مع رفقة تعرف الطريق جيدا, نصيحة بترك الأمر إذا صعب أوله]
  note: يقال لمن يريد أن يخاطر في طريقه، فالطريق السهل خير وإن بعد.
  source: adimi
  page: 26
  status: draft

- id: u0193
  kind: usage
  prompt: يحرّسوا الكلاب على الرمّة
  answer: يقال عند تسليم الأمر لمن سيطمع فيه
  others: [يقال عند الإسراف في حراسة شيء لا قيمة له, يقال عند ترك الأمور بلا رقيب ولا حارس, يقال عند استعمال القسوة مع المساكين]
  note: الرمة جيفة الحيوان، والكلاب أول من يأكلها؛ فتكليفها بحراستها يعني أن الشيء ضائع لا محالة.
  source: shaalan
  page: 156
  volume: ج٢
  status: draft

- id: u0194
  kind: meaning
  prompt: ريح فى ريح
  answer: كلام كاذب
  others: [سفر بلا فائدة, مال ضائع, شجار بلا سبب]
  note: كلام كالريح لا حقيقة له.
  source: zanin
  page: 156
  status: draft

- id: u0195
  kind: meaning
  prompt: فرغ الهذار ما بقي إلا الجد
  answer: ذهب وقت الهزل وجاء وقت الجد
  others: [انتهى الكلام فلنأكل, تعب الناس من الضحك, لا فائدة من الحديث بعد اليوم]
  note: يقال عند الانتقال من المزاح إلى العمل الحقيقي.
  source: amin
  page: 295
  status: draft

- id: u0196
  kind: meaning
  prompt: سلمه دقنه
  answer: انقاد له وسلّمه أموره
  others: [خاصمه وشتمه, استشاره في أمر صغير, غشّه في البيع]
  note: الدقن اللحية؛ كأنه صار يقوده منها إلى حيث يشاء.
  source: taymur_kinayat
  page: 42
  status: draft

- id: u0197
  kind: usage
  prompt: خشمك قدّامك، وراسك بين آذانك
  answer: في ممازحة الغافل الذي يسأل عن الواضح
  others: [في نصح المتكبر بأن يتواضع, في وصف الجميل الحسن الصورة, في تحذير من يسير في طريق خطر بلا دليل يرشده]
  note: '«الخشم» الأنف؛ يقال على سبيل المطايبة: أنفك أمامك ورأسك بين أذنيك، أي الأمر أوضح من أن تسأل عنه.'
  source: abboudi_amthal
  page: 464
  volume: ج٢
  status: draft

- id: u0198
  kind: usage
  prompt: ويش انتي يا بعوضه
  answer: للصغير الذي يتدخل في أمور كبيرة فوق قدرته
  others: [لمن يزعج الناس بكثرة الكلام في كل مجلس يجلسه, لمن يؤذي غيره خفية ثم يختفي, للضعيف الذي يصبر على الأذى]
  note: البعوضة حشرة صغيرة الحجم، فكأنه يقال لها لست في مستوى ما تدعين القدرة عليه.
  source: juhayman
  page: 64
  volume: ج٩
  status: draft

- id: u0199
  kind: usage
  prompt: من سبّر نفسه ربّان وفّى الريح من قرنه
  answer: من تصدّى لعمل خطير فعليه أن يكون كفؤًا لتبعاته
  others: [من أراد السفر فليبدأ قبل هبوب الريح, من رضي بالقليل من الرزق استغنى عن سؤال الناس وأراح نفسه, من خاف البحر فلا يركب السفن]
  note: من جعل نفسه ربّانًا للسفينة فعليه أن يوصلها ولو سكنت الريح، فيدفعها بقرنه.
  source: iryani
  page: 419
  status: draft

- id: u0200
  kind: usage
  prompt: طالعة على قنّب دوما
  answer: لشريك يغدر بشريكه ويخذله
  others: [لمن يتعب كثيرًا بلا فائدة, لمن يتباهى بما لا يملكه, لمن يطمع في مال غيره]
  note: قنّب دوما يخرج دقيق الأغصان قليل النفع، فصار مثلًا عند الشاميين إذا غدر أحد الشريكين بصاحبه.
  source: qasimi
  page: 90
  volume: ج١
  status: draft

- id: u0201
  kind: usage
  prompt: حلفة ويحاشر النار
  answer: لمن يلقي بنفسه فيما يعلم أنه يضره
  others: [لمن يغضب سريعا ثم يهدأ بلا سبب, لمن يحلف كثيرا ولا يصدقه أحد, لمن يصلح بين المتخاصمين بالحكمة واللين]
  note: الحلفاء نبات سريع الاشتعال، يكفيه قليل من النار ليأتي عليه.
  source: taymur
  page: 147
  status: draft

- id: u0202
  kind: meaning
  prompt: الصباح رباح
  answer: تأجيل الأمر إلى الغد وكثيرًا ما يكون وعيدًا
  others: [الحث على الاستيقاظ مبكرًا, التفاؤل بربح التجارة في أول النهار عند فتح الدكان, تحية الناس عند الصباح]
  note: 'يقولها لمن أذنب: لا تظن سكوتي الآن إهمالًا، فسترى غدًا.'
  source: taymur_kinayat
  page: 47
  status: draft

- id: u0203
  kind: usage
  prompt: فتح عكّا
  answer: يقال عمن أنجز أمرًا صعبًا يبدو مستحيلًا
  others: [يقال عمن سافر إلى بلد بعيد ولم يعد إلى أهله, يقال عمن بدأ مشروعًا ثم تركه, يقال عمن يكثر الشجار مع جيرانه]
  note: للتعبير أصل تاريخي، فقد كانت عكا مدينة حصينة يصعب فتحها، فصار فتحها رمزًا للعمل المستحيل.
  source: shaalan
  page: 126
  volume: ج٢
  status: draft

- id: u0204
  kind: meaning
  prompt: دا مات وشبع موت
  answer: مات منذ زمن طويل
  others: [مريض على وشك الموت, نام نومًا عميقًا, تعب حتى خارت قواه]
  note: يقال عمّن مضى على موته وقت طويل.
  source: amin
  page: 202
  status: draft

- id: u0205
  kind: usage
  prompt: طِينُه عْلَى طِينْهَا، وَرَمُّه عْلَى رَمْهَا
  answer: في زوجين متحابين متفقين في الطباع والسلوك
  others: [في جارين يتنازعان على حدود أرضهما, في بنّاء يتقن صنعته ويحسن البناء, في أخوين يرثان أرضًا واحدة فيتنازعان على قسمتها]
  note: كأنهما من طينة واحدة. يقال في الزوجين المنسجمين فلا يجد الساعي بينهما بالسوء منفذًا.
  source: dadoun
  page: 175
  status: draft

- id: u0206
  kind: usage
  prompt: ساعتك سرورك
  answer: في الحث على اغتنام وقت الراحة والفرح حين يأتي
  others: [في الحث على احترام المواعيد وعدم التأخر عنها, في ذم من يضيع وقته في اللهو والسرور, في أن الفرح لا يدوم إلا ساعة واحدة]
  note: أي إن ساعتك التي أنت فيها هي ما تملكه، فاستمتع بها؛ فما مضى فات والمؤمَّل غائب.
  source: akwa
  page: 557
  volume: ج١
  status: draft

- id: u0207
  kind: usage
  prompt: إن كان حرام حرقناه، وان كان حلال شربناه
  answer: يقوله المدخن الذي يصر على التدخين ولا يقبل النصح
  others: [يقوله من يطبخ طعاما لا يعرف أصله, يقوله من يشرب القهوة بعد كل وجبة, يقوله من يشعل النار في ليالي الشتاء الباردة ليدفئ أولاده]
  note: التبغ في رأيه إما حرام وقد أحرقه، أو حلال وقد شربه، فلا خسارة في الحالين.
  source: sahli
  page: 65
  status: draft

- id: u0208
  kind: usage
  prompt: لولا الكسار ما عاش المدار
  hint: المدار صانع أواني الفخار
  answer: يقال ساخرا لمن يفسد فيعيش من يصلح
  others: [يقال لمن يتقن صنعته فيكثر زبائنه ويغتني, يقال لمن يشتري الرخيص فيخسر ماله, يقال لمن يعمل في صنعة أبيه وجده]
  note: لولا من يكسر الأواني ما وجد الفخاري عملا؛ فالمخرب يصنع رزق المصلح دون أن يقصد.
  source: adimi
  page: 350
  status: draft

- id: u0209
  kind: meaning
  prompt: زمان بوعنبه
  answer: عهد قديم
  others: [زمن الرخاء والخير, موسم العنب, أيام الحرب]
  note: يقال للشيء الذي مضى عليه زمن طويل.
  source: zanin
  page: 158
  status: draft

- id: u0210
  kind: usage
  prompt: يا رمان تاجورا
  answer: في الحنين إلى الوطن أو إلى ما مضى من الأيام
  others: [في مدح الفاكهة الجيدة وغلاء ثمنها, في ذم من يبيع بضاعته في غير بلده, في وصف الجمال الذي يخفي عيبًا لا يظهر إلا بعد التجربة]
  note: تاجوراء مدينة ليبية.
  source: mughniyya
  page: 552
  status: draft

- id: u0211
  kind: meaning
  prompt: حط صباعه في الشق
  answer: عجز عن الأمر وغُلب عليه
  others: [تدخل فيما لا يعنيه, أخفى سرًا لا يعرفه أحد, أصلح خللًا في جدار بيته]
  note: أصله لعبة للصبيان يُلزَم فيها المغلوب بإدخال إصبعه في شق الحائط.
  source: taymur_kinayat
  page: 30
  status: draft

- id: u0212
  kind: usage
  prompt: البركة جند
  answer: لمن يزيد ماله دون أن يظهر له دخل كبير
  others: [لمن يكثر عياله فيتسع رزقه, لمن ينتصر على خصمه بكثرة أعوانه, لمن يُرزق بجهده وتعبه لا بالحظ ولا بدعاء الناس]
  note: البركة عندهم من جنود الله التي لا تُرى، وإنما يظهر أثرها في المال والرزق.
  source: abboudi_amthal
  page: 260
  volume: ج١
  status: draft

- id: u0213
  kind: usage
  prompt: وقع مثل دم بيت العفاري
  answer: لمن حُرم طويلًا ثم نال فجأة ما لم يحلم به فعجز عن الانتفاع به
  others: [لمن دخل بيتًا غريبًا لأول مرة فضلّ طريقه فيه ولم يعرف كيف يخرج منه, لمن طمع في مال غيره فخسر ماله, لمن أكل حتى مرض من التخمة]
  note: تُروى قصة قطّ حُبس طويلًا ثم وجد مخزنًا يغصّ بالفئران فمات من شدة الفرح.
  source: iryani
  page: 309
  status: draft

- id: u0214
  kind: meaning
  prompt: دا جاب السبع من ديله
  answer: ظل يحتال على القوي حتى غلبه
  others: [هرب من الخطر في آخر لحظة, صاد أسدًا في الصحراء, اعتذر بعد أن أخطأ]
  note: يقال لمن يتغلّب بحيلته وصبره على من هو أقوى منه.
  source: amin
  page: 202
  status: draft

- id: u0215
  kind: usage
  prompt: جابها على البلاطة
  answer: يقال عمن تكلم بصراحة ووضوح دون مواربة
  others: [يقال عمن أخطأ في الحساب فخسر, يقال عمن اختصر الطريق ليصل إلى عمله مبكرًا, يقال عمن غضب فرفع صوته على أهله]
  note: البلاط لامع مصقول، و«على البلاطة» أي على المكشوف؛ فالتعبير يعني التصريح بالأمر كما هو.
  source: shaalan
  page: 191
  volume: ج٣
  status: draft

- id: u0216
  kind: usage
  prompt: أحسبناه بيت على ستة طلع عشة على عمود
  answer: لمن يخيّب ظنّ الناس فيه
  others: [لمن يبني بيتًا أكبر من حاجته, لمن يتواضع مع أنه غني, لمن ينتقل من مكان إلى مكان]
  note: ظنّوه بيتًا كبيرًا قائمًا على ستة أعمدة، فإذا هو عُشّة على عمود واحد.
  source: zanin
  page: 15
  status: draft

- id: u0217
  kind: meaning
  prompt: جا نقبه على شونه
  answer: خاب مسعاه وذهب تعبه سدى
  others: [وصل إلى مراده بلا عناء, وقع في يد من يطارده, وجد كنزًا لم يكن يتوقعه]
  note: الشونة مخزن التبن؛ فاللص الذي ينقب الجدار طلبًا للمال يقع على التبن.
  source: taymur_kinayat
  page: 27
  status: draft

- id: u0218
  kind: usage
  prompt: السيف في يد الجبان خشبه
  answer: للسلاح القاطع لا ينفع صاحبه إذا كان جبانًا
  others: [لمن يحمل السلاح للزينة والتفاخر لا للقتال والدفاع, لمن يستعير أداة لا يعرف استعمالها, لمن يخاف من عدو ضعيف]
  note: الجبان يحب الحياة ويكره الموت، فإذا وقع في يده سيف قاطع لم يفعل به شيئًا يذكر.
  source: juhayman
  page: 289
  volume: ج٣
  status: draft

- id: u0219
  kind: usage
  prompt: نَقْبَضْهُمْ بَمْزِيرْ، وَنْدَفْعْهُمْ بْجَمَانْفُو
  answer: لمن يتعب في كسب المال ثم يبذّره بسهولة
  others: [لمن يقترض المال ولا يردّه أبدًا, لمن يتقن لغات أجنبية ويتباهى بها, لمن يقبض أجرته قبل أن يعمل ثم يتهرب من العمل]
  note: 'كلمتان من الفرنسية دخلتا الدارجة: الأولى تعني الشقاء والثانية اللامبالاة. أي يقبض المال بشقاء ويصرفه بلا مبالاة.'
  source: dadoun
  page: 343
  status: draft

- id: u0220
  kind: usage
  prompt: براس ماله ويتوب
  answer: لمن يخرج من صفقة سيئة بلا ربح فيتوب عن العودة إليها
  others: [لمن يربح كثيراً ثم يتصدق بربحه كله, لمن يقرض غيره ماله ولا يطلب زيادة, لمن يبدأ تجارة جديدة برأس مال صغير ويأمل أن يصبح من الأغنياء]
  note: أصله في لص باع حماراً مسروقاً، فركبه أحد المشترين ليجربه وهرب به؛ فلما سئل بكم باعه قال المثل.
  source: akwa
  page: 271
  volume: ج١
  status: draft

- id: u0221
  kind: meaning
  prompt: زقزقت عصافير بطنه
  answer: جاع جوعًا شديدًا
  others: [فرح فرحًا كبيرًا, أكل حتى شبع, أحسّ بالمرض]
  note: تصوير طريف لأصوات البطن الجائعة.
  source: amin
  page: 222
  status: draft

- id: u0222
  kind: usage
  prompt: قول للبير بو. يقول لك بوين
  answer: في رد الإهانة على صاحبها والدفاع عن النفس
  others: [في أن الكلام في الأماكن الخالية لا يسمعه أحد, في أن البئر العميقة لا ينفد ماؤها, في أن من يكثر الكلام يقل احترامه]
  note: «البير» البئر، و«بوين» ترجيع الصدى؛ ما تقوله يعود إليك.
  source: mughniyya
  page: 420
  status: draft

- id: u0223
  kind: usage
  prompt: شلة حرير على نار
  answer: للشيء الذي يتلاشى بسرعة
  others: [للشيء الثمين الذي يحرص عليه صاحبه, لمن يغضب ثم يهدأ, للثوب الجميل الغالي]
  note: خيوط الحرير تذوب في النار في لحظة.
  source: sahli
  page: 186
  status: draft

- id: u0224
  kind: usage
  prompt: يا الله العقل لو عاريه
  answer: لمن أتى أمرا مخالفا للعقل
  others: [لمن يستعير أشياء الناس ولا يردها, لمن يدعو لغيره بطول العمر, لمن يتظاهر بالحكمة وهو جاهل بها]
  note: دعاء بأن يُرزق المتكلم عقلا ولو على سبيل الإعارة.
  source: abboudi_amthal
  page: 1618
  volume: ج٥
  status: draft

- id: u0225
  kind: meaning
  prompt: راح في شربة ميه
  answer: مات أو تأذى بسبب تافه
  others: [ذهب لقضاء حاجة سريعة, غرق في النهر, ارتوى بعد عطش]
  note: أي ذهب بلا عوض، كأن موته كان في شربة ماء.
  source: taymur_kinayat
  page: 37
  status: draft

- id: u0226
  kind: usage
  prompt: شلوك إلى حبس قال قد لي حاجة
  hint: شلوك أي أخذوك
  answer: لمن يُكلَّف بأمر يوافق هواه
  others: [لمن يُعاقب فلا يتعظ من عقابه, لمن يتظاهر بالرضا وهو كاره, لمن يلقى جزاء ظلمه]
  note: أخذوه إلى السجن فقال إن له هناك حاجة؛ أي أن ما فُرض عليه كان يتمناه أصلا.
  source: adimi
  page: 249
  status: draft

- id: u0227
  kind: meaning
  prompt: انضربوا على المحضن
  answer: أصابتهم خسارة فادحة
  others: [تفرّقوا وتشتّتوا, أُصيبوا في أولادهم, طُردوا من بيوتهم]
  note: «المحضن» عشّ الدجاجة الذي تحضن فيه بيضها.
  source: zanin
  page: 69
  status: draft

- id: u0228
  kind: usage
  prompt: اللى يسبنا وقت العوزة مالوش عندنا عوزة
  answer: يقال لمن تهرّب من مساعدتنا وقت الشدة
  others: [يقال لمن يقرض الناس ثم يلحّ في طلب ديونه, يقال لمن لا يزور أهله إلا في الأعياد والمواسم, يقال لمن يكثر الطلب ولا يشكر من أعطاه]
  note: العوزة هي الحاجة والضرورة؛ و«يسبنا» بمعنى يتركنا. فمن تركك وقت الحاجة استغنِ عنه.
  source: shaalan
  page: 186
  volume: ج٢
  status: draft

- id: u0229
  kind: usage
  prompt: المكدّد غلب المحوله
  answer: في الحث على الجدّ في العمل بالأرض وغيرها
  others: [في أن الجدب يهلك المزارع مهما اجتهد وأتعب نفسه في أرضه, في ذم البخيل الذي يجمع ولا ينفق, في أن المطر وحده يصنع المحصول]
  note: المكدّد هو الدؤوب الملحاح، والمحولة الجدب وما يصحبه من فقر؛ والمثل مما يقوله المزارعون.
  source: iryani
  page: 761
  status: draft

- id: u0230
  kind: usage
  prompt: ما يشكر السوق إلا من كسب
  answer: في أن المدح يكون لمصلحة
  others: [في أن التاجر الأمين يكسب دائما, في أن السوق لا يرحم الضعيف, في أن الشكر يزيد النعمة]
  note: لا يمدح السوق إلا من ربح فيه.
  source: taymur
  page: 338
  status: draft

- id: u0231
  kind: meaning
  prompt: دا راسه مصفحة
  answer: قليل النوم
  others: [عنيد لا يقتنع, قوي لا يتألم, كثير النسيان]
  note: كأن رأسه مصفّح بالحديد فلا يحتاج إلى النوم كغيره.
  source: amin
  page: 202
  status: draft

- id: u0232
  kind: meaning
  prompt: عطاه من الجمل أدنو
  answer: أعطاه القليل جداً من الكثير
  others: [أعطاه أكثر ممّا طلب, أعطاه أثمن ما عنده, أعطاه سرّاً دون أن يراه أحد]
  source: asadi
  line: 115476
  halab: w1094
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0233
  kind: usage
  prompt: اتغدى به قبل ما يتعشى بك
  answer: في الحث على مبادرة الخصم قبل أن يبادرك بالأذى
  others: [في الحث على تقديم الطعام للضيف قبل أن يطلبه, في ذم من يأكل كثيراً في الغداء والعشاء, في الحث على الصبر على الخصم حتى يتعب ويرجع عن عداوته]
  note: الغداء قبل العشاء، فمن سبق خصمه بالضربة نجا من ضربته.
  source: akwa
  page: 51
  volume: ج١
  status: draft

- id: u0234
  kind: meaning
  prompt: ما يعرفش كوعه من بوعه
  answer: مستغرق في الجهل والغفلة
  others: [لا يعرف أهله, لا يحسن صنعته, لا يقدر على الحركة]
  note: والعرب تقول «ما يعرف قطاته من لطاته».
  source: taymur_kinayat
  page: 74
  status: draft

- id: u0235
  kind: usage
  prompt: لحم جيرانا فيه الهذاليل
  answer: في اعتزاز المرء بما يملك واعتباره أجود مما عند غيره
  others: [في التحذير من الطمع في طعام الجيران, في مدح الجار الذي يقاسم جيرانه طعامه, في ذم من يشتري الرديء من السوق ليوفر ماله فيخسر صحته وماله]
  note: «الهذاليل» قطع صغيرة من بقايا اللحم على العظام؛ أي أن لحم جيراننا رديء فلا رغبة لنا فيه.
  source: mughniyya
  page: 468
  status: draft

- id: u0236
  kind: meaning
  prompt: عاش على الهوا
  answer: قلة الأكل
  others: [الحياة في الريف, كثرة السفر, كثرة الكلام بلا عمل]
  note: كأن طعامه هواء لا شيء.
  source: taymur_kinayat
  page: 55
  status: draft

- id: u0237
  kind: usage
  prompt: عملك، على زملك
  answer: لمن جرّ الأذى على نفسه بفعله
  others: [لمن يحمّل غيره أعباءه, لمن يتقن عمله فيُكافأ عليه, لمن يسافر بلا زاد ولا راحلة]
  note: «الزمل» الرواحل؛ أي هذا ما صنعته بنفسك، فاحمله على رواحلك.
  source: abboudi_amthal
  page: 867
  volume: ج٢
  status: draft

- id: u0238
  kind: usage
  prompt: دَابَا تْفُوتْ سَبْعَ ايَامْ دَالْبَكُورْ
  answer: للشيء الجديد يتهافت عليه الناس ثم يرخص
  others: [لمن يستيقظ باكرًا سبعة أيام ثم يكسل, لمن يصوم أيامًا قليلة ثم يفطر, لأول الثمار حين تنضج في البساتين]
  note: البكور أول الثمار تباع غالية. ستمضي أيامها السبعة ثم يباع الشيء بأبخس الأثمان.
  source: dadoun
  page: 99
  status: draft

- id: u0239
  kind: meaning
  prompt: امشمر على كمامه
  answer: يعمل بجدّ
  others: [يستعد للخصام, يتزيّن للمناسبة, يهمّ بالرحيل]
  note: كمن شمّر أكمامه ليبدأ العمل.
  source: zanin
  page: 65
  status: draft

- id: u0240
  kind: usage
  prompt: هى الدنيا طارت؟!
  answer: يقال لمن يستعجل النتائج ليهدأ
  others: [يقال عند هبوب رياح شديدة, يقال لمن يبالغ في الفرح بخبر سعيد, يقال لمن فاته موعد مهم]
  note: سؤال استنكاري معناه أن الوقت ما زال متسعًا ولا داعي للعجلة.
  source: shaalan
  page: 55
  volume: ج٥
  status: draft

- id: u0241
  kind: usage
  prompt: سلمت يمين السوس يوم أظهر المدسوس
  answer: لبعض المؤذيات التي تجلب للناس نفعًا من حيث لا يتوقعون
  others: [لمن يكشف أسرار الناس في المجالس ثم يتبرأ منها إذا سُئل عنها, لمن يخزن ماله حتى يفسد, لمن يمدح من لا يستحق المدح]
  note: تاجر احتكر التمر أو الحنطة، فسلّط الله عليه السوس فاضطر إلى بيع ما خبّأه.
  source: juhayman
  page: 276
  volume: ج٣
  status: draft

- id: u0242
  kind: meaning
  prompt: طلعت أشم الهوا
  answer: خرجت أتنزّه
  others: [خرجت أبحث عن عمل, صعدت إلى السطح لأنام, هربت من البيت]
  note: تعبير عن الخروج للتنزه والترويح عن النفس.
  source: amin
  page: 270
  status: draft

- id: u0243
  kind: usage
  prompt: أم الحريوه
  answer: فيمن يبدو مشغولًا بكل شيء وهو لا ينجز شيئًا
  others: [فيمن يتدخّل في أمور غيره بلا دعوة, فيمن يبالغ في الفرح بأمر صغير, فيمن يُكثر الشكوى من التعب وهو أقل الناس عملًا في البيت]
  note: أمّ العروس في حفل العرس كثيرة الحركة شاردة الذهن لانشغالها بفراق ابنتها، فلا تُتمّ عملًا.
  source: iryani
  page: 174
  status: draft

- id: u0244
  kind: usage
  prompt: الحجر من الأرض والدم من رأسك
  answer: لمن يجلب على نفسه متاعب بلا حاجة
  others: [لمن يدفع ثمن خطأ ارتكبه غيره, لمن ينتقم لنفسه بيده, لمن يصيبه الأذى من أقرب الناس إليه]
  note: يقال لمن يريد التوسع فيما زاد عن حاجته، فالحجر متاح لكن الضرر يقع على رأسه هو.
  source: adimi
  page: 31
  status: draft

- id: u0245
  kind: usage
  prompt: ذكروا المدن، أجت القرايا تحجل
  answer: لمن يقحم نفسه في أمر ليس من مستواه
  others: [لمن يزور المدينة أول مرة, لمن يحن إلى قريته بعد أن سكن المدينة سنوات, لمن يمدح بلده أمام الغرباء]
  note: كان الحديث عن المدن، فجاءت القرى تقفز لتدخل فيه.
  source: sahli
  page: 153
  status: draft

- id: u0246
  kind: meaning
  prompt: أكله قيام ولحمه
  answer: استولى على كل ما عنده
  others: [أكرمه وأحسن ضيافته, أكل وهو واقف, اغتابه أمام الناس]
  note: ويزيدون «ما خلاش حيلته حيله»، والحيلة الشيء القليل.
  source: taymur_kinayat
  page: 65
  status: draft

- id: u0247
  kind: meaning
  prompt: المراكبي في حساب والنوتي في حساب
  answer: كل واحد يحسب الأمر على هواه
  others: [المسافر يدفع أجرة مضاعفة للنوتي, العمل يحتاج إلى حساب دقيق, الكبير يحاسب الصغير]
  note: يقال لاثنين أو أكثر يبني كل منهم حسابه على أساس مختلف عن صاحبه.
  source: amin
  page: 347
  status: draft

- id: u0248
  kind: meaning
  prompt: أسلاه طويل
  answer: أمر لا يُحسم بسرعة ويطول انتظاره
  others: [رجل صبور لا يغضب, عمل متقن لا عيب فيه يدوم سنين طويلة, طريق طويل متعب]
  note: السلا مشيمة الشاة بعد الولادة، تنتظرها الكلاب فيطول انتظارها.
  source: zanin
  page: 21
  status: draft

- id: u0249
  kind: usage
  prompt: إلي يحسب بروحه يفضل له
  answer: في الاعتماد على النفس وعدم إيكال الأمور إلى الغير
  others: [في الحث على الادخار وعدم إنفاق المال كله, في ذم الأنانية وحب النفس على حساب الآخرين, في الحث على مراجعة الحساب مع التجار قبل دفع الثمن كاملًا]
  note: «يفضل له» يبقى له؛ من تولى أموره بنفسه سلم له نصيبه.
  source: mughniyya
  page: 140
  status: draft

- id: u0250
  kind: usage
  prompt: زى العود بدون أوتار ما يطربش
  answer: يقال في أن العمل لا يتم إلا إذا اكتملت أدواته
  others: [يقال في أن الفن لا يقدّره إلا أهله, يقال في أن الكلام الجميل لا يغني عن الفعل الحسن, يقال في أن الكبير لا يقدر على الغناء]
  note: من أمثال الموسيقيين؛ فالعود بلا أوتار لا يؤدي وظيفته، وكذلك كل عمل ينقصه بعض أدواته.
  source: shaalan
  page: 271
  volume: ج٣
  status: draft

- id: u0251
  kind: usage
  prompt: السقال ما يعيب سلاح
  answer: لمن لا يعيب ما يُعرض عليه حتى لا يسيء إلى صاحبه
  others: [لمن يدّعي معرفة صنعة لا يتقنها, لمن يحمل سلاحاً ولا يعرف استعماله, لمن يمدح بضاعته ويعيب بضاعة غيره ليصرف الزبائن إليه]
  note: السقّال هو الصيقل الذي يشحذ السيوف والخناجر، ولا يعيب سلاحاً يُقدَّم إليه مهما كان رديئاً.
  source: akwa
  page: 577
  volume: ج١
  status: draft

- id: u0252
  kind: usage
  prompt: خلص تارك من جارك
  answer: لمن يعاقب غير المذنب
  others: [لمن يحسن إلى جاره وإن أساء, لمن يطلب حقه بالقوة, لمن يصالح عدوه خوفا منه]
  note: كمن يعجز عن الجاني فيأخذ ثأره من جاره البريء.
  source: taymur
  page: 157
  status: draft

- id: u0253
  kind: meaning
  prompt: طول رقبتي
  answer: جعلني أرفع رأسي فخرًا بما فعل
  others: [أحرجني أمام الناس, أطال انتظاري حتى مللت من الوقوف, أتعبني بكثرة طلباته]
  note: كأن يمدح المرء شخصًا بالكفاءة فيصدق قوله فيه.
  source: taymur_kinayat
  page: 52
  status: draft

- id: u0254
  kind: usage
  prompt: وداعتك يا شجره
  answer: تهكما بمن يسيء حفظ متاعه أو متاع غيره
  others: [وداعا لمكان أحبه صاحبه وفارقه مكرها بعد طول إقامة, وصية بالعناية بالنخل والشجر, شكرا لمن حفظ الأمانة وأدّاها]
  note: «الوداعة» الوديعة؛ كمن يودع شيئا ثمينا عند شجرة ويوصيها بحفظه، والشجرة ليست أهلا لحفظ الودائع.
  source: abboudi_amthal
  page: 1553
  volume: ج٤
  status: draft

- id: u0255
  kind: usage
  prompt: شُوفْ فِيَّ نْشُوفْ فِيكْ يَا طَجِينْ الْحُوتْ، انْتَ مَا تْطِيبْ، وَأَنَا مَا نَاكْلَكْ
  answer: لمن تلحّ عليه في طلب فيتجاهلك ولا يبالي
  others: [لمن يطبخ طعامًا لا يأكله أحد, لمن يتأخر في إنجاز عمله دائمًا, لمن يحدّق في الناس بلا سبب حتى يضايقهم ويغضبهم]
  note: كأنك تنظر إلى طاجين سمك لا ينضج فلا تأكل منه. يقال فيمن ترجو منه شيئًا فيمتنع دون أن يبدي اهتمامًا.
  source: dadoun
  page: 151
  status: draft

- id: u0256
  kind: usage
  prompt: شي بالتلم وشي بالزبر
  answer: لمن لا يتقن عمله فيخلط الخطأ بالصواب
  others: [لمن يقسم ماله بين الصدقة والادخار, لمن يعمل في حقلين في وقت واحد, لمن يعطي كل ذي حق حقه]
  note: التلم خط المحراث والزبر الحدّ الترابي بين خطين؛ والباذر غير المتقن يرمي الحب هنا وهناك.
  source: iryani
  page: 98
  status: draft

- id: u0257
  kind: meaning
  prompt: عشنا وشفنا
  answer: طال عمرنا حتى رأينا العجب
  others: [عشنا فقراء ثم اغتنينا, سافرنا ورأينا البلاد, تعبنا كثيرًا في حياتنا ثم استرحنا]
  note: يقال عند رؤية أمر غريب لم يكن يُتوقّع.
  source: amin
  page: 278
  status: draft

- id: u0258
  kind: usage
  prompt: من بغى الدح ما قال أح
  answer: لمن اختار طريقا شاقا ثم صار يشكو منه
  others: [لمن يصبر على الأذى ولا يشكو لأحد, لمن يضرب غيره ثم يتظاهر بأنه المظلوم, لمن يطلب الراحة قبل أن يتعب]
  note: الدح هو الضرب بالكف، وأح كلمة يقولها المتألم؛ فمن طلب الضرب بنفسه فلا يتأوه. ويشبهه المثل العربي يداك أوكتا وفوك نفخ.
  source: juhayman
  page: 122
  volume: ج٨
  status: draft

- id: u0259
  kind: usage
  prompt: لولا الفلاح، ما عاش المدني
  answer: لمكانة الفلاحين في المجتمع وفضلهم على غيرهم
  others: [لمن يترك قريته ليسكن المدينة, للتاجر الذي يبيع المحاصيل, لمن يحن إلى حياة الريف وهو يعيش في زحام المدينة]
  note: الفلاح يطعم أهل المدن من زرعه.
  source: sahli
  page: 290
  status: draft

- id: u0260
  kind: meaning
  prompt: اشرب من البحر
  answer: قول من يتحدّى غيره غير مكترث به
  others: [دعوة إلى الصبر على الشدة, وصف لمن يطمع في ما لا يملك ولا يقدر على نيله, نصيحة بالقناعة بالقليل]
  note: كأنه يقول لخصمه افعل ما تشاء فلن يضيرني.
  source: zanin
  page: 22
  status: draft

- id: u0261
  kind: usage
  prompt: جبا لك يابن علوان بالذي شله السيل
  hint: الجبا الهدية، وشله أي أخذه
  answer: لمن يتكرم بما قد ضاع من يده أصلا
  others: [لمن يهدي هدية ثمينة لمن لا يستحقها, لمن يطلب هدية مقابل كل معروف, لمن يعيد ما أخذه بعد زمن طويل]
  note: يتصدق على ابن علوان بما جرفه السيل؛ أي يجود بما لم يعد يملكه.
  source: adimi
  page: 174
  status: draft

- id: u0262
  kind: meaning
  prompt: ما قال لوش تلت التلاته كام
  answer: لم يجبه بكلمة واحدة
  others: [لم يعطه حقه كاملًا, لم يعلّمه شيئًا من الحساب, لم يسأل عن حاله]
  note: ثلث الثلاثة واحد؛ أي لم يقل له لفظًا واحدًا، ويقال غالبًا فيمن بُهت فلم يحِر جوابًا.
  source: taymur_kinayat
  page: 25
  status: draft

- id: u0263
  kind: usage
  prompt: هو فيه حاجة بتستخبى؟
  answer: يقال في أن الأسرار لا بد أن تنكشف
  others: [يقال لمن يخفي ماله عن أهله وأولاده, يقال لمن يبحث عن شيء ضاع منه في البيت, يقال لمن يلعب مع الأطفال الاستغماية]
  note: سؤال استنكاري معناه أنه لا شيء يبقى مخفيًا، وفي معناه «زمّارة وزمّرت في البلد».
  source: shaalan
  page: 76
  volume: ج٤
  status: draft

- id: u0264
  kind: usage
  prompt: جحا جاك بزكرته
  answer: لكثير الضجيج والصخب
  others: [للضيف الذي يأتي بلا موعد, للبخيل الذي يأتي بلا هدية, للمسافر الذي يعود بلا مال]
  note: «الزكرة» آلة نفخ شعبية من جلد الماعز؛ جاءك جحا بمزماره فاستعد لهرجه ومرجه.
  source: mughniyya
  page: 218
  status: draft

- id: u0265
  kind: usage
  prompt: من قتل الكلب جحه
  answer: في وجوب إزالة ما يؤذي الناس من الطرق
  others: [في وجوب الرفق بالحيوان وعدم قتله, في أن المذنب يتحمل وحده عاقبة ذنبه, في أن الجاني يُعرف من آثار فعله]
  note: من أمثال العُدَين؛ جحه أي سحبه، فمن قتل الكلب فعليه أن يسحبه بعيداً عن الطريق.
  source: akwa
  page: 1261
  volume: ج٢
  status: draft

- id: u0266
  kind: meaning
  prompt: طلع زرابينه عليّ
  answer: احتد عليّ في كلامه
  others: [تهرّب من لقائي, هرب مني حين رآني قادمًا, ضحك مني]
  note: ويقولون في معناه «اتزربن عليّ» أي اشتدت حدته في الكلام معي.
  source: taymur_kinayat
  page: 51
  status: draft

- id: u0267
  kind: usage
  prompt: خذ حقّ، وعطّ حقّ
  answer: في استيفاء الحقوق كاملة قطعا للنزاع
  others: [في التسامح والتنازل عن بعض الحق حفاظا على المودة, في رد الهدية بأحسن منها, في تقسيم الميراث بين الإخوة]
  note: أي خذ ما لك كاملا وأعطِ ما عليك كاملا، فلا يبقى بين الناس ما يتنازعون عليه.
  source: abboudi_amthal
  page: 454
  volume: ج٢
  status: draft

- id: u0268
  kind: meaning
  prompt: لا له في التور ولا في الطحين
  answer: ليس له في الأمر شيء
  others: [يعمل في الطاحونة, يملك الثور والقمح, يشارك في كل شيء]
  note: لا يملك من الأمر ثورًا يدير الطاحونة ولا دقيقًا يُطحن، فلا حق له فيه.
  source: amin
  page: 326
  status: draft

- id: u0269
  kind: usage
  prompt: لحّوا لي أمدّ ما اشدّ على الحمار
  answer: للمستعجل الذي لا يحتمل الانتظار اللازم
  others: [للمسافر الذي ينسى زاده في البيت, لمن يطلب طعامًا لا يعرف صنعه, لمن يؤخّر سفره ليأكل أولًا]
  note: شدّ الرحل على الحمار عمل سريع، وصنع اللحوح يحتاج إلى وقت، وأمدّ أي في مدة قصيرة.
  source: iryani
  page: 799
  status: draft

- id: u0270
  kind: meaning
  prompt: امش بالمداس لين تواتيك الريحية
  answer: استعن بما عندك حتى يتيسّر لك الأفضل
  others: [لا تمشِ حافيًا في الطريق الوعر, احفظ مالك ولا تشترِ الغالي, لا تغترّ بالمظاهر ولا تحكم على الناس بثيابهم]
  note: المداس حذاء بسيط والريحية حذاء غالٍ؛ فلا تنتظر الثمين وأنت تملك ما يكفيك الآن.
  source: zanin
  page: 64
  status: draft

- id: u0271
  kind: meaning
  prompt: فلان بيكره الضيف ولو زوّادتو معو
  answer: شديد البخل
  others: [يحبّ السفر وحده, كثير الأشغال, بيته صغير]
  source: asadi
  line: 141937
  halab: w1082
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0272
  kind: usage
  prompt: لَعْزَا مَا كَيْشْرَفْ
  answer: لمن فاته أن يعزّي أهل فقيد في وقته
  others: [لمن يطيل الحداد على ميت سنوات طويلة, لمن يحضر العزاء ولا يتكلم مع أحد, لمن يرفض قبول التعزية من خصومه]
  note: العزاء لا يشيخ، أي لا يفوت أوانه. يقال لمن حالت ظروفه دون التعزية، فله أن يعزي متى استطاع.
  source: dadoun
  page: 271
  status: draft

- id: u0273
  kind: meaning
  prompt: بياكل في قته محلوله
  answer: الإسراف وتبذير المال
  others: [الطمع في مال الغير, القناعة بالقليل, الأكل على عجل]
  note: القتّ المحلول علف غير محزوم تبعثره الدابة وتتلف أكثره، كما يبعثر المسرف ماله.
  source: taymur_kinayat
  page: 18
  status: draft

- id: u0274
  kind: usage
  prompt: ورا كل باب حكاية
  answer: يقال في أن لكل بيت أسرارًا مستورة
  others: [يقال في أن الجيران يتبادلون الحكايات ليلًا, يقال في أن الأطفال يحبون الحكايات قبل النوم, يقال في أن الأبواب القديمة تحتاج إلى إصلاح]
  note: مثله «البيوت أسرار»؛ فالمجتمع التقليدي يحرص على ألا تخرج مشاكل البيت إلى العلن.
  source: shaalan
  page: 87
  volume: ج٦
  status: draft

- id: u0275
  kind: usage
  prompt: جوعة الكلب وراحته ولا شبعته وسراحته
  answer: في تفضيل القليل المريح على الكثير المتعب
  others: [في أن الجوع يعلم الإنسان الصبر, في أن الكلب الجائع يحرس البيت جيدا في الليل, في أن الشبع الدائم يجلب الكسل]
  note: السراحة هنا السعي والتعب في طلب الشبع.
  source: taymur
  page: 133
  status: draft

- id: u0276
  kind: meaning
  prompt: عيشني النهارده وموتني بكره
  answer: أنقذني اليوم وليكن غدًا ما يكون
  others: [اترك همّ الغد لأهله, عش يومك ولا تفكر, أعطني عمرًا طويلًا ولا تعجّل بموتي]
  note: يقولها من يطلب النجدة العاجلة ولا يبالي بما بعدها.
  source: amin
  page: 285
  status: draft

- id: u0277
  kind: usage
  prompt: يخرفش له بالسعفه
  answer: لمن يخيفه ما لا يخيف أحدا لجبنه أو خفة عقله
  others: [لمن يطرد الذباب عن طعامه بسعفة النخل في الصيف, لمن يلوّح بالتهديد ولا ينفذه, لمن يحاول إيقاظ النائم]
  note: السعفة جريدة النخل بخوصها، إذا حركتها أحدثت صوتا ضعيفا لا يفزع منه إلا الجبان.
  source: juhayman
  page: 222
  volume: ج٩
  status: draft

- id: u0278
  kind: usage
  prompt: رافع الباب على راسه
  answer: لمن يقيم الدنيا ويقعدها لأتفه الأسباب
  others: [لمن يحمل هموم أهله وحده دون شكوى, لمن يخرج من بيته غاضبًا ولا يعود, لمن يفتح بابه لكل ضيف في الليل والنهار دون تمييز]
  note: كأنه اقتلع الباب ورفعه على رأسه، كناية عن الضجة الكبيرة على أمر صغير.
  source: mughniyya
  page: 283
  status: draft

- id: u0279
  kind: usage
  prompt: محدى، مردى
  answer: للشيء الذي يُنتفع به من وجوه متعددة
  others: [للرجل الذي يتنقل بين البلدان, للعصا التي لا تصلح إلا للهش على الغنم, للكلام الذي يُفهم على وجهين]
  note: 'أصله في العصا: يُحدى بها الحِمل على الحمار، وتكون كحصاة الرمي سلاحا على من يعتدي على حاملها.'
  source: abboudi_amthal
  page: 1330
  volume: ج٤
  status: draft

- id: u0280
  kind: usage
  prompt: يسلم البطن اللي حملك
  answer: يقال مدحا لمن أحسن عملا
  others: [يقال للضيف عند انصرافه, يقال للمريض عند شفائه, يقال لمن يعتذر عن خطأ]
  note: دعاء بالسلامة لأمه التي أنجبته، إعجابا بما فعل.
  source: sahli
  page: 366
  status: draft

- id: u0281
  kind: usage
  prompt: بكرة شأبني لي بيت
  hint: شأبني أي سأبني
  answer: لمن يؤجل عمله دائما إلى الغد
  others: [لمن يحلم بما لا يقدر عليه من مال وجاه, لمن يتباهى بما سيملكه, لمن يبدأ عمله مبكرا]
  note: يقال للمسوّف الذي يعد نفسه كل يوم ببناء بيته ثم لا يبدأ.
  source: adimi
  page: 146
  status: draft

- id: u0282
  kind: usage
  prompt: عقله من فوق الشعر
  answer: في الشخص يتصرف تصرفاً لا حكمة فيه
  others: [في الشخص يكثر التفكير حتى يشيب شعره, في الشخص يهتم بمظهره أكثر من علمه, في الشخص الذكي الذي يظهر ذكاؤه سريعاً]
  note: أي إن عقله ليس في رأسه بل فوقه، فلا يحكم تصرفاته.
  source: akwa
  page: 721
  volume: ج٢
  status: draft

- id: u0283
  kind: meaning
  prompt: زي اللي الدايه جراه من لسانه
  answer: كثير الكلام لا يكاد يسكت
  others: [فصيح بليغ يحسن اختيار كلماته, كذاب يقول ما لا يفعل, خجول لا يتكلم]
  note: الداية هي القابلة؛ كأنها شدّت لسانه يوم ولادته فطال.
  source: taymur_kinayat
  page: 39
  status: draft

- id: u0284
  kind: usage
  prompt: بات فى الدباغ ليلة اصبح قربة
  answer: لمن يعطي نفسه أكبر من حجمه في أمور يجهلها
  others: [لمن يبيت خارج بيته كثيرًا فلا يعرف أهله أحواله, لمن يتغيّر طبعه بتغيّر أصحابه, لمن يصبر على الشدة حتى ينال مراده]
  note: «الدباغ» مادة دبغ الجلود؛ قضى فيه ليلة واحدة فظنّ نفسه قربة.
  source: zanin
  page: 75
  status: draft

- id: u0285
  kind: usage
  prompt: أيش يسوّي محمد رشاد
  answer: في الاستسلام لما قدّره الله والعجز عن تغييره
  others: [في السخرية ممن يدّعي القدرة على كل شيء, في لوم من يتأخر عن موعده ثم يلتمس لنفسه الأعذار, في الثناء على من يحسن التدبير]
  note: أصلها بيت شعبي قيل في قتال الأتراك في اليمن، ثم صارت العبارة تجري مجرى المثل.
  source: iryani
  page: 850
  status: draft

- id: u0286
  kind: meaning
  prompt: الدنيا ماشية بالمندار
  answer: أحوال الدنيا مقلوبة
  others: [الدنيا تسير على ما يرام, الأيام تمضي سريعة, الناس في عيد وفرح]
  note: أي أمورها تجري على غير وجهها الصحيح.
  source: amin
  page: 204
  status: draft

- id: u0287
  kind: usage
  prompt: حقك علىّ.. أنا غلطان
  answer: يقال لتهدئة الغاضب والاعتذار إليه
  others: [يقال للمطالبة بدين قديم تأخر سداده, يقال لمن يتهم غيره ظلمًا بلا دليل, يقال عند تقسيم الميراث بين الإخوة]
  note: عبارة اعتذار شائعة يأخذ بها المخطئ الحق على نفسه ليطيّب خاطر صاحبه.
  source: shaalan
  page: 156
  volume: ج٤
  status: draft

- id: u0288
  kind: meaning
  prompt: زرع له فوق السطوح
  answer: غرّه بوعد لا وفاء له
  others: [أعانه على بناء بيته, أهداه نباتًا جميلًا, رفع من شأنه عند الناس]
  note: الزرع لا ينبت على السطح، فهو وعد لا يتحقق.
  source: taymur_kinayat
  page: 39
  status: draft

- id: u0289
  kind: usage
  prompt: بندق ما هولينا بارود بلاش
  answer: لمن ينفق على حساب غيره
  others: [لمن يبالغ في الاحتفال, لمن يتسرّع في الحرب, لمن يستعير ولا يردّ]
  note: البندقية ليست لنا والبارود بلا ثمن، فلنُطلق ما شئنا.
  source: zanin
  page: 87
  status: draft

- id: u0290
  kind: usage
  prompt: سَاعَة سَعِيدَة
  answer: لمن يزعجك بثقله فتتمنى أن يبتعد عنك
  others: [لمن يبشّرك بخبر سار لم تكن تنتظره, لمن يتأخر عن موعده ثم يعتذر, لمن يقضي وقتًا طويلًا في اللهو]
  note: 'تقال في ظاهرها تحية، لكن المراد بها: سأسعد بغيابك عني. والنساء في فاس يقلن في المعنى نفسه: الله وأنتِ بخير.'
  source: dadoun
  page: 143
  status: draft

- id: u0291
  kind: usage
  prompt: مصدّق بلا حلف
  answer: لمن يبادر بالأدلة على أمر غير صحيح
  others: [للصادق الذي لا يحتاج إلى يمين, لمن يصدّق كل ما يسمعه, لمن يحلف على كل صغيرة وكبيرة ليصدقه الناس]
  note: أصله يقال لمن يسرع إلى الحلف بلا حاجة؛ وقد عدّ القدماء الإسراع إلى اليمين علامة على الكذب.
  source: abboudi_amthal
  page: 1353
  volume: ج٤
  status: draft

- id: u0292
  kind: meaning
  prompt: ملايكته خفيفه
  answer: خفيف الروح
  others: [سريع الحركة, طيب القلب, قليل الأكل]
  note: ومثله «ضله خفيف».
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0293
  kind: usage
  prompt: ما تشكرني نين تجرب غيري
  answer: في الدعوة إلى الروية قبل الحكم على الأمور
  others: [في الدعوة إلى شكر الناس على أعمالهم الصغيرة, في الدعوة إلى تجربة كل شيء جديد, في ذم من ينكر الجميل]
  note: «نين» حتى؛ لا تحكم لي ولا علي حتى تجرب غيري فتعرف الفرق.
  source: mughniyya
  page: 480
  status: draft

- id: u0294
  kind: meaning
  prompt: عايش كمالة عدد
  answer: لا فائدة منه سوى أنه يُعدّ واحدًا
  others: [يعيش في رخاء وسعة, يعدّ أمواله كل يوم ليطمئن على كمالها, مسؤول عن عائلة كبيرة]
  note: يقال لمن لا نفع فيه، كل ما فيه أنه يُكمل العدد.
  source: amin
  page: 276
  status: draft

- id: u0295
  kind: usage
  prompt: ما تنام منيره وفي بيتها ذخيره
  answer: لمن يبدد ما عنده أولا بأول ولا يبقي للغد شيئا
  others: [لمن يسهر الليل خوفا على ماله من اللصوص, للمرأة المدبّرة التي تخزن المؤونة لأيام الشدة, لمن يكثر الضيوف في بيته فلا يرتاح]
  note: منيرة اسم امرأة، والذخيرة ما يُدّخر من حاجات ونقود؛ فهي لا يهدأ لها بال حتى تنفق ما في بيتها.
  source: juhayman
  page: 44
  volume: ج٧
  status: draft

- id: u0296
  kind: usage
  prompt: أنا نزلت من السما، وانت استلقفتني من الأرض
  answer: لمن يُفاجأ بأمر لم يكن يخطر له على بال
  others: [لمن يتكبر على الناس ويرى نفسه فوقهم, لمن ينقذ صاحبه من ورطة في آخر لحظة, لمن يسافر بعيداً ثم يعود إلى بلده]
  note: استلقفتني أي تلقفتني؛ والمعنى أنه جاءه ما لم يحسب حسابه.
  source: akwa
  page: 231
  volume: ج١
  status: draft

- id: u0297
  kind: usage
  prompt: الفقى لما يسعد تجيله عشوتين فى ليلة
  answer: يقال لمن يحالفه الحظ فتأتيه منفعتان معًا
  others: [يقال لمن يُدعى إلى وليمة فيأكل فوق حاجته, يقال لمن يضيّع فرصة في انتظار فرصة أفضل منها, يقال لمن يعمل في عملين بالليل والنهار]
  note: الفقي هو من يقرأ القرآن في البيوت مقابل أجر أو عشاء؛ فإذا ابتسم له الحظ دُعي إلى بيتين في ليلة واحدة.
  source: shaalan
  page: 390
  volume: ج١
  status: draft

- id: u0298
  kind: usage
  prompt: بيضتها أحسن من ليلتها
  answer: في أن القليل الدائم خير من الكثير المنقطع
  others: [في أن الصبر على الشدة يأتي بالفرج القريب, في أن الطعام البسيط أهنأ من الولائم الكبيرة, في أن العمل في النهار خير من السهر بالليل]
  note: بيض الدجاجة كل يوم أنفع من ذبحها وأكلها في ليلة واحدة.
  source: taymur
  page: 114
  status: draft

- id: u0299
  kind: usage
  prompt: ذي ما معه همّه يحب الدمّه
  answer: لمن ينصرف عن واجباته وينشغل بشيء آخر
  others: [لمن يرفق بالحيوان أكثر من الناس, لمن لا يملك مالًا فيكتفي بالقليل, لمن يحب الهدوء ويكره الزحام]
  note: من لا هَمّ له يقضي وقته في ملاعبة القطة ومسحها، فيُعيَّر بذلك.
  source: iryani
  page: 309
  status: draft

- id: u0300
  kind: usage
  prompt: إلدار دارنا، والقمر جارنا، وما للناس وما لنا؟
  answer: للحث على ترك التدخل في شؤون الآخرين
  others: [لمن يفخر بجمال بيته, لمن يحب السهر في الليالي المقمرة, لمن يرحب بالضيوف في داره]
  note: نحن في بيتنا، فلا شأن لنا بالناس ولا شأن لهم بنا.
  source: sahli
  page: 145
  status: draft

- id: u0301
  kind: meaning
  prompt: أعطه حق ابن هادي
  answer: أعطه رشوة
  others: [أعطه أجرته كاملة, أعطه نصيبه من الميراث, أعطه صدقة]
  note: «حق ابن هادي» تعبير شاع على ألسنة الناس في اليمن كناية عن الرشوة.
  source: adimi
  page: 110
  status: draft

- id: u0302
  kind: meaning
  prompt: إن سلمت عليه عد صوابعك
  answer: احترس منه فهو معروف بالسرقة
  others: [لا تصافحه فهو مريض, احترم كبر سنه وقبّل يده حين تلقاه, لا تكثر من الوعود له]
  note: أي إذا صافحته فعدّ أصابعك بعد ذلك لئلا يكون سرق بعضها.
  source: taymur_kinayat
  page: 55
  status: draft

- id: u0303
  kind: meaning
  prompt: أسبوع الغربال
  answer: اهتمام مؤقت بالشيء الجديد ثم يُهمَل سريعًا
  others: [مدة قصيرة يُختبر فيها الصديق الجديد قبل أن يُؤتمن, موسم الحصاد وتنقية الحبوب, أيام الشدة التي يُعرف فيها الرجال]
  note: كالغربال الجديد، يُعتنى به أيامًا ثم يُنسى.
  source: zanin
  page: 20
  status: draft

- id: u0304
  kind: meaning
  prompt: يصوم يصوم ويفطر على بصلة
  answer: يصبر طويلًا ثم لا ينال ما يستحق
  others: [يقتصد في طعامه ولا يأكل إلا البصل, يحب البصل كثيرًا, يصوم أيامًا كثيرة]
  note: يقال لمن يطول صبره ثم يكون جزاؤه شيئًا هيّنًا.
  source: amin
  page: 398
  status: draft

- id: u0305
  kind: usage
  prompt: كَشْطْ اللّْعْوِيدْ يْوَلِّي جْوِيَّدْ
  answer: في بيان أثر حسن الهندام في تجميل المظهر
  others: [في الحث على العناية بالخيل وتربيتها, في التحذير من الاغترار بالمظاهر, في الحث على تعليم الصغار منذ نعومة أظفارهم]
  note: اللعويد تصغير العود أي الحصان، وجويد تصغير الجيد. إذا نُظّف الحصين صار جوادًا، والعناية بالمظهر تحسّن الصورة.
  source: dadoun
  page: 231
  status: draft

- id: u0306
  kind: usage
  prompt: ألف قلبه، ولا غلبه
  answer: لمن يقبل على صفقة ثم يتبين أنه غُبن فيها فيرجع عنها
  others: [لمن يغلب خصمه بالحيلة لا بالقوة, لمن يتردد ألف مرة قبل أن يقرر, لمن يحب صاحبه حبا شديدا ولا يستطيع أن يخاصمه مهما أساء]
  note: 'من أمثال التجار: أن يغيّر المرء نيته في البيع ألف مرة أولى من أن يُغلب مرة واحدة.'
  source: abboudi_amthal
  page: 180
  volume: ج١
  status: draft

- id: u0307
  kind: meaning
  prompt: عامل السكه قياسه
  answer: يكثر الذهاب والمجيء
  others: [يقيس الطريق قبل أن يسلكه, يحسب حسابًا لكل شيء, يسير ببطء شديد]
  note: كأنه يقيس الطريق بكثرة تردده فيه.
  source: taymur_kinayat
  page: 55
  status: draft

- id: u0308
  kind: usage
  prompt: جايين بتراب الدار
  answer: لمن يثقل على مضيفه بالحضور مع أهله جميعًا
  others: [لمن يعود من السفر محملًا بالهدايا, لمن يترك داره خرابًا ويرحل إلى بلد بعيد دون أن يودع أحدًا, لمن ينقل أثاثه إلى بيت جديد]
  note: جاؤوا جميعًا، الأب والأم والأولاد، كأنهم حملوا معهم تراب دارهم.
  source: mughniyya
  page: 213
  status: draft

- id: u0309
  kind: usage
  prompt: صاحبك قسمك
  answer: في إيثار الصديق ومشاركته في الخير بالتساوي
  others: [في أن الصديق يُختار كما يُختار النصيب, في الحذر من الصديق الذي يأخذ أكثر من حقه, في أن الإنسان لا يختار أصحابه بل يُقسمون له]
  note: من أمثال النادرة؛ والقسم الحصة والنصيب، أي اجعل صديقك مساوياً لك في الحقوق.
  source: akwa
  page: 637
  volume: ج١
  status: draft

- id: u0310
  kind: usage
  prompt: المحاكم حبالها طويلة
  answer: يقال عن بطء التقاضي وطول انتظار الأحكام
  others: [يقال عن كثرة المحامين في البلد, يقال عن صرامة القضاة وعدلهم, يقال عن قدرة القانون على ملاحقة المجرمين]
  note: التقاضي قد يمتد سنوات طويلة حتى تضيع معه الحقوق أو تتغير الظروف.
  source: shaalan
  page: 129
  volume: ج٥
  status: draft

- id: u0311
  kind: usage
  prompt: اضحكتوله امتد على طوله
  answer: للضيف اللئيم الذي يستغل حسن الاستقبال
  others: [للطفل المدلل الكثير الطلبات, لمن يضحك في كل مجلس بلا سبب, للمريض الذي يطول مرضه فيلازم فراشه أيامًا طويلة]
  note: ما إن ضحكوا في وجهه حتى تمدّد وأطال المقام.
  source: zanin
  page: 24
  status: draft

- id: u0312
  kind: usage
  prompt: الأعلام شفوف
  answer: يقال حين يُنقل الخبر بالتحيّز لأحد الطرفين بنبرة الصوت واختيار الكلمات
  others: [يقال حين تنتشر الأخبار بسرعة بين الناس فتصل إلى البعيد قبل القريب وتتغير في الطريق, يقال حين يُخفى الخبر عن أصحابه, يقال حين يصدق الخبر بعد طول شك]
  note: الشفّ الميل والتحيز؛ فناقل الخبر يميل كفّته إلى من يهواه دون كذب صريح.
  source: iryani
  page: 500
  status: draft

- id: u0313
  kind: meaning
  prompt: على عينك يا تاجر
  answer: جهارًا أمام الناس
  others: [سرًّا لا يعلم به أحد, بثمن غالٍ جدًّا, بالدَّين لا بالنقد]
  note: أي يُعطى الشيء علانية من غير إخفاء ولا دسّ.
  source: amin
  page: 280
  status: draft

- id: u0314
  kind: meaning
  prompt: من إيدها ورجلها
  answer: عمل غير محكم ولا متقن
  others: [عمل شاق متعب, عمل جماعي, عمل متقن من جميع وجوهه]
  note: كأن الصانع أمسك بطرفي الشيء ورماه دون تدقيق.
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0315
  kind: meaning
  prompt: فلان نزل من عيني
  answer: سقط احترامه عندي
  others: [بكيت عليه, اشتقت إليه, لم أعد أراه]
  source: asadi
  line: 119463
  halab: w1096
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0316
  kind: usage
  prompt: ما ضار مقتول طعنه
  answer: لمن أصابته نكبة كبيرة فلم تعد الصغيرة تؤثر فيه
  others: [لمن يبالغ في الشكوى والأنين من أذى يسير لا يكاد يذكر, لمن يعاقب على ذنب ارتكبه غيره, لمن ينتقم ممن سقط وانتهى أمره]
  note: من قُتل لا تضره طعنة بعد ذلك، ويشبهه قول المتنبي إن الميت لا يؤلمه الجرح.
  source: juhayman
  page: 80
  volume: ج٧
  status: draft

- id: u0317
  kind: usage
  prompt: زنجبيل بغباره
  answer: للشيء المحفوظ الذي لم تلمسه يد
  others: [للشيء القديم الذي فقد قيمته, للشخص الحاد الطبع سريع الغضب, للبضاعة المغشوشة المخلوطة بغيرها]
  note: كالزنجبيل الذي ما زال عليه غباره كما جاء؛ أي شيء لم يُمس ولم يُستعمل.
  source: adimi
  page: 232
  status: draft

- id: u0318
  kind: usage
  prompt: خوض المية بغيرك
  answer: للأناني الذي يلقي المخاطر على غيره
  others: [لمن يتعلم السباحة في النهر, لمن يساعد غيره على عبور الماء, لمن يسقي زرعه في الصيف من ماء النهر القريب]
  note: يجعل غيره يخوض الماء أولا ليسلم هو.
  source: sahli
  page: 143
  status: draft

- id: u0319
  kind: usage
  prompt: الدنيا على كف عفريت
  answer: يقال عن تقلّب الأحوال وعدم ثباتها
  others: [يقال عن الغني الذي جمع ماله بالحيلة والمكر, يقال عن الأمر الذي انتهى وحُسم, يقال عن الشخص المخيف الذي يهابه الناس]
  note: من يحمل الدنيا على كفه عفريت لا يُطمأن إليه، فهي قد تسقط أو تختفي فجأة.
  source: shaalan
  page: 426
  volume: ج٢
  status: draft

- id: u0320
  kind: usage
  prompt: ياخذ الحاج الداج
  answer: للمكان الواسع
  others: [للطريق الطويل الشاق, للرجل الكثير الأسفار, للسوق الكثير البضائع]
  note: «الحاج والداج» العدد الكثير من الحجاج ومن يتبعهم من الأعوان والمكارين؛ أي يتسع لهم جميعا.
  source: abboudi_amthal
  page: 1634
  volume: ج٥
  status: draft

- id: u0321
  kind: meaning
  prompt: الشيء دا بريمو
  answer: هذا من أحسن صنف
  others: [هذا قديم مستعمل, هذا رخيص الثمن, هذا مستورد من الخارج]
  note: 'يقولون: طباخ بريمو، وأكلة بريمو، أي من الدرجة الأولى.'
  source: amin
  page: 252
  status: draft

- id: u0322
  kind: usage
  prompt: كْوِيَّسْ وَكْعِيبَه، وَاخْرُجْ مْعَ الدّْرِيبَه
  answer: في الحث على الاقتصاد في ولائم الأفراح
  others: [في وصف ضيف يأكل كثيرًا ثم يغادر دون أن يشكر, في ذم من يخرج من الحفلة قبل نهايتها, في الحث على زيارة الجيران في الأعياد]
  note: 'من أمثال فاس: كأس شاي صغيرة وكعب غزال صغير ثم انصرف مع الدرب. أي يكفي في العرس القليل من المشروب والحلوى دون إسراف.'
  source: dadoun
  page: 239
  status: draft

- id: u0323
  kind: usage
  prompt: بعد ما طارت ساعدها بقولة هش
  answer: لمن يُظهر المساعدة بعد انقضاء الأمر
  others: [لمن يطرد الخير بيده ثم يندم على ما فعل, لمن يخاف من شيء صغير, لمن يساعد الناس سرا ولا يذكر ذلك]
  note: يزجر الطائر بعد أن طار فعلا، فلا فائدة من زجره؛ وقد يقال أيضا في عدم المبالاة بما خرج من اليد.
  source: taymur
  page: 106
  status: draft

- id: u0324
  kind: usage
  prompt: جا من تالي وقال المال مالي
  answer: لمن يدّعي ملكية شيء أو يستولي عليه بغير حق
  others: [لمن يصل متأخرًا فلا يجد شيئًا من الطعام, لمن يرث مالًا كثيرًا من أبيه فيبدده في وقت قصير, لمن يأتي آخر الناس ثم يتقدمهم في العمل]
  note: «من تالي» من الآخر؛ جاء آخر الناس وادعى أن المال كله له.
  source: mughniyya
  page: 213
  status: draft

- id: u0325
  kind: meaning
  prompt: مات في جلده
  answer: اشتد خوفه
  others: [مات فجأة, ضعف وهزل, نام نومًا عميقًا]
  note: والعرب تقول للمفلوج «سُجن في جلده».
  source: taymur_kinayat
  page: 71
  status: draft

- id: u0326
  kind: meaning
  prompt: ريح ما يضرباش
  answer: شخص لا يخرج من منزله
  others: [شخص قويّ لا يتأثر بشيء, شخص بخيل لا يعطي, شخص لا يمرض أبدًا]
  note: أي لا تصيبه الريح لأنه لا يغادر بيته.
  source: zanin
  page: 156
  status: draft

- id: u0327
  kind: meaning
  prompt: لا ينفع طبله ولا طار
  answer: لا يصلح لشيء
  others: [لا يحب الغناء والطرب, لا يُسمع له صوت, لا يقبل النصيحة]
  note: أي لا يصلح أن يُصنع منه طبل ولا دف.
  source: taymur_kinayat
  page: 69
  status: draft

- id: u0328
  kind: usage
  prompt: من زمر لك بنفيطه، العب له برجل
  answer: في أن المرء يُعطى بمقدار ما يُقدّم
  others: [في أن الفرح لا يكتمل إلا بالمزمار والرقص, في أن من يمدحك قليلاً يريد منك الكثير, في أن الضيف يُكرم بأكثر مما قدّم]
  note: النفيطة بوصة المزمار، ولا يخرج منها صوت ملحّن إلا ببوصتين؛ فمن زمّر لك بواحدة فارقص له برجل واحدة.
  source: akwa
  page: 1221
  volume: ج٢
  status: draft

- id: u0329
  kind: usage
  prompt: الدمّه المنكره
  answer: لمن ينكر الجميل ولا يحفظ المعروف
  others: [لمن يخاف من كل شيء, لمن يسرق طعام جيرانه, لمن يكثر النوم ويقلّ عمله]
  note: القطة تهجر البيت إذا وجدت طعامًا أفضل في غيره، بخلاف الكلب الذي يلزم أهله.
  source: iryani
  page: 309
  status: draft

- id: u0330
  kind: meaning
  prompt: جيبه نضيف زي الكف
  answer: جيبه خالٍ ليس فيه شيء
  others: [ثيابه نظيفة دائمًا, يده خفيفة في السرقة, كريم لا يمسك مالًا عن أحد]
  note: كناية عن الإفلاس، كباطن الكف الذي لا شيء فيه.
  source: amin
  page: 154
  status: draft

- id: u0331
  kind: usage
  prompt: آهو كلام ابن عم حديث
  answer: يقال عن الكلام المرسل الذي لا يُلزم أحدًا
  others: [يقال عن كلام الأقارب الذي يُصدَّق دون دليل, يقال عن الخبر الجديد الذي لم يسمعه أحد قبل, يقال عن الوعد الذي لا بد من الوفاء به]
  note: كلمة «آهو» هنا للسخرية وقلة الاهتمام، وقد يقال التعبير أيضًا تعبيرًا عن عدم الرضا عما يدور في المجلس.
  source: shaalan
  page: 56
  volume: ج٣
  status: draft

- id: u0332
  kind: usage
  prompt: انقوله ثور يقولى احلبه
  answer: للشخص العنيد
  others: [لمن يطلب المستحيل, لمن لا يعرف الحيوانات, للكسول الذي يتهرب من العمل]
  note: أقول له إنه ثور، فيقول احلبه!
  source: zanin
  page: 69
  status: draft

- id: u0333
  kind: usage
  prompt: الأرض ما تعلّم باللي فيها
  answer: في الحث على دفن المال في الأرض إذا خيف عليه
  others: [في ذم من يفشي أسرار أصحابه, في الحث على الزراعة واستثمار الأرض بدل تركها بورا, في أن الميت لا يعلم بما يجري بعده]
  note: «تعلّم» أي تُخبر؛ فالأرض لا تخبر أحدا بما فيها، بخلاف الصاحب الذي قد يفشي ما أودعته عنده.
  source: abboudi_amthal
  page: 85
  volume: ج١
  status: draft

- id: u0334
  kind: usage
  prompt: تقل جني شاف ذيب
  answer: لمن يتضاءل ويعجز عن الحركة أمام شخص آخر
  others: [لمن يختفي فجأة عن أعين الناس ثم يظهر في مكان آخر, لمن يخيف الناس بكثرة صياحه, لمن يرى ما لا يراه غيره]
  note: تقل أي كأنه، وشاف أي رأى. يقول العامة إن الجني إذا تقمص حيوانا ثم رآه الذئب عجز عن الهرب.
  source: juhayman
  page: 84
  volume: ج١٠
  status: draft

- id: u0335
  kind: meaning
  prompt: على الحديده
  answer: شدة الفقر وزوال كل شيء
  others: [شدة البأس والقوة, الاستعداد للقتال, العمل في الحدادة منذ الصغر]
  note: ومثله «على البلاط» و«على الجلده».
  source: taymur_kinayat
  page: 57
  status: draft

- id: u0336
  kind: usage
  prompt: يحق في الجمل لبيض يحسابه شحم
  answer: لقصير النظر الذي يخدعه المظهر فيأخذ به دون حذر
  others: [للطماع الذي يشتهي كل ما يراه في أيدي الناس ولا يقنع بما عنده, للبخيل الذي يستكثر كل شيء على غيره, للغافل الذي لا يرى ما أمام عينيه]
  note: «يحق» ينظر، و«لبيض» الأبيض، و«يحسابه» يظنه؛ ينظر إلى الجمل الأبيض فيظن بياضه شحمًا.
  source: mughniyya
  page: 564
  status: draft

- id: u0337
  kind: meaning
  prompt: تقول للقمر غيب وأنا مكانك
  answer: شديدة الجمال
  others: [كثيرة السهر, متكبرة على غيرها, تحب الظهور أمام الناس]
  note: كناية عن جمال المرأة البالغ، كأنها تقول للقمر اغرب فأنا أنوب عنك.
  source: adimi
  page: 162
  status: draft

- id: u0338
  kind: usage
  prompt: إوجع إجريك، ولا توجع راسك
  answer: للحث على أن يسعى المرء بنفسه فلا يتكل على غيره
  others: [للتحذير من المشي الطويل بلا حاجة, لمن يشكو من مرض لا يعرف سببه, لمن يفضل الراحة على العمل ويقضي يومه في النوم والكسل]
  note: تعب القدمين في قضاء حاجتك بنفسك أهون من وجع الرأس من انتظار غيرك.
  source: sahli
  page: 72
  status: draft

- id: u0339
  kind: meaning
  prompt: قاعد يبيع ويقيس
  answer: يتصرف في ملكه كما يشاء
  others: [يبيع بالمكيال الناقص, يجلس بلا عمل, يتعلم التجارة من أبيه في دكانه]
  note: كالتاجر في دكانه، يبيع ويقيس على هواه بلا رقيب.
  source: amin
  page: 304
  status: draft

- id: u0340
  kind: usage
  prompt: أَنَا مَا شَمَّيْتْشِي فِي اظْفَارِي
  answer: لمن يلومك على أمر لم يخبرك به أحد
  others: [لمن يتباهى بنظافته أمام الناس, لمن يأكل بيده ولا يغسلها, لمن ينكر فضل غيره عليه بعد أن أعانه في شدته]
  note: أي لم أشمّ الخبر في أظافري، فكيف أعرف ما لم يخبرني به أحد؟ يرد به من يُلام على تقصير في أمر كان يجهله.
  source: dadoun
  page: 21
  status: draft

- id: u0341
  kind: usage
  prompt: من حاده يحك يحسبه يفك
  answer: في البخيل
  others: [في الجبان, في الكسول, في الثرثار]
  note: حاد في لهجات تهامة بمعنى رأى؛ فالبخيل يرتاب من كل حركة يراها، فيحسب من يحكّ جلده يفكّ شيئًا.
  source: iryani
  page: 217
  status: draft

- id: u0342
  kind: meaning
  prompt: شايل الدنيا
  answer: يصخب ويعلو صوته في الخصام
  others: [يتحمل أعباء الناس كلها, غني يملك الكثير, متكبر يرى نفسه فوق الناس]
  note: يقولون «رحت له لقيته شايل الدنيا».
  source: taymur_kinayat
  page: 45
  status: draft

- id: u0343
  kind: usage
  prompt: الدهر قلبه بقلبه
  answer: في أن الزمان لا يدوم على حال واحدة
  others: [في أن القلوب تتبدل بتبدل الأصحاب, في أن الإنسان يندم على ما فات من عمره, في أن الشدة لا تأتي إلا بعد الرخاء]
  note: أي إن الأيام تتقلب بأهلها، فيوم لك ويوم عليك.
  source: akwa
  page: 497
  volume: ج١
  status: draft

- id: u0344
  kind: usage
  prompt: فرّج عليه الرايح والجاى
  answer: يقال عمن فضح غيره علنًا أمام الناس جميعًا
  others: [يقال عمن فرّج كربة كل محتاج, يقال عمن فتح بيته للضيوف والمارّة ليلًا ونهارًا, يقال عمن يقف في الطريق يراقب المارّة]
  note: الرايح والجاي هم المارة في السوق والأماكن العامة؛ فمن «فرّج عليهم» غيره جعله فرجة لكل الناس.
  source: shaalan
  page: 76
  volume: ج٤
  status: draft

- id: u0345
  kind: usage
  prompt: ضبة خشب تحفظ العتب
  answer: في الحث على الاحتياط بما تيسر
  others: [في أن أبواب الخشب أمتن من الحديد, في أن البيت القديم أبرك من الجديد, في ذم من يغلق بابه أمام الناس]
  note: الضبة قفل خشبي قديم، والعتب جمع عتبة؛ أي ولو قفل بسيط يحفظ البيت.
  source: taymur
  page: 226
  status: draft

- id: u0346
  kind: meaning
  prompt: اصلح من مية البحر
  answer: شيء صالح لاستعمالات كثيرة
  others: [شيء مالح لا يُستساغ, أمر فسد فسادًا لا يمكن إصلاحه أبدًا, شيء كثير لا ينفد]
  note: ماء البحر يُنتفع به في وجوه كثيرة، فيقال للشيء الذي يصلح لأغراض عدة.
  source: zanin
  page: 23
  status: draft

- id: u0347
  kind: meaning
  prompt: تحطه على الجرح يبرد
  answer: حسن الخلق لطيف المعشر
  others: [بارد الطبع لا يتأثر, يجيد مداواة الجروح بالأعشاب, صبور على الألم]
  note: يقال في الرجل الطيب اللطيف، فيشبّهونه بالمرهم الذي يُسكّن الجرح.
  source: amin
  page: 123
  status: draft

- id: u0348
  kind: usage
  prompt: يخوّقه، ويطوّقه
  answer: لمن يتصرف في غيره كما يريد
  others: [لمن يزيّن أهله بالحلي, لمن يخدع غيره بالكلام المعسول, لمن يكافئ صاحبه بالهدايا]
  note: «الخوق» خرق الأذن لوضع القرط فيها، و«يطوّقه» يضع الطوق في عنقه.
  source: abboudi_amthal
  page: 1700
  volume: ج٥
  status: draft

- id: u0349
  kind: meaning
  prompt: إيدي على كتفك
  answer: الاستعداد للعمل والذهاب حيث يُطلب منه
  others: [التهنئة بالنجاح بعد تعب طويل في الدراسة, التهديد بالضرب, مواساة الحزين]
  note: 'كأنه يقول: هذه يدي على كتفك فلنمضِ معًا إلى حيث تريد.'
  source: taymur_kinayat
  page: 20
  status: draft

- id: u0350
  kind: usage
  prompt: الأصحاب ولت معارف
  answer: في تبدل الزمان وفتور الود بين الإخوان
  others: [في كثرة الأصحاب حول صاحب المال, في أن المعرفة القديمة بين الناس لا تنسى مهما طال الزمن, في الحث على التعارف بين الجيران]
  note: «ولّت» أي أصبحت؛ صار الأصحاب مجرد معارف، يقال حين تتغير الأحوال ويُعرض الأصدقاء.
  source: mughniyya
  page: 86
  status: draft

- id: u0351
  kind: usage
  prompt: المجنة ما ترد ميت
  hint: المجنة المقبرة
  answer: لمن يأخذ الشيء ولا يعيده أبدا
  others: [لمن يحزن على ما فات ولا يمكن استرجاعه, لمن يكثر الوعود ولا يفي بها, لمن يخفي الأسرار ولا يبوح بها]
  note: المقبرة لا تعيد من دُفن فيها؛ يقال لمن يستعير ولا يردّ.
  source: adimi
  page: 120
  status: draft

- id: u0352
  kind: usage
  prompt: فلان مثل الحمار تدزه ويا طارجلك
  answer: للمعاند الذي يخالفك في كل أمر لمجرد الخلاف
  others: [لمن يتعب في عمل لا يعود عليه بنفع, لمن يمشي ببطء فيؤخر من معه, لمن يدفع غيره إلى الخطر ويبقى هو آمنًا في مكانه]
  note: تدزه أي تدفعه إلى الأمام فيرجع إلى الوراء حتى يطأ رجلك؛ فإن أردته أن يمشي فقل له قف.
  source: juhayman
  page: 158
  volume: ج٥
  status: draft

- id: u0353
  kind: usage
  prompt: بُص لعيالك قبل ما تطيش أفعالك
  answer: يقال تحذيرًا من التهور لأن عاقبته على الأبناء
  others: [يقال لمن يقارن أولاده بأولاد غيره, يقال لمن يسرف في تدليل أولاده الصغار, يقال لمن يعاقب أولاده على أخطاء صغيرة لا تستحق]
  note: الطيش هو التهور؛ والمثل يدعو إلى التعقل حتى لا يدفع الأولاد ثمن انفعال الأب.
  source: shaalan
  page: 316
  volume: ج٤
  status: draft

- id: u0354
  kind: usage
  prompt: حيرك على من تعلّيت
  answer: لمن لا يُظهر قوته إلا على من هو أضعف منه
  others: [لمن يرتفع شأنه فينسى أصحابه, لمن يصعد الجبل ولا يعرف النزول, لمن يتواضع مع الناس رغم مكانته]
  note: أي قدرتك لا تظهر إلا على من كنتَ في مكان يعلوه وهو تحتك.
  source: iryani
  page: 218
  status: draft

- id: u0355
  kind: meaning
  prompt: نفسه خضره
  answer: يميل إلى السرور ولا يحتمل الحزن
  others: [يحب الخضر والبقول, حسود لا يرضى, كثير الأمل في الغد مهما اشتدت عليه الأيام]
  note: تعني «خضراء».
  source: taymur_kinayat
  page: 78
  status: draft

- id: u0356
  kind: usage
  prompt: أول سفره فى بابور الزمزمى
  answer: للشخص حديث التجربة
  others: [لمن يسافر كثيرًا, لمن يكره ركوب البحر, لمن يخسر في أول تجارة]
  note: «البابور» السفينة؛ يقال لمن يخوض الأمر أول مرة.
  source: zanin
  page: 70
  status: draft

- id: u0357
  kind: usage
  prompt: بْحَالْ الْمَهْرَازْ فِى دَارْ الدّْبَغْ، دَقْ أَنَا، دَقْ انْتَ
  answer: لمن يتحمّل التعب من الجميع ولا يرحمه أحد
  others: [لمن يكثر الضجيج في كل مكان يحلّ فيه, لمن يتقن صنعته ويفخر بها أمام الناس, لمن يتشاجر مع جيرانه على أتفه سبب ثم يندم]
  note: المهراز هو الهاون الذي يُدقّ فيه الدباغ في دور دبغ الجلود، يدقّ فيه كل واحد بدوره. يقال فيمن يتلقّى المشاق من الجميع بلا شفقة.
  source: dadoun
  page: 31
  status: draft

- id: u0358
  kind: meaning
  prompt: ربنا يقصر ليلته بالعافية
  answer: دعاء للمريض بالشفاء
  others: [دعاء على الظالم, دعاء للمسافر بالوصول, دعاء للعريس بالسعادة]
  note: لأن المرض يُطيل الليل على صاحبه، فالدعاء بقصر ليلته دعاء بالعافية.
  source: amin
  page: 212
  status: draft

- id: u0359
  kind: usage
  prompt: سرك في بير
  answer: يقوله المرء ليطمئن صاحبه أنه سيكتم سره
  others: [يقوله من يريد أن يبيع بئر ماء, يقوله من يحذّر غيره من خطر خفي, يقوله من يدفن ماله في الأرض]
  note: السر في عمق البئر لا يخرج إلى أحد.
  source: sahli
  page: 176
  status: draft

- id: u0360
  kind: usage
  prompt: ليت العقول تشترى بغالي الثمنا
  answer: لذوي الآراء السقيمة والأفكار السخيفة
  others: [لمن يشتري الأشياء الغالية بلا حاجة, لمن يبيع علمه للناس بثمن مرتفع, لمن يحسد العقلاء على ذكائهم]
  note: من أمثال النساء، ويقال إنه من أجمل ما نطقت به المرأة اليمنية من حكمة.
  source: akwa
  page: 991
  volume: ج٢
  status: draft

- id: u0361
  kind: meaning
  prompt: أش لسانك آكلتو القطّة؟
  answer: لماذا أنت ساكت؟
  others: [لماذا تكذب؟, لماذا لا تأكل؟, لماذا تصرخ؟]
  source: asadi
  line: 134416
  halab: w1091
  status: draft

- id: u0362
  kind: usage
  prompt: خطاه طوال
  answer: لمن يصل إلى أماكن لا يُتوقع أن يبلغها مثله
  others: [لمن يستعجل في أموره فيتعثر ويسقط قبل أن يبلغ غايته, لمن يكثر الأسفار ولا يستقر, لمن يعد بالكثير ولا يفي]
  note: الخطا جمع خطوة؛ وكأنه يقطع المسافات البعيدة بخطوات واسعة.
  source: abboudi_amthal
  page: 464
  volume: ج٢
  status: draft

- id: u0363
  kind: usage
  prompt: إلي مش واخذه على البخور وين بخرت حرقت رداها
  answer: سخريةً ممن تأتيه الفرصة فلا يحسن الانتفاع بها
  others: [سخريةً ممن يكثر الكلام عن نفسه في المجالس, سخريةً ممن يبالغ في التزين لأتفه المناسبات, سخريةً ممن يقلّد غيره في لباسه ومشيته]
  note: «مش واخذه» لم تعتد، و«وين» عندما؛ من لم يتعود على الشيء أفسده أول مرة.
  source: mughniyya
  page: 134
  status: draft

- id: u0364
  kind: meaning
  prompt: عرفها وهي طايره
  answer: شديد الذكاء يدرك المعنى من أول وهلة
  others: [يصيد الطيور بمهارة, يسرع في الهرب, يحب السفر ويتنقل بين البلاد كالطيور المهاجرة]
  note: المراد الكلمة يسرع بها قائلها فيلتقطها قبل أن تقع.
  source: taymur_kinayat
  page: 56
  status: draft

- id: u0365
  kind: meaning
  prompt: زي مضغ الزلط
  answer: صعب ثقيل على النفس
  others: [سهل لا يحتاج إلى جهد, لذيذ يُشتهى, سريع لا يأخذ وقتًا]
  note: يشبّهون الأمر الشاق بمضغ الحصى.
  source: amin
  page: 227
  status: draft

- id: u0366
  kind: meaning
  prompt: رقدة أهل الكهف
  answer: نوم طويل أو إهمال طويل
  others: [سهر طويل في العبادة, اختفاء عن الناس خوفًا, غربة طويلة عن الأهل]
  note: إشارة إلى قصة أصحاب الكهف الذين ناموا سنين طويلة.
  source: zanin
  page: 155
  status: draft

- id: u0367
  kind: usage
  prompt: مخّه دفتر
  answer: يقال إعجابًا بمن يحفظ كل شيء ولا ينسى
  others: [يقال لمن يكتب كل ما يسمعه في دفتر صغير, يقال لمن يحسب حساب كل قرش, يقال لمن لا يفهم إلا ما كان مكتوبًا]
  note: يشبّه التعبير الذاكرة القوية بالدفتر الذي يحتفظ بكل ما يُكتب فيه.
  source: shaalan
  page: 126
  volume: ج٢
  status: draft

- id: u0368
  kind: usage
  prompt: لا أدري من أي طرقعة من الطراقع أقبل
  answer: يقال عن الشيء يظهر فجأة لا يُعرف من أين أتى
  others: [يقال عن الضيف يأتي في وقت غير مناسب ولم ينتظره أحد, يقال عن الطريق الطويل الكثير المنعطفات, يقال عن الخبر الكاذب ينتشر بين الناس]
  note: الطرقعة المكان البعيد النائي أو الخفي المجهول، ويقال في الشيء المفقود، لا أدري في أي طرقعة اختفى.
  source: iryani
  page: 586
  status: draft

- id: u0369
  kind: meaning
  prompt: يغرق في شبر ميه
  answer: يرتبك لأدنى أمر لعجزه وقلة حيلته
  others: [لا يحسن السباحة فيخاف من النزول إلى الماء, يبالغ في الخوف من البحر, يحزن لأقل خسارة مالية]
  note: أي يغرق في ماء لا يزيد عمقه على شبر.
  source: taymur_kinayat
  page: 59
  status: draft

- id: u0370
  kind: usage
  prompt: نايبك في الدست، والمغرفه تايهه
  answer: لمن يختلق الأعذار ليحرم غيره من حقه
  others: [لمن يطبخ كثيرا للناس ولا يأكل شيئا, لمن يضيع أدواته ثم يلوم غيره عليها, لمن ينتظر نصيبه من الطعام بصبر]
  note: 'الدست هو القدر الكبير: نصيبك فيه، لكن المغرفة ضائعة!'
  source: taymur
  page: 370
  status: draft

- id: u0371
  kind: usage
  prompt: فِى الْفَرْحْ مَنْسِيِّينْ وْفِى الْقَرْحْ مَدْعِيِّينْ
  answer: لمن لا يتذكرك إلا حين يحتاج إلى عونك
  others: [لمن يحضر الأعراس ويغيب عن الجنائز, لمن ينسى مواعيده مع أصدقائه, لمن يفرح لحزن غيره ويحزن لفرحه]
  note: في الأفراح لا يدعونك، وفي الشدائد يستنجدون بك. يقال فيمن لا يزورك إلا في أزمته وينساك في سروره.
  source: dadoun
  page: 215
  status: draft

- id: u0372
  kind: usage
  prompt: من حسد الشريك أصلب المال
  answer: في أن المالك إذا حسد أجيره على نصيبه أضر بنفسه
  others: [في أن الشراكة في المال تجلب الحسد والخصام, في أن من حسد غيره على ماله افتقر سريعاً, في أن المال لا يبقى إلا مع الشريك الأمين]
  note: الشريك هنا الأجير، وأصلب المال أي جعله لا يثمر؛ فإذا حسده المالك ترك الأرض فأُهملت.
  source: akwa
  page: 1201
  volume: ج٢
  status: draft

- id: u0373
  kind: usage
  prompt: كم سعيدة بسوق البيض
  answer: حين يكثر أمثال الشخص من حوله
  others: [حين يُغشّ المشتري في السوق, حين يفرح المرء بربح قليل, حين يعجز البائع عن بيع بضاعته]
  note: أي ما أكثر من هم مثله؛ فليس فريدا كما يظن.
  source: adimi
  page: 319
  status: draft

- id: u0374
  kind: usage
  prompt: شمسه في أطراف العسبان
  answer: لمن قرب أجله أو قارب الشيء نهايته
  others: [لمن يعمل في النخل من الصباح إلى المساء, لمن يجلس في الظل ويترك الناس في الحر, لمن يتأخر عن موعده كل مرة]
  note: الشمس إذا قاربت المغيب لم يبق نورها إلا في أعالي جريد النخل؛ فهي في آخر النهار.
  source: juhayman
  page: 70
  volume: ج٤
  status: draft

- id: u0375
  kind: meaning
  prompt: أكل معه عيش وملح
  answer: صارت بينهما مودة وعهد
  others: [دعاه إلى طعام فقير, تشاركا في تجارة الخبز والملح, أكلا معًا في السوق]
  note: 'الخبز والملح عندهم يوثّقان الرابطة، ومن خانها قالوا: خانه العيش والملح.'
  source: amin
  page: 359
  status: draft

- id: u0376
  kind: usage
  prompt: عمّه جمل
  answer: لمن له سند قوي يحميه ويدافع عنه
  others: [لمن يحمل الأثقال عن أهله ويصبر على مشقتها, لمن يشبه أعمامه في الخِلقة, لمن يصبر على الجوع والعطش]
  note: «العم» هنا السيد أو الظهير؛ وظهيره قوي على حمل الصعاب كالجمل المتمرّس بالأثقال.
  source: abboudi_amthal
  page: 867
  volume: ج٢
  status: draft

- id: u0377
  kind: usage
  prompt: ألف حرامي ما بشلحوا عريان
  answer: لمن لا يملك شيئا يخشى أن يفقده
  others: [لمن يحرس بيته من اللصوص بنفسه, لمن يعيش بين الناس بلا خوف لقوته, لمن يسرق ولا يقبض عليه أحد]
  note: العريان لا يجد اللصوص ما ينزعونه عنه، فلا يخاف منهم.
  source: sahli
  page: 35
  status: draft

- id: u0378
  kind: meaning
  prompt: خسر الجلد والسقط
  answer: خسر كل شيء
  others: [خسر قليلًا وربح كثيرًا, خسر صديقه, ربح من تجارة اللحوم]
  note: السقط أطراف الذبيحة وكرشها؛ أي ضاعت الذبيحة كلها حتى جلدها وفضلاتها.
  source: taymur_kinayat
  page: 34
  status: draft

- id: u0379
  kind: usage
  prompt: بارك الله فيمن عزم وستر
  answer: يقوله الضيف حين يُعرض عليه الطعام فيعتذر شاكرًا
  others: [يقوله صاحب البيت حين يودّع ضيوفه, يقوله الفقير حين يتلقّى صدقة, يقوله من يُدعى إلى عرس فيحضره ويبارك لأهل العروسين بالخير]
  note: «عزم» دعا إلى الطعام؛ ويروى «وسلم».
  source: zanin
  page: 75
  status: draft

- id: u0380
  kind: usage
  prompt: احزب به ولا تحرب به
  answer: فيمن منظره يصلح للمباهاة وهو ضعيف عند الشدائد
  others: [فيمن يعير ثيابه للناس ويبقى بلا ثوب, فيمن يُحسن الحرب ولا يُحسن الكلام, فيمن يتزيّن في الأعياد فقط ويهمل مظهره سائر أيام السنة]
  note: أي تزيّن به وتباهَ، ولا تعتمد عليه في الحرب.
  source: iryani
  page: 174
  status: draft

- id: u0381
  kind: usage
  prompt: حتى النفس يفارق صاحبه
  answer: في أن تباعد الأحباب والأصدقاء أمر طبيعي
  others: [في أن الإنسان لا يعرف قيمة صحته إلا عند المرض, في أن الصديق الحق لا يفارق صاحبه, في أن الغضب يخرج الإنسان عن طبعه]
  note: إذا كان النفَس نفسه يفارق صاحبه، فلا عجب أن يتفرق الأحبة والأقارب.
  source: mughniyya
  page: 230
  status: draft

- id: u0382
  kind: meaning
  prompt: لا يحل ولا يربط
  answer: العاجز الذي ليس الأمر بيده
  others: [الحيادي الذي لا يتدخل في الخصام, الكسول الذي لا يعمل, المتردد في قراره]
  note: أي لا ينقض ولا يبرم.
  source: taymur_kinayat
  page: 69
  status: draft

- id: u0383
  kind: meaning
  prompt: العينة بينة
  answer: نموذج الشيء يدل على باقيه
  others: [العين ترى كل شيء, الظاهر غير الباطن, الشيء الواضح لا يحتاج إلى برهان]
  note: يقال حين يكفي جزء صغير من الشيء للحكم عليه كله.
  source: amin
  page: 286
  status: draft

- id: u0384
  kind: usage
  prompt: اللى لسعته الشربة ينفخ فى الزبادى
  answer: يقال لمن صار يحذر مما لا ضرر فيه
  others: [يقال لمن يأكل الطعام قبل أن ينضج, يقال لمن يتعلم الطبخ من أمه, يقال لمن يتكبر على الطعام البسيط]
  note: الشوربة تؤكل ساخنة، فمن لسعته صار يخاف حتى من الزبادي البارد؛ وفي معناه «اللي لسعته الحية يخاف من ديلها».
  source: shaalan
  page: 134
  volume: ج١
  status: draft

- id: u0385
  kind: usage
  prompt: إذا كثر القوم قل اللوم
  answer: في أن كثرة الضيوف تخفف عتابهم للمضيف على تقصيره
  others: [في أن كثرة الناس في المجلس تقلل الكلام فيه, في أن الجماعة الكبيرة لا يلوم بعضها بعضاً على الخطأ, في أن من كثر أهله قل خوفه من أعدائه]
  note: إذا كثر عدد الضيوف لم يلتفتوا إلى ما يقع من صاحب البيت من تقصير غير مقصود.
  source: akwa
  page: 131
  volume: ج١
  status: draft

- id: u0386
  kind: meaning
  prompt: ايش يسلّك الحرير م السدرة
  answer: أمر صعب جدًا
  others: [ثوب ثمين لا يُلبس إلا في الأعياد, شيء ضائع لا يُعثر عليه, أمر سهل لا يحتاج إلى تعب]
  note: «يسلّك» يخلّص؛ السدرة شجرة شائكة، ومن يخلّص الحرير من أشواكها؟
  source: zanin
  page: 73
  status: draft

- id: u0387
  kind: usage
  prompt: لو تبي ما صار من ذا شي
  answer: لمن يشكو من أمر هو سببه
  others: [لمن يتمنى ما لا يمكن تحقيقه, لمن يندم على فرصة أضاعها غيره, لمن يرفض العون وهو محتاج إليه]
  note: «تبي» أي تريد؛ لو كنت تريد ألا يحدث ما حدث لما حدث منه شيء.
  source: abboudi_amthal
  page: 1145
  volume: ج٣
  status: draft

- id: u0388
  kind: meaning
  prompt: نزل بها رجل غراب طلع بها خف جمل
  answer: كبّر اللقمة
  others: [سرق خفية, بدأ صغيرًا وصار كبيرًا, أخذ القليل ورد الكثير]
  note: ينزل بيده فارغة كمخلب الغراب ويرفعها ممتلئة كخف الجمل.
  source: taymur_kinayat
  page: 77
  status: draft

- id: u0389
  kind: usage
  prompt: الكلام يجر بعضه
  answer: يقال حين يقود حديثٌ إلى حديث آخر
  others: [يقال لمن يكثر الكلام ولا يفعل شيئًا, يقال لمن ينقل الكلام بين الناس ليوقع بينهم, يقال لمن يطيل الحديث حتى يمل منه السامعون]
  note: الحديث يتصل بعضه ببعض، فيبدأ المرء بموضوع وينتقل منه إلى غيره دون أن يقصد، ولذلك يقال المثل عند بدء الكلام.
  source: shaalan
  page: 430
  volume: ج١
  status: draft

- id: u0390
  kind: usage
  prompt: شَرَّحْ مَلَّحْ
  answer: لمن يكتم أمرًا قد يضر غيره فيُنصح بالمصارحة
  others: [لمن يسرف في الملح عند الطبخ, لمن يشرح الدرس شرحًا مطولًا حتى يملّ منه تلاميذه, لمن يتقن تجفيف اللحم وتخزينه]
  note: 'أصله تشريح اللحم وتمليحه لتقديده. ثم صار يقال لمن يخفي سرًا يؤذي غيره: أظهر ما عندك، فالصراحة راحة.'
  source: dadoun
  page: 159
  status: draft

- id: u0391
  kind: usage
  prompt: من سل سيف مرهف الهند مده
  answer: في أن من هدد فعليه أن ينفذ وعيده
  others: [في أن القوي لا يحتاج إلى إظهار سلاحه, في أن الصلح خير من الحرب, في أن السلاح الجيد يُعرف من صنعته]
  note: مرهف الهند سيف صنعه الهنود وأرهفوا حده، ومده أي ضرب به؛ وإلا صار من يهدد ولا يفعل.
  source: juhayman
  page: 178
  volume: ج٨
  status: draft

- id: u0392
  kind: usage
  prompt: حمار الشيخ يقف في العقبة
  hint: العقبة الطريق الصاعد في الجبل
  answer: لمن يهمل حاجته ثم يطلبها بعد فوات الأوان
  others: [لمن يتعب في خدمة غيره بلا مقابل, لمن يحتمي بصاحب الجاه ليقضي حاجته عند الناس, لمن يسافر في الجبال دون زاد]
  note: يقال لمن يغفل عن مصالحه في وقتها ثم يطلبها في أحرج الأوقات بعد فوات الأوان.
  source: adimi
  page: 188
  status: draft

- id: u0393
  kind: meaning
  prompt: آه يا وعدي
  answer: ما أكثر ما لقيت منك!
  others: [ما أصدقك في كل وعد تعطيه!, ما أطيب أيامي معك!, ما أبعد موعدك عني!]
  note: تعبير شكوى، يتحسّر به المرء على كثرة ما قاساه من شخص.
  source: amin
  page: 12
  status: draft

- id: u0394
  kind: usage
  prompt: شيل إيدك من المرق لا تحترق
  answer: لمن يمنع غيره من منفعة متظاهرا بالنصح
  others: [لمن يتعجل أكل الطعام قبل أن ينضج تماما, لمن يبخل على ضيفه بالطعام الساخن, لمن يطبخ للناس ولا يتقن الطبخ]
  note: يتظاهر بالشفقة على يده وهو يريد أن يمنعه من الأكل؛ وقد يقال أيضا في تجنب ما يؤذي.
  source: taymur
  page: 221
  status: draft

- id: u0395
  kind: usage
  prompt: فيه إلي كلمته في فمه وفيه إلي كلمته عند أمه
  answer: في أن من الناس من يملك أمره ومنهم التابع الضعيف
  others: [في أن الأم أعرف الناس بأخلاق أبنائها, في أن الكلام الطيب يخرج من القلب فيصل إلى قلوب السامعين, في أن الصادق لا يحتاج إلى من يشهد له]
  note: من الرجال من يدبر شؤونه بنفسه، ومنهم من لا يستقل برأي ولا يلتزم بموقف.
  source: mughniyya
  page: 403
  status: draft

- id: u0396
  kind: usage
  prompt: وجع ساعة، ولا كل ساعة
  answer: للصبر على ألم قصير خير من احتمال ألم دائم
  others: [لمن يشكو من مرض دائم ويرفض أن يزور الطبيب, لمن يتأخر عن موعده ساعة, لمن يعمل ساعات طويلة]
  note: كقلع الضرس، ألم لحظة ثم راحة.
  source: sahli
  page: 350
  status: draft

- id: u0397
  kind: meaning
  prompt: اللى رشك يبخنا
  answer: الذي رزقك يرزقنا
  others: [الذي أساء إليك سيسيء إلينا, الذي ظلمك سيظلمنا أيضًا, الذي سبقك سيلحقه غيره]
  note: أي الرازق واحد، فلا يحسد أحد أحدًا على رزقه.
  source: zanin
  page: 39
  status: draft

- id: u0398
  kind: usage
  prompt: حريوه وفراشها منها
  answer: فيمن يتحمّل الأمر ويتكفّل بكل تبعاته
  others: [فيمن يطلب الكثير ولا يقدّم شيئًا, فيمن يتزيّن بما ليس له, فيمن يدخل بيتًا لا يعرف أهله]
  note: الحَرِيوة في لهجات اليمن العروس، فهذه عروس جاءت بفراشها معها.
  source: iryani
  page: 174
  status: draft

- id: u0399
  kind: meaning
  prompt: دود على عود
  answer: التناهي في النحافة
  others: [كثرة الناس في المكان, الفساد الذي يأكل الشيء, الصبر على المرض]
  note: يقولون «بقى دود على عود» لمن هزل حتى صار كدودة على عود.
  source: taymur_kinayat
  page: 36
  status: draft

- id: u0400
  kind: meaning
  prompt: وصلت اللقمة للتمّ
  answer: أوشك الأمر أن يتمّ
  others: [شبع الجميع, غلا الطعام, انكشف السرّ]
  source: asadi
  line: 150510
  halab: w1093
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0401
  kind: meaning
  prompt: تفضل الحاجة تقول نيني نيني لما ييجي الخايب يشتريني
  answer: الرديء يبقى حتى يشتريه غافل
  others: [الغالي لا يشتريه إلا الأغنياء, الجيد يُباع في أول النهار, البائع يغني ليجذب الزبائن]
  note: يقال عن السلعة السيئة تكسد طويلًا حتى يقع عليها مشترٍ قليل الخبرة.
  source: amin
  page: 134
  status: draft

- id: u0402
  kind: usage
  prompt: خرج منها زى الشعرة م العجين
  answer: يقال إعجابًا بمن تخلّص من ورطة دون أذى
  others: [يقال عمن نحف جسمه من طول المرض والتعب, يقال عمن أفسد طعامًا أعدّه لضيوفه, يقال عمن دخل في شجار فخرج منه مهزومًا]
  note: الشعرة تُسحب من العجين بسهولة دون أن تفسده، وكذلك الذكي ينسل من المشكلة دون أن يعلق بها.
  source: shaalan
  page: 191
  volume: ج٣
  status: draft

- id: u0403
  kind: usage
  prompt: متى يا نجد تسيلين؟ إلى صار الزرع بالجرين؟
  answer: في تأخر النفع عن وقت الحاجة إليه
  others: [في الصبر على الجفاف حتى يأتي المطر, في الشوق إلى الوطن البعيد, في الفرح بالحصاد بعد التعب]
  note: '«الجرين» البيدر؛ سأل زارع نجدا متى يأتيها السيل، ثم أجاب نفسه: أبعد أن يصير الزرع في البيدر؟ حينها لا ينفعه.'
  source: abboudi_amthal
  page: 1313
  volume: ج٤
  status: draft

- id: u0404
  kind: meaning
  prompt: كله يطلع في الغسيل
  answer: الجزاء سيقع حين يحين وقته
  others: [العيوب تخفى مع الأيام, الأمر يحتاج إلى جهد كبير, كل شيء ينسى]
  note: كالوسخ في الثوب يبقى حينًا ثم يزول عند الغسل.
  source: taymur_kinayat
  page: 51
  status: draft

- id: u0405
  kind: usage
  prompt: حظيره بسبعة أبواب
  answer: نصيحة بالبقاء في صنعاء موسم الخريف بدل الخروج إلى ضواحيها
  others: [نصيحة بإغلاق أبواب البستان حتى لا تدخله الماشية, نصيحة بتنويع مصادر الرزق حتى لا ينقطع, نصيحة بحفظ الأسرار عن الجيران والأقارب حتى لا تنتشر بين أهل المدينة]
  note: الحظيرة البستان، والمراد صنعاء ذات الأبواب السبعة، فكانت تأتيها فواكه الخريف كلها بأرخص الأسعار.
  source: akwa
  page: 427
  volume: ج١
  status: draft

- id: u0406
  kind: usage
  prompt: أم الذلال لا تفرح ولا تحزن
  answer: سخريةً من الجبان
  others: [سخريةً من البخيل, سخريةً من الكسول, سخريةً من الثرثار]
  note: «الذلال» الجبان؛ لأنه يتجنب الإقدام فلا يعود إلى أمه بخبر يسرها ولا بخبر يحزنها.
  source: mughniyya
  page: 152
  status: draft

- id: u0407
  kind: usage
  prompt: مَ اللِّي كَتْعْيَى الرّْحَا كَتْدَشَّشْ
  answer: لمن ضعفت قوته فلم يعد يتقن عمله
  others: [لمن يطحن قمحه في بيته بيده ليوفر أجرة الطحان, لمن يتعب من الكلام فيسكت فجأة, لمن يترك عمله قبل أن يتمّه]
  note: الرحى إذا تعبت أخرجت الدشيشة أي الحب المكسّر بدل الدقيق. كناية عمن أضعفه الكبر أو المرض فقلّ إتقانه.
  source: dadoun
  page: 327
  status: draft

- id: u0408
  kind: meaning
  prompt: آذان حنفى
  answer: الصوت الحسن المرتَّل
  others: [الصوت العالي المزعج, الكلام الكثير بلا فائدة, النداء المتأخر عن وقته]
  note: يقال في مدح الصوت الجميل المرتّل، ويقولون بالمعنى نفسه «آذان شافعي».
  source: zanin
  page: 18
  status: draft

- id: u0409
  kind: usage
  prompt: نارك ولا جنة غيرك
  answer: للرضا بقسوة من تحب وعدم قبول الطيب من غيره
  others: [لمن يفضل الفقر في بلده على الغنى في الغربة, لمن يخاف من النار ويطمع في الجنة, لمن يغار من نعمة غيره]
  note: الحب أو الإعجاب يجعل المرء يرضى بشدة صاحبه ولا يرضى بإحسان غيره.
  source: juhayman
  page: 283
  volume: ج٨
  status: draft

- id: u0410
  kind: usage
  prompt: خطوة في الضوء ولا عشرة في الغدرة
  hint: الغدرة الظلام
  answer: للحث على العمل ببصيرة ولو كان بطيئا
  others: [للحث على السفر نهارا خوفا من اللصوص, للحث على الإسراع قبل حلول الظلام, للحث على الاقتصاد في الإنارة]
  note: خطوة واحدة على هدى خير من خطوات كثيرة في العتمة لا تدري إلى أين تقود.
  source: adimi
  page: 205
  status: draft

- id: u0411
  kind: meaning
  prompt: بيضحك ع الفاضي
  answer: يضحك على ما لا يُضحك
  others: [يبتسم وهو حزين, يضحك من قلبه, يسخر من الناس]
  note: يقال لمن يضحك بلا سبب يدعو إلى الضحك.
  source: amin
  page: 117
  status: draft

- id: u0412
  kind: meaning
  prompt: رمى وراه قواره
  answer: دعا على الذاهب بألا يعود
  others: [ودّعه بالبكاء, رمى خلفه الماء ليعود سالمًا, كسر ما بينهما من ود]
  note: القوارة قطعة فخار مكسورة كانوا يرمونها خلف من لا يحبون رجوعه.
  source: taymur_kinayat
  page: 38
  status: draft

- id: u0413
  kind: usage
  prompt: ما في بيته حقى دجاجة
  answer: يقال عن المعدم الذي لا يملك شيئًا
  others: [يقال عن البخيل الذي لا يطعم ضيفه, يقال عن الكسول الذي لا يربي شيئًا, يقال عن البيت المهجور منذ زمن]
  note: الحُقى حفنة يسيرة من الحب تُقدّم للطير الداجن لتحقيه، أي تلتقطه بمنقارها.
  source: iryani
  page: 189
  status: draft

- id: u0414
  kind: usage
  prompt: إتكلّم على قدّك
  answer: يقال للمغرور الذي يبالغ في تقدير نفسه
  others: [يقال لمن يتكلم بصوت منخفض لا يسمعه الحاضرون, يقال لمن يأكل أكثر من حاجته, يقال لمن يخاف أن يقول رأيه]
  note: «قدّك» أي قدرك؛ والعبارة تدعو إلى عدم المزايدة والتدخل فيما لا يخص المرء.
  source: shaalan
  page: 198
  volume: ج٥
  status: draft

- id: u0415
  kind: usage
  prompt: شو بدنا باللي راح؟ إحنا أولاد اليوم
  answer: للحث على ترك الخلافات القديمة والصلح
  others: [لمن ينسى أصدقاءه القدامى, لمن يحن إلى أيام الماضي, للتحسر على أيام الصبا التي مضت ولن تعود أبدا]
  note: ما مضى قد مضى، فلنعش يومنا متصالحين.
  source: sahli
  page: 188
  status: draft

- id: u0416
  kind: usage
  prompt: يدوّر الشر من اين الين
  answer: لمن لا ينفك يبحث عن الخصام وإيذاء غيره
  others: [لمن يتتبع أخبار الناس ليرويها في المجالس والأسواق, لمن يسافر كثيرا بلا هدف, لمن يفتش عن ماله الضائع]
  note: «يدوّر» يبحث، و«الين» إلى أن؛ أي يبحث عن الشر من أين جاء وإلى أين ذهب.
  source: abboudi_amthal
  page: 1711
  volume: ج٥
  status: draft

- id: u0417
  kind: usage
  prompt: ما لها إلا رجالها
  answer: للأمر الصعب لا يصلحه إلا العارف به
  others: [للأمر يتعطل لكثرة من يتدخل فيه من الناس, لمن يعتمد على أهله في كل شيء, للمال الذي لا يدوم في يد صاحبه]
  note: 'ويروى: ما يجيبها إلا رجالها؛ أي لا يذللها إلا أهل الكفاية.'
  source: taymur
  page: 337
  status: draft

- id: u0418
  kind: meaning
  prompt: يسرق الكحل من العين
  answer: ماهر في السرقة والاختلاس
  others: [دقيق الملاحظة لا يفوته شيء, يخدع الناس بجماله, يسهر الليل فلا ينام]
  note: من مهارته يأخذ الكحل من العين ولا يشعر صاحبها.
  source: taymur_kinayat
  page: 41
  status: draft

- id: u0419
  kind: usage
  prompt: لا تبايع من اثنين، ولا تشتري من ثلاثة
  answer: نصيحة في البيع والشراء حتى لا تُغلب في السعر ولا يقع خلاف
  others: [نصيحة في الزواج حتى لا تكثر الخلافات بين الأهل, نصيحة في السفر حتى لا يكثر الرفاق في الطريق, نصيحة في الدين حتى لا يكثر الدائنون عليك ويطالبوك جميعاً في يوم واحد]
  note: من أمثال إبّ؛ البيع لاثنين معاً يوقع الخلاف، والشراء من جماعة يجعلهم يغلبونك في السعر.
  source: akwa
  page: 901
  volume: ج٢
  status: draft

- id: u0420
  kind: meaning
  prompt: يا دار ما دخلك شر
  answer: انتهى الأمر بلا مشكلة
  others: [هذا البيت مسكون, البيت يحتاج إلى إصلاح, لن أدخل هذه الدار أبدًا]
  note: يقال حين تنتهي مسألة دون أن تجرّ شرًّا.
  source: amin
  page: 396
  status: draft

- id: u0421
  kind: usage
  prompt: ارخص الحرير لين شدو به عراوى القدور
  answer: للشيء الثمين تهبط قيمته بعد ارتفاع
  others: [للبخيل يستعمل الرخيص بدل الغالي, للصانع الماهر يُحسن استعمال كل مادة, للأمر الصعب يصير سهلًا بالتعوّد]
  note: «لين شدو به» حتى ربطوا به؛ صار الحرير رخيصًا حتى رُبطت به عُرى القدور.
  source: zanin
  page: 19
  status: draft

- id: u0422
  kind: usage
  prompt: صاحب بالين كذاب
  answer: لمن يجمع بين عملين أو صنعتين في وقت واحد
  others: [لمن يكذب على أصحابه ليرضيهم, لمن يغير رأيه كل يوم فلا يثق به أحد من أصحابه, لمن يعد ولا يفي بوعده]
  note: من شغل باله بأمرين لم يُتقن أيًّا منهما، ويقال أيضًا لمن يتعلق قلبه بشخصين معًا.
  source: mughniyya
  page: 331
  status: draft

- id: u0423
  kind: meaning
  prompt: راح راس في رجلين
  answer: أغمي عليه أو غاب عن الوعي
  others: [انقلب رأسًا على عقب في لعبه, نام نومًا عميقًا مريحًا, سافر بسرعة]
  note: أي صار لا يعي من شدة المرض.
  source: taymur_kinayat
  page: 37
  status: draft

- id: u0424
  kind: usage
  prompt: وَاللّهْ وَمَا قَفَّلْتِهْ، لاَ فَوَّرْتِهْ
  answer: لمن يريد أن ينال ما يرغب فيه دون تعب
  others: [لمن يطبخ طعامًا لا يعرف أصول طهوه, لمن يحلف كثيرًا في كل كلامه, لمن يغلق بابه في وجه الضيوف]
  note: السكسو أي الكسكس لا تنضج حباته إلا إذا أُحكم غلق الكسكاس على البخار. فمن لم يتعب لم ينضج له شيء.
  source: dadoun
  page: 351
  status: draft

- id: u0425
  kind: usage
  prompt: العصاية السابقة سابقة
  answer: يقال في أن من يبادر بالضرب يغلب خصمه
  others: [يقال في أن الخطأ الأول لا يُنسى أبدًا, يقال في أن الكبير يُقدَّم دائمًا على الصغير, يقال في أن العقاب القديم يكفي للتأديب]
  note: هو بمعنى «الهجوم خير وسيلة للدفاع»؛ فمن يسبق بالضربة يربك خصمه ويغلبه بالمفاجأة.
  source: shaalan
  page: 186
  volume: ج٢
  status: draft

- id: u0426
  kind: usage
  prompt: إن سبرت قالوا الشيخ اسبرها، وان بطلت قالوا اعمال الفقيه
  answer: في كل حال يُبخس فيها الضعيف ويُحمَّل الفشل دون النجاح
  others: [في مدح من يصلح بين المتخاصمين ولا ينتظر من أحدهم جزاءً ولا شكرًا, في أن العمل الجماعي ينسب إلى الجميع, في أن الفقيه أعلم من الشيخ بالأمور]
  note: النجاح يُنسب إلى شيخ القبيلة ولو كان الجهد للفقيه، والفشل يُنسب إلى الفقيه وحده.
  source: iryani
  page: 418
  status: draft

- id: u0427
  kind: meaning
  prompt: دورت عليه في سلقط في ملقط ما لقيتوش
  answer: بحثت عنه في كل مكان فلم أجده
  others: [وجدته أخيرًا في مكان غريب بعيد, انتظرته طويلًا حتى جاء, لم أبحث عنه أصلًا]
  note: «سلقط وملقط» أماكن متخيّلة للدلالة على استقصاء البحث.
  source: amin
  page: 204
  status: draft

- id: u0428
  kind: usage
  prompt: الحاذق يخرج من السوق عطل
  hint: عطل أي خالي اليدين
  answer: لمن يبالغ في المساومة فيفوته الشراء
  others: [لمن يبيع بضاعته بأقل من ثمنها الحقيقي, لمن يدخل في تجارة لا يعرفها, لمن يشتري ما لا يحتاج إليه]
  note: الشاطر الذي يشكك في كل شيء ويزهد فيه يعود من السوق دون أن يقضي حاجته.
  source: adimi
  page: 34
  status: draft

- id: u0429
  kind: usage
  prompt: ماكول في الخطة ومنظاهر
  answer: لمن يريد أن يكسب بالحق والباطل ولا يتقيد بقاعدة
  others: [لمن يخسر في كل لعبة يدخلها, لمن يقنع بنصيبه من اللعب ولا يطمع في شيء خارج الخطة, لمن يلعب بأموال الناس ويحفظ ماله]
  note: من لعبة الكعاب عند الأطفال، تُرسم دائرة (الخطة) في الأرض، وهذا اللاعب يريد ما داخلها وما خارجها معا.
  source: juhayman
  page: 138
  volume: ج٧
  status: draft

- id: u0430
  kind: usage
  prompt: الهوا يجدّع الجدران
  answer: في أن الميل الشديد إلى الشيء يمنع الإنصاف ورؤية الحق
  others: [في أن الريح الشديدة تهدم البيوت الضعيفة التي لم يُحكم بناؤها, في أن الكلام الكثير يفسد العلاقات, في أن الإهمال يخرب البيوت]
  note: 'فيه تورية: «الهواء» الريح التي ترمي الجدران، والمراد «الهوى» أي الميل الشديد. و«يجدّع» يرمي.'
  source: abboudi_amthal
  page: 1607
  volume: ج٤
  status: draft

- id: u0431
  kind: usage
  prompt: اللي سف النخالة ما تودع عنده دقيقك
  answer: في الحث على عدم ائتمان من اعتاد أخذ التافه على الأشياء الثمينة
  others: [في الحث على الاقتصاد في الطعام, في ذمّ من يخلط الجيد بالرديء, في الحث على إكرام الفقير ولو بالقليل، فالصدقة لا تُستصغر مهما قلّ مقدارها]
  note: من استباح النخالة لا يؤتمن على الدقيق.
  source: zanin
  page: 40
  status: draft

- id: u0432
  kind: meaning
  prompt: وشه يقطع الخميره من البيت
  answer: المشؤوم الثقيل
  others: [البخيل الذي لا يطعم أحدًا, الطبّاخ الماهر, الغاضب العابس]
  note: الخميرة توضع في الخبز؛ أي إذا دخل دارًا أذهب بركتها.
  source: taymur_kinayat
  page: 82
  status: draft

- id: u0433
  kind: usage
  prompt: كثر النط بقصف الرقبة
  answer: لذم التمادي في التبجح والادعاء
  others: [للتحذير من اللعب على السطوح, لمن يقفز من عمل إلى عمل, لمن يتعجل في مشيه]
  note: من أكثر القفز كُسرت رقبته، وكذلك من تمادى في التفاخر.
  source: sahli
  page: 261
  status: draft

- id: u0434
  kind: usage
  prompt: ما سد واحد سد عشره
  answer: في أن الطعام الذي يكفي واحداً يكفي عشرة
  others: [في أن رجلاً واحداً لا يقوم مقام عشرة, في أن من سد حاجة واحد كأنه سد حاجة عشرة, في أن الباب الواحد يغلق على عشرة بيوت]
  note: من أمثال إبّ؛ سدّ بمعنى كفى، فالبركة في الطعام القليل إذا اجتمع عليه الناس.
  source: akwa
  page: 1041
  volume: ج٢
  status: draft

- id: u0435
  kind: usage
  prompt: ترقيع المال خير من تجديده
  answer: في أن إصلاح المهنة القائمة خير من تركها إلى غيرها
  others: [في أن الثوب المرقوع أدفأ من الثوب الجديد, في أن الادخار القليل خير من الإنفاق الكثير, في أن الدين القديم أولى بالسداد من الجديد]
  note: تحسين الصنعة التي بين يديك وتنميتها أنفع من التحول إلى صنعة جديدة.
  source: mughniyya
  page: 200
  status: draft

- id: u0436
  kind: usage
  prompt: فقرى وصاحب مزاج
  answer: يقال للفقير الذي يجري وراء الكيف فوق طاقته
  others: [يقال للغني البخيل الذي يحرم نفسه من كل متعة, يقال لمن يتقلب مزاجه بين الرضا والغضب كل ساعة, يقال للفقير الصابر الراضي بما قسمه الله له]
  note: يسخر المثل ممن لا يجد قوت يومه ثم يبحث عن إشباع مزاجه وعاداته التي لا تتفق مع حاله.
  source: shaalan
  page: 390
  volume: ج١
  status: draft

- id: u0437
  kind: meaning
  prompt: يكلمك ومناخيره لفوق
  answer: متكبر
  others: [مزكوم, طويل القامة, خجول]
  note: تصوير لمن يرفع أنفه تعاليًا وهو يحادث الناس.
  source: amin
  page: 399
  status: draft

- id: u0438
  kind: meaning
  prompt: عامل أبو علي
  answer: يتعاظم ويتظاهر بالعلو
  others: [يتصدق على الفقراء, يقلّد أباه, يتظاهر بالمرض]
  note: اختاروا كنية «أبو علي» لأنها من العلو.
  source: taymur_kinayat
  page: 55
  status: draft

- id: u0439
  kind: usage
  prompt: عليل وعامل مداوي
  answer: لمن يهمل نفسه ويهتم بالناس
  others: [لمن يمرض كثيرا ولا يشكو لأحد, لمن يدّعي علما لا يعرفه, لمن يزور المرضى ويواسيهم]
  note: 'مريض يتصدر لمداواة غيره، وفي معناه: يا مداوي خيل الناس حصانك من عند زوره خايب.'
  source: taymur
  page: 249
  status: draft

- id: u0440
  kind: meaning
  prompt: زي من يحطب فى الظلام
  answer: من يجمع الحسن مع السيئ دون تمييز
  others: [من يعمل في السرّ, من يتعب بلا أجر, من يسرق خفية في الليل ثم ينكر فعلته]
  note: من يجمع الحطب في الظلام لا يميّز اليابس من الأخضر.
  source: zanin
  page: 171
  status: draft

- id: u0441
  kind: usage
  prompt: لقف مفتوح وجحر مطروح
  answer: لمن يريد أن يُطعَم وهو قاعد عن السعي في رزقه
  others: [لمن يكثر الأكل في كل وجبة ثم يشكو من التخمة والكسل, لمن يفتح بيته للضيوف ولا يملك ما يقدمه, لمن يتكلم كثيرًا ولا يعرف ما يقول]
  note: اللِّقْف في لهجات اليمن هو الفم، أي فمٌ مفتوح للطعام وجسدٌ مطروح لا يعمل.
  source: iryani
  page: 812
  status: draft

- id: u0442
  kind: usage
  prompt: 'لَفْقِيهْ خْمِيَّانْ، قْرَا فِى لَبْرِيَّه سَبْعَ ايَامْ وَقَالْ لْهُمْ: هَذْ الْخَطْ عْيَانْ'
  answer: لمن يدّعي علمًا لا يفقه منه شيئًا
  others: [لمن يعجز عن الكتابة بخط جميل, لمن يطيل قراءة الرسائل ليؤخر الجواب, لمن يكتب الرسائل للناس بأجرة]
  note: 'ظل الفقيه أسبوعًا يقرأ الرسالة ثم قال: هذا الخط رديء! يقال في المدّعي الذي يتظاهر بالإتقان ثم ينكشف أمره.'
  source: dadoun
  page: 255
  status: draft

- id: u0443
  kind: usage
  prompt: مال المحروم للظلمة
  answer: في أن مال البخيل على نفسه يذهب إلى غيره قسرا
  others: [في أن الفقير يُظلم في كل مكان, في أن المال الحرام لا يدوم لصاحبه بل يذهب كما جاء سريعا, في أن اليتيم يُطمع في ماله]
  note: «المحروم» هنا من حرم نفسه الانتفاع بماله، و«الظلمة» جمع ظالم.
  source: abboudi_amthal
  page: 1238
  volume: ج٣
  status: draft

- id: u0444
  kind: meaning
  prompt: فلان عم بيبني على رمل
  answer: عمله بلا أساس ولن يدوم
  others: [يبني بيتاً جميلاً قرب البحر, يشتغل بسرعة وإتقان, يصرف ماله على أولاده]
  note: وضدّه عندهم، عم بيبني على صخر.
  source: asadi
  line: 101325
  halab: w1085
  flag: book line has the 'صخر' form and gives 'رمل' as its opposite; meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0445
  kind: usage
  prompt: غريم ساقه كريم
  hint: الغريم من لك عنده حق
  answer: حين يأتيك من تطلبه دون أن تسعى إليه
  others: [حين يسدد المدين دينه قبل موعده دون أن يُطالَب, حين يصلح الكريم بين المتخاصمين, حين يتحول العدو إلى صديق]
  note: كأن الله ساق إليك من كنت تبحث عنه لتنال منه حقك.
  source: adimi
  page: 293
  status: draft

- id: u0446
  kind: meaning
  prompt: لا يعجبه العجب ولا الصيام في رجب
  answer: لا يرضيه شيء أبدًا
  others: [يحب كل شيء جديد, يصوم كثيرًا, يتعجب من كل شيء]
  note: يقال لكثير الاعتراض الذي لا يُعجبه حتى ما يُجمع الناس على حسنه.
  source: amin
  page: 326
  status: draft

- id: u0447
  kind: meaning
  prompt: الدنيا واقفه على رجل
  answer: هياج الناس وثورتهم في أمر
  others: [الاستعداد لعيد أو فرح, سكون المكان وخلوه, انتظار الناس لمطر يسقي زرعهم]
  note: 'كقولهم في الفصحى: قامت الحرب على ساق.'
  source: taymur_kinayat
  page: 36
  status: draft

- id: u0448
  kind: usage
  prompt: كلب تعسعس ولا ذيب ربض
  answer: للضعيف الذي يسعى، فهو خير من القوي الذي قعد عن العمل
  others: [للجبان الذي يتظاهر بالشجاعة أمام الضعفاء, لمن يحرس مال غيره ويضيع ماله, للقوي الذي يخفي قوته حتى يحين وقتها]
  note: تعسعس أي تحرك وسعى في طلب رزقه، وربض أي جلس وأخلد إلى الراحة.
  source: juhayman
  page: 62
  volume: ج٦
  status: draft

- id: u0449
  kind: usage
  prompt: دى عزومة مراكبية
  answer: يقال عن الدعوة غير الصادقة للمجاملة
  others: [يقال عن الوليمة الكبيرة التي يحضرها الجميع, يقال عن الدعوة إلى نزهة في النيل, يقال عن الطعام المصنوع من السمك]
  note: كان المراكبية يأكلون على ظهر المركب وهو يسير في النيل، فيدعون من على الشاطئ إلى الطعام وهم يعلمون أنه لن يلحق بهم.
  source: shaalan
  page: 136
  volume: ج٦
  status: draft

- id: u0450
  kind: usage
  prompt: بيدخل ويخرج في عيون الجيران
  answer: لمن يفعل ما يريد غير مبالٍ بفضول الناس واستنكارهم
  others: [لمن يتجسس على جيرانه ليعرف أحوالهم, لمن يكثر زيارة جيرانه في كل وقت حتى يملّوه ويغلقوا أبوابهم دونه, لمن يخاف من كلام الناس فيلزم بيته]
  note: الباء في «بيدخل» زائدة؛ أي يدخل ويخرج أمام أعين الجيران ولا يبالي.
  source: akwa
  page: 307
  volume: ج١
  status: draft

- id: u0451
  kind: usage
  prompt: سلف الميده للجابيه
  answer: لمن لا يفي بما عليه من ديون
  others: [لمن يقرض الناس ولا يطالبهم بحقه, لمن يبذر الماء في غير موضعه, لمن يأخذ من الغني ويعطي الفقير]
  note: «الميدة» حوض صغير بجانب البئر ينحدر منه الماء إلى «الجابية»، ولا يعود الماء إلى الميدة أبدًا.
  source: mughniyya
  page: 313
  status: draft

- id: u0452
  kind: meaning
  prompt: نفخة ربه
  answer: التعاظم الكاذب
  others: [الغضب العابر, الجوع الشديد, الصحة والقوة]
  note: الربة ثالث رعية في البرسيم، تنفخ الماشية انتفاخًا ليس من سمن ولا صحة.
  source: taymur_kinayat
  page: 77
  status: draft

- id: u0453
  kind: meaning
  prompt: ايش جاب عينها لوذنها
  answer: أشياء متباعدة لا علاقة بينها
  others: [أمر قريب جدًا يسهل بلوغه, كلام يُقال في غياب صاحبه, شيء جميل متناسق الأجزاء يسرّ الناظرين]
  note: «وذنها» أذنها؛ أين العين من الأذن؟
  source: zanin
  page: 72
  status: draft

- id: u0454
  kind: usage
  prompt: بعد حشيشي ما ينبت حشيش
  answer: للأناني الذي لا يبالي بمن يأتي بعده
  others: [للفلاح الذي يقلع العشب من حقله, لمن يترك أرضه بلا زرع سنة لتستعيد خصوبتها, لمن يخاف على أولاده من بعده]
  note: لا يهمه ما يكون بعد زواله، فليجفّ العشب كله بعده.
  source: sahli
  page: 93
  status: draft

- id: u0455
  kind: usage
  prompt: البزيّه العال تشخ أربعين يوم سنوب
  answer: يقال للإشادة بنشاط الخادمة وجدّها
  others: [يقال للسخرية من الكسول الذي يطيل الوقوف, يقال لمن يصبر على الجوع طويلًا, يقال لمن يتعب في عمل لا ينفعه]
  note: البزيّة الخادمة، والسنوب الوقوف؛ فالخادمة الجيدة لا تجلس من كثرة العمل.
  source: iryani
  page: 448
  status: draft

- id: u0456
  kind: usage
  prompt: عين كلام
  answer: للفصيح الكثير الأخبار الذي لا ينقطع حديثه
  others: [للنمّام الذي ينقل الكلام بين الناس, للصامت الذي يراقب الناس بعينه ولا ينطق بكلمة واحدة, للشاعر الذي يرتجل القصائد]
  note: شبّهوا كلامه بماء العين الغزير، مقابل البئر التي يخرج منها ماء قليل.
  source: abboudi_amthal
  page: 884
  volume: ج٢
  status: draft

- id: u0457
  kind: meaning
  prompt: ريقه نشف
  answer: ألحّ في الطلب ولم ينجح
  others: [عطش من الحر, خاف فسكت, تكلم بلا توقف حتى تعب الناس]
  note: يقال لمن بذل جهده في الطلب حتى جفّ ريقه بلا فائدة.
  source: amin
  page: 218
  status: draft

- id: u0458
  kind: usage
  prompt: اللّهْ يْنَجِّيكْ مَنَ الْمَشْتَاقْ ايلاَ فَاقْ
  answer: من المحروم إذا نال النعمة فطغى بها
  others: [من الغائب إذا عاد إلى أهله, من المريض إذا شفي من مرضه, من النائم إذا استيقظ فجأة في منتصف الليل]
  note: المشتاق هو المحروم الذي لم يتربّ في النعمة، فإذا أصابها لم يتمتع بها وقد يطغى ويتجبر.
  source: dadoun
  page: 251
  status: draft

- id: u0459
  kind: meaning
  prompt: حماتك تحبك
  answer: حظك حسن إذ أدركت الطعام في أوله
  others: [أهل زوجتك راضون عنك, أنت محبوب بين الناس لحسن خلقك وكرمك, ستسمع خبرًا سارًا قريبًا]
  note: تقال لمن يصادف نعمة لم يكن يتوقعها، وأكثر ما تقال لمن يأتي والطعام قد وُضع.
  source: taymur_kinayat
  page: 30
  status: draft

- id: u0460
  kind: usage
  prompt: دخل فى حارة سد
  answer: يقال عمن سار في طريق لا يوصله إلى غرضه
  others: [يقال عمن دخل بيتًا دون استئذان, يقال عمن سكن في حي فقير بعيد عن السوق, يقال عمن أغلق بابه في وجه جيرانه]
  note: الحارة السد زقاق ضيق لا مخرج له، ومن دخلها لا بد أن يعود من حيث جاء.
  source: shaalan
  page: 271
  volume: ج٣
  status: draft

- id: u0461
  kind: meaning
  prompt: اللحمة ما تكبر كان فى عظمها
  answer: الإنسان لا يعظم شأنه إلا بين أهله وقومه
  others: [الإنسان لا يتغيّر طبعه مهما كبر, الصغير يكبر بالطعام الجيد, القليل يكبر بالصبر والمداومة حتى يصير كثيرًا]
  note: «كان» هنا بمعنى إلا؛ اللحم لا ينمو إلا على عظمه.
  source: zanin
  page: 31
  status: draft

- id: u0462
  kind: usage
  prompt: فتحوها الفيران وقعوا فيها التيران
  answer: للشيء يفعله الصغار فيقع ضرره على الكبار
  others: [لمن يحفر لغيره حفرة فيقع فيها هو نفسه أولا, للضعيف يغلب القوي بالحيلة والدهاء, لمن يستهين بالخطر الصغير حتى يكبر]
  note: الفئران تحفر في الأرض فتتعثر الثيران وتسقط.
  source: taymur
  page: 267
  status: draft

- id: u0463
  kind: usage
  prompt: إلي جاباته يدينك تاكله لحيتك
  answer: لمن يأتي عملًا مضرًا فيتحمل عاقبته
  others: [لمن يأكل من تعب غيره دون حياء, لمن يربي لحيته ليظهر بمظهر الوقار, لمن يعطي بيد ويأخذ بالأخرى]
  note: «جاباته يدينك» أي اقترفته يداك؛ ما جنيته بنفسك تدفع ثمنه بنفسك.
  source: mughniyya
  page: 110
  status: draft

- id: u0464
  kind: usage
  prompt: لا هم قلبوه بعدما جيت
  answer: لمن يروي كلاماً لا يطابق الواقع
  others: [لمن يرجع من سفر فيجد كل شيء قد تغيّر, لمن يغيّر رأيه كلما سمع كلاماً جديداً, لمن يتأخر عن موعده فيلوم غيره]
  note: أصله أن رجلاً ادعى زيارة مكة ووصف زمزم برجل ذي لحية، فلما قيل له إنها بئر قال إنهم لا بد قلبوها بعد مغادرته.
  source: akwa
  page: 961
  volume: ج٢
  status: draft

- id: u0465
  kind: meaning
  prompt: سمن على العسل
  answer: شخصان متفقان تمام الاتفاق
  others: [طعام غالٍ لا يقدر عليه أحد, خصمان لا يلتقيان, أمر سهل في أوله صعب في آخره]
  note: يقال للاثنين يمتزجان ويتآلفان امتزاج السمن بالعسل.
  source: amin
  page: 239
  status: draft

- id: u0466
  kind: meaning
  prompt: دفناه سوى
  answer: كلانا يعرف حقيقة الأمر فلا تدّعِ فيه
  others: [نحن شركاء في الربح والخسارة, لقد انتهى الأمر ولا داعي لذكره, نحن أقارب منذ زمن بعيد ويجمعنا نسب واحد]
  note: ويقال «دافنينه سوا»؛ أي شهدنا معًا دفن الشيء فأنا أعرف ما تعرف.
  source: taymur_kinayat
  page: 35
  status: draft

- id: u0467
  kind: usage
  prompt: غدا عشاء عودي قات بكره بعده قالوا مات
  answer: لمن لا يطلب من الدنيا إلا الأكل والقات
  others: [لمن يؤجل كل شيء إلى الغد حتى يأتيه الموت, لمن يسرف في الأكل حتى يمرض, لمن يستضيف الناس كل يوم دون كلل]
  note: يكفيه غداء وعشاء وأعواد من القات ثم لا يبالي بما بعده؛ يقال لمن ضاقت همته.
  source: adimi
  page: 293
  status: draft

- id: u0468
  kind: usage
  prompt: سبرت حجنه، بطلت شريم
  answer: في الشيء الذي يمكن الانتفاع به على وجه أو على آخر
  others: [في من يبدأ العمل بحماسة شديدة ثم يتركه قبل أن يتمّه, في أن الحداد لا يُتقن إلا صنعة واحدة, في أن الأداة الصغيرة لا تصلح للعمل الكبير]
  note: الحجنة معول صغير والشريم المنجل؛ فقطعة الحديد إن لم تصلح معولًا صُنع منها منجل.
  source: iryani
  page: 418
  status: draft

- id: u0469
  kind: usage
  prompt: حط لرجليك مراقي
  answer: يقال إنذارا وتهديدا لمن بدأ بالإساءة
  others: [يقال لمن يريد أن يرتقي في عمله بسرعة, يقال نصيحة لمن يصعد جبلا وعرا, يقال لمن يبني بيتا من طابقين]
  note: حط أي اجعل وهيّئ، والمراقي الدرجات؛ أي استعد لما سيأتيك جزاء إساءتك.
  source: juhayman
  page: 107
  volume: ج١٠
  status: draft

- id: u0470
  kind: usage
  prompt: وش عمر السنبله؟
  answer: للصبر على أذى ينقضي سريعا
  others: [للتعجب من سرعة نمو الزرع, لمن يستعجل الحصاد قبل أوانه, لمن يقصر عمره في طلب الرزق]
  note: 'يروى أن رجلين اشتركا في زرع القمح فآذى أحدهما الآخر، فلما ليم على صبره قال: كم عمر السنبلة؟ فبعد الحصاد تنتهي الشركة.'
  source: abboudi_amthal
  page: 1558
  volume: ج٤
  status: draft

- id: u0471
  kind: usage
  prompt: بعد الكبرة جبة حمرا!
  answer: للمسن الذي يتشبه بالشباب في لباسه وأفعاله
  others: [لمن يلبس ثيابا لا تناسب الطقس, لمن يتأخر في زواجه حتى يجمع مالا يكفي لبيت, لمن يشتري ثوبا غاليا وهو فقير]
  note: بعد أن كبر في السن يلبس جبة حمراء كالشبان.
  source: sahli
  page: 93
  status: draft

- id: u0472
  kind: usage
  prompt: هيطيّر برج من نافوخى
  answer: يقال عمن يستفز غيره بأعماله الغريبة
  others: [يقال عمن يربي الحمام فوق سطح بيته, يقال عمن يكثر من التفكير في المستقبل, يقال عمن يرفع صوته بالغناء ليلًا]
  note: النافوخ هو أعلى الرأس؛ والمعنى أن تصرفاته غير المعقولة ستُفقد صاحبه عقله.
  source: shaalan
  page: 236
  volume: ج٤
  status: draft

- id: u0473
  kind: meaning
  prompt: غلب حماره
  answer: عجز وتوقف
  others: [خسر في السباق, تعب من طول الطريق, غلب خصمه بالحيلة]
  note: ويرادفه «وقف حمار الشيخ في العقبة».
  source: taymur_kinayat
  page: 59
  status: draft

- id: u0474
  kind: meaning
  prompt: اقرص وذنه
  answer: نبّهه وعامله بحزم
  others: [اعتذر إليه بلطف, اسمع منه قبل أن تحكم, ابتعد عنه ولا تكلّمه]
  note: «وذنه» أذنه، وقرصها تنبيه وتأديب.
  source: zanin
  page: 28
  status: draft

- id: u0475
  kind: meaning
  prompt: أروح فين وآجي منين
  answer: حائر سُدّت أمامه السبل
  others: [مسافر لا يعرف الطريق, كثير التنقل بين البلاد, ضيف لا يجد من يستقبله]
  note: يقولها من تحيّر ولم يجد مخرجًا من أمره.
  source: amin
  page: 40
  status: draft

- id: u0476
  kind: usage
  prompt: عْرَقْ الاكْتَافْ صْعِيبْ
  answer: في وجوب إعطاء العامل أجره كاملًا
  others: [في ذم الكسل والنوم عن العمل, في التحذير من حمل الأثقال على الظهر, في مدح من يعمل وحده بلا مساعدة]
  note: عرق الأكتاف هو كدّ العامل. يقال تنبيهًا إلى أن تعب العامل غالٍ فلا يُبخس من أجره شيء.
  source: dadoun
  page: 199
  status: draft

- id: u0477
  kind: usage
  prompt: ارتاحوا العرايا من غسيل الصابون
  answer: سخريةً من الفقراء الذين يُحرمون من حاجاتهم الضرورية
  others: [مدحًا للنظيف الذي يعتني بثيابه وبيته, لومًا للكسول الذي يؤجل عمله إلى الغد, تحذيرًا من الإسراف في شراء الثياب الجديدة والصابون الغالي]
  note: من لا يملك ثيابًا لا يتعب في غسلها؛ يقال تهكمًا على من فقره يعفيه من أعباء لا يقدر عليها.
  source: mughniyya
  page: 80
  status: draft

- id: u0478
  kind: usage
  prompt: الحظا جلاب
  answer: في أن التجار يكثرون من السلع التي يقبل الناس على شرائها
  others: [في أن الحظ وحده يجلب الرزق دون عمل, في أن البائع المحظوظ لا يحتاج إلى الكلام الكثير, في أن الغلاء يبعد الناس عن الأسواق]
  note: من أمثال التجار؛ الحظا الإقبال على الشراء، وجلّاب من جلب البضاعة.
  source: akwa
  page: 427
  volume: ج١
  status: draft

- id: u0479
  kind: meaning
  prompt: بقلع الدرس
  answer: بصعوبة بالغة
  others: [بسرعة خاطفة, بلا ثمن ولا مقابل, بالحيلة والخداع]
  note: الدرس هو الضرس؛ أي نال الشيء بمشقة كمشقة قلع الأضراس.
  source: taymur_kinayat
  page: 22
  status: draft

- id: u0480
  kind: usage
  prompt: اللزقه مختبيه في قرص الجاوع
  answer: في ملازمة الشقاء للبائس
  others: [في أن الجائع لا يفرّق بين الطيب والخبيث, في أن الخطر يأتي من حيث لا نتوقع, في أن الطعام القليل يكفي إذا قُسّم]
  note: الجاوع هو الجائع، فحتى رغيفه الوحيد تختبئ فيه الوزغة.
  source: iryani
  page: 802
  status: draft

- id: u0481
  kind: meaning
  prompt: ما يستاهلش ملء ودنه نخالة
  answer: تافه لا يساوي شيئًا
  others: [فقير لا يجد طعامًا, مغرور لا يسمع النصح, بخيل لا يعطي شيئًا]
  note: أي لا يستحق حتى ما يملأ أذنه من النخالة.
  source: amin
  page: 335
  status: draft

- id: u0482
  kind: usage
  prompt: إرمى وراء ضهرك
  answer: نصيحة لمن سمع كلامًا مؤذيًا بألا يهتم به
  others: [نصيحة بالتخلص من الأشياء القديمة, نصيحة بالتصدق سرًّا دون أن يعلم بك أحد من الناس, نصيحة بالحذر ممن يمشي خلفك]
  note: يقال لمن سمع تأنيبًا أو كلمة جارحة حتى لا يكترث بها ولا ينشغل بالاستفزاز.
  source: shaalan
  page: 198
  volume: ج٥
  status: draft

- id: u0483
  kind: meaning
  prompt: بطنه ما تدس إلا العيش
  answer: لا يكتم السرّ
  others: [يأكل كثيرًا ولا يشبع, فقير لا يأكل إلا الخبز, بخيل لا يطعم أحدًا]
  note: «تدس» تخبّئ؛ بطنه لا يخفي شيئًا سوى الطعام.
  source: zanin
  page: 81
  status: draft

- id: u0484
  kind: usage
  prompt: البوقة تشتي بياض وجه
  hint: البوقة هي البطر والتعالي، وتشتي أي تريد
  answer: لمن يتعالى وليس عنده ما يسنده
  others: [لمن يستحي من طلب حقه أمام الناس, لمن يكثر الشكوى وحاله ميسور, لمن يخفي غناه خوفا من الحسد]
  note: التعالي يحتاج إلى مال وجاه، فهو لا يليق بمن لا يملك أسبابه.
  source: adimi
  page: 31
  status: draft

- id: u0485
  kind: usage
  prompt: أكل الغني غبي
  answer: في أن الغني يبدو قليل الأكل لكثرة الخير عنده
  others: [في أن الغني لا يعرف قيمة الطعام, في أن الغني يأكل وحده بعيدا عن الناس خوفا من حسدهم, في أن الغني يبخل على ضيوفه]
  note: «غبي» هنا بمعنى خفيّ، وهي كلمة فصيحة؛ فالشبعان لا يتهافت على الطعام.
  source: abboudi_amthal
  page: 130
  volume: ج١
  status: draft

- id: u0486
  kind: usage
  prompt: لسانه مثل القرقعانه
  answer: لكثير الكلام الذي لا يكاد يسكت ولا فائدة في كلامه
  others: [لمن يقول الشيء ونقيضه في مجلس واحد, لمن يتكلم بلهجة غريبة لا يفهمها أحد ممن يجلسون معه, لمن يجامل الناس بكلام حلو لا يقصده]
  note: القرقعانه لعبة للأطفال، علبة صفيح فيها حصى صغيرة تصدر جلبة إذا حُركت.
  source: juhayman
  page: 273
  volume: ج٦
  status: draft

- id: u0487
  kind: meaning
  prompt: جري ريقه عليه
  answer: اشتهت نفسه الشيء
  others: [خاف منه خوفًا شديدًا, تكلم عنه كثيرًا, سخر منه أمام الناس]
  note: أصله في الطعام يراه الجائع فيسيل لعابه.
  source: taymur_kinayat
  page: 27
  status: draft

- id: u0488
  kind: usage
  prompt: السجره اللي تضلل عليك ما تدعيش عليها بالقطع
  answer: في ألا تسعى في زوال ما تنتفع به
  others: [في أن الكبير يحمي الصغير ويظله, في الحث على غرس الشجر في كل مكان, في أن الظل لا يدوم لأحد طويلا]
  note: الشجرة التي تظلك لا تدعُ عليها بأن تُقطع.
  source: taymur
  page: 207
  status: draft

- id: u0489
  kind: meaning
  prompt: طارت السكرة وأجت الفكرة
  answer: ذهبت الفرحة وجاء وقت الحساب
  others: [نسي كل ما حفظه, نام بعد سهر طويل, خطر له رأي جديد بعد تفكير طويل]
  source: asadi
  line: 105738
  halab: w1090
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0490
  kind: usage
  prompt: شكيت لابن عمي، حمل ربابتين وراح يغني
  answer: لمن لا يبالي بآلام غيره
  others: [لمن يحب الغناء في الأفراح, لمن يواسي الناس بالموسيقى, لمن يساعد قريبه في كل شدة]
  note: شكا إليه همه، فحمل آلة الطرب وذهب يغني كأنه لم يسمع.
  source: sahli
  page: 186
  status: draft

- id: u0491
  kind: usage
  prompt: تقضي في قضيتها وتمن على جارتها
  answer: لمن يسعى لمصلحته ثم يطلب من الناس أن يشكروه
  others: [لمن يقضي حوائج جيرانه دون أن ينتظر الشكر, لمن يتدخل في شؤون جيرانه بلا سبب ثم يغضب إن تدخلوا في شؤونه, لمن يستدين من جيرانه ولا يرد الدين]
  note: تقضي حاجتها هي ثم تمنّ بها على جارتها؛ فيمن ينفق على نفسه ويريد من الآخرين أن يعترفوا له بالفضل.
  source: mughniyya
  page: 206
  status: draft

- id: u0492
  kind: meaning
  prompt: من شاف بلوة غيره هانت عليه بلوته
  answer: من رأى مصائب غيره هانت عليه مصيبته
  others: [من ضحك على غيره ابتُلي بمثله, من ساعد غيره ساعده الناس, من صبر على بلواه نال الأجر والثواب من ربه]
  note: يقال في التعزية والتصبير.
  source: amin
  page: 361
  status: draft

- id: u0493
  kind: usage
  prompt: الْجِيَّدْ تَيْشْكَرْ مْبَاتُه
  answer: لمن يستضيفه الناس فيذمّهم بعد أن يغادرهم
  others: [لمن يحسن الثناء على من أحسن إليه, لمن يرفض أن يبيت في غير بيته مهما ألحّ عليه مضيفه, لمن يكثر التنقل بين بيوت أقاربه]
  note: الكريم يشكر المكان الذي بات فيه. يقال تعريضًا بمن يعيب مضيفيه بعد ضيافتهم كأنهم أساؤوا إليه.
  source: dadoun
  page: 63
  status: draft

- id: u0494
  kind: meaning
  prompt: حله وهو مغرفتها
  answer: يعرف البلد وأهلها وأخبارهم معرفة تامة
  others: [يتولى الطبخ في البيت, ينفق على أهل بلده من ماله ويطعم فقراءهم, يتدخل في كل شيء دون علم]
  note: هو في البلد كالمغرفة في القدر، تدور في جوانبها وتلتقط ما فيها.
  source: taymur_kinayat
  page: 30
  status: draft

- id: u0495
  kind: meaning
  prompt: بو وذينات
  answer: من يصدّق كل ما يسمعه ولا يحكّم عقله
  others: [من يتنصّت على الناس, من لا يسمع جيدًا فيطلب من محدّثه أن يعيد كلامه, من يحفظ كل ما يُقال]
  note: «وذينات» أذنان صغيرتان؛ يُقال للسخرية.
  source: zanin
  page: 89
  status: draft

- id: u0496
  kind: usage
  prompt: إضرب أبو بشت يخاف العريان
  answer: يقال في أن معاقبة القوي تجعل الضعيف يخضع دون تعب
  others: [يقال في أن الفقير لا يخاف من شيء لأنه لا يملك شيئًا, يقال في أن البرد يؤذي من لا يجد ما يلبسه, يقال في أن الظالم يضرب الضعيف ويترك القوي]
  note: البشت عباءة من صوف يلبسها الفلاحون في الشتاء؛ فإذا عوقب صاحب البشت خاف من لا يملك شيئًا.
  source: shaalan
  page: 104
  volume: ج١
  status: draft

- id: u0497
  kind: usage
  prompt: لا ترقد في مجاري المياه، وإن كانت الدنيا جداب
  answer: في التحذير من النوم في مجاري السيول ولو كان الجو جافاً
  others: [في التحذير من الإسراف في الماء وقت الجفاف, في التحذير من السفر في موسم الأمطار, في التحذير من الزراعة قرب مجاري المياه]
  note: من أمثال تهامة؛ فالسيول تهاجم الناس فجأة على غفلة منهم.
  source: akwa
  page: 911
  volume: ج٢
  status: draft

- id: u0498
  kind: usage
  prompt: الظاهر أكلتوا وطاف
  answer: للغبي الذي يقلّد الأذكياء فيقع فيما يُظهر غباءه
  others: [لمن يأكل طعامًا لا يعرف أصله ثم يمرض فيلوم الطبّاخ عليه, لمن يكذب فيصدّقه الناس, لمن يمرض من كثرة الأكل]
  note: قلّد رجلٌ طبيبًا شعبيًّا ذكيًّا يستدلّ بما يرى حول البيت، فرأى سرجًا فقال للمريض، يظهر أنكم أكلتم وطافًا.
  source: iryani
  page: 914
  status: draft

- id: u0499
  kind: usage
  prompt: يخلّي العدّ ويروح للرسوس
  answer: لمن يترك الكثير المضمون إلى القليل المشكوك فيه
  others: [لمن يترك بلده ويهاجر طلبا للرزق, لمن يحفر بئرا جديدة وعنده بئر قديمة, لمن يكتفي بالقليل الذي في يده ويزهد في الكثير البعيد عنه]
  note: «العدّ» البئر الكثيرة الماء في الصحراء، و«الرسوس» جمع رسّ وهو الماء القليل.
  source: abboudi_amthal
  page: 1700
  volume: ج٥
  status: draft

- id: u0500
  kind: meaning
  prompt: الكعك دا دايب
  answer: الكعك ناعم هشّ كثير السمن
  others: [الكعك ساخن خرج من الفرن, الكعك قديم فسد, الكعك قليل لا يكفي]
  note: يقولونها في الفطير والكعك ونحوهما إذا كان يذوب في الفم.
  source: amin
  page: 319
  status: draft

- id: u0501
  kind: usage
  prompt: كلب ينبح وجمل يستجر
  hint: يستجر أي يجترّ
  answer: حين يتطاول الضعيف على القوي فلا يبالي به
  others: [حين يتخاصم اثنان على شيء لا يملكانه أصلا, حين يتكلم الجاهل ويسكت العالم, حين يحرس الضعيف القوي ويحميه]
  note: الكلب ينبح والجمل ماضٍ في اجتراره لا يبالي؛ يشبه قولهم «القافلة تسير».
  source: adimi
  page: 320
  status: draft

- id: u0502
  kind: meaning
  prompt: خلاه يرن
  answer: تركه وحيدًا وشأنه
  others: [ضربه ضربًا موجعًا, أكثر من مناداته, أفرحه بخبر سار]
  note: كأنه تركه في دار خالية يكلم نفسه فلا يجيبه إلا الصدى.
  source: taymur_kinayat
  page: 34
  status: draft

- id: u0503
  kind: meaning
  prompt: أطول من ليلة بلا عشا
  answer: أمر طويل مملّ
  others: [أمر شاقّ لكنه نافع, أمر مخيف يُقلق صاحبه, أمر قصير يمرّ سريعًا]
  note: ليلة الجائع لا تكاد تنقضي.
  source: zanin
  page: 25
  status: draft

- id: u0504
  kind: usage
  prompt: ظلم العدا ولا ظلم القرايب
  answer: لأن الظلم من الأقارب والأحباب أشد وقعًا من ظلم الأعداء
  others: [لمن يظلم أعداءه ويعدل مع أقاربه, لمن يشكو أقاربه إلى الغرباء, لمن يصالح عدوه ويقاطع أهله]
  note: ظلم العدو متوقع فيستعد له المرء، أما ظلم القريب فيأتي من حيث لا يتوقع فيكون أشد إيلامًا.
  source: juhayman
  page: 283
  volume: ج٤
  status: draft

- id: u0505
  kind: usage
  prompt: دريز وقلة جري
  answer: لمن يكثر الكلام والحركة دون أن يحقق فائدة
  others: [لمن يتعب كثيرًا ثم يُحرم من أجره, لمن يسكت طويلًا ثم يتكلم بالحكمة, لمن يسرع في عمله فيفسده ثم يضطر إلى إعادته من أوله]
  note: «الدريز» كثرة الكلام، و«الجري» العمل.
  source: mughniyya
  page: 265
  status: draft

- id: u0506
  kind: usage
  prompt: اللى فى قلبه على لسانه
  answer: يقال عن الصريح الذي لا يقدر على الكتمان
  others: [يقال عن المنافق الذي يقول ما لا يفعل, يقال عن المريض الذي يشكو من قلبه, يقال عن الصامت الذي لا يبوح بشيء أبدًا]
  note: يصف الشخص الذي لا يحتفظ بالأسرار، وقد يقال مدحًا لصراحته أو ذمًا لعجزه عن الكتمان.
  source: shaalan
  page: 191
  volume: ج٣
  status: draft

- id: u0507
  kind: meaning
  prompt: روقها بلوزه
  answer: هدّأ الأمور وصفّاها
  others: [زيّن المجلس وجمّله, قدّم للضيوف الحلوى, أخّر الأمر إلى وقت آخر]
  note: كانوا يروّقون الماء العكر بتحريك اليد فيه ومعها شيء من اللوز.
  source: taymur_kinayat
  page: 38
  status: draft

- id: u0508
  kind: meaning
  prompt: زي أم العروسة فاضية ومشغولة
  answer: يشتغل بأتفه الأشياء
  others: [كثير الفرح في المناسبات, يتقن كل ما يعمل, يتعب ولا يشكو]
  note: تراها تروح وتجيء طوال الوقت ولا عمل حقيقي في يدها.
  source: amin
  page: 226
  status: draft

- id: u0509
  kind: usage
  prompt: إلدهن في العتاقي
  answer: للمسن الذي يفوق الشباب قوة ورأيا
  others: [للطعام القديم الذي يفسد, لمن يحتفظ بأغراضه القديمة, للتاجر الذي يبيع الزيت القديم على أنه جديد]
  note: العتاقي هي القديمة، والخير والقوة قد تكون فيها لا في الجديد.
  source: sahli
  page: 151
  status: draft

- id: u0510
  kind: usage
  prompt: دَارْ لَكْرَا وَالشّْقُوفْ دَ الْغَرْسْ
  answer: للفقير الذي يسعى إلى الكماليات قبل الضروريات
  others: [لمن يكتري بيتًا ثم يهمله حتى يطرده صاحبه في آخر السنة, لمن يحب الزهور ويعتني بها, لمن يغرس الأشجار في أرض غيره]
  note: الشقوف أصص الزرع والأزهار. يسكن بالكراء ويشتري أصص الزينة، فيقدّم الكمالي على الأهم.
  source: dadoun
  page: 99
  status: draft

- id: u0511
  kind: usage
  prompt: من شاف الضرب في غيره تجور
  answer: لمن يرى ما أصاب غيره من عقاب فيرتدع
  others: [لمن يستمتع بمشاهدة غيره وهو يعاقَب, لمن يحمي جاره من الأذى قبل أن يصله, لمن يضرب غيره ثم يستجير بالناس]
  note: من أمثال بيحان؛ شاف أي رأى، وتجوّر أي استجار.
  source: akwa
  page: 1231
  volume: ج٢
  status: draft

- id: u0512
  kind: usage
  prompt: تتبت الحبل والجراب مقطوع
  answer: لمن يحتاط من جهة ويهمل جهة تضيع الفائدة
  others: [لمن يقطع صلته بأهله ثم يطلب عونهم عند الحاجة, لمن يحمل فوق طاقته فيسقط منه كل شيء, لمن يصلح ما لا يحتاج إلى إصلاح ويترك عمله]
  note: ما فائدة إحكام ربط الجراب وهو مشقوق يسقط منه ما فيه؟
  source: taymur
  page: 117
  status: draft

- id: u0513
  kind: usage
  prompt: مجفّش على ريش
  answer: لمن يوهم الناس أنه جالس على ثروة، وللمخدوع يظن ذلك
  others: [لمن ينام كثيرًا ولا يعمل, لمن يحمي أولاده من كل خطر, لمن يلبس ثيابًا أكبر من حجمه ليوهم الناس أنه رجل ضخم قوي]
  note: جفّش على الشيء جثم عليه وأخفاه بثوبه، كالدجاجة تمدّ جناحيها على صغارها.
  source: iryani
  page: 147
  status: draft

- id: u0514
  kind: usage
  prompt: سارح ولا تمارح
  answer: في الاعتدال في مخالطة الأقارب لا قطيعة ولا إفراط
  others: [في الحث على الرعي المبكر قبل الحر, في الحذر من مرافقة الغرباء في السفر والمبيت معهم في البرية, في ترك الأهل والسفر لطلب الرزق]
  note: 'من أمثال البادية: اسرح بماشيتك مع أقاربك إلى المرعى، لكن لا تشاركهم مراح الليل؛ أي كن معهم بقدر.'
  source: abboudi_amthal
  page: 627
  volume: ج٢
  status: draft

- id: u0515
  kind: meaning
  prompt: ترش الملح ما ينزلش
  answer: شدة الزحام
  others: [شدة البخل, كثرة الطعام, فساد الطعام من الملح]
  note: لو نثرت الملح على الجمع لما بلغ الأرض من كثرة الرؤوس.
  source: taymur_kinayat
  page: 25
  status: draft

- id: u0516
  kind: usage
  prompt: اللى مدخوله خماسي ومصروفه سداسي لازم فى يوم يساسي
  answer: لمن تكون مصروفاته أكثر من دخله
  others: [لمن يعمل في أكثر من مهنة, لمن يقرض الناس ولا يستردّ ماله, لمن يُحسن الحساب والتدبير]
  note: من دخله خمسة ويصرف ستة لا بدّ أن يفتقر يومًا.
  source: zanin
  page: 51
  status: draft

- id: u0517
  kind: meaning
  prompt: مش عارف إن كانت الدنيا بتهوي ولا بتدوي
  answer: لا يدري ما يجري حوله
  others: [لا يحب الريح والمطر, يعرف كل أخبار الدنيا, يخاف من الأصوات العالية]
  note: يقال للغافل الذي لا يدرك أحوال الدنيا من حوله.
  source: amin
  page: 349
  status: draft

- id: u0518
  kind: usage
  prompt: قطع السجن ولو كان فى جنينة
  answer: يقال في كراهية فقدان الحرية ولو في مكان جميل
  others: [يقال في مدح الحدائق وجمال الطبيعة, يقال في التحذير من صحبة اللصوص, يقال في الشكوى من غلاء البيوت ذات الحدائق الواسعة]
  note: «قطع» دعاء بالزوال؛ فالقيد مكروه ولو كان في أجمل الأماكن، لأن الحرية من أعز ما يملكه الإنسان.
  source: shaalan
  page: 186
  volume: ج٤
  status: draft

- id: u0519
  kind: usage
  prompt: ما يغلبك كان يقولك أعطيني رزقك
  answer: لمن يسعى إلى الاستيلاء على مال غيره بجرأة ووقاحة
  others: [لمن يطلب المساعدة بأدب وحياء, لمن يعمل بجد ليكسب رزقه ولا يمد يده إلى مال أحد من الناس, لمن يقرض ماله لمن لا يرده]
  note: «كان» إلا؛ لم يبق إلا أن يطلب منك رزقك صراحة.
  source: mughniyya
  page: 498
  status: draft

- id: u0520
  kind: usage
  prompt: دخل شعبان برمضان
  answer: لمن يخلط الأمور بعضها ببعض حتى تلتبس
  others: [لمن يؤجل عمله من شهر إلى شهر, لمن يصوم قبل موعد الصيام, لمن يبدأ عملا جديدا قبل إتمام القديم]
  note: كأن الشهرين تداخلا فلم يعد يُعرف أولهما من آخرهما؛ يقال لمن يخلط الحابل بالنابل.
  source: adimi
  page: 214
  status: draft

- id: u0521
  kind: meaning
  prompt: حوصلته ديقه
  answer: قليل الاحتمال سريع الغضب
  others: [قليل الأكل نحيل الجسم, بخيل لا يعطي شيئًا, كتوم لا يبوح بسره]
  note: الحوصلة الضيقة لا تتسع لشيء، فهو لا يحتمل.
  source: taymur_kinayat
  page: 31
  status: draft

- id: u0522
  kind: usage
  prompt: يا فلان أنت تساميني مساماة
  answer: لمن يغدق الوعود والأماني ولا يفعل شيئًا
  others: [لمن يقلّد غيره في كل شيء, لمن يكثر من رواية الحكايات القديمة في مجالس السمر, لمن يتعالى على أهله]
  note: من المساماة وهي رواية الحكايات، فكأنه يروي لك حكايات لا حقيقة لها.
  source: iryani
  page: 448
  status: draft

- id: u0523
  kind: usage
  prompt: دوا الكذب المقابل
  answer: لعلاج الكذبة بمواجهة صاحبها وجهًا لوجه
  others: [لمن يقابل الكذب بكذب مثله حتى لا يغلبه الكاذب, لمن يصدّق كل ما يقال له, لمن يكذب ليصلح بين الناس]
  note: الكاذب لا يقوى إلا في الظلام وخلف الظهور، فإذا ووجه انهار وتضاءل.
  source: juhayman
  page: 106
  volume: ج٣
  status: draft

- id: u0524
  kind: usage
  prompt: لا حسوك بعد عقبه
  answer: في الشيء يأتي بعد فوات أوانه فلا يُنتفع به
  others: [في الشيء يُعطى لمن لا يستحقه فيضيع, في الشيء يُطلب قبل أوانه بزمن طويل فلا يتحقق منه شيء, في الشيء القليل يُعطى بعد تعب كثير]
  note: الحسوك علف الدابة، والعقبة الجبل؛ ولا فائدة من علفها بعد أن تجتاز الجبل.
  source: akwa
  page: 941
  volume: ج٢
  status: draft

- id: u0525
  kind: usage
  prompt: دخل الذرّة
  answer: لمن انهزم في عراك واختفى عن خصومه
  others: [لمن دخل في أمر غامض لا يعرف كيف يخرج منه, لمن اغتنى بعد فقر من الزراعة, لمن صار يتدخل في دقائق الأمور]
  note: نبات الذرة طويل يخفي من يلجأ إليه، فكأن المهزوم اختبأ بين سيقانه.
  source: abboudi_amthal
  page: 505
  volume: ج٢
  status: draft

- id: u0526
  kind: meaning
  prompt: البيت ما فيهش ديار ،ولا نافخ نار
  answer: البيت خالٍ ليس فيه أحد
  others: [البيت مزدحم بالضيوف, البيت بارد بلا تدفئة, البيت فقير لا طعام فيه]
  note: أي لا ساكن فيه ولا من يوقد نارًا، كناية عن الخلوّ التام.
  source: amin
  page: 115
  status: draft

- id: u0527
  kind: usage
  prompt: صَارْ مْزَرَّفْ، مَا دَارْ لاَ بْيَدُّه وَلاَ بْرَجْلُه
  answer: لمن اتُّهم بجرم وهو بريء منه
  others: [لمن يعجز عن العمل بسبب المرض, لمن يقف مكتوف اليدين أمام الظلم, لمن يسقط من مكان عالٍ فينجو]
  note: الزراف الشلال، والمزرّف الهابط معه. أي جرفه السيل وهو لم يفعل شيئًا بيده ولا رجله.
  source: dadoun
  page: 163
  status: draft

- id: u0528
  kind: meaning
  prompt: حرق العسل
  answer: تجاوز الحد حتى انقلب العمل إلى ضد المقصود
  others: [أفسد شيئًا ثمينًا بالإهمال, بالغ في مدح الناس, أتقن عمله على أحسن وجه فنال رضا الناس وثناءهم]
  note: العسل إذا زاد طبخه احترق ومرّ طعمه.
  source: taymur_kinayat
  page: 29
  status: draft

- id: u0529
  kind: meaning
  prompt: برّاح إسكندرية
  answer: الثرثار كثير الكلام
  others: [الرحّالة الكثير الأسفار, التاجر الماهر في البيع, الرجل الغريب عن البلد]
  note: «البرّاح» المنادي في السوق يعلن عن الأشياء الضائعة.
  source: zanin
  page: 80
  status: draft

- id: u0530
  kind: usage
  prompt: إلزرعة البدرية ما بتلتحق
  answer: لفضل البدء المبكر، فالزرع المبكر لا يلحقه المتأخر
  others: [للزرع الذي يحتاج إلى ماء كثير, للأرض التي تزرع كل سنة دون راحة حتى تضعف تربتها وتقل غلتها, للزرع الذي يصيبه البرد]
  note: الزرع البدري يسبق غيره دائما، فلا يُدرك.
  source: sahli
  page: 166
  status: draft

- id: u0531
  kind: usage
  prompt: بعيونهم ويحصلوا
  answer: لمن يرى الخطأ بعينه ثم يقع فيه
  others: [لمن يحسد الناس على ما في أيديهم, لمن يحكم على الأشياء من مظهرها فقط, لمن ينام وعيناه مفتوحتان من الخوف]
  note: يقال للغافل يشتري الشيء الرديء بعد أن عاينه ولم يكتشف عيوبه الظاهرة.
  source: mughniyya
  page: 182
  status: draft

- id: u0532
  kind: meaning
  prompt: كلامو فات من هالأدن طلع من هالأدن
  answer: لم يهتمّ أحد بكلامه
  others: [انتشر كلامه بين الناس, حفظ الناس كلامه, كان كلامه مزعجاً]
  source: asadi
  line: 122205
  halab: w1088
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0533
  kind: usage
  prompt: لولا المجنون ما كانوش العقلا كلوا بلح
  answer: في أن للمجازفة نفعا قد يصيب الناس
  others: [في أن الأحمق يضر نفسه وغيره, في أن البلح لا يُجنى إلا في وقته من السنة, في أن العقل خير من القوة]
  note: المجازف يتسلق النخل العالي فيأكل العقلاء مما يجنيه.
  source: taymur
  page: 324
  status: draft

- id: u0534
  kind: usage
  prompt: إدبحه وما تورّى له دمه
  answer: يقال نصحًا باللين والمداراة لنيل ما تريد
  others: [يقال تحذيرًا من ذبح الحيوان أمام غيره من الحيوانات, يقال لمن يخفي جريمته عن الناس, يقال لمن ينتقم من عدوه سرًّا]
  note: ينصح المثل بالتباسط والمداراة في الكلام لدفع الآخر إلى تقديم ما تريد برضاه لا بالقوة.
  source: shaalan
  page: 198
  volume: ج٥
  status: draft

- id: u0535
  kind: meaning
  prompt: الخدام يمص اللمونه
  answer: خادم كثير السرقة
  others: [خادم كسول, خادم يتذوق الطعام قبل تقديمه, خادم بخيل]
  note: لا يُكلَّف بشراء شيء إلا اقتطع منه، حتى إنه يثقب الليمونة ويمص من مائها.
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0536
  kind: meaning
  prompt: يا مستكتر الدهر أكتر
  answer: لا تغترّ بكثرة ما في يدك
  others: [الدنيا واسعة فلا تحزن, من طلب الكثير نال القليل, الدهر طويل فلا تستعجل]
  note: فالزمان قادر على أن يُضيّع الكثير مهما كثر.
  source: amin
  page: 397
  status: draft

- id: u0537
  kind: usage
  prompt: غابت، لا غابت لنا بحبيب، ولا براعيات حليب
  answer: دعاء يقال عند غروب الشمس بحفظ الأحبة والمال
  others: [شكوى يقولها المسافر إذا طال عليه الطريق وغاب عنه أهله, رثاء يقال في من مات غريبا عن أهله, تحذير للرعاة من البقاء في المرعى ليلا]
  note: 'من أمثال البادية: إذا غابت الشمس دعوا ألا يغيب معها حبيب ولا ناقة ذات حليب.'
  source: abboudi_amthal
  page: 891
  volume: ج٣
  status: draft

- id: u0538
  kind: usage
  prompt: ايولّع النار ويقول الدخان منين
  answer: للمنافق الذي يسبّب المشكلة ويدّعي جهله بها
  others: [لمن يبحث عن سبب المشكلة ليحلّها, لمن يخاف من أمر صغير ويهرب منه كأنه مصيبة كبيرة, لمن يعمل عملًا بلا فائدة]
  note: «منين» من أين؛ أشعل النار بيده ثم يسأل عن مصدر الدخان.
  source: zanin
  page: 73
  status: draft

- id: u0539
  kind: usage
  prompt: البيسه الداحصه ترجع لصاحبها
  answer: في كل ما هو مغشوش يعود ضرره على صاحبه
  others: [في أن المال الضائع يعود إلى صاحبه, في أن القليل من المال يتراكم فيكثر, في أن الدَّين لا بد أن يُردّ]
  note: البيسة جزء صغير من الريال القديم، والداحصة هي القطعة الملساء التي انطمست نقوشها.
  source: iryani
  page: 277
  status: draft

- id: u0540
  kind: usage
  prompt: إذا فاتك الصرابى أرقد بين تبنه
  hint: الصراب حصاد الزرع
  answer: لمن فاته أكثر الخير فيتدارك ما بقي
  others: [لمن تعب في الحصاد فاستحق الراحة, لمن نام عن عمله فخسر محصوله, لمن يرضى بالقليل وهو قادر على الكثير]
  note: إذا فاتك الحصاد فلا تفوّت ما بقي من التبن والسنابل؛ أي تدارك ما أمكنك.
  source: adimi
  page: 84
  status: draft

- id: u0541
  kind: usage
  prompt: عينى بترف
  answer: يقال عند توقّع أمر مجهول سيحدث
  others: [يقال عند رؤية شخص جميل لأول مرة, يقال عند الشعور بالنعاس الشديد, يقال عند البكاء من شدة الفرح]
  note: رفّة العين عند العامة نذير بشيء قادم؛ وفي ذلك أغنية مشهورة لكارم محمود.
  source: shaalan
  page: 211
  volume: ج٤
  status: draft

- id: u0542
  kind: usage
  prompt: خلي خبرك مصان
  answer: في الحث على تجنب إثارة المشكلات حفاظاً على حسن السمعة
  others: [في الحث على كتمان الأخبار عن الأعداء, في الحث على صيانة البيت وحفظ متاعه وإغلاق أبوابه قبل النوم وعند السفر, في الحث على نقل الأخبار بدقة وأمانة]
  note: أي لا تهتك سترك بعنادك وحماقتك فتنكشف أمام الناس.
  source: akwa
  page: 467
  volume: ج١
  status: draft

- id: u0543
  kind: meaning
  prompt: ولد البغله
  answer: قدر على إحداث المستحيل
  others: [أسرف في الكلام, ظلم الضعيف, تعب بلا فائدة]
  note: البغلة لا تلد إلا نادرًا جدًا.
  source: taymur_kinayat
  page: 82
  status: draft

- id: u0544
  kind: usage
  prompt: موت الحمير من بخت الكلاب
  answer: للضرر الذي يصيب أحدا فيكون فيه نفع لمن هو مثله
  others: [لمن يفرح بمصيبة جاره وهو آمن, للقوي الذي يعيش على تعب الضعيف ويأكل من كده كل يوم, لمن يرث مالا لم يتعب فيه]
  note: البخت هو الحظ؛ فإذا نفق حمار كان ذلك رزقا ساقه الحظ إلى الكلاب.
  source: juhayman
  page: 262
  volume: ج٨
  status: draft

- id: u0545
  kind: meaning
  prompt: هاته من شعر راسه
  answer: أحضره بالقوة
  others: [قصّ شعره, أحضره بلطف, اسأله عن حاله]
  note: أي جِئ به رغمًا عنه ولو جررته من شعره.
  source: amin
  page: 386
  status: draft

- id: u0546
  kind: usage
  prompt: اطْلَعْ تَاكُلْ الْكَرْمُوسْ، اشْكُونْ كَالْهَا لَكْ!؟
  answer: لمن يوافقك على أمر ثم يتراجع وينكر موافقته
  others: [لمن يتسلق الشجر ليسرق ثماره في غياب صاحب البستان, لمن يأكل الفاكهة قبل أن تنضج, لمن يدعو غيره إلى طعام ثم يمنعه]
  note: 'الكرموس هو التين. كأنه يقول لك: اصعد وكل التين، فإذا صعدت قال: من قال لك ذلك؟ يقال فيمن ينقض ما اتفق عليه.'
  source: dadoun
  page: 175
  status: draft

- id: u0547
  kind: usage
  prompt: خزينه في جره، وملحه في صرة
  answer: للفقير الذي لا يملك إلا القليل
  others: [للتاجر الذي يبيع الملح والزيت, للمسافر الذي يحمل زاده معه في الطريق الطويل, لمن يخبئ ماله خوفا من اللصوص]
  note: كل ما عنده من مؤونة يتسع له جرة وصرة صغيرة.
  source: sahli
  page: 140
  status: draft

- id: u0548
  kind: usage
  prompt: اللى يبهت لفوق يتعب «يدوخ»
  answer: في الحث على عدم تقليد الأغنياء وكبار القوم
  others: [في الحث على التواضع مع الناس, في ذمّ كثرة السهر والنظر إلى النجوم حتى الفجر, في الحث على الحذر من الأماكن العالية]
  note: «يبهت» ينظر؛ من يظلّ ناظرًا إلى من فوقه يدوخ.
  source: zanin
  page: 53
  status: draft

- id: u0549
  kind: usage
  prompt: لو كانوا ألف ما يهون منهم طرف
  answer: في تعلق الوالدين بأبنائهم جميعًا مهما كثر عددهم
  others: [في أن الجماعة الكبيرة لا تُهزم بسهولة, في أن كثرة الأصحاب لا تغني عن الصديق الواحد, في أن الكريم لا يرد أحدًا ولو كثر السائلون]
  note: «ما يهون» لا يسهل التفريط في أحد منهم.
  source: mughniyya
  page: 474
  status: draft

- id: u0550
  kind: meaning
  prompt: ولع له قنديل
  answer: أشاد بذكره ونشر محامده
  others: [دعا له بالرحمة, سهر معه حتى الصباح يحدثه, كشف سره]
  note: كأنه أضاء له مصباحًا لتظهر محاسنه.
  source: taymur_kinayat
  page: 82
  status: draft

- id: u0551
  kind: usage
  prompt: يرعى الحيا بعيونه
  answer: لمن لا مال له
  others: [لمن يحب الربيع والخضرة, لمن يحرس زرع غيره, لمن يطمع في كل ما يراه]
  note: «الحيا» العشب والكلأ؛ يرى الكلأ بعينه ولا يملك ماشية ترعاه.
  source: abboudi_amthal
  page: 1719
  volume: ج٥
  status: draft

- id: u0552
  kind: usage
  prompt: حنبه في زربه
  answer: لورطةٍ يزداد أذاها كلما حاول صاحبها الخلاص منها
  others: [لمن يحرس ماله حراسة شديدة فلا ينتفع به هو ولا غيره, لمن يختبئ من دائنيه في مكان بعيد, لمن يدخل في عمل لا يعرفه ثم ينجح فيه]
  note: الزربة هي الشجرة أو الأغصان الشائكة التي تُسوّر بها المزارع، فمن علق فيها جرحته كلما تحرك.
  source: iryani
  page: 202
  status: draft

- id: u0553
  kind: usage
  prompt: ده الكل فى الكل
  answer: يقال عمن يستحوذ على كل شيء ويتحكم فيه
  others: [يقال عمن يأكل من كل طبق على المائدة, يقال عمن لا يملك من الأمر شيئًا, يقال عمن يحب الناس جميعًا دون تمييز]
  note: يقال عمن يتفوق على الجميع ويحوز رضا المسؤول، وقد يكون ذلك عن كفاءة أو عن نفاق.
  source: shaalan
  page: 456
  volume: ج٢
  status: draft

- id: u0554
  kind: meaning
  prompt: لسانه يسبح ،وقلبه يدبح
  answer: لسانه حلو وقلبه قاسٍ
  others: [كثير العبادة والذكر, يتكلم كثيرًا ولا يعمل, طيب القلب سيئ الكلام]
  note: يقال للمنافق الذي يُظهر حلو الكلام ويُضمر الأذى.
  source: amin
  page: 326
  status: draft

- id: u0555
  kind: meaning
  prompt: ما سعروش
  answer: احتقره ولم يقم له وزنًا
  others: [لم يدفع له ثمن بضاعته, لم يسأل عنه, لم يغضب منه]
  note: كأنه رآه من السلع التي لا ثمن لها.
  source: taymur_kinayat
  page: 73
  status: draft

- id: u0556
  kind: usage
  prompt: أحلى السمره في الكيس
  answer: في تفضيل العزلة والابتعاد عن الناس
  others: [في تفضيل السهر مع الأصحاب على النوم, في تفضيل ادخار المال على إنفاقه, في تفضيل السفر ليلاً على السفر نهاراً]
  note: الكيس هنا كيس النوم الطويل الذي كان يدخله النائم ويربط فمه من الداخل ليتقي البق والبراغيث.
  source: akwa
  page: 61
  volume: ج١
  status: draft

- id: u0557
  kind: usage
  prompt: عشمتني بالحلق تقبت انا وداني
  answer: لمن يتهيأ للشيء قبل أن يحصل عليه
  others: [لمن يتزين بالحلي ليلفت الأنظار, لمن يرد الهدية إلى صاحبها غاضبا, لمن يشتري ما لا يحتاج إليه أبدا]
  note: 'وعدتني بالقرط فثقبت أذني قبل أن يصلني، ويزيد بعضهم: لا الحلق جاني ولا كلام الناس كفاني.'
  source: taymur
  page: 243
  status: draft

- id: u0558
  kind: usage
  prompt: البير اللي تشرب منه مرة ما ترميش فيه رشادة
  answer: في الحث على احترام من أكرمك
  others: [في الحث على الاقتصاد في الماء, في ذمّ من يرمي القاذورات في الآبار, في الحث على زيارة الأقارب]
  note: «الرشادة» الحجر؛ البئر التي سقتك لا تُسيء إليها.
  source: zanin
  page: 90
  status: draft

- id: u0559
  kind: usage
  prompt: برمة الشركة ما تحمدش
  hint: البرمة قدر الطبخ
  answer: حين يؤول عمل الشركاء إلى الفشل
  others: [حين يقتسم الإخوة ميراثهم بالعدل, حين يتعاون الجيران على إعداد وليمة, حين يبخل صاحب البيت على ضيوفه]
  note: القدر الذي يتولاه عدة أشخاص يُهمل لأن كلا منهم يتكل على غيره.
  source: adimi
  page: 152
  status: draft

- id: u0560
  kind: usage
  prompt: دَارْ مَ الْحَبَّة قُبَّة
  answer: لمن يغضب لأتفه الأسباب ويحدث ضجة على لا شيء
  others: [لمن يبني بيتًا كبيرًا من مال قليل جمعه بصبر وتعب, لمن يدّخر القليل حتى يصير كثيرًا, لمن يزرع حبة فيجني محصولًا وافرًا]
  note: جعل من الحبة قبة. يقال فيمن يضخّم الأمور الصغيرة ويغضب على كل كبيرة وصغيرة.
  source: dadoun
  page: 99
  status: draft

- id: u0561
  kind: meaning
  prompt: مسك العصايه من الوسط
  answer: تحرّز ولم يمل إلى أحد الفريقين
  others: [ضرب الفريقين معًا, تولى زعامة القوم بعد موت كبيرهم, فصل بين المتخاصمين بالقوة]
  note: حتى إذا غلب فريق لم يلحقه ضرر.
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0562
  kind: usage
  prompt: هي تمطر وإلا من القربه
  answer: لمن يسأل سؤالا غبيا يجمع فيه بين أمرين بينهما فرق واسع
  others: [لمن يشك في كل خبر يسمعه, لمن يفرح بالقليل ويظنه كثيرا, لمن لا يفرق بين الصديق والعدو]
  note: أي هل هذا الرذاذ الذي أحسست به من السماء أم من قربة الماء؟ ولا شبه بين الأمرين.
  source: juhayman
  page: 118
  volume: ج٩
  status: draft

- id: u0563
  kind: meaning
  prompt: إنت اللي فيهم
  answer: أنت البارز الذي يُعتمد عليه
  others: [أنت آخرهم وأضعفهم, أنت غريب عنهم, أنت أصغرهم سنًّا]
  note: يقال لمن يتميّز بين أصحابه ويُعوَّل عليه.
  source: amin
  page: 84
  status: draft

- id: u0564
  kind: usage
  prompt: غيظ الباشا ذكوه في الرعيه
  answer: حين يغضب الحاكم على أعوانه فينتقمون من عامة الناس
  others: [حين يرضى الحاكم عن شعبه فيخفف عنه الضرائب, حين يختلف الأقوياء فيصطلحون على حساب الضعفاء, حين يشكو الناس ظلم الحاكم فلا يسمع لهم ولا يرفع عنهم الضرائب]
  note: «الباشا» الحاكم، و«الرعية» عامة الناس؛ يدفع الضعفاء ثمن غضب الكبار.
  source: mughniyya
  page: 391
  status: draft

- id: u0565
  kind: usage
  prompt: السكّينة سارقاه
  answer: يقال عمن لا يدري بالخطر المحيط به
  others: [يقال عمن يسرق ولا يشعر به أحد من الناس, يقال عمن يُجرح بكلام الناس فيسكت, يقال عمن يتعجل في عمله فيفسده]
  note: الدجاجة إذا ذُبحت بسكين حادة قد تمشي قليلًا قبل أن تدرك أنها مذبوحة؛ ومنها جاء التعبير.
  source: shaalan
  page: 271
  volume: ج٣
  status: draft

- id: u0566
  kind: usage
  prompt: كله من تحت راسك
  answer: لتحميل المرء مسؤولية ما جرى
  others: [لمن ينام كثيرا ويهمل عمله, لمن يخفي ماله تحت وسادته خوفا من اللصوص, لمن يفكر كثيرا قبل أن يعمل]
  note: كل ما حدث كان من تدبيرك أنت.
  source: sahli
  page: 275
  status: draft

- id: u0567
  kind: usage
  prompt: إذا أربقت المره غرت على الرجال
  answer: إذا علا صياح المرأة فعلى الرجال أن يبادروا بالنجدة
  others: [إذا كثر كلام المرأة فعلى الرجال أن يسكتوا, إذا غارت المرأة فعلى زوجها أن يرضيها, إذا خرجت المرأة من بيتها فعلى الرجال أن يحرسوا البيت في غيابها]
  note: الرَّبَق الصياح بأصوات عالية، وغرت بمعنى بادرت بالنجدة، والصيغة ماضية والمراد بها الأمر.
  source: iryani
  page: 341
  status: draft

- id: u0568
  kind: usage
  prompt: اللي بالبير أبخص من اللي بالعطن
  answer: في أن صاحب التجربة المباشرة أعرف بالأمر من غيره
  others: [في أن القريب من الماء أحق بالسقي من البعيد عنه دائما, في أن من يعمل في الخفاء لا يُحمد على عمله, في أن الإبل لا تُسقى إلا بعد أهلها]
  note: «أبخص» أي أعرف؛ فمن نزل في قاع البئر أعلم بمقدار مائها ممن يقف على ظهر الأرض عند مبرك الإبل.
  source: abboudi_amthal
  page: 181
  volume: ج١
  status: draft

- id: u0569
  kind: meaning
  prompt: من يوم فحت البحر
  answer: قديم جدًا
  others: [منذ زمن قصير, منذ أول الشتاء, منذ أن بدأ العمل]
  note: أي من يوم حُفر النهر؛ ويقولون للمعمّر «يوعى على فحت البحر».
  source: taymur_kinayat
  page: 61
  status: draft

- id: u0570
  kind: meaning
  prompt: اشهاب الفتن
  answer: من يشعل نار الفتنة بين الناس
  others: [من يصلح بين المتخاصمين, من يحمل الأخبار السارة إلى أهل القرية, من يكثر السهر بالليل]
  note: الشهاب الشعلة، فهو كالشعلة التي توقد الخصام.
  source: zanin
  page: 23
  status: draft

- id: u0571
  kind: meaning
  prompt: حد يبقى في إيده القلم ويكتب نفسه شقي
  answer: من قدر على نفع نفسه فلينفعها
  others: [الكاتب يشقى بكثرة الكتابة, لا تثق بمن يملك القلم, الخط الجميل لا يُطعم خبزًا]
  note: أي لا يُعقل أن يملك المرء أمره ثم يختار لنفسه الشقاء.
  source: amin
  page: 162
  status: draft

- id: u0572
  kind: usage
  prompt: من طبيعته في البدن لا يمحيه الا اللحد والكفن
  answer: في أن الطباع المتأصلة في الإنسان لا تزول
  others: [في أن الأمراض المزمنة في البدن لا شفاء منها إلا بالموت, في أن الذكرى الطيبة تبقى بعد موت صاحبها, في أن الجسد يفنى ويبقى العمل الصالح]
  note: من أمثال عدن؛ ما كان طبعاً في المرء يبقى معه حتى يموت.
  source: akwa
  page: 1241
  volume: ج٢
  status: draft

- id: u0573
  kind: meaning
  prompt: ما دخلش دنيا
  answer: لم يتزوج بعد
  others: [لم يسافر خارج بلده, لم يعمل في حياته, لم يولد بعد]
  note: كأنه لم يدخل الدنيا ولم يعرفها.
  source: taymur_kinayat
  page: 73
  status: draft

- id: u0574
  kind: meaning
  prompt: فلان بياخد من كل دقن شعرة وبيساوي لحالو دقن
  answer: يجمع القليل من كل واحد حتى يكثر
  others: [يسخر من كبار السن, يقلّد الناس في كلامهم, يحلق لحى الناس ويأخذ منهم أجراً كبيراً]
  source: asadi
  line: 96159
  halab: w1097
  status: draft

- id: u0575
  kind: usage
  prompt: إدخل فى الموضوع
  answer: يقال لمن يلف ويدور حول طلبه ولا يصرّح به
  others: [يقال لمن يتدخل فيما لا يعنيه, يقال لمن يتأخر عن المجلس ثم يدخل بلا استئذان, يقال لمن يطيل الوقوف على الباب ولا يدخل]
  note: يدعو التعبير إلى الصراحة والإيجاز وترك الغموض والتسويف، وفي معناه «هات من الآخر».
  source: shaalan
  page: 366
  volume: ج٢
  status: draft

- id: u0576
  kind: usage
  prompt: ايلاَ حْمَرَتْ الشَّمْسْ عَنْدْ الْعْشِي جَهَّزْ بْغَالَكْ لَلْمْشِي، وِيلاَ حْمَرَتْ عَنْدْ الصّْبَاحْ، رَدْ بْغَالَكْ لَلْمْرَاحْ
  answer: في التنبؤ بالطقس قبل السفر على الدواب
  others: [في اختيار أفضل الأوقات لبيع البغال, في الحث على النهوض باكرًا إلى العمل, في التحذير من السفر في حر الصيف]
  note: 'من فراسة الفلاحين: احمرار الشمس عند الغروب يبشر بصحو فسافر، واحمرارها عند الشروق ينذر بغيم ومطر فأعد بغالك إلى المراح.'
  source: dadoun
  page: 383
  status: draft

- id: u0577
  kind: usage
  prompt: لو كان يغلي الزيت على ظوافره
  answer: في الإصرار على الرفض مهما ألح الطالب وتوسّل
  others: [في وصف شدة الحر في أيام الصيف حتى يكاد الزيت يغلي في الشمس, في وصف العامل الذي يتحمل المشاق, في وصف الغضبان الذي لا يهدأ]
  note: لن أنزل عند رغبته ولو غلى الزيت على أظافره.
  source: mughniyya
  page: 474
  status: draft

- id: u0578
  kind: usage
  prompt: أدى الله الثور إلى يد الجزار
  answer: لمن وقع في يد ظالم لن يفلته
  others: [لمن نال جزاء عمله أخيرا, لمن نال جزاء عمله أخيرا بعد طول انتظار, لمن أعان عدوه على نفسه]
  note: الثور لا ينجو من يد الجزار؛ وكذلك من وقع في قبضة من لا يرحم.
  source: adimi
  page: 110
  status: draft

- id: u0579
  kind: usage
  prompt: اللى زرع دلاع فى الشتاء بيات بلاش
  answer: لمن يقوم بأعمال في غير وقتها
  others: [لمن يزرع ولا ينتظر الحصاد, لمن يعمل بلا أجر لغيره, لمن يكثر النوم ويهمل عمله]
  note: «الدلاع» البطيخ الأحمر، وزرعه في الشتاء تعب لا ثمر له.
  source: zanin
  page: 39
  status: draft

- id: u0580
  kind: usage
  prompt: رجل نيمه
  answer: للمبطئ في إجراءاته
  others: [لمن ينام كثيرا ويترك عمله, لمن يمشي في نومه, للكسول الذي لا يغادر بيته]
  note: «نيمه» أي نائمة؛ والرِّجل النائمة هي التي أصابها الخدر فثقلت.
  source: abboudi_amthal
  page: 580
  volume: ج٢
  status: draft

- id: u0581
  kind: meaning
  prompt: بيني وبينه ما صنع الحداد
  answer: بيننا عداوة شديدة
  others: [بيننا شراكة في العمل, بيننا قرابة بعيدة, بيننا جوار قديم]
  note: لأن ما يصنعه الحداد هو السيف، فالعداوة بلغت حدّ السلاح.
  source: amin
  page: 117
  status: draft

- id: u0582
  kind: usage
  prompt: لولا دقاق المال ما جا جلاله
  answer: في أن المال الكثير يتجمع من القليل
  others: [في أن صغار الناس هم سند كبارهم, في أن الصغير لا يقدّر قيمة المال, في أن كبار الأمور تبدأ بخلاف صغير]
  note: دقاق المال صغاره، وجلاله كباره؛ فمن حفظ القليل اجتمع له الكثير.
  source: juhayman
  page: 319
  volume: ج٦
  status: draft

- id: u0583
  kind: usage
  prompt: لجع لا فمّها ولجع لا كمّها
  answer: لمن تدّخر من القوت الضروري حرصًا على مصلحة أسرتها
  others: [لمن تأكل أكثر من نصيبها, لمن تطعم أولادها كل ما في البيت وتنام هي جائعة طوال الليل, لمن تخبئ الطعام عن الضيوف]
  note: اللِّجع اللقمة، ولا بمعنى إلى؛ أي لقمة إلى فمها ولقمة إلى كمّها توفيرًا لوقت الحاجة.
  source: iryani
  page: 797
  status: draft

- id: u0584
  kind: usage
  prompt: خبيزه ولها ميزه ولها عروق مدليه
  answer: لمن يتميز على الناس بشيء تافه
  others: [للنبات الذي ينفع الناس ويداويهم, لمن يتواضع مع علو قدره بين الناس, للفقير الذي يستر حاجته عن الناس]
  note: الخبيزة من الخضر، لها ساق دقيقة متدلية تتميز بها ولا قيمة لها.
  source: taymur
  page: 152
  status: draft

- id: u0585
  kind: meaning
  prompt: قطع في فروته
  answer: اغتابه
  others: [أهانه أمام الناس, سرق ثيابه, ضربه ضربًا موجعًا]
  note: الفروة جلد شاة يجلس عليه؛ ومثله «أكل لحمه».
  source: taymur_kinayat
  page: 65
  status: draft

- id: u0586
  kind: usage
  prompt: راح حصان ورجع حمار
  answer: لمن يذهب بعزم كبير ثم يعود خائبا
  others: [لمن يتعلم في الغربة ويعود حكيما, لمن يسافر طويلا ثم يعود, لمن يغير عمله كل يوم فلا يتقن أي صنعة]
  note: ذهب كالحصان قوة واندفاعا، وعاد كالحمار تعبا وخيبة.
  source: sahli
  page: 155
  status: draft

- id: u0587
  kind: usage
  prompt: من ادعا الربان أخرج النار من قرنه
  answer: في أن من تصدّر للزعامة عليه أن يتحمل عواقبها
  others: [في أن من ركب البحر عليه أن يستعد للغرق, في أن من ادعى ما ليس فيه فضحه الاختبار, في أن من أشعل الفتنة بين الناس احترق بنارها قبل غيره]
  note: الربّان قائد السفينة؛ فمن تولى القيادة لزمه أن يقودها مهما كلفه ذلك.
  source: akwa
  page: 1161
  volume: ج٢
  status: draft

- id: u0588
  kind: usage
  prompt: راجل براوى
  answer: يقال عن الانعزالي الذي لا يألف الناس
  others: [يقال عن الكريم الذي يحب الضيوف والسهر, يقال عن الرجل الذي يكثر السفر والترحال, يقال عن القوي الذي يحمي جيرانه]
  note: براوي من البر أي الخلاء، كأنه من حيوانات الغابة التي لا تألف البشر.
  source: shaalan
  page: 246
  volume: ج٣
  status: draft

- id: u0589
  kind: usage
  prompt: زي الفار والقطوس
  answer: للمتعاديين لا يلتقيان إلا ويقع بينهما نزاع
  others: [للصديقين لا يفترقان في ليل ولا نهار, للخائف الذي يهرب من ظله ويختبئ عند سماع أي صوت, للقوي الذي يتسلط على الضعيف]
  note: «القطّوس» القط.
  source: mughniyya
  page: 301
  status: draft

- id: u0590
  kind: meaning
  prompt: بعد خراب مالطه
  answer: تدارك الأمر بعد فوات وقته
  others: [السفر إلى بلد بعيد طلبًا للرزق, النجاة من مصيبة كبيرة, البدء في عمل من جديد]
  note: يقال حين يأتي الإصلاح متأخرًا لا ينفع، ويروى «بعد خراب البصرة».
  source: taymur_kinayat
  page: 22
  status: draft

- id: u0591
  kind: usage
  prompt: يهوش على الطاقيه
  answer: لمن طبعه الخصام لأتفه الأسباب
  others: [لمن يحرص على مظهره وثيابه, لمن يغار على ما يملك, لمن يلعب مع الصبيان]
  note: «يهوش» يخاصم ويقاتل، و«الطاقية» غطاء الرأس؛ وأصله في الديك يستثيره الصبي بطاقيته فيخاصمها.
  source: abboudi_amthal
  page: 1807
  volume: ج٥
  status: draft

- id: u0592
  kind: meaning
  prompt: طلعت المسألة فيسكو
  answer: تبيّن أن الأمر لا قيمة له
  others: [تبيّن أن الأمر خطير لا يُستهان به, انتهى الأمر بنجاح, صار الأمر مشهورًا]
  note: يقال حين ينتهي أمر كان يُنتظر منه شيء إلى لا شيء.
  source: amin
  page: 270
  status: draft

- id: u0593
  kind: usage
  prompt: اربطها بيدك وحلها بسنونك
  answer: لمن يجرّ على نفسه المشاكل دون داعٍ
  others: [لمن يتقن عمله ولا يعتمد على أحد, لمن يعطي العهد ثم يتراجع عنه, لمن يطلب العون من غيره في أمر سهل يقدر عليه وحده]
  note: يشدّ العقدة بيده ثم يضطر إلى فكّها بأسنانه.
  source: zanin
  page: 18
  status: draft

- id: u0594
  kind: meaning
  prompt: حمارته ماشيه
  answer: كلامه مقبول مصدَّق عند الناس
  others: [تجارته رابحة, يتنقل كثيرًا بين البلاد, يسير ببطء ولا يستعجل]
  note: كدابة لا يعوق سيرها عائق، وكذلك كلامه يمضي عند الناس.
  source: taymur_kinayat
  page: 31
  status: draft

- id: u0595
  kind: usage
  prompt: لا تشرّح الدم الثربة
  answer: في التحذير من إيداع الشيء عند من لا يؤتمن عليه
  others: [في التحذير من إطعام الحيوان أكثر من حاجته, في الحث على حفظ الطعام من الفساد بتمليحه وتجفيفه في الشمس, في النهي عن الإسراف في أكل الشحم]
  note: التشريح في لهجتهم الإيداع والحفظ، والثربة الشحم؛ فلا تأتمن القط على الشحم.
  source: iryani
  page: 308
  status: draft

- id: u0596
  kind: usage
  prompt: أفسل غدا تجزع يوم
  hint: أفسل أي أقل، وتجزع أي تقطع
  answer: القليل الحاضر يكفي لقضاء الحاجة
  others: [من أكثر الطعام ثقل عن العمل, من بكّر بالغداء طال يومه, الطعام القليل لا يشبع العامل ولا يقويه]
  note: أقل غداء يعينك على اجتياز يومك، فلا تحتقر الشيء القليل.
  source: adimi
  page: 75
  status: draft

- id: u0597
  kind: usage
  prompt: هَذَا وْلِيَّدْ دَارْهُمْ
  answer: للساذج الذي لم يجرب الحياة فتنطلي عليه الحيل
  others: [للابن البار الذي لا يفارق أهله ويقوم على خدمتهم, للصغير المدلل الذي يرفض الخروج من البيت, للضيف الذي يتصرف كأنه من أهل الدار]
  note: ولَيّد دارهم أي صبيّ لم يخرج من بيت أهله. يقال فيمن تنقصه الخبرة فيسهل خداعه ولا تجده حذرًا يقظًا.
  source: dadoun
  page: 367
  status: draft

- id: u0598
  kind: meaning
  prompt: رجع قفاه يقمر عيش
  answer: رجع خائبًا خجلًا
  others: [رجع غنيًّا رابحًا, رجع جائعًا يطلب الخبز, رجع مسرعًا إلى بيته]
  note: يقال لمن عاد ولم ينجح في مهمته.
  source: amin
  page: 213
  status: draft

- id: u0599
  kind: usage
  prompt: رأس المال جبان
  answer: يقال في أن أصحاب المال يتجنبون المخاطرة
  others: [يقال في أن الأغنياء يخافون من الحسد, يقال في أن التاجر الصغير أشجع من الكبير, يقال في ذم البخيل الذي يكنز ماله]
  note: مبدأ تجاري معروف عالميًا، وقد ورد على لسان الرئيس حسني مبارك في حديث عن جذب الاستثمار سنة ١٩٩٦.
  source: shaalan
  page: 118
  volume: ج٦
  status: draft

- id: u0600
  kind: usage
  prompt: الرزق وهايب ماهو نهايب
  answer: لمن يريد أن ينال الرزق بقوة ساعده وحدها فلا ينال شيئًا
  others: [لمن يقسم رزقه بين الناس بالعدل, لمن ينهب أموال الناس بالقوة ثم يتصدق منها ليكفّر عن ذنبه, لمن يرضى بالقليل ولا يطلب المزيد]
  note: الرزق هبات من الله لا غنائم تُنهب؛ من أُريد له شيء أتاه بأبسط الأسباب.
  source: juhayman
  page: 192
  volume: ج٣
  status: draft

- id: u0601
  kind: meaning
  prompt: أنت الموس وأنا اللحم
  answer: افعل ما تشاء فأنا موافق، يقال عند الاعتراف بالخطأ
  others: [أنت القوي وأنا الضعيف فارحمني ولا تقسُ عليّ في الحكم والعقاب, أنت البادئ بالشر وأنا البريء, أنت تعمل وأنا آخذ الأجر]
  note: الموس الموسى (السكين)، واللحم مستسلم له.
  source: zanin
  page: 68
  status: draft

- id: u0602
  kind: meaning
  prompt: فص ملح وداب
  answer: اختفى فجأة ولم يظهر له أثر
  others: [ذاب حياءً من الخجل, ضعف ومرض حتى صار جلدًا على عظم, صار سهل المعاملة]
  note: كقطعة الملح تذوب في الماء.
  source: taymur_kinayat
  page: 61
  status: draft

- id: u0603
  kind: usage
  prompt: أحل من دم الغزال
  answer: في الرزق الحلال الذي لا شبهة فيه
  others: [في الصيد الذي لا يحل أكله, في الشيء الجميل الذي يُعجب الناظرين, في الشخص الوديع الذي لا يؤذي أحداً]
  note: دم الغزال المصيد حلال بلا خلاف، فضُرب مثلاً للكسب الطيب.
  source: akwa
  page: 61
  volume: ج١
  status: draft

- id: u0604
  kind: usage
  prompt: طلع مقشر بصل
  answer: لمن خرج من علمه أو عمله بلا فائدة
  others: [لمن يعمل في المطبخ طوال يومه, لمن يبكي من غير سبب فيضحك منه الناس, لمن يكشف عيوب الناس]
  note: كمن قضى وقته يقشر البصل، تعب ولم يخرج بشيء.
  source: sahli
  page: 206
  status: draft

- id: u0605
  kind: usage
  prompt: نفخه وشمخه وبصله في الجيب
  answer: للفقير المتكبر
  others: [لمن يدّخر قوته لوقت الحاجة, للبخيل يخفي ما معه عن الناس, للغني المتواضع البسيط]
  note: تعاظم وكبرياء، وليس في جيبه إلا بصلة.
  source: taymur
  page: 373
  status: draft

- id: u0606
  kind: meaning
  prompt: طاب واستوى
  answer: نضج
  others: [فسد وتلف, برد وجمد, ذاب وسال]
  note: يقال للطعام أو الثمر إذا بلغ تمام نضجه.
  source: amin
  page: 268
  status: draft

- id: u0607
  kind: usage
  prompt: على وجهها تشرب اللبن
  answer: لمن ترتاح النفس لرؤيته لصفاء روحه
  others: [لمن يحب الطعام ولا يشبع منه مهما أكل, لمن يكثر من شرب اللبن في الصباح, لمن يخفي في قلبه غير ما يظهر]
  note: من حسن وجهه وصفاء سريرته تتمنى أن تشرب اللبن وأنت تنظر إليه.
  source: mughniyya
  page: 373
  status: draft

- id: u0608
  kind: usage
  prompt: ايلاَ كُنْتْ مْقَلَّقْ بْحَالْ بَبَاكْ هَزْ خَشْبَكْ عْلِيَّ
  answer: لمن يماطل في إنجاز ما طُلب منه زمنًا طويلًا
  others: [لمن يستعجل الصانع فيفسد عليه عمله, لمن يورث أبناءه صنعته ويتقاعد ليرتاح في آخر عمره, لمن يشتري خشبًا رديئًا ليوفر المال]
  note: 'من أمثال فاس: أب طلب من نجار مهدًا لمولوده فماطله حتى كبر الولد ورُزق بطفل، فجاء يطالبه فقال له: إن كنت قلقًا مثل أبيك فخذ خشبك.'
  source: dadoun
  page: 375
  status: draft

- id: u0609
  kind: usage
  prompt: من شطّ بيده رقّع بجلده
  answer: في الجزاء والعقاب، أن يتحمّل المرء عاقبة فعله
  others: [في الحث على إصلاح الثياب الممزقة وترقيعها بدل رميها, في أن الصانع الماهر يعمل بيده, في أن الفقير يلبس ما يجده]
  note: شطّ الثوب أي مزّقه؛ فمن مزّق شيئًا بيده دفع ثمنه من جلده.
  source: iryani
  page: 491
  status: draft

- id: u0610
  kind: meaning
  prompt: إتلخبط غزله
  answer: اشتد ارتباكه واضطرب أمره
  others: [خسر ماله كله دفعة واحدة, ترك عمله وانصرف إلى اللهو, أفسد ما بينه وبين أصحابه]
  note: الغزل هنا شبكة الصياد؛ إذا تشابكت خيوطها احتار في فكّها.
  source: taymur_kinayat
  page: 17
  status: draft

- id: u0611
  kind: usage
  prompt: نبع نخله
  answer: للضخم الجسم الخشن المظهر
  others: [للكريم الذي يكثر عطاؤه, للطويل النحيل الضعيف, للرجل الصبور على الشدائد]
  note: «نبع النخلة» جذعها الذي لا سعف فيه ولا جريد؛ أي كأنه عجز نخلة.
  source: abboudi_amthal
  page: 1497
  volume: ج٤
  status: draft

- id: u0612
  kind: usage
  prompt: يربط على قلبه حجر
  answer: يقال عمن يتحمل الآلام والمفاجآت بصبر وثبات
  others: [يقال عمن قسا قلبه فلا يرحم أحدًا من الناس, يقال عمن يخاف من أمر فلا يقدم عليه أبدًا, يقال عمن يبخل بماله على أهله وأولاده]
  note: الحجر لا يهتز إذا سقط عليه شيء خفيف؛ وكذلك من ربط على قلبه حجرًا لا تهزه الأحداث ولو كانت شديدة.
  source: shaalan
  page: 126
  volume: ج٢
  status: draft

- id: u0613
  kind: usage
  prompt: بغل نشدوه من بوك؟ قال خالي الحصان
  answer: لمن ينسب نفسه إلى الأعالي ويبتعد عن الأسافل
  others: [لمن يتباهى بماله أمام الفقراء, لمن يجهل أصله ونسبه فيسأل عنه كبار السن في قريته, لمن يحترم أخواله أكثر من أعمامه]
  note: سألوا البغل عن أبيه (الحمار) فذكر خاله الحصان.
  source: zanin
  page: 83
  status: draft

- id: u0614
  kind: usage
  prompt: أدلي بدلوك بين الدلي وما طلع طلع
  answer: دعوة إلى أن تسعى مع الناس وترضى بنصيبك
  others: [دعوة إلى أن تشارك برأيك في كل نقاش يدور, دعوة إلى أن تسبق غيرك إلى الماء, دعوة إلى أن تقتصد في استعمال الماء]
  note: أنزل دلوك في البئر مع دلاء الناس، وما يخرج لك فهو رزقك.
  source: adimi
  page: 76
  status: draft

- id: u0615
  kind: usage
  prompt: الحاصل ولد حلال
  answer: في الحث على القناعة بما هو موجود
  others: [في الحث على الكسب من طريق مشروع, في مدح الولد الذي يبر بأبيه, في ذم من يجمع المال ولا ينفقه]
  note: الحاصل أي ما حصل في اليد؛ والمعنى أن الموجود خير من انتظار ما لم يأت.
  source: akwa
  page: 397
  volume: ج١
  status: draft

- id: u0616
  kind: meaning
  prompt: ودن من طين وودن من عجين
  answer: يتجاهل الكلام كأنه لم يسمعه
  others: [يسمع كل صغيرة وكبيرة, يغضب من أي كلمة, يعمل خبّازًا وفخّارًا]
  note: يقال لمن لا يعبأ بما يقال له، كأن أذنيه من طين وعجين لا تسمعان.
  source: amin
  page: 391
  status: draft

- id: u0617
  kind: meaning
  prompt: فلان يودي فلان البحر ويجيبه عطشان
  answer: متمكن منه حتى صار طوع إرادته
  others: [يخدع الناس كثيرًا, يحرم غيره من حقه, يتعب من يرافقه في السفر بكثرة طلباته]
  note: يذهب به إلى النهر ويعيده ظمآن.
  source: taymur_kinayat
  page: 81
  status: draft

- id: u0618
  kind: meaning
  prompt: عندي صندوق للسرّ ضاعت مفاتيحو
  answer: أنا كتوم لا أفشي سرّاً
  others: [نسيت كل ما قلته لي بالأمس, لا مال عندي أعطيك, أضعت أغلى ما أملك]
  source: asadi
  line: 161406
  halab: w1079
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0619
  kind: usage
  prompt: قال صايد يا با العوايد قال ما من فوايد
  answer: لمن يظن أنه أدرك مطلوبه وما أدرك إلا شيئًا تافهًا
  others: [لمن يعود من الصيد خالي اليدين, لمن يرفض أن يشارك غيره في صيده, لمن يكثر من الوعود ولا يفي بها]
  note: صاد فعلًا، لكنه صيد هزيل لا يُسمن ولا يُغني من جوع ولا يستحق أن يُغبط عليه.
  source: juhayman
  page: 248
  volume: ج٥
  status: draft

- id: u0620
  kind: usage
  prompt: كان جيت على نزله عليك بكبار بيوتها
  answer: في أن المحتاج يقصد السادة الكرام إذا اضطر إلى السؤال
  others: [في أن الضيف ينزل في أكبر البيوت ليأكل أكثر, في أن الغريب يجب أن يعرّف بنفسه أولًا, في أن البيوت الكبيرة يسكنها البخلاء الذين لا يفتحون أبوابهم للسائلين]
  note: «النزلة» الحي أو المضارب؛ الكرام يلبّون طلبك دون أن يردّوك خائبًا أو يذلّوك.
  source: mughniyya
  page: 426
  status: draft

- id: u0621
  kind: usage
  prompt: يهوز ولا يضرب
  answer: لمن يهدد بالعقاب ولا يعاقب
  others: [لمن يرقص بالعصا في الأفراح, لمن يضرب ولا يعتذر, لمن يحرس الغنم بعصاه]
  note: «يهوز» من هزّ العصا في وجه صاحبه دون أن يضربه بها.
  source: abboudi_amthal
  page: 1807
  volume: ج٥
  status: draft

- id: u0622
  kind: usage
  prompt: الفلوس حياة النفوس
  answer: يقال في مدح المال وتمجيده، فهو قوام العيش
  others: [يقال في ذم من يبيع نفسه وكرامته من أجل المال, يقال في أن الصحة أغلى من كل مال, يقال لمن ينفق ماله على علاج نفسه]
  note: مثل مسجوع يمجّد المال ويرى أن الحياة لا تستقيم بدونه.
  source: shaalan
  page: 276
  volume: ج٢
  status: draft

- id: u0623
  kind: usage
  prompt: اللى ما يجى مع العروسة ما يجى مع أمها
  answer: للأمر الذي لا يُنتظر حدوثه بعد فوات أوانه
  others: [لمن يطلب حقه من غير صاحبه فيرجع خائبًا بلا شيء, لمن يفضّل الكبار على الصغار, للهدية التي تأتي متأخرة عن موعدها]
  note: ما لم يأتِ في وقته فلن يأتي بعده.
  source: zanin
  page: 49
  status: draft

- id: u0624
  kind: usage
  prompt: إذا انجنوا أهلك، عقلك ما بينفعك
  answer: للعاقل لا ينفعه عقله إذا طاش قومه
  others: [لمن يهجر أهله ليعيش وحده بعيدا عن مشاكلهم, لمن يتباهى بعقله أمام أهله, لمن يخسر ماله بسبب أقاربه]
  note: إذا حمق القوم جميعا لم يستطع العاقل وحده أن يردهم.
  source: sahli
  page: 23
  status: draft

- id: u0625
  kind: usage
  prompt: إذا تضاربت الرباح فاوبه على ذرتك
  answer: في أن بعض الأعمال قد تكون حيلة للوصول إلى هدف آخر
  others: [في الحث على الإصلاح بين المتخاصمين, في أن الشجار يفسد الزرع, في أن الضعيف ينتفع من خلاف الأقوياء فيأخذ ما يريد وهم مشغولون]
  note: القرود تتظاهر بالتضارب وهي تقترب من المزارع لتسطو عليها، فانتبه لذرتك؛ ويقال أيضًا في الفتن.
  source: iryani
  page: 339
  status: draft

- id: u0626
  kind: usage
  prompt: سَاعَه مَنْ عَنْدْ الْغْنِي كَتْغْنِي
  answer: لمن يقلق من ضيق الرزق ويخشى الغد
  others: [لمن يضيّع وقته في خدمة الأغنياء, لمن يطلب المال ممن لا يملكه ثم يغضب منه, لمن يستعجل الثراء بطرق ملتوية]
  note: ساعة من عطاء الغني سبحانه تغني الإنسان. يُسلَّى به المهموم بالمعيشة ألا ييأس، فالرزق يأتي فجأة.
  source: dadoun
  page: 135
  status: draft

- id: u0627
  kind: meaning
  prompt: احنا كلنا ولاد تسعة
  answer: كلنا سواسية ولا فضل لأحد على أحد
  others: [نحن عائلة كبيرة كثيرة الأولاد, وُلدنا جميعًا في شهر واحد فنحن متقاربون في العمر, نحن أقوى من أن يغلبنا أحد]
  note: أي كلّنا حملتنا أمهاتنا تسعة أشهر، فلا داعي للتفاخر والتمييز.
  source: zanin
  page: 16
  status: draft

- id: u0628
  kind: meaning
  prompt: قال واحد وستين
  answer: أسرع في الهرب
  others: [عدّ ماله بسرعة, تقدم في السن, أكثر من الوعود]
  note: كأنه عدّ خطاه ستين في طفرة ثم تجاوزها.
  source: taymur_kinayat
  page: 63
  status: draft

- id: u0629
  kind: usage
  prompt: يا يحرقه يا يمرقه
  answer: لمن أمره بين الإفراط والتفريط
  others: [لمن يجيد الطبخ ويتقنه كل مرة, لمن يتردد طويلا ولا يفعل شيئا, لمن يعتدل في كل أموره دائما]
  note: إما أن يحرق الطعام بكثرة النار، وإما أن يجعله مرقا بكثرة الماء.
  source: taymur
  page: 394
  status: draft

- id: u0630
  kind: meaning
  prompt: عمل السبعه ودمتها
  answer: لم يترك حيلة إلا فعلها لينجح مقصده
  others: [أتم عمله في سبعة أيام, أسرف في الإنفاق على عرسه حتى استدان من الناس, أخطأ مرارًا متتالية]
  note: الدمة محرّفة على الظاهر عن التمّة.
  source: taymur_kinayat
  page: 58
  status: draft

- id: u0631
  kind: usage
  prompt: خر مني أجي بقعتك
  answer: لمن يسعى إلى إزاحة غيره ليأخذ مكانه
  others: [لمن يطلب من صاحبه أن يفسح له في المجلس تأدباً, لمن يترك مكانه لغيره ليرتاح فيه, لمن يزور جاره في بيته دون موعد]
  note: من أمثال صنعاء؛ خِر أي تنحّ، والبقعة المجلس. أي تنحّ عن مكانك لأجلس فيه.
  source: akwa
  page: 457
  volume: ج١
  status: draft

- id: u0632
  kind: usage
  prompt: قم دق له يبترع
  hint: يبترع أي يرقص رقصة البرع
  answer: استخفافا بمن يعجز عن تغيير ما وقع
  others: [تشجيعا لمن يحسن الرقص في الأعراس والمناسبات, دعوة إلى الاحتفال بنجاح صديق, سخرية ممن يرقص في غير مناسبة]
  note: أي اضرب له الطبل ليرقص؛ يقال استهانة بمن لا حيلة له فيما حدث.
  source: adimi
  page: 309
  status: draft

- id: u0633
  kind: meaning
  prompt: يا رايح قول للجاي ويا شاهد قول للغايب
  answer: ليُخبر بعضكم بعضًا
  others: [لا تحكِ ما رأيت, المسافر لا يعود, احفظ السر عن الغائب]
  note: دعوة إلى نشر الخبر حتى يعرفه الجميع.
  source: amin
  page: 396
  status: draft

- id: u0634
  kind: usage
  prompt: الليل بودنياته والنهار بعويناته
  answer: في الدعوة إلى التحفظ في القول والفعل
  others: [في الدعوة إلى العمل نهارًا والراحة ليلًا, في الدعوة إلى السهر في طلب العلم, في الدعوة إلى كتمان العيوب عن الناس]
  note: «بودنياته» بأذنيه، و«بعويناته» بعينيه؛ الأسماع تتلقف الكلام في الليل والأنظار تلحظ الأفعال في النهار.
  source: mughniyya
  page: 468
  status: draft

- id: u0635
  kind: meaning
  prompt: اللبس دا خايل عليه
  answer: الثوب لائق عليه مناسب له
  others: [الثوب واسع عليه, الثوب مستعار من غيره فلا يناسبه, الثوب قديم بالٍ]
  note: يقال إذا كان اللباس ملائمًا لهيئة لابسه.
  source: amin
  page: 326
  status: draft

- id: u0636
  kind: usage
  prompt: كسر وراه قلّة
  answer: يقال عند رحيل شخص لا يُرجى رجوعه
  others: [يقال عند غضب شخص وتكسيره أواني البيت, يقال عند شرب الماء بعد عطش شديد, يقال عند استقبال ضيف عزيز]
  note: كسر القلة وراء الراحل عادة شعبية للتطير، يُقصد بها ألا يعود لأن وجوده مزعج.
  source: shaalan
  page: 214
  volume: ج٦
  status: draft

- id: u0637
  kind: usage
  prompt: يسني على كل مسنى
  answer: لمن لا يتورع عن الدخول في كل مدخل ويعاشر كل الناس
  others: [للفلاح المجتهد الذي يسقي كل زرع في القرية ولا يأخذ أجرا, للكريم الذي يعطي كل من يسأله, لمن يسافر إلى كل بلد طلبا للعلم]
  note: «السني» إخراج الماء من البئر على الدواب، و«المسنى» مكانه.
  source: abboudi_amthal
  page: 1728
  volume: ج٥
  status: draft

- id: u0638
  kind: usage
  prompt: مع الخيل يا شقران
  answer: للإمعة الذي يقلد الناس ويصنع ما يصنعون بلا تفكير
  others: [للفارس الشجاع الذي يتقدم قومه في المعركة ولا يتأخر, لمن يتأخر عن رفاقه في كل سفر, لمن يغير رأيه بحسب مصلحته]
  note: شقران لقب من ألقاب الحصان، والمعنى اركض مع الخيل حيث اتجهت.
  source: juhayman
  page: 79
  volume: ج٨
  status: draft

- id: u0639
  kind: meaning
  prompt: ما تنبلش في بقه فوله
  answer: لا يكتم سرًا
  others: [لا يشبع مهما أكل, يتكلم بصعوبة, لا يقبل أي طعام]
  note: البق الفم؛ الكلمة لا تبقى في فمه حتى تبتلّ الفولة بريقه.
  source: taymur_kinayat
  page: 72
  status: draft

- id: u0640
  kind: usage
  prompt: الغراب يتبدّى بحصمه
  answer: لمن يبدأ عمله بشيء صغير ويَعِد بما هو أكبر منه
  others: [لمن يأكل كثيرًا ولا يشبع أبدًا, لمن يسرق الشيء الصغير ثم يتوب, لمن يبكّر في الخروج إلى السوق ثم يرجع آخر النهار خالي اليدين]
  note: يتبدّى أي يفطر، والحصمة الحصاة؛ فالغراب يفتتح طعامه بحصاة قبل الطعام الحقيقي.
  source: iryani
  page: 183
  status: draft

- id: u0641
  kind: usage
  prompt: مع دورة الحرامي
  answer: للدلالة على منتصف الليل
  others: [للدلالة على الفجر قبل الشروق, للدلالة على ساعة الغداء, للدلالة على وقت المغرب]
  note: في هذا الوقت يجول اللصوص، فصار عَلَما على منتصف الليل.
  source: sahli
  page: 321
  status: draft

- id: u0642
  kind: meaning
  prompt: ما يقع إلا الشاطر
  answer: الماهر قد يزلّ أيضًا
  others: [الشاطر لا يقع أبدًا, الضعيف يسقط أولًا, الحذر ينجو دائمًا]
  note: يقال عندما يخطئ الماهر، تهوينًا عليه.
  source: amin
  page: 335
  status: draft

- id: u0643
  kind: usage
  prompt: رْحَمْ اللّهْ مَنْ زَارْ، وْخَفَّفْ
  answer: للضيف الذي يطيل إقامته ويثقل على مضيفه
  others: [لمن ينقطع عن زيارة أقاربه سنوات, لمن يزور الناس دون أن يحمل هدية, لمن يستعجل الرحيل قبل أن يُكرَم]
  note: دعاء بالرحمة لمن يزور ولا يطيل. يقال تعريضًا بالضيف الذي يطول مكوثه حتى يرهق أهل البيت.
  source: dadoun
  page: 119
  status: draft

- id: u0644
  kind: meaning
  prompt: زي فار الجامع
  answer: شديد الفقر
  others: [كثير الحركة, جبان يختبئ, يأكل من مال غيره]
  note: فأر المسجد لا يجد ما يأكله.
  source: zanin
  page: 169
  status: draft

- id: u0645
  kind: meaning
  prompt: عمل البحر طحينه
  answer: زيّن الأمر وبالغ فيه وصوّره بغير حقيقته
  others: [أنجز المستحيل بجهده, أفسد شيئًا جميلًا كان يعتني به أهله منذ زمن, خلط الأمور حتى تعقدت]
  note: يقولون «إن عملت له البحر طحينه ما يجيش» أي مهما زخرفت له فلن يصدق.
  source: taymur_kinayat
  page: 58
  status: draft

- id: u0646
  kind: usage
  prompt: يجيب لبن العصفور
  answer: يقال عن الشاطر الذي يأتي بما يبدو مستحيلًا
  others: [يقال عمن يرضى بالقليل من الرزق ولا يطلب المزيد, يقال عمن يعتني بالصغار ويطعمهم بيده, يقال عمن يستيقظ مبكرًا قبل أن تستيقظ الطيور]
  note: لبن العصفور شيء لا وجود له، ومن يقدر على إحضاره فهو بالغ البراعة؛ وفي التعبير مبالغة.
  source: shaalan
  page: 126
  volume: ج٢
  status: draft

- id: u0647
  kind: usage
  prompt: عصفور في اليد ولا صقر حايم
  answer: في التمسك بالقليل المضمون بدل الطمع في الكثير الغائب
  others: [في أن الصغير يغلب الكبير بالحيلة والذكاء, في أن الصيد يحتاج إلى صبر وطول انتظار حتى يقترب الطائر من الصياد, في أن من رضي بالقليل حُرم من الكثير]
  note: «حايم» طائر يحوم في السماء؛ احتفظ بما في يدك وإن كان قليلًا.
  source: mughniyya
  page: 367
  status: draft

- id: u0648
  kind: usage
  prompt: ما ينفع العذر للضيف
  answer: في أن الضيف لا يستفيد شيئاً من أعذار المضيف المقصّر
  others: [في أن الضيف لا ينبغي أن يعتذر عن تأخره عن الدعوة, في أن الضيف الثقيل لا تنفع معه الأعذار ليرحل, في أن الضيف يقبل كل عذر من صاحب البيت]
  note: الضيف يريد الإكرام لا الكلام؛ فإذا قصّر المضيف في واجبه لم تنفع أعذاره.
  source: akwa
  page: 1101
  volume: ج٢
  status: draft

- id: u0649
  kind: usage
  prompt: يا خال ابوي حك ظهري
  answer: للقرابة البعيدة
  others: [للطلب المحرج من الكبير, للكسول الذي يعتمد على غيره, للضيف الذي يطلب ما لا يُطلب]
  note: حكّ الظهر كناية عن العون الذي يلزم الأقارب نحو أقاربهم؛ وخال الأب قرابته بعيدة.
  source: abboudi_amthal
  page: 1634
  volume: ج٥
  status: draft

- id: u0650
  kind: meaning
  prompt: خده في دوكه
  answer: أكثر عليه الكلام حتى أفحمه وأطاعه
  others: [غنى له حتى نام, أخذه في نزهة طويلة ليخفف عنه همومه, أهمله ولم يكلمه]
  note: الدوكة صوت غليظ في الغناء، كأنه غمره بصوته حتى بُهت.
  source: taymur_kinayat
  page: 33
  status: draft

- id: u0651
  kind: usage
  prompt: المليح يبطيء
  answer: حين يجتمع حسن الشيء وتأخر وصوله
  others: [حين يستعجل المرء فيفسد عمله, حين يتأخر الضيف عن موعده بلا عذر, حين يكون الشيء جميلا لكنه قليل النفع]
  note: الجيد يتأخر في الغالب؛ وقد يقال أيضا حين يأتي القدر بعكس ما يريده الإنسان.
  source: adimi
  page: 125
  status: draft

- id: u0652
  kind: meaning
  prompt: الخالق الناطق هو
  answer: يشبهه تمامًا
  others: [يتكلم كثيرًا مثله, يخالفه في كل شيء, يقلّده في كلامه فقط]
  note: يقال عن الشخص الذي يشبه آخر شبهًا تامًّا في الصورة.
  source: amin
  page: 192
  status: draft

- id: u0653
  kind: usage
  prompt: الفص التقيل يخلي له مطرح
  answer: للقوي يفرض مكانه بقوته
  others: [لمن يحفظ الشيء الثمين في مكان آمن, للحجر الكريم يزين الخاتم, لمن يتنازل عن مكانه لغيره]
  note: الفص هنا كتلة الطين اليابس، إذا تدحرجت على الشاطئ أزاحت ما هو أخف منها حتى تستقر.
  source: taymur
  page: 269
  status: draft

- id: u0654
  kind: usage
  prompt: بين ناقة صادرة وناقة واردة
  answer: لمن احتار في أمره بين أمرين
  others: [لمن يتاجر في الإبل, لمن يكثر السفر بين المدن طلبًا للرزق, لمن يعطي ويأخذ]
  note: ناقة خارجة من الماء وأخرى داخلة إليه، فلا يدري أيّهما يتبع.
  source: zanin
  page: 91
  status: draft

- id: u0655
  kind: usage
  prompt: لجع تمتغط ولجع ما تمتغط
  answer: للجشع الذي يريد أن يبتلع ما هو ممكن وما هو غير ممكن
  others: [لمن يأكل بسرعة فلا يتذوق طعامه ولا يعرف ما أكل بعد أن يفرغ, لمن يختار من الطعام أطيبه, لمن يشتكي من قلة الطعام]
  note: تمتغط من مغط بمعنى بلع وساغ؛ أي من اللقم ما يُبلع ومنها ما لا يُبلع.
  source: iryani
  page: 797
  status: draft

- id: u0656
  kind: usage
  prompt: ما حضر يوم العقول تقسم
  answer: لمن لا عقل له
  others: [لمن غاب عن مجلس مهم ففاته نصيبه, لمن يتأخر دائما عن مواعيده, لمن لا يشارك قومه في رأي ولا مشورة]
  note: كأن العقول وُزعت على الناس في يوم معلوم فغاب عنه، فلم يأخذ نصيبه منها.
  source: juhayman
  page: 55
  volume: ج٧
  status: draft

- id: u0657
  kind: usage
  prompt: اللى جاب لك يخلّى لك
  answer: يقال للتهنئة بالمولود دعاءً ببقائه
  others: [يقال لمن وجد شيئًا ضائعًا فأعاده, يقال لمن ورث مالًا كثيرًا عن أبيه, يقال لمن تزوج بعد طول انتظار]
  note: «يخلّي» أي يُبقي ويحفظ؛ وقد يقال أيضًا سخرية ممن نال شيئًا تافهًا فتباهى به.
  source: shaalan
  page: 316
  volume: ج٤
  status: draft

- id: u0658
  kind: meaning
  prompt: غمّض عين وفتّح عين بيكون الشي صار
  answer: يتمّ بسرعة كبيرة
  others: [يتمّ في السرّ, يتمّ بعد صبر طويل, يتمّ دون أن يراه أحد]
  source: asadi
  line: 121678
  halab: w1087
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0659
  kind: meaning
  prompt: صافي يا لبن
  answer: صفاء القلوب ونقاؤها
  others: [سلامة البضاعة من الغش, الطعام الطازج, البراءة من التهمة]
  note: كصفاء اللبن الخالص الذي لا يشوبه شيء.
  source: taymur_kinayat
  page: 47
  status: draft

- id: u0660
  kind: meaning
  prompt: البلاش كثر منه
  answer: ما لا تدفع ثمنه فاستكثر منه
  others: [المجاني لا قيمة له فلا تطلبه, احذر من العطايا, اشترِ قليلًا وادّخر]
  note: تعبير مرح عن الإقبال على كل ما يأتي بلا ثمن.
  source: amin
  page: 104
  status: draft

- id: u0661
  kind: usage
  prompt: صار له زمان هالقمر ما بان
  answer: يقال مجاملة لمن ظهر بعد غياب طويل
  others: [يقال لمن يسهر الليل كله, يقال في الليلة التي يغيب فيها القمر, يقال لمن يغيب عن عمله بلا عذر]
  note: يشبّهون الغائب بالقمر الذي اشتاقوا إلى رؤيته.
  source: sahli
  page: 192
  status: draft

- id: u0662
  kind: usage
  prompt: بَاكُورَهْ خَامْجَه وَمْدَوْدَه
  answer: لشيء تمنيته فلما نلته وجدته بلا قيمة
  others: [لمن يقطف الثمار قبل نضجها ليبيعها قبل غيره, لمن يبيع بضاعة فاسدة للناس, لأول عمل يتقنه الصانع المبتدئ]
  note: الباكورة أول التين، وهنا هي متعفنة يأكلها الدود. فكم من شيء تتمناه ثم تجده لا ينفع بل قد يضرّ.
  source: dadoun
  page: 27
  status: draft

- id: u0663
  kind: usage
  prompt: بو زيد صفاي رفاقته
  answer: لمن يفوق أصحابه دهاءً وحنكة وشجاعة
  others: [لمن يتخلى عن أصحابه عند الشدة, لمن يختار أصحابه من الأغنياء فقط, لمن يكثر الشجار مع رفاقه على أتفه الأسباب]
  note: أبو زيد الهلالي بطل السيرة الهلالية؛ يُروى أن رفاقه سقطوا جميعًا في رحلة وعاد هو وحده سالمًا بحنكته.
  source: mughniyya
  page: 188
  status: draft

- id: u0664
  kind: usage
  prompt: ياكله بقدره
  answer: للفقير الذي لا يكاد يحصل على مال حتى ينفقه
  others: [للبخيل الذي يأكل وحده ولا يدعو أحدا, للطباخ الذي يتذوق طعامه قبل نضجه, للضيف الذي يأكل أكثر من حاجته]
  note: الهاء للطعام؛ أي يأكله من القدر مباشرة، لا يصبر حتى يُسكب في الآنية.
  source: abboudi_amthal
  page: 1655
  volume: ج٥
  status: draft

- id: u0665
  kind: usage
  prompt: إذا تريد الكلام المجمع تعال المقهاية وتسمع
  answer: لمن يريد أخبار الناس، فمصدرها مجالسهم العامة
  others: [لمن يكثر الكلام في المقاهي ولا يعمل شيئاً, لمن يريد الراحة فيجلس في المقهاية بعيداً عن أهله, لمن يجمع الكلام من هنا وهناك لينقله إلى الحاكم]
  note: المقهاية هي الخان الذي ينزل فيه المسافرون، وفيها تجتمع الأخبار من كل جهة.
  source: akwa
  page: 91
  volume: ج١
  status: draft

- id: u0666
  kind: usage
  prompt: اسمع بالصلاة سبق على الجامع
  answer: للشخص المتسرّع
  others: [لمن يدّعي ما ليس فيه, لمن يتأخر دائمًا عن مواعيده, لمن يقلّد غيره في كل شيء]
  note: سمع بخبر الصلاة فسبق إلى المسجد قبل أن يتبيّن الأمر.
  source: zanin
  page: 21
  status: draft

- id: u0667
  kind: usage
  prompt: ديمه قلبوا بابها
  answer: فيمن يزعمون تغيير شيء والتغيير فيه شكليّ فقط
  others: [فيمن يهدم بيته ليبني غيره, فيمن يدخل البيوت من غير أبوابها فيزعج أهلها ويفاجئهم, فيمن يطرد ضيفه بأدب]
  note: الديمة المطبخ، وقلب بابها لا يغيّر ما فيه؛ ويقال كأن يتبدل الحاكم وتبقى السيرة على حالها.
  source: iryani
  page: 321
  status: draft

- id: u0668
  kind: meaning
  prompt: فتح له عبه
  answer: أطمعه ولم يرد له طلبًا
  others: [أفشى له سره, احتضنه بعد غياب, أعطاه ماله كله]
  note: العبّ ما يلي الصدر من القميص؛ كأنه أوسع له صدره حتى زادت مطامعه.
  source: taymur_kinayat
  page: 61
  status: draft

- id: u0669
  kind: usage
  prompt: اللي ما عنده عمل يشتري له جمل
  answer: للفارغ الذي يجلب الهمّ إلى نفسه بلا داعٍ
  others: [للفقير الذي يقترض المال ليتباهى أمام الناس, للتاجر الذي يغامر بكل ماله في صفقة, للكسول الذي ينتظر أن يعمل غيره عنه]
  note: من لا شغل له يبحث عن مشكلة تشغله، كمن يشتري جملا يتعبه في رعايته.
  source: adimi
  page: 57
  status: draft

- id: u0670
  kind: meaning
  prompt: منفوخ ع الفاضي
  answer: متكبر على لا شيء
  others: [مريض منتفخ البطن, غاضب بلا سبب, شبعان من الطعام]
  note: يقال لمن يتعاظم وليس عنده ما يستحق الفخر.
  source: amin
  page: 363
  status: draft

- id: u0671
  kind: usage
  prompt: كدّاب فى أصل وشك
  answer: يقال لمن يظهر الكذب على وجهه
  others: [يقال لمن يجامل الناس في وجوههم ثم يغتابهم, يقال لمن ورث الكذب عن أهله, يقال لمن يغضب فيحمرّ وجهه]
  note: «في أصل وشك» أي إن ملامح الكذب واضحة على وجهك؛ ويقال لمن يدعي شيئًا أو يكذب فيفضحه وجهه.
  source: shaalan
  page: 51
  volume: ج٤
  status: draft

- id: u0672
  kind: meaning
  prompt: طلع في الكرشه عضم
  answer: تعنّت وذمّ الشيء بما ليس فيه
  others: [وجد عيبًا حقيقيًا خفيًا, أكل حتى شبع, اكتشف سرًا كان يخفيه عنه صاحبه]
  note: الكرشة لا عظم فيها أصلًا.
  source: taymur_kinayat
  page: 51
  status: draft

- id: u0673
  kind: usage
  prompt: 'داخل بيت عدوك ليه؟ قال: فيه حبيبي'
  answer: في احتمال أذى العدو من أجل الصديق
  others: [في دخول البيوت دون استئذان أصحابها, في أن العدو قد يصير صديقا مع الأيام, في الحذر من دخول بيوت الأعداء]
  note: ما ألجأه إلى دار عدوه إلا حبيب يسكنها.
  source: taymur
  page: 162
  status: draft

- id: u0674
  kind: usage
  prompt: من مالك والا من اسبالك
  answer: في الإلزام بالمال وعدم قبول العذر فيه
  others: [في الحث على الإنفاق من الكسب الحلال, في التفريق بين مال الرجل ومال أهله, في ذم من يقترض ولا يرد]
  note: «اسبالك» أي سُبُلك؛ أعطني من مالك الخاص أو من مال تتسبب لي في الحصول عليه.
  source: abboudi_amthal
  page: 1454
  volume: ج٤
  status: draft

- id: u0675
  kind: usage
  prompt: جت منك يا جامع مش مني
  answer: لمن يُقدم على عمل مكرهًا ثم يحدث ما يلغيه
  others: [لمن يلوم غيره على خطأ ارتكبه هو, لمن يتأخر عن موعده ثم يعتذر بالزحام, لمن يترك عمله لأول عذر يجده ثم يشكو قلة الرزق]
  note: يُروى أن رجلًا تثاقل عن الذهاب إلى المسجد ثم أكره نفسه، فلما بلغه وجده مقفلًا فقال المثل.
  source: mughniyya
  page: 218
  status: draft

- id: u0676
  kind: usage
  prompt: إلى تردى حظك غلبوك الرعيان
  answer: للزمن السيئ الذي يتغلب فيه الضعيف على القوي
  others: [لمن يوكل أمره إلى الرعاة فيضيّعون ماله ويهلكون غنمه, لمن يترك عمله ويشتغل بما لا يحسنه, لمن يستعين بالضعفاء على أعدائه فيخذلونه]
  note: الرعيان جمع راعٍ، وكانوا يُعدّون من أضعف الناس رأيًا ونفوذًا، فإذا ساء الحظ غلبوا الأقوياء.
  source: juhayman
  page: 244
  volume: ج١
  status: draft

- id: u0677
  kind: usage
  prompt: ألبس الكتان ونسي ماكان
  answer: لمن نسي ماضيه بعد أن تحسّن حاله
  others: [لمن يبالغ في الاهتمام بلباسه, لمن يلبس ما لا يناسب سنّه, لمن يعيش على ذكريات الماضي]
  note: لبس ثياب الكتان الفاخرة فنسي أيام فقره.
  source: zanin
  page: 30
  status: draft

- id: u0678
  kind: meaning
  prompt: من دقنه وافتل له حبل
  answer: أكرمه بشيء هو من ماله
  others: [اربطه حتى لا يهرب, احلق له لحيته, اصنع له هدية ثمينة من مالك]
  note: 'أي تعمل له شيئًا من صميم ما عنده، ويقولون أيضًا: من دقنه وافتل له كعك.'
  source: amin
  page: 361
  status: draft

- id: u0679
  kind: usage
  prompt: لَعْسَلْ دَ الْوَطْوَاطْ تَيْخْمَاضْ
  answer: في الحث على اختيار أجود الأشياء عند الشراء
  others: [في التحذير من أكل الحلوى بكثرة, في ذم من يسهر الليل ويترك النهار, في وصف كلام معسول يخفي وراءه سوءًا ومكرًا بالسامع]
  note: عسل الخفاش يحمض. أي أن الرديء لا يدوم نفعه، فاختر عند الشراء الأحسن والأتقن صنعًا.
  source: dadoun
  page: 271
  status: draft

- id: u0680
  kind: usage
  prompt: ساع ما يسدوا الماجل من خارج
  answer: لمن يعالج الأمور بأسلوب غير جاد
  others: [لمن يحفظ ماله في مكان لا يعرفه أحد, لمن يسقي زرعه في غير وقت السقي, لمن يغلق بابه في وجه ضيوفه]
  note: الماجل البركة الكبيرة يُجمع فيها الماء، ومخرجها يُسدّ من داخلها؛ فمن سدّه من الخارج لم يصنع شيئاً.
  source: akwa
  page: 557
  volume: ج١
  status: draft

- id: u0681
  kind: usage
  prompt: ذاب ذوبة الملح بالمي
  answer: لمن نحل جسمه من شدة المرض
  others: [لمن يكثر من أكل الملح, لمن يسبح في البحر طويلا, لمن يلين قلبه بالكلام الطيب]
  note: ذاب كما يذوب الملح في الماء من شدة الهزال.
  source: sahli
  page: 153
  status: draft

- id: u0682
  kind: meaning
  prompt: لقط الفوله
  answer: فهم المراد
  others: [وجد رزقًا يسيرًا, سرق شيئًا صغيرًا, أخطأ في الفهم]
  note: كما تلتقط الدجاجة حبة الفول.
  source: taymur_kinayat
  page: 70
  status: draft

- id: u0683
  kind: usage
  prompt: ضربنى ومنعنى من البكا
  answer: يقال للظالم الذي يمنع المظلوم حتى من الشكوى
  others: [يقال للأب الذي يؤدب ابنه ثم يصالحه ويرضيه, يقال لمن يبكي على كل شيء بلا سبب واضح, يقال للقوي الذي يدافع عن الضعيف]
  note: يصف المثل جبروت الظالم الذي لا يكتفي بالأذى بل يحرم المظلوم من صرخته وتوجعه.
  source: shaalan
  page: 456
  volume: ج٢
  status: draft

- id: u0684
  kind: usage
  prompt: ابترعوا سابر يا اهل داعر، الشيخ بيرباكم
  answer: فيمن لا يُتقن عمله إلا حين يراه شخص مهم
  others: [فيمن يرقص في كل مناسبة ولو لم يُدعَ, فيمن يطيع شيخه ويعصي أباه, فيمن يُتقن عمله ولا ينتظر الثناء]
  note: البَرَع رقص الرجال، وداعر قرية؛ أي ارقصوا جيدًا فالشيخ ينظر إليكم.
  source: iryani
  page: 419
  status: draft

- id: u0685
  kind: usage
  prompt: جنان يخارجك ولا عقل يحنبك
  hint: يخارجك أي يخلصك، ويحنبك أي يورطك
  answer: لمن ينجو من ورطة بالتظاهر بالغفلة
  others: [لمن يقع في المشاكل بسبب طيشه, لمن يستشير العقلاء قبل كل أمر صغير أو كبير, لمن يدعي الحكمة وهو جاهل]
  note: قليل من التحامق يخرجك من المأزق خير من عقل يوقعك فيه.
  source: adimi
  page: 175
  status: draft

- id: u0686
  kind: meaning
  prompt: اضرب الشعّال تظهر الأرنب
  answer: الوصول إلى المجهول من طريق المعلوم
  others: [التسرّع في الصيد يضيّع الفرصة ويُفزع الطريدة, القوي يغلب الضعيف دائمًا, الصيد يحتاج إلى صبر طويل]
  note: حرّك ما تعرفه يظهر لك ما خفي عنك.
  source: zanin
  page: 24
  status: draft

- id: u0687
  kind: meaning
  prompt: بيسوق الدلال
  answer: يتدلّل
  others: [يقود الدابة, يبيع في المزاد, يسرع في مشيه]
  note: 'يقال لمن يتمنّع ويتدلّل، ومثله: بيتقل عليه.'
  source: amin
  page: 116
  status: draft

- id: u0688
  kind: meaning
  prompt: نزل له من سبع مناخل
  answer: خدعه بلين الكلام
  others: [تواضع له تواضعًا شديدًا, دقق في اختيار هديته, سأله عن كل صغيرة]
  note: يقولون لليّن القول «ناعم»، فكأنه دقيق نُخل في سبعة مناخل.
  source: taymur_kinayat
  page: 77
  status: draft

- id: u0689
  kind: usage
  prompt: عجاج، وما هماج
  answer: للبلد الرديء الذي لا يطيب العيش فيه
  others: [للخبر الكاذب الذي يثير الضجة بين الناس ثم يُنسى, للرجل الكثير الصياح القليل الفعل, للسفر الطويل الشاق]
  note: اجتمع فيه الغبار والماء غير العذب؛ فلا هواء نقي ولا ماء طيب.
  source: abboudi_amthal
  page: 805
  volume: ج٢
  status: draft

- id: u0690
  kind: usage
  prompt: يضيق فيها وهي واسعه
  answer: للمتشائم الذي يضيّق الدنيا على رحابتها
  others: [للبخيل الذي يضيّق على أهله في النفقة, للكسول الذي لا يخرج من بيته, للمتكبر الذي يرى نفسه أكبر من الناس]
  note: الدنيا واسعة، لكنه بتشاؤمه يجعلها ضيقة عليه.
  source: mughniyya
  page: 570
  status: draft

- id: u0691
  kind: usage
  prompt: وقر الحمير ولا تثقله وايت مع أول الحشاشه
  answer: لمن يطلب المستحيل أو شبه المستحيل
  others: [لمن يرفق بدوابه ويحسن إليها, لمن يبكر إلى عمله ويسبق غيره, لمن يحمل غيره ما لا يطيق]
  note: أي حمّل الحمار حملا كاملا لا يرهقه وكن مع ذلك أول القادمين بالحشيش؛ ويقابله المثل العربي في الجمل الذي يمشي رويدا ويجيء أولا.
  source: juhayman
  page: 48
  volume: ج٩
  status: draft

- id: u0692
  kind: meaning
  prompt: وقع لدقنه
  answer: غرق في الأمر أو في الهيام
  others: [سقط على وجهه, أهمل لحيته, نجح نجاحًا كبيرًا]
  note: أي غرق فيه حتى بلغ ذقنه؛ ومثله «وقع لشوشته».
  source: taymur_kinayat
  page: 82
  status: draft

- id: u0693
  kind: usage
  prompt: الشمس تطلع وتغيب والسفر بيفرّق كل حبيب
  answer: عبارة على سيارات النقل تشكو من الفراق
  others: [عبارة تقال للمسافر تفاؤلًا بعودته سريعًا, عبارة يقولها الفلاح عند خروجه إلى الحقل فجرًا, عبارة تقال في رثاء من مات غريبًا]
  note: كُتبت على سيارة نقل في الريف، وتعبر عن ضيق السائق المسافر دائمًا بتفرق الأحباب.
  source: shaalan
  page: 48
  volume: ج٥
  status: draft

- id: u0694
  kind: usage
  prompt: البر عنطط، والحمار استفى
  answer: لمن يخطئ في كلامه فيقلب المعنى لتسرعه
  others: [لمن يحمّل غيره عملاً فوق طاقته ثم يلومه على تقصيره, لمن يبيع القمح ويشتري بثمنه حماراً, لمن يكثر الشكوى من أحوال الزرع]
  note: الصواب أن الحمار عنطط أي قفز وضرب برجليه، والبرّ هو الذي سقط، فقلب المتكلم الكلام من عجلته.
  source: akwa
  page: 271
  volume: ج١
  status: draft

- id: u0695
  kind: usage
  prompt: الدقّه بصنعا والبرع في ذمار
  answer: في استغراب التباعد بين أمرين يفترض أن يكونا متلازمين
  others: [في مدح من يحسن عملين مختلفين معًا, في أن أهل كل مدينة أدرى بعاداتهم, في من يحضر الفرح ويجلس بين الناس ولا يشارك في الرقص والغناء]
  note: يُضرب لعملين متلازمين وقع كلٌّ منهما في مكان بعيد عن الآخر، فكيف يكون الإيقاع في صنعاء والرقص في ذمار؟
  source: iryani
  page: 615
  status: draft

- id: u0696
  kind: usage
  prompt: كَلْبْ السُّوءْ كَيْجِيبْ الدّْعَا لْمُولاَهْ
  answer: لمن له قريب يؤذي الناس فيدعون على من ربّاه
  others: [لمن يربي كلبًا شرسًا في بيته, لمن يدعو على نفسه وأولاده وقت الغضب ثم يندم, لمن يخدم سيدًا ظالمًا بإخلاص]
  note: الكلب العقور يجلب اللعنات على صاحبه. يقال فيمن يسيء ابنه أو قريبه إلى الناس فيدعون على من نشأ بين يديه.
  source: dadoun
  page: 239
  status: draft

- id: u0697
  kind: meaning
  prompt: لاقيني ولا تغديني
  answer: حُسن اللقاء خير من الطعام
  others: [أطعمني أولًا ثم كلّمني بما تريد, لا أحب الزيارات, تعال في وقت الغداء]
  note: أي أن تُحسن استقبالي أحبّ إليّ من أن تُحسن غدائي.
  source: amin
  page: 326
  status: draft

- id: u0698
  kind: usage
  prompt: ايده قريبه لجيبه
  answer: للسخرية من البخيل
  others: [للكريم الذي يعطي بسرعة, للسارق الخفيف اليد, للمحتاج الذي يطلب دائمًا]
  note: 'المقصود عكس الظاهر: يده بعيدة عن جيبه.'
  source: zanin
  page: 72
  status: draft

- id: u0699
  kind: usage
  prompt: يا ما أهون البناية، ويا ما أكثر طقاطيقها
  answer: للبيت يكلف بناؤه أكثر مما يحسب صاحبه
  others: [للبنّاء الذي ينهي عمله سريعا, للبيت المليء بالزينة, لمن يهدم بيته القديم ليبني مكانه بيتا أكبر منه]
  note: البناء يبدو سهلا، لكن تفاصيله ونفقاته الصغيرة لا تنتهي.
  source: sahli
  page: 362
  status: draft

- id: u0700
  kind: usage
  prompt: من جاد قعده ما خاب ضاويه
  answer: في أن من قوي ظهيره أمِن من يلجأ إليه
  others: [في أن الكريم لا يخيب سائله أبدا, في أن الجالس في بيته لا يصيبه سوء, في أن المسافر يحتاج إلى راحلة قوية]
  note: من أمثال البادية؛ «القعود» الظهير الذي يُعتمد عليه، و«الضاوي» الملتجئ.
  source: abboudi_amthal
  page: 1404
  volume: ج٤
  status: draft

- id: u0701
  kind: meaning
  prompt: مسماره في السدغ
  answer: يلازم شخصًا ولا يفارقه
  others: [يكره شخصًا كرهًا شديدًا, يسبب الصداع لمن حوله, يثبت على رأيه]
  note: السدغ الصدغ؛ كأنه مثبت فيه بمسمار.
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0702
  kind: usage
  prompt: العطار الزفت يضيع المستكه ويستحرس على الورق
  answer: لمن يفرط في الجوهر ويحافظ على القشور
  others: [للتاجر الذي يغش الناس في الميزان والكيل, لمن يبخل بالقليل ويجود بالكثير, لمن ينسى ما اؤتمن عليه من أمانات]
  note: العطار هنا الصيدلي الجاهل، يتهاون في العقاقير الثمينة كالمصطكى ويحرص على الورق الذي تُلف به.
  source: taymur
  page: 244
  status: draft

- id: u0703
  kind: usage
  prompt: وقف وقفة رجّالة
  answer: يقال عمن وقف بجانب صاحب مشكلة يدافع عنه
  others: [يقال عمن وقف طويلًا ينتظر دوره, يقال عمن تكبر على الناس في مجلسه, يقال عمن قاطع جيرانه وأقاربه بعد خصام طويل]
  note: «وقفة الرجالة» تعني الشجاعة والشهامة في نصرة الضعيف حتى يصل إلى حقه.
  source: shaalan
  page: 266
  volume: ج٤
  status: draft

- id: u0704
  kind: meaning
  prompt: أنا ما بجي نقطة ببحرك
  answer: أنت تفوقني كثيراً
  others: [لا أحبّ السباحة معك, لا أزورك أبداً, أنا أغنى منك]
  source: asadi
  line: 170203
  halab: w1089
  status: draft

- id: u0705
  kind: usage
  prompt: رافع القصعه وما يعرفش حوش العرس
  answer: للغافل الذي يتولى أمرًا يجهله تمامًا
  others: [للضيف الذي يأتي إلى العرس بلا دعوة, للبخيل الذي يحمل طعامه معه أينما ذهب, للخادم الذي يتعب ولا يأكل مما يحمل]
  note: «القصعة» إناء كبير للطعام، و«الحوش» المنزل؛ يحمل الطعام إلى المدعوين ولا يعرف مكان العرس.
  source: mughniyya
  page: 283
  status: draft

- id: u0706
  kind: meaning
  prompt: كتر خير الأرض اللي شيلاه
  answer: يقال للثقيل المكروه
  others: [يقال للكريم المعطاء, يقال للفلاح المجتهد, يقال للأرض الخصبة]
  note: أي الأرض مشكورة لأنها تحتمل ثِقله.
  source: amin
  page: 318
  status: draft

- id: u0707
  kind: meaning
  prompt: عسل وينغسل
  answer: شيء يزول ولا يترك أثرًا
  others: [لذة قصيرة يعقبها ندم, كلام حلو يخفي الغدر, نظافة البيت وترتيبه]
  note: يقولونه غالبًا للمريض تفاؤلًا بالشفاء، فالعسل إذا أصاب الثوب زال بالغسل.
  source: taymur_kinayat
  page: 56
  status: draft

- id: u0708
  kind: usage
  prompt: أول الدهر بكره
  answer: دعوة إلى طيّ الماضي والبدء من جديد بأمل
  others: [دعوة إلى تأجيل العمل حتى يأتي وقته, دعوة إلى الاستيقاظ مبكرا لطلب الرزق, دعوة إلى تذكّر الماضي والتعلم من أخطائه]
  note: أي اجعل يومك هذا أول عمرك، وانسَ ما مضى، واشرع في عملك بهمّة.
  source: adimi
  page: 22
  status: draft

- id: u0709
  kind: meaning
  prompt: اعطاه من الثور وذنه
  answer: أعطاه القليل من الكثير
  others: [أعطاه أكثر مما طلب, أعطاه كل ما يملك, وعده ولم يفِ بوعده]
  note: «وذنه» أذنه؛ من الثور كله لم يُعطه إلا الأذن.
  source: zanin
  page: 26
  status: draft

- id: u0710
  kind: usage
  prompt: من سند شعيب حدره
  answer: في أن من صعد لا بد أن يهبط يوما
  others: [في أن الطريق الطويل يبدأ بخطوة, في أن السيل يأتي من حيث لا تحتسب, في أن من حفر حفرة لأخيه وقع فيها]
  note: سند أي صعد في الوادي، وحدره أي انحدر فيه. لا تبقى حال على حال.
  source: juhayman
  page: 178
  volume: ج٨
  status: draft

- id: u0711
  kind: usage
  prompt: رجع يبكي على اللبن المطعفر
  answer: للندم بعد فوات الأوان
  others: [لمن يبكي على ما لا يستحق البكاء, لمن يفسد طعامه بيده, لمن يبالغ في الحزن على قليل]
  note: طعفر الشيء أي بدّده وأهدره؛ ويرى الإرياني أن المثل محدث.
  source: iryani
  page: 588
  status: draft

- id: u0712
  kind: meaning
  prompt: عنده الدنيا بالخلخال
  answer: لا يكترث بالمال ويكثر الإنفاق
  others: [يحب الزينة والتباهي, يملك ذهبًا كثيرًا, يعيش في رخاء دائم]
  note: أي قيمة الدنيا عنده كقيمة الخلخال في قدمه.
  source: taymur_kinayat
  page: 58
  status: draft

- id: u0713
  kind: usage
  prompt: أحلب، قال هو تيس
  answer: لمن يطلب الشيء من غير مصدره أو يطلب المحال
  others: [لمن يرفض العمل بحجة أنه ليس من اختصاصه, لمن يعطي القليل من ماله ويطلب عليه الكثير من الشكر, لمن يخلط بين الأشياء لقلة معرفته بها]
  note: التيس لا يُحلب؛ ومثله من الفصيح «أخفق حالب التيس».
  source: akwa
  page: 61
  volume: ج١
  status: draft

- id: u0714
  kind: usage
  prompt: شْحَالْ مَنْ وَاحَدْ كَانْ شِيفُورْ، وَرْجَعْ كْرِيسُورْ
  answer: لمن انحدر من مرتبة عالية إلى ما هو أدنى منها
  others: [لمن غيّر عمله ليقترب من أهله, لمن ترك السفر واستقر في مدينته, لمن تعلّم مهنة جديدة في كبره فأتقنها وربح منها]
  note: 'كم من سائق صار مساعدًا يجمع الأجرة! يقال فيمن تراجعت مكانته، ومثله: كم من معلم صار متعلمًا.'
  source: dadoun
  page: 151
  status: draft

- id: u0715
  kind: meaning
  prompt: ماشي بالدراع
  answer: يسيّر أمره بالقوة
  others: [يمشي ببطء, يعمل بيده, يمشي متكئًا على غيره]
  note: أي ينال ما يريد بالقوة لا بالحق.
  source: amin
  page: 334
  status: draft

- id: u0716
  kind: usage
  prompt: مقوّل على اثمه
  answer: لمن تأتي الأمور كما توقّعها
  others: [لمن يتكلم بما لا يعرف, لمن يُنسب إليه كلام لم يقله, لمن يكثر الوعود ولا يفي بها]
  note: «الاثم» عندهم الفم؛ كأن الغيب قيل على لسانه.
  source: abboudi_amthal
  page: 1379
  volume: ج٤
  status: draft

- id: u0717
  kind: usage
  prompt: يادى النهار الأزرق
  answer: يقال عند وقوع مصيبة أو أمر مشؤوم
  others: [يقال عند صفاء الجو وطلوع الشمس, يقال عند السهر مع الأصحاب حتى الصباح, يقال عند الفرح بسماع خبر سعيد]
  note: النهار الأزرق عكس النهار الأبيض، وهو مثل «النهار الأسود»؛ فالألوان القاتمة عند العامة رمز للغم والنكد.
  source: shaalan
  page: 376
  volume: ج٣
  status: draft

- id: u0718
  kind: usage
  prompt: تيتي تيتي؛ مثل ما رحتي جيتي
  answer: لمن يعود من سعيه خالي اليدين
  others: [لمن يمشي ببطء شديد فيتأخر عن رفاقه, لمن يكثر من زيارة الناس, لمن يرجع إلى بيته متأخرا]
  note: ذهب وعاد كما ذهب، لم يغنم شيئا.
  source: sahli
  page: 111
  status: draft

- id: u0719
  kind: usage
  prompt: يلعن بو السلطان في غيبته
  answer: للمنافق الجبان يتودد إلى خصمه في حضوره ويلعنه في غيابه
  others: [للشجاع الذي يقول رأيه في وجه الحاكم, للمظلوم الذي لا يجد من يشكو إليه, للغريب الذي لا يعرف عادات البلد فيقع في الأخطاء أمام أهلها ويُضحك منه]
  note: لا يجرؤ على قول شيء أمام السلطان، فإذا غاب شتمه.
  source: mughniyya
  page: 576
  status: draft

- id: u0720
  kind: meaning
  prompt: احكيها لطومان
  answer: خبر يشكّ السامع في صحته
  others: [سرّ يجب ألا يعرفه أحد, حكاية طويلة تسلّي السامعين, نصيحة لا ينتفع بها صاحبها]
  note: يقولها من سمع خبرًا لا يطمئن إلى صدقه.
  source: zanin
  page: 15
  status: draft

- id: u0721
  kind: meaning
  prompt: حمام بلا ميه
  answer: كثرة اللغط والصخب بين المجتمعين
  others: [مكان قذر مهمل لا يعتني به أحد من أهله, عمل ناقص لا فائدة منه, بيت خالٍ من أهله]
  note: الحمّام الشعبي كثير الضجيج، فإذا كان بلا ماء بقي الضجيج وحده.
  source: taymur_kinayat
  page: 31
  status: draft

- id: u0722
  kind: usage
  prompt: باب مردود شر مطرود
  answer: في مدح الحذر والاحتياط
  others: [في ذم البخل وإغلاق الباب أمام الضيف, في الحث على زيارة الأهل والجيران, في أن الشر يأتي من أقرب الناس]
  note: 'الباب المغلق يصرف كثيرا من الشرور، وفي معناه: الباب المقفول يرد القضا المستعجل.'
  source: taymur
  page: 97
  status: draft

- id: u0723
  kind: meaning
  prompt: ناس يأكلوا البلح ،وناس يترموا بالنوى
  answer: ناس سعداء وناس أشقياء
  others: [ناس يعملون وناس يتكاسلون, ناس كرماء وناس بخلاء, ناس يزرعون وناس يحصدون]
  note: 'تصوير لتفاوت الحظوظ: قوم ينعمون بالثمر وقوم لا يصلهم إلا النوى.'
  source: amin
  page: 374
  status: draft

- id: u0724
  kind: usage
  prompt: ومن ذاك اليوم ما زاد طيّر
  answer: لمن يدّعي ويبالغ ثم يفضح نفسه بلسانه
  others: [لمن يختفي عن أعين الناس بعد أن يقترض منهم مالًا, لمن يخاف من شيء بعد أن جرّبه, لمن ينقطع عن زيارة أصحابه]
  note: طيّر أي أطلّ وظهر؛ وأصله رجل ادّعى أنه قتل نمرًا ثم قال، ومن ذلك اليوم لم يظهر النمر.
  source: iryani
  page: 591
  status: draft

- id: u0725
  kind: usage
  prompt: ألف دكان على كتف الرحمن
  answer: في أن لكل إنسان رزقه المقدر ولا يضره كثرة المنافسين
  others: [في أن كثرة الدكاكين في السوق تدل على غنى أهل البلد, في أن التاجر لا ينجح حتى يفتح دكاكين كثيرة في كل الأسواق, في أن الدكان الواحد خير من ألف دكان خاسر]
  note: من أمثال التجار؛ فالرزق مقسوم، ووجود منافس في الحرفة لا ينقص منه شيئاً.
  source: akwa
  page: 211
  volume: ج١
  status: draft

- id: u0726
  kind: usage
  prompt: ألف دين ما يقضي دين
  answer: كثرة الديون لا تسدّ واحدا منها
  others: [الدين يسدّه المال القليل إذا صبر صاحبه, من أقرض الناس كثيرا استرد ماله بسهولة, سداد الدين أهم من جمع المال]
  note: كلما زاد الدين تضاعف وبقي الدين على حاله لا يُقضى بمثله.
  source: adimi
  page: 46
  status: draft

- id: u0727
  kind: usage
  prompt: إظهر وبان وعليك الأمان
  answer: يقال لطمأنة الخائف المختبئ ليظهر
  others: [يقال لمن يتباهى بثيابه الجديدة, يقال لمن يدّعي العلم بما لا يعرفه, يقال لمن يسافر ليلًا وحده]
  note: يقولها الأطفال في لعب الاستغماية، ويقولها الكبار لتأمين من يخشى أن يظهر أو يعترف بما يعرفه.
  source: shaalan
  page: 106
  volume: ج١
  status: draft

- id: u0728
  kind: meaning
  prompt: ما خلاش ع العصايه قشر
  answer: بالغ في لومه وتوبيخه
  others: [ضربه ضربًا شديدًا, لم يترك له شيئًا من ماله, أتقن صنعته]
  note: العصاية العصا؛ أي قشرها فلم يترك من لحائها شيئًا.
  source: taymur_kinayat
  page: 72
  status: draft

- id: u0729
  kind: usage
  prompt: صَاحَبْ خْوِيَّجْتُه، يَقْضِيهَا مَا يْبْقَى يْعَرْفَكْ
  answer: لمن يتودد إليك حتى يقضي غرضه ثم ينكرك
  others: [لمن يزورك كلما احتاج إلى مشورة, لمن يقضي حاجات الناس دون مقابل, لمن يخجل من طلب المساعدة حتى من أقرب الناس إليه]
  note: خويجة تصغير حاجة. صاحب الحويجة يتظاهر بمحبتك، فإذا قضاها أعرض عنك كأنه لم يعرفك.
  source: dadoun
  page: 163
  status: draft

- id: u0730
  kind: meaning
  prompt: أيام الربيع قصار
  answer: أيام الهناء تمضي بسرعة
  others: [أيام الربيع تُقضى في العمل, موسم الخير قليل المطر, الفرح لا يأتي إلا نادرًا]
  note: أيام الراحة تبدو قصيرة لأنها تمرّ دون معاناة.
  source: zanin
  page: 71
  status: draft

- id: u0731
  kind: usage
  prompt: يوفيك ضحكه
  answer: للبشوش الذي يدفع أصحاب الحقوق بضحكه
  others: [للمرح الذي يُضحك الناس في المجالس, للكريم الذي يقضي دينه بسرعة, للصادق الذي يفي بوعده]
  note: أي يوفي دائنه ضحكا بدل المال، ويلين له القول.
  source: abboudi_amthal
  page: 1792
  volume: ج٥
  status: draft

- id: u0732
  kind: meaning
  prompt: دا شمعة منورة
  answer: كثير الخير والنفع
  others: [سريع الغضب, نحيل الجسم, يسهر الليل]
  note: يشبّهون الرجل الخيّر بشمعة مضيئة ينتفع بها من حولها.
  source: amin
  page: 202
  status: draft

- id: u0733
  kind: usage
  prompt: تحطه ع الجرح يبرا
  answer: لمن رقّت مشاعره وخف ظله حتى صار وجوده راحة لمن حوله
  others: [لمن يعرف الأعشاب ويداوي بها الناس, لمن يتحمل الألم ولا يشكو منه مهما اشتدت عليه الجراح والأمراض, لمن يتدخل في كل أمر ليظهر نفسه]
  note: لو وضعته على الجرح لشُفي؛ كناية عن اللطف وخفة الروح.
  source: mughniyya
  page: 200
  status: draft

- id: u0734
  kind: usage
  prompt: إلى صك باب فتح الله ألف باب
  answer: للتفاؤل وانتظار الفرج مهما ضاقت الأمور
  others: [لمن يغلق بابه في وجه الضيوف, لمن يكثر التنقل من عمل إلى عمل, لمن يطرق أبواب الناس طلبًا للحاجة فيردّونه خائبًا]
  note: صك بمعنى أُغلق؛ أي إذا انسدّ طريق فتح الله طرقًا كثيرة.
  source: juhayman
  page: 259
  volume: ج١
  status: draft

- id: u0735
  kind: usage
  prompt: ما غول إلا بني آدم
  answer: للشر الكامن في الإنسان أكثر من غيره من المخلوقات
  others: [لمن يخاف حكايات الغيلان, لمن يعيش وحيدا في البرية, لمن يأكل بشراهة كأنه غول جائع لا يشبع مهما أكل من الطعام]
  note: لا غول في الحقيقة إلا الإنسان حين يشتد شره.
  source: sahli
  page: 303
  status: draft

- id: u0736
  kind: meaning
  prompt: بالباع والدراع
  answer: أخذ الشيء بالقوة والاغتصاب
  others: [قياس الشيء بدقة قبل بيعه أو شرائه, العمل بجد واجتهاد, الحصول على الشيء بالحيلة]
  note: الباع مقدار ما بين الذراعين ممدودتين؛ أي أخذه بسطوة يده.
  source: taymur_kinayat
  page: 21
  status: draft

- id: u0737
  kind: usage
  prompt: مزّ الصنفور
  answer: لمن أقدم على أمر طال تردّده فيه فارتاح منه
  others: [لمن يؤجل عمله حتى يفوت وقته, لمن يتكلم في أمر لا يعرفه, لمن يتدخل في خلاف لا يعنيه فيزيد المشكلة سوءًا]
  note: الصنفور هو الدمل، ومزّه أي ضغطه بالأصابع حتى ينفجر فيرتاح صاحبه.
  source: iryani
  page: 738
  status: draft

- id: u0738
  kind: usage
  prompt: إحنا لسه على البر
  answer: يقال حين لا يكون بين الطرفين التزام بعد
  others: [يقال عند العودة من سفر طويل في البحر, يقال عند الشعور بالأمان بعد خطر شديد, يقال عند الندم على أمر فات وانتهى]
  note: «على البر» أي لم ندخل الماء بعد؛ فلكل طرف أن يتراجع ما دام لم يلتزم بشيء.
  source: shaalan
  page: 351
  volume: ج٣
  status: draft

- id: u0739
  kind: usage
  prompt: جوعة نسر
  answer: لمن اشتد به الجوع
  others: [لمن يأكل قليلاً ويشبع سريعاً, لمن يطمع في مال غيره, لمن يأكل من طعام الناس دون دعوة]
  note: النسور تظل أياماً لا تجد ما تأكل، فإذا رأت ميتة أسرعت إليها تنهشها.
  source: akwa
  page: 387
  volume: ج١
  status: draft

- id: u0740
  kind: meaning
  prompt: اكوى البحر بطبّاعه
  answer: افعل ما شئت فلن يكون لفعلك أثر
  others: [اعمل بجدّ تنل ما تريد, لا تثق بمن لا تعرفه, احفظ سرّك عن الناس ولا تأمن لأحد منهم]
  note: «اكوى» من الكيّ بالنار؛ كيّ البحر بالمِيسم لا يترك فيه أثرًا.
  source: zanin
  page: 29
  status: draft

- id: u0741
  kind: meaning
  prompt: كسر مقاديفه
  answer: أوهم البائع بما يجعله يقبل البيع بالبخس
  others: [أفسد عليه رحلته, أعانه على عمله في البحر وأصلح له قاربه ومجاديفه, فضحه أمام الناس]
  note: كأن يذم المشتري السلعة ويظهر عيوبها، فيكسر مجاديف سفينة البائع.
  source: taymur_kinayat
  page: 67
  status: draft

- id: u0742
  kind: meaning
  prompt: يفهمها وهي طايرة
  answer: سريع الفهم قوي الذكاء
  others: [يحب صيد الطيور, يفهم متأخرًا, يسمع الكلام ولا يعي منه شيئًا]
  note: أي يلتقط المعنى قبل أن يكتمل الكلام.
  source: amin
  page: 398
  status: draft

- id: u0743
  kind: usage
  prompt: البندق العوجا فيها رميه
  answer: لمن عُرف بالخطأ ثم أصاب مرة
  others: [لمن يصيب دائما وإن كانت أدواته رديئة, لمن يلوم أداته على خطئه, لمن يتعمد الخطأ ليخدع خصمه]
  note: 'البندقية المعوجة لا يُنتظر منها إصابة، لكنها قد تصيب مرة؛ ويقال أيضا: لا تغترّ بصواب واحد بين أخطاء كثيرة.'
  source: abboudi_amthal
  page: 282
  volume: ج١
  status: draft

- id: u0744
  kind: usage
  prompt: صاحبك جيبك
  answer: الصديق الحق هو ما في جيبك من مال وقت الحاجة
  others: [الصديق الحق يحفظ سرك كما يحفظ الجيب المال في الحاجة, الصديق يُعرف من كرمه وإنفاقه, الصديق الذي يقرضك هو أوفى الناس]
  note: لا يسعفك وقت الحاجة مثل ما ادخرته في جيبك.
  source: adimi
  page: 258
  status: draft

- id: u0745
  kind: usage
  prompt: اللِّي قْدَرْ عَ اللّْبْحَرْ يْشَرْبُه، أَوْ يْصَفِّيهْ
  answer: لمن يريد القيام بعمل يستحيل تنفيذه
  others: [لمن يعطش في السفر ولا يجد ماء, لمن يخاف ركوب البحر ويرفض السفر, لمن يبالغ في تنظيف كل شيء حوله]
  note: من قدر على البحر فليشربه أو يصفّه. تحدٍّ ساخر لمن يطمح إلى ما لا يقدر عليه أحد.
  source: dadoun
  page: 279
  status: draft

- id: u0746
  kind: usage
  prompt: آخر الزمر طيط
  answer: للأمر الذي ينتهي بلا نتيجة نافعة
  others: [للعمل الذي يبدأ صغيرا ثم يكبر ويتسع, لمن يرفع صوته ليخفي خطأه, للفرح الذي يعقبه حزن طويل]
  note: الزمر ينتهي بصوت «طيط» يذهب في الريح. ونظمه محمد عثمان جلال في بيتين لما لم يلق كتابه رواجا.
  source: taymur
  page: 1
  status: draft

- id: u0747
  kind: usage
  prompt: حمار بيليك نتش قرعه
  answer: للأمر التافه الذي لا يثير اهتمام أحد
  others: [للأمر الخطير الذي يحتاج إلى قاضٍ, للأمر المفرح الذي ينتظره الجميع ويتحدثون عنه في كل مجلس, للأمر الغامض الذي لا يعرف أحد سره]
  note: «البيليك» المشاع؛ حمار لا صاحب له قضم قرعة لا قيمة لها، فلا أحد يُشتكى إليه ولا شيء يستحق الشكوى.
  source: mughniyya
  page: 241
  status: draft

- id: u0748
  kind: meaning
  prompt: فلان كتير النطّ قليل الصيد
  answer: حركته كثيرة ونتيجته قليلة
  others: [صيّاد ماهر, يصطاد كثيراً لأنه سريع الحركة, يتعب قليلاً ويربح كثيراً]
  source: asadi
  line: 103741
  halab: w1083
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: u0749
  kind: meaning
  prompt: قهوة مجيريه
  answer: التباطؤ في عمل الشيء
  others: [الضيافة الكريمة, الطعم المر, الشيء الرخيص]
  note: زعموا أن أهل قرية مجيرية طبخوا قهوة ضيوفهم ببصل مقلي في السمن لجهلهم بها.
  source: taymur_kinayat
  page: 65
  status: draft

- id: u0750
  kind: meaning
  prompt: آدي آخرتها
  answer: هذه عاقبة العمل السيئ
  others: [هذه بداية الطريق إلى النجاح, هذا آخر ما عندي, هذه فرصة لن تعود]
  note: يقولها المرء حين يرى النتيجة السيئة التي جرّها عمل سيئ سبقها.
  source: amin
  page: 12
  status: draft

- id: u0751
  kind: usage
  prompt: ما يستحملش عليه الهوا الطاير
  answer: يقال عمن يبالغ في الخوف على من يحبه
  others: [يقال عمن يكره السفر والترحال ولو قريبًا, يقال عمن يحب السهر في الهواء الطلق, يقال عمن يسرع في مشيه كأنه يطير]
  note: من صيغ المبالغة؛ فهو لا يقبل أن تمر النسمة الرقيقة على وجه من يحبه.
  source: shaalan
  page: 101
  volume: ج٤
  status: draft

- id: u0752
  kind: usage
  prompt: 'ايش علّمك الكذب؟ قال: اللى نسمعه نقوله'
  answer: في الحث على التأكد من صحة الأخبار قبل نقلها
  others: [في ذمّ من يكتم الحق ويسكت عنه خوفًا من الناس, في الحث على حسن الاستماع, في ذمّ كثرة الأسئلة]
  note: من ينقل كل ما يسمع يقع في الكذب.
  source: zanin
  page: 72
  status: draft

- id: u0753
  kind: usage
  prompt: ضربه في الحمار وضربه في الوطاف
  answer: لمن يخطئ مرة ويصيب أخرى، أو يغالط في أمر من الأمور
  others: [لمن يعاقب البريء مع المذنب بلا تمييز، فيأخذ الجميع بذنب واحد, لمن يُتعب دابته في السفر, لمن يقسم الشيء قسمة عادلة]
  note: الوطاف ضرب من السروج للحمير والبغال، وهو حشية سميكة من القطن أو الليف.
  source: iryani
  page: 914
  status: draft

- id: u0754
  kind: usage
  prompt: قضب قطابه
  answer: للملازمة الشديدة التي لا تترك للآخر فرصة للهرب
  others: [للصداقة القديمة التي لا تنقطع, لمن يحمل أمتعته ويرحل فجأة, لمن يتعلق بالأمل حتى آخر لحظة ولا ييأس من رحمة الله]
  note: قضب أي أمسك، وقطابه أي تعلق به؛ إن مشى مشى معه وإن جلس جلس معه حتى ينال مطلوبه.
  source: juhayman
  page: 258
  volume: ج١٠
  status: draft

- id: u0755
  kind: usage
  prompt: يا كم لندار الخلا من غنيمه ياتي، ورقاد الضحى ما درى به
  answer: في أن المبكر يغنم والخامل يفوته الرزق
  others: [في أن الخروج إلى الخلاء وحيداً خطر على صاحبه, في أن النائم يحلم بالغنائم ولا ينالها, في أن الرزق يأتي صاحبه وهو نائم]
  note: من أمثال جهم؛ الندّار المبكر بالخروج من البيت، يرجع بالمغانم والنائمون لم يستيقظوا.
  source: akwa
  page: 1361
  volume: ج٢
  status: draft

- id: u0756
  kind: meaning
  prompt: ما يقمش من الشمس للضل إلا بعلقه
  answer: بلغ الغاية في الكسل
  others: [يحب الشمس ولا يطيق الظل, يحتاج إلى من يحرسه, ضعيف لا يقدر على المشي]
  note: العلقة الوجبة من الضرب؛ لا ينتقل إلى الظل القريب إلا بها.
  source: taymur_kinayat
  page: 74
  status: draft

- id: u0757
  kind: usage
  prompt: سمك بوكل سمك، والسماك بوكل الكل
  answer: للقوي يأكل الضعيف، ثم يأتي الأقوى فيستغل الجميع
  others: [لمن يحب أكل السمك كل يوم ولا يمل منه مهما تكرر على مائدته, للصياد الذي يعود بلا صيد, للتاجر الذي يبيع بضاعته بثمن بخس]
  note: السمك الكبير يأكل الصغير، والسمّاك يأكلهما معا.
  source: sahli
  page: 178
  status: draft

- id: u0758
  kind: usage
  prompt: خطا الحرب قصار
  answer: لمن يتظاهر بالإقدام على الصعاب ولا يُقدم عليها
  others: [لمن يتأنى في مشيه خوفا من العثرات فيصل متأخرا عن أصحابه, لمن يعجل في القتال فيخسر, لمن يقصر سفره خوفا من الطريق]
  note: أي خطوات الحرب قصيرة؛ فالتهديد بالحرب شيء، وخوضها فعلا شيء آخر.
  source: abboudi_amthal
  page: 464
  volume: ج٢
  status: draft

- id: u0759
  kind: meaning
  prompt: الدنيا مش سايعاه
  answer: يتباهى ويتعاظم
  others: [فقير لا يجد مسكنًا, كثير الأسفار, حزين ضاق صدره]
  note: يقال للمتكبّر كأن الدنيا ضاقت عن حجمه.
  source: amin
  page: 204
  status: draft

- id: u0760
  kind: meaning
  prompt: طبخ الطبخه
  answer: دبّر المكيدة سرًا
  others: [أكرم ضيوفه, أتقن عمله, أصلح بين المتخاصمين]
  note: يقولون «طبخ لفلان الطبخه» أي نصب له الشرك بغير علمه.
  source: taymur_kinayat
  page: 51
  status: draft

- id: u0761
  kind: meaning
  prompt: أكتافه باردة
  answer: رجل لا أنصار له
  others: [رجل كسول لا يعمل, رجل هادئ لا يغضب, رجل بخيل لا يعطي]
  note: تعبير شعبي معروف عمّن ليس وراءه من يسنده.
  source: zanin
  page: 28
  status: draft

- id: u0762
  kind: usage
  prompt: أبكى من يتيم
  answer: لضعيف الشخصية الذي يتأثر بسرعة
  others: [للبخيل الذي يشكو الفقر دائمًا, للكسول الذي يتهرب من كل عمل, للمغرور الذي يستخف بغيره]
  note: صيغة مبالغة على وزن «أفعل من»؛ واليتيم مضرب المثل في كثرة البكاء، فيُشبَّه به من تُبكيه أقل كلمة.
  source: mughniyya
  page: 68
  status: draft

- id: u0763
  kind: usage
  prompt: ميّة من تحت تبن
  answer: يقال للماكر الذي يدبّر أموره في الخفاء
  others: [يقال للكريم الذي يعطي دون أن يعلم به أحد, يقال للكسول الذي لا يتحرك من مكانه طول اليوم, يقال لمن يخلط الجيد بالرديء ليغش الناس]
  note: الماء يسري تحت التبن ولا يظهر على سطحه، وكذلك الداهية الذي يعمل في الخفاء ولا يكشف ما يدبّره.
  source: shaalan
  page: 510
  volume: ج١
  status: draft

- id: u0764
  kind: usage
  prompt: إقلب الباب للضيف الثقيل
  answer: للضيف الذي لا يفهم أن عليه الرحيل
  others: [للضيف الذي يأتي دون موعد, للجار الذي يكثر الطلب, للقريب الذي يقطع زيارة أهله زمنا طويلا]
  note: الضيف الثقيل لا يرحل بالتلميح، فيُلمَّح له بقلب الباب كأنه يُدعى إلى الخروج.
  source: adimi
  page: 75
  status: draft

- id: u0765
  kind: usage
  prompt: اتْرَكْ الْحَبْ تَنْحَدْ
  answer: لمن يكثر الضيوف عليه من فرط إنفاقه وإطعامه
  others: [لمن يترك زرعه حتى تأكله الطيور, لمن يبخل على أهله ويكرم الغرباء, لمن يبيع محصوله قبل أوانه فيخسر نصف ثمنه في السوق]
  note: الحَبّ هنا هو الطعام الذي يجتذب الناس، فإذا قطعه انقطعوا عنه. نصيحة لمن أثقله الزوار بأن يقلّل ما يقدمه.
  source: dadoun
  page: 47
  status: draft

- id: u0766
  kind: meaning
  prompt: غيبه بالويبه
  answer: الغياب الطويل
  others: [الغيبة والنميمة, الكيل الوافي, البيع بالمكيال الناقص]
  note: الويبة مكيال معروف؛ كأن الغيبة لطولها صارت تُكال.
  source: taymur_kinayat
  page: 59
  status: draft

- id: u0767
  kind: usage
  prompt: فنجال يطير العماس
  answer: للعمل المتقن الذي يأتي في وقته فيكون له أثر قوي
  others: [للضيف الذي يكتفي بفنجال من القهوة عن الطعام ثم ينصرف, لمن يكثر من شرب القهوة حتى يسهر, لمن يقدم القهوة باردة لضيوفه]
  note: الفنجال إناء صغير تشرب فيه القهوة العربية، والعماس تشتت الفكر؛ فالقهوة في موعدها تعيد النشاط وتطرد الهموم.
  source: juhayman
  page: 242
  volume: ج١٠
  status: draft

- id: u0768
  kind: usage
  prompt: ما عليش إلا تلحّي، والحطب والما عليّا
  answer: للمحتال الذي يختار لنفسه الأسهل زاعمًا أنه الأصعب
  others: [للزوج الذي يعين زوجته في عمل البيت ويتحمّل عنها أشقّه, لمن يتقاسم العمل مع غيره بالعدل, لمن يتطوع للعمل الشاق دون أجر]
  note: صنع اللحوح عمل شاق، أما إحضار الماء والحطب فقد سبق أن قامت به المرأة نفسها.
  source: iryani
  page: 799
  status: draft

- id: u0769
  kind: usage
  prompt: قد معي في الحر ماعز، يا لله اديت المطر
  answer: لمن يملك شيئاً تافهاً فيكثر الحديث عنه
  others: [لمن يشكر الله على المطر بعد طول جفاف, لمن يخاف على ماله من كل صغيرة فلا ينام الليل, لمن يطلب ما لا يحتاج إليه]
  note: الحر الإصطبل؛ صار عنده ماعز واحد فراح يدعو بالمطر كأنه صاحب قطيع.
  source: akwa
  page: 801
  volume: ج٢
  status: draft

- id: u0770
  kind: usage
  prompt: اجري يا مشكاح للي قاعد مرتاح
  answer: لمن يأتيه رزقه من سعي غيره
  others: [لمن يتعب ولا يقطف ثمرة تعبه, لمن يسرع في كل أموره, لمن يخدم الناس بلا أجر]
  note: 'المشكاح هنا الساعي الكادح، وفي أمثال العرب: رب ساعٍ لقاعد.'
  source: taymur
  page: 10
  status: draft

- id: u0771
  kind: meaning
  prompt: بصلة المحب خروف
  answer: القليل من المحب يعدل الكثير من غيره
  others: [الحب يُذهب الجوع, من أحب شيئا أكثر من ذكره, القليل الدائم خير من الكثير المنقطع]
  note: بصلة يقدّمها من يحبك تساوي عندك خروفا كاملا من سواه.
  source: amin
  page: 99
  status: draft

- id: u0772
  kind: usage
  prompt: ضاع بين المخرّج وراعي الباب
  answer: لمن ضاع حقه بين المسؤولين يحيله كل منهم إلى الآخر
  others: [لمن ضل طريقه في المدينة الكبيرة, لمن خرج من بيته ليلا فلم يجد عند عودته من يفتح له الباب, لمن تردد بين عملين فخسرهما]
  note: «المخرّج» من يتولى صرف الجائزة التي يأمر بها الحاكم، و«راعي الباب» البواب؛ وكان ذلك قبل ضبط الدواوين.
  source: abboudi_amthal
  page: 744
  volume: ج٢
  status: draft

- id: u0773
  kind: meaning
  prompt: البحار كلها مالحة
  answer: طباع الناس متشابهة
  others: [الغربة صعبة في كل مكان, الدنيا كلها متاعب, لا فائدة من التنقل في الأرض]
  note: كما أن ماء البحار كلها مالح، فالناس متشابهون في طباعهم.
  source: zanin
  page: 78
  status: draft

- id: u0774
  kind: usage
  prompt: اللى له رقعة ما تدوب له خلقة
  answer: يقال في الحث على إصلاح القديم بدل التفريط فيه
  others: [يقال في ذم من يلبس الثياب الممزقة, يقال في مدح من يشتري كل يوم ثوبًا جديدًا لأولاده, يقال في أن الفقير لا يجد ما يستر جسده]
  note: الخلقة هي الخرقة أو الثوب البالي، والرقعة قطعة قماش تُسد بها الثقوب؛ فمن يرقّع ثوبه لا يبلى أبدًا.
  source: shaalan
  page: 134
  volume: ج١
  status: draft

- id: u0775
  kind: usage
  prompt: ظل الحجر، ولا ظل الشجر
  answer: لتفضيل الإقامة في البيت على البقاء في الحقل
  others: [لمن يفضل الجبل على السهل, لمن يكره الحر ويحب الظل, للبناء بالحجر بدل الخشب]
  note: ظل جدران البيت خير من ظل الشجر في الحقول.
  source: sahli
  page: 209
  status: draft

- id: u0776
  kind: meaning
  prompt: ملايكته هفت
  answer: أحست النفس بقدومه قبل أن يصل
  others: [تذكرناه بخير, غاب طويلًا عن أهله ثم عاد فجأة, نجا من خطر]
  note: كأن ملائكته الموكلين به مرّوا منبئين بقدومه.
  source: taymur_kinayat
  page: 75
  status: draft

- id: u0777
  kind: usage
  prompt: بين ترك وعرب
  answer: لمن يتهرب من مشكلاته ولا يُعتمد عليه في عمل
  others: [لمن يتقن لغتين ويتنقل بين بلدين, لمن يصلح بين المتخاصمين بالحكمة, لمن يكثر السفر طلبًا للرزق بين المدن والبلدان المجاورة]
  note: يوصف به المتردد السلبي الذي لا يبالي ولا يمكن الركون إليه.
  source: mughniyya
  page: 194
  status: draft

- id: u0778
  kind: usage
  prompt: عمامة فوق جزفه
  answer: لمن يلبس زيّ العلماء وليس منهم
  others: [لمن يخفي ماله خوفًا من الحسد, لمن يحمل همّ غيره وينسى نفسه, لمن يكرم ضيفه بأحسن ما عنده]
  note: الجَزْفة في لهجة اليمن هي الخشبة التي يُقطَّع عليها اللحم، فالعمامة فوقها لا تجعل منها عالمًا.
  source: iryani
  page: 138
  status: draft

- id: u0779
  kind: meaning
  prompt: اكفي على الخبر ماجور
  answer: احفظ السر ولا تُذعه
  others: [أسرع بنقل الخبر إلى الناس, لا تصدّق كل ما يقال, أصلح الأمر قبل أن يفسد]
  note: الماجور وعاء كبير من الفخار، وقلبه على الخبر صورة لتغطيته وكتمانه.
  source: amin
  page: 60
  status: draft

- id: u0780
  kind: usage
  prompt: الْمَكْسِي بْدْيَالْ النَّاسْ عَرْيَانْ
  answer: لمن يتباهى بمال غيره ولا يملك منه شيئًا
  others: [لمن يلبس ثيابًا مستعملة اشتراها رخيصة, لمن يقرض الناس ثيابه في الأعراس, لمن يهمل لباسه ونظافته فينفر منه أصحابه وجيرانه]
  note: المكتسي بثياب الناس عريان في الحقيقة. يقال فيمن يتبجح بمال غيره وهو لا يملك منه قليلًا ولا كثيرًا.
  source: dadoun
  page: 251
  status: draft
