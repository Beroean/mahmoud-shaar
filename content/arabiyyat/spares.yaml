- id: xw0435
  kind: custom
  prompt: لماذا كان البغداديون يضعون سكينًا صغيرة «چاقوچة» تحت مخدّة المولود؟
  answer: كي لا يفزع ولا يجفل
  others: [كي يشبّ شجاعًا يحمل السلاح, لقطع الحبل السري عند الحاجة, كي لا تقرصه الحشرات ليلًا]
  note: وكانوا يضعون كذلك سكينًا تحت وسادة الأم النفساء حتى يوم الأربعين.
  source: hijiyya
  page: 41
  status: draft

- id: xw0436
  kind: custom
  prompt: قبل المكواة، كيف كانت البغدادية تجعل الملابس المغسولة شبيهة بالمكويّة؟
  answer: ترشّها بالماء وتمسّدها بيدها ثم تضعها تحت الدواشك
  others: [تنشرها مبلولة على حبل مشدود بقوة, تلفّها مبلولة حول خشبة مستديرة وتتركها ليلة كاملة حتى تجف, تضعها في الشمس فوق سطح ساخن]
  note: ثم ظهر «الأوتي» وهو علبة حديدية يوقد فيها الفحم، وكان الكيّ يجري على ظهر طشت مقلوب مغطى ببطانية.
  source: hijiyya
  page: 90
  status: draft

- id: xw0437
  kind: custom
  prompt: عند وصول العروس البغدادية إلى بيتها الجديد، لماذا تضرب بقدمها إناءً مملوءًا بالماء عند المدخل؟
  answer: كي يتدفّق الخير على زوجها كما يتدفّق الماء
  others: [كي تغسل قدميها من غبار الطريق قبل أن تدخل البيت, كي تطرد الجنّ عن عتبة الدار, كي تُعلن أنها صارت سيدة البيت]
  note: الإناء يسمّى «اللَّگن»، وكانوا كذلك ينحرون خروفًا على العتبة لتطأ العروس دمه طلبًا للبركة.
  source: hijiyya
  page: 25
  status: draft

- id: xw0438
  kind: custom
  prompt: في بيوت بغداد القديمة، بماذا كانت ربّة البيت تجلو المنقلة النحاسية قبل استقبال الضيوف؟
  answer: بتراب ناعم يتساقط عند قصّ الطابوق بالمنشار
  others: [برماد الحطب المنخول الممزوج بقليل من الماء الدافئ, بقشر الرمّان المطحون, بالملح والليمون الحامض]
  note: يسمّونه «تراب السُّكري»، وهو غبار الطابوق المقصوص، وكانت النساء يجلين به المنقلة حتى تلمع.
  source: hijiyya
  page: 8
  status: draft

- id: xw0439
  kind: custom
  prompt: إذا سكنت عائلة جديدة في محلة بغدادية، كيف كان الجيران يكرمونها؟
  answer: يرسلون لها الغداء أيامًا متتالية
  others: [يساعدونها في نقل الأثاث, يدعونها إلى سهرة في الليوان, يهدونها حِبًّا جديدًا للماء]
  note: يرسل أحدهم خبرًا أن غداء الغد من بيته، ويتناوب الجيران أسبوعًا أو أكثر، فتتفرّغ أم البيت لترتيب بيتها ويتعارف الجيران.
  source: hijiyya
  page: 112
  status: draft

- id: xw0440
  kind: custom
  prompt: في بغداد قديمًا، لماذا سُمّيت عربة الركوب التي يجرّها حصانان «الرَّبْل»؟
  answer: نسبة إلى المطّاط المشدود على عجلاتها الحديدية
  others: [نسبة إلى أول سائق عمل عليها في بغداد, نسبة إلى الجرس النحاسي الكبير المعلّق في مقدّمتها, نسبة إلى الحيّ الذي كانت تُصنع فيه]
  note: الرَّبل أو «اللاندون» عربة بأربع عجلات يقودها «العربنجي»، وكان الرَّبل اسم المطاط الملفوف حول عجلاتها فانتقل الاسم إلى العربة كلها.
  source: hijiyya
  page: 8
  status: draft

- id: xw0441
  kind: custom
  prompt: في عقد القران ببغداد قديمًا، متى كانت البنت تقول «نعم» للقاضي؟
  answer: بعد أن يكرّر القاضي سؤاله عدة مرات
  others: [من السؤال الأول دون تردد, بعد أن يأذن لها أبوها بصوت مسموع, بعد أن تشرب الشربت مع صديقاتها]
  note: كان من عادة بنات بغداد ألّا يجبن القاضي من أول مرة، حياءً، فيعيد السؤال حتى تقول «نعم».
  source: hijiyya
  page: 12
  status: draft

- id: xw0442
  kind: custom
  prompt: إذا اشترى البغدادي «تُنگة» فخارية للماء، ماذا يعطيه الكوّاز معها؟
  answer: قليلًا من «الإصلاح» لسدّ ثقوبها إن وُجدت
  others: [غطاءً من خوص النخيل, كيسًا صغيرًا من التبن يُلفّ حولها لتبريد الماء فيها, قطعة قماش لتصفية الماء]
  note: الإصلاح شحم حيواني يُضاف إليه قليل من النورة، ويسدّ الثقوب التي تظهر في الأواني الفخارية فتمنع الترشيح.
  source: hijiyya
  page: 68
  status: draft

- id: xw0443
  kind: custom
  prompt: إذا وصل تلميذ الكتّاب في بغداد إلى سورة «النبأ»، ماذا كان على أهله أن يرسلوا إلى بيت الملّا؟
  answer: خروفًا كاملًا
  others: [صينية حلاوة دهنها يجري, ثوبًا جديدًا وعمامة, كيسًا من الرز والدهن]
  note: 'كانت المكافآت تتدرّج: عند سورة الفجر «حلاوة دهنها يجري»، وعند سورة البيّنة «حلوى بكن»، وعند نصف القرآن وليمة.'
  source: hijiyya
  page: 136
  status: draft

- id: xw0444
  kind: custom
  prompt: ما «الجوزة» التي كانت تدخّنها نساء بغداد في البيوت؟
  answer: نرگيلة مصنوعة من قشرة جوزة هند كبيرة
  others: [غليون صغير من خشب الجوز يُحشى بالتتن المفروم, سيكارة ملفوفة بورق الجوز, مبخرة نحاسية على شكل جوزة]
  note: تُفرَّغ جوزة الهند من ثمرتها وتُطلى بالأسود ويُثبَّت فيها قصبتان، واحدة للتدخين وأخرى يُركّب عليها المجمر.
  source: hijiyya
  page: 85
  status: draft

- id: xw0445
  kind: custom
  prompt: أين كان البغداديون يرمون الحبل السري للبنت بعد سقوطه، كي تتعلم الخياطة؟
  answer: في بيت «الأسطة» معلمة الخياطة
  others: [في صندوق جهاز أمها, في دكان الخيّاط في السوق, في النهر قرب البيت]
  note: ويُرمى في البيت لتكون «أم بيت»، أما الولد فيرمي أبوه حبله السري في الجامع أو في دكان صنعة أو عند الملّا ليتعلم القراءة.
  source: hijiyya
  page: 45
  status: draft

- id: xw0446
  kind: custom
  prompt: في لعبة ورقة الوردة عند البغداديين، متى تكون «فلانة» حلوة؟
  answer: إذا طقّت ورقة الوردة حين يضربها بكفه
  others: [إذا طارت الورقة مع الريح, إذا بقيت الورقة سليمة بعد الضرب, إذا سقطت الورقة على وجهها الأحمر بعد أن يضربها بكفه]
  note: يضع الورقة على حلقة السبابة والإبهام ويقول «فلانة طلعت ليبرة، وخدودها محمّرة، حلوة لو مرّة» ثم يضربها، فإذا أصدرت «طق» صاحوا «حلوة».
  source: hijiyya
  page: 165
  status: draft

- id: xw0447
  kind: custom
  prompt: في الحكاية البغدادية، كيف كسب البطل مساعدة «السعلوة» وهي من نساء الجن؟
  answer: رضع من ثديها وأكل من طعامها فصار ابنها
  others: [أهداها فرسه وسيفه ثم جلس بجانبها, غنّى لها حتى نامت ثم طلب معونتها, أعطاها خاتمًا سحريًا ورثه عن أبيه السلطان قبل موته]
  note: فلم تجد السعلوة بدًّا من مساعدته «لأنه أصبح ابنها بعد أن رضع لبانها»، وحملته عبر البحار السبعة إلى البستان.
  source: hijiyya
  page: 155
  status: draft

- id: xw0448
  kind: custom
  prompt: لماذا كانت المستحمّات في بغداد يشربن «شاي الدارسين» بعد الخروج من الحمّام؟
  answer: لإحماء الجوف وحفظه من البرد
  others: [لتنشيط الشهية للغداء, لتطييب رائحة الفم, لأنه يقطع العطش أكثر من الماء]
  note: الدارسين هو القرفة، وكان ثمنه يُدفع مع أجرة الحمّام وبخشيش الدلّاكة والناطورة.
  source: hijiyya
  page: 44
  status: draft

- id: xw0449
  kind: custom
  prompt: بماذا كان البغداديون يعالجون الزكام مع الحمّى؟
  answer: بشرب البابونج المغلي مع السكر
  others: [بشرب الحليب المغلي مع العسل, بشرب منقوع الزبيب, بشرب الشاي مع الليمون الحامض]
  note: يسمّونه «البابنّگ» أو «بيبون»، وهو زهر الأقحوان الأصفر الذي يكثر في بادية الموصل.
  source: hijiyya
  page: 62
  status: draft

- id: xw0450
  kind: custom
  prompt: إذا قال مطيرچي بغدادي «أنا وفلان حرب»، فماذا يعني ذلك؟
  answer: أن من يصطاد طيرًا من الآخر لا يعيده إليه
  others: [أنهما يتسابقان أيهما يطير حمامه أعلى, أنهما لا يبيعان ولا يشتريان من بعضهما, أنهما يتصارعان على سطح واحد]
  note: وعكسها «صُلُح» أي الوئام بين المطيرچيين، أما «الفكَك» فالمال الذي يدفعه صاحب الطير المفقود ليستعيده.
  source: hijiyya
  page: 173
  status: draft

- id: xw0451
  kind: custom
  prompt: بأي حطب كان السمّاك البغدادي يُشعل النار لسگف السمك؟
  answer: حطب الطرفة
  others: [جريد النخل, خشب التوت, فحم البلوط]
  note: يعلّق السمكة المشقوقة بعودين غليظين من الطرفة نفسها، ثم يقلبها على ظهرها فوق الجمر ليتم شواؤها، وتؤكل مع الخبز والعمبة الهندية.
  source: hijiyya
  page: 87
  status: draft

- id: xw0452
  kind: custom
  prompt: إذا اضطرّ البغدادي إلى ذكر الحيّة في الليل، ماذا كان يسمّيها؟
  answer: الحبل أو الطويلة
  others: [الزاحفة أو الملساء, أم الجرس أو الرقطاء, السوداء أو الخيط]
  note: كانوا يعتقدون أن مجرد ذكر اسمها ليلًا يجعلها تدخل البيت فتؤذيهم.
  source: hijiyya
  page: 115
  status: draft

- id: xw0453
  kind: custom
  prompt: بماذا كانت «أم الگيمر» بائعة القشطة تقطّع الگيمر للمشترين؟
  answer: بإبرة الخياطة
  others: [بسكين صغيرة, بخيط مشدود, بملعقة نحاسية]
  note: كانت تدور صباحًا وماعون الگيمر على رأسها وتبيعه بالميزان، وتعطي المشتري فوق القيمر قليلًا من الحليب، وتنادي «گيمر يو».
  source: hijiyya
  page: 126
  status: draft

- id: xw0454
  kind: custom
  prompt: في معتقدات البغداديين، بماذا تبشّر حكّة الأنف «الخشم»؟
  answer: بأكلة سمك
  others: [بمجيء ضيف عزيز, بالحصول على دراهم, بوصول ثوب جديد]
  note: ويقولون إن حكّة اليد اليمنى تعني دراهم، وحكّة الخد ضيفًا عزيزًا، ورجفة الكتف ثوبًا جديدًا، والشعرة في اللسان هدية.
  source: hijiyya
  page: 111
  status: draft

- id: xw0455
  kind: custom
  prompt: في حمّام العروس ببغداد قديمًا، فيمَ كانت النساء يستعملن «الدّيرم» وهو لحاء شجر الجوز؟
  answer: لتلوين الشفاه وتنظيف الأسنان
  others: [لصبغ الشعر الأبيض, لإزالة الشعر من الساقين, لتعطير الماء الحار]
  note: كان الديرم بين أدوات الحمّام التي تحملها المرأة البغدادية، ومعه «طين خاوة» لغسل الشعر و«الكُرْصة» لتنظيف الوجه.
  source: hijiyya
  page: 20
  status: draft

- id: xw0456
  kind: custom
  prompt: لماذا كانت البغداديات لا يغسلن الملابس يوم الجمعة؟
  answer: لأنهم يعتقدون أن الجمعة يوم «ثقيل»
  others: [لأن الحمّامات تكون مزدحمة فيه, لأن الماء يُقطع عن المحلات يوم الجمعة, لأن الغسّالات يأخذن فيه عطلتهن]
  note: كان يوم الغسيل عادة الأربعاء، وفي الشتاء يؤجَّل إلى أول يوم مشمس.
  source: hijiyya
  page: 88
  status: draft

- id: xw0457
  kind: custom
  prompt: من أي مادة كان يُصنع «المنشل»، الإناء الذي يشرب به البغداديون من الحِبّ؟
  answer: من سيقان الحلفاء المطلية بالقير
  others: [من النحاس المبيّض, من الفخار المزجّج, من قرعة يابسة مجوّفة تُطلى من الداخل بالشمع]
  note: له ذراع خشبية معقوفة على شكل الرقم 8 يُعلّق بها في الحِبّ، واشتهرت بصنعه مدينة هيت لكثرة القير السائل فيها.
  source: hijiyya
  page: 68
  status: draft

- id: xw0458
  kind: custom
  prompt: ما «القونداغ» الذي كان البغداديون يسقونه للمولود في أيامه الأولى؟
  answer: ماء دافئ مع سكر
  others: [حليب بقر مغلي مع الهيل, ماء ورد مخفف, شاي خفيف مع الدارسين]
  note: يُسقى بالطاسة والملعقة من جهاز الطفل، وكانت الجدة أم الأم تتولى ذلك، ويُسقى أيضًا الكمّون المغلي للتخلص من الغازات.
  source: hijiyya
  page: 41
  status: draft

- id: xw0459
  kind: custom
  prompt: إذا اضطرّ البغداديون قديمًا إلى ذكر البيضة في الليل، ماذا كانوا يسمّونها؟
  answer: دحروجة
  others: [مدوّرة, بيّوضة, صفّارة]
  note: كانوا يتشاءمون من البيض ليلًا لأنه يُقدَّم لأهل المتوفى بعد إخراج الجنازة، فلا يذكرونه ولا يُدخلونه الدار ليلًا.
  source: hijiyya
  page: 115
  status: draft

- id: xw0460
  kind: custom
  prompt: إذا ظهرت على وجه الرضيع حبّات صغيرة تسمّيها البغداديات «الليلو»، فبماذا كنّ يعالجنها؟
  answer: بحبّات لؤلؤ حقيقية توضع على صدره أو تُعلّق في طاقيّته
  others: [بقطرات من ماء الورد تُمسح بها الحبّات على وجهه كل صباح ومساء, بدهن الحبّات بزيت الزيتون, بتغطية وجهه بقماش أحمر]
  note: «الليلو» هي اللؤلؤ في لهجتهم، فعالجوا الحبّات التي تشبه رؤوس الدبابيس باللؤلؤ «الصاغ» أي الأصلي.
  source: hijiyya
  page: 58
  status: draft

- id: xw0461
  kind: custom
  prompt: إذا عطس أحدهم عطسة واحدة والبغدادي يهمّ بعمل، ماذا كان يقول ويفعل؟
  answer: يقول «صبر» ويؤجّل ما عزم عليه
  others: [يقول «راشدة» ويمضي في عمله, يقول «خير خير» ويغيّر طريقه, يقول «سچين وملح» ويعود إلى بيته]
  note: أما إذا سمع عطستين متتاليتين فيقول «راشدة» ويمضي فيما عزم عليه.
  source: hijiyya
  page: 114
  status: draft

- id: xw0462
  kind: custom
  prompt: لماذا كان البغداديون لا يكنسون الدار ليلًا؟
  answer: كي لا تطير البركة ويُكنس الخير
  others: [كي لا يوقظوا الأطفال النائمين, كي لا يضيع شيء ثمين في الظلام, كي لا يزعجوا الجيران بالغبار]
  note: ومن عاداتهم أيضًا ألّا يتركوا المقص مفتوحًا، وألّا يقلّموا أظافرهم إلا يوم الجمعة، حفظًا للرزق.
  source: hijiyya
  page: 115
  status: draft

- id: xw0463
  kind: custom
  prompt: أين كان البغداديون يضعون شرائح الرگّي (البطيخ الأحمر) لتبرد في ليالي الصيف؟
  answer: على التيغة، وهي حائط السطح الخارجي
  others: [في ماء الحِبّ داخل السرداب, في دلو يُدلّى في البئر, تحت العمّارية المبلّلة بالماء عند باب السرداب]
  note: كانوا ينامون على السطوح صيفًا، يرشّونها بالماء عند المغيب وتُصفّ التنگ على التيغة، ويقول المؤلف «ما ألذّ أكل الرگّي البارد على سطوح بغداد».
  source: hijiyya
  page: 74
  status: draft

- id: xw0464
  kind: custom
  prompt: في أنشودة أطفال بغداد على هديل الحمامة «الفختية»، أين أخت الحمامة؟
  answer: بالحلّة
  others: [بالكرخ, بالبصرة, بالموصل]
  note: تقول الأنشودة «كوكوختي، وين اختي؟ بالحلّة، واشتاكل؟ باجلّة، وشتشرب؟ ماي الله»، يقلّدون بها صوت الحمامة المطوّقة.
  source: hijiyya
  page: 167
  status: draft

- id: xw0465
  kind: custom
  prompt: إذا تأخّر طفل بغدادي في النطق، ماذا كانوا يسقونه؟
  answer: ماء سلق الرز
  others: [ماء الورد, حليب الماعز, منقوع الزبيب]
  note: يسمّونه «فوح التمّن»، والتمّن هو الرز في لهجة العراق، ويعتقدون أنه ينطق بعده فجأة.
  source: hijiyya
  page: 46
  status: draft

- id: xw0466
  kind: custom
  prompt: من «أم الباجلّة» التي كانت تجلس صباحًا في رأس الدربونة ببغداد؟
  answer: امرأة تبيع الباقلاء المنقوعة على خبز يجلبه الناس
  others: [امرأة تبيع البيض المسلوق للأطفال, داية المحلة التي تولّد النساء, امرأة تخبز في تنور عام لأهل المحلة مقابل قطعة من العجين]
  note: يأتيها أبناء المحلة بماعون وخبز فتنقّعه بماء الباقلاء وتضع عليه الباقلاء، ثم يضيفون في البيت الدهن والبطنج والخل.
  source: hijiyya
  page: 81
  status: draft

- id: xw0467
  kind: custom
  prompt: من «أبو الگطن» الذي كان يرافق زفّات الختان في بغداد؟
  answer: رجل يُلصق على جسمه القطن ويرقص بحزام من الأجراس
  others: [بائع غزل البنات في الأعياد, الرجل الذي يندف القطن ويحشو به فراش العريس ولحافه الجديد, حامل الراية في مقدمة الموكب]
  note: يلصقون القطن الأبيض والملوّن على جسمه بمادة لزجة كالدبس، ويلبس طرطورًا من الورق، ويحمل عصا يدفع بها عبث الأولاد.
  source: hijiyya
  page: 48
  status: draft

- id: xw0468
  kind: custom
  prompt: ما الطير «الجَلِد» عند مربّي الحمام في بغداد؟
  answer: الذي يعرف برجه فيعود إليه حتى لو قُصّ جناحاه
  others: [الذي يطير أطول مدة دون أن يحطّ, الذي يكسو الريش أرجله, الذي يُستعمل طُعمًا لاصطياد الطيور بعد أن يُقصّ جناحاه]
  note: إذا خطفه مطيرچي آخر وقصّ جناحيه، عاد إلى برجه حين ينبت ريشه الجديد، أما الطير المقصوص الذي يُستعان به في الصيد فيسمّى «النوالة».
  source: hijiyya
  page: 174
  status: draft

- id: xw0469
  kind: custom
  prompt: ليلة الزفاف في بغداد قديمًا، ماذا يُطلب من العروس أن تسكب في الموقد؟
  answer: قليلًا من دهن الطعام حتى يزيد رزق صاحب الدار
  others: [قليلًا من الماء حتى يهدأ البيت, حفنة من الملح لطرد الحسد, قليلًا من ماء الورد حتى تطيب رائحة البيت كله ليلتها]
  note: كانت العادات حول العروس كثيرة كلها تفاؤل بالرزق، ومنها أيضًا أن تغسل الرزّ صباح الصبحية حتى يكثر الخير.
  source: hijiyya
  page: 26
  status: draft

- id: xw0470
  kind: custom
  prompt: لماذا كانت العروس البغدادية لا تكنس البيت حتى اليوم السابع من زواجها؟
  answer: كي لا «تُكنس» عائلة زوجها
  others: [لأن الكنس من عمل الخادمة وحدها, كي لا تضيع الحلوى المتساقطة في الأيام الأولى, لأن الضيوف يملؤون البيت طوال الأسبوع]
  note: وفي اليوم السابع تغسل ملابس العائلة «كي ينغسل همّها»، وكلها عادات تفاؤل بأهل البيت الجديد.
  source: hijiyya
  page: 33
  status: draft

- id: xw0471
  kind: custom
  prompt: كيف كان البغداديون يحتفلون بنجاح ابنهم في تعلّم السباحة؟
  answer: يعبر الشط سباحةً وأهله ينتظرونه على الضفة الأخرى
  others: [يغطس في الماء ويُخرج حجرًا من القاع, يسبح حول الجسر ثلاث مرات أمام أهل المحلة وهم يهلهلون له, ينافس زملاءه في سباق يحكم فيه المعلم]
  note: يربط المعلم ملابس التلميذ فوق رأسه، فإذا اقترب من الجرف عزفت الموسيقى، ونثرت أمه عليه «خطّار واهلية» وهي حلوى مخلوطة.
  source: hijiyya
  page: 142
  status: draft

- id: xw0472
  kind: custom
  prompt: ما «المريس» في المطبخ البغدادي القديم؟
  answer: خبز حار من التنور يُدعك باليد مع الدهن والسكر
  others: [تمر مهروس مع السمسم المحمص, رز مطبوخ مع الدبس والسمسم يُقدَّم على مائدة الإفطار في رمضان, عجين مقلي يُرشّ عليه الهيل]
  note: يُدعك الخبز الحار حتى تتداخل السمنة والسكر مع فتاته، ويؤكل وهو حار.
  source: hijiyya
  page: 82
  status: draft

- id: xw0473
  kind: custom
  prompt: بماذا كانت تُسدّ قناني «النامليت»، الشراب الملوّن الذي يبيعه أبو النامليت في بغداد؟
  answer: بكرة زجاجية صغيرة تسمّى الدعبلة
  others: [بسدادة من الفلّين, بغطاء معدني ملويّ, بقطعة قماش مشدودة بخيط]
  note: كان ينادي «نامليت بارد، ايخلّي العجوز اتطارد»، وكان الأولاد يتراهنون على فتح القنينة بضرب فوهتها بعدد محدد من الضربات.
  source: hijiyya
  page: 128
  status: draft

- id: xw0474
  kind: custom
  prompt: ما «طين خاوة» الذي حملته البغداديات إلى الحمّام؟
  answer: رواسب نهرية تُنقع ويُدلك بها شعر الرأس
  others: [طين أحمر تُطلى به الأظافر, تراب ناعم أبيض تُفرك به أرض الحمّام وجدرانه, طين يُوضع على الوجه لتبييضه]
  note: كانوا يرونه يزيل القشرة ويليّن الشعر، وأجوده عندهم ما يُجلب من بحر النجف أو نهر العظيم أو الأحساء.
  source: hijiyya
  page: 20
  status: draft

- id: xw0475
  kind: custom
  prompt: صباح «الصبحية» في بغداد قديمًا، مِمّ كانت تُصنع الحلاوة التي يرسلها أهل العروس مع ماعون الكيمر؟
  answer: من السكر الذي تساقط على رأس العروس يوم عقد القران
  others: [من التمر الذي جاء مع جهاز العروس من بيت أهلها يوم الزفاف, من دبس يطبخه أهل العريس, من سكر تهديه جارات العروس]
  note: في عقد القران تفرك امرأتان كتلتي سكر فوق رأس العروس، فيُجمع المتساقط ويُحفظ حتى الصبحية ويُعمل منه حلاوة للعروسين.
  source: hijiyya
  page: 31
  status: draft

- id: xw0476
  kind: custom
  prompt: ماذا كان بعض البغداديين يضيفون إلى الحنّاء حين يصبغون بها الشيب؟
  answer: الخلّ أو القهوة المحمّصة المطحونة
  others: [ماء الورد أو ماء القدّاح, عصير الرمّان الحامض أو قشر النومي الحلو المطحون, الزيت أو دهن اللوز المحروق]
  note: كان الرجال والنساء كلاهما يصبغون الشيب بالحنّاء والوسمة في الحمّام، وأحسنها عندهم ما أنتجته إيران.
  source: hijiyya
  page: 96
  status: draft

- id: xw0477
  kind: custom
  prompt: بماذا كانت البغداديات ينظّفن سقوف البيت وجدرانه مما يسمّونه «مخطان الشيطان»؟
  answer: بسعفة النخل
  others: [بريشة النعام, بخرقة مبلّلة بالنفط, بمكنسة من شعر الماعز]
  note: مخطان الشيطان هو نسيج العنكبوت، أما المكنسة البغدادية فكانت من خوص النخيل وتشتهر بحياكتها محلة الفناهرة.
  source: hijiyya
  page: 70
  status: draft

- id: xw0478
  kind: custom
  prompt: ما «بيض اللگلگ» الذي كان أطفال بغداد يركضون خلف بائعه؟
  answer: حلوى ملوّنة صغيرة تذوب بسرعة في الفم
  others: [بيض طيور صغير يُسلق ويُلوَّن, كعك مدوّر محشو بالتمر, كرات من السمسم والدبس]
  note: تُصنع من السكّرين بطريقة خاصة، ويحملها البائع في سلة مخروطية وينادي عليها بنغم لطيف وصوت عالٍ.
  source: hijiyya
  page: 126
  status: draft

- id: xw0479
  kind: custom
  prompt: في حكاية بغدادية ترويها الجدة، ماذا وعدت الأخت الصغرى أن تلد لابن السلطان إن تزوّجها؟
  answer: ولدًا وبنتًا بشعر «كعكولة ذهب وكعكولة فضة»
  others: [سجادة تكفيه وتكفي عسكره كلهم, رغيف خبز واحد يكفيه ويكفي عسكره كلهم إذا خرجوا للصيد, قصرًا من الذهب على شاطئ النهر]
  note: وعدت الكبرى بزولية تكفيه وعسكره، والوسطى برغيف خبز يكفيهم، فلما عجزتا أُنزلتا دار الوصائف، وولدت الصغرى التوأمين كما وعدت.
  source: hijiyya
  page: 151
  status: draft

- id: xw0480
  kind: custom
  prompt: في الخسوف، بماذا كان يعتقد أهل بغداد قديمًا أن القمر قد اختفى؟
  answer: ابتلعته «الحوتة»
  others: [غطّته غيمة سوداء, خطفته الجنّ, غضب فاختبأ]
  note: كانوا يصعدون إلى السطوح ويضربون على القدور والطشوت النحاسية وهم ينادون «يا حوته يا منحوته، هدّي گمرنه العالي» حتى يعود القمر.
  source: hijiyya
  page: 111
  status: draft

- id: xw0481
  kind: custom
  prompt: ما وظيفة «البادگير» في سرداب البيت البغدادي؟
  answer: جلب الهواء وتهوية السرداب
  others: [تصريف ماء المطر من السطح, إنارة السرداب بضوء النهار, تخزين الماء البارد للشرب]
  note: الكلمة فارسية من «باد» أي هواء و«گير» أي جالب، وكان السرداب غرفة الصيف، وتحته «نيم سرداب» أشدّ برودة.
  source: hijiyya
  page: 70
  status: draft

- id: xw0482
  kind: custom
  prompt: لماذا سُمّيت قبّة سقف الحمّام البغدادي «العرقچين»؟
  answer: تشبيهًا بالطاقية التي يلفّ عليها البغدادي عمامته
  others: [لأن البخار يتجمّع فيها كالعرق, نسبة إلى المعماري العجمي الذي بنى أول حمّام في بغداد القديمة, لأن فتحاتها الزجاجية تشبه العيون]
  note: العرقچين كلمة تركية أصلها «مصّاص العرق»، وفي كل عرقچين فتحة مغطاة بالزجاج تسمّى «السماية» يدخل منها الضوء.
  source: hijiyya
  page: 94
  status: draft

- id: xw0483
  kind: custom
  prompt: في الطب الشعبي البغدادي، لماذا يُشدّ في يد المصاب باليرقان «أبو صفار» خرزة كهرب صفراء؟
  answer: ليديم النظر إليها فتسحب الصفار من وجهه وعينيه
  others: [لأن الكهرب يبرّد حرارة الجسم, لأن لونها يتغيّر إذا زال المرض فيعرف أهله أنه شُفي تمامًا, ليحكّ بها جلده إذا اشتدت الحكة]
  note: وللسبب نفسه كان المريض يلعب بحبّات «الهرطمان» الصفراء، ويأكل الرقّي صيفًا والنومي الحلو شتاءً.
  source: hijiyya
  page: 62
  status: draft

- id: xw0484
  kind: custom
  prompt: ما «أبو الشرگيط» الذي كان معلمو السباحة في بغداد يحذّرون تلاميذهم منه؟
  answer: تشنّج عضلي يصيب ساق السابح
  others: [سمك كبير يعضّ أقدام السابحين, تيّار قوي في منتصف دجلة, دوّامة تتكوّن قرب أعمدة الجسر]
  note: كانوا يوصون من يصيبه أن يعود مسرعًا إلى الجرف أو يستنجد بمن قربه، لأنه أغرق كثيرين ممن يعرفون السباحة.
  source: hijiyya
  page: 142
  status: draft

- id: xw0485
  kind: custom
  prompt: ماذا تعني كلمة «زورخانة»، اسم نادي المصارعة الشعبي في بغداد؟
  answer: بيت القوة، من الفارسية «زور» و«خانه»
  others: [ساحة الرمل، من التركية «زور» و«خان», دار الضيافة، من الفارسية «زوار» و«خانه», حلبة الدائرة، من الكردية «زور» و«خانه»]
  note: كانت الزورخانة بمثابة النادي الرياضي، فيها تمارين خاصة كالشناو والميال تهيّئ الرياضيين للمصارعة.
  source: hijiyya
  page: 143
  status: draft

- id: xw0486
  kind: custom
  prompt: ما «العمّارية» التي كان البغداديون يضعونها على أبواب البيوت وشبابيكها في الصيف؟
  answer: مشبك من عيدان السعف محشو بالعاگول يُرشّ بالماء للتبريد
  others: [ستارة من القماش الأبيض تحجب الشمس, مروحة كبيرة من خوص النخيل تُعلّق فوق الباب ويُحرّكها الخادم بحبل, جرّة ماء معلّقة يتبخر منها الماء]
  note: يُحشى المشبك بالعاگول الأخضر ويُرشّ بالماء بين حين وآخر، فيبرد البيت أو الغرف التي وُضعت العمّارية على شبابيكها.
  source: hijiyya
  page: 72
  status: draft

- id: xw0487
  kind: custom
  prompt: أين كانت قدور الفول المدمس تُنضج طوال الليل في أحياء القاهرة؟
  answer: في المستوقد
  others: [في فرن العيش, في دكان الحاتي, على أسطح البيوت]
  note: يأتي بها باعة الفول أول المساء ويتسلّمونها في الصباح الباكر.
  source: amin
  page: 347
  status: draft

- id: xw0488
  kind: custom
  prompt: 'متى كان المنادي يصيح: «واللي يلاقيه له الحلاوة يا عدوي»؟'
  answer: عند البحث عن طفل تائه
  others: [عند بيع الحلوى في المولد, عند إعلان زفاف, عند بيع بطيخ جديد]
  note: ينادي بصفة الطفل وما يلبسه، و«العدوي» شيخ يُنسب إليه أنه يُحضر التائه.
  source: amin
  page: 396
  status: draft

- id: xw0489
  kind: custom
  prompt: مع ماء زمزم في أواني الصفيح، ماذا كانت هدية أكثر الحجاج كما يذكر أحمد أمين؟
  answer: البلح الحجازي الناشف
  others: [البخور اليمني, السبح الكهرمان, الكحل المكي]
  note: ومن أنواع البلح في مصر الأمهات والحياني والزغلول والسماني.
  source: amin
  page: 105
  status: draft

- id: xw0490
  kind: custom
  prompt: ماذا كانت الطبقة الوسطى والعليا تطبخ يوم «السبوع»، اليوم السابع من ولادة الطفل؟
  answer: كشك بفراخ
  others: [ملوخية بالأرانب, فتة باللحم, محشي ورق عنب]
  note: 'ومن أمثالهم: «هو فرخة بكشك» لمن كان عزيزًا كالمولود.'
  source: amin
  page: 231
  status: draft

- id: xw0491
  kind: custom
  prompt: ما «المنسج» الذي كانت النساء يقضين عليه أوقات فراغهن؟
  answer: إطار يطرّزن عليه المناديل والطرح
  others: [آلة لغزل الصوف, لوح لعجن الخبز, صندوق خشبي كبير لحفظ الثياب والمناديل]
  note: وكانت بعضهن يبعن عملهن عن طريق الدلالة.
  source: amin
  page: 362
  status: draft

- id: xw0492
  kind: custom
  prompt: ماذا يسمّون المال الذي يضعه المعازيم في منديل في حجر العروس؟
  answer: النقطة
  others: [الشبكة, العيدية, القايمة]
  note: وتقف زفة العريس كذلك عند بعض البيوت فيُنقّطونها.
  source: amin
  page: 377
  status: draft

- id: xw0493
  kind: custom
  prompt: أي حيوان يكون غالبًا مع قرد «القرداتي» ويشاركه الألعاب؟
  answer: حمار صغير
  others: [كلب, عنزة, ديك]
  note: يطبل القرداتي بدفّ ليجمع الناس، ويأمر القرد أن يقلّد العجوز وهي تعجن.
  source: amin
  page: 307
  status: draft

- id: xw0494
  kind: custom
  prompt: لماذا كانوا يدقّون الهاون بقوة يوم السبوع؟
  answer: ليعتاد الطفل سماع الصوت القوي
  others: [ليطحنوا التوابل للطعام, ليعلنوا خبر المولود للجيران والأقارب, ليوقظوا الأم من نومها]
  note: 'وكانوا يغنّون: برجالاتك برجالاتك، حلقة ذهب في وداناتك.'
  source: amin
  page: 231
  status: draft

- id: xw0495
  kind: custom
  prompt: ماذا يسمّون البطيخ الذي يُزرع من غير سقي؟
  answer: البعلي
  others: [اليافاوي, الشلين, الماوي]
  note: وهو عندهم أجود مما يُسقى، والبطيخة الطرية يسمونها «ماوي».
  source: amin
  page: 100
  status: draft

- id: xw0496
  kind: custom
  prompt: في خبز البيوت قديمًا، لأي شيء كان يُستعمل المنخل؟
  answer: لتنقية الدقيق
  others: [لتنقية القمح من الطين, لتصفية اللبن, لتجفيف الخبز]
  note: الغربال أوسع مسامًّا ويُنقّى به القمح، أما المنخل فأدقّ، ومنه منخل سلك ومنخل حرير.
  source: amin
  page: 288
  status: draft

- id: xw0497
  kind: custom
  prompt: في أوقات الأذان في الأعياد، كم طلقة كان يُطلق المدفع في كل مرة؟
  answer: إحدى وعشرون طلقة
  others: [سبع طلقات, ثلاث طلقات, طلقة واحدة]
  note: ويُطلق في رمضان عند الإفطار والسحور، وطلقة واحدة عند ظهر كل يوم.
  source: amin
  page: 343
  status: draft

- id: xw0498
  kind: custom
  prompt: ما حرفة «المسلكاتية» الذين يحملون في الطريق وعاءً فيه سلوك ممتدة؟
  answer: تسليك الشبك، عود التدخين الطويل
  others: [تسليك مجاري البيوت, مدّ أسلاك التلغراف, إصلاح الشبابيك الحديد وأقفاص الطيور]
  note: الشبك عود خشب نحو متر يُدخّن به، وكان الخادم يحمله خلف سيده.
  source: amin
  page: 244
  status: draft

- id: xw0499
  kind: custom
  prompt: ما «المنظرة» في بيوت الأوساط والأغنياء؟
  answer: قاعة يستقبل فيها الرجال الزوار ويتسامرون
  others: [شرفة خشبية مغطاة تطل منها النساء على الشارع, غرفة لخزن المؤن, سطح لتربية الطيور]
  note: كانت موضع السمر والقراءة والغناء، واشتهرت منظرة العمدة بأنها محكمة للمتخاصمين.
  source: amin
  page: 362
  status: draft

- id: xw0500
  kind: custom
  prompt: لماذا سمّى المصريون ثمر الشاه بلوط «أبو فروة»؟
  answer: لما في داخل قشرته من زغب كفروة الحيوان
  others: [لأنه يُباع ملفوفًا في الفراء أيام الشتاء, لأنه يُشوى على جمر الشتاء, لأن قشرته بنية كلون الفرو]
  note: وكنايات كثيرة في التعبير المصري تبدأ بكلمة «أبو».
  source: amin
  page: 29
  status: draft

- id: xw0501
  kind: custom
  prompt: ما اسم الرماد الأسود الذي يخرج من المستوقد، ويُخلط بالجير والرمل للبناء؟
  answer: القصرمل
  others: [الحمرة, الجبس, الطفلة]
  note: كان الزبالون يوقدون الزبالة في المستوقد فيحمّون بها الحمام المجاور أيضًا.
  source: amin
  page: 347
  status: draft

- id: xw0502
  kind: custom
  prompt: ماذا كان يلبس «المبخراتي» كثيرًا وهو يمرّ بمبخرته على الدكاكين؟
  answer: عمامة حمراء
  others: [عمامة خضراء, طاقية بيضاء, طربوشًا أسود]
  note: يضع البخور في مبخرته ويبخّر الدكاكين مع الدعوات، فيعطونه ما فيه القسمة.
  source: amin
  page: 335
  status: draft

- id: xw0503
  kind: custom
  prompt: لماذا انتشر «النشوق» بين علماء الأزهر بالذات؟
  answer: لأنهم أجازوا استعماله في المسجد دون التدخين
  others: [لأنه كان يُوزّع عليهم مجانًا من أوقاف الأزهر, لأنه كان دواء للعيون, لأنه يُزرع في أرض الأزهر]
  note: النشوق دخان مسحوق يُشمّ في الأنف، وكانوا يحفظونه في علبة خشبية صغيرة.
  source: amin
  page: 375
  status: draft

- id: xw0504
  kind: custom
  prompt: بماذا يردّ من يقال له «شكر الله سعيكم» بعد السير في جنازة؟
  answer: عظّم الله أجركم
  others: [غفر الله لنا ولكم, يرحمك الله, يهديكم الله]
  note: 'ولمن عطس يقولون: يرحمك الله، فيرد: غفر الله لنا ولكم.'
  source: amin
  page: 123
  status: draft

- id: xw0505
  kind: custom
  prompt: بعد أن يسنّ السكين على الحجر الدوّار، بماذا يُتمّ «السنّان» الشحذ بيده؟
  answer: بحجر أخضر يصبّ عليه زيتًا
  others: [بقطعة جلد سميكة مبلولة بالماء, بمبرد من حديد, برمل ناعم]
  note: 'ينادي في الشوارع: نسن السكين! نسن المقص!'
  source: amin
  page: 375
  status: draft

- id: xw0506
  kind: custom
  prompt: «الكارو» عربة خشبية يجرها حمار أو حصان. من كان أكثر من يركبها في المآتم والأفراح؟
  answer: النساء
  others: [العرسان, الأطفال, الشيوخ]
  note: وكثيرًا ما كنّ يغنين عليها، وتُستعمل أيضًا في نقل العفش.
  source: amin
  page: 316
  status: draft

- id: xw0507
  kind: custom
  prompt: ما أجود أنواع المش، طعام الفلاحين الأساسي، كما يذكر أحمد أمين؟
  answer: مش الحصير
  others: [مش الزلعة, المش الأبيض, مش اللبن]
  note: 'ومن أمثالهم للأسرة يدبّ فيها الخلاف: «زي دود المش، منه فيه».'
  source: amin
  page: 348
  status: draft

- id: xw0508
  kind: custom
  prompt: ما لون الرايات التي يعلّقونها على باب البيت دلالةً على الفرح؟
  answer: الحمراء والخضراء
  others: [البيضاء والسوداء, الزرقاء والصفراء, السوداء وحدها]
  note: تمييزًا للفرح عن المأتم، وإذا كبرت عصا الراية سمّوها بيرقًا.
  source: amin
  page: 212
  status: draft

- id: xw0509
  kind: custom
  prompt: ماذا يسمّي أولاد البلد البلغة أو المركوب المستعمل؟
  answer: تغييرة
  others: [لبيسة, بابوج, سكربينة]
  note: بعضهم كان لا يلبس إلا «التغييرة» ويدفع فيها أكثر من الجديدة، لأنها أثبتت متانتها.
  source: amin
  page: 133
  status: draft

- id: xw0510
  kind: custom
  prompt: ما لون «المركوب» الذي كان يلبسه «ابن البلد» الأنيق في وصف أحمد أمين؟
  answer: أحمر
  others: [أسود, أصفر, أبيض]
  note: المركوب حذاء، وكان ابن البلد يريده أحمر خفيفًا رقيق النعل مع جبة زاهية اللون.
  source: amin
  page: 17
  status: draft

- id: xw0511
  kind: custom
  prompt: ماذا كان يُوضع في القنديل الزجاجي تحت طبقة رقيقة من الزيت؟
  answer: ماء
  others: [رمل, ملح, سمن]
  note: يطفو الزيت على الماء ويمتصّه الفتيل، ومن القنديل جاءت أسماء مثل محمد قنديل.
  source: amin
  page: 314
  status: draft

- id: xw0512
  kind: custom
  prompt: من هباب أي شيء يُصنع الكحل كما يذكر أحمد أمين؟
  answer: اللبان العطري المحروق
  others: [الحطب المحروق, زيت القنديل, الخبز المحروق]
  note: ويُصنع أيضًا من هباب قشر اللوز، ويُكحل به بمرود يُبلّ بماء الورد.
  source: amin
  page: 318
  status: draft

- id: xw0513
  kind: custom
  prompt: ماذا كان يحمل العامل الذي يتقدّم «المحتسب» وهو يجوس الأسواق؟
  answer: ميزانًا
  others: [قنديلًا, راية, دفترًا للأسعار]
  note: المحتسب يراقب الأسعار والموازين، ويعاقب من يطفّف في الكيل.
  source: amin
  page: 337
  status: draft

- id: xw0514
  kind: custom
  prompt: ماذا كان يحدث في «حفلة التكنية» ببيت شيخ السادات ليلة السابع والعشرين من رمضان؟
  answer: يمنح الحاضرين كُنًى مثل أبي الأنوار
  others: [يختن أطفال الفقراء, يوزّع كسوة العيد على الأيتام والفقراء, يعقد قران العرسان]
  note: كان كاتب يسجّل اسم الشخص وكنيته، ولا تُعطى الكنية نفسها لغيره، ثم بطلت العادة.
  source: amin
  page: 178
  status: draft

- id: xw0515
  kind: custom
  prompt: ما الذي كانوا يبنونه أحيانًا فوق السبيل أو بجانبه؟
  answer: كُتّاب
  others: [حمّام, طاحونة, قهوة]
  note: كان بناء السبيل قربة إلى الله، وبعضها بُني لسقي الخيل والحمير أيضًا.
  source: amin
  page: 231
  status: draft

- id: xw0516
  kind: custom
  prompt: بماذا كان ينادي باعة الكتاكيت وهم يحملون أقفاصها على رءوسهم؟
  answer: يا ملاح الملاح
  others: [يا وصواص, يا بركة, يا فرج]
  note: ويسمي الشاميون الكتكوت «وصواص» أخذًا من صوته.
  source: amin
  page: 317
  status: draft

- id: xw0517
  kind: custom
  prompt: في أغنية «وحوي يا وحوي» الرمضانية، بماذا يردّ الأطفال على منشدهم؟
  answer: إيّاحة
  others: [يا هلالي, يا سلام, يا حلاوة]
  note: يجتمع الأطفال بعد الفطور بفوانيس ملونة مضاءة بالشمع، وأحمد أمين لا يعرف معنى الكلمة.
  source: amin
  page: 391
  status: draft

- id: xw0518
  kind: custom
  prompt: ما «الطقطوقة» التي تُغنّى في ليلة الفرح بعد الأدوار؟
  answer: أغنية خفيفة مرحة
  others: [دور رزين طويل, موال حزين, نشيد ديني]
  note: وقد يطلقونها مجازًا على الفتاة الصغيرة الدلوعة، أو على منفضة السجاير الصغيرة.
  source: amin
  page: 269
  status: draft

- id: xw0519
  kind: custom
  prompt: ما اسم القطعة التي تعلّقها المرأة في البرقع، وتكون من ذهب أو فضة أو نحاس بحسب غناها؟
  answer: القصبة
  others: [الخلخال, المرود, الحلق]
  note: ومنه قولهم «لبّس البوصة تبقى عروسة»، لأن قصبة البرقع إذا لُبّست المعدن صارت تسمى عروسة.
  source: amin
  page: 95
  status: draft

- id: xw0520
  kind: custom
  prompt: ماذا كان يحمل «الحملي» على ظهره في شوارع القاهرة؟
  answer: إبريقًا كبيرًا من الفخار يسقي منه الناس
  others: [قفصًا مملوءًا بالكتاكيت, مبخرة كبيرة يبخّر بها الدكاكين في الصباح, حجر مسنّ لسنّ السكاكين]
  note: كان يملأ للدكاكين قللها أيضًا، لصعوبة الحصول على ماء الشرب في الطريق.
  source: amin
  page: 186
  status: draft

- id: xw0521
  kind: custom
  prompt: ما الذي كان قديمًا على مدخل كل حارة في القاهرة؟
  answer: بوابة كبيرة عليها بوّاب
  others: [سبيل لشرب الماء, قنديل كبير يضاء ليلًا للمارة, لوحة باسم الحارة]
  note: كانت البوابة تُغلق ليلًا لقلة الأمن، وفيها باب صغير يُفتح لمن يأتي وحده.
  source: amin
  page: 158
  status: draft

- id: xw0522
  kind: custom
  prompt: 'كان الخفير ينادي في الصباح: «العونة يا فلاحين!». إلامَ كان يدعوهم؟'
  answer: إلى عمل بلا أجر في الجسور والترع
  others: [إلى قبض أجورهم من العمدة, إلى سوق القرية الأسبوعي, إلى وليمة كبيرة في دار العمدة بعد الحصاد]
  note: العونة هي السخرة، وكان بعض من عليه العونة يهرب في زي امرأة أو يختبئ في الفرن.
  source: amin
  page: 284
  status: draft

- id: xw0523
  kind: custom
  prompt: كيف كان لاعب القراجوز خلف الستار يغيّر صوت شخصياته؟
  answer: بزمارة يضعها في فمه
  others: [ببوق من النحاس, بتغيير لهجته فقط, بمساعد يغني خلفه]
  note: فيظهر صوته مرة كامرأة ومرة كرجل ومرة كطفل.
  source: amin
  page: 307
  status: draft

- id: xw0524
  kind: custom
  prompt: ما التعليل الذي يقترحه أحمد أمين لتسمية «قمر الدين»؟
  answer: أنه يطلّ على الناس في رمضان شهر الدين
  others: [أنه لونه كلون القمر, أنه يُصنع في ليلة البدر, أنه يُجلب من بلاد في الشام اسمها الدين]
  note: قمر الدين مشمش مجفف مكبوس في لفائف، يُنقع ويُشرب أو يُطبخ.
  source: amin
  page: 313
  status: draft

- id: xw0525
  kind: custom
  prompt: البلّاص جرّة الفلاحة التي تملأ بها الماء من الترعة. إلى ماذا يُنسب اسمه؟
  answer: إلى بلدة في الصعيد اسمها البلاص
  others: [إلى صانع فخار مشهور, إلى كلمة تركية قديمة معناها الجرّة, إلى نوع من الطين الأحمر]
  note: والأصح عنده «البلاصي»، وكثيرًا ما تغزّل الفلاحون بالنساء يحملن البلاليص.
  source: amin
  page: 104
  status: draft

- id: xw0526
  kind: custom
  prompt: بأي أداة يُصبّ سائل عجين الكنافة على الصينية الساخنة؟
  answer: كوز مخرّق
  others: [مغرفة, قمع من الجلد, منخل]
  note: يسيل العجين من خروق الكوز خيوطًا، ثم يجفّ قليلًا ويُلمّ ويُباع.
  source: amin
  page: 321
  status: draft

- id: xw0527
  kind: custom
  prompt: مَن كان يُزعم أنه يعرف أهل الحارات التي في اختصاصه، فيشهد لهم إذا اتُّهموا؟
  answer: شيخ الحارة
  others: [العمدة, المحتسب, الفتوة]
  note: يذكر أحمد أمين أن شهادته كانت تُشترى بقروش قليلة.
  source: amin
  page: 158
  status: draft

- id: xw0528
  kind: custom
  prompt: ماذا يمسك «البهلوان» بيده وهو يمشي على الحبل المشدود؟
  answer: عصا ثقيلة لضبط توازنه
  others: [مظلة صغيرة, شمعة مضيئة, دفًّا صغيرًا يطبل به للناس]
  note: وكانوا يُستدعون في الأفراح الكبيرة كفرح أنجال إسماعيل باشا.
  source: amin
  page: 113
  status: draft

- id: xw0529
  kind: custom
  prompt: من المرأة التي كانت تدخل الحمام مع العروس وتحنّيها في ليلة الحنة؟
  answer: البلانة
  others: [القابلة, الخاطبة, الدلالة]
  note: وكانت تساعد سيدات البيوت الغنية في الحمام وفي التزيّن.
  source: amin
  page: 105
  status: draft

- id: xw0530
  kind: custom
  prompt: بأي اسم آخر كان المصريون يسمّون البقشيش أحيانًا؟
  answer: حق الدخان
  others: [حق المشوار, حق الفطار, حق العربية]
  note: البقشيش منحة صغيرة لمن يقدّم خدمة صغيرة، كدلالة على طريق أو إحضار عربة.
  source: amin
  page: 103
  status: draft

- id: xw0531
  kind: custom
  prompt: يذكر أحمد أمين أن أساس الغذاء عند أهل المدن خبز القمح. فمن أي حبّ كان خبز الريفيين؟
  answer: الذرة
  others: [الشعير, الأرز, الدخن]
  note: وقد يضيفون إلى خبز الذرة الحلبة.
  source: amin
  page: 61
  status: draft

- id: xw0532
  kind: custom
  prompt: ما اسم المرق المخلّل الأحمر الذي يصبّه بائع الطرشي فوق الخضار المخللة؟
  answer: الدقة
  others: [الشطة, الصلصة, التقلية]
  note: ويسمون صانع المخلل «المخللاتي» أو «الطرشجي».
  source: amin
  page: 342
  status: draft

- id: xw0533
  kind: custom
  prompt: بماذا كان باعة الخبز يشبّهون الخبز الأبيض في ندائهم عليه؟
  answer: الفل
  others: [القطن, اللبن, القشطة]
  note: والفل زهر أبيض يحبه المصريون ويرمزون به لصفاء الحب.
  source: amin
  page: 300
  status: draft

- id: xw0534
  kind: custom
  prompt: كيف كان المصريون ينقلون جهاز العروس ليتفاخروا به؟
  answer: مكشوفًا على عربات كثيرة
  others: [في صناديق مغلقة ليلًا, على ظهور الجمال مغطًّى بالقماش, قطعة قطعة على أيام]
  note: كانوا يفرّقونه على عربات كثيرة، حتى يضعوا على بعضها مرتبة ولحافًا فقط، إظهارًا للكثرة.
  source: amin
  page: 153
  status: draft

- id: xw0535
  kind: custom
  prompt: 'في أي أيام كانت تُباع «الميعة» وينادي عليها الباعة: يا بركة عاشوراء؟'
  answer: العشرة الأولى من المحرم
  others: [العشر الأواخر من رمضان, ليلة النصف من شعبان, أيام شم النسيم]
  note: مزيج من العقاقير يحمله المنادي على طبلية فوق رأسه.
  source: amin
  page: 371
  status: draft

- id: xw0536
  kind: custom
  prompt: لمن كان الأغنياء يُهدون شالًا كشميريًّا إذا عقد قرانهم؟
  answer: المأذون
  others: [الخاطبة, شيخ الحارة, البلانة]
  note: وكان الشال الكشميري يُلفّ به نعش الميت وتُغطّى به العروس عند دخولها بيت زوجها.
  source: amin
  page: 244
  status: draft

- id: xw0537
  kind: custom
  prompt: ما «علي لوز» الذي كان الأطفال يصنعونه ويبيعونه في العيد؟
  answer: سكر معقود عليه لوز مقشور
  others: [كعك صغير محشو بالعجوة واللوز, بسكويت بالسمسم, ملبّس ملون]
  note: كان أقارب الطفل يأخذون منه قطعة صغيرة ويدفعون له عيديته.
  source: amin
  page: 280
  status: draft

- id: xw0538
  kind: custom
  prompt: متى كان «خليج القاهرة» يُفتح لماء النيل؟
  answer: عند فيضان النيل
  others: [في ليلة النقطة, في أول رمضان, في الخماسين]
  note: وكان الأغنياء يبنون بيوتهم على ضفتيه، ثم ردمته الحكومة لأضراره.
  source: amin
  page: 198
  status: draft

- id: xw0539
  kind: custom
  prompt: ما اسم الماء المحلّى بالسكر وفيه الزبيب والصنوبر والتين، الذي يُشرب بعد الأكل؟
  answer: الخشاف
  others: [السوبيا, السحلب, العرقسوس]
  note: والشربات عمومًا يُقدّم في المناسبات المفرحة ككتب الكتاب.
  source: amin
  page: 246
  status: draft

- id: xw0540
  kind: custom
  prompt: ماذا كانت اليافطة المعلّقة فوق رءوس القضاة؟
  answer: العدل أساس الملك
  others: [إن الله هو الرزاق العظيم, رب يسّر ولا تعسّر, بسم الله الرحمن الرحيم]
  note: وكانت الدكاكين تعلّق «إن الله هو الرزاق العظيم» و«رب يسّر ولا تعسّر».
  source: amin
  page: 398
  status: draft

- id: xw0541
  kind: custom
  prompt: لماذا كان «المصارع» بلباسه الجلدي يمشي في الزفات؟
  answer: بدعوى أنه يحرسها من الخصوم
  others: [ليجمع النقطة من المعازيم والضيوف, ليعرض ألعابًا على الحبال, ليقرع الطبل أمام العريس]
  note: كان نصفه الأعلى عاريًا وفي يده «زخمة» من الجلد.
  source: amin
  page: 350
  status: draft

- id: xw0542
  kind: custom
  prompt: ماذا كان المصريون يحملون معهم تفاؤلًا عند سكن بيت جديد؟
  answer: سلقًا أخضر
  others: [قلة ماء, شمعة مضيئة, قطعة سكر]
  note: لأنهم يتفاءلون باللون الأخضر، فيحرصون على أن يكون أول ما يُدخلونه البيت الجديد شيئًا أخضر.
  source: amin
  page: 359
  flag: 'answer may be wrong: The book does not say they carried chard (سلق); "سلقًا أخضر" is part of the new-house prayer, and the custom is to enter first with "something green". The question/answer conflate the two.'draft

- id: xw0543
  kind: custom
  prompt: أيّ فسيخ اشتهر في القاهرة؟
  answer: النبراوي
  others: [الفيومي, الأسواني, السويسي]
  note: نسبة إلى نبروه قرب شربين، وكان يُشحن إلى القاهرة في المراكب.
  source: amin
  page: 296
  status: draft

- id: xw0544
  kind: custom
  prompt: بأي لقب كانوا يسمّون الترمس أحيانًا لأنه يُنقع في الماء؟
  answer: ابن البحر
  others: [ابن النيل, أبو فروة, ابن البلد]
  note: يُنقع الترمس في الماء حتى يطرى وتزول مرارته.
  source: amin
  page: 126
  status: draft

- id: xw0545
  kind: custom
  prompt: في أسواق القاهرة القديمة، ماذا كان يُباع في سوق «الكعكيين»؟
  answer: البلغ
  others: [الكعك, الحلوى, الخبز]
  note: 'لكل شيء سوقه: الصاغة للحلي، والغورية للعقاقير، والموسكي للأقمشة.'
  source: amin
  page: 241
  status: draft

- id: xw0546
  kind: custom
  prompt: في أي يوم تكون «ليلة النقطة» التي يستبشر بها المصريون؟
  answer: ١١ بؤونة
  others: [أول توت, ٢٧ رمضان, ١٢ برمهات]
  note: كانوا يضعون فيها قطعة طين مجفف، فإن ابتلّت دلّ ذلك على فيضان عظيم.
  source: amin
  page: 377
  status: draft

- id: xw0547
  kind: custom
  prompt: 'على أي طعام كان الباعة ينادون في الشوارع: «يا جابر!»؟'
  answer: لحم الرأس
  others: [الكرشة, الفول المدمس, الطعمية]
  note: يحملونه على طبلية مع الخبز والطرشي، ولا يعرف أحمد أمين سبب التسمية.
  source: amin
  page: 142
  status: draft

- id: xw0548
  kind: custom
  prompt: ما لون الخيام التي كان يُنصب منها «الصوان» للمأتم أو الفرح؟
  answer: الأبيض والأحمر من الداخل
  others: [الأخضر والأصفر, الأسود وحده, الأزرق والأبيض]
  note: كان الصوان يُقام لضيق البيوت عن المعزّين أو المهنئين، ويُفرش بالسجاجيد.
  source: amin
  page: 259
  status: draft

- id: xw0549
  kind: custom
  prompt: صبيحة العيد الكبير، بعد ذبح الأضاحي، ماذا كان يشتري المنادون الذين يجوبون الشوارع؟
  answer: جلود الخراف وفرواتها
  others: [لحم الرءوس, الصوف المغزول, عظام الذبائح وقرونها وحوافرها]
  note: كانت الفراوي تُدبغ فيُجلس عليها شتاء، والجلود تُدبغ للنعال.
  source: amin
  page: 145
  status: draft

- id: xw0550
  kind: custom
  prompt: ماذا كان الأبناء يفعلون قديمًا إذا دخل عليهم كبير الأسرة وهم يدخّنون؟
  answer: يُخفون السجاير
  others: [يقدّمون له سيجارة, يخرجون من المجلس, يطفئون الأنوار]
  note: كان احترام السن كبيرًا، وأكبر الإخوة يقوم مقام الأب.
  source: amin
  page: 239
  status: draft

- id: xw0551
  kind: custom
  prompt: ماذا يسمّي المصريون ما يؤكل بين الوجبات من خفيف الأكل كاللب والحمص؟
  answer: شبرقة
  others: [مزة, تحلية, لقمة القاضي]
  note: ومنها الخس والملانة، أي الحمص الأخضر، في ليلة شم النسيم.
  source: amin
  page: 195
  status: draft

- id: xw0552
  kind: custom
  prompt: ما اسم الجزء الأعلى من عود قصب السكر؟
  answer: زعزوعة
  others: [مصاصة, عقلة, سنبلة]
  note: المصاصة هي ما يبقى بعد مصّ القصب، ويقول الكتاب إنها تجلو الأسنان.
  source: amin
  page: 311
  status: draft

- id: xw0553
  kind: custom
  prompt: ماذا يسمّي المصريون بائع الشربات في الطرقات والدكاكين؟
  answer: الشربتلي
  others: [الفكهاني, القهوجي, العطار]
  note: ويقولون «دمه شربات» لخفيف الروح.
  source: amin
  page: 246
  status: draft

- id: xw0554
  kind: custom
  prompt: ما اسم اللعبة التي يركض فيها فارسان من جهتين، فإذا التقيا قذف أحدهما الآخر بعصا من جريد النخل؟
  answer: البرجاس
  others: [الاستغماية, الطاب, التحطيب]
  note: لعبة فروسية يُرجّح أن للمماليك أثرًا فيها، ومهارة اللاعب أن يتّقي العصا.
  source: amin
  page: 63
  status: draft

- id: xw0555
  kind: custom
  prompt: كان بائع طعمية يعتزّ بطعميته فلا يرضى أن يُطلب منه «طعمية». ماذا كان يجب أن يقول له الزبون؟
  answer: هات كباب
  others: [هات فول, هات لحمة, هات كفتة]
  note: من لذة كباب الحاتي صاروا يصفون الطعمية الجيدة بأنها «طعمية كباب».
  source: amin
  page: 156
  status: draft

- id: xw0556
  kind: custom
  prompt: إلى جانب التسلية به بعد العصر، لأي غرض آخر كان المصريون يستعملون الترمس؟
  answer: لغسل اليد كالصابون
  others: [لصبغ الثياب, لإشعال النار, لتحلية الماء]
  note: وكان يُدق ويُدعك به الجسم لعلاج بثور «حمو النيل».
  source: amin
  page: 126
  status: draft

- id: xw0557
  kind: custom
  prompt: تزغرد النساء في الأفراح. فماذا يسمّين النغمة الحزينة المقابلة لها عند الوفاة؟
  answer: الصوات
  others: [الموال, الطقطوقة, الدور]
  note: الأذن المصرية تفرّق بين الصوتين بسهولة، فيجتمع الجيران ليعرفوا الخبر.
  source: amin
  page: 222
  status: draft

- id: xw0558
  kind: custom
  prompt: ماذا كانوا يشمّون ليلة شم النسيم ويعلّقونه على رءوسهم إلى الصباح؟
  answer: البصل الأخضر
  others: [الفل, النعناع, الريحان]
  note: ثم يأكلون الفسيخ ظهرًا، ويشترك في هذا اليوم الشعبي المسلمون والنصارى.
  source: amin
  page: 196
  status: draft

- id: xw0559
  kind: custom
  prompt: إذا اشترك رجل من المدينة مع فلاح في بهيمة يطعمها الفلاح ويأخذ لبنها، فلمن يكون مولودها؟
  answer: مناصفة بينهما
  others: [للفلاح وحده, لصاحب المال وحده, لمن يشتري العلف]
  note: وكثيرًا ما ينشأ النزاع بسبب هذه الشركة، خاصة إذا ماتت البهيمة.
  source: amin
  page: 246
  status: draft

- id: xw0560
  kind: custom
  prompt: في أي يوم اعتاد المصريون أكل البيض المصبوغ بالأحمر والأصفر والأزرق؟
  answer: سبت النور، قبل شم النسيم
  others: [ليلة النصف من شعبان, يوم عاشوراء, أول أيام العيد الصغير بعد الصلاة]
  note: وكانوا يلعبون بخبط البيض، فمن انكسرت بيضته أخذها صاحب البيضة السليمة.
  source: amin
  page: 116
  status: draft

- id: xw0561
  kind: custom
  prompt: ما المشروب الذي تشربه الوالدة أيام السبوع، ويعتقدون أنه يشدّ أعصابها بعد الولادة؟
  answer: المغات
  others: [العرقسوس, الخروب, التمر هندي]
  note: نبات هندي يُدق ويُحمّر في السمن ثم يُغلى ويُضاف إليه اللوز والسكر.
  source: amin
  page: 231
  status: draft

- id: xw0562
  kind: custom
  prompt: «أربعاء أيوب» هو الأربعاء الذي قبل شم النسيم. ماذا كانوا يبيعون فيه؟
  answer: نبتًا يغتسلون بمائه
  others: [بيضًا ملونًا, فسيخًا مملحًا, فوانيس من الصفيح الملون]
  note: يقولون إنه النبات الذي شُفي به أيوب، ويسمونه البرتوف.
  source: amin
  page: 39
  status: draft

- id: xw0563
  kind: custom
  prompt: كيف كان منادو «البلغة» يعلنون عن جودتها في الشوارع والقهوات؟
  answer: يخبطون إحدى الفردتين بالأخرى
  others: [يثنونها حتى يلتقي طرفاها, يغمسونها في الماء, يقفون عليها أمام الناس بأقدامهم]
  note: وكانوا ينادون عليها «البلغة الفاسي»، فيظهر أن أصلها من فاس.
  source: amin
  page: 105
  status: draft

- id: xw0564
  kind: custom
  prompt: بأي اسم يسمّي المصريون التين الشوكي؟
  answer: كيزان العسل
  others: [بلح الشام, أبو فروة, ودن القطة]
  note: تشبيهًا له بكوز مُلئ عسلًا، للدلالة على حلاوته.
  source: amin
  page: 322
  status: draft

- id: xw0565
  kind: custom
  prompt: متى تبدأ «أيام الخماسين» التي تهب فيها رياح حارة من الجنوب؟
  answer: بعد شم النسيم
  others: [بعد عيد الأضحى, مع فيضان النيل, مع أول الشتاء]
  note: وكانوا يعتقدون أن شم النسيم في يومه يقيهم شرور تلك الرياح.
  source: amin
  page: 199
  status: draft

- id: xw0566
  kind: custom
  prompt: أي سمك مجفف اعتاد المصريون أكله في العيد الصغير؟
  answer: البكلاه
  others: [الرنجة المدخنة, البوري المشوي, البلطي المقلي]
  note: مع الكعك المنثور عليه السكر والغريبة.
  source: amin
  page: 334
  status: draft

- id: xw0567
  kind: custom
  prompt: ما «البازة» التي كانت تُقرع في مواكب الطرق الصوفية يوم المولد؟
  answer: آلة نحاسية
  others: [طبلة من جلد الماعز, راية خضراء, مزمار من القصب]
  note: كانت كل طائفة تسير بأعلامها وتنشد نشيدها الخاص مع دق الدفوف.
  source: amin
  page: 363
  status: draft

- id: xw0568
  kind: custom
  prompt: ممّ تُصنع «البليلة» التي كان بائعها يجلس في الشارع وأمامه طشت كبير على النار؟
  answer: قمح أو ذرة مسلوقة
  others: [أرز مطبوخ باللبن, عدس مدشوش بالسمن, فول نابت بمرقته]
  note: يضيف إليها المترفون اللبن والسكر، وكان أحمد أمين يشتري منها في صباه بمليمين.
  source: amin
  page: 106
  status: draft

- id: xw0569
  kind: custom
  prompt: ماذا كان يُباع في «التربيعة» بالقاهرة القديمة؟
  answer: الدهانات والعطور
  others: [الأقمشة, العقاقير, الحلي]
  note: يصفها أحمد أمين بأنها تمثّل الحياة القاهرية في قرونها الوسطى، والبيع فيها بالمساومة.
  source: amin
  page: 241
  status: draft

- id: xw0570
  kind: custom
  prompt: كان الخادم يصبّ الماء من الإبريق على يدي الآكل قبل الطعام وبعده. في أي إناء كان الماء ينزل؟
  answer: الطشت
  others: [القلة, الكنكة, الطاجن]
  note: الإبريق والطشت كانا من لوازم جهاز العروس، حتى أغنت عنهما الحنفيات.
  source: amin
  page: 14
  status: draft

- id: xw0571
  kind: custom
  prompt: بماذا كان «الحاوي» يجمع حوله المتفرجين حين يبدأ ألعابه؟
  answer: يزمّر بزمارة
  others: [يقرع جرسًا, يطلق البارود, ينادي باسمه]
  note: ومن ألعابه أن يُوهم بغرس نصل في جسمه، أو يحوّل البيض إلى كتاكيت.
  source: amin
  page: 63
  status: draft

- id: xw0572
  kind: custom
  prompt: أين كان أهل القاهرة يقضون الشتاء؟
  answer: في الأقصر وأسوان وحلوان
  others: [في الإسكندرية ورأس البر, في رأس البر, في بور سعيد]
  note: أما الصيف فيقضونه في الإسكندرية ورأس البر وبور سعيد.
  source: amin
  page: 350
  status: draft

- id: xw0573
  kind: custom
  prompt: متى كان المسحراتي يتقاضى أجره من أهل البيوت؟
  answer: يمرّ عليهم في العيد
  others: [كل ليلة بعد السحور, في أول يوم من رمضان, من الحكومة آخر الشهر]
  note: يطبل ويغني بنغمات خاصة طوال رمضان في وقت السحور.
  source: amin
  page: 347
  status: draft

- id: xw0574
  kind: custom
  prompt: ما الذي تضعه الطبقة العليا في وسط قطعة «الغريبة»؟
  answer: لوزة مقشورة
  others: [زبيبة, حبة قرنفل, نقطة مربى]
  note: الغريبة كعك من دقيق وسمن وسكر يكثر فيه السمن، وتُقدّم في المواسم والأعياد.
  source: amin
  page: 289
  status: draft

- id: xw0575
  kind: custom
  prompt: من أي سمك يكون أجود الفسيخ عند أحمد أمين؟
  answer: البوري
  others: [البلطي, القراميط, الماكريل]
  note: يُرصّ السمك طبقات مع الملح ويُثقل بحجر حتى ينزل ماؤه.
  source: amin
  page: 296
  status: draft

- id: xw0576
  kind: custom
  prompt: ماذا كان السائس يصيح وهو يجري أمام عربات الأغنياء؟
  answer: وسّع وسّع
  others: [يا ساتر, يا فتاح يا عليم, يا عدوي]
  note: كان يحمي الراكب من الزحام، ثم بطل ذلك بانتشار السيارات.
  source: amin
  page: 230
  status: draft

- id: xw0577
  kind: custom
  prompt: إلى من تُنسب «الملوخية البوراني» المحمّرة بالسمن؟
  answer: بوران زوجة المأمون
  others: [شجرة الدر, الحاكم بأمر الله, زبيدة زوجة هارون الرشيد]
  note: تُخرط الملوخية وتُحمّر بالسمن حتى تجف ثم تُدق.
  source: amin
  page: 359
  status: draft

- id: xw0578
  kind: custom
  prompt: بأي صفة كانت «الخاطبة» تدخل البيوت لتتعرّف على النساء والفتيات؟
  answer: بصفة بلانة أو دلالة
  others: [بصفة قابلة تولّد النساء, بصفة طبّاخة للأفراح, بصفة معلّمة خياطة]
  note: كانت تبالغ في وصف جمال الفتاة أو غنى الشاب، مقابل أجر تأخذه بعد إتمام الزواج.
  source: amin
  page: 192
  status: draft

- id: xw0579
  kind: custom
  prompt: بماذا يختلف «المترد» عن «الطاجن» من أواني الفلاحين الفخارية؟
  answer: بضيق رقبته
  others: [بأنه من نحاس, بأنه لا يدخل الفرن, بأنه أصغر حجمًا]
  note: 'وإذا امتلأ المترد وانتفخ ما فيه بعد النضج قالوا: مترد مطنبر.'
  source: amin
  page: 336
  status: draft

- id: xw0580
  kind: custom
  prompt: من «الدلالة» في البيوت المصرية القديمة؟
  answer: امرأة تبيع سلع النساء في البيوت
  others: [امرأة تبحث عن عروس للشباب, امرأة تزيّن العروس وتحنّيها ليلة الحنة, امرأة تولّد النساء]
  note: تشتري المناديل والعطور ونحوها وتبيعها بأكثر، وتنقل أخبار البيوت.
  source: amin
  page: 204
  status: draft

- id: xw0581
  kind: custom
  prompt: كان رجل في القاهرة يلبس جلبابا أبيض ويمشي منادياً «يا فرج!»، فما كانت صنعته؟
  answer: إخراج الثعابين من البيوت
  others: [البحث عن الأطفال التائهين, سنّ السكاكين والمقصات, توزيع الماء على البيوت]
  note: كان يُستدعى إلى البيوت فيتلو عزائمه ويُخرج الثعبان من مخبئه، كما يذكر أحمد أمين أنه شاهده.
  source: amin
  page: 396
  status: draft

- id: xw0582
  kind: root
  prompt: دَمْشَش
  hint: شجّ رأسه بضربة أو رجمة حتى سال منه بغزارة
  answer: الدَّم
  others: [الدَّهَش, الدَّمْع, المَشْق]
  note: يرى الإرياني أن أصل الكلمة من الدم، وزيدت حروفها للدلالة على غزارة سيلانه.
  source: iryani
  page: 308
  status: draft

- id: xw0583
  kind: root
  prompt: الرَّوَل
  hint: حيوان من الزواحف معروف
  answer: الوَرَل
  others: [الأَرْوى, الوَرَد, الرَّال]
  note: تقدّمت الواو وتأخرت الراء ليُفصل بين الراء واللام، لأن هذا التتابع نادر في كلام العرب.
  source: iryani
  page: 367
  status: draft

- id: xw0584
  kind: custom
  prompt: ماذا يسمي اليمنيون الفزّاعة التي تُنصب في المزارع لإخافة الطيور؟
  answer: المشعف
  others: [القنصاع, المسنى, الحاجور]
  note: تُبنى من حجارة وتُجعل لها سواعد من أعواد وتُلقى عليها خرق فتبدو كأشخاص؛ ويسميها أهل الشام الفزّاعة.
  source: iryani
  page: 745
  status: draft

- id: xw0585
  kind: custom
  prompt: قبل النزول إلى «المدفن» الذي تُخزن فيه الحبوب في اليمن، ماذا يجب أن يُفعل؟
  answer: أن يُترك مفتوحًا حتى يتهوّى
  others: [أن تُشعل فيه نار لطرد الحشرات, أن يُرشّ بالماء لتبريده, أن يُفرش بالتبن ليحفظ الحب]
  note: المدفن حفرة منقورة في الصخر تُغطّى بلوح حجري يسمى المكدنة، وهواؤها فاسد فقد يختنق من يتعجّل النزول.
  source: iryani
  page: 765
  status: draft

- id: xw0586
  kind: custom
  prompt: ما «الجُلْجُلان» في لهجات اليمن؟
  answer: السمسم
  others: [الحلبة, الكمّون, الذرة]
  note: ويقال للسمسم أيضًا الجُلْجُل.
  source: iryani
  page: 147
  status: draft

- id: xw0587
  kind: root
  prompt: الجَدْم
  hint: العضّ، يقال جدم فلانٌ الشيءَ يجدمه
  answer: الكَدْم
  others: [الجَذْم, الهَدْم, الجَزْم]
  note: الجَدْم العضّ، وهو كالكَدْم القاموسي؛ ويظن الإرياني أن الكاف تنشأ في بعض الكلمات حين ينطق أهل الجيم المعطّشة جيمَ غيرهم كافًا.
  source: iryani
  page: 128
  flag: 'answer may be wrong: The book calls جدم ''like'' classical كدم and suggests the kaf may come from the jim, so كدم as the ''root'' is a loose fit.'draft

- id: xw0588
  kind: custom
  prompt: ما «الصَّدا» أو «السَّطا» الذي كان اليمنيون يصنعون منه الحبر؟
  answer: سُخام السراج الذي يتراكم على سطح فوق شعلته
  others: [عصارة قشر الرمان المغلي, رماد الحطب المخلوط بالزيت بعد أن يُنخل ويُترك أيامًا, مسحوق حجر أسود من الجبال]
  note: كانوا يضعون السراج في رفّ وفوقه سطح ناعم، ثم يكشطون ما تراكم ويذيبونه في الماء الحار مع الصمغ.
  source: iryani
  page: 541
  status: draft

- id: xw0589
  kind: custom
  prompt: ماذا يصنع اليمنيون بـ«قبوة الكاذي»؟
  answer: يضعونها بين الثياب أو في صناديقها لتعطّرها
  others: [يطبخونها مع اللحم في الأعياد, يعلّقونها على أبواب البيوت وفي النوافذ لطرد الحشرات, يطحنونها ويخلطونها بالقهوة]
  note: القبوة غرّة طلع شجر الكاذي العطري، وقد تبقى رائحتها في الثياب عامًا إذا حُفظت في صندوق مقفل.
  source: iryani
  page: 766
  status: draft

- id: xw0590
  kind: custom
  prompt: ما «الرَّشاد» عند اليمنيين؟
  answer: زاد الطريق للمسافر
  others: [دليل القافلة في الصحراء, حبل يُشدّ به الحمل على الدابة, هدية العائد من السفر]
  note: الرشاد اسم لما يتزوّده المسافر من طعام لطريقه.
  source: iryani
  page: 356
  status: draft

- id: xw0591
  kind: root
  prompt: المَضْرَب
  hint: أضخم وأقوى ما يُبنى في الوديان من السدود لحماية الأرض الزراعية من السيل
  answer: ضَرَب
  others: [ضَبَر, رَضَب, ضَرَم]
  note: السيل يضرب في هذا البناء فيرتدّ عن الأرض، فالكلمة من مادة «ضرب» اشتقاقًا ودلالة.
  source: iryani
  page: 574
  status: draft

- id: xw0592
  kind: root
  prompt: زَحَط
  hint: زلق وانحدر (في لهجة شمالية)
  answer: دَحَض
  others: [حَطَّ, ضَغَط, دَحَر]
  note: ترد الكلمة دحص وطحس وزحط بحسب المناطق، وكلها من «دحض» بعد إبدال الحروف وتقديمها وتأخيرها.
  source: iryani
  page: 277
  status: draft

- id: xw0593
  kind: custom
  prompt: في اليمن، ما «السُّكاب» من الدجاجة أو أيّ طير؟
  answer: الصدر
  others: [الجناح, الفخذ, الرقبة]
  note: السكاب صدر الطير، ويُعدّ عندهم خير الأعضاء لكثرة لحمه.
  source: iryani
  page: 440
  status: draft

- id: xw0594
  kind: custom
  prompt: في لهجات اليمن، ماذا يعني «تَلَم المزارعُ أرضه»؟
  answer: حرثها وبذرها في وقت واحد
  others: [سقاها من البئر, حصد زرعها, سوّرها بالحجارة لتمنع عنها الدواب]
  note: التلم في المعاجم شقّ الأرض بالمحراث، وصار في اليمن يعني الحرث مع البذر في موسم البذار.
  source: iryani
  page: 98
  status: draft

- id: xw0595
  kind: root
  prompt: المِخْلاف
  hint: المنطقة الإدارية في اليمن قديمًا، وتضم المركز وما حوله من قرى
  answer: الاختلاف
  others: [الخِلافة, الخَلَف, الخُلْف]
  note: يرجّح الإرياني أنها من «اختلاف» أهل المركز إلى ما حولهم ذهابًا وإيابًا في شؤون معاشهم.
  source: iryani
  page: 245
  status: draft

- id: xw0596
  kind: custom
  prompt: من «صَيّاد» في المعتقدات الشعبية اليمنية؟
  answer: السِّعلاة التي تعترض المسافر في الليل
  others: [الصقر الذي يربّيه شيوخ القبائل, حارس الحقول من الطيور, الرجل الذي يصطاد الوعول في الجبال]
  note: يزعمون أن صيّاد تظهر للسائر ليلًا وترميه بالحصى، فإن خاف طاردته، وإن اقترب من القرية تركته.
  source: iryani
  page: 218
  status: draft

- id: xw0597
  kind: custom
  prompt: ما «الطَّرْحة» في البيت اليمني؟
  answer: الطبقة أو الدور من البناء
  others: [السطح المكشوف, الباب الخارجي, المطبخ]
  note: جمعها طرحات، وقد تُطلق على ما يسمى الشقّة في لهجات عربية أخرى.
  source: iryani
  page: 584
  status: draft

- id: xw0598
  kind: custom
  prompt: ما «القَلُومة» عند المزارعين في اليمن؟
  answer: قطف سنابل الذرة من قصبها بعد حصادها
  others: [حرث الأرض قبل المطر, تخزين الحبوب في المدافن, جمع الحطب من الجبل]
  note: لها موسم محدد يُنشغل فيه الناس، ولهم فيه أهازيج يرددونها أثناء العمل.
  source: iryani
  page: 738
  status: draft

- id: xw0599
  kind: root
  prompt: الرَّبْش
  hint: الفتنة واضطراب الأحوال واختلاط الأمور
  answer: الرَّبْك
  others: [الرَّبْص, البَرْش, الرَّشْق]
  note: يرى الإرياني أن أصلها مادة «ربك» القاموسية، ويستغرب قلب الكاف هنا شينًا وهي من أصل الكلمة.
  source: iryani
  page: 341
  status: draft

- id: xw0600
  kind: root
  prompt: تَشْكِيك الدجاجة
  hint: صياحها وهي تدور في أرجاء البيت قبل أن تضع بيضها
  answer: الشَّكّ
  others: [الشَّوْك, الشُّكْر, الكَشّ]
  note: الدجاجة تدور هنا وهناك كأنها تشكّ في المكان المناسب أو تضلّل من يطلب بيضها، فالكلمة من «شكك».
  source: iryani
  page: 511
  status: draft

- id: xw0601
  kind: custom
  prompt: ما «التَّشْكِيم» من تقاليد العرس في اليمن؟
  answer: دعوة العروس أول مرة إلى ولائم تُقام لها بعد زفافها بمدة
  others: [تقديم المهر إلى أهل العروس, حناء العروس في الليلة السابقة للعرس بحضور قريباتها وصديقاتها والجارات, زيارة العريس لأهل العروس يوم الخطبة]
  note: هو من التقاليد المتأخرة في العرس، وتُقام ولائمه بعد نحو شهر من الزفاف.
  source: iryani
  page: 511
  status: draft

- id: xw0602
  kind: custom
  prompt: فيمَ يستعمل اليمنيون ثمر نبتة «الرّاء» الأبيض الخفيف؟
  answer: في حشو الوسائد والمساند والمتّكآت
  others: [في صنع الخبز وخلطه بالدقيق في أيام الجدب والقحط, في صباغة الثياب, في علاج الجروح]
  note: يجمعون ثمرها الناعم الخفيف ويحشون به الحشايا، ويقال إن اليمنيين القدماء حشوا به أجواف موتاهم المحنّطين.
  source: iryani
  page: 337
  status: draft

- id: xw0603
  kind: root
  prompt: الغَلاق
  hint: مبلغ من المال أو ذبيحة يُقطع بها نزاع، أو ما بقي من حساب يُسدَّد
  answer: أَغْلَق
  others: [غَلا, عَلِق, غَلَّ]
  note: يرجّح الإرياني أن ذلك كله من «أغلق» بمعنى أقفل، أي يُقفل به النزاع أو الحساب.
  source: iryani
  page: 675
  status: draft

- id: xw0604
  kind: custom
  prompt: ماذا يسمّي العامة في اليمن الدوّامة الهوائية التي تثير الغبار وتتنقل بسرعة؟
  answer: حريوة الجن
  others: [ذيل الشيطان, فرس الريح, بنت الرمل]
  note: الحريوة في لهجاتهم العروس، ويطلق العامة هذا الاسم على الدوّامة التي تثير الغبار وتنتقل بسرعة من مكان إلى آخر.
  source: iryani
  page: 174
  status: draft

- id: xw0605
  kind: custom
  prompt: في البيت الريفي اليمني، ما «السُّفْل»؟
  answer: الزريبة أو الإسطبل في أسفل البيت
  others: [مخزن الحبوب على السطح, غرفة استقبال الضيوف, البئر التي يُستقى منها]
  note: يرد السفل في مثل «نخس جنبي ولا عشره في السفل»، والدواب تُحفظ في الطابق الأسفل من البيت.
  source: iryani
  page: 854
  status: draft

- id: xw0606
  kind: root
  prompt: الهَزْر
  hint: الشدّ والجذب بقوة
  answer: الهَصْر
  others: [الهَزّ, الزَّجْر, الهَدْر]
  note: انقلبت الصاد زايًا في لهجاتهم، والهصر في المعاجم الجذب بلين، أما الهزر عندهم فالجذب بشدة.
  source: iryani
  page: 945
  status: draft

- id: xw0607
  kind: custom
  prompt: ما «الدِّمّة» في لهجات اليمن؟
  answer: القطة
  others: [الفأرة, الدجاجة, العنزة]
  note: الدُّمّ القط والدِّمّة القطة في شمال اليمن، ويسمّونه في مناطق أخرى النَّسَم والعُرار.
  source: iryani
  page: 308
  status: draft

- id: xw0608
  kind: root
  prompt: تَلَوَّه
  hint: فطن للشيء الخفي وانتبه له
  answer: لاهَ
  others: [لَها, وَلِه, تاهَ]
  note: يرى الإرياني أن أصلها «لاهَ الشيءُ يلوه» إذا ظهر وتجلّى، ثم جاء المزيد المستعمل في لهجاتهم.
  source: iryani
  page: 817
  status: draft

- id: xw0609
  kind: custom
  prompt: في أيام شحّ الماء في اليمن، من «المُمَكِّل»؟
  answer: من يقعد عند العين الشحيحة يغترف ما يتجمع منها إلى جرّته
  others: [من يحفر بئرًا جديدة في الوادي, من يبيع الماء للناس في السوق, من يحرس الماء من السرقة ليلًا ويوزّعه على أهل القرية بالتناوب]
  note: المُكْل شحّة المياه الشديدة، فلا يغترف الناس الماء بل يمكّلونه قليلًا قليلًا، وخلف كل ممكّل صفّ ينتظر دوره.
  source: iryani
  page: 835
  status: draft

- id: xw0610
  kind: custom
  prompt: ما «البُدا» عند اليمنيين؟
  answer: طعام الفطور في الصباح
  others: [طعام العشاء, الطعام الذي يُقدَّم للضيف, طعام الغداء يوم الجمعة]
  note: يقال تبدّى فلان أي فتح طعامه في الصبح، والبُدا هو فطور الصباح.
  source: iryani
  page: 183
  status: draft

- id: xw0611
  kind: custom
  prompt: في اليمن إذا تنازع اثنان قال أحدهما لغريمه «حصمة الحاكم يا فلان»، فماذا يعني؟
  answer: يدعوه إلى المثول أمام السلطة ويلزمه بالحضور
  others: [يقسم له أنه صادق فيما يقول, يعرض عليه الصلح وترك الخصومة قبل أن يعلم بها أحد من الناس, يتهمه بأنه رشا الحاكم]
  note: الحصمة رمز لسلطة الحاكم، فمن قيلت له وجب عليه الذهاب إلى الحاكم وإلا تحمّل غرامة.
  source: iryani
  page: 183
  status: draft

- id: xw0612
  kind: custom
  prompt: من «الشُّواعة» في الأعراس اليمنية؟
  answer: أقارب العروس الذين يرافقونها عند زفافها إلى بيت زوجها
  others: [المغنّون والمنشدون الذين يُحيون ليلة العرس ويطوفون بالعريس في الأزقّة, الطهاة الذين يعدّون الولائم, الشهود على عقد الزواج]
  note: مفردها شويع، وهو يخدم في العرس من أول حفلاته حتى يرافق قريبته إلى بيت زوجها.
  source: iryani
  page: 526
  status: draft

- id: xw0613
  kind: custom
  prompt: ما «المَفْرَج» في البيت اليمني؟
  answer: غرفة الجلوس المطلة على منظر جميل
  others: [فناء البيت المكشوف, مخزن الحبوب تحت الأرض, حظيرة المواشي]
  note: المفرج في البيوت اليمنية غرفة يُجلَس فيها وتطلّ على مشهد جميل.
  source: iryani
  page: 125
  status: draft

- id: xw0614
  kind: root
  prompt: اللِّزَقة
  hint: الوَزَغة، تلك العظاءة التي تألف المنازل
  answer: لَزِق
  others: [زَلِق, لَزِم, رَزَق]
  note: يرى الإرياني أن الكلمة من «لزق» القاموسية، والوزغة معروفة بالتصاقها بالجدران.
  source: iryani
  page: 802
  status: draft

- id: xw0615
  kind: custom
  prompt: ما «المِشْفى» في صناعة الجلود في اليمن؟
  answer: المخرز أو المثقب
  others: [السكين المعقوف, حوض دبغ الجلود, الخيط المفتول من الشعر]
  note: يقولون «الإشفى» إذا كان جيدًا متقنًا، ويقولون المشفي إذا كان بسيطًا عاديًا.
  source: iryani
  page: 500
  status: draft

- id: xw0616
  kind: custom
  prompt: ما «السُّماية» عند اليمنيين؟
  answer: الأقصوصة الشعبية أو الحدوتة التي تُروى للأطفال
  others: [أغنية الأم لتنويم طفلها, اسم يُختار للمولود في يومه السابع بعد مشاورة الجدّين والأعمام, دعاء يُقرأ عند المطر]
  note: تقول، سامت الجدة الأطفال مساماة أي روت لهم سمايات، وجمعها سمايات.
  source: iryani
  page: 448
  status: draft

- id: xw0617
  kind: custom
  prompt: ما «الشَّرِيم» عند المزارعين في اليمن؟
  answer: المنجل
  others: [المحراث, المعول الصغير, الفأس]
  note: يرد في المثل «سبرت حجنه، بطلت شريم»، والحجنة فيه معول صغير.
  source: iryani
  page: 419
  status: draft

- id: xw0618
  kind: custom
  prompt: في الغناء اليمني «من يريد العسل يصبر على لقصة النوب»، ما «النُّوب»؟
  answer: النحل
  others: [الدبابير, العقارب, الشوك]
  note: النوب هو النحل، واللَّقصة لسعته، فمن طلب العسل احتمل اللسع.
  source: iryani
  page: 812
  status: draft

- id: xw0619
  kind: root
  prompt: مَقْلُود
  hint: المفتاح
  answer: الإقْلِيد
  others: [القِلادة, التَّقْليد, المِقْوَد]
  note: يذكرها الإرياني مثالًا على ما دخل لهجاتهم قديمًا، فهي من «الإقليد» المعرّب منذ زمن بعيد.
  source: iryani
  page: 40
  status: draft

- id: xw0620
  kind: root
  prompt: الحِيّة
  hint: قوام البيت وصلاح شؤونه، ويقال في وصف ربّة البيت «مدبّره كل حيّه»
  answer: الحياة
  others: [الحَيّة, الحَياء, التَّحِيّة]
  note: يقول الإرياني إن أصلها «حِيوة» من «حيو» أي الحياة.
  source: iryani
  page: 220
  status: draft

- id: xw0621
  kind: custom
  prompt: ما «المَنْسامة» في طرق اليمن الجبلية؟
  answer: المكان الذي يستريح فيه المسافرون عند الصعود
  others: [النبع الذي يشرب منه المسافرون, سوق صغير على طريق القوافل يبيع فيه أهل القرى الزاد والماء, حصن يحرس الطريق من اللصوص]
  note: تكون عادة عند صخرة يضع عليها المسافرون أحمالهم ويستظلون بها، وتسمى الاستراحة نفسها النَّسْمة.
  source: iryani
  page: 865
  status: draft

- id: xw0622
  kind: root
  prompt: الزَّهْنَقة
  hint: التزيّن والتزيين، والقماش المزهنق هو المزيَّن
  answer: أَنِق
  others: [زَهِق, زَنَق, هَنَأ]
  note: يرى الإرياني أن أصلها مادة «أنق» زيدت في أولها الزاي، وتحولت الهمزة إلى هاء كما يكثر في لهجاتهم.
  source: iryani
  page: 408
  status: draft

- id: xw0623
  kind: custom
  prompt: فيمَ كان اليمنيون يستعملون «الكِرْبة» قبل شيوع الصابون؟
  answer: في غسل الأبدان وشعر الرؤوس والملابس
  others: [في طلاء جدران البيوت, في صنع أواني الفخار, في علاج جروح الحيوانات]
  note: الكربة تربة بيضاء نادرة تكون قطعًا متماسكة، فإذا أصابها الماء صارت معجونًا زلقًا ناعمًا.
  source: iryani
  page: 767
  status: draft

- id: xw0624
  kind: custom
  prompt: ما «المَرْجو» عند البئر في الريف اليمني؟
  answer: الحوض الذي يُصبّ فيه الماء من الدلو
  others: [الحبل الذي يُرفع به الدلو, الحجر الذي يُغطّى به فم البئر, الطريق الذي يسلكه الثور]
  note: يكون في البئر ذات الناضحة أو المسنى، وجمعه مراجو، ويسمى أيضًا الرجو.
  source: iryani
  page: 343
  status: draft

- id: xw0625
  kind: custom
  prompt: من «البَتُول» في الريف اليمني؟
  answer: الذي يعمل على الثيران ويحرث عليها
  others: [الذي يحرس الحقول ليلًا, الذي يبيع الحبوب في السوق, الذي يجلب الماء من البئر]
  note: البتول يطعم الثيران ويعتني بها ويحرث عليها، فإن أحبها كان عمله عليها أيسر.
  source: iryani
  page: 854
  status: draft

- id: xw0626
  kind: root
  prompt: الرَّثى
  hint: التراب الرطب البارد يكون في الظل، وينهون عن الجلوس عليه
  answer: الثَّرى
  others: [الرِّثاء, الثَّراء, الرَّيّ]
  note: يرجّح الإرياني أنها من «الثرى» بتقديم الراء على الثاء.
  source: iryani
  page: 343
  status: draft

- id: xw0627
  kind: root
  prompt: المَلْحُوظ
  hint: المحظوظ الميمون الطالع، كقولهم «فلان ملحوظ لحظة عظيمة»
  answer: اللَّحْظ
  others: [اللِّحاف, اللَّحْن, اللَّفْظ]
  note: يردّها الإرياني إلى اللحظ والملاحظة بالنظر، فكأن صاحبها موضع لحظٍ من العناية الإلهية.
  source: iryani
  page: 800
  status: draft

- id: xw0628
  kind: custom
  prompt: ما «الدِّهْوة» في البيت اليمني؟
  answer: زاوية مظلمة في أحد جوانب البيت تُتّخذ مخزنًا
  others: [نافذة صغيرة في أعلى الجدار يدخل منها الضوء والهواء إلى الغرفة, موقد النار في المطبخ, مقعد حجري عند الباب]
  note: قد تُخزن فيها بعض مؤن البيت، وجمعها دِهَو.
  source: iryani
  page: 319
  status: draft

- id: xw0629
  kind: custom
  prompt: على أيّ شيء يُصبّ عجين «اللَّحُوح» اليمني لينضج؟
  answer: على الملحة، وهي طبق واسع من الفخار
  others: [على صاج من الحديد فوق الحطب, على جدار التنّور من الداخل, على حجر أملس يُسخّن في الشمس]
  note: يُصبّ العجين بإناء مثقوب يسمّى المِثَر، دائريًّا من الوسط نحو الجدار، فينضج قرصًا رقيقًا شفافًا.
  source: iryani
  page: 799
  status: draft

- id: xw0630
  kind: root
  prompt: عَرْنَن
  hint: اشتدّ جسمه وتوتّر للدفاع أو التمنّع
  answer: القَرْن
  others: [العَرين, العِنان, الرَّنين]
  note: يقال أيضًا قرنن، ويرى الإرياني أن المعنى، صار صلبًا كالقرن.
  source: iryani
  page: 622
  status: draft

- id: xw0631
  kind: custom
  prompt: ما «اللَّهُوبة» في المطبخ اليمني؟
  answer: عصيدة رقيقة شبه سائلة تُصنع للأطفال الرضّع
  others: [خبز رقيق يُخبز على الصاج ويؤكل مع السمن والعسل في الصباح, حساء من اللحم والعظام, حلوى من العسل والسمن]
  note: وتُطبخ في إناء فخاري يسمّى المَلْهَبة، وجمعه ملاهب.
  source: iryani
  page: 817
  status: draft

- id: xw0632
  kind: custom
  prompt: ما «المَرْنَع» عند البئر في الريف اليمني؟
  answer: الممرّ الذي يسير فيه الثور صعودًا وهبوطًا لرفع الماء
  others: [الحوض الذي تشرب منه الدواب بعد رجوعها من المرعى عند الغروب, الحبل الذي يُربط به الدلو, السقف الذي يغطي فوهة البئر]
  note: يسير فيه السّاني مع ثوره أو دابته التي تسني الماء، وجمعه مرانع.
  source: iryani
  page: 365
  status: draft

- id: xw0633
  kind: custom
  prompt: في الأعراس اليمنية، ماذا يفعل الأقارب الذين أغفل العريس دعوتهم فقاموا عليه بـ«العروة»؟
  answer: ينزلون قرب داره ويذبحون ويطعمون الناس كل يوم ليُحرجوه
  others: [يقاطعون العرس ولا يكلّمونه سنة كاملة, يرسلون إليه هدية مضاعفة ويقفون على بابه ليخجلوه أمام ضيوفه, يقيمون عرسًا آخر في اليوم نفسه]
  note: على العريس أن يذبح ويُطعم مثلهم، ويظلون كذلك حتى يتدخل الناس بالصلح.
  source: iryani
  page: 622
  status: draft

- id: xw0634
  kind: custom
  prompt: بماذا يجيب المارّ ليلًا إذا هتف به حارس الوادي في اليمن «الليل ومن؟»
  answer: الليل وأهله
  others: [الله والسلامة, ضيف عابر, صاحب الدار]
  note: يهتف الحارس قبل أن يرمي تحرزًا من أن يكون الصوت لعابر سبيل، فإن لم يُجَب أطلق رميته.
  source: iryani
  page: 923
  status: draft

- id: xw0635
  kind: root
  prompt: المَرْنَنَة
  hint: إطالة النظر، وخاصة في الوجه الجميل
  answer: رَنا يَرْنو
  others: [رَنَّ يَرِنّ, نَوى يَنوي, رَمى يَرْمي]
  note: يرى الإرياني أن أصلها من «رنا يرنو» أي أدام النظر، ولا خصوصية يمنية لها إلا في الصيغة.
  source: iryani
  page: 365
  status: draft

- id: xw0636
  kind: custom
  prompt: ماذا يقصد الحارس في اليمن إذا قال لصاحبه «إني لأسمع وكسة»؟
  answer: أنه سمع حركة أو صوتًا خفيًّا في الليل لا يرى مصدره
  others: [أنه رأى نارًا مشتعلة على الجبل, أنه يشعر بالنعاس الشديد ويريد أن ينام قليلًا حتى يحين دوره, أنه يسمع مطرًا قادمًا من بعيد]
  note: الوكسة نأمة الصوت في هدوء الليل، فيستعد الحارسان للمواجهة ويرميان نحو مصدرها تخمينًا.
  source: iryani
  page: 922
  status: draft

- id: xw0637
  kind: root
  prompt: طَحْنَن
  hint: فلطح الشيء وسوّى سطحه وجعله مدوّرًا
  answer: الطَّحْن
  others: [الطِّحال, الحَنان, الطَّنين]
  note: يرجّح الإرياني أنها من طحنة الحجر، أي تسويته ليُصنع منه مطحن أو مطحنة.
  source: iryani
  page: 584
  status: draft

- id: xw0638
  kind: custom
  prompt: ما «الضاحي» من الأرض الزراعية في اليمن؟
  answer: الأرض التي تعتمد في ريّها على ماء المطر
  others: [الأرض التي تُسقى من البئر, الأرض المتروكة بلا زراعة, الأرض المزروعة بالبن خاصة]
  note: الضاحي عكس الساقي الذي يشرب من غيل جارٍ أو بئر أو مأجل.
  source: iryani
  page: 574
  status: draft

- id: xw0639
  kind: root
  prompt: لَطّ يِلُطّ
  hint: ألصق الشيء بالأرض أو بعرض الجدار
  answer: لاطَ
  others: [لَطَم, لَبَط, لَوى]
  note: يرجّح الإرياني أن أصلها «لاط»، ومنها دعاؤهم «لطّوك» أي أخذتك الجن وألصقتك بصخرة شاهقة.
  source: iryani
  page: 805
  status: draft

- id: xw0640
  kind: custom
  prompt: ما «الزامل» في اليمن؟
  answer: نشيد رجالي حربي واجتماعي بلحن بطيء
  others: [رقصة نسائية في الأعراس, طبل كبير يُقرع في الحرب, أغنية يغنيها المزارع وحده في الحقل]
  note: ليس كل ما ينشده الرجال زاملًا، بل ما كان بلحن مطوّل يناسب السير البطيء، وما سواه يسمى رزفة أو مهيدًا.
  source: iryani
  page: 401
  status: draft

- id: xw0641
  kind: root
  prompt: سَطَل
  hint: الوسخ المتلبّد بالزيت أو الدهن، يقال ثوب سطل
  answer: الصَّدَل
  others: [السَّطْل, السَّدَل, الصَّلْد]
  note: قُلبت الصاد سينًا وانتقل تفخيمها إلى الدال فصارت طاء، وهذا يتكرر في لهجاتهم.
  source: iryani
  page: 541
  status: draft

- id: xw0642
  kind: custom
  prompt: ما «البَرَع» في اليمن؟
  answer: رقص الرجال القوي
  others: [سباق الخيل في الأعياد, نشيد الحصاد الجماعي, لعبة رمي الحجارة]
  note: يرد في المثل «ابترعوا سابر يا اهل داعر»، والبرع رقصة يؤدّيها الرجال.
  source: iryani
  page: 419
  status: draft

- id: xw0643
  kind: custom
  prompt: لماذا يحرص المزارعون في اليمن على «المضاواة» بين ثورَي الحراثة؟
  answer: ليكونا ندّين متساويين فلا يجور القوي على الضعيف
  others: [ليتناوبا على العمل يومًا بيوم فيستريح أحدهما والآخر يحرث الأرض, ليأكلا من علف واحد, ليُباعا معًا بثمن أعلى]
  note: الضويّ المثيل والقرين؛ ويستشهدون بحكم ابن زايد أن الثور إذا زاد بقدر بنانة على قرينه فقد جار عليه.
  source: iryani
  page: 577
  status: draft

- id: xw0644
  kind: custom
  prompt: من «المُصَرَّف» في اعتقاد العامة قديمًا في اليمن؟
  answer: من لا يعمل فيه السلاح والرصاص
  others: [من يُحسن صرف النقود في السوق, من يُصرَف من الجندية لكبر سنه, من يعالج الناس بالأعشاب]
  note: كانوا يطلقونها على من اشتهر بالشجاعة والنجاة من المخاطر، واليوم تُطلق على السيارة المصفّحة.
  source: iryani
  page: 546
  status: draft

- id: xw0645
  kind: custom
  prompt: إذا سأل يمني عن المطر فقيل له «إنه يروبدها روبدة»، فماذا يعني؟
  answer: أن المطر يضرب الأرض ضربًا شديدًا ويملؤها سيولًا
  others: [أن المطر خفيف لا يبلّ الأرض, أن المطر توقف بعد أن بدأ, أن الغيوم تجمعت فوق الجبال وأظلمت السماء ولم تمطر بعد]
  note: روبد المطرُ الأرضَ أي ضربها بشدة وأفعمها مياهًا وسيولًا.
  source: iryani
  page: 341
  status: draft

- id: xw0646
  kind: root
  prompt: الكُدْوَة
  hint: الشيء الذي يُحصل عليه تسوّلًا أو إحسانًا من واهبه
  answer: التَّكَدِّي
  others: [الكَدَر, الدَّعْوة, الكِسْوة]
  note: يردّها الإرياني إلى التكدّي أي السؤال، لكنها عندهم واوية؛ ومنها اسم «كُدْوة» الشائع.
  source: iryani
  page: 766
  status: draft

- id: xw0647
  kind: custom
  prompt: ما «البيسة» في اليمن قديمًا؟
  answer: جزء من ثمانين جزءًا من الريال
  others: [ربع الريال, عملة من الذهب, مكيال صغير للحبوب]
  note: كانت البيسة من أصغر النقود، وتسمى أيضًا البيزا.
  source: iryani
  page: 277
  status: draft

- id: xw0648
  kind: custom
  prompt: في أسواق اليمن، ما السلعة «الناطقة»؟
  answer: الرائجة التي يُقبل عليها المشترون
  others: [التي يُنادى عليها بصوت عالٍ, التي يُكتب عليها ثمنها, التي تُباع بالمقايضة لا بالمال]
  note: يقال نطقت السلعة إذا راجت وبيعت، والسلعة غير الناطقة هي الكاسدة.
  source: iryani
  page: 871
  status: draft

- id: xw0649
  kind: custom
  prompt: في المناطق اليمنية التي ينعدم فيها الحطب، ما «الكُبا» أو «الضَّمَج»؟
  answer: أقراص وقود تُصنع من مخلّفات الأنعام بعد عجنها
  others: [حجارة سوداء تُستخرج من الجبال وتُكسّر ثم تُحرق في المواقد, جذوع نخيل يابسة تُقطّع للنار, أغصان شوك تُجمع من الوديان]
  note: تُعجن المخلفات وتُداس بالأرجل في حفرة تسمى الموبنة، ثم تُقطّع أقراصًا مدوّرة.
  source: iryani
  page: 893
  status: draft

- id: xw0650
  kind: root
  prompt: القِلْقِلَة
  hint: الرأس، كقولهم «خذ ما أعدك به من هذه القلقلة» مع الإشارة إلى الرأس
  answer: القُلّة
  others: [القَلَق, القِلادة, القَلْب]
  note: يردّها الإرياني إلى «القُلّة» وهي أعلى الشيء، فالرأس قلّة الجسد.
  source: iryani
  page: 738
  status: draft

- id: xw0651
  kind: custom
  prompt: في عمل البناء بالطين في اليمن، ما «الدِّيل»؟
  answer: مدماك الطين، والطبون تتكون من ثلاثة منه
  others: [القالب الخشبي الذي يُصبّ فيه الطين, الحبل الذي يقاس به ارتفاع الجدار, السقف المصنوع من جذوع الشجر]
  note: الديول منحنية دائرية، ومنه قولهم في الزراعة، إذا أصبحت السماء ديولًا ديولًا فأبشر بغزر السيول.
  source: iryani
  page: 321
  status: draft

- id: xw0652
  kind: custom
  prompt: لماذا يقول المشتري اليمني للبائع «اطرح نخسك»؟
  answer: ليطلب منه ألّا يتبع ما باعه بنفسٍ غير راضية
  others: [ليطلب منه أن يُنقص الثمن قليلًا مراعاةً لحال المشتري, ليطلب منه أن يُقسم على جودة البضاعة, ليطلب منه أن يحمل البضاعة إلى بيته]
  note: النَّخْس في اللهجة نفخة نفسٍ قد تكون خبيثة كالعين، فيخشى المشتري أن يصيب البائعُ ما باعه بها.
  source: iryani
  page: 854
  status: draft

- id: xw0653
  kind: custom
  prompt: لماذا تضع المرأة الريفية في اليمن «الشُّوذة» على رأسها؟
  answer: لتحمل عليها جرة الماء ونحوها فتستقر ولا تؤذي رأسها
  others: [لتتقي بها حرّ الشمس في الحقل وتمسح بها العرق عن جبينها, لتزيّن بها شعرها في الأعراس, لتربط بها الحطب الذي تجمعه]
  note: الشوذة طوق صغير من الخِرَق أو الأغصان المضفورة، وتسمى أيضًا المَشْوَذ.
  source: iryani
  page: 524
  status: draft

- id: xw0654
  kind: custom
  prompt: ما «لَسِيس مفتاح السنة» في اليمن؟
  answer: وجبة من جميع أنواع الحبوب المسلوقة تؤكل أول السنة الهجرية طلبًا للبركة
  others: [مفتاح البيت الجديد يُعلّق يوم العيد, أول حصاد يُهدى إلى الجيران, دعاء طويل يقرؤه الأب على أولاده ليلة رأس السنة الهجرية ليحفظهم من كل سوء]
  note: تُخلط فيها الحبوب كالبرّ والذرة والشعير والعدس والفول، ويرون أن من قصّر فيها نُزعت عنه البركة.
  source: iryani
  page: 802
  status: draft

- id: xw0655
  kind: custom
  prompt: في اليمن، أيّ أباريق قهوة القشر يوصف بأنه «ناجح»؟
  answer: الذي غُلي جيدًا
  others: [الذي أُضيف إليه السكر, الذي بقي من الأمس, الذي صُبّ في الفناجين]
  note: النَّجاح في لهجات اليمن نضج الطعام وتمام استوائه، فالقهوة الناجحة هي المغلية جيدًا.
  source: iryani
  page: 850
  status: draft

- id: xw0656
  kind: custom
  prompt: ما «الجَبْح» في لهجات اليمن؟
  answer: قفير النحل الذي يعسل فيه
  others: [برج الحمام فوق البيت, مخزن الحبوب تحت الأرض, قِربة الماء من الجلد]
  note: يُصنع الجبح أسطوانيًّا من اليراع أو الأغصان اللينة أو الطين، وتُترك فيه فتحة لدخول النحل.
  source: iryani
  page: 117
  status: draft

- id: xw0657
  kind: custom
  prompt: ما «الهَلِيلة» عند اليمنيين؟
  answer: ريح شرقية لينة تهب صيفًا وتبشّر بالخير
  others: [ريح عاصفة تسبق السيل, مطر خفيف متقطّع يسقط في ليالي الشتاء الباردة, حرّ شديد يذبل الزرع]
  note: الهليلة صفة للريح الرخاء الهيّنة، وقد ذكرها ابن زايد في أحكامه.
  source: iryani
  page: 948
  status: draft

- id: xw0658
  kind: custom
  prompt: من «القَعْث» عند القرود في اليمن؟
  answer: الذكر الأكبر الأقوى الذي يتحكم في مجموعته
  others: [القرد الصغير الذي يحرس الجماعة, الأنثى التي تقود القطيع, القرد العجوز المطرود من الجماعة الذي يعيش وحيدًا على أطراف الوادي]
  note: القعث كبير الرباح، ويكون في كل مجموعة من عشرة إلى عشرين قعث يهيمن عليها.
  source: iryani
  page: 729
  status: draft

- id: xw0659
  kind: custom
  prompt: في اليمن، لمن تُصنع عصيدة «الخُلْم» التي لا يهتمون بإنضاجها؟
  answer: للبقرة إذا ولدت
  others: [للنفساء بعد الولادة, للمسافر قبل خروجه, للحصّادين في الحقل]
  note: الخُلْم في الأصل العصيدة التي لم تنضج بعد، وسُمّيت بها عصيدة البقرة الوالدة لأنها لا تحتاج إلى الإنضاج الذي يحتاجه طعام الناس.
  source: iryani
  page: 246
  status: draft

- id: xw0660
  kind: root
  prompt: مَقَل
  hint: يقال مقل فلانٌ فلانًا أي نظر إليه وراقبه من حيث لا يشعر (اليمن)
  answer: المُقْلة
  others: [المَقْت, القِلّة, المِقْلاة]
  note: يردّها الإرياني إلى «المُقلة» أي شحمة العين، فالفعل معناه النظر والمراقبة.
  source: iryani
  page: 834
  status: draft
