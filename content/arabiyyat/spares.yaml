  others: [سياط الجلد التي يحملها سائقو العربات, الأحزمة الجلدية التي يلبسها الرجال, اللجم والأرسان التي توضع على الخيل]
  note: كان يقطع الجلد على شكل معلوم ويبطّنه بجلد خفيف ثم يبيعه للقباقيبية، وتروج حرفته لرواج القبقاب في الشام.
