  prompt: في دمشق قديمًا، بماذا كان «الجرّاد» يتّجر؟
  answer: بثياب الأعراب والبدو وحاجاتهم
  others: [بالجراد المجفّف المملّح للأكل, بالخيل العربية الأصيلة, بجلود الإبل المدبوغة]
  note: كان هؤلاء التجار يقيمون سوقًا من الخيام في المزيريب عند خروج الحاج، يبيعون فيه العبي والكوفيات والعُقُل.
