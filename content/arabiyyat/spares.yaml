- id: xw0432
  kind: custom
  prompt: لماذا سُمّيت «الصينية الديوانية» في بيوت بغداد بهذا الاسم؟
  answer: نسبة إلى غرفة الضيوف، لأنها تُستعمل للضيوف
  others: [نسبة إلى مدينة الديوانية التي كانت تُصنع فيها قديمًا, لأن موظفي الديوان كانوا يأكلون عليها, لأنها تُستعمل في المناسبات الرسمية فقط]
  note: هي أكبر الصواني، يبلغ قطرها نحو عشرة أقدام، تُنصب إذا كثر أفراد الأسرة أو الضيوف، ويجلسون حولها على «التختة» أو «المندر».
  source: hijiyya
  page: 83
