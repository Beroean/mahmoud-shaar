  answer: هله
  others: [جاره, غنمه, صاحبه]
  note: «هله» أي أهله؛ بعه بأبخس ثمن، فالكلب الذي يسرق طعام أهله بدل أن يحرسهم لا قيمة له. يقال لما يُزهد فيه.
  source: abboudi_amthal
  page: 272
  volume: ج١
  status: draft

- id: xs0222
  kind: saying
  prompt: يسوى عداله ___
  answer: ذهب
  others: [فضه, تمر, حنطه]
  note: أي يساوي وزنه ذهبا؛ يقال لعظيم القدر. ونقيضه قولهم «ما يسوى فص بصل».
  source: abboudi_amthal
  page: 1728
  volume: ج٥
  status: draft

- id: xs0223
  kind: saying
  prompt: نبي قفّتنا بلا ___
  answer: عنب
  others: [تمر, رطب, تين]
  note: «القفّة» وعاء الفاكهة؛ أي نريد قفتنا التي وعدتم أن تملؤوها عنبا ولو عادت فارغة. يقال لمن رضي من الغنيمة بالإياب.
  source: abboudi_amthal
  page: 1497
  volume: ج٤
  status: draft

- id: xs0224
  kind: saying
  prompt: وادٍ جرى، لا بد يجري من ___
  answer: الحيا
  others: [الضحى, الشمال, الجبل]
  note: «الحيا» المطر؛ الوادي الذي سال مرة لا بد أن يسيل ثانية ولو بعد أعوام. يقال في التحذير من البناء في مجرى السيل، وفي الأمل بعودة الخير.
  source: abboudi_amthal
  page: 1540
  volume: ج٤
  status: draft

- id: xs0225
  kind: saying
  prompt: مثل دسّاس يده بالـ___
  answer: جحر
  others: [نار, قدر, ماء]
  note: كمن يدخل يده في جحر لا يدري ما فيه؛ يقال لمن يدخل في أمر غير مأمون العاقبة. وأصله قديم عند العرب.
  source: abboudi_amthal
  page: 1324
  volume: ج٤
  status: draft

- id: xs0226
  kind: saying
  prompt: ما يذبح الثور إلا ___؟
  answer: عنتر
  others: [الجزّار, القصّاب, الفارس]
  note: 'استفهام إنكاري: في كل جماعة شجاع يقدر على الثور الهائج، وليس ذلك مقصورا على عنترة العبسي.'
  source: abboudi_amthal
  page: 1283
  volume: ج٣
  status: draft

- id: xs0227
  kind: saying
  prompt: من أرّث ما ___
  answer: مات
  others: [نسي, خاب, ضاع]
  note: من ترك ولدا يرث صفاته وأخلاقه فكأنه لم يمت؛ يقال في أهمية الولد.
  source: abboudi_amthal
  page: 1391
  volume: ج٤
  status: draft

- id: xs0228
  kind: saying
  prompt: شبّاب ___
  answer: نار
  others: [ضيف, حرب, ليل]
  note: «شبّاب» صيغة مبالغة من شبّ النار أي أوقدها؛ يقال في مدح الكريم الذي لا تنطفئ ناره لإعداد الطعام للضيوف.
  source: abboudi_amthal
  page: 665
  volume: ج٢
  status: draft

- id: xs0229
  kind: saying
  prompt: يا زين اللحيم، وقرض ___
  answer: العظيم
  others: [الرغيف, الخبيز, الكعيك]
  note: «اللحيم» و«العظيم» تصغير اللحم والعظم؛ كان أكل اللحم وقرض العظم من الأماني الحلوة قبل الرخاء، فيقال في تمني الطعام اللذيذ.
  source: abboudi_amthal
  page: 1640
  volume: ج٥
  status: draft

- id: xs0230
  kind: saying
  prompt: اليد مع اليد ___
  answer: بركه
  others: [قوّه, راحه, سلامه]
  note: في اجتماع الأيدي بركة؛ يقال في الحث على التعاون، وفي الدعوة إلى المشاركة في الطعام.
  source: abboudi_amthal
  page: 1709
  volume: ج٥
  status: draft

- id: xs0231
  kind: saying
  prompt: ما تجوزش صدقه وهلها ___
  answer: جياع
  others: [شباع, غايبين, نايمين]
  note: «هلها» أهلها؛ لا يجوز للإنسان أن يتصدق بشيء يحتاج إليه أهله.
  source: mughniyya
  page: 480
  status: draft

- id: xs0232
  kind: saying
  prompt: المليح ___
  answer: يبطى
  others: [يسبق, يطير, يذوب]
  note: «يبطى» يبطئ؛ الشيء الجيد يحتاج إلى وقت، فأنجز أعمالك بروية وتمهل.
  source: mughniyya
  page: 516
  status: draft

- id: xs0233
  kind: saying
  prompt: الاسم ___ صاحبه
  answer: نص
  others: [ربع, ضد, ظل]
  note: «نص» نصف؛ الاسم أو اللقب يكشف كثيرًا من صفات صاحبه وأخلاقه.
  source: mughniyya
  page: 158
  status: draft

- id: xs0234
  kind: saying
  prompt: يمين ___
  answer: بحاره
  others: [قاضي, شيخ, تاجر]
  note: يقال في القَسَم الباطل الذي لا يُعوَّل عليه.
  source: mughniyya
  page: 576
  status: draft

- id: xs0235
  kind: saying
  prompt: حط راسك بين الروس وقول يا ___ الروس
  answer: قطاع
  others: [عداد, حلاق, صانع]
  note: ضع رأسك مع رؤوس الناس، فما يصيبهم يصيبك ولن تكون وحدك؛ يقال في الاتكال والسلبية، أو في التضامن.
  source: mughniyya
  page: 236
  status: draft

- id: xs0236
  kind: saying
  prompt: يموت ___ وصبعه يرف
  answer: الزمار
  others: [النجار, الخياط, الحداد]
  note: «صبعه» إصبعه، و«يرف» يتحرك؛ من داوم على شيء زمنًا طويلًا اعتاده وصعب عليه تركه، في سلطان العادة.
  source: mughniyya
  page: 576
  status: draft

- id: xs0237
  kind: saying
  prompt: ابن آدم ___ نفسه
  answer: طبيب
  others: [خياط, حارس, سجان]
  note: الإنسان أعرف الناس بما ينفعه وما يضره، فعلاجه في يده؛ ويقال في الدعوة إلى الاعتدال والوقاية.
  source: mughniyya
  page: 68
  status: draft

- id: xs0238
  kind: saying
  prompt: راقد الريح ينبح عليه الكلب في ___
  answer: السوق
  others: [الليل, الحوش, الخلا]
  note: «راقد الريح» سيئ الحظ؛ كلب السوق يألف الناس ولا يلتفت إليهم، لكنه ينبح على هذا التعيس من بين المئات.
  source: mughniyya
  page: 283
  status: draft

- id: xs0239
  kind: saying
  prompt: خطاف زي طير ___
  answer: البحر
  others: [الليل, الجبل, البيت]
  note: يقال للماهر في خطف الأشياء وإخفائها بسرعة، تشبيهًا بطائر البحر الذي يخطف السمك بخفة.
  source: mughniyya
  page: 253
  status: draft

- id: xs0240
  kind: saying
  prompt: كان الحجره قالت يا راسي أمال ___ شنو تقول؟
  answer: الطوبه
  others: [الصخره, الحديده, الرخامه]
  note: «الحجرة» الحجر الصلب، و«الطوبة» الحجر الترابي الهش؛ إذا شكا القوي سوء حاله فماذا يقول الضعيف؟
  source: mughniyya
  page: 426
  status: draft

- id: xs0241
  kind: saying
  prompt: إلي خاف ___
  answer: سلم
  others: [هرب, خسر, ندم]
  note: الحذر الشديد طريق السلامة.
  source: mughniyya
  page: 110
  status: draft

- id: xs0242
  kind: saying
  prompt: الكلمه شهوه وإلا فنجان ___؟!
  answer: قهوه
  others: [حليب, لبن, ماء]
  note: يقال لمن يسترسل في الكلام كما يحلو له دون أن يفكر في عواقب ما يقول.
  source: mughniyya
  page: 450
  status: draft

- id: xs0243
  kind: saying
  prompt: بردك على قيس ___
  answer: جردك
  others: [عمرك, دارك, شعرك]
  note: «الجرد» رداء صوفي؛ ما يصيبك من البرد على قدر طول ردائك أو قصره، فأعدّ عدتك لنوائب الزمن.
  source: mughniyya
  page: 176
  status: draft

- id: xs0244
  kind: saying
  prompt: العطشانه تكسر ___
  answer: الحوض
  others: [السرج, الجرس, الخيمه]
  note: «العطشانة» العطشى؛ تندفع إلى الماء فتحطّم الحوض.
  source: mughniyya
  page: 367
  status: draft

- id: xs0245
  kind: saying
  prompt: المزود ___ ما يحمل من دقيق
  answer: الرقيق
  others: [الكبير, الجديد, المليان]
  note: «المزود» وعاء لحفظ الحبوب؛ يقال لمن لا يعدّ للأمور عدتها المناسبة.
  source: mughniyya
  page: 510
  status: draft

- id: xs0246
  kind: saying
  prompt: ينشيط النار في حطب ___
  answer: الدار
  others: [الجار, الغابه, الوادي]
  note: «يشيط» تشتعل؛ ما يلحق بالجماعات والأوطان من فساد مسؤولة عنه في الدرجة الأولى عوامل من داخلها.
  source: mughniyya
  page: 570
  status: draft

- id: xs0247
  kind: saying
  prompt: إلي يظهر ___ ما يدس البدام
  answer: اللحم
  others: [الخبز, التمر, الزيت]
  note: «يدس» يخفي، و«البدام» المرق؛ من جاد بالكثير الثمين لا يبخل بالقليل التافه.
  source: mughniyya
  page: 146
  status: draft

- id: xs0248
  kind: saying
  prompt: لا تخش العركه بلا رجال ولا تخش السوق بلا ___
  answer: مال
  others: [دليل, صاحب, حمار]
  note: «لا تخش» لا تدخل، و«العركة» المعركة؛ في الدعوة إلى حسن الاستعداد للأمر قبل الإقدام عليه.
  source: mughniyya
  page: 462
  status: draft

- id: xs0249
  kind: saying
  prompt: لا تشبع الأرض من ___ ولا تشبع الودن من الخبر
  answer: المطر
  others: [الزرع, الحجر, الرمل]
  note: كما لا ترتوي الأرض مهما سقط عليها المطر، لا يكف الإنسان عن تسقّط الأخبار والأسرار.
  source: mughniyya
  page: 462
  status: draft

- id: xs0250
  kind: saying
  prompt: بو جمل يستحق لبو ___
  answer: حمار
  others: [حصان, غزال, سبع]
  note: الجمل رمز الغنى والجاه والحمار رمز الضعة والفقر؛ يقال للعزيز الثري يفتقر فيحتاج إلى الوضيع.
  source: mughniyya
  page: 188
  status: draft

- id: xs0251
  kind: saying
  prompt: الراي والدباره خير من الحرث و___
  answer: التجاره
  others: [الصياده, الرعايه, الحداده]
  note: «الدبارة» حسن التدبير؛ العقل والتفكير السليم يحققان ما تعجز عنه الزراعة والتجارة.
  source: mughniyya
  page: 277
  status: draft

- id: xs0252
  kind: saying
  prompt: إلي يخاف من ___ يطلع له
  answer: العفريت
  others: [الذيب, الحنش, العقرب]
  note: يقال لمن تكثر ظنونه وهواجسه؛ فالخوف إذا تمكن من الإنسان جسّم له ما يخشاه كأنه حقيقة.
  source: mughniyya
  page: 140
  status: draft

- id: xs0253
  kind: saying
  prompt: إلي فيه سر من الديوك ___
  answer: يذن
  others: [يطير, ينقر, يبيض]
  note: «يذن» أي يؤذّن؛ من ورث شيئًا من الديك صاح كما يصيح، فالابن على صفات أبيه ومزاياه.
  source: mughniyya
  page: 122
  status: draft

- id: xs0254
  kind: saying
  prompt: خانب وفيده ___
  answer: شمعه
  others: [حبل, عصا, سكين]
  note: «فيده» في يده؛ لص يحمل شمعة مضاءة، يقال لمن يحاول إخفاء أمر ظاهر.
  source: mughniyya
  page: 247
  status: draft

- id: xs0255
  kind: saying
  prompt: نام بدرى وإصحى بدرى تأتيك ___ بدون ما تدرى
  answer: الصحة
  others: [الضيوف, الأفراح, الأخبار]
  note: نصيحة بالتبكير في النوم والاستيقاظ، على عادة الفلاحين قديمًا قبل انتشار الراديو والتلفزيون.
  source: shaalan
  page: 346
  volume: ج٤
  status: draft

- id: xs0256
  kind: saying
  prompt: برمهات روح ___ وهات
  answer: الغيط
  others: [السوق, البحر, الجبل]
  note: برمهات شهر قبطي يأتي بعد الشتاء، وفيه يكتمل طرح المزروعات؛ فاذهب إلى الحقل واجمع منه الثمار.
  source: shaalan
  page: 158
  volume: ج٦
  status: draft

- id: xs0257
  kind: saying
  prompt: البيوت بلّاعة ___
  answer: فلوس
  others: [عيال, ناس, تراب]
  note: تكاليف البيت لا تنتهي، فهو يبتلع المال كما تبتلع البالوعة الماء؛ ومثله «البيوت زي البير».
  source: shaalan
  page: 89
  volume: ج٦
  status: draft

- id: xs0258
  kind: saying
  prompt: عضة ___ ولا نظرة حسد
  answer: أسد
  others: [قطة, فار, حصان]
  note: يعبر عن شدة كراهية الحسد والخوف منه، حتى إن الأذى الجسدي الشديد أهون منه.
  source: shaalan
  page: 498
  volume: ج٦
  status: draft

- id: xs0259
  kind: saying
  prompt: الأصيل يتعاتب أما ___ ما يتعاتبش
  answer: الندل
  others: [الغريب, البخيل, الصغير]
  note: الكريم الأصل يُعاتَب لأن له ضميرًا يوقظه العتاب، أما الخسيس فلا جدوى من عتابه.
  source: shaalan
  page: 104
  volume: ج١
  status: draft

- id: xs0260
  kind: saying
  prompt: لو يعلم ___ بحاله ما يجيش الرقص على باله
  answer: القرد
  others: [الجمل, الحمار, الديك]
  note: يقال سخرية من المغرور الذي يغفل عن عيوبه ويحاول الظهور بغير ما هو عليه.
  source: shaalan
  page: 195
  volume: ج٢
  status: draft

- id: xs0261
  kind: saying
  prompt: البطران سكّته ___
  answer: قطران
  others: [سكر, حرير, ورد]
  note: البطران هو من يرفض الفرصة المتاحة طمعًا في الأحسن؛ والمثل يحذره من سوء العاقبة ويدعو إلى القناعة.
  source: shaalan
  page: 321
  volume: ج٦
  status: draft

- id: xs0262
  kind: saying
  prompt: إلبس قدرك لما تنزل ___
  answer: قبرك
  others: [بيتك, سوقك, بلدك]
  note: يدعو إلى الاهتمام بالمظهر اللائق بالمرء إلى آخر لحظة من عمره.
  source: shaalan
  page: 243
  volume: ج٢
  status: draft

- id: xs0263
  kind: saying
  prompt: أبوك أبوك ولو كان ___
  answer: صعلوك
  others: [بعيد, غضبان, عجوز]
  note: يدعو إلى التمسك بالأب والانتساب إليه ولو كان في أدنى السلم الاجتماعي، ويقال لمن يخجل من ذكر أبيه.
  source: shaalan
  page: 75
  volume: ج٦
  status: draft

- id: xs0264
  kind: saying
  prompt: بلدى على مارية وبلد الغير على ___
  answer: قاسية
  others: [عالية, خالية, بالية]
  note: مارية أي لينة؛ فالمصري لا يحب الغربة، ويرى بلده لينًا عليه وبلاد الغير قاسية.
  source: shaalan
  page: 127
  volume: ج٥
  status: draft

- id: xs0265
  kind: saying
  prompt: هاخلّى اللى ما يشترى ___ عليه
  answer: يتفرّج
  others: [يدعى, يصلى, يسأل]
  note: أصله أن من لا يشتري في السوق يكتفي بالفرجة؛ ويقال على سبيل التهديد بفضح الخصم أمام الناس.
  source: shaalan
  page: 252
  volume: ج٢
  status: draft

- id: xs0266
  kind: saying
  prompt: القلّة ___ تعيش أكتر
  answer: المكسورة
  others: [الجديدة, الكبيرة, الملانة]
  note: المرض ليس دليلًا على قرب الموت، فقد يعيش المريض أكثر من السليم؛ لأن الأعمار بيد الله.
  source: shaalan
  page: 381
  volume: ج٦
  status: draft

- id: xs0267
  kind: saying
  prompt: ولا حدّ خالى من الهم حتى ___ فى العلالى
  answer: القمر
  others: [الطير, الحمام, السحاب]
  note: يقوله من ضاق بكثرة الهموم ورأى الدنيا بمنظار أسود، فيعمم أن أحدًا لا يسلم منها.
  source: shaalan
  page: 395
  volume: ج٦
  status: draft

- id: xs0268
  kind: saying
  prompt: المرض يخلّى ___ يدل
  answer: الجمل
  others: [الفار, العصفور, الكتكوت]
  note: «يدل» أي يذل وينكسر؛ فالمرض يكسر نفس أقوى الكائنات. سمعه المؤلف من حارس عمارة من أسيوط.
  source: shaalan
  page: 395
  volume: ج٦
  status: draft

- id: xs0269
  kind: saying
  prompt: اللى عايز يرقص لازم له ___
  answer: طبلة
  others: [فستان, كرسى, شمعة]
  note: الطبلة تضبط إيقاع الراقص، ولا يقدر أحد أن يرقص بدونها؛ فلكل عمل أداته التي لا يقوم إلا بها.
  source: shaalan
  page: 138
  volume: ج٦
  status: draft

- id: xs0270
  kind: saying
  prompt: يخانق ___ وشه
  answer: دبّان
  others: [شعر, عرق, نور]
  note: الدبان هو الذباب؛ ويقال عن الشخص العدواني الشرس الذي يتشاجر مع كل شيء حتى الذباب على وجهه.
  source: shaalan
  page: 220
  volume: ج٦
  status: draft

- id: xs0271
  kind: saying
  prompt: 'قال يا جحا النار فى دارك قال: مادام بعيد عن ___ خلاص'
  answer: هدومى
  others: [بيتى, جيبى, بلدى]
  note: يسخر المثل ممن لا يهتم إلا بما يمسه مباشرة، فيرى النار في داره ولا يبالي ما دامت لم تصل إلى ثيابه.
  source: shaalan
  page: 246
  volume: ج٣
  status: draft

- id: xs0272
  kind: saying
  prompt: كله بالسيف إلا الهوى ___
  answer: بالكيف
  others: [بالمال, بالعين, بالصبر]
  note: «بالكيف» أي بالرغبة الحرة؛ فكل شيء قد يُنال بالقوة إلا الحب. وقد ورد المثل في مسلسل «الدوائر المغلقة».
  source: shaalan
  page: 40
  volume: ج٦
  status: draft

- id: xs0273
  kind: saying
  prompt: حجة البليد مسح ___
  answer: التختة
  others: [الكراسة, الطاولة, الشباك]
  note: التختة هي السبورة؛ والتلميذ الكسول يتطوع لمسحها حتى يتهرب من تسميع الدرس.
  source: shaalan
  page: 143
  volume: ج٦
  status: draft

- id: xs0274
  kind: saying
  prompt: يستخبّى من ___ ويروح لحضن الأسد المفترس
  answer: القطة
  others: [الفار, العصفورة, الأرنب]
  note: سخرية من الجبان المتهور الذي يهرب من الخطر الصغير فيقع في الخطر الأكبر.
  source: shaalan
  page: 188
  volume: ج٥
  status: draft

- id: xs0275
  kind: saying
  prompt: اتّق الله فى صنعتك ولو كنت ___
  answer: حرامى
  others: [فقير, تاجر, غريب]
  note: الجزء الأخير مبالغة لا يُقصد ظاهرها؛ والمعنى الدعوة إلى الإخلاص والإتقان في أي عمل يقوم به المرء.
  source: shaalan
  page: 289
  volume: ج٦
  status: draft

- id: xs0276
  kind: saying
  prompt: ياللى معاكوا البكالوريوس يدوبك تركبوا ___
  answer: الأوتوبوس
  others: [التاكسى, الحنطور, العجلة]
  note: يتندر المثل بفقر الجامعيين وتدني أجور الموظفين، فالشهادة العالية لا تكفي إلا لركوب الحافلة.
  source: shaalan
  page: 73
  volume: ج٥
  status: draft

- id: xs0277
  kind: saying
  prompt: اللى ياكل ملوخية فى ___ يجيب لبطنه طبيب
  answer: أبيب
  others: [طوبة, برمهات, أمشير]
  note: أبيب شهر قبطي في الصيف، ويُعتقد أن نبات الملوخية يصاب فيه بآفة العطن فيسبب المرض لمن يأكله.
  source: shaalan
  page: 158
  volume: ج٦
  status: draft

- id: xs0278
  kind: saying
  prompt: نقطة على نقطة تملأ ___
  answer: الزير
  others: [البحر, الترعة, البير]
  note: يدعو إلى الحرص والمثابرة؛ فالقليل إذا تتابع صار كثيرًا.
  source: shaalan
  page: 317
  volume: ج٦
  status: draft

- id: xu0001
  kind: usage
  prompt: خليك فى حالك.. هو أنا خدت مالك؟
  answer: عبارة تُكتب على السيارات لرد عين الحاسد
  others: [عبارة يقولها المدين لدائنه حين يطالبه, عبارة يقولها البائع للمشتري المتردد, عبارة يقولها الجار لجاره عند الخصام]
  note: يدعو الحاسد إلى ترك النظر بحقد إلى ما عند الآخرين، فصاحب السيارة لم يأخذ من ماله شيئًا.
  source: shaalan
  page: 396
  volume: ج٤
  status: draft

- id: xu0002
  kind: usage
  prompt: هنبقى لبانة فى حنك الناس
  answer: يقال خوفًا من أن تصير سيرتنا على كل لسان
  others: [يقال لمن يكثر الأكل بين الوجبات بلا جوع, يقال لمن يتكلم كثيرًا بلا فائدة ولا معنى, يقال لمن يتملق الناس ليرضوا عنه]
  note: الحنك هو الفم؛ والناس يلوكون سيرة من افتُضح أمره كما يلوكون اللبان.
  source: shaalan
  page: 366
  volume: ج٢
  status: draft

- id: xu0003
  kind: usage
  prompt: اللى يمشى ورا كلام الناس يتعب
  answer: يقال لمن يتبع آراء الناس المتناقضة
  others: [يقال لمن ينقل كلام الناس ويفسد بينهم, يقال لمن يكثر المشي في الأسواق بلا حاجة, يقال لمن لا يسمع نصيحة أحد من أهله]
  note: كلام الناس متناقض، ومن يتبعه يرتبك ويتشتت؛ فالمثل يدعو إلى الثقة بالنفس.
  source: shaalan
  page: 366
  volume: ج٢
  status: draft

- id: xu0004
  kind: usage
  prompt: الجسم جسم فيل والعقل عقل عصفورة
  answer: يقال سخريةً ممن ضخم جسمه وصغر عقله
  others: [يقال لمن يأكل كثيرًا ولا يسمن, يقال لمن يجمع بين القوة والذكاء, يقال لمن يخاف من أصغر الأشياء]
  note: من أساليب السخرية؛ يقارن بين ضخامة الفيل وصغر العصفورة ليصف من كبر بدنه وخف عقله.
  source: shaalan
  page: 156
  volume: ج٢
  status: draft

- id: xu0005
  kind: usage
  prompt: الدنيا تلاهى
  answer: يقال في أن المشاغل تلهي الناس عن غيرهم
  others: [يقال في أن الأطفال لا يملّون من اللعب, يقال في أن الغني لا يشبع من المال, يقال في أن السفر يُنسي المرء همومه]
  note: تلاهي جمع ملهاة؛ أي إن الدنيا شغلت الناس بأنفسهم فانقطع السؤال بينهم.
  source: shaalan
  page: 451
  volume: ج٤
  status: draft

- id: xu0006
  kind: usage
  prompt: الناس بتهنّن عدوها على كتفها
  answer: يقال عمن يلاطف عدوه لأنه لا يقدر على مواجهته
  others: [يقال عمن يحمل هموم غيره فوق همومه الكثيرة, يقال عمن يرعى أطفال جيرانه كأنهم أولاده, يقال عمن يشمت في عدوه إذا وقع في مصيبة]
  note: هنّن الطفل أي هدهده؛ والمثل ينتقد من يسايس أعداءه ويرضيهم بكل طريقة لأنه عاجز عن مقاومتهم.
  source: shaalan
  page: 156
  volume: ج٢
  status: draft

- id: xu0007
  kind: usage
  prompt: بينهم بعد السما عن الأرض
  answer: يقال عن شدة التباعد بين شخصين
  others: [يقال عن المسافر الذي طال غيابه, يقال عن الطائرة التي ارتفعت في الجو, يقال عن الفقير الذي يحلم بالغنى]
  note: من صيغ المبالغة في وصف التباعد الشديد بين الطرفين.
  source: shaalan
  page: 221
  volume: ج٦
  status: draft

- id: xu0008
  kind: usage
  prompt: أصلك يرد عليك
  answer: يقال في أن الأصل الكريم يمنع من التمادي
  others: [يقال لمن يعود إلى بلده بعد غربة طويلة, يقال لمن يرد الإساءة بمثلها, يقال لمن يتبرأ من أهله وأقاربه]
  note: يؤمن الناس بأن أصل الشخص وتربيته يتدخلان في سلوكه، فإن مال إلى الشر رده أصله الطيب.
  source: shaalan
  page: 104
  volume: ج١
  status: draft

- id: xu0009
  kind: usage
  prompt: كل بلد وله سلو
  answer: يقال في أن لكل بلد عاداته وتقاليده الخاصة
  others: [يقال في أن الغريب لا يرتاح إلا في بلده, يقال في أن الحاكم يتغير بتغير البلد, يقال في أن الرزق يختلف من بلد إلى بلد]
  note: السِّلو هو الطبع والعادة؛ فلكل بلد عاداته في اللباس والأزياء والأعراف.
  source: shaalan
  page: 306
  volume: ج٢
  status: draft

- id: xu0010
  kind: usage
  prompt: استعدل ولا تستعجل
  answer: يقال نصحًا بالتأني وترك التسرع
  others: [يقال لمن يجلس جلسة معوجة في المجلس, يقال لمن يتأخر في سداد دينه, يقال لمن يغيّر رأيه كل يوم]
  note: التأني يؤدي إلى نتائج طيبة، فالأفضل الانتظار حتى تأتي الفرصة المناسبة؛ وفي معناه «من تأنى نال ما تمنى».
  source: shaalan
  page: 98
  volume: ج١
  status: draft

- id: xu0011
  kind: usage
  prompt: احنا ياما هدّينا جبال
  answer: يقال في التفاخر بالقوة وكثرة الإنجاز
  others: [يقال في الشكوى من كثرة التعب وقلة الأجر, يقال في التحذير من هدم ما بناه الآباء, يقال في وصف من يبدد ماله في البناء والهدم]
  note: تعبير فيه اعتداد بالنفس ومبالغة، وقد يحمل معنى الغرور.
  source: shaalan
  page: 126
  volume: ج٢
  status: draft

- id: xu0012
  kind: usage
  prompt: ولد ما جابيتوش ولّادة
  answer: يقال إعجابًا بشخص بارع لا مثيل له
  others: [يقال عن الطفل الذي يشبه أباه كثيرًا, يقال عن الابن العاق الذي ينكر أمه, يقال عن اليتيم الذي رباه غير أهله]
  note: من صيغ المبالغة؛ فكأن أمًا لم تلد مثله قط، وكلمة «ولد» هنا للإعجاب والإكبار.
  source: shaalan
  page: 266
  volume: ج٤
  status: draft

- id: xu0013
  kind: usage
  prompt: هزّ كتافه
  answer: يقال عمن أظهر عدم الاهتمام بالأمر
  others: [يقال عمن فرح بالخبر فرقص طربًا, يقال عمن حمل حملًا ثقيلًا وحده, يقال عمن وافق على الأمر بحماس]
  note: هز الكتفين حركة تعني «وأنا مالي»، وتدل على الرفض أو الدهشة أو قلة المبالاة.
  source: shaalan
  page: 246
  volume: ج٣
  status: draft

- id: xu0014
  kind: usage
  prompt: الشغل على ودنه
  answer: يقال عن العمل المستمر المتواصل دون راحة أو توقف
  others: [يقال عن العمل الذي يُنجز بالتنصت على الآخرين وأسرارهم, يقال عن العمل المتعطل الذي لم يبدأ بعد, يقال عن العمل الذي يتم بالأوامر دون فهم]
  note: «على ودنه» تعبير شعبي يعني أن الشيء مستمر لا ينقطع.
  source: shaalan
  page: 143
  volume: ج٦
  status: draft

- id: xu0015
  kind: usage
  prompt: شحّات وقليط
  answer: يقال للمحتاج الذي يتكبر على من يعطيه
  others: [يقال للفقير الذي يكثر من الأولاد, يقال للغني الذي يتظاهر بالفقر أمام الناس, يقال لمن يتسول وهو قادر على العمل]
  note: القليط عند العامة هو المغرور غير المتواضع؛ وفي معناه «حسنة وأنا سيدك».
  source: shaalan
  page: 131
  volume: ج٤
  status: draft

- id: xu0016
  kind: usage
  prompt: الطلق اللى ما يصبش يدوّش
  answer: يقال في أن الإشاعة تؤذي صاحبها ولو لم تكن صحيحة
  others: [يقال في أن المحاولة الفاشلة لا تضر أحدًا, يقال في أن الصوت العالي لا يدل على شجاعة صاحبه, يقال في أن الصياد الماهر لا يخطئ هدفه]
  note: الطلق هو طلقة البندقية، فإن لم تصب أحدًا أزعجت بصوتها من يسمعها؛ وكذلك الإشاعة الكاذبة تسيء إلى صاحبها.
  source: shaalan
  page: 431
  volume: ج٣
  status: draft

- id: xu0017
  kind: usage
  prompt: إتكلّم وفشّر ولا تقعدش مكشّر
  answer: يقال حثًّا على البشاشة ولو بالمبالغة
  others: [يقال ذمًّا للكذاب الذي يبالغ في حكاياته, يقال لمن يجلس صامتًا في العزاء, يقال لمن يغضب من المزاح والضحك]
  note: فشّر أي هوّل وبالغ؛ والمثل يفضّل الكلام ولو فيه مبالغة على التجهم أمام الناس.
  source: shaalan
  page: 198
  volume: ج٥
  status: draft

- id: xu0018
  kind: usage
  prompt: أقرب السكك خالصها
  answer: يقال في الحث على سلوك أقصر الطرق إلى الغاية
  others: [يقال في ذم من يستعجل الربح فيخسر رأس ماله, يقال في مدح من يسدد ديونه قبل أن يُطالَب بها, يقال في لوم من يقطع صلته بجيرانه الأقربين]
  note: السكة هي الطريق؛ والمعنى أن من يقصد غاية فليبحث عن أقرب طريق إليها يعرفه ليبلغها بسهولة.
  source: shaalan
  page: 110
  volume: ج١
  status: draft

- id: xu0019
  kind: usage
  prompt: اللى ما شاف ولا فنّ شاف أى حاجة اتجنن
  answer: يقال عن قليل التجربة ينبهر بأي شيء
  others: [يقال عن الأعمى الذي يتمنى أن يرى, يقال عن الفنان الذي لا يقدّره أحد, يقال عن الغني الذي لا يعجبه شيء]
  note: يدعو المثل إلى المعرفة وسعة الاطلاع؛ فمن لم ير شيئًا في حياته لا يقدر على التمييز إذا رأى ما يدهشه.
  source: shaalan
  page: 138
  volume: ج١
  status: draft

- id: xu0020
  kind: usage
  prompt: الحكومة بتعرف دبّة النملة
  answer: يقال عن قوة السلطة ومعرفتها بكل شيء
  others: [يقال عن بطء الإجراءات الحكومية, يقال عن الموظف الذي ينشغل بالتفاهات, يقال عن إهمال الدولة لشؤون الفقراء]
  note: دبة النملة صوت خطوتها؛ والعبارة تشير إلى قبضة الإدارة المركزية على مقدرات الناس.
  source: shaalan
  page: 127
  volume: ج٥
  status: draft

- id: xu0021
  kind: usage
  prompt: الفلوس تجيب فلوس
  answer: يقال في أن المال إذا استُثمر زاد ونما
  others: [يقال في أن المال الحرام يذهب سريعًا, يقال في أن الغني يزداد بخلًا كلما زاد ماله, يقال في أن الدَّين يجر دينًا آخر]
  note: المثل تجاري يعبر عن تراكم رأس المال؛ فمن يملك المال يقدر على اغتنام الفرص فيربح أكثر.
  source: shaalan
  page: 276
  volume: ج٢
  status: draft

- id: xu0022
  kind: usage
  prompt: ذي ما معه همّه يحب الدمّه
  answer: لمن ينصرف عن واجباته وينشغل بشيء آخر
  others: [لمن يرفق بالحيوان أكثر من الناس, لمن لا يملك مالًا فيكتفي بالقليل, لمن يحب الهدوء ويكره الزحام]
  note: من لا هَمّ له يقضي وقته في ملاعبة القطة ومسحها، فيُعيَّر بذلك.
  source: iryani
  page: 309
  flag: 'answer may be wrong: The book gives no explicit usage line under this saying; the answer''s wording sits in an OCR-merged passage just before it, so the link is likely but not certain.'draft

- id: xu0023
  kind: usage
  prompt: احزب به ولا تحرب به
  answer: فيمن منظره يصلح للمباهاة وهو ضعيف عند الشدائد
  others: [فيمن يعير ثيابه للناس ويبقى بلا ثوب, فيمن يُحسن الحرب ولا يُحسن الكلام, فيمن يتزيّن في الأعياد فقط ويهمل مظهره سائر أيام السنة]
  note: أي تزيّن به وتباهَ، ولا تعتمد عليه في الحرب.
  source: iryani
  page: 174
  flag: 'answer may be wrong: Could not confirm the answer: the book''s explanation is missing from the OCR text.'draft

- id: xu0024
  kind: usage
  prompt: من شطّ بيده رقّع بجلده
  answer: في الجزاء والعقاب، أن يتحمّل المرء عاقبة فعله
  others: [في الحث على إصلاح الثياب الممزقة وترقيعها بدل رميها, في أن الصانع الماهر يعمل بيده, في أن الفقير يلبس ما يجده]
  note: شطّ الثوب أي مزّقه؛ فمن مزّق شيئًا بيده دفع ثمنه من جلده.
  source: iryani
  page: 491
  flag: 'answer may be wrong: Could not confirm the answer: the usage line is missing from the OCR text.'draft

- id: xu0025
  kind: usage
  prompt: ذكرنا القط، طلع ينط
  answer: لمن يحضر فجأة وهم يتحدثون عنه
  others: [لمن يتدخل فيما لا يعنيه, لمن يغضب من أتفه كلمة, لمن يهرب عند أول خطر]
  note: يشبه قول الناس «جبنا سيرته فجاء»، يقال حين يدخل من كان الحديث عنه.
  source: sahli
  page: 153
  status: draft

- id: xu0026
  kind: usage
  prompt: دار بتصفر فيها الريح
  answer: للبيت الواسع الذي خلا من سكانه
  others: [للبيت الذي يكثر فيه الضيوف, للبيت المبني على رأس جبل تهب عليه الرياح, للبيت الضيق الذي لا هواء فيه]
  note: لا أحد فيه، فلا يُسمع إلا صفير الريح.
  source: sahli
  page: 145
  status: draft

- id: xu0027
  kind: usage
  prompt: إلهدية بتيجي محملة على بس، وبتروح محملة على جمل
  answer: لمن يُهدى إليه شيء فيرده أضعافا
  others: [لمن يرسل هداياه مع غيره, لمن يرفض الهدايا من الناس, للتاجر الذي ينقل بضاعته على الجمال]
  note: تأتي الهدية على قطة، وتعود محمولة على جمل.
  source: sahli
  page: 343
  status: draft

- id: xu0028
  kind: usage
  prompt: اشتهينا الجاجه وأكلناها بريشها
  answer: لمن ينال ما تمناه فيسيء استعماله
  others: [لمن يعطي جاره من طعامه, لمن يقنع بالقليل من الطعام ويشكر الله عليه, لمن يطبخ طعامه على مهل]
  note: تمنّوا الدجاجة، فلما نالوها أكلوها بريشها ولم يحسنوا الانتفاع بها.
  source: sahli
  page: 28
  status: draft

- id: xu0029
  kind: usage
  prompt: حامل السلم بالعرض
  answer: لمن يحمّل نفسه من الهموم أكثر مما ينبغي
  others: [لمن يتسلق إلى المناصب بسرعة, لمن يتعاون مع جيرانه في البناء, لمن يبني بيته بنفسه ليوفر أجرة البنائين والعمال]
  note: السلم المحمول بالعرض ثقيل ويصطدم بكل شيء، فهو يعقّد الأمر على نفسه.
  source: sahli
  page: 126
  status: draft

- id: xu0030
  kind: usage
  prompt: إلجنازة حامية، والميت كلب
  answer: للضجة الكبيرة حول أمر تافه لا يستحقها
  others: [للخصام الذي ينتهي بالصلح سريعا, لمن يكرم الضيف فوق طاقته حتى يستدين من جيرانه, لمن يستعجل في إنجاز عمله]
  note: جنازة عظيمة وصخب كثير، والفقيد لا يستحق كل ذلك.
  source: sahli
  page: 120
  status: draft

- id: xu0031
  kind: usage
  prompt: بعدنا ما فتينا ولا غمسنا
  answer: لمن ما زال في أول عمله فلا تعرف نتائجه بعد
  others: [لمن يجلس إلى المائدة وهو شبعان, لمن يدعو الناس إلى طعام لا يكفيهم, لمن ينهي عمله قبل موعده ثم يجلس ينتظر الآخرين]
  note: ما زلنا لم نفتّ الخبز ولم نغمسه، أي أن الطعام لم يبدأ بعد.
  source: sahli
  page: 94
  status: draft

- id: xu0032
  kind: usage
  prompt: مهما كانت الصنعة خسيسة، مد الإيدين أخس
  answer: لفضل العمل مهما كان على سؤال الناس
  others: [للصانع الذي يغش في صنعته ليربح أكثر من غيره, لمن يترك حرفته ليتعلم غيرها, لمن يمد يده على غيره بالضرب]
  note: أي عمل خير من أن تمد يدك إلى الناس.
  source: sahli
  page: 329
  status: draft

- id: xu0033
  kind: usage
  prompt: يخزي العين حولك وحواليك
  answer: يقال عند الإعجاب بالصبي خوفا عليه من الحسد
  others: [يقال عند الغضب من ولد شقي, يقال للمسافر عند وداعه دعاء له بالسلامة والعودة, يقال للمريض عند زيارته]
  note: دعاء يرد عين الحاسد عن الطفل.
  source: sahli
  page: 365
  status: draft

- id: xu0034
  kind: usage
  prompt: خذ من عقله وازرع بصل
  answer: لمن كان ضعيف العقل كثير النسيان
  others: [للفلاح الذي يحسن الزراعة, لمن يتعلم من تجارب غيره, لمن يحسن استثمار القليل حتى يصير مالا كثيرا]
  note: عقله قليل كبذور البصل، يقال تهكما بالمغفل.
  source: sahli
  page: 139
  status: draft

- id: xu0035
  kind: usage
  prompt: إللي عنده لحام، ليش يزفر إيديه؟
  answer: لمن يجد من يكفيه مشقة العمل فلا يتعب نفسه
  others: [لمن يأكل اللحم كل يوم, لمن يغسل يديه قبل الطعام, لمن يطبخ لغيره ولا يأكل]
  note: من عنده جزّار يقطع له اللحم لا يلوّث يديه بالدهن.
  source: sahli
  page: 52
  status: draft

- id: xu0036
  kind: usage
  prompt: إللي بضيع الجمل، ما بدور على البردعة
  answer: لمن خسر الكثير فلا يأسف بعده على القليل
  others: [لمن يبحث عن ضالته حتى يجدها, لمن يبيع ما لا يملكه ثم يعجز عن تسليمه للمشتري, لمن يحرص على أصغر أغراضه]
  note: من فقد الجمل كله لا يشغله البحث عن بردعته، فلا يُؤسف على الخسارة الصغيرة بعد الكبيرة.
  source: sahli
  page: 46
  status: draft

- id: xu0037
  kind: usage
  prompt: نجوم السما أقرب لك
  answer: للأمر المستحيل البعيد المنال
  others: [لمن يحب السهر تحت النجوم, للشيء القريب السهل المنال, لمن يرفع صوته في الكلام]
  note: نجوم السماء أقرب إليك من أن تنال هذا.
  source: sahli
  page: 337
  status: draft

- id: xu0038
  kind: usage
  prompt: حبلت في مصر، وولدت في حضني
  answer: لمن تحل به مصائب لا شأن له بها
  others: [لمن يسافر بعيدا في طلب الرزق ثم يعود إلى أهله, لمن يرث مالا من قريب بعيد, لمن يحكي أخبار البلاد البعيدة]
  note: الأمر بدأ بعيدا عنه، ثم انتهى ثقله في حجره.
  source: sahli
  page: 127
  status: draft

- id: xu0039
  kind: usage
  prompt: زي اللي قابر أهله
  answer: لمن يبدو عليه الهم الشديد لسبب تافه
  others: [لمن يحزن على فراق صديق قديم, لمن يزور المقابر كل يوم, لمن يتصدق عن أمواته في الأعياد والمناسبات]
  note: كأنه دفن أهله للتو، وما به إلا أمر صغير.
  source: sahli
  page: 169
  status: draft

- id: xu0040
  kind: usage
  prompt: بحرق حارة، ليولع سكارة
  answer: لمن يسبب خسارة كبيرة لينال منفعة تافهة
  others: [لمن يدخن كثيرا حتى يمرض, لمن ينتقم من جيرانه لأنهم أساؤوا إليه مرة واحدة, لمن يطفئ النار قبل أن تنتشر]
  note: يشعل حيا كاملا ليوقد سيجارة، فالثمن أكبر بكثير من الغاية.
  source: sahli
  page: 83
  status: draft

- id: xu0041
  kind: usage
  prompt: أجينا تنحففها قلعنا عينها
  answer: لمن يريد إصلاح شيء فيفسده
  others: [لمن يبالغ في التجمّل والزينة, لمن يعاقب غيره بقسوة شديدة, لمن يهمل عمله حتى يتلف]
  note: التحفيف تزيين وجه العروس، فإذا انتهى بقلع عينها صار الإصلاح إفسادا.
  source: sahli
  page: 21
  status: draft

- id: xu0042
  kind: usage
  prompt: حلو لسان، وقليل إحسان
  answer: لمن يحلو كلامه ويقل فعله
  others: [لمن يحسن إلى الناس ولا يتكلم, لمن يكثر الشكوى من همومه, لمن يقول الشعر في المناسبات]
  note: كلام معسول بلا عمل يصدّقه.
  source: sahli
  page: 133
  status: draft

- id: xu0043
  kind: usage
  prompt: إلأسى ما بنتسى
  answer: للإساءة البالغة التي لا ينساها المرء أبدا
  others: [للحزن الذي يزول مع مرور الأيام وانشغال المرء بغيره, للفرح الذي يبقى في القلب طويلا, للدين الذي لا يسقط بمرور الزمن]
  note: الأسى هنا الإساءة، والجرح الكبير يبقى في الذاكرة.
  source: sahli
  page: 27
  status: draft

- id: xu0044
  kind: usage
  prompt: هيا الحطب قبل ما خطب، وجاب المغنيات قبل العروس
  answer: لمن يستبق الأمور ويستعد لشيء لم يحصل بعد
  others: [لمن يقيم عرسا كبيرا فوق طاقته, لمن يحسن الإعداد لأعماله, لمن يدعو الناس إلى فرحه]
  note: جمع الحطب للعرس قبل أن يخطب، وجاء بالمغنيات قبل أن يجد العروس.
  source: sahli
  page: 347
  status: draft

- id: xu0045
  kind: usage
  prompt: حزانى ومساكين، واشتروا بعشاهم ياسمين
  answer: للفقير الذي يتظاهر بما ليس عنده
  others: [لمن ينفق ماله على الفقراء, لمن يحزن على فراق أحبابه, لمن يزرع حديقة في بيته]
  note: لا يملكون ثمن العشاء، ثم يشترون به ياسمينا للزينة.
  source: sahli
  page: 128
  status: draft

- id: xu0046
  kind: usage
  prompt: كلب داير، ولا سبع نايم
  answer: لفضل العامل وإن قل شأنه على القاعد وإن عظم
  others: [لمن يحرس بيته من اللصوص بكلب يدور حوله طوال الليل, لمن يكثر التجوال بلا هدف, للشجاع الذي ينام عن عدوه]
  note: من يسعى في طلب رزقه خير ممن يجلس ولو كان قويا.
  source: sahli
  page: 273
  status: draft

- id: xu0047
  kind: usage
  prompt: إلجمل عرقوبه وراه، بشوف عيب غيره، وعيبه ما براه
  answer: لمن يرى عيوب الناس ويعمى عن عيوبه
  others: [لمن يحمل أثقال غيره ولا يشكو, لمن يمشي ببطء ولا يلتفت, لمن يحكم على الناس من مظهرهم]
  note: الجمل لا يرى عرقوبه لأنه خلفه، كذلك المرء لا يرى عيبه.
  source: sahli
  page: 120
  status: draft

- id: xu0048
  kind: usage
  prompt: وقت ما كنت قدك، كنت شامة ع خدك
  answer: للمسن الذي يتباهى بأيام شبابه
  others: [لمن يمدح جمال صاحبه ليتقرب منه وينال رضاه, لمن يتحدى غيره في المصارعة, لمن يندم على كلام قاله]
  note: حين كنت في مثل عمرك كنت كالشامة على الخد جمالا.
  source: sahli
  page: 352
  status: draft

- id: xu0049
  kind: usage
  prompt: من فوله قدموا له
  answer: لمن يكرم الناس من أموالهم
  others: [لمن يطبخ للضيوف طعاما بسيطا, لمن يزرع الفول ويبيعه, لمن يرد الهدية بأحسن منها]
  note: قدموا له الفول الذي جاء هو به، فكان كرمهم من ماله.
  source: sahli
  page: 327
  status: draft

- id: xu0050
  kind: usage
  prompt: قاعد بحضني، وبنتف ذقني
  answer: لمن ينكر المعروف ويسيء إلى من أحسن إليه
  others: [لمن يلازم صاحبه في كل مكان, لمن يتودد إلى الناس ليأخذ منهم, للحلاق الذي لا يتقن عمله فيؤذي زبائنه بالموسى]
  note: أجلسه في حضنه، فجعل ينتف لحيته.
  source: sahli
  page: 245
  status: draft

- id: xu0051
  kind: usage
  prompt: إلصيف أوسع من الشتا
  answer: للصيف تتسع فيه أماكن النوم والسكن
  others: [لمن يكثر السفر في الصيف, لمن يحب الشتاء أكثر من الصيف, للثياب الصيفية الواسعة التي تريح من الحر]
  note: في الصيف ينام المرء حيث شاء، أما الشتاء فيحصره في البيت.
  source: sahli
  page: 197
  status: draft

- id: xu0052
  kind: usage
  prompt: تمسك بنحسك، لا يجيك أنحس منه
  answer: للرضا بما عندك خشية أن يأتي ما هو أسوأ
  others: [لمن يلوم حظه على كل خطأ, لمن يغامر بكل ما يملك طمعا في ربح سريع كبير, لمن يترك عمله ليبحث عن أفضل منه]
  note: قد يكون ما عندك قليلا، لكن تركه قد يأتيك بما هو أشد منه.
  source: sahli
  page: 110
  status: draft

- id: xu0053
  kind: usage
  prompt: اعرفنا بيتكم حياكم الله
  answer: للثقيل الذي يكثر من زيارة الناس
  others: [لمن يرحب بالضيف أول مرة, لمن يضل طريقه إلى بيت صاحبه, لمن ينتقل إلى بيت جديد ويدعو جيرانه لزيارته]
  note: 'يقال تهكما: عرفنا الطريق إلى بيتكم، فصار يزوركم كل حين.'
  source: sahli
  page: 30
  status: draft

- id: xu0054
  kind: usage
  prompt: يا معزي بعد سنة، يا مجدد الأحزان
  answer: للنهي عن التعزية بعد مرور وقت طويل على الوفاة
  others: [لمن يزور المريض بعد شفائه, لمن ينسى مواعيد أصدقائه, لمن يبكي في الأفراح لأنها تذكره بمن فقدهم من أحبابه]
  note: التعزية المتأخرة تفتح الجرح من جديد.
  source: sahli
  page: 363
  status: draft

- id: xu0055
  kind: usage
  prompt: قاعد يسند حيطان
  answer: لمن لا يعمل شيئا ويقضي وقته في الفراغ
  others: [للبنّاء الذي يرمم البيوت القديمة, لمن يساعد جيرانه في البناء, لمن يحرس البيت ليلا ويسهر على راحة أهله]
  note: كأنه يسند الجدران خوفا من سقوطها، وهو في الحقيقة لا يعمل.
  source: sahli
  page: 245
  status: draft

- id: xu0056
  kind: usage
  prompt: وردة بتخلف شوكة، وشوكة بتخلف وردة
  answer: للرجل الصالح قد يلد ولدا سيئا، والعكس كذلك
  others: [لمن يزرع الورد في حديقته, للحب الذي يتحول إلى كره, لمن يجمع بين الطيبة والقسوة]
  note: الأبناء لا يشبهون آباءهم دائما.
  source: sahli
  page: 352
  status: draft

- id: xu0057
  kind: usage
  prompt: هذا اليوم هارب من الصيف
  answer: لليوم الشتوي الذي يأتي حارا على غير عادته
  others: [لليوم البارد في وسط الصيف, لليوم الذي يمر سريعا لكثرة ما فيه من أعمال وأشغال, لمن يهرب من الحر إلى الجبل]
  note: كأن يوما من أيام الصيف هرب فجاء في الشتاء.
  source: sahli
  page: 344
  status: draft

- id: xu0058
  kind: usage
  prompt: إلثلم الاعوج، من الثور الكبير
  answer: لكبير القوم يتحمل الأخطاء التي تقع ممن حوله
  others: [للفلاح الذي يحرث أرضه على عجل, لمن يلوم أدواته على سوء عمله ولا يعترف بتقصيره, للولد الذي يخالف أباه في طبعه]
  note: الثلم خط المحراث، وإذا اعوجّ فاللوم على الثور الكبير الذي يقود.
  source: sahli
  page: 114
  status: draft

- id: xu0059
  kind: usage
  prompt: شو بريحك من ريحة الثوم؟ قلة أكله
  answer: للحث على الابتعاد عن الأشرار وترك معاشرتهم
  others: [للحث على النظافة قبل لقاء الناس, لمن يكره رائحة الطعام الثقيل فيمتنع عن حضور الولائم, لمن يدعو الضيف إلى طعام لا يحبه]
  note: لا خلاص من رائحة الثوم إلا بتركه، وكذلك أذى الأشرار.
  source: sahli
  page: 188
  status: draft

- id: xu0060
  kind: usage
  prompt: صرارة بتسند خابية
  answer: للصغير الذي لا يستهان بنفعه
  others: [للقليل من المال لا يغني صاحبه, للبناء القديم الذي يوشك أن يسقط, للخادم الذي يحمل الأثقال]
  note: الصرارة حصاة صغيرة، لكنها تسند جرة كبيرة.
  source: sahli
  page: 195
  status: draft

- id: xu0061
  kind: usage
  prompt: قاعدين ندور عليه بسراج وفتيله
  answer: للشيء أو الشخص الذي يُطلب بأشد الحاجة إليه
  others: [لمن يسهر الليل في العمل على ضوء السراج حتى الفجر, للبيت المظلم الذي لا نور فيه, لمن يضيع وقته في البحث عن التافه]
  note: نبحث عنه بالسراج كأننا في ظلام، من شدة حاجتنا إليه.
  source: sahli
  page: 246
  status: draft

- id: xu0062
  kind: usage
  prompt: لا بعوي ولا بلحق الغنم
  answer: لمن لا نفع فيه في أي أمر
  others: [لمن يصمت ويعمل بجد دون أن يشكو, للراعي الذي يحرس قطيعه, لمن يحب الوحدة والهدوء]
  note: كلب لا ينبح ولا يلحق بالقطيع، فما فائدته؟
  source: sahli
  page: 278
  status: draft

- id: xu0063
  kind: usage
  prompt: إلقاضي ما برضي اثنين
  answer: للحكم بالحق، فهو يغضب أحد الخصمين لا محالة
  others: [للقاضي الظالم الذي يأخذ الرشوة, لمن يصلح بين المتخاصمين بلطف, لمن يحب أن يرضي الناس جميعا]
  note: لا بد أن يخرج أحد الخصمين غاضبا مهما عدل القاضي.
  source: sahli
  page: 245
  status: draft

- id: xu0064
  kind: usage
  prompt: كل شي في عند العطار، ما عدا حبني بالغصب
  answer: للحب الذي لا يكون بالإكراه
  others: [للعطار الذي يبيع كل الأعشاب, لمن يشتري حاجته بالدين, لمن يغصب الناس على شراء بضاعته]
  note: عند العطار كل دواء، إلا دواء يجعل أحدا يحبك رغما عنه.
  source: sahli
  page: 266
  status: draft

- id: xu0065
  kind: usage
  prompt: إلذبان الازرق ما بندل عليه
  answer: لمن يغيب فيبحث الناس عنه بلا جدوى
  others: [لمن يكثر من الزيارات حتى يملّوه, لمن يحوم حول الطعام دون دعوة, لمن يلاحق الناس بأسئلته]
  note: حتى الذباب الأزرق لا يعرف طريقه إليه.
  source: sahli
  page: 153
  status: draft

- id: xu0066
  kind: usage
  prompt: إلطبخة الموعود فيها، أحسن من اللي أكلتها
  answer: لما ينتظره المرء ويأمل به، فهو أحلى من الذي ناله
  others: [لمن يعد الناس بوليمة كبيرة ثم لا يفي بوعده ويخلفه, لمن يدعو الناس إلى الطعام ثم يعتذر, للطعام الذي يطبخ على نار هادئة]
  note: الأمل في الشيء ألذّ أحيانا من الحصول عليه.
  source: sahli
  page: 204
  status: draft

- id: xu0067
  kind: usage
  prompt: نزلت صرمايته عن الرف
  answer: لمن قلّت قيمته بين الناس أو أُهين
  others: [لمن يشتري حذاء جديدا ويحفظه على الرف للأعياد, لمن يعود إلى بيته بعد سفر, لمن يتواضع مع الفقراء]
  note: كان حذاؤه مرفوعا على الرف، فنزل عنه.
  source: sahli
  page: 337
  status: draft

- id: xu0068
  kind: usage
  prompt: عرج الجمل من شفته
  answer: لمن يتعلل بحجة واهية
  others: [لمن يمشي ببطء ليؤخر غيره, لمن يحمل فوق طاقته, لمن يخفي مرضه عن الناس]
  note: يزعم أن الجمل يعرج بسبب شفته، وهي حجة لا تقنع أحدا.
  source: sahli
  page: 214
  status: draft

- id: xu0069
  kind: usage
  prompt: شوره من راسه
  answer: لمن يتخذ قراره بنفسه دون أن يتأثر بآراء غيره
  others: [لمن يستشير كل من يلقاه, لمن يشكو من صداع دائم لا يفارقه ليلا ولا نهارا, لمن يتبع رأي كبير قومه]
  note: مشورته من رأسه هو، لا من أحد.
  source: sahli
  page: 190
  status: draft

- id: xu0070
  kind: usage
  prompt: أجت الغنايم والنذل نايم
  answer: لمن تفوته الفرصة لأنه غافل عنها
  others: [لمن يغنم كثيرا دون جهد أو تعب, لمن يقسم الغنائم بين أصحابه بالعدل, لمن يسهر ليحرس ماله من اللصوص]
  note: جاءت الغنائم وهو نائم، فضاعت عليه الفرصة التي كانت بين يديه.
  source: sahli
  page: 20
  status: draft

- id: xu0071
  kind: usage
  prompt: كل قادم وإله نصيب
  answer: للضيف يأتي ومعه رزقه
  others: [لمن يأتي متأخرا فلا يجد شيئا, لمن يرث مالا لم يتعب فيه, للمسافر الذي ينتظره أهله]
  note: لا تخف من قدوم الضيف، فرزقه يأتي معه.
  source: sahli
  page: 268
  status: draft

- id: xu0072
  kind: usage
  prompt: إلزعلان يشرب البحر
  answer: لعدم المبالاة بمن غضب واستاء
  others: [لمن يغضب سريعا ويهدأ سريعا, لمن يطلب ما لا يقدر عليه, لمن يكتم غضبه في قلبه]
  note: من لم يعجبه الأمر فليشرب البحر، أي لا يهمنا غضبه.
  source: sahli
  page: 166
  status: draft

- id: xu0073
  kind: usage
  prompt: قسم البحر سواقي، بتطلب ما بتلاقي
  answer: لمن يبدد ماله الكثير حتى لا يبقى منه شيء
  others: [لمن يحسن توزيع الماء على الحقول, لمن يبحث عن عمل في كل مكان فلا يجده مهما سعى, لمن يطلب العون من غير أهله]
  note: من فرّق البحر سواقي صغيرة لم يجد الماء حين يحتاجه.
  source: sahli
  page: 255
  status: draft

- id: xu0074
  kind: usage
  prompt: لا تفرحش بموت عدوك، بعد شوية بتصير جاره
  answer: للنهي عن الشماتة بموت الخصم
  others: [للحث على الإحسان إلى الجار, لمن ينتقل إلى حي جديد, لمن يخاف من الموت فلا يزور المقابر]
  note: كل حي سيموت، فلا تشمت بموت أحد.
  source: sahli
  page: 280
  status: draft

- id: xu0075
  kind: usage
  prompt: إنت مثل القمر، بتونس وما بتنفع
  answer: لمن يؤنس الناس بحضوره ولا ينفعهم بشيء
  others: [لمن يضيء حياة من حوله بخيره, لمن يسهر الليل كله ثم ينام طوال النهار, لمن يظهر قليلا ثم يغيب طويلا]
  note: القمر جميل وأنيس، لكنه لا يطعم ولا يسقي.
  source: sahli
  page: 70
  status: draft

- id: xu0076
  kind: usage
  prompt: احفظ لسانك عند اختلاف الدول
  answer: للتحذير من الخوض في خلاف الكبار، فهم سرعان ما يتصالحون
  others: [للحث على تعلم لغات البلاد الأخرى, للتحذير من السفر إلى البلاد البعيدة في أوقات الحرب والفتن, للحث على كتمان الأسرار عن الأصدقاء]
  note: من تكلم في خلاف بين دولتين ندم حين تعودان إلى الصلح ويبقى كلامه عليه.
  source: sahli
  page: 22
  status: draft

- id: xu0077
  kind: usage
  prompt: ساقية ما بتعكر بحر
  answer: للضعيف لا يقدر على أذى القوي
  others: [للقليل من الخير يفيد الكثيرين, لمن يفسد عمل غيره بسهولة, للصديق الذي يصفّي قلوب الناس]
  note: الساقية الصغيرة لا تغيّر صفاء البحر مهما حملت.
  source: sahli
  page: 174
  status: draft

- id: xu0078
  kind: meaning
  prompt: تفضل الحاجة تقول نيني نيني لما ييجي الخايب يشتريني
  answer: الرديء يبقى حتى يشتريه غافل
  others: [الغالي لا يشتريه إلا الأغنياء, الجيد يُباع في أول النهار, البائع يغني ليجذب الزبائن]
  note: يقال عن الشيء يبقى معروضًا لا يُشترى حتى يأتي من لا يُحسن الاختيار فيشتريه.
  source: amin
  page: 134
  flag: 'answer may be wrong: Answer "الرديء يبقى حتى يشتريه غافل" may contradict the book, whose gloss starts "الشيء الجيد"; verify in the PDF.'draft

- id: xu0079
  kind: meaning
  prompt: بطنه زي السلوقي
  answer: شخص ضامر البطن
  others: [شخص سريع الجري, شخص كثير الجوع, شخص وفيّ لأهله]
  note: السلوقي كلب صيد نحيل البطن.
  source: zanin
  page: 81
  status: draft

- id: xu0080
  kind: usage
  prompt: انقوله ثور يقولى احلبه
  answer: للشخص العنيد
  others: [لمن يطلب المستحيل, لمن لا يعرف الحيوانات, للكسول الذي يتهرب من العمل]
  note: أقول له إنه ثور، فيقول احلبه!
  source: zanin
  page: 69
  flag: 'answer may be wrong: The book lists the near-identical variant «انقوله الثور يقولى احلبه» right after this one with the meaning «يضرب لمن يطلب المستحيل», which is one of the wrong options (لمن يطلب المستحيل).'draft

- id: xu0081
  kind: usage
  prompt: ايده قريبه لجيبه
  answer: للسخرية من البخيل
  others: [للكريم الذي يعطي بسرعة, للسارق الخفيف اليد, للمحتاج الذي يطلب دائمًا]
  note: 'المقصود عكس الظاهر: يده بعيدة عن جيبه.'
  source: zanin
  page: 72
  flag: 'answer may be wrong: Minor: the book''s variant «القريبة ايده لجيبه» (p.~245) is glossed «يضرب للشخص الكريم أو للتهكم من البخيل», so the option «للكريم الذي يعطي بسرعة» is close to a book reading. The p.72 entry itself supports the answer.'draft

- id: xu0082
  kind: meaning
  prompt: بغل صكّ حيط
  answer: شيء ذهب هدرًا دون تعويض أو مساءلة
  others: [شخص عنيد لا يتراجع, عمل قويّ متين لا تهدمه الأيام ولا الرياح, مصيبة كبيرة مفاجئة]
  note: «صكّ» رفس؛ رفسة البغل للجدار لا يحاسبه عليها أحد.
  source: zanin
  page: 83
  status: draft

- id: xu0083
  kind: usage
  prompt: احلب جمل يا قواص
  answer: لمن يطلب أمرًا مستحيلًا وهو يعلم أنه لن يتحقق
  others: [لمن يكلّف غيره بعمل يقدر عليه هو, لمن يطلب من الناس أجرًا كبيرًا على عمل يسير لم يتعبه, لمن يتأخر عن عمله حتى يفوته]
  note: الجمل لا يُحلب، فطلب حلبه كناية عن طلب المحال.
  source: zanin
  page: 15
  status: draft

- id: xu0084
  kind: usage
  prompt: إسم كبير والعشا شعير
  answer: للسخرية ممن يتظاهر بالغنى وهو ليس كذلك
  others: [لمن يأكل كثيرًا ولا يشبع مهما قُدّم له من طعام, لمن يرضى بالقليل مع علوّ مكانته, لمن يكثر الوعود ولا يفي بها]
  note: اسم رنّان، لكن العشاء خبز شعير فقير.
  source: zanin
  page: 21
  status: draft

- id: xu0085
  kind: usage
  prompt: ايكال الظوقة وكسرة الماعون
  answer: للمعروف الذي يقابَل بالإساءة
  others: [للضيف الذي يأكل كثيرًا, لمن يُفسد ما يستعير, للبخيل الذي يعطي القليل]
  note: أكل من الطعام ثم كسر الإناء الذي قُدّم فيه.
  source: zanin
  page: 73
  status: draft

- id: xu0086
  kind: usage
  prompt: بعد ما شبع قال صامط
  answer: لمن يذمّ الشيء بعد أن يكتفي منه
  others: [لمن يأكل بلا شهية مجاملةً لصاحب الطعام, لمن يرفض الطعام قبل أن يذوقه, لمن يأكل كثيرًا ثم يمرض]
  note: «صامط» بلا ملح؛ لم يتذكّر عيب الطعام إلا بعد أن شبع.
  source: zanin
  page: 83
  status: draft

- id: xu0087
  kind: usage
  prompt: بعد احداش قال اسم الله
  answer: لمن يأتي بالشيء متأخرًا عن موعده
  others: [لمن يبدأ عمله بالدعاء ويطلب فيه التوفيق, لمن يأكل كثيرًا ثم يندم, لمن يعدّ النعم ولا يشكرها]
  note: «احداش» أحد عشر؛ كأنه تذكّر التسمية بعد أن مضى من الأمر الكثير.
  source: zanin
  page: 82
  status: draft

- id: xu0088
  kind: meaning
  prompt: اعط الهم لكبار الجماجم
  answer: المصائب لا يحملها إلا ذوو الخبرة والرأي
  others: [الكبار في السن أكثر الناس همًّا, لا تشكُ همّك لأحد فالناس لا يحملون عنك شيئًا, الهموم تُشيّب الرأس]
  note: الجماجم الرؤوس؛ أصحاب العقول الكبيرة هم من يقدرون على حلّ المشاكل.
  source: zanin
  page: 25
  status: draft

- id: xu0089
  kind: meaning
  prompt: أعوذ بالله من قولة أنا
  answer: ذمّ الأنانية
  others: [ذمّ الكذب, ذمّ كثرة الحلف, ذمّ الشكوى]
  note: من التعابير الشعبية التي تُقال في ذمّ من يقدّم نفسه على غيره.
  source: zanin
  page: 27
  status: draft

- id: xu0090
  kind: meaning
  prompt: اللى فيه طبه ماتتخبه
  answer: العيب الموجود في الإنسان لا يمكن ستره
  others: [المرض المزمن لا ينفع فيه دواء مهما بذل صاحبه, الحاجة تُلجئ صاحبها إلى السؤال, السرّ لا يبقى سرًّا إذا عرفه اثنان]
  note: الطبع المتأصّل يظهر مهما حاول صاحبه إخفاءه.
  source: zanin
  page: 45
  status: draft

- id: xu0091
  kind: meaning
  prompt: انقطع بيه الحبل
  answer: أصابته مصيبة فلم يجد مخرجًا
  others: [انتهت علاقته بأهله, فقد صبره وغضب, سافر بعيدًا عن أهله ولم يعد إليهم]
  note: «بيه» به؛ كمن انقطع به الحبل وهو يتدلّى.
  source: zanin
  page: 69
  status: draft

- id: xu0092
  kind: usage
  prompt: اللى ما يشبع من القصعة ما يشبع من لحيسها
  answer: لمن لا يقتنع بالكثير ثم يطمع في القليل
  others: [لمن يأكل من طعام غيره, لمن يُسرف في الطعام ثم يندم على ما أنفق, لمن يترك الطعام قبل أن يشبع]
  note: «القصعة» الصحن الكبير و«لحيسها» ما يُلحس منها بعد الأكل.
  source: zanin
  page: 50
  status: draft

- id: xu0093
  kind: usage
  prompt: بوكشاش يعيّد قبل الناس
  answer: لمن يلبس الجديد قبل موعده
  others: [لمن يفرح بمصيبة غيره, لمن يأتي إلى الوليمة قبل وقتها, لمن يكثر الكلام عن نفسه]
  note: «بوكشاش» نوع من الزواحف يسمى أيضًا بوبريص.
  source: zanin
  page: 89
  status: draft

- id: xu0094
  kind: usage
  prompt: اللى كان ما عاد يكون
  answer: عند الاعتذار وعدم الرجوع إلى ما سبق
  others: [عند الحنين إلى الأيام الماضية, عند فقدان شيء لا يُعوَّض, عند وعدٍ يُرجى تحقيقه في القريب العاجل]
  note: أي ما مضى لن يتكرر، فلنطوِ الصفحة.
  source: zanin
  page: 46
  status: draft

- id: xu0095
  kind: usage
  prompt: اضرب الكلب يزيد عواه
  answer: لمن لا ينفع معه استعمال القوة
  others: [لمن يشكو كثيرًا بلا سبب, لمن يعتدي على من هو أضعف منه, لمن يكثر الكلام ولا يفعل شيئًا]
  note: كلما ضُرب الكلب ازداد نباحه، فالشدة لا تُصلحه.
  source: zanin
  page: 24
  status: draft

- id: xu0096
  kind: meaning
  prompt: أقل من الصاع فى الغرارة
  answer: شيء قليل جدًا
  others: [شيء ضائع لا يُعثر عليه, شيء مخبّأ عن العيون, شيء ثقيل لا يُحمل]
  note: الغرارة كيس كبير للحبوب، والصاع فيها لا يكاد يُرى.
  source: zanin
  page: 28
  status: draft

- id: xu0097
  kind: meaning
  prompt: البحر يجبد ويرد
  answer: الحياة لا تستمر على حال واحدة
  others: [البحر لا يردّ من يغرق فيه, الكريم يعطي ثم يأخذ, السفر في البحر محفوف بالخطر]
  note: «يجبد» يجذب؛ البحر في مدّ وجزر، وكذلك أحوال الدنيا.
  source: zanin
  page: 78
  status: draft

- id: xu0098
  kind: usage
  prompt: اندير لك درجيحة
  answer: للسخرية ممن تكثر طلباته
  others: [لملاعبة الأطفال الصغار, لمن يبالغ في الفرح, لمن يتردد في رأيه]
  note: '«الدرجيحة» الأرجوحة؛ كأنه يقول: ماذا بقي إلا أن أصنع لك أرجوحة؟'
  source: zanin
  page: 68
  status: draft

- id: xu0099
  kind: meaning
  prompt: أول مرحلة عوجاء
  answer: أول كل أمر يحتاج إلى إصلاح
  others: [أول الطريق أصعبه دائمًا, من أخطأ أول الطريق لا يصل إلى غايته, العجلة في البداية تضرّ]
  note: في أول يوم من السفر لا تستقيم الإبل، ثم تتحسّن في سيرها.
  source: zanin
  page: 71
  status: draft

- id: xu0100
  kind: meaning
  prompt: الله لا يجعلنا جرة
  answer: دعاء ألا نصير حكاية على ألسنة الناس
  others: [دعاء ألا نصير عبئًا على غيرنا, دعاء ألا نفقد مالنا فنحتاج إلى سؤال الناس, دعاء ألا نبقى بلا أهل]
  note: «جرة» هنا الحكاية التي يتناقلها الناس.
  source: zanin
  page: 31
  status: draft

- id: xu0101
  kind: meaning
  prompt: اللى ليك ليك يمضغك ولا يعديك
  answer: القريب يختلف مع قريبه لكنه لا يؤذيه
  others: [القريب يأكل حقّك ثم يتركك, الصديق القديم لا يُستبدل بصديق جديد مهما كان, من يحبك يُكثر لومك أمام الناس]
  note: يمضغك ولا يبلعك؛ فالخصام بين الأقارب لا يبلغ الأذى.
  source: zanin
  page: 46
  status: draft

- id: xu0102
  kind: usage
  prompt: اللى رافع قربه مشروكة تقطر على سيقانه
  answer: في الحث على عدم التدخل فيما لا يعني الإنسان
  others: [في الحث على إتقان العمل من أوله, في ذمّ من يبذّر ماله على الولائم ويترك أهله محتاجين, في الحث على حمل الأمانة بحرص]
  note: من حمل قربة ليست له وحده سال ماؤها على ساقيه.
  source: zanin
  page: 38
  status: draft

- id: xu0103
  kind: usage
  prompt: أنا وياك والزمان طويل
  answer: في التهديد
  others: [في الوعد بصداقة دائمة, في الصبر على الشدة, في الشكوى من طول الانتظار]
  note: أي سيأتي اليوم الذي أردّ لك فيه ما فعلت.
  source: zanin
  page: 68
  status: draft

- id: xu0104
  kind: meaning
  prompt: زنقة ملطومة
  answer: الأمر انتهى
  others: [طريق مزدحم, مكان خطر, شجار عنيف]
  note: «الزنقة» الزقاق؛ والملطومة المسدودة لا منفذ لها.
  source: zanin
  page: 158
  status: draft

- id: xu0105
  kind: usage
  prompt: اطلق الطير وأجرى تحته
  answer: لمن يضيّع الفرصة ثم يسعى وراءها بعد فواتها
  others: [لمن يُحسن إلى غيره فلا يُشكر, لمن يتباهى بما لا يملك, لمن يثق بكل الناس فيودعهم أسراره وأمواله دون حذر]
  note: أطلق الطير من يده ثم راح يركض تحته ليمسكه.
  source: zanin
  page: 25
  status: draft

- id: xu0106
  kind: meaning
  prompt: ركب راسه
  answer: تهوّر ولم يسمع كلام أحد
  others: [سافر بعيدًا وترك أهله ووطنه, تكبّر على أهله, تولّى زعامة قومه]
  note: يقال للمتهوّر العنيد الذي يمضي في رأيه.
  source: zanin
  page: 155
  status: draft

- id: xu0107
  kind: meaning
  prompt: البصّ ولا العمى
  answer: القليل الموجود خير من الكثير المعدوم
  others: [الرؤية الضعيفة أخطر من العمى, النظر أنفع من الكلام, الشك في الأمور خير من اليقين المتسرّع]
  note: «البصّ» البصيص، أي قليل من النور خير من الظلام التام.
  source: zanin
  page: 81
  status: draft

- id: xu0108
  kind: usage
  prompt: اقرا تفرح جرب تحزن
  answer: لمن يخيب ظنه بعد التجربة
  others: [لمن يفضّل العلم على العمل, لمن يحب القراءة كثيرًا, لمن يخاف من كل جديد]
  note: ما تسمعه أو تقرؤه عن الشيء يفرحك، فإذا جرّبته خاب ظنك.
  source: zanin
  page: 28
  status: draft

- id: xu0109
  kind: meaning
  prompt: أرنب وحطبها معاها
  answer: أمر متكامل جاء بكل لوازمه
  others: [أمر صعب يحتاج إلى جهد كبير, غنيمة صغيرة لا تستحق التعب, ضيف يأتي بلا موعد]
  note: صيدٌ جاء ومعه حطب طهيه، فلا ينقصه شيء.
  source: zanin
  page: 20
  status: draft

- id: xu0110
  kind: meaning
  prompt: رطّب له الكلام
  answer: حدّثه بلطف
  others: [أكثر عليه اللوم, كذب عليه, أطال معه الحديث]
  note: من الرطوبة واللين، عكس الكلام الجافّ.
  source: zanin
  page: 154
  status: draft

- id: xu0111
  kind: meaning
  prompt: بركتك سكات
  answer: سكوتك خير من كلامك
  others: [أنت رجل مبارك قليل الكلام, اسكت حتى تنال البركة, سكوتك يدلّ على رضاك]
  note: يقال لمن لا يميّز بين الأقوال، فسكوته أفضل.
  source: zanin
  page: 80
  status: draft

- id: xu0112
  kind: usage
  prompt: اللى يخلط روحه مع النخالة ينقبه الدجاج
  answer: لمن يخالط السفهاء فيناله أذاهم
  others: [لمن يتواضع مع الناس فيحبونه, لمن يعمل في الطاحون فيعلق الدقيق بثيابه, لمن يكثر الطعام فيمرض]
  note: «روحه» نفسه؛ من وضع نفسه في النخالة نقرته الدجاج.
  source: zanin
  page: 55
  status: draft

- id: xu0113
  kind: meaning
  prompt: رفقة الثور للجمل
  answer: صديقان غير متناسبين
  others: [صديقان لا يفترقان أبدًا, شريكان في عمل شاقّ, رفيقا سفر طويل]
  note: الثور والجمل لا يسيران معًا بخطوة واحدة.
  source: zanin
  page: 154
  status: draft

- id: xu0114
  kind: usage
  prompt: ايدير العيش وايدمه بالغسالة
  answer: لمن يُحسن عملًا ثم يختمه بعمل سيئ
  others: [لمن يقدّم القليل ويطلب الكثير, لمن يعمل بلا إتقان من أوله, لمن يقتصد في كل شيء حتى في طعام بيته]
  note: «العيش» أكلة ليبية؛ يصنعها ثم يصبّ عليها ماء الغسيل.
  source: zanin
  page: 72
  status: draft

- id: xu0115
  kind: usage
  prompt: أمال يحججنى على كتوفه
  answer: للسخرية ممن لا فائدة فيه ولا تُرجى منه مصلحة
  others: [لمن يقدّم خدمة كبيرة لغيره, لمن يكثر الوعود لأصحابه ثم يفي بها كلها دون تأخير, لمن يتحمّل أعباء أهله وحده]
  note: كيف يرجو منه أن يحمله على كتفيه إلى الحج وهو لا ينفع في شيء؟
  source: zanin
  page: 64
  status: draft

- id: xu0116
  kind: meaning
  prompt: بحر فيه كلب
  answer: تحذير من الخوض في موضوع لوجود من ينقل الأخبار
  others: [مكان خطر لا يجوز دخوله, أمر ظاهره جميل وباطنه سيئ, مشكلة كبيرة لا حلّ لها ولا ينفع فيها رأي أحد من الناس]
  note: يقال حين يكون في المجلس من قد ينقل الكلام إلى غير أهله.
  source: zanin
  page: 78
  status: draft

- id: xu0117
  kind: meaning
  prompt: اينقز الحيط يجى واقف
  answer: شخص خفيف الحركة
  others: [شخص متهوّر لا يخاف, لصّ يدخل البيوت, شخص يغيّر رأيه بسرعة]
  note: «ينقز» يقفز؛ يقفز من فوق الجدار فينزل واقفًا.
  source: zanin
  page: 73
  status: draft

- id: xu0118
  kind: meaning
  prompt: الله يدير طريق
  answer: الله يجعل لك مخرجًا
  others: [الله يردّك سالمًا من سفرك, الله يكثر رزقك, الله يغفر ذنبك]
  note: دعاء لمن ضاقت به الحال أن يفتح الله له بابًا.
  source: zanin
  page: 31
  status: draft

- id: xu0119
  kind: meaning
  prompt: امظاير وأمهاته ثنتين
  answer: من يكسب من حرفتين
  others: [من له أمّ وزوجة أب, من يتنقّل بين بيتين, من يأكل أكثر من حاجته]
  note: «امظاير» خروف يرضع من نعجتين.
  source: zanin
  page: 65
  status: draft

- id: xu0120
  kind: meaning
  prompt: اسبولته فارغة
  answer: شخص لا قيمة له ولا شيء عنده
  others: [شخص فقير لا يملك قوت يومه, شخص بخيل لا يعطي أحدًا, شخص ضعيف البنية كثير المرض]
  note: السبولة السنبلة، والفارغة لا حبّ فيها؛ وعكسها «اسبولته مليانة» لصاحب القيمة.
  source: zanin
  page: 20
  status: draft

- id: xu0121
  kind: meaning
  prompt: بين رمش العين فوق ولوطه
  answer: السرعة في التنفيذ
  others: [المسافة القريبة جدًا, النظرة الخاطفة, الغفلة عن الخطر]
  note: «لوطه» تحته؛ بقدر ما يرتفع رمش العين وينزل.
  source: zanin
  page: 91
  status: draft

- id: xu0122
  kind: meaning
  prompt: البطن تهز الركبة
  answer: الجوع يُضعف الإنسان ويُنهك قوته
  others: [كثرة الأكل تُثقل الجسم, الخوف الشديد يُرجف الركبتين ويُعجز عن المشي, الطمع يدفع صاحبه إلى المخاطر]
  note: إذا جاع الإنسان ارتجفت ركبتاه.
  source: zanin
  page: 81
  status: draft

- id: xu0123
  kind: meaning
  prompt: بينهم بحر وبرّ
  answer: بينهم مسافة شاسعة
  others: [بينهم تجارة واسعة, بينهم خصومة شديدة, بينهم قرابة بعيدة]
  note: كناية عن بُعد المسافة بين شخصين أو أمرين.
  source: zanin
  page: 91
  status: draft

- id: xu0124
  kind: usage
  prompt: اللى ما عنده غنم ذباح
  answer: لمن يدّعي فعل شيء ليس من عادته
  others: [لمن يكثر الذبح للضيوف فوق طاقته, لمن ينفق ما لا يملك, لمن يعمل عند غيره بلا أجر]
  note: ليس عنده غنم ويدّعي أنه يذبح للناس.
  source: zanin
  page: 48
  status: draft

- id: xu0125
  kind: usage
  prompt: احنا تابعين موش بادعين
  answer: يقوله من يُلام على فعل جرت به عادة الناس
  others: [يقوله من يرفض أن يتبع غيره في أمر, يقوله من يفتخر بأنه أول من فعل الشيء, يقوله من يعتذر عن تأخره في الحضور]
  note: «احنا» نحن و«موش» لسنا؛ أي نحن نتبع ما يفعله الناس ولم نبتدع شيئًا.
  source: zanin
  page: 15
  status: draft

- id: xu0126
  kind: usage
  prompt: احيينى اليوم واقتلنى بكرة
  answer: لمن يطلب النفع العاجل ولا يبالي بالعاقبة
  others: [لمن يؤجّل عمله إلى الغد دائمًا, لمن يخاف من المستقبل خوفًا شديدًا, لمن يعفو عن خصمه اليوم ثم ينتقم منه حين يقدر عليه]
  note: يكفيه أن يعيش يومه، ولا يهمّه ما يصيبه غدًا.
  source: zanin
  page: 16
  status: draft

- id: xu0127
  kind: usage
  prompt: أنا وخوى الجمل فى السوق درنا مية
  answer: للوضيع يقرن نفسه بكبار القوم ليرفع من مقامه
  others: [لمن يتعاون مع غيره فيربحان معًا, لمن يبالغ في ثمن بضاعته حتى لا يشتريها منه أحد, لمن يقضي يومه في السوق بلا عمل]
  note: «خوى» أخي و«درنا» صنعنا؛ يزعم أنه والجمل كسبا مئة معًا.
  source: zanin
  page: 68
  status: draft

- id: xu0128
  kind: meaning
  prompt: بنت وذنك مش بنت عينك
  answer: شيء سمعته ولم تره بعينك
  others: [حكاية مكذوبة لا أصل لها, فتاة لا تعرفها, أمر قريب منك وأنت لا تراه]
  note: «وذنك» أذنك؛ الخبر المسموع غير المشاهَد.
  source: zanin
  page: 87
  status: draft

- id: xu0129
  kind: usage
  prompt: بعد السيف علّق منجل
  answer: لمن يرضى بالقليل بعد أن كان ذا قدر عالٍ
  others: [لمن يترك الحرب ويشتغل بالزراعة, لمن يتظاهر بالشجاعة أمام الناس ثم يهرب عند القتال, لمن يغيّر عمله كثيرًا]
  note: كان يحمل سيفًا ثم صار يعلّق منجلًا.
  source: zanin
  page: 82
  status: draft

- id: xu0130
  kind: meaning
  prompt: بايع راسه
  answer: شجاع لا يخاف
  others: [يائس من الحياة, لا يسمع نصيحة أحد, كثير المغامرة بماله]
  note: كناية عن الشجاعة، كأنه باع رأسه فلم يعد يخشى عليه.
  source: zanin
  page: 78
  status: draft

- id: xu0131
  kind: usage
  prompt: استحذق ع النخالة وبزّع الدقيق
  answer: لمن يحرص على التافه ويفرّط في الثمين
  others: [لمن يبالغ في الكرم حتى يفتقر, لمن يعمل كثيرًا ولا ينال أجرًا, لمن يأخذ حقّه ناقصًا ويسكت خوفًا من الخصومة]
  note: «استحذق» حرص؛ يشحّ بالنخالة ويبعثر الدقيق، فلا يحسن تقدير الأمور.
  source: zanin
  page: 20
  status: draft

- id: xu0132
  kind: usage
  prompt: اللى ينتفخ ينفش حتى الربيع يولى قشّ
  answer: في الحث على ترك الإعجاب بالنفس والتكبر
  others: [في الحث على اغتنام موسم الخير, في ذمّ من يبدّد ماله سريعًا, في وصف من يغضب سريعًا ثم يهدأ ويعود إلى صوابه]
  note: كل ما ينتفخ يذبل، حتى عشب الربيع يصير قشًّا يابسًا.
  source: zanin
  page: 61
  status: draft

- id: xu0133
  kind: usage
  prompt: ايلقط فى الندى بصوفه
  answer: لمن يجمع المال بصعوبة
  others: [لمن يسرق من غيره دون أن يُشعر به, لمن يبكّر في الخروج إلى العمل, لمن يُبذّر ما جمعه أجداده]
  note: كالخروف الذي يجمع قطرات الندى بصوفه.
  source: zanin
  page: 73
  status: draft

- id: xu0134
  kind: usage
  prompt: اللى ما ياخذ رايك حمّص الشعير وأعطيه يزرعه
  answer: لمن لا يسمع نصح الآخرين فيتحمل نتيجة قراره
  others: [لمن يغشّ في تجارته ليربح أكثر, لمن يعين غيره على عمل خاسر ثم يشاركه في الخسارة, لمن يبذل جهده في عمل لا يتقنه]
  note: الشعير المحمّص لا ينبت، فدعه يزرع ويرى بنفسه.
  source: zanin
  page: 49
  status: draft

- id: xu0135
  kind: meaning
  prompt: اجعلك مفتاح البيبان المسكرة
  answer: دعاء بأن يجعله الله عونًا على حلّ الأمور الصعبة
  others: [دعاء بأن يرزقه الله بيتًا واسعًا كثير الأبواب, وصف لمن يدخل بيوت الناس دون استئذان, سخرية ممن يغلق بابه في وجوه الضيوف]
  note: «البيبان المسكرة» الأبواب المغلقة؛ والدعاء أن يفتح الله على يديه كل أمر عسير.
  source: zanin
  page: 14
  status: draft

- id: xu0136
  kind: usage
  prompt: من حسد الشريك أصلب المال
  answer: في أن المالك إذا حسد أجيره على نصيبه أضر بنفسه
  others: [في أن الشراكة في المال تجلب الحسد والخصام, في أن من حسد غيره على ماله افتقر سريعاً, في أن المال لا يبقى إلا مع الشريك الأمين]
  note: إذا حسد المالك شريكه على ما يناله من الثمار والغلال ترك الشريك الأرض، فأُهملت وصلبت ولم تعد تثمر.
  source: akwa
  page: 1201
  volume: ج٢
  flag: 'answer may be wrong: The answer says «أجيره» where the book says the owner envies his شريك (partner); «شريكه» would match the book better.'draft

- id: xu0137
  kind: usage
  prompt: من شاف قصر الناس ما هد عرشه
  answer: في اعتزاز المرء بأشيائه وإن كانت حقيرة
  others: [في أن الحسد يدفع المرء إلى هدم ما بناه, في أن الفقير لا ينبغي أن يقارن نفسه بالأغنياء, في أن من يطمع في قصور الناس يخسر بيته]
  note: من أمثال بيحان؛ والعرش الكوخ، فمن رأى قصور الآخرين لم يهدم كوخه.
  source: akwa
  page: 1231
  volume: ج٢
  status: draft

- id: xu0138
  kind: usage
  prompt: ساس وغراس
  answer: في الرجل كريم النسب عريق الأصل
  others: [في الرجل الذي يزرع ولا يحصد, في الرجل الذي يحسن السياسة والتدبير, في الرجل الذي يبني بيته على أساس متين]
  note: ساس أصلها أساس، حُذفت الهمزة لكثرة الاستعمال.
  source: akwa
  page: 557
  volume: ج١
  status: draft

- id: xu0139
  kind: usage
  prompt: ياتي حجه في صفر
  answer: لمن يعمل الواجب في غير وقته
  others: [لمن يتأخر عن أهله في السفر, لمن يقضي ديونه قبل موعدها, لمن يكثر الوعود ولا يفي بها]
  note: من أمثال تهامة؛ فالحج في ذي الحجة لا في صفر.
  source: akwa
  page: 1351
  volume: ج٢
  status: draft

- id: xu0140
  kind: usage
  prompt: ما احد يدعيش على نفسه جنب ضاحه
  answer: في أن العاقل لا يعرّض نفسه للسوء بنفسه
  others: [في أن الدعاء لا يُستجاب في الأماكن البعيدة, في أن المرء لا يشكو حاله إلا لأهله, في أن الوحدة في الجبال تجلب الخوف]
  note: الضاحة الهاوية، والعامة تعتقد أن الجن تسكنها وتسرع بالاستجابة، فلا يدعو أحد على نفسه بجوارها.
  source: akwa
  page: 1001
  volume: ج٢
  status: draft

- id: xu0141
  kind: usage
  prompt: بقصه في الما، ودقه في الحجر
  answer: لمن يتعب نفسه في عمل لا فائدة منه
  others: [لمن يقسو على الضعيف ويلين للقوي, لمن يصبر على الشدة حتى ينال ما يريد, لمن يجمع بين الشيء وضده في وقت واحد]
  note: قرص الماء ودق الحجر عملان لا يتركان أثراً، فهما مثل للجهد الضائع.
  source: akwa
  page: 291
  volume: ج١
  status: draft

- id: xu0142
  kind: usage
  prompt: كلام الصغير من كلام الكبير
  answer: في أن ما يقوله الطفل يعكس ما يسمعه من الكبار في البيت
  others: [في أن الصغير لا يُؤخذ بكلامه لأنه لا يعقل ما يقول ولا يدرك معناه, في أن الصغير ينبغي ألا يتكلم في حضرة الكبير, في أن الكبير يتعلم أحياناً من كلام الصغير]
  note: يقال في أخذ كلام الطفل مأخذ الجد، لأنه صدى لما يدور في بيته.
  source: akwa
  page: 871
  volume: ج٢
  status: draft

- id: xu0143
  kind: usage
  prompt: من كثر أصحابه ما تجمل
  answer: للاعتذار عن التقصير في إرضاء الأصحاب جميعاً
  others: [للافتخار بكثرة الأصحاب والمحبين, للتحذير من الصديق الذي يكثر المجاملة, للحث على اختيار صديق واحد مخلص بدل أصحاب كثيرين لا نفع فيهم]
  note: تجمّل أي صنع الجميل؛ فمن كثر أصدقاؤه لم يستطع أن يرضيهم كلهم بالعطايا والهدايا.
  source: akwa
  page: 1271
  volume: ج٢
  status: draft

- id: xu0144
  kind: usage
  prompt: إذا كثرت الأدياك بطل الليل
  answer: في كثرة الرؤساء وما ينتج عنها من فوضى واضطراب
  others: [في كثرة النوم وما ينتج عنها من كسل وضياع, في كثرة الضيوف في البيت وما ينتج عنها من سهر وتعب, في كثرة الكلام وما ينتج عنها من خصام وشجار]
  note: الأدياك جمع ديك، فإذا كثرت الديوك صاحت كل ساعة واختلط الليل بالنهار.
  source: akwa
  page: 131
  volume: ج١
  status: draft

- id: xu0145
  kind: usage
  prompt: من كتف ساعة الصبح قدوه عليها طول النهار
  answer: لمن يتعثر في أول نهاره فيصيبه العثار طوال يومه
  others: [لمن يستيقظ متأخراً فيضيع عليه النهار كله, لمن يبدأ عمله مبكراً فيتمه قبل الظهر, لمن يحمل على كتفه ثقلاً من الصباح إلى المساء]
  note: من أمثال ذمار؛ كتف أي جُرح إصبع رجله بالحجارة، وقد يقال أيضاً لمن ينكب في أول أمره.
  source: akwa
  page: 1271
  volume: ج٢
  status: draft

- id: xu0146
  kind: usage
  prompt: دوار الحي عسير
  answer: يقال عند البحث عن شخص لا يُعرف مكانه
  others: [يقال لمن يكثر التنقل بين البيوت بلا حاجة, يقال لمن يسكن في حي بعيد عن السوق, يقال عند الضياع في حي غريب ليلاً]
  note: الدوّار البحث؛ فالبحث عن إنسان حي يتنقل أمر شاق.
  source: akwa
  page: 497
  volume: ج١
  status: draft

- id: xu0147
  kind: usage
  prompt: باقي شطف، ولا سبع شميل
  answer: في أن القديم المتين أنفع من الجديد الكثير
  others: [في أن القليل من الطعام يكفي العائلة الكبيرة, في أن الصبر على الفقر خير من سؤال الناس, في أن الضيف الواحد خير من سبعة ضيوف ثقلاء]
  note: الشطف غطاء نوم من جلود الضأن، والشميل جمع شملة؛ فالشطف البالي أطول عمراً من سبع شمال جدد.
  source: akwa
  page: 261
  volume: ج١
  status: draft

- id: xu0148
  kind: usage
  prompt: شاتمك واصلك
  answer: في أن من ينقل إليك شتيمة غيره هو الشاتم الحقيقي
  others: [في أن من يشتمك اليوم قد يصالحك غداً فلا تقطع ما بينكما, في أن الشتيمة تصل إلى صاحبها مهما بعد, في أن القريب يشتم قريبه ثم يصله]
  note: من أمثال إبّ؛ أي من بلّغك السب صار هو الساب.
  source: akwa
  page: 597
  volume: ج١
  status: draft

- id: xu0149
  kind: usage
  prompt: إذا ضاعت الصحبة فعاد المعرفة
  answer: في أن حق الصداقة يبقى واجباً حتى لو قصّر صاحبك فيه
  others: [في أن من فقد أصحابه بسبب فقره لا يبقى له من يعرفه, في أن الصداقة تنتهي إذا انتهت المعرفة بين الناس, في أن المرء يعرف أصحابه حين يضيع ماله]
  note: المعرفة هنا بمعنى الشهامة؛ فإن ضيّع صاحبك حق الصحبة فشهامتك تلزمك بالوفاء.
  source: akwa
  page: 111
  volume: ج١
  status: draft

- id: xu0150
  kind: usage
  prompt: اضرب بسيف القبول، وعلى الله الدرك
  answer: في الحث على السعي والأخذ بأسباب النجاح
  others: [في الحث على الصلح وقبول اعتذار الخصم, في الحث على الصبر وترك القتال, في الحث على الرضا بالقليل من الرزق]
  note: القبول الحظ، والدرك النجاح؛ فعلى المرء أن يجتهد وليس عليه أن يضمن النتيجة.
  source: akwa
  page: 181
  volume: ج١
  status: draft

- id: xu0151
  kind: usage
  prompt: في لقفه قيمة البقره
  answer: كناية عن العاجز عن الكلام في الوقت المناسب
  others: [كناية عن الطماع الذي يأكل أكثر من حاجته, كناية عن البائع الذي يغالي في ثمن بضاعته, كناية عن البخيل الذي لا يعطي إلا القليل ولو كان غنياً]
  note: اللقف هو الفم؛ أي في فمه ثمن بقرة لو تكلم، لكنه سكت.
  source: akwa
  page: 781
  volume: ج٢
  status: draft

- id: xu0152
  kind: usage
  prompt: مثل السعله مصاحبه لكل عله
  answer: لمن ينتهز فرصة ضعفك فيؤذيك
  others: [لمن يصاحب المرضى ويواسيهم, لمن يشكو من كل شيء ولا يرضى, لمن يدخل في كل أمر ولو لم يُدع إليه]
  note: السعلة السعال، يأتي مع كل مرض فيزيده.
  source: akwa
  page: 1111
  volume: ج٢
  status: draft

- id: xu0153
  kind: usage
  prompt: عدوك صاحبك
  answer: في التحذير من الثقة التامة بالأصدقاء وإفشاء كل الأسرار إليهم
  others: [في الحث على مصالحة الأعداء حتى يصيروا أصدقاء, في أن الصديق الحق يعرف عدوك كما يعرفك فيحميك منه قبل أن يؤذيك, في مدح من يصادق الناس جميعاً بلا تمييز]
  note: العدو ظاهر العداوة فتحذره، أما الصديق فيعرف عنك كل شيء ويمكن أن ينقلب عليك.
  source: akwa
  page: 701
  volume: ج٢
  status: draft

- id: xu0154
  kind: usage
  prompt: لا ترحم مسبره، ولا حامي عنب
  answer: في أن من يعمل في الطعام لا يُخشى عليه من الجوع
  others: [في أن العامل الفقير يستحق الرحمة والعطاء, في أن حارس الكرم لا يأكل مما يحرسه, في أن الخبازة وحارس العنب أكثر الناس تعباً]
  note: من أمثال نواحي صنعاء؛ المسبرة الخابزة، وهي وحارس العنب لديهما ما يسد الجوع.
  source: akwa
  page: 911
  volume: ج٢
  status: draft

- id: xu0155
  kind: usage
  prompt: أين بيركم يا أهل حلقان؟
  answer: لمن يتنكر لأهله وأصحابه بعد أن تتحسن حاله
  others: [لمن يضل الطريق إلى بلده بعد غياب طويل, لمن يسأل عن الماء وهو واقف عليه لا يراه من شدة غفلته, لمن يزور أهله ثم ينسى أن يعود إليهم]
  note: أصله أن فتاة من قرية حلقان تزوجت في قرية مجاورة، ثم مرت بنسوة من قريتها فسألتهن متجاهلة عن بئرهم.
  source: akwa
  page: 251
  volume: ج١
  status: draft

- id: xu0156
  kind: usage
  prompt: ما يحمل الجور الا ذليل
  answer: لمن فقد الغيرة والحمية فلا يضيمه الظلم والمذلة
  others: [لمن يحمل أثقالاً فوق طاقته من غير شكوى, لمن يعين الظالم على ظلمه طمعاً في عطائه, لمن يصبر على الجار المؤذي حفاظاً على الجيرة]
  note: الجور الظلم والمهانة، والذليل هنا الجبان؛ فلا يرضى بالظلم إلا من لا كرامة له.
  source: akwa
  page: 1081
  volume: ج٢
  status: draft

- id: xu0157
  kind: usage
  prompt: بتحكه يده
  answer: لمن تعاوده نزعة الشر بعد أن أقلع عنها
  others: [لمن يتردد في العطاء طويلاً ثم يعطي بعد أن يُلحّ عليه, لمن يصيبه الندم على ما فعل, لمن يكثر الحركة ولا يستقر في مكان]
  note: يقال عادة لمن تدفعه نفسه إلى السرقة من جديد بعد أن تاب عنها.
  source: akwa
  page: 261
  volume: ج١
  status: draft

- id: xu0158
  kind: usage
  prompt: سنه وخرج سوا
  answer: فيما قليله وكثيره سواء في الحكم
  others: [فيما يُشترى بالجملة ليكون أرخص, فيما يُحمل على الدابة دون أن يثقلها, فيما يبدو صغيراً وهو كبير القيمة]
  note: من أمثال إبّ؛ السنّ فص الثوم، والخرج وعاء على ظهر الدابة؛ فرائحة الفص كرائحة خرج مليء بالثوم.
  source: akwa
  page: 587
  volume: ج١
  status: draft

- id: xu0159
  kind: usage
  prompt: من المحبه رقد بين السنف
  answer: في أن شدة الحب تجعل الشاق هيناً
  others: [في أن المحب لا ينام من شدة الشوق, في أن الحب يأتي بعد طول عشرة وصبر, في أن من أحب الإبل رعاها بين الشوك]
  note: من أمثال ذمار؛ السنف شجر مشوك ترعاه الإبل، نام عليه المحب كأنه فراش وثير.
  source: akwa
  page: 1281
  volume: ج٢
  status: draft

- id: xu0160
  kind: usage
  prompt: جوع ما يعرف رويط
  answer: في أن الجائع لا يحتمل التأجيل والانتظار
  others: [في أن الجائع لا يفرّق بين الطعام الطيب والرديء, في أن الجوع يعلّم الإنسان الصبر, في أن الفقير لا يعرف قيمة الطعام]
  note: من أمثال المشرق (برط)؛ ورويط أي رويداً.
  source: akwa
  page: 387
  volume: ج١
  status: draft

- id: xu0161
  kind: usage
  prompt: الحليم لوّح له، والتبيع بوّح له
  answer: في أن الذكي تكفيه الإشارة، والبليد يحتاج إلى شرح طويل
  others: [في أن الحليم يصبر على الأذى، والعجول ينتقم سريعاً, في أن الكريم يعطي بلا سؤال، والبخيل لا يعطي إلا بإلحاح, في أن الكبير يُحترم في المجلس، والصغير يُؤمر بالسكوت]
  note: لوّح من التلويح أي الإشارة، والتبيع هو العجل ويكنى به عن البليد، وبوّح له أي صوّت له كما يصوَّت للعجل.
  source: akwa
  page: 437
  volume: ج١
  status: draft

- id: xu0162
  kind: usage
  prompt: ما حنبك يا غراب وانت كثير الهراب
  answer: في الحذِر يقع آخر المطاف في شراك عدوه
  others: [في الجبان الذي يهرب من كل معركة, في الطماع الذي يقع في الفخ من أجل لقمة, في المسافر الذي يكثر التنقل فلا يستقر]
  note: حنّبك من الحنبة وهي الورطة؛ أي ما الذي أوقعك يا غراب وأنت كثير الحذر؟
  source: akwa
  page: 1031
  volume: ج٢
  status: draft

- id: xu0163
  kind: usage
  prompt: هاك لا يهناك، قال هات لا يقبل منك
  answer: لمن يعطي شيئاً وهو كاره فيؤخذ منه نكاية به
  others: [لمن يرد الهدية لأنه لا يحتاج إليها, لمن يطلب الشيء بإلحاح ثم يرفضه حين يُعطى إليه, لمن يعطي بسخاء ولا ينتظر شكراً]
  note: من أمثال بيحان؛ هاك أي خذ، قالها المعطي بدعاء عليه فرد الآخر بمثله وأخذ.
  source: akwa
  page: 1321
  volume: ج٢
  status: draft

- id: xu0164
  kind: usage
  prompt: شمسي قمري
  answer: في الأمور الواضحة التي لا خلاف عليها
  others: [في الأمور المتقلبة التي لا تثبت على حال, في الشخص الذي يعمل ليلاً ونهاراً, في الأمور البعيدة التي لا يمكن الوصول إليها]
  note: من أمثال ذمار وصنعاء؛ فالأمر الظاهر كالشمس والقمر لا يخفى على أحد.
  source: akwa
  page: 617
  volume: ج١
  status: draft

- id: xu0165
  kind: usage
  prompt: فتحنا له يتشقر دخل يرقص
  answer: لمن يستغل تسامح الناس معه فيطمع في أكثر مما لا حق له فيه
  others: [لمن يدخل بيت غيره من غير دعوة ثم يفسد عليهم فرحتهم وسهرتهم, لمن يحب اللهو والرقص في كل مناسبة, لمن يُدعى إلى مجلس فيتأخر حتى ينتهي]
  note: يتشقّر أي يراقب من بعيد؛ سمحوا له بالنظر فدخل وأخذ يرقص.
  source: akwa
  page: 761
  volume: ج٢
  status: draft

- id: xu0166
  kind: usage
  prompt: في غير بلدك احسر وامشي
  answer: في أن المرء في الغربة لا يُلام على ما يُعاب عليه في بلده
  others: [في أن الغريب عليه أن يكون أشد حذراً من أهل البلد, في أن المسافر يجب أن يسرع في المشي ليصل قبل الليل, في أن المرء لا يجد الراحة إلا في بلده]
  note: احسر أي اكشف؛ فالغريب لا يعرفه أحد فلا يعاتبه أحد على ما يفعل.
  source: akwa
  page: 781
  volume: ج٢
  status: draft

- id: xu0167
  kind: usage
  prompt: رقاع ولا جرعنه
  answer: في أن لبس الثوب المرقّع خير من بقائه ممزقاً
  others: [في أن الثوب الجديد خير من الثوب المرقّع, في أن الخياط الماهر يُعرف من ترقيعه لا من خياطة الجديد, في أن من يرقع ثيابه بخيل لا يحب الإنفاق]
  note: الرقاع الترقيع، والجرعنة لبس الثوب الممزق؛ فالإصلاح ولو كان بسيطاً أفضل من الإهمال.
  source: akwa
  page: 537
  volume: ج١
  status: draft

- id: xu0168
  kind: usage
  prompt: العقل مال يا أهل الشمال
  answer: للتذكير بالرجوع إلى العقل والاحتكام إليه
  others: [للتذكير بأن المال لا يغني عن الأهل والعشيرة, للتذكير بأن أهل البادية أعقل من أهل المدن, للتذكير بحفظ المال وعدم تبذيره]
  note: الشمال جمع شملة وهي دثار من صوف الوبر، وأهلها القبائل الذين كانوا يلبسونها.
  source: akwa
  page: 721
  volume: ج٢
  status: draft

- id: xu0169
  kind: usage
  prompt: نخس نخس يا حجاج، الحي كثير
  answer: للاكتفاء بأقل نصيب من الشيء القليل المشترك بين الناس
  others: [للحث على الإسراع في السفر قبل حلول الظلام وانقطاع الطريق بالمسافرين, لمن يأخذ نصيب غيره دون أن يستأذن, لمن يكثر من التدخين حتى يتعب صدره]
  note: أصله نفر من الحجاج تشاركوا مداعة واحدة، فإذا أطال أحدهم قيل له خذ نفساً واحداً فالناس كثيرون.
  source: akwa
  page: 1311
  volume: ج٢
  status: draft

- id: xu0170
  kind: usage
  prompt: شرّك لنا وخيرك لغيرنا
  answer: لمن يخص الغرباء بخيره وأهله بأذاه
  others: [لمن يعطي أهله وأقاربه أكثر مما يستحقون, لمن يبخل على نفسه ليعطي الناس, لمن يعادي جيرانه ويصادق البعيد]
  note: يعاتب به الأهل من لا يصيبهم منه إلا الشر، ولا ينالهم شيء من خيره.
  source: adimi
  page: 249
  flag: 'answer may be wrong: The answer (he gives his good to strangers and his harm to his family) goes beyond the book, which says his good is confined to himself. The wording of the saying does imply ''others'', though.'draft

- id: xu0171
  kind: usage
  prompt: زوجت ابني يستريح جاء البلاء من صحيح
  answer: لمن قصد الخير فجاءه الشر منه
  others: [لمن يتعجل زواج أولاده قبل أن يكبروا, لمن يحمّل أولاده أعباء لا يطيقونها, لمن يندم على كلمة قالها في غضب]
  note: أراد الأب أن يرتاح بتزويج ابنه، فإذا بالمشاكل تأتيه من هذا الزواج نفسه.
  source: adimi
  page: 232
  status: draft

- id: xu0172
  kind: usage
  prompt: بطن السارق تزعقق
  hint: تزعقق أي ترتجف
  answer: حين يتلعثم المتهم فيكشف نفسه
  others: [حين يجوع اللص فيسرق ما يأكله, حين يهرب السارق قبل أن يُكتشف, حين يُتهم البريء بما لم يفعل]
  note: المذنب يرتجف من الخوف وينكشف من اضطرابه؛ يقال عند تلكؤ المتهم في الكلام.
  source: adimi
  page: 146
  status: draft

- id: xu0173
  kind: usage
  prompt: العاطشة تعرف الماء
  answer: لمن تدلّه رغبته على طريق ما يريد
  others: [لمن يشكو حاجته لكل من يلقاه, لمن يترك ما ينفعه ويطلب ما يضره ويؤذيه, لمن يستحي من طلب ما يحتاجه]
  note: الدابة العطشى تهتدي إلى الماء وحدها؛ والراغب في الشيء يعرف كيف يصل إليه.
  source: adimi
  page: 128
  status: draft

- id: xu0174
  kind: usage
  prompt: النسر يتمارى بجناحه
  answer: مداعبةً لمن يحضر صدفةً والطعام جاهز
  others: [مدحا لمن يسافر كثيرا ويعرف البلدان والطرق, ذمّا لمن يتكبر على أهله وجيرانه, تحذيرا ممن يتربص بغيره ليؤذيه]
  note: النسر يرى صيده من بعيد وينقضّ عليه؛ فيُداعَب به من يصل في وقت الطعام كأنه رآه من بعيد.
  source: adimi
  page: 122
  status: draft

- id: xu0175
  kind: usage
  prompt: تباشير العيد خير من أيامه
  answer: حين يكون انتظار الفرح أجمل من الفرح
  others: [حين يأتي العيد والناس في ضيق, حين يستعد المرء للأمر قبل وقته بكثير, حين يمضي العيد سريعا دون أن يُشعر به]
  note: الأيام التي تسبق العيد تملأ النفس بهجة قد تزيد على بهجة العيد ذاته.
  source: adimi
  page: 164
  status: draft

- id: xu0176
  kind: usage
  prompt: أدسم اللقف يستحي الوجه
  hint: اللقف هو الفم
  answer: لمن أكرمه غيره فاستحيا أن يرفض طلبه
  others: [لمن يأكل كثيرا ثم يخجل من نفسه, لمن يمدح الناس بلسانه ويذمهم في قلبه, لمن يخفي جوعه حياءً من مضيفه]
  note: أطعم الفم يستحِ الوجه؛ فالإحسان قد يمنع صاحبه من الرد أو الاعتراض.
  source: adimi
  page: 110
  status: draft

- id: xu0177
  kind: usage
  prompt: بعد الحلاوة وزف وبعد المشدة وظف
  hint: الوزف سمك صغير مجفف رخيص
  answer: لمن ساءت حاله بعد رغد ونعمة
  others: [لمن يتنقل بين الأعمال ولا يستقر, لمن يأكل الحلو قبل المالح, لمن يقنع بالقليل بعد الكثير راضيا]
  note: كان يأكل الحلوى فصار يأكل الوزف؛ وقد يكون ذلك بسبب إسرافه في أيام النعمة.
  source: adimi
  page: 149
  status: draft

- id: xu0178
  kind: usage
  prompt: القرعى تتباهى بشعر بنت أختها
  answer: لمن يفخر بمحاسن غيره ليستر نقصه
  others: [لمن يحسد أقرباءه على ما عندهم, لمن يخفي عيوبه عن الناس بالكذب والتظاهر, لمن يمدح نفسه بما ليس فيه]
  note: القرعى فاقدة الشعر، تعوّض ما بها بالتباهي بشعر قريبتها، كمن يفخر بما ليس له.
  source: adimi
  page: 47
  status: draft

- id: xu0179
  kind: usage
  prompt: الحديد أرطال والهندوان أواق
  hint: الهندوان السيف الهندي، والأواق جمع أوقية وهي أصغر من الرطل
  answer: للتذكير بأن الجودة لا تقاس بالحجم والوزن
  others: [للتذكير بأن الثمن الغالي لا يعني دائما جودة الشيء, للتذكير بأن القوة في كثرة السلاح, للتذكير بأن الصانع أهم من المادة]
  note: الحديد الخام يباع بالأرطال، والسيف الهندي على خفته أعلى قيمة بكثير.
  source: adimi
  page: 126
  status: draft

- id: xu0180
  kind: usage
  prompt: الكلب ما يعضش أخوه
  answer: للمتعاونين على الظلم يحمي بعضهم بعضا
  others: [للإخوة يتشاجرون ثم يتصالحون بعد قليل, للجار يحفظ جاره في غيابه, للقوي يترفّع عن إيذاء الضعيف]
  note: يقال في أهل السوء الذين يتستر بعضهم على بعض ولا يخذل أحدهم صاحبه.
  source: adimi
  page: 29
  status: draft

- id: xu0181
  kind: usage
  prompt: قفلي رزّجي وأنا حيرهم من داخل
  hint: رزّجي أي أحكمي إغلاق الباب
  answer: للجبان الذي يتشجع حين يأمن الخطر
  others: [للبخيل الذي يغلق بابه في وجه الضيوف, للحريص الذي يخبئ ماله عن اللصوص, للغاضب الذي يقاطع أهله]
  note: يطلب من زوجته إحكام إغلاق الباب، ثم يتوعد الأعداء من الداخل.
  source: adimi
  page: 304
  status: draft

- id: xu0182
  kind: usage
  prompt: اضرب بالطاسة تأتيك مائة رقاصة
  hint: الطاسة الطبل
  answer: لأهل الشر الذين يجتمعون عند أول دعوة إليه
  others: [للضيوف الذين يتكاثرون حين تُنصب الموائد في الأعراس, للأطفال الذين يتجمعون حول أي صوت, للفقراء الذين يقصدون بيت الكريم]
  note: يكفي أن يُقرع الطبل حتى يتقاطر الراقصون؛ ودعاة الفتنة كذلك كثيرون يلبّون كل نداء.
  source: adimi
  page: 82
  status: draft

- id: xu0183
  kind: usage
  prompt: ضربة بالمسبط خير من مائة قبقابة
  hint: المسبط المطرقة الكبيرة
  answer: نصيحة بأن تعمل بعزم وقوة بدل التردد
  others: [نصيحة بالرفق في التعامل مع الناس, نصيحة بالادخار شيئا فشيئا, نصيحة باستشارة أهل الصنعة قبل البدء]
  note: ضربة قوية واحدة تنجز ما لا تنجزه ضربات كثيرة واهنة.
  source: adimi
  page: 265
  status: draft

- id: xu0184
  kind: usage
  prompt: ماتوكل الحبة إلا من داخلها
  hint: الحبة حبة الطعام يأكلها السوس من داخلها
  answer: حين يأتي الغدر من أقرب الناس
  others: [حين يفسد الطعام لطول تخزينه, حين يتعب المرء من عمل لا يراه أحد, حين يبخل الغني على أهله]
  note: السوس ينخر الحبة من الداخل؛ كذلك لا يؤذيك إلا من كان قريبا منك.
  source: adimi
  page: 369
  status: draft

- id: xu0185
  kind: meaning
  prompt: ديمة خلفنا بابها
  hint: الديمة الكوخ أو حظيرة البهائم
  answer: تغيّر الشكل وبقي الجوهر
  others: [تغيّرت الأحوال إلى الأفضل, انتقلنا إلى مكان جديد, أُغلق الباب في وجهنا]
  note: غيّروا موضع باب الكوخ ولم يتغير الكوخ نفسه؛ أي لا جديد في الحقيقة.
  source: adimi
  page: 213
  status: draft

- id: xu0186
  kind: meaning
  prompt: قلبه لحوحه
  hint: اللحوح نوع من الخبز اليمني شديد الطراوة
  answer: جبان يخاف بلا سبب
  others: [طيب القلب كريم النفس, سريع الغضب, كثير الحزن]
  note: قلبه طري كاللحوح؛ يوصف به الجبان الكثير الخوف.
  source: adimi
  page: 310
  status: draft

- id: xu0187
  kind: usage
  prompt: كثر الحكوك يخرج الدم
  answer: لمن يلحّ في السؤال حتى يلقى ما يكره
  others: [لمن يهمل جرحه حتى يتعفن, لمن يكثر الشكوى من مرض بسيط, لمن يتشاجر مع الناس لأتفه الأسباب وأصغرها]
  note: كثرة الحكّ تُدمي الجلد، وكثرة الإلحاح قد تكشف ما لا يحب المرء أن يعرفه.
  source: adimi
  page: 126
  status: draft

- id: xu0188
  kind: usage
  prompt: أوعية البيت يتشاقفوا
  hint: يتشاقفوا أي يتصادمون
  answer: لتهوين الخلاف بين أهل البيت الواحد
  others: [لذمّ كثرة الأثاث والأواني في البيت الصغير, لمن يكسر أواني بيته من الغضب, للتنبيه على حفظ أسرار البيت]
  note: أواني البيت تتلاطم حين تجتمع؛ والخلاف بين الأهل أمر طبيعي لا يفسد ما بينهم.
  source: adimi
  page: 103
  status: draft

- id: xu0189
  kind: usage
  prompt: أنا اللحم وأنت السكين
  answer: يقولها من يرضى سلفا بحكم من يصلح بينه وبين خصمه
  others: [يقولها المظلوم حين يشكو قسوة القوي عليه, يقولها الضعيف حين يعجز عن الدفاع عن نفسه أمام القوي, يقولها الصديق حين يقدّم صاحبه على نفسه]
  note: أي احكم فيّ بما تشاء فأنا راضٍ؛ وكثيرا ما يقال لمن تولى الصلح بين متخاصمين.
  source: adimi
  page: 76
  status: draft

- id: xu0190
  kind: usage
  prompt: ساعة الشرح لا يفوتك ولو على قطع الرأس
  hint: الشرح الطرب وضرب الطبل والرقص
  answer: حثّا على ألا يضيّع المرء نصيبه من الفرح
  others: [تحذيرا من الإسراف في اللهو والطرب أيام الأعراس, حثّا على حضور مجالس العلم والذكر, لومًا لمن ينشغل بالعرس عن عمله]
  note: لا تفوّت وقت الأفراح ولو كنت في أشد الضيق، لا سيما في المناسبات العظيمة.
  source: adimi
  page: 238
  status: draft

- id: xu0191
  kind: usage
  prompt: قرب لي الجدار شاتمخط
  hint: شاتمخط أي سأتمخط
  answer: للكسول الذي يريد كل شيء في متناول يده
  others: [للمريض الذي لا يقدر على الحركة, للبخيل الذي يستكثر كل شيء على غيره ولو قلّ, للمتكبر الذي يأمر الناس بخدمته]
  note: من كسله يطلب أن يقرّبوا إليه الجدار ليمسح عليه أنفه بدل أن يمشي إليه.
  source: adimi
  page: 304
  status: draft

- id: xu0192
  kind: usage
  prompt: الساكت له حقين
  answer: لمن يطلب حقه بأدب فيكسب أكثر
  others: [لمن يسكت عن الظلم فيضيع حقه, لمن يكتم السر فيأمنه الناس, لمن يقلّ كلامه فيُظن به الجهل]
  note: من تلطف في المطالبة ولم يزاحم غيره نال حقه وزاد عليه حسن الذكر.
  source: adimi
  page: 117
  status: draft

- id: xu0193
  kind: usage
  prompt: الحساب صابون القلوب
  answer: للشركاء والمتعاملين حتى لا يبقى بينهم شك
  others: [للتجار الذين يكثرون من الربح على حساب الناس, للأصدقاء الذين يتعاتبون بعد طول جفاء, للتلاميذ الذين يتعلمون الحساب صغارا]
  note: وضوح الحساب يغسل القلوب من الشك والظنون، فيبقى الود بين المتعاملين.
  source: adimi
  page: 125
  status: draft

- id: xu0194
  kind: usage
  prompt: إذا يدك تحت الحجر جرّها بالبصر
  hint: بالبصر أي بتأنٍّ وحذر
  answer: لمن له حق عند قوي فيطالبه برفق ولين
  others: [لمن وقع في ضيق فيصبر حتى يفرّجه الله, لمن يعمل في البناء فيحذر من سقوط الحجارة, لمن يقرض ماله فيتأنى في استرداده]
  note: إذا كانت يدك محشورة تحت حجر فاسحبها بهدوء؛ والضعيف يطلب حقه من القوي بالتلطف لا بالعنف.
  source: adimi
  page: 85
  status: draft

- id: xu0195
  kind: usage
  prompt: بيعيش على دلو الباري
  answer: لمن يعيش على ما يقدمه له غيره
  others: [لمن يعيش من عرق جبينه, لمن يقنع بالقليل ولا يطلب المزيد, لمن يسقي الناس دون أجر]
  note: يقال لمن يعتمد في عيشه على عون الآخرين، واليد العليا خير من اليد السفلى.
  source: adimi
  page: 145
  status: draft

- id: xu0196
  kind: usage
  prompt: إذا قدك سارح كثّر الفضائح
  hint: سارح أي راحل
  answer: لمن يُظهر أسوأ ما فيه قبيل رحيله
  others: [لمن يكثر الوداع ويطيل البقاء, لمن يفضح أسرار أصحابه في غيابهم دون حياء, لمن يرحل دون أن يودّع أحدا]
  note: من عزم على الرحيل لم يعد يبالي بما يقال عنه، فيكشف عيوبه قبل أن يمضي.
  source: adimi
  page: 84
  status: draft

- id: xu0197
  kind: usage
  prompt: الشر طلع من بين العصيد
  hint: العصيد طعام يمني معروف
  answer: حين يأتي الشر فجأة من حيث لا يُتوقع
  others: [حين يختلف الأهل على الطعام والميراث, حين يكون الضيف سبب الخصام, حين يفسد الطبخ بسبب العجلة]
  note: كأن الشر خرج من صحن العصيد الذي لا يخطر بالبال؛ يقال حين يقع الأذى بغتة.
  source: adimi
  page: 56
  status: draft

- id: xu0198
  kind: usage
  prompt: حجرة سقطت بير
  answer: لمن ينقطع ذكره ويغيب أثره تماما
  others: [لمن يقع في ورطة لا خروج منها, لمن يكتم سرّا لا يبوح به, لمن يتكلم كلاما ثقيلا على السامعين]
  note: الحجر الذي يقع في البئر لا يعود ولا يُرى؛ يقال للشيء أو الشخص الذي يختفي ذكره.
  source: adimi
  page: 192
  status: draft

- id: xu0199
  kind: usage
  prompt: جمل يعصر وجمل يأكل عصار
  hint: العُصار ما يبقى بعد عصر السمسم
  answer: حين يتعب أحدهم ويجني غيره ثمرة تعبه
  others: [حين يتقاسم الشريكان الربح بالعدل بعد تعب طويل, حين يعمل الجميع ولا يربح أحد, حين يأكل العامل من صنع يده]
  note: في معصرة السمسم يدور جمل ويكدح، بينما يأكل جمل آخر البقايا دون جهد.
  source: adimi
  page: 178
  status: draft

- id: xu0200
  kind: usage
  prompt: سراج جارك ما يضيء لك
  answer: لمن يعتمد على ما في يد غيره
  others: [لمن يحسد جاره على ما عنده من نعمة, لمن يبخل على جاره بالعون, لمن يسهر ويزعج جيرانه]
  note: ما بيد غيرك لا ينفعك وقت حاجتك، فاعتمد على ما تملك.
  source: adimi
  page: 243
  status: draft

- id: xu0201
  kind: usage
  prompt: ضربة بشق غيرك كأنها بالزيلة
  hint: الزيلة كومة من التراب
  answer: لمن يستخف بألم غيره ولا يراعيه
  others: [لمن يتحمل الأذى عن أصحابه, لمن يضرب ضربة طائشة لا تصيب من أرادها, لمن يصبر على الألم دون شكوى]
  note: الضربة على جنب غيرك تبدو لك هيّنة كأنها على كومة تراب؛ فلا يحس بالوجع إلا صاحبه.
  source: adimi
  page: 265
  status: draft

- id: xu0202
  kind: usage
  prompt: أتلم عقور وما كان يكون
  hint: أتلم أي احرث، والعقور الأرض الصلبة
  answer: اعمل ما عليك وتوكّل على الله
  others: [لا تتعب نفسك في عمل لا ثمر له, اختر الأرض الطيبة قبل أن تبدأ, لا تبدأ عملا حتى تضمن نتيجته]
  note: الضربة على جنب غيرك تبدو هيّنة كأنها على كومة تراب؛ يقال لمن يطمع فيما عند غيره ولا يراعي قدرته.
  source: adimi
  page: 59
  flag: 'answer may be wrong: The answer (someone who makes light of others'' pain and shows no regard for it) only partly fits. The book''s usage is someone who covets or demands what others have without regard for their means.'draft

- id: xu0203
  kind: usage
  prompt: حج وبيع مسابح
  answer: لمن يقضي أمرين في سفرة واحدة
  others: [لمن يتظاهر بالتقوى ليكسب المال, لمن يؤخر عمله الواجب لعمل أقل منه, لمن يبيع ما ليس له]
  note: يذهب للحج ويتاجر بالمسابح في الطريق نفسه؛ كقولهم «عصفوران بحجر».
  source: adimi
  page: 187
  status: draft

- id: xu0204
  kind: meaning
  prompt: كوز بطاقة
  hint: الطاقة كوّة في الجدار
  answer: شخص خامل بلا نفع ولا ضرر
  others: [شخص بخيل يخبئ ماله, شخص كتوم لا يبوح بسر لأحد, شخص كريم يسقي الناس]
  note: كالكوز الموضوع في الكوّة لا يتحرك؛ يوصف به من لا أثر له.
  source: adimi
  page: 319
  status: draft

- id: xu0205
  kind: usage
  prompt: حسنة وفيها ذباب
  answer: لمن يحسن عمله ثم يفسده بما يشينه
  others: [لمن يتصدق بالقليل ويتباهى به, لمن يرفض الهدية لعيب صغير فيها لا يكاد يُرى, لمن يأكل طعاما مكشوفا]
  note: كطعام طيب سقط فيه الذباب؛ يقال لمن يخلط عملا صالحا بآخر سيء.
  source: adimi
  page: 192
  status: draft

- id: xu0206
  kind: usage
  prompt: إذا لم يبكي الطفل ما حد يبزيه
  hint: يبزيه أي يرضعه
  answer: لمن يسكت عن حقه فلا يعطيه إياه أحد
  others: [لمن يكثر الشكوى حتى يملّه الناس ويتركوه, لمن يدلّل أولاده فيفسدهم, لمن ينتظر العون من غير أهله]
  note: بعض الحقوق لا تُنال إلا بالمطالبة بها، كالطفل الذي لا يُرضَع حتى يبكي.
  source: adimi
  page: 83
  status: draft

- id: xu0207
  kind: usage
  prompt: ما شي كما شي ولا مطر الصبح كمطر العشي
  hint: العشي آخر النهار
  answer: حين يُشبَّه شيء بآخر وبينهما فرق كبير
  others: [حين ينتظر الناس المطر فيتأخر عن موعده, حين يتكرر الأمر نفسه كل يوم بلا تغيير, حين يختلف أهل القرية على قسمة الماء]
  note: ليست الأشياء سواء وإن تشابهت، كما لا يستوي مطر الصباح ومطر المساء.
  source: adimi
  page: 397
  status: draft

- id: xu0208
  kind: usage
  prompt: جاءت مع التحكاكة
  hint: التحكاكة الحكّة
  answer: حين تفسّر الصدفة أمرا لا يُصدَّق
  others: [حين يتأخر الضيف ثم يصل مع غيره, حين يشتكي المريض من الحكة, حين يصيب الصياد صيده من أول رمية]
  note: يُروى أن رجلا زعم أنه أصاب ظلف الغزال وقرنه برمية واحدة، فلما سُئل كيف اجتمعا قال «جاءت مع التحكاكة»، أي صادف أن الغزال كان يحك رأسه.
  source: adimi
  page: 177
  status: draft

- id: xu0209
  kind: usage
  prompt: تاجر عدن يرجع وراد
  hint: الوراد هو السقّاء
  answer: للتاجر الذي يهمل تجارته حتى يفتقر
  others: [للتاجر الذي يغتني بعد فقر, للتاجر الذي يترك مدينته ويسافر, للتاجر الذي يبيع الماء بأغلى الأثمان]
  note: التاجر الغني إذا أهمل تجارته انتهى به الحال سقّاءً يحمل الماء للناس.
  source: adimi
  page: 161
  status: draft

- id: xu0210
  kind: usage
  prompt: أذكر الحي والتفت
  answer: حين يظهر الشخص فجأة بعد ذكره بقليل
  others: [حين يتذكر المرء ميتا عزيزا عليه فيحزن, حين يُغتاب الغائب فيُنصح بالحذر, حين يطول غياب صديق فيُسأل عنه]
  note: ما إن تذكر غائبا حتى تلتفت فتجده أمامك؛ يشبه قولهم في بلاد أخرى «جبنا سيرته فجاء».
  source: adimi
  page: 85
  status: draft

- id: xu0211
  kind: usage
  prompt: بارك الله بالفتة ولو على ماء
  hint: الفتة طعام يشبه الثريد
  answer: للرضا بالقليل والبركة فيه
  others: [لذم البخيل الذي يقدم طعاما رديئا, للحث على إطعام الضيف أفضل ما في البيت, لمن يأكل كثيرا ولا يشبع]
  note: الفتة طيبة ولو صُبّ عليها الماء وحده؛ فالقليل المبارك خير.
  source: adimi
  page: 146
  status: draft

- id: xu0212
  kind: usage
  prompt: جدار سقط العام طلع غباره السنة
  hint: السنة أي هذا العام
  answer: لمن ينبش أحداثا قديمة نسيها الناس
  others: [لمن يتأخر في إصلاح بيته حتى يسقط على أهله, لمن يتأخر رد فعله على الإساءة, لمن يتعلم من أخطاء الماضي]
  note: الجدار سقط منذ عام وهو يثير غباره الآن؛ أي يعيد ما مضى وانتهى.
  source: adimi
  page: 175
  status: draft

- id: xu0213
  kind: usage
  prompt: راعي جمل خالته
  answer: لمن يتراخى في أداء ما أُوكل إليه
  others: [لمن يحسن رعاية مال غيره كأنه ماله, لمن يخدم أقاربه دون مقابل, لمن يطمع في مال أهله]
  note: من يرعى جملا ليس له لا يبذل فيه جهدا؛ يقال لمن يتقاعس عن عمل لا يعود عليه نفعه.
  source: adimi
  page: 226
  status: draft

- id: xu0214
  kind: usage
  prompt: لو زرعنا لو في وادي عسى ما طلع شيء
  answer: لمن يعلّق أمره على الأماني بدل العمل
  others: [لمن يزرع في أرض بعيدة عن الماء, لمن ييأس من رحمة الله بعد أول فشل, لمن يندم على ما فات ويكثر البكاء عليه]
  note: «لو» و«عسى» لا تنبتان زرعا؛ فالتمني وحده لا يأتي بنتيجة.
  source: adimi
  page: 355
  status: draft

- id: xu0215
  kind: meaning
  prompt: برد الوقوف حل تحت السقوف
  answer: البرد شديد جدا
  others: [البيت لا يقي من المطر, الضيوف طال وقوفهم, الحر يشتد في الصيف]
  note: البرد الذي يُحس به الواقف في العراء دخل حتى تحت السقوف؛ كناية عن قسوة البرد.
  source: adimi
  page: 151
  status: draft

- id: xu0216
  kind: usage
  prompt: أما حمولة وسيرة بالكمال وإلا فخلّي الحمولة للجمال
  answer: أتمّ العمل أو اتركه لمن يقدر عليه
  others: [قسّم الحمل الثقيل بين الناس, لا تحمّل غيرك من العمل ما لا تحمله أنت, خذ من العمل ما يناسب أجرك]
  note: إن حملت الحمل فأوصله إلى غايته، وإلا فدعه للجمال القادرة عليه.
  source: adimi
  page: 70
  status: draft

- id: xu0217
  kind: usage
  prompt: القفا محمل
  answer: لمن يُذمّ في غيابه ولا يسمع ما قيل
  others: [لمن يحمل أعباء غيره دون شكوى, لمن يدير ظهره لأصحابه وقت الشدة ويتركهم, لمن يتظاهر بالقوة وهو ضعيف]
  note: ما يقال من خلف الظهر لا يؤذي صاحبه لأنه لم يسمعه.
  source: adimi
  page: 120
  status: draft

- id: xu0218
  kind: usage
  prompt: الصميل خرج من الجنة
  hint: الصميل هو العصا
  answer: لمن لا يصلحه إلا الحزم والشدة
  others: [لمن يفرط في ضرب أولاده, لمن يتكئ على عصاه من الكبر, لمن يملك القوة ولا يستعملها عند الحاجة]
  note: كأن العصا جاءت من الجنة لما فيها من إصلاح؛ يقال لمن لم ينفعه اللين.
  source: adimi
  page: 117
  status: draft

- id: xu0219
  kind: usage
  prompt: حاذق على حاذق خساره
  answer: حين يتعامل ماهران فيفشل الاتفاق بينهما
  others: [حين يتعلم التلميذ من أستاذه أكثر مما يعلم, حين يغلب الذكي من هو أقل منه, حين يتنافس اثنان فيربح الأمهر]
  note: كل منهما يحاول أن يغلب صاحبه، فتضيع الصفقة على الاثنين.
  source: adimi
  page: 192
  status: draft

- id: xu0220
  kind: usage
  prompt: أربعة شلّوا جمل والجمل ما شلّهم
  hint: شلّوا أي رفعوا
  answer: للتذكير بأن الجماعة تقدر على ما يعجز عنه الفرد
  others: [للتذكير بأن القوي لا يحتاج إلى عون أحد مهما ثقل حمله, للتذكير بأن كثرة الأيدي تُفسد العمل, للتذكير بأن الحيوان أقوى من الإنسان]
  note: أربعة رجال يحملون جملا ولا يقدر الجمل على حملهم؛ فقوة الجماعة تغلب.
  source: adimi
  page: 112
  status: draft

- id: xu0221
  kind: usage
  prompt: عصيدك وأنت متنيها
  answer: لمن صنع المشكلة فعليه أن يحلها بنفسه
  others: [لمن يتعب في عمل لا يأكل من ثمرته شيئا, لمن يطبخ لغيره ويبقى جائعا, لمن يصرّ على رأيه رغم نصح الناس]
  note: أنت من أعددت هذا العصيد فتولَّ أمره؛ أي تحمّل نتيجة ما جنيت.
  source: adimi
  page: 283
  status: draft

- id: xu0222
  kind: usage
  prompt: بكم القوس يا والد قال بيجي لك بلاش
  hint: القوس هنا انحناء الظهر من الكبر
  answer: لمن يسخر من شيخوخة غيره وهي آتية إليه
  others: [لمن يشتري سلاحا غاليا لا يعرف كيف يستعمله, لمن يساوم على شيء لا يُباع, لمن يطلب النصيحة ثم لا يعمل بها]
  note: سأل الشاب العجوز عن ثمن انحناء ظهره، فأجابه بأنه سيأتيه مجانا؛ فلا تسخر من الكبر.
  source: adimi
  page: 150
  status: draft

- id: xu0223
  kind: usage
  prompt: الحمار يبدأ يتعلم بأمّه
  answer: لمن يبدأ أذاه بأهله وأقاربه
  others: [لمن يتعلم صنعته من والديه, لمن لا يحترم من هو أكبر منه, لمن يكرر أخطاء من سبقوه]
  note: يقال لمن يجرّب سوء طبعه أولا على أهله فيؤذيهم قبل غيرهم.
  source: adimi
  page: 69
  status: draft

- id: xu0224
  kind: usage
  prompt: إذا بكّر مغوي أعمل لك مظلة
  hint: المغوي الغيم الخفيف الذي يبشّر بالمطر
  answer: دعوة إلى الاستعداد عند ظهور أول العلامات
  others: [دعوة إلى الخروج للعمل في الصباح الباكر قبل الحر, دعوة إلى الصبر حتى ينجلي الغيم, دعوة إلى عدم الخوف من تقلبات الطقس]
  note: إذا ظهر الغيم في الصباح فجهّز ما يقيك المطر، فالعاقل يستعد للأمر قبل وقوعه.
  source: adimi
  page: 72
  status: draft

- id: xu0225
  kind: usage
  prompt: حمار تركب عليه ولا جمل يهدر عليك
  hint: يهدر أي يصيح غاضبا
  answer: نصيحة باختيار ما تقدر عليه وتملك زمامه
  others: [نصيحة بشراء الأقوى ولو كان أغلى, نصيحة بالصبر على الشريك الصعب, نصيحة بترك الركوب والمشي على القدمين طلبا للصحة]
  note: الحمار المطيع خير لك من جمل عظيم لا تقدر عليه؛ فاختر ما يناسب طاقتك.
  source: adimi
  page: 189
  status: draft

- id: xu0226
  kind: meaning
  prompt: باضت له في القفص
  answer: تيسّرت أموره وواتاه الحظ
  others: [وقع في فخ نُصب له, خدعه أقرب الناس إليه, نال شيئا ثم ضيّعه]
  note: لم تبض دجاجته بعيدا في الشجر، بل في قفصه نفسه؛ كناية عن سهولة الأمور وحسن الحظ.
  source: taymur_kinayat
  page: 21
  status: draft

- id: xu0227
  kind: meaning
  prompt: لت وعجن
  answer: أكثر الكلام وأطاله وأعاد ما قيل
  others: [أتقن عمله في المخبز حتى صار خبزه أطيب خبز, أعدّ الطعام لضيوفه, اجتهد في خدمة أهله]
  note: يقولون «قاعد يلت ويعجن».
  source: taymur_kinayat
  page: 69
  status: draft

- id: xu0228
  kind: meaning
  prompt: مافيش صريخ ابن يومين
  answer: ليس في المكان أحد
  others: [ليس في البيت أطفال, المكان مليء بالأطفال, المكان هادئ للنوم]
  note: أي لا كبير ولا صغير يصرخ فيه؛ والعرب تقول «ما في الدار صافر».
  source: taymur_kinayat
  page: 73
  status: draft

- id: xu0229
  kind: meaning
  prompt: إيدك والأرض
  answer: لا يملك شيئًا يُطمع في أخذه
  others: [يعطي كل ما يملك بسخاء لمن يطلبه, يعمل بيديه في الزراعة, يتمسك بأرضه ولا يبيعها]
  note: أي ليس معه إلا يدك والأرض، فماذا تأخذ منه؟
  source: taymur_kinayat
  page: 19
  status: draft

- id: xu0230
  kind: meaning
  prompt: أكل وشه
  answer: عاتبه ولامه لومًا شديدًا
  others: [أهانه أمام الناس, أكرمه وأحسن ضيافته في بيته, استغله وأخذ ماله]
  note: 'الوش هو الوجه؛ ويروى عن ظريف قال: أصحابي قسمان، قسم يأكل طعامي وقسم يأكل وجهي.'
  source: taymur_kinayat
  page: 19
  status: draft

- id: xu0231
  kind: meaning
  prompt: عطس نزله من مناخيره
  answer: شدة الشبه بين شخصين
  others: [شدة الكره بين شخصين, سرعة الغضب, الاستخفاف بالآخرين]
  note: كأن أحدهما عطس فخرج الآخر من أنفه شبيهًا به.
  source: taymur_kinayat
  page: 57
  status: draft

- id: xu0232
  kind: meaning
  prompt: ضرب الدنيا طبنجه
  answer: لم يكترث بشيء فيها
  others: [انتقم من أعدائه, أحدث ضجة كبيرة, أصيب بمصيبة]
  note: الطبنجة مسدس صغير؛ كأنه رمى الدنيا برصاصة فقتلها.
  source: taymur_kinayat
  page: 49
  status: draft

- id: xu0233
  kind: meaning
  prompt: حصيرة الصيف واسعه
  answer: في الصيف يتسع المكان للضيوف ولو باتوا في العراء
  others: [بيوت الصيف أوسع من بيوت الشتاء, الرزق في الصيف أوفر, الصيف موسم الأعراس والأفراح فتكثر فيه الولائم والحفلات]
  note: في الصيف لا حاجة إلى سقف، فالحصيرة تتسع للجميع.
  source: taymur_kinayat
  page: 29
  status: draft

- id: xu0234
  kind: meaning
  prompt: زياره على حماره
  answer: زيارة عابرة بلا قصد
  others: [زيارة طويلة متعبة, زيارة للصلح بعد خصام, زيارة رسمية كريمة]
  note: لو قصد الزيارة لجاء على بغل أو فرس تعظيمًا لصاحبها.
  source: taymur_kinayat
  page: 39
  status: draft

- id: xu0235
  kind: meaning
  prompt: من الباب للطاق
  answer: إثارة الخصام فجأة بلا سبب
  others: [الدخول إلى البيت بلا استئذان, الانتقال من فقر إلى غنى, الهرب من البيت]
  note: كمن يدخل الدار فلا يكاد يجاوز الباب حتى يسرع إلى الطاق.
  source: taymur_kinayat
  page: 75
  status: draft

- id: xu0236
  kind: meaning
  prompt: نام وحط في بطنه بطيخه صيفي
  answer: نام آمنًا مطمئنًا لا يبالي بشيء
  others: [نام جائعًا بلا عشاء, نام متخمًا من كثرة الأكل حتى مرض, نام قلقًا ينتظر خبرًا]
  note: بطيخ الصيف كبير ممتلئ، فكأنه نام منتفخ البطن من الطمأنينة.
  source: taymur_kinayat
  page: 30
  status: draft

- id: xu0237
  kind: meaning
  prompt: عنده السر بالمقلاع
  answer: لا يكتم السر
  others: [يحفظ السر حفظًا تامًا, يجيد الرمي, يعرف أسرار الناس كلهم]
  note: المقلاع حبل يُرمى به الحجر بعيدًا، فهو يقذف بالسر هنا وهناك.
  source: taymur_kinayat
  page: 58
  status: draft

- id: xu0238
  kind: meaning
  prompt: جرحه طري
  answer: مصيبته قريبة العهد
  others: [قلبه رقيق سريع التأثر, صحته ضعيفة, غضبه سريع الزوال]
  note: الجرح الطري لم يندمل بعد، وكذلك المصيبة الحديثة.
  source: taymur_kinayat
  page: 27
  status: draft

- id: xu0239
  kind: meaning
  prompt: حط الهم في الترباس
  answer: صبّ غضبه على من لا ذنب له
  others: [أغلق بابه ونسي همومه, كتم همه عن أهله, استعد للسفر ليلًا]
  note: الترباس مزلاج الباب؛ لم يجد من يغضب عليه فراح يعالج المزلاج.
  source: taymur_kinayat
  page: 30
  status: draft

- id: xu0240
  kind: meaning
  prompt: سمك لبن تمر هندي
  answer: الخلط الشديد بين الأشياء
  others: [المائدة العامرة بالطعام, الطعام الشهي اللذيذ, الجمع بين الحلو والمر في الحياة]
  note: يجمع أشياء لا يصح جمعها؛ وبعضهم يزيد تهكمًا «خل رايق بكر عال».
  source: taymur_kinayat
  page: 42
  status: draft

- id: xu0241
  kind: meaning
  prompt: بالعربي
  answer: الصراحة في القول بلا مواربة
  others: [الكلام بلغة فصيحة متقعرة, الحديث بصوت مرتفع, الكلام بلهجة البادية]
  note: يقولون «قلت له بالعربي» أي أوضحت مرادي بلا لف ولا دوران.
  source: taymur_kinayat
  page: 22
  status: draft

- id: xu0242
  kind: meaning
  prompt: إدارى في ضل صباعه
  answer: شدة الجبن والفزع
  others: [شدة التواضع وإنكار الذات, الحرص على كتمان السر, الهرب من دفع الدين]
  note: من شدة خوفه يحاول الاختباء ولو خلف ظل إصبعه.
  source: taymur_kinayat
  page: 17
  status: draft

- id: xu0243
  kind: meaning
  prompt: هف طلع النهار
  answer: زال الشيء بسرعة
  others: [جاء الصباح مبكرًا, ظهر الشيء بعد خفاء, استيقظ مبكرًا]
  note: كانوا ينفخون على شموع العرس آخر الليل فتنطفئ بطلوع النهار.
  source: taymur_kinayat
  page: 79
  status: draft

- id: xu0244
  kind: meaning
  prompt: بلع ريقه
  answer: هدأ واطمأن بعد تعب أو فزع
  others: [سكت خوفًا من العقاب, اشتهى طعامًا رآه, أخفى غضبه عن الناس]
  note: يقولون «اصبر لما ابلع ريقي» أي أمهلني حتى أستريح.
  source: taymur_kinayat
  page: 23
  status: draft

- id: xu0245
  kind: meaning
  prompt: طظ فش
  answer: تافه لا طائل تحته
  others: [قوي ثابت لا يتزعزع, جديد لم يُستعمل, نادر غالي الثمن]
  note: طظ الصوت، وفش خروج الريح من الشيء المنتفخ؛ فلا تغرنك فرقعته.
  source: taymur_kinayat
  page: 51
  status: draft

- id: xu0246
  kind: meaning
  prompt: قطع الحليبه والرايبه
  answer: بلغ الغاية في الإساءة وقطع كل صلة
  others: [ترك شرب اللبن, أصلح ما بين الناس, أفسد طعامه بكثرة الملح فلم يأكله أحد من ضيوفه]
  note: ويقال للمشؤوم الذي يقطع الخير عن القوم إذا حلّ بهم.
  source: taymur_kinayat
  page: 64
  status: draft

- id: xu0247
  kind: meaning
  prompt: زرعه زرع بصل
  answer: صرعه وقلبه رأسًا على عقب
  others: [علّمه الصبر, أهمله وتركه, أخفاه عن الأنظار]
  note: رؤوس البصل تُزرع منكسة، وكذلك من يُطرح أرضًا.
  source: taymur_kinayat
  page: 39
  status: draft

- id: xu0248
  kind: meaning
  prompt: ساق الهباله على الشيطنه
  answer: خلط التغابي بالمكر ليحتال على غرضه
  others: [تاب عن مكره وصار ساذجًا, أضحك الناس بحماقته حتى صار مضرب المثل في الغفلة, عاقب الماكر بعقوبة شديدة]
  note: الهبالة البلاهة والشيطنة الخبث؛ يتظاهر بالأولى ليصل بالثانية.
  source: taymur_kinayat
  page: 41
  status: draft

- id: xu0249
  kind: meaning
  prompt: إتاوب ع الناموس
  answer: الفقر الشديد وخلو البيت من الطعام
  others: [الكسل وكثرة النوم حتى يفوته عمله كله, الضجر من طول الانتظار, التعب بعد سهر طويل]
  note: يتثاءب فاتحًا فمه للبعوض كأنه لا يجد طعامًا غيره؛ صورة ساخرة لشدة الفقر.
  source: taymur_kinayat
  page: 17
  status: draft

- id: xu0250
  kind: meaning
  prompt: لعب الفار في عبه
  answer: تنبه للأمر وقلق منه
  others: [ضحك حتى دمعت عيناه, أهمل نظافة بيته, خاف من فأر رآه]
  note: العبّ ما يلي الصدر من الثوب.
  source: taymur_kinayat
  page: 70
  status: draft

- id: xu0251
  kind: meaning
  prompt: وراه العين الحمره
  answer: نظر إليه نظرة الغضب والشدة
  others: [بكى أمامه من الحزن, سهر معه حتى الصباح, أظهر له الحب والمودة أمام الناس]
  note: العين الحمراء أي الحمراء غضبًا.
  source: taymur_kinayat
  page: 58
  status: draft

- id: xu0252
  kind: meaning
  prompt: يفحت البير بإبره
  answer: يحسن الحيلة ويصبر حتى يبلغ غرضه
  others: [يضيع وقته في ما لا فائدة فيه, يبالغ في الدقة حتى يفسد العمل, يحاول المستحيل فيعجز]
  note: أي يحفر البئر بإبرة، يعمل ببطء في الخفاء حتى يتم له ما أراد.
  source: taymur_kinayat
  page: 61
  status: draft

- id: xu0253
  kind: meaning
  prompt: جابها في قبته
  answer: ألصق التهمة به بالحيلة
  others: [أعطاه هدية ثمينة, أخذ منه ما يريد خلسة, كلّفه بمهمة صعبة]
  note: القبّة طوق القميص؛ أي علّق التهمة في عنقه حتى لزمته.
  source: taymur_kinayat
  page: 27
  status: draft

- id: xu0254
  kind: meaning
  prompt: خد بحقه حلفه
  answer: انتقم من خصمه وآلمه ولو بالقليل
  others: [تنازل عن حقه طلبًا للصلح, حلف يمينًا كاذبة ليأخذ حقه من خصمه, أخذ حقه كاملًا بالقانون]
  note: أصله «خد بحقك حلفه واحرقه»، والحلفة نبات تافه يُقتلع من أرض الغريم.
  source: taymur_kinayat
  page: 33
  status: draft

- id: xu0255
  kind: meaning
  prompt: وراه نجوم الضهر
  answer: شدّد عليه وضايقه
  others: [علّمه علم الفلك, أطال سهره, أعجبه إعجابًا شديدًا]
  note: أي أراه النجوم في وضح الظهيرة.
  source: taymur_kinayat
  page: 81
  status: draft

- id: xu0256
  kind: meaning
  prompt: مالوش وش
  answer: خجلان لا يقدر على مواجهة أحد
  others: [قبيح الوجه لا يحب الناس النظر إليه, وقح لا يستحي, مجهول لا يعرفه أحد]
  note: ويقولون «ما خليت لوش وش» أي أخجلته حتى لم يحر جوابًا.
  source: taymur_kinayat
  page: 73
  status: draft

- id: xu0257
  kind: meaning
  prompt: سمن وعسل
  answer: شدة الوفاق والصفاء بين اثنين
  others: [الرخاء وكثرة الخير, الطعام الدسم الذي يقدم للضيوف في الأعياد, الكلام المعسول الكاذب]
  note: يقولون «فلان وفلان سمن وعسل»، والعرب تعبر عن ذلك بالماء والخمر.
  source: taymur_kinayat
  page: 42
  status: draft

- id: xu0258
  kind: meaning
  prompt: كلمه ورد غطاها
  answer: غاية الاختصار في الكلام
  others: [غاية الكرم, غاية الأدب في الحديث, غاية الغضب]
  note: كمن رفع الغطاء عن قدر ثم أعاده؛ لم يزد على الجواب.
  source: taymur_kinayat
  page: 68
  status: draft

- id: xu0259
  kind: meaning
  prompt: بيته مفتوح
  answer: الجود والكرم مع سعة الحال
  others: [الإهمال وقلة الحرص, كثرة الأولاد, الفقر وخلو البيت من المتاع]
  note: كناية عمن يستقبل الضيوف دائمًا ولا يرد قاصدًا.
  source: taymur_kinayat
  page: 23
  status: draft

- id: xu0260
  kind: meaning
  prompt: ما يسواش ملو ودنه نخاله
  answer: لا قيمة له
  others: [لا يسمع النصيحة, بخيل لا يعطي, طماع لا يشبع]
  note: الودن الأذن، والنخالة بقايا الدقيق بعد نخله.
  source: taymur_kinayat
  page: 74
  status: draft

- id: xu0261
  kind: meaning
  prompt: بينادي ع الناموس
  answer: ينادي فلا يجيبه أحد
  others: [يتكلم في نومه, يشكو من البعوض, يرفع صوته بلا سبب]
  note: في معنى «لا حياة لمن تنادي».
  source: taymur_kinayat
  page: 77
  status: draft

- id: xu0262
  kind: meaning
  prompt: أجر مناول
  answer: لا نصيب له إلا تعب الاستلام والتسليم
  others: [ثواب عظيم ينتظره على عمله في الدنيا والآخرة, مكافأة سخية على جهد يسير, دَين قديم يطالب به صاحبه]
  note: يقولها من يوصل الشيء إلى غيره ولا يناله منه شيء، تهكمًا على أن أجره هو التعب وحده.
  source: taymur_kinayat
  page: 17
  status: draft

- id: xu0263
  kind: meaning
  prompt: غسل ونشر
  answer: أكثر من الكلام المؤلم وأبرق وأرعد
  others: [أصلح ما أفسده غيره وأعاد الأمور إلى نصابها, أنهى عمله كله, أفشى السر بين الناس]
  note: كأنه غسل ثيابه ثم نشرها لتجف.
  source: taymur_kinayat
  page: 59
  status: draft

- id: xu0264
  kind: meaning
  prompt: صرف الجنيه خماسي
  answer: كثرة الناس في المكان
  others: [غلاء الأسعار, ضياع المال في التفاهات, الربح الكثير في التجارة]
  note: الجنيه إذا صُرف بقطع نحاس صغيرة صار عددًا كثيرًا، وكذلك الناس.
  source: taymur_kinayat
  page: 47
  status: draft

- id: xu0265
  kind: meaning
  prompt: نفخ في قربه مقطوعه
  answer: حاول أمرًا لا جدوى منه
  others: [أسرف في ماله, فقد صبره من طول الانتظار, غضب غضبًا شديدًا]
  note: القربة المقطوعة لا تنتفخ مهما نُفخ فيها.
  source: taymur_kinayat
  page: 77
  status: draft

- id: xu0266
  kind: meaning
  prompt: جته المصيبه على الريق
  answer: أصابته فجأة وعاجلًا
  others: [أصابته وهو صائم, أصابته في آخر النهار, أصابته بعد أن توقعها]
  note: «على الريق» قبل الأكل صباحًا، ثم كنّوا به عما يأتي مبكرًا مباغتًا.
  source: taymur_kinayat
  page: 57
  status: draft

- id: xu0267
  kind: meaning
  prompt: رجع إيد ورا وإيد قدام
  answer: رجع خائبًا لا يحمل شيئًا
  others: [رجع مسرورًا بما نال, رجع متعبًا من السفر, رجع ليعتذر عما بدر منه من خطأ]
  note: أي يحرك ذراعيه فارغتين، ولو حمل شيئًا لانشغلت يداه.
  source: taymur_kinayat
  page: 38
  status: draft

- id: xu0268
  kind: meaning
  prompt: قليل الطهي
  answer: الجلف الذي لا يراعي الذوق
  others: [الفقير الذي لا يجد ما يطبخه, البخيل على ضيوفه, الزاهد في الطعام]
  note: ليس المراد الفقر بل قلة المعرفة بالطبخ، ثم كنوا به عمن لا ذوق له في معاملته.
  source: taymur_kinayat
  page: 65
  status: draft

- id: xu0269
  kind: meaning
  prompt: انقطع سبحه
  answer: نفد جهده وانتهى أمره
  others: [ضاع منه طريقه, انقطعت صلته بأهله, كفّ عن الكلام فجأة]
  note: السبح هو العوم؛ فهو كالسابح الذي خارت قواه في الماء.
  source: taymur_kinayat
  page: 19
  status: draft

- id: xu0270
  kind: meaning
  prompt: كسر على مناخيره بصله
  answer: ذلّ وخضع بعد إباء وكبرياء
  others: [بكى بكاءً شديدًا, أفاق من إغمائه بعد أن شمّ رائحة البصل, أكل طعامًا رخيصًا]
  note: المناخير الأنف؛ أي فعل ذلك رغم أنفه.
  source: taymur_kinayat
  page: 67
  status: draft

- id: xu0271
  kind: meaning
  prompt: زود المبله طين
  answer: زاد الأمر الفاسد فسادًا
  others: [أصلح ما أفسده غيره, أكثر من الكلام في المجلس بلا داع, أسرف في الإنفاق]
  note: المبلة موضع نقع الكتان، فإذا زيد طينًا ازداد فسادًا.
  source: taymur_kinayat
  page: 39
  status: draft

- id: xu0272
  kind: meaning
  prompt: ما شمتش على ضهر إيدي
  answer: لا أعلم الغيب
  others: [لم أذق الطعام بعد, لم أشعر بالخطر, لم أصافح أحدًا]
  note: أي لم يكن لهذا الخبر رائحة على ظهر يدي فأشمها.
  source: taymur_kinayat
  page: 45
  status: draft

- id: xu0273
  kind: meaning
  prompt: حرق الأخضرين
  answer: بلغ الغاية في الإساءة
  others: [أسرف في الإنفاق على زرعه, أتقن عمله في الحقل, أخطأ خطأ صغيرًا]
  note: الأخضران هما الزرع؛ ومن أحرقهما لم يترك من الأذى شيئًا.
  source: taymur_kinayat
  page: 29
  status: draft

- id: xu0274
  kind: meaning
  prompt: دخل في مشطي
  answer: أعجبني واقتنع به عقلي
  others: [ضايقني وأزعجني, تدخل في شؤوني, تأخر عن موعده]
  note: المشط يُسرَّح به الشعر وقد يُترك عالقًا فيه، فكأن الأمر دخل رأسه وبقي فيه فارتضاه عقله.
  source: taymur_kinayat
  page: 35
  status: draft

- id: xu0275
  kind: usage
  prompt: ياما في الجراب يا حاوي
  answer: لمن يملك الكثير ويخفيه حتى يحين وقته
  others: [لمن يدّعي ما ليس عنده, لمن ينفق كل ما يكسبه, لمن يُكثر الكلام بلا فائدة]
  note: الحاوي يخفي في جرابه أدواته وحيّاته ويُخرج منها ما يشاء؛ ويقال لمن يكتم علمه أو حيلته ثم يُظهرها عند الحاجة.
  source: taymur
  page: 391
  status: draft

- id: xu0276
  kind: usage
  prompt: عنزه ولو طارت
  answer: لمن يتمسك برأيه بعد أن يتبين خطؤه
  others: [لمن يطمع فيما لا يُنال, لمن يصدّق كل ما يسمع, لمن يبالغ في وصف ما رآه]
  note: رأى رجل شيئا فقال إنه عنزة، فلما طار وتبيّن أنه حدأة أصرّ على قوله.
  source: taymur
  page: 254
  status: draft

- id: xu0277
  kind: usage
  prompt: هاتوا م المزابل حطوا ع المنابر
  answer: في تولية غير الأكفاء
  others: [في إصلاح الأشياء القديمة وإعادة استعمالها, في كثرة الكلام بلا عمل, في ذم الإسراف ورمي النعمة]
  note: يُرفع إلى المقام العالي من لا يستحقه، لسوء الاختيار.
  source: taymur
  page: 374
  status: draft

- id: xu0278
  kind: usage
  prompt: 'بعد ما أكل واتكى قال: ده ريحته مستكى'
  answer: لمن يعيب الشيء بعد أن قضى حاجته منه
  others: [لمن يمدح الطعام ليُعطى منه المزيد دائما, لمن يأكل كثيرا ثم ينام في مكانه, لمن يعيب الطعام قبل أن يذوقه]
  note: شبع واتكأ، ثم أخذ يعيب الطعام بأن رائحته رائحة المصطكى.
  source: taymur
  page: 105
  status: draft

- id: xu0279
  kind: usage
  prompt: نغسل غسيل هلس ونتكل على الشمس
  answer: لمن يتكل في أموره على ما لا يفيد
  others: [لمن يؤجل عمل اليوم إلى الغد, لمن يغسل ثيابه بنفسه ولا يستعين بأحد, لمن يعمل في وقت غير مناسب]
  note: غسيل رديء ثم نعتمد على الشمس لتصلحه.
  source: taymur
  page: 372
  status: draft

- id: xu0280
  kind: usage
  prompt: عامل عنب والباقي فراطه
  answer: للمعجب بنفسه المتعالي على غيره
  others: [لمن يختار أطيب الطعام لنفسه دون غيره, لمن يبيع الجيد بثمن الرديء, لمن يجمع ما تساقط من غيره]
  note: كأنه جعل نفسه عنبا في عنقوده، وجعل غيره حبات متساقطة.
  source: taymur
  page: 238
  status: draft

- id: xu0281
  kind: usage
  prompt: طبل لي وانا أزمر لك
  answer: للشخصين يتبادلان المديح أمام الناس
  others: [لمن يرد الإساءة على صاحبها بمثلها, لمن يطلب الأجر كاملا قبل أن يعمل, لمن يلهو بالغناء ويترك عمله]
  note: امدحني عند الناس أمدحك عندهم، فيشتهر كلانا.
  source: taymur
  page: 230
  status: draft

- id: xu0282
  kind: usage
  prompt: عايز جنازه ويشبع فيها لطم
  answer: لمن يقوم بالأمر حبا في الضجة والظهور
  others: [لمن يواسي الناس في مصائبهم بصدق, لمن يشمت بمصائب الناس ويفرح بها, لمن يكثر الشكوى من حاله أمام كل الناس]
  note: لا يعنيه الأمر نفسه، وإنما شغفه بالضجة والظهور فيها.
  source: taymur
  page: 238
  status: draft

- id: xu0283
  kind: usage
  prompt: بفلوسك حني دروسك
  answer: في أن للمرء أن يتصرف في ماله كما يشاء
  others: [في ذم الإسراف في الزينة والتجمل, في أن المال لا يشتري الجمال ولا الصحة, في أن الطبيب يأخذ أجره من المريض]
  note: 'الدروس هي الأضراس: لو خضبت أضراسك بمالك فلا اعتراض عليك.'
  source: taymur
  page: 107
  status: draft

- id: xu0284
  kind: usage
  prompt: عرايا مقفقفين جابوا بعشاهم ياسمين
  answer: لمن ينفق ما يحتاج إليه فيما لا يغنيه
  others: [لمن يحب الزهور ويعتني بها في بيته كل يوم, لمن يجوع ويبرد ليطعم غيره ويكسوه, لمن يقتصد في عشائه ليدّخر ثمنه]
  note: 'مقفقفين: يرتجفون من البرد. عراة اشتروا بثمن عشائهم ياسمينا.'
  source: taymur
  page: 240
  status: draft

- id: xu0285
  kind: usage
  prompt: يا جاي بالليل وتتعتر تعالى بالنهار وشوف
  answer: للشيء يُتعب في طلبه وهو لا يستحق
  others: [لمن يزور أصحابه في الليل متأخرا, لمن يخاف من الظلام ويتعثر فيه, لمن يتأخر عن موعده ثم يعتذر]
  note: يا من تتعثر في الليل لتأتي، تعال نهارا لترى أنه لا يستحق.
  source: taymur
  page: 384
  status: draft

- id: xu0286
  kind: usage
  prompt: كل الجمال بتعارك إلا جملنا البارك
  answer: لمن يقعد عن أمر نهض له الناس جميعا
  others: [لمن يفخر بقوة أهله وعشيرته على الناس, للقوي الذي يغلب الجميع وحده, لمن يتعب نفسه في عمل لا ينفعه]
  note: الجمال كلها تقاتل وجملنا باركٌ لا يتحرك.
  source: taymur
  page: 299
  status: draft

- id: xu0287
  kind: usage
  prompt: خد من الحافي نعله
  answer: لمن لا يملك شيئا يؤخذ منه
  others: [لمن يعطي الناس ما يحتاج إليه, لمن يمشي طويلا ولا يتعب, لمن يشتري ما لا ينفعه]
  note: كيف تأخذ النعل ممن يمشي حافيا لا نعل له؟
  source: taymur
  page: 153
  status: draft

- id: xu0288
  kind: usage
  prompt: الزيطه والعيطه على حته مخيطه
  answer: للمشاجرة على شيء تافه
  others: [للفرح الكبير بلا سبب, للعمل الذي يتقنه الخياط, لمن يصلح ثيابه بنفسه]
  note: كل هذا الصياح على قطعة من المخيط، وهو شجر له صمغ يُصطاد به الطير.
  source: taymur
  page: 204
  status: draft

- id: xu0289
  kind: usage
  prompt: زي سلاقين البيض أول بأول
  answer: للفقراء ينفد ما يأتيهم أولا بأول
  others: [لمن يتعجل الأمور قبل أوانها, للعمل السهل الذي لا يحتاج إلى أي مهارة, لمن يأتي مبكرا دائما]
  note: كمن يسلق البيض، يخرجه من الماء ثم يلقي غيره، فلا يبقى عنده شيء.
  source: taymur
  page: 190
  status: draft

- id: xu0290
  kind: usage
  prompt: زي ابو قردان صايم عن زاد الدنيا
  answer: للزاهد المتعفف عما بأيدي الناس
  others: [للبخيل الذي يحرم نفسه وأهله من الطعام, لمن يصوم ويتعب في عمله, للمريض الذي يمتنع عن الطعام]
  note: أبو قردان طائر لا يأكل إلا الدود، فلا يشارك الناس في طعامهم.
  source: taymur
  page: 181
  status: draft

- id: xu0291
  kind: usage
  prompt: زي فطير الزياره واسع على قلة بركه
  answer: للكبير الحجم القليل الفائدة
  others: [للكريم الذي يعطي ولو كان فقيرا, للطعام يُصنع للضيوف بإسراف, لمن يزور كثيرا ولا يطيل]
  note: فطير يُتصدق به عند زيارة القبور في المواسم، واسع القرص قليل السمن.
  source: taymur
  page: 196
  status: draft

- id: xu0292
  kind: usage
  prompt: لا بإيده ولا بالمنجل
  answer: للعاجز الذي لا يحسن عمل شيء
  others: [لمن يحصد زرع غيره بلا إذن منه, لمن يعمل طول يومه بلا أجر, لمن يرفض أن يساعده أحد]
  note: لا يعمل شيئا بيده ولا بأداة يستعين بها.
  source: taymur
  page: 313
  status: draft

- id: xu0293
  kind: usage
  prompt: زي الطواحين إن بطلت تلحسهم الكلاب
  answer: لمن يُستهان به إذا عُزل أو ترك العمل
  others: [لمن يعمل كثيرا ولا يرى أجرا, لمن يُطعم الناس فلا يشكرونه, للشيء القديم الذي لا يُستغنى عنه أبدا في البيت]
  note: الطاحون إذا توقفت لم يقربها إلا الكلاب.
  source: taymur
  page: 193
  status: draft

- id: xu0294
  kind: usage
  prompt: لولا حالك يا مغني ما سألت عني
  answer: لمن يهتم بغيره لحاجة لا لمحبة
  others: [لمن يطرب لسماع الغناء في كل مجلس, لمن يغيب عن أصحابه طويلا, لمن ينسى فضل من أحسن إليه]
  note: لولا حاجتك إليّ ما سألت عني.
  source: taymur
  page: 324
  status: draft

- id: xu0295
  kind: usage
  prompt: على شان كبابك أكب انا عدسي؟
  answer: في ألا يفسد الفقير ما عنده لأجل غيره
  others: [في ذم البخل على الجار وأهل الحي, في أن الطعام البسيط أشهى من الغالي دائما, في أن الضيف يأكل مما يُقدَّم له]
  note: لا يليق أن أريق عدسي لأُصلح كبابك وإن كان أغلى.
  source: taymur
  page: 246
  status: draft

- id: xu0296
  kind: usage
  prompt: شغل المعلم لابنه
  answer: للشيء المتقن غاية الإتقان
  others: [للعمل الذي يُنجز على عجل, للصانع الذي يغش الغرباء, لمن يترك صنعة أبيه]
  note: كأنه من صنع أستاذ الصنعة لولده، فلا يدخر فيه جهدا.
  source: taymur
  page: 218
  status: draft

- id: xu0297
  kind: usage
  prompt: ما تزغرطوا إلا لما تتقمطوا
  answer: لمن يفرح بالشيء قبل أن يناله
  others: [لمن يحزن في يوم الفرح, لمن يبخل بالتهنئة على غيره في فرحه, لمن يرفع صوته بلا داع]
  note: التقميط هنا لبس الثياب؛ أي لا تطلقوا الزغاريد وتعلنوا السرور حتى تلبسوها فعلا.
  source: taymur
  page: 327
  status: draft

- id: xu0298
  kind: usage
  prompt: فين المنوات يا عنب
  answer: للشيء الرديء يُتحسر معه على الجيد
  others: [لمن يبحث عن شيء وهو أمام عينيه, للبلد الذي يُعرف بجودة ثماره, لمن يبيع الثمر في السوق قبل أن ينضج ويطيب]
  note: المنوات بلدة كانت فيها كروم يجود عنبها.
  source: taymur
  page: 273
  status: draft

- id: xu0299
  kind: usage
  prompt: رك الحيطه على قالب
  answer: في أن العظيم إنما يقوم على الصغير
  others: [في أن البناء يحتاج إلى صبر, في أن الجدار القديم أمتن من الجديد, في أن الجار يستند إلى جاره]
  note: الحائط كله يستند إلى قالب واحد من الطوب.
  source: taymur
  page: 177
  status: draft

- id: xu0300
  kind: usage
  prompt: يا مستخبيه صوتك خرق ودنيه
  answer: لمن يتظاهر بأمر ويأتي بنقيضه
  others: [لمن يتكلم دائما بصوت عال, لمن يخفي سرا عن أهله وجيرانه, لمن يتجسس على جيرانه في الخفاء]
  note: تزعم أنها مختبئة وصوتها يخرق الآذان.
  source: taymur
  page: 392
  status: draft

- id: xu0301
  kind: usage
  prompt: حسنة وانا سيدك
  answer: للفقير المتعاظم يستجدي ويمنّ على المعطي
  others: [للغني الذي يتصدق في السر ولا يذكر ذلك, للسيد الذي يعطف على خدمه, لمن يعطي الناس ثم ينسى ما أعطى]
  note: 'يقول: تصدّق عليّ واعلم أني سيدك.'
  source: taymur
  page: 144
  status: draft

- id: xu0302
  kind: usage
  prompt: ما يدايق الزريبه إلا النعجه الغريبه
  answer: في ضيق أهل الدار بالطارئ عليهم
  others: [في أن الغنم تحتاج إلى مكان واسع, في أن الغريب يحن إلى أهله, في أن الراعي يعرف غنمه]
  note: الزريبة لا تضيق إلا بالنعجة الغريبة.
  source: taymur
  page: 338
  status: draft

- id: xu0303
  kind: usage
  prompt: 'قال: نموسه وعامله جاموسه'
  answer: للحقير يظهر للناس أنه عظيم
  others: [للصغير الذي ينفع أكثر من الكبير, لمن يرضى بالقليل ويقنع به, لمن يعمل في صمت دون أن يُرى]
  note: النموسة هي البعوضة، تتعاظم كأنها جاموسة.
  source: taymur
  page: 276
  status: draft

- id: xu0304
  kind: usage
  prompt: صاحب قيراط في الفرس يركب
  answer: في أن الشريك ينتفع وإن قل نصيبه
  others: [في أن الفارس يُعرف من ركوبه, في أن صاحب القليل لا يُسمع رأيه, في أن الفرس لا يركبها إلا صاحبها]
  note: القيراط جزء من أربعة وعشرين، ومن ملكه في فرس فله حق ركوبها.
  source: taymur
  page: 222
  status: draft

- id: xu0305
  kind: usage
  prompt: زي الفرارجي له فروج لا يموت
  answer: للشيء الدائم لا ينقطع عن صاحبه
  others: [لمن يتكلم كثيرا عن مصائبه, للتاجر يكذب في وصف بضاعته, لمن يحرص على ماله حرصا شديدا لا ينقطع]
  note: الفرارجي بائع الدجاج، لا يخلو دكانه من الفراريج.
  source: taymur
  page: 195
  status: draft

- id: xu0306
  kind: usage
  prompt: صيد الغر ولا نتفه
  answer: في أن بعض الشر أهون من بعض
  others: [في أن الصيد رزق لا يدوم, في أن العمل الشاق يأتي بخير كثير, في أن الصياد لا يأكل مما يصيد]
  note: الغر طائر من طيور الماء، صيده صعب ونتف ريشه أصعب.
  source: taymur
  page: 225
  status: draft

- id: xu0307
  kind: usage
  prompt: يا حدايه، الصقر وراكي
  answer: لمن يتربص به من يفسد عليه غنيمته
  others: [لمن يغتر بقوته على من هو أضعف منه, لمن يطير فرحا بخبر قبل أن يتأكد, لمن يطارد شيئا لا يستطيع أن يدركه]
  note: الحدأة تخطف، والصقر خلفها يخطف منها.
  source: taymur
  page: 384
  status: draft

- id: xu0308
  kind: usage
  prompt: 'حدايه ضمنت غراب، قال: يطيروا الاتنين'
  answer: لمن يكفل الهارب وهو مثله في الهروب
  others: [لمن يثق بعدوه القديم فيخدعه في النهاية, للصديقين يتفرقان بعد طول عشرة, لمن يطلب ضمانا على ما لا يملك من مال]
  note: الحداية هي الحدأة. الطائر لا يصلح ضامنا لطائر مثله، فكلاهما يطير.
  source: taymur
  page: 140
  status: draft

- id: xu0309
  kind: usage
  prompt: أبو ألف حسد أبو ميه
  answer: للمكثر يحسد المقل
  others: [للفقير يحسد الغني, للتاجر يربح ألفا من مائة, لمن يقنع بالقليل]
  note: صاحب الألف يحسد صاحب المائة طمعا وشرها.
  source: taymur
  page: 6
  status: draft

- id: xu0310
  kind: usage
  prompt: القباني شريك المحتسب
  answer: في الرقيب يشارك من يراقبه في الاختلاس
  others: [في أن التاجر يحتاج إلى شريك أمين, في أن الميزان الصحيح لا يكذب أبدا, في أن الشركة في المال تفسد الصداقة القديمة]
  note: القباني هو الوزّان بالقبان، والمحتسب مراقب الأسواق.
  source: taymur
  page: 284
  status: draft

- id: xu0311
  kind: usage
  prompt: زي الجمل اللي يحرته يبططه
  answer: لمن يتعب في عمل ثم يفسده بنفسه
  others: [لمن يعمل بلا خبرة فيتعب بلا فائدة, لمن يحمل أكثر من طاقته فيقع, لمن يقطع رزق غيره بلا سبب]
  note: الجمل يحرث الأرض ثم يدوسها بخفّه فيسويها.
  source: taymur
  page: 186
  status: draft

- id: xu0312
  kind: usage
  prompt: يدي الحلق للي بلا ودان
  answer: لمن ينال ما لا يحتاجه ويُحرم منه مستحقه
  others: [لمن يرد الهدية إلى صاحبها دون أن يشكره, لمن يتزين بحلي لا يملكه أمام الناس, لمن يسمع النصيحة ولا يعمل بها أبدا]
  note: يعطي القرط لمن لا آذان له.
  source: taymur
  page: 396
  status: draft

- id: xu0313
  kind: usage
  prompt: ما يقعد على المداود إلا شر البقر
  answer: في ذهاب الصالح وبقاء الطالح
  others: [في أن البقرة الكسولة تسمن سريعا, في أن الأكل الكثير يضر, في أن الراعي يحفظ أحسن بقره]
  note: المداود معالف الدواب، لا يبقى عندها إلا أسوأ البقر.
  source: taymur
  page: 341
  status: draft

- id: xu0314
  kind: usage
  prompt: السمك بيطلع نار قال الميه تطفيه
  answer: في عدم المبالاة بخطر معه ما يدفعه
  others: [في أن الخبر الغريب لا يُصدَّق بسهولة, في أن النار تُطفأ بالماء لا بالتراب, في أن الخطر يأتي من حيث لا ننتظر]
  note: لو أخرج السمك نارا فالماء الذي يعيش فيه يطفئها.
  source: taymur
  page: 209
  status: draft

- id: xu0315
  kind: usage
  prompt: يا اللي بتغمز في الظلام مين حاسس بك؟
  answer: للعمل يُعمل خفية فيذهب سدى
  others: [لمن يخون صاحبه في الخفاء ولا يُكشف, لمن يخاف من الظلام, لمن يتكلم ولا يسمعه أحد]
  note: من يغمز بعينه في الظلام لا يراه أحد.
  source: taymur
  page: 381
  status: draft

- id: xu0316
  kind: usage
  prompt: شوكتي في قفا غيري
  answer: لمن يخلص من التبعة ويحملها غيره
  others: [لمن يؤذي الناس ثم يتباكى أمامهم, لمن يشكو ألما لا يراه أحد غيره, لمن يدافع عن غيره بشجاعة وإقدام]
  note: الشوكة لا تؤلمني ما دامت في قفا غيري.
  source: taymur
  page: 221
  status: draft

- id: xu0317
  kind: usage
  prompt: ما يعرف الدفه من الشابوره
  answer: للجاهل الذي لا يميز أبسط الأمور
  others: [لمن يكثر السفر في البحر ولا يتعب, للملاح الذي يترك سفينته للريح, لمن يبدأ عملا ولا يتمه أبدا]
  note: الدفة في مؤخر السفينة، والشابورة خشبة يقوم عليها صدرها؛ فهو لا يعرف مقدم المركب من مؤخره.
  source: taymur
  page: 339
  status: draft

- id: xu0318
  kind: usage
  prompt: إن طلت برد الحس
  answer: في اغتنام ما تهيأ على علاته
  others: [في أن الطعام البارد لا يُؤكل, في ألا يتعجل المرء الطعام, في أن الصبر يأتي بالأفضل]
  note: إن وصلت يدك إلى الطعام البارد فالعقه ولا تنتظر الساخن، فقد يفوتك الاثنان.
  source: taymur
  page: 79
  status: draft

- id: xu0319
  kind: usage
  prompt: لا فرح ولا زفه وإيه دي الخفه
  answer: لمن يتزين ويتأنق بلا مناسبة
  others: [لمن يغيب عن أفراح أهله, لمن يتعجل الزواج قبل أوانه بكثير, لمن يكثر الزيارة بلا دعوة]
  note: لا أنت في عرس ولا في موكب، فما هذه الزينة؟
  source: taymur
  page: 316
  status: draft

- id: xu0320
  kind: usage
  prompt: التقل ورا يا قباني
  answer: للأمر تخف أوائله ويثقل آخره
  others: [لمن يحمل الأثقال على ظهره كل يوم, للتاجر الذي يغش في الوزن, لمن يؤخر عمله إلى الغد]
  note: الوزن الثقيل يأتي في آخر الأمر. والقباني هو الوزّان.
  source: taymur
  page: 120
  status: draft

- id: xu0321
  kind: usage
  prompt: إن حضر العيش يبقى المش شبرقة
  answer: في القناعة بما يقيم الأود
  others: [في أن المش من أطيب الطعام, في أن الخبز لا يؤكل وحده, في أن الضيف يُكرم بالجبن]
  note: المش جبن قديم مخزون. من وجد الخبز عدّ ما سواه زيادة يتفكه بها.
  source: taymur
  page: 74
  status: draft

- id: xu0322
  kind: usage
  prompt: سكة أبو زيد كلها مسالك
  answer: للأمر له طرق كثيرة توصل إليه
  others: [لمن يضل الطريق مع كثرة الأدلاء, للسفر الطويل الذي لا ينتهي, لمن يسلك طريقا لا يعرف آخره]
  note: أبو زيد الهلالي بطل السيرة، كان لشجاعته يسلك كل طريق فلا يعوقه عائق.
  source: taymur
  page: 208
  status: draft

- id: xu0323
  kind: usage
  prompt: فار ما ساعه شقه علقوا في ذيله مجدال
  answer: للأمر يضيق بالشيء فيزيدونه عليه
  others: [لمن يعيش في بيت ضيق ويقنع به, لمن يهرب من مشكلة فيقع في أخرى, لمن يخبئ ماله في مكان ضيق]
  note: المجدال حجر كبير. الشق لا يسع الفأر وحده، فكيف إذا عُلّق في ذيله حجر؟
  source: taymur
  page: 267
  status: draft

- id: xu0324
  kind: usage
  prompt: بدلة الرقص لها اكمام
  answer: للشيء يتميز بما لا فائدة فيه
  others: [للشيء الجميل الذي يخفي عيبا, لمن يتكلف ما لا يليق به, للعمل الذي يحتاج إلى مهارة خاصة]
  note: ثياب الرقص تُعرف بأكمامها الطويلة، وهي ميزة لا نفع فيها.
  source: taymur
  page: 102
  status: draft

- id: xu0325
  kind: usage
  prompt: واحد شايل دقنه، والتاني تعبان ليه؟
  answer: لمن يتدخل فيما لا يعنيه
  others: [لمن يحمل أثقال غيره بلا شكوى, لمن يحسد غيره على ما عنده, لمن يهمل مظهره]
  note: صاحب اللحية يحملها، فما بال غيره يتعب من أجلها؟
  source: taymur
  page: 376
  status: draft

- id: xu0326
  kind: usage
  prompt: سكينة الأهل متلمه
  answer: في أن الأقارب لا يبلغون في إيذاء بعضهم مداه
  others: [في أن الأهل أول من يخذل المرء عند الشدة والضيق, في أن الغريب أرحم بالمرء من القريب, في أن عُدّة البيت القديمة لا يُستغنى عنها]
  note: المتلمة هي السكين التي لا تقطع؛ فإن تخاصم الأهل فبسلاح لا يجرح.
  source: taymur
  page: 209
  status: draft

- id: xu0327
  kind: usage
  prompt: لا يفوته فايت ولا طبيخ بايت
  answer: للجشع الذي لا يترك شيئا يفلت منه
  others: [للكريم الذي يطعم كل من يمر ببابه, لمن يرفض أكل الطعام البائت, لمن يحفظ طعامه لليوم التالي]
  note: لا يمر به شيء إلا نال منه، حتى الطبيخ البائت.
  source: taymur
  page: 318
  status: draft

- id: xu0328
  kind: usage
  prompt: عصبه حرير على غطا زير
  answer: للثوب الفاخر يلبسه من لا يستحقه
  others: [لمن يخفي ماله في مكان غريب لا يُعرف, لمن يزين بيته بالحرير ويهمل نفسه, للهدية الثمينة تُرد إلى صاحبها]
  note: يظهر صاحبه بمظهر فخم ولا شيء تحته، كعصابة حرير على غطاء جرة.
  source: taymur
  page: 244
  status: draft

- id: xu0329
  kind: usage
  prompt: رغيف من تفالي يعدل حالي
  answer: للقليل يكسبه المرء بتعبه فيغنيه
  others: [لمن يرضى بالخبز ويترك الطعام الطيب, للفقير الذي يعيش على صدقات الناس, لمن يخبز لجيرانه كل يوم بلا أجر]
  note: التفال هو ما يوضع تحت الرحى؛ أي رغيف أجمع دقيقه بكدي يكفيني ويغنيني عن السؤال.
  source: taymur
  page: 176
  status: draft

- id: xu0330
  kind: usage
  prompt: قطهم جمل وبراغيتهم رجاله
  answer: لمن يبالغ في الأمور ويكبّر الصغير
  others: [لمن يحسن إلى الحيوان ويكرمه, لمن يسكن بيتا قديما كثير الحشرات والهوام, لمن يستهين بالخطر الكبير]
  note: يجعل الهر جملا والبراغيث رجالا.
  source: taymur
  page: 289
  status: draft

- id: xu0331
  kind: usage
  prompt: 'قالوا للغراب: ليه بتسرق الصابون؟ قال: الأذيه طبع'
  answer: للمطبوع على الأذى ولو لم ينتفع به
  others: [لمن يسرق ليطعم أولاده الجائعين في الشتاء, لمن يحب النظافة ويحرص عليها, لمن يعتذر عن خطئه ولا يعود إليه]
  note: الغراب لا يأكل الصابون، لكنه يسرقه لأن الأذى في طبعه.
  source: taymur
  page: 280
  status: draft

- id: xu0332
  kind: usage
  prompt: سجرة الباميه ما يصحش منها اوتاد
  answer: للشيء لا يصلح لما يراد منه
  others: [للشجرة التي لا تثمر إلا مرة, لمن يعجز عن عمل بسيط, لمن يبني بيته بلا أساس]
  note: ساق الباميا جوفاء ضعيفة لا تصلح أوتادا.
  source: taymur
  page: 207
  status: draft

- id: xu0333
  kind: usage
  prompt: جمل وف، رقبته صرمه
  answer: للكامل يلحقه عيب صغير ينقصه
  others: [لمن يحمل الأثقال الكبيرة ولا يشكو, للغني البخيل على نفسه, لمن يتكبر وهو فقير]
  note: الصرمة هي النعل البالية. بعير تام حسن، لكن عُلقت في رقبته نعل قديمة.
  source: taymur
  page: 129
  status: draft

- id: xu0334
  kind: usage
  prompt: سبسب القرع وجا خيره
  answer: للشيء بدأ صلاحه وقرب نفعه
  others: [لمن يكثر وعوده ولا يفي, للرزق يأتي من حيث لا يُنتظر, للزرع يفسده الإهمال]
  note: 'سبسب القرع: امتدت فروعه وقرب إثماره.'
  source: taymur
  page: 206
  status: draft

- id: xu0335
  kind: usage
  prompt: كل حمومه بليفه أخير من فرخه بتكتيفه
  answer: في الحث على النظافة
  others: [في تفضيل الطعام البسيط على الولائم, في أن الراحة خير من الطعام, في أن الدجاجة تُطبخ كاملة]
  note: حمّام بالليف خير لصحة المرء من دجاجة يأكلها، فالطعام لا ينفع مع قذارة الجسد.
  source: taymur
  page: 300
  status: draft

- id: xu0336
  kind: usage
  prompt: 'قالوا للدبه: طرزي. قالت: دي خفة أيادي'
  answer: لتكليف شخص بما لا يحسنه ولا يليق به
  others: [لمن يتقن عمله ويتباهى به أمام الناس, لمن يرفض العمل كسلا وتهربا, لمن يمدح نفسه ويثني على عمله]
  note: التطريز يحتاج إلى يد خفيفة، والدبة ثقيلة اليد. وهو قديم أورده الأبشيهي.
  source: taymur
  page: 279
  status: draft

- id: xu0337
  kind: usage
  prompt: كل من جانا يحب مرجانه
  answer: للشيء يتعلق به كل من يراه
  others: [لمن يحب ما يملكه غيره, للضيف الذي يطيل البقاء, لمن يتودد إلى الناس لمصلحة]
  note: مرجانة يحبها كل من يزورنا.
  source: taymur
  page: 305
  status: draft

- id: xu0338
  kind: usage
  prompt: صامت يوم واتمخطرت للعيد
  answer: لمن يعمل قليلا ويطلب تقديرا كبيرا
  others: [لمن يصبر طويلا ثم ينال مراده في الآخر, لمن يحتفل بالعيد قبل أوان الفرح, لمن يترك عمله ليتزين ويتجمل]
  note: لم تصم من رمضان إلا يومه الأخير ثم خرجت تتبختر للعيد.
  source: taymur
  page: 223
  status: draft

- id: xu0339
  kind: usage
  prompt: الزرع اخضر والناس أخبر
  answer: للحديث النعمة يدّعي مجدا قديما
  others: [للفلاح الذي يتباهى بزرعه أمام جيرانه, لمن يحكم على الشيء قبل نضجه, لمن يستشير الناس في أمره]
  note: عهد نعمته قريب، والناس يعرفون أصله.
  source: taymur
  page: 179
  status: draft

- id: xu0340
  kind: usage
  prompt: طور الحرت ما يتكممش
  answer: في ألا يُضيَّق على العامل فيما لا يُخشى منه
  others: [في أن الثور القوي لا يُقاد بسهولة إلى الحقل أبدا, في أن العامل الكسول يُحرم أجره كاملا, في أن الحيوان يُعرف بالعمل الذي يتقنه]
  note: ثور الحرث لا يُكمّم لأنه لا يجد في الحقل ما يأكله، وإنما يُكمّم ثور الدراس لئلا يأكل الحب.
  source: taymur
  page: 233
  status: draft

- id: xu0341
  kind: usage
  prompt: في كل عرس له قرص
  answer: لمن يحرص على الانتفاع من كل أمر
  others: [لمن يحضر الأفراح ويغيب عن الأحزان, لمن يحبه الناس فيدعونه إلى كل مناسبة, لمن يكره الزحام والولائم]
  note: له في كل وليمة نصيب يأخذه. والقرص رغيف صغير.
  source: taymur
  page: 273
  status: draft

- id: xu0342
  kind: usage
  prompt: المتغطي به عريان
  answer: للشخص لا ينفع من يلجأ إليه
  others: [لمن يلبس ثيابا قديمة لا تستره, للكريم الذي يكسو الفقراء, لمن يخفي فقره عن الناس]
  note: من يستتر به كأنه بلا غطاء.
  source: taymur
  page: 343
  status: draft

- id: xu0343
  kind: usage
  prompt: بلاش توكلني فرخه سمينه، وتبيتني حزينه
  answer: لمن يتبع إحسانه بالأذى
  others: [لمن يبخل بالطعام على ضيوفه, لمن يأكل كثيرا ثم يشكو, لمن يحزن على طعام فاته]
  note: لا أريد دجاجة سمينة تطعمني إياها ثم تغضبني فأبيت حزينا؛ يقال لمن يجمع بين الإحسان والإساءة.
  source: taymur
  page: 111
  status: draft

- id: xu0344
  kind: usage
  prompt: له عمر في السوق وعمر في السندوق
  answer: للبخيل يكنز المال ولا يتمتع به
  others: [للتاجر الناجح المعروف في السوق, لمن يعيش عمرا طويلا في خير, لمن يضيّع ماله كله في الأسواق]
  note: كأن له عمرا ثانيا سيتمتع فيه بما يخزنه في صندوقه.
  source: taymur
  page: 322
  status: draft

- id: xu0345
  kind: usage
  prompt: زي السمك ينزل ع السنانير بديله
  answer: للمتيقظ الكثير الحذر
  others: [لمن يتهاون حتى يقع في الفخ, لمن يهرب من مواجهة مشكلاته, لمن يأخذ الشيء ويتركه سريعا]
  note: السمك الحذر لا يقترب من الصنارة إلا بذيله فلا يعلق بها.
  source: taymur
  page: 190
  status: draft

- id: xu0346
  kind: usage
  prompt: نام وقام لقى روحه قايمقام
  answer: لمن ينال منزلة عظيمة بسرعة
  others: [لمن يحلم بما لا يناله أبدا, لمن ينام كثيرا عن عمله, لمن يُعزل فجأة من منصبه]
  note: القائمقام رتبة عالية؛ نام ثم استيقظ فوجد نفسه فيها.
  source: taymur
  page: 370
  status: draft

- id: xu0347
  kind: usage
  prompt: نص المونه ع الطابونه
  answer: في أن إتقان العمل يصنع جودة الشيء
  others: [في أن الفرن يأكل نصف الخبز الذي فيه, في أن الطعام يفسد بكثرة الطهي على النار, في أن نصف الرزق يأتي من الجيران]
  note: الطابونة مكان أفران الخبز؛ والعجين الجيد يفسد إذا أسيء خبزه.
  source: taymur
  page: 372
  status: draft

- id: xu0348
  kind: usage
  prompt: كنا في البيطره صرنا في الحكمه
  answer: للخروج عن موضوع الكلام
  others: [لمن يكثر من الشكوى, لمن يتعلم بعد أن يكبر, للمريض يُداوى بغير دوائه]
  note: البيطرة طب الدواب، والحكمة طب الناس؛ كنا في حديث فانتقلنا إلى غيره.
  source: taymur
  page: 311
  status: draft

- id: xu0349
  kind: usage
  prompt: الرقاص يشخشخ والحجر واقف
  answer: للجعجعة بلا عمل
  others: [للعمل المتواصل بلا راحة, للطاحون القديم لا يُستغنى عنه, للصوت الذي ينذر بالخطر]
  note: الرقاص خشبة في الطاحون تقعقع، والحجر لا يدور.
  source: taymur
  page: 176
  status: draft

- id: xu0350
  kind: usage
  prompt: كل قرصك والزم خصك
  answer: في تفضيل العزلة والقناعة
  others: [في الحث على الأكل بسرعة, في الحث على العمل في الحقل, في ألا يطيل الضيف البقاء]
  note: الخص كوخ بسيط؛ أي كُل رغيفك والزم بيتك وإن كان متواضعا.
  source: taymur
  page: 304
  status: draft

- id: xu0351
  kind: usage
  prompt: داهيه تخفي الشرك ولو في الغدا
  answer: في ذم الشركة لكثرة الخلاف فيها
  others: [في ذم البخل بالطعام على الأهل, في الحث على الأكل مع الجماعة دائما, في وجوب إكرام الضيف]
  note: دعاء على الشركة بالزوال ولو كانت في طعام، لما يقع فيها غالبا من نزاع.
  source: taymur
  page: 162
  status: draft

- id: xu0352
  kind: usage
  prompt: لولاك يا كمي ما كلت يا فمي
  answer: في أن الناس يكرمون الثياب لا الأشخاص
  others: [في أن الضيف يُكرم بالطعام قبل الكلام, في أن العمل باليد يأتي بالرزق الحلال, في أن غسل اليدين يكون قبل الطعام]
  note: صاحب الثوب الحسن يُدعى إلى الطعام، فالفضل لكمّه. وهو قديم أورده الأبشيهي.
  source: taymur
  page: 324
  status: draft

- id: xu0353
  kind: usage
  prompt: بين الراكب والماشي حل البردعه
  answer: في تقارب الوقت بين أمرين
  others: [في تفاوت الناس في الرزق, في أن الغني لا يشعر بالفقير, في أن الرفيق يُعرف في السفر]
  note: البردعة هي الإكاف. يسبق الراكب، لكنه يتأخر حين يحل بردعة دابته فيلحق به الماشي.
  source: taymur
  page: 115
  status: draft

- id: xu0354
  kind: usage
  prompt: طارت عصافير عقله
  answer: لمن أصابه فزع شديد
  others: [لمن غلب عليه الطرب والسرور, لمن نسي ما كان يحفظه, لمن انشغل بالتفكير عن الناس]
  note: مثل قديم عند العرب، رواه الميداني بلفظ «طارت عصافير رأسه».
  source: abboudi_amthal
  page: 764
  volume: ج٢
  flag: 'answer may be wrong: The book gives no usage, so the answer «لمن أصابه فزع شديد» is not confirmed by it.'draft

- id: xu0355
  kind: usage
  prompt: خشمك قدّامك، وراسك بين آذانك
  answer: في ممازحة الغافل الذي يسأل عن الواضح
  others: [في نصح المتكبر بأن يتواضع, في وصف الجميل الحسن الصورة, في تحذير من يسير في طريق خطر بلا دليل يرشده]
  note: «الخشم» الأنف؛ أي أنفك أمامك ورأسك بين أذنيك.
  source: abboudi_amthal
  page: 464
  volume: ج٢
  flag: 'answer may be wrong: The book states no usage, so the answer «في ممازحة الغافل الذي يسأل عن الواضح» cannot be confirmed from it.'draft

- id: xu0356
  kind: usage
  prompt: يا الله العقل لو عاريه
  answer: لمن أتى أمرا مخالفا للعقل
  others: [لمن يستعير أشياء الناس ولا يردها, لمن يدعو لغيره بطول العمر, لمن يتظاهر بالحكمة وهو جاهل بها]
  note: دعاء بأن يُرزق المتكلم عقلا ولو على سبيل الإعارة.
  source: abboudi_amthal
  page: 1618
  volume: ج٥
  flag: 'answer may be wrong: The book presents it as a prayer to be granted reason even on loan; it does not state the usage «لمن أتى أمرا مخالفا للعقل» (the following line is OCR-garbled, so this is unconfirmed rather than wrong).'draft

- id: xu0357
  kind: usage
  prompt: ياخذ الحاج الداج
  answer: للمكان الواسع
  others: [للطريق الطويل الشاق, للرجل الكثير الأسفار, للسوق الكثير البضائع]
  note: «الحاج والداج» كناية عن العدد الكثير من الناس، تشبيها بالحجاج ومن يتبعهم من الأعوان والمكارين.
  source: abboudi_amthal
  page: 1634
  volume: ج٥
  flag: 'answer may be wrong: The book gives no usage; the answer «للمكان الواسع» is not stated in it.'draft

- id: xu0358
  kind: usage
  prompt: ما أقول إلا يا سبيل الخير
  answer: يقوله من يعرض نصيحته ولا يلحّ على قبولها
  others: [يقوله من يودّع مسافرا ويدعو له, يقوله من يرفض المشاركة في الشر, يقوله من يتصدق على سائل في الطريق ويدعو له بالخير]
  note: هو مستوحى من معنى قرآني في الدعوة إلى سبيل الرشاد، يقوله الناصح ثم يترك القرار لصاحبه.
  source: abboudi_amthal
  page: 1168
  volume: ج٣
  status: draft

- id: xu0359
  kind: usage
  prompt: تلاحقني وأنا عنك منحاش
  answer: لمن يزداد نفورا كلما طلبه صاحبه
  others: [لمن يطارد غيره ثم يعجز عن اللحاق به, لمن يهرب من دين عليه فيدركه صاحبه, لمن يتبع غيره في كل ما يفعل]
  note: مثل بدوي، و«منحاش» أي فارّ نافر؛ يقوله من يهرب ممن يلاحقه.
  source: abboudi_amthal
  page: 320
  volume: ج١
  status: draft

- id: xu0360
  kind: usage
  prompt: ما ينحطّ بالحوز
  answer: لمن لا يمكن إسكاته أو الوثوق بكتمانه
  others: [للمال الكثير الذي لا يتسع له مكان, للرجل الكريم الذي لا يخبئ ماله, للشيء الثمين الذي يُخشى عليه من السرقة]
  note: «الحوز» الخريطة يحفظ فيها المرء نقوده ومتاعه؛ أي هو شيء لا يمكن أن يوضع في الكيس ويُخفى.
  source: abboudi_amthal
  page: 1306
  volume: ج٤
  status: draft

- id: xu0361
  kind: usage
  prompt: ألف وحبيبه
  answer: لتحمّل الشيء القليل ممن تحمّل الكثير
  others: [لمن يجمع المال حبة حبة, لمن يحب الناس جميعا, لمن يعطي الكثير من ماله ثم يمنّ به على الناس]
  note: «حبيبه» تصغير حبة؛ أي ألف دينار وحبة شعير من الفضة، وما على من تحمل ألفا أن يتحمل معها حبة.
  source: abboudi_amthal
  page: 180
  volume: ج١
  status: draft

- id: xu0362
  kind: usage
  prompt: دقّ الميّت ما به فخر
  answer: لمن يفتخر بالتغلب على ضعيف لا يدافع عن نفسه
  others: [لمن يذكر الموتى بسوء بعد رحيلهم, لمن يعاقب المذنب بعد أن تاب, لمن يرفع صوته على من هو أكبر منه سنا وأعلى مكانة]
  note: ضرب الميت ليس بطولة لأنه لا يردّ، وإنما الفخر في غلبة الحي القادر على الدفاع.
  source: abboudi_amthal
  page: 514
  volume: ج٢
  status: draft

- id: xu0363
  kind: usage
  prompt: من عدم الرجال صرت رجل
  answer: لمن بلغ منزلة رفيعة لقلة من هو أجدر بها منه
  others: [لمن نشأ يتيما فتحمل المسؤولية صغيرا, لمن يدّعي الشجاعة إذا غاب الأقوياء ويهرب إذا حضروا, لمن يعتمد على نفسه بعد فقد أعوانه]
  note: «الرجال» هنا أهل الكمال من السادة والوجهاء؛ فلولا غيابهم ما تقدّم هو.
  source: abboudi_amthal
  page: 1434
  volume: ج٤
  status: draft

- id: xu0364
  kind: usage
  prompt: مقلع شيحه
  answer: للشيء الذي يُجتثّ من أساسه
  others: [للنبات الذي يعود بعد قطعه, للرجل الذي يقلع عن عادته السيئة, للأرض الجرداء التي لا تُنبت]
  note: الشيح شجر صحراوي، إذا قُلع لم يبق من جذوره في الأرض شيء.
  source: abboudi_amthal
  page: 1379
  volume: ج٤
  status: draft

- id: xu0365
  kind: usage
  prompt: ما أكذب خبر
  answer: لمن يقصد ما يريده مباشرة بلا تردد
  others: [لمن لا يصدق الأخبار حتى يتثبت منها, لمن يكذب ثم ينكر كذبه, لمن ينقل الأخبار دون أن يزيد عليها]
  note: كأنه سمع خبرا فلم يتردد في تصديقه، فقام إليه من فوره.
  source: abboudi_amthal
  page: 1168
  volume: ج٣
  status: draft

- id: xu0366
  kind: usage
  prompt: من حشّ عليك، روّ عليه
  answer: في ردّ التهكم والكلام الجارح بمثله
  others: [في رد الجميل لمن أحسن إليك بأحسن مما قدّم, في الحث على التعاون في العمل, في مقابلة الإساءة بالإحسان]
  note: أصله في الحمار يحمل عليه الفلاحون الحشيش ويستقون عليه الماء؛ أي من جعلك كحمار الحشيش فاجعله كحمار الماء.
  source: abboudi_amthal
  page: 1412
  volume: ج٤
  status: draft

- id: xu0367
  kind: usage
  prompt: ما عندي من الشيطان طاري
  answer: يقوله من فوجئ بأذى ممن لم يكن يتوقعه
  others: [يقوله من يعتذر عن ذنب ارتكبه, يقوله من يرفض الدخول في خصومة, يقوله من نسي موعدا ضربه لصاحبه]
  note: أي لم يخطر لي شيء من وسوسة الشيطان حين فاجأني بما فعل.
  source: abboudi_amthal
  page: 1223
  volume: ج٣
  status: draft

- id: xu0368
  kind: usage
  prompt: يقوم على الخشب
  answer: لمن بلغ به الضعف مبلغا عظيما
  others: [للنجار الماهر في صنعته, لمن يقف على المنبر خطيبا, لمن يعمل في البناء طوال يومه]
  note: أصله في البعير ونحوه من الدواب إذا أصابه الهزال الشديد.
  source: abboudi_amthal
  page: 1769
  volume: ج٥
  status: draft

- id: xu0369
  kind: usage
  prompt: حطّني لقيتني
  answer: للكسول الذي لا يتصرف ولا يتحرك من مكانه
  others: [للمسافر الذي لا يستقر في مكان واحد, للضيف الذي يحل حيث شاء بلا استئذان, للمتواضع الذي يجلس حيث انتهى به المجلس دون تكلف]
  note: أي ضعني في أي مكان فستجدني فيه كما تركتني؛ جاء على لسان الكسول الأخرق.
  source: abboudi_amthal
  page: 409
  volume: ج١
  status: draft

- id: xu0370
  kind: usage
  prompt: متى بالعمر يمرّ؟
  answer: للشيء الذي يندر حدوثه
  others: [لمن يستعجل مرور الأيام, لمن يتحسر على شبابه الضائع, لمن يؤجل عمله إلى الغد]
  note: أي متى يمر هذا في حياة المرء؟ والمراد أنه لا يحدث في العمر إلا نادرا.
  source: abboudi_amthal
  page: 1313
  volume: ج٤
  status: draft

- id: xu0371
  kind: usage
  prompt: ابن الحلال عند طرياه
  answer: لمن يحضر في اللحظة التي يُذكر فيها
  others: [لمن يرث مالا حلالا عن أبيه فيحفظه لأولاده, لمن يدافع عن الغائب إذا ذُكر بسوء, لمن يحفظ أسماء الناس ولا ينساها]
  note: «طرياه» أي ذكره على اللسان؛ فالرجل الطيب يطلّ على القوم وهم يتحدثون عنه.
  source: abboudi_amthal
  page: 46
  volume: ج١
  status: draft

- id: xu0372
  kind: usage
  prompt: غار أظلم
  answer: للكتوم الذي لا يطلع أحدا على أسراره وشؤونه
  others: [للبخيل الذي يخفي ماله عن أهله وجيرانه ولا ينفق منه, للجاهل الذي لا يعرف ما حوله, للحزين الذي يعتزل الناس]
  note: شبهوه بالكهف المظلم الذي لا يُرى ما في داخله.
  source: abboudi_amthal
  page: 891
  volume: ج٣
  status: draft

- id: xu0373
  kind: usage
  prompt: كلٍّ حول لغيفته
  answer: في أن كل إنسان يدور حول ما يطمع فيه
  others: [في أن كل إنسان يدافع عن أهله, في أن الضيف يأكل مما يليه, في أن لكل قوم عاداتهم في الطعام والشراب]
  note: «اللغيفة» تصغير لغفة، وهي الأكلة ونحوها مما يُطمع فيه.
  source: abboudi_amthal
  page: 1034
  volume: ج٣
  status: draft

- id: xu0374
  kind: usage
  prompt: البومه صارت قرناسه
  answer: للحقير الضعيف إذا تجبّر وتنمّر
  others: [للقبيح إذا تجمّل فحسن منظره, للكسول إذا نشط فجأة في عمله, للجبان إذا اختبأ عند الخطر]
  note: البومة أنثى البوم، والقرناسة الصقر الجارح؛ فهي بومة تتظاهر بأنها صقر.
  source: abboudi_amthal
  page: 282
  volume: ج١
  status: draft

- id: xu0375
  kind: usage
  prompt: طوّاف ومتشرّط
  answer: لمن يطلب من الناس ثم يشترط عليهم
  others: [لمن يكثر الأسفار ويصف البلدان, لمن يطوف على أصحابه ليصلح بينهم, لمن يبيع في الأسواق ويغالي في الثمن]
  note: «الطوّاف» السائل الذي يدور على الناس، و«متشرّط» أي مشترط؛ يسأل ويشترط معا.
  source: abboudi_amthal
  page: 780
  volume: ج٢
  status: draft

- id: xu0376
  kind: usage
  prompt: يصيح وينقع
  answer: لمن جاهر بالشكوى من مصيبة وأعلنها رافعا صوته
  others: [لمن يغضب ثم يهدأ سريعا, لمن ينادي على بضاعته في السوق بأعلى صوته ليجذب المشترين, لمن يشكو ثم يرضى بالقليل]
  note: «النقع» رفع الصوت، وهي كلمة فصيحة قديمة الاستعمال.
  source: abboudi_amthal
  page: 1740
  volume: ج٥
  status: draft

- id: xu0377
  kind: usage
  prompt: مثل الزرّ بالعين
  answer: للقريب الذي يفعل ما يعيب أهله ولا يمكن ستره
  others: [للشيء الصغير الثمين الذي يحرص عليه صاحبه كما يحرص على عينه, للصديق الملازم الذي لا يفارق صاحبه, للضيف الثقيل الذي لا يغادر]
  note: «الزرّ في العين» بياض منتفخ في سوادها، ظاهر لا يُخفى، شبّهوه بزرّ القميص.
  source: abboudi_amthal
  page: 1319
  volume: ج٤
  status: draft

- id: xu0378
  kind: usage
  prompt: حوار ربيع، إن طمّن والى عشب وإن رفع والى حليب
  answer: لمن نشأ في النعمة والرخاء
  others: [لمن يتنقل بين الأعمال طلبا للربح, لمن يرضى بالقليل ولا يطلب المزيد, لمن يأكل من كل مائدة يجدها]
  note: الحوار ولد الناقة؛ والمولود في الربيع إن خفض رأسه وجد العشب، وإن رفعه وجد حليب أمه.
  source: abboudi_amthal
  page: 435
  volume: ج١
  status: draft

- id: xu0379
  kind: usage
  prompt: تمره ما تقدر عليها اللواحيس
  answer: لمن لا يصيبه الأذى الذي يصيب غيره
  others: [لمن يأكل ولا يشبع من الحلوى, لمن يخفي ماله عن أعين الناس, لمن يُطمع فيه لطيبه وحلاوته فيتكالب عليه الناس]
  note: اللواحيس جمع لاحس، وهو في زعمهم سامّ أبرص يلحس الطعام فيسمّه، إلا التمر فإنه لا يقدر عليه.
  source: abboudi_amthal
  page: 323
  volume: ج١
  status: draft

- id: xu0380
  kind: usage
  prompt: حطّه على يمناك
  answer: للشهم الذي تجده حاضرا للعون متى طلبته
  others: [للمال الذي تدّخره لوقت الشدة, للصديق الذي تستشيره في كل أمر, للضيف الذي يُقدَّم في المجلس إكراما لسنه ومكانته]
  note: أي ضعه على يمينك، فستجده مستعدا لبذل ما تريده منه.
  source: abboudi_amthal
  page: 409
  volume: ج١
  status: draft

- id: xu0381
  kind: usage
  prompt: الفاهي يغدى بلعبته
  answer: في مدح الحزم وذم التهاون
  others: [في ذم من يلعب ويترك عمله, في مدح الطفل الذي يحفظ ألعابه, في نصح من يقرض ماله لكل أحد]
  note: «الفاهي» الساهي الغافل، و«يُغدى بلعبته» أي يذهب غيره بلعبته؛ فمن غفل عن حاجته ضاعت عليه.
  source: abboudi_amthal
  page: 908
  volume: ج٣
  status: draft

- id: xu0382
  kind: usage
  prompt: يسحب رسنه
  answer: للجاهل ونحوه يُترك بلا أمر ولا نهي
  others: [لمن يقود قومه بحكمة, للبعير الذي ضل عن صاحبه, لمن يعمل بجد دون أن يُطلب منه أو ينتظر أجرا]
  note: «الرسن» الحبل يُقاد به البعير؛ فهو يجرّ رسنه بنفسه، لا يقوده أحد ولا يثنيه عن مراده.
  source: abboudi_amthal
  page: 1723
  volume: ج٥
  status: draft

- id: xu0383
  kind: usage
  prompt: الحظ ما هو بجدّ لاحد
  answer: في أن الثروة والجاه قد ينالهما من لم يرثهما عن آبائه
  others: [في أن من جدّ في طلب الرزق وجده, في أن الحظ لا يدوم لأحد، فقد يصبح الغني فقيرا في يوم واحد, في أن الأجداد يورثون الحظ لأحفادهم]
  note: «الجدّ» هنا أبو الأب؛ فالحظ الحسن ليس إرثا عن الأجداد، بل هبة من الله قد ينالها ابن الفقير.
  source: abboudi_amthal
  page: 411
  volume: ج١
  status: draft

- id: xu0384
  kind: usage
  prompt: قلّل، ودلّل
  answer: في النهي عن الإكثار من الزرع مع إهماله
  others: [في النهي عن تدليل الأولاد بكثرة العطايا, في الحث على الاقتصاد في الطعام, في مدح من يقلل كلامه ويكثر عمله]
  note: 'من أمثال الفلاحين: ازرع قليلا وأعطه كل ما يحتاج من عناية، كالصبي المدلل الذي يُجاب إلى كل طلب.'
  source: abboudi_amthal
  page: 991
  volume: ج٣
  status: draft

- id: xu0385
  kind: usage
  prompt: فينا وفيكم من خبيث وطيّب
  answer: يقوله العاقل لجماعتين تتنازعان الفخر
  others: [يقوله التاجر حين يعرض بضاعة مختلطة, يقوله الشيخ حين يقسم الغنيمة بين قومه, يقوله الضيف حين يمدح أهل البيت]
  note: في كل جماعة الطيب والرديء، فلا تدّعي إحداهما أن رجالها كلهم أخيار.
  source: abboudi_amthal
  page: 921
  volume: ج٣
  status: draft

- id: xu0386
  kind: usage
  prompt: يسحب ويجر
  answer: لمن عاد وقد نال ما يبتغي من الغنيمة
  others: [لمن يتثاقل في مشيه من التعب, لمن يجر المشاكل على قومه, لمن يُكرَه على عمل لا يريده فيؤديه متثاقلا]
  note: كأنه يعود يسحب ما غنمه ويجرّه خلفه.
  source: abboudi_amthal
  page: 1723
  volume: ج٥
  status: draft

- id: xu0387
  kind: usage
  prompt: قلّ همّه نسّاني إيّاه
  answer: لنسيان ما لا أهمية له عند المرء
  others: [لمن نسي همومه بعد أن فرّج الله عنه, لمن يتناسى معروف غيره, لمن ينسى أصدقاءه إذا اغتنى]
  note: قلة اهتمامي بالأمر هي التي جعلتني أنساه.
  source: abboudi_amthal
  page: 991
  volume: ج٣
  status: draft

- id: xu0388
  kind: usage
  prompt: ما هوب على قاشور
  answer: للعمل الذي لا يُظن أن يخلو من منفعة ولو قليلة
  others: [للعمل الذي لا يُرجى منه خير أبدا مهما بذل فيه صاحبه, للرجل الذي لا يبالي بالعواقب, للمال الذي يضيع في غير وجهه]
  note: «القاشور» الأمر السيئ أو النتيجة السيئة؛ أي ليس صاحبه على ظن أن يلقى ما يكره.
  source: abboudi_amthal
  page: 1267
  volume: ج٣
  status: draft

- id: xu0389
  kind: usage
  prompt: حرّك تبلش
  answer: لمن وقع في ورطة لا يستطيع الخلاص منها
  others: [لمن يحث صاحبه على العمل والنشاط, لمن يتحرك كثيرا في المجالس ولا يستقر على حال, لمن يخاف أن يبدأ عملا جديدا]
  note: '«البلشة» عندهم الورطة؛ والمعنى: كلما حرّك الأمر علِق فيه أكثر.'
  source: abboudi_amthal
  page: 397
  volume: ج١
  status: draft

- id: xu0390
  kind: usage
  prompt: ما هو بزند البواردي
  answer: للمضطرب الضعيف الجسم
  others: [للذي يخطئ الرأي في كل أمر, للبخيل الذي يمسك يده عن العطاء, للجبان الذي يهرب عند أول طلقة]
  note: «البواردي» الماهر في رمي البندق، وزنده ثابت لا يهتز وإلا أخطأ الهدف.
  source: abboudi_amthal
  page: 1267
  volume: ج٣
  status: draft

- id: xu0391
  kind: usage
  prompt: المداوي، ما ياوي
  answer: في قسوة قلب من اعتاد معالجة المرضى
  others: [في أن الطبيب لا يداوي نفسه, في أن العلاج المر خير من المرض, في أن المريض لا يعرف قيمة الطبيب]
  note: «ياوي» يرحم ويشفق؛ فالطبيب لكثرة ما يرى من الآلام لم يعد يتألم لمرضاه.
  source: abboudi_amthal
  page: 1338
  volume: ج٤
  status: draft

- id: xu0392
  kind: usage
  prompt: إلى كذّبت فسنّد
  answer: لمن يُكذَّب في خبر نقله، فينصح بأن يذكر مصدره
  others: [لمن يكذب مرة فلا يصدّقه أحد بعدها, لمن يكذب على الناس ثم يحلف ليقنعهم بصدق كلامه, لمن يرفض أن يصدّق الأخبار حتى يراها]
  note: «كُذّبت» أي كذّبك سامعك، و«سنّد» أي انسب الحديث إلى من رواه لك فتبرأ من تهمة اختلاقه.
  source: abboudi_amthal
  page: 172
  volume: ج١
  status: draft

- id: xu0393
  kind: usage
  prompt: حطّ له القمر بيد، والشمس بيد
  answer: لمن منّاه صاحبه بالأماني الكبيرة
  others: [لمن جمع المجد من أطرافه وحاز الشرف والمال, لمن يسهر الليل ويعمل النهار, لمن يعطي بيمينه ولا تعلم شماله]
  note: «حطّ» أي وضع؛ جعله يتخيل أن الشمس في إحدى يديه والقمر في الأخرى.
  source: abboudi_amthal
  page: 409
  volume: ج١
  status: draft

- id: xu0394
  kind: usage
  prompt: ضاعت ولقيناها
  answer: لتذكّر الحجة أو المسألة أو النادرة بعد نسيانها
  others: [لمن وجد ماله الضائع بعد يأس طويل فحمد الله وتصدق منه, لمن عاد إليه ولده بعد غياب, لمن ربح بعد خسارة طويلة]
  note: وهو بلفظه عند العامة في الشام، وقريب منه عند المصريين.
  source: abboudi_amthal
  page: 744
  volume: ج٢
  status: draft

- id: xu0395
  kind: usage
  prompt: أطيب ما بالرخوم لسانها
  answer: لمن يكثر الكلام الحسن ويقصّر في الفعل
  others: [لمن يسكت كثيرا فإذا تكلم أصاب, لمن يحسن العمل في صمت ويتجنب الكلام الكثير, لمن يمدح الناس في وجوههم طمعا]
  note: الرخوم جمع رخمة، طائر استعاروه للرجل الذي لا خير فيه؛ فأحسن ما عند هؤلاء ألسنتهم، أما أفعالهم فقليلة.
  source: abboudi_amthal
  page: 110
  volume: ج١
  status: draft

- id: xu0396
  kind: usage
  prompt: عسى كحلها يسدّ عيونها
  answer: لمن يُرتجى منه الفضل وهو لا يكاد يقوم بأمر نفسه
  others: [لمن يتزين بما لا يملك, لمن يبخل بالقليل على أقاربه وهو يملك الكثير من المال, لمن يعيب غيره بما فيه]
  note: أي عسى أن يكفي حاجة عينيها؛ وأصله في امرأة تدّعي أن عندها كحلا كثيرا وليس عندها إلا ما يكاد يكفيها.
  source: abboudi_amthal
  page: 823
  volume: ج٢
  status: draft

- id: xu0397
  kind: usage
  prompt: كلّ شي والم إلا الجهاز
  answer: لمن يغفل أهم الشروط لإكمال الشيء
  others: [لمن يستعد للسفر ثم يتراجع, لمن يجهّز بيته قبل أن يتزوج, لمن يعد بالكثير ولا يفي بشيء]
  note: '«والم» أي جاهز معدّ، و«الجهاز» المهر؛ يروون أن شابا فقيرا خطب ابنة عمه فلما سأله عمه أجابه: كل شيء جاهز إلا المهر.'
  source: abboudi_amthal
  page: 1047
  volume: ج٣
  status: draft

- id: xu0398
  kind: usage
  prompt: ملابيد في الذرّة
  answer: لمن يخفون عداوتهم ويتربصون
  others: [لمن يعملون في الزرع بجد وصبر, لمن يختبئون من المطر والبرد, لمن يكثرون الكلام ولا يعملون]
  note: «ملابيد» جمع ملبد، وهو اللاصق بالأرض اختفاء؛ ونبات الذرة الطويل يخفي من فيه إخفاء تاما.
  source: abboudi_amthal
  page: 1383
  volume: ج٤
  status: draft

- id: xu0399
  kind: usage
  prompt: الخير يخيّر، والشر يغيّر
  answer: في أن الغنى يُكثر الإحسان والفقر يغيّر طبع الكريم
  others: [في أن الجار الصالح يُصلح جاره والسيئ يفسده, في أن الخير يُختار له وقته والشر يأتي فجأة, في أن الكلمة الطيبة تجمع القلوب والكلمة السيئة تفرّقها]
  note: «الخير» هنا المال والسعة؛ فالمال يجعل صاحبه كثير البر، والحاجة قد تصرف الكريم عن عادته.
  source: abboudi_amthal
  page: 490
  volume: ج٢
  status: draft

- id: xu0400
  kind: usage
  prompt: الناس بايش وهو بايش
  answer: لمن لا يشارك القوم همّهم أو مصيبتهم
  others: [لمن يخالف الناس في الرأي عنادا, لمن يسأل عن كل شيء ولا يفهم, لمن يتبع الناس في كل ما يفعلون]
  note: '«أيش» أي شيء؛ والمعنى: الناس في شأن وهو في شأن آخر.'
  source: abboudi_amthal
  page: 1492
  volume: ج٤
  status: draft

- id: xu0401
  kind: usage
  prompt: تقطّع عليه الما
  answer: لمن انفلت منه زمام الأمر
  others: [لمن انقطع رزقه بعد سعة, لمن عطش في سفره الطويل, لمن خاصمه أهله وقاطعوه]
  note: أصله في الفلاح يسقي زرعه في السواقي، فإذا تسرّب الماء وضاع أكثره قالوا ذلك.
  source: abboudi_amthal
  page: 319
  volume: ج١
  status: draft

- id: xu0402
  kind: usage
  prompt: الله يقطع شجرة ما تظلّل على جذعها
  answer: لصاحب الجاه أو الثراء الذي لا يصل خيره إلى أقاربه
  others: [للكسول الذي يعيش عالة على أهله, للبخيل الذي يمنع الماء عن زرع جاره وهو يملك البئر الكبيرة, للولد الذي يهجر بيت أبيه]
  note: دعاء على الشجرة التي لا يبلغ ظلها جذعها؛ فمن لم ينفع أهله فلا خير فيه لغيرهم.
  source: abboudi_amthal
  page: 1122
  volume: ج٣
  status: draft

- id: xu0403
  kind: usage
  prompt: حلاله يكسّر الخشب
  answer: للغني الذي كثر ماله المخزون
  others: [للقوي الذي يحطم ما يعترض طريقه, للبخيل الذي يخزن ماله ولا ينفقه, للنجار الماهر في صنعته]
  note: كانوا يخزنون التمر والحبوب في غرف سقوفها من خشب، فإذا كثر المخزون عجز الخشب عن حمله.
  source: abboudi_amthal
  page: 419
  volume: ج١
  status: draft

- id: xu0404
  kind: usage
  prompt: مثل الجراده عيونها بهامتها
  answer: لمن اشتد غضبه حتى جحظت عيناه
  others: [لمن يتكبر فلا ينظر إلى من هو دونه, لمن يأكل كثيرا ولا يشبع, لمن يسهر الليل فلا ينام]
  note: عينا الجرادة في أعلى رأسها؛ وللعامة حكاية طريفة تزعم أنهما انتقلتا إلى هناك من شدة غضبها.
  source: abboudi_amthal
  page: 1319
  volume: ج٤
  status: draft

- id: xu0405
  kind: usage
  prompt: وش على مدّاح روحه
  answer: في أن مدح المرء نفسه سهل والصعب أن يمدحه الناس
  others: [في أن من يمدح غيره في وجهه يرجو منه عطاء أو منصبا, في أن المدح الكثير يفسد الممدوح, في أن الشاعر يمدح من لا يستحق]
  note: «وش» أي شيء؛ ما الذي يتعب من يمدح نفسه؟
  source: abboudi_amthal
  page: 1558
  volume: ج٤
  status: draft

- id: xu0406
  kind: usage
  prompt: اليد من فوقه
  answer: لمن يمكن التغلب عليه
  others: [للكريم الذي يعطي ولا يأخذ, لمن يتولى أمر قومه, لمن يرفع يده بالدعاء]
  note: وهو عكس قولهم «ما فوق يده إلا يد الله».
  source: abboudi_amthal
  page: 1711
  volume: ج٥
  status: draft

- id: xu0407
  kind: usage
  prompt: شورك وهداية الله
  answer: في الانصياع لرأي المشير والعمل به
  others: [في رفض النصيحة بلطف, في طلب المشورة من الكبار قبل الإقدام على أي أمر, في التردد بين رأيين]
  note: 'يقوله الرجل لصاحبه: سأفعل ما أشرت به، ولم يبق إلا أن يهدينا الله. وهو عكس «شورك خلّه في زورك».'
  source: abboudi_amthal
  page: 696
  volume: ج٢
  status: draft

- id: xu0408
  kind: usage
  prompt: عشاه يطرد غداه، وغداه يطرد عشاه
  answer: للفقير الذي لا ينال وجبته في موعدها
  others: [للنهم الذي لا يكف عن الأكل, للمشغول الذي يؤخر طعامه لعمله فلا يأكل إلا مرة, للمسافر الذي يأكل في الطريق]
  note: لا يكاد يحصل على عشائه حتى يحين وقت غدائه، فوجباته تتلاحق متأخرة لفقره.
  source: abboudi_amthal
  page: 826
  volume: ج٢
  status: draft

- id: xu0409
  kind: usage
  prompt: تلقيط ما هنا حشي
  answer: للشيء القليل الذي يُجمع حبة حبة
  others: [للمال الكثير الذي تمتلئ به الجيوب والصناديق, للطعام الذي يُحشى ويُطبخ, للرزق الذي يأتي دفعة واحدة]
  note: أي هو شيء يُلتقط قليلا قليلا، وليس كثيرا تُحشى به الجيوب والأوعية؛ وأصله في التقاط السنابل ونحوها.
  source: abboudi_amthal
  page: 320
  volume: ج١
  status: draft

- id: xu0410
  kind: usage
  prompt: عين للغراب، وعين للتراب
  answer: لمن عاد في غاية التعب خالي اليدين
  others: [لمن يراقب أمرين في وقت واحد, لمن يطمع في الكثير فيضيع القليل, لمن يخاف من عدوه فيسهر الليل يترقب قدومه]
  note: 'لعل أصله في الدابة المشرفة على الهلاك: عين يتربص بها الغراب، وعين مصيرها التراب.'
  source: abboudi_amthal
  page: 884
  volume: ج٢
  status: draft

- id: xu0411
  kind: usage
  prompt: الْبَارُودْ وَالْحَبَّه مَنَ الْقَايَدْ
  answer: لمن لا يبالي بتبذير مال غيره
  others: [لمن يحسن الرماية في المواسم, لمن يتقرب إلى أصحاب السلطة, لمن يخزن البارود في بيته]
  note: 'من أمثال البدو في مواسم الفروسية: البارود والحبّ على حساب القائد، فلا يهتم المرء بإسراف ما لا يدفعه.'
  source: dadoun
  page: 295
  status: draft

- id: xu0412
  kind: usage
  prompt: تِيظَلْ بْحَالْ الدّْجَاجَه فِى الشّْتَبْ
  answer: لمن يكثر العمل دون أن يجني منه ثمرة
  others: [لمن يكثر الأكل ولا يشبع أبدًا, لمن يخاف من كل صوت يسمعه في الليل فلا ينام, لمن يبيت خارج بيته كل ليلة]
  note: الشتب في الدارجة بقايا التبن والنبات اليابس، تنبش فيه الدجاجة طويلًا بلا حصيلة. يقال فيمن يتعب بلا خبرة ولا نتيجة.
  source: dadoun
  page: 55
  status: draft

- id: xu0413
  kind: usage
  prompt: عْشَاتَكْ يَا عِيدْ
  answer: في الحث على القناعة وترك التباهي بالأضاحي
  others: [في وصف من يدعو الناس إلى العشاء ليلة العيد, في ذم من ينفق كل ماله على طعام العيد, في من يسهر ليلة العيد ولا ينام]
  note: 'يُسأل المرء في عيد الأضحى عن أضحيته فيجيب: هي عشاؤك يا عيد، أي تكفينا وإن لم تكن سمينة.'
  source: dadoun
  page: 191
  status: draft

- id: xu0414
  kind: usage
  prompt: صَيْدُه بَالصَّنَّارَه بْحَالْ الْحُوتَه
  answer: لمن انطلت عليه حيلة غيره فوقع في شباكه
  others: [لمن يتقن صيد السمك ويفخر به, لمن يصبر طويلًا حتى ينال ما يريد, لمن يحب أكل السمك في كل وجبة ولا يملّ منه]
  note: اصطاده بالصنارة كما تُصاد السمكة. يقال فيمن خُدع حتى وقع في الفخ، خاصة إذا كان ممن يصعب خداعهم.
  source: dadoun
  page: 163
  status: draft

- id: xu0415
  kind: usage
  prompt: خَمَّمْ غِيرْ فِى رَاسَكْ، لاَ تْخَمَّمْ لَحَدْ
  answer: لمن يحمّله غيره مسؤولياته دون أن يشفق عليه
  others: [لمن يتدخل في قرارات غيره بلا سبب, لمن يرفض الاستماع إلى نصيحة أحد, لمن يفكر كثيرًا في كل أمر ولا يقدم على أي عمل]
  note: فكّر في نفسك وحدها. نصيحة لمن يرهقه الآخرون بأعبائهم ولا يرحمونه، أن يلتفت إلى شأنه.
  source: dadoun
  page: 95
  status: draft

- id: xu0416
  kind: usage
  prompt: كُلْ طِيرْ كَيْلْغِي بْلْغَاهْ
  answer: لحشد تختلط أصواته فلا يُفهم منه شيء
  others: [لمن يتقن عدة لغات ويتباهى بها, لمن يقلد لهجات الناس ليضحكهم, لمن يغني بصوت جميل في الأفراح]
  note: اللغا في الدارجة الكلام واللغة. كل طائر يغرد بلغته، كناية عن جمع كثير يعلو ضجيجه فلا تميز منه ما يفيدك.
  source: dadoun
  page: 239
  status: draft

- id: xu0417
  kind: usage
  prompt: لَيْتِيمْ رَجْلِيهْ كَيْجِيبُه الْغَيْسْ فَى الصّْمَايَمْ
  answer: في أن اليتيم لا يجد من يحنو عليه ويسانده
  others: [في أن الفقير يمشي حافيًا في كل الفصول, في أن المطر قد ينزل في عزّ الصيف على غير عادته, في أن من يعمل في الطين لا تنظف قدماه]
  note: الغيس هو الوحل، والصمايم أشد أيام الحر. فاليتيم يجد الوحل حتى في الصيف، أي لا يحظى بالسند مهما أتقن عمله.
  source: dadoun
  page: 295
  status: draft

- id: xu0418
  kind: usage
  prompt: ابْنِ وْعَلِّ، سِرْ وْخَلِّ
  answer: لمن ينشغل بتشييد البيوت وينسى أنه راحل
  others: [لمن يبدأ البناء ولا يتمّه أبدًا, لمن يسكن بيتًا لا يملكه, لمن يهدم ما بناه غيره ليبني مكانه بيتًا لنفسه]
  note: ابنِ وارفع البناء، ثم امضِ واتركه لغيرك. تذكير بأن الدنيا ممرّ، فلا يشغلك البنيان عن العمل للآخرة.
  source: dadoun
  page: 23
  status: draft

- id: xu0419
  kind: usage
  prompt: تِيعَمَّرْ الصّْوَارَجْ
  answer: لمن يفتخر بما لا يملك
  others: [لمن يبني بيتًا فوق طاقته, لمن ينسج الأكاذيب عن غيره, لمن يجمع المال ولا ينفقه]
  note: الصوارج أدوات خشبية تُملأ بخيوط الحرير ثم تفرغ عند النسج. فمن يتباهى بامتلائها يتباهى بشيء زائل ليس له.
  source: dadoun
  page: 55
  status: draft

- id: xu0420
  kind: usage
  prompt: بْلاَرَجْ جَايْبُوسْ وَلْدُه اعْمَاهْ
  answer: لمن يريد إصلاح شيء فيفسده
  others: [لمن يفرط في تدليل أبنائه حتى يفسدهم, لمن يهاجر بعيدًا ويترك صغاره, لمن يبني بيته في أعلى مكان]
  note: اللقلاق منقاره طويل، فلما جاء يقبّل فرخه أعماه. كناية عمن يفسد ما أراد إصلاحه لقلة حذقه أو تركيزه.
  source: dadoun
  page: 27
  status: draft

- id: xu0421
  kind: usage
  prompt: رَبِّي يَا سِيدِي، مَارْسْ دْخَلْ قْبَلْ بْشْهَرْ وَنْهَارْ
  answer: حين يثور أحد أهل البيت فجأة ويحدث ضجة
  others: [حين يأتي البرد قبل موعده المعتاد, حين يصل الضيف قبل الموعد المتفق عليه, حين يبدأ الفلاح الزرع قبل أوان الحرث المعتاد]
  note: 'من تعابير نساء فاس: كأن شهر مارس ببرقه ورعده وعواصفه دخل قبل أوانه حين يغضب الزوج أو الابن ويصخب.'
  source: dadoun
  page: 111
  status: draft

- id: xu0422
  kind: usage
  prompt: الْخِيرْ سْلُوفَاتْ وَالشَّرْ سْلُوفَاتْ
  answer: في الحث على فعل الخير لأن ما تقدمه يعود إليك
  others: [في الحث على إقراض المال لمن يحتاج, في ذم من يكثر الاستدانة من الناس, في التحذير من مصاحبة الأشرار لأن شرهم يصيب من يجالسهم]
  note: 'السلوفات هي القروض. فالخير يُردّ إلى صاحبه كالدين، والشر كذلك. كما يقال: كيف عملت يا ولدي تودّي.'
  source: dadoun
  page: 311
  status: draft

- id: xu0423
  kind: usage
  prompt: اللِّي جَا عَنْدْ احْبَابُه يْنُوضْ لَلْقَابُو
  answer: ترغيبًا للضيوف في أن يتصرفوا كأهل البيت
  others: [تعريضًا بضيف يغادر دون أن يودّع أحدًا, تعريضًا بمن يأكل قبل أن يغسل يديه, ترغيبًا للصغار في النظافة قبل النوم]
  note: 'لقابو من الفرنسية بمعنى المغسلة. يقال للمدعوين بعد الطعام: قوموا إلى المغسلة بلا حرج، فأنتم في بيت أحبابكم.'
  source: dadoun
  page: 311
  status: draft

- id: xu0424
  kind: usage
  prompt: اللِّي كْلْ دْجَاجْ النَّاسْ كَيْسَمَّنْ دْيَالُه
  answer: لمن أكرمه غيره بطعامه فعليه أن يردّ الكرم بمثله
  others: [لمن يسرق دجاج جيرانه ليلًا ثم يدعوهم إلى العشاء منه, لمن يربي الدجاج ليبيعه في السوق, لمن يأكل كثيرًا ولا يسمن أبدًا]
  note: 'من أكل دجاج الناس فليسمّن دجاجه ليطعمهم بدوره. كما يقال: اليوم عليّ وغدًا عليك.'
  source: dadoun
  page: 279
  status: draft

- id: xu0425
  kind: usage
  prompt: مَا كَيْسْمَعْ مَنَ الطّْبَلْ غِيرْ التَّنْكِيرَه
  answer: لمن يتسرع في العمل أو في نقل الخبر قبل أن يتبيّنه
  others: [لمن يحب الموسيقى ويحضر كل الأفراح, لمن ثقل سمعه فلا يسمع إلا الأصوات العالية, لمن يكره الضجيج ويفضل الهدوء فيهرب من الأعراس والحفلات]
  note: التنكيرة هي النقرة الخفيفة على الطبل. فلا يسمع إلا أول نقرة ثم يندفع، فيشيع الخبر أو يعمل دون أن يفكر.
  source: dadoun
  page: 319
  status: draft

- id: xu0426
  kind: usage
  prompt: حَالُه يَا غْزَالُه، يْكْفِيكْ عَنْ سُوَالُه
  answer: لمن يفضحه حاله فلا يحتاج إلى سؤال
  others: [لمن يكثر السؤال عن أحوال الناس, لمن يجمّل كلامه ليخفي فقره, لمن يجيب قبل أن يُسأل ليظهر علمه أمام الناس]
  note: يقال خاصة فيمن شغفه الحب، فيظهر ذلك على ملامحه وسلوكه دون أن يبوح به.
  source: dadoun
  page: 71
  status: draft

- id: xu0427
  kind: usage
  prompt: هَمْ الدُّنْيَا كَيْبْقَى فِيهَا
  answer: لمن يحمل الهموم كلها فيُنصح بالتخفيف عن نفسه
  others: [لمن يترك الدنيا ويعتزل الناس, لمن يرث مالًا ثم يفقده بسرعة, لمن يهاجر بعيدًا عن وطنه ثم يحن إليه طوال عمره]
  note: هموم الدنيا لا تنتهي إلا بانتهاء الحياة، فعلى المرء أن يريح نفسه منها ويواجهها بهدوء.
  source: dadoun
  page: 367
  status: draft

- id: xu0428
  kind: usage
  prompt: الْحَشُومِي تَيْنْجِيبْهَا فِى رَاسُه
  answer: للخجول الذي يسكت عما يضره فيقع فيه
  others: [لمن يجلب الهموم لنفسه بكثرة التفكير, لمن يحمل الأثقال على رأسه, لمن يلوم نفسه على ذنوب غيره]
  note: الحشومي هو الخجول الذي لا يجرؤ على الإفصاح عما يضره، فيتحمل عاقبة سكوته وحده.
  source: dadoun
  page: 295
  status: draft

- id: xu0429
  kind: usage
  prompt: ادْهَنْ السِّيرْ يْسِيرْ
  answer: لمن يقضي حاجاته بالرشوة
  others: [لمن يعتني بحذائه ويلمعه كل يوم, لمن يدهن شعره بالزيت قبل الخروج, لمن يسافر كثيرًا مشيًا على قدميه]
  note: السير قطعة جلد يدهنها الخرّاز فتلين وتلتصق. فذهب مثلًا لمن يرتشي فتنقضي مآربه بسهولة.
  source: dadoun
  page: 99
  status: draft

- id: xu0430
  kind: usage
  prompt: مَا عَنْدْ الْمِيَّتْ مَا يْقُولْ قُدَّامْ غَسَّالُه
  answer: لمن اضطر إلى قبول شروط غيره لحاجته إليه
  others: [لمن يسكت عن الحق خوفًا من الناس, لمن يرفض الحديث عن الموتى بسوء, لمن يكتم سرًا مدى حياته ولا يبوح به لأحد من أهله]
  note: الميت لا يعترض على من يغسله. يقال فيمن اشتدت حاجته إلى أحد فلبّى شروطه، فللضرورة أحكام.
  source: dadoun
  page: 331
  status: draft

- id: xu0431
  kind: usage
  prompt: قْلِيلْ النَّفْسْ مَرْتَاحْ
  answer: لمن يُلام ويُعاقب فيمضي في فعله كأن شيئًا لم يكن
  others: [لمن يقنع بالقليل فيعيش سعيدًا, لمن يتعب سريعًا من أي عمل يُطلب منه فيتركه قبل أن يتمه, لمن يتنفس بصعوبة من شدة المرض]
  note: 'قليل النفس هنا من لا يبالي بالعتاب، فيتابع عمله مطمئنًا. ويقال أيضًا: قليل النفس في راحة.'
  source: dadoun
  page: 223
  status: draft

- id: xu0432
  kind: usage
  prompt: دَقْ الْوِيلْ عْلَى نَصْ اللّيلْ، قَامْ اسْوَدْ السَّعْدْ يْحَلْ الْبَابْ
  answer: لمن يستنجد بمن هو أتعس منه حظًا
  others: [لمن يزور الناس في أوقات غير لائقة, لمن يفزع من كل طارق في الليل, لمن يرفض أن يفتح بابه لضيف]
  note: طرق الشقاء الباب في منتصف الليل ففتح له سيئ الحظ. من أمثال نساء فاس فيمن يطلب العون ممن حاله أسوأ.
  source: dadoun
  page: 103
  status: draft

- id: xu0433
  kind: usage
  prompt: خَمْسَمْيَةْ صُولِي، وْخَمْسَمْيَةْ صُولِي كَتْجِي أَلْفْ صُولِي
  answer: لمن يتدخل في شؤون غيره فيقع في المتاعب
  others: [لمن يجمع المال القليل حتى يصير ثروة, لمن يخطئ في الحساب ولا يعترف بخطئه, لمن يبيع بضاعته بأقل من ثمنها ليتخلص منها بسرعة]
  note: الصولي عملة قديمة، و«ألف صولي» تُسمع «الفضولي». تورية لطيفة يُعرَّض بها بمن يتدخل فيما لا يعنيه.
  source: dadoun
  page: 87
  status: draft

- id: xu0434
  kind: usage
  prompt: الْجَرْحْ يَبْرَا، وَكْلاَمْ الْعَارْ مَا يَبْرَا
  answer: لمن يجرح كرامة غيره بالكلام اللاذع
  others: [لمن يهمل علاج جرحه حتى يتفاقم, لمن يحمل الضغينة سنوات طويلة, لمن يعتذر بعد فوات الأوان]
  note: جرح الجسد يلتئم، أما الكلمة الجارحة فيبقى أثرها في النفس، كما قال الشاعر إن جرح اللسان لا يلتئم.
  source: dadoun
  page: 63
  status: draft

- id: xu0435
  kind: usage
  prompt: اعْطِهْ الْعَلْفْ مَنْ فَمُّه، وَقَلْبُه مَنْ تَحْتْ وَاشْ سْمَنْ؟
  answer: لمن يستعجل نتيجة عمله قبل أوانها
  others: [لمن يسرف في إطعام ماشيته حتى تمرض, لمن يقلّب البضاعة كثيرًا ولا يشتري, لمن يشكّ في أمانة الراعي الذي عنده]
  note: يطعم الدابة من فمها ثم يقلبها ليرى هل سمنت! يقال لمن يريد ثمار مشروعه في الحال، والعلف لا يسمّن الغنم في يوم.
  source: dadoun
  page: 183
  status: draft

- id: xu0436
  kind: usage
  prompt: دَايَرْ عْلِيَّ عَيْنْ مِيكَا
  answer: لمن يتظاهر بأنه لا يراك ولا يعرفك
  others: [لمن يحدّق في الناس بلا حياء, لمن يضعف بصره فلا يميّز الوجوه, لمن يراقب جاره من وراء النافذة]
  note: عين الميكا عين من بلاستيك لا ترى. يقال فيمن يتعامى عنك عمدًا كأنه لم يعرفك قط.
  source: dadoun
  page: 103
  status: draft

- id: xu0437
  kind: usage
  prompt: الْجْرِي وْلَمْجَارِي بْلاَ فَايْدَه بْلاَ مْفِيدْ
  answer: لمن يتعب كثيرًا دون أن يبلغ غايته
  others: [لمن يكثر الكلام ولا يفعل شيئًا, لمن يهرب من مسؤولياته دائمًا ويلقيها على غيره, لمن يتسابق مع غيره على الصدارة]
  note: جري وركض بلا نفع ولا طائل. يقال فيمن يبذل جهدًا كبيرًا ثم يخفق في الوصول إلى ما يريد.
  source: dadoun
  page: 63
  status: draft

- id: xu0438
  kind: usage
  prompt: عَنْدْ قْلِيهْ تْدْرِيهْ
  answer: لمن يحكم على شيء قبل أن يجربه
  others: [لمن يطيل الطبخ حتى يحترق الطعام, لمن يخفي سرّه حتى عن أهله, لمن يشتري ما لا يحتاج إليه]
  note: القلي في المقلاة يكشف هل السمك طري أم لا. فلا تحكم على صلاح شيء أو فساده حتى تمارسه وتتذوقه.
  source: dadoun
  page: 183
  status: draft

- id: xu0439
  kind: usage
  prompt: مَا يَعْرَفْشِي الْوَاوْ مَنَ الزّْرْوَاطَه
  answer: للجاهل الذي يدّعي العلم والثقافة
  others: [لمن يخلط بين الأسماء فينادي الناس بغير أسمائهم, لمن يخطئ في الحساب فيخسر ماله, لمن يحمل العصا ولا يستعملها]
  note: الزرواطة هي العصا الغليظة، وهي تشبه حرف الواو في شكلها. فمن لا يفرق بينهما لا يعرف شيئًا من الكتابة.
  source: dadoun
  page: 331
  status: draft

- id: xu0440
  kind: usage
  prompt: بْحَالْ اللِّي عَوَّدْ هَمُّه لْبَنْتْ عَمُّه
  answer: لمن لا يهتم بحديثك ولا يبدي رأيه فيه
  others: [لمن يشكو همومه لكل من يلقاه, لمن يتزوج من أقاربه دون غيرهم, لمن يكرر الحكاية نفسها كل يوم]
  note: كأنك تحكي همّك لمن لا يبالي به. يقال فيمن تحدثه فلا يلتفت إلى كلامك ولا يقول فيه شيئًا.
  source: dadoun
  page: 27
  status: draft

- id: xu0441
  kind: usage
  prompt: غَدْرَكْ اللِّي قَالَّكْ سُوءْ لَلْغِيرْ
  answer: لمن يدلّك على إيذاء الناس بدل الخير
  others: [لمن يخونك بعد أن ائتمنته على سرك, لمن يسيء الظن بكل من حوله حتى بأقرب أصدقائه, لمن يكثر الشكوى من غدر الزمان]
  note: من أشار عليك بالإساءة إلى غيرك فقد غدر بك، لأن الناصح الكريم يدلّك على الخير.
  source: dadoun
  page: 207
  status: draft

- id: xu0442
  kind: usage
  prompt: امْنَاشْ خَفْتْ فِيهْ وْقَعْتْ
  answer: لمن احتاط من أمر يكرهه فوقع فيه رغم ذلك
  others: [لمن يخاف من الظلام منذ صغره, لمن يسقط في حفرة حفرها لغيره, لمن يقع في حب شخص لا يعرفه من أول نظرة إليه]
  note: ما خفت منه وقعت فيه. يقال فيمن احترز وأخذ حذره ثم وجد نفسه في ما كان يتجنبه.
  source: dadoun
  page: 331
  status: draft

- id: xu0443
  kind: usage
  prompt: بْحَالْ الْهَدْهُودْ مَا يْسْكُتْشْ
  answer: للثرثار الذي لا يعرف قيمة السكوت
  others: [لمن ينقل الأخبار بين الناس بأمانة, لمن يستيقظ باكرًا ويوقظ غيره, لمن يرفع صوته في الغناء]
  note: الهدهد يكثر الصياح. يقال فيمن يكثر الكلام، وفي الطفل الذي لا تهدأ ثرثرته وسط أسرته.
  source: dadoun
  page: 27
  status: draft

- id: xu0444
  kind: usage
  prompt: بْحَالْ الْقَرْدْ، قَبْضُه يْرَغْبَكْ، طَلْقُه يْعَوْجَكْ
  answer: لمن يتودد إليك حتى تسامحه ثم يعود إلى ذمّك
  others: [لمن يقلّد غيره في كل ما يفعل حتى يضحك منه الناس, لمن يكثر الحركة ولا يستقر في عمل, لمن يضحك الناس بحركاته ونوادره]
  note: القرد إذا أمسكته استعطفك، وإذا أطلقته عاكسك. كذلك من يلحّ في طلب عفوك فإذا ابتعد عاد يعيبك.
  source: dadoun
  page: 23
  status: draft

- id: xu0445
  kind: usage
  prompt: مَوْكُولْ وَمَذْمُومْ بْحَالْ اللّْحَمْ دَ الرّْقْبَه
  answer: لمن يكثر خيره ومعروفه ومع ذلك يُذمّ
  others: [لمن يأكل كثيرًا ثم يعيب الطعام, لمن يشتري اللحم الرخيص دائمًا, لمن يتحمل المسؤولية ثم يتخلى عنها]
  note: لحم الرقبة لين يحبه الناس لكن عظامه كثيرة فيذمونه. كذلك من ينفع الناس ويتلقى منهم اللوم.
  source: dadoun
  page: 331
  status: draft

- id: xu0446
  kind: usage
  prompt: تِيبَيَّتْهَا فِى شَانْ، وَيْصَبَّحْهَا فِى شَانْ، وَهُوَ عَظِيمُ الشَّانْ
  answer: لمن أهمّه أمر ضاق به ولم يجد له مخرجًا
  others: [لمن يغيّر رأيه بين المساء والصباح, لمن يسهر الليل في العمل ولا ينام, لمن يؤجل عمل اليوم إلى الغد ثم ينساه تمامًا]
  note: يُطمأن به المهموم بأن الحال قد يتبدل بين ليلة وضحاها، فبعد الشدة يأتي الفرج.
  source: dadoun
  page: 47
  status: draft

- id: xu0447
  kind: usage
  prompt: اللِّي خَبَّعْ جُوعُه عْلَى وَجْهُه كَيْبَانْ
  answer: لمن يدّعي غير حاله فتفضحه ملامحه
  others: [لمن يخفي طعامه عن ضيوفه, لمن يصوم ولا يخبر أحدًا, لمن يجوع في السفر ولا يشكو]
  note: من أخفى جوعه ظهر على وجهه. يقال فيمن يتظاهر بالغنى وهو فقير أو العكس، فالفراسة تكشف ما يخفيه.
  source: dadoun
  page: 251
  status: draft

- id: xu0448
  kind: usage
  prompt: الرّْكَابِي بْحَالْ الْجْمَلْ، وَالاكْتَافْ تْقَادَتْ
  answer: لمن يعتمد على غيره في معيشته وهو قادر على العمل
  others: [لمن يحمل أثقالًا فوق طاقته بلا شكوى, لمن يسافر كثيرًا ولا يستقر في بلد, لمن يتكبر على الناس بقوته وطوله ويستخف بضعفائهم]
  note: الركبتان كركبتي الجمل والكتفان متساويتان، أي صحيح البدن تامّ القوة. ومع ذلك يعيش عالة على غيره.
  source: dadoun
  page: 111
  status: draft

- id: xu0449
  kind: usage
  prompt: ارْبَطْ تْصِيبْ مَا تْطَلَّقْ
  answer: في الحث على حفظ الشيء في مكان آمن
  others: [في الحث على الإسراع في الزواج, في الحث على العفو عن المخطئ, في الحث على الوفاء بالوعد ولو كان صغيرًا]
  note: 'من أمثال البدو والفلاحين: اربط دابتك تجدها، فما تحفظه تحت يدك لا يضيع منك.'
  source: dadoun
  page: 111
  status: draft

- id: xu0450
  kind: usage
  prompt: بْغِيتْ صْدِيقَكْ يْدُومْ حَاسْبُه كُلْ يُومْ
  answer: في نصح الصديق أولًا بأول ليتدارك أخطاءه
  others: [في ترك العتاب بين الأصدقاء كي لا تفسد الصداقة, في عدم إقراض الصديق شيئًا من المال, في الإكثار من زيارة الصديق كل يوم]
  note: إن أردت دوام الصداقة فصارح صديقك كل يوم بما يبدر منه، كي لا تتراكم الأخطاء فتفسد ما بينكما.
  source: dadoun
  page: 39
  status: draft

- id: xu0451
  kind: usage
  prompt: حَصْنِي، لاَ مَنْ يْقَسْنِي
  answer: في الحث على امتلاك بيت مستقل عن الجيران
  others: [في الحث على بناء سور عالٍ حول المدينة لحمايتها, في الحث على الصبر على أذى الجار, في الحث على السكن قرب الأهل والأقارب]
  note: الحصن هنا هو البيت المستقل، ومن يقسني من يمسّني بسوء. من سكن بيته وحده عاش مطمئنًا كأنه في حصن.
  source: dadoun
  page: 79
  status: draft

- id: xu0452
  kind: usage
  prompt: ايلاَ شَفْتْ لَحْيَةْ صَاحْبَكْ اتْنَتْفَتْ اعْرَفْ دْيَالَكْ فَى الْمَنْدَافْ
  answer: لمن يرى صاحبه يُخدع فعليه أن يحذر قبل أن يصيبه مثله
  others: [لمن يقلد صاحبه في هيئته ولباسه, لمن يعتني بمظهره ولحيته أكثر من عمله فيقضي وقته عند الحلاق, لمن يشمت بصاحبه حين تصيبه مصيبة]
  note: المنداف أداة لنفش الصوف. إذا رأيت لحية صاحبك تُنتف فاعلم أن لحيتك في الطريق، فابتعد عما أوقعه.
  source: dadoun
  page: 375
  status: draft

- id: xu0453
  kind: usage
  prompt: الطَّرْحْ لَقْبِيحْ يْدُوزْ
  answer: لمن يعيش في ضيق ليُطمأن بأن الشدة لا تدوم
  others: [لمن يخسر في اللعب ثم يعيد الكرّة, لمن يتجاهل الإساءة ويمضي في طريقه, لمن يقبل كل ما يُعرض عليه دون اختيار]
  note: 'من أمثال لاعبي الورق: الطرح هو الدور في اللعب، ويدوز أي يمضي. فالدور السيئ ينقضي كما تنقضي الأزمة.'
  source: dadoun
  page: 175
  status: draft

- id: xu0454
  kind: usage
  prompt: دْيَالِي وَأَنَا فِيهْ سَاعِي
  answer: لمن استولى غيره على ملكه فصار يتوسل ليسترده
  others: [لمن يملك مالًا كثيرًا ويعيش عيشة الفقراء, لمن يتصدق بما يملك على المحتاجين, لمن يعمل في أرضه بيده دون أجير]
  note: ملكي وأنا أستجدي فيه! يقال فيمن أخذ غيره ماله فصعب عليه استعادته أو التصرف فيه.
  source: dadoun
  page: 99
  status: draft

- id: xu0455
  kind: usage
  prompt: دْخَلْ يَاكُلْ لَفْرِيكْ صَارْ شْرِيكْ
  answer: لمن تعينه فيتمكّن حتى يصير شريكًا في ملكك
  others: [لمن يدعوك إلى طعامه ثم يطلب ثمنه, لمن يدخل في تجارة لا يعرف أسرارها, لمن يأكل من الطعام أكثر من نصيبه ولا يترك لغيره]
  note: الفريك قمح أخضر محمّص. جاء ليأكل منه فإذا به شريك في الحقل. يقال فيمن يتمسكن حتى يتمكن من مالك ومتاعك.
  source: dadoun
  page: 99
  status: draft

- id: xu0456
  kind: usage
  prompt: اللّهْ يَجْعَلْ عُذْرْنَا شْتَا
  answer: لمن يتخذ المطر عذرًا لتخلّفه عن موعده
  others: [لمن يدعو بنزول المطر في سنوات الجفاف, لمن يعتذر عن خطأ لم يرتكبه ليرضي من غضب منه, لمن يحب البقاء في البيت شتاءً]
  note: الشتا في الدارجة المغربية هو المطر. يقال فيمن أخلف موعده ثم احتج بأن المطر منعه من الحضور.
  source: dadoun
  page: 311
  status: draft

- id: xu0457
  kind: usage
  prompt: حَمَّامْ بْلاَ قْبَابْ
  answer: للمكان الضيق المزدحم بالناس وضجيجهم
  others: [للبيت الواسع الذي لا يسكنه أحد, للعمل الذي يُبدأ ولا يتم أبدًا, للمجلس الهادئ الذي يطيب فيه الحديث]
  note: إذا قلّ الماء الساخن في الحمّام تزاحمت النساء على الدلاء وعلا صخبهن. فيقال في كل مكان يكثر فيه الزحام والضوضاء.
  source: dadoun
  page: 79
  status: draft

- id: xu0458
  kind: usage
  prompt: لَعْظَمْ اللِّي مَا تْكَدْدُه، وَالِي بِهْ خُوكْ
  answer: لمن يستغني عن شيء فيقدمه لأقرب الناس إليه
  others: [لمن يبخل على أخيه بما لا يحتاجه, لمن يأكل كل شيء ولا يترك لغيره, لمن يرمي بقايا الطعام للكلاب بدل أن يطعمها للفقراء]
  note: العظم الذي لا تقدر على قضمه أولى به أخوك. يقال في تقديم ما يزيد عن حاجتك لصديق حميم أو أخ شقيق.
  source: dadoun
  page: 251
  status: draft

- id: xu0459
  kind: usage
  prompt: زي الفار والقطوس
  answer: للمتعاديين لا يلتقيان إلا ويقع بينهما نزاع
  others: [للصديقين لا يفترقان في ليل ولا نهار, للخائف الذي يهرب من ظله ويختبئ عند سماع أي صوت, للقوي الذي يتسلط على الضعيف]
  note: «القطّوس» القط.
  source: mughniyya
  page: 301
  flag: 'answer may be wrong: The entry «زي الفار والقطوس» (p. 301) has its explanation lost in the OCR, so the answer could not be checked; only the footnote القطوس = القط is legible.'draft

- id: xu0460
  kind: usage
  prompt: يضحك عبد السلام وعباته رايحه
  answer: لمن لا تتناسب ردة فعله مع الموقف الذي يمر به
  others: [لمن يضحك على مصائب الناس شماتة, لمن يخفي حزنه وراء ابتسامته, لمن يضيع ماله ثم يلوم غيره على ضياعه ولا يعترف بإهماله]
  note: يضحك ملء فمه وهو يبحث عن عباءته الضائعة.
  source: mughniyya
  page: 570
  status: draft

- id: xu0461
  kind: usage
  prompt: إلي مريشه تحضن على أم الريش
  answer: في طمع الغني بالفقير واستغلال القوي للضعيف
  others: [في عطف الكبير على الصغير ورعايته له, في تعاون الجيران عند الشدة والضيق, في شبه الأبناء بآبائهم وأمهاتهم في الطباع والأخلاق والهيئة]
  note: «أم الريش» رمز لصاحب المال والسلطة، و«المريّشة» قليلة الريش رمز للفقير قليل الحيلة.
  source: mughniyya
  page: 134
  status: draft

- id: xu0462
  kind: usage
  prompt: كلمه الباشا
  answer: سخريةً ممن يختال عجبًا بنفسه لكلمة بسيطة سمعها
  others: [سخريةً ممن يكثر الكلام في مجالس الكبار, سخريةً ممن يدّعي أنه من أقارب الحاكم, سخريةً ممن يطيع أوامر الحاكم دون أن يفهمها أو يسأل عن سببها]
  note: شوهد ساذج يختال مرحًا فسُئل فقال إن الباشا كلّمه، فلما سألوه ماذا قال أجاب بأنه أمره أن يبتعد عن الطريق.
  source: mughniyya
  page: 450
  status: draft

- id: xu0463
  kind: usage
  prompt: الخانب ما تلهدش بيه فرس
  answer: في أن السارق لا يقدر على الفرار من شدة خوفه
  others: [في أن السارق يسرق الخيل قبل غيرها, في أن الفرس الأصيلة لا تحمل اللصوص, في أن الخائف يعدو أسرع من الفرس إذا طارده أصحاب المال]
  note: «الخانب» السارق، و«تلهد» تسرع؛ خوفه واضطرابه يمنعانه من الإفلات مهما كانت فرسه.
  source: mughniyya
  page: 247
  status: draft

- id: xu0464
  kind: usage
  prompt: ما طاب اللحم نين ربي رحم
  answer: في الدعوة إلى التفاؤل وانتظار الفرج
  others: [في الدعوة إلى الصبر على الجوع, في الدعوة إلى إكرام الضيف بأطيب الطعام, في ذم الاستعجال في الطبخ]
  note: «طاب» نضج، و«نين» حتى؛ ما إن ينضج الطعام حتى يأتي الفرج.
  source: mughniyya
  page: 486
  status: draft

- id: xu0465
  kind: usage
  prompt: مسمار في سفينه
  answer: للشيء أو الشخص الكثير النفع وإن بدا صغيرًا تافهًا
  others: [للشيء أو الشخص الذي يسبب الغرق والخراب, للشيء أو الشخص الذي لا يستقر في مكان, للشيء أو الشخص الذي يصعب التخلص منه مهما حاولت إبعاده عنك]
  note: المسمار الصغير يمسك ألواح السفينة كلها، فلا يُستهان بصغره.
  source: mughniyya
  page: 510
  status: draft

- id: xu0466
  kind: usage
  prompt: كيف ريح المباركات
  answer: للمتردد المتقلب المزاج الذي لا يثبت على رأي
  others: [للمسافر الذي لا يعرف وجهته, للغني الذي يتباهى بثروته أمام الفقراء في كل مناسبة, للكريم الذي يوزع عطاياه على الجميع]
  note: «ريح المباركات» رياح تهب من جهات مختلفة وتتقلب فجأة مدة عشرين يومًا.
  source: mughniyya
  page: 456
  status: draft

- id: xu0467
  kind: usage
  prompt: عام صابة الحمير
  answer: كناية عن فترة من الفقر والحاجة
  others: [كناية عن موسم الخصب وكثرة الغلال, كناية عن سنة كثرت فيها الأعراس, كناية عن زمن رخص فيه كل شيء]
  note: يشير إلى سنة مجدبة هلك فيها كثير من الإبل والخيل، فاضطر الناس إلى الاستعانة بالحمير في أعمالهم الزراعية.
  source: mughniyya
  page: 361
  status: draft

- id: xu0468
  kind: usage
  prompt: دزه يخطبله اتجوزها
  answer: لمن يُوكل إليه أمر فيستأثر به لنفسه
  others: [لمن يتسرع في الزواج دون مشورة أهله, لمن يرسل غيره في حاجته ثم ينساها, لمن يرفض كل ما يُعرض عليه من خير]
  note: «دزّه» أرسله؛ بعثه ليخطب له فتاة فتزوجها هو.
  source: mughniyya
  page: 265
  status: draft

- id: xu0469
  kind: usage
  prompt: عطش أرنب سلوق
  answer: لمن يتعرض للحرمان بسبب جبنه وضعفه
  others: [لمن يطمع في الكثير فيخسر القليل, لمن يسافر بعيدًا ولا يحمل معه زادًا, لمن يعيش وسط الخير ولا يشكر عليه]
  note: «سلوق» منطقة قرب بنغازي تكثر فيها الآبار وترِدها الإبل جماعات، فلا تجد الأرانب المقيمة فيها فرصة لتروي عطشها.
  source: mughniyya
  page: 367
  status: draft

- id: xu0470
  kind: usage
  prompt: الديك تربيه من العام للعام ما يعشيش ليله
  answer: للشيء الذي تفوق تكاليفه ما يُرجى منه من فائدة
  others: [للشيء الذي يزداد نفعه وقيمته عند صاحبه كلما طال عمره, للشيء الذي لا يُعرف قدره إلا بعد ضياعه, للشيء الذي يكثر عند الناس فيرخص ثمنه]
  note: تربي الديك عامًا كاملًا ثم لا يكفي لعشاء ليلة واحدة.
  source: mughniyya
  page: 271
  status: draft

- id: xu0471
  kind: usage
  prompt: إلي فيه قلبه ما يموت سمين
  answer: للرحيم الذي يحمل هموم نفسه وهموم الناس
  others: [للبخيل الذي يحرم نفسه من الطعام, للمريض الذي نصحه الطبيب بالحمية, للكسول الذي لا يتحرك من مكانه فيزداد وزنه يومًا بعد يوم]
  note: من كان له قلب يحس بآلامه وآلام غيره انصرف عن الإكثار من الأكل والشرب، فلا يسمن أبدًا.
  source: mughniyya
  page: 122
  status: draft

- id: xu0472
  kind: usage
  prompt: أنا وعمي الجمل عملنا ميات ريال
  answer: للتافه الذي يتباهى بغيره من ذوي المكانة ليرفع من شأنه
  others: [للشريك الذي يأخذ نصيبًا أكبر من تعبه في العمل, للتاجر الذي يبالغ في ثمن بضاعته الرديئة ويحلف أنها من أجود الأصناف, للقريب الذي يحتمي بأقاربه عند الخصومة]
  note: يُروى أن الذئب (أو الديك) سُئل عن ثمنه في السوق فقرن نفسه بالجمل؛ يقال لمن يلتصق بأصحاب الجاه ليعوّض نقصه.
  source: mughniyya
  page: 158
  status: draft

- id: xu0473
  kind: usage
  prompt: الحمار الحران من سعد ركابه
  answer: لمن يلازمه الحظ السيئ في كل ما يعمل
  others: [لمن يعامل الناس بالقسوة فيعاملونه بمثلها, لمن يشتري الرخيص فيندم على شرائه, لمن يركب رأسه ولا يسمع النصيحة]
  note: «الحرّان» الممتنع عن السير، و«سعد» هنا بمعنى سوء الحظ على سبيل التطيّر والتهكم.
  source: mughniyya
  page: 241
  status: draft

- id: xu0474
  kind: usage
  prompt: ضيف لجواد يضيف
  answer: في أن ضيف الكريم له أن يدعو إلى بيت مضيفه من يشاء
  others: [في أن الضيف لا يطيل البقاء عند الكريم, في أن الكريم يكرم ضيفه ولو كان عدوه, في أن الضيف أسير المضيف حتى يرحل فلا يخرج إلا بإذنه ورضاه]
  note: «لجواد» الأجواد؛ من الأعراف الاجتماعية أن ضيف الكريم يستطيع أن يستضيف غيره في بيته.
  source: mughniyya
  page: 349
  status: draft

- id: xu0475
  kind: usage
  prompt: ما هناك حد يقول لروحه هدني
  answer: في أن أحدًا لا يقصد إيذاء نفسه عمدًا
  others: [في أن الإنسان لا يعرف عيوب نفسه, في أن الإنسان لا يمدح نفسه إلا مغرورًا, في أن أحدًا لا يقدر على العيش وحده]
  note: «لروحه» لنفسه، و«هدّني» اقتلني.
  source: mughniyya
  page: 492
  status: draft

- id: xu0476
  kind: usage
  prompt: إلي عقبه خوه ما ذل
  answer: لمن له أخ ينصره ويقف إلى جانبه في الشدائد
  others: [لمن يتبع أخاه الأكبر في كل ما يفعل ولا يخالفه في شيء, لمن يرث مالًا من أخيه فيغتني بعد فقر, لمن يتنازل عن حقه لأخيه حفظًا للود]
  note: «عقبه» جاء بعده ومشى وراءه، و«خوه» أخوه؛ من كان وراءه أخ يسنده لا يذل.
  source: mughniyya
  page: 116
  status: draft

- id: xu0477
  kind: usage
  prompt: نجى الغارق وخاف لا يغرق
  answer: لمن لم يعتد فعل الخير فإذا هم به تردد وخاف
  others: [لمن ينجو من خطر ثم يعود إليه بإرادته, لمن يخاف ركوب البحر ولو كان سباحًا ماهرًا, لمن ينقذ غيره ثم ينتظر منه الجزاء]
  note: «لا يغرق» أن يغرق؛ أراد إنقاذ الغريق فخشي على نفسه الغرق.
  source: mughniyya
  page: 528
  status: draft

- id: xu0478
  kind: usage
  prompt: إلي ينشد ما يذهبش
  answer: في الحث على سؤال أهل الخبرة والانتفاع بآرائهم
  others: [في الحث على حفظ الشعر وإنشاده في المجالس, في الحث على البقاء في البلد وعدم السفر, في ذم من يكثر الأسئلة فيما لا يعنيه من شؤون الناس وأحوالهم]
  note: «ينشد» يسأل؛ من يسأل لا يضيع طريقه.
  source: mughniyya
  page: 152
  status: draft

- id: xu0479
  kind: usage
  prompt: زابي ولا تكون حسود
  answer: في أن تقليد أهل الخبرة خير من حسدهم
  others: [في أن الحسود لا يسود ولا يرتاح, في أن القناعة كنز لا يفنى مهما قل ما في اليد, في أن الطموح الزائد يجلب الهم]
  note: «زابي» قلّد؛ حاكِ أصحاب الفضل فيما يصنعون، فهذا أنفع لك من الحقد عليهم.
  source: mughniyya
  page: 295
  status: draft

- id: xu0480
  kind: usage
  prompt: رزق خوه عند خوه
  answer: في الدعوة إلى التكافل والتضامن بين الإخوة
  others: [في أن الرزق لا يأتي إلا بالتعب والسعي, في أن الأخ الأكبر يرث من أبيه أكثر مما يرثه إخوته, في التحذير من مشاركة الأقارب في التجارة]
  note: «خوه» أخوه؛ ما يملكه الأخ مباح لأخيه.
  source: mughniyya
  page: 289
  status: draft

- id: xu0481
  kind: usage
  prompt: على هامان يا فرعون؟!
  answer: للمحتال الذي يحاول خداع من هو مثله في المكر
  others: [للضعيف الذي يتحدى من هو أقوى منه, للتابع الذي يخون سيده في الشدة وينضم إلى أعدائه, للحاكم الذي يظلم وزراءه وأعوانه]
  note: هامان وزير فرعون والعالم بجميع أسراره، فكيف يخدعه؟
  source: mughniyya
  page: 373
  status: draft

- id: xu0482
  kind: usage
  prompt: كل دار وكراها
  answer: في أن قيمة الشيء تتحدد بجودته وما يقدمه من منافع
  others: [في أن لكل بيت أسرارًا لا يعرفها الغرباء, في أن الجار مسؤول عن جاره في السراء والضراء وفي الغياب والحضور, في أن الساكن الجديد يدفع أكثر من القديم]
  note: «كراها» بدل إيجارها.
  source: mughniyya
  page: 438
  status: draft

- id: xu0483
  kind: usage
  prompt: إلي خصيمه القاضي لمن يشكي
  answer: في الشكوى من فساد الحكم أو الحاكم
  others: [في الشكوى من كثرة الخصوم والحساد, في الشكوى من بطء العمل في المحاكم, في الشكوى من قلة الأصدقاء الأوفياء]
  note: «خصيمه» تصغير خصم، و«لمن» إلى من؛ إذا كان خصمك هو القاضي فإلى من ترفع شكواك؟
  source: mughniyya
  page: 110
  status: draft

- id: xu0484
  kind: usage
  prompt: إحك لحبيبك ووصيه
  answer: لمن يبوح بسره لصديقه ويطلب منه كتمانه
  others: [لمن يكثر الكلام فلا يسكت عنه أحد, لمن يخفي أسراره حتى عن أقرب الناس, لمن يوصي غيره بما لا يفعله هو]
  note: لا بأس أن تفضي بما في صدرك إلى صديق تثق به، على أن توصيه بحفظه.
  source: mughniyya
  page: 74
  status: draft

- id: xu0485
  kind: usage
  prompt: إلي ما هي فرس بوك ترميك توقعك
  answer: في الدعوة إلى عدم الاعتماد على الآخرين
  others: [في الدعوة إلى إكرام الخيل وحسن رعايتها, في الدعوة إلى طاعة الأب في كل أمر, في الدعوة إلى الحذر من ركوب البحر]
  note: «بوك» أبوك، و«ترميك» تطرحك أرضًا؛ ما ليس ملكك لا تأمن أن يخذلك.
  source: mughniyya
  page: 128
  status: draft

- id: xu0486
  kind: usage
  prompt: قول فيه وقول عليه
  answer: في الدعوة إلى الحكم على الآخرين بموضوعية وإنصاف
  others: [في الدعوة إلى كتمان الأسرار وعدم إفشائها, في ذم من يمدح الناس في وجوههم ويذمهم في غيبتهم, في الدعوة إلى قلة الكلام وكثرة العمل]
  note: اذكر حسناته وسيئاته معًا، فالإنسان ليس شرًّا خالصًا ولا خيرًا خالصًا.
  source: mughniyya
  page: 420
  status: draft

- id: xu0487
  kind: usage
  prompt: كان جيتي عمتنا وكان مشيتي ما همتنا
  answer: للشخص أو الشيء الذي يسهل الاستغناء عنه
  others: [للقريب الذي يزور أهله في الأعياد فقط, للضيف الذي يأتي ويذهب دون أن يستأذن, للصديق الذي لا يُنسى مهما طال غيابه]
  note: «كان» إذا؛ حضورك وغيابك عندنا سواء.
  source: mughniyya
  page: 426
  status: draft

- id: xu0488
  kind: usage
  prompt: ضحك الجمل مره انشق شاربه
  answer: للعبوس الذي لا تنفرج أساريره إلا نادرًا
  others: [للثرثار الذي لا يكف عن المزاح, للحسود الذي يضحك لمصائب الناس, للبخيل الذي يضحك في وجوه الناس ولا يعطيهم شيئًا]
  note: ضحك الجمل مرة في عمره فانشقت شفته؛ ويقال أيضًا لمن يقوم بعمل لم يعتده فيرتبك.
  source: mughniyya
  page: 343
  status: draft

- id: xu0489
  kind: usage
  prompt: الكلمه من غيرك نفاعه
  answer: في ذم مدح المرء لنفسه
  others: [في ذم من يردد كلام غيره, في مدح من يحسن الإصغاء, في ذم من يقاطع المتكلم]
  note: ثناء الآخرين عليك ينفعك، أما مدحك لنفسك فلا يجديك.
  source: mughniyya
  page: 450
  status: draft

- id: xu0490
  kind: usage
  prompt: الدفله دفله والعليق عليق
  answer: في أن لكل شخص طبعًا وخصائص تميزه عن غيره
  others: [في أن النبات الشائك لا يصلح للزينة, في أن الحديقة تحتاج إلى عناية دائمة, في أن الإنسان يتغير بتغير المكان والصحبة التي يعيش بينها]
  note: الدفلى نبات زهره كالورد يُزرع للزينة، والعليق شجر شوكي متسلق؛ ولا يصير أحدهما الآخر.
  source: mughniyya
  page: 265
  status: draft

- id: xu0491
  kind: usage
  prompt: أنا وإنت ومن سرق الفاس؟
  answer: حين تكون التهمة محصورة بين اثنين فقط
  others: [حين يتعاون اثنان على عمل شاق فيقتسمان الأجر بالتساوي, حين يتهم أحد الناس بريئًا بلا دليل, حين يضيع الشيء ولا يعرف أحد مكانه]
  note: لا ثالث بيننا، فالسارق إما أنا وإما أنت.
  source: mughniyya
  page: 158
  status: draft

- id: xu0492
  kind: usage
  prompt: الكثره تخرم الود
  answer: في أن سكن الأقارب والأصدقاء معًا يذهب بالمودة بينهم
  others: [في أن كثرة المال تفسد الأخلاق وتدفع صاحبها إلى البطر والتكبر, في أن كثرة الأولاد تتعب الآباء, في أن الأصدقاء الكثيرين لا يُعتمد عليهم]
  note: الاجتماع الدائم في مكان واحد يحجب مشاعر التعاطف التي كانت قائمة.
  source: mughniyya
  page: 432
  status: draft

- id: xu0493
  kind: usage
  prompt: صحبة كواشه
  answer: لأصدقاء السوء الذين لا يأتي منهم إلا الأذى
  others: [للأصدقاء الذين يجتمعون على الطعام فقط, للأصدقاء الذين يتعاونون في العمل الشاق, للأصدقاء الذين يفترقون عند أول خلاف]
  note: «الكوّاشة» العاملون في الأفران؛ وماذا يجني مصاحبهم غير النار واللهب والدخان؟
  source: mughniyya
  page: 337
  status: draft

- id: xu0494
  kind: usage
  prompt: بو درنه حاسب روحه من العساسه
  answer: للغافل الذي يتطوع لعمل مرهق لا فائدة له منه
  others: [للجبان الذي يخاف الخروج من بيته ليلًا, للحارس الذي ينام في أثناء نوبته فيسرق اللصوص المدينة, للغريب الذي يدّعي أنه من أهل البلد]
  note: «بودرنة» لقب رجل معتوه كان يخرج ليلًا مع الحرّاس (العسّاسة) يجوب مدينة درنة طولًا وعرضًا ليحرسها.
  source: mughniyya
  page: 188
  status: draft

- id: xu0495
  kind: usage
  prompt: الخبره زوي وحسون
  answer: في معرفة المسالك والدروب الصحراوية
  others: [في معرفة أسرار التجارة والأسواق, في معرفة أنساب القبائل وأصولها, في معرفة أوقات المطر والزرع]
  note: «زوي» و«حسون» قبيلتان ليبيتان عُرفتا بالخبرة في طرق الصحراء.
  source: mughniyya
  page: 247
  status: draft

- id: xu0496
  kind: usage
  prompt: يعرف نصف الطب يشق ولكنه ما يخيط
  answer: لمن يدّعي علمًا ناقصًا لا ينفع ما لم يكتمل
  others: [لمن يبالغ في الحذر فلا يُقدم على شيء, لمن يكثر الشكوى من مرض لا يشعر به, لمن يتعلّم الحرفة على كِبَر فيتقنها]
  note: قيل في معالج شعبي أراد مجاراة الأطباء الجدد، فادّعى أنه تعلّم كيف يشق البطن وما زال في الطريق إلى تعلّم خياطته.
  source: juhayman
  page: 272
  volume: ج٩
  status: draft

- id: xu0497
  kind: usage
  prompt: بغا مشي الحمامه وضيّع مشيته
  answer: لمن ترك ما عنده طمعًا في الأفضل فخسر الاثنين
  others: [لمن قلّد غيره فأتقن التقليد حتى تفوّق عليه, لمن تباطأ في عمله حتى فاته وقته, لمن تكبّر على أهله بعد أن اغتنى]
  note: يُروى أن الغراب حاول أن يمشي مشية الحمامة فلم يقدر، ثم نسي مشيته الأولى فصار يمشي مشية عرجاء. «بغا» أي أراد.
  source: juhayman
  page: 43
  volume: ج٢
  status: draft

- id: xu0498
  kind: usage
  prompt: تحسبك صايد وأنت بالفخ مصيود
  answer: لمن أراد أن يوقع غيره فوقع هو
  others: [لمن يصطاد في مكان لا صيد فيه, لمن يفرح بما لم يحصل عليه بعد, لمن يخاف من شيء لا خطر فيه]
  note: تظن أنك الصائد، والحقيقة أنك أنت الذي وقعت في الفخ وصرت صيدًا لغيرك.
  source: juhayman
  page: 90
  volume: ج٢
  status: draft

- id: xu0499
  kind: usage
  prompt: كل عود فيه دخان
  answer: للهادئ الذي لا يظن فيه شر ثم يظهر أذاه عند الاحتكاك
  others: [للبيت الذي لا يخلو من خلاف بين أهله, للعمل الذي لا يخلو من تعب ومشقة, للمسن الذي ما زال فيه بقية قوة]
  note: كما يخرج الدخان من كل عود إذا أوقد، قد يخفي الساكن الهادئ أذى يظهر عند المخالطة.
  source: juhayman
  page: 105
  volume: ج٦
  status: draft

- id: xu0500
  kind: usage
  prompt: فلان يرصع في الشمس
  answer: للمغفل الذي يسلك طريقًا مضحكًا لا يؤدي إلى نتيجة
  others: [لمن يعمل في حر الشمس ساعات طويلة ولا يشكو من التعب, لمن يجلس في الشمس حتى يمرض, لمن يكشف أسراره أمام الناس]
  note: يرصع أي يضع أقراص العجين في الشمس لتنضج خبزًا، وحرارتها لا تكفي لذلك.
  source: juhayman
  page: 193
  volume: ج٥
  status: draft

- id: xu0501
  kind: usage
  prompt: فلان مثل القطو يدفق الحليب
  answer: لمن يؤذي لا لمنفعة ينالها بل حبًّا في الأذى
  others: [لمن يأكل حتى يشبع ثم ينام عن عمله طوال النهار, لمن يسرق ما لا يحتاج إليه, لمن يفسد عمله بالعجلة]
  note: القطو القط، ويدفق أي يريق؛ إذا شرب حتى ارتوى أراق ما بقي من الحليب.
  source: juhayman
  page: 159
  volume: ج٥
  status: draft

- id: xu0502
  kind: usage
  prompt: يرقم على الما
  answer: لمن يعمل عملا عابثا لا بقاء له ولا ثمرة
  others: [لمن يكتب بخط جميل متقن يعجب كل من يقرؤه من الناس, لمن يعد بما لا يقدر عليه, لمن يتقن السباحة]
  note: يرقم أي يكتب بالقلم، والكتابة على الماء تمحى في الحال.
  source: juhayman
  page: 244
  volume: ج٩
  status: draft

- id: xu0503
  kind: usage
  prompt: نط الفار في الطحين
  answer: حين يقع ما كنا نخشاه فعلينا أن نتداركه بعقل
  others: [حين يدخل الطامع في مال غيره ويأخذ منه ما يشتهي, حين يكثر الخير فيعم الجميع, حين يتدخل أحد فيما لا يعنيه]
  note: نط أي قفز، والطحين هو دقيق الحنطة؛ فما دام قد وقع فلنفكر في الخلاص بأقل خسارة.
  source: juhayman
  page: 327
  volume: ج٨
  status: draft

- id: xu0504
  kind: usage
  prompt: ما كلت كفوفه ظهر على كتوفه
  answer: لمن تظهر عليه آثار النعمة والسمنة بسرعة
  others: [لمن يحمل أثقالا تفوق طاقته, لمن يعمل بيديه طوال اليوم ولا يظهر أثر تعبه, لمن ينفق على غيره ويحرم نفسه]
  note: ما يأكله بكفيه يظهر أثره سريعا على كتفيه، بينما يأكل غيره كثيرا ولا يبدو عليه شيء.
  source: juhayman
  page: 123
  volume: ج٧
  status: draft

- id: xu0505
  kind: usage
  prompt: سمن كلبك ياكلك
  answer: لمن يقابل الإحسان بالإساءة ويكفر المعروف
  others: [لمن يسرف في الإنفاق على ما لا ينفعه ولا يحتاج إليه, لمن يربي الحيوانات في بيته, لمن يطعم ضيفه أكثر مما يطيق]
  note: مثل عربي قديم ما زال مستعملا؛ إذا أطعمت الكلب حتى قوي عدا عليك. والمقصود بعض البشر الذين لا يثمر فيهم المعروف.
  source: juhayman
  page: 162
  volume: ج١٠
  status: draft

- id: xu0506
  kind: usage
  prompt: ما توحي لك باذن
  answer: للفوضى والضجيج حتى لا يسمع أحد من بجانبه
  others: [لمن يتجاهل نصيحة أهله كأنه لا يسمع منهم شيئا, للسر الذي يقال همسا بين اثنين, لمن ثقل سمعه من الكبر]
  note: توحي أي تسمع؛ فمن شدة الجلبة واختلاط الأصوات لا تسمع صاحبك وهو يحدثك.
  source: juhayman
  page: 44
  volume: ج٧
  status: draft

- id: xu0507
  kind: usage
  prompt: كل عند راس ثوره
  answer: حين ينشغل كل واحد بأموره فلا يتفرغ لعون غيره
  others: [حين يتمسك كل واحد برأيه ولا يتنازل, حين يفخر كل واحد بما يملك من مال, حين يقتسم الشركاء الربح فيأخذ كل واحد بقدر حصته]
  note: صورة من الحياة الزراعية، كل واحد واقف عند ثوره يشغله عمله عن عمل غيره.
  source: juhayman
  page: 103
  volume: ج٦
  status: draft

- id: xu0508
  kind: usage
  prompt: مثل الهرة تاكل عيالها
  answer: لمن يهدم ما بناه ويفسد إحسانه بإساءته
  others: [لمن يبخل على أهله ويكرم الغرباء, للأم التي تفرط في الخوف على أولادها فتمنعهم من اللعب, لمن يأكل كثيرا ولا يشبع]
  note: ذكر المؤلف أنه رأى قطة تأكل أحد صغارها بعد أن كانت تحرسهم، فكأنها تقول آكل لحمي ولا أدعه لغيري.
  source: juhayman
  page: 29
  volume: ج٨
  status: draft

- id: xu0509
  kind: usage
  prompt: قنع من الشاة باذنها
  answer: لمن كانت له آمال كبيرة فلم يبقَ له منها إلا القليل فرضي به
  others: [لمن يأكل من الذبيحة أطيب ما فيها, لمن يبيع شاته بأقل من ثمنها, لمن يطلب الكثير ولا يقبل القليل]
  note: للرضا بالمقسوم والتنازل عن المطامع الكبيرة إلى جزء صغير منها.
  source: juhayman
  page: 324
  volume: ج٥
  status: draft

- id: xu0510
  kind: usage
  prompt: إن جاد حظك باع لك واشترى
  answer: لمن يكسب كثيرًا بجهد يسير لأن الحظ يواتيه
  others: [لمن يتاجر بأموال غيره دون إذنهم فيخسرها كلها, لمن يشتري الشيء ثم يندم على شرائه, لمن يتكل على غيره في كل أموره]
  note: الحظ لا ضابط له، قد يواتي الخامل ويتخلى عن المجتهد؛ ومع ذلك فالمطلوب العمل وتصيّد الفرص.
  source: juhayman
  page: 379
  volume: ج١
  status: draft

- id: xu0511
  kind: usage
  prompt: يهدم مصر ويبني قصر
  answer: لمن يخرب كثيرا ليعمر قليلا لمصلحته الخاصة
  others: [لمن يهاجر من بلده ليبني بيتا في غيره, لمن ينفق ماله كله على بيت فخم, لمن يبدأ أعمالا كثيرة في وقت واحد ولا يتم أيا منها]
  note: مصر هنا بمعنى المدينة؛ فهو يهدم مدينة ويشتت أهلها من أجل قصر لنفسه.
  source: juhayman
  page: 317
  volume: ج٩
  status: draft

- id: xu0512
  kind: usage
  prompt: إلى جيت بلاد فخذ دلها والا رح وخلها
  answer: لمن عليه أن يساير عادات المكان الذي يعيش فيه
  others: [لمن يسافر كثيرًا ولا يستقر في بلد, لمن يحنّ إلى بلده كلما ابتعد عنها, لمن يجمع من خيرات البلد ما يقدر عليه ثم يرحل عنها]
  note: الدل هنا عادات أهل البلد؛ فإما أن تتخلق بها وإما أن ترحل عنها. ويقابله قول العرب «إذا جئت بلدًا فاحلف بإلهها».
  source: juhayman
  page: 247
  volume: ج١
  status: draft

- id: xu0513
  kind: usage
  prompt: يا غراب سلم لي على السحاب
  answer: لإهداء السلام إلى من يتعذر الوصول إليه
  others: [لمن يرسل رسالته مع رسول غير أمين فلا تصل أبدا, لمن يتمنى المطر في سنة جدب, لمن يبالغ في التحية حتى يُملّ]
  note: الغراب يبلغ السحاب بطيرانه، والإنسان لا يبلغه إلا بأمانيه، فيحمّل الغراب سلامه.
  source: juhayman
  page: 165
  volume: ج٩
  status: draft

- id: xu0514
  kind: usage
  prompt: ما داوى عينه فيداوي عيني
  answer: في أن فاقد الشيء لا يعطيه
  others: [في أن كل إنسان أعلم بدائه, في أن الطبيب لا يعالج أقاربه, في أن العين بالعين والجزاء من جنس العمل]
  note: من عجز عن مداواة نفسه فكيف يشفي غيره؟ ويقابله المثل العربي في الطبيب الذي يداوي الناس وهو مريض.
  source: juhayman
  page: 66
  volume: ج٧
  status: draft

- id: xu0515
  kind: usage
  prompt: شطر ممنوح ولا نحو مسدوح
  answer: لتفضيل القليل الدائم على الكثير المنقطع
  others: [لمن يقسم ماله بين أولاده بالتساوي, لمن يعطي الناس ما لا يملكه, لمن يرفض الهدية لأنها قليلة وينتظر هدية أكبر منها]
  note: الشطر شق من ضرع الدابة يُمنح لك فتنتفع به دائمًا؛ فالقليل المستمر خير من الكثير الذي يُنال مرة واحدة ثم ينقطع.
  source: juhayman
  page: 56
  volume: ج٤
  status: draft

- id: xu0516
  kind: usage
  prompt: دشر الكلب ولا تجدع العصا
  answer: للحذر والاستعداد للشر قبل وقوعه
  others: [للرفق بالحيوان وترك ضربه, لمن يترك عدوه ويعاقب من لا ذنب له, لمن يتخلص من الشيء ثم يحتاج إليه]
  note: دشر أي اطرد، وتجدع أي ترمي؛ أبعد الكلب لكن أبقِ العصا قريبة منك.
  source: juhayman
  page: 87
  volume: ج٣
  status: draft

- id: xu0517
  kind: usage
  prompt: من مشى بالهون مات مغبون
  answer: في أن التباطؤ والكسل يفوّتان على صاحبهما الفرص
  others: [في أن العجلة تورث الندامة, في أن الرفق بالناس يكسب محبتهم, في أن المشي على الأقدام كل يوم يطيل العمر ويقوي البدن]
  note: بالهون أي بالرفق والتمهل الزائد؛ والناس في سباق إلى الرزق والعلم والمجد، والفوز للمبادرين.
  source: juhayman
  page: 242
  volume: ج٨
  status: draft

- id: xu0518
  kind: usage
  prompt: يامرحبا بك والعشا من جرابك
  answer: لمن يرحب بضيفه ليأكل من زاد الضيف نفسه
  others: [للمضيف الكريم الذي يقدم أفضل ما عنده, للضيف الذي يحمل الهدايا إلى مضيفه, لمن يدعو الناس ولا يحضر هو]
  note: الجراب وعاء يضع فيه المسافر زاده؛ والمعروف أن الضيف يُعطى ولا يؤخذ منه.
  source: juhayman
  page: 182
  volume: ج٩
  status: draft

- id: xu0519
  kind: usage
  prompt: عصفور ما يسوى الكيله
  answer: للشيء الذي تكلّف تحصيله أكثر من قيمته
  others: [للشيء الصغير الذي يغني عن الكبير, لمن يبيع الشيء بأقل من ثمنه, لمن يصيد ما لا يؤكل]
  note: الكيلة هي الطلقة النارية، وثمنها أغلى من ثمن العصفور لو بيع.
  source: juhayman
  page: 355
  volume: ج٤
  status: draft

- id: xu0520
  kind: usage
  prompt: فلان يسقي على فرغين
  answer: للمتلون ذي الوجهين الذي لا يثبت على رأي
  others: [لمن يعمل عملين في وقت واحد فيتقنهما, لمن يسقي زرع غيره ويترك زرعه, لمن يكثر الشرب ولا يرتوي]
  note: يلعب على الحبلين، يقابل هذا بوجه وذاك بوجه، وكل يوم له رأي وصديق جديد.
  source: juhayman
  page: 193
  volume: ج٥
  status: draft

- id: xu0521
  kind: usage
  prompt: حمار سدوس في الليل يصدر وفي النهار يدوس
  answer: للعمل المتواصل الذي لا راحة فيه
  others: [لمن يعمل في الخفاء ما لا يعمله في العلن, لمن يسهر الليل وينام النهار, لمن يتنقل بين بلدين ولا يستقر]
  note: سدوس قرية في نجد؛ وحمارها يُخرج الماء من البئر ليلًا ويدرس الزرع نهارًا.
  source: juhayman
  page: 315
  volume: ج٢
  status: draft

- id: xu0522
  kind: usage
  prompt: البعير ما يشوف عوجى رقبته
  answer: لمن لا يرى عيوب نفسه وهي ظاهرة للناس
  others: [لمن يحمل الأثقال ولا يشكو منها أبدًا, لمن لا ينظر إلى عواقب الطريق الذي يسلكه, لمن يتكبر على الناس ويرفع رأسه عليهم]
  note: الجمل لا يرى اعوجاج رقبته مع أنه واضح لكل من ينظر إليه.
  source: juhayman
  page: 41
  volume: ج٢
  status: draft

- id: xu0523
  kind: usage
  prompt: مثل النبوت لا يحيى ولا يموت
  answer: للشيء الذي يبقى طويلا ولا يرجى منه نفع
  others: [للمريض الذي طال مرضه ثم شفي, للعهد القديم الذي لا ينساه أصحابه مهما طال الزمن, للشجرة التي تثمر في كل الفصول]
  note: النبوت نوع من النبات، كئيب المنظر، لا هو حي فترجو نفعه ولا هو ميت فتيأس منه.
  source: juhayman
  page: 23
  volume: ج٨
  status: draft

- id: xu0524
  kind: usage
  prompt: الكحل تفنيه المراود
  answer: للشيء يؤخذ منه قليلا قليلا حتى ينفد
  others: [للزينة تفسد إذا أكثر صاحبها منها, للأداة تبلى من كثرة الاستعمال, للسر ينتشر إذا عرفه أكثر من واحد]
  note: المرود عود صغير يُغمس في الكحل، وبكثرة الأخذ به يفرغ المكحل مهما كان ممتلئا.
  source: juhayman
  page: 29
  volume: ج٦
  status: draft

- id: xu0525
  kind: usage
  prompt: قطو يشرب الحليب والا يكبه
  answer: لمن لا ينتفع بالشيء ولا يدع غيره ينتفع به
  others: [لمن يأكل كثيرا ويشتكي الجوع, لمن يسرق الطعام من الجيران ثم يتظاهر بالبراءة, لمن يفسد ما بين يديه من شدة الفرح]
  note: القطو هو القط الذكر، ويكبه أي يهريقه على الأرض؛ إذا وجد الحليب شربه، وإن لم يحتج إليه أراقه.
  source: juhayman
  page: 258
  volume: ج١٠
  status: draft

- id: xu0526
  kind: usage
  prompt: قدر ولطف
  answer: للحادث يقع وكان يمكن أن يكون أكبر وأشد
  others: [لمن يقدّر الأمور قبل أن يقدم عليها, لمن يلين في معاملة الناس, لمن يتأخر في قضاء حاجاته]
  note: كأن تُكسر يد واحدة بدل اليدين، فيحمد المرء ربه أن المصيبة لم تكن أعظم.
  source: juhayman
  page: 277
  volume: ج٥
  status: draft

- id: xu0527
  kind: usage
  prompt: نامت عليه حيطه
  answer: يقال دعاء على من يكثر النوم ولا يقوم بنصيبه من العمل
  others: [يقال لمن نجا من حادث بأعجوبة بعد أن سقط عليه جدار بيته, يقال لمن يبني بيته على أرض غيره, يقال لمن يسكن بيتا قديما متهالكا]
  note: الحيطة هي الحائط، ونامت عليه أي سقطت عليه وكتمت أنفاسه؛ فإذا طُلب للعمل المشترك قيل إنه نائم.
  source: juhayman
  page: 303
  volume: ج٨
  status: draft

- id: xu0528
  kind: usage
  prompt: سلك واضح ولا شق فاضح
  answer: لتفضيل العيب الصغير على العيب الكبير
  others: [لمن يصلح ما فسد قبل أن يراه الناس, لمن يكشف أسرار غيره ولا يستر عليهم, لمن يلبس الثياب الجديدة في كل مناسبة]
  note: الخيط الظاهر في رقعة الثوب أهون من الشق الذي يكشف العورة؛ وبعض الشر أهون من بعض.
  source: juhayman
  page: 276
  volume: ج٣
  status: draft

- id: xu0529
  kind: usage
  prompt: ما حصله المزمار كله الحمار
  answer: لمن يكسب من جهة ويذهب كسبه كله في جهة أخرى
  others: [لمن يكسب رزقه من الغناء واللهو فلا يبارك الله فيه, لمن يعمل كثيرا ويأخذ أجرة غيره, لمن يحسن صنعة واحدة ويجهل ما سواها]
  note: رجل يكسب عيشه بالزمر ويركب حمارا، فكان كل ما يجنيه من المزمار يذهب في علف الحمار.
  source: juhayman
  page: 55
  volume: ج٧
  status: draft

- id: xu0530
  kind: usage
  prompt: ما كل مرة تسلم الجرة
  answer: في ألا تعتمد على حظ طيب أصابك مرة
  others: [في أن الأواني الفخارية سريعة الكسر, في أن الصبر يأتي بالفرج ولو بعد حين, في أن من أخطأ مرة لا يغفر له]
  note: الجرة إناء من الطين المحروق، فإن سقطت مرة فسلمت فتلك مصادفة، والمرة الثانية قد تنكسر.
  source: juhayman
  page: 131
  volume: ج٧
  status: draft

- id: xu0531
  kind: usage
  prompt: لا تنزل المسيل ولو في المقيل
  answer: في الحذر والابتعاد عن مواطن الخطر وإن بدت آمنة
  others: [في ترك السفر وقت الحر الشديد والنوم في ظل الشجر, في النهي عن النوم في مكان غريب, في اختيار الرفيق قبل الطريق]
  note: المسيل مجرى السيل في الوادي، والمقيل وقت القيلولة في حر الظهيرة؛ فالسيل قد يباغتك ولو في يوم صحو.
  source: juhayman
  page: 201
  volume: ج٦
  status: draft

- id: xu0532
  kind: usage
  prompt: كان سروق وشبع وتاب
  answer: لمن ترك الحرام لأنه استغنى عنه لا تقوى وورعا
  others: [لمن ندم على سرقته بعد أن عوقب عليها فتاب توبة صادقة, لمن أسرف في ماله حتى افتقر ثم تاب, لمن يكثر الأكل حتى يمرض فيمتنع عنه]
  note: لم يترك السرقة لأنه صلح، بل لأنه اغتنى وشبع ولم يعد يحتاج إليها.
  source: juhayman
  page: 10
  volume: ج٦
  status: draft

- id: xu0533
  kind: usage
  prompt: ما راس طق السما
  answer: للمتكبر، فمهما تعاظم فلن يبلغ رأسه السماء
  others: [للطموح الذي لا حد لأحلامه ولا يرضى بما وصل إليه, لمن يرفع صوته في كل مجلس, للطويل الذي يلفت الأنظار]
  note: مهما تعالى الإنسان وتجبر فهو مخلوق من طين وإلى الطين يعود.
  source: juhayman
  page: 71
  volume: ج٧
  status: draft

- id: xu0534
  kind: usage
  prompt: قدح طواف فيه من كل لقمه
  answer: للشيء الذي يجمع أصنافًا متنافرة لا رابط بينها
  others: [لمن يأكل من كل طعام ولا يشبع, لمن يتنقل بين بيوت الجيران كل يوم طلبًا للطعام, لمن يقسم القليل على الكثيرين]
  note: القدح الإناء، والطواف السائل الذي يدور على البيوت؛ فيجتمع في قدحه المالح والحلو والحامض.
  source: juhayman
  page: 277
  volume: ج٥
  status: draft

- id: xu0535
  kind: usage
  prompt: ما همهم إلا أكل العشا واخلاي ما عونه
  answer: لمن يعيش عالة على غيره، لا هم له إلا الطعام
  others: [للضيوف الذين يحسنون شكر مضيفهم, للبخيل الذي يأكل وحده ويخبئ طعامه عن أهل بيته, للعمال الذين يعملون مقابل طعامهم]
  note: لا أمل لهم ولا عمل إلا أكل الوجبات وإفراغ أوانيها حتى لا يبقى لمن بعدهم شيء.
  source: juhayman
  page: 175
  volume: ج٧
  status: draft

- id: xu0536
  kind: usage
  prompt: أمس العصر بني القصر
  answer: لمن يستعجل النتائج قبل أوانها
  others: [لمن يبني بيتًا كبيرًا ثم يعجز عن إتمامه, لمن ينسى فضل غيره عليه بسرعة, لمن يفاخر بما ورثه عن آبائه]
  note: أي إن الأمر لم يمضِ عليه وقت طويل، فلماذا العجلة والإلحاح؟
  source: juhayman
  page: 358
  volume: ج١
  status: draft

- id: xu0537
  kind: usage
  prompt: ما نقص من قراكم نبيه من لحاكم
  answer: يقوله المضيف لضيوفه معتذرا بلطف عن أي تقصير في ضيافتهم
  others: [يقوله الضيف إذا لم يرضه الطعام فطلب المزيد, يقوله الجار إذا استدان من جاره ووعده بالسداد, يقوله الشيخ لقومه إذا طلب منهم العون في الحرب]
  note: القرى طعام الضيف، ونبيه أي نطلبه؛ فالمضيف يرجو أن يتجاوزوا عن التقصير إكراما للحاهم.
  source: juhayman
  page: 171
  volume: ج٧
  status: draft

- id: xu0538
  kind: usage
  prompt: على دربك شل خشبه
  answer: لطلب عون لا يكلف صاحبه وقتًا ولا جهدًا
  others: [لمن يحمل أكثر من طاقته في الطريق, لمن يجمع الحطب ليبيعه في السوق, لمن يسلك طريقًا طويلًا ليتجنب لقاء من لا يحب]
  note: أي ما دمت ذاهبًا في طريقك فاقضِ لي حاجتي، فلن تخسر شيئًا.
  source: juhayman
  page: 386
  volume: ج٤
  status: draft

- id: xu0539
  kind: usage
  prompt: شريكك في البضاعة ما يغشك
  answer: لمن يتصرف معك في أمر مشترك، فلا يضرك إلا ضرّ نفسه
  others: [لمن يشتري البضاعة دون أن يفحصها, لمن يثق بالغريب في تجارته أكثر مما يثق بأقرب الناس إليه, لمن يقسم الربح قبل أن يبيع]
  note: من تجمعك به مصلحة واحدة لا يغشك، لأنه لو فعل لغشّ نفسه أيضًا.
  source: juhayman
  page: 56
  volume: ج٤
  status: draft

- id: xu0540
  kind: usage
  prompt: اللي ما هوب لله يبطل
  answer: للمظاهر الزائفة التي لا تدوم لأنها لم تقم على إخلاص
  others: [لمن يتصدق بمال غيره ويطلب الأجر, لمن يبدأ العمل بحماس ثم يتركه قبل أن يتمه لضعف همته, لمن ينذر نذرًا ثم يعجز عن الوفاء به]
  note: ما هوب أي ليس؛ فالعمل المبني على النفاق والتصنّع ينكشف يومًا ما، ولا يبقى إلا الخالص.
  source: juhayman
  page: 334
  volume: ج١
  status: draft

- id: xu0541
  kind: usage
  prompt: كل عليه من زمانه واكف
  answer: لأن كل إنسان له همومه ومتاعبه في هذه الدنيا
  others: [لأن كل إنسان يحاسب على عمله وحده, لأن الزمان يكشف عيوب الناس مهما خفيت عن أعين الآخرين, لأن كل بيت قديم يحتاج إلى إصلاح]
  note: الواكف هو الثقب في السقف يقطر منه ماء المطر، فلا يخلو أحد من شيء يقطر عليه من همّ زمانه.
  source: juhayman
  page: 105
  volume: ج٦
  status: draft

- id: xu0542
  kind: usage
  prompt: ناولته الكراع وتناول الذراع
  answer: لمن تعطيه قليلا فيطمع فيما هو أكثر منه
  others: [لمن يرد الهدية بأحسن منها ويزيد عليها من عنده, لمن يقتسم الطعام مع جاره بالعدل, لمن يرضى بالقليل ويشكر عليه]
  note: الكراع هو الساق والذراع أفضل منه. ويشبهه المثل العربي القديم في من تعطيه كراعا فيطلب ذراعا.
  source: juhayman
  page: 303
  volume: ج٨
  status: draft

- id: xu0543
  kind: usage
  prompt: الوجع كباس والعافيه نسناس
  answer: في أن المرض يأتي دفعة واحدة والشفاء يأتي قليلا قليلا
  others: [في أن الصحة تاج لا يراه إلا المرضى, في أن الوقاية خير من العلاج, في أن الألم الشديد لا يدوم طويلا]
  note: كباس أي يكبس ويهجم، ونسناس أي يتسلل ببطء؛ والخلاص من الأمر الشديد يحتاج إلى وقت وعلاج.
  source: juhayman
  page: 16
  volume: ج٩
  status: draft

- id: xu0544
  kind: usage
  prompt: ماتت الحماره وانقطعت الزياره
  answer: لمن يصلك من أجل مصلحة فإذا زالت قطعك
  others: [لمن يزور الناس في المصائب ويغيب في الأفراح, لمن خسر مصدر رزقه فهجر أهله وبلده, لمن يمتنع عن الزيارة لبعد المسافة]
  note: الحمارة هنا رمز لأي غرض يربط شخصا بك، فإذا انتهى الغرض انتهت الصلة.
  source: juhayman
  page: 28
  volume: ج٧
  status: draft

- id: xu0545
  kind: usage
  prompt: ودها بأمها وودها بالرجل
  answer: لمن يحتار بين أمرين مرغوبين لكل منهما مزاياه
  others: [لمن يريد أن يرضي الناس جميعا فيخسرهم, لمن يتزوج ثم يترك أهله, لمن يندم على زواج اختاره بنفسه بعد فوات الأوان]
  note: ود أي رغبة. الفتاة التي يُراد تزويجها تحتار بين الزوج الذي تسعى إليه وأمها التي ألفتها وعاشت في حضنها.
  source: juhayman
  page: 26
  volume: ج٩
  status: draft

- id: xu0546
  kind: usage
  prompt: ما جابه الكايد جابه الهين
  answer: في أن اللين والرفق يدركان ما تدركه الشدة
  others: [في أن الرزق يأتي للكسول كما يأتي للمجتهد, في أن الشيء الصعب يفقد قيمته إذا سهل, في أن القوي يأخذ حقه والضعيف يضيع حقه]
  note: الكايد هو الشديد الصعب، والهين هو السهل اللين؛ واللين يحفظ الأعصاب ويمنع الخصومات.
  source: juhayman
  page: 47
  volume: ج٧
  status: draft

- id: xu0547
  kind: usage
  prompt: ثم مدهون وبطن جايع
  answer: لمن يعجبك ظاهره وباطنه خراب
  others: [لمن يأكل كثيرًا ولا يشبع أبدًا, لمن يمدح الطعام وهو لم يذقه, لمن يخفي غناه ويتظاهر بالفقر]
  note: الثم هو الفم، والفم المدهون يوهم بالشبع والنعمة بينما البطن خالٍ.
  source: juhayman
  page: 155
  volume: ج٢
  status: draft

- id: xu0548
  kind: usage
  prompt: جا يبي يكحلها واعماها
  answer: لمن أراد أن ينفع فأفسد وصار عمله ضارًا
  others: [لمن يبالغ في التزين حتى يقبح منظره, لمن يتدخل في ما لا يفهمه فيضحك الناس عليه, لمن يعد بالكثير ولا يفي بشيء]
  note: يبي أي يريد؛ أراد أن يضع الكحل في العين ليجمّلها فأعماها.
  source: juhayman
  page: 179
  volume: ج٢
  status: draft

- id: xu0549
  kind: usage
  prompt: علمته الطوافه وسبقني على البيبان
  answer: لمن تعلّمه طريقة تنتفع بها فيزاحمك ويسبقك إليها
  others: [لمن يعلّم غيره صنعة ثم ينساها هو, لمن يطوف على بيوت الناس كل يوم ولا يجد عندهم شيئًا, لمن يطرق الأبواب في وقت غير مناسب]
  note: الطوافة هنا السؤال واستدرار عطف الناس؛ علّمه إياها فصار يسبقه إلى الأبواب.
  source: juhayman
  page: 397
  volume: ج٤
  status: draft

- id: xu0550
  kind: usage
  prompt: ما في لسانه عظم
  answer: لمن يتكلم بصراحة وحرية عما في نفسه ولا يحتاج من يتكلم عنه
  others: [لمن يكذب بسهولة ولا يتلعثم, لمن يأكل كثيرا ولا يشبع, لمن يغتاب الناس ولا يخاف عاقبة كلامه]
  note: لسانه لين طري يحركه كيف يشاء، فيعبر عن حاجته وشكواه بنفسه.
  source: juhayman
  page: 107
  volume: ج٧
  status: draft

- id: xu0551
  kind: usage
  prompt: المال الشوي يعذب أهله
  answer: للشيء الذي يأخذ منك من الجهد أكثر مما يعطيك
  others: [للمال الحرام الذي لا يبارك فيه, للبخيل الذي يحرم أهله وهو غني, للديون الصغيرة التي تتراكم على صاحبها حتى تثقله]
  note: الشوي هو القليل؛ فتكاليف المال القليل كتكاليف الكثير، والمنفعة يسيرة.
  source: juhayman
  page: 141
  volume: ج٧
  status: draft

- id: xu0552
  kind: usage
  prompt: كلما عدلت جنب يميل الثاني
  answer: لمشاكل الحياة التي لا تنتهي، كلما أصلحت جانبا جاءك آخر
  others: [لمن يحاول إرضاء طرفين متخاصمين فيغضبهما معا, للحمل الثقيل الذي لا يستقيم على الدابة, لمن يتردد بين رأيين فلا يستقر على واحد]
  note: الدنيا لا تصفو، فما إن تنتهي من مشكلة في جانب حتى تنفتح عليك مشكلة في الجانب الآخر.
  source: juhayman
  page: 120
  volume: ج٦
  status: draft

- id: xu0553
  kind: usage
  prompt: يغصون بالما ويبلعون البعارين
  answer: لمن يتظاهرون بالعفاف فإذا سنحت الفرصة أخذوا كل شيء
  others: [لمن يأكلون كثيرا ويشكون قلة الطعام, لمن يتكلفون في الأكل أمام الضيوف, لمن يعجزون عن الصغير ويقدرون على الكبير]
  note: البعارين جمع بعير. يشبهه المثل العربي فيمن يأكل الفيل ويغص بالبقة.
  source: juhayman
  page: 280
  volume: ج٩
  status: draft

- id: xu0554
  kind: usage
  prompt: سيف ابن خنيفس شراه بريال وخشبه بريال وباعه بريال
  answer: للجاهل الذي يظن أنه رابح وهو خاسر
  others: [للتاجر الماهر الذي لا يخسر في بيع ولا شراء, لمن يبيع سلاحه وقت الحاجة إليه, لمن يشتري ما لا يحتاج إليه]
  note: اشترى سيفًا بريال وصنع له غمدًا بريال ثم باعه بريال، وظن أنه باعه برأس ماله.
  source: juhayman
  page: 289
  volume: ج٣
  status: draft

- id: xu0555
  kind: usage
  prompt: نار في عفار
  answer: للشيء الذي يسرع فيه الخراب إذا بدأ ويصعب تداركه
  others: [للغضب الذي يهدأ بسرعة, للخبر السار الذي ينتشر بين الناس فيفرحون به جميعا, للكرم الذي يعم القريب والبعيد]
  note: العفار نوع من الشجر الصحراوي سريع الاشتعال.
  source: juhayman
  page: 283
  volume: ج٨
  status: draft

- id: xu0556
  kind: usage
  prompt: سق نلحقهم سق لحقونا
  answer: لمن لا يرتاح أبدًا، فهو في هم متواصل في كل حال
  others: [لمن يتبع الناس في كل ما يفعلون, لمن يهرب من عدوه ثم يرجع إليه, لمن يسبق غيره إلى الخير ثم ينتظرهم حتى يلحقوا به]
  note: إن كان في المقدمة أجهد نفسه لئلا يُسبق، وإن كان في المؤخرة أجهدها ليلحق.
  source: juhayman
  page: 266
  volume: ج٣
  status: draft

- id: xu0557
  kind: usage
  prompt: نفس وضرس
  answer: للشيء الذي فيه خسارة على كل حال، عاش أو مات
  others: [للأكول الذي لا يشبع, للمريض الذي يشكو من ألم أسنانه ولا يجد له دواء, للبخيل الذي يحرم نفسه الطعام]
  note: يقال في الحيوانات المقتناة للتجارة؛ إن عاشت كلفتك أكلها وشربها، وإن ماتت ذهبت قيمتها.
  source: juhayman
  page: 335
  volume: ج٨
  status: draft

- id: xu0558
  kind: usage
  prompt: نفسه على راس خشمه
  answer: لمن يغضب ويثور لأدنى سبب
  others: [لمن يكثر النوم ولا يبالي بشيء, لمن يتدخل في كل شيء, لمن يشم الأخبار قبل غيره]
  note: الخشم هو الأنف، فكأن غضبه حاضر على طرف أنفه.
  source: juhayman
  page: 335
  volume: ج٨
  status: draft

- id: xu0559
  kind: usage
  prompt: ما هان مدخاله هان مخراجه
  answer: لمن لا يتعب في تحصيل شيء فلا يعرف قيمته ويبدده
  others: [للتاجر الذي يبيع بقدر ما يشتري, للبيت الواسع الذي يسهل على الناس دخوله والخروج منه, لمن يأخذ من الناس ويعطيهم بالسوية]
  note: ما جاء بلا جهد كالميراث يسهل تبذيره، لأن صاحبه لم يعرف مشقة جمعه.
  source: juhayman
  page: 174
  volume: ج٧
  status: draft

- id: xu0560
  kind: usage
  prompt: قطع الخشوم ولا قطع الرسوم
  answer: لتعلّق الإنسان بالمنافع المادية التي اعتادها
  others: [لمن يحافظ على العادات القديمة ولو كانت ضارة, لمن يتكبر على الناس ويرفع أنفه عليهم في كل مجلس, لمن يدفع الضرائب وهو كاره]
  note: الخشوم الأنوف، والرسوم المال الذي اعتاد المرء أخذه؛ فإذا انقطع اضطرب أمره.
  source: juhayman
  page: 301
  volume: ج٥
  status: draft

- id: xu0561
  kind: usage
  prompt: حرك أطرافك يشبع وسطك
  answer: للحث على السعي في طلب الرزق وعدم انتظار الحظ
  others: [لمن يأكل كثيرًا ولا يتحرك, لمن يتعب نفسه في عمل شاق لا يعود عليه بأي فائدة, لمن يعتمد على أقاربه في معيشته]
  note: الأطراف هي اليدان والرجلان؛ فإذا عملت بها شبع بطنك.
  source: juhayman
  page: 267
  volume: ج٢
  status: draft

- id: xu0562
  kind: usage
  prompt: غرب شن وفيه شقوق
  answer: لمن جمع عيوبًا كثيرة فتركه أنفع من إصلاحه
  others: [لمن يكثر الشكوى من الفقر, لمن يملك مالًا كثيرًا ولا ينتفع به, لمن يصلح ما أفسده غيره]
  note: الغرب الدلو الكبيرة، والشن الجلد البالي اليابس؛ إذا سددت فيه خرقًا انفتحت خروق أخرى.
  source: juhayman
  page: 19
  volume: ج٥
  status: draft

- id: xu0563
  kind: usage
  prompt: ثواب ناقة الحج ذبحها
  answer: لمن يجازي المحسن إليه بعكس ما يستحق
  others: [لمن يعمل الخير ويرجو ثوابه في الآخرة, لمن يكرم ضيفه بأغلى ما يملك, لمن يترك ماله ويسافر بعيدًا]
  note: الناقة التي حملتك إلى الحج وأعادتك إلى أهلك جزاؤها أن تُكرم، لا أن تُذبح.
  source: juhayman
  page: 155
  volume: ج٢
  status: draft

- id: xu0564
  kind: usage
  prompt: دار بدار وجيران بجيران
  answer: لمن فقد داره وجيرانه فيعزّي نفسه بأن لكل شيء عوضًا
  others: [لمن يكثر التنقل من بيت إلى بيت, لمن يحسن إلى جيرانه ليحسنوا إليه, لمن يبيع داره القديمة ليشتري دارًا أكبر منها في حي آخر]
  note: يقوله من نُكب في داره أو جيرانه فاستبدل بهم غيرهم.
  source: juhayman
  page: 73
  volume: ج٣
  status: draft

- id: xu0565
  kind: usage
  prompt: فلان دوامة منحاة
  answer: لمن لا يستقر في مكان، فهو دائم التنقل
  others: [لمن يدور حول الموضوع ولا يدخل في صلبه أبدًا, لمن يعمل كثيرًا ولا ينال إلا القليل, لمن يتغير رأيه في كل ساعة]
  note: الدوامة لعبة خشبية يديرها الأطفال بخيط، والمنحاة طريق السواني المنحدر عند البئر؛ فلا تستقر فيه الدوامة لأن الأرض غير مستوية.
  source: juhayman
  page: 102
  volume: ج٥
  status: draft

- id: xu0566
  kind: usage
  prompt: مر على عدوك مكتسي ولا تمر عليه شبعان
  answer: في الحرص على المظهر الحسن أمام الأعداء
  others: [في الحذر من قبول طعام العدو مهما بدا ودودا, في التواضع وترك التفاخر أمام الناس, في إكرام العدو حتى يصير صديقا]
  note: ما في بطنك لا يراه العدو، أما ثيابك فيراها فتغيظه، والظهور بالنعمة دون تكبر من شكرها.
  source: juhayman
  page: 51
  volume: ج٨
  status: draft

- id: xu0567
  kind: usage
  prompt: أقول تيس ويقول احلبه
  answer: لمن يتجاهل الحقيقة الواضحة ويطلب المستحيل
  others: [لمن يبيع الشيء بأقل من ثمنه الحقيقي, لمن يكثر الكلام ولا يفعل شيئًا مما يقول, لمن يعمل عملًا كثيرًا ولا يأخذ عليه أجرًا]
  note: التيس ذكر لا حليب فيه، ومع ذلك يصرّ المخاطَب على حلبه؛ فيقال لمن تدلّه على الصواب فيعدل إلى عكسه.
  source: juhayman
  page: 220
  volume: ج١
  status: draft

- id: xu0568
  kind: usage
  prompt: مثل السمكة اللي حاسل عنها الما
  answer: لمن وقع في شدة عظيمة وانسدت أمامه المسالك
  others: [لمن خرج من بلده فلم يطب له عيش, لمن يكثر الحركة والتنقل ولا يستقر في مكان واحد, لمن يسكت حين يجب أن يتكلم]
  note: حاسل أي حاسر؛ والسمك لا يعيش إلا في الماء، فإذا انحسر عنه هلك.
  source: juhayman
  page: 309
  volume: ج١٠
  status: draft

- id: xu0569
  kind: usage
  prompt: بصيص العين ولا عماها
  answer: لتفاوت الشر، وأن القليل خير من لا شيء
  others: [لمن يرى الأمور على غير حقيقتها, لمن يتجاهل ما يراه بعينه خوفًا من الناس, لمن يطلب الكمال في كل شيء]
  note: النظر الضعيف خير من فقد البصر كله؛ فبعض الشر أهون من بعض.
  source: juhayman
  page: 28
  volume: ج٢
  status: draft

- id: xu0570
  kind: meaning
  prompt: فلان كزلكو وطربوشو من أيام الطوفان
  answer: أغراضه قديمة جداً
  others: [غني ورث عن أجداده, نظره ضعيف من زمان, أنيق يحافظ على هندامه]
  note: الكزلك هو النظّارات.
  source: asadi
  line: 109780
  halab: w1080
  status: draft

- id: xu0571
  kind: meaning
  prompt: فلان بيرمي النار وبيصيح، حريق!
  answer: يفتعل المشكلة ثم يشكو منها
  others: [يطفئ الخلاف بين الناس, يخاف من أتفه الأمور, ينبّه الناس إلى الخطر]
  source: asadi
  line: 100141
  halab: w1084
  status: draft

- id: xu0572
  kind: meaning
  prompt: قاعد على نار وعم يستنّاه
  answer: ينتظره بقلق شديد
  others: [يتدفّأ وهو ينتظره, غضبان منه كثيراً, يطبخ له الطعام]
  source: asadi
  line: 135138
  halab: w1099
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: xu0573
  kind: meaning
  prompt: فتح دكانو وللمسا ما حدا قال لو، بكام ولا بكيف
  answer: لم يأته أي زبون
  others: [باع كل بضاعته, لم يسلّم عليه أحد, أسعاره ثابتة لا تتغيّر]
  source: asadi
  line: 146660
  halab: w1098
  flag: meaning not glossed in book at this line; standard sense supplied
  status: draft

- id: xw0001
  kind: origin
  prompt: بْغْرير
  hint: رغيف مغربي أحد وجهيه مليء بالثقوب كأقراص الشهد
  answer: الأمازيغية
  others: [الفرنسية, الإسبانية, التركية]
  note: من الأمازيغية «أبغرير»، ويرد الاسم في مثل مغربي مشهور.
  source: chafik
  page: 67
  status: draft

- id: xw0002
  kind: origin
  prompt: زْگل
  hint: أخطأ الهدف ولم يصب
  answer: الأمازيغية
  others: [الإيطالية, الفارسية, اليونانية]
  note: من الفعل الأمازيغي «ئزگل»، ومنه «مزگال» لمن عادته إخطاء الهدف.
  source: chafik
  page: 114
  status: draft

- id: xw0003
  kind: origin
  prompt: الزّيزون
  hint: الأخرس الأبكم
  answer: الأمازيغية
  others: [اللاتينية, الإيطالية, الفارسية]
  note: من الأمازيغية «أزيزون»، ومن فعلها «ئزيزن» أي خرس وسكت.
  source: chafik
  page: 119
  status: draft

- id: xw0004
  kind: origin
  prompt: دْروك
  hint: الآن، حالًا
  answer: الأمازيغية
  others: [الفارسية, اليونانية, الفرنسية]
  note: من الأمازيغية «ضروغ» بمعنى عمّا قريب، بعد حين.
  source: chafik
  page: 103
  status: draft

- id: xw0005
  kind: origin
  prompt: الزّْرورة
  hint: الهدية تُعطى للنفساء ووليدها
  answer: الأمازيغية
  others: [الفرنسية, الإسبانية, التركية]
  note: من الأمازيغية «تازروروت».
  source: chafik
  page: 112
  status: draft

- id: xw0006
  kind: origin
