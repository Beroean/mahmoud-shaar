- id: xw0433
  kind: custom
  prompt: كان الباعة المتجولون في بغداد ينادون «بيض الحمام يا بيدرايه». ماذا كانوا يبيعون؟
  answer: التمر الزهدي
  others: [الجوز, اللبلبي, العنب الأسود]
  note: لكل فاكهة في أزقة بغداد نداء خاص؛ فبائع الجوز مثلًا ينادي «كاغداني يا جوز».
  source: hijiyya
