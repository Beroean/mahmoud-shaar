  others: [من مصنع للثلج على ضفة بردى, من سفن تحمله من بلاد الأناضول, من آبار عميقة باردة في الغوطة]
  note: كان أهل التل ومنين وبلاد الجرد يكبسون الثلج في الشتاء ويغطونه في محلات خاصة، ثم يبيعونه صيفًا بثمن وافر.
