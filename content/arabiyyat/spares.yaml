- id: xw0239
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الشمسياتي»؟
  answer: يصلح المظلّات العتيقة إذا انكسرت أو تخرّقت
  others: [يصنع النوافذ الملوّنة التي تُسمّى الشمسيات, يرصد الشمس ليعرف مواقيت الصلاة للمؤذّنين, يصنع المراوح من الريش لأيام الحرّ]
  note: كان يضع للشمسية عصًا إذا كُسرت، أو قماشًا إذا تخرّقت، ويصلح أسياخها إذا اختلّت.
  source: qasimi
  page: 259
  volume: ج٢
  status: draft

- id: xw0240
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يفعل «العقاربي»؟
  answer: يجمع العقارب بعد كسر إبرها ويلعب بها
  others: [يداوي لدغ العقارب بالرقى والأعشاب, يصنع ترياقًا من العقارب للعطّارين, ينظّف البيوت من العقارب بأجرة]
  note: كان يأخذها من المقابر وغيرها ويضعها في جيبه أو عمامته ويلعب بها أمام الأولاد والنساء ليجمع قروشًا قليلة.
  source: qasimi
  page: 315
  volume: ج٢
  status: draft

- id: xw0241
  kind: custom
  prompt: ماذا كان بائع المخلّل القادم من الصالحية يقدّم مع المخلّل ليغمس المشتري فيه؟
  answer: مسحوق الخردل المذاب بالماء
  others: [دبس الرمّان الحامض, زيت الزيتون والزعتر, الخلّ والفلفل الحار]
  note: كان يحمل على دابته علبتين كبيرتين من «المخلّل الصالحاني» ويدور في أسواق دمشق، ويشرب المشتري من مرقته أيضًا.
  source: qasimi
  page: 424
  volume: ج٢
  status: draft

- id: xw0242
  kind: custom
  prompt: في دمشق قديمًا، ما الذي كان يفعله الإسكافي؟
  answer: يخصف النعال القديمة ويرقّعها
  others: [يصبغ الجلود ويلمّعها بالشمع, يصنع قوالب الأحذية من الخشب, يبيع الجوارب الصوفية في السوق]
  note: كان الإسكافي يجلس غالبًا على الأرض ويصلح النعال البالية، ويحكي المؤلف أن أحدهم مات فوُجد في تركته كيس فيه ذهب كثير.
  source: qasimi
  page: 38
  volume: ج١
  status: draft

- id: xw0243
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الحلّاج»؟
  answer: يُخرج البزر من القطن بآلة خاصة
  others: [يغزل القطن خيوطًا على المغزل, يبيّض القطن بالكلس والماء, يصبغ القطن بالنيل والزعفران]
  note: آلته تسمى «الدولاب» عند الشاميين و«المحلج» عند أهل القرى، يحركها برجله فيخرج البزر من جهة والقطن من جهة.
  source: qasimi
  page: 102
  volume: ج١
  status: draft

- id: xw0244
  kind: custom
  prompt: ما «الهِباب» الذي كان «الهبّاب» يجمعه ويبيعه في دمشق؟
  answer: ما يلتصق بجدران المداخن من حرق الخشب
  others: [الغبار الناعم الذي يتطاير في المطاحن, قشر الحبوب الذي تحمله الريح عند التذرية, الرماد الأبيض الذي يبقى في الأفران]
  note: كان يدخل في الصباغ، لكنه نادر الاستعمال لأنه لا يعطي لونًا ثابتًا ويقسّي الخيط وتفوح منه رائحة كريهة.
  source: qasimi
  page: 492
  volume: ج٢
  status: draft

- id: xw0245
  kind: custom
  prompt: لماذا كانت النواعير التي تدور على الماء قليلة جدًا في دمشق؟
  answer: لأن أصل ماء دمشق أعلى من البلدة فلا يحتاج إلى رفع
  others: [لقلّة الخشب الصالح لصنعها في الغوطة, لأن الحكومة منعت إقامتها على بردى, لأن صوتها كان يزعج سكان البيوت]
  note: كان «النواعيري» يصنع نواعير تدور على ماء جارٍ وأخرى تديرها دابة على بئر كبير.
  source: qasimi
  page: 489
  volume: ج٢
  status: draft

- id: xw0246
  kind: custom
  prompt: ماذا كان «الخِرَقي» يصنع بالخِرق التي يلتقطها من المزابل بعد غسلها؟
  answer: يخيطها أكياسًا يبيعها للعطّارين
  others: [يبيعها لمعامل الورق في بيروت, يفتلها حبالًا لربط الأحمال, يحرقها وقودًا لأفران الخبز]
  note: كان العطّارون يصرّون فيها الأرز والسكر والملح، وما لم يصلح للخياطة باعه لصانعي الأحذية فجعلوه حشوًا.
  source: qasimi
  page: 230
  volume: ج٢
  status: draft

- id: xw0247
  kind: custom
  prompt: في دمشق قديمًا، ما الذي كان يصنعه «السكّري»؟
  answer: الملبّس والراحة والمربّيات من السكر
  others: [قوالب السكر الكبيرة من القصب, الشراب المحلّى الذي يُباع في الأسواق, الشمع الأبيض من عسل النحل]
  note: كان يعقد السكر ويصنع منه أشكال الورد والزهر، ويربّي المشمش المحشو بالفستق، وغالب عمله بالأجرة لكبار العطّارين في سوق البزورية.
  source: qasimi
  page: 184
  volume: ج١
  status: draft

- id: xw0248
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الحزّام»؟
  answer: يشدّ الأحمال والصناديق بالحبال شدًّا محكمًا
  others: [يصنع الأحزمة الجلدية للرجال والجنود, يبيع الزنانير الحريرية في سوق الخياطين, يحزم الحطب في ربطات ويبيعها للأفران]
  note: كان يلف البضائع بالخام ثم يشدها بالحبال بآلة تسمى «إصبعًا»، حتى تسافر إلى أقصى البلاد دون أن يصيبها ضرر.
  source: qasimi
  page: 96
  volume: ج١
  status: draft

- id: xw0249
  kind: custom
  prompt: في أي شهر كان يروج بيع «البرازق» في أسواق دمشق رواجًا زائدًا؟
  answer: رمضان
  others: [شعبان, ذو الحجة, محرّم]
  note: البرازق أقراص من الطحين المعجون بالسكر تُرقّ ويُلبّس وجهها بالسمسم وتُخبز في الفرن، ويدور بها الباعة على صوانٍ في الأسواق.
  source: qasimi
  page: 218
  volume: ج٢
  status: draft

- id: xw0250
  kind: custom
  prompt: كيف كان المشتري يكشف الحنّاء المغشوشة عند الحنّاوي في دمشق؟
  answer: يفركها بين إصبعيه فيظهر الرمل
  others: [يذوقها بلسانه فيجد فيها ملوحة, يضعها في الماء فتطفو على وجهه, يشمّها فلا يجد لها رائحة]
  note: كانت الحنّاء تُغشّ بخلط الرمل فيها، فإن كانت نقية ظهرت نعومتها، وكانت الحنّاء البغدادية التي تخضب بالسواد مرغوبة جدًا.
  source: qasimi
  page: 117
  volume: ج١
  status: draft

- id: xw0251
  kind: custom
  prompt: بأي لون كان «صبّاغ النيل» في دمشق يصبغ الخام؟
  answer: بالأزرق وحده
  others: [بالأسود وحده, بالأحمر وحده, بالأصفر وحده]
  note: كان أهل القرى يرغبون في هذا الخام المصبوغ، وكان لكل لون صبّاغه، فصبّاغ الأسود غير صبّاغ الألوان.
  source: qasimi
  page: 267
  volume: ج٢
  status: draft

- id: xw0252
  kind: custom
  prompt: ما اسم من كان يدور على أصحاب الغنم ليقصّ صوفها بأجرة؟
  answer: الجذّاذ
  others: [الصوّاف, الغنّام, الجلّاد]
  note: الجذّ هو القطع، ولذلك يقال للصوف الجيد «صوف جذّ» أي مجذوذ.
  source: qasimi
  page: 78
  volume: ج١
  status: draft

- id: xw0253
  kind: custom
  prompt: ما الذي جعل حرفة السقّاء في دمشق في حكم الملغاة سنة 1327 هـ؟
  answer: جرّ ماء عين الفيجة إلى البلدة بأنابيب حديد
  others: [حفر آبار عميقة في كل حارة من حارات دمشق, بناء سدّ كبير على نهر بردى عند الربوة, منع البلدية حمل الماء في القِرَب الجلدية]
  note: كان السقّاء ينقل الماء بالقِرَب أيام انقطاع الأنهار، فلما جُرّ ماء الفيجة إلى أحواض في الصالحية ووُزّع على الحارات استغنى الناس عنه.
  source: qasimi
  page: 185
  volume: ج١
  status: draft

- id: xw0254
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يبيع «الحبوباتي»؟
  answer: البقول اليابسة كالحمص والعدس والفول
  others: [حبوب الدواء والأعشاب الطبية, بذور الأزهار والورود للزرع, الخرز الملوّن لنظم المسابح]
  note: كان يبيع معها الصعتر والسماق والسلال والمكانس والمناخل، وأكثر دكاكينه في الشوارع كمحلة السنانية.
  source: qasimi
  page: 91
  volume: ج١
  status: draft

- id: xw0255
  kind: custom
  prompt: ماذا كان يسمّى في دمشق المال الذي يُكرم به أقرباءُ المولود القابلةَ؟
  answer: النقوط
  others: [الصباحية, العيدية, الحُلوان]
  note: كانت القابلة تأخذ أجرة على قدر حال الأهل، وكان النقوط قبل نحو عشر سنين من التأليف يبلغ مئات القروش ثم بطل هذا الرسم.
  source: qasimi
  page: 347
  volume: ج٢
  status: draft

- id: xw0256
  kind: riddle
  prompt: ومدفونة تمشي وفي الأرض نصفها، يدبّ دبيب النار في الزرجون، لها ست أيدٍ عندها ست أرجلٍ، وآذانها ستٌّ وستُّ عيون
  answer: الفدّان والسكّة والحرّاث
  others: [الطاحون والحجر والطحّان, الناعورة والدلاء والبغل, السفينة والمجداف والملّاح]
  note: لغز أورده الكتاب في حرفة الحرّاث، ويفسّر المؤلف الأيدي والأرجل والآذان والعيون بأنها أعضاء الفدّان.
  source: qasimi
  page: 96
  volume: ج١
  status: draft

- id: xw0257
  kind: custom
  prompt: كم كان طول «القصبة» التي يمسح بها المسّاح الأرض في قرى دمشق وبساتينها؟
  answer: سبعة أذرع
  others: [خمسة أذرع, عشرة أذرع, ثلاثة أذرع]
  note: كان لكل قرية اصطلاح في مساحة الأرض بالقصبة، فمنهم من يعتبر الفدان أو «المدى» أو «القيراط» أو «المدّ» عددًا معلومًا من القصبات.
  source: qasimi
  page: 436
  volume: ج٢
  status: draft

- id: xw0258
  kind: custom
  prompt: ما الذي كان يصنعه «البرابيشي» في دمشق؟
  answer: الأنبوب الطويل الذي يُدخَّن به من الأركيلة
  others: [الرأس الفخاري الذي يوضع فيه التنباك, القارورة الزجاجية التي يوضع فيها الماء, الملقط الذي يُرفع به جمر الأركيلة]
  note: البربيش أنبوب يُلف فيه شريط من حديد على قالب ويُكسى بالجلد، ويُجعل في طرفه فم من خشب أو فضة عند الأغنياء.
  source: qasimi
  page: 42
  volume: ج١
  status: draft

- id: xw0259
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يبيع «البوايكي» في مخزنه الكبير؟
  answer: الحبوب كالقمح والذرة والشعير
  others: [التوابل والبهارات المطحونة, الأقمشة القطنية والحريرية, الأواني الفخارية والزجاجية]
  note: مخزنه يُسمّى «البائكة»، وكان يدّخر الحبوب ليبيعها وقت الغلاء بأضعاف ثمنها.
  source: qasimi
  page: 55
  volume: ج١
  status: draft

- id: xw0260
  kind: custom
  prompt: كيف كان «الحجّار» في دمشق يقطع الصخور الكبيرة من الجبل؟
  answer: يملأ ثقبًا في الصخر بالبارود ويشعله
  others: [يشقّه بأوتاد خشبية يبلّها بالماء, يحميه بالنار ثم يصبّ عليه ماء باردًا, ينشره بمنشار حديدي طويل]
  note: كان يحفر بآلة حديد ثقبًا يسمونه «لغمًا» ثم يملؤه بارودًا، فيُسمع له صوت كالرعد وتنقطع قطعة عظيمة.
  source: qasimi
  page: 91
  volume: ج١
  status: draft

- id: xw0261
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «العرضحالجي»؟
  answer: يكتب الشكاوى والعرائض لمن لا يحسن الكتابة
  others: [يعرض البضائع على الزبائن في الأسواق, يقرأ الطالع ويخبر الناس بأحوالهم, ينقل أخبار الحارات إلى الوالي]
  note: كان أكثرهم يتقنون الكتابة العربية والتركية ويجلسون في حوانيت قرب دوائر الحكومة، ومعهم الورق والمحابر والأقلام.
  source: qasimi
  page: 307
  volume: ج٢
  status: draft

- id: xw0262
  kind: custom
  prompt: في دمشق زمن المؤلف، من كان يقوم بالحجامة في الغالب؟
  answer: الحلّاق أو المزيّن
  others: [العطّار أو الحوائجي, الكحّال أو الجرّاح, القابلة أو الداية]
  note: يذكر الكتاب أن الحجام والحلاق والمزين بمعنى واحد، وأن الحجامة صارت نادرة لأن الأطباء منعوا الناس من إخراج الدم.
  source: qasimi
  page: 92
  volume: ج١
  status: draft

- id: xw0263
  kind: riddle
  prompt: وما صفراءُ شاجيةٌ ولكن، تزيّنها النضارة والشباب، مكتّبةٌ وليس لها بنانٌ، منقّبةٌ وليس لها نقاب
  answer: الشبّابة
  others: [الشمعة, السنبلة, الليمونة]
  note: لغز أورده الكتاب في حرفة «المشبّب»، والشبابة هي الناي، أنبوبة من قصب فيها ثقوب ينفخ فيها العازف.
  source: qasimi
  page: 443
  volume: ج٢
  status: draft

- id: xw0264
  kind: custom
  prompt: ما اسم الحرفة الدمشقية التي يحمل صاحبها صندوقًا مزخرفًا فيه ثقوب يتفرّج منها الأولاد على صور ملفوفة؟
  answer: «عجائبك عجاب»
  others: [«خيال الظل», «الفانوس السحري», «الكركوز والعيواظ»]
  note: كانت الصور مرسومة على ورق طويل يلتف على لولبين، فيديره صاحبه، والأجرة لا تزيد على خمس بارات.
  source: qasimi
  page: 302
  volume: ج٢
  status: draft

- id: xw0265
  kind: custom
  prompt: بماذا كان «الحشّا» في دمشق يحشو الوسائد؟
  answer: بقشّ يسمى «قش سِعد» من مرج الغوطة
  others: [بالقطن المندوف الأبيض الناعم, بريش الدجاج والإوز المنقّى, بصوف الغنم المغسول المجفّف]
  note: حشو الوسائد بالقطن كان من صنعة المنجّد، أما الحشّا فحرفته الحشو بالقش.
  source: qasimi
  page: 117
  volume: ج١
  status: draft

- id: xw0266
  kind: custom
  prompt: في أي شيء كان الفاكهاني الدمشقي يرصّ فاكهته على رفوف دكانه؟
  answer: في جامات من البلّور
  others: [في سلال من القصب, في صناديق من الخشب, في أطباق من النحاس]
  note: كان يضع الأصناف السريعة الفساد على أرض الدكان ليعجّل بيعها، ومن رأى دكانه سرّه منظرها واشتهى الشراء.
  source: qasimi
  page: 334
  volume: ج٢
  status: draft

- id: xw0267
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يبيع «الحشّاش»؟
  answer: العلف الأخضر للدواب كالفصّة والبيقة
  others: [الأعشاب الطبية لدكاكين العطّارين, الحطب اليابس لأفران الخبز, القش الناعم لحشو الفرش]
  note: كان يضمن قطعة أرض مزروعة، فيحصد منها كل يوم حمل دابته ويحزمه ويدور به على أصحاب الخيل والحمير.
  source: qasimi
  page: 97
  volume: ج١
  status: draft

- id: xw0268
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الجابي»؟
  answer: يجمع أجور الأوقاف من مستأجريها
  others: [يحصّل ديون التجار من زبائنهم, يجمع أجرة الماء من البيوت, يجمع الصدقات لفقراء الحارة]
  note: كان يجبي مال الوقف ويدفعه إلى ناظره، مثل جابي وقف الحرمين وجابي وقف الجامع الأموي.
  source: qasimi
  page: 75
  volume: ج١
  status: draft

- id: xw0269
  kind: custom
  prompt: ما «المِسْت» الذي كان يصنعه «المسوتي» في دمشق؟
  answer: خفّ من جلد أصفر أو أسود بلا كعب
  others: [سجادة صلاة صغيرة من الصوف, عمامة من الشاش الأبيض الرقيق, حزام عريض من الجلد المطرّز]
  note: يشبّهه الكتاب بصفة البوتين بلا كعب، ويذكر أن لبس المست الأصفر قلّ في زمانه.
  source: qasimi
  page: 443
  volume: ج٢
  status: draft

- id: xw0270
  kind: custom
  prompt: من أين كان يأتي «معدن» الزجاج الذي يصنعه زجّاجو دمشق؟
  answer: من مغارات في جبل عذرا قرب دمشق
  others: [من رمال شاطئ البحر في بيروت, من مقالع الحجر في جبل قاسيون, من حصى نهر بردى في الربوة]
  note: كان يُصهر مع القلي في تنور ثم يُنقل إلى تنور آخر حتى يصير كالعجين، وكان المعمل المشهور في محلة الشاغور.
  source: qasimi
  page: 164
  volume: ج١
  status: draft

- id: xw0271
  kind: custom
  prompt: مَن كان في الغالب يأكل عند «العشّي» في أسواق دمشق؟
  answer: الغريب الذي لا دار له ولا عيال
  others: [التجّار الكبار في استراحة الظهر, طلاب العلم الفقراء في المدارس, عمّال البناء بعد انتهاء العمل]
  note: يذكر الكتاب أن من النادر أن يأكل الدمشقي عند العشّي، وأن الغريب يكون مقرّه في اللوكندة أو الخان.
  source: qasimi
  page: 311
  volume: ج٢
  status: draft

- id: xw0272
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الشعّال»؟
  answer: يوقد قناديل الجوامع وفوانيس الطرق
  others: [يشعل نار الأفران قبل طلوع الفجر, يبيع الشموع وأعواد الكبريت, يوقد تنّور الحمّام بالزبل]
  note: كان يخدم في الجوامع كالجامع الأموي، وأكثرهم يعملون بأجرة في دائرة البلدية يتفقدون القناديل والفوانيس كل صباح.
  source: qasimi
  page: 256
  volume: ج٢
  status: draft

- id: xw0273
  kind: custom
  prompt: إذا كانت الدربكّة من فخار، فمن كان يصنع أصلها في دمشق قبل أن يُركّب عليه الجلد؟
  answer: الشرباتي
  others: [الصناديقي, القباقيبي, العلبي]
  note: إذا كانت الدربكّة من خشب صنع أصلها الصناديقي، ثم يركّب الصاغجي عليها الجلد ويعرضها للشمس حتى يجف.
  source: qasimi
  page: 265
  volume: ج٢
  status: draft

- id: xw0274
  kind: custom
  prompt: في حمّام الرجال بدمشق قديمًا، ما كان عمل «البلّان»؟
  answer: يخدم المستحمّ ويدلكه بالكيس والصابون
  others: [يوقد النار تحت قدور الماء الحار, يحرس ثياب المستحمّين في المدخل, يسقي الزبائن القهوة بعد الاستحمام]
  note: البلّان من خدم الحمام، وكانت في حمام النساء «بلّانة» تدلك النساء وتحمل لهن الماء البارد.
  source: qasimi
  page: 50
  volume: ج١
  status: draft

- id: xw0275
  kind: custom
  prompt: كم كان عدد «المكارية» الذين يوجدون في دمشق كل يوم قبل حدوث القطار؟
  answer: لا يقل عن مئتي مكارٍ
  others: [نحو عشرين مكاريًا, نحو خمسين مكاريًا, نحو ألفي مكارٍ]
  note: المكاري من يؤجّر خيله وبغاله للركوب وحمل البضائع من بلد إلى بلد، وكان يربح من ورائه البوايكية والعلّافة وأصحاب الخانات.
  source: qasimi
  page: 466
  volume: ج٢
  status: draft

- id: xw0276
  kind: custom
  prompt: ما «الطُّنبُر» الذي كان يسوقه «الطنبرجي» في دمشق؟
  answer: عربة على عجلتين تجرّها دابّة
  others: [آلة طرب ذات أوتار وعنق طويل, طبل كبير يُقرع في الأعراس, قارب صغير يُعبر به نهر بردى]
  note: كان أصحاب الأتونات يستعملونه لجلب الحجارة من مقالعها وحمل الكلس لمن يشتريه للبناء.
  source: qasimi
  page: 294
  volume: ج٢
  status: draft

- id: xw0277
  kind: custom
  prompt: في عام 1324 هـ قدمت إلى دمشق جوقات تمثيل فأقبل عليها الناس أفواجًا، فمن أين جاءت؟
  answer: من مصر
  others: [من بيروت, من إسطنبول, من حلب]
  note: سمحت لها الحكومة بإعادة التمثيل القديم، فأخذت تمثّل الروايات العربية المهمة.
  source: qasimi
  page: 471
  volume: ج٢
  status: draft

- id: xw0278
  kind: custom
  prompt: لماذا كسدت في دمشق حرفة «العطري» الذي يستخرج عطر الورد والعنبر؟
  answer: لاستجلاب «اللاوندة» من البلاد الأجنبية
  others: [لقلّة زراعة الورد في بساتين الغوطة, لغلاء النحاس الذي تُصنع منه آلته, لمنع الحكومة تقطير العطور في البيوت]
  note: كان يستخرج العطر بآلة نحاسية تُعرف بـ«الكركة»، وكانت حرفته رائجة جدًا قبل ورود أصناف الطيب الأجنبية.
  source: qasimi
  page: 313
  volume: ج٢
  status: draft

- id: xw0279
  kind: custom
  prompt: ماذا كان أهل الحارة في دمشق يعطون مسحّرهم حين يدور عليهم عند الغروب في رمضان؟
  answer: من فضلات طعامهم
  others: [قرشًا عن كل ليلة, كيلًا من القمح والشعير, شمعة لفانوسه]
  note: لكل محلة مسحّر خاص يوقظ أهلها بطبلة يضرب عليها بجلدة، فإذا أقبل العيد طرق أبوابهم فأعطوه دراهم وحلوى العيد.
  source: qasimi
  page: 439
  volume: ج٢
  status: draft

- id: xw0280
  kind: custom
  prompt: في الشام قديمًا، ما الذي كان يصنعه «السرايري»؟
  answer: مهد الطفل الذي يُهزّ لينام
  others: [أسرّة النوم الكبيرة للعرسان, صناديق العرائس المطعّمة بالصدف, الكراسي الخشبية للمقاهي]
  note: السرير في لغة أهل الشام هو المهد، ويجمعونه على «سراير»، وكان القديم منه من خشب ثم حدث المصنوع من حديد.
  source: qasimi
  page: 181
  volume: ج١
  status: draft

- id: xw0281
