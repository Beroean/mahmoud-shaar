  status: draft

- id: xw0385
  kind: riddle
  prompt: الحي شدّ الميت وشدّه شدّة حليفي، قاله ما نطلقك حتى تعود كيفي
  answer: الدجاجة والبيضة
  others: [البقرة والعجل, الشجرة والثمرة, العنكبوت والذبابة]
  note: ترقد الدجاجة على البيضة ولا تقوم عنها حتى تفقس فرخًا حيًا مثلها.
  source: bensalah_souf
  page: 13
  status: draft

- id: xw0386
  kind: riddle
  prompt: هايمة ومتلايمة، اللّي فيها فاطر وهي صايمة
  answer: الخيمة
  others: [القافلة, السفينة, المائدة]
  note: الخيمة تجمع أهلها تحتها، يأكلون فيها وهي لا تأكل شيئًا.
