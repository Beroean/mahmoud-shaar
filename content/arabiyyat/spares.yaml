  note: البابور هو السفينة البخارية، كقدر من خشب فوق الماء والناس في جوفها يتكلمون.
  source: bensalah_souf
  page: 23
  status: draft

- id: xw0359
  kind: riddle
  prompt: عبد الصمد قال يا قابس، بعيني شفت النوّار فوق العود اليابس
  answer: القرآن فوق اللوح
  others: [الثلج فوق الجبل, الحمامة فوق النخلة, العنب فوق الدالية]
  note: يرى الناظر آيات القرآن مكتوبة على لوح الكتّاب الخشبي، كأنها زهر فوق عود يابس.
  source: bensalah_souf
  page: 19
  status: draft

- id: xw0360
  kind: riddle
  prompt: يبكي بلا عين، يمشي بلا رجلين، ويطير بلا جنحين، لا أنف فيه ولا وذنين
  answer: السحاب
  others: [الريح, الدخان, النهر]
  note: السحاب يمطر كأنه يبكي، ويسير ويعلو في السماء بلا أرجل ولا أجنحة.
  source: bensalah_souf
  page: 25
  status: draft

- id: xw0361
  kind: riddle
  prompt: ناقتنا الحامل جوها الجمال الهايجين، هي صبحت حايل وهم صبحو حاملين
  hint: 'حايل: غير حامل'
  answer: القصعة والآكلون
  others: [الخيمة والضيوف, المسجد والمصلّون, المدرسة والتلاميذ]
  note: تأتي القصعة ممتلئة فيلتفّ حولها الآكلون، فتفرغ هي وتمتلئ بطونهم.
  source: bensalah_souf
  page: 24
  status: draft

- id: xw0362
  kind: riddle
  prompt: عزمة حجر ولّت ذرّ، ما عرفنا لنثى من الذكر
  hint: 'عزمه: مجموعة'
  answer: البيض والكتاكيت
  others: [الحصى والرمل, البذور والزرع, الجوز واللوز]
  note: كومة من البيض كالحجارة تفقس صغارًا، لا يُميَّز ذكرها من أنثاها.
  source: bensalah_souf
  page: 20
  status: draft

- id: xw0363
  kind: riddle
  prompt: خبيني يا عمي في حالي، خو مرات الميت خالي. من الميت؟
  answer: الأب
  others: [العم, الجد, الخال]
  note: إذا كان أخو زوجة الميت خالَك، فزوجته أمك، والميت إذن أبوك.
  source: bensalah_souf
  page: 14
  status: draft

- id: xw0364
  kind: riddle
  prompt: إسمه بالراء ومرار، لا يتعدّى البلاد اللي يدخلها تحمار، ويح اللي يبات عنده
  answer: الرمد
  others: [الرعد, الرمل, الرشح]
  note: الرمد مرض يصيب العين فتحمرّ، ويقضي صاحبه ليله متألمًا.
  source: bensalah_souf
  page: 10
  status: draft

- id: xw0365
  kind: riddle
  prompt: تبدا بالميم والميم في قلبك يا محلاها، إذا ذهبت الميم عمرك ما تنساها
  answer: ماما
  others: [المدرسة, المدينة, المعلّمة]
  note: كلمة «ماما» تبدأ بالميم وفي وسطها ميم، والأم إذا غابت لا تُنسى أبدًا.
  source: bensalah_souf
  page: 12
  status: draft

- id: xw0366
  kind: riddle
  prompt: طويلة بلا ظلّ
  answer: الطريق
  others: [النخلة, العصا, الرمح]
  note: الطريق ممتدّ طويلًا على الأرض، ولا يلقي ظلًّا كالأشياء القائمة.
  source: bensalah_souf
  page: 18
  status: draft

- id: xw0367
  kind: riddle
  prompt: إسمه فيه الحاء، بالك تقول الحوت، خالق من الماء وإذا دخل الماء يموت
  answer: الملح
  others: [الحجر, الحليب, الحبر]
  note: الملح يُستخرج من ماء البحر، فإذا أُلقي في الماء ذاب واختفى.
  source: bensalah_souf
  page: 10
  status: draft

- id: xw0368
  kind: riddle
  prompt: ناقتنا الزرقة، كل بلاد تخطف منها ورقة
  answer: الموت
  others: [الريح, الجراد, الخريف]
  note: الموت لا يستثني بلدًا، يأخذ من كل مكان واحدًا بعد آخر.
  source: bensalah_souf
  page: 24
  status: draft

- id: xw0369
  kind: riddle
  prompt: إسمه بالصّاد، بلاك تقول الصيد، جيّد من الأجواد وين يحاربوه يزيد
  answer: الصابون
  others: [الصبر, الصوف, الصحن]
  note: كلما فُرك الصابون بالماء زادت رغوته بدل أن تنقص.
  source: bensalah_souf
  page: 10
  status: draft

- id: xw0370
  kind: riddle
  prompt: عمّتي حرحارة لابسة عشرين قدوارة
  answer: البصلة
  others: [الجزرة, الرمانة, التفاحة]
  note: البصلة حادّة الطعم والرائحة، وتتكوّن من طبقات كثيرة كأنها أثواب فوق بعضها.
  source: bensalah_souf
  page: 20
  status: draft

- id: xw0371
  kind: riddle
  prompt: صبي بطربيشته، فيه البلاء في كريشته
  answer: الفلفل
  others: [الباذنجان, البصل, الطماطم]
  note: لحبة الفلفل قمع كالطربوش، وفي جوفها حرارة لاذعة.
  source: bensalah_souf
  page: 17
  status: draft

- id: xw0372
  kind: riddle
  prompt: السحاب والضباب يغتيه، والشمس والقمر تحييه
  answer: الظل
  others: [الندى, السراب, الصدى]
  note: الظل يختفي إذا حجبت الغيوم الضوء، ويعود بظهور الشمس أو القمر.
  source: bensalah_souf
  page: 15
  status: draft

- id: xw0373
  kind: riddle
  prompt: أنثى شعر راسها زين والحر يبّس عضاها، وصغيرك اللّي ذبّل العين يسكت إذا عطوه ضناها
  answer: النخلة
  others: [الكرمة, العنزة, التينة]
  note: سعف النخلة كالشعر في رأسها وجذعها يابس، وتمرها يُسكت الطفل الباكي.
  source: bensalah_souf
  page: 9
  status: draft

- id: xw0374
  kind: riddle
  prompt: قدّ الفولة ويملّى الدار
  answer: ضوء الشمعة
  others: [الخاتم, الزرّ, الحصاة]
  note: لهب الشمعة صغير بحجم حبة الفول، لكن نوره يملأ البيت.
  source: bensalah_souf
  page: 22
  status: draft

- id: xw0375
  kind: riddle
  prompt: إمغسّل ومكفّن والنّار شاعلة فيه، أتنين شادينه وثلاثة شاهدين عليه
  answer: السيجارة
  others: [الشمعة, القنديل, البخور]
  note: السيجارة ملفوفة بورق أبيض كالكفن، يمسكها إصبعان وتشهدها بقية الأصابع.
  source: bensalah_souf
  page: 10
  status: draft

- id: xw0376
  kind: riddle
  prompt: صبي رفراف في إيدين طفلة خفيفة، تعطيه ضربة بين لكتاف، إتجي دموعه سخيفة
  answer: الغربال
  others: [الدفّ, الطبل, المروحة]
  note: تهزّ المرأة الغربال وتضربه بيدها فيتساقط منه الدقيق الناعم كالدموع.
  source: bensalah_souf
  page: 17
  status: draft

- id: xw0377
  kind: riddle
  prompt: سورنا اللّي تعلّى بنيانه عدّ النجوم وما تعدّش بيبانه
  answer: الغربال
  others: [الحصير, الصندوق, البرج]
  note: للغربال ثقوب كثيرة كأنها أبواب لا تُحصى.
  source: bensalah_souf
  page: 16
  status: draft

- id: xw0378
  kind: riddle
  prompt: هي غريبة وزينها غريب، كبرت وما ذاقت حليب
  answer: حوّاء
  others: [هاجر, سارة, مريم]
  note: خُلقت حواء كبيرة، فلم ترضع حليبًا كسائر البشر.
  source: bensalah_souf
  page: 25
  status: draft

- id: xw0379
  kind: riddle
  prompt: سلسلة من سلسلة تقطع الجبال بسبسة، فيها خوك وفيها بوك وفيها الناس اللّي يعرفوك
  answer: القطار
  others: [النهر, السفينة, الطائرة]
  note: القطار عربات متصلة كحلقات السلسلة، يقطع المسافات ويركبه الأهل والمعارف.
  source: bensalah_souf
  page: 16
  status: draft

- id: xw0380
  kind: riddle
  prompt: لحمة في غار، لا تنتن ولا تخضار
  answer: اللسان
  others: [النواة, اللوزة, الحلزون]
  note: اللسان قطعة لحم في جوف الفم، تبقى سليمة لا تفسد.
  source: bensalah_souf
  page: 22
  status: draft

- id: xw0381
  kind: riddle
  prompt: طير وما هو طير وبجناحاته، بابا شيخ كبير داس تحته وليداته
  answer: البرنوس
  others: [الخيمة, المظلّة, الشجرة]
  note: البرنوس عباءة واسعة ذات طرفين كالجناحين، يضم بها الشيخ صغاره تحته.
  source: bensalah_souf
  page: 18
  status: draft

- id: xw0382
  kind: riddle
  prompt: أبيض علّام بكّوش يرد السلام
  answer: الرسالة
  others: [الحمامة, الثلج, القطن]
  note: الرسالة ورقة بيضاء لا تنطق، لكنها تحمل السلام وتعيد ردّه.
