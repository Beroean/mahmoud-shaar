  prompt: ترى قراقير الغنم ترجع ___
  answer: كبوش
  others: [جمال, عجول, خيول]
  note: قراقير الغنم صغارها وضعافها، وهي تكبر فتصير كباشًا سمانًا؛ فالصغار يكبرون.
  source: juhayman
  page: 96
  volume: ج٢
  status: draft

- id: xs0119
  kind: saying
  prompt: من دليله الغراب راح ___
  answer: للجيف
  others: [للبحر, للسوق, للجبل]
  note: الغراب يقصد الحيوانات الميتة الملقاة. يقال في القدوة السيئة التي تجر صاحبها إلى مواطن الهوان.
  source: juhayman
  page: 165
  volume: ج٨
  status: draft

- id: xs0120
  kind: saying
  prompt: كل لخدنه يطرب حتى الشبث و___
  answer: العقرب
  others: [الحية, الفار, الجرادة]
  note: الشبث نوع من العناكب القبيحة. كل مخلوق يأنس بمن يشبهه، حتى العنكبوت والعقرب.
  source: juhayman
  page: 115
  volume: ج٦
  status: draft

- id: xs0121
  kind: saying
  prompt: لا عطر بعد ___
  answer: عروس
  others: [سفر, شتا, عشا]
  note: العطر يُدّخر لليلة الزواج لأنها أهم ليلة. يقال للشيء يُدّخر لوقت حاجته، فإذا فات الوقت قلّت قيمته. وهو مثل عربي قديم.
  source: juhayman
  page: 277
  volume: ج١٠
  status: draft

- id: xs0122
  kind: saying
  prompt: اللي ما يربيه أهله يربيه ___
  answer: زمانه
  others: [جيرانه, ربعه, عمه]
  note: من لم يتعلم الأدب في بيته علّمته الأيام، لكن بعد تجارب مريرة.
  source: juhayman
  page: 334
  volume: ج١
  status: draft

- id: xs0123
  kind: saying
  prompt: علمته الرمي و___
  answer: رماني
  others: [شكرني, كافاني, نساني]
  note: لمن يجازي الإحسان بالإساءة، ويوجّه إليك السلاح الذي علّمته استعماله.
  source: juhayman
  page: 397
  volume: ج٤
  status: draft

- id: xs0124
  kind: saying
  prompt: ما جابه الما غدا به ___
  answer: الما
  others: [الريح, الليل, النار]
  note: غدا به أي أخذه. ما يأتي من باب يخرج من الباب نفسه، كعيشة الكفاف التي لا يبقى منها شيء.
  source: juhayman
  page: 47
  volume: ج٧
  status: draft

- id: xs0125
  kind: saying
  prompt: بيت السبع ما يخلى من ___
  answer: العظام
  others: [الشعير, الحطب, الماء]
  note: القادر يحصل على ما يريد بقوة ساعده، كما لا يخلو عرين الأسد من بقايا صيده.
  source: juhayman
  page: 63
  volume: ج٢
  status: draft

- id: xs0126
  kind: saying
  prompt: اشبع يا مجوع ما كل يوم ___
  answer: عيد
  others: [عرس, جمعة, ضيف]
  note: المجوع هو المحروم؛ والمعنى اغتنم الفرصة إذا أتت فقد لا تعود.
  source: juhayman
  page: 154
  volume: ج١
  status: draft

- id: xs0127
  kind: saying
  prompt: سور الصقر تاكله ___
  answer: النسور
  others: [الحمام, الحباري, القطا]
  note: سور الصقر بقية صيده التي يتركها؛ يقال للكبير الجسم الضعيف الهمة الذي يعيش على فضلات غيره.
  source: juhayman
  page: 284
  volume: ج٣
  status: draft

- id: xs0128
  kind: saying
  prompt: الما زهاب ___
  answer: القيض
  others: [الشتا, الربيع, الليل]
  note: الزهاب زاد المسافر في الصحراء، والقيض شدة الحر. في الصيف يكون الماء أهم ما يحمله المسافر.
  source: juhayman
  page: 71
  volume: ج٧
  status: draft

- id: xs0129
  kind: saying
  prompt: زي المراكبية يتخانقوا على ___
  answer: حبل
  others: [مجداف, شراع, دفه]
  note: المراكبية هم الملاحون، ويقال فيمن يتشاجرون على شيء تافه لا يستحق الخصام.
  source: taymur
  page: 201
  status: draft

- id: xs0130
  kind: saying
  prompt: الميه لما تقعد في الزير ___
  answer: تعطن
  others: [تبرد, تصفى, تحلى]
  note: الماء إذا طال بقاؤه في الجرّة فسد، وكذلك الضيف إذا طالت إقامته ثقل على أهل الدار.
  source: taymur
  page: 368
  status: draft

- id: xs0131
  kind: saying
  prompt: اكنس بيتك و___ ما تعرف مين يخشه
  answer: رشه
  others: [افرشه, نوره, زينه]
  note: نظّف دارك ورشّ الماء في ساحتها، فلا تدري من يزورك؛ دعوة إلى الاستعداد الدائم للضيف.
  source: taymur
  page: 31
  status: draft

- id: xs0132
  kind: saying
  prompt: رجع الغزل ___
  answer: صوف
  others: [قطن, خيط, كتان]
  note: انحلّ الغزل فعاد صوفا كما كان؛ يقال للشيء ينتقض بعد إحكامه.
  source: taymur
  page: 174
  status: draft

- id: xs0133
  kind: saying
  prompt: يا فرحة ما تمت خدها ___ وطار
  answer: الغراب
  others: [الحمام, الصقر, العصفور]
  note: يقال حين ينال المرء شيئا ويفرح به ثم يذهب منه سريعا.
  source: taymur
  page: 388
  status: draft

- id: xs0134
  kind: saying
  prompt: زي النجوم قريبين و___
  answer: بعاد
  others: [عالين, منورين, كتار]
  note: يقال لمن تسهل رؤيته ولقاؤه ويبعد عونه ومواساته.
  source: taymur
  page: 202
  status: draft

- id: xs0135
  kind: saying
  prompt: خيرك كان يغطي ___
  answer: عيبك
  others: [فقرك, ضعفك, سرك]
  note: الإحسان يستر العيوب، فإذا انقطع ظهرت للناس.
  source: taymur
  page: 161
  status: draft

- id: xs0136
  kind: saying
  prompt: نايم في الميه وخايف من ___
  answer: المطر
  others: [الحر, الشمس, العطش]
  note: يقال للأحمق يتقي صغائر الأمور وهو غارق في كبيرها.
  source: taymur
  page: 370
  status: draft

- id: xs0137
  kind: saying
  prompt: مين ياكل العليق بعدك يا ___؟
  answer: جمل
  others: [حمار, حصان, تور]
  note: إذا عجز القادر عن الشيء فمن يقوم به بعده؟ ويروى «الفول» بدل العليق.
  source: taymur
  page: 367
  status: draft

- id: xs0138
  kind: saying
  prompt: حديتكم لديد وبيتنا ___
  answer: بعيد
  others: [قريب, جديد, ضيق]
  note: حديثكم لذيذ لكن دارنا بعيدة فلا بد من الانصراف؛ يقال للأمر المحبوب تحول دونه الموانع.
  source: taymur
  page: 141
  status: draft

- id: xs0139
  kind: saying
  prompt: بيضة النهارده أحسن من فرخة ___
  answer: بكره
  others: [بعده, الجيران, السوق]
  note: الفرخة هي الدجاجة. القليل الحاضر خير من الكثير المنتظر.
  source: taymur
  page: 114
  status: draft

- id: xs0140
  kind: saying
  prompt: ركب الخليفه وانفض ___
  answer: المولد
  others: [السوق, الفرح, الديوان]
  note: كان شيخ الطريقة يركب في موكبه في آخر أيام المولد فينصرف الناس؛ يقال للأمر انتهى ومضى.
  source: taymur
  page: 177
  status: draft

- id: xs0141
  kind: saying
  prompt: يا قلب يا كتاكت ياما فيك وانت ___
  answer: ساكت
  others: [فرحان, نايم, ضاحك]
  note: يقال في الصبر والسكوت على ما يؤلم النفس.
  source: taymur
  page: 389
  status: draft

- id: xs0142
  kind: saying
  prompt: زي الصوف دوسه ولا ___
  answer: تبوسه
  others: [تلبسه, تغسله, تبيعه]
  note: الصوف إذا صنته أفسده العث وإذا استعملته سلم؛ يقال لمن لا يصلحه الإكرام.
  source: taymur
  page: 192
  status: draft

- id: xs0143
  kind: saying
  prompt: هي القطه تاكل ___
  answer: اولادها
  others: [عشاها, صاحبها, الفار]
  note: الآباء مهما اشتدوا على أبنائهم لا يبلغون بهم الأذى الكبير.
  source: taymur
  page: 376
  status: draft

- id: xs0144
  kind: saying
  prompt: قد النمله وتعمل ___
  answer: عمله
  others: [شغله, دوشه, حيله]
  note: يقال للضعيف الصغير يتسبب في أمر عظيم.
  source: taymur
  page: 286
  status: draft

- id: xs0145
  kind: saying
  prompt: الرايب ما يرجعش ___
  answer: حليب
  others: [سمن, زبده, جبنه]
  note: الرايب هو اللبن الذي خثر. ما غيّرته الأيام لا يعود كما كان، ويقال أيضا في ذهاب الشباب.
  source: taymur
  page: 172
  status: draft

- id: xs0146
  kind: saying
  prompt: رطل نحاس بيغني ___
  answer: ناس
  others: [بلد, عيله, حاره]
  note: رب قليل يستصغره قوم ويغتني به آخرون ويرضيهم.
  source: taymur
  page: 176
  status: draft

- id: xs0147
  kind: saying
  prompt: وقعت الفاس في ___
  answer: الراس
  others: [الحجر, الشجره, الرجل]
  note: يقال حين يشتبك الخصام ويقع الأذى فلا مفر بعده.
  source: taymur
  page: 379
  status: draft

- id: xs0148
  kind: saying
  prompt: من سمع الرعد بودنه شاف المطر ___
  answer: بعينه
  others: [بإيده, في الغيط, بالليل]
  note: يقال لمن يُنذر بأمر فلا يبالي به ثم لا يلبث أن يقع فيه.
  source: taymur
  page: 356
  status: draft

- id: xs0149
  kind: saying
  prompt: غاب القط العب يا ___
  answer: فار
  others: [عصفور, كتكوت, ديك]
  note: 'يقال إذا خلا المكان لشخص ممن يخشاه، وفي معناه قول طرفة: خلا لك الجو فبيضي واصفري.'
  source: taymur
  page: 260
  status: draft

- id: xs0150
  kind: saying
  prompt: شعيرنا ولا قمح ___
  answer: غيرنا
  others: [جيرانا, السوق, الشام]
  note: ما نملكه وإن كان أقل خير من فضل ما بأيدي الناس؛ قناعةً وفرارا من المنّة.
  source: taymur
  page: 218
  status: draft

- id: xs0151
  kind: saying
  prompt: بعد العيد ما ينفتلش ___
  answer: كحك
  others: [غريبه, فطير, بسكوت]
  note: الكعك يصنع لعيد الفطر، فلا معنى لصنعه بعد العيد؛ يقال للأمر يُطلب بعد فوات وقته.
  source: taymur
  page: 105
  status: draft

- id: xs0152
  kind: saying
  prompt: يقتل القتيل ويمشي في ___
  answer: جنازته
  others: [فرحه, سوقه, طريقه]
  note: يقال لمن بلغ في الدهاء غايته، يؤذي ثم يتظاهر بالحزن.
  source: taymur
  page: 399
  status: draft

- id: xs0153
  kind: saying
  prompt: القط يحب ___
  answer: خناقه
  others: [صاحبه, عشاه, ولاده]
  note: يقال للئيم الذي يحب من يسيء إليه ويؤذيه، ومن أمثال العرب في معناه قول قديم.
  source: taymur
  page: 289
  status: draft

- id: xs0154
  kind: saying
  prompt: جحا أولى بلحم ___
  answer: طوره
  others: [خروفه, حماره, جمله]
  note: الطور هو الثور، وجحا صاحب النوادر المعروف. كل إنسان أولى بما يملك.
  source: taymur
  page: 127
  status: draft

- id: xs0155
  kind: saying
  prompt: الصيت ولا ___
  answer: الغنى
  others: [الجمال, العلم, الصحه]
  note: في تفضيل الشهرة وحسن الذكر بين الناس على المال.
  source: taymur
  page: 225
  status: draft

- id: xs0156
  kind: saying
  prompt: كْنَازَه حَامْيَه وَالْمِيَّتْ ___
  answer: فَارْ
  others: [سْلْطَانْ, قَاضِي, غْنِي]
  note: كنازة هي الجنازة بالجيم المغربية المنطوقة گافًا. جنازة صاخبة والميت فأر! يقال فيمن يضج ويصخب من أجل أمر تافه.
  source: dadoun
  page: 63
  status: draft

- id: xs0157
  kind: saying
  prompt: مُولْ اللّْبْغَلْ ___
  answer: يْعَسْ
  others: [يْرْكَبْ, يْبِيعْ, يْعْلَفْ]
  note: يعس أي يحرس. صاحب البغل هو من يحرسه. من أمثال البدو فيمن لا يبالي بضياع مال غيره، فلا يحفظ الشيء إلا صاحبه.
  source: dadoun
  page: 319
  status: draft

- id: xs0158
  kind: saying
  prompt: اللِّي فِى رَاسْ الْجْمَلْ فِى رَاسْ ___
  answer: الْجَّمَّالَه
  others: [النّْاقَه, الْحْمَارْ, السُّوقْ]
  note: الجمّالة هم رعاة الجمال، يعرفون ما في رأس الجمل. يقال فيمن يريد الاحتيال على غيره فيجده أدهى منه.
  source: dadoun
  page: 263
  status: draft

- id: xs0159
  kind: saying
  prompt: اللِّي حَنْ ___
  answer: يْتْمَحَّنْ
  others: [يْتْهَنَّى, يَرْبَحْ, يْسْلَمْ]
  note: من يحنّ على أحد ويشفق عليه قد يجلب لنفسه منه المتاعب والهموم.
  source: dadoun
  page: 255
  status: draft

- id: xs0160
  kind: saying
  prompt: اللِّي اكْلَ لَمْطَايَبْ، يَصْبَرْ ___
  answer: لَلْمْصَايَبْ
  others: [لَلْجُوعْ, لَلْحْسَابْ, لَلْغْسِيلْ]
  note: من أكل الطيبات فليصبر على المصائب. يقال فيمن تمتع بمال حرام ثم انكشف أمره فنال عقابه.
  source: dadoun
  page: 303
  status: draft

- id: xs0161
  kind: saying
  prompt: خْرَجْ ذَلْ مَنْ ___
  answer: كَلْبْ
  others: [سْبَعْ, ذِيبْ, عَوْدْ]
  note: يقال لمن ارتكب ما جعله مهانًا ذليلًا، فالكلب إذا هُدّد فرّ مطأطئ الرأس خائفًا.
  source: dadoun
  page: 87
  status: draft

- id: xs0162
  kind: saying
  prompt: سَلْ ___، لاَ تْسَلْ الطّْبِيبْ
  answer: لَمْجَرَّبْ
  others: [لَمْرِيضْ, لَعْطَّارْ, لَحْكِيمْ]
  note: اسأل المجرّب ولا تسأل الطبيب. يقال في قيمة التجربة، فالمجرب يعرف ما ينفع من خبرته.
  source: dadoun
  page: 135
  status: draft

- id: xs0163
  kind: saying
  prompt: حْبِيبَكْ يْلاَ بْغِيتْ تْبَقِّيهْ، لاَ تْوَدُّه، لاَ ___
  answer: تَعْطِيهْ
  others: [تْزُورُه, تْعَاتْبُه, تْسَالُه]
  note: إن أردت أن يبقى حبيبك فلا تجعل الودّ قائمًا على العطايا، لأن المحبة المبنية على المنفعة تزول بزوالها.
  source: dadoun
  page: 79
  status: draft

- id: xs0164
  kind: saying
  prompt: اغْنَى مَنْ الاَصْلَعْ ___
  answer: لَلْمَشْطْ
  others: [لَلْعْمَامَه, لَلشّْمْسْ, لَلطَّاقِيَه]
  note: الأصلع لا يحتاج إلى مشط. يقال فيمن ينظر إلى أشياء كثيرة لا تهمه ولا حاجة له بها.
  source: dadoun
  page: 207
  status: draft

- id: xs0165
  kind: saying
  prompt: تَسَحَّرْ مْعَ ___ تَصْبَحْ فَاطَرْ
  answer: الذّْرَارِي
  others: [الْجِيرَانْ, الضّْيَافْ, الْعَسَّاسَه]
  note: الذراري هم الأطفال، ومن تسحّر معهم انشغل بهم حتى يطلع الفجر فيفوته الصوم. يقال فيمن يتفق مع من لا يلتزم بكلمته فينقض الاتفاق.
  source: dadoun
  page: 47
  status: draft

- id: xs0166
  kind: saying
  prompt: مَا تَصْحَبْ، مَا ___
  answer: تْعَادِي
  others: [تْخَاصَمْ, تْسَامَحْ, تْسَالَمْ]
  note: لا تصاحب الشرير ولا تعاده. فصحبته تعديك بشره، وعداوته تجرّ عليك حقده وانتقامه.
  source: dadoun
  page: 319
  status: draft

- id: xs0167
  kind: saying
  prompt: بْقَى يَخْتَارْ حَتَّى ___
  answer: عْثَرْ
  others: [رْبَحْ, شْبَعْ, نْعَسْ]
  note: ظل ينتقي ويتردد حتى وقع على الأسوأ. يقال فيمن يبالغ في الاحتياط والبحث عن الأحسن فينتهي إلى الأقبح.
  source: dadoun
  page: 31
  status: draft

- id: xs0168
  kind: saying
  prompt: 'قَالُّه: السَّمْ بَاشْ تَيْقْتَلْ؟ قَالُّه: ___'
  answer: بَالثّْقَالَه
  others: [بَالْمْرَارَه, بَالْحْلاَوَه, بَالسّْخُونَه]
  note: 'سأله: بمَ يقتل السم؟ فقال: بالثقالة! يقال في ثقيل الظل الذي يزعجك حديثه فتتمنى أن تبتعد عنه.'
  source: dadoun
  page: 223
  status: draft

- id: xs0169
  kind: saying
  prompt: الْفَارْ الْمَنْحُوسْ شَافْ الْجّْبَنْ مَا شَافْ ___
  answer: الْمُشْ
  others: [الْفَخّْ, الْبَابْ, الْكَلْبْ]
  note: المش هو القط. الفأر سيئ الحظ رأى الجبن ولم ير القط. كناية عمن يندفع إلى غنيمة دون حذر فيهلك.
  source: dadoun
  page: 303
  status: draft

- id: xs0170
  kind: saying
  prompt: شْحَالْ مَنْ كَلْمَه سَلْبَتْ ___
  answer: نِعْمَه
