- id: xw0283
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «السكّاب»؟
  answer: يصبّ النحاس في قوالب فيصنع الأجراس والهاونات
  others: [يسكب الشمع المذاب في قوالب فيصنع الشموع, يسكب الماء على أيدي الضيوف في الولائم, يسكب القهوة لروّاد المقاهي من الدلال]
  note: كان يذيب النحاس مع القصدير والتوتيا والرصاص ويصبّه في القالب المطلوب، وهي حرفة قليل أهلها.
  source: qasimi
  page: 237
  volume: ج٢
  status: draft

- id: xw0284
  kind: custom
  prompt: في دمشق قديمًا، ما كان يفعل «الدلّال سرًّا»؟
  answer: يعرض دار من يريد بيعها سرًّا على الأغنياء في بيوتهم
  others: [يشتري المسروقات خفية ويبيعها في سوق بعيد, ينقل رسائل العشّاق بين البيوت دون أن يعلم أحد, يعرف أسعار السوق قبل الناس فيبيعها للتجار]
  note: من الدلّالين من يلزم سوقًا معينًا كسوق الخيل، ومنهم من يطوف بالبيوت، ومنهم من يتولى بيع الدور والعقارات بلا إعلان.
  source: qasimi
  page: 146
  volume: ج١
  status: draft

- id: xw0285
  kind: custom
  prompt: في أسواق دمشق قديمًا، ما كان عمل «الرشّاش»؟
  answer: يرشّ أرض السوق بالماء لئلا يثور الغبار
  others: [يرشّ ماء الورد على المارّين في الأعياد, يرشّ الماء على الخضار عند الباعة, يرشّ الكلس على الجدران لتبييضها]
  note: كان يملأ قربة من سبيل السوق ويرش يمنة ويسرة، مرتين في الصيف ومرة في الشتاء، ويأخذ من كل دكان أجرًا شهريًا.
  source: qasimi
  page: 156
  volume: ج١
  status: draft

- id: xw0286
  kind: custom
  prompt: لأي غرض كان «الشيّاح» يجمع الشوك من البرية ويأتي به إلى دمشق؟
  answer: ليبيعه وقودًا للأفران ولطبخ الدبس
  others: [ليصنع منه المكانس الخشنة للأسواق, ليبيعه علفًا للإبل والماعز, ليحيط به البساتين سياجًا]
  note: كان يجمع الشيح والدردري والبلّان ويحزمه على دابته، ومنهم من يلتزم معاصر الدبس في القرى بمبلغ سنوي يكفيها به.
  source: qasimi
  page: 262
  volume: ج٢
  status: draft

- id: xw0287
