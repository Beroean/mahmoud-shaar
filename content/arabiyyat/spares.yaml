- id: xw0282
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يبيع «الزهوراتي»؟
  answer: عروق الزهور وأبصالها للزرع
  others: [الزهورات المجففة لشراب الشتاء, باقات الورد المقطوف للأعراس, ماء الورد وماء الزهر المقطّر]
  note: كان يبيع عروق الورد والنسرين والقرنفل والليلك وغيرها، وأكثر أهل هذه الحرفة من الصالحية.
