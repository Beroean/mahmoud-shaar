  source: khadousi
  page: 173
  status: draft

- id: xw0116
  kind: riddle
  prompt: أصفر اللون، سارق عقل أهل الكون وحارمهم لذة النوم
  answer: الذهب
  others: [الليمون, الزعفران, النحاس]
  note: بريق الذهب يفتن الناس ويسهرهم في جمعه والخوف عليه.
  source: khadousi
  page: 11
  status: draft

- id: xw0117
  kind: riddle
  prompt: بلاد بلا سكان وانهار بلا مياه وأرض بلا تراب، فين هي يا الاحباب؟
  answer: على الخارطة
  others: [في الصحراء, في القمر, في الحلم]
  note: الخريطة فيها بلاد وأنهار وأرض، لكن على الورق فقط.
  source: khadousi
  page: 39
  status: draft

- id: xw0118
  kind: riddle
  prompt: ينبت جلده على صوفه
  answer: جوز الهند
  others: [الخروف, القنفد, الخوخ]
  note: جوز الهند قشرته الخارجية ليفية كالصوف، ثم صدفة صلبة تحتها.
  source: khadousi
  page: 99
  status: draft

- id: xw0119
  kind: riddle
  prompt: طير يلد ولا يبيض
  answer: الخفاش
  others: [الحمام, البوم, النعامة]
  note: الخفاش يطير لكنه يلد صغاره ويرضعها ولا يبيض.
  source: khadousi
  page: 41
  status: draft

- id: xw0120
  kind: riddle
  prompt: بلادي بيضة، وزريعتي كحلة، والخمامسة خمسة
  answer: الورقة والقلم واليد
  others: [الأرض والبذر والفلاح, الثلج والغراب والصياد, الصحن والزيتون والأصابع]
  note: الورقة بيضاء، والكتابة بالقلم سوداء كالبذور، والأصابع الخمسة تزرعها.
  source: khadousi
  page: 121
  status: draft

- id: xw0121
  kind: riddle
  prompt: زوج طاجينات معلقين
  answer: الأذنان
  others: [العينان, الخدان, الكتفان]
  note: الأذنان معلقتان على جانبي الرأس كطاجينين صغيرين.
  source: khadousi
  page: 135
  status: draft

- id: xw0122
  kind: riddle
  prompt: ينحني له كل الناس، مؤمنهم وكافرهم صباحا ومساء
  answer: الحذاء
  others: [الكرسي, البئر, الوسادة]
  note: كل من يلبس حذاءه ينحني إليه صباحاً ومساءً.
  source: khadousi
  page: 37
  status: draft

- id: xw0123
  kind: custom
  prompt: قبل أن تدخل عروس القوش مخدعها، تضرب بسكين كبيرة رغيفًا رقيقًا. إلامَ يرمز ذلك؟
  answer: أن تكون مضيافة يبقى بيتها مفتوحًا
  others: [إلى أن تكون حازمة في إدارة شؤون بيتها, إلى قطع صلتها القديمة ببيت أبيها, إلى أن يكثر الخبز والرزق في دارها]
  note: في الوقت نفسه يكسر رجل فوق الباب قلّة مملوءة بالحلويات والنقود، رمزًا لحياة زوجية سعيدة.
  source: hamoudi
  page: 132
  status: draft

- id: xw0124
  kind: custom
  prompt: ما الشكل الذي كانت تُرصّع به القطع الذهبية الصغيرة على لحاف العروسين في الموصل؟
  answer: نجمة فوقها هلال
  others: [وردة بأوراق متفتحة, شجرة نخيل مثمرة, قلب يخترقه سهم]
  note: كانوا يسمّون هذا النقش «نجمة وقمر»، وتتولى البنات تثبيت أقمشة المنامات في اليوم الذي يسبق نقل الجهاز.
  source: hamoudi
  page: 60
  status: draft

- id: xw0125
  kind: custom
  prompt: من أين أُخذت تسمية «ليلة المحية»، وهي ليلة النصف من شعبان في تكريت؟
  answer: من إحياء الليل ساهرًا
  others: [من محو الذنوب بالدعاء, من المحبة بين الجيران, من محيا القمر في تمامه]
  note: كان شبانها يبيتون في بيت الملا صاحب الكتّاب، يحمل كل منهم فراشه ويسهرون بالأناشيد والألعاب حتى الصباح.
  source: hamoudi
  page: 144
  status: draft

- id: xw0126
  kind: custom
  prompt: إذا وُلد الطفل في تلعفر بعد مواليد كثيرة وأراد أهله أن يكفّوا عن الإنجاب، فأيّ اسم قد يختارونه له؟
  answer: بطّال
  others: [كافي, خاتم, آخر]
  note: وكانوا يسمّون من وُلد في أحد الأعياد «عيد»، ومن وُلد يوم الجمعة باسم ذلك اليوم.
  source: hamoudi
  page: 98
  status: draft

- id: xw0127
  kind: custom
  prompt: في القوش قديمًا، كيف كان الشاب يلمّح إلى أنه يرغب في الزواج؟
  answer: يشيع أنه يريد أن يصبح راهبًا في الدير
  others: [يعلّق منديلًا ملونًا على باب داره, يترك الأكل أيامًا حتى يسأله أبوه عن سبب حزنه, يقصّ شعره ويلبس ثيابًا جديدة]
  note: حين تصل الإشاعة إلى والديه يسألانه هل يريد الزواج، فيبدأ الأب البحث عن فتاة تناسبه.
  source: hamoudi
  page: 127
  status: draft

- id: xw0128
  kind: custom
  prompt: في جولة المولّدة الكربلائية بالمولود في الأسواق، عند دكان من كانت تنتهي الجولة؟
  answer: الصبّاغ
  others: [الصائغ, العطّار, الخبّاز]
  note: كان الصباغ ينقّط قطعة قماش بألوان مختلفة ويضعها على وجه الطفل، اعتقادًا أن ذلك يمنع الألوان من أن تؤثر فيه.
  source: hamoudi
  page: 77
  status: draft

- id: xw0129
  kind: custom
  prompt: في الموصل قديمًا، ماذا كانت البنت تتعلم عند «الأستادي» بعد أن تتعلم القرآن عند الملّاية؟
  answer: الخياطة والنقش والتطريز
  others: [الحساب ومسك الدفاتر, الطبخ وصنع الحلويات, العزف على الدف والغناء]
  note: كانت هذه الصنائع تؤهّل البنت لأن تُعدّ جهاز زواجها بيديها، وكانت تتعلمها مع بنات المحلة.
  source: hamoudi
  page: 41
  status: draft

- id: xw0130
  kind: custom
  prompt: حين توزَّع «قرصة خبز الزواج» على العائلات المدعوة في القوش، بماذا تردّ العائلة؟
  answer: بغربال مليء بالحنطة وفوقه بصل
  others: [بصحن حلوى مغطى بمنديل ملون, بإبريق من اللبن الطازج, بقطعة قماش ملونة للعروس]
  note: يرمز ذلك إلى مشاركة أهل العريس الخبز والملح، وإلى مساعدتهم بما يجتمع من الحنطة والجريش.
  source: hamoudi
  page: 136
  status: draft

- id: xw0131
  kind: custom
  prompt: كيف كانوا يحسبون «النقدية» أي الصداق في الموصل قديمًا؟
  answer: بعدد الأكياس، في كل كيس خمس ليرات ذهب
  others: [بعدد رؤوس الغنم التي تُساق إلى أهل العروس, بوزن العروس من الفضة يوم الخطبة, بعدد الأثواب الحريرية في جهازها]
  note: كانت الليرة العثمانية الذهبية هي وحدة الحساب، فيقال إن نقدية فلانة كانت عشرة أكياس للتفاخر بغناها.
  source: hamoudi
  page: 52
  status: draft

- id: xw0132
  kind: custom
  prompt: بماذا كانوا يحشون اثنتين من مخدات العروس في الجهاز الموصلي أحيانًا؟
  answer: ريش القطا
  others: [صوف الغنم, القطن المندوف, التبن الناعم]
  note: كان معدّل المنامات في الجهاز أربعة لحف وأربعة مطارح وثماني مخدات.
  source: hamoudi
  page: 54
  status: draft

- id: xw0133
  kind: custom
  prompt: ماذا كانت تُسمّى سهرة العريس الكربلائي مع أصدقائه قبيل الزواج، وفيها تُحنّى يداه ورجلاه؟
  answer: الكيف
  others: [الصفكة, الجلوة, السبعة]
  note: كانت تتخللها الدنابك والرقص الشعبي والأغاني، أما رجال الدين فيقيمون لزميلهم حفلًا هادئًا بالشاي والحلويات.
  source: hamoudi
  page: 83
  status: draft

- id: xw0134
  kind: custom
  prompt: بماذا كانت العروس تُزفّ إلى دار العريس في الكاظمية أيام زمان؟
  answer: عربة الربل
  others: [هودج على ظهر جمل, محفّة على الأكتاف, فرس مجللة بالحرير]
  note: ثم صارت تُزفّ بالسيارات، وكانت تغطي وجهها ببرگع شفاف من قماش التور الأبيض.
  source: hamoudi
  page: 166
  status: draft

- id: xw0135
  kind: custom
  prompt: بماذا كانت تُحشى «حلاوة الخضر» التي تُهدى في جمعة الخضر بالموصل؟
  answer: الجوز واللوز
  others: [التمر والسمسم, الفستق والزبيب, جوز الهند والعسل]
  note: كانت تزيَّن بقطع ملونة من السكر، ويهديها أهل الخاطب إلى العروس وأهلها في ذلك اليوم.
  source: hamoudi
  page: 62
  status: draft

- id: xw0136
  kind: custom
  prompt: إذا دُعيت المخطوبة في القوش إلى الغداء عند أحد أقاربها، فما الطعام الذي يُقدَّم لها في الغالب؟
  answer: بيض مقلي وفوقه عسل
  others: [دولمة ملفوفة بورق العنب, كبة موصل مع اللبن, رز ودجاج مع المرق]
  note: كانت تُدعى بالتناوب إلى بيوت الأقارب والجيران، فيضعون في جيبها بعض النقود أيضًا.
  source: hamoudi
  page: 130
  status: draft

- id: xw0137
  kind: custom
  prompt: بماذا كان «الكوسة» في طقس المطر الكردي يقلّد الحمار؟
  answer: يشدّ على أذنيه زوجًا من الكلاش
  others: [يحمل على ظهره خرجًا مملوءًا بالتبن, يربط في عنقه جرسًا نحاسيًا كبيرًا, يمشي على أربع ويأكل من العلف]
  note: الكلاش نوع من الأحذية، وكان الكوسة يقفز من مكان إلى آخر ويقلّد صوت الحمار فيضحك من يتبعه.
  source: hamoudi
  page: 116
  status: draft

- id: xw0138
  kind: custom
  prompt: في يوم «الأربعة أيام» من العرس الموصلي، ماذا كانت تفعل «المغنية الجلّاية»؟
  answer: تجلو العروس أمام المدعوات
  others: [تحنّي أكفّ صديقات العروس, تقرأ المولد النبوي حتى الظهر, تنقل جهاز العروس إلى غرفتها]
  note: كانت تجلو مع العروس أترابها أيضًا، وتتلقى بدر النقود وقطع الحرير إكرامًا للعروسين.
  source: hamoudi
  page: 69
  status: draft

- id: xw0139
  kind: custom
  prompt: ماذا يسمّي أهل الكاظمية نسخة عقد الزواج التي يُزوَّد بها الزوج؟
  answer: آذن نامه
  others: [صك الملاج, ورقة المهر, دفتر النفوس]
  note: تحمل تواقيع مختار المحلة والقاضي والشهود والزوجين، وتعطى نسخة منها لأهل العروس.
  source: hamoudi
  page: 157
  status: draft

- id: xw0140
  kind: custom
  prompt: في الكاظمية قديمًا، ما أول علامة للخطبة حين تزور أم الفتى بيت الفتاة؟
  answer: أن تطلب قدح ماء وتقول «عيني بالفرح»
  others: [أن تخلع خاتمها وتضعه في كف الفتاة, أن ترفض شرب الشاي حتى يُجاب طلبها, أن تترك عباءتها في بيت الفتاة حين تخرج]
  note: كانت تذهب مع قريباتها متزينة بحليها، وتنظر إلى الفتاة وتتمنى أن تكون زوجة لابنها.
  source: hamoudi
  page: 156
  status: draft

- id: xw0141
  kind: custom
  prompt: ليلة الحناء في القوش، ماذا كان يُرمى في إناء الماء بعد تحنية يد كل شاب من أصدقاء العريس؟
  answer: قطعة أو عدة قطع من النقود
  others: [حبات من الملبّس والجوز, وريقات من الآس الأخضر, قطرات من ماء الورد]
  note: كانت والدة العريس أو أخته تحنّي يده أولًا ثم أيدي الشبان العزاب، مع أغنية لكل منهم تتمنى له خطيبة حلوة.
  source: hamoudi
  page: 131
  status: draft

- id: xw0142
  kind: custom
  prompt: ماذا كان المقتدر من أهل الموصل يقدّم لكل واحد من المدعوين إلى عقد الزواج؟
  answer: منديلًا من حرير فيه ظرف من السكر
  others: [فنجان قهوة مرّة وقطعة بقلاوة, كيسًا صغيرًا فيه دراهم فضية, باقة من الورد الجوري وماء الورد]
  note: من كان دون ذلك قدّم مناديل من الغزل، وربما اكتفى بظرف فيه سكر.
  source: hamoudi
  page: 63
  status: draft

- id: xw0143
  kind: custom
  prompt: حين يصل موكب العريس في القوش إلى دار العروس ويجد الباب مقفلًا، متى يُفتح؟
  answer: بعد أن يدفعوا ما يُتفق عليه من نقود
  others: [بعد أن يغني العريس أغنية وحده, بعد أن تحلّ الشمس في وسط السماء ويؤذّن المؤذن للظهر, بعد أن يطرقه الكاهن ثلاث مرات]
  note: بعدها تخرج العروس مغطاة الرأس بملاءة زاهية، ويعود الموكب إلى بيت العريس من طريق غير التي جاء منها.
  source: hamoudi
  page: 132
  status: draft

- id: xw0144
  kind: custom
  prompt: ما «الصبحية» التي يقدّمها العريس الموصلي لعروسه؟
  answer: مبلغ من النقود أو حلي ذهبية صباح أول يوم
  others: [فطور من القيمر والعسل تعدّه أم العروس للعريس وأصحابه, ثوب تخيطه العروس لزوجها قبل الزفاف, وليمة يقيمها العريس لأهل المحلة]
  note: يقدّم والد العريس لها صبحية أيضًا حين تقبّل يده، وكذلك قريباتها اللواتي يزرنها في الأيام التالية.
  source: hamoudi
  page: 68
  status: draft

- id: xw0145
  kind: custom
  prompt: بماذا كان يوصى العريس الكربلائي حين يتعشى مع أصحابه ليلة زفافه؟
  answer: ألا يكثر من الأكل لأن أكلة دسمة تنتظره
  others: [أن يأكل قبل الجميع ثم يقوم أولًا ليستعد للزفّة, أن يطعم أصغر الحاضرين بيده, أن يترك نصف صحنه للفقراء]
  note: كانت أم العروس تجلب مع ابنتها أكلة فيها دجاج وخبز، ثم يذهب الجمع إلى المقهى قبل أن يزفّوه إلى داره.
  source: hamoudi
  page: 84
  status: draft

- id: xw0146
  kind: custom
  prompt: ماذا كان يقال في الموصل حين تحجز أسرة العروس حمّام المحلة كله لاستحمام عروسها وصديقاتها؟
  answer: ضمّنوا الحمّام
  others: [قفلوا الحمّام, اشتروا الحمّام, سكّروا الحمّام]
  note: لا يدخل الحمام يومها إلا المدعوات، وتُغسل العروس بصابون مطيّب، ثم يوزَّع البخشيش على العاملين فيه.
  source: hamoudi
  page: 64
  status: draft

- id: xw0147
  kind: custom
  prompt: ما «القيسي» الذي كانت نساء الموصل يطبخنه لولائم الأفراح؟
  answer: مشمش مجفف محشو يُطبخ بالسكر
  others: [كبّة من البرغل محشوة باللحم, رز مطبوخ بالحليب والهيل, عجين مقلي يُغمس في الدبس]
  note: كان يقدَّم مع «العلي بخارا»، وهو إجاص مجفف يُطبخ بالسكر أيضًا.
  source: hamoudi
  page: 73
  status: draft

- id: xw0148
  kind: custom
  prompt: ما «النشرة» التي كانت بعض العرائس في الموصل يصنعنها ضمن جهازهن؟
  answer: شبكة فيها نماذج مصغّرة من الجهاز تُعلّق أعلى الغرفة
  others: [ستارة من الحرير تُشدّ حول سرير العروسين ليلة الدخلة, سجادة منقوشة تُفرش في عتبة الغرفة لاستقبال الضيوف, ملاءة بيضاء تُنشر على سطح الدار يوم الزفاف]
  note: كانت تُخاط فيها أباريق وقباقيب وتمائم ولعب حيوانات صغيرة، وتُعلَّق على ثلاثة جوانب من الغرفة تحت محل استناد السقف.
  source: hamoudi
  page: 55
  status: draft

- id: xw0149
  kind: custom
  prompt: ماذا كانوا يسمّون الحفل الكبير الذي يقام في عصر اليوم السابع للزواج في كربلاء؟
  answer: السبعة
  others: [الصبحة, الكيف, الجلوة]
  note: تجلس فيه العروس على دكة عالية أو كرسي، وتبدّل أزهى ملابسها بين حين وآخر والنساء يغنين حولها.
  source: hamoudi
  page: 85
  status: draft

- id: xw0150
  kind: custom
  prompt: ماذا كان نيشان الخطوبة في كربلاء قديمًا؟
  answer: خاتم ذهبي تلبسه الفتاة
  others: [حجل فضي تلبسه في ساقها, طاقية مرصعة بالليرات, حزام ذهبي تتحزم به]
  note: كانت العادة الشائعة قديمًا أن الرجل لا يرى الفتاة التي سيتزوجها إلا ليلة زفافها.
  source: hamoudi
  page: 80
  status: draft

- id: xw0151
  kind: custom
  prompt: ما «گعدة العروس» في الكاظمية؟
  answer: جلوسها سبعة أيام لتتفرج عليها النساء
  others: [جلوس أمها عندها في بيت زوجها ليلة الزفاف, مجلس يجتمع فيه الرجال لتهنئة العريس بعد الزفاف, جلستها مع الماشطة لتزيينها قبل الزفة]
  note: كانت تجلس على كرسي كبير وفي يدها شدّة ورد، وامرأة تمسك فوق رأسها ماعونًا يجمع ما ينثر عليها من حلوى.
  source: hamoudi
  page: 164
  status: draft

- id: xw0152
  kind: custom
  prompt: ماذا كان يأخذ الجمّال الذي ينقل جهاز العروس في الموصل مقابل عمله؟
  answer: لا يأخذ أجرة، بل يُهدى طاقة حرير
  others: [ليرة ذهبية عن كل جمل يحمل الجهاز, نصيبًا من الطعام المطبوخ لوليمة العرس, ثيابًا جديدة له ولكل واحد من أولاده]
  note: كان يعدّ ذلك خدمة واجبة عليه، وينتظر يوم زواج ابن أخيه ليؤديها.
  source: hamoudi
  page: 61
  status: draft

- id: xw0153
  kind: custom
  prompt: كيف كان أهل تكريت يستقبلون الحجاج العائدين أيام كانوا يسافرون بالقطار من بغداد؟
  answer: بالدفوف والأعلام والمدائح
  others: [بإطلاق الطيور البيضاء عند باب البلدة, بنحر الإبل على عتبات المساجد الكبيرة, بإضاءة القناديل على سطوح البيوت ليلًا]
  note: يتبع الاستقبال إقامة «المواليد» في بيوت الحجاج، وصار الاستقبال بعد السيارات على أميال خارج البلدة.
  source: hamoudi
  page: 147
  status: draft

- id: xw0154
  kind: custom
  prompt: ماذا كان أهل العروس في القوش يرسلون إلى بيت العريس في اليوم الأول من أيام الاحتفال الثلاثة؟
  answer: الهريسة
  others: [الدولمة, الجميلية, الكبة]
  note: وفي اليوم الثاني شوربة رز كثيفة عليها دبس وثريد بالدبس، وفي اليوم الثالث الدولمة.
  source: hamoudi
  page: 133
  status: draft

- id: xw0155
  kind: custom
  prompt: ماذا كان يحمل الطفلان اللذان يسيران أمام العروس في زفتها بالكاظمية؟
  answer: شمعة ومرآة
  others: [مصحفًا ومبخرة, سلة ورد وماء ورد, صينية حنّاء وآس]
  note: كانوا يتفاءلون بهما، ويعتقدون أن حظ العروس يستقيم إذا أوقدت لها الشمعة.
  source: hamoudi
  page: 163
  status: draft

- id: xw0156
  kind: custom
  prompt: أيّ صنعة كانت تللسقف تنفرد بها بين القرى المجاورة، حتى اشتغل بها نحو نصف عوائلها؟
  answer: صنع حباب الماء والجرار
  others: [نسج البسط والسجاد, صنع الفراوي من الجلود, صياغة الحلي الفضية]
  note: كانت الموصل وما حولها تعتمد عليها قبل انتشار الثلج والثلاجات، ثم قلّت هذه الصنعة.
  source: hamoudi
  page: 121
  status: draft

- id: xw0157
  kind: custom
  prompt: من أي مدينة كانت ترد إلى الموصل الأقمشة الحريرية الجميلة التي تشتريها الأم لجهاز ابنتها؟
  answer: حلب
  others: [دمشق, البصرة, القاهرة]
  note: كانت الأم تقتني من هذه الأقمشة ومناديل الحرير وطاقات الإبريسم ما تكمل به جهاز ابنتها.
  source: hamoudi
  page: 54
  status: draft

- id: xw0158
  kind: custom
  prompt: ما «البگنوني» في بيوت القوش؟
  answer: زاوية من الغرفة تُنقش للعروسين
  others: [صندوق خشبي تحفظ فيه العروس ثيابها, ستارة حمراء تُعلق على باب الدار, سرير عال من خشب الجوز للعروسين]
  note: الكلمة آرامية بمعنى الخدر، وكانت الزاوية تُبيّض بالجص لأن جدران الغرف كانت تسودّ من دخان التدفئة.
  source: hamoudi
  page: 133
  status: draft

- id: xw0159
  kind: custom
  prompt: من أي شيء تُصنع حلوى «الحجّي بادا» الموصلية؟
  answer: الطحين واللوز والدهن
  others: [التمر المهروس والسمسم, الأرز المطحون والحليب, الجوز والدبس والطحين]
  note: تُصنع منها أقراص تُشوى في الفرن، وكانت من الحلويات التي تُعدّ ليوم النيشان.
  source: hamoudi
  page: 73
  status: draft

- id: xw0160
  kind: custom
  prompt: ما الهدية التي كان والد العروس في الكاظمية يقدّمها للعريس يوم «الصبحة» حين يقبّل يده؟
  answer: ساعة جيب مع زنجيل
  others: [خاتم فضة بفص عقيق, عباءة صوف مطرزة, سبحة من الكهرب]
  note: كان العريس يذهب مع أصدقائه إلى بيت أهل العروس للغداء أو العشاء، ويقبّل رأس والدتها أيضًا.
  source: hamoudi
  page: 165
  status: draft

- id: xw0161
  kind: custom
  prompt: ماذا يسمّي أهل تكريت الولائم التي تقام في البيوت صبيحة اليوم الأول من العيد؟
  answer: العيدية
  others: [الطعمة, الفزعة, الصوغة]
  note: من يقصد صاحب البيت للتهنئة لا بدّ أن يأكل عنده ويشرب القهوة، ولو كان قد طاف ببيوت أخرى قبله.
  source: hamoudi
  page: 144
  status: draft

- id: xw0162
  kind: custom
  prompt: على وصف من كان الفتى في الكاظمية قديمًا يتزوج، إذ كان يحرم عليه رؤية خطيبته؟
  answer: على وصف أمه أو أخته أو إحدى قريباته
  others: [على وصف الدلالة التي تبيع للنساء, على وصف شيخ المحلة الذي يعرف أهلها, على وصف صديق له رآها في السوق]
  note: كانت الأم تعود من بيت الفتاة فتصف لابنه عينيها وخدها وشعرها بعبارات شعبية جميلة.
  source: hamoudi
  page: 156
  status: draft

- id: xw0163
  kind: custom
  prompt: ماذا سمّى أهل العروس في الموصل يوم نقلها إلى بيت زوجها؟
  answer: يوم النقشة
  others: [يوم القطوع, يوم الدشين, يوم الخلعة]
  note: سمّوه كذلك لأنهم يهيّئون العروس ويزيّنونها فيه، ويسمّيه غيرهم «الجلبات» و«يوم الزفاف».
  source: hamoudi
  page: 63
  status: draft

- id: xw0164
  kind: custom
  prompt: في الموصل قديمًا، ماذا سمّوا اليوم الذي يجتمع فيه الطرفان لتحديد مقدار المهر وحلي الخطوبة؟
  answer: القطوع
  others: [الحمالة, الصبحية, الجلوة]
  note: في هذا اليوم تحضر العاقلات من الأسرتين، ويتفاوضن طويلًا حتى يستقر الأمر على «النقدية» و«النيشان».
  source: hamoudi
  page: 52
  status: draft

- id: xw0165
  kind: custom
  prompt: ما معنى «الدس بوس»، وهو غداء يدعى إليه العروسان في بيت أهل العروس يوم الزواج الثالث بكربلاء؟
  answer: تقبيل اليد
  others: [فتح الباب, لقمة العروس, شدّ الستارة]
  note: هي كلمة فارسية، إذ يقبّل العروسان يد والدي العروس، فيقدّمان لهما هدية كساعة أو خاتم ذهبي.
  source: hamoudi
  page: 85
  status: draft

- id: xw0166
  kind: custom
  prompt: ما «شراب الحرير» الذي كان أهل الموصل يقدّمونه للضيوف في الصيف؟
  answer: شراب من السكر وماء الورد
  others: [حليب مغلي بالهيل والقرفة, عصير الرمان المحلّى بالعسل, لبن مخفوق بالماء والملح]
  note: كانت البنت تقدّمه للخاطبات في صينية خاصة تسمّى «تبسة الشربت».
  source: hamoudi
  page: 72
  status: draft

- id: xw0167
  kind: custom
  prompt: بأيّ محصول صيفي اشتهرت قرية تللسقف شمال الموصل، فكان يُرسل إلى الموصل وبغداد؟
  answer: البطيخ
  others: [العنب, التين, الرمان]
  note: يذكر الكاتب أن البطيخ يُزرع في أماكن أخرى، لكن ليس بكمية ما تنتجه تللسقف ولا بجودته.
  source: hamoudi
  page: 119
  status: draft

- id: xw0168
  kind: custom
  prompt: من أي خشب كان يُصنع صندوق ثياب العروس في جهازها الموصلي؟
  answer: الجوز
  others: [التوت, الصنوبر, النخل]
  note: كان الصندوق مزخرفًا بمسامير بارزة على ظاهره، ويوضع تحته لوح من خشب الجوز أيضًا.
  source: hamoudi
  page: 54
  status: draft

- id: xw0169
  kind: custom
  prompt: بأي كلمة كان صبيان تكريت يخاطبون ناقلي البطيخ والرقي من الشواطئ في أواخر تشرين الأول، فيعطونهم منه؟
  answer: الحديّة
  others: [العيدية, الصوغة, البشارة]
  note: كانوا يقفون في مفارق الطرق أيام جني ثمار الشواطئ، وتعرف هذه الأيام عندهم باسم «التشرقط».
  source: hamoudi
  page: 148
  status: draft

- id: xw0170
  kind: custom
  prompt: لماذا سُمّي صوم الفتيات في تكريت في أول أحد من رجب «صوم الخرساني»؟
  answer: لأنهن لا ينطقن فيه بكلمة طوال اليوم
  others: [لأنه يُصام عن الطعام والماء ثلاثة أيام, لأن أول من صامته فتاة من خراسان, لأنهن يقضينه في بيت الملّاية وحدهن]
  note: الخرساني من الأخرس الذي لا يتحدث إلا بالإشارة، ويعرف هذا الصوم في بغداد باسم «صوم البنات».
  source: hamoudi
  page: 149
  status: draft

- id: xw0171
  kind: custom
  prompt: ما «الحكّ» الذي تقدّمه أم الفتى في الكاظمية ملفوفًا في منديل من حرير؟
  answer: الصداق المقدّم للعروس
  others: [خاتم الخطوبة الذهبي, ثوب العرس الأبيض, هدية الحماة للكنّة]
  note: كانت تحمله مع بقج فيها القبقاب والحناء والحجل والأقراط، ويذكر الكاتب أن خاتم الخطوبة لم يكن معروفًا أيام زمان.
  source: hamoudi
  page: 157
  status: draft

- id: xw0172
  kind: custom
  prompt: أيّ قطع الحلي كانت المرأة الموصلية تلبسها بعد النيشان ولا تنزعها ما دامت متزوجة؟
  answer: الحجل
  others: [القلادة, الخاتم, القرط]
  note: الحجل حلية تُلبس في الساق، وكان يُستحسن أن يكون ثقيل الوزن، وكانت النساء يتطيّرن من نزعه.
  source: hamoudi
  page: 53
  status: draft

- id: xw0173
  kind: custom
  prompt: على ظهر أي أداة منزلية كان أهل تلعفر يضعون المولود بقرب أمه، ليكون بعيدًا عن الهوام؟
  answer: الغربال
  others: [الصينية, المنخل, الصندوق]
  note: كان الغرض أن يكون الطفل في مكان مرتفع قليلًا بمنجاة من الحشرات والدبيب.
  source: hamoudi
  page: 96
  status: draft

- id: xw0174
  kind: custom
  prompt: لماذا كانت بعض أسر تلعفر تضع قليلًا من الشعير في ماء غسل المولود؟
  answer: لكي يميل إلى أعمال الزراعة
  others: [لكي يكثر شعر رأسه ويطول, لكي ينام نومًا هادئًا طويلًا, لكي لا يصاب بالبرد في الشتاء]
  note: كانوا يضعون معه قشر الرمان وقطعة حديد وقليلًا من الملح، ولكل منها غاية في اعتقادهم.
  source: hamoudi
  page: 96
  status: draft

- id: xw0175
  kind: custom
  prompt: لماذا كانت العروس في تللسقف تُخاط على طاقيتها قطع من العملة الفضية العثمانية المثقوبة؟
  answer: ليُسمع لها صوت إذا سارت أو رقصت
  others: [لتُعرف بها أسرتها من بين النساء, لتدفع منها أجرة الخيّاطة, لتحفظها من البرد في الشتاء]
  note: كانت تسمّى «طاقية الدراهم»، أما العملات الذهبية فتوضع على حافة الطاقية فتظهر على الجبين.
  source: hamoudi
  page: 123
  status: draft

- id: xw0176
  kind: custom
  prompt: ما الاسم الذي يطلقه أهل تكريت على لعبة «الساس» التي تقام في الأعراس؟
  answer: الدرگ
  others: [المحيبس, التوكي, الطوبة]
  note: الدرگ جمع «درگة»، وهي الترس، ولذلك سمّيت اللعبة به؛ وكانت تقام مع حلقات الدبكة قبل الزواج.
  source: hamoudi
  page: 143
  status: draft

- id: xw0177
  kind: custom
  prompt: في جمعة الخضر بالموصل، كيف كان الأطفال يأكلون «السويق» المصنوع من الحبوب المقلية؟
  answer: يمتصونه بقصبة من كيس معلّق في أعناقهم
  others: [يغمسونه بالخبز في صحن كبير مشترك وسط فناء الدار, يشربونه مذابًا في الحليب الساخن, يأكلونه أقراصًا مشوية في الفرن]
  note: كانت الحبوب تُطحن ويضاف إليها السعد أو قشر البرتقال، وفي داخل الكيس قطعة حلاوة تفرح الصغار.
  source: hamoudi
  page: 74
  status: draft

- id: xw0178
  kind: custom
  prompt: في طقس استنزال المطر عند الأكراد، بماذا كان «الكوسة» ورفاقه يصبغون وجوههم؟
  answer: سخام القدور
  others: [الحناء المعجونة, الطين الأحمر, رماد التنور]
  note: يرمز السواد إلى أن الوجوه والقلوب تغيّرت، فيرجون المطر ليغسلها ويزيل الحزن.
  source: hamoudi
  page: 114
  status: draft

- id: xw0179
  kind: custom
  prompt: ماذا يعني اسم «بووكه بارانه» الذي يطلقه بعض الأكراد على طقس استنزال المطر؟
  answer: عروس المطر
  others: [أمّ الغيث, بنت السحاب, رقصة الريح]
  note: يتنكّر فيه شاب بملابس نسائية فيمثل العروس، ويحرسه شبان أقوياء يحملون عصيًّا غليظة الرأس.
  source: hamoudi
  page: 114
  status: draft

- id: xw0180
  kind: custom
  prompt: ماذا يسمّي أهل تكريت المساعدة الجماعية المجانية في بناء البيوت والحصاد؟
  answer: الفزعة
  others: [العونة, الطعمة, النخوة]
  note: كان أولاد المحلة يهرعون للعمل أيامًا، ويقدّم لهم صاحب البناء الفطور والغداء فقط.
  source: hamoudi
  page: 147
  status: draft

- id: xw0181
  kind: custom
  prompt: من كانت الأم الموصلية ترسلها أولًا إلى بيت البنت لتعرف رأي أهلها في ابنها؟
  answer: الغسّالة
  others: [القابلة, الخيّاطة, الملّاية]
  note: كانت الغسالة تحمل الكلام بين الأسرتين حتى يتم القبول.
  source: hamoudi
  page: 47
  status: draft

- id: xw0182
  kind: custom
  prompt: في الكاظمية، تُكسر «كلّة قند» فوق رأس العروس عند العقد. ماذا يُصنع بالسكر المتساقط؟
  answer: حلاوة يأكلها العريس فتزيد محبته لزوجته
  others: [شربت يوزّع على المدعوين بعد العقد, يُرشّ على عتبة الدار ليوم الزفاف, يُحفظ في صرة صغيرة تعلقها العروس فوق سريرها في غرفتها]
  note: كانت توضع على رأس العروس وصلة قماش لتجمع السكر المتساقط.
  source: hamoudi
  page: 158
  status: draft

- id: xw0183
  kind: custom
  prompt: لماذا كانت امرأة على سطح بيت العريس في الموصل ترمي النقود والسكر وراء العروس عند وصولها؟
  answer: لينشغل الأطفال بالتقاطها عن العروس
  others: [لتعرف كم سيكون عدد أولادها, ليحصل الجيران على نصيبهم من العرس, لتطرد الطيور عن باب الدار]
  note: كانت ترمي معها «النقل» أيضًا، فيتهافت الصغار على التقاطه وتدخل العروس الدار بهدوء.
  source: hamoudi
  page: 66
  status: draft

- id: xw0184
  kind: origin
  prompt: كُشَري
  hint: طعام مصري من الأرز والعدس
  answer: الهندية
  others: [التركية, الفارسية, الإيطالية]
  note: يردّه المؤلف إلى اللفظ الهندي «كَجهري»، وهو طعام شائع في الهند يشبه الكشري المصري.
  source: alloub
  page: 198
  status: draft

- id: xw0185
  kind: origin
  prompt: كَتّ، يكُتّ
  hint: يهرب
  answer: الفرنسية
  others: [الإيطالية, الإنجليزية, التركية]
  note: من الفعل الفرنسي quitter أي غادر وهجر.
  source: alloub
  page: 192
  status: draft

- id: xw0186
  kind: origin
  prompt: تملي
  hint: دائمًا
  answer: التركية
  others: [الفارسية, الإيطالية, المغولية]
  note: من التركية temelli أي الثابت الدائم.
  source: alloub
  page: 81
  status: draft

- id: xw0187
  kind: origin
  prompt: شيزلونج
  hint: أريكة، مقعد طويل
  answer: الفرنسية
  others: [الفارسية, اليونانية, الهندية]
  note: من الفرنسية chaise longue أي الكرسي الطويل.
  source: alloub
  page: 154
  status: draft

- id: xw0188
  kind: origin
  prompt: بوفيه
  hint: مقصف، مقهى
  answer: الفرنسية
  others: [الفارسية, اليونانية, الهندية]
  note: من الفرنسية buffet، ويجمعها المصريون «بوفيهات».
  source: alloub
  page: 72
  status: draft

- id: xw0189
  kind: origin
  prompt: بلنتي
  hint: ضربة الجزاء في الكرة
  answer: الإنجليزية
  others: [الفارسية, اليونانية, الهندية]
  note: تحريف للإنجليزية penalty أي الجزاء والعقوبة.
  source: alloub
  page: 65
  status: draft

- id: xw0190
  kind: origin
  prompt: ترسو
  hint: درجة ثالثة
  answer: الإيطالية
  others: [التركية, الإنجليزية, الفارسية]
  note: من الإيطالية terzo أي الثالث.
  source: alloub
  page: 77
  status: draft

- id: xw0191
  kind: origin
  prompt: موبيليا
  hint: أثاث
  answer: الإيطالية
