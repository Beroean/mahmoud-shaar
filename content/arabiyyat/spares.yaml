  others: [نسبة إلى أداة يحملها اسمها الأزعر, نسبة إلى محلة في جانب الكرخ, لأنه يصرخ بالأولاد ويخيفهم]
  note: كان الأزعرتي في الغالب هو نفسه الحلاق الذي حلق رأس الولد، ويلبس لفّة رأس خاصة وشروالًا أسود.
  source: hijiyya
  page: 51
