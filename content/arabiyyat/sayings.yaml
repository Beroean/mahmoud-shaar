# Round 1 · أكمل المثل: finish the saying (one ___). The place shown comes from the source's place.
#
# Day N plays item N of each list; items past the shortest list are spares. answer/others: the
# book's answer and three wrong ones the book rules out. note: shown after answering, in our own
# words (never copied from the book). source: id in sources.yaml · page: printed page · volume:
# for multi-volume books · line/halab: the Aleppo book's text line and the حلبيّات spare it reuses ·
# flag: something a reviewer should check · status: draft until a person reviews it.

- id: s0001
  kind: saying
  prompt: اللى عنده القمر ما همته فى ___
  answer: النجوم
  others: [القناديل, السحاب, الليل]
  note: من عنده أعلى الأمور لا يهتم بصغارها.
  source: zanin
  page: 42
  status: draft

- id: s0002
  kind: saying
  prompt: لا شفت الجمل ولا ___
  answer: الجمال
  others: [الحمار, الحمل, الخروف]
  note: الجَمّال صاحب الجمل وسائقه، أي لم أر الجمل ولا صاحبه. يقال في شدة كتمان السر.
  source: taymur
  page: 315
  status: draft

- id: s0003
  kind: saying
  prompt: عين الحسود بيها ___
  answer: عود
  others: [رمد, دود, شوك]
  note: دعاء على الحاسد يقوله البغداديون، وكانوا يعلّقون على الأطفال سنّ الذيب أو العفصة أو «أم سبع عيون» لطرد العين.
  source: hijiyya
  page: 110
  status: draft

- id: s0004
  kind: saying
  prompt: من عاش بالحيله مات ___
  answer: فقر
  others: [قهر, غريب, وحيد]
  note: من عاش على التحايل على الناس مات فقيرا، فالحيلة إن نفعت مرة لم تنفع كل مرة. حثّ على الكسب النزيه.
  source: abboudi_amthal
  page: 1434
  volume: ج٤
  status: draft

- id: s0005
  kind: saying
  prompt: آذار بحيي ___
  answer: الأشجار
  others: [الأنهار, الأحجار, الأسوار]
  note: يذكر فضل شهر آذار على الشجر، ففيه تعود إليه الحياة.
  source: sahli
  page: 24
  status: draft

- id: s0006
  kind: saying
  prompt: ايلاَ كْثْرُوا ___ كَيْتْحَرَقْ الطّْعَامْ
  answer: الطَّبَّاخِينْ
  others: [الضّْيَافْ, الْجِيرَانْ, الدّْرَارِي]
  note: إذا كثر الطباخون احترق الطعام. فكل واحد يريد أن يفرض رأيه فتضيع النتيجة في خضم الخلاف.
  source: dadoun
  page: 391
  status: draft

- id: s0007
  kind: saying
  prompt: القطة ما تبعش ___
  answer: ولادها
  others: [بيتها, أكلها, جيرانها]
  note: يتحدث عن عاطفة الأمومة التي لا تتخلى عن صغارها، حتى عند الحيوان. وفي معناه «القطة ما تاكلش ولادها».
  source: shaalan
  page: 66
  volume: ج٦
  status: draft

- id: s0008
  kind: saying
  prompt: أجا ونام عنّا ليلة ساوى حالو من ___
  answer: العيلة
  others: [الجيران, الضيوف, الأكابر]
  note: يُقال فيمن يتبسّط بعد معرفة قصيرة فيتصرّف كأنه من أهل البيت.
  source: asadi
  line: 118092
  halab: p1309
  status: draft

- id: s0009
  kind: saying
  prompt: شيّخوني وشلّوا ___
  answer: البقر
  others: [الغنم, الأرض, الجمل]
  note: رضي بلقب الشيخ ولو أخذوا بقره؛ يقال لمن يطمع في الجاه ولو خسر ماله.
  source: adimi
  page: 249
  status: draft

- id: s0010
  kind: saying
  prompt: إلى صفت النيه فاللقمه تكفي ___
  answer: ميه
  others: [عشره, ثنتين, سبعه]
  note: إذا صفت القلوب من الأطماع والأحقاد كفى القليل جماعة كبيرة.
  source: juhayman
  page: 259
  volume: ج١
  status: draft

- id: s0011
  kind: saying
  prompt: كتر السلام يقل ___
  answer: المعرفه
  others: [الفلوس, الشغل, الكلام]
  note: الإفراط في الشيء يقلبه إلى ضده.
  source: taymur
  page: 295
  status: draft

- id: s0012
  kind: saying
  prompt: ما صحبه إلا بعد ___
  answer: عركه
  others: [غيبه, ضحكه, نومه]
  note: «العركة» العراك والمشادة؛ لا تقوم صداقة متينة بين اثنين إلا بعد شجار ينشب بينهما.
  source: mughniyya
  page: 486
  status: draft

- id: s0013
  kind: saying
  prompt: لكل طاهش ___
  answer: راهش
  others: [صايد, ناهش, حارس]
  note: الطاهش كل وحش كاسر، والراهش الحشرة السامة القاتلة؛ فلكل كبير مخيف ما يغلبه وقد يكون أصغر منه.
  source: iryani
  page: 591
  status: draft

- id: s0014
  kind: saying
  prompt: ما ينفع الطول والعرض، الآدمي من ___
  answer: فؤاده
  others: [ماله, أصله, ثوبه]
  note: من أمثال علي بن زايد؛ قيمة المرء ليست في ضخامة جسمه بل في قلبه وعقله.
  source: akwa
  page: 1101
  volume: ج٢
  status: draft

- id: s0015
  kind: saying
  prompt: إلصحة كنز ثمين، ما بعرف قيمته إلا ___
  answer: العليل
  others: [الغني, الصغير, التاجر]
  note: لا يعرف قيمة العافية إلا من فقدها.
  source: sahli
  page: 194
  status: draft

- id: s0016
  kind: saying
  prompt: بلحس مسنّي وببات ___
  answer: متهنّي
  others: [متعشّي, متغطّي, متخبّي]
  note: أقنع بالقليل وأنام مرتاح البال.
  source: asadi
  line: 148883
  halab: p811
  status: draft

- id: s0017
  kind: saying
  prompt: وَخَّا تْفَتَّشْ عْلَى هَذْ الشِّي بَالْفْتِيلَه وَ___ مَا تَلْقَاهْ
  answer: الْقَنْدِيلْ
  others: [الْمْكْنْسَه, الْغَرْبَالْ, الْمَنْجَلْ]
  note: ولو بحثت عنه بالفتيلة والقنديل لن تجده. يقال في الشيء النادر الذي يتعزز التاجر ببيعه إلا بأغلى الأثمان.
  source: dadoun
  page: 351
  status: draft

- id: s0018
  kind: saying
  prompt: حلال ___
  answer: نمله
  others: [عصفور, جراده, قطّه]
  note: «الحلال» هنا المال؛ يقال للمال الذي جُمع بمقادير زهيدة، كما تجمع النملة الحبّ حبة حبة.
  source: abboudi_amthal
  page: 418
  volume: ج١
  status: draft

- id: s0019
  kind: saying
  prompt: اللي ما يشقي مع أبوه للظهر يشقي مع الناس ___
  answer: للمغرب
  others: [للعصر, للفجر, للعشاء]
  note: يشقي أي يعمل؛ من كسل عن العون في بيت أهله اضطر إلى عمل أشقّ وأطول عند الغرباء.
  source: adimi
  page: 46
  status: draft

- id: s0020
  kind: saying
  prompt: امشيلها مرتاح ماجابها ___
  answer: ملحاح
  others: [سريع, شاطر, قوي]
  note: «الملحاح» الكثير الإلحاح؛ امشِ إلى رزقك مطمئنًّا فالإلحاح لا يجلبه، في الحث على القناعة.
  source: zanin
  page: 65
  status: draft

- id: s0021
  kind: saying
  prompt: نص الكلام مالوش ___
  answer: جواب
  others: [ثمن, طعم, آخر]
  note: يقال عند سماع كلام لا طائل تحته، فهو لا يستحق الرد.
  source: taymur
  page: 371
  status: draft

- id: s0022
  kind: saying
  prompt: يمنى بلا يسرى تراها ___
  answer: ضعيفه
  others: [نظيفه, شريفه, عفيفه]
  note: اليد اليمنى وحدها ضعيفة. يقال في فوائد التعاون، فالقوي لا يستغني عن عون غيره.
  source: juhayman
  page: 301
  volume: ج٩
  status: draft

- id: s0023
  kind: saying
  prompt: دلع المساكين يقطّع ___
  answer: المصارين
  others: [الهدوم, الشباشب, الستاير]
  note: المصارين هي الأمعاء؛ والمثل يسخر من تكاسل الفقراء وتدللهم وهم أحوج الناس إلى السعي والعمل.
  source: shaalan
  page: 381
  volume: ج٦
  status: draft

- id: s0024
  kind: saying
  prompt: البيت بيت أبونا والناس ___
  answer: بيقلّعونا
  others: [بيزورونا, بيحسدونا, بيسألونا]
  note: يقال حين يُزاحَم صاحب الحقّ في حقّه.
  source: asadi
  line: 135808
  halab: p794
  status: draft

- id: s0025
  kind: saying
  prompt: جحا أكبر وإلا ___؟
  answer: ولده
  others: [خوه, حماره, جاره]
  note: سؤال جوابه بديهي، فالأب أكبر من ابنه؛ يقال في توقير الكبير واحترام تجربته.
  source: mughniyya
  page: 218
  status: draft

- id: s0026
  kind: saying
  prompt: يا حرق فوق ___
  answer: مكوى
  others: [دهن, ثلج, ماء]
  note: المكوى الكي؛ يقال لمن يصاب بنكبة ثم تعقبها نكبة أخرى.
  source: akwa
  page: 1351
  volume: ج٢
  status: draft

- id: s0027
  kind: saying
  prompt: وجه بشوش، ولا صناديق ___
  answer: قروش
  others: [ذهب, حلوى, تفاح]
  note: البشاشة خير من المال الكثير.
  source: sahli
  page: 350
  status: draft

- id: s0028
  kind: saying
  prompt: ايمَارَتْ الدَّارْ عْلَى ___ الدَّارْ
  answer: بَابْ
  others: [سْطَحْ, حِيطْ, وَسْطْ]
  note: أمارات الدار أي علاماتها تظهر على بابها. يقال في الشيء تعرف قيمته أو تفاهته من مظهره الخارجي.
  source: dadoun
  page: 383
  status: draft

- id: s0029
  kind: saying
  prompt: زحمة العيد يا ___
  answer: منخل
  others: [مقص, فرن, مكوه]
  note: في العيد يصنعون الكعك والفطير فتشتد حاجتهم إلى المناخل؛ يقال حين تشتد الحاجة إلى شيء.
  source: taymur
  page: 178
  status: draft

- id: s0030
  kind: saying
  prompt: الإسم كبير والعشاء ___
  answer: قلية
  others: [لحمة, مندي, ثريد]
  note: القلية حبوب تُقلى على النار، وهي طعام رخيص؛ يقال لمن شهرته واسعة وحاله الحقيقي متواضع.
  source: adimi
  page: 22
  status: draft

- id: s0031
  kind: saying
  prompt: ما يموت بالرِّبق إلا عيال ___
  answer: الغنم
  others: [البقر, الحمير, الدجاج]
  note: «الرِّبق» حبل فيه عُرى تُشدّ بها صغار الغنم؛ فالرجل الحر لا يرضى أن يموت مربوطا ذليلا. يقال في إباء الضيم.
  source: abboudi_amthal
  page: 1306
  volume: ج٤
  status: draft

- id: s0032
  kind: saying
  prompt: يخض ماء ويبي ___
  answer: زبده
  others: [عسل, تمر, خبز]
  note: الخض هو التحريك السريع كما يُخض الحليب الرائب لاستخراج الزبدة. يقال لمن يعمل عملا لا ثمرة من ورائه.
  source: juhayman
  page: 222
  volume: ج٩
  status: draft

- id: s0033
  kind: saying
  prompt: القناعة ___ لا يفنى
  answer: كنز
  others: [بحر, بيت, عمر]
  note: الرضا بالقليل غنى لا ينفد.
  source: asadi
  line: 136675
  halab: p1106
  status: draft

- id: s0034
  kind: saying
  prompt: راح العيد و___، رجعنا مثلما كنا
  answer: الحنا
  others: [الكعك, اللحم, الضيوف]
  note: الحنّاء من زينة العيد، فإذا ذهب العيد وزال أثرها عاد الناس إلى حالهم المعتاد.
  source: iryani
  page: 850
  status: draft

- id: s0035
  kind: saying
  prompt: ما بربي الصوص غير ___
  answer: إمه
  others: [أبوه, الديك, صاحبه]
  note: لا يقوم مقام الأم في تربية الأولاد أحد.
  source: sahli
  page: 296
  status: draft

- id: s0036
  kind: saying
  prompt: الكلام شوك ___
  answer: الأكباد
  others: [الطريق, الأقدام, الأيام]
  note: أي إن الكلام المؤلم يؤثر في النفس كما يؤثر الشوك في القدمين.
  source: akwa
  page: 871
  volume: ج٢
  status: draft

- id: s0037
  kind: saying
  prompt: الإيد ___ ما تموتش مكمشه
  answer: السخيه
  others: [القويه, الطويله, الشاطره]
  note: «مكمّشة» مقبوضة؛ الجود طبع أصيل يعيش عليه صاحبه ويموت عليه.
  source: mughniyya
  page: 164
  status: draft

- id: s0038
  kind: saying
  prompt: لحم ___ يكسر سنة الثعلب
  answer: السبع
  others: [الجمل, الحمار, الديك]
  note: تعبير مجازي عن الطبقية؛ فأصحاب القوة والنفوذ لا يقدر عليهم من هم أضعف منهم.
  source: shaalan
  page: 173
  volume: ج٦
  status: draft

- id: s0039
  kind: saying
  prompt: غِيرْ طَابْ صَبُّوهْ؟ خَلِّيهْ ___ شْوِيَّه
  answer: يْبَرْدْ
  others: [يْغْلِي, يْطِيبْ, يْسْخُونْ]
  note: أنضج فصببتموه؟ اتركوه يبرد قليلًا. يقال لمن يتعجل هدفه قبل أن يحين وقته المناسب.
  source: dadoun
  page: 207
  status: draft

- id: s0040
  kind: saying
  prompt: طول الغيبه وجه ___
  answer: بالخيبه
  others: [بالهديه, بالفلوس, بالغنيمه]
  note: يقال لمن يطيل الغياب في طلب أمر ثم يعود بلا شيء، وهو مثل قديم أورده الأبشيهي.
  source: taymur
  page: 235
  status: draft

- id: s0041
  kind: saying
  prompt: اللى ما يذوق قبل الرشوف ينحرقوا ___
  answer: شواربه
  others: [صوابعه, ثيابه, عيونه]
  note: «الرشوف» الطعام السائل الساخن يُرتشف؛ يضرب في الحث على عدم التسرع.
  source: zanin
  page: 50
  status: draft

- id: s0042
  kind: saying
  prompt: فلان كريم لكن من مال ___
  answer: غيرو
  others: [جيبو, تعبو, كيسو]
  note: يُقال فيمن يجود بما لا يملك.
  source: asadi
  line: 142074
  halab: p1321
  status: draft

- id: s0043
  kind: saying
  prompt: أعتك من ___
  answer: اليخني
  others: [الدولمة, الكبة, البرياني]
  note: يُقال في الشيء الموغل في القدم، لأن اليخني عندهم من أقدم الأطعمة، وفي حكاية شعبية أنه أول ما طُبخ لآدم بعد خروجه من الجنة.
  source: hijiyya
  page: 82
  status: draft

- id: s0044
  kind: saying
  prompt: قيراط أمر ولا ألف ___
  answer: مروءة
  others: [دينار, قنطار, صاحب]
  note: قليل من السلطة يفعل ما لا يفعله الكثير من الشهامة؛ فالقوة تنتزع الحق أسرع من اللين.
  source: adimi
  page: 306
  status: draft

- id: s0045
  kind: saying
  prompt: ما تنوب الأقلام عن ___
  answer: الأقدام
  others: [الأعلام, الأحلام, الأرقام]
  note: الرسائل المكتوبة لا تغني عن الزيارة والمجيء بنفسك.
  source: juhayman
  page: 287
  volume: ج١٠
  status: draft

- id: s0046
  kind: saying
  prompt: غالي طلب ___
  answer: رخيص
  others: [قليل, صغير, بعيد]
  note: هو عزيز علينا، وما طلبه هيّن؛ فكيف لا يُجاب؟ يقال في سرعة إجابة الطلب.
  source: abboudi_amthal
  page: 891
  volume: ج٣
  status: draft

- id: s0047
  kind: saying
  prompt: لبس المكنسة، بتصير ست ___
  answer: الحسن
  others: [البيت, الدار, الكل]
  note: الثياب الفاخرة تجمّل حتى المكنسة، والمظهر لا يدل على الجوهر.
  source: sahli
  page: 284
  status: draft

- id: s0048
  kind: saying
  prompt: مطرات التوت بتهدّ ___
  answer: البيوت
  others: [القلوب, الجبال, الجسور]
  note: أمطار موسم التوت في أواخر الربيع غزيرة شديدة.
  source: asadi
  line: 159829
  halab: p820
  status: draft

- id: s0049
  kind: saying
  prompt: نشفت البركه وبانت ___
  answer: زقازيقها
  others: [ضفادعها, حجارتها, طيورها]
  note: الزقازيق صغار السمك. يقال للشيء يزول ما كان يستره فيظهر ما فيه من طيب أو خبيث.
  source: taymur
  page: 371
  status: draft

- id: s0050
  kind: saying
  prompt: من حسب العصافير ما تلم ___
  answer: ذره
  others: [عسل, بن, قات]
  note: يقال في الأخذ بالتوكل؛ فمن خاف أن تأكل العصافير زرعه لن يزرع أبداً.
  source: akwa
  page: 1201
  volume: ج٢
  status: draft

- id: s0051
  kind: saying
  prompt: إلي يحفر حفره ___ مغلاقها
  answer: راسه
  others: [ايده, رجله, ولده]
  note: «مغلاقها» غطاؤها؛ الشر يرتد على صاحبه، فمن نصب فخًّا لغيره وقع فيه.
  source: mughniyya
  page: 140
  status: draft

- id: s0052
  kind: saying
  prompt: اخْدَمْ يَالتَّاعَسْ ___
  answer: لَلنَّاعَسْ
  others: [لَلْفَارَسْ, لَلسَّايَسْ, لَلْحَارَسْ]
  note: اعمل يا تعيس الحظ لينعم النائم. يقال لمن يشقى في عمله ليسعد غيره بثمرة تعبه، ولا يناله هو إلا القليل.
  source: dadoun
  page: 87
  status: draft

- id: s0053
  kind: saying
  prompt: الديك يصيح من ___
  answer: البيضة
  others: [العشة, الفجر, صغره]
  note: النبوغ تظهر علاماته من الصغر؛ يقال للطفل الذكي حين تبدو موهبته مبكرا.
  source: adimi
  page: 41
  status: draft

- id: s0054
  kind: saying
  prompt: أيش ألّف الرباح ماكل ___
  answer: التفاح
  others: [الموز, العنب, التمر]
  note: الرُّبّاح القرود؛ يقال لمن لم يستحسن شيئًا نفيسًا لأنه لم يألفه، أو لمحدث النعمة.
  source: iryani
  page: 339
  status: draft

- id: s0055
