  status: draft

- id: s0062
  kind: saying
  prompt: كل رخيص غالي، وكل غالي ___
  answer: رخيص
  others: [غالي, جميل, نادر]
  note: الرخيص يغلو على صاحبه لرداءته وقصر عمره، والغالي يرخص لجودته وطول بقائه.
