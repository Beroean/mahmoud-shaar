- id: s0275
  kind: saying
  prompt: لا تعتبش على حبيبك، اعتب على ___
  answer: نصيبك
  others: [قلبك, عينك, حالك]
  note: يقال في سوء الحظ، فاللوم على النصيب لا على الحبيب.
  source: sahli
  page: 279
  status: draft

- id: s0276
  kind: saying
  prompt: من ضرب في العيش ضرب في ___
  answer: الجيش
  others: [السوق, الصيد, البحر]
  note: العيش الطعام؛ أي من أكثر من الأكل قوي في القتال، فلا يقوى على المحاربة إلا قوي الجسم.
  source: akwa
  page: 1241
  volume: ج٢
  status: draft

- id: s0277
  kind: saying
  prompt: يدّى الغنى مال ويدّى الفقير ___
  answer: عيال
  others: [جيران, غيطان, بهايم]
  note: سمعه المؤلف من سمكري سيارات، ويقال على سبيل الدهشة من أن الفقراء أكثر الناس أولادًا.
  source: shaalan
  page: 74
  volume: ج٥
  status: draft

- id: s0278
  kind: saying
  prompt: هو يقد من سير ___
  answer: عريض
  others: [قصير, قديم, مقطوع]
  note: يقد أي يقطع، والسير قطعة من الجلد؛ ومن يقطع من سير عريض لا ينفد ما عنده بسرعة. يقال لمن ينفق عن سعة.
  source: juhayman
  page: 118
  volume: ج٩
  status: draft

- id: s0279
  kind: saying
  prompt: إذا كان الكدب بينجّي، ___ أنجى وأنجى
  answer: الصدق
  others: [الحلف, الهرب, الدهب]
  note: إن ظننت الكذب ينجيك فالصدق أنجى.
  source: asadi
  line: 167156
  halab: p838
  status: draft

- id: s0280
  kind: saying
  prompt: شفّ القاضي ولا ألف ___
  answer: شاهد
  others: [قاضي, حاكم, شيخ]
  note: الشفّ الميل؛ فميل القاضي إليك أنفع من ألف شاهد، ومثله «شفّ الحاكم ولا كثر الشهود».
  source: iryani
  page: 500
  status: draft

- id: s0281
  kind: saying
  prompt: تحطه في القرعا تلقاه في ___
  answer: الباذنجان
  others: [الطماطم, الفلفل, البطيخ]
  note: تضعه مع القرع فتجده مع الباذنجان؛ يقال لمن لا يستقر في مكان ولا يثبت على مهنة أو موقف.
  source: mughniyya
  page: 200
  status: draft

- id: s0282
  kind: saying
  prompt: العيش مخبوز والميه في ___
  answer: الكوز
  others: [الزير, القله, الجره]
  note: الخبز جاهز والماء في الكوز، أي أن أسباب الأمر قد تمت ولم يبق إلا البدء.
  source: taymur
  page: 257
  status: draft

- id: s0283
  kind: saying
  prompt: من خلّى المشي خلاّه ___
  answer: المشي
  others: [الحيل, الصحب, الزاد]
  note: من ترك المشي تركه المشي؛ حثّ على الحركة البدنية، فالراحة الطويلة تقعد صاحبها.
  source: abboudi_amthal
  page: 1415
  volume: ج٤
  status: draft

- id: s0284
  kind: saying
  prompt: قبضة بظهر ___
  answer: جمل
  others: [حمار, ثور, حصان]
  note: قبضة صغيرة تؤخذ من حمل جمل؛ يقال للمال الكثير الذي لا ينقصه ما يُنفق منه.
  source: adimi
  page: 304
  status: draft

- id: s0285
  kind: saying
  prompt: مَا عْرَفْتْ تَشْطَحْ قَالَتْ الاَرْضْ ___
  answer: عَوْجَا
  others: [مَبْلُولَه, صْغِيرَه, سْخُونَه]
  note: 'لم تحسن الرقص فقالت: الأرض عوجاء. يقال فيمن لا يعترف بنقصه ويتعلل بأسباب واهية.'
  source: dadoun
  page: 335
  status: draft

- id: s0286
  kind: saying
  prompt: الرمان بملي القلب ___
  answer: إيمان
  others: [أمان, حنان, ألوان]
  note: يذكر فوائد الرمان وأثره الطيب في النفس.
  source: sahli
  page: 162
  status: draft

- id: s0287
  kind: saying
  prompt: الراعي المغفّل بيحبّو ___
  answer: الديب
  others: [الغنم, الكلب, الحليب]
  note: الغافل عن ماله يطمع فيه الطامعون.
  source: asadi
  line: 161298
  halab: p825
  status: draft

- id: s0288
  kind: saying
  prompt: ربك يسويها وصاحبك ___
  answer: يخربها
  others: [يبيعها, يحفظها, ينساها]
  note: الخالق يصلح أمورك، وقد يفسدها عليك صاحبك جهلًا أو حسدًا؛ فالإساءة قد تأتي ممن تنتظر منه العون.
  source: juhayman
  page: 170
  volume: ج٣
  status: draft

- id: s0289
  kind: saying
  prompt: لو اتجر في السليط مازد غربت ___
  answer: الشمس
  others: [النجوم, القمر, الريح]
  note: السليط الزيت؛ لو تاجر في زيت الإسراج لما غابت الشمس فلا يحتاج إليه أحد. يقال في سوء الحظ.
  source: akwa
  page: 981
  volume: ج٢
  status: draft

- id: s0290
  kind: saying
  prompt: امشي يوم ولا تطلع ___
  answer: كوم
  others: [جبل, سلم, سور]
  note: السير يوما في طريق سهل خير من صعود كوم واحد؛ أي لا تجازف وخذ الطريق الآمن.
  source: taymur
  page: 70
  status: draft

- id: s0291
  kind: saying
  prompt: اشرى جارك قبل ___
  answer: دارك
  others: [حوشك, زرعك, حصانك]
  note: اختر جارك قبل أن تشتري البيت.
  source: zanin
  page: 22
  status: draft

- id: s0292
  kind: saying
  prompt: المناياه قبل ___
  answer: المطر
  others: [الحصاد, الصيف, الرحيل]
  note: «المناياه» حفرة قليلة العمق تحاط بها الخيمة لتمنع تسرب ماء المطر إليها؛ الاستعداد للمشكلات يكون قبل حدوثها لا بعده.
  source: mughniyya
  page: 522
  status: draft

- id: s0293
  kind: saying
  prompt: دقّة بالمرزبّة ولا ألف ب___
  answer: الشاكوش
  others: [الإزميل, المنشار, المبرد]
  note: المرزبة مطرقة كبيرة ثقيلة يستعملها الحداد؛ والمعنى أن الحل الحاسم مرة واحدة خير من حلول جزئية كثيرة.
  source: shaalan
  page: 396
  volume: ج٤
  status: draft

- id: s0294
  kind: saying
  prompt: ما ينقر البيضة إلا ___
  answer: ديك
  others: [صوص, غراب, دجاجة]
  note: لكل عمل من يقدر عليه ويحسنه بحسب طاقته.
  source: adimi
  page: 436
  status: draft

- id: s0295
  kind: saying
  prompt: لا قدرك بغلي ولا مقلايتك بتقلي وأنا عدّيت عليكي من قلّة ___
  answer: عقلي
  others: [حظّي, وقتي, خبزي]
  note: يُقال في زيارة من لا يُرجى عنده ضيافة ولا نفع.
  source: asadi
  line: 121274
  halab: p1310
  status: draft

- id: s0296
  kind: saying
  prompt: هَذَا حَالْ الدُّنْيَا، وَاحَدْ كَيْقَلَّبْ عْلَى الْعَزْ، وَاحَدْ تَابَعْ ___
  answer: الْخُبْزْ
  others: [الْجَّاهْ, الشّْهْرَه, الْكُرْسِي]
  note: 'هكذا الدنيا: أحدهم يبحث عن الجاه والشهرة، وآخر يسعى وراء لقمة تسدّ رمقه.'
  source: dadoun
  page: 367
  status: draft

- id: s0297
  kind: saying
  prompt: الغدا الجيّد ___
  answer: يعشّي
  others: [يشبّع, يقوّي, يكفّي]
  note: الغداء الجيد في نوعه ومقداره يكفي صاحبه عن العشاء إذا اضطر إلى تركه.
  source: abboudi_amthal
  page: 894
  volume: ج٣
  status: draft

- id: s0298
  kind: saying
  prompt: دبس بلادي، ولا ___ الأغيار
  answer: سكر
  others: [عسل, خبز, ذهب]
  note: القليل من خير الوطن أحب إلى المرء من كثير الغرباء.
  source: sahli
  page: 146
  status: draft

- id: s0299
  kind: saying
  prompt: ما ضاع من مالك ما ___
  answer: وعظك
  others: [أبكاك, أتعبك, أغضبك]
  note: المال الذي يضيع ويعلّمك درسا لم يضع حقا، فالتجربة تنفعك بقية حياتك.
  source: juhayman
  page: 80
  volume: ج٧
  status: draft

- id: s0300
  kind: saying
  prompt: من حيرك يا ثعيل؟ قال ___
  answer: سبلتي
  others: [ظِلّي, اخويه, جاري]
  note: الثعيل الثعلب والسبلة الذيل؛ فشاهد الثعلب ذيله، أي من يشهد لنفسه بما يخصّه.
  source: iryani
  page: 218
  status: draft

- id: s0301
  kind: saying
  prompt: عمر الطمع ما ___
  answer: جمع
  others: [دام, خسر, فرق]
  note: 'في ذم الطمع، فالطامع لا يجمع شيئا، وفي معناه: الطمع يقل ما جمع.'
  source: taymur
  page: 233
  status: draft

- id: s0302
  kind: saying
  prompt: الصيت للنورة والفعل ___
  answer: للزرنيخ
  others: [للحنة, للصابون, للدلّاك]
  note: «دواء الحمّام» مزيج من النورة والزرنيخ لإزالة الشعر، والنورة يُذكر اسمها لكن الزرنيخ هو الذي يعمل، فيُضرب المثل لمن يأخذ الشهرة وغيره صاحب الفضل.
  source: hijiyya
  page: 94
  status: draft

- id: s0303
  kind: saying
  prompt: مطره في ___
  answer: شتا
  others: [صيف, خريف, ربيع]
  note: لأن اليمن لا تمطر في الشتاء إلا قليلاً، ويقال أيضاً في الشيء يأتي حين لا حاجة إليه.
  source: akwa
  page: 1141
  volume: ج٢
  status: draft

- id: s0304
  kind: saying
  prompt: العلم في الصغر كالنقش ___
  answer: بالحجر
  others: [بالرمل, بالميّ, بالتلج]
  note: ما يتعلّمه المرء صغيراً يثبت ولا يُنسى.
  source: asadi
  line: 117149
  halab: p1094
  status: draft

- id: s0305
  kind: saying
  prompt: القصير يموت وغداه في ___
  answer: الطاقة
  others: [القدر, السوق, الحقل]
  note: الطاقة كوّة في الجدار تُحفظ فيها الأشياء؛ والكسول يحرمه كسله حتى من أقرب ما في يده.
  source: adimi
  page: 120
  status: draft

- id: s0306
  kind: saying
  prompt: العين واسعه و___ ضيقه
  answer: الكيسه
  others: [الدار, الطريق, الخيمه]
  note: «الكيسة» كيس النقود؛ يقال سخرية من البخيل الطماع يشتهي متع الحياة ويتردد في نيلها حرصًا على ماله.
  source: mughniyya
  page: 385
  status: draft

- id: s0307
  kind: saying
  prompt: ما بطلع الزيت إلا من كثر ___
  answer: العصر
  others: [الزتون, الصبر, الدق]
  note: الشدائد تُنضج الرجال كما يُخرج العصرُ الزيت.
  source: sahli
  page: 297
  status: draft

- id: s0308
  kind: saying
  prompt: ___ تْدُورْ عْلِيهْ غِيرْ مَرَّةْ وَحْدَهْ
  answer: الذِّيبْ
  others: [الْحْمَارْ, الْخْرُوفْ, الدّْجَاجَه]
  note: الذئب لا يُخدع إلا مرة واحدة. يقال في أن العاقل لا ينبغي أن يُخدع مرتين من الموضع نفسه.
  source: dadoun
  page: 103
  status: draft

- id: s0309
  kind: saying
  prompt: طلع من نقره ___
  answer: لدحديره
  others: [لطلعه, لسلم, لقنطره]
  note: الدحديرة هي المنحدر في الطريق. يقال لمن تتابع عليه العثرات واحدة بعد أخرى.
  source: taymur
  page: 232
  status: draft

- id: s0310
  kind: saying
  prompt: دوا الغالي ___
  answer: تركه
  others: [شراه, بيعه, خزنه]
  note: إذا تعدى الشيء حدّه في الغلاء فالأحسن مقاطعته حتى يعود إلى حاله الطبيعي.
  source: juhayman
  page: 106
  volume: ج٣
  status: draft

- id: s0311
  kind: saying
  prompt: قال لا تبيع رخيص، قال لا توصّي ___
  answer: حريص
  others: [بخيل, تاجر, غريب]
  note: 'قال أحدهم: لا تبع متاعك رخيصا، فأجابه الآخر: لا توصِ الحريص، فحرصه يكفيه عن الوصية.'
  source: abboudi_amthal
  page: 938
  volume: ج٣
  status: draft

- id: s0312
  kind: saying
  prompt: الذل فى ضعف النفوس وقلة ___
  answer: الفلوس
  others: [الرؤوس, الكؤوس, الدروس]
  note: يرى المثل أن قلة المال قد تذل الإنسان وتضطره إلى قبول ما لا يرضاه، مع ضعف النفس.
  source: shaalan
  page: 276
  volume: ج٢
  status: draft

- id: s0313
  kind: saying
  prompt: بياكل قضامة وبيحكي في ___
  answer: اللاهوت
  others: [الطبخ, السوق, الحارة]
  note: يُقال فيمن حاله بسيطة ويخوض في أعلى المسائل وأعوصها.
  source: asadi
  line: 134279
  halab: p1316
  status: draft

- id: s0314
  kind: saying
  prompt: السر اليا فات ___ انشار
  answer: أثنين
  others: [الباب, الدار, الحيط]
  note: «اليا» إذا؛ السرّ إذا عرفه اثنان انتشر.
  source: zanin
  page: 176
  status: draft

- id: s0315
  kind: saying
  prompt: كل من في مهرته ___
  answer: سلطان
  others: [فقير, غريب, تاجر]
  note: المهرة الحرفة؛ فكل صاحب مهنة لا يُنازَع في ميدانه.
  source: akwa
  page: 861
  volume: ج٢
  status: draft

- id: s0316
  kind: saying
  prompt: بتلة على ثور زاحف خير لي من ___
  answer: تجارة
  others: [وظيفة, سفر, غنيمة]
  note: إشادة بالحراثة؛ فحرث الأرض على ثور بطيء أنفع وأضمن من التجارة.
  source: adimi
  page: 151
  status: draft

- id: s0317
  kind: saying
  prompt: لعب ___ بعبه
  answer: الفار
  others: [القط, الديك, الصوص]
  note: لمن يرتاب ويقلق من أمر غامض.
  source: sahli
  page: 286
  status: draft

- id: s0318
  kind: saying
  prompt: رجعت ريمه لعادتها ___
  answer: القديمه
  others: [الوحشه, الغريبه, الردية]
  note: يقال لمن ترك عادة أو تظاهر بتركها ثم عاد إليها، وأكثر ما يقال في العادات المذمومة.
  source: taymur
  page: 174
  status: draft

- id: s0319
  kind: saying
  prompt: النَّاسْ كَيْتْعَرْفُوا بَالْعْرُوقْ، مَاشِي ___
  answer: بَالْخْرُوقْ
  others: [بَالْفْلُوسْ, بَالدّْيُورْ, بَالسّْمِيَّاتْ]
  note: العروق هي الأصول، والخروق هي الثياب. فالناس يُعرفون بأصلهم وتربيتهم لا بما يلبسون.
  source: dadoun
  page: 343
  status: draft

- id: s0320
  kind: saying
  prompt: أهلك ولا ___
  answer: تهلك
  others: [تتركن, تزعل, تسافر]
  note: الحق بأهلك والزمهم ففيهم نجاتك.
  source: asadi
  line: 172901
  halab: p849
  status: draft

- id: s0321
  kind: saying
  prompt: إذا كنت كذاب فكن ___
  answer: حقّاد
  others: [شاطر, حذر, ساكت]
  note: الحقد في لهجاتهم بمعنى الذكر والتذكّر، فالمثل كقولهم «إذا كنت كذوبًا فكن ذكورًا».
  source: iryani
  page: 186
  status: draft

- id: s0322
  kind: saying
  prompt: خل بلاش أحسن من ___ بفلوس
  answer: العسل
  others: [السمن, الزيت, اللحم]
  note: «بلاش» مجانًا؛ يقال في الشيء الذي يُنال دون جهد أو ثمن.
  source: mughniyya
  page: 253
  status: draft

- id: s0323
  kind: saying
  prompt: نجمع جمع ___ ويفرق بالزبيل
  answer: النملة
  others: [الذيب, الجمل, الريح]
  note: الزبيل وعاء من خوص النخل. نجمع المال قليلا قليلا ثم يأتي من لم يتعب فيه فيبدده بالجملة.
  source: juhayman
  page: 311
  volume: ج٨
  status: draft

- id: s0324
  kind: saying
  prompt: يجوز العيد بلا ___
  answer: حنا
  others: [كحل, عطر, ذهب]
  note: من أمثال النساء؛ كانت عادتهن الاختضاب بالحناء للعيد، فإذا قلن إن العيد يمضي بلا حناء أردن الاستغناء عن الشيء.
  source: abboudi_amthal
  page: 1684
  volume: ج٥
  status: draft

- id: s0325
  kind: saying
  prompt: وفى الراس ___
  answer: الرقبه
  others: [الرجلين, الظهر, اليدين]
  note: أي بعد أن ذهب الرأس لحقته الرقبة، فالمصيبة تتبعها أخرى.
  source: akwa
  page: 1341
  volume: ج٢
  status: draft

- id: s0326
  kind: saying
  prompt: الإنسان لازم ينطر ___
  answer: قفاه
  others: [رزقو, بيتو, كرمو]
  note: على المرء ألّا يترك مجالاً لكلام الناس عنه في غيابه.
  source: asadi
  line: 148055
  halab: p1110
  status: draft

- id: s0327
  kind: saying
  prompt: وأنا أقول ليش حماري ___
  answer: يعرج
  others: [يبرك, يتعب, ينهق]
  note: يقولها من اكتشف فجأة سبب أمر كان يجهله.
  source: adimi
  page: 458
  status: draft

- id: s0328
  kind: saying
  prompt: زى الديك المالطى ___ على مافيش
  answer: ريش
  others: [لحم, بيض, دهن]
  note: الديك المالطي له ريش كثير وجسم ضئيل؛ ويقال لمن مظهره لا يدل على مخبره، ومثله «منفوخ على الفاضي».
  source: shaalan
  page: 183
  volume: ج٥
  status: draft

- id: s0329
  kind: saying
  prompt: في الوش مرايه وفي القفا ___
  answer: سلايه
  others: [نبوت, عصايه, حجر]
  note: السلاية هي الشوكة. يقال لمن يجامل في الحضور ويؤذي في الغياب.
  source: taymur
  page: 273
  status: draft

- id: s0330
  kind: saying
  prompt: بارة على بارة، بتعمل ___
  answer: تجارة
  others: [سيارة, خسارة, حارة]
  note: يحث على الادخار، فالقرش على القرش يصير مالا. والبارة عملة صغيرة قديمة.
  source: sahli
  page: 78
  status: draft

- id: s0331
  kind: saying
  prompt: اللِّي خَمَّمْ يْحْمَاقْ، وَاللِّي حَطْ لَحْمَلْ ___
  answer: يْرْتَاحْ
  others: [يْطِيحْ, يْنْدَمْ, يْتْعَبْ]
  note: من أطال التفكير في مشاكل الحياة جنّ، ومن وضع الحمل استراح. دعوة إلى بذل الجهد ثم التوكل وترك الهمّ.
  source: dadoun
  page: 255
  status: draft

- id: s0332
  kind: saying
  prompt: ما هان أوله كاد ___
  answer: تاليه
  others: [صاحبه, طالبه, حامله]
  note: كاد أي صعب. ما كان أوله سهلا قد يكون آخره شاقا، فخذ للأمور عدتها ولا تغتر بسهولة البدايات.
  source: juhayman
  page: 174
  volume: ج٧
  status: draft

- id: s0333
  kind: saying
  prompt: اللى ما عندهم جرح يلوموا فيك على ___
  answer: البكا
  others: [الضحك, السهر, الكلام]
  note: لا يشعر بالمشكلة إلا صاحبها، أما الآخرون فيستسهلون اللوم.
  source: zanin
  page: 48
  status: draft

- id: s0334
  kind: saying
  prompt: ___ يشيل الزريعه
  answer: الجحش
  others: [الجمل, البغل, الحصان]
  note: «يشيل» يحمل، و«الزريعة» البذور؛ الجحش الصغير لا يقوى إلا على حمل البذور، وهي تتكاثر بعد زرعها، فيضرب للواشي ينقل الأخبار فتكبر.
  source: mughniyya
  page: 218
  status: draft

- id: s0335
  kind: saying
  prompt: بياكل اش ما كان وبضيّق ___
  answer: المكان
  others: [الدرب, الباب, السفرة]
  note: يُقال في الثقيل الذي لا نفع منه، يأكل ما يجد ويزاحم أهل البيت.
  source: asadi
  line: 139192
  halab: p1319
  status: draft

- id: s0336
  kind: saying
  prompt: وجه امكرمش چنه گشر ___
  answer: رگي
  others: [رمان, برتقال, خيار]
  note: تشبيه للوجه المجعّد بقشر الرگّي (البطيخ الأحمر) اليابس.
  source: hijiyya
  page: 118
  status: draft

- id: s0337
  kind: saying
  prompt: ما على الصفا ___
  answer: مبارك
  others: [مراعي, منازل, مشارب]
  note: «الصفا» الحجارة الصلدة، و«مبارك» جمع مبرك؛ الإبل لا تستطيع البروك على الصخر. يقال في عدم الصبر على المقام في المواطن المؤذية.
  source: abboudi_amthal
  page: 1216
  volume: ج٣
  status: draft

- id: s0338
  kind: saying
  prompt: سبع مناخل و___ داخل
  answer: القش
  others: [الرمل, التراب, الحصى]
  note: سبعة مناخل ولا تزال النخالة في الدقيق؛ كثرة العمل بلا إتقان لا تفيد.
  source: taymur
  page: 206
  status: draft

- id: s0339
  kind: saying
  prompt: جوهرة في يد ___
  answer: فحّام
  others: [تاجر, صائغ, ملك]
  note: الشيء الثمين عند من لا يعرف قيمته ولا يستحقه.
  source: adimi
  page: 177
  status: draft

- id: s0340
  kind: saying
  prompt: الكذب يحتاج ___، والصدق فلت ورح لك
  answer: محراس
  others: [معلم, شهود, ميزان]
  note: المحراس المراقبة؛ فالكاذب يحترس حتى لا ينسى ما قاله، أما الصادق فيقول ويمضي.
  source: akwa
  page: 841
  volume: ج٢
  status: draft

- id: s0341
  kind: saying
  prompt: لا توخذ منه غير ___
  answer: الحكي
  others: [الخبز, الدين, السلام]
  note: يقال فيمن يعد ولا يفي، فلا تنال منه إلا الكلام.
  source: sahli
  page: 281
  status: draft

- id: s0342
  kind: saying
  prompt: مجنون تلم في الجبا، مجنون من ___
  answer: كاوفه
  others: [صاحبه, تبعه, جاوره]
  note: كاوف فلان فلانًا أي شاركه في العمل بثوره تحت نير واحد؛ فإن كان الأول مجنونًا فشريكه مجنون أيضًا.
  source: iryani
  page: 786
  status: draft

- id: s0343
  kind: saying
  prompt: الفقع يرخص ___
  answer: اللحم
  others: [الخبز, التمر, الرز]
  note: الفقع هو الكمأة، وفيه طعم اللحم، فإذا كثر انصرف الناس إليه فرخص اللحم؛ يقال للشيء تهبط قيمته بوجود ما ينافسه.
  source: juhayman
  page: 73
  volume: ج٥
  status: draft

- id: s0344
  kind: saying
  prompt: إبْرَه بْلاَ ___
  answer: عَيْنْ
  others: [خِيطْ, رَاسْ, ثَمَنْ]
  note: إبرة بلا ثقب لا يدخلها خيط، فلا نفع فيها. يقال في الشيء الذي لا فائدة منه لأنه يفقد ما يجعله صالحًا للاستعمال.
  source: dadoun
  page: 21
  status: draft

- id: s0345
  kind: saying
  prompt: بحكي لك يا كنّة تتسمعي يا ___
  answer: جارة
  others: [حماة, بنت, خالة]
  note: يُوجَّه الكلام إلى شخص والمقصود به غيره.
  source: asadi
  line: 145635
  halab: p809
  status: draft

- id: s0346
  kind: saying
  prompt: تراعينى قيراط أراعيك ___
  answer: قيراطين
  others: [فدانين, شبرين, ذراعين]
  note: يحث المثل على حسن المعاملة وتبادل المصالح؛ فمن يرعاك قليلًا ترعاه أكثر. وقد دخل في أغنية لمحمد عبد الوهاب.
  source: shaalan
  page: 96
  volume: ج٢
  status: draft

- id: s0347
  kind: saying
  prompt: ما تخشش لبيتك إلا القمح و___
  answer: الشعير
  others: [الفول, العدس, الحمص]
  note: القمح والشعير يصلحان للتخزين، أما الحبوب الأخرى كالفول والعدس فيصيبها السوس إذا خُزنت طويلًا.
  source: mughniyya
  page: 480
  status: draft

- id: s0348
  kind: saying
  prompt: جفن العين جراب ما يملاه إلا ___
  answer: التراب
  others: [الدهب, الكحل, المال]
  note: لا يملأ عين ابن آدم إلا التراب؛ في الحرص المركّب في طبع الإنسان.
  source: taymur
  page: 128
  status: draft

- id: s0349
  kind: saying
  prompt: ما حد يربي له حنش بالجيب يصبح له ___
  answer: غريم
  others: [صاحب, حارس, خادم]
  note: الحنش الثعبان؛ تحذير من أن بعض من تحسن إليهم قد يصبحون أعداءك.
  source: adimi
  page: 403
  status: draft

- id: s0350
  kind: saying
  prompt: أجت عنزة الثنية تعلم إمها ___
  answer: الرعية
  others: [المشية, النطاح, الحلبة]
  note: يقال حين يحاول قليل الخبرة أن يعلّم من سبقه بالتجربة؛ فالعنزة الصغيرة لا تعلّم أمها الرعي.
  source: sahli
  page: 20
  status: draft

- id: s0351
  kind: saying
  prompt: كنّه على ___
  answer: جمر
  others: [شوك, ثلج, رمل]
  note: «كنّه» أي كأنه؛ يقال للمستعجل الذي لا يقرّ له قرار، كأنه جالس على الجمر.
  source: abboudi_amthal
  page: 1071
  volume: ج٣
  status: draft

- id: s0352
  kind: saying
  prompt: اللى ما عنده ___ كذاب
  answer: شاهد
  others: [مال, أهل, ولد]
  note: يضرب في تقديم تصديق من له شاهد على من لا شاهد له.
  source: zanin
  page: 47
  status: draft

- id: s0353
  kind: saying
  prompt: ما خبز في الديمه بدا على ___
  answer: الضيفان
  others: [الصبيان, الحيطان, الدجاج]
  note: الديمة المطبخ؛ أي إن ما يحدث داخل البيت ينتشر بين الناس.
  source: akwa
  page: 1031
  volume: ج٢
  status: draft

- id: s0354
  kind: saying
  prompt: لا أكل إلا أكل اللحم ولا نار إلا نار ___
  answer: الفحم
  others: [الحطب, الشمع, التبن]
  note: خير الطعام اللحم وخير النار نار الفحم.
  source: asadi
  line: 166181
  halab: p836
  status: draft

- id: s0355
  kind: saying
  prompt: مثل التمر غذا و___
  answer: فاكهه
  others: [لحم, شراب, عشا]
  note: التمر لذيذ سهل الهضم لا يحتاج إلى طبخ، فهو طعام وفاكهة معا، بل ويُتداوى به.
  source: juhayman
  page: 306
  volume: ج١٠
  status: draft

- id: s0356
  kind: saying
  prompt: مْنَايَنْ كَتْشْبَعْ الْكَرْشْ كَتْقُولْ لَلرَّاسْ ___
  answer: غَنِّ
  others: [نْعَسْ, فَكَّرْ, اخْدَمْ]
  note: 'إذا شبعت البطن قالت للرأس: غنِّ. فالجائع ضيق النفس، فإذا أكل انشرح صدره وطرب.'
  source: dadoun
  page: 319
  status: draft

- id: s0357
  kind: saying
  prompt: الطينه من الطينه واللته من ___
  answer: العجينه
  others: [الدقيق, الفرن, الخميره]
  note: اللتة قطعة من العجين. يقال في شبه الشيء بأصله، والأبناء بأهلهم.
  source: taymur
  page: 235
  status: draft

- id: s0358
  kind: saying
  prompt: تاجر و___ ما بيصير
  answer: منجّم
  others: [معلّم, شاطر, غني]
  note: التاجر لا يعلم الغيب، فالربح والخسارة لا يُعرفان سلفاً.
  source: asadi
  line: 164003
  halab: p831
  status: draft

- id: s0359
  kind: saying
  prompt: اللقف المبتم ما يدخلوش ___
  answer: الذباب
  others: [الطعام, الماء, الهواء]
  note: اللقف هو الفم والمبتم المطبق؛ فالفم المغلق لا يدخله الذباب، أي في الصمت سلامة.
  source: adimi
  page: 133
  status: draft

- id: s0360
  kind: saying
  prompt: كثرة الجراد يرخص ___
  answer: اللحم
  others: [الخبز, التمر, الزيت]
  note: كثرة عرض سلعة ولو رديئة يرخص سعر نظيرتها الجيدة.
  source: mughniyya
  page: 432
  status: draft

- id: s0361
  kind: saying
  prompt: الشط أكبر من ___
  answer: الرقعه
  others: [الثوب, الخيط, الإبره]
  note: الشطّ الخرق في الثوب؛ يقال حين يتفاقم الأمر فلا يكفي إصلاحه.
  source: iryani
  page: 491
  status: draft

- id: s0362
  kind: saying
  prompt: سلاح الضعيف ___
  answer: الشكاية
  others: [العصا, الحجر, الهرب]
  note: الضعيف لا يقدر إلا على الشكوى.
  source: sahli
  page: 177
  status: draft

- id: s0363
  kind: saying
  prompt: الشُّكك ممنوع والزعل ___ والرزق على الله
  answer: مرفوع
  others: [مدفوع, موجود, مسموح]
  note: عبارة يكتبها أصحاب الدكاكين الصغيرة على محلاتهم؛ والشكك هو البيع بالأجل، فلا بيع إلا نقدًا ولا داعي للزعل.
  source: shaalan
  page: 118
  volume: ج٦
  status: draft

- id: s0364
  kind: saying
  prompt: مال البخيل ياكله ___
  answer: العيار
  others: [الضيف, الجار, الطير]
  note: العيار هو المحتال المتملق. البخيل يجمع ماله بالقليل وبالمشقة، ثم يذهب جملة إلى المحتالين.
  source: juhayman
  page: 138
  volume: ج٧
  status: draft

- id: s0365
  kind: saying
  prompt: الدهر ___، وابن آدم معلمي
  answer: فقيه
  others: [قاضي, شيخ, والد]
  note: الفقيه هنا معلم الصبيان والمعلمي تلميذه؛ أي إن الزمان معلم والإنسان تلميذ عنده.
  source: akwa
  page: 497
  volume: ج١
  status: draft

- id: s0366
  kind: saying
  prompt: اللِّي نْفَخْ فَى اللّْبَنْ ___
  answer: يْشْتَاقُه
  others: [يْشْرْبُه, يْبَرْدُه, يْكْبُّه]
  note: من نفخ في اللبن متأففًا منه حين كثر سيشتاق إليه. من أمثال البادية فيمن لا يعرف قيمة الشيء حتى يفقده.
  source: dadoun
  page: 295
  status: draft

- id: s0367
  kind: saying
  prompt: الياس ___
  answer: رحمه
  others: [هلاك, عذاب, عيب]
  note: اليأس يريح صاحبه من تعب الانتظار وعناء التطلع؛ والمثل قديم الأصل.
  source: abboudi_amthal
  page: 1640
  volume: ج٥
  status: draft

- id: s0368
  kind: saying
  prompt: على قد ___ مد رجلك
  answer: حجلك
  others: [جيبك, بيتك, شبرك]
  note: 'الحجل هنا الخلخال، ويروى أيضا: على قد لحافك. في النهي عن تجاوز المرء حده.'
  source: taymur
  page: 247
  status: draft

- id: s0369
  kind: saying
  prompt: شافوا القبّة من بعيد حسبوا ___
  answer: مزار
  others: [جبل, خيمة, بطّيخة]
  note: يُقال فيمن ينخدع بالمظهر فيظنّ بالشيء العاديّ الجلال والبركة.
  source: asadi
  line: 156719
  halab: p1315
  status: draft

- id: s0370
  kind: saying
  prompt: أوله شرط آخره ___
  answer: سلامة
  others: [ربح, خسارة, عتاب]
  note: يضرب في الحث على توضيح الشروط في العقود منذ البداية.
  source: zanin
  page: 71
  status: draft

- id: s0371
  kind: saying
  prompt: أوّل العصيد ___
  answer: ماء
  others: [دقيق, سمن, نار]
  note: العصيد طبخة يمنية من دقيق يُعجن بالماء ثم يُطهى على النار؛ فكل شيء كبير يبدأ صغيرا.
  source: adimi
  page: 75
  status: draft

- id: s0372
  kind: saying
  prompt: دبر ___ قبل الغنم
  answer: الراعي
  others: [الكلب, الحلاب, الجزار]
  note: أعدّ للأمر عدته قبل أن تبدأ به، وابدأ بالأهم.
  source: sahli
  page: 146
  status: draft

- id: s0373
  kind: saying
  prompt: ما كل حمرا ___
  answer: لحمه
  others: [ورده, جمره, خوخه]
  note: ليس كل ما لونه أحمر لحما، فالأشياء قد تتشابه في الشكل وتختلف في حقيقتها ونفعها.
  source: juhayman
  page: 123
  volume: ج٧
  status: draft

- id: s0374
  kind: saying
  prompt: وين خلاك بوك خلاه ___
  answer: جدك
  others: [خوك, عمك, ولدك]
  note: «خلاك» تركك؛ يرى المثل أن الإنسان يبقى عبر الأجيال في المنزلة الاجتماعية التي كان فيها أبوه وجده.
  source: mughniyya
  page: 546
  status: draft

- id: s0375
  kind: saying
  prompt: يمّه المره عرگ ___
  answer: ثيّل
  others: [نخل, ورد, شوك]
  note: الثيّل عشب تمتد جذوره وتتشعب، والمعنى أن الزوجة توسّع دائرة الأقارب والأنساب.
  source: hijiyya
  page: 33
  status: draft

- id: s0376
  kind: saying
  prompt: غير نصيبك ما ___
  answer: بيصيبك
  others: [بيعيبك, بيجيبك, بيطيبك]
  note: لن ينالك إلا ما قُسم لك.
  source: asadi
  line: 168941
  halab: p842
  status: draft

- id: s0377
  kind: saying
  prompt: ديل الكلب عمره ما ___
  answer: ينعدل
  others: [يتقطع, يطول, يقصر]
  note: 'من طُبع على الاعوجاج لا يستقيم، ويزيد أهل الريف: ولو علّقت فيه قالبا.'
  source: taymur
  page: 169
  status: draft

- id: s0378
  kind: saying
  prompt: راس الشيبه أوكى ___
  answer: للنطاح
  others: [للحمل, للكلام, للصبر]
  note: أوكى أي أصلب؛ فالكبير بخبرته يغلب الشاب الغر في الحجة.
  source: akwa
  page: 517
  volume: ج١
  status: draft

- id: s0379
  kind: saying
  prompt: لَبْحَرْ الدَّاخْلُه مَفْقُودْ، وَالْخَارْجُه ___
  answer: مَوْلُودْ
  others: [مَحْظُوظْ, مَبْلُولْ, مَسْعُودْ]
  note: الداخل إلى البحر كالمفقود، والخارج منه كأنه ولد من جديد. يقال في خطر البحر عند هيجان أمواجه.
  source: dadoun
  page: 279
  status: draft

- id: s0380
  kind: saying
  prompt: الفضيحة ___ مش فعل
  answer: كلام
  others: [صورة, نظرة, ورقة]
  note: الفعل السيئ لا يصير فضيحة حتى يتناقله الناس؛ فأساس الفضيحة هو انتقال الكلام من مكان إلى آخر.
  source: shaalan
  page: 390
  volume: ج١
  status: draft

- id: s0381
  kind: saying
  prompt: هوا في ___
  answer: شبك
  others: [قربه, جرّه, كيس]
  note: أي كالهواء في الشبكة لا تمسك منه شيئا؛ يقال لما يذهب هباء ولا حاصل له.
  source: abboudi_amthal
  page: 1607
  volume: ج٤
  status: draft

- id: s0382
  kind: saying
  prompt: تدبير ديمه ولا تاجر ___
  answer: عدن
  others: [صنعا, الهند, مكه]
  note: الدّيمة المطبخ؛ فحسن تدبير المرأة في مطبخها خير من حال تاجر غني كان يستورد من عدن.
  source: iryani
  page: 321
  status: draft

- id: s0383
  kind: saying
  prompt: تكلّمه رطل ما يفهمش ___
  answer: وقية
  others: [مثقال, كلمة, حبة]
  note: الوقية جزء صغير من الرطل؛ يقال لمن لا يعير الكلام اهتماما مهما أطلت عليه.
  source: adimi
  page: 161
  status: draft

- id: s0384
  kind: saying
  prompt: خبز و___، ولا المنية
  answer: دقة
  others: [جبنة, زيتون, لبنة]
  note: الخبز والدقة على بساطتهما مع عزة النفس خير من ذل الاستجداء.
  source: sahli
  page: 137
  status: draft

- id: s0385
  kind: saying
  prompt: كل عند أمه رجال مير الخلا ___
  answer: غرباله
  others: [ميزانه, مرآته, شاهده]
  note: كل ابن رجل في عين أمه، لكن السفر والصحراء ومخاطرها هي التي تغربل الرجال فتكشف الشجاع من الجبان.
  source: juhayman
  page: 103
  volume: ج٦
  status: draft

- id: s0386
  kind: saying
  prompt: أبو كشكول ما بحبّ أبو ___
  answer: مخلاية
  others: [طربوش, سيف, دكّان]
  note: صاحب الحرفة يكره من ينافسه فيها، فالشحّاد حامل الكشكول لا يحبّ الشحّاد حامل المخلاة.
  source: asadi
  line: 142940
  halab: p1322
  status: draft

- id: s0387
  kind: saying
  prompt: بالوعد أسقيك يا ___
  answer: كمون
  others: [ريحان, نعناع, ورد]
  note: زعموا أن الكمون يكتفي بالوعد بالسقي؛ يقال لمن يكثر الوعود ولا يفي بها.
  source: taymur
  page: 113
  status: draft

- id: s0388
  kind: saying
  prompt: الشعير يدور يدوز ويولي لقلب ___
  answer: الرحى
  others: [السوق, الشوال, الجره]
  note: «يولي» يعود؛ مهما دار الشعير فمصيره الطاحونة، كما أن الظالم مهما تجبر فمصيره إلى زوال.
  source: mughniyya
  page: 325
  status: draft

- id: s0389
  kind: saying
  prompt: مَا تْقُولْ عَشْرَه حَتَّى يْكُونُوا فَى ___
  answer: التَّلِّيسْ
  others: [الْيَدّْ, الدَّارْ, السُّوقْ]
  note: 'التليس كيس من صوف خشن يحمل فيه البدو مؤونتهم. لا تقل عشرة حتى تصير في كيسك. ويروى أيضًا: حتى يكونوا في الكف.'
  source: dadoun
  page: 319
  status: draft

- id: s0390
  kind: saying
  prompt: العز واسقوني نقيع ___
  answer: الحنظل
  others: [الزبيب, الصبر, البن]
  note: من أمثال صرواح؛ يقال في إباء الضيم، فالمرارة مع العز خير من الحلاوة مع الذل.
  source: akwa
  page: 711
  volume: ج٢
  status: draft

- id: s0391
  kind: saying
  prompt: اللى قارصاته لفعى يتخايل من ___
  answer: الحبال
  others: [الحجر, الريح, الدخان]
  note: من لدغته أفعى صار يخاف كلّ ما يشبهها.
  source: zanin
  page: 45
  status: draft

- id: s0392
  kind: saying
  prompt: العمر بيخلص و___ ما بيخلص
  answer: الشغل
  others: [الصيف, العيد, المال]
  note: مشاغل الدنيا لا تنتهي، فلا تُفنِ عمرك فيها.
  source: asadi
  line: 64698
  halab: p1116
  status: draft

- id: s0393
  kind: saying
  prompt: إذا كثر اللحم قالوا لحم ___
  answer: حمار
  others: [كلب, ثعلب, غراب]
  note: إذا كثر الشيء وتوفر بلا مقابل استخف به الناس وزهدوا فيه.
  source: adimi
  page: 91
  status: draft

- id: s0394
  kind: saying
  prompt: تقديم الأجره من بطلان ___
  answer: العمل
  others: [الحق, الوعد, الكسب]
  note: نهي عن إعطاء الأجير أجره قبل إتمام عمله، لأن ذلك قد يذهب بما يحفزه على إتقانه.
  source: abboudi_amthal
  page: 319
  volume: ج١
  status: draft

- id: s0395
  kind: saying
  prompt: ما بطلع من دار المطبلين غير ___
  answer: المزمرين
  others: [الراقصين, النايمين, الشحادين]
  note: الأبناء يكونون على شاكلة أهلهم.
  source: sahli
  page: 298
  status: draft

- id: s0396
  kind: saying
  prompt: لا تشرب من بير وترمي فيه ___
  answer: حجر
  others: [ملح, عظم, عود]
  note: لا تسئ إلى من أحسن إليك، فمقابلة المعروف بالأذى من أخس الطباع.
  source: juhayman
  page: 212
  volume: ج٦
  status: draft

- id: s0397
  kind: saying
  prompt: إن عوى ___ إدّى له ظهرك
  answer: الكلب
  others: [الديب, الغراب, الحمار]
  note: لا تنشغل بمن يسيء إليك، بل أعرض عنه وامضِ؛ وفي معناه «ابعد عن الشر وغنّي له».
  source: shaalan
  page: 242
  volume: ج٢
  status: draft

- id: s0398
  kind: saying
  prompt: كل مصه ما تجي إلا ___
  answer: بغصه
  others: [بعضه, بقرصه, بلقمه]
  note: لا ينال الإنسان لذة إلا مشوبة بشيء من الكدر.
  source: taymur
  page: 305
  status: draft

- id: s0399
  kind: saying
  prompt: كُلْ زْبِيبَه فِى رَاسْهَا ___
  answer: عُودْ
  others: [حْلاَوَه, نْوَاه, عْسَلْ]
  note: لكل زبيبة عود في رأسها. أي لا يخلو إنسان من عيب أو نقص أو مشكلة، وإن اختلفت بحسب ظروفه.
  source: dadoun
  page: 231
  status: draft

- id: s0400
  kind: saying
  prompt: قال له بوك شنو عقبلك؟ قال له ___ وماتت
  answer: عنزه
  others: [ناقه, بقره, فرس]
  note: «شنو عقبلك» ماذا ترك لك؛ يقال سخرية من الفقير الذي لا يُرتجى منه خير ولا نفع.
  source: mughniyya
  page: 408
  status: draft

- id: s0401
  kind: saying
  prompt: مكّة على عاشقا ماهي ___
  answer: بعيدة
  others: [غالية, صعبة, حامية]
  note: المحبّ لا يستبعد الطريق إلى ما يحبّ.
  source: asadi
  line: 162621
  halab: p828
  status: draft

- id: s0402
  kind: saying
  prompt: السراج المطفطف ولا ___
  answer: الغدره
  others: [الشمعه, القمره, النار]
  note: طفطفة السراج اضطراب شعلته وتقطّع ضوئه، والغدرة الظلمة؛ فالضوء الضعيف خير من الظلام.
  source: iryani
  page: 588
  status: draft

- id: s0403
  kind: saying
  prompt: ما خبزته ___
  answer: خديته
  others: [بعته, نسيته, رميته]
  note: خدى الخبز أخذه من جدار التنور؛ فالمرء يجد نتائج عمله خيراً كان أو شراً.
  source: akwa
  page: 1031
  volume: ج٢
  status: draft

- id: s0404
  kind: saying
  prompt: قد قرصك بين ___
  answer: السمن
  others: [الطحين, الماء, الرماد]
  note: القرص رغيف الخبز؛ يقال لمن نشأ في سعة وغنى فلا يعرف التعب في تحصيل حاجته.
  source: adimi
  page: 308
  status: draft

- id: s0405
  kind: saying
  prompt: عدل ___ قبل ما تنزل البحر
  answer: سفينتك
  others: [ثيابك, شبكتك, مجدافك]
  note: استعد للأمر قبل أن تدخل فيه.
  source: sahli
  page: 214
  status: draft

- id: s0406
  kind: saying
  prompt: هدية القرفان ___
  answer: لمونه
  others: [سكر, نعناع, قهوه]
  note: القرفان من يعاف الطعام فيتداوى بالليمون، فإذا أهدى أهدى الليمون؛ الهدية على قدر ما يراه المهدي.
  source: taymur
  page: 374
  status: draft

- id: s0407
  kind: saying
  prompt: فر من المطر ووقف تحت ___
  answer: المرزام
  others: [الخيمة, الشجرة, الجدار]
  note: المرزام هو الميزاب؛ يقال لمن يهرب من شدة فيقع فيما هو أشد منها.
  source: juhayman
  page: 61
  volume: ج٥
  status: draft

- id: s0408
  kind: saying
  prompt: إكنسي بيتك ___، واغسلي رجلك تصغر
  answer: يكبر
  others: [يلمع, يضحك, يطيب]
  note: 'من وصايا العجائز لبناتهن: البيت الصغير إذا كُنس ورُتّب بدا واسعا، والقدم الكبيرة إذا نُظّفت بدت صغيرة لطيفة.'
  source: abboudi_amthal
  page: 132
  volume: ج١
  status: draft

- id: s0409
  kind: saying
  prompt: 'قلنا لك: قمّرو، ما قلنا لك: ___'
  answer: احرقو
  others: [عجنو, بلّو, قطّعو]
  note: يُقال فيمن يُطلب منه الشيء باعتدال فيبالغ فيه حتى يفسده، والتقمير تحميص الخبز.
  source: asadi
  line: 136386
  halab: p1317
  status: draft

- id: s0410
  kind: saying
  prompt: أن كنت ___ تبّع الغرزة
  answer: خياط
  others: [نجار, حداد, بنّاي]
  note: يضرب في الحث على التكيّف مع الأحوال.
  source: zanin
  page: 67
  status: draft

- id: s0411
  kind: saying
  prompt: خبصه عبالك حمّام ___
  answer: نسوان
  others: [رجال, السوق, عرس]
  note: يُقال للمكان الصاخب المضطرب كثير الضجيج، تشبيهًا بحمّام النساء الذي يمتلئ بالأصوات والحركة.
  source: hijiyya
  page: 118
  status: draft

- id: s0412
  kind: saying
  prompt: هْبِيرَه فِيهَا ___
  answer: عْظَمْ
  others: [شْحَمْ, مْلَحْ, دْهَنْ]
  note: الهبيرة قطعة لحم صافية، وفيها مع ذلك عظم. يقال لمن نال ما يحبه لكنه لا يخلو من نقص أو عيب.
  source: dadoun
  page: 367
  status: draft

- id: s0413
  kind: saying
  prompt: الأقارب ___
  answer: كالعقارب
  others: [كالسحايب, كالكواكب, كالحبايب]
  note: مثل مسجوع يقوله من يشكو أذى أقاربه؛ فهم في رأيه يلدغون كما تلدغ العقارب.
  source: shaalan
  page: 110
  volume: ج١
  status: draft

- id: s0414
  kind: saying
  prompt: بين السترة والكشفة محط ___
  answer: صبعين
  others: [ذراع, ميل, يوم]
  note: «صبعين» إصبعين؛ المسافة بين الستر والفضيحة، أو بين النجاح والفشل، قصيرة جدًّا.
  source: mughniyya
  page: 194
  status: draft

- id: s0415
  kind: saying
  prompt: الجار جار، ولو راجمك ___
  answer: بالحجار
  others: [بالكلام, بالعصا, بالتراب]
  note: يحث على احتمال أذى الجار والصبر على إساءته.
  source: akwa
  page: 357
  volume: ج١
  status: draft

- id: s0416
  kind: saying
  prompt: بكرة يدوب التلج ويبان ___
  answer: المرج
  others: [الطين, الزرع, الطريق]
  note: كل مستور سيظهر حين يزول ما يغطيه، كما يظهر المرج بعد ذوبان الثلج.
  source: taymur
  page: 109
  status: draft

- id: s0417
  kind: saying
  prompt: خلّي من شبعك ___
  answer: لجوعك
  others: [لضيفك, لجارك, لعيالك]
  note: لا ترمِ ما زاد عن حاجتك، بل احفظه لوقت تحتاج إليه.
  source: adimi
  page: 205
  status: draft

- id: s0418
  kind: saying
  prompt: إلضيف أول ليلة قنديل، ثاني ليلة منديل، ثالث ليلة ___
  answer: رزيل
  others: [جليل, قليل, دليل]
  note: الضيف عزيز في أول أيامه، ثم يثقل كلما طالت إقامته.
  source: sahli
  page: 201
  status: draft

- id: s0419
  kind: saying
  prompt: من كثر النار على قرصه ___
  answer: احترق
  others: [انتفخ, طاب, لان]
  note: القرص هو رغيف الخبز. الإفراط كالتفريط كلاهما مضر، والعجلة والطمع يفسدان ما يُراد إصلاحه.
  source: juhayman
  page: 221
  volume: ج٨
  status: draft

- id: s0420
  kind: saying
  prompt: 'وقت الشوي واليخني ما قلت: يا خيّو ___'
  answer: الحقني
  others: [اسمعني, سامحني, علّمني]
  note: يُقال لمن ينساك في الرخاء ولا يتذكّرك إلا في الشدّة.
  source: asadi
  line: 148941
  halab: p1324
  status: draft

- id: s0421
  kind: saying
  prompt: النوم ___
  answer: عافيه
  others: [راحه, سلطان, غنيمه]
  note: النوم دليل على العافية؛ يقال للمريض إذا منعه مرضه من النوم ثم نام.
  source: abboudi_amthal
  page: 1533
  volume: ج٤
  status: draft

- id: s0422
  kind: saying
  prompt: خلوفة الحيه ___
  answer: عقارب
  others: [ثعابين, حنشان, جراد]
  note: ليس المراد أن الحية تلد عقارب، بل أن سيئًا حلّ محل سيئ.
  source: iryani
  page: 245
  status: draft

- id: s0423
  kind: saying
  prompt: يَا مْسْتَرْخَصْ اللّْحَمْ، عَنْدْ ___ تَنْدَمْ
  answer: لَمْرَقْ
  others: [الْجَّزَّارْ, الْبَابْ, الصّْبَاحْ]
  note: يا من اشترى اللحم الرخيص، ستندم حين تذوق المرق. ينبغي اختيار الجودة في كل ما تشتريه.
  source: dadoun
  page: 391
  status: draft

- id: s0424
  kind: saying
  prompt: القفه اللي لها ودنين يشيلوها ___
  answer: اتنين
  others: [تلاته, عيلين, رجالة]
  note: القفة ذات المقبضين يحملها اثنان بسهولة؛ يقال للأمر المتقن الذي فيه ما يعين على القيام به.
  source: taymur
  page: 290
  status: draft

- id: s0425
  kind: saying
  prompt: الغضب أوّلو جنون وآخرو ___
  answer: ندامة
  others: [سلامة, كرامة, شهامة]
  note: الغضب يبدأ بفقدان الصواب وينتهي بالندم.
  source: asadi
  line: 121049
  halab: p1097
  status: draft

- id: s0426
  kind: saying
  prompt: جودة الراي، أحسن من مضاوة ___
  answer: السيف
  others: [الرمح, الخنجر, الفاس]
  note: الرأي السديد أنفع من القوة وحدة السلاح.
  source: sahli
  page: 121
  status: draft

- id: s0427
  kind: saying
  prompt: قطع الراس ولا قطع ___
  answer: المعاش
  others: [الرحم, الطريق, الكلام]
  note: قطع الرزق أشد من الموت عند صاحبه؛ ويقال لمن يسعى في قطع أرزاق الناس.
  source: adimi
  page: 305
  status: draft

- id: s0428
  kind: saying
  prompt: قال يا جود الصقر قال نطيحه ___
  answer: أرنب
  others: [ذيب, نسر, عقاب]
  note: النطيح هو الخصم، وشجاعة الصقر على الأرنب الضعيف ليست شجاعة؛ فالشجاعة الحقيقية على الأنداد.
  source: juhayman
  page: 268
  volume: ج٥
  status: draft

- id: s0429
  kind: saying
  prompt: الشيب ولا ___
  answer: العيب
  others: [الشباب, السواد, الصبا]
  note: من أمثال صرواح؛ أي إن الشيب أخف ضرراً من العيب.
  source: akwa
  page: 627
  volume: ج١
  status: draft

- id: s0430
  kind: saying
  prompt: إلي إيده في ___ موش كيف إلي إيده في الما
  answer: النار
  others: [الطين, العجين, الصابون]
  note: «الما» الماء؛ من يكابد المشقة ليس كمن يتفرج عليها مرتاحًا.
  source: mughniyya
  page: 104
  status: draft

- id: s0431
  kind: saying
  prompt: خيخة وسكينة ما تقطعش ___
  answer: بطيخة
  others: [عيش, جبنة, لحمة]
  note: الخيخة هو ضعيف الشخصية؛ والمثل يسخر ممن لا يصلح لأي شيء كالسكين التي لا تقطع.
  source: shaalan
  page: 182
  volume: ج٥
  status: draft

- id: s0432
  kind: saying
  prompt: أنا أمير وانت أمير ومن يسوق ___
  answer: الحمير
  others: [الجمال, الغنم, الخيل]
  note: إذا ادّعى الجميع الإمارة فمن يقوم بالعمل؟
  source: zanin
  page: 67
  status: draft

- id: s0433
  kind: saying
  prompt: النقطة الدايمة بتعلّم في ___
  answer: الحجر
  others: [البحر, الورق, الرمل]
  note: المثابرة تؤثّر في أصلب الأشياء.
  source: asadi
  line: 170200
  halab: p845
  status: draft

- id: s0434
  kind: saying
  prompt: زي الطبل صوت عالي وجوف ___
  answer: خالي
  others: [واسع, غالي, ضيق]
  note: يقال للثرثار الذي يكثر الكلام ولا شيء وراءه.
  source: taymur
  page: 193
  status: draft

- id: s0435
  kind: saying
  prompt: دخّانها ولا هبوب ___
  answer: شمالها
  others: [مطرها, بردها, ليلها]
  note: 'كانوا يوقدون النار في الشتاء اتقاء برد ريح الشمال، فإذا تضايق أحدهم من الدخان قيل له: الدخان أهون من البرد.'
  source: abboudi_amthal
  page: 505
  volume: ج٢
  status: draft

- id: s0436
  kind: saying
  prompt: كُلْ كَنْزْ عْلِيهْ ___
  answer: عَفْرِيتْ
  others: [قْفَلْ, حَارَسْ, سَارَقْ]
  note: لكل كنز عفريت يحرسه. يقال لمن يريد مشروعًا مربحًا فيجد غيره قد سبقه إليه، فليتوقع المنافسة قبل أن يبدأ.
  source: dadoun
  page: 231
  status: draft

- id: s0437
  kind: saying
  prompt: لابس ثوب ___ عريان
  answer: الريا
  others: [الحرير, العيد, الصوف]
  note: المرائي وإن تجمل بالظاهر فهو مكشوف.
  source: sahli
  page: 278
  status: draft

- id: s0438
  kind: saying
  prompt: صلح أعوج ولا ___ سابر
  answer: شريعة
  others: [صحبة, بيعة, ضيفة]
  note: سابر أي صالح؛ صلح فيه عوج خير من خصومة في المحاكم ولو كانت عادلة.
  source: adimi
  page: 261
  status: draft

- id: s0439
  kind: saying
  prompt: وش علم الحمير أكل ___
  answer: الزنجبيل
  others: [الشعير, التبن, البرسيم]
  note: وش علم أي من علّم. الزنجبيل شيء طيب لم يُخلق للحمير؛ يقال لمن يُعطى شيئا لا يستحقه ولا يحسن التصرف فيه.
  source: juhayman
  page: 39
  volume: ج٩
  status: draft

- id: s0440
  kind: saying
  prompt: افتح بابك واشتهر، والا اقفله ___
  answer: واستتر
  others: [واختفي, وانتظر, واصبر]
  note: إن فتحت بيتك لضيافة الناس فلا تبخل عليهم بشيء، وإن عجزت فإغلاق الباب أسلم ولا لوم عليك.
  source: akwa
  page: 191
  volume: ج١
  status: draft

- id: s0441
  kind: saying
  prompt: زاد الطين بله والمريض ___
  answer: عله
  others: [دوا, صحه, نوم]
  note: يقال حين تتعقد الأمور فتصبح معالجتها أصعب مما كانت.
  source: mughniyya
  page: 295
  status: draft

- id: s0442
  kind: saying
  prompt: مستريح وكعكة ولا عشرة ألوان و___
  answer: دعكة
  others: [بركة, سهرة, شبعة]
  note: القليل مع راحة البال خير من الكثير مع التعب.
  source: asadi
  line: 143252
  halab: p806
  status: draft

- id: s0443
  kind: saying
  prompt: عريج حير مية ___
  answer: كلب
  others: [ذيب, تيس, ثعيل]
  note: العريج هو الضبع، ويقال لمن لا يُخشى عليه في الموقف لقوته، فهو كفء لمئة.
  source: iryani
  page: 217
  status: draft

- id: s0444
  kind: saying
  prompt: حلم القطط كله ___
  answer: فيران
  others: [سمك, لبن, لحمه]
  note: كل إنسان مشغول البال بما يهمه، كالقطط لا تحلم إلا بالفئران.
  source: taymur
  page: 147
  status: draft

- id: s0445
  kind: saying
  prompt: ما كان إتعذّر ولا باع ___
  answer: جزر
  others: [بصل, ليمون, فول]
  note: «اتعذّر» أي احتاج إلى المال؛ وبائع الجزر عند العامة رمز للعدم، فمن لم يحتج لم يكن ليبيعه.
  source: shaalan
  page: 366
  volume: ج٦
  status: draft

- id: s0446
  kind: saying
  prompt: دِيرْ كُلْ شِي فَى ___ شِي يْطِيحْ، وْشِي يْتْكَّى
  answer: الشَّبْكَه
  others: [الصَّنْدُوقْ, الْجَّيْبْ, الْخَابْيَه]
  note: ضع كل همومك في الشبكة، بعضها يسقط من ثقوبها وبعضها يبقى. نصيحة للمكتئب بأن يتغاضى عن المشاكل ولا يحملها كلها.
  source: dadoun
  page: 103
  status: draft

- id: s0447
  kind: saying
  prompt: إذا عملت معروف أستره، وإذا نلت معروف ___
  answer: أنشره
  others: [أرده, أنساه, اطلبه]
  note: يحث على كتمان المعروف الذي تصنعه، وعلى ذكر المعروف الذي يصنعه غيرك معك.
  source: sahli
  page: 24
  status: draft

- id: s0448
  kind: saying
  prompt: ما بتلة إلا بعد ___
  answer: صراب
  others: [مطر, زرع, سيل]
  note: البتلة الحراثة والصراب الحصاد؛ لكل شيء أوانه، فلا تجديد إلا بعد انقضاء ما قبله.
  source: adimi
  page: 402
  status: draft

- id: s0449
  kind: saying
  prompt: المال السايب يعلم ___
  answer: السرقه
  others: [الكرم, الكسل, الحسد]
  note: السايب هو المهمل الذي لا يحفظه صاحبه، فإهماله يغري ضعاف النفوس بأخذه.
  source: juhayman
  page: 141
  volume: ج٧
  status: draft

- id: s0450
  kind: saying
  prompt: يرجف مثل ___
  answer: السعفة
  others: [الورقة, العصفور, القصبة]
  note: تشبيه بغدادي لمن يرتجف من البرد أو الخوف، كما تهتزّ سعفة النخل في الريح.
  source: hijiyya
  page: 118
  status: draft

- id: s0451
  kind: saying
  prompt: عيال القريه، كلٍّ يعرف ___
  answer: اخيّه
  others: [بيته, ابوه, ربعه]
  note: «القريّة» تصغير القرية، و«أخيّه» تصغير أخيه أي رفيقه؛ نحن أبناء قرية صغيرة يعرف كل منا صاحبه على حقيقته.
  source: abboudi_amthal
  page: 878
  volume: ج٢
  status: draft

- id: s0452
  kind: saying
  prompt: السانية للعمار والمركب ___
  answer: للرايس
  others: [للتاجر, للراكب, للحمّال]
  note: «السانية» المزرعة؛ لكل عمل أهله ولكل شخص تخصّصه.
  source: zanin
  page: 175
  status: draft

- id: s0453
  kind: saying
  prompt: إذا تصالحوا القطاط والفيران يا تعس ___
  answer: العطّار
  others: [الخيّاط, الحلّاق, السقّا]
  note: إذا اتّفق الحارس واللصّ ضاع صاحب المال.
  source: asadi
  line: 177033
  halab: p1333
  status: draft

- id: s0454
  kind: saying
  prompt: من تجاسر أبسر، ومن هاب ___
  answer: خاب
  others: [غاب, طاب, هرب]
  note: تجاسر أي أقدم بجرأة؛ فالجريء ينال ما يريد والهائب يخسر.
  source: akwa
  page: 1181
  volume: ج٢
  status: draft

- id: s0455
  kind: saying
  prompt: قعده على قعده راح النهار يا ___
  answer: سعده
  others: [ستي, خالتي, جارتي]
  note: سعدة اسم امرأة لا يقصدون به أحدا بعينه. يقال في سرعة مضي الوقت.
  source: taymur
  page: 290
  status: draft

- id: s0456
  kind: saying
  prompt: شبح العين ما يجبر خاطر والعطشان ما يرويه ___
  answer: قاطر
  others: [نهر, جره, سيل]
  note: «قاطر» قطرات الماء؛ الاكتفاء بالنظر إلى المصاب لا ينفعه، كما لا تروي القطرات الظمآن، ولا بد من عون حقيقي.
  source: mughniyya
  page: 319
  status: draft

- id: s0457
  kind: saying
  prompt: ما معوقنا عن السفر غير ___
  answer: الطفر
  others: [المطر, الشغل, الولاد]
  note: لا ينفذ الأمر بلا وسائله؛ والطفر هو الفقر وقلة المال.
  source: sahli
  page: 306
  status: draft

- id: s0458
  kind: saying
  prompt: مال ___ ما بيثمر
  answer: الحرام
  others: [التعب, الحلال, الجدّ]
  note: المال المكتسب بغير حقّ لا بركة فيه.
  source: asadi
  line: 153096
  halab: p816
  status: draft

- id: s0459
  kind: saying
  prompt: سِيدِي مْلِيحْ، وْضَرْبُه ___
  answer: الرِّيحْ
  others: [الْخْيْرْ, الشّْمْسْ, الزّْهَرْ]
  note: يقال لمن يمرض لأدنى سبب لضعف بنيته، فأي نسمة ريح تصيبه وتؤذيه.
  source: dadoun
  page: 135
  status: draft

- id: s0460
  kind: saying
  prompt: بعير مكفوف ولا ___ يشوف
  answer: حمار
  others: [كلب, تيس, خروف]
  note: البعير الأعمى خير من حمار يبصر؛ فالشيء القوي يُفضَّل على غيره مهما كانت عيوبه.
  source: juhayman
  page: 41
  volume: ج٢
  status: draft

- id: s0461
  kind: saying
  prompt: حبل الدوام يقطع ___
  answer: الحجر
  others: [الشجر, الحديد, الصخر]
  note: الحبل باحتكاكه المستمر يحفر في الحجر؛ فالمواظبة تصنع ما لا تصنعه القوة.
  source: adimi
  page: 187
  status: draft

- id: s0462
  kind: saying
  prompt: ساعة المحبّ ___
  answer: قصيره
  others: [طويله, سعيده, ثقيله]
  note: الوقت الذي يقضيه المحب مع من يحب يمضي سريعا فيبدو قصيرا.
  source: abboudi_amthal
  page: 627
  volume: ج٢
  status: draft

- id: s0463
  kind: saying
  prompt: ___ تخلّى الصبية كركوبة
  answer: طوبة
  others: [بؤونة, مسرى, بابة]
  note: طوبة أبرد شهور السنة القبطية وبرده قارس؛ والكركوبة عند العامة من الكراكيب، أي الخِرق والبقايا البالية، فالبرد يحوّل الصبية إلى ما يشبهها.
  source: shaalan
  page: 159
  volume: ج٦
  status: draft

- id: s0464
  kind: saying
  prompt: رجعت الميه ___
  answer: لمجاريها
  others: [لزيرها, لنهرها, لترعتها]
  note: 'يقال عند عودة الأمور إلى ما كانت عليه بعد انقطاعها، وتقول العرب: عاد الأمر إلى نصابه.'
  source: taymur
  page: 175
  status: draft

- id: s0465
  kind: saying
  prompt: ما بش حب. قال لحّوا لي ___
  answer: لحوح
  others: [كعك, عصيد, فتّه]
  note: اللحوح خبز رقيق يُصنع من الحبوب، فمن قيل له لا حبّ في البيت فطلب لحوحًا لم يفهم شيئًا؛ وهو قريب مما يُنسب إلى ماري أنطوانيت.
  source: iryani
  page: 799
  status: draft

- id: s0466
  kind: saying
  prompt: ما تقنع النفس الا من ___
  answer: التراب
  others: [الذهب, الكلام, السفر]
  note: كناية عن طمع الإنسان وحبه للمال، فلا تنتهي مطامعه إلا حين يموت.
  source: akwa
  page: 1021
  volume: ج٢
  status: draft

- id: s0467
  kind: saying
  prompt: الرجال منهدّيا والنار منطفّيا، أمّا ___ وين منروح فيا
  answer: المي
  others: [الشمس, الأرض, العتمة]
  note: الماء إذا طغى لا حيلة فيه.
  source: asadi
  line: 151701
  halab: p815
  status: draft

- id: s0468
  kind: saying
  prompt: الديك قال البركه في ___
  answer: الاجتماع
  others: [الصياح, الحب, النوم]
  note: يُنسب القول إلى الديك، ويضرب في فضل التعاون واجتماع الناس على الخير.
  source: mughniyya
  page: 271
  status: draft

- id: s0469
  kind: saying
  prompt: اعطينى دحية اليوم ولا ___ غدوة
  answer: دجاجة
  others: [عنزة, نعجة, حمامة]
  note: «دحية» بيضة و«غدوة» غدًا؛ يضرب لمن يفضّل الفائدة السريعة القليلة على الكبيرة المتأخرة.
  source: zanin
  page: 26
  status: draft

- id: s0470
  kind: saying
  prompt: تغيير الهوا أحسن من ___
  answer: الدوا
  others: [الغذا, الغنى, الشفا]
  note: النزهة وتبديل المكان بين حين وآخر نافعان للصحة.
  source: sahli
  page: 110
  status: draft

- id: s0471
  kind: saying
  prompt: هوشة الاثنين من بخت ___
  answer: الثالث
  others: [الجار, القاضي, الصغير]
  note: الهوشة هي الخصام والمضاربة، والبخت هو الحظ؛ فخلاف اثنين قد يكون فرصة يستفيد منها طرف ثالث.
  source: juhayman
  page: 114
  volume: ج٩
  status: draft

- id: s0472
  kind: saying
  prompt: من القطر تسيل ___
  answer: الأودية
  others: [الأنهار, البحار, الجبال]
  note: القليل يتجمع فيصير كثيرا؛ يقال لمن يحتقر الشيء الصغير.
  source: adimi
  page: 373
  status: draft

- id: s0473
  kind: saying
  prompt: يَالشَّارِي فَكَّرْ إِنْ ___
  answer: تْبِيعْ
  others: [تْخْسَرْ, تْرْبَحْ, تْشْرِي]
  note: 'إن تبيع أي حين تبيع. مثل صحراوي: اختر الأجود عند الشراء كي لا تخسر ثمنه إذا أردت بيعه.'
  source: dadoun
  page: 383
  status: draft

- id: s0474
  kind: saying
  prompt: خير تعمل شر ___
  answer: تلقى
  others: [تنسى, تبيع, تخاف]
  note: يقال حين يقابَل الإحسان بالإساءة.
  source: taymur
  page: 160
  status: draft

- id: s0475
  kind: saying
  prompt: 'مو كل من لبس قميص فرنجي قال: أنا ___'
  answer: أفندي
  others: [شيخ, قبضاي, حكيم]
  note: ليس كل من لبس لباس الوجهاء صار واحداً منهم.
  source: asadi
  line: 124795
  halab: p1312
  status: draft

- id: s0476
  kind: saying
  prompt: ما عمر شجرة وصلت ___
  answer: السما
  others: [الغيم, الجبل, القمر]
  note: لم يُعرف أن شجرة طالت حتى بلغت السماء؛ يقال في رد الدعوى المبالغ فيها.
  source: abboudi_amthal
  page: 1219
  volume: ج٣
  status: draft

- id: s0477
  kind: saying
  prompt: يعرج قبلما ___
  answer: يشوك
  others: [يمشي, يقوم, يتعب]
  note: من أمثال إبّ؛ يعرج قبل أن تدخل الشوكة في قدمه.
  source: akwa
  page: 1381
  volume: ج٢
  status: draft

- id: s0478
  kind: saying
  prompt: ___ يقول للزرع سير ويلحق بالطويل القصير
  answer: أمشير
  others: [طوبة, كيهك, هاتور]
  note: أمشير شهر قبطي يأتي بعد طوبة، ويكثر فيه الدفء فينمو الزرع الضعيف حتى يلحق بالطويل؛ وقد ذكره المقريزي.
  source: shaalan
  page: 157
  volume: ج٦
  status: draft

- id: s0479
  kind: saying
  prompt: إلهم كثير في الدنيا، بس ___
  answer: مفرق
  others: [مخبى, قليل, ساكت]
  note: الهموم كثيرة، لكنها موزعة على الناس فلا يخلو منها أحد.
  source: sahli
  page: 345
  status: draft

- id: s0480
  kind: saying
  prompt: الرزق يبي نطة و___
  answer: نطيطه
  others: [قعده, نومه, ضحكه]
  note: يبي أي يطلب؛ والنطة والنطيطة كناية عن السعي والحركة، فالرزق لا يأتيك وأنت جالس.
  source: juhayman
  page: 192
  volume: ج٣
  status: draft

- id: s0481
  kind: saying
  prompt: لا ثور للبتلة ولا لحم ___
  answer: للشركة
  others: [للعيد, للضيف, للبيع]
  note: البتلة الحراثة؛ ثور لا يصلح للحرث ولا للذبح، أي شيء فاسد لا ينفع على أي حال.
  source: adimi
  page: 358
  status: draft

- id: s0482
  kind: saying
  prompt: اللحم مرق والفجل ___
  answer: ورق
  others: [بذر, قشر, زهر]
  note: أنفع ما في اللحم مرقه، وأنفع ما في الفجل ورقه؛ ويُروى أن رجلًا قويًا سُئل عن سر قوته فقال ذلك.
  source: mughniyya
  page: 468
  status: draft

- id: s0483
  kind: saying
  prompt: حْمَارْ بْدِينَارْ، مَا يْتْعَرَّضْ ___
  answer: لَلْبِيطَارْ
  others: [لَلسَّرَّاجْ, لَلْحَدَّادْ, لَلْقَاضِي]
  note: البيطار هو من يفحص الدواب في الأسواق ويطبّبها. والحمار الذي ثمنه دينار لا يستحق أن يُعرض عليه، فالرخيص لا يستحق كثير العناية.
  source: dadoun
  page: 79
  status: draft

- id: s0484
  kind: saying
  prompt: اركب الديك وانظر فين ___
  answer: يوديك
  others: [يوصلك, يرميك, يجيبك]
  note: من جعل الديك مطيته فلينظر إلى أين يقوده؛ أي تخيّر من تسترشد به، فكل دليل يأخذك إلى غايته.
  source: taymur
  page: 16
  status: draft

- id: s0485
  kind: saying
  prompt: الستّ مو بسوارا، ___
  answer: بمقدارا
  others: [بخلخالا, بفستانا, بمراياتا]
  note: قيمة المرأة بقدرها لا بحليّها.
  source: asadi
  line: 161727
  halab: p827
  status: draft

- id: s0486
  kind: saying
  prompt: سبعة جبب وقتلت ___
  answer: جمل
  others: [ثور, حصان, ذيب]
  note: الجُبَب هي الدبابير، ويقال هذا عن نوعها الكبير الأسود الذي إذا هاجم جماعةً كان لسعه قاتلًا.
  source: iryani
  page: 117
  status: draft

- id: s0487
  kind: saying
  prompt: واگف مثل شمعة ___
  answer: الفگر
  others: [العرس, الجامع, البيت]
  note: يُقال لمن يقف منتصبًا ثابتًا لا يتحرك، ويقولون كذلك «واگف مثل السبع».
  source: hijiyya
  page: 118
  status: draft

- id: s0488
  kind: saying
  prompt: بيع الفحم وكول ___
  answer: اللحم
  others: [الخبز, العسل, التمر]
  note: يضرب في الحث على العمل لتوفير ما يحتاجه الإنسان، ولو كان عملًا متواضعًا.
  source: zanin
  page: 90
  status: draft

- id: s0489
  kind: saying
  prompt: بين جمادين و___، ترى عجب العجب
  answer: رجب
  others: [شعبان, رمضان, محرم]
  note: أي لا تستعجل الأحداث، فبين نهاية جمادى وأول رجب تظهر العجائب؛ وأصله قول عربي قديم.
  source: akwa
  page: 317
  volume: ج١
  status: draft

- id: s0490
  kind: saying
  prompt: الكلمة اللي تستحي منها بدّها ___
  answer: الأوله
  others: [بالسرّ, بالعجل, بالعذر]
  note: «بدّها» أي ابدأ بها، و«الأوله» الأولى؛ فالكلام الذي تستحي منه قدّمه أول الحديث وتخلّص منه.
  source: abboudi_amthal
  page: 1057
  volume: ج٣
  status: draft

- id: s0491
  kind: saying
  prompt: إلضمانة أولها شهامة، وثانيها غرامة، وثالثها ___
  answer: ندامة
  others: [سلامة, كرامة, إقامة]
  note: الكفالة المالية تبدأ بالمروءة وتنتهي بالغرم والندم.
  source: sahli
  page: 200
  status: draft

- id: s0492
  kind: saying
  prompt: وجع ضرس في ليلة ___
  answer: عرس
  others: [سفر, صيف, برد]
  note: ألم متواصل في وقت يحتاج فيه المرء إلى الفرح ومجاملة الناس. يقال للمنغّص الذي يأتي في مناسبة سعيدة لا تتكرر.
  source: juhayman
  page: 16
  volume: ج٩
  status: draft

- id: s0493
  kind: saying
  prompt: عيد التجلّي بيقول للصيف ___
  answer: ولّي
  others: [طوّل, أهلا, هلّي]
  note: بعد عيد التجلّي في آب يبدأ الحرّ بالانكسار.
  source: asadi
  line: 176442
  halab: p859
  status: draft

- id: s0494
  kind: saying
  prompt: فسحوا لها تتفرج قامت ___
  answer: ترقص
  others: [تغني, تأكل, تنام]
  note: يقال لمن يُعطى فرصة صغيرة فيستغلها بأكثر مما سُمح له.
  source: adimi
  page: 298
  status: draft

- id: s0495
  kind: saying
  prompt: جراده في الكف ولا ألف في ___
  answer: الهوا
  others: [الغيط, الشجر, السوق]
  note: جرادة في يدك خير من ألف طائرة لا تصل إليها؛ في تفضيل القليل القريب على الكثير البعيد.
  source: taymur
  page: 127
  status: draft

- id: s0496
  kind: saying
  prompt: خَالَطْ الْمَزْيَانْ تَبْقَى مَزْيَانْ، خَالَطْ لَمْفَلَّسْ ___
  answer: تْفَلَّسْ
  others: [تَغْنَى, تْعَلَّمْ, تَرْبَحْ]
  note: المزيان هو الحسن. الصاحب يؤثر في صاحبه، فمخالطة الصالح تكسبك خصاله، ومخالطة السيئ تجرّ عليك سوءه.
  source: dadoun
  page: 95
  status: draft

- id: s0497
  kind: saying
  prompt: كل حد يدني في النار ل___
  answer: خبزته
  others: [جاره, ضيفه, عدوه]
  note: «يدني» يقرّب؛ كل إنسان يقرّب النار من رغيفه، أي يهتم بمصلحته الخاصة قبل غيره.
  source: mughniyya
  page: 438
  status: draft

- id: s0498
  kind: saying
  prompt: فى وسط الزحمة تتوه ___
  answer: اللحمة
  others: [الشنطة, الطرحة, الكلمة]
  note: في الموالد تُقدَّم اللحمة فيكثر الحاضرون وتختفي سريعًا، فلا يبقى منها شيء.
  source: shaalan
  page: 51
  volume: ج٥
  status: draft

- id: s0499
  kind: saying
  prompt: من كترة اشغالو برك ___
  answer: بطّال
  others: [شغّال, ركّاض, مستعجل]
  note: يُقال فيمن يدّعي كثرة المشاغل وهو في الحقيقة بلا عمل.
  source: asadi
  line: 140602
  halab: p1320
  status: draft

- id: s0500
  kind: saying
  prompt: سق حمارك جاك ___
  answer: الليل
  others: [العيد, الضيف, الصبح]
  note: للحث على بذل الجهد، فأمام الإنسان وقت محدود من الأمان يتبعه وقت فيه الخطر على النفس أو المال.
  source: juhayman
  page: 266
  volume: ج٣
  status: draft

- id: s0501
  kind: saying
  prompt: إن كنت كداب ___
  answer: افتكر
  others: [احلف, اسكت, اتكلم]
  note: يقال لمن يكذب ثم ينسى ما قاله فيروي خلافه؛ فالكاذب يحتاج إلى ذاكرة قوية.
  source: taymur
  page: 86
  status: draft

- id: s0502
  kind: saying
  prompt: ارمي الحب وتوكل ع ___
  answer: الرب
  others: [الدرب, القلب, الصحب]
  note: على الفلاح أن يبذر الحب ويتعب، ثم يترك الثمر لله.
  source: sahli
  page: 26
  status: draft

- id: s0503
  kind: saying
  prompt: لا تقل لصاحب الطين يا ___
  answer: مسكين
  others: [جاهل, غريب, بخيل]
  note: من أمثال إبّ؛ صاحب الطين من يملك أرضاً يستثمرها، فالمسكين هو من لا يملك ما يسد حاجته.
  source: akwa
  page: 931
  volume: ج٢
  status: draft

- id: s0504
  kind: saying
  prompt: مثل أم الحريوة ___ مشغولة
  answer: فارحة
  others: [تعبانة, حزينة, خايفة]
  note: الحريوة العروس؛ يقال لمن يفرح بالشيء فرحا زائدا وهو منهمك فيه.
  source: adimi
  page: 425
  status: draft

- id: s0505
  kind: saying
  prompt: وكّف حطبك وماك، وعلى الله ___
  answer: غداك
  others: [رزقك, عشاك, شفاك]
  note: وكّف أي أعدّ وهيّأ؛ يقال في التوكل، أعدّ ما بيدك من حطب وماء، والطعام على الله.
  source: iryani
  page: 923
  status: draft

- id: s0506
  kind: saying
  prompt: نتفة حظ ولا شكبان ___
  answer: مرجله
  others: [ذهب, تمر, شعير]
  note: «الشكبان» شبكة يُنقل فيها التبن والعشب، و«المرجلة» الرجولة؛ أي قليل من الحظ خير من كثير من الرجولة.
  source: abboudi_amthal
  page: 1498
  volume: ج٤
  status: draft

- id: s0507
  kind: saying
  prompt: هَذِي دْجَاجَه ___
  answer: بْكَمُّونْهَا
  others: [بْرِيشْهَا, بْفْرَاخْهَا, بْقَفَصْهَا]
  note: 'دجاجة جاءت ومعها توابلها جاهزة للطبخ. يقال فيمن عثر على ما تمناه كاملًا، ومثله: هذي خبزة بدوازها.'
  source: dadoun
  page: 367
  status: draft

- id: s0508
  kind: saying
  prompt: اللى ما قرا مادرى واللى ما ___ ما جرى
  answer: سافر
  others: [تعب, خدم, حرث]
  note: يضرب في الحث على طلب العلم والسفر.
  source: zanin
  page: 48
  status: draft

- id: s0509
  kind: saying
  prompt: اللي بتلدغو ___ بيخاف من مسحالا
  answer: الحيّة
  others: [العقربة, النحلة, الدبّورة]
  note: من لدغته الحيّة صار يخاف حتى من أثر زحفها على التراب.
  source: asadi
  line: 149300
  halab: p813
  status: draft

- id: s0510
  kind: saying
  prompt: ما يقعد في الوادي إلا ___
  answer: حجره
  others: [سيله, ماه, طيره]
  note: لا يستقر في المكان إلا من ارتبط به برباط وثيق، كالحجارة التي تبقى في الوادي بعد أن يمضي السيل.
  source: mughniyya
  page: 498
  status: draft

- id: s0511
  kind: saying
  prompt: خد من التل ___
  answer: يختل
  others: [يقل, يميل, يخلص]
  note: الأخذ المستمر يفني الشيء ولو كان كثيرا كتراب التل؛ في ذم الإسراف.
  source: taymur
  page: 153
  status: draft

- id: s0512
  kind: saying
  prompt: طعم اللحم يبين في ___
  answer: المرق
  others: [الخبز, الصحن, الرز]
  note: للأمر الواضح الذي يُدرك وجوده ولو لم تره بعينك، كما يُعرف اللحم من طعم مرقه.
  source: juhayman
  page: 242
  volume: ج٤
  status: draft

- id: s0513
  kind: saying
  prompt: يا ويل من جمل قايده ___
  answer: حمار
  others: [ولد, كلب, راعي]
  note: يقال في الكبير يقوده صغير جاهل.
  source: sahli
  page: 365
  status: draft

- id: s0514
  kind: saying
  prompt: يضربنى فى جرن ويصالحنى فى ___
  answer: فرن
  others: [بيت, سوق, غيط]
  note: الجرن مكان واسع يجتمع فيه الناس، والفرن مكان ضيق؛ فهو يهينني أمام الملأ ويصالحني في السر.
  source: shaalan
  page: 214
  volume: ج٦
  status: draft

- id: s0515
  kind: saying
  prompt: دابتي ولا حصان ___
  answer: الإمام
  others: [السلطان, الجيران, الشيخ]
  note: الدابة الضعيفة التي تملكها خير من الحصان العظيم في يد غيرك ولا تناله.
  source: adimi
  page: 214
  status: draft

- id: s0516
  kind: saying
  prompt: ميز من اكبر منك ___
  answer: بيوم
  others: [بمال, بقدر, بعلم]
  note: ميّز من الميزة وهي الإجلال؛ يحث على احترام من يكبرك في السن ولو قليلاً.
  source: akwa
  page: 1301
  volume: ج٢
  status: draft

- id: s0517
  kind: saying
  prompt: الله ما شافوه، ___ عرفوه
  answer: بالعقل
  others: [بالعين, بالكتب, بالحكي]
  note: تُدرَك الحقائق بالعقل وإن لم ترها العين.
  source: asadi
  line: 116414
  halab: p1115
  status: draft

- id: s0518
  kind: saying
  prompt: خَلّْهَا فِى جْوَاهَا حَتَّى يَظْهَرْ ___
  answer: مُولاَهَا
  others: [صَاحْبَكْ, الشّْتَا, السُّوقْ]
  note: الجوا هو الغلاف الذي يحفظ الشيء. يقال في الشيء الثمين يُحفظ حتى يأتي من يقدّره ويشتريه بأغلى الأثمان.
  source: dadoun
  page: 95
  status: draft

- id: s0519
  kind: saying
  prompt: شورك، خلّه في ___
  answer: زورك
  others: [جيبك, بيتك, راسك]
  note: «الزور» الصدر؛ أي احتفظ بمشورتك في صدرك ولا تبدها. يقال في ردّ المشورة.
  source: abboudi_amthal
  page: 696
  volume: ج٢
  status: draft

- id: s0520
  kind: saying
  prompt: أعز الولد ولد ___
  answer: الولد
  others: [الجار, الأخ, العم]
  note: يقال في محبة الأجداد لأحفادهم، فهم أعز عليهم من أبنائهم.
  source: taymur
  page: 23
  status: draft

- id: s0521
  kind: saying
  prompt: قال له بيش عشت يا قديده؟ قالت له بالمي و___
  answer: الملح
  others: [السكر, العسل, السمن]
  note: «القديدة» قطعة من اللحم المجفف، و«بيش» بماذا؛ إنجاز الأمور يتطلب توفير ما تحتاج إليه من لوازم.
  source: mughniyya
  page: 408
  status: draft

- id: s0522
  kind: saying
  prompt: فلان مثل لحمة ___ مسكوت عنها
  answer: الغراب
  others: [الحمار, الجمل, الخروف]
  note: يقال إن لحم الغراب لم يأتِ فيه تحريم ولا تحليل؛ فيشبَّه به الرجل الذي لا محاسن له تُمدح ولا مساوئ تُذم.
  source: juhayman
  page: 158
  volume: ج٥
  status: draft

- id: s0523
  kind: saying
  prompt: گاعد عبالك ___
  answer: صنم
  others: [ملك, باشا, عريس]
  note: يُقال لمن يجلس جامدًا صامتًا لا يتكلم ولا يتحرك.
  source: hijiyya
  page: 118
  status: draft

- id: s0524
  kind: saying
  prompt: زي إم ___، فاضيه مشغولة
  answer: العروس
  others: [الولد, الدار, الحارة]
  note: لمن يكثر الحركة والانشغال ولا ينجز شيئا.
  source: sahli
  page: 169
  status: draft

- id: s0525
  kind: saying
  prompt: إن كان صاحبك عسل لا تلحسو ___
  answer: كلّو
  others: [هلّق, بإيدك, وحدك]
  note: لا تستغلّ طيبة من يحبّك حتى آخرها.
  source: asadi
  line: 148884
  halab: p812
  status: draft

- id: s0526
  kind: saying
  prompt: العصفور يلتقط منها وهو ___
  answer: متكي
  others: [طاير, نايم, واقف]
  note: يقال تفكّهًا عن ذرة «الجذارة» القصيرة جدًّا، حتى إن العصفور يلتقط حبّها وهو متكئ على الأرض.
  source: iryani
  page: 128
  status: draft

- id: s0527
  kind: saying
  prompt: لكل مقام مقال ولكل دقة ___
  answer: براع
  others: [رقصة, غنوة, زفة]
  note: الدقة ضربة الطبل والبراع رقصة البرع اليمنية؛ فلكل حال ما يناسبها من قول وفعل.
  source: adimi
  page: 329
  status: draft

- id: s0528
  kind: saying
  prompt: اللي ما ليش في العسل لوكان أمه ___
  answer: نحلة
  others: [نملة, دبورة, حمامة]
  note: «ما ليش» ليس له نصيب؛ يضرب لبيان أثر الحظّ في حياة الإنسان.
  source: zanin
  page: 48
  status: draft

- id: s0529
  kind: saying
  prompt: إذا ابصرك ما تكره فارقت ما ___
  answer: تحب
  others: [تملك, تعرف, ترجو]
  note: من أمثال عُتْمة؛ إذا وجدت ما يسوءك في مكان أو شخص ففارقه ولو كان عزيزاً عليك.
  source: akwa
  page: 81
  volume: ج١
  status: draft

- id: s0530
  kind: saying
  prompt: خَشْبَه بْلاَ ___
  answer: نْجَارَه
  others: [مْسَامَرْ, صْبَاغَه, عْرُوقْ]
  note: خشبة لم يهذّبها النجار. يقال فيمن لا يحذق أي عمل يتولاه، فلا يتوفق أينما توجه.
  source: dadoun
  page: 87
  status: draft

- id: s0531
  kind: saying
  prompt: صام وفطر على ___
  answer: بصله
  others: [تمره, فوله, لقمه]
  note: يقال لمن يمتنع عن شيء مدة طويلة ثم يقبل على أردأ ما فيه.
  source: taymur
  page: 223
  status: draft

- id: s0532
  kind: saying
  prompt: حبيبك القريب ___ والبعيد عسل
  answer: بصل
  others: [ملح, فجل, لفت]
  note: القرب اليومي يولد المشاكل، أما البعيد فتبقى صورته حلوة؛ وفي معناه «إبعدوا حبة تزيدوا محبة».
  source: shaalan
  page: 177
  volume: ج٢
  status: draft

- id: s0533
  kind: saying
  prompt: المركب اللي ما فيه شي لله ___
  answer: بيغرق
  others: [بيوصل, بيطير, بيرجع]
  note: العمل الذي لا نصيب فيه للخير لا يُكتب له النجاح.
  source: asadi
  line: 156382
  halab: p1095
  status: draft

- id: s0534
  kind: saying
  prompt: من كثر هذره، قلّ ___
  answer: قدره
  others: [نومه, رزقه, صحبه]
  note: حثّ على الصمت ونهي عن كثرة الكلام بلا حاجة؛ فالثرثار يهون على الناس.
  source: abboudi_amthal
  page: 1449
  volume: ج٤
  status: draft

- id: s0535
  kind: saying
  prompt: من زعل من لا شيء ___ بلا شيء
  answer: رضي
  others: [نام, راح, مات]
  note: زعل أي غضب وهجر. من يغضب دون أن يسيء إليه أحد فليرض دون أن يعتذر إليه أحد. يقال للحساس الذي يتوهم الإساءة.
  source: juhayman
  page: 321
  volume: ج١٠
  status: draft

- id: s0536
  kind: saying
  prompt: نقطة دم، ولا ألف ___
  answer: صاحب
  others: [قرش, خروف, دينار]
  note: القريب ولو بعُد أقرب من الأصدقاء الكثيرين.
  source: sahli
  page: 339
  status: draft

- id: s0537
  kind: saying
  prompt: جا يطيب فيها ___
  answer: عماها
  others: [شفاها, كحلها, داواها]
  note: «يطيب» يداوي؛ أراد أن يعالجها فأفقدها بصرها، فيمن يريد الإصلاح فيلحق الضرر.
  source: mughniyya
  page: 213
  status: draft

- id: s0538
  kind: saying
  prompt: ما يقطع بالسيف اقطعه ___
  answer: بالشعرة
  others: [بالسكين, بالحبل, بالكلمة]
  note: ما يمكن إنجازه باللين لا تلجأ فيه إلى العنف.
  source: adimi
  page: 405
  status: draft

- id: s0539
  kind: saying
  prompt: ايلاَ قْلْتْ لَكْ سِيدِي، لاَ تْزَيَّدْنِي لَلسُّوقْ ___
  answer: تْبَعْنِي
  others: [تْشْرِينِي, تْسَوَّقْنِي, تْعَرَّضْنِي]
  note: إن ناديتك بسيدي احترامًا فلا تأخذني إلى السوق لتبيعني. يقال لمن يظن الاحترام ضعفًا فيريد استغلالك.
  source: dadoun
  page: 375
  status: draft

- id: s0540
  kind: saying
  prompt: جور القط ولا عدل ___
  answer: الفار
  others: [الكلب, الديب, الديك]
  note: قد يُفضَّل ظلم من له مزايا على إنصاف من له سيئات، وهو مثل قديم أورده الأبشيهي.
  source: taymur
  page: 132
  status: draft

- id: s0541
  kind: saying
  prompt: ليالي العشر تبان من ___
  answer: العصر
  others: [الفجر, الظهر, القمر]
  note: ليالي العشر هي عشر ذي الحجة، وتبان أي تُعرف؛ يقال في معرفة الشيء من مقدماته.
  source: akwa
  page: 991
  volume: ج٢
  status: draft

- id: s0542
  kind: saying
  prompt: أجا ليكحّلا ___
  answer: عماها
  others: [زيّنها, فرّحها, جوّزها]
  note: يُقال فيمن أراد الإصلاح فأفسد.
  source: asadi
  line: 117536
  halab: p1308
  status: draft

- id: s0543
  kind: saying
  prompt: ودع ___ شاته
  answer: الذيب
  others: [الجار, الحمار, الولد]
  note: ودع أي أودع. يقال لمن يأتمن غير أمين ويضع ماله عند من يُخاف منه.
  source: juhayman
  page: 26
  volume: ج٩
  status: draft

- id: s0544
  kind: saying
  prompt: إلعافية بتيجي من خرم ___، والمرض بدفق دفق
  answer: الإبرة
  others: [الباب, الشباك, الحيطة]
  note: المرض يهجم دفعة واحدة، أما الشفاء فيعود قليلا قليلا.
  source: sahli
  page: 212
  status: draft

- id: s0545
  kind: saying
  prompt: ثنتين جراد وشططين ___
  answer: غراره
  others: [ثوب, زرع, جربه]
  note: الغرارة الكيس الكبير؛ جرادتان فقط مزّقتاه، يقال في الصغير يكون فعله المؤذي كبيرًا.
  source: iryani
  page: 491
  status: draft

- id: s0546
  kind: saying
  prompt: الهون ___
  answer: بركه
  others: [راحه, سلامه, غنيمه]
  note: «الهون» السهولة واليسر؛ يقال في مدح التيسير وترك التشدد في الأمور.
