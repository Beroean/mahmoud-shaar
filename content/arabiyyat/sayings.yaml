  prompt: فْلِيَّسْ عْلَى فْلِيَّسْ يْوَلِّي ___
  answer: كْدِيَّسْ
  others: [فْلُوسْ, فْقِيرْ, دِرْهَمْ]
  note: فليس تصغير فلس، وكديس تصغير كدس أي الكومة. القليل من المال إذا ادُّخر باستمرار صار مالًا وافرًا.
  source: dadoun
  page: 215
  status: draft

- id: s0111
  kind: saying
  prompt: كل قميص وإله ___
  answer: لبيس
  others: [خياط, زر, جيب]
  note: لكل فتاة من يناسبها، كما لكل قميص من يلبسه.
  source: sahli
  page: 268
  status: draft

- id: s0112
  kind: saying
  prompt: أهدى هديه، و___ فيها
  answer: نفسه
  others: [يده, رجله, راسه]
  note: يقال لمن يعطي غيره شيئاً وهو ما يزال متعلقاً به.
  source: akwa
  page: 241
  volume: ج١
  status: draft

- id: s0113
  kind: saying
  prompt: الحيط ___ بينطّ عليه الكلب
  answer: الواطي
  others: [العالي, المايل, الجديد]
  note: الضعيف يتجرّأ عليه كلّ أحد.
  source: asadi
  line: 169050
  halab: p844
  status: draft

- id: s0114
  kind: saying
  prompt: ما يشرك الهاطل إلا ___
  answer: الناطل
  others: [الجايع, الفقير, الضيف]
  note: يشرك أي يشتري لحمًا، والناطل هو الرجل السبهلل الذي لا يُعتمد عليه.
  source: iryani
  page: 871
  status: draft

- id: s0115
  kind: saying
  prompt: الجدر ما يگعد الا على ___
  answer: اثلاثة
  others: [اثنين, النار, الحطب]
  note: الجدر هو القدر، وكانت القدور في المطابخ البغدادية تُركَّز على ثلاث كرات حديدية تسمّى «الزرزبانات»، ومن هنا جاء المثل.
  source: hijiyya
  page: 70
  status: draft

- id: s0116
  kind: saying
  prompt: ما عن صديق ___
  answer: غناه
  others: [عتاب, سرار, فراق]
  note: «الغناة» عندهم الاستغناء؛ أي لا يستطيع المرء أن يستغني عن عون صديقه.
  source: abboudi_amthal
  page: 1223
  volume: ج٣
  status: draft

- id: s0117
  kind: saying
  prompt: سيب العجل يعرف ___
  answer: أمه
  others: [مرعاه, زريبته, صاحبه]
  note: العجل إذا تُرك اهتدى إلى أمه بين القطيع؛ والإنسان إذا خُلّي وشأنه مال إلى أهله.
  source: taymur
  page: 211
  status: draft

- id: s0118
  kind: saying
  prompt: على ريح المرق فتوا ___
  answer: عشانا
  others: [لحمنا, رزنا, تمرنا]
  note: للقناعة بالقليل حين لا يوجد غيره؛ فقد يُفتّ الخبز في مكان الإدام ليكسب شيئًا من رائحته الطيبة.
  source: juhayman
  page: 386
  volume: ج٤
  status: draft

- id: s0119
  kind: saying
  prompt: استعجلت الكلبة على ضناها جابتهم بلا ___
  answer: عيون
  others: [ذيول, صوت, شعر]
  note: «ضناها» صغارها؛ يضرب في ذمّ العجلة، فهي تُفسد العمل.
  source: zanin
  page: 21
  status: draft

- id: s0120
  kind: saying
  prompt: الملدوغ يتخايل ___
  answer: الحبل
  others: [الحجر, الشجره, الطير]
  note: «الملدوغ» من لدغته أفعى؛ يتخيلها في كل حبل فيخشاه.
  source: mughniyya
  page: 516
  status: draft

- id: s0121
  kind: saying
  prompt: من سعى للقات والشركة باع ___
  answer: التركة
  others: [الأرض, البيت, الغنم]
  note: الشركة هنا اللحم؛ من أسرف في القات واللحم أنفق أكثر من قوته حتى باع ما ورثه.
  source: adimi
  page: 391
  status: draft

- id: s0122
  kind: saying
  prompt: اللِّي حَبْهَا كُلْهَا ___ كُلْهَا
  answer: كَيْخَلِّيهَا
  others: [كَيَاكُلْهَا, كَيْدِّيهَا, كَيْرْبَحْهَا]
  note: من أرادها كلها تركها كلها. يقال فيمن يطمع في الاستيلاء على كل شيء ولا يقنع بالقليل فيضيّع كل شيء.
  source: dadoun
  page: 287
  status: draft

- id: s0123
  kind: saying
  prompt: نيّال المتهوم وعند الله ___
  answer: بري
  others: [غني, قوي, ولي]
  note: طوبى لمن اتّهمه الناس وهو بريء عند الله.
  source: asadi
  line: 171273
  halab: p846
  status: draft

- id: s0124
  kind: saying
  prompt: إلسكافي ___، والحايك عريان
  answer: حافي
  others: [تعبان, جوعان, سكران]
  note: لمن يخدم الناس بصنعته ويهمل نفسه.
  source: sahli
  page: 177
  status: draft

- id: s0125
  kind: saying
  prompt: الشئ اللى يزيد عن حده يبقى ___
  answer: ماسخ
  others: [رخيص, غالى, قديم]
  note: الماسخ هو ما لا طعم له؛ والمثل يدعو إلى الاعتدال، فالمبالغة في أي أمر تفقده أثره.
  source: shaalan
  page: 431
  volume: ج٣
  status: draft

- id: s0126
  kind: saying
  prompt: ما احد يذرا نفسه ___
  answer: شعير
  others: [ذهب, قمح, رماد]
  note: من أمثال بُرَط؛ يذرا أي يبذر، والشعير أدنى الحبوب، فلا أحد يرضى لنفسه منزلة منحطة.
  source: akwa
  page: 1001
  volume: ج٢
  status: draft

- id: s0127
  kind: saying
  prompt: الدبان وقعته في ___ كتير
  answer: العسل
  others: [اللبن, المرق, الطبيخ]
  note: يقال لمن يتهافت على الشيء ويرمي نفسه عليه، كما يسقط الذباب في العسل.
  source: taymur
  page: 163
  status: draft

- id: s0128
  kind: saying
  prompt: لسان أم جنيب ___ منها
  answer: أطول
  others: [أقصر, أحلى, أسرع]
  note: يقال لقصير الجسم طويل اللسان، يسبق غيره بالكلام فإذا جاء وقت العمل كان مع الفاشلين.
  source: juhayman
  page: 273
  volume: ج٦
  status: draft

- id: s0129
  kind: saying
  prompt: ياكل المال من لا ___ به
  answer: تعب
  others: [فرح, علم, حق]
  note: قد يأكل المال من لم يبذل في جمعه جهدا ولا مشقة.
  source: abboudi_amthal
  page: 1651
  volume: ج٥
  status: draft

- id: s0130
  kind: saying
  prompt: ما عصّادة تحب ___
  answer: عصّادة
  others: [طبّاخة, خبّازة, جارة]
  note: العصّادة من تحرّك عصيدة القدر؛ أصحاب الصنعة الواحدة لا يحب بعضهم بعضا.
  source: adimi
  page: 369
  status: draft

- id: s0131
  kind: saying
  prompt: في كانون كنّ، وعالفقير ___
  answer: حنّ
  others: [منّ, جنّ, ظنّ]
  note: في كانون الزم بيتك وتصدّق على الفقير.
  source: asadi
  line: 139256
  halab: p798
  status: draft

- id: s0132
  kind: saying
  prompt: إلي يصرف ولا يحسب ___ ولا يدري
  answer: يفلس
  others: [يغنى, يربح, يسمن]
  note: من ينفق دون حساب يجد نفسه فقيرًا فجأة؛ في الدعوة إلى ضبط الإنفاق.
  source: mughniyya
  page: 146
  status: draft

- id: s0133
  kind: saying
  prompt: مَا تَشْرَبْشِي مَ الْبِيرْ وَتَرْمِي فِيهْ ___
  answer: لَحْجَرْ
  others: [الْمَا, الدّْلُو, الْحْبَلْ]
  note: لا تشرب من البئر ثم ترمي فيه حجرًا. يقال فيمن ينتفع بما تقدمه له ثم يسعى إلى إيذائك.
  source: dadoun
  page: 335
  status: draft

- id: s0134
  kind: saying
  prompt: كل شي إذا كثر برخص، إلا ___
  answer: العقل
  others: [الذهب, الخبز, الوقت]
  note: كل شيء يقل ثمنه بكثرته إلا العقل، فقيمته ثابتة.
  source: sahli
  page: 265
  status: draft

- id: s0135
  kind: saying
  prompt: ضربه بالجلجل ولا عشر ب___
  answer: المطرقه
  others: [العصا, اليد, الحجر]
  note: الجُلْجُل المطرقة الكبيرة عند الحدادين، فضربة واحدة به تغني عن عشر ضربات بالصغيرة.
  source: iryani
  page: 147
  status: draft

- id: s0136
  kind: saying
  prompt: من عاشر المتهوم ___
  answer: ينتهم
  others: [يتعلم, يندم, يتوه]
  note: صاحب أهل الشبهة تصيبه التهمة؛ تحذير من مصاحبة المريب.
  source: taymur
  page: 359
  status: draft

- id: s0137
  kind: saying
  prompt: احسبنى كيف خوك وحاسبنى كيف ___
  answer: عدوك
  others: [ابنك, جارك, ضيفك]
  note: عاملني بمودّة الأخ، لكن دقّق معي في الحساب كما تدقق مع الخصم، فتدوم الأخوّة ولا يقع الخلاف.
  source: zanin
  page: 15
  status: draft

- id: s0138
  kind: saying
  prompt: انفعني للحجره، قال أين ___
  answer: الإجره
  others: [الأكل, الطريق, الزاد]
  note: الحجرة الرَّدْهة؛ يقال لمن لا مروءة له فيطالب بالأجر على أتفه الأعمال قبل أن يقوم بها.
  source: akwa
  page: 241
  volume: ج١
  status: draft

- id: s0139
  kind: saying
  prompt: الناي في كمّي والهوا في ___
  answer: تمّي
  others: [همّي, دمّي, عمّي]
  note: كلّ ما أحتاجه حاضر عندي ولا أحتاج إلى أحد.
  source: asadi
  line: 166814
  halab: p837
  status: draft

- id: s0140
  kind: saying
  prompt: مرد الكلب على ___
  answer: القصاب
  others: [الراعي, الحداد, الخباز]
  note: القصاب هو الجزار، وطريق الكلب لا بد أن يمر به. يقال للمسيء الذي لا بد أن يعود إلى من هو أقوى منه، فيحسن به أن يتأدب.
  source: juhayman
  page: 51
  volume: ج٨
  status: draft

- id: s0141
  kind: saying
  prompt: أعمى لقي ___
  answer: ودعه
  others: [ذهب, مرجان, خاتم]
  note: الودعة صدفة صغيرة لا قيمة لها؛ يقال لمن يتباهى بشيء تافه ويفخر به.
  source: adimi
  page: 90
  status: draft

- id: s0142
  kind: saying
  prompt: عاملين زى ___ الكبير اللى بياكل الصغير
  answer: السمك
  others: [الدود, النمل, الشجر]
  note: يصف المثل شريعة الغاب حين يعتدي القوي على الضعيف ويغيب القانون.
  source: shaalan
  page: 136
  volume: ج٣
  status: draft

- id: s0143
  kind: saying
  prompt: ما عين تقول آه من ___
  answer: خير
  others: [نوم, حب, شبع]
  note: العين لا تشتكي وصاحبها معافى؛ فالشكوى من المرض لها في الغالب أساس صحيح.
  source: abboudi_amthal
  page: 1225
  volume: ج٣
  status: draft

- id: s0144
  kind: saying
  prompt: لَعْرُوسَه لَلْعْرِيسْ، وَالْجْرِي ___
  answer: لَلْمْتَاعِيسْ
  others: [لَلْعَزَّابَه, لَلْجِيرَانْ, لَلضّْيَافْ]
  note: العروس للعريس، والركض والتعب للتعساء. يقال فيمن يشقى في أمر تعود منافعه على غيره.
  source: dadoun
  page: 287
  status: draft

- id: s0145
  kind: saying
  prompt: عند البطون ضاعت ___
  answer: العقول
  others: [الهموم, الكلمات, القلوب]
  note: يقال لمن يشغله الطعام عن كل ما حوله.
  source: sahli
  page: 223
  status: draft

- id: s0146
  kind: saying
  prompt: إرجانا يا حصان نين يكبر ___
  answer: العشب
  others: [المهر, الشعير, السرج]
  note: انتظر يا حصان حتى ينبت العشب ويكبر؛ يقال سخرية ممن ينتظر أمرًا بعيد التحقق. «نين» أي حتى.
  source: mughniyya
  page: 80
  status: draft

- id: s0147
  kind: saying
  prompt: من القلب للقلب ___
  answer: رسول
  others: [جواب, سلام, هديه]
  note: من أحب شخصا وجد عنده من الود مثل ما في قلبه.
  source: taymur
  page: 362
  status: draft

- id: s0148
  kind: saying
  prompt: فلان لا مال ياخدو الرحمان ولا عقل ياخدو ___
  answer: الشيطان
  others: [الحرامي, الجيران, القاضي]
  note: يُقال فيمن لا مال عنده ولا عقل، فلا مطمع فيه لأحد.
  source: asadi
  line: 152337
  halab: p1325
  status: draft

- id: s0149
  kind: saying
  prompt: قال بقره وثور قال ثور و___
  answer: بقره
  others: [عجل, ناقه, حمار]
  note: الجملتان بمعنى واحد ولم يتغير إلا الترتيب؛ يقال لمن يخالف لمجرد شهوة الخلاف.
  source: juhayman
  page: 237
  volume: ج٥
  status: draft

- id: s0150
  kind: saying
  prompt: إذا ضاق حالش شربتي لش ___
  answer: قهاو
  others: [حليب, شاهي, لبن]
  note: قول يُوجَّه إلى المرأة، يعني إذا ضاقت بك الأحوال فاشربي القهوة لتنسي همومك. والقهاو عندهم القهوة الجيدة.
  source: akwa
  page: 111
  volume: ج١
  status: draft

- id: s0151
  kind: saying
  prompt: إذا كثرين الديكة بطل ___
  answer: الصبح
  others: [البيض, النوم, الأذان]
  note: إذا كثر الديوك تضاربت أصواتها؛ ويقال حين يتعثر أمر رغم كثرة القائمين عليه.
  source: adimi
  page: 85
  status: draft

- id: s0152
  kind: saying
  prompt: الهدايا على قدر ___
  answer: مهديها
  others: [ثمنها, وزنها, حاملها]
  note: قالوها في «وكعة المهر» التي يقدّمها أهل العريس للعروس، وتختلف بحسب حال من يقدّمها.
  source: hijiyya
  page: 14
  status: draft

- id: s0153
  kind: saying
  prompt: أجا كتاب من خالو قال، كل مين هو بحالو، وأجا مكتوب من عمّو قال، كل مين هو ___
  answer: بهمّو
  others: [بدمّو, بأمّو, بتمّو]
  note: كلّ إنسان مشغول بنفسه وهمومه.
  source: asadi
  line: 140377
  halab: p800
  status: draft

- id: s0154
  kind: saying
  prompt: أكبر منك بيوم يعرف عنك ___
  answer: بسنه
  others: [بشهر, بيومين, بجمعه]
  note: في توقير رأي من هو أكبر سنا، فخبرة يوم زائد تساوي علم سنة كاملة.
  source: taymur
  page: 28
  status: draft

- id: s0155
  kind: saying
  prompt: 'شو أحلى من العسل؟ قال: ___ ببلاش'
  answer: خل
  others: [مي, ملح, بصل]
  note: يقال لمن يفضّل الشيء المجاني ولو كان رديئا.
  source: sahli
  page: 188
  status: draft

- id: s0156
  kind: saying
  prompt: ما يشتطّ المصرّ إلا من ___
  answer: وسطه
  others: [طرفه, ظهره, قدّامه]
  note: المصرّ منديل تعقده المرأة على رأسها، ووسطه يحمل الجرّة فيتمزق؛ فمن يتحمل أكثر يصيبه الأذى أكثر.
  source: iryani
  page: 491
  status: draft

- id: s0157
  kind: saying
  prompt: تَخْطِي ___ وَتْجِي فَايَنْ بْغَاتْ
  answer: الرَّاسْ
  others: [الدَّارْ, الْمَالْ, الْعِينْ]
  note: أي ما دامت المصيبة قد تجاوزت الرأس فلتقع حيث شاءت. فسلامة النفس أغلى من كل ما سواها.
  source: dadoun
  page: 47
  status: draft

- id: s0158
  kind: saying
  prompt: الحوار ما يضرّه وطي ___
  answer: امه
  others: [الراعي, الجمل, القطيع]
  note: الحوار ولد الناقة؛ يقال للأذى الظاهر إذا صدر من شفيق رحيم، كالأم تعاقب ولدها.
  source: abboudi_amthal
  page: 435
  volume: ج١
  status: draft

- id: s0159
  kind: saying
  prompt: اشوية ___ ولا هلبة ينقطع
  answer: يدوم
  others: [يكفى, يحلى, يشبع]
  note: «اشوية» قليل و«هلبة» كثير؛ القليل الدائم خير من الكثير المنقطع.
  source: zanin
  page: 23
  status: draft

- id: s0160
  kind: saying
  prompt: أفقر من ___
  answer: الدبور
  others: [الغراب, الصرصار, الوطواط]
  note: الدبور حشرة كبيرة تشبه النحل لكنها لا تصنع عسلًا ولا تعيش في جماعات، فصارت مضرب المثل في شدة الفقر.
  source: shaalan
  page: 110
  volume: ج١
  status: draft

- id: s0161
  kind: saying
  prompt: حضر السرز وال___ ما زال في بطن أمه
  answer: حصان
  others: [جمل, حمار, جدي]
  note: «السرز» السرج؛ أعدّ السرج والحصان لم يولد بعد، فيمن يستعد لأمر قبل أوانه بزمن طويل.
  source: mughniyya
  page: 236
  status: draft

- id: s0162
  kind: saying
  prompt: كبدة بعير كلما طبخت ___
  answer: قست
  others: [لانت, طابت, حلت]
  note: اللحم يلين كلما طال طبخه إلا كبد البعير فيزداد صلابة. يقال للشيء الذي يزداد سوءا كلما بذلت الجهد لإصلاحه.
  source: juhayman
  page: 12
  volume: ج٦
  status: draft

- id: s0163
  kind: saying
  prompt: من دوّر الجن ___
  answer: ركضوه
  others: [لقيهم, خافهم, هربوا]
  note: دوّر أي بحث؛ من فتّش عن المتاعب جاءته بما لا قبل له به.
  source: adimi
  page: 364
  status: draft

- id: s0164
  kind: saying
  prompt: طلب الزود وقع في ___
  answer: النقص
  others: [البير, الدين, الفخّ]
  note: الطمع في الزيادة يوقع في الخسارة.
  source: asadi
  line: 176190
  halab: p857
  status: draft

- id: s0165
