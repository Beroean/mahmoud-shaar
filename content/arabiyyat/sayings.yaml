- id: s0601
  kind: saying
  prompt: جسم بغل، وعقل ___
  answer: عصفور
  others: [حمامة, نملة, ديك]
  note: لمن كان ضخم الجثة قليل الفهم.
  source: sahli
  page: 119
  status: draft

- id: s0602
  kind: saying
  prompt: جاءت النقيلة تقلع ___
  answer: الأصيلة
  others: [الشجرة, القديمة, الجذور]
  note: النقيلة الوافدة تقلع الأصيلة؛ يقال حين يستأثر الغريب بمصالح ابن البلد ويحرمه منها.
  source: adimi
  page: 174
  status: draft

- id: s0603
  kind: saying
  prompt: راح الجمل، وما ___
  answer: حمل
  others: [أكل, ملك, شرب]
  note: يقال للشيء يضيع كله دفعة واحدة؛ ذهب الجمل وذهب معه حمله.
  source: abboudi_amthal
  page: 557
  volume: ج٢
  status: draft

- id: s0604
  kind: saying
  prompt: لو يمشي البحر يلقاه ___
  answer: نازح
  others: [هايج, مالح, بارد]
  note: «نازح» جاف قد غارت مياهه؛ يقال لمن يلازمه النحس وسوء الطالع أينما ذهب.
  source: mughniyya
  page: 474
  status: draft

- id: s0605
  kind: saying
  prompt: الجار جار، كما جلس ___
  answer: سار
  others: [قام, نام, دار]
  note: الجار هنا من ينزل في حمى القبيلة؛ فلا داعي لضيق الصدر به لأنه سيرحل يوماً.
  source: akwa
  page: 357
  volume: ج١
  status: draft

- id: s0606
  kind: saying
  prompt: بيت الصيودة ما يدخلوه ___
  answer: الذياب
  others: [الكلاب, الثعالب, الضباع]
  note: «الصيودة» الأسود؛ يضرب للعظيم الذي يُهاب جانبه.
  source: zanin
  page: 89
  status: draft

- id: s0607
  kind: saying
  prompt: لكل مقام ___
  answer: مقال
  others: [رجال, سؤال, مجال]
  note: لكلّ موقف كلام يناسبه.
  source: asadi
  line: 161626
  halab: p826
  status: draft

- id: s0608
  kind: saying
  prompt: من جا أسيناه، ومن جزع ___
  answer: نسيناه
  others: [لقيناه, سألناه, رجيناه]
  note: أسى في لهجتهم بمعنى وجد ولقي؛ فمن حضر وجدناه وعددناه، ومن غاب عنا نسيناه.
  source: iryani
  page: 35
  status: draft

- id: s0609
  kind: saying
  prompt: عند الإبره تتوه ___
  answer: السلوك
  others: [العيون, الإيدين, الصوابع]
  note: السلوك هي الخيوط. يقال للأمر إذا تهيأ بعض أسبابه تعذّر بعضها الآخر.
  source: taymur
  page: 253
  status: draft

- id: s0610
  kind: saying
  prompt: قطع العقده أهون من ___
  answer: فكها
  others: [لبسها, شراها, حملها]
  note: للحسم في الأمور وعدم إضاعة الوقت في الصغائر، فالوقت أثمن منها.
  source: juhayman
  page: 301
  volume: ج٥
  status: draft

- id: s0611
  kind: saying
  prompt: الْبَرَّانِي لَلْبَرَّانِي ___
  answer: رَحْمَه
  others: [عْدُو, غْرِيبْ, خْطَرْ]
  note: البراني هو الغريب. قد تجد عند الغريب شفقة ورحمة لا تجدها عند أقاربك، فلا تتردد في طلب عونه.
  source: dadoun
  page: 311
  status: draft

- id: s0612
  kind: saying
  prompt: قيس قبل ما ___
  answer: تغيص
  others: [تبيع, تحكي, تنام]
  note: قِس عمق الماء قبل أن تغوص فيه، أي تدبر الأمر قبل الإقدام عليه.
  source: sahli
  page: 258
  status: draft

- id: s0613
  kind: saying
  prompt: كل ضاحة ولها ___
  answer: رباح
  others: [طير, ذيب, نسر]
  note: الضاحة الجرف والرباح القرد؛ أي لكل أمر أهله الذين يقومون به.
  source: adimi
  page: 317
  status: draft

- id: s0614
  kind: saying
  prompt: نجّار وبابو ___
  answer: مخلوع
  others: [مدهون, منقوش, جديد]
  note: يُقال في صاحب الصنعة الذي يُهمل بيته فيما يُتقنه للناس.
  source: asadi
  line: 167171
  halab: p1329
  status: draft

- id: s0615
  kind: saying
  prompt: إصطلح الفار و___ ونسيوا الهتيكة والجرسة
  answer: العروسة
  others: [الكلب, الديك, الأرنب]
  note: العروسة هي ابن عرس، حيوان يشبه الفار في حجمه؛ والمثل يسخر من خصمين تصالحا ونسيا ما كان بينهما من فضائح.
  source: shaalan
  page: 388
  volume: ج٦
  status: draft

- id: s0616
  kind: saying
  prompt: زامق ويده في ___
  answer: القصعه
  others: [الكيس, الجيب, الصندوق]
  note: «زامق» ممتنع عن الأكل، و«القصعة» وعاء الطعام؛ يدّعي الشبع ويده غارقة في الطعام، فيمن يُظهر الزهد في شيء وهو راغب فيه.
  source: mughniyya
  page: 295
  status: draft

- id: s0617
  kind: saying
  prompt: ندور عليها في السما، وجدتها في ___
  answer: الأرض
  others: [البيت, الجيب, البحر]
  note: يقال لمن يبحث عن شيء بعيد ثم يجده قريباً منه في متناول يده.
  source: akwa
  page: 1311
  volume: ج٢
  status: draft

- id: s0618
  kind: saying
  prompt: كن نسيب ولا تكون ابن ___
  answer: عم
  others: [خال, جار, اخت]
  note: «النسيب» عندهم الصهر؛ ويريدون أن رابطة المصاهرة أقوى من رابطة القرابة بالنسب.
  source: abboudi_amthal
  page: 1070
  volume: ج٣
  status: draft

- id: s0619
  kind: saying
  prompt: دبر غداك تلقى ___
  answer: عشاك
  others: [فطورك, سحورك, ضيفك]
  note: في الحث على حسن التدبير والتفكير في الغد.
  source: taymur
  page: 163
  status: draft

- id: s0620
  kind: saying
  prompt: ما كل من يركب على الخيل ___
  answer: خيال
  others: [شيخ, غني, بدوي]
  note: الخيال هو الفارس الذي يقارع الشجعان. ركوب الخيل سهل حتى على الجبان، أما الفروسية فتحتاج إلى قلب وإقدام.
  source: juhayman
  page: 131
  volume: ج٧
  status: draft

- id: s0621
  kind: saying
  prompt: إللي الدراهم دراهمه، ___ بلاده
  answer: البلاد
  others: [الناس, الخيل, الأرض]
  note: يذكر سلطان المال، فصاحبه يملك الكلمة في البلد كله.
  source: sahli
  page: 51
  status: draft

- id: s0622
  kind: saying
  prompt: اللِّي مَكْرُوهْ، مَكْرُوهْ، وَلَوْ يَشْوِي لَخْمِيرَه عْلَى ___
  answer: اظْفَارُه
  others: [الْجّْمْرْ, رَاسُه, الشّْمْسْ]
  note: شيّ الخميرة على الأظافر كناية عن الصبر المتعب. يقال فيمن لا يجد القبول عند غيره مهما بذل من جهد لإرضائه.
  source: dadoun
  page: 303
  status: draft

- id: s0623
  kind: saying
  prompt: اللي بيطالع الجحش عالمادنة ___
  answer: بينزّلو
  others: [بيركّبو, بيعلّفو, بيشتريه]
  note: من أوقع نفسه في ورطة فعليه أن يخرج منها.
  source: asadi
  line: 168004
  halab: p839
  status: draft

- id: s0624
  kind: saying
  prompt: قرش دوّار ولا ألف ___
  answer: خوّار
  others: [دينار, صندوق, حمّال]
  note: المال الذي يدور في التجارة خير من مال كثير واقف لا يتحرك.
  source: adimi
  page: 310
  status: draft

- id: s0625
  kind: saying
  prompt: ارحم من زار و___
  answer: خفف
  others: [سلّم, هدّى, رجع]
  note: خير الزائرين من لا يطيل زيارته فيثقل على أهل البيت.
  source: zanin
  page: 19
  status: draft

- id: s0626
  kind: saying
  prompt: زي حمير العنب تشيله ولا ___
  answer: تدوقه
  others: [تبيعه, تشمه, تشوفه]
  note: يقال لمن يُسخَّر في عمل لا ينال منه شيئا.
  source: taymur
  page: 187
  status: draft

- id: s0627
  kind: saying
  prompt: إذا أظلمت ___
  answer: فقف
  others: [فنم, فارجع, فاسأل]
  note: أي إذا دخل الظلام فتوقف عن السير، ويرويه بعضهم «إذا أظلمت فسنّب» والسنوب الوقوف.
  source: iryani
  page: 448
  status: draft

- id: s0628
  kind: saying
  prompt: من قبص الحنش يفزع من ___
  answer: الخيط
  others: [الماء, النار, الريح]
  note: من أمثال عدن؛ قبصه أي لدغه، والحنش الحية. فمن أصابه الشر مرة خاف مما يشبهه.
  source: akwa
  page: 1261
  volume: ج٢
  status: draft

- id: s0629
  kind: saying
  prompt: زي غناي ___
  answer: جربه
  others: [مصراته, بنغازي, القيروان]
  note: «جربة» جزيرة بتونس؛ يقال لمن يتكلم أو يغني فيطيل على السامعين حتى يزعجهم.
  source: mughniyya
  page: 301
  status: draft

- id: s0630
  kind: saying
  prompt: خزام العير من ___
  answer: ذنبه
  others: [رجله, ظهره, بطنه]
  note: يقال لأهل الشر يُقابَلون بأمثالهم، ويُسلَّط عليهم من الأشرار من يعرف كيف ينتقم منهم.
  source: juhayman
  page: 31
  volume: ج٣
  status: draft

- id: s0631
  kind: saying
  prompt: ساعة من الغني ___
  answer: تغني
  others: [تكفي, تشفي, تنجّي]
  note: «الغني» هو الله تعالى؛ ساعة من مطر يأمر به تغني الناس بعد فقرهم. يقال عند هطول المطر بعد احتباسه.
  source: abboudi_amthal
  page: 628
  volume: ج٢
  status: draft

- id: s0632
  kind: saying
  prompt: الورد ما بصير منتور والجحش ما بصير ___
  answer: غندور
  others: [تاجر, شاعر, خيّاط]
  note: يُقال في أن الطبع لا يتبدّل، فالغليظ لا يصير ظريفاً أنيقاً.
  source: asadi
  line: 175039
  halab: p1331
  status: draft

- id: s0633
  kind: saying
  prompt: رمضة الصيف بتشوي ___
  answer: البيض
  others: [اللحم, الخبز, السمك]
  note: الرمضاء حر الأرض، وهي في الصيف شديدة تكاد تشوي البيض.
  source: sahli
  page: 162
  status: draft

- id: s0634
  kind: saying
  prompt: خيبة الأمل راكبة ___
  answer: جمل
  others: [حمار, حصان, عربية]
  note: من يركب الجمل يراه كل الناس لعلوّه؛ فالمثل يسخر من فشل ظاهر للجميع لا يمكن إخفاؤه.
  source: shaalan
  page: 369
  volume: ج٦
  status: draft

- id: s0635
  kind: saying
  prompt: عْلَى وَجَهْ لَكْتَابْ كَتْبَاسْ ___
  answer: الْجَّلْدَه
  others: [الْيَدّْ, الرَّاسْ, الْوْرَقَه]
  note: من أجل الكتاب يُقبَّل غلافه. يقال في الصبر على هفوات شخص إكرامًا لمن نحبه ويتصل به.
  source: dadoun
  page: 183
  status: draft

- id: s0636
  kind: saying
  prompt: يا عين اذا خير رفّي واذا شر ___
  answer: عفّي
  others: [نامي, غمّضي, دمعي]
  note: تقوله المرأة البغدادية حين ترفّ عينها، فالبغداديون يتشاءمون من رفّة العين اليمنى ويتفاءلون بالعين اليسرى.
  source: hijiyya
  page: 115
  status: draft

- id: s0637
  kind: saying
  prompt: ما يصيح الطير إلا من ___
  answer: حنش
  others: [جوع, برد, صقر]
  note: الحنش الثعبان؛ لكل شيء سبب، كما لا دخان بلا نار.
  source: adimi
  page: 428
  status: draft

- id: s0638
  kind: saying
  prompt: ما يهرش لك إلا ___
  answer: إيدك
  others: [أخوك, جارك, ابنك]
  note: 'في ترك الاتكال على الناس، كقول العرب: ما حك جلدك مثل ظفرك.'
  source: taymur
  page: 342
  status: draft

- id: s0639
  kind: saying
  prompt: لا تبيع برخيص ولا توصّي ___
  answer: حريص
  others: [بخيل, غريب, تاجر]
  note: الحريص لا يحتاج إلى من يوصيه.
  source: asadi
  line: 175615
  halab: p853
  status: draft

- id: s0640
  kind: saying
  prompt: ويش دخلك يا صعلوك بين ___
  answer: الملوك
  others: [الفقرا, الجيران, العمال]
  note: الصعلوك هو الفقير المتواضع الحال. يقال لمن يتدخل في أمور أكبر منه ومن قدرته.
  source: juhayman
  page: 64
  volume: ج٩
  status: draft

- id: s0641
  kind: saying
  prompt: سفرة في بيتي، ولا مفرشة في بيت ___
  answer: الناس
  others: [السلطان, القاضي, التاجر]
  note: السفرة جلد ضأن، والمفرشة سجاد فاخر؛ فالمتواضع في البيت خير من الثمين عند الآخرين.
  source: akwa
  page: 577
  volume: ج١
  status: draft

- id: s0642
  kind: saying
  prompt: كرمال ___، بشرب العليق
  answer: الورد
  others: [الياسمين, الزرع, الشجر]
  note: قد يُكرم السيئ إكراما لقريب طيب، كما يُسقى العليق من أجل الورد.
  source: sahli
  page: 263
  status: draft

- id: s0643
  kind: saying
  prompt: الحمار العثار ب___ يتقي
  answer: خشمه
  others: [ذيله, ودنه, ظهره]
  note: «العثّار» كثير السقوط، و«بخشمه يتقي» يسقط على أنفه؛ الجاهل يجني على نفسه، والشرير يؤخذ بسوء فعله.
  source: mughniyya
  page: 241
  status: draft

- id: s0644
  kind: saying
  prompt: الصعب يرجع ___
  answer: ذلول
  others: [سهل, شارد, هزيل]
  note: البعير الصعب الذي لا ينقاد قد يصير مع الوقت ذلولا سهل الركوب؛ يقال في الشاب الطائش الذي لا يسمع نصح أهله، رجاء أن يزول طيشه ويعقل.
  source: abboudi_amthal
  page: 725
  volume: ج٢
  status: draft

- id: s0645
  kind: saying
  prompt: اللى حوشه من ___ ما يحذفش الناس بالرشاد
  answer: القزاز
  others: [الطين, القصب, الحلفة]
  note: «حوشه» بيته و«القزاز» الزجاج؛ يضرب في تحذير الضعيف من مواجهة من هو أقوى منه.
  source: zanin
  page: 37
  status: draft

- id: s0646
  kind: saying
  prompt: تِيعْرَفْ امْنَايَنْ يَاكُلْ ___
  answer: لَكْتَفْ
  others: [لَخْبْزْ, الرّْغِيفْ, اللّْحَمْ]
  note: يعرف من أين تؤكل الكتف. يقال فيمن يحسن الوصول إلى غرضه بلطف وبراعة في التأثير على الناس.
  source: dadoun
  page: 55
  status: draft

- id: s0647
  kind: saying
  prompt: عسل في رأس ___
  answer: موسى
  others: [قدر, جرة, صحن]
  note: الموسى شفرة حادة؛ أي مال وفير لا يمكن الوصول إليه لشدة حرص صاحبه عليه.
  source: adimi
  page: 285
  status: draft

- id: s0648
  kind: saying
  prompt: حبه تتقل ___
  answer: الميزان
  others: [القفه, الشوال, الجراب]
  note: الحبة الصغيرة ترجّح كفة الميزان؛ لكل شيء أثر وإن صغر.
  source: taymur
  page: 138
  status: draft

- id: s0649
  kind: saying
  prompt: المركب بين ___ بيغرق
  answer: ريّسين
  others: [موجتين, بحرين, مينتين]
  note: تعدّد القادة في الأمر الواحد يفسده.
  source: asadi
  line: 156383
  halab: p1096
  status: draft

- id: s0650
  kind: saying
  prompt: قعس في يدي ولا ضمير في ___
  answer: يد الناس
  others: [السوق, الشجره, بيت الجار]
  note: القعس الفاكهة الفجّة، والضمير الناضجة؛ فالفجّ الذي تملكه خير من الناضج في يد غيرك.
  source: iryani
  page: 729
  status: draft

- id: s0651
  kind: saying
  prompt: السبع لما يشيّخ تركبه ___
  answer: القرود
  others: [الفيران, العصافير, الحمير]
  note: انقلاب الأحوال إلى الأسوأ يجرّئ الضعفاء على التطاول على أسيادهم؛ وورد المثل في مسلسل «السيرة العاشورية».
  source: shaalan
  page: 484
  volume: ج٦
  status: draft

- id: s0652
  kind: saying
  prompt: كثر التمني راس مال ___
  answer: المفاليس
  others: [التجار, الشعراء, الكسالى]
  note: الأماني والأحلام لا تثمر شيئا، وهي كل ما يملكه الفقير الذي يعيش على الخيال.
  source: juhayman
  page: 25
  volume: ج٦
  status: draft

- id: s0653
  kind: saying
  prompt: إلشي اللي ببلاش، ___ منه
  answer: كثر
  others: [خاف, اهرب, قلل]
  note: 'يقال مزاحا: ما كان مجانا فأكثر منه.'
  source: sahli
  page: 190
  status: draft

- id: s0654
  kind: saying
  prompt: جعفاره في مصر، غبارها في ___
  answer: دقنك
  others: [جيبك, قلبك, سوقك]
  note: الجعفارة هي الزوبعة المثيرة للتراب؛ والمعنى أن الفتنة البعيدة قد يصلك شيء من شرها.
  source: akwa
  page: 377
  volume: ج١
  status: draft

- id: s0655
  kind: saying
  prompt: المكتوب ما منّو ___
  answer: مهروب
  others: [مكتوب, مطلوب, محسوب]
  note: ما قُدّر على المرء لا مفرّ منه.
  source: asadi
  line: 172339
  halab: p1114
  status: draft

- id: s0656
  kind: saying
  prompt: كل واحد ينام على الجنب اللي ___
  answer: يريحه
  others: [يوجعه, يتعبه, يشيله]
  note: لا تعترض على من اختار لنفسه طريقة يرى فيها راحته.
  source: taymur
  page: 307
  status: draft

- id: s0657
  kind: saying
  prompt: الضيف وجهه ___
  answer: أبيض
  others: [أحمر, أسمر, أصفر]
  note: الضيف يأتي في النهار لا في الليل، لأن المضيف قد يعجز عن القيام بواجب قِراه في الظلام.
  source: mughniyya
  page: 349
  status: draft

- id: s0658
  kind: saying
  prompt: النَّبْتَه لَمْقَلْعَه مَا تْنَبَّتْ ___
  answer: رْبِيعْ
  others: [شُوكْ, وْرَاقْ, عْرُوقْ]
  note: النبتة المقلوعة لا تنبت عشبًا. يقال فيمن يترك مهنة بعد مدة طويلة إلى أخرى فلا ينجح، وفي التلميذ يُنقل من مدرسة إلى أخرى.
  source: dadoun
  page: 343
  status: draft

- id: s0659
  kind: saying
  prompt: ابن مهرة ولا ___ سنة
  answer: معلّم
  others: [تلميذ, صانع, عامل]
  note: ابن المهرة هو صاحب الصنعة المتقن لها، وهو خير ممن لا يزال يتعلمها ويتدرب عليها.
  source: adimi
  page: 72
  status: draft

- id: s0660
  kind: saying
  prompt: مال الناس ___
  answer: عاريّه
  others: [أمانه, غنيمه, هديّه]
  note: ما في يدك من مال غيرك إنما هو كالشيء المستعار، لا بد أن يعود إلى صاحبه.
  source: abboudi_amthal
  page: 1238
  volume: ج٣
  status: draft

- id: s0661
  kind: saying
  prompt: نور الدار ب___
  answer: سكانها
  others: [فرشها, سقفها, حوشها]
  note: أهل الدار وأحبابها هم الذين يجعلونها مضيئة سعيدة، فقرب الحبيب يجعل الضيق سعة.
  source: juhayman
  page: 340
  volume: ج١٠
  status: draft

- id: s0662
  kind: saying
  prompt: اكثر ___ أحلى زميتة
  answer: زيت
  others: [سكر, عسل, سمن]
  note: «الزميتة» أكلة من الدقيق والماء مع الزيت؛ يضرب للأمر الذي كلما زدت فيه زاد حُسنًا.
  source: zanin
  page: 29
  status: draft

- id: s0663
  kind: saying
  prompt: مال المي ___
  answer: للمي
  others: [للبير, للسقي, للغسيل]
  note: ما كُسب بالغشّ يذهب كما جاء، قيل في من كان يغشّ حليبه بالماء فغرقت بقرته.
  source: asadi
  line: 165533
  halab: p835
  status: draft

- id: s0664
  kind: saying
  prompt: إللي بده يوكل عسل، يصبر على قرص ___
  answer: النحل
  others: [النمل, البرد, الجوع]
  note: حلاوة الحياة لا تأتي إلا مع شيء من مرارتها، فمن أراد العسل احتمل اللسع.
  source: sahli
  page: 44
  status: draft

- id: s0665
  kind: saying
  prompt: كلمه تجيبه وكلمه ___
  answer: توديه
  others: [ترجعه, تزعله, تسكته]
  note: يقال للضعيف الرأي المتقلب الذي يتأثر بكل ما يسمعه.
  source: taymur
  page: 310
  status: draft

- id: s0666
  kind: saying
  prompt: أنين جارك ___
  answer: يسهرك
  others: [يضحكك, يغنيك, يرضيك]
  note: ما يصيب جارك من سوء يؤثر عليك، فساعده يرتح بالك.
  source: akwa
  page: 241
  volume: ج١
  status: draft

- id: s0667
  kind: saying
  prompt: فى الغطاس مصّ القصب والطبيخ ___
  answer: قلقاس
  others: [بامية, فاصوليا, بسلة]
  note: عيد الغطاس في يناير، ومن عادات المصريين فيه أكل القلقاس ومص القصب، وهي عادة قديمة.
  source: shaalan
  page: 159
  volume: ج٦
  status: draft

- id: s0668
  kind: saying
  prompt: الحيلة ما تربّي ___
  answer: عيال
  others: [غنم, دجاج, زرع]
  note: المكر يعود على صاحبه بالخسارة، ولا يمكن أن يُبنى عليه بيت أو يُعال منه أولاد.
  source: adimi
  page: 66
  status: draft

- id: s0669
  kind: saying
  prompt: مَا يَحْرَثْ الاَرْضْ غِيرْ ___
  answer: عْجُولْهَا
  others: [خْدَّامْهَا, جِيرَانْهَا, فْلاَّحْهَا]
  note: لا يحرث الأرض إلا عجولها. أي لا يعتني بأمرك إلا أهلك الذين يعنيهم شأنك.
  source: dadoun
  page: 335
  status: draft

- id: s0670
  kind: saying
  prompt: من كدّد ___
  answer: كسر
  others: [شبع, سلم, فاز]
  note: الكِداد كشط ما يلصق بالإناء من طعام، ومن بالغ في كشطه كسره؛ فالمبالغة تأتي بعكس المراد.
  source: iryani
  page: 761
  status: draft

- id: s0671
  kind: saying
  prompt: ما هناكش ___ يصطاد لله
  answer: قطوس
  others: [ذيب, ثعلب, نسر]
  note: «القطّوس» القط؛ المصالح الخاصة تحرّك الناس في كل ما يعملون.
  source: mughniyya
  page: 492
  status: draft

- id: s0672
  kind: saying
  prompt: القرش الابيض ينفع في اليوم ___
  answer: الاسود
  others: [الحار, الطويل, الثقيل]
  note: دعوة إلى الادخار، يرددها البغداديون وهم يعوّدون أطفالهم على جمع العيديات في «قوطية التجميع».
  source: hijiyya
  page: 108
  status: draft

- id: s0673
  kind: saying
  prompt: أطهر من حمام ___
  answer: مكه
  others: [الشام, البحر, العراق]
  note: حمام الحرم المكي يعيش في أطهر البقاع ويقتات من الحبوب الطاهرة، فصار مضرب المثل في الطهارة.
  source: abboudi_amthal
  page: 110
  volume: ج١
  status: draft

- id: s0674
  kind: saying
  prompt: الهزيمة تلتين ___
  answer: المرجلة
  others: [الخسارة, الفضيحة, الطريق]
  note: الفرار في وقته من حسن التدبير.
  source: asadi
  line: 172589
  halab: p848
  status: draft

- id: s0675
  kind: saying
  prompt: كل ديرة عند أهلها ___
  answer: مصر
  others: [الشام, بغداد, اليمن]
  note: الديرة هي البلد. كان لمصر في نفوس أهل الجزيرة مكانة خيالية بوصفها أجمل البلاد، وكل قوم يرون بلدهم كذلك.
  source: juhayman
  page: 80
  volume: ج٦
  status: draft

- id: s0676
  kind: saying
  prompt: بات كلب، واصبح ___
  answer: سبع
  others: [ديب, جمل, حصان]
  note: احتمل تعب العمل ومذلته ليلة تصبح عزيزا مستغنيا عن الناس؛ في تفضيل العمل على السؤال.
  source: taymur
  page: 97
  status: draft

- id: s0677
  kind: saying
  prompt: ثلثين ___ خوف
  answer: الحيا
  others: [الصبر, الكرم, العقل]
  note: معظم ما يبدو من الحياء عند الناس سببه الخوف.
  source: sahli
  page: 113
  status: draft

- id: s0678
  kind: saying
  prompt: حقّه حق وحق الناس ___
  answer: مرق
  others: [ماء, هواء, تراب]
  note: يقال لمن يتشدد في حقه ويستهين بحقوق الآخرين.
  source: adimi
  page: 191
  status: draft

- id: s0679
  kind: saying
  prompt: بقصه في ظهر ___
  answer: جمل
  others: [حمار, ثور, حصان]
  note: البقصة هي القرصة؛ يقال في العظيم الذي لا يضره كلام الصغير.
  source: akwa
  page: 291
  volume: ج١
  status: draft

- id: s0680
  kind: saying
  prompt: لَمْصِيبَه حْلاَلْ، وِيلاَ ظْهَرْ مُولاَهَا ___
  answer: حْرَامْ
  others: [حْلاَلْ, غَالْيَه, رْخِيصَه]
  note: المصيبة في الدارجة ما يعثر عليه المرء في طريقه صدفة. هو حلال له ما لم يظهر صاحبه، فإن ظهر وجب ردّه إليه.
  source: dadoun
  page: 255
  status: draft

- id: s0681
  kind: saying
  prompt: قالوا لجحا، منين تعلّمت الكرم؟ قال لن، بحسب الشي ___
  answer: ما كان
  others: [إلو تمن, من غيري, رح يرجع]
  note: الكريم يعدّ ما أعطاه كأنه لم يكن عنده.
  source: asadi
  line: 141828
  halab: p802
  status: draft

- id: s0682
  kind: saying
  prompt: اطلق عبستك وشدّ ___
  answer: خبزتك
  others: [عصاتك, جملك, بابك]
  note: «اطلق عبستك» ابسط وجهك؛ يضرب في الحث على البشاشة في وجه الضيف والاهتمام به.
  source: zanin
  page: 25
  status: draft

- id: s0683
  kind: saying
  prompt: الخيل هي والبل ___
  answer: رفاق
  others: [أعداء, أشكال, أثمان]
  note: «البل» الإبل؛ الخيل والإبل رفيقان في المبيت والمرعى وفي الرحيل والغزو.
  source: mughniyya
  page: 259
  status: draft

- id: s0684
  kind: saying
  prompt: ما في القدر تطلعه ___
  answer: المغرفه
  others: [السكين, النار, الصحن]
  note: ما في القدر محفوظ تخرجه المغرفة متى شئت، وإنما الخوف على ما كان خارجه. يقال للشيء المأمون الذي لا خطر عليه.
  source: juhayman
  page: 107
  volume: ج٧
  status: draft

- id: s0685
  kind: saying
  prompt: بيدهن الهوا ___
  answer: دوكو
  others: [زيت, جاز, عسل]
  note: الدوكو طلاء السيارات؛ ويقال على سبيل السخرية عن الفهلوي الذي يغرر بمن حوله ويبيع لهم الوهم.
  source: shaalan
  page: 382
  volume: ج٦
  status: draft

- id: s0686
  kind: saying
  prompt: عيش يا كديش لما يطلع ___
  answer: الحشيش
  others: [القمح, الشعير, الفول]
  note: الكديش هو الحصان غير الأصيل. يقال لمن يُحال على أمر لم يقع بعد.
  source: taymur
  page: 257
  status: draft

- id: s0687
  kind: saying
  prompt: عجاج يتبعه ___
  answer: مطر
  others: [ريح, ظلام, برد]
  note: كالغبار الذي يعقبه المطر؛ يقال للرجل الذي يسيء ثم يحسن.
  source: abboudi_amthal
  page: 805
  volume: ج٢
  status: draft

- id: s0688
  kind: saying
  prompt: إلديك الفصيح، من ___ بصيح
  answer: البيضة
  others: [القن, الصبح, العش]
  note: علامات النجابة تظهر على الطفل منذ صغره.
  source: sahli
  page: 152
  status: draft

- id: s0689
  kind: saying
  prompt: كلّ شي قسمة و___
  answer: نصيب
  others: [حبيب, غريب, ترتيب]
  note: كلّ ما يناله المرء مقدّر له.
  source: asadi
  line: 133182
  halab: p1104
  status: draft

- id: s0690
  kind: saying
  prompt: دمّه بسبع ___
  answer: انفس
  others: [عيون, رجول, بيوت]
  note: الدِّمّة القطة، ويقال لمن يصبر ويتجلّد، كلما ظُنّ أنه انتهى بقي ثابتًا.
  source: iryani
  page: 309
  status: draft

- id: s0691
  kind: saying
  prompt: جمل يحمل زبيب ويأكل ___
  answer: سنف
  others: [لوز, عسل, سكر]
  note: السنف علف البهائم الرديء؛ يقال لمن يحوز الخير ولا ينتفع منه.
  source: adimi
  page: 178
  status: draft

- id: s0692
  kind: saying
  prompt: ايلاَ تْعَلَّمْنَا شِي حَاجَه فِى لَمْهَدْ كَتْبْقَى حَتَّى ___
  answer: لَلَّحْدْ
  others: [لَلْكْبَرْ, لَلصّْبَاحْ, لَلْعِيدْ]
  note: 'ما نتعلمه في المهد يبقى حتى اللحد. كما يقال: التعلم في الصغر كالنقش في الحجر.'
  source: dadoun
  page: 391
  status: draft

- id: s0693
  kind: saying
  prompt: إذا تحاكرت الحمير يا فرحة ___
  answer: الركاب
  others: [الجمال, البياع, الرعيان]
  note: تحاكرت أي تنافست؛ فإذا تسابقت الحمير في السير ارتاح راكبوها، فتنافس قوم ينفع غيرهم.
  source: akwa
  page: 91
  volume: ج١
  status: draft

- id: s0694
  kind: saying
  prompt: كل شي إذا تديول نقص إلا ___
  answer: الحكي
  others: [الماء, الذهب, الزاد]
  note: الأشياء إذا تداولتها الأيدي نقصت، أما الكلام فيزيد لأن كل ناقل يضيف إليه من عنده.
  source: juhayman
  page: 89
  volume: ج٦
  status: draft

- id: s0695
  kind: saying
  prompt: زي الإبره تكسي الناس وهي ___
  answer: عريانه
  others: [جعانه, تعبانه, حزينه]
  note: يقال لمن يعمل لنفع غيره ولا يعود عليه من عمله شيء.
  source: taymur
  page: 181
  status: draft

- id: s0696
  kind: saying
  prompt: العينه تقتل ___
  answer: الصيد
  others: [الذيب, الحنش, الجوع]
  note: «العينة» التعاون، و«الصيد» الأسد؛ التعاون يمكّن الناس من التغلب على عدوهم مهما كان قويًا.
  source: mughniyya
  page: 385
  status: draft

- id: s0697
  kind: saying
  prompt: ما بيجي من الناس غير وجع ___
  answer: الراس
  others: [القلب, الضرس, الضهر]
  note: مخالطة الناس لا تأتي إلا بالمتاعب.
  source: asadi
  line: 174429
  halab: p852
  status: draft

- id: s0698
  kind: saying
  prompt: كل مين يقلع ___ بإيده
  answer: شوكه
  others: [ضرسه, زرعه, حطبه]
  note: على المرء أن يحل بنفسه المشكلات التي تسبب فيها.
  source: sahli
  page: 270
  status: draft

- id: s0699
  kind: saying
  prompt: حرّك قدم، يبدي ___
  answer: نجم
  others: [رزق, درب, باب]
  note: من أمثال البادية في جنوب نجد؛ «يبدي نجم» أي يظهر لك خير وارتفاع. حثّ على الحركة والسعي في طلب الرزق.
  source: abboudi_amthal
  page: 397
  volume: ج١
  status: draft

- id: s0700
  kind: saying
  prompt: اللى ياكل لوحده ___
  answer: يزوّر
  others: [يشبع, يسمن, ينام]
  note: «يزوّر» أي يغصّ باللقمة؛ ويقال على سبيل المزاح لمن يأكل وحده، تلميحًا إلى الرغبة في المشاركة.
  source: shaalan
  page: 366
  volume: ج٦
  status: draft

- id: s0701
  kind: saying
  prompt: كلٌّ بمهرته ___
  answer: سلطان
  others: [غني, فرحان, تاجر]
  note: المهرة الصنعة؛ صاحب الحرفة أمير في صنعته يتحكم فيها.
  source: adimi
  page: 317
  status: draft

- id: s0702
  kind: saying
  prompt: إذا عاداك جارك حوّل ___ دارك
  answer: باب
  others: [سور, حيط, شباك]
  note: يورده الكتاب في الحثّ على الإحسان إلى الجار، فعداوته تجعل البيت نفسه لا يُطاق.
  source: zanin
  page: 18
  status: draft

- id: s0703
  kind: saying
  prompt: اسْبَابْ بْلاَكْ ___
  answer: لْسَانَكْ
  others: [يْدِّيكْ, عِينِيكْ, رَجْلِيكْ]
  note: سبب بلائك لسانك. في معنى قول الشاعر إن البلاء موكل بالمنطق، فاحفظ لسانك تسلم.
  source: dadoun
  page: 143
  status: draft

- id: s0704
  kind: saying
  prompt: لاجل الورد ينسقي ___
  answer: العليق
  others: [الصبار, الحلفا, الحنضل]
  note: العليق نبات متسلق يلتف على الورد وغيره فيُسقى معه. يقال للوضيع يُكرم إكراما لغيره لا لنفسه.
  source: taymur
  page: 315
  status: draft

- id: s0705
  kind: saying
  prompt: الكلام كثير، ومقطعه ___
  answer: قليل
  others: [طويل, صعب, ثقيل]
  note: من أمثال صرواح؛ المقطع المقنع، فالكلام لا حد له ولكن المقنع منه قليل.
  source: akwa
  page: 871
  volume: ج٢
  status: draft

- id: s0706
  kind: saying
  prompt: مثل النخل أوله طنز وآخره ___
  answer: كنز
  others: [خبز, لغز, حرز]
  note: الطنز هو الاستهزاء. غارس النخل يُسخر منه في البداية، ثم يصير النخل مصدر رزق دائم له. يقال للأمر الذي تبدو بدايته غير مشجعة وعاقبته حميدة.
  source: juhayman
  page: 23
  volume: ج٨
  status: draft

- id: s0707
  kind: saying
  prompt: لو كان الشي بكبر الشوارب كانوا ___ ملوك
  answer: الجرادين
  others: [الحلّاقين, الجمال, الديوك]
  note: القيمة ليست بالمظهر ولا بطول الشوارب.
  source: asadi
  line: 163369
  halab: p830
  status: draft

- id: s0708
  kind: saying
  prompt: جار الكريم مثل مجاور النهر، ما بخاف من ___
  answer: العطش
  others: [الجوع, البرد, الغرق]
  note: جار الكريم لا يحتاج، كما لا يعطش من سكن بجانب النهر.
  source: sahli
  page: 117
  status: draft

- id: s0709
  kind: saying
  prompt: خبزته جوّه ___
  answer: النجانه
  others: [التنور, الصينية, السلة]
  note: النجّانة إناء نحاسي يُغطّى به طبق الخبز، والمثل يُقال في الأمن والاطمئنان وكثرة الخير، ومن فائض الخبز كانت أم البيت تنقّع الباقلاء.
  source: hijiyya
  page: 80
  status: draft

- id: s0710
  kind: saying
  prompt: الشور لمن رآه، لا لمن ___
  answer: تلاه
  others: [سمعه, قراه, نساه]
  note: الشّور في لهجاتهم الرأي والمشورة؛ فالرأي في الحادثة لمن شهدها حاضرًا لا لمن جاء بعدها.
  source: iryani
  page: 524
  status: draft

- id: s0711
  kind: saying
  prompt: إلي مش كاتبتلك تطيح ما بين إيدك و___
  answer: فمك
  others: [عينك, رجلك, صدرك]
  note: اللقمة التي لم تُكتب لك تسقط ولو كانت بين يدك وفمك؛ ليس للإنسان إلا ما قسمه الله له.
  source: mughniyya
  page: 134
  status: draft

- id: s0712
  kind: saying
  prompt: ما عمرتش صنعاء ___
  answer: بيوم
  others: [بحجر, بيد, بليلة]
  note: صنعاء لم تُبنَ في يوم واحد؛ يقال ردا على من يستعجل في أموره.
  source: adimi
  page: 433
  status: draft

- id: s0713
  kind: saying
  prompt: حبّ وداري واكراه و___
  answer: داري
  others: [جافي, عادي, نادي]
  note: اكتم حبّك وبغضك ولا تجاهر بأيّ منهما.
  source: asadi
  line: 141935
  halab: p1109
  status: draft

- id: s0714
  kind: saying
  prompt: الجار جار وإن ___
  answer: جار
  others: [غاب, مال, بعد]
  note: يدعو المثل إلى احتمال أذى الجار والصبر عليه، فالجار أقرب الناس بعد الأهل.
  source: taymur
  page: 124
  status: draft

- id: s0715
  kind: saying
  prompt: جراده تأكل ولا ___
  answer: تشبع
  others: [تطير, تسمن, تنام]
  note: يقال للأكول النحيل الذي لا يظهر أثر الأكل على جسمه، كالجرادة التي تأكل كثيرا.
  source: abboudi_amthal
  page: 349
  volume: ج١
  status: draft

- id: s0716
  kind: saying
  prompt: الصَّحْبَة وَحْدَه، وَالْعَيْشْ ___
  answer: خْلاَفْ
  others: [وَحْدَه, بْنِينْ, مْرَارْ]
  note: يقال في صديقين اتحدا في الصحبة وانسجما، مع أن أحدهما فقير والآخر غني، فالود واحد والمعيشة مختلفة.
  source: dadoun
  page: 167
  status: draft

- id: s0717
  kind: saying
  prompt: كل طير يشبعه ___
  answer: منقاره
  others: [جناحه, عشه, ريشه]
  note: الطير الصغير منقاره صغير، وما يحمله يكفي جسمه الصغير. يقال في الاكتفاء بما عند المرء من قدرة.
  source: juhayman
  page: 99
  volume: ج٦
  status: draft

- id: s0718
  kind: saying
  prompt: لا تطلب العلم غالي يأتيك ___
  answer: رخيص
  others: [بطيء, ناقص, كاذب]
  note: من أمثال عُتْمة؛ والعلم هنا الخبر، أي لا تجهد نفسك في طلب الأخبار فستأتيك دون عناء.
  source: akwa
  page: 921
  volume: ج٢
  status: draft

- id: s0719
  kind: saying
  prompt: الكلام ما عليهوش ___
  answer: جمرك
  others: [غطا, قفل, ختم]
  note: الجمرك هنا بمعنى الحاجز أو الرسوم؛ فالكلام يقال بلا ثمن ولا قيد، ولذلك يكثر.
  source: shaalan
  page: 80
  volume: ج٥
  status: draft

- id: s0720
  kind: saying
  prompt: ظلم الظالم ما بخليه ___
  answer: سالم
  others: [نايم, غني, قاعد]
  note: عاقبة الظلم وخيمة على صاحبه.
  source: sahli
  page: 209
  status: draft

- id: s0721
  kind: saying
  prompt: اللي ما عندو في البيت كبير يحطّ لو ___ كبير
  answer: حجر
  others: [كرسي, قفل, سرير]
  note: لا بدّ للبيت من كبير يُرجع إليه ويُهاب.
  source: asadi
  line: 140287
  halab: p799
  status: draft

- id: s0722
  kind: saying
  prompt: اخدم تكرم اقعد ___
  answer: تندم
  others: [تسلم, تشبع, تنام]
  note: من يعمل يُكرَم، ومن يقعد عن العمل يندم.
  source: zanin
  page: 16
  status: draft

- id: s0723
  kind: saying
  prompt: ينزل البرد على قدر ___
  answer: الدفاء
  others: [الكساء, الشتاء, النار]
  note: البلاء ينزل على قدر ما يحتمله المرء؛ فالله إذا ابتلى عبده لطف به.
  source: adimi
  page: 472
  status: draft

- id: s0724
  kind: saying
  prompt: شوف حاله قبل ان ___
  answer: تساله
  others: [تزوره, تكلمه, تلومه]
  note: حال الإنسان تغنيك عن سؤاله، وكثيرا ما يقال عند السؤال عن مريض اشتد مرضه.
  source: taymur
  page: 220
  status: draft

- id: s0725
  kind: saying
  prompt: ما يفرح بالهديه إلا ولد ___
  answer: الرعيه
  others: [السلطان, الباشا, التاجر]
  note: «ولد الرعية» ابن عامة الناس؛ الهدية تسعد الفقير أكثر من الغني لما يعانيه من حرمان.
  source: mughniyya
  page: 498
  status: draft

- id: s0726
  kind: saying
  prompt: رفيقك من توحي جرة ___
  answer: ناقته
  others: [فرسه, حماره, كلبه]
  note: توحي أي تسمع، والجرة صوت الدابة وهي تجترّ طعامها؛ فالصديق الحق قريب منك تجده متى احتجت إليه.
  source: juhayman
  page: 199
  volume: ج٣
  status: draft

- id: s0727
  kind: saying
  prompt: لَحْوِيَّطْ ___ اللِّي جَا يَطْلَعْ عْلِيهْ
  answer: لَقْصِيرْ
  others: [لَعْوَجْ, لَجْدِيدْ, لَبْيَضْ]
  note: الحائط القصير يتسلقه كل عابر. يقال فيمن يستضعفه الناس ويتخذونه مطية لقضاء مصالحهم بلا احترام.
  source: dadoun
  page: 311
  status: draft

- id: s0728
  kind: saying
  prompt: من ميل الى ميل ___
  answer: فرج
  others: [رزق, نصر, شفا]
  note: «الميل» مرود المكحلة؛ فبين أن يضعه المرء في عينه مرة وأن يعيده ثانية يأتي الله بالفرج. يقال في انتظار الفرج القريب.
  source: abboudi_amthal
  page: 1454
  volume: ج٤
  status: draft

- id: s0729
  kind: saying
  prompt: ميه إبره ما تقع ___
  answer: شريم
  others: [مخيط, سكين, رمح]
  note: الشريم المنجل؛ فمئة إبرة لا تصلح أن تكون منجلاً واحداً.
  source: akwa
  page: 1301
  volume: ج٢
  status: draft

- id: s0730
  kind: saying
  prompt: إلطاقة اللي بجيك منها الريح، سدها و___
  answer: استريح
  others: [نام, روح, اقعد]
  note: ابتعد عن مصدر الأذى وأغلقه، ترتح.
  source: sahli
  page: 203
  status: draft

- id: s0731
  kind: saying
  prompt: كلّ من بيقدح ___
  answer: بزندو
  others: [بكبريتو, بحجرو, بجارو]
  note: كلّ امرئ يعتمد على نفسه وما عنده.
  source: asadi
  line: 130852
  halab: p1103
  status: draft

- id: s0732
  kind: saying
  prompt: أصبحت اللقيه ___
  answer: سود
  others: [تراب, حجار, رماد]
  note: اللقية كنز يدلّ عليه هاتف في المنام بشرط أن يُذبح عليه، فإن لم يفعل انقلب الكنز سُودًا أي فحمًا؛ يقال في خيبة الأمل.
  source: iryani
  page: 451
  status: draft

- id: s0733
  kind: saying
  prompt: ولا سجره إلا وهزها ___
  answer: الريح
  others: [المطر, الطير, الفاس]
  note: كل من في الدنيا أصابته الحوادث، فلا أحد يعيش سالما منها.
  source: taymur
  page: 379
  status: draft

- id: s0734
  kind: saying
  prompt: إذا غاب الدم تنبع ___
  answer: الفار
  others: [الكلب, الديك, الصوص]
  note: الدُّمّ في لهجة اليمن هو القط، وتنبّع أي قفز؛ يقال لمن يسيء الأدب حين يغيب من يضبطه.
  source: adimi
  page: 83
  status: draft

- id: s0735
  kind: saying
  prompt: أنشف من لسان ___
  answer: العطشان
  others: [البخيل, الساكت, التاجر]
  note: من صيغ المبالغة في وصف شدة الجفاف؛ فلا شيء أجف من لسان العطشان.
  source: shaalan
  page: 236
  volume: ج٤
  status: draft

- id: s0736
  kind: saying
  prompt: فلان أثقل من حصاة ___
  answer: القفان
  others: [الوادي, الدرب, المقلاع]
  note: القفان ميزان من خشبة يُعلّق في طرفها حجر ثقيل؛ يقال للثقيل الظل الذي يكره الناس مجالسته.
  source: juhayman
  page: 76
  volume: ج٥
  status: draft

- id: s0737
  kind: saying
  prompt: متكسره على راسه ___
  answer: القلال
  others: [العمايم, الطواقي, الشواشي]
  note: «القلال» أوانٍ فخارية للشرب؛ تكسرت على رأسه جرار كثيرة، فيقال للداهية الذي جرّب حلو الحياة ومرّها فاكتسب المعرفة والدهاء.
  source: mughniyya
  page: 504
  status: draft

- id: s0738
  kind: saying
  prompt: نحنه بالتفكير والله ___
  answer: بالتدبير
  others: [بالتأخير, بالتغيير, بالتصوير]
  note: الإنسان يفكّر ويخطّط، والله هو المدبّر.
  source: asadi
  line: 126860
  halab: p1101
  status: draft

- id: s0739
  kind: saying
  prompt: عَقْلُه خَاوِي كَيْعَشَّشْ فِيهْ ___
  answer: بْلاَرَجْ
  others: [لَحْمَامْ, الْبُومْ, الزَّاوْشْ]
  note: بلارج هو اللقلاق. عقل فارغ إلى حد أن اللقلاق يبني فيه عشه! يقال فيمن لا يفكر في عواقب الأمور.
  source: dadoun
  page: 191
  status: draft

- id: s0740
  kind: saying
  prompt: طلعنا من المولد بلا ___
  answer: حمص
  others: [حلاوة, ملبس, فول]
  note: يقال لمن يعود من سعيه بلا فائدة.
  source: sahli
  page: 206
  status: draft

- id: s0741
  kind: saying
  prompt: وسّع المقطع يجيك ___
  answer: العود
  others: [الحطب, الماء, الرزق]
  note: 'من أمثال الحطابين: إذا وسّعت موضع قطع العود الكبير بالضرب يمينا وشمالا جاءك سريعا سهلا.'
  source: abboudi_amthal
  page: 1556
  volume: ج٤
  status: draft

- id: s0742
  kind: saying
  prompt: زي نخلة الوادي لا تمر لا ___
  answer: ظل
  others: [جريد, سعف, ماء]
  note: يضرب للشخص الذي لا فائدة منه.
  source: zanin
  page: 165
  status: draft

- id: s0743
  kind: saying
  prompt: لا في حياتك اكتسينا جديد، ولا في مماتك اكلنا ___
  answer: عصيد
  others: [لحم, رز, خبز]
  note: اكتسينا من الكساء، والعصيد طعام يمني معروف؛ يقال لمن لا يُنتفع به حياً ولا ميتاً.
  source: akwa
  page: 951
  volume: ج٢
  status: draft

- id: s0744
  kind: saying
  prompt: عصفوره في اليد ولا عشره في ___
  answer: السجر
  others: [العش, الغيط, البرج]
  note: السجر هو الشجر. القليل الذي في يدك خير من الكثير البعيد عنها.
  source: taymur
  page: 244
  status: draft

- id: s0745
  kind: saying
  prompt: من عاش مداري مات ___
  answer: مستور
  others: [مرتاح, غني, سعيد]
  note: من عالج الأمور بالحكمة والحلم وتغاضى عن بعض حقه عاش وانتهى بعيدا عن الفضائح.
  source: adimi
  page: 363
  status: draft

- id: s0746
  kind: saying
  prompt: يا رايح كتّر ___
  answer: ملايح
  others: [فضايح, نصايح, روايح]
  note: من كان راحلاً فليترك وراءه ذكراً طيباً.
  source: asadi
  line: 177086
  halab: p860
  status: draft

- id: s0747
  kind: saying
  prompt: صافي مثل عين ___
  answer: الوزّة
  others: [الحمامة, الغزال, البزّونة]
  note: هكذا وصف البغداديون الماء المترشّح من حِبّ الفخار في شدة صفائه، وكانوا يفضّلونه لتخدير الشاي.
  source: hijiyya
  page: 67
  status: draft

- id: s0748
  kind: saying
  prompt: نعد الليالي ___
  answer: تعدنا
  others: [تنسانا, تضحك لنا, ترحمنا]
  note: نحن نحسب الأيام كم مضى منها، وهي في الوقت نفسه تحسب أعمارنا وتفنينا واحدا بعد آخر.
  source: juhayman
  page: 327
  volume: ج٨
  status: draft

- id: s0749
  kind: saying
  prompt: الْفُولْ الاَخْضَرْ فِى مَارْسْ تُوجْدُه، وَفِى ___ تَفْقْدُه
  answer: أَبْرِيلْ
  others: [يَنَايَرْ, فَبْرَايَرْ, دُجَنْبَرْ]
  note: الفول الأخضر يكثر في مارس ويختفي في أبريل. يقال في الشيء لا يُتمتع به إلا في أوقات معينة.
  source: dadoun
  page: 303
  status: draft

- id: s0750
  kind: saying
  prompt: الصحبه في ___
  answer: البحر
  others: [السوق, العرس, الدار]
  note: يتعرض البحّارة لأخطار البحر فيظهر بينهم الصديق الحق من المزيف؛ الصاحب يُعرف في الشدائد.
  source: mughniyya
  page: 337
  status: draft

- id: s0751
  kind: saying
  prompt: حسبتك سديره وانت ___
  answer: ناقه
  others: [عنزه, نعجه, بقره]
  note: السديرة فحل القافلة وأكبر جمالها وأقواها، يكون في مقدمتها ويقودها.
  source: iryani
  page: 430
  status: draft

- id: s0752
  kind: saying
  prompt: زعل الخيات مثل ___ بالديات
  answer: الحنا
  others: [الكحل, الصابون, العطر]
  note: خصام الأخوات لا يدوم، يزول كما يزول الحناء عن اليدين.
  source: sahli
  page: 166
  status: draft

- id: s0753
  kind: saying
  prompt: الضيف أول يوم قمر منوّر وتانى يوم رغيف مقوّر وتالت يوم ___ مصوّر
  answer: عفريت
  others: [ديب, قرد, تعبان]
  note: يعبر عن ضيق أهل البيت بطول إقامة الضيف، مع أنهم استقبلوه أحسن استقبال في يومه الأول.
  source: shaalan
  page: 178
  volume: ج٢
  status: draft

- id: s0754
  kind: saying
  prompt: يعوم ويحرس ___
  answer: ثيابه
  others: [غنمه, بيته, ولاده]
  note: يقال للمتيقظ لا يشغله شيء عن شيء؛ يسبح ولا يغفل عن ثيابه على الشط.
  source: taymur
  page: 398
  status: draft

- id: s0755
  kind: saying
  prompt: كول لحم إيدك ولا تعتاز ___
  answer: القصّاب
  others: [الطبّاخ, الخبّاز, الجيران]
  note: اصبر على الحرمان ولا تحتج إلى منّة أحد.
  source: asadi
  line: 18197
  halab: p1117
  status: draft

- id: s0756
  kind: saying
  prompt: في القلب ما ينضج اللحم ___
  answer: النيه
  others: [الجديد, البارد, الكثير]
  note: النيّه أي النيء؛ أي في القلب من الهموم ما يكفي حرّه لإنضاج اللحم النيء.
  source: akwa
  page: 781
  volume: ج٢
  status: draft

- id: s0757
  kind: saying
  prompt: ملا اثمك، ولا ملا ___
  answer: بطنك
  others: [كيسك, بيتك, يدك]
  note: «الاثم» الفم؛ ملء فمك من الطعام الجيد خير من ملء بطنك من الرديء. يقال في تفضيل القليل الجيد.
  source: abboudi_amthal
  page: 1383
  volume: ج٤
  status: draft

- id: s0758
  kind: saying
  prompt: من أكل باليدين ___
  answer: اختنق
  others: [شبع, تعب, سمن]
  note: من استعجل والتهم بكلتا يديه شرق بالطعام؛ أي الطمع يضر صاحبه.
  source: adimi
  page: 379
  status: draft

- id: s0759
  kind: saying
  prompt: من زرع شعير ما حصد ___
  answer: بر
  others: [رز, عسل, ورد]
  note: البر هو القمح وهو أفضل من الشعير. فمن عمل السوء لا يجني إلا مثله، والجزاء من جنس العمل.
  source: juhayman
  page: 321
  volume: ج١٠
  status: draft

- id: s0760
  kind: saying
  prompt: ادبارة الفار على أهل الدار يبيعوا القطوس ويشروا ___
  answer: جبنة
  others: [حليب, لحمة, سمكة]
  note: الفأر ينصح أهل البيت أن يبيعوا القط ويشتروا الجبن؛ يضرب لمن ينصح نصيحة تخدم مصلحته.
  source: zanin
  page: 17
  status: draft

- id: s0761
  kind: saying
  prompt: بْحَالْ اللِّي ضْرَبْ الْكَلْبْ ___
  answer: بَسْفَنْجَه
  others: [بَحْجَرْ, بَعْصَا, بَبَلْغَه]
  note: السفنج كعكة مقلية محبوبة في المغرب، فمن ضرب الكلب بها أعطاه ما يشتهي. يقال فيمن ينال ما يتمناه دون أن يتوقعه.
  source: dadoun
  page: 39
  status: draft

- id: s0762
  kind: saying
  prompt: زي الشعير موكول ___
  answer: مذموم
  others: [مرغوب, مطحون, مخزون]
  note: يقال لمن ينتفع الناس به ثم يذمونه، كالشعير يؤكل ويُعاب.
  source: taymur
  page: 192
  status: draft

- id: s0763
  kind: saying
  prompt: وسعنا له، دخل هو و___
  answer: حماره
  others: [ولاده, جاره, كلبه]
  note: لمن تفسح له فيتمادى ويطمع.
  source: sahli
  page: 352
  status: draft

- id: s0764
  kind: saying
  prompt: الجرح ما بيمضّ إلا ___
  answer: صاحبو
  others: [طبيبو, جارو, عدوّو]
  note: لا يحسّ بالألم إلا صاحبه.
  source: asadi
  line: 159424
  halab: p819
  status: draft

- id: s0765
  kind: saying
  prompt: لو ما تخالف الأنظار ما يمرقن ___
  answer: السلع
  others: [القوافل, الأيام, الخيول]
  note: «يمرقن» يروجن وينفدن؛ لولا اختلاف الأذواق لما راجت السلع المختلفة في شكلها وجودتها.
  source: mughniyya
  page: 474
  status: draft

- id: s0766
  kind: saying
  prompt: لو من أتى نجر ما بقي في الدنيا ___
  answer: شجر
  others: [خشب, حطب, غابات]
  note: ليس كل من حمل أداة صار نجّارا؛ ويقال لمن يتصدى لعمل لا يحسنه.
  source: adimi
  page: 350
  status: draft

- id: s0767
  kind: saying
  prompt: اترك فعل الخير ما ترى ___
  answer: شر
  others: [خير, فقر, ضيم]
  note: أي قد يكون إحسانك إلى أحدهم سبباً في أن يسيء إليك، فاحذر من تحسن إليه.
  source: akwa
  page: 51
  volume: ج١
  status: draft

- id: s0768
  kind: saying
  prompt: إشتغل يوم ___ ولا تمد إيدك لأخوك السعيد
  answer: العيد
  others: [الجمعة, الوقفة, الخميس]
  note: يحث المثل على العمل وحفظ كرامة النفس، ولو اضطر المرء إلى العمل في يوم الراحة، بدل انتظار المساعدة.
  source: shaalan
  page: 289
  volume: ج٦
  status: draft

- id: s0769
  kind: saying
  prompt: يبيع الما في حارة ___
  answer: السقايين
  others: [الخبازين, الحدادين, النجارين]
  note: السقاؤون هم باعة الماء. يقال لمن يعرض بضاعة على من يصنعها ويعرفها، فلن يشتروها أو يدفعوا فيها أبخس الأثمان.
  source: juhayman
  page: 202
  volume: ج٩
  status: draft

- id: s0770
  kind: saying
  prompt: سرح ___
  answer: جرذي
  others: [ذيب, غزال, نعامه]
  note: الجرذ الصحراوي لا يتباعد عن جحره في طلب الرزق؛ يقال لمن لا يبتعد عن منزله كثيرا.
  source: abboudi_amthal
  page: 634
  volume: ج٢
  status: draft

- id: s0771
  kind: saying
  prompt: المال بيجرّ المال والقمل بيجرّ ___
  answer: الصيبان
  others: [الجيران, الديدان, الفيران]
  note: الغنى يجلب الغنى والفقر يجلب الفقر.
  source: asadi
  line: 136569
  halab: p796
  status: draft

- id: s0772
  kind: saying
  prompt: برمة ___ ما تخمد
  answer: الشراكة
  others: [الجيران, الضيوف, العزّاب]
  note: البرمة قدر الطبخ، و«تخمد» في لهجة اليمن تعني تنضج؛ فالطبخة التي يتولاها طبّاخون كثيرون لا تنضج، وكذلك العمل الذي تتزاحم عليه الأيدي بلا حاجة.
  source: iryani
  page: 246
  status: draft

- id: s0773
  kind: saying
  prompt: البحر ما ينفد فيه ___
  answer: السحر
  others: [الحجر, المطر, الملح]
  note: يقال لكبير الهمة الذي لا يؤثر فيه كلام النمامين ولا يغيّر رأيه.
  source: taymur
  page: 99
  status: draft

- id: s0774
  kind: saying
  prompt: شتوة ___ بتحيي كل عرق فان
  answer: نيسان
  others: [آذار, شباط, كانون]
  note: مطر شهر نيسان يعيد الحياة إلى كل عرق ذابل.
  source: sahli
  page: 183
  status: draft

- id: s0775
  kind: saying
  prompt: تِينْجِيبْ لَبْحِيرَه عْلَى ظْهُورْ ___
  answer: الْجْمَالْ
  others: [الْبْغَالْ, الْحْمِيرْ, الْخِيلْ]
  note: البحيرة في المغرب بستان الخضر، ومن يزعم أنه يحمله على ظهور الجمال يحلّق في الخيال. يقال لمن يكثر الكذب والأوهام.
  source: dadoun
  page: 55
  status: draft

- id: s0776
  kind: saying
  prompt: ما تحن ناقه على غير ___
  answer: حوارها
  others: [ضيفها, جارتها, حبلها]
  note: «الحوار» ولد الناقة؛ لا يتعاطف أحد مع غيره إلا إذا ربطته به قرابة أو نسب.
  source: mughniyya
  page: 480
  status: draft

- id: s0777
  kind: saying
  prompt: من لم يكن لأمه كيف يكون ___
  answer: لخالته
  others: [لجاره, لعمه, لأخته]
  note: من ساءت أخلاقه مع أقرب الناس إليه فكيف يحسن إلى غيرهم.
  source: adimi
  page: 386
  status: draft

- id: s0778
  kind: saying
  prompt: الحكي ما عليه ___
  answer: كمرك
  others: [ملح, قفل, ميزان]
  note: يُقال فيمن يطلق الكلام والوعود جزافاً لأن الكلام لا يكلّفه شيئاً.
  source: asadi
  line: 147532
  halab: p1323
  status: draft

- id: s0779
  kind: saying
  prompt: قلل طعامك تحمد ___
  answer: منامك
  others: [عيالك, صحابك, ربعك]
  note: للنهي عن الإسراف حتى في النافع، فالإسراف يقلب اللذيذ إلى شيء مقلق.
  source: juhayman
  page: 317
  volume: ج٥
  status: draft

- id: s0780
  kind: saying
  prompt: راس مال الدلال ___
  answer: الكذب
  others: [اللسان, الصبر, الحيلة]
  note: أي إن الكذاب ليس له رصيد في حياته غير الكذب والتدليس.
  source: akwa
  page: 517
  volume: ج١
  status: draft
