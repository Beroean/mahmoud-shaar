  answer: لحافه
  others: [ثوبه, بيته, ناره]
  note: من كان غطاؤه سميكا خف عليه البرد، ومن كان غطاؤه رقيقا اشتد عليه. فكل إنسان يتأثر بالشدائد بحسب ما عنده من عدة.
  source: juhayman
  page: 62
  volume: ج٦
  status: draft

- id: s0075
  kind: saying
