  answer: جدرانًا من التراب المدكوك بين ألواح الخشب
  others: [دككًا ومقاعد خشبية لصحون البيوت, أقفالًا وسكّرات حديدية للأبواب, دكاكين خشبية متنقلة لباعة الأسواق]
  note: الدكّ عندهم الحائط المبني من التراب، يُصبّ بين لوحين من الخشب مربوطين بالحبال ثم يُدكّ.
