  others: [السلّة الصغيرة التي يجمع فيها المحار, الساعة الواحدة من ساعات العمل في السفينة, الحبل الذي يُشدّ به الغواص إلى السفينة]
  note: التبّة هي المرّة الواحدة من الغوص نزولاً وطلوعاً، فمن غاص عشر تبّات نزل البحر عشر مرّات.
