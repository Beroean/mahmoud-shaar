  answer: العصا
  others: [الحذاء, الحبل, القنديل]
  note: العصا لا ترى، لكن الأعمى يستدل بها على طريقه.
  source: khadousi
  page: 145
  status: draft

- id: w0438
  kind: origin
  prompt: تارازا
  hint: قبعة من الخوص تقي من حرّ الشمس
  answer: الأمازيغية
  others: [الفرنسية, الإسبانية, التركية]
  note: من الأمازيغية «تارازال»، وهي اسم مركب.
  source: chafik
  page: 73
  status: draft

- id: w0439
  kind: custom
  prompt: ما الذي كان يفعله «المدرّك» بأغصان الليمون والنارنج في دور دمشق؟
  answer: يحيط الغصن بعلبة تراب حتى تنبت له جذور فيقطعه
  others: [يطعّم الغصن بغصن من شجرة أخرى طيبة الثمر, يقلّم الغصن في الربيع ليكثر حمل الشجرة, يدهن الغصن بالحمّر ليمنع الدود من صعوده]
  note: كان يدور في الأزقة حاملًا علبًا خشبية، ويسمى الغصن المجذّر «التدريكة»، فإن لم يحتجها صاحب الدار باعها للمدرّك الذي يبيعها بأضعاف ثمنها، وأهل الصالحية أتقن الناس لها.
