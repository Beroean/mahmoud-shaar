  status: draft

- id: w0323
  kind: custom
  prompt: كان بائع الثوم في دمشق ينادي «يبرودي يا توم»، فلماذا «يبرودي»؟
  answer: لأن أجود الثوم يأتي من بلدة يبرود
  others: [لأن الثوم يُبرَّد في الماء قبل بيعه, لأن سوق الثوم في دمشق يسمى يبرود, لأن باعة الثوم كلهم من أهل يبرود]
  note: يبرود بلدة تتبع قضاء النبك، وكان الثوّام يشتري الثوم ويحمله على حماره وينادي عليه بهذا النداء.
