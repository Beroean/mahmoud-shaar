  answer: أن تقضمها من المكان الذي أكل منه
  others: [أن تذيبها في ماء الورد وتشربها, أن تحتفظ بها في صندوق جهازها, أن توزّعها على صديقاتها]
  note: كانوا يقولون إنها بذلك تصير حلوة في عين زوجها.
