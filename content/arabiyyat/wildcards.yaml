  others: [بكثرة الضرائب التي تُفرض على العربات, بغلاء العلف الذي تأكله الخيل, بكثرة الحوادث التي تقع في الطرقات]
  note: يقول إن صاحب العربات يشتري الدابة قوية كأنها برج من حديد، فلا تمضي مدة حتى تهزل وتتعطل يداها ورجلاها.
