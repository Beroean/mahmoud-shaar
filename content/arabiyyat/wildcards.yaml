  answer: الفارسية
  others: [التركية, الهندية, البرتغالية]
  note: كلمة إيرانية معناها «يوجد»، تقابل قول البغداديين «أكو»، وتُسمع في جزيرة فيلكا.
  source: hanafi
  page: 398
  status: draft

- id: w0366
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الترّاس»؟
  answer: ينقل الحبوب على الحمير إلى البوايكي
  others: [يحرس بيادر القمح في الليل, يطحن الحبوب في طاحون الماء, يزن أكياس الحبوب بالقبّان]
  note: كان يسوق حميره المحمّلة بالحبوب بين الفلاحين وأصحاب مخازن الحبوب من الفجر إلى الضحى، ويقال لها «حمير الترّاسة».
