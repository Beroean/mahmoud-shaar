  others: [شبان المحلة الذين يحملون الجهاز على ظهورهم, إخوة العروس الذين يحرسون بابها ليلة الزفاف, العازفون الذين يرافقون موكب العريس]
  note: كانوا يصحبونه ثلاثة أيام وبعضهم سبعة، ويُدعى كل يوم إلى بيت أحدهم أو إلى ظاهر المدينة في الربيع.
  source: hamoudi
  page: 68
  status: draft

- id: w0631
