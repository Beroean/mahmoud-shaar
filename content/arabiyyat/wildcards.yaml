- id: w0482
  kind: custom
  prompt: ما العلامة التي كانت تُعلن في القوش أن أحد ساكني الدار سيتزوج قريبًا؟
  answer: نقش الحائط فوق باب الدار بالورود
  others: [تعليق سعفة نخل خضراء على باب الدار, إيقاد سراج على سطح الدار كل ليلة, نشر سجادة ملونة على سور الدار]
  note: كان ذلك قبل الاحتفال بثلاثة أو أربعة أيام، بعد تبييض القوس الذي يعلو الباب بالجص.
  source: hamoudi
  page: 133
  status: draft

- id: w0483
  kind: origin
  prompt: البادْگِير
  hint: برج على سطح البيت يجلب الهواء من الأعالي إلى الغرف ليلطّفها صيفاً
  answer: الفارسية
  others: [التركية, الهندية, الإنجليزية]
  note: أصلها «باد گير» أي جالب الهواء أو ممسكه، والكلمة معروفة أيضاً في بغداد والشارقة.
  source: hanafi
  page: 31
  status: draft

- id: w0484
  kind: root
  prompt: القْوَيْصِره
  hint: أسفل الظهر وما حوله، ومن أطيب لحم البعير
  answer: الضُّلُوع القِصار
  others: [القَوْصَرّة, القَصّار, القُصّة]
  note: هي تصغير «القاصرة»، وسميت بذلك لوجود الضلوع القصار فيها.
  source: abboudi
  page: 400
  volume: ج١٠
  status: draft

- id: w0485
  kind: custom
  prompt: في حمّامات دمشق، ما «طاقة الوقّاد»؟
  answer: فتحة أعلى تنّور القميم يلقي منها الوقيد
  others: [نافذة في قبة الحمام يدخل منها الضوء, كوّة يناول منها الوقّاد الماء الحار, حجرة صغيرة ينام فيها الوقّاد ليلًا]
  note: كان الوقّاد يجلس بجانبها ويلقي فيها ما جفّ من الزبل والقمامة لتسخين ماء الحمّام، وأكثر أهل الحرفة من فلاحي جبل قلمون.
  source: qasimi
  page: 496
  volume: ج٢
  status: draft

- id: w0486
  kind: riddle
  prompt: دراهم بابا ماينحسبوا وحايك يما ما ينطوى
  answer: النجوم والسماء
  others: [الرمل والصحراء, الحصى والوادي, المطر والسحاب]
  note: النجوم دراهم لا تُعدّ، والسماء ثوب لا يُطوى.
  source: khadousi
  page: 107
  status: draft

- id: w0487
  kind: origin
  prompt: بامْيا
  hint: الخضار المعروف
  answer: اليونانية
  others: [الفارسية, التركية, القبطية]
  note: يذكر القاموس أنها إغريقية الأصل، وأن البامية دخلت العربية منذ القدم.
  source: qasim
  page: 74
  status: draft

- id: w0488
  kind: custom
  prompt: كيف كان بعض مدمني النرگيلة في بغداد «يورّثون» الفحم، أي يجعلونه جمرًا؟
  answer: يضعونه في سلة سلكية صغيرة ويدوّرونها حول رؤوسهم
  others: [يدفنونه في رماد التنور ساعة, ينفخون عليه بمنفاخ من الجلد, يرشّون عليه قليلًا من النفط الأبيض ويشعلونه في فناء الدار]
  note: يضعون مع الفحم جمرة صغيرة، فإذا دارت السلة بسرعة اشتعل الفحم كله وصلح لتعمير رأس النرگيلة.
  source: hijiyya
  page: 86
  status: draft

- id: w0489
  kind: origin
  prompt: اللّدون
  hint: الرصاص (المعدن)
  answer: الأمازيغية
  others: [اللاتينية, الإيطالية, الفارسية]
  note: من الأمازيغية «ألدون» أي الرصاص.
  source: chafik
  page: 160
  status: draft

- id: w0490
  kind: riddle
  prompt: إذا مشي ما يبعّد وإذا وقف ما يتعب
  answer: الباب
  others: [الحصان, الظلّ, الطريق]
  note: الباب يتحرك ذهابًا وإيابًا دون أن يبتعد، ويقف طوال اليوم دون تعب.
  source: bensalah_souf
  page: 10
  status: draft

- id: w0491
  kind: origin
  prompt: بقشيش
  hint: عطية، نفحة
  answer: الفارسية
  others: [الإيطالية, الفرنسية, الإسبانية]
  note: من الفارسية «بخشش» أي العطية، من الفعل «بخشيدن» أي وهب.
  source: alloub
  page: 62
  status: draft

- id: w0492
  kind: custom
  prompt: ما «الانكاري» الذي كان يُهدى لأهل المولود في تلعفر؟
  answer: طعام مطبوخ، في العادة برغل مع لحم
  others: [قطعة قماش أبيض يُخاط منها قماط الطفل الأول, سوار فضي يُلبس في معصم المولود, كيس من الحنطة لطحين البيت]
  note: كانت هدايا الولادة تشمل أيضًا القماش والنقود والحلي، ويقول الكاتب إن هذا النوع في طريقه إلى الانقراض.
  source: hamoudi
  page: 100
  status: draft

- id: w0493
  kind: root
  prompt: دَشَّر
  hint: أهمل ماشيته أو ولده يذهب ويجيء بلا رعاية، ومنه «الداشر»
  answer: الجَشْر
  others: [النَّشْر, الدَّثْر, الحَشْر]
  note: في الفصحى «جشرنا دوابّنا» أي أخرجناها إلى المرعى تبيت مكانها ولا تأوي إلى أهلها، فقلبت العامة الجيم دالًا.
  source: abboudi
  page: 400
  volume: ج٤
  status: draft

- id: w0494
  kind: origin
  prompt: هَنْدَس
  hint: قدّر البناء ورسم أشكاله، ومنه المهندس
  answer: الفارسية
  others: [اليونانية, التركية, الإيطالية]
  note: يرمز لها القاموس بأنها فارسية، ومنها الهندسة والمهندس.
  source: qasim
  page: 1197
  status: draft

- id: w0495
  kind: custom
  prompt: في حقول الفول حول دمشق، ما كان عمل «النكّاشين» في الربيع؟
  answer: يقلعون الأعشاب حول عروق الفول بالنكّاشة
  others: [يقطفون قرون الفول الأخضر للسوق, يبذرون الفول في الأرض المحروثة, يسقون الفول بالماء من السواقي]
  note: النكّاشة آلة كقدوم النجّار لكن عصاها أطول، وكان بعض الفلاحين ينكشون الفول مرتين في السنة ليكثر حمله.
  source: qasimi
  page: 489
  volume: ج٢
  status: draft

- id: w0496
  kind: riddle
  prompt: بيض رفروف يشرب الماء كالخروف
  answer: العجين
  others: [القطن, الإسفنج, الجبس]
  note: العجين أبيض رخو، ويشرب الماء عند العجن.
  source: khadousi
  page: 119
  status: draft

- id: w0497
  kind: origin
  prompt: الجْحْموم
  hint: طائر الشحرور
  answer: الأمازيغية
  others: [الإسبانية, التركية, البرتغالية]
  note: من الأمازيغية «أجحموم»، ومنها اشتقت الدارجة «تجحّم» بمعنى اسودّ.
  source: chafik
  page: 94
  status: draft

- id: w0498
  kind: custom
  prompt: إذا خافت الأم البغدادية على ابنها من العين، ماذا كانت ترمي في النار قبل أن «تنشّر» له؟
  answer: الملح والحرمل
  others: [الكمون والكزبرة, قشر الرمان والحنّاء, البخور والجاوي]
  note: ثم تثقب ورقة زرقاء من أغلفة السكر بدبوس وهي تعدّد من تخشى عيونهم، وترمي الورقة في النار وتبخّر ولدها بدخانها.
  source: hijiyya
  page: 110
  status: draft

- id: w0499
  kind: origin
  prompt: ورشة
  hint: حانوت التصليح
  answer: الإنجليزية
  others: [الفرنسية, الإيطالية, التركية]
  note: من الإنجليزية workshop.
  source: alloub
  page: 243
  status: draft

- id: w0500
  kind: riddle
  prompt: عبد الصمد حلف يمين ويمينه ما فيه حناثة، بعيني شفت إبنادم دخل من باب وخرج من ثلاثة
  answer: الإنسان حين يلبس الجبّة
  others: [المسافر حين يدخل السوق, الراعي حين يدخل الزريبة, الضيف حين يدخل الدار]
  note: من يلبس الجبّة يدخلها من فتحة واحدة، فيخرج رأسه ويداه من ثلاث فتحات.
  source: bensalah_souf
  page: 19
  status: draft

- id: w0501
  kind: custom
  prompt: ماذا كان أهل الكويت يفعلون عند انتهاء شهر صفر؟
  answer: يكسرون القلل الفخارية وينشد الصبيان
  others: [يطلون أبواب البيوت بالجصّ الأبيض, يوقدون النار على سطوح البيوت, يذبحون الذبائح ويوزّعونها]
  note: ينشد الصبيان «طلع صفر دخل ربيع»، وعادة كسر القلل بعد صفر معروفة في بغداد والبصرة أيضاً.
  source: hanafi
  page: 219
  status: draft

- id: w0502
  kind: origin
  prompt: البالُول
  hint: نوع من الأسماك
  answer: التركية
  others: [الفارسية, الهندية, الإنجليزية]
  note: من التركية «بالق» أي السمك.
  source: hanafi
  page: 31
  status: draft

- id: w0503
  kind: root
  prompt: الرُّوبيان
  hint: سمك صغير بحجم الإصبع الغليظ
  answer: الإرْبِيان
  others: [الرُّبّان, الرَّوْب, الرَّيْحان]
  note: ذكره الصغاني «الإربيان» ضربًا من الحيتان، وعدّ المؤلف تسميته «جراد البحر» جهلًا باسمه العربي القديم.
  source: abboudi
  page: 365
  volume: ج٥
  status: draft

- id: w0504
  kind: custom
  prompt: إلى أي مدينة كان بعض أهل تلعفر يتحمّلون مشقة السفر بحثًا عن اسم جديد لمولودهم؟
  answer: الموصل
  others: [بغداد, حلب, أربيل]
  note: يذكر الكاتب أن اسمي «معاذ» و«أنصار» اختيرا بهذه الطريقة، وكان الأب أو الجد يختار الاسم خلال ثلاثة أيام.
  source: hamoudi
  page: 99
  status: draft

- id: w0505
  kind: riddle
  prompt: هي عارية وتكسي كل الناس
  answer: الإبرة
  others: [الشجرة, الشاة, الريح]
  note: الإبرة نفسها بلا كسوة، وبها تُخاط ثياب الناس كلهم.
  source: khadousi
  page: 21
  status: draft

- id: w0506
  kind: origin
  prompt: أَلاجة
  hint: نسيج حريري مخطط تُصنع منه الثياب
  answer: التركية
  others: [النوبية, الإيطالية, القبطية]
  note: يذكر القاموس أن الكلمة تركية الأصل.
  source: qasim
  page: 55
  status: draft

- id: w0507
  kind: custom
  prompt: كيف كان بائع الحليب القادم من القرية يبيع حليبه في أزقة دمشق؟
  answer: يحلب الماشية أمام المشتري
  others: [يغليه في قدر على النار, يبيعه في قِرب من الجلد, يخلطه بالعسل والسكر]
  note: كان يصل قبل طلوع الشمس منادياً بالحليب ويحلب للزبون أمامه، أما بعض أصحاب الدكاكين فكانوا يشوبونه بالماء.
  source: qasimi
  page: 105
  volume: ج١
  status: draft

- id: w0508
  kind: origin
  prompt: القلمونة
  hint: قلنسوة الجلباب المغربي
  answer: الأمازيغية
  others: [البرتغالية, اللاتينية, الإيطالية]
  note: من الأمازيغية «أقلموم»، وتصغيرها «تاقلمومت».
  source: chafik
  page: 150
  status: draft

- id: w0509
  kind: riddle
  prompt: أرض من خشب وزرعها من ذهب ومحراثها من قصب
  answer: اللوح والقلم
  others: [المائدة والسكين, الصندوق والمفتاح, المنسج والمغزل]
  note: يكتب الصبي في الكُتّاب على لوح خشبي بقلم من القصب آياتٍ أثمن من الذهب.
  source: bensalah_souf
  page: 10
  status: draft

- id: w0510
  kind: origin
  prompt: بقسماط
  hint: خبز مقدد
  answer: الفارسية
  others: [الإيطالية, الفرنسية, الإسبانية]
  note: يردّه المؤلف إلى الفارسية «بشماط» بالمعنى نفسه.
  source: alloub
  page: 44
  status: draft

- id: w0511
  kind: custom
  prompt: لماذا وضع البغداديون اللبن والقيمر والحليب في الصينية أمام العروس يوم عقد القران؟
  answer: لأنهم يتفاءلون باللون الأبيض
  others: [ليأكل منها القاضي والشهود, لأنها طعام العروس الوحيد ذلك اليوم, لتُوزَّع على الفقراء بعد العقد]
  note: وضعوا معها الخضرة لأنها علامة البركة، والسكر حتى تكون العروس «حلوة بعيون الرجّال».
  source: hijiyya
  page: 13
  status: draft

- id: w0512
  kind: origin
  prompt: الوانَيْت
  hint: سيارة ذات صفّ واحد من المقاعد، وما وراءه مكشوف لوضع الأحمال
  answer: الإنجليزية
  others: [الفارسية, الهندية, التركية]
  note: من vanette في الإنجليزية، أي الشاحنة الصغيرة.
  source: hanafi
  page: 387
  status: draft

- id: w0513
  kind: root
  prompt: الشُّرّاب
  hint: ما يُلبس في القدم تحت الخُفّ
  answer: الجَوْرَب
  others: [الشَّراب, الجِراب, السِّرْبال]
  note: يرى العبودي أن «الشرّاب» تحريف لكلمة «الجورب» المستعملة قديمًا في العربية، وهي في الأصل معرّبة.
  source: abboudi
  page: 112
  volume: ج٧
  status: draft

- id: w0514
  kind: custom
  prompt: بمن كان أهل البنت في الموصل يفضّلون تزويجها، بحسب مثلهم السائر؟
  answer: صاحب صنعة
  others: [صاحب مال, صاحب جاه, صاحب أرض]
  note: كانوا يقولون إن الصنعة خاتم ذهب في يد صاحبها، فهو يعيش من تعب كتفه وعرق جبينه.
  source: hamoudi
  page: 47
  status: draft

- id: w0515
  kind: riddle
  prompt: تراه في المنام، فإن قلبته تراه في الطعام
  answer: حلم، ملح
  others: [نوم، مون, ليل، لين, طيف، فيط]
  note: 'لعب على الحروف: «حلم» إذا قُلبت صارت «ملح».'
  source: khadousi
  page: 95
  status: draft

- id: w0516
  kind: origin
  prompt: تُرْبال
  hint: المزارع
  answer: النوبية
  others: [الحبشية, التركية, القبطية]
  note: أصلها في النوبية «تُرْبار» أي الممسك بالمنجل، فسُمّي الفلاح بأداة حصاده.
  source: qasim
  page: 160
  status: draft

- id: w0517
  kind: custom
  prompt: ما عمل «نقّار الطواحين» الذي كان يدور في قرى دمشق وأزقتها؟
  answer: يصلح ما فسد من أحجار الطواحين
  others: [يطحن الحبوب للفلاحين بأجرة, يقطع حجارة الطواحين من الجبل, ينظّف قنوات الماء التي تدير الطاحون]
  note: كان أكثرهم من فقراء قريتي التل ومنين، ومعهم آلة من حديد تعرف بـ«الشاقوفة».
  source: qasimi
  page: 486
  volume: ج٢
  status: draft

- id: w0518
  kind: riddle
  prompt: أبيض من الكتان وأرطب من الدقيق، فوق فرنوعة عالية ما عرفوله طريق
  hint: 'فرنوعة: يقصد الرأس'
  answer: الدماغ
  others: [القطن, الثلج, السحاب]
  note: الدماغ أبيض ليّن، محفوظ في أعلى الجسم داخل الرأس فلا طريق إليه.
  source: bensalah_souf
  page: 9
  status: draft

- id: w0519
  kind: origin
  prompt: واخا
  hint: نعم، حسنًا، موافق
  answer: الأمازيغية
  others: [اللاتينية, الإيطالية, الفارسية]
  note: من الأمازيغية «واخا»، وقد تأتي أيضًا بمعنى «ولو» أو «وإن».
  source: chafik
  page: 172
  status: draft

- id: w0520
  kind: root
  prompt: أُمّ عْرَيِّف
  hint: كنية طائر القُوبَعة
  answer: العُرْف
  others: [العِرْفان, العَرّاف, العُرْفُط]
  note: كنّوها بذلك لأن على رأسها ريشًا يشبه عُرف الديك.
  source: abboudi
  page: 125
  volume: ج٩
  status: draft

- id: w0521
  kind: custom
  prompt: ما «الخرّاعة» عند مربّي الحمام في بغداد؟
  answer: أداة يخيف بها الحمام كي يواصل الطيران
  others: [سلة من القصب يبيض فيها الحمام, إناء من الفخار يشرب منه الحمام, شبكة مشدودة على حلقة من الخشب يصطاد بها الطيور]
  note: قد تكون تنكة يضرب بها الحائط أو صفّارة أو خرقة سوداء على عصا، ومنهم من يتخذ جناح صقر أو شاهينًا محنّطًا.
  source: hijiyya
  page: 174
  status: draft

- id: w0522
  kind: origin
  prompt: كارو
  hint: عربة يجرها حصان أو حمار
  answer: الإيطالية
  others: [التركية, الفرنسية, الفارسية]
  note: من الإيطالية carro أي العربة.
  source: alloub
  page: 189
  status: draft

- id: w0523
  kind: origin
  prompt: مُشْرِكِيب
  hint: نوع من الدبابيس
  answer: البجاوية
  others: [النوبية, التركية, الإيطالية]
  note: أصلها البجاوي «مُرْشوكيب».
  source: qasim
  page: 1088
  status: draft

- id: w0524
  kind: custom
  prompt: ما «السِّلْسال» الذي يخشاه البحّارة؟
  answer: حوت صلب الرأس ينطح السفينة إذا رأى ضوء النار
  others: [ريح عاصفة تهبّ فجأة في منتصف الليل وتقلب السفن, صخرة خفية تحت الماء تخرق السفن قرب الساحل, تيّار بحري قويّ يجرّ السفن بعيداً عن طريقها]
  note: يقبل هذا الحوت على ضوء النار حين توقد في السفينة فيناطحها برأسه، وربما خرقها.
  source: hanafi
  page: 178
  status: draft

- id: w0525
  kind: riddle
  prompt: فاكهة الشتاء، وفاكهة الدار، وفاكهة الكلام، أعرفهم يا سي بوعلام
  answer: النار، الأطفال، الطرائف
  others: [البرتقال، الضيوف، الأمثال, الكستناء، العروس، الشعر, الحكايات، الأم، الأخبار]
  note: النار تُدفئ الناس في الشتاء، والأطفال بهجة البيت، والطرائف ملح الحديث.
  source: khadousi
  page: 61
  status: draft

- id: w0526
  kind: origin
  prompt: الدّربالة
  hint: الثوب البالي المرقّع
  answer: الأمازيغية
  others: [البرتغالية, اللاتينية, الإيطالية]
  note: من الأمازيغية «تادربالت»، ومنها في الدارجة «تدربل» أي لبس الأسمال.
  source: chafik
  page: 102
  status: draft

- id: w0527
  kind: custom
  prompt: ماذا كان أهل العروس في الكاظمية يجلبون في اليوم الثاني بعد الزفاف؟
  answer: الگيمر والعسل
  others: [الكبة والمرق, الدولمة والتمن, الكاهي والدبس]
  note: وفي يوم الصبحة نفسه كانوا يجلبون الحلاوة والخبز.
  source: hamoudi
  page: 165
  status: draft

- id: w0528
  kind: root
  prompt: عَصْعَص الرجل
  hint: عجز عن حمل ما على رأسه لثقله
  answer: العُصْعُص
  others: [العَصا, العِصْيان, العُصْفُور]
  note: كأن أصله أن ينحني عُصّه، أي أسفل ظهره، تحت الحمل الثقيل.
  source: abboudi
  page: 196
  volume: ج٩
  status: draft

- id: w0529
  kind: riddle
  prompt: جنينة في الدار مليانة نوّار، تحيا وتعيش بلا ماء، منظرها يسبي لنظار
  answer: الزربية
  others: [المزهرية, الشجرة, السلّة]
  note: الزربية سجادة منسوجة بأزهار ملوّنة، تزيّن البيت دون أن تُسقى.
  source: bensalah_souf
  page: 13
  status: draft

- id: w0530
  kind: origin
  prompt: أمور
  hint: وسيم
  answer: الفرنسية
  others: [الإنجليزية, التركية, اليونانية]
  note: من الفرنسية amour أي الحبيب، فحرّف المصريون نطقها ومعناها إلى «الوسيم»، ومؤنثها «أمورة».
  source: alloub
  page: 37
  status: draft

- id: w0531
  kind: custom
  prompt: كانت في دمشق عائلة لا تخلو دارها من مئة ثعبان وحيّة، فبماذا كانت تطعمها في الغالب؟
  answer: البيض
  others: [الحليب, الفئران, اللحم النيء]
  note: يذكر الكتاب أن تلك الحيّات كانت تشارك أهل الدار طعامهم وتأنس بهم، فلا يجرؤ على دخول الدار إلا من له جسارة.
  source: qasimi
  page: 224
  volume: ج٢
  status: draft

- id: w0532
  kind: origin
  prompt: الواش
  hint: المعلّم في السفينة، أي قبطانها الخبير بالبوصلة والخرائط البحرية
  answer: الإنجليزية
  others: [الفارسية, الهندية, التركية]
  note: من الإنجليزية watch بمعنى الراصد والمراقب.
  source: hanafi
  page: 387
  status: draft

- id: w0533
  kind: custom
  prompt: بائع أي فاكهة كان ينادي «حاج احمد ...» في أسواق بغداد؟
  answer: العنجاص
  others: [المشمش, الخوخ, التين]
  note: لكل فاكهة نداؤها؛ فبائع التين ينادي «وزيري يا تين»، وبائع الخوخ «مسكي يا خوخ».
  source: hijiyya
  page: 131
  status: draft

- id: w0534
  kind: riddle
  prompt: كلما نقص زاد
  answer: الحفرة
  others: [النهر, الكيس, الخبز]
  note: كلما أخذنا من تراب الحفرة اتسعت وكبرت.
  source: khadousi
  page: 89
  status: draft

- id: w0535
  kind: origin
  prompt: سِنْجة
  hint: ما يوزن به في الميزان كالرطل
  answer: الفارسية
  others: [الإيطالية, اليونانية, النوبية]
  note: دخيلة من الفارسية «صنجة»، وجمعها سنجات.
  source: qasim
  page: 568
  status: draft

- id: w0536
  kind: custom
  prompt: حين يبلغ الطفل الكربلائي أربعين يومًا في موسم الورد، أين كانوا يضعونه بعض الوقت لكي لا يصيبه المرض؟
  answer: في سلة ورد محمّدي في السوق
  others: [في حوض ماء الفرات, في حجر جدته عند الضريح, تحت شجرة نخل في البستان]
  note: كانوا قبل ذلك يطيّبون جسمه بسبعة أنواع من العطور لكي لا تؤذيه الروائح الكريهة في الصيف.
  source: hamoudi
  page: 78
  status: draft

- id: w0537
  kind: origin
  prompt: التّيهخة
  hint: الضيق الشديد والحزن والغم
  answer: الأمازيغية
  others: [الفرنسية, الإسبانية, التركية]
  note: من الأمازيغية «تيهخت»، وأصل معناها الوسخ الذي يعلو الأشياء، ثم صارت تدل على الكدر والأسى.
  source: chafik
  page: 89
  status: draft

- id: w0538
  kind: root
  prompt: الشُّولة
  hint: طائر أسود لا يُرى إلا رافعًا ذنبه وخافضه
  answer: شالَ
  others: [شَلَّ, شاخَ, سالَ]
  note: سمي بذلك لأنه يرفع ذنبه، والعرب قالت «شالت الناقة بذنبها» إذا رفعته.
  source: abboudi
  page: 319
  volume: ج٧
  status: draft

- id: w0539
  kind: riddle
  prompt: زوج قصب يصبّن صبّ، واحدة فضّة وواحدة ذهب
  answer: القمح والشعير
  others: [الحليب والعسل, الملح والسكر, الزيت والخلّ]
  note: سنبلتا القمح والشعير تمتلئان حبًّا، ولكل منهما لون يلمع كالفضة أو الذهب.
  source: bensalah_souf
  page: 15
  status: draft

- id: w0540
  kind: origin
  prompt: طُرُمْبة
  hint: المضخة، ويقال أيضًا طرنبة وطلمبة
  answer: الإيطالية
  others: [التركية, الفرنسية, الفارسية]
  note: يذكر القاموس أنها طليانية الأصل.
  source: qasim
  page: 713
  status: draft

- id: w0541
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «المجلّخ»؟
  answer: يشحذ السكاكين والمقصّات على حجر دوّار
  others: [يصقل الأواني النحاسية حتى تلمع, يجلّد الكتب والدفاتر بالجلد, يصلح القِرب الجلدية إذا تخرّقت]
  note: آلته «الجلخ» دولاب يحركه برجله فيدور حجر يمرّ عليه السكين، ثم يشحذه على حجر يسمى «المسنّ»، وأجرته لا تبلغ عشرين بارة.
  source: qasimi
  page: 416
  volume: ج٢
  status: draft

- id: w0542
  kind: origin
  prompt: دمغة
  hint: طابع حكومي
  answer: المغولية
  others: [اليونانية, الإيطالية, الهندية]
  note: تحوير للمغولية «تمغا» أي الخاتم الحكومي، وأُبدلت التاء دالًا.
  source: alloub
  page: 112
  status: draft

- id: w0543
  kind: custom
  prompt: في زفة العريس ببغداد، ماذا كان أولاد المحلة يكسرون عند خروجه من باب الجامع؟
  answer: أباريق ماء فخارية
  others: [صحونًا خزفية, جرارًا مملوءة بالحلوى, قناديل زيت]
  note: كان أحد أصدقاء العريس المرافقين له يعطي الأولاد بعض النقود جزاء ذلك.
  source: hijiyya
  page: 28
  status: draft

- id: w0544
  kind: riddle
  prompt: صوتها صوت غريبة، تحب الفضة على من ترضى، تحب الخلاص على أولاد الناس
  answer: القطار
  others: [البقرة, الطاحونة, الجرس]
  note: القطار له صفير غريب، ويأخذ ثمن التذكرة من المسافرين.
  source: khadousi
  page: 117
  status: draft

- id: w0545
  kind: origin
  prompt: السّْمّوم
  hint: العنب الأخضر الحامض (الحصرم)
  answer: الأمازيغية
  others: [اليونانية, الفرنسية, الإسبانية]
  note: من الأمازيغية «أسمّوم».
  source: chafik
  page: 126
  status: draft

- id: w0546
  kind: custom
  prompt: ما «طشطواتا» في أعراس القوش؟
  answer: طشوت من الدولمة تُرسل إلى بيت العروس
  others: [سلال من الكرزات تحملها البنات إلى الكنيسة, أواني ماء تُكسر على باب العروسين, صحون من الهريسة تُوزع على الفقراء]
  note: يكون ذلك في الأحد أو العيد التالي ليوم النيشان، وتحمل كل طشت فتاة غير متزوجة أو امرأة متزوجة حديثًا.
  source: hamoudi
  page: 130
  status: draft

- id: w0547
  kind: root
  prompt: دَجّ الرجل
  hint: أفلس وذهب ما عنده من المال، فهو داجّ
  answer: الدّاجّ
  others: [الحاجّ, الدُّجى, الدَّجاج]
  note: الداجّ في اللغة الأُجراء والحمّالون الذين يسيرون مع الحجيج ولا شيء عندهم، وفي الأثر «هؤلاء الداجّ وليسوا بالحاج».
  source: abboudi
  page: 334
  volume: ج٤
  status: draft

- id: w0548
  kind: origin
  prompt: صباب
  hint: صمام (من أجزاء محرك العربة)
  answer: الفرنسية
  others: [الإيطالية, الإنجليزية, الفارسية]
  note: من الفرنسية soupape أي الصمام.
  source: alloub
  page: 157
  status: draft

- id: w0549
  kind: riddle
  prompt: غنمنا الكثيرة ما نقدرو نعدّوها، وإذا غدت منها شاة نفقدوها
  answer: خيوط المنسج
  others: [النجوم, حبّات الرمل, أوراق الشجر]
  note: خيوط المنسج كثيرة لا تُعدّ، لكن إذا انقطع منها خيط واحد ظهر أثره في النسيج.
  source: bensalah_souf
  page: 21
  status: draft

- id: w0550
  kind: custom
  prompt: كيف كان الفوّال الدمشقي يُنضج الفول «المدمّس»؟
  answer: يدفن جرّته ليلًا في رماد تنّور الحمّام
  others: [يغليه على نار الحطب في قدر نحاسية, يتركه في فرن الخبز بعد أن يُطفأ, يطبخه في الماء والملح منذ الفجر]
  note: كانت الجرّة تسمى «القدرة»، والرماد الحارّ الخارج من موقد الحمّام يسمى «القصرمل»، فيخرجها الفوّال صباحًا وقد نضج الفول.
  source: qasimi
  page: 344
  volume: ج٢
  status: draft

- id: w0551
  kind: origin
  prompt: كات
  hint: اسم شاع على شركة مقاولات لبنانية للإنشاءات لأن شعارها صورة حيوان
  answer: الإنجليزية
  others: [الفارسية, الهندية, التركية]
  note: كان شعار الشركة صورة قطة، فسمّاها الناس «كات» من الإنجليزية cat.
  source: hanafi
  page: 291
  status: draft

- id: w0552
  kind: custom
  prompt: تقول حكاية بغدادية إن فلاحًا من الكرّادة أُهدي كيس شاي أيام الحرب العالمية الأولى. ماذا فعل به؟
  answer: قدّمه لبقرته ظنًا منه أنه علف
  others: [زرعه في بستانه ينتظر أن ينبت, باعه للعطّار على أنه دواء, أحرقه بخورًا في بيته]
  note: لم يعرف أهل بغداد الشاي إلا بعد الحرب العالمية الأولى وظل استعماله محدودًا، وكان فطورهم قبله الباقلاء المنقوعة والحليب والبيض.
  source: hijiyya
  page: 67
  status: draft

- id: w0553
  kind: riddle
  prompt: موشمة من جهتين والوشام وتاها، الحي شيباته واللي مات هناته
  answer: الدراهم
  others: [الزربية, الحنّة, الرسالة]
  note: النقود منقوشة على وجهيها، يتداولها الأحياء ولا ينتفع بها الميت.
  source: khadousi
  page: 143
  status: draft

- id: w0554
  kind: origin
  prompt: أَجْنَة
  hint: أداة حديدية
  answer: التركية
  others: [الإيطالية, الفارسية, النوبية]
  note: من التركية «إكْنة» بمعنى دبّوس أو إبرة، وتُنطق كافها جيمًا.
  source: qasim
  page: 35
  status: draft

- id: w0555
  kind: origin
  prompt: سْكسو
  hint: الكسكس
  answer: الأمازيغية
  others: [البرتغالية, اللاتينية, الإيطالية]
  note: من الأمازيغية «سكسو، أسكسو»، وهو في الأصل اسم الإناء الذي يُطهى فيه.
  source: chafik
  page: 124
  status: draft

- id: w0556
  kind: root
  prompt: أَضْرَعَت العنز
  hint: علقت من التيس، أي حملت
  answer: الضَّرْع
  others: [الضَّراعة, الضِّرْس, الضَّرِيع]
  note: كأنها من كون ضرع العنز يكبر حين تحمل وتقترب من الولادة.
  source: abboudi
  page: 300
  volume: ج٨
  status: draft

- id: w0557
  kind: custom
  prompt: ما «جمعة الخضر» عند أهل الموصل؟
  answer: أول جمعة من الربيع يخرج فيها الناس للنزهة
  others: [آخر جمعة من رمضان توزَّع فيها الصدقات على فقراء المحلة, أول جمعة بعد الحصاد يُقسم فيها الزرع, جمعة يُزار فيها المرضى في البيوت]
  note: كانت الحلاوة تُصنع قبلها بيوم وتُبيَّت عند رأس الطفل المدلل، ثم توزع صباحًا على الأقارب والجيران.
  source: hamoudi
  page: 74
  status: draft

- id: w0558
  kind: riddle
  prompt: جانا ضيف وضيّفناه، وجاء من بلاد الظلام، أعطيناه لحمتين بلا عظام
  answer: الوليد
  others: [الغريب, القط, الجرو]
  note: يأتي المولود من ظلمة الرحم، فتطعمه أمه من ثدييها.
  source: bensalah_souf
  page: 13
  status: draft

- id: w0559
  kind: custom
  prompt: عند السيوفي الدمشقي، ما أجود أصناف السيوف العتيقة؟
  answer: اليمانية
  others: [الهندية, الشامية, الخراسانية]
  note: يرتبها الكتاب هكذا اليمانية ثم الفعلية ثم الهندية ثم السليمانية، ويذكر أن حرفة السيوفي لم تعد رائجة لقلة الرغبة في السيف.
  source: qasimi
  page: 243
  volume: ج٢
  status: draft

- id: w0560
  kind: origin
  prompt: كوتش
  hint: مدرب
  answer: الإنجليزية
  others: [الإيطالية, الفارسية, اليونانية]
  note: من الإنجليزية الأمريكية coach.
  source: alloub
  page: 204
  status: draft

- id: w0561
  kind: origin
  prompt: البَفْر
  hint: الثلج
  answer: الفارسية
  others: [التركية, الإنجليزية, البرتغالية]
  note: يذكر المؤلف أنها مأخوذة من الفارسية «بَفْر» بمعنى الثلج.
  source: hanafi
  page: 45
  status: draft

- id: w0562
  kind: custom
  prompt: لماذا كان «مبيّض القدور» يمرّ كل يوم في أزقّة بغداد؟
  answer: لأن النحاس بلا طلاء يصدأ فيسمّم الطعام
  others: [لأن القدور تسودّ من نار الحطب, لأن النحاس يلين إذا طُبخ فيه الحامض, لأن البيوت كانت تؤجّر قدورها النحاسية للأعراس والمآتم]
  note: كانت أدوات البيت كلها من الصفر (النحاس)، فيطليها المبيّض بالقلاي والنشادر، وينادي «مبيّض اجدور مبيّض».
  source: hijiyya
  page: 121
  status: draft

- id: w0563
  kind: riddle
  prompt: كفنه حلاوة وميته خشب
  answer: البلح
  others: [الموز, التين, العنب]
  note: ثمرة البلح يكسوها لحم حلو، وفي قلبها نواة صلبة كالخشب.
  source: khadousi
  page: 71
  status: draft

- id: w0564
  kind: root
  prompt: المَشْرَك
  hint: اللحم الذي يشتريه صاحبه من السوق
  answer: الاشْتِراك
  others: [الشَّرَك, الشِّراك, الشُّروق]
  note: كانوا قبل المجازر العامة يشتركون في ذبيحة ويقتسمونها، فسمي اللحم المشترى «مشرك».
  source: abboudi
  page: 137
  volume: ج٧
  status: draft

- id: w0565
  kind: origin
  prompt: بَقْدونِس
  hint: بقل حارّ معروف
  answer: اليونانية
  others: [التركية, الفارسية, النوبية]
  note: يرمز لها القاموس بأنها إغريقية، ويقال أيضًا «مقدونس».
  source: qasim
  page: 119
  status: draft

- id: w0566
  kind: custom
  prompt: ما «الواهلية» التي تصاحب أفراح الختان في كربلاء؟
  answer: خليط من الملبّس والحامض حلو يُنثر على الرؤوس
  others: [أغنية تؤديها النساء عند باب الدار, وليمة من الرز واللحم تُطبخ أمام البيت ويأكل منها المارّة, فرقة من قارعي الطبول والمزامير]
  note: يعقبها مجيء قارعي الطبول والنافخين في البوق، يقفون على عتبة الباب ثم يدخلون الدار.
  source: hamoudi
  page: 80
  status: draft

- id: w0567
  kind: origin
  prompt: الزّْرْزاي
  hint: الحمّال الذي ينقل أمتعة الناس
  answer: الأمازيغية
  others: [التركية, البرتغالية, اللاتينية]
  note: من الأمازيغية «أزرزاي»، نسبة إلى «أزرزو» قرب نهر ملوية، إذ اشتهر أبناؤه بالحمالة في فاس.
  source: chafik
  page: 111
  status: draft

- id: w0568
  kind: riddle
  prompt: رقيقة الجسم رقيقة الجنب، حفيزها في راسها وعينها في الذنب
  answer: الإبرة
  others: [الحيّة, السمكة, القلم]
  note: للإبرة رأس حادّ، وخرمها الذي يدخل فيه الخيط في مؤخرتها.
  source: bensalah_souf
  page: 15
