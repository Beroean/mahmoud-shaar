  answer: وهي تنقل ماء الشرب من العيون والآبار
  others: [وهي تحصد القمح مع أهلها في الحقول, وهي تبيع اللبن في سوق القرية, وهي تتعلم الخياطة عند الراهبات]
  note: أما في الآحاد والأعياد فكان يراها وهي ذاهبة مع أهلها إلى الكنيسة أو عائدة منها.
