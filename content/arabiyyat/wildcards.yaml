- id: w0614
  kind: custom
  prompt: أين كان مربّو الحمام في دمشق يجتمعون لبيع حمامهم وشرائه؟
  answer: في «قهوة الحمام» بسوق السنانية
  others: [في خان أسعد باشا قرب البزورية, في ساحة المرجة قرب السرايا, في سوق الطيور عند باب توما]
  note: كان صاحب تلك القهوة يشتري الحمام ويبيعه لمن يرغب، ومنهم من جعل مركزه في داره.
  source: qasimi
  page: 229
  volume: ج٢
  status: draft

- id: w0615
