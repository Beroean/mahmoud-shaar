  status: draft

- id: w0407
  kind: custom
  prompt: في دمشق قديمًا، من هو «الركّاب»؟
  answer: من يؤجّر حميره للتنقّل بأجرة
  others: [من يصنع الركاب الحديدية للسروج, من يرافق قافلة الحجاج إلى مكة, من يروّض الخيل الصغيرة للركوب]
  note: ويُطلق أيضًا على الأجير الذي يمشي خلف الحمير ليعيدها إلى معلّمه، فيناديه الراكب «يا ركّاب» أو «يا حمّار».
