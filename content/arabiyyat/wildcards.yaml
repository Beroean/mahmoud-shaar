  answer: يقلّم أغصان الكروم والدوالي
  others: [يجمع زبل الدواب من الخانات, يقطف عناقيد العنب ويبيعها, يعصر العنب ويطبخه دبسًا]
  note: كان بعضهم يدور في الأزقة منادياً «زبّار الدوالي» لأنه قلّما خلت دار في دمشق من دالية عنب.
