  others: [القُلّة, القِلَى, الإقالة]
  note: معناها جعل الله مثله قليلًا، كقولهم «لا أكثر الله من أمثاله»، والمراد الدعاء بمحوه أو إبعاده.
  source: abboudi
  page: 521
  volume: ج١٠
  status: draft

- id: w0083
  kind: riddle
  prompt: تبدأ بالسين، لاهي سلسلة ولاهي سكين ولاهي ساقية تجري بماها، ما تحكم حكم السلاطين كان بالحكم اللّي يرضاها
  answer: الساعة
  others: [السفينة, السماء, السحابة]
  note: الساعة تدور بلا ماء، والناس جميعًا يسيّرون أوقاتهم على حكم عقاربها.
