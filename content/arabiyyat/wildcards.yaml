- id: w0072
  kind: custom
  prompt: ماذا كانت «الدلّالة» تحمل معها وهي تدور على بيوت الموصل، فتتعرف من خلاله على البنات؟
  answer: أدوات التجميل لتبيعها للنساء
  others: [الأقمشة لتخيط منها ثياب العرائس, الأدوية والأعشاب لعلاج الأطفال, الخبز والكعك لتبيعه على الجيران]
  note: كانت تبيع المشط والكحل والحمرة لنساء قلّما يخرجن إلى السوق، وتسأل الأمهات في أثناء ذلك عن بناتهن ورغبتهن في تزويجهن.
