  answer: يضرب بالطاسة على حافة الحوض
  others: [يصفّق بيديه ثلاث مرات, ينادي الحمّامچي باسمه, يقرع جرسًا معلّقًا عند الباب]
  note: يسمع الصوت صانع يسمّى «المطلعچي» فيصيح «جاء...ك» ويأتيه بالمناشف، ويحيّيه الحاضرون عند خروجه بقولهم «نعيمًا».
