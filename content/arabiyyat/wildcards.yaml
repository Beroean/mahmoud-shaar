  others: [في إبريق نحاسي كبير يحمله على ظهره, في جرّة فخار يحملها على رأسه, في قربة من جلد يعلّقها على كتفه]
  note: كان يصنع الشراب في داره ويضيف إليه الثلج، ويأخذ في يده كاسات يسقي بها المارّة، وفي الشتاء يبيع الجلّاب بدلًا منه.
