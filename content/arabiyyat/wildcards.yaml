  others: [يحرقها وقودًا لتنّور الحمّام في الحارة, يرميها في نهر بردى خارج سور المدينة, يدفنها في حفر واسعة خارج البلدة]
  note: كان أصحاب البساتين المجاورة لدمشق يزرعون أرضهم مرتين في السنة، فيرسلون خدمهم بدوابّ تحمل سريجة وقفة لجمع القمامة.
