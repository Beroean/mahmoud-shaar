  answer: أهلها الذين كانوا مسافرين في الغوص والتجارة
  others: [قبائل البادية التي نزلت حول المدينة, أهل فيلكا الذين انتقلوا إلى البرّ بعد أن هدأ الوباء, تجّار من الهند استوطنوا الساحل]
  note: عاد المسافرون بعد انقضاء الوباء، وكانوا بضعة آلاف، وتزوّجوا نساء من الزبير والبصرة ونجد وغيرها.
  source: hanafi
