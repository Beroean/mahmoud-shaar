  answer: الآرامية
  others: [التركية, النوبية, الفارسية]
  note: يذكر القاموس أنها آرامية الأصل، وتُستعمل في الشام أيضًا.
  source: qasim
  page: 78
  status: draft

- id: w0368
  kind: custom
  prompt: كيف كان علاج «حبّة بغداد» يبدأ عند أهلها؟
  answer: يخطّ «كاتب» بقلمه حول حدودها حتى لا تتوسع
  others: [يُكوى مكانها بمسمار محمّى على النار ثم يُغطّى بالقطن, تُغسل بماء دجلة سبعة أيام, يُدهن مكانها بالحناء]
  note: بعد التحديد بالقلم توضع عليها لبخة من مواد العطّار، ويقول المؤلف إنها أصابت رأسه هو أيضًا فلم يظهر أثرها إلا بعد الصلع.
  source: hijiyya
  page: 65
  status: draft

