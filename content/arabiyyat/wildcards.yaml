  answer: يناول المستحمّ الفوطة ويأخذ عنه المناشف
  others: [يدلك المستحمّ بالكيس والليفة حتى ينظف, يوقد النار تحت قميم الحمّام طوال النهار, يقبض أجرة الحمّام من الزبائن عند الخروج]
  note: كان يلاحظ أرض الحمّام بالغسل ويعدّ «النورة» ويجفف الفوط، ويأتي بالمناشف لمن أتمّ اغتساله من المتوسطين والفقراء.
