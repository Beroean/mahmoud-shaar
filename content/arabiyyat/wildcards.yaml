  note: يذبحه السمّاك ويشقّه من ظهره ويعلّقه بعودين أمام نار من حطب الطرفة، ويراعي اتجاه الريح فيضع السمكة في الجهة التي تهبّ نحوها حتى تسوق اللهب إليها.
