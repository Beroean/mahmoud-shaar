- id: w0647
  kind: custom
  prompt: في بغداد قديمًا، ما الذي كان الحلاق لا يتقاضاه عن الولد الصغير حتى يوم ختانه؟
  answer: أجرة حلاقة شعره
  others: [ثمن الصابون والماء الحار, أجرة تقليم أظافره, ثمن العطر بعد الحلاقة]
  note: يأخذ الأب ابنه إلى حلاقه الخاص من سن سنتين، ولا يأخذ الحلاق أجرًا عنه حتى يوم «طهوره» أي ختانه.
  source: hijiyya
  page: 47
  status: draft

- id: w0648
  kind: custom
