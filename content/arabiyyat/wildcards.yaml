  answer: التِّنّ
  others: [التِّنِّين, الثّاني, التِّين]
  note: 'التِّنّ في الفصحى التِّرْب، يقال: هم أتنان أي أسنانهم واحدة؛ أما «التنّين» فهو عندهم الحية العظيمة.'
