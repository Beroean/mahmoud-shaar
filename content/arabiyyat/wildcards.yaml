  status: draft

- id: w0314
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الحوّار»؟
  answer: يبيّض جدران البيوت بالحُوّارى
  others: [يبيّض الثياب بالغسل والقصارة, يبيّض أواني النحاس بالقصدير, يطلي الأبواب الخشبية بالدهان]
  note: كان الفقراء يبيّضون بيوتهم بالحوّارى بدل الكلس لأن التكليس أكثر كلفة.
  source: qasimi
  page: 118
  volume: ج١
  status: draft

- id: w0315
  kind: riddle
