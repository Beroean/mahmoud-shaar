  kind: custom
  prompt: من هو «الطوّاش» في الكويت القديمة؟
  answer: تاجر يشتري اللؤلؤ ويبيعه في بغداد والهند
  others: [بحّار يحرس السفينة ليلاً في موسم الغوص من اللصوص, رجل يصلح الأشرعة والحبال في الميناء, غواص ينزل وحده إلى الأعماق البعيدة]
  note: الطوّاشون تجّار اللؤلؤ، يتعهّدون شراءه من الغواصين ثم يسافرون به.
