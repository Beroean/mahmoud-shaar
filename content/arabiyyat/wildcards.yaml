  page: 161
  status: draft

- id: w0071
  kind: custom
  prompt: كيف كان الغواص يُعلم السيب وهو في قاع البحر أنه يريد الخروج؟
  answer: يحرّك الحبل برجله
  others: [يطلق فقاعات من فمه, يقرع حجرين تحت الماء, يفلت المحار من يده]
  note: يسمّون هذه الإشارة «نِبْر الحبل»، فإذا شعر بها السيب جذب الغواص إلى السفينة.
