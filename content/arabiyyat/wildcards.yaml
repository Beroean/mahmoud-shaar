  answer: التِّقْن
  others: [المَكانة, الكِنانة, التَّكْوين]
  note: نقل المؤلف عن الزبيدي أن «التِّقْن» الرجل الحاذق، ومنه قولهم «تِكِن العامل الشيء» أي أتقنه، بالكاف مكان القاف.
  source: abboudi
  page: 335
  volume: ج١
  status: draft

