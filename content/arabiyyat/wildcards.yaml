  answer: الإبريق والكيسان
  others: [الشيخ والتلاميذ, الراعي والغنم, النخلة والفسائل]
  note: يتوسط إبريق الشاي الكؤوس في المجلس، وما يُصبّ فيها يشربه الضيوف لا هي.
