- id: w0655
  kind: riddle
  prompt: السيف اللّي سلّيته بيدي وفي الليل يبان ضواه، لوكان يسعفو العرب والأتراك لامن يقدر يرجعه جواه
  hint: 'جوّاه: غمده'
  answer: الحليب
  others: [البرق, الماء, الصوت]
  note: يُستلّ الحليب من الضرع بيد الحالب خيطًا أبيض، ولا يقدر أحد على إعادته إليه.
