  answer: القصبة
  others: [الحمامة, العصا, الربابة]
  note: القصبة ناي من عود يابس، يخرج منه لحن كتغريد الطير.
  source: bensalah_souf
  page: 10
  status: draft

- id: w0307
  kind: custom
  prompt: ما «قوطية التجميع» التي كان أطفال بغداد يضعون فيها عيدياتهم؟
  answer: علبة مغلقة من الخشب أو التنك فيها فتحة للنقود
  others: [كيس من القماش تخيطه الأم للعيد, جرّة فخارية صغيرة تُدفن في الحوش وتُكسر في العيد التالي, درج صغير في صندوق الجدة]
  note: كانت تعوّد الأطفال على الادخار، ويقولون في ذلك «القرش الأبيض ينفع في اليوم الأسود».
  source: hijiyya
  page: 108
  status: draft

- id: w0308
