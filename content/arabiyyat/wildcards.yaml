  others: [يشعلون النار ويرمون فيها الملح, ينشرون الثياب البيضاء على الحبال, يطفئون السرج ويلزمون الصمت]
  note: كان يصاحب ذلك الأذان والتكبير في المساجد حتى ينجلي الخسوف أو الكسوف.
