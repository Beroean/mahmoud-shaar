  answer: امرأة سعيدة في زواجها
  others: [أصغر أخوات العريس, القابلة التي ولّدتها, أكبر نساء المحلة سنًّا]
  note: كانوا يتيمّنون بها لعل الله يجعل العروس سعيدة مثلها، وتوزَّع أكياس الحناء على البنات للبركة.
  source: hamoudi
  page: 65
  status: draft

- id: w0311
