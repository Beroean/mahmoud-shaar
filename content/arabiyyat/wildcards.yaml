  answer: المُصَفَّح
  others: [المُصَفَّد, المُصْلِح, المُفْلِح]
  note: أصلها «مصفّح» زادوا فيها اللام للمبالغة، كأن في الرأس صفائح تجعله غير مستوٍ.
