  source: alloub
  page: 202
  status: draft

- id: w0628
  kind: custom
  prompt: في «ليلة الحنّة» ببغداد قديمًا، من كانت تبدأ بوضع الحناء في يدي العروس؟
  answer: القابلة التي ولّدت أم العروس
  others: [أم العريس, أكبر أخوات العروس, الحفّافة التي زيّنتها]
  note: فإن لم تكن القابلة حاضرة قامت بذلك جدة العروس، وكانت الحاضرات يلقين نقودًا في طاسة الماء تكون من نصيب القابلة.
  source: hijiyya
