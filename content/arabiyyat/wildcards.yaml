# Round 3 · origin (which language a word came from) · root (its classical Arabic word) ·
#           riddle (the book's answer) · custom (a question about an old custom, craft or cry).
#
# Day N plays item N of each list; items past the shortest list are spares. answer/others: the
# book's answer and three wrong ones the book rules out. note: shown after answering, in our own
# words (never copied from the book). source: id in sources.yaml · page: printed page · volume:
# for multi-volume books · line/halab: the Aleppo book's text line and the حلبيّات spare it reuses ·
# flag: something a reviewer should check · status: draft until a person reviews it.

- id: w0001
  kind: riddle
  prompt: إذا كثر حراسه انباح، ما هو ملك ما هو مداح
  answer: السر
  others: [الكنز, الحصن, البيت]
  note: السرّ إذا عرفه كثيرون لم يعد سراً.
  source: khadousi
  page: 65
  status: draft

- id: w0002
  kind: origin
  prompt: ترتالا
  hint: عدد كثير لا يُحصى
  answer: الأمازيغية
  others: [اللاتينية, الإيطالية, الفارسية]
  note: 'من الأمازيغية «تارتالا»، وحرفيًّا: ما ليس له وجود، أي عدد لا يكاد يُصدّق لكثرته.'
  source: chafik
  page: 85
  status: draft

- id: w0003
  kind: custom
  prompt: بأيّ منسوجات اشتهرت الموصل، وكانت من منامات جهاز العروس؟
  answer: الجواجيم، وهي أكسية من الصوف
  others: [السجاد الحريري الملوّن, البسط المصنوعة من سعف النخل, الحصران المنسوجة من القصب]
  note: الجاجيم كساء صوفي يُتغطى به، ويشبهه «الحرام» إلا أنه يُنسج من غزل القطن.
  source: hamoudi
  page: 73
  status: draft

- id: w0004
  kind: riddle
  prompt: فرد جفّال وهرّاب من كل غاشي، لاهو في السماء طيّار ولاهو في الوطا ماشي
  answer: السمك
  others: [الغزال, الأرنب, الحمام]
  note: السمك سريع النفور، لا يطير في الجو ولا يمشي على الأرض بل يسبح في الماء.
  source: bensalah_souf
  page: 21
  status: draft

- id: w0005
  kind: origin
  prompt: كركون
  hint: قسم الشرطة
  answer: التركية
  others: [الفارسية, الإيطالية, اليونانية]
  note: من التركية «قره قول» أي الذراع السوداء.
  source: alloub
  page: 195
  status: draft

- id: w0006
  kind: root
  prompt: يجاجي
  hint: يكتفي بالكلام عن الشجاعة ويحجم عن المواجهة (فلان يجاجي ولا يلاقي)
  answer: التَّجَأْجُؤ
  others: [المُحاجّة, الحِجا, التَّجافي]
  note: في اللغة «تجأجأ عن الأمر» أي كفّ عنه وهابه وتأخر، و«الجأجاء» الهزيمة.
  source: abboudi
  page: 72
  volume: ج٢
  status: draft

- id: w0007
  kind: custom
  prompt: في ليالي «الكركوزاتي» بمقاهي دمشق، كيف كان يُقسم ما يجتمع للقهوة من مال؟
  answer: شطرين بين القهوجي والكركوزاتي
  others: [كله للقهوجي وللكركوزاتي أجرة ثابتة, ثلثاه للكركوزاتي وثلثه للقهوجي, كله للكركوزاتي وللقهوجي ثمن القهوة]
  note: كان الكركوزاتي ينصب ستارة في زاوية القهوة ويضيئها بسراج زيت، ويحرّك الخيالات ويتكلم بلسانها، وتروج حرفته في الشتاء.
  source: qasimi
  page: 384
  volume: ج٢
  status: draft

- id: w0008
  kind: origin
  prompt: الكُلاو
  hint: غطاء الرأس يلبسه الصبيان
  answer: الفارسية
  others: [التركية, الهندية, الإنجليزية]
  note: من الفارسية «كلاه» أي القلنسوة.
  source: hanafi
  page: 297
  status: draft

- id: w0009
  kind: custom
  prompt: ماذا سمّى أهل الموصل الهدايا التي تحملها العروس لأفراد أسرة زوجها وللخدم والسقّاء؟
  answer: الخلع
  others: [النيشان, الصبحية, البخشيش]
  note: كانت العروس تقدّم لكل واحد منهم ما يناسب سنّه ومقامه، ويُعرض بعضها على الحاضرات في حفلة لاحقة.
  source: hamoudi
  page: 55
  status: draft

- id: w0010
  kind: riddle
  prompt: بنات مسعود عمايمهم خضر وثيابهم سود
  answer: الباذنجان
  others: [الزيتون, البطيخ, الخروب]
  note: الباذنجان ثوبه أسود لامع وقمّته الخضراء كالعمامة.
  source: khadousi
  page: 97
  status: draft

- id: w0011
  kind: origin
  prompt: ماشَة
  hint: ملقط يُلقط به الجمر
  answer: الفارسية
  others: [التركية, الإيطالية, النوبية]
  note: يذكر القاموس أنها فارسية الأصل، وترد في لهجة الشام أيضًا.
  source: qasim
  page: 1108
  status: draft

- id: w0012
  kind: root
  prompt: الشّاذوب
  hint: سمك بحري مفترس يخشاه الغوّاصون، ولعله القرش
  answer: الشَّذْب
  others: [الشَّذا, الشُّذوذ, الشِّذْر]
  note: سمي بذلك لأنه «يشذب» ما يصل إليه من جسم الغائص، أي يقطعه كما يُقطع بالمشذاب.
  source: abboudi
  page: 101
  volume: ج٧
  status: draft

- id: w0013
  kind: custom
  prompt: لماذا كان أصحاب كروم العنب في الشام يشترون «الحُمَّر» من الحمّرجي؟
  answer: ليدهنوا به الكرمة فيمنع الدود عنها
  others: [ليسمّدوا به تربة الكرم في الشتاء, ليطلوا به العنب فيحمرّ لونه, ليختموا به جرار الدبس والخل]
  note: الحمّر علك أسود يُطبخ بعكر الزيت ويُدهن به أصل الكرمة، فيمنع دودة تصعد إليها وتأكل عيون حملها.
  source: qasimi
  page: 116
  volume: ج١
  status: draft

- id: w0014
  kind: origin
  prompt: الهيشة
  hint: الدابة الغريبة الضخمة
  answer: الأمازيغية
  others: [الإسبانية, التركية, البرتغالية]
  note: من الأمازيغية «تاهيشت».
  source: chafik
  page: 171
  status: draft

- id: w0015
  kind: riddle
  prompt: كرشه جلود وظهره عود وراسه في جهنّم ممدود
  answer: الكير
  others: [المنجل, القدر, الملعقة]
  note: الكير منفاخ الحدّاد، بطنه من جلد ومقبضه من خشب، وطرفه ممدود في النار.
  source: bensalah_souf
  page: 22
  status: draft

- id: w0016
  kind: custom
  prompt: ماذا كانت «الحفّافة» تجعل في نهاية كل جديلة من شعر العروس الموصلية يوم زفافها؟
  answer: جنادل من ذهب
  others: [وردة جوري, شرائط من الحرير, خرزة زرقاء]
  note: كانت تمشط شعرها وتعقد مقدّمه في ما يسمونه «الكصّة»، وتثبّته بمشط مذهّب.
  source: hamoudi
  page: 65
  status: draft

- id: w0017
  kind: origin
  prompt: سادة
  hint: خالٍ من السكر
  answer: الفارسية
  others: [الإيطالية, اليونانية, الفرنسية]
  note: من الفارسية «ساده» أي البسيط الخالي، ومنها أيضًا كلمة «ساذج».
  source: alloub
  page: 125
  status: draft

- id: w0018
  kind: custom
  prompt: إلى جانب السروج، صنع السروجي الدمشقي للكتب بيوتًا من جلد، فماذا كانت تسمى؟
  answer: المحافظ
  others: [الحمايلي, الجِعاب, الأقربة]
  note: كان أهل سوق السروجية يصنعون كل ما يلزم الدابة من جلد، ويصنعون بيوتًا للمسدسات والكتب، أما بيوت التمائم فكانت تسمى الحمايلي.
  source: qasimi
  page: 181
  volume: ج١
  status: draft

- id: w0019
  kind: origin
  prompt: الكُوسْت
  hint: الشاطئ، ومنه قولهم «هوا كوست» للهواء الحار الهابّ من الجنوب
  answer: الإنجليزية
  others: [الهندية, التركية, الملايوية]
  note: من الإنجليزية coast أي ساحل البحر، ويحتمل المؤلف أن تكون من «كوش» بمعنى الجنوب في لهجة لارستان.
  source: hanafi
  page: 302
  status: draft

- id: w0020
  kind: riddle
  prompt: قدمه للحيوان، رأسه للإنسان، اعرفه يا صاحب الشان
  answer: القمح
  others: [الشجرة, النخلة, الكرمة]
  note: تبن القمح علف للحيوان، وسنبلته طعام للإنسان.
  source: khadousi
  page: 169
  status: draft

- id: w0021
  kind: root
  prompt: سيف سِنِين
  hint: حادّ قاطع
  answer: المِسَنّ
  others: [السِّنِين, السُّنّة, السَّنا]
  note: أصلها أن السيف قد سُنّ، أي حُدّد طرفه بالمسنّ وهو حجر يُشحذ عليه الحديد.
  source: abboudi
  page: 432
  volume: ج٦
  status: draft

- id: w0022
  kind: origin
  prompt: جِرْتِق
  hint: عادة من عادات الزواج يُختم بها العرس
  answer: النوبية
  others: [البجاوية, التركية, الحبشية]
  note: من «جِرْت» النوبية، وهي زينة تُلبس عند الختان أو الزواج.
  source: qasim
  page: 212
  status: draft

- id: w0023
  kind: custom
  prompt: أيّ نوع من السفن انتشر في الكويت للغوص حتى طغى على البتيل والبقّارة؟
  answer: السَّنْبُوك
  others: [البغلة, البلم, اللنج]
  note: انتشرت صناعة السنابيك في الكويت متأخرة، وقد ذكرها ابن بطوطة في رحلته بلفظ «صنبوق».
  source: hanafi
  page: 181
  status: draft

- id: w0024
  kind: origin
  prompt: شرّوط
  hint: مزّق الثوب
  answer: الأمازيغية
  others: [الفارسية, اليونانية, الفرنسية]
  note: من الفعل الأمازيغي «ئشرّوض»، ومنه «الشرويطة» أي المزقة من القماش.
  source: chafik
  page: 131
  status: draft

- id: w0025
  kind: riddle
  prompt: إسمه بالطاء وإحرز الطاء علاش يفوت، إليا مرض مرضتين الثالثة فيها يموت
  answer: الطلاق
  others: [الطريق, الطين, الطبل]
  note: الطلاق تجوز الرجعة بعد مرّتيه الأوليين، أما الثالثة فتنهي الزواج.
  source: bensalah_souf
  page: 9
  status: draft

- id: w0026
  kind: custom
  prompt: ما الآلتان الموسيقيتان المعتادتان طوال أيام العرس الثلاثة في القوش؟
  answer: الطبل والزرناية
  others: [العود والدف, الناي والربابة, الدنبك والسنطور]
  note: الزرناية مزمار شعبي، وكان عازفها يصعد سطح دار العريس مبكرًا معلنًا بدء الاحتفال.
  source: hamoudi
  page: 131
  status: draft

- id: w0027
  kind: origin
  prompt: خواجة
  hint: لقب ينادى به الأجانب
  answer: الفارسية
  others: [الإيطالية, اليونانية, الفرنسية]
  note: من الفارسية «خواجه» أي السيد، ومنها جاءت «خوجة» بنطقها التركي.
  source: alloub
  page: 104
  status: draft

- id: w0028
  kind: custom
  prompt: في أي يوم كانت ليلة حنّة العريس في الكاظمية عادةً؟
  answer: الأربعاء
  others: [الاثنين, الجمعة, السبت]
  note: يكون الزفاف يوم الخميس، وتطول ليلة الحنة بالغناء والطرب حتى الفجر.
  source: hamoudi
  page: 158
  status: draft

- id: w0029
  kind: root
  prompt: بَتّان
  hint: مرة ثانية، كمان
  answer: البَتّ
  others: [التَّبّ, الثَّبات, البَيان]
  note: يردّها القاموس إلى «البَتّ» الفصيح بمعنى القطع.
  source: qasim
  page: 78
  status: draft

- id: w0030
  kind: origin
  prompt: دِرْكِلّة
  hint: الدلّوكة، طبل الغناء
  answer: الحبشية
  others: [النوبية, التركية, الفارسية]
  note: يذكر القاموس عن الخفاجي أن الدركلة لعبة للحبشة، معرَّب من لغتهم.
  source: qasim
  page: 375
  status: draft

- id: w0031
  kind: riddle
  prompt: بيتان من قديم الزمان، من يسكن أحدهما ما يعيش في الآخر بمكان
  answer: البر والبحر
  others: [الليل والنهار, الدنيا والآخرة, الصيف والشتاء]
  note: البر والبحر بيتان قديمان، وما يعيش في أحدهما لا يعيش في الآخر.
  source: khadousi
  page: 45
  status: draft

- id: w0032
  kind: custom
  prompt: ماذا كان «المراياتي» يفعل بالمرآة الكبيرة إذا انكسرت؟
  answer: يقطعها قطعًا صغيرة ويركّب لها براويز
  others: [يطحنها ويبيعها لصانعي الزجاج, يلصق قطعها في سقوف القاعات, يعيد طلاءها لتصير مرآة واحدة]
  note: كان يصلح دهان المرآة إذا فسد ويجدد إطارها، ويصنع براويز مذهّبة لها تيجان، وأخرى مرصّعة بالصدف تُعلّق عليها الثياب.
  source: qasimi
  page: 428
  volume: ج٢
  status: draft

- id: w0033
  kind: origin
  prompt: زْلط
  hint: افتقر وصار معدمًا
  answer: الأمازيغية
  others: [البرتغالية, اللاتينية, الإيطالية]
  note: من الفعل الأمازيغي «ئزلض»، ومنه «المزلوط» أي المعدم شديد الفقر.
  source: chafik
  page: 115
  status: draft

- id: w0034
  kind: riddle
  prompt: أفهم يا فهّام وإذا فهمت حديث المعاني، عايش 270 يوم ويتمنى عمر ثاني
  answer: الجنين
  others: [الضيف, الهلال, المسافر]
  note: يقضي الجنين نحو تسعة أشهر في بطن أمه، ثم يبدأ بالولادة عمرًا جديدًا.
  source: bensalah_souf
  page: 10
  status: draft

- id: w0035
  kind: custom
  prompt: كيف كانوا يعالجون «أبو صفار» (اليرقان) في الكويت؟
  answer: بالكيّ على أصابع اليدين والقدمين
  others: [بخرزة من الكهرمان الأصفر في المعصم, بشرب منقوع الحلبة سبعة أيام, بالحجامة على الظهر والكتفين]
  note: أما البغداديون فكانوا يضعون في معصم المريض خرزة كهرمان صفراء يحسبونها تجذب الصفرة من الجسم.
  source: hanafi
  page: 12
  status: draft

- id: w0036
  kind: origin
  prompt: فنجال
  hint: وعاء الشاي والقهوة
  answer: الفارسية
  others: [الإيطالية, الفرنسية, الإسبانية]
  note: من الفارسية «پنگان» بالمعنى نفسه.
  source: alloub
  page: 179
  status: draft

- id: w0037
  kind: origin
  prompt: البَيْب
  hint: أنبوب الماء، وكذلك الأنابيب التي تمرّ فيها أسلاك الكهرباء على الجدران
  answer: الإنجليزية
  others: [الفارسية, الهندية, التركية]
  note: من الإنجليزية pipe، ويقول له البغداديون «بوري».
  source: hanafi
  page: 55
  status: draft

- id: w0038
  kind: root
  prompt: مِتْقَنْفِذ
  hint: من جمع بعضه إلى بعض من شدة البرد وجعل ركبتيه في بطنه
  answer: القُنْفُذ
  others: [القَفّاز, النَّفاذ, القُنْبُرة]
  note: شبّهوا حاله بالقنفذ إذا انقبض داخل جلده الشائك.
  source: abboudi
  page: 575
  volume: ج١٠
  status: draft

- id: w0039
  kind: custom
  prompt: ماذا سمّى شبان تكريت سباحتهم في دجلة ليلة اليوم الأول من عيد الأضحى؟
  answer: الاغتسال في ماء زمزم
  others: [سباحة الحجاج إلى البحر, غطسة العيد الكبير, ليلة المحية في النهر]
  note: سمّوها كذلك تيمنًا ببئر زمزم، وكانت تكثر في السنين التي يقع فيها عيد الأضحى في الصيف أو أوائل الخريف.
  source: hamoudi
  page: 144
  status: draft

- id: w0040
  kind: riddle
  prompt: قوس بلا سهم، ولا وتر، ولا ينفع في الصيد ولا في الكر
  answer: قوس قزح
  others: [الهلال, الحاجب, القنطرة]
  note: قوس قزح على شكل قوس، لكنه بلا سهم ولا وتر.
  source: khadousi
  page: 51
  status: draft

- id: w0041
  kind: origin
  prompt: الكركور
  hint: كومة الحجارة
  answer: الأمازيغية
  others: [البرتغالية, اللاتينية, الإيطالية]
  note: من الأمازيغية «أكركور».
  source: chafik
  page: 154
  status: draft

- id: w0042
  kind: custom
  prompt: في موسم المشمش حول دمشق، ما كان عمل «المعّاك»؟
  answer: يمرس المشمش المتساقط حتى ينفصل بزره عن لبّه
  others: [يقطف المشمش عن أغصانه بعصا طويلة, يجفّف المشمش على السطوح في الشمس, يطعّم أشجار المشمش البلدي بالحموي]
  note: كان يضع ما يجمعه الشوّار من المشمش المتساقط في «تيغار القمردين» وهو كالحوض، ثم يمرسه بيديه.
  source: qasimi
  page: 454
  volume: ج٢
  status: draft

- id: w0043
  kind: origin
  prompt: أسطى
  hint: ربّ الصنعة
  answer: الفارسية
  others: [الإيطالية, اليونانية, الفرنسية]
  note: من الفارسية «أستا» أي الماهر في صنعته، ويجمعها المصريون «أسطوات».
  source: alloub
  page: 30
  status: draft

- id: w0044
  kind: riddle
  prompt: درس مدروس فيه 32 بركوس
  hint: 'بركوس: الكبش'
  answer: الأسنان
  others: [الأضلاع, حبّات السبحة, أيام الشهر]
  note: في فم الإنسان البالغ اثنان وثلاثون سنًّا مصفوفة كقطيع.
  source: bensalah_souf
  page: 14
  status: draft

- id: w0045
  kind: custom
  prompt: ماذا كان المنادي في تكريت يحمل على كتفه وهو يعلن في الدروب عن شيء مفقود أو مسروق؟
  answer: مصحفًا
  others: [جرسًا, طبلًا, رايةً]
  note: كان ذلك ليكون لندائه وقع أشد على السامعين، فيطلب ممن رأى الشيء أو سمع به أن يدل عليه.
  source: hamoudi
  page: 148
  status: draft

- id: w0046
  kind: origin
  prompt: فَشَنْك
  hint: طلقات دون رصاص
  answer: التركية
  others: [الإيطالية, الفارسية, الفرنسية]
  note: من التركية «فشنك» أي طلق ناري أو خرطوش.
  source: qasim
  page: 861
  status: draft

- id: w0047
  kind: root
  prompt: الإثْم
  hint: 'فم الإنسان وغيره (يقولون: إثم فلان واسع)'
  answer: الفَم
  others: [اللَّثْم, الإثْمِد, الثُّمام]
  note: أبدلوا الفاء ثاءً لقرب مخرجيهما، وبعضهم يقول «الإفم»؛ واستشهد المؤلف بأن العرب قالت «فُمَّ» و«ثُمَّ» بمعنى واحد.
  source: abboudi
  page: 48
  volume: ج١
  status: draft

- id: w0048
  kind: custom
  prompt: في قرى دمشق قديمًا، ما كان عمل «السوّاط»؟
  answer: ينظّف القناة من الحشائش التي تعيق الماء
  others: [يسوق قطعان الماشية إلى المرعى بالسوط, يحفر آبار القناة المتصلة بعضها ببعض, يوزّع ماء القناة على البساتين بالدور]
  note: القناة آبار متلاصقة يجري الماء بينها حتى يخرج على وجه الأرض، والسوّاط يلتزم تنظيفها بأجر، و«يسوط» عندهم بمعنى يحشّ.
  source: qasimi
  page: 243
  volume: ج٢
  status: draft

- id: w0049
  kind: origin
  prompt: گزّن
  hint: تكهّن وتنبأ بالغيب
  answer: الأمازيغية
  others: [الإسبانية, التركية, البرتغالية]
  note: من الفعل الأمازيغي «ئگزّن»، ومنه «الگزّانة» أي العرّافة.
  source: chafik
  page: 156
  status: draft

- id: w0050
  kind: riddle
  prompt: يدي في يده وفمي في فمه
  answer: الطاس
  others: [المرآة, المزمار, الوسادة]
  note: حين نشرب من الطاس نمسكه بأيدينا ونضع فمنا على فمه.
  source: khadousi
  page: 105
  status: draft

- id: w0051
  kind: custom
  prompt: عند دخول العروس الكربلائية بيت العريس، أين كانت تضع يدها اليمنى ليجلب ذلك البركة؟
  answer: في طبق من الرز غير المطبوخ
  others: [في إناء من الحناء المعجونة, في كيس من الطحين, في صحن من الملح]
  note: كانت إحدى قريبات العريس تضيف ذلك الرز إلى كيس الرز في الدار، بعد أن ترفس العروس إناء الماء عند المدخل.
  source: hamoudi
  page: 83
  status: draft

