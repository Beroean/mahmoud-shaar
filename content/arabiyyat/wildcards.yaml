  others: [الحَبْل, الحائل, الحَيْن]
  note: الحيل هو الحول بمعنى القوة كما في «لا حول ولا قوة إلا بالله»، وحكى الكسائي «لا حَيْل ولا قوة إلا بالله».
  source: abboudi
  page: 355
  volume: ج٣
  status: draft

- id: w0644
  kind: custom
