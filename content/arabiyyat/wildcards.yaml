- id: w0395
  kind: custom
  prompt: ما «القايش» الذي يرد في أغاني أعراس الكاظمية؟
  answer: حزام ذهبي تتحزم به العروس
  others: [قلادة ذهبية تزين عنق العروس, سوار عريض في معصم العروس, تاج من الورد على رأس العروس]
  note: تغني الملّة للعروس أن تتمهل حتى يأتي القايش من الصائغ.
  source: hamoudi
  page: 166
  status: draft

