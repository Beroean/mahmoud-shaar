  prompt: لماذا كان البغداديون يدفنون قطعًا من النقود الفضية في عتبة الباب عند تركيبه؟
  answer: طمعًا في الخير والرزق
  others: [لتثبيت العتبة في الأرض, ليعرف الأحفاد تاريخ البناء, ثمنًا للأرض يُدفع للجنّ]
  note: وكانوا يتفاءلون أيضًا بنحر الذبائح عند حفر الأساس وتركيب باب الحوش، ويعلّقون فوق المدخل حدوة حصان أو قرني كبش لطرد العين.
  source: hijiyya
  page: 114
  status: draft

- id: w0435
