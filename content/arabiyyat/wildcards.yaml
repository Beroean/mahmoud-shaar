  hint: لفظة يخاطَب بها الأطفال ويُقصد بها الماء أو الشرب
  answer: القبطية
  others: [النوبية, التركية, البجاوية]
  note: من الكلمة القبطية «أمبمو» بمعنى اشرب، ويذكر القاموس أن تيمور رآها فارسية.
  source: qasim
  page: 58
