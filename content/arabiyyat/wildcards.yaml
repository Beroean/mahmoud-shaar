  page: 17
  status: draft

- id: w0055
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يبيع «الذهبي»؟
  answer: الذهب المحلول والمسحوق للدهان والنقش
  others: [الحليّ والأساور الذهبية للعرائس, الليرات الذهبية لمن يريد الصرافة, خيوط القصب المذهّبة للتطريز]
  note: كان يُستعمل لتزيين الجدران والخشب والكتابة، وكانت الحرفة في يد عائلة عُرفت بـ«بيت الذهبي» ثم صار يأتي من أوروبا.
  source: qasimi
  page: 151
  volume: ج١
  status: draft

- id: w0056
  kind: root
  prompt: خاش
