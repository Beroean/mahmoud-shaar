- id: w0362
  kind: custom
  prompt: ماذا يفعل الشبان العزاب المدعوون عند حلاقة رأس العريس في القوش؟
  answer: يحلقون رؤوسهم وذقونهم معه
  others: [يرشّونه بماء الورد والعطر, يحملونه على أكتافهم إلى الحمام, يغنون له وهم واقفون على السطح]
  note: يبدأ الحلاق بالعريس ثم بالمدعوين، والنساء يزغردن، ثم يدخل العريس الحمام ويخرج بثياب العرس.
  source: hamoudi
  page: 137
  status: draft

- id: w0363
  kind: root
