  note: يُخرج العود من علبته ويُحكّ بجانبها فيشتعل، ثم لا يعود كما كان.
  source: bensalah_souf
  page: 26
  status: draft

- id: w0326
  kind: custom
  prompt: من أي شيء كانت تُصنع «النونة»، النقطة السوداء التي توضع بين حاجبي العروس البغدادية؟
  answer: من السخام على ظهر الطاوة
  others: [من الكحل المخلوط بالزيت, من قشر الجوز المحروق, من الحبر الأسود]
  note: كانت الحفّافة تمسح سواد ظهر الطاوة بإصبعها وترسم به نقطة مستديرة بين الحاجبين، ثم صار يُستعمل لها قلم خاص.
