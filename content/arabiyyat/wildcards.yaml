  answer: ماء حار مذاب فيه السكر
  others: [حليب بقر مغلي بالهيل, ماء مغلي فيه ورق النعناع, عسل ممزوج بالسمن]
  note: كانت الأم تبدأ بإرضاعه بعد ذلك، وإن لم يكن لديها حليب اشترت له العائلة حليب بقر أو جمل.
  source: hamoudi
  page: 78
  status: draft

- id: w0386
  kind: origin
  prompt: الكليلة
  hint: لبن مخيض مطبوخ يُترك حتى يجفّ
  answer: الأمازيغية
