  note: في اللغة «تَغَرت القِدر تَغَرانًا» أي غلت، فشُبّه من امتلأ بطنه فتجشأ بالقدر الفائرة. والأزهري جعلها تصحيف «نغرت».
  source: abboudi
  page: 329
  volume: ج١
  status: draft

- id: w0618
  kind: custom
  prompt: بائع حلويات رمضان في بغداد ينادي «أخاف من البزونة» إذا بات في الدربونة. وماذا يخاف إذا بات في المحطة؟
  answer: أن تجي عليه البطّة
  others: [أن يجي عليه الحارس, أن يجي عليه القطار, أن يجي عليه المطر]
  note: نداؤه كاملًا «زلابية وبقلاوة وشعر بنات، وين أولّي وين أبات، أبات بالدربونة أخاف من البزونة، أبات بالمحطة تجي عليّة البطة»؛ والبزّونة القطة.
  source: hijiyya
  page: 102
  status: draft

- id: w0619
  kind: origin
  prompt: المَتْرة
  hint: البئر المبنية بالطوب يُسحب منها الماء بالساقية
  answer: النوبية
  others: [البجاوية, القبطية, التركية]
  note: من النوبية «مِتْرة».
