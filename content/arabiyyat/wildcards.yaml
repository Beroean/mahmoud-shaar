  answer: تمييز الدراهم الرديئة من الجيدة
  others: [حفظ أسعار الذهب في كل يوم, عدّ النقود الكثيرة بسرعة, كتابة الحوالات بين المدن]
  note: كان الصرّاف يبدّل العملة الذهبية بالفضية أو النحاسية ويأخذ نحو عشرين أو ثلاثين بارة في المئة.
