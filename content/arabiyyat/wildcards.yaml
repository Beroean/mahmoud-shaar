  answer: كي لا تقلبها القطة وتأكل العشاء
  others: [كي لا يطير الغطاء مع الريح, كي يبقى الطعام حارًا تحتها, علامة على أن العشاء لربّ البيت وحده]
  note: سلّة كبيرة من أعواد الرمان والقصب يُحفظ تحتها عشاء من يتأخر ليلًا حتى لا يفسد، واشتهرت بصنعها مندلي وبعقوبة.
  source: hijiyya
  page: 73
