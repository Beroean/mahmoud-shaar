  others: [حفظ الماء باردًا على سطح البيت, إخراج دخان المطبخ من أعلى السطح, إدخال ضوء الشمس إلى وسط البيت في أيام الشتاء]
  note: البادگير تجويف في الجدار يعلو السطح، فتحته العليا توجَّه إلى جهة الريح، وهو في طريقه إلى الزوال لأن المباني الحديثة لا تعرفه.
