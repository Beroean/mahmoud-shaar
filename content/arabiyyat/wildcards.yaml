  note: الرمض شدة وقع الشمس على الرمل، وكأن المنتظر يقف على الرمضاء؛ وفي الأساس «رمّضته» انتظرته ساعة.
  source: abboudi
  page: 339
  volume: ج٥
  status: draft

- id: w0319
