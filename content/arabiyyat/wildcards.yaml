  others: [يُهدى كل واحد منهم خاتمًا من الفضة, يُذبح لهم خروف في دار الفتاة, تُقبّل الفتاة أيديهم واحدًا واحدًا]
  note: مثلًا إذا كانوا خمسة أعيد لكل منهم عشرة دنانير، ويُتفق كذلك على مبلغ يعاد صبحيةً للعروس.
