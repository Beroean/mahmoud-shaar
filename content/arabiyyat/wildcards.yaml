  others: [يغوص إلى القاع ويقطف المحار, يفلق المحار على ظهر السفينة ويستخرج منه اللؤلؤ, يرفع الشراع ويوجّه السفينة]
  note: كان السيب يمسك الحبل المشدود إلى حزام الغواص، فإذا أشار إليه سحبه إلى السطح.
