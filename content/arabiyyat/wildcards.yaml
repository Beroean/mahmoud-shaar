- id: w0657
  kind: custom
  prompt: ماذا كان البغداديون يفعلون بأعشاش اللقالق على سطوحهم بعد رحيلها؟
  answer: يحافظون عليها كما هي حتى تعود في الموسم القادم
  others: [يهدمونها لينظّفوا السطح قبل أن تهطل أمطار الشتاء عليه, ينقلونها إلى أعلى منارة في المحلة, يأخذون أعوادها وقودًا للتنور]
  note: كانت اللقالق تترك أعشاشها «أمانة» عند أهل بغداد، وللصغار نداء لها «لگلگ لگلگ، امك تطلّك».
  source: hijiyya
  page: 167
  status: draft

- id: w0658
