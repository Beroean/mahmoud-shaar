  prompt: كيف تصطاد «الحَظْرة» السمك على ساحل الكويت؟
  answer: يدخلها السمك مع المدّ ويُحبس فيها عند الجزر
  others: [يلقيها الصياد في البحر ثم يجرّها بالقارب نحو الشاطئ, يوضع فيها طُعم ثم تُرفع من القاع بالحبل, تُعلّق خلف السفينة فيعلق بها السمك]
  note: الحظرة عيدان من القصب أو أسلاك حديد تُنصب في ضحضاح البحر، ولأصحاب الحظور مواقع يملكونها بوثائق رسمية.
