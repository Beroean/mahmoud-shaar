  prompt: كان الحبّار في دمشق يبيع حبرًا يسمى «الكوبيا»، فمن أين كان يأتي؟
  answer: من أوروبا في حقق خزفية صغيرة
  others: [من حلب في قوارير زجاجية, من مصر في أكياس من الجلد, من الهند في صناديق خشبية]
  note: كان حبرًا بنفسجيًا مائلًا إلى الحمرة، يستعمله التجار للكتابة وطبع المكاتيب.
  source: qasimi
  page: 89
  volume: ج١
  status: draft

- id: w0742
  kind: riddle
  prompt: أفهم كانك فهام وتبع حروف الشريعة، ثمّ شيء فيك معلوم وإنت بنفسك تطيعه
  answer: اسمك
  others: [ظلّك, صوتك, عمرك]
  note: الاسم شيء فيك يعرفه الناس، وتلتفت وتجيب كلما نودي به.
  source: bensalah_souf
  page: 9
  status: draft

- id: w0743
  kind: origin
  prompt: الشّنتوف
  hint: الخصلة الشعثاء من الشعر
  answer: الأمازيغية
  others: [اللاتينية, الإيطالية, الفارسية]
  note: من الأمازيغية «أشنتوف»، و«بوشنتوف» هو المشعّث الشعر.
  source: chafik
  page: 134
  status: draft

- id: w0744
  kind: custom
  prompt: ما «البُطل» عند بائع النفط المتجول في بغداد قديمًا؟
  answer: القنينة التي هي وحدة البيع عنده
  others: [الحنفية التي يخرج منها النفط, المضخّة التي يحرّكها بيده, العربة التي يدفعها أمامه]
  note: كان «أبو النفط» ينادي «نفط أبيض نفط» ويضخّ النفط من التنكة بآلة صفيح تُصدر صريرًا مزعجًا، لأن الإنارة كلها كانت بالنفط.
  source: hijiyya
  page: 122
  status: draft

- id: w0745
  kind: origin
  prompt: سمكري
  hint: حداد الصاج
  answer: الفارسية
  others: [الإيطالية, اليونانية, الفرنسية]
  note: تحريف للفارسية «سيمگر»، من «سيم» أي الفضة و«گر» لاحقة تدل على الصنعة.
  source: alloub
  page: 134
  status: draft

- id: w0746
  kind: riddle
  prompt: أسود كالليل وما هو ليل، ياكل الشعير وما هو بعير، ويثقب الجدار وما هو فأر
  answer: النمل
  others: [الغراب, الخنفساء, الجراد]
  note: النمل أسود، يحمل حبات الشعير، ويحفر بيوته في الجدران.
  source: khadousi
  page: 143
  status: draft

- id: w0747
  kind: custom
  prompt: ماذا كان يقول أهل الموصل للمرأة قليلة الحركة تعييرًا لها؟
  answer: كأنك عروس مدوّخة
  others: [كأنك جرّة في زاوية, كأنك نخلة بلا ريح, كأنك قطة في الشتاء]
  note: «الدواخ» طاقة حرير توضع على رأس العروس، وكانت توصى أن تجلس تحته منتصبة لا تتحرك ولا تلتفت.
  source: hamoudi
  page: 66
  status: draft

- id: w0748
  kind: origin
  prompt: التُّفَكَّة
  hint: البندقية
  answer: التركية
  others: [الإنجليزية, البرتغالية, اليونانية]
  note: من التركية «تفنك»، ومن أمثالهم «التفكة العمية لها رمية» في النهي عن الاستخفاف بالشيء التافه.
  source: hanafi
  page: 63
  status: draft

- id: w0749
  kind: root
  prompt: سَبَّعَت الإناء
  hint: غسلته غسلًا جيدًا
  answer: سَبْع
  others: [سَبَغ, سَبَح, شَبِع]
  note: كأن أصلها الغسلة السابعة، أو غسل الإناء سبع مرات، والفصحى تقول سبّع الإناء إذا غسله سبعًا.
  source: abboudi
  page: 204
  volume: ج٦
  status: draft

- id: w0750
  kind: origin
  prompt: تَدّان
  hint: نصيب الفرد من محصول الساقية
  answer: النوبية
  others: [البجاوية, التركية, الفارسية]
  note: من ألفاظ الساقية، وهي نوبية الأصل.
  source: qasim
  page: 156
  status: draft

- id: w0751
  kind: custom
  prompt: ماذا كان أهل دمشق يسمّون الطبّاخ في اصطلاحهم؟
  answer: العشّي
  others: [المطبخجي, القِدْري, الطناجري]
  note: يحيل الكتاب في حرفة الطبّاخ إلى حرفة «العشّي»، وهو الذي يطبخ في الأسواق أو في اللوكندات وبيوت الكبار.
  source: qasimi
  page: 286
  volume: ج٢
  status: draft

- id: w0752
  kind: riddle
  prompt: أحلى من السكر وأثقل من القنطار، لا يتباع في السوق ولا يجيبوه تجّار
  answer: النوم
  others: [العسل, الذهب, الملح]
  note: النوم ألذّ من الحلوى ويُثقل الأجفان، ولا يُشترى بمال.
  source: bensalah_souf
  page: 10
  status: draft

- id: w0753
  kind: origin
  prompt: روّن
  hint: خلط وأحدث الفوضى والاضطراب
  answer: الأمازيغية
  others: [الإسبانية, التركية, البرتغالية]
  note: من الأمازيغية «ئروي» بمعنى لتّ وخلط، ومنه «الروينة» أي الفوضى و«روّان» لمن يثير البلبلة.
  source: chafik
  page: 108
  status: draft

- id: w0754
  kind: custom
  prompt: مِمّ كان البغداديون يقطّرون «ماء القدّاح»؟
  answer: من زهر الرارنج
  others: [من ورد الجوري, من زهر الياسمين, من أوراق النعناع]
  note: كانوا يشترون في الربيع ورد الجوري لماء الورد وزهر الرارنج لماء القدّاح، ويقطّرونهما في قدر محكم السدّ موصول بقصبة إلى إناء خزفي.
  source: hijiyya
  page: 78
  status: draft

- id: w0755
  kind: origin
  prompt: إختيار
  hint: شيخ عجوز
  answer: التركية
  others: [الإيطالية, اليونانية, المغولية]
  note: من التركية ihtiyar أي الشيخ العجوز.
  source: alloub
  page: 25
  status: draft

- id: w0756
  kind: root
  prompt: الدِّثْرة
  hint: ما يظهر على الإنسان من لباس وفراش (فلان دثرته زينة)
  answer: الدِّثار
  others: [الشِّعار, الإيثار, التَّدْبير]
  note: الدثار في الفصحى ما يُلبس فوق الشعار من الثياب، فصارت «الدثرة» عنوانًا على حال الرجل.
  source: abboudi
  page: 333
  volume: ج٤
  status: draft

- id: w0757
  kind: riddle
  prompt: للّو في حفيرة
  answer: النار في الكانون
  others: [الماء في البئر, البذرة في الأرض, الكنز في المغارة]
  note: '«اللّو» الجوهرة المضيئة: الجمرة في حفرة الكانون.'
  source: khadousi
  page: 107
  status: draft

- id: w0758
  kind: custom
  prompt: حين كان أهل الخاطب في الموصل يهدون سلة من الخسّ إلى أهل العروس، ماذا كانوا يضعون في مؤخّر كل رأس خس؟
  answer: وردة من الورد البلدي
  others: [قطعة من حلاوة السكر, حبة من الجوز المقشور, عود من القرفة]
  note: كانت السلة تُرسل ومعها باقة كبيرة من هذا الورد الطيب الرائحة.
  source: hamoudi
  page: 62
  status: draft

- id: w0759
  kind: origin
  prompt: أسْكَلَة
  hint: رصيف الميناء
  answer: الفرنسية
  others: [الإنجليزية, الهندية, الفارسية]
  note: يردّها المؤلف إلى الفرنسية escale، ويقول إنها وصلت إلى لهجات العرب عن طريق التركية.
  source: hanafi
  page: 20
  status: draft

- id: w0760
  kind: custom
  prompt: في دمشق قديمًا، ما كان يصنعه «الصاغجي»؟
  answer: جلود الدربكّة والدفّ والطبل
  others: [الحليّ والأساور من الفضّة, أغماد السيوف والخناجر من الجلد, السروج المطرّزة للخيل]
  note: كانت جلوده من جلود الخيل والمعز، يزيل شعرها وينقعها حتى تلين، ثم يركّبها على أصول الآلات ويعرضها للشمس حتى تجف.
  source: qasimi
  page: 265
  volume: ج٢
  status: draft

- id: w0761
  kind: origin
  prompt: البُعْبُع
  hint: كائن خرافي يُخوَّف به الأطفال
  answer: القبطية
  others: [النوبية, التركية, الفارسية]
  note: من القبطية «بوبو»، وهو اسم عفريت مصري قديم.
  source: qasim
  page: 115
  status: draft

- id: w0762
  kind: riddle
  prompt: الحي جاب الميت، والميت جاب الحي
  answer: الدجاجة والبيضة
  others: [النخلة والنواة, البذرة والسنبلة, الغيمة والمطر]
  note: الدجاجة الحية تبيض بيضة لا حياة ظاهرة فيها، ومن البيضة يخرج فرخ حي.
  source: bensalah_souf
  page: 14
  status: draft

- id: w0763
  kind: custom
  prompt: من «أم الشاميّة» في أزقّة بغداد القديمة؟
  answer: عجوز تبيع الذرة المقلية «أذرة الشام»
  others: [امرأة تبيع الأقمشة الشامية للنساء, امرأة تبيع الحلاوة الشامية في رمضان, امرأة تبيع ماء الورد الشامي]
  note: تحمل الذرة في زنبيل كبير وتغرف منه بنصف قشرة جوزة هند، وتنادي «شاميّه، أذرة الشام».
  source: hijiyya
  page: 128
  status: draft

- id: w0764
  kind: origin
  prompt: الگوربي
  hint: الكوخ جدرانه من طين
  answer: الأمازيغية
  others: [البرتغالية, اللاتينية, الإيطالية]
  note: من الأمازيغية «أگوربي» وجمعها «ئگوربيين».
  source: chafik
  page: 153
  status: draft

- id: w0765
  kind: root
  prompt: الزِّرَيْقي
  hint: ذباب شديد العض يقلق الإنسان والحيوان
  answer: الأَزْرَق
  others: [الزَّرِيبة, الزُّرّاع, الرَّزِيق]
  note: هو تصغير «أزرق» لأنه ذباب أزرق اللون، وذكر أبو حنيفة الدينوري «الذباب الأزرق» المؤذي للإبل.
  source: abboudi
  page: 61
  volume: ج٦
  status: draft

- id: w0766
  kind: riddle
  prompt: طائر يطير في السماء بلا غناء، وينزل دمعه على الأرجاء
  answer: السحاب
  others: [النسر, الطائرة, القمر]
  note: السحاب يسير في السماء صامتاً، ودمعه هو المطر.
  source: khadousi
  page: 39
  status: draft

- id: w0767
  kind: origin
  prompt: أفرنجي
  hint: أوروبي
  answer: الفارسية
  others: [الإيطالية, اليونانية, الإسبانية]
  note: من الفارسية «فرنگي» نسبةً إلى «فرنگ» أي بلاد أوروبا.
  source: alloub
  page: 31
  status: draft

- id: w0768
  kind: custom
  prompt: في «حنّة الثبات» بالكاظمية، ماذا كانت العروس تفعل بالحنّاء صباحًا؟
  answer: ترميها إلى سقف الغرفة
  others: [تخضب بها عتبة الدار, تخلطها بماء النهر, تقسمها على جاراتها]
  note: كانوا يعتقدون أن الحنة إذا لصقت بالسقف ثبتت العروس في بيت الزوجية، وكانت أمها قد خضبت كفيها في الليلة السابقة.
  source: hamoudi
  page: 165
  status: draft

- id: w0769
  kind: origin
  prompt: التَّنْگ
  hint: الربو، من أمراض الصدر
  answer: الفارسية
  others: [التركية, الإنجليزية, البرتغالية]
  note: من الفارسية بمعنى الضيق، لأن المريض يضيق نفَسه.
  source: hanafi
  page: 65
  status: draft

- id: w0770
  kind: custom
  prompt: في قافلة الحج الشامي، ما كان عمل «المهتار»؟
  answer: ينصب خيام الحجاج ويفكّها في كل مرحلة
  others: [يقود الجمال ويسقيها في الطريق, يطبخ الطعام للحجاج في المنازل, يحرس القافلة من اللصوص ليلًا]
  note: كان يستخدمه المقوّم بأجرة معلومة، فيسبق الركب في كل مرحلة لينصب الخيام ويهيئها للحجاج ذهابًا وإيابًا.
  source: qasimi
  page: 474
  volume: ج٢
  status: draft

- id: w0771
  kind: riddle
  prompt: عبد الصمد قال كلمات إصنتوا يا حزوني، بعيني شفت الماء في مغدر الدم، وكان كذبت إحرقوني
  answer: القربة
  others: [البئر, البطيخة, الجرّة]
  note: القربة جلد حيوان كان يجري فيه الدم، ثم صار وعاءً يُحمل فيه الماء.
  source: bensalah_souf
  page: 19
  status: draft

- id: w0772
  kind: origin
  prompt: هَفْرِيب
  hint: الوَدَك والدهن النيء
  answer: البجاوية
  others: [النوبية, التركية, الفارسية]
  note: يرمز لها القاموس بأنها من لغة البجا.
  source: qasim
  page: 1189
  status: draft

- id: w0773
  kind: custom
  prompt: في رهان «عظم صدر الدجاجة» عند البغداديين، ماذا يجب على من يتسلّم شيئًا من صاحبه أن يقول؟
  answer: «عله بالي»
  others: [«ياداست», «عوافي», «بالخير»]
  note: يكسر المتراهنان عظم صدر الدجاجة بينهما، ثم من نسي أن يقول «عله بالي» عند استلام شيء، يقول له صاحبه «ياداست» ويربح الرهان.
  source: hijiyya
  page: 163
  status: draft

- id: w0774
  kind: root
  prompt: بَلْبَط
  hint: ألقى بجسمه في المكان وتمدّد مطمئنًا، كالضيف الثقيل الذي لا ينوي القيام
  answer: التَّلَبُّط
  others: [البَلاط, التَّخَبُّط, التَّبَسُّط]
  note: في الحديث أن الشهداء «يتلبّطون» في الغرف العلى من الجنة أي يتمرغون، واللبط التقلب في الرياض.
  source: abboudi
  page: 250
  volume: ج١
  status: draft

- id: w0775
  kind: riddle
  prompt: قاض له كف وليس له لسان
  answer: الميزان
  others: [الكتاب, الدفتر, القلم]
  note: للميزان كفتان، ويحكم بين الناس بالعدل دون أن يتكلم.
  source: khadousi
  page: 77
  status: draft

- id: w0776
  kind: origin
  prompt: الهركوس
  hint: الحذاء الخشن الثقيل أو البالي
  answer: الأمازيغية
  others: [الفارسية, اليونانية, الفرنسية]
  note: من الأمازيغية «أهركوس» وجمعها «ئهركوسن».
  source: chafik
  page: 171
  status: draft

- id: w0777
  kind: custom
  prompt: ما «الخروف المسلسل» في حكايات الكويت القديمة؟
  answer: خروف مقيّد بالسلاسل يأكل الأطفال غير المطيعين
  others: [خروف يُذبح في العيد ويُطاف به في الأحياء, خروف يُربط عند باب البيت الجديد للبركة سبعة أيام, خروف يُهدى للعريس ليلة زفافه من أهله]
  note: كان الكبار يخوّفون به الأطفال الذين لا يلتزمون القواعد ولا يطيعون أهلهم.
  source: hanafi
  page: 113
  status: draft

- id: w0778
  kind: origin
  prompt: أفسايد
  hint: التسلل في كرة القدم
  answer: الإنجليزية
  others: [الفرنسية, الإيطالية, الفارسية]
  note: من التركيب الإنجليزي off-side.
  source: alloub
  page: 31
  status: draft

- id: w0779
  kind: custom
  prompt: ما «الحكّاكي» الذي كان من لوازم حمّام العروس في الموصل؟
  answer: حجر بركاني تحكّ به المرأة قدميها
  others: [مشط عاجي لتسريح الشعر المبلول, كيس من الصوف الخشن لفرك الظهر, طاسة نحاسية لصبّ الماء الحار]
  note: كانت لوازم الحمام في الجهاز كثيرة، منها الكيس والقبقاب والفوطة، وقد يزيَّن بعضها بقطع ذهبية.
  source: hamoudi
  page: 72
  status: draft

- id: w0780
  kind: origin
  prompt: شِفْتة
  hint: لصوص العصابات
  answer: الحبشية
  others: [النوبية, التركية, البجاوية]
  note: يرمز لها القاموس بأنها حبشية.
  source: qasim
  page: 617
  status: draft
