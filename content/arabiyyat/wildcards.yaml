  answer: الفارسية
  others: [الهندية, التركية, الإنجليزية]
  note: من الفارسية بمعنى «خشب صيني»، وكان على المريض أن يتجنّب الطعام الدسم والمالح طوال مدة العلاج.
  source: hanafi
