- id: w0624
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «حكّاك الخواتم»؟
  answer: يحفر الأختام والفصوص بالخط الجميل
  others: [يصقل الخواتم القديمة ويلمّعها, يوسّع الخواتم الضيقة ويضيّقها, يشتري الخواتم المستعملة ويبيعها]
  note: كان يحفر الختم المصبوب من النحاس الأصفر أو الفضة ويحفر الفصوص أيضًا، وأكثرهم يجلسون أمام باب السرايا، ويأخذ المتقنون منهم أجرهم على كل حرف.
  source: qasimi
  page: 101
  volume: ج١
  status: draft

- id: w0625
  kind: root
  prompt: العَيْرَه
