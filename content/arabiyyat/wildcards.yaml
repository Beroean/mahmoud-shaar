  page: 22
  status: draft

- id: w0666
  kind: custom
  prompt: ما «بقلاوة الفگر» التي يأكلها الفقير والغني في بغداد؟
  answer: ثريد خبز مقلي بالدهن عليه قليل من الدبس
  others: [بقلاوة صغيرة رخيصة محشوّة بالتمر بدل الجوز والفستق, رقائق عجين مخبوزة بلا جوز, حلاوة طحين تُطبخ بالسكر]
  note: يذكر المؤلف أن الشيخ جلال الحنفي سمّاها «عرب بقلاوه سي» أي بقلاوة العرب بالتركية.
  source: hijiyya
  page: 82
  status: draft

- id: w0667
