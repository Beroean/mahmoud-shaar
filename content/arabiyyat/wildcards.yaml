  answer: شطية
  others: [جزرة, حويجة, بستنة]
  note: وتسمى عملية تسميدها «التقرير»، إذ تُحفر حول الشتلات حفر عميقة تملأ بالسماد، ويستمر العمل من العصر حتى الصباح.
  source: hamoudi
  page: 147
