  source: alloub
  page: 199
  status: draft

- id: w0621
  kind: custom
  prompt: لماذا كانت تكريت تخلو من المطاعم والفنادق، كما يذكر الكاتب؟
  answer: لأن الزائر يجد طعامه ومأواه في الدواوين
  others: [لأن البلدة كانت بعيدة عن طرق القوافل, لأن أهلها يرون بيع الطعام في السوق عيبًا لا يليق بهم, لأن الحكومة منعت بناءها داخل البلدة]
  note: من تقاليدهم الباقية توفير الطعام والمأوى لكل قاصد أو عابر سبيل، له ولدابته.
  source: hamoudi
  page: 147
  status: draft

- id: w0622
