  answer: الشّاه
  others: [الشّاة, الشَّهْد, الشَّهْباء]
  note: معناه «ملكة»، من «الشاه» أي الملك، وقد قالوا في شعرهم «شاه العرب والعجم».
  source: abboudi
  page: 31
  volume: ج٧
  status: draft

- id: w0696
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يبيع «الحواصلي»؟
  answer: الأخشاب التي يحتاجها النجّار
  others: [حواصل الطيور المحشوّة بالأرز, أكياس الحبوب ومؤونة الشتاء, الجرار والأواني الفخارية]
  note: المحل الذي تباع فيه هذه الأخشاب يسمى «الحاصل»، وفيه موضع لنشر الجذوع ألواحًا وأعمدة.
