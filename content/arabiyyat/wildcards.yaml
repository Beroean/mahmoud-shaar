  answer: يدفع له الآخر رهانًا اتُّفق عليه
  others: [يختار اسم مولودهما الأول, يُعفى من أعمال البيت أسبوعًا, يجلس في صدر المجلس يوم الصبحية]
  note: وفي أغلب الأحيان يترك العريس عروسه تحلّ الستارة لتربح الرهان، مجاملةً لها.
