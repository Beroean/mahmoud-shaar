  status: draft

- id: w0663
  kind: custom
  prompt: في دمشق قديمًا، ماذا كان يفعل «الثعباني»؟
  answer: يجمع الحيّات ويلعب بها أمام الناس
  others: [يبيع جلود الحيّات للدبّاغين, يداوي لدغ الحيّات بالأعشاب, يصنع الأحزمة من جلد الحيّات]
  note: كان يقلع أضراسها ويضعها في كيس من الجنفيص ويطوف بها في القرى والأزقة، وكان الناس يستدعونه إذا ظهرت حية في بيت كبير.
  source: qasimi
  page: 224
  volume: ج٢
  status: draft

- id: w0664
