- id: w0356
  kind: custom
  prompt: في دمشق قديمًا، ما كان عمل «الدقّاق»؟
  answer: يدقّ أثواب الحرير بمدقّة خشبية فتلمع
  others: [يدقّ البنّ في الهاون للمقاهي, يدقّ اللحم بالمدقّة لصنع الكبّة, يدقّ الأوتاد الحديدية لنصب الخيام]
  note: كان يبخّ الثوب بالماء من فمه ثم يطويه ويدقه بآلة ثقيلة تسمى «المدقّة»، فيحسن لونه ويظهر تموّجه وبريقه.
  source: qasimi
  page: 144
  volume: ج١
  status: draft

