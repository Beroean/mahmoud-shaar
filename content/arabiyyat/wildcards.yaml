  answer: والد العروس وشقيقها
  others: [والد العريس وعمه, القاضي ومختار المحلة, أم العريس وأخواته]
  note: كان والد العريس والعريس هما من يستقبلان الحضور، وتوزع عليهم الشرابت ثم المناديل المملوءة بالحلوى.
  source: hamoudi
  page: 157
  status: draft

- id: w0661
  kind: origin
