  answer: القبطية
  others: [التركية, النوبية, الإيطالية]
  note: يذكر القاموس أنها كلمة قديمة «قبطية فرعونية» معناها أن يترك المرء غيره لا يملك شيئًا.
  source: qasim
  page: 1020
