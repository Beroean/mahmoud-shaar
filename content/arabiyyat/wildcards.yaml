- id: w0673
  kind: custom
  prompt: لماذا أُزيل سوق «الدقّاقين» في رأس البزورية بدمشق؟
  answer: لأن الجيران قالوا إن الدقّ يضرّ بالبنيان
  others: [لأن حريقًا كبيرًا أتى على دكاكينه, لأن البلدية وسّعت مكانه سوق الحميدية, لأن الحرفة بطلت بقدوم الآلات الأوروبية]
  note: ضجر الجيران من كثرة الدق، فزعم بعض رؤساء البنّائين أنه يضر بالجدران، فأزيل السوق وصار مكانه قهوة وتفرّق الدقاقون في الخانات.
  source: qasimi
  page: 144
  volume: ج١
  status: draft

