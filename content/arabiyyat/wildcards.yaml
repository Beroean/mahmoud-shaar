  others: [لأن البحر فاض فيها على البيوت, لأن الأمطار ملأت فيها الآبار, لأن الجراد أكل فيها الزرع]
  note: الطفحة مجاوزة الحدّ، فسمّوا تلك السنة بها لوفرة ما جناه الغواصون فيها.
