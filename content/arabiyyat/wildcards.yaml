  source: qasim
  page: 1009
  status: draft

- id: w0317
  kind: custom
  prompt: بائع أي فاكهة كان ينادي في أزقّة بغداد «أبيض يا عجمي»؟
  answer: التفاح الأبيض
  others: [العنب الأبيض, الخيار, الرمان]
  note: ومن ندائه أيضًا «هبّ الهوه ورماك، لو ما الهوه ما چان جبناك»، وكانت بساتين بغداد تجود بالتفاح الأبيض.
  source: hijiyya
  page: 130
  status: draft

- id: w0318
