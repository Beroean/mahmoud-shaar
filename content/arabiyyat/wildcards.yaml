  others: [لحجب النساء عن أعين الضيوف, لحماية الأثاث من الغبار, لتعليق ملابس الشتاء عليه]
  note: الليوان غرفة واجهتها مفتوحة على فناء الدار تجتمع فيها العائلة، ويسمّى الچادر أيضًا «طرار»، وفيه باب صغير للدخول والخروج.
