  answer: يدور به على دابّته في خوابٍ من جلد
  others: [يبيعه في دكان ملاصق للمعصرة, يعرضه في جرار فخار في سوق البزورية, يرسله مع الحمّالين إلى البيوت بالقنطار]
  note: كان يشتري الزيت من تجّاره الذين يدّخرونه في آبار مخصوصة، ثم يدور على زبائنه من البقالين وأهل البيوت.
