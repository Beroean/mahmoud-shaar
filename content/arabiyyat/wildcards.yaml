  answer: السَّمِيّ
  others: [الوَسيم, النَّسيم, الأَسير]
  note: هو «السَّمِيّ» في الفصحى، ويقولون عند ذكر صاحب عاهة في المجلس «الاسم سالم»، دفعًا عن سميّه.
  source: qasim
  page: 48
  status: draft

- id: w0364
