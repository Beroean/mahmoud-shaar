  others: [سقي الطلاب من حِبّ الماء, نسخ سورة كاملة على لوحه, حراسة أحذية الطلاب عند باب الكتّاب حتى نهاية الدرس]
  note: كانت مروحة بدائية من الخشب والجنفاص تُحرَّك بسحب حبل، ولها صرير يصمّ الآذان يخففونه بوضع الشحم بين أجزائها.
