  others: [يصنع الأجراس النحاسية للدواب, يثقب اللؤلؤ والخرز لنظم العقود, يسدّ شقوق الجرار بالقار]
  note: كان يثقب طرفي الكسر بمثقب رفيع ويدخل فيهما مسمارًا من نحاس أصفر بعد لحمهما بالجص، وله على كل مسمار عشر بارات.
