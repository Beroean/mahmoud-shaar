name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild so the WDI explorer picks up new World Bank data (Mondays 06:00 UTC).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run puzzle:check -- --quiet
      - run: npm test
      # WDI explorer data: built from the World Bank bulk zip (282 MB). The zip is cached and only
      # re-downloaded when the World Bank publishes a new one (keyed on its Last-Modified header).
      - name: WDI source version
        id: wdi
        if: github.event_name != 'pull_request'
        run: |
          modified=$(curl -sIL --max-time 60 https://databank.worldbank.org/data/download/WDI_CSV.zip | tr -d '\r' | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -cd '[:alnum:]')
          echo "key=wdi-${modified:-unknown-$(date +%Y%W)}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: github.event_name != 'pull_request'
        with:
          path: .cache/wdi
          key: ${{ steps.wdi.outputs.key }}
      - name: Build WDI data
        if: github.event_name != 'pull_request'
        run: npm run wdi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
